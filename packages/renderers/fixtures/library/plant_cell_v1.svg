<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300">
  <title>A plant cell (schematic test fixture)</title>
  <g data-part="cell_wall">
    <rect x="20" y="20" width="130" height="250" rx="4" fill="var(--color-panel)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <line x1="158" y1="26" x2="150" y2="30" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="160" y="30" font-size="12" fill="var(--color-ink)" data-label-for="cell_wall">cell wall</text>
  </g>
  <g data-part="cell_membrane">
    <rect x="27" y="27" width="116" height="236" rx="3" fill="var(--color-paper)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <line x1="158" y1="56" x2="143" y2="60" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="160" y="60" font-size="12" fill="var(--color-ink)" data-label-for="cell_membrane">cell membrane</text>
  </g>
  <g data-part="cytoplasm">
    <circle cx="44" cy="220" r="2" fill="var(--color-muted)"/>
    <circle cx="96" cy="236" r="2" fill="var(--color-muted)"/>
    <circle cx="128" cy="214" r="2" fill="var(--color-muted)"/>
    <circle cx="70" cy="40" r="2" fill="var(--color-muted)"/>
    <line x1="158" y1="210" x2="130" y2="214" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="160" y="214" font-size="12" fill="var(--color-ink)" data-label-for="cytoplasm">cytoplasm</text>
  </g>
  <g data-part="vacuole">
    <rect x="52" y="52" width="68" height="146" rx="12" fill="var(--color-canvas)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <line x1="158" y1="126" x2="120" y2="130" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="160" y="130" font-size="12" fill="var(--color-ink)" data-label-for="vacuole">vacuole</text>
  </g>
  <g data-part="chloroplast">
    <ellipse cx="38" cy="80" rx="7" ry="4" fill="var(--color-series-2)" fill-opacity="0.5" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <ellipse cx="38" cy="160" rx="7" ry="4" fill="var(--color-series-2)" fill-opacity="0.5" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <ellipse cx="132" cy="96" rx="7" ry="4" fill="var(--color-series-2)" fill-opacity="0.5" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <ellipse cx="132" cy="176" rx="7" ry="4" fill="var(--color-series-2)" fill-opacity="0.5" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <ellipse cx="86" cy="40" rx="7" ry="4" fill="var(--color-series-2)" fill-opacity="0.5" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <line x1="158" y1="92" x2="139" y2="96" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="160" y="96" font-size="12" fill="var(--color-ink)" data-label-for="chloroplast">chloroplast</text>
  </g>
  <g data-part="nucleus">
    <circle cx="70" cy="234" r="14" fill="var(--color-line-strong)" fill-opacity="0.35" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <line x1="158" y1="246" x2="84" y2="238" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="160" y="250" font-size="12" fill="var(--color-ink)" data-label-for="nucleus">nucleus</text>
  </g>
</svg>
