<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <title>The human heart (schematic test fixture)</title>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--color-diagram-stroke)"/>
    </marker>
  </defs>
  <g data-part="vena_cava">
    <rect x="135" y="30" width="28" height="70" fill="var(--color-panel)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="40" y="50" font-size="13" fill="var(--color-ink)" data-label-for="vena_cava">vena cava</text>
  </g>
  <g data-part="pulmonary_artery">
    <rect x="200" y="20" width="20" height="160" fill="var(--color-panel)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="90" y="14" font-size="13" fill="var(--color-ink)" data-label-for="pulmonary_artery">pulmonary artery</text>
  </g>
  <g data-part="right_atrium">
    <rect x="110" y="100" width="85" height="75" rx="18" fill="var(--color-paper)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="14" y="140" font-size="13" fill="var(--color-ink)" data-label-for="right_atrium">right atrium</text>
  </g>
  <g data-part="right_ventricle">
    <polygon points="110,185 220,185 220,310 160,310" fill="var(--color-paper)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="40" y="345" font-size="13" fill="var(--color-ink)" data-label-for="right_ventricle">right ventricle</text>
  </g>
  <g data-part="septum">
    <rect x="228" y="100" width="24" height="230" fill="var(--color-panel)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="240" y="352" font-size="13" text-anchor="middle" fill="var(--color-ink)" data-label-for="septum">septum</text>
  </g>
  <g data-part="aorta">
    <rect x="258" y="10" width="22" height="170" fill="var(--color-panel)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="286" y="14" font-size="13" fill="var(--color-ink)" data-label-for="aorta">aorta</text>
  </g>
  <g data-part="pulmonary_vein">
    <rect x="335" y="40" width="28" height="60" fill="var(--color-panel)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="370" y="40" font-size="13" fill="var(--color-ink)" data-label-for="pulmonary_vein">pulmonary vein</text>
  </g>
  <g data-part="left_atrium">
    <rect x="285" y="100" width="85" height="75" rx="18" fill="var(--color-paper)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="378" y="140" font-size="13" fill="var(--color-ink)" data-label-for="left_atrium">left atrium</text>
  </g>
  <g data-part="left_ventricle">
    <polygon points="260,185 370,185 320,330 260,330" fill="var(--color-paper)" stroke="var(--color-diagram-stroke)" stroke-width="3"/>
    <text x="340" y="345" font-size="13" fill="var(--color-ink)" data-label-for="left_ventricle">left ventricle</text>
  </g>
  <g data-arrow="arrow_vena_cava">
    <line x1="149" y1="60" x2="149" y2="88" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
  <g data-arrow="arrow_ra_rv">
    <line x1="160" y1="160" x2="160" y2="205" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
  <g data-arrow="arrow_pulmonary_artery">
    <line x1="210" y1="170" x2="210" y2="40" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
  <g data-arrow="arrow_pulmonary_vein">
    <line x1="349" y1="60" x2="349" y2="110" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
  <g data-arrow="arrow_la_lv">
    <line x1="320" y1="160" x2="320" y2="205" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
  <g data-arrow="arrow_aorta">
    <line x1="269" y1="170" x2="269" y2="30" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
</svg>
