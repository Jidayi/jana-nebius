<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <title>Onion epidermis cells under a light microscope (schematic test fixture)</title>
  <circle cx="170" cy="150" r="135" fill="var(--color-paper)" stroke="var(--color-line-strong)" stroke-width="1.5" aria-hidden="true"/>
  <g data-part="cell_wall">
    <rect x="60" y="85" width="100" height="60" fill="none" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <rect x="160" y="85" width="100" height="60" fill="none" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <rect x="80" y="145" width="100" height="60" fill="none" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <rect x="180" y="145" width="100" height="60" fill="none" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <line x1="316" y1="66" x2="260" y2="88" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="320" y="70" font-size="12" fill="var(--color-ink)" data-label-for="cell_wall">cell wall</text>
  </g>
  <g data-part="cytoplasm">
    <rect x="64" y="89" width="92" height="52" fill="var(--color-panel)" stroke="var(--color-line)" stroke-width="1"/>
    <rect x="164" y="89" width="92" height="52" fill="var(--color-panel)" stroke="var(--color-line)" stroke-width="1"/>
    <rect x="84" y="149" width="92" height="52" fill="var(--color-panel)" stroke="var(--color-line)" stroke-width="1"/>
    <rect x="184" y="149" width="92" height="52" fill="var(--color-panel)" stroke="var(--color-line)" stroke-width="1"/>
    <line x1="316" y1="106" x2="256" y2="112" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="320" y="110" font-size="12" fill="var(--color-ink)" data-label-for="cytoplasm">cytoplasm</text>
  </g>
  <g data-part="vacuole">
    <rect x="70" y="95" width="70" height="40" rx="6" fill="var(--color-canvas)" stroke="var(--color-line)" stroke-width="1"/>
    <rect x="170" y="95" width="70" height="40" rx="6" fill="var(--color-canvas)" stroke="var(--color-line)" stroke-width="1"/>
    <rect x="90" y="155" width="70" height="40" rx="6" fill="var(--color-canvas)" stroke="var(--color-line)" stroke-width="1"/>
    <rect x="190" y="155" width="70" height="40" rx="6" fill="var(--color-canvas)" stroke="var(--color-line)" stroke-width="1"/>
    <line x1="316" y1="146" x2="240" y2="160" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="320" y="150" font-size="12" fill="var(--color-ink)" data-label-for="vacuole">vacuole</text>
  </g>
  <g data-part="nucleus">
    <circle cx="148" cy="125" r="6" fill="var(--color-line-strong)" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <circle cx="248" cy="125" r="6" fill="var(--color-line-strong)" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <circle cx="168" cy="185" r="6" fill="var(--color-line-strong)" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <circle cx="268" cy="185" r="6" fill="var(--color-line-strong)" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <line x1="316" y1="186" x2="274" y2="185" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="320" y="190" font-size="12" fill="var(--color-ink)" data-label-for="nucleus">nucleus</text>
  </g>
</svg>
