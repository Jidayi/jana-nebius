<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300">
  <title>An animal cell (schematic test fixture)</title>
  <g data-part="cell_membrane">
    <ellipse cx="80" cy="150" rx="64" ry="110" fill="var(--color-paper)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <line x1="158" y1="56" x2="128" y2="76" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="160" y="60" font-size="12" fill="var(--color-ink)" data-label-for="cell_membrane">cell membrane</text>
  </g>
  <g data-part="cytoplasm">
    <circle cx="60" cy="90" r="2" fill="var(--color-muted)"/>
    <circle cx="104" cy="104" r="2" fill="var(--color-muted)"/>
    <circle cx="56" cy="206" r="2" fill="var(--color-muted)"/>
    <circle cx="110" cy="214" r="2" fill="var(--color-muted)"/>
    <line x1="158" y1="210" x2="112" y2="214" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="160" y="214" font-size="12" fill="var(--color-ink)" data-label-for="cytoplasm">cytoplasm</text>
  </g>
  <g data-part="nucleus">
    <circle cx="80" cy="150" r="22" fill="var(--color-line-strong)" fill-opacity="0.35" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <line x1="158" y1="146" x2="102" y2="150" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="160" y="150" font-size="12" fill="var(--color-ink)" data-label-for="nucleus">nucleus</text>
  </g>
</svg>
