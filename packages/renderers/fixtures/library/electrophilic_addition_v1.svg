<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240">
  <title>Electrophilic addition of hydrogen bromide to ethene (test fixture)</title>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--color-diagram-stroke)"/>
    </marker>
  </defs>
  <g data-part="ethene">
    <text x="30" y="90" font-size="14" fill="var(--color-ink)">H2C</text>
    <line x1="62" y1="82" x2="96" y2="82" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <line x1="62" y1="88" x2="96" y2="88" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="100" y="90" font-size="14" fill="var(--color-ink)">CH2</text>
    <text x="40" y="60" font-size="12" fill="var(--color-ink)" data-label-for="ethene">ethene</text>
  </g>
  <g data-part="hydrogen_bromide">
    <text x="50" y="170" font-size="12" fill="var(--color-ink)">δ+</text>
    <text x="70" y="170" font-size="14" fill="var(--color-ink)">H</text>
    <line x1="82" y1="165" x2="116" y2="165" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="120" y="170" font-size="14" fill="var(--color-ink)">Br</text>
    <text x="140" y="170" font-size="12" fill="var(--color-ink)">δ−</text>
    <text x="40" y="215" font-size="12" fill="var(--color-ink)" data-label-for="hydrogen_bromide">hydrogen bromide</text>
  </g>
  <g data-part="carbocation">
    <text x="205" y="90" font-size="14" fill="var(--color-ink)">H3C</text>
    <line x1="232" y1="85" x2="258" y2="85" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="262" y="90" font-size="14" fill="var(--color-ink)">CH2</text>
    <text x="290" y="80" font-size="12" fill="var(--color-ink)">+</text>
    <text x="210" y="60" font-size="12" fill="var(--color-ink)" data-label-for="carbocation">carbocation</text>
  </g>
  <g data-part="bromide_ion">
    <circle cx="244" cy="150" r="1.5" fill="var(--color-diagram-stroke)"/>
    <circle cx="251" cy="150" r="1.5" fill="var(--color-diagram-stroke)"/>
    <text x="240" y="170" font-size="14" fill="var(--color-ink)">Br</text>
    <text x="258" y="160" font-size="12" fill="var(--color-ink)">−</text>
    <text x="215" y="215" font-size="12" fill="var(--color-ink)" data-label-for="bromide_ion">bromide ion</text>
  </g>
  <g data-part="bromoethane">
    <text x="350" y="135" font-size="14" fill="var(--color-ink)">CH3CH2Br</text>
    <text x="355" y="165" font-size="12" fill="var(--color-ink)" data-label-for="bromoethane">bromoethane</text>
  </g>
  <g aria-hidden="true">
    <line x1="165" y1="130" x2="195" y2="130" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
    <line x1="305" y1="130" x2="340" y2="130" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
  <g data-arrow="arrow_pi_to_h">
    <path d="M80,94 C82,120 76,135 75,152" fill="none" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
  <g data-arrow="arrow_bond_to_br">
    <path d="M99,168 C102,190 122,192 127,178" fill="none" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
  <g data-arrow="arrow_br_to_c">
    <path d="M247,146 C250,125 268,120 272,100" fill="none" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
</svg>
