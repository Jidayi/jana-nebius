# The do-not-capture filter for English notes (MEM-10, PRV-04, D71). Our draft wording: the Safety lead reviews it
# before release (status: draft). It runs on every candidate note for every profile, adults included, and again on
# every stored note when it is rendered (MEM-27). A match blocks the note; a blocked note is counted, never stored.
#
# Terms are case-insensitive whole words or phrases; a trailing * matches any word ending ("parent*" matches
# "parents" and "parental"). The allowlist names curriculum phrases that contain a listed word but are learning
# content; they are cleared before the lexicon runs. The classifier is a naive-Bayes model counted at load time from
# the labelled examples below, for paraphrases the lexicon misses.
