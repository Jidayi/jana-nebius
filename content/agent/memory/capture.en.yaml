# Labelled examples the classifier counts at load time (unigrams and bigrams of the normalised text). The benign class
# is learning notes; every other class is a category above.
examples:
  benign:
    - Confuses mass and weight in free-fall questions
    - Rounds intermediate values too early in multi-step calculations
    - Draws a labelled diagram before writing equations
    - Forgets to convert kilometres per hour to metres per second
    - Divides time by distance when finding speed
    - Gives units with every final answer
    - Rearranges linear equations correctly with one unknown
    - Mixes up distance and displacement in two-part journeys
    - Reads the gradient of a distance-time graph as the speed
    - Leaves out the half when finding the area of a triangle under a velocity-time graph
    - Chooses an equation of motion that uses all the given quantities
    - Sign errors when moving terms across the equals sign
    - Prefers a worked example before trying a similar question
    - Works well with diagrams for forces on an inclined plane
    - Needs a hint to start most kinematics questions
    - Solves simultaneous equations by elimination confidently
    - Expands double brackets but forgets the middle term
    - Factorises quadratics with a leading coefficient of one
    - Uses the quadratic formula but drops the negative root
    - Balances chemical equations by inspection
    - Confuses atomic number with mass number
    - Calculates moles from mass and molar mass correctly
    - Mixes up ionic and covalent bonding in explanations
    - Writes state symbols in balanced equations
    - Labels the parts of a plant cell accurately
    - Confuses mitosis with meiosis in exam questions
    - Explains osmosis in terms of water potential
    - Places debit and credit entries on the correct side
    - Confuses capital expenditure with revenue expenditure
    - Prepares a trial balance but omits suspense items
    - Records depreciation using the straight-line method
    - Mixes up the cash book and the petty cash book
    - Checks answers by substituting back into the equation
    - Skips the units step when converting grams to kilograms
    - Applies Ohm's law to series circuits accurately
    - Adds resistances in parallel as if they were in series
    - Treats acceleration as positive when an object slows down
    - Finds the gradient from two points on the line
    - Reads scales on measuring cylinders at the meniscus
    - Remembers that the speed at the top of a vertical throw is zero
    - Writes the formula before substituting numbers
    - Shows working clearly in multi-step questions
    - Struggles to choose between sine and cosine rules
    - Recognises right-angled triangles and uses Pythagoras
    - Calculates percentage change from the original value
    - Confuses the mean with the median in grouped data
    - Plots points accurately on a cartesian grid
    - Converts between standard form and ordinary numbers
    - Uses significant figures consistently in final answers
    - Confuses current and voltage in circuit diagrams
    - Identifies the independent variable in an experiment
    - Explains refraction using the change in wave speed
    - Applies the law of reflection to plane mirrors
    - Calculates kinetic energy but forgets to square the speed
    - Uses momentum conservation in collision questions
    - Describes the rate of reaction in terms of collisions
    - Confuses endothermic with exothermic reactions
    - Names the products of electrolysis of brine
    - Explains enzyme action with the lock and key model
    - Interprets food chains and energy transfer correctly
    - Confuses the income statement with the balance sheet
    - Calculates gross profit from sales and cost of sales
    - Answers multiple-choice questions quickly and accurately
    - Benefits from shorter practice sets with feedback after each item
    - Learns faster with simpler numbers before the real values
    - Asks for a hint before attempting the first step
    - Checks the question for the quantity it asks for
    - Handles negative numbers well in algebraic fractions
    - Finds the area under a velocity-time graph as the distance
