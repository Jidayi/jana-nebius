# Scenario tests of the soft rule catalogue (PED-16, PED-17): one situation per rule (signals, the student's
# message, scripted judged answers) and the rules expected active and inactive after matching. Synthetic.
scenarios:
- id: scn_wrong_step_ask_intent
  rule: wrong_step_ask_intent
  mode: guided
  subject: physics
  level: O
  signals:
    step.verdict: incorrect
    step.misconception_matched: false
  expect_active:
  - wrong_step_ask_intent
  expect_inactive:
  - misconception_name_gently
- id: scn_misconception_name_gently
  rule: misconception_name_gently
  mode: guided
  subject: physics
  level: O
  signals:
    step.verdict: incorrect
    step.misconception_matched: true
  expect_active:
  - misconception_name_gently
  expect_inactive:
  - wrong_step_ask_intent
- id: scn_revisit_misconception_check
  rule: revisit_misconception_check
