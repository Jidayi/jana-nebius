# The S2 soft rule catalogue (PED-16): condition -> action, in the format of the rule contract (PED-11).
# Actions are instructions to the Coach in our own words, never student-facing text. Thresholds are
# proposal values. Each rule names its scenario test in scenarios.yaml; a rule without a passing scenario
# blocks the agent bundle build (PED-17). Reviewed by the Learning designer; retired rules keep their ids.
schema_version: '1.0'
pack: core-pedagogy
rules:
- id: wrong_step_ask_intent
  version: '1.0'
  status: active
  condition:
    predicate:
      all:
      - signal: step.verdict
        op: eq
        value: incorrect
      - signal: step.misconception_matched
        op: eq
        value: false
  action: Before you correct anything, ask what the student meant to do in that line. Hold the fix back for now.
  priority_class: pedagogy
  priority: 50
  scope:
    modes:
    - guided
    - practice
    - check_working
  relationships: []
  criticality: normal
  frequency:
    once_per_step: true
  evidence:
  - E6
  tests:
  - scn_wrong_step_ask_intent
  owner: Learning designer
- id: misconception_name_gently
  version: '1.0'
  status: active
  condition:
    predicate:
      signal: step.misconception_matched
      op: eq
      value: true
  action: Say which misconception this looks like in plain words, with no blame, then ask the skill's targeted question.
  priority_class: pedagogy
  priority: 60
  scope:
    modes: &id001
    - guided
    - practice
    - check_working
    - revision
  relationships:
  - type: overrides
    target: wrong_step_ask_intent
  - type: entails
    target: revisit_misconception_check
  criticality: normal
  frequency:
    once_per_step: true
  evidence:
  - E14
  tests:
  - scn_misconception_name_gently
  owner: Learning designer
- id: revisit_misconception_check
  version: '1.0'
  status: active
  condition:
    predicate:
      all:
      - signal: kc.active_misconception
        op: eq
        value: true
      - signal: step.verdict
        op: eq
        value: correct
  action: Before moving on, ask one check question that would tell the misconception apart from the right idea.
  priority_class: pedagogy
  priority: 45
  scope:
    modes:
    - guided
    - practice
  relationships: []
  criticality: normal
  frequency:
    max_per_session: 3
    min_turns_between: 4
  evidence:
  - E14
  tests:
  - scn_revisit_misconception_check
  owner: Learning designer
- id: praise_method_not_person
  version: '1.0'
  status: active
  condition:
    predicate:
      signal: step.verdict
      op: eq
      value: correct
  action: In one short sentence, praise the exact move that worked. Never praise the student as a person.
  priority_class: style
  priority: 40
  scope:
    modes: &id002
    - guided
    - solution
    - check_working
    - learn
    - practice
    - revision
  relationships: []
  criticality: normal
  frequency: {}
  evidence:
  - soul
  tests:
  - scn_praise_method_not_person
  owner: Learning designer
- id: praise_persistence
  version: '1.0'
  status: active
  condition:
    predicate:
      all:
      - signal: step.verdict
        op: eq
        value: correct
      - signal: step.wrong_attempts
        op: ge
        value: 2
  action: Point out that they kept going, and name the change that made it work this time.
  priority_class: style
  priority: 42
  scope:
    modes: *id001
  relationships:
  - type: overrides
    target: praise_method_not_person
  criticality: normal
  frequency: {}
  evidence:
  - E3
  tests:
  - scn_praise_persistence
  owner: Learning designer
- id: hint_burst_ask_attempt
  version: '1.0'
  status: active
  condition:
    predicate:
      signal: hints.requests_last_10s
      op: ge
      value: 2
  action: Ask for an attempt before any more hints, with one line on how hints help most after trying.
