# Course definitions, English (PRM-09 tier 5: the notation glossary that overrides the model's own definitions).
# Each entry defines a term from the glossary of the pack knowledge components it names (`kcs`); `term` or one of its
# `aliases` is in those KCs' glossary. The engine pushes the entries of the KCs in play, and of any entry whose `cues`
# appear in the question, to the Coach (at most eight, the terms the question names first; tier 5 trims the rest
# before any pushed skill), and a reply that names a `wrong` phrase of an entry in play is sent back with
# the definition (a claim the course does not support, AGT-10). An entry with `cues` checks its `wrong` phrases only
# when a cue is in the question. Definitions are short, exam-board wording in our own words; models never edit this
# file.
version: "2026-10-23.1"
status: published
terms:
  # Accounting: inventory valuation
  - term: AVCO
    aliases: [weighted average cost]
    definition: "Weighted average cost (AVCO): after each purchase, the cost per unit is the total cost of the units
      held divided by the number of units held; issues are costed at that average until the next purchase."
    kcs: [kc.acc.o.inventory.avco, kc.acc.o.inventory.fifo, kc.acc.o.inventory.inventory_profit_effect]
    cues: [AVCO, weighted average]
    wrong: [average cost value, average value cost, average costing value, average cost valuation]
  - term: FIFO
    aliases: ["first in, first out"]
    definition: "First in, first out (FIFO): the oldest units are treated as issued first, so closing inventory is
      valued at the costs of the most recent purchases."
    kcs: [kc.acc.o.inventory.fifo, kc.acc.o.inventory.avco, kc.acc.o.inventory.inventory_profit_effect]
    cues: [FIFO, "first in, first out"]
    wrong: ["first in, last out", "last in, first out"]
  - term: net realisable value
    definition: "Net realisable value: the expected selling price less the costs of completing and selling the item.
      Inventory is valued at the lower of cost and net realisable value."
    kcs: [kc.acc.o.inventory.lower_cost_nrv]
  - term: cost of sales
    definition: "Cost of sales: opening inventory plus purchases less closing inventory."
    kcs: [kc.acc.o.inventory.inventory_profit_effect, kc.acc.o.inventory.fifo, kc.acc.o.inventory.avco]
  # Mathematics: combined events
  - term: independent event
    aliases: [independent]
    definition: "Independent events: one outcome does not change the probability of the other (two spins, or draws
      with replacement). P(A and B) = P(A) x P(B)."
    kcs: [kc.mth.o.probability.independent_events]
  - term: dependent event
    aliases: [dependent, without replacement]
    definition: "Dependent events: the first outcome changes the probability of the second. Drawing without
      replacement is dependent: after the first pick, both the count and the total drop by one."
    kcs: [kc.mth.o.probability.dependent_events]
    cues: [without replacement, not replaced, not put back, is not returned, are not returned]
    wrong: [independent]
  # Physics: electrical quantities
  - term: current
    definition: "Current: the rate of flow of charge, I = Q / t, measured in amperes (A)."
    kcs: [kc.phy.o.electrical_quantities.current_and_charge, kc.phy.o.electrical_quantities.resistance]
  - term: potential difference
    aliases: [voltage]
    definition: "Potential difference (p.d.): the energy transferred per unit charge between two points, V = W / Q,
      measured in volts (V)."
    kcs: [kc.phy.o.electrical_quantities.potential_difference, kc.phy.o.electrical_quantities.resistance]
  - term: electromotive force
    aliases: [e.m.f.]
    definition: "Electromotive force (e.m.f.): the energy a source transfers per unit charge in driving charge round a
      complete circuit, measured in volts (V)."
    kcs: [kc.phy.o.electrical_quantities.potential_difference]
  - term: resistance
    definition: "Resistance: the potential difference across a component divided by the current through it,
      R = V / I, measured in ohms."
    kcs: [kc.phy.o.electrical_quantities.resistance, kc.phy.o.electrical_quantities.current_voltage_graphs]
  # Accounting
  - term: accounting
    definition: "Accounting: recording, classifying and summarising a business's financial transactions and
      reporting the results so that users can make decisions."
    kcs: ["kc.acc.o.accounting_equation.purpose_and_users"]
  - term: accounting equation
    definition: "Accounting equation: assets = capital + liabilities. Every transaction changes at least two
      items, and the equation always stays in balance."
    kcs: ["kc.acc.o.accounting_equation.apply_equation", "kc.acc.o.accounting_equation.effect_of_transactions"]
  - term: asset
    definition: "Asset: a resource owned or controlled by the business that it expects to benefit from, such as
      premises, inventory, trade receivables and cash."
    kcs: ["kc.acc.o.accounting_equation.classify_elements", "kc.acc.o.accounting_equation.apply_equation"]
  - term: liability
    aliases: [liabilities]
    definition: "Liability: an amount the business owes to others, such as trade payables, a loan or a bank
      overdraft."
    kcs: ["kc.acc.o.accounting_equation.classify_elements", "kc.acc.o.accounting_equation.apply_equation"]
  - term: capital
    definition: "Capital: the owner's investment in the business, equal to assets less liabilities. It rises with
      capital introduced and profit and falls with drawings and losses."
    kcs: ["kc.acc.o.accounting_equation.apply_equation", "kc.acc.o.accounting_equation.classify_elements", "kc.acc.o.sole_trader_statements.closing_capital"]
  - term: transaction
    definition: "Transaction: a business event that can be measured in money and changes the business's financial
      position, such as buying goods or paying wages."
    kcs: ["kc.acc.o.accounting_equation.effect_of_transactions"]
  - term: premises
    definition: "Premises: the land and buildings a business owns and uses; a non-current asset."
    kcs: ["kc.acc.o.accounting_equation.classify_elements"]
  - term: income
    definition: "Income: amounts the business earns, such as revenue from sales, rent received or commission
      received; income increases profit."
    kcs: ["kc.acc.o.accounting_equation.classify_elements"]
  - term: expense
    definition: "Expense: a cost of running the business that is used up in the period, such as wages or rent; it
      is charged in the income statement and reduces profit."
    kcs: ["kc.acc.o.accounting_equation.classify_elements", "kc.acc.o.double_entry.debit_credit_rules", "kc.acc.o.sole_trader_statements.profit_for_year"]
  - term: commission
    definition: "Commission: a payment worked out as a percentage of sales or business arranged. Commission
      received is income; commission paid is an expense."
    kcs: ["kc.acc.o.accounting_equation.classify_elements"]
  - term: financial statements
    definition: "Financial statements: the income statement and the statement of financial position, prepared at
      the end of a period to report the business's results and position."
    kcs: ["kc.acc.o.accounting_equation.purpose_and_users"]
  - term: supplier
    definition: "Supplier: a business that sells goods or services to the business; as a user of the accounts it
      wants to know whether it will be paid on time."
    kcs: ["kc.acc.o.accounting_equation.purpose_and_users"]
  - term: lender
    definition: "Lender: a bank or other body that lends money to the business; it wants to know whether the loan
      and the interest can be repaid."
    kcs: ["kc.acc.o.accounting_equation.purpose_and_users"]
  - term: investor
    definition: "Investor: someone who has put, or may put, money into the business; they want to know about its
      profitability and the return on their money."
    kcs: ["kc.acc.o.accounting_equation.purpose_and_users"]
  - term: credit supplier
    definition: "Credit supplier: a supplier from whom goods are bought on credit; the amount owed to them is a
      trade payable, a liability."
    kcs: ["kc.acc.o.accounting_equation.effect_of_transactions"]
  - term: on credit
    definition: "On credit: bought or sold now and paid for later; the buyer records a trade payable and the
      seller records a trade receivable."
    kcs: ["kc.acc.o.accounting_equation.effect_of_transactions"]
  - term: accrual
    aliases: [accrued expense]
    definition: "Accrued expense (accrual): an expense that belongs to the year but is still unpaid at the year
      end; it is added to the expense and shown as a current liability (other payables)."
    kcs: ["kc.acc.o.accruals_prepayments.accrued_expense", "kc.acc.o.accruals_prepayments.accrual_presentation"]
  - term: income owing
    aliases: [accrued income]
    definition: "Income owing (accrued income): income earned in the year but not yet received at the year end; it
      is added to the income and shown as a current asset (other receivables)."
    kcs: ["kc.acc.o.accruals_prepayments.income_adjustments", "kc.acc.o.accruals_prepayments.accrual_presentation"]
  - term: prepayment
    aliases: [prepaid expense, prepaid]
    definition: "Prepayment (prepaid expense): an amount paid this year for an expense that belongs to next year;
      it is deducted from the expense and shown as a current asset (other receivables)."
    kcs: ["kc.acc.o.accruals_prepayments.prepaid_expense", "kc.acc.o.accruals_prepayments.accrual_presentation"]
  - term: income received in advance
    definition: "Income received in advance: income received this year that belongs to next year; it is deducted
      from this year's income and shown as a current liability (other payables)."
    kcs: ["kc.acc.o.accruals_prepayments.income_adjustments", "kc.acc.o.accruals_prepayments.accrual_presentation"]
  - term: year-end adjustment
    aliases: [adjustment]
    definition: "Year-end adjustment: a change made at the year end so the income statement shows only the income
      and expenses that belong to the year, such as an accrual or a prepayment."
    kcs: ["kc.acc.o.accruals_prepayments.accrued_expense", "kc.acc.o.accruals_prepayments.prepaid_expense", "kc.acc.o.accruals_prepayments.income_adjustments"]
  - term: other payables
    definition: "Other payables: amounts owed at the year end other than to trade suppliers, such as accrued
      expenses and income received in advance; a current liability."
    kcs: ["kc.acc.o.accruals_prepayments.accrual_presentation"]
  - term: other receivables
    definition: "Other receivables: amounts due to the business at the year end other than from credit customers,
      such as prepaid expenses and income owing; a current asset."
    kcs: ["kc.acc.o.accruals_prepayments.accrual_presentation"]
  - term: accounting concept
    aliases: [accounting principle, principle]
    definition: "Accounting principle (concept): a basic rule followed when preparing accounts so that they are
      reliable and comparable, such as going concern, prudence, accruals and consistency."
    kcs: ["kc.acc.o.concepts.identify_concept", "kc.acc.o.concepts.apply_concept"]
  - term: accruals
    aliases: [matching]
    definition: "Accruals (matching) principle: income and expenses are recorded in the year they are earned or
      used up, not the year the cash is received or paid."
    kcs: ["kc.acc.o.concepts.identify_concept", "kc.acc.o.concepts.apply_concept"]
  - term: business entity
    definition: "Business entity principle: the business is treated as separate from its owner, so only business
      transactions are recorded; the owner's private use of business resources is drawings."
    kcs: ["kc.acc.o.concepts.identify_concept", "kc.acc.o.concepts.apply_concept"]
  - term: going concern
    definition: "Going concern principle: the business is assumed to continue trading for the foreseeable future,
      so assets are shown at cost less depreciation, not at what they would sell for now."
    kcs: ["kc.acc.o.concepts.identify_concept", "kc.acc.o.concepts.apply_concept"]
  - term: consistency
    definition: "Consistency principle: once a method is chosen, such as a depreciation or inventory valuation
      method, it is used every year so that results can be compared."
    kcs: ["kc.acc.o.concepts.identify_concept", "kc.acc.o.concepts.apply_concept"]
  - term: prudence
    definition: "Prudence principle: assets and profit must not be overstated, nor liabilities understated; a loss
      is recorded as soon as it is expected, a gain only when it is certain."
    kcs: ["kc.acc.o.concepts.identify_concept", "kc.acc.o.concepts.apply_concept"]
  - term: realisation
    definition: "Realisation principle: revenue is recognised when the goods or services pass to the customer, not
      when the cash is received."
    kcs: ["kc.acc.o.concepts.identify_concept", "kc.acc.o.concepts.apply_concept"]
  - term: materiality
    definition: "Materiality principle: an item too small to affect users' decisions need not follow the strict
      treatment; a cheap stapler is an expense, not a non-current asset."
    kcs: ["kc.acc.o.concepts.identify_concept", "kc.acc.o.concepts.apply_concept"]
  - term: money measurement
    definition: "Money measurement principle: only items that can be measured in money are recorded, so things
      like staff skill or morale do not appear in the accounts."
    kcs: ["kc.acc.o.concepts.identify_concept", "kc.acc.o.concepts.apply_concept"]
  - term: historic cost
    definition: "Historic cost principle: assets are recorded at what they originally cost, not at their current
      market value."
    kcs: ["kc.acc.o.concepts.identify_concept", "kc.acc.o.concepts.apply_concept"]
  - term: duality
    definition: "Duality principle: every transaction has two equal effects, recorded as a debit in one account
      and a credit in another; it is the basis of double entry."
    kcs: ["kc.acc.o.concepts.identify_concept", "kc.acc.o.concepts.apply_concept"]
  - term: bank reconciliation
    aliases: [reconcile]
    definition: "Bank reconciliation: comparing the cash book with the bank statement, updating the cash book and
      explaining the remaining differences so the two balances agree."
    kcs: ["kc.acc.o.bank_reconciliation.reconciliation_statement", "kc.acc.o.bank_reconciliation.timing_differences"]
  - term: reconciliation statement
    definition: "Bank reconciliation statement: starts from one balance, usually the updated cash book, and
      adjusts for unpresented cheques and outstanding lodgements to reach the bank statement balance."
    kcs: ["kc.acc.o.bank_reconciliation.reconciliation_statement"]
  - term: bank statement
    definition: "Bank statement: the bank's record of the business's account, sent by the bank. Money paid in is
      shown as credits and money paid out as debits."
    kcs: ["kc.acc.o.bank_reconciliation.overdraft_sides", "kc.acc.o.bank_reconciliation.timing_differences"]
  - term: cash book
    definition: "Cash book: a book of prime entry that is also the cash and bank ledger account; receipts are on
      the debit side and payments on the credit side."
    kcs: ["kc.acc.o.bank_reconciliation.update_cash_book", "kc.acc.o.source_documents.select_book_of_prime_entry"]
  - term: cheque
    definition: "Cheque: a written order from an account holder telling the bank to pay a stated sum of money to a
      named person."
    kcs: ["kc.acc.o.bank_reconciliation.timing_differences"]
  - term: unpresented cheque
    definition: "Unpresented cheque: a cheque paid out and entered in the cash book but not yet taken from the
      account by the bank; it makes the bank statement balance higher than the cash book."
    kcs: ["kc.acc.o.bank_reconciliation.timing_differences", "kc.acc.o.bank_reconciliation.reconciliation_statement"]
  - term: lodgement
    definition: "Lodgement: money (cash or cheques) paid into the business's bank account."
    kcs: ["kc.acc.o.bank_reconciliation.timing_differences"]
  - term: outstanding lodgement
    definition: "Outstanding lodgement: money paid in and entered in the cash book but not yet shown on the bank
      statement; it makes the bank statement balance lower than the cash book."
    kcs: ["kc.acc.o.bank_reconciliation.timing_differences", "kc.acc.o.bank_reconciliation.reconciliation_statement"]
  - term: credit transfer
    definition: "Credit transfer: money paid straight into the business's bank account by someone else, first seen
      on the bank statement; it is debited in the cash book."
    kcs: ["kc.acc.o.bank_reconciliation.update_cash_book"]
  - term: direct debit
    definition: "Direct debit: a payment the receiver collects from the business's bank account by agreement,
      often of varying amounts; first seen on the bank statement, it is credited in the cash book."
    kcs: ["kc.acc.o.bank_reconciliation.update_cash_book"]
  - term: standing order
    definition: "Standing order: an instruction from the business to its bank to pay a fixed sum to someone at
      regular intervals; it is credited in the cash book."
    kcs: ["kc.acc.o.bank_reconciliation.update_cash_book"]
  - term: bank charges
    definition: "Bank charges: fees the bank takes from the account, first seen on the bank statement; they are
      credited in the cash book when it is updated."
    kcs: ["kc.acc.o.bank_reconciliation.update_cash_book"]
  - term: dishonoured cheque
    definition: "Dishonoured cheque: a cheque received from a customer that the customer's bank refuses to pay;
      the cash book is credited and the customer's account debited again."
    kcs: ["kc.acc.o.bank_reconciliation.update_cash_book", "kc.acc.o.control_accounts.sales_ledger_control"]
  - term: overdraft
    aliases: [overdrawn]
    definition: "Overdraft: more has been paid out of the bank account than paid in, so the business owes the
      bank; a credit balance in the cash book and a current liability."
    kcs: ["kc.acc.o.bank_reconciliation.overdraft_sides"]
  - term: debit balance
    definition: "Debit balance: the debit side of an account is larger. In the cash book it means money in the
      bank; on the bank statement it means an overdraft."
    kcs: ["kc.acc.o.bank_reconciliation.overdraft_sides", "kc.acc.o.control_accounts.control_sources"]
  - term: credit balance
    definition: "Credit balance: the credit side of an account is larger. In the cash book it means an overdraft;
      on the bank statement it means money in the bank."
    kcs: ["kc.acc.o.bank_reconciliation.overdraft_sides", "kc.acc.o.control_accounts.control_sources"]
  - term: receipts and payments account
    definition: "Receipts and payments account: a summary of a club's cash and bank receipts and payments for the
      year, like a cash book; it ignores accruals and depreciation."
    kcs: ["kc.acc.o.clubs.club_statements"]
  - term: income and expenditure account
    definition: "Income and expenditure account: a club's statement of income and expenses for the year on the
      accruals basis, ending in a surplus or a deficit."
    kcs: ["kc.acc.o.clubs.club_statements", "kc.acc.o.clubs.surplus_deficit"]
  - term: expenditure
    definition: "Expenditure: money spent or costs incurred by a business or club; it is either capital
      expenditure or revenue expenditure."
    kcs: ["kc.acc.o.depreciation.capital_revenue_expenditure", "kc.acc.o.clubs.club_statements"]
  - term: subscriptions
    definition: "Subscriptions: the fees members pay to belong to a club; the income for the year is the amount
      due for that year, whether or not it has been received."
    kcs: [kc.acc.o.clubs.subscriptions]
  - term: subscriptions in arrears
    aliases: [arrears]
    definition: "Subscriptions in arrears: subscriptions for the year that members still owe at the year end;
      added to the year's subscription income and shown as a current asset."
    kcs: [kc.acc.o.clubs.subscriptions]
  - term: subscriptions in advance
    definition: "Subscriptions in advance: subscriptions received this year for next year; deducted from this
      year's subscription income and shown as a current liability."
    kcs: [kc.acc.o.clubs.subscriptions]
  - term: accumulated fund
    definition: "Accumulated fund: the capital of a club or society, equal to its assets less its liabilities."
    kcs: ["kc.acc.o.clubs.accumulated_fund"]
  - term: surplus
    definition: "Surplus: the amount by which a club's income is greater than its expenditure for the year; it is
      added to the accumulated fund."
    kcs: ["kc.acc.o.clubs.surplus_deficit"]
  - term: deficit
    definition: "Deficit: the amount by which a club's expenditure is greater than its income for the year; it is
      deducted from the accumulated fund."
    kcs: ["kc.acc.o.clubs.surplus_deficit"]
  - term: non-profit organisation
    definition: "Non-profit organisation: a club or society run for its members rather than to make a profit; its
      capital is the accumulated fund."
    kcs: ["kc.acc.o.clubs.club_statements"]
  - term: control account
    definition: "Control account: a ledger account holding the totals of all the personal accounts in one ledger,
      used to check their accuracy and to find quickly the total owed."
    kcs: ["kc.acc.o.control_accounts.control_purpose"]
  - term: sales ledger control account
    aliases: [sales ledger control]
    definition: "Sales ledger control account: debits include credit sales and dishonoured cheques; credits
      include receipts, discount allowed, sales returns, irrecoverable debts and contras."
    kcs: ["kc.acc.o.control_accounts.sales_ledger_control", "kc.acc.o.control_accounts.control_sources"]
  - term: purchases ledger control account
    aliases: [purchases ledger control]
    definition: "Purchases ledger control account: credits include credit purchases; debits include payments,
      discount received, purchases returns and contras; the balance is trade payables."
    kcs: ["kc.acc.o.control_accounts.purchases_ledger_control", "kc.acc.o.control_accounts.control_sources"]
  - term: sales ledger
    definition: "Sales ledger: the ledger holding the personal accounts of credit customers (trade receivables)."
    kcs: ["kc.acc.o.control_accounts.control_purpose"]
  - term: purchases ledger
    definition: "Purchases ledger: the ledger holding the personal accounts of credit suppliers (trade payables)."
    kcs: ["kc.acc.o.control_accounts.control_purpose"]
  - term: contra entry
    aliases: [set-off]
    definition: "Contra entry (set-off): cancelling what a person owes the business against what the business owes
      them; credit sales ledger control and debit purchases ledger control."
    kcs: ["kc.acc.o.control_accounts.control_sources"]
  - term: opening balance
    definition: "Opening balance: the balance on an account at the start of a period, brought down from the end of
      the previous period."
    kcs: ["kc.acc.o.control_accounts.sales_ledger_control", "kc.acc.o.control_accounts.purchases_ledger_control"]
  - term: closing balance
    definition: "Closing balance: the balance on an account at the end of a period, the difference between the
      totals of its two sides."
    kcs: ["kc.acc.o.control_accounts.sales_ledger_control", "kc.acc.o.control_accounts.purchases_ledger_control"]
  - term: fixed cost
    definition: "Fixed cost: a cost that stays the same in total whatever the level of output, in the short term,
      such as rent."
    kcs: ["kc.acc.o.costing.cost_classification"]
  - term: variable cost
    definition: "Variable cost: a cost that changes in total in proportion to output, such as raw materials; the
      cost per unit stays the same."
    kcs: ["kc.acc.o.costing.cost_classification"]
  - term: direct cost
    definition: "Direct cost: a cost that can be traced to each unit made, such as raw materials and production
      wages."
    kcs: ["kc.acc.o.costing.cost_classification"]
  - term: indirect cost
    definition: "Indirect cost (overhead): a cost that cannot be traced to a particular unit made, such as factory
      rent or a supervisor's wages."
    kcs: ["kc.acc.o.costing.cost_classification"]
  - term: unit cost
    definition: "Unit cost: the cost of making one unit, total cost divided by the number of units made."
    kcs: ["kc.acc.o.costing.cost_classification"]
  - term: contribution
    definition: "Contribution: revenue less variable costs; it goes first towards covering fixed costs and then
      makes profit."
    kcs: [kc.acc.o.costing.contribution]
  - term: contribution per unit
    definition: "Contribution per unit: selling price per unit less variable cost per unit."
    kcs: [kc.acc.o.costing.contribution, "kc.acc.o.costing.break_even"]
  - term: break-even point
    aliases: [break-even]
    definition: "Break-even point: the output at which total revenue equals total costs, so there is neither
      profit nor loss; units = fixed costs / contribution per unit."
    kcs: ["kc.acc.o.costing.break_even"]
  - term: margin of safety
    definition: "Margin of safety: how far actual or planned output is above the break-even output, in units or in
      revenue."
    kcs: ["kc.acc.o.costing.margin_of_safety"]
  - term: target profit
    definition: "Target profit: the profit a business aims to make; units needed = (fixed costs + target profit) /
      contribution per unit."
    kcs: ["kc.acc.o.costing.target_profit"]
  - term: depreciation
    aliases: [depreciate, depreciated]
    definition: "Depreciation: the part of a non-current asset's cost used up in a period, charged as an expense
      in the income statement to spread the cost over the asset's useful life."
    kcs: ["kc.acc.o.depreciation.depreciation_purpose", "kc.acc.o.depreciation.straight_line", "kc.acc.o.depreciation.reducing_balance"]
  - term: capital expenditure
    definition: "Capital expenditure: spending on buying or improving non-current assets, including costs to make
      them ready for use such as delivery and installation."
    kcs: ["kc.acc.o.depreciation.capital_revenue_expenditure"]
  - term: revenue expenditure
    definition: "Revenue expenditure: spending on the day-to-day running of the business, such as repairs, fuel
      and wages; charged as an expense in the income statement."
    kcs: ["kc.acc.o.depreciation.capital_revenue_expenditure"]
  - term: capitalised
    definition: "Capitalised: a cost added to the cost of a non-current asset as capital expenditure, instead of
      being charged as an expense in the income statement."
    kcs: ["kc.acc.o.depreciation.capital_revenue_expenditure"]
  - term: installation
    definition: "Installation: the cost of setting up a new non-current asset ready for use; it is capital
      expenditure, added to the asset's cost."
    kcs: ["kc.acc.o.depreciation.capital_revenue_expenditure"]
  - term: straight-line method
    aliases: [straight-line]
    definition: "Straight-line method: the same depreciation charge every year, (cost less residual value) /
      useful life in years."
    kcs: ["kc.acc.o.depreciation.straight_line"]
  - term: reducing-balance method
    aliases: [reducing-balance, reducing balance]
    definition: "Reducing-balance method: each year's depreciation is a fixed percentage of the net book value at
      the start of that year, so the charge gets smaller each year."
    kcs: ["kc.acc.o.depreciation.reducing_balance"]
  - term: residual value
    definition: "Residual value: the amount the business expects to receive for an asset at the end of its useful
      life."
    kcs: ["kc.acc.o.depreciation.straight_line"]
  - term: useful life
    definition: "Useful life: the length of time the business expects to use a non-current asset."
    kcs: ["kc.acc.o.depreciation.straight_line"]
  - term: accumulated depreciation
    definition: "Accumulated depreciation: the total depreciation charged on a non-current asset since it was
      bought."
    kcs: ["kc.acc.o.depreciation.net_book_value", kc.acc.o.depreciation.disposal]
  - term: net book value
    definition: "Net book value: the cost of a non-current asset less its accumulated depreciation."
    kcs: ["kc.acc.o.depreciation.net_book_value", kc.acc.o.depreciation.disposal]
  - term: disposal
    definition: "Disposal: selling or scrapping a non-current asset. Proceeds above the net book value give a
      profit on disposal; proceeds below it give a loss."
    kcs: [kc.acc.o.depreciation.disposal]
  - term: obsolescence
    definition: "Obsolescence: an asset becoming out of date or no longer suitable, even though it still works; a
      cause of depreciation."
    kcs: ["kc.acc.o.depreciation.depreciation_purpose"]
  - term: wear and tear
    definition: "Wear and tear: the physical deterioration of an asset through use; a cause of depreciation."
    kcs: ["kc.acc.o.depreciation.depreciation_purpose"]
  - term: non-current asset
    definition: "Non-current asset: an asset bought to use in the business for more than one year, not to resell,
      such as premises, machinery and vehicles."
    kcs: ["kc.acc.o.sole_trader_statements.sofp_sections", "kc.acc.o.depreciation.depreciation_purpose"]
  - term: double entry
    definition: "Double entry: every transaction is recorded twice, as a debit in one account and an equal credit
      in another."
    kcs: ["kc.acc.o.double_entry.debit_credit_rules"]
  - term: debit
    definition: "Debit: the left side of a ledger account. A debit records an increase in an asset, expense or
      drawings, or a decrease in a liability, capital or income."
    kcs: ["kc.acc.o.double_entry.debit_credit_rules", "kc.acc.o.trial_balance.classify_tb_balances"]
  - term: credit
    definition: "Credit: the right side of a ledger account. A credit records an increase in a liability, capital
      or income, or a decrease in an asset, expense or drawings."
    kcs: ["kc.acc.o.double_entry.debit_credit_rules", "kc.acc.o.trial_balance.classify_tb_balances"]
  - term: ledger
    definition: "Ledger: the book or file that holds the business's accounts; entries are posted to it from the
      books of prime entry."
    kcs: ["kc.acc.o.double_entry.debit_credit_rules"]
  - term: ledger account
    definition: "Ledger account: the record of one item, such as an asset, an expense or a person, with a debit
      side on the left and a credit side on the right."
    kcs: ["kc.acc.o.double_entry.debit_credit_rules", "kc.acc.o.double_entry.balance_account"]
  - term: balance carried down
    definition: "Balance carried down (c/d): the amount entered on the smaller side of a ledger account at the end
      of a period so that both sides total the same."
    kcs: ["kc.acc.o.double_entry.balance_account"]
  - term: balance brought down
    definition: "Balance brought down (b/d): the balance carried down, entered on the opposite side at the start
      of the next period; a debit b/d is a debit balance."
    kcs: ["kc.acc.o.double_entry.balance_account"]
  - term: drawings
    definition: "Drawings: cash, goods or other resources the owner takes from the business for private use; they
      reduce capital and are not an expense."
    kcs: ["kc.acc.o.double_entry.record_owner_transactions", "kc.acc.o.sole_trader_statements.closing_capital"]
    wrong: [drawings are an expense, drawings is an expense]
  - term: capital introduced
    definition: "Capital introduced: extra money or other resources the owner puts into the business; debit bank
      or the asset and credit capital."
    kcs: ["kc.acc.o.double_entry.record_owner_transactions", "kc.acc.o.incomplete_records.profit_from_capital"]
  - term: purchases
    definition: "Purchases: goods bought for resale, for cash or on credit; items bought for use in the business,
      such as equipment, are not purchases."
    kcs: ["kc.acc.o.double_entry.record_credit_transactions", "kc.acc.o.sole_trader_statements.cost_of_sales"]
  - term: purchases returns
    aliases: [returns outwards]
    definition: "Purchases returns (returns outwards): goods sent back to suppliers; deducted from purchases when
      calculating cost of sales."
    kcs: ["kc.acc.o.double_entry.record_credit_transactions", "kc.acc.o.sole_trader_statements.cost_of_sales"]
  - term: sales returns
    aliases: [returns inwards]
    definition: "Sales returns (returns inwards): goods sent back by customers; deducted from sales to give
      revenue."
    kcs: ["kc.acc.o.double_entry.record_credit_transactions", "kc.acc.o.sole_trader_statements.gross_profit"]
  - term: credit purchases
    aliases: [credit purchase]
    definition: "Credit purchases: goods for resale bought now and paid for later; debit purchases and credit the
      supplier's account in the purchases ledger."
    kcs: ["kc.acc.o.double_entry.record_credit_transactions", "kc.acc.o.incomplete_records.missing_credit_figures"]
  - term: credit sales
    aliases: [credit sale]
    definition: "Credit sales: goods sold now and paid for later; debit the customer's account in the sales ledger
      and credit sales."
    kcs: ["kc.acc.o.double_entry.record_credit_transactions", "kc.acc.o.incomplete_records.missing_credit_figures"]
  - term: incomplete records
    definition: "Incomplete records: the records of a business that does not keep a full double-entry system, so
      missing figures are worked out from what records exist."
    kcs: ["kc.acc.o.incomplete_records.statement_of_affairs", "kc.acc.o.incomplete_records.missing_credit_figures"]
  - term: statement of affairs
    definition: "Statement of affairs: a list of a trader's assets and liabilities on a date, used with incomplete
      records to find capital as assets less liabilities."
    kcs: ["kc.acc.o.incomplete_records.statement_of_affairs"]
  - term: opening capital
    definition: "Opening capital: the owner's capital at the start of the year; with incomplete records it is
      found from a statement of affairs as assets less liabilities."
    kcs: ["kc.acc.o.incomplete_records.statement_of_affairs", "kc.acc.o.sole_trader_statements.closing_capital"]
  - term: closing capital
    definition: "Closing capital: opening capital plus capital introduced plus profit for the year, less drawings
      (a loss is deducted instead of profit added)."
    kcs: ["kc.acc.o.sole_trader_statements.closing_capital", "kc.acc.o.incomplete_records.profit_from_capital"]
  - term: gross margin
    aliases: [margin]
    definition: "Gross margin (margin): gross profit as a percentage of revenue, that is of the selling price."
    kcs: [kc.acc.o.ratios.margins, "kc.acc.o.incomplete_records.margin_markup_use"]
  - term: mark-up
    definition: "Mark-up: gross profit as a percentage of cost of sales, that is of the cost price."
    kcs: ["kc.acc.o.ratios.mark_up", "kc.acc.o.incomplete_records.margin_markup_use"]
  - term: inventory
    definition: "Inventory: goods the business holds for resale; a current asset valued at the lower of cost and
      net realisable value."
    kcs: ["kc.acc.o.accounting_equation.classify_elements", "kc.acc.o.sole_trader_statements.sofp_sections"]
  - term: closing inventory
    definition: "Closing inventory: goods unsold at the end of the year, valued at the lower of cost and net
      realisable value; deducted in cost of sales and shown as a current asset."
    kcs: ["kc.acc.o.inventory.inventory_profit_effect", "kc.acc.o.sole_trader_statements.cost_of_sales"]
  - term: opening inventory
    definition: "Opening inventory: the goods held at the start of the year, equal to the previous year's closing
      inventory; added in the cost of sales calculation."
    kcs: ["kc.acc.o.sole_trader_statements.cost_of_sales"]
  - term: valuation
    definition: "Valuation (of inventory): putting a money value on inventory at the lower of cost and net
      realisable value, with cost found by FIFO or AVCO."
    kcs: ["kc.acc.o.inventory.lower_cost_nrv"]
  - term: overstate
    aliases: [overstated]
    definition: "Overstated: shown at more than the correct figure. If closing inventory is overstated, cost of
      sales is understated and gross profit and profit are overstated."
    kcs: ["kc.acc.o.inventory.inventory_profit_effect"]
  - term: understate
    aliases: [understated]
    definition: "Understated: shown at less than the correct figure. If closing inventory is understated, cost of
      sales is overstated and gross profit and profit are understated."
    kcs: ["kc.acc.o.inventory.inventory_profit_effect"]
  - term: irrecoverable debt
    aliases: [irrecoverable]
    definition: "Irrecoverable debt: an amount owed by a credit customer that will never be paid; it is written
      off by debiting irrecoverable debts (an expense) and crediting the customer."
    kcs: ["kc.acc.o.irrecoverable_debts.write_off"]
  - term: write-off
    aliases: [written off]
    definition: "Write-off: removing an amount from the books because it will never be received, such as crediting
      a customer's account with an irrecoverable debt."
    kcs: ["kc.acc.o.irrecoverable_debts.write_off"]
  - term: debt recovered
    definition: "Debt recovered: money received from a customer whose debt was written off earlier; the debt is
      reinstated, the receipt recorded and the amount shown as income."
    kcs: ["kc.acc.o.irrecoverable_debts.write_off"]
  - term: debtor
    definition: "Debtor: a person who owes the business money, usually a credit customer; the amount owed is a
      trade receivable."
    kcs: ["kc.acc.o.irrecoverable_debts.write_off"]
  - term: allowance for irrecoverable debts
    aliases: [allowance]
    definition: "Allowance for irrecoverable debts: an estimate of trade receivables that may not be paid;
      deducted from trade receivables, and only its increase or decrease affects profit."
    kcs: ["kc.acc.o.irrecoverable_debts.allowance_amount", "kc.acc.o.irrecoverable_debts.allowance_change", "kc.acc.o.irrecoverable_debts.net_receivables"]
  - term: trade receivables
    aliases: [trade receivable]
    definition: "Trade receivables: amounts owed to the business by credit customers for goods or services sold; a
      current asset."
    kcs: ["kc.acc.o.accounting_equation.classify_elements", "kc.acc.o.sole_trader_statements.sofp_sections", "kc.acc.o.irrecoverable_debts.net_receivables"]
  - term: net trade receivables
    definition: "Net trade receivables: trade receivables less the allowance for irrecoverable debts; the figure
      shown under current assets."
    kcs: ["kc.acc.o.irrecoverable_debts.net_receivables"]
  - term: trade payables
    definition: "Trade payables: amounts the business owes to suppliers for goods or services bought on credit; a
      current liability."
    kcs: ["kc.acc.o.accounting_equation.classify_elements", "kc.acc.o.sole_trader_statements.sofp_sections"]
  - term: partnership
    definition: "Partnership: a business owned by two or more people who share its capital, profits and losses."
    kcs: ["kc.acc.o.partnerships.partnership_agreement"]
  - term: partnership agreement
    definition: "Partnership agreement: the partners' agreement on capital, profit sharing, interest and salaries;
      without one, profits are shared equally with no interest on capital or salaries."
    kcs: ["kc.acc.o.partnerships.partnership_agreement"]
  - term: appropriation account
    aliases: [appropriation]
    definition: "Appropriation account: shares a partnership's profit for the year among the partners: interest on
      capital, salaries and interest on drawings first, then residual profit."
    kcs: [kc.acc.o.partnerships.appropriation, "kc.acc.o.partnerships.interest_and_salary"]
  - term: interest on capital
    definition: "Interest on capital: an agreed return to each partner on the capital invested; an appropriation
      of profit credited to the current account, not an expense."
    kcs: ["kc.acc.o.partnerships.interest_and_salary"]
  - term: interest on drawings
    definition: "Interest on drawings: a charge made on partners for their drawings; debited to the partner's
      current account and added to the profit to be shared."
    kcs: ["kc.acc.o.partnerships.interest_and_salary"]
  - term: partner's salary
    aliases: [partners' salaries]
    definition: "Partner's salary: an agreed amount a partner receives for work in the business; an appropriation
      of profit credited to the current account, not an expense."
    kcs: ["kc.acc.o.partnerships.interest_and_salary"]
  - term: profit-sharing ratio
    definition: "Profit-sharing ratio: the agreed ratio in which partners share the residual profit or loss."
    kcs: [kc.acc.o.partnerships.appropriation]
  - term: residual profit
    definition: "Residual profit: the profit left after interest on capital, partners' salaries and interest on
      drawings; shared in the profit-sharing ratio."
    kcs: [kc.acc.o.partnerships.appropriation]
  - term: capital account
    definition: "Capital account (partnership): records the long-term capital each partner has invested; with
      fixed capitals it changes only when capital is added or withdrawn."
    kcs: ["kc.acc.o.partnerships.capital_vs_current"]
  - term: current account
    definition: "Current account (partnership): credited with a partner's share of profit, interest on capital and
      salary; debited with drawings and interest on drawings."
    kcs: ["kc.acc.o.partnerships.current_accounts", "kc.acc.o.partnerships.capital_vs_current"]
  - term: fixed capital
    definition: "Fixed capital: capital account balances stay the same, while profit shares, interest, salaries
      and drawings are entered in the partners' current accounts."
    kcs: ["kc.acc.o.partnerships.capital_vs_current"]
  - term: ratio
    definition: "Ratio: a comparison of two figures from the financial statements, shown as a percentage, a number
      of times, days, or a proportion such as 'two to one'."
    kcs: ["kc.acc.o.ratios.interpret_ratios"]
  - term: profit margin
    definition: "Profit margin: profit for the year as a percentage of revenue."
    kcs: [kc.acc.o.ratios.margins]
  - term: current ratio
    definition: "Current ratio: current assets : current liabilities; it shows whether the current assets can
      cover the debts due within one year."
    kcs: [kc.acc.o.ratios.liquidity]
  - term: acid-test ratio
    aliases: [acid-test]
    definition: "Acid-test ratio: (current assets less inventory) : current liabilities; it shows whether current
      liabilities can be paid without selling inventory."
    kcs: [kc.acc.o.ratios.liquidity]
  - term: liquidity
    definition: "Liquidity: the ability of a business to pay its debts as they fall due; judged by the current
      ratio and the acid-test ratio."
    kcs: [kc.acc.o.ratios.liquidity]
  - term: rate of inventory turnover
    aliases: [inventory turnover]
    definition: "Rate of inventory turnover: cost of sales / average inventory, in times a year; or average
      inventory / cost of sales x three hundred and sixty-five, in days."
    kcs: ["kc.acc.o.ratios.inventory_turnover"]
  - term: average inventory
    definition: "Average inventory: (opening inventory + closing inventory) / two; used for the rate of inventory
      turnover."
    kcs: ["kc.acc.o.ratios.inventory_turnover"]
  - term: trade receivables collection period
    aliases: [collection period]
    definition: "Trade receivables collection period: trade receivables / credit sales x three hundred and
      sixty-five; the average number of days credit customers take to pay."
    kcs: ["kc.acc.o.ratios.collection_periods"]
  - term: trade payables payment period
    definition: "Trade payables payment period: trade payables / credit purchases x three hundred and sixty-five;
      the average number of days the business takes to pay suppliers."
    kcs: ["kc.acc.o.ratios.collection_periods"]
  - term: capital employed
    definition: "Capital employed: the long-term funds used in the business, the owner's capital plus non-current
      liabilities."
    kcs: [kc.acc.o.ratios.roce]
  - term: return on capital employed
    aliases: [ROCE]
    definition: "Return on capital employed (ROCE): profit for the year as a percentage of capital employed; it
      shows how well the capital in the business earns profit."
    kcs: [kc.acc.o.ratios.roce]
    cues: [ROCE]
  - term: profitability
    definition: "Profitability: how well a business makes profit from its sales and capital; judged by gross
      margin, profit margin and return on capital employed."
    kcs: [kc.acc.o.ratios.margins, "kc.acc.o.ratios.interpret_ratios"]
  - term: efficiency
    definition: "Efficiency: how well a business uses its resources; judged by the rate of inventory turnover and
      the trade receivables and trade payables periods."
    kcs: ["kc.acc.o.ratios.interpret_ratios"]
  - term: income statement
    definition: "Income statement: shows a business's revenue, cost of sales, gross profit, other income, expenses
      and profit for the year for a period."
    kcs: ["kc.acc.o.sole_trader_statements.gross_profit", "kc.acc.o.sole_trader_statements.profit_for_year"]
  - term: statement of financial position
    definition: "Statement of financial position: lists a business's assets, liabilities and capital on one date;
      assets equal capital plus liabilities."
    kcs: ["kc.acc.o.sole_trader_statements.sofp_sections"]
  - term: revenue
    definition: "Revenue: income from the business's main activity of selling goods or services; in the income
      statement it is sales less sales returns."
    kcs: ["kc.acc.o.sole_trader_statements.gross_profit"]
  - term: gross profit
    definition: "Gross profit: revenue less cost of sales."
    kcs: ["kc.acc.o.sole_trader_statements.gross_profit"]
  - term: profit for the year
    definition: "Profit for the year: gross profit plus other income less expenses; it is added to the owner's
      capital."
    kcs: ["kc.acc.o.sole_trader_statements.profit_for_year"]
  - term: other income
    definition: "Other income: income not from the main trading activity, such as discount received, rent received
      or commission received; added to gross profit."
    kcs: ["kc.acc.o.sole_trader_statements.profit_for_year"]
  - term: carriage inwards
    definition: "Carriage inwards: the cost of transporting purchases into the business; added to purchases in
      cost of sales."
    kcs: ["kc.acc.o.sole_trader_statements.cost_of_sales"]
  - term: carriage outwards
    definition: "Carriage outwards: the cost of delivering goods sold to customers; an expense deducted from gross
      profit."
    kcs: ["kc.acc.o.sole_trader_statements.profit_for_year"]
  - term: current assets
    aliases: [current asset]
    definition: "Current assets: assets expected to be turned into cash within one year, such as inventory, trade
      receivables, other receivables, bank and cash."
    kcs: ["kc.acc.o.sole_trader_statements.sofp_sections", "kc.acc.o.sole_trader_statements.working_capital", kc.acc.o.ratios.liquidity]
  - term: current liabilities
    aliases: [current liability]
    definition: "Current liabilities: amounts due for payment within one year, such as trade payables, other
      payables and a bank overdraft."
    kcs: ["kc.acc.o.sole_trader_statements.sofp_sections", "kc.acc.o.sole_trader_statements.working_capital", kc.acc.o.ratios.liquidity]
  - term: non-current liabilities
    definition: "Non-current liabilities: amounts not due for payment for more than one year, such as a long-term
      loan."
    kcs: ["kc.acc.o.sole_trader_statements.sofp_sections", kc.acc.o.ratios.roce]
  - term: net current assets
    aliases: [working capital]
    definition: "Net current assets (working capital): current assets less current liabilities."
    kcs: ["kc.acc.o.sole_trader_statements.working_capital"]
  - term: source document
    definition: "Source document: the original document that gives the evidence and details of a transaction, such
      as an invoice, credit note or receipt."
    kcs: ["kc.acc.o.source_documents.identify_source_document"]
  - term: invoice
    definition: "Invoice: a document a seller sends to a buyer for a credit sale, showing the goods, prices, any
      trade discount and the amount owed."
    kcs: ["kc.acc.o.source_documents.identify_source_document"]
  - term: credit note
    definition: "Credit note: a document a seller sends to a buyer when goods are returned or the buyer was
      overcharged; it reduces the amount the buyer owes."
    kcs: ["kc.acc.o.source_documents.identify_source_document"]
  - term: debit note
    definition: "Debit note: a document a buyer sends to a supplier asking for the amount owed to be reduced, for
      goods returned or an overcharge."
    kcs: ["kc.acc.o.source_documents.identify_source_document"]
  - term: receipt
    definition: "Receipt: a document given by the person who receives money as proof of payment."
    kcs: ["kc.acc.o.source_documents.identify_source_document"]
  - term: cheque counterfoil
    definition: "Cheque counterfoil: the part of a cheque kept in the cheque book showing the date, payee and
      amount; the source document for a payment by cheque."
    kcs: ["kc.acc.o.source_documents.identify_source_document"]
  - term: counterfoil
    definition: "Counterfoil: the part of a cheque or paying-in slip the business keeps as its own record of the
      payment or of the money paid in."
    kcs: ["kc.acc.o.source_documents.identify_source_document"]
  - term: paying-in slip
    definition: "Paying-in slip: a form filled in when cash or cheques are paid into a bank account; its
      counterfoil is the source document for the money paid in."
    kcs: ["kc.acc.o.source_documents.identify_source_document"]
  - term: statement of account
    definition: "Statement of account: a summary a seller sends a credit customer listing invoices, credit notes
      and payments, and the balance owed."
    kcs: ["kc.acc.o.source_documents.identify_source_document"]
  - term: book of prime entry
    aliases: [books of prime entry]
    definition: "Book of prime entry: where a transaction is first recorded from its source document before
      posting to the ledger, such as the journals, cash book and petty cash book."
    kcs: ["kc.acc.o.source_documents.select_book_of_prime_entry"]
  - term: day book
    definition: "Day book: a book of prime entry listing credit transactions of one kind, such as the sales
      journal (sales day book); its totals are posted to the ledger."
    kcs: ["kc.acc.o.source_documents.post_day_book_totals", "kc.acc.o.control_accounts.control_sources"]
  - term: sales journal
    definition: "Sales journal (sales day book): the book of prime entry listing credit sales from copies of the
      invoices sent; its total is credited to the sales account."
    kcs: ["kc.acc.o.source_documents.select_book_of_prime_entry", "kc.acc.o.source_documents.post_day_book_totals"]
  - term: purchases journal
    definition: "Purchases journal (purchases day book): the book of prime entry listing credit purchases from
      invoices received; its total is debited to the purchases account."
    kcs: ["kc.acc.o.source_documents.select_book_of_prime_entry", "kc.acc.o.source_documents.post_day_book_totals"]
  - term: sales returns journal
    definition: "Sales returns journal: the book of prime entry listing goods returned by credit customers, from
      copies of credit notes sent; its total is debited to sales returns."
    kcs: ["kc.acc.o.source_documents.select_book_of_prime_entry", "kc.acc.o.source_documents.post_day_book_totals"]
  - term: purchases returns journal
    definition: "Purchases returns journal: the book of prime entry listing goods returned to credit suppliers,
      from credit notes received; its total is credited to purchases returns."
    kcs: ["kc.acc.o.source_documents.select_book_of_prime_entry", "kc.acc.o.source_documents.post_day_book_totals"]
  - term: general journal
    definition: "General journal: the book of prime entry for transactions not recorded elsewhere, such as
      correcting errors, credit purchases of non-current assets and year-end transfers."
    kcs: ["kc.acc.o.source_documents.select_book_of_prime_entry"]
  - term: petty cash book
    definition: "Petty cash book: the book of prime entry for small cash payments, often kept on the imprest
      system, with analysis columns for each type of expense."
    kcs: ["kc.acc.o.source_documents.select_book_of_prime_entry"]
  - term: trade discount
    definition: "Trade discount: a reduction from the list price given to trade customers; it is deducted on the
      invoice and never entered in the ledger accounts."
    kcs: ["kc.acc.o.source_documents.trade_discount"]
  - term: list price
    definition: "List price: the catalogue price of goods before any trade discount is deducted."
    kcs: ["kc.acc.o.source_documents.trade_discount"]
  - term: cash discount
    definition: "Cash discount: a reduction in the amount owed, given for prompt payment; the seller records it as
      discount allowed and the buyer as discount received."
    kcs: ["kc.acc.o.source_documents.cash_discount"]
  - term: discount allowed
    definition: "Discount allowed: cash discount the business gives credit customers for paying promptly; an
      expense in the income statement."
    kcs: ["kc.acc.o.source_documents.cash_discount", "kc.acc.o.control_accounts.sales_ledger_control"]
  - term: discount received
    definition: "Discount received: cash discount the business receives from suppliers for paying promptly; other
      income in the income statement."
    kcs: ["kc.acc.o.source_documents.cash_discount", "kc.acc.o.control_accounts.purchases_ledger_control"]
  - term: trial balance
    definition: "Trial balance: a list of all ledger balances on a date in debit and credit columns; equal totals
      check arithmetic but do not prove there are no errors."
    kcs: ["kc.acc.o.trial_balance.prepare_trial_balance", "kc.acc.o.trial_balance.classify_tb_balances"]
  - term: debit column
    definition: "Debit column: the trial balance column for debit balances, such as assets, expenses, drawings,
      purchases and sales returns."
    kcs: ["kc.acc.o.trial_balance.classify_tb_balances"]
  - term: credit column
    definition: "Credit column: the trial balance column for credit balances, such as liabilities, capital,
      revenue, other income and purchases returns."
    kcs: ["kc.acc.o.trial_balance.classify_tb_balances"]
  - term: suspense account
    aliases: [suspense]
    definition: "Suspense account: a temporary account that holds the difference when the trial balance totals do
      not agree; it is cleared as the errors are found and corrected."
    kcs: ["kc.acc.o.trial_balance.suspense_account"]
  - term: error of omission
    definition: "Error of omission: a transaction left out of the books completely, so neither the debit nor the
      credit is recorded; the trial balance still agrees."
    kcs: ["kc.acc.o.trial_balance.errors_not_revealed", "kc.acc.o.trial_balance.correcting_entries"]
  - term: error of commission
    definition: "Error of commission: an amount posted to the wrong account of the same class, such as the wrong
      customer's account; the trial balance still agrees."
    kcs: ["kc.acc.o.trial_balance.errors_not_revealed", "kc.acc.o.trial_balance.correcting_entries"]
  - term: error of principle
    definition: "Error of principle: an amount posted to the wrong class of account, such as a non-current asset
      debited to an expense account; the trial balance still agrees."
    kcs: ["kc.acc.o.trial_balance.errors_not_revealed", "kc.acc.o.trial_balance.correcting_entries"]
  - term: error of original entry
    definition: "Error of original entry: a wrong amount used for both the debit and the credit, often copied
      wrongly from the source document; the trial balance still agrees."
    kcs: ["kc.acc.o.trial_balance.errors_not_revealed", "kc.acc.o.trial_balance.correcting_entries"]
  - term: compensating error
    definition: "Compensating error: two or more errors of equal amount whose effects cancel each other out, so
      the trial balance still agrees."
    kcs: ["kc.acc.o.trial_balance.errors_not_revealed", "kc.acc.o.trial_balance.correcting_entries"]
  - term: complete reversal
    definition: "Complete reversal of entries: the correct amount and accounts are used but the debit and credit
      sides are swapped; the trial balance still agrees."
    kcs: ["kc.acc.o.trial_balance.errors_not_revealed", "kc.acc.o.trial_balance.correcting_entries"]
  - term: transposition
    definition: "Transposition error: the digits of a figure written in the wrong order, such as fifty-four for
      forty-five; the difference it causes divides exactly by nine."
    kcs: ["kc.acc.o.trial_balance.prepare_trial_balance", "kc.acc.o.trial_balance.suspense_account"]
  - term: undercast
    definition: "Undercast: a column or account total added up to less than it should be."
    kcs: ["kc.acc.o.trial_balance.prepare_trial_balance", "kc.acc.o.trial_balance.suspense_account"]
  - term: overcast
    definition: "Overcast: a column or account total added up to more than it should be."
    kcs: ["kc.acc.o.trial_balance.prepare_trial_balance", "kc.acc.o.trial_balance.suspense_account"]
  - term: journal
    definition: "Journal: a book of prime entry; used on its own it usually means the general journal, where
      errors are corrected and unusual transactions recorded."
    kcs: ["kc.acc.o.trial_balance.correcting_entries"]
  - term: journal entry
    definition: "Journal entry: an entry in the general journal naming the account debited and the account
      credited, the amounts and a short narrative."
    kcs: ["kc.acc.o.trial_balance.correcting_entries"]
  - term: correcting entry
    definition: "Correcting entry: a journal entry that puts an error right by debiting and crediting the accounts
      needed, using the suspense account when only one side was wrong."
    kcs: ["kc.acc.o.trial_balance.correcting_entries"]
  # Mathematics
  - term: 12-hour clock
    definition: "Twelve-hour clock: times run from midnight to noon (a.m.) and from noon to midnight (p.m.), with
      hours counted up to twelve."
    kcs: ["kc.mth.o.number.time_intervals"]
  - term: 24-hour clock
    definition: "Twenty-four-hour clock: hours are counted from midnight up to twenty-three, written with four
      figures and no a.m. or p.m.; seven p.m. is nineteen hundred hours."
    kcs: ["kc.mth.o.number.time_intervals"]
  - term: time interval
    definition: "Time interval: the length of time between a start time and an end time; count on in hours, then
      in minutes, remembering an hour has sixty minutes."
    kcs: ["kc.mth.o.number.time_intervals"]
  - term: timetable
    definition: "Timetable: a table showing the times at which buses, trains or events arrive, leave or happen."
    kcs: ["kc.mth.o.number.time_intervals"]
  - term: currency
    definition: "Currency: the money system used in a country, such as dollars, euros or rupees."
    kcs: ["kc.mth.o.number.currency_conversion"]
  - term: exchange rate
    definition: "Exchange rate: how much of one currency equals one unit of another currency. Multiply by the rate
      to convert one way and divide by it to convert back."
    kcs: ["kc.mth.o.number.currency_conversion"]
  - term: conversion
    definition: "Conversion: changing an amount from one currency or unit into another without changing its value,
      using an exchange rate or a conversion factor."
    kcs: ["kc.mth.o.number.currency_conversion"]
  - term: rate
    definition: "Rate: how much of one quantity there is per unit of another, such as km per hour or dollars per
      kg."
    kcs: [kc.mth.o.number.rates]
  - term: average speed
    definition: "Average speed: total distance travelled divided by total time taken, including any time spent
      stopped."
    kcs: [kc.mth.o.number.rates, "kc.mth.o.algebra_and_graphs.travel_graphs"]
  - term: density
    definition: "Density: mass per unit volume, density = mass / volume, measured in units such as g/cm cubed or
      kg/m cubed."
    kcs: [kc.mth.o.number.rates]
  - term: unit price
    definition: "Unit price: the cost of one unit of an item, such as the price per gram; the lower unit price is
      the better value."
    kcs: [kc.mth.o.number.rates]
  - term: interest
    definition: "Interest: money paid for borrowing money, or earned for saving or investing it, usually a
      percentage of the amount."
    kcs: ["kc.mth.o.number.simple_interest", "kc.mth.o.number.compound_growth"]
  - term: interest rate
    definition: "Interest rate: the percentage of the principal paid as interest for each time period, usually per
      annum."
    kcs: ["kc.mth.o.number.simple_interest", "kc.mth.o.number.compound_growth"]
  - term: principal
    definition: "Principal: the amount of money first invested or borrowed, before any interest is added."
    kcs: ["kc.mth.o.number.simple_interest", "kc.mth.o.number.compound_growth"]
  - term: per annum
    definition: "Per annum: per year; an interest rate per annum is applied once for each year."
    kcs: ["kc.mth.o.number.simple_interest", "kc.mth.o.number.compound_growth"]
  - term: simple interest
    definition: "Simple interest: interest paid only on the original principal, the same amount each year: I = P x
      R x T / one hundred, with R the percentage rate per annum and T in years."
    kcs: ["kc.mth.o.number.simple_interest"]
  - term: compound interest
    definition: "Compound interest: interest added to the amount each period, so later interest is also earned on
      earlier interest. Amount = P x (one + r / one hundred) to the power n, for r percent over n periods."
    kcs: ["kc.mth.o.number.compound_growth"]
  - term: exponential growth
    definition: "Exponential growth: a quantity multiplied by the same multiplier greater than one in each period,
      amount = starting amount x multiplier to the power n."
    kcs: ["kc.mth.o.number.compound_growth"]
  - term: exponential decay
    definition: "Exponential decay: a quantity multiplied by the same multiplier between zero and one in each
      period, so it falls by the same percentage each time."
    kcs: ["kc.mth.o.number.compound_growth"]
  - term: depreciation
    aliases: [depreciate]
    definition: "Depreciation: the fall in value of an item over time, usually by the same percentage each year,
      so value = original value x (one - r / one hundred) to the power n."
    kcs: ["kc.mth.o.number.compound_growth"]
  - term: percentage
    definition: "Percentage: a number of parts out of one hundred; to find a percentage of an amount, multiply the
      amount by the percentage over one hundred."
    kcs: ["kc.mth.o.number.fdp_conversion", "kc.mth.o.number.percentage_change"]
  - term: percentage change
    definition: "Percentage change: the change divided by the original amount, times one hundred."
    kcs: ["kc.mth.o.number.percentage_change"]
  - term: percentage increase
    definition: "Percentage increase: the increase as a percentage of the original amount; to increase by r
      percent, multiply by one + r / one hundred."
    kcs: ["kc.mth.o.number.percentage_change"]
  - term: percentage decrease
    definition: "Percentage decrease: the decrease as a percentage of the original amount; to decrease by r
      percent, multiply by one - r / one hundred."
    kcs: ["kc.mth.o.number.percentage_change"]
  - term: multiplier
    definition: "Multiplier: the single number that applies a percentage change; an increase of r percent uses one
      + r / one hundred and a decrease uses one - r / one hundred."
    kcs: ["kc.mth.o.number.percentage_change", "kc.mth.o.number.reverse_percentage", "kc.mth.o.number.compound_growth"]
  - term: original amount
    aliases: [original price]
    definition: "Original amount: the value before a percentage increase or decrease; percentage changes are
      always worked out as a percentage of it."
    kcs: ["kc.mth.o.number.reverse_percentage", "kc.mth.o.number.percentage_change"]
  - term: reverse percentage
    definition: "Reverse percentage: finding the original amount from the amount after a percentage change, by
      dividing the new amount by the multiplier."
    kcs: ["kc.mth.o.number.reverse_percentage"]
  - term: fraction
    definition: "Fraction: a number written as numerator over denominator, meaning the numerator divided by the
      denominator, or that many equal parts of a whole."
    kcs: ["kc.mth.o.number.fraction_arithmetic", "kc.mth.o.number.fdp_conversion"]
  - term: numerator
    definition: "Numerator: the top number of a fraction; it shows how many of the equal parts are taken."
    kcs: ["kc.mth.o.number.fraction_arithmetic", "kc.mth.o.algebra_and_graphs.algebraic_fractions"]
  - term: denominator
    definition: "Denominator: the bottom number of a fraction; it shows how many equal parts the whole is split
      into."
    kcs: ["kc.mth.o.number.fraction_arithmetic", "kc.mth.o.algebra_and_graphs.algebraic_fractions"]
  - term: common denominator
    definition: "Common denominator: a denominator shared by two or more fractions, usually the lowest common
      multiple of their denominators; needed to add or subtract fractions."
    kcs: ["kc.mth.o.number.fraction_arithmetic", "kc.mth.o.algebra_and_graphs.algebraic_fractions"]
  - term: improper fraction
    definition: "Improper fraction: a fraction whose numerator is greater than or equal to its denominator, such
      as seven thirds."
    kcs: ["kc.mth.o.number.fraction_arithmetic"]
  - term: mixed number
    definition: "Mixed number: a whole number and a proper fraction together, such as 'two and one third'; change
      it to an improper fraction before multiplying or dividing."
    kcs: ["kc.mth.o.number.fraction_arithmetic"]
  - term: simplest form
    definition: "Simplest form: a fraction or ratio whose parts have no common factor other than one, found by
      dividing every part by the highest common factor."
    kcs: ["kc.mth.o.number.fraction_arithmetic", "kc.mth.o.number.ratio_share"]
  - term: simplify
    definition: "Simplify: write an expression, fraction or surd in a shorter equivalent form, by cancelling
      common factors, collecting like terms or using the laws of indices."
    kcs: ["kc.mth.o.algebra_and_graphs.algebraic_fractions", "kc.mth.o.algebra_and_graphs.index_laws_algebra", kc.mth.o.number.surds]
  - term: reciprocal
    definition: "Reciprocal: one divided by a number, so a number times its reciprocal is one; the reciprocal of a
      / b is b / a. Dividing by a fraction means multiplying by its reciprocal."
    kcs: ["kc.mth.o.number.fraction_arithmetic", "kc.mth.o.number.index_laws_numeric", "kc.mth.o.coordinate_geometry.perpendicular_lines"]
  - term: decimal
    definition: "Decimal: a number written with a decimal point, where the places after the point are tenths,
      hundredths, thousandths and so on."
    kcs: ["kc.mth.o.number.fdp_conversion", "kc.mth.o.number.ordering_quantities"]
  - term: recurring decimal
    definition: "Recurring decimal: a decimal in which a digit or group of digits repeats forever, shown with dots
      over the repeating digits; every recurring decimal can be written as a fraction."
    kcs: ["kc.mth.o.number.fdp_conversion"]
  - term: ascending
    definition: "Ascending: in order from smallest to largest."
    kcs: ["kc.mth.o.number.ordering_quantities"]
  - term: descending
    definition: "Descending: in order from largest to smallest."
    kcs: ["kc.mth.o.number.ordering_quantities"]
  - term: order of operations
    definition: "Order of operations: brackets first, then indices (powers and roots), then multiplication and
      division from left to right, then addition and subtraction from left to right."
    kcs: ["kc.mth.o.number.order_of_operations"]
  - term: brackets
    definition: "Brackets: symbols ( ) that group part of a calculation or expression; the part inside is worked
      out first."
    kcs: ["kc.mth.o.number.order_of_operations"]
  - term: negative number
    definition: "Negative number: a number less than zero. Multiplying or dividing two negatives gives a positive;
      a negative and a positive give a negative."
    kcs: ["kc.mth.o.number.order_of_operations"]
  - term: index
    aliases: [indices, exponent, power]
    definition: "Index (power, exponent): the small raised number that shows how many times the base is multiplied
      by itself; in 'a to the power n', n is the index."
    kcs: ["kc.mth.o.number.powers_and_roots", "kc.mth.o.number.index_laws_numeric", "kc.mth.o.algebra_and_graphs.index_laws_algebra"]
  - term: laws of indices
    definition: "Laws of indices: for the same base, multiply by adding indices, divide by subtracting indices,
      and raise a power to a power by multiplying indices; any non-zero base to the power zero is one."
    kcs: ["kc.mth.o.algebra_and_graphs.index_laws_algebra"]
  - term: negative index
    definition: "Negative index: a to the power minus n equals one over a to the power n; it gives a reciprocal,
      not a negative number."
    kcs: ["kc.mth.o.number.index_laws_numeric"]
  - term: fractional index
    definition: "Fractional index: a to the power one over n is the nth root of a; a to the power m over n is the
      nth root of a, raised to the power m."
    kcs: ["kc.mth.o.number.index_laws_numeric"]
  - term: root
    definition: "Root: the nth root of a number is the value that, raised to the power n, gives that number; the
      square root and cube root are the cases n = two and n = three."
    kcs: ["kc.mth.o.number.index_laws_numeric"]
  - term: square
    definition: "Square: a number multiplied by itself; 'n squared' means n x n."
    kcs: ["kc.mth.o.number.powers_and_roots"]
  - term: square root
    definition: "Square root: a number which, multiplied by itself, gives the original number; every positive
      number has a positive and a negative square root, and the root sign means the positive one."
    kcs: ["kc.mth.o.number.powers_and_roots", kc.mth.o.number.surds, kc.mth.o.trigonometry.pythagoras]
  - term: cube
    definition: "Cube: a number multiplied by itself and then by itself again; 'n cubed' means n x n x n."
    kcs: ["kc.mth.o.number.powers_and_roots"]
  - term: cube root
    definition: "Cube root: the number which, cubed, gives the original number; the cube root of a negative number
      is negative."
    kcs: ["kc.mth.o.number.powers_and_roots"]
  - term: standard form
    definition: "Standard form: a number written as A x ten to the power n, where A is at least one and less than
      ten and n is an integer."
    kcs: ["kc.mth.o.number.standard_form_convert", "kc.mth.o.number.standard_form_calc"]
  - term: ordinary form
    definition: "Ordinary form: a number written out in full with all its digits, not in standard form."
    kcs: ["kc.mth.o.number.standard_form_convert"]
  - term: power of ten
    definition: "Power of ten: ten to the power n; a positive n makes a number larger and a negative n makes it
      smaller (a decimal)."
    kcs: ["kc.mth.o.number.standard_form_convert", "kc.mth.o.number.standard_form_calc"]
  - term: surd
    definition: "Surd: a square root (or other root) that cannot be written as a whole number or fraction, such as
      the square root of two; it is left in root form to keep the value exact."
    kcs: [kc.mth.o.number.surds]
  - term: square factor
    definition: "Square factor: a factor that is a perfect square, used to simplify a surd: the square root of 'a
      squared times b' equals a times the square root of b."
    kcs: [kc.mth.o.number.surds]
  - term: rationalise
    aliases: [rationalising]
    definition: "Rationalise the denominator: remove the surd from the bottom of a fraction by multiplying top and
      bottom by that square root, since 'root a times root a' equals a."
    kcs: [kc.mth.o.number.surds]
  - term: factor
    definition: "Factor: a whole number that divides into another whole number exactly, with no remainder."
    kcs: ["kc.mth.o.number.prime_factors", "kc.mth.o.number.hcf_lcm"]
  - term: multiple
    definition: "Multiple: the result of multiplying a number by a whole number; the multiples of n are n, two n,
      three n and so on."
    kcs: ["kc.mth.o.number.hcf_lcm"]
  - term: prime number
    aliases: [prime]
    definition: "Prime number: a whole number with exactly two factors, one and itself. One is not prime; two is
      the only even prime."
    kcs: ["kc.mth.o.number.prime_factors"]
    wrong: [1 is a prime number, one is a prime number]
  - term: prime factor
    definition: "Prime factor: a factor of a number that is itself a prime number."
    kcs: ["kc.mth.o.number.prime_factors", "kc.mth.o.number.hcf_lcm"]
  - term: product of prime factors
    definition: "Product of prime factors: a whole number written as prime numbers multiplied together, usually
      with indices; each whole number greater than one has exactly one such product, apart from order."
    kcs: ["kc.mth.o.number.prime_factors"]
  - term: highest common factor
    definition: "Highest common factor (HCF): the largest number, or expression, that is a factor of each of the
      given numbers or terms."
    kcs: ["kc.mth.o.number.hcf_lcm", "kc.mth.o.algebra_and_graphs.factorise_common"]
    cues: [HCF]
  - term: lowest common multiple
    definition: "Lowest common multiple (LCM): the smallest positive number that is a multiple of each of the
      given numbers."
    kcs: ["kc.mth.o.number.hcf_lcm"]
    cues: [LCM]
  - term: set
    definition: "Set: a collection of items, called elements, usually listed inside curly brackets { }."
    kcs: ["kc.mth.o.number.venn_counting"]
  - term: element
    definition: "Element: one member of a set; membership is written with the symbol ∈."
    kcs: ["kc.mth.o.number.venn_counting"]
  - term: universal set
    definition: "Universal set: the set of all the elements being considered, shown by the rectangle in a Venn
      diagram and written with the symbol ℰ."
    kcs: ["kc.mth.o.number.venn_counting"]
  - term: venn diagram
    definition: "Venn diagram: a rectangle for the universal set with overlapping circles for sets; the overlap
      holds elements in both sets, and the space outside the circles holds elements in neither."
    kcs: ["kc.mth.o.number.venn_counting"]
  - term: union
    definition: "Union: A union B is the set of elements in A or B or both, written A ∪ B."
    kcs: ["kc.mth.o.number.venn_counting"]
  - term: intersection
    definition: "Intersection: A intersection B is the set of elements in both A and B, written A ∩ B. For graphs,
      a point of intersection is where two graphs meet."
    kcs: ["kc.mth.o.number.venn_counting", "kc.mth.o.algebra_and_graphs.graphical_solutions"]
  - term: complement
    definition: "Complement: the complement of A, written A', is every element of the universal set that is not in
      A."
    kcs: ["kc.mth.o.number.venn_counting"]
  - term: rounding
    aliases: [round]
    definition: "Rounding: writing a number to a given accuracy; look at the next digit, and if it is five or more
      round up, otherwise round down."
    kcs: [kc.mth.o.number.rounding, kc.mth.o.number.estimation]
  - term: decimal place
    definition: "Decimal place: a position after the decimal point; rounding to 'n decimal places' keeps n digits
      after the point."
    kcs: [kc.mth.o.number.rounding, kc.mth.o.number.bounds]
  - term: significant figure
    definition: "Significant figure: each digit of a number counted from its first non-zero digit; zeros before
      that digit, as in nought point nought five, are not significant."
    kcs: [kc.mth.o.number.rounding, kc.mth.o.number.estimation, kc.mth.o.number.bounds]
  - term: estimate
    aliases: [estimation]
    definition: "Estimate: an approximate value; for a calculation, round each number to one significant figure
      and work out the simpler calculation."
    kcs: [kc.mth.o.number.estimation]
  - term: accuracy
    definition: "Accuracy: the unit a value has been rounded to, such as the nearest ten or two significant
      figures; the bounds are half of that unit either side."
    kcs: [kc.mth.o.number.bounds, "kc.mth.o.number.bounds_calc"]
  - term: bound
    definition: "Bound: a limit of the possible true values of a rounded number; the true value lies from the
      lower bound up to, but not including, the upper bound."
    kcs: [kc.mth.o.number.bounds, "kc.mth.o.number.bounds_calc"]
  - term: lower bound
    definition: "Lower bound: the smallest value that rounds to the given number, found by subtracting half a unit
      of the accuracy."
    kcs: [kc.mth.o.number.bounds, "kc.mth.o.number.bounds_calc"]
  - term: upper bound
    definition: "Upper bound: the value half a unit of the accuracy above the rounded number; true values are less
      than it."
    kcs: [kc.mth.o.number.bounds, "kc.mth.o.number.bounds_calc"]
  - term: maximum
    definition: "Maximum: the greatest value; on a curve, a turning point where the gradient changes from positive
      through zero to negative."
    kcs: ["kc.mth.o.calculus.stationary_points", "kc.mth.o.algebra_and_graphs.quadratic_features"]
  - term: minimum
    definition: "Minimum: the least value; on a curve, a turning point where the gradient changes from negative
      through zero to positive."
    kcs: ["kc.mth.o.calculus.stationary_points", "kc.mth.o.algebra_and_graphs.quadratic_features"]
  - term: ratio
    definition: "Ratio: a comparison of quantities written a : b; to share in a ratio, divide the total by the sum
      of the parts, then multiply by each part."
    kcs: ["kc.mth.o.number.ratio_share", "kc.mth.o.geometry.map_scales"]
  - term: proportion
    definition: "Proportion: a part compared with the whole, as a fraction, decimal or percentage; quantities 'in
      proportion' keep the same ratio."
    kcs: ["kc.mth.o.number.ratio_share", "kc.mth.o.statistics.pie_charts"]
  - term: direct proportion
    aliases: [direct variation, varies directly, proportional]
    definition: "Direct proportion: y = k x for a constant k, so if one quantity is multiplied by a number the
      other is multiplied by the same number. y may also vary directly as a power, such as y = k x squared."
    kcs: ["kc.mth.o.number.direct_proportion", "kc.mth.o.algebra_and_graphs.variation"]
  - term: inverse proportion
    aliases: [inverse variation, varies inversely, inversely proportional]
    definition: "Inverse proportion: y = k / x for a constant k, so if one quantity is multiplied by a number the
      other is divided by it. y may also vary inversely as a power, such as y = k / x squared."
    kcs: ["kc.mth.o.number.direct_proportion", "kc.mth.o.algebra_and_graphs.variation"]
  - term: constant of proportionality
    definition: "Constant of proportionality: the fixed number k in a variation, such as y = k x or y = k / x;
      find it by substituting one known pair of values."
    kcs: ["kc.mth.o.algebra_and_graphs.variation"]
  - term: unitary method
    definition: "Unitary method: first find the value for one unit, then multiply to get the value for the number
      of units required."
    kcs: ["kc.mth.o.number.direct_proportion"]
  - term: expression
    definition: "Expression: a collection of terms with letters and numbers, such as three x + y, with no equals
      sign; it can be simplified but not solved."
    kcs: ["kc.mth.o.algebra_and_graphs.substitution", "kc.mth.o.algebra_and_graphs.expand_brackets", "kc.mth.o.algebra_and_graphs.factorise_common"]
  - term: equation
    definition: "Equation: a statement that two expressions are equal, which is true only for certain values of
      the unknown; solving it finds those values."
    kcs: ["kc.mth.o.algebra_and_graphs.linear_equations", "kc.mth.o.coordinate_geometry.line_equation"]
  - term: formula
    aliases: [formulae]
    definition: "Formula: a rule written in letters that connects quantities, such as A = l x w; the plural is
      formulae."
    kcs: ["kc.mth.o.algebra_and_graphs.substitution", "kc.mth.o.algebra_and_graphs.change_subject"]
  - term: unknown
    definition: "Unknown: a letter standing for a value to be found by solving an equation."
    kcs: ["kc.mth.o.algebra_and_graphs.linear_equations", "kc.mth.o.algebra_and_graphs.forming_equations"]
  - term: coefficient
    definition: "Coefficient: the number multiplying a letter in a term; in 'three x squared', 'three' is the
      coefficient of x squared."
    kcs: ["kc.mth.o.algebra_and_graphs.expand_brackets", "kc.mth.o.algebra_and_graphs.factorise_quadratic", "kc.mth.o.algebra_and_graphs.quadratic_equations"]
  - term: like terms
    definition: "Like terms: terms with exactly the same letters raised to the same powers, such as 'two x y' and
      'five x y'; only like terms can be added or subtracted."
    kcs: ["kc.mth.o.algebra_and_graphs.expand_brackets"]
  - term: evaluate
    definition: "Evaluate: work out the numerical value, for example of an expression after substituting values
      for its letters."
    kcs: ["kc.mth.o.algebra_and_graphs.substitution"]
  - term: substitution
    aliases: [substitute]
    definition: "Substitution: replacing a letter with a given number or expression; in simultaneous equations,
      putting the expression for one letter from one equation into the other."
    kcs: ["kc.mth.o.algebra_and_graphs.substitution", "kc.mth.o.algebra_and_graphs.simultaneous_equations", "kc.mth.o.coordinate_geometry.points_on_lines"]
  - term: subject
    definition: "Subject: the single letter on its own on one side of a formula, such as v in v = u + a t."
    kcs: ["kc.mth.o.algebra_and_graphs.change_subject"]
  - term: rearrange
    definition: "Rearrange: change a formula so a different letter is the subject, doing the same inverse
      operation to both sides at each step."
    kcs: ["kc.mth.o.algebra_and_graphs.change_subject"]
  - term: expand
    aliases: [expansion]
    definition: "Expand: multiply out brackets so every term inside is multiplied by the term outside, then
      collect like terms; for two brackets, multiply each term in one by each term in the other."
    kcs: ["kc.mth.o.algebra_and_graphs.expand_brackets"]
  - term: distributive law
    definition: "Distributive law: a(b + c) = a b + a c; multiplication spreads over each term inside the
      bracket."
    kcs: ["kc.mth.o.algebra_and_graphs.expand_brackets"]
  - term: factorise
    aliases: [factorisation, factorised]
    definition: "Factorise: write an expression as a product of factors by putting brackets back in, the reverse
      of expanding."
    kcs: ["kc.mth.o.algebra_and_graphs.factorise_common", "kc.mth.o.algebra_and_graphs.factorise_quadratic"]
  - term: common factor
    definition: "Common factor: a number or letter that divides every term of an expression; take the highest
      common factor outside a bracket to factorise."
    kcs: ["kc.mth.o.algebra_and_graphs.factorise_common"]
  - term: difference of two squares
    definition: "Difference of two squares: a squared - b squared = (a - b)(a + b)."
    kcs: ["kc.mth.o.algebra_and_graphs.factorise_common"]
  - term: factor pair
    definition: "Factor pair: two numbers that multiply to a given number; to factorise x squared + b x + c, find
      the factor pair of c that adds to b."
    kcs: ["kc.mth.o.algebra_and_graphs.factorise_quadratic"]
  - term: algebraic fraction
    definition: "Algebraic fraction: a fraction with letters in its numerator or denominator; factorise top and
      bottom before cancelling, and cancel only whole factors, never single terms."
    kcs: ["kc.mth.o.algebra_and_graphs.algebraic_fractions"]
  - term: solution
    aliases: [solve]
    definition: "Solution: a value of the unknown that makes an equation or inequality true; to solve is to find
      all such values."
    kcs: ["kc.mth.o.algebra_and_graphs.linear_equations", "kc.mth.o.algebra_and_graphs.quadratic_equations", "kc.mth.o.algebra_and_graphs.linear_inequalities"]
  - term: linear equation
    definition: "Linear equation: an equation in which the unknown appears only to the power one, with no squares
      or products of unknowns; its graph is a straight line."
    kcs: ["kc.mth.o.algebra_and_graphs.linear_equations"]
  - term: simultaneous equations
    aliases: [simultaneous]
    definition: "Simultaneous equations: two equations in two unknowns that are both true at the same time; the
      solution is the pair of values that fits both."
    kcs: ["kc.mth.o.algebra_and_graphs.simultaneous_equations"]
  - term: elimination
    aliases: [eliminate]
    definition: "Elimination: removing one unknown from simultaneous equations by making its coefficients equal,
      then adding or subtracting the equations."
    kcs: ["kc.mth.o.algebra_and_graphs.simultaneous_equations"]
  - term: consecutive
    definition: "Consecutive: following one after another in order with no gaps, such as consecutive integers n, n
      + one, n + two."
    kcs: ["kc.mth.o.algebra_and_graphs.forming_equations", "kc.mth.o.algebra_and_graphs.linear_sequences"]
  - term: inequality
    aliases: [inequalities]
    definition: "Inequality: a statement using <, >, ≤ or ≥. Solve it like an equation, but reverse the sign when
      multiplying or dividing both sides by a negative number."
    kcs: ["kc.mth.o.algebra_and_graphs.linear_inequalities"]
  - term: integer
    definition: "Integer: a whole number, which may be positive, negative or zero."
    kcs: ["kc.mth.o.algebra_and_graphs.linear_inequalities"]
  - term: number line
    definition: "Number line: a line marked with numbers in order; an inequality is shown with an open circle for
      < or > and a filled circle for ≤ or ≥."
    kcs: ["kc.mth.o.algebra_and_graphs.linear_inequalities"]
  - term: quadratic
    aliases: [quadratic expression]
    definition: "Quadratic: an expression a x squared + b x + c with a not zero, where the highest power of x is
      two."
    kcs: ["kc.mth.o.algebra_and_graphs.factorise_quadratic", "kc.mth.o.algebra_and_graphs.quadratic_equations"]
  - term: quadratic equation
    definition: "Quadratic equation: an equation a x squared + b x + c = zero, with a not zero; it has at most two
      solutions."
    kcs: ["kc.mth.o.algebra_and_graphs.quadratic_equations"]
  - term: quadratic formula
    definition: "Quadratic formula: the solutions of a x squared + b x + c = zero are x = (- b ± square root of (b
      squared - four a c)) / two a."
    kcs: ["kc.mth.o.algebra_and_graphs.quadratic_equations"]
  - term: discriminant
    definition: "Discriminant: b squared - four a c for a x squared + b x + c = zero; positive gives two real
      solutions, zero gives one repeated solution, negative gives no real solutions."
    kcs: ["kc.mth.o.algebra_and_graphs.quadratic_equations"]
  - term: quadratic function
    definition: "Quadratic function: y = a x squared + b x + c; its graph is a 'U' shaped curve if a is positive
      and an upside-down 'U' if a is negative."
    kcs: ["kc.mth.o.algebra_and_graphs.quadratic_features"]
  - term: cubic
    definition: "Cubic: a function or expression in which the highest power of x is three, such as y = x cubed -
      two x."
    kcs: ["kc.mth.o.algebra_and_graphs.tables_of_values"]
  - term: table of values
    definition: "Table of values: a table of chosen x values and the y values worked out from the function, used
      to plot its graph."
    kcs: ["kc.mth.o.algebra_and_graphs.tables_of_values"]
  - term: turning point
    definition: "Turning point: a point where a curve changes from going up to going down, or the reverse; it is a
      maximum or a minimum, and the gradient there is zero."
    kcs: ["kc.mth.o.algebra_and_graphs.quadratic_features", "kc.mth.o.calculus.stationary_points"]
  - term: line of symmetry
    definition: "Line of symmetry: a mirror line that divides a shape into two matching halves. For a quadratic
      graph it is the vertical line through the turning point."
    kcs: [kc.mth.o.geometry.symmetry, "kc.mth.o.algebra_and_graphs.quadratic_features"]
  - term: function
    definition: "Function: a rule that maps each input to exactly one output, written f(x); f(a) means the output
      when the input is a."
    kcs: ["kc.mth.o.algebra_and_graphs.function_notation"]
  - term: input
    definition: "Input: the value put into a function, the x in f(x)."
    kcs: ["kc.mth.o.algebra_and_graphs.function_notation"]
  - term: output
    definition: "Output: the value a function gives for an input, the value of f(x)."
    kcs: ["kc.mth.o.algebra_and_graphs.function_notation"]
  - term: composite function
    definition: "Composite function: 'fg(x)' means f(g(x)); apply g first, then apply f to the result."
    kcs: ["kc.mth.o.algebra_and_graphs.function_notation"]
  - term: inverse function
    definition: "Inverse function: the function that undoes f, mapping each output back to its input; find it by
      writing y = f(x), swapping x and y, and making y the subject."
    kcs: ["kc.mth.o.algebra_and_graphs.function_notation"]
  - term: sequence
    definition: "Sequence: an ordered list of numbers that follow a rule."
    kcs: ["kc.mth.o.algebra_and_graphs.linear_sequences", "kc.mth.o.algebra_and_graphs.quadratic_sequences"]
  - term: term
    definition: "Term: one number in a sequence, named by its position; in algebra, a term is also one part of an
      expression separated by + or - signs."
    kcs: ["kc.mth.o.algebra_and_graphs.linear_sequences"]
  - term: nth term
    definition: "nth term: a formula in n that gives the term in position n; substituting n gives that term."
    kcs: ["kc.mth.o.algebra_and_graphs.linear_sequences", "kc.mth.o.algebra_and_graphs.quadratic_sequences"]
  - term: common difference
    definition: "Common difference: the fixed amount added each time in a linear sequence; it is the coefficient
      of n in the nth term."
    kcs: ["kc.mth.o.algebra_and_graphs.linear_sequences"]
  - term: linear sequence
    definition: "Linear sequence: a sequence that goes up or down by the same amount each time; its nth term is d
      n + (a - d), with a the first term and d the common difference."
    kcs: ["kc.mth.o.algebra_and_graphs.linear_sequences"]
  - term: quadratic sequence
    definition: "Quadratic sequence: a sequence whose second differences are constant; its nth term has n squared
      with a coefficient of half the second difference."
    kcs: ["kc.mth.o.algebra_and_graphs.quadratic_sequences"]
  - term: first difference
    definition: "First difference: the gap between one term of a sequence and the next."
    kcs: ["kc.mth.o.algebra_and_graphs.quadratic_sequences"]
  - term: second difference
    definition: "Second difference: the gap between consecutive first differences; constant for a quadratic
      sequence."
    kcs: ["kc.mth.o.algebra_and_graphs.quadratic_sequences"]
  - term: distance-time graph
    definition: "Distance-time graph: distance on the vertical axis against time; the gradient is the speed, and a
      horizontal line means the object is stopped."
    kcs: ["kc.mth.o.algebra_and_graphs.travel_graphs"]
  - term: speed-time graph
    definition: "Speed-time graph: speed on the vertical axis against time; the gradient is the acceleration and
      the area under the graph is the distance travelled."
    kcs: ["kc.mth.o.algebra_and_graphs.travel_graphs"]
  - term: acceleration
    definition: "Acceleration: the rate of change of speed (velocity), the gradient of a speed-time graph,
      measured in units such as m/s squared."
    kcs: ["kc.mth.o.algebra_and_graphs.travel_graphs"]
  - term: deceleration
    definition: "Deceleration: slowing down; a negative acceleration, shown by a downward-sloping line on a
      speed-time graph."
    kcs: ["kc.mth.o.algebra_and_graphs.travel_graphs"]
  - term: velocity
    definition: "Velocity: speed in a given direction."
    kcs: ["kc.mth.o.algebra_and_graphs.travel_graphs"]
  - term: derivative
    definition: "Derivative: dy/dx, the gradient function of a curve; the derivative of x to the power n is n x to
      the power (n - one)."
    kcs: ["kc.mth.o.calculus.differentiate_powers", "kc.mth.o.calculus.tangents_normals", "kc.mth.o.calculus.stationary_points"]
  - term: differentiate
    aliases: [differentiation]
    definition: "Differentiate: find the derivative; multiply each term by its power of x and reduce the power by
      one. A constant term differentiates to zero."
    kcs: ["kc.mth.o.calculus.differentiate_powers"]
  - term: gradient function
    definition: "Gradient function: the derivative dy/dx, which gives the gradient of the curve at any value of
      x."
    kcs: ["kc.mth.o.calculus.differentiate_powers"]
  - term: tangent
    definition: "Tangent: a straight line that touches a curve or circle at a point, with the same gradient as the
      curve there. In trigonometry, tan of an angle = opposite / adjacent."
    kcs: ["kc.mth.o.calculus.tangents_normals", "kc.mth.o.geometry.circle_theorems_basic", "kc.mth.o.trigonometry.trig_side"]
  - term: normal
    definition: "Normal: the line through a point on a curve perpendicular to the tangent there; its gradient is
      the negative reciprocal of the tangent's gradient."
    kcs: ["kc.mth.o.calculus.tangents_normals"]
  - term: stationary point
    definition: "Stationary point: a point on a curve where the gradient dy/dx is zero; it may be a maximum or a
      minimum."
    kcs: ["kc.mth.o.calculus.stationary_points"]
  - term: second derivative
    definition: "Second derivative: the result of differentiating dy/dx again. At a stationary point, a positive
      value means a minimum and a negative value means a maximum."
    kcs: ["kc.mth.o.calculus.stationary_points"]
  - term: integral
    aliases: [integrate, integration]
    definition: "Integration: the reverse of differentiation; x to the power n integrates to x to the power (n +
      one) divided by (n + one), for n not equal to minus one."
    kcs: ["kc.mth.o.calculus.definite_integrals"]
  - term: definite integral
    definition: "Definite integral: an integral between two limits a and b, worked out as F(b) - F(a), where F is
      the integral of the function."
    kcs: ["kc.mth.o.calculus.definite_integrals"]
  - term: limit
    definition: "Limit: one of the two x values that a definite integral runs between; substitute the upper limit,
      then subtract the result for the lower limit."
    kcs: ["kc.mth.o.calculus.definite_integrals"]
  - term: area under a curve
    definition: "Area under a curve: the area between the curve, the x-axis and two x values, found by a definite
      integral; a part below the x-axis gives a negative value."
    kcs: ["kc.mth.o.calculus.definite_integrals"]
  - term: coordinate
    definition: "Coordinate: one of the pair of numbers (x, y) giving the position of a point; x is across from
      the origin and y is up."
    kcs: ["kc.mth.o.coordinate_geometry.points_on_lines", "kc.mth.o.coordinate_geometry.gradient", "kc.mth.o.coordinate_geometry.midpoint"]
  - term: x-coordinate
    definition: "x-coordinate: the first number in (x, y), the horizontal position of a point."
    kcs: ["kc.mth.o.coordinate_geometry.points_on_lines", "kc.mth.o.algebra_and_graphs.graphical_solutions"]
  - term: y-coordinate
    definition: "y-coordinate: the second number in (x, y), the vertical position of a point."
    kcs: ["kc.mth.o.coordinate_geometry.points_on_lines", "kc.mth.o.algebra_and_graphs.graphical_solutions"]
  - term: x-axis
    definition: "x-axis: the horizontal axis; every point on it has y = zero."
    kcs: ["kc.mth.o.coordinate_geometry.axis_intercepts"]
  - term: y-axis
    definition: "y-axis: the vertical axis; every point on it has x = zero."
    kcs: ["kc.mth.o.coordinate_geometry.axis_intercepts"]
  - term: intercept
    definition: "Intercept: a point where a line or curve crosses an axis."
    kcs: ["kc.mth.o.coordinate_geometry.axis_intercepts", "kc.mth.o.algebra_and_graphs.quadratic_features"]
  - term: x-intercept
    definition: "x-intercept: where a graph crosses the x-axis, found by putting y = zero."
    kcs: ["kc.mth.o.coordinate_geometry.axis_intercepts", "kc.mth.o.algebra_and_graphs.quadratic_features"]
  - term: y-intercept
    definition: "y-intercept: where a graph crosses the y-axis, found by putting x = zero; in y = m x + c it is
      c."
    kcs: ["kc.mth.o.coordinate_geometry.axis_intercepts", "kc.mth.o.coordinate_geometry.line_equation"]
  - term: gradient
    definition: "Gradient: the steepness of a line, change in y divided by change in x; positive slopes up to the
      right, negative slopes down. For a curve it is the gradient of the tangent."
    kcs: ["kc.mth.o.coordinate_geometry.gradient", "kc.mth.o.coordinate_geometry.line_equation", "kc.mth.o.calculus.differentiate_powers"]
  - term: line segment
    definition: "Line segment: the part of a line between two end points; its length is the square root of
      (difference in x) squared + (difference in y) squared."
    kcs: ["kc.mth.o.coordinate_geometry.segment_length", "kc.mth.o.coordinate_geometry.midpoint"]
  - term: midpoint
    definition: "Midpoint: the point halfway along a line segment, at the mean of the x-coordinates and the mean
      of the y-coordinates. For a class, the value halfway between its ends."
    kcs: ["kc.mth.o.coordinate_geometry.midpoint", "kc.mth.o.statistics.grouped_mean"]
  - term: negative reciprocal
    definition: "Negative reciprocal: minus one divided by a number; a line perpendicular to a line of gradient m
      has gradient minus one over m."
    kcs: ["kc.mth.o.coordinate_geometry.perpendicular_lines"]
  - term: parallel
    definition: "Parallel: lines that stay the same distance apart and never meet; parallel straight lines have
      equal gradients."
    kcs: ["kc.mth.o.coordinate_geometry.parallel_lines", "kc.mth.o.geometry.parallel_line_angles"]
  - term: perpendicular
    definition: "Perpendicular: at right angles; two lines are perpendicular when the product of their gradients
      is minus one."
    kcs: ["kc.mth.o.coordinate_geometry.perpendicular_lines", "kc.mth.o.geometry.shape_properties"]
  - term: horizontal
    definition: "Horizontal: level, parallel to the x-axis or the ground; a horizontal line has gradient zero."
    kcs: ["kc.mth.o.coordinate_geometry.gradient", "kc.mth.o.trigonometry.elevation_depression"]
  - term: vertical
    definition: "Vertical: straight up and down, parallel to the y-axis; a vertical line x = a has no defined
      gradient."
    kcs: ["kc.mth.o.coordinate_geometry.gradient", "kc.mth.o.trigonometry.elevation_depression"]
  - term: angle
    definition: "Angle: the amount of turn between two lines that meet at a point, measured in degrees."
    kcs: ["kc.mth.o.geometry.angle_facts"]
  - term: acute
    definition: "Acute angle: an angle less than ninety degrees."
    kcs: ["kc.mth.o.trigonometry.sine_rule"]
  - term: obtuse
    definition: "Obtuse angle: an angle greater than ninety degrees and less than one hundred and eighty degrees."
    kcs: ["kc.mth.o.trigonometry.sine_rule"]
  - term: reflex
    definition: "Reflex angle: an angle greater than one hundred and eighty degrees and less than three hundred
      and sixty degrees."
    kcs: ["kc.mth.o.geometry.angle_facts"]
  - term: right angle
    definition: "Right angle: an angle of exactly ninety degrees, a quarter turn."
    kcs: ["kc.mth.o.geometry.angle_facts"]
  - term: angles at a point
    definition: "Angles at a point: the angles around a single point add up to three hundred and sixty degrees."
    kcs: ["kc.mth.o.geometry.angle_facts"]
  - term: straight line
    definition: "Straight line: a line with no bends; angles at a point on one side of a straight line add up to
      one hundred and eighty degrees."
    kcs: ["kc.mth.o.geometry.angle_facts"]
  - term: vertically opposite
    definition: "Vertically opposite angles: the angles opposite each other where two straight lines cross; they
      are equal."
    kcs: ["kc.mth.o.geometry.angle_facts"]
  - term: transversal
    definition: "Transversal: a line that crosses two or more parallel lines."
    kcs: ["kc.mth.o.geometry.parallel_line_angles"]
  - term: alternate
    definition: "Alternate angles: angles on opposite sides of a transversal, between the parallel lines (a Z
      shape); they are equal."
    kcs: ["kc.mth.o.geometry.parallel_line_angles"]
  - term: corresponding
    definition: "Corresponding angles: angles in the same position at each parallel line on a transversal (an F
      shape); they are equal. In similar shapes, corresponding sides match up."
    kcs: ["kc.mth.o.geometry.parallel_line_angles", "kc.mth.o.geometry.similar_lengths"]
  - term: co-interior
    definition: "Co-interior angles: angles on the same side of a transversal, between the parallel lines (a C
      shape); they add up to one hundred and eighty degrees."
    kcs: ["kc.mth.o.geometry.parallel_line_angles"]
  - term: interior angle
    definition: "Interior angle: an angle inside a polygon at a vertex; the interior angles of an n-sided polygon
      add up to (n - two) x one hundred and eighty degrees."
    kcs: ["kc.mth.o.geometry.polygon_angles", "kc.mth.o.geometry.triangle_angles"]
  - term: exterior angle
    definition: "Exterior angle: the angle between one side of a polygon and the next side extended; exterior
      angles add to three hundred and sixty degrees, and a triangle's equals the sum of the two opposite interior
      angles."
    kcs: ["kc.mth.o.geometry.polygon_angles", "kc.mth.o.geometry.triangle_angles"]
  - term: polygon
    definition: "Polygon: a closed flat shape with three or more straight sides."
    kcs: ["kc.mth.o.geometry.shape_properties", "kc.mth.o.geometry.polygon_angles"]
  - term: regular polygon
    definition: "Regular polygon: a polygon with all sides equal and all angles equal; each exterior angle is
      three hundred and sixty degrees divided by the number of sides."
    kcs: ["kc.mth.o.geometry.polygon_angles", kc.mth.o.geometry.symmetry]
  - term: pentagon
    definition: "Pentagon: a polygon with five sides."
    kcs: ["kc.mth.o.geometry.polygon_angles", kc.mth.o.geometry.symmetry]
  - term: hexagon
    definition: "Hexagon: a polygon with six sides."
    kcs: ["kc.mth.o.geometry.polygon_angles", kc.mth.o.geometry.symmetry]
  - term: heptagon
    definition: "Heptagon: a polygon with seven sides."
    kcs: [kc.mth.o.geometry.symmetry]
  - term: octagon
    definition: "Octagon: a polygon with eight sides."
    kcs: ["kc.mth.o.geometry.polygon_angles", kc.mth.o.geometry.symmetry]
  - term: nonagon
    definition: "Nonagon: a polygon with nine sides."
    kcs: [kc.mth.o.geometry.symmetry]
  - term: decagon
    definition: "Decagon: a polygon with ten sides."
    kcs: ["kc.mth.o.geometry.polygon_angles", kc.mth.o.geometry.symmetry]
  - term: dodecagon
    definition: "Dodecagon: a polygon with twelve sides."
    kcs: [kc.mth.o.geometry.symmetry]
  - term: triangle
    definition: "Triangle: a polygon with three sides; its interior angles add up to one hundred and eighty
      degrees."
    kcs: ["kc.mth.o.geometry.triangle_angles", "kc.mth.o.geometry.shape_properties"]
  - term: equilateral
    definition: "Equilateral triangle: a triangle with all three sides equal and all three angles sixty degrees."
    kcs: ["kc.mth.o.geometry.shape_properties", "kc.mth.o.geometry.triangle_angles"]
  - term: isosceles
    aliases: [isosceles triangle]
    definition: "Isosceles triangle: a triangle with two equal sides; the two angles opposite the equal sides (the
      base angles) are equal."
    kcs: ["kc.mth.o.geometry.triangle_angles", "kc.mth.o.geometry.angle_facts", "kc.mth.o.geometry.shape_properties"]
  - term: scalene
    definition: "Scalene triangle: a triangle with all three sides of different lengths and all three angles
      different."
    kcs: ["kc.mth.o.geometry.shape_properties"]
  - term: right-angled triangle
    definition: "Right-angled triangle: a triangle with one angle of ninety degrees; the side opposite it is the
      hypotenuse."
    kcs: [kc.mth.o.trigonometry.pythagoras, "kc.mth.o.trigonometry.trig_side", "kc.mth.o.trigonometry.trig_angle"]
  - term: quadrilateral
    definition: "Quadrilateral: a polygon with four sides; its interior angles add up to three hundred and sixty
      degrees."
    kcs: ["kc.mth.o.geometry.shape_properties"]
  - term: rectangle
    aliases: [rectangular]
    definition: "Rectangle: a quadrilateral with four right angles and opposite sides equal; area = length x
      width."
    kcs: ["kc.mth.o.geometry.shape_properties", "kc.mth.o.mensuration.area_perimeter", "kc.mth.o.algebra_and_graphs.forming_equations"]
  - term: parallelogram
    definition: "Parallelogram: a quadrilateral with two pairs of parallel sides; opposite sides and opposite
      angles are equal; area = base x perpendicular height."
    kcs: ["kc.mth.o.geometry.shape_properties", "kc.mth.o.mensuration.area_perimeter"]
  - term: rhombus
    definition: "Rhombus: a parallelogram with all four sides equal; its diagonals bisect each other at right
      angles."
    kcs: ["kc.mth.o.geometry.shape_properties"]
  - term: kite
    definition: "Kite: a quadrilateral with two pairs of equal adjacent sides; its diagonals cross at right angles
      and it has one line of symmetry."
    kcs: ["kc.mth.o.geometry.shape_properties"]
  - term: trapezium
    aliases: [trapezia]
    definition: "Trapezium (plural trapezia): a quadrilateral with one pair of parallel sides; area = half of (a +
      b) x h, with a and b the parallel sides and h the distance between them."
    kcs: ["kc.mth.o.geometry.shape_properties", "kc.mth.o.mensuration.area_perimeter"]
  - term: diagonal
    definition: "Diagonal: a straight line joining two corners of a shape that are not next to each other."
    kcs: ["kc.mth.o.geometry.shape_properties", "kc.mth.o.trigonometry.three_d"]
  - term: symmetry
    definition: "Symmetry: a shape has symmetry if a reflection in a line or a rotation about its centre leaves it
      looking exactly the same."
    kcs: [kc.mth.o.geometry.symmetry]
  - term: rotational symmetry
    definition: "Rotational symmetry: a shape has rotational symmetry if it looks the same after a turn of less
      than a full turn about its centre."
    kcs: [kc.mth.o.geometry.symmetry]
  - term: order of rotational symmetry
    definition: "Order of rotational symmetry: the number of times a shape looks the same during one full turn; a
      shape with no rotational symmetry has order one."
    kcs: [kc.mth.o.geometry.symmetry]
  - term: radius
    aliases: [radii]
    definition: "Radius (plural radii): the distance from the centre of a circle to its edge; half the diameter."
    kcs: ["kc.mth.o.mensuration.circle_measures", "kc.mth.o.geometry.circle_theorems_basic"]
  - term: diameter
    definition: "Diameter: a straight line through the centre of a circle from edge to edge, twice the radius."
    kcs: ["kc.mth.o.mensuration.circle_measures", "kc.mth.o.geometry.circle_theorems_basic"]
  - term: circumference
    definition: "Circumference: the distance around a circle, C = π d = two π r; also the edge of the circle
      itself."
    kcs: ["kc.mth.o.mensuration.circle_measures", "kc.mth.o.geometry.circle_theorems_basic"]
  - term: arc
    definition: "Arc: part of the circumference of a circle; in constructions, a curve drawn with compasses."
    kcs: ["kc.mth.o.mensuration.arcs_sectors", kc.mth.o.geometry.constructions]
  - term: arc length
    definition: "Arc length: (θ / three hundred and sixty) x two π r, where θ is the angle at the centre in
      degrees."
    kcs: ["kc.mth.o.mensuration.arcs_sectors"]
  - term: sector
    definition: "Sector: the part of a circle between two radii and an arc, like a slice of pie; area = (θ / three
      hundred and sixty) x π r squared."
    kcs: ["kc.mth.o.mensuration.arcs_sectors", "kc.mth.o.statistics.pie_charts"]
  - term: semicircle
    definition: "Semicircle: half of a circle, cut off by a diameter; the angle in a semicircle is a right angle."
    kcs: ["kc.mth.o.geometry.circle_theorems_basic", "kc.mth.o.mensuration.circle_measures"]
  - term: segment
    definition: "Segment: the part of a circle between a chord and an arc."
    kcs: ["kc.mth.o.geometry.circle_theorems_cyclic"]
  - term: circle theorem
    definition: "Circle theorem: a fact about angles in circles, such as the angle in a semicircle is ninety
      degrees and a tangent is perpendicular to the radius at the point of contact."
    kcs: ["kc.mth.o.geometry.circle_theorems_basic", "kc.mth.o.geometry.circle_theorems_cyclic"]
  - term: angle at the centre
    definition: "Angle at the centre: the angle between two radii; it is twice the angle at the circumference
      standing on the same arc."
    kcs: ["kc.mth.o.geometry.circle_theorems_basic", "kc.mth.o.mensuration.arcs_sectors"]
  - term: cyclic quadrilateral
    definition: "Cyclic quadrilateral: a quadrilateral with all four vertices on a circle; its opposite angles add
      up to one hundred and eighty degrees."
    kcs: ["kc.mth.o.geometry.circle_theorems_cyclic"]
  - term: opposite angles
    definition: "Opposite angles: in a cyclic quadrilateral, the angles at opposite corners; each pair adds up to
      one hundred and eighty degrees."
    kcs: ["kc.mth.o.geometry.circle_theorems_cyclic"]
  - term: same segment
    definition: "Same segment: angles at the circumference standing on the same chord, on the same side of it, are
      equal."
    kcs: ["kc.mth.o.geometry.circle_theorems_cyclic"]
  - term: construction
    definition: "Construction: an accurate drawing made with a ruler and compasses (and protractor where allowed),
      leaving the construction arcs visible."
    kcs: [kc.mth.o.geometry.constructions]
  - term: compasses
    definition: "Compasses: a drawing tool with a point and a pencil, used to draw circles and arcs of a fixed
      radius."
    kcs: [kc.mth.o.geometry.constructions]
  - term: protractor
    definition: "Protractor: a tool for measuring and drawing angles in degrees."
    kcs: [kc.mth.o.geometry.constructions]
  - term: bisect
    aliases: [bisector]
    definition: "Bisect: cut into two equal parts; a bisector is the line that does this."
    kcs: [kc.mth.o.geometry.constructions]
  - term: perpendicular bisector
    definition: "Perpendicular bisector: the line through the midpoint of a line segment at right angles to it;
      every point on it is the same distance from both ends."
    kcs: [kc.mth.o.geometry.constructions]
  - term: angle bisector
    definition: "Angle bisector: the line that splits an angle into two equal angles; every point on it is the
      same distance from both arms."
    kcs: [kc.mth.o.geometry.constructions]
  - term: scale
    aliases: [map scale]
    definition: "Scale: the ratio of a length on a map or drawing to the real length, such as one cm to n cm,
      written one : n; multiply the drawing length by n to get the real length."
    kcs: ["kc.mth.o.geometry.map_scales"]
  - term: scale drawing
    definition: "Scale drawing: an accurate drawing in which every length is the real length multiplied by the
      same scale; angles stay the same."
    kcs: ["kc.mth.o.geometry.map_scales"]
  - term: bearing
    aliases: [three-figure bearing]
    definition: "Bearing: a direction given as an angle measured clockwise from north, written with three figures,
      such as zero four five degrees for north-east."
    kcs: [kc.mth.o.geometry.bearings]
    wrong: [anticlockwise from north, anticlockwise from the north]
  - term: back bearing
    definition: "Back bearing: the bearing for the return direction; add one hundred and eighty degrees to the
      bearing, or subtract it if the bearing is one hundred and eighty degrees or more."
    kcs: [kc.mth.o.geometry.bearings]
  - term: clockwise
    definition: "Clockwise: turning in the same direction as the hands of a clock."
    kcs: [kc.mth.o.geometry.bearings, "kc.mth.o.transformations_and_vectors.transform_points"]
  - term: anticlockwise
    definition: "Anticlockwise: turning in the opposite direction to the hands of a clock."
    kcs: ["kc.mth.o.transformations_and_vectors.transform_points"]
  - term: similar
    aliases: [similarity]
    definition: "Similar: shapes with the same shape but not necessarily the same size; corresponding angles are
      equal and corresponding lengths are all in the same ratio."
    kcs: ["kc.mth.o.geometry.similar_lengths", "kc.mth.o.geometry.similar_area_volume"]
  - term: scale factor
    definition: "Scale factor: the number every length is multiplied by in an enlargement or between similar
      shapes, new length divided by original length."
    kcs: ["kc.mth.o.geometry.similar_lengths", "kc.mth.o.transformations_and_vectors.enlargement"]
  - term: length scale factor
    definition: "Length scale factor: the ratio of corresponding lengths of two similar shapes, k."
    kcs: ["kc.mth.o.geometry.similar_area_volume"]
  - term: area scale factor
    definition: "Area scale factor: the ratio of corresponding areas of similar shapes, the square of the length
      scale factor, k squared."
    kcs: ["kc.mth.o.geometry.similar_area_volume", "kc.mth.o.transformations_and_vectors.enlargement"]
  - term: volume scale factor
    definition: "Volume scale factor: the ratio of corresponding volumes of similar solids, the cube of the length
      scale factor, k cubed."
    kcs: ["kc.mth.o.geometry.similar_area_volume"]
  - term: enlargement
    definition: "Enlargement: a transformation that multiplies every distance from a fixed centre by the scale
      factor; the image is similar to the object. A scale factor between zero and one makes it smaller."
    kcs: ["kc.mth.o.transformations_and_vectors.enlargement", "kc.mth.o.transformations_and_vectors.transform_points"]
  - term: centre of enlargement
    definition: "Centre of enlargement: the fixed point from which distances are multiplied by the scale factor in
      an enlargement."
    kcs: ["kc.mth.o.transformations_and_vectors.enlargement", "kc.mth.o.transformations_and_vectors.transform_points"]
  - term: image
    definition: "Image: the shape or point that results after a transformation is applied to the object."
    kcs: ["kc.mth.o.transformations_and_vectors.transform_points", "kc.mth.o.transformations_and_vectors.enlargement"]
  - term: translation
    definition: "Translation: a transformation that slides every point the same distance in the same direction,
      given by a column vector; the image is congruent and not turned."
    kcs: ["kc.mth.o.transformations_and_vectors.transform_points"]
  - term: reflection
    definition: "Reflection: a transformation in a mirror line; each image point is the same distance from the
      line as the object point, on the opposite side."
    kcs: ["kc.mth.o.transformations_and_vectors.transform_points"]
  - term: rotation
    definition: "Rotation: a transformation that turns a shape through an angle, clockwise or anticlockwise, about
      a fixed centre of rotation."
    kcs: ["kc.mth.o.transformations_and_vectors.transform_points"]
  - term: centre of rotation
    definition: "Centre of rotation: the fixed point that a shape turns about in a rotation; it does not move."
    kcs: ["kc.mth.o.transformations_and_vectors.transform_points"]
  - term: vector
    definition: "Vector: a quantity with both size (magnitude) and direction, written as a column vector or a bold
      or underlined letter."
    kcs: ["kc.mth.o.transformations_and_vectors.vector_arithmetic", "kc.mth.o.transformations_and_vectors.vector_magnitude"]
  - term: column vector
    definition: "Column vector: a vector written as two numbers one above the other in brackets; the top is the
      move across (x) and the bottom is the move up (y)."
    kcs: ["kc.mth.o.transformations_and_vectors.vector_arithmetic", "kc.mth.o.transformations_and_vectors.transform_points"]
  - term: component
    definition: "Component: one of the numbers of a column vector; the x component is the top and the y component
      the bottom."
    kcs: ["kc.mth.o.transformations_and_vectors.vector_arithmetic", "kc.mth.o.transformations_and_vectors.vector_magnitude"]
  - term: scalar
    definition: "Scalar: a number with size but no direction; multiplying a vector by a scalar multiplies each
      component by it."
    kcs: ["kc.mth.o.transformations_and_vectors.vector_arithmetic"]
  - term: magnitude
    definition: "Magnitude: the length of a vector; for column vector (x, y) it is the square root of (x squared +
      y squared)."
    kcs: ["kc.mth.o.transformations_and_vectors.vector_magnitude"]
  - term: resultant
    definition: "Resultant: the single vector equal to two or more vectors combined, found by adding their
      components."
    kcs: ["kc.mth.o.transformations_and_vectors.vector_arithmetic"]
  - term: perimeter
    definition: "Perimeter: the total distance around the outside edge of a shape, in units of length."
    kcs: ["kc.mth.o.mensuration.area_perimeter", "kc.mth.o.mensuration.compound_shapes"]
  - term: area
    definition: "Area: the amount of flat surface a shape covers, measured in square units such as cm squared or m
      squared."
    kcs: ["kc.mth.o.mensuration.area_perimeter", "kc.mth.o.mensuration.compound_shapes"]
  - term: perpendicular height
    definition: "Perpendicular height: the height measured at right angles to the base, not along a sloping side."
    kcs: ["kc.mth.o.mensuration.area_perimeter", "kc.mth.o.mensuration.pyramid_cone_sphere"]
  - term: area of a triangle
    definition: "Area of a triangle: half x base x perpendicular height, or half a b sin C using two sides and the
      included angle."
    kcs: ["kc.mth.o.trigonometry.triangle_area_sine"]
  - term: compound shape
    definition: "Compound shape: a shape made of simpler shapes; find its area or volume by adding the parts, or
      by subtracting a part removed."
    kcs: ["kc.mth.o.mensuration.compound_shapes"]
  - term: volume
    definition: "Volume: the amount of space a solid takes up, measured in cubic units such as cm cubed or m
      cubed."
    kcs: ["kc.mth.o.mensuration.prism_volume", "kc.mth.o.mensuration.pyramid_cone_sphere", "kc.mth.o.mensuration.compound_shapes"]
  - term: capacity
    definition: "Capacity: the amount a container can hold, usually measured in litres or millilitres."
    kcs: ["kc.mth.o.mensuration.metric_units", "kc.mth.o.mensuration.prism_volume"]
  - term: surface area
    definition: "Surface area: the total area of all the faces or surfaces of a solid."
    kcs: ["kc.mth.o.mensuration.prism_volume", "kc.mth.o.mensuration.pyramid_cone_sphere"]
  - term: curved surface area
    definition: "Curved surface area: the area of the curved part only of a solid: two π r h for a cylinder, π r l
      for a cone, four π r squared for a sphere."
    kcs: ["kc.mth.o.mensuration.pyramid_cone_sphere"]
  - term: prism
    definition: "Prism: a solid with the same cross-section all along its length; volume = area of cross-section x
      length."
    kcs: ["kc.mth.o.mensuration.prism_volume"]
  - term: cross-section
    definition: "Cross-section: the flat shape you see when a solid is cut straight across; for a prism it is the
      same everywhere along its length."
    kcs: ["kc.mth.o.mensuration.prism_volume"]
  - term: cross-sectional area
    definition: "Cross-sectional area: the area of the cross-section of a solid; for a prism, volume =
      cross-sectional area x length."
    kcs: ["kc.mth.o.mensuration.prism_volume"]
  - term: cuboid
    definition: "Cuboid: a box-shaped solid with six rectangular faces; volume = length x width x height."
    kcs: ["kc.mth.o.mensuration.prism_volume", "kc.mth.o.trigonometry.three_d"]
  - term: cylinder
    definition: "Cylinder: a prism with a circular cross-section; volume = π r squared h."
    kcs: ["kc.mth.o.mensuration.prism_volume", "kc.mth.o.mensuration.compound_shapes"]
  - term: pyramid
    definition: "Pyramid: a solid with a polygon base and triangular faces meeting at a point; volume = one third
      x base area x perpendicular height."
    kcs: ["kc.mth.o.mensuration.pyramid_cone_sphere"]
  - term: cone
    definition: "Cone: a solid with a circular base and a curved surface rising to a point; volume = one third π r
      squared h, curved surface area = π r l."
    kcs: ["kc.mth.o.mensuration.pyramid_cone_sphere"]
  - term: slant height
    definition: "Slant height: the distance l from the tip of a cone to the edge of its base, along the curved
      surface; l squared = r squared + h squared."
    kcs: ["kc.mth.o.mensuration.pyramid_cone_sphere"]
  - term: sphere
    definition: "Sphere: a perfectly round solid; volume = four thirds π r cubed, surface area = four π r
      squared."
    kcs: ["kc.mth.o.mensuration.pyramid_cone_sphere"]
  - term: hemisphere
    definition: "Hemisphere: half of a sphere; volume = two thirds π r cubed, curved surface area = two π r
      squared (add π r squared for the flat face)."
    kcs: ["kc.mth.o.mensuration.pyramid_cone_sphere"]
  - term: metric unit
    definition: "Metric unit: a unit in the system based on tens, such as millimetres, metres, grams and litres;
      'kilo' means one thousand and 'milli' means one thousandth."
    kcs: ["kc.mth.o.mensuration.metric_units"]
  - term: millimetre
    definition: "Millimetre (mm): one thousandth of a metre; ten mm make one cm."
    kcs: ["kc.mth.o.mensuration.metric_units"]
  - term: centimetre
    definition: "Centimetre (cm): one hundredth of a metre; one cm is ten mm."
    kcs: ["kc.mth.o.mensuration.metric_units"]
  - term: kilometre
    definition: "Kilometre (km): one thousand metres."
    kcs: ["kc.mth.o.mensuration.metric_units"]
  - term: square metre
    definition: "Square metre (m squared): the area of a square one metre by one metre; it equals ten thousand cm
      squared."
    kcs: ["kc.mth.o.mensuration.metric_units"]
  - term: hectare
    definition: "Hectare: a unit of area equal to ten thousand square metres."
    kcs: ["kc.mth.o.mensuration.metric_units"]
  - term: cubic centimetre
    definition: "Cubic centimetre (cm cubed): the volume of a cube with edges one cm long; it equals one
      millilitre, and a cubic metre is a million cm cubed."
    kcs: ["kc.mth.o.mensuration.metric_units"]
  - term: litre
    definition: "Litre (l): a unit of capacity equal to one thousand millilitres, or one thousand cm cubed."
    kcs: ["kc.mth.o.mensuration.metric_units"]
  - term: millilitre
    definition: "Millilitre (ml): one thousandth of a litre, equal to one cm cubed."
    kcs: ["kc.mth.o.mensuration.metric_units"]
  - term: tonne
    definition: "Tonne (t): a unit of mass equal to one thousand kilograms."
    kcs: ["kc.mth.o.mensuration.metric_units"]
  - term: trigonometry
    definition: "Trigonometry: using sine, cosine and tangent to link the sides and angles of triangles."
    kcs: ["kc.mth.o.trigonometry.trig_side", "kc.mth.o.trigonometry.three_d"]
  - term: hypotenuse
    definition: "Hypotenuse: the longest side of a right-angled triangle, opposite the right angle."
    kcs: [kc.mth.o.trigonometry.pythagoras, "kc.mth.o.trigonometry.trig_side", "kc.mth.o.trigonometry.trig_angle"]
  - term: opposite
    definition: "Opposite: in a right-angled triangle, the side facing the angle being used; in any triangle, side
      a is opposite angle A."
    kcs: ["kc.mth.o.trigonometry.trig_side", "kc.mth.o.trigonometry.trig_angle", "kc.mth.o.trigonometry.sine_rule"]
  - term: adjacent
    definition: "Adjacent: in a right-angled triangle, the side next to the angle being used that is not the
      hypotenuse."
    kcs: ["kc.mth.o.trigonometry.trig_side", "kc.mth.o.trigonometry.trig_angle"]
  - term: sine
    definition: "Sine: in a right-angled triangle, sin of an angle = opposite / hypotenuse."
    kcs: ["kc.mth.o.trigonometry.trig_side", "kc.mth.o.trigonometry.trig_angle"]
  - term: cosine
    definition: "Cosine: in a right-angled triangle, cos of an angle = adjacent / hypotenuse."
    kcs: ["kc.mth.o.trigonometry.trig_side", "kc.mth.o.trigonometry.trig_angle"]
  - term: inverse sine
    definition: "Inverse sine: the function that gives the angle whose sine is a given value, the shifted sin key
      on a calculator."
    kcs: ["kc.mth.o.trigonometry.trig_angle"]
  - term: inverse cosine
    definition: "Inverse cosine: the function that gives the angle whose cosine is a given value, the shifted cos
      key on a calculator."
    kcs: ["kc.mth.o.trigonometry.trig_angle"]
  - term: inverse tangent
    definition: "Inverse tangent: the function that gives the angle whose tangent is a given value, the shifted
      tan key on a calculator."
    kcs: ["kc.mth.o.trigonometry.trig_angle"]
  - term: pythagoras' theorem
    aliases: [pythagoras]
    definition: "Pythagoras' theorem: in a right-angled triangle, the square of the hypotenuse equals the sum of
      the squares of the other two sides, c squared = a squared + b squared."
    kcs: [kc.mth.o.trigonometry.pythagoras, "kc.mth.o.coordinate_geometry.segment_length"]
  - term: angle of elevation
    aliases: [elevation]
    definition: "Angle of elevation: the angle measured upwards from the horizontal to the line of sight of an
      object above."
    kcs: ["kc.mth.o.trigonometry.elevation_depression"]
  - term: angle of depression
    aliases: [depression]
    definition: "Angle of depression: the angle measured downwards from the horizontal to the line of sight of an
      object below; it equals the angle of elevation seen from the lower point."
    kcs: ["kc.mth.o.trigonometry.elevation_depression"]
  - term: sine rule
    definition: "Sine rule: in any triangle, a / sin A = b / sin B = c / sin C, with side a opposite angle A.
      Finding an angle can give two answers, one acute and one obtuse."
    kcs: ["kc.mth.o.trigonometry.sine_rule"]
  - term: cosine rule
    definition: "Cosine rule: in any triangle, a squared = b squared + c squared - two b c cos A, with side a
      opposite angle A."
    kcs: ["kc.mth.o.trigonometry.cosine_rule"]
  - term: included angle
    definition: "Included angle: the angle between two given sides of a triangle, at the corner where they meet."
    kcs: ["kc.mth.o.trigonometry.cosine_rule", "kc.mth.o.trigonometry.triangle_area_sine"]
  - term: plane
    definition: "Plane: a flat surface; the angle between a line and a plane is the angle between the line and its
      projection (shadow) on the plane."
    kcs: ["kc.mth.o.trigonometry.three_d"]
  - term: space diagonal
    definition: "Space diagonal: a line through the inside of a solid joining opposite corners; for a cuboid its
      length is the square root of (a squared + b squared + c squared)."
    kcs: ["kc.mth.o.trigonometry.three_d"]
  - term: probability
    aliases: [probabilities]
    definition: "Probability: how likely an event is, from zero (impossible) to one (certain); for equally likely
      outcomes, the number of favourable outcomes over the total number of outcomes. P(not A) = one - P(A)."
    kcs: ["kc.mth.o.probability.single_event"]
  - term: event
    definition: "Event: an outcome or a set of outcomes of an experiment, such as 'rolling an even number'."
    kcs: ["kc.mth.o.probability.single_event"]
  - term: outcome
    definition: "Outcome: one possible result of an experiment or trial."
    kcs: ["kc.mth.o.probability.single_event", "kc.mth.o.probability.independent_events"]
  - term: equally likely
    definition: "Equally likely: outcomes that each have the same probability, such as the faces of a fair dice."
    kcs: ["kc.mth.o.probability.single_event"]
  - term: trial
    definition: "Trial: one go of an experiment, such as one spin of a spinner."
    kcs: ["kc.mth.o.probability.expected_frequency"]
  - term: relative frequency
    definition: "Relative frequency: the number of times an event happens divided by the number of trials; it
      estimates the probability, better with more trials."
    kcs: ["kc.mth.o.probability.expected_frequency"]
  - term: expected frequency
    definition: "Expected frequency: the number of times an event is expected to happen, probability x number of
      trials."
    kcs: ["kc.mth.o.probability.expected_frequency"]
  - term: sample space
    definition: "Sample space: a list or table of all possible outcomes, such as a grid for two dice."
    kcs: ["kc.mth.o.probability.independent_events"]
  - term: tree diagram
    definition: "Tree diagram: a diagram of branches for each stage, with probabilities on the branches; multiply
      along the branches and add the results of different paths."
    kcs: ["kc.mth.o.probability.independent_events", "kc.mth.o.probability.dependent_events"]
  - term: data
    definition: "Data: facts or values collected for a statistical investigation."
    kcs: ["kc.mth.o.statistics.data_types"]
  - term: qualitative
    aliases: [categorical]
    definition: "Qualitative (categorical) data: data described in words or categories, not numbers, such as
      colour."
    kcs: ["kc.mth.o.statistics.data_types"]
  - term: quantitative
    definition: "Quantitative data: data given as numbers, from counting or measuring."
    kcs: ["kc.mth.o.statistics.data_types"]
  - term: discrete
    definition: "Discrete data: numerical data that can take only separate values, usually counted, such as the
      number of pupils."
    kcs: ["kc.mth.o.statistics.data_types"]
  - term: continuous
    definition: "Continuous data: numerical data that can take any value in a range, usually measured, such as
      height or time."
    kcs: ["kc.mth.o.statistics.data_types"]
  - term: frequency
    definition: "Frequency: the number of times a value or class occurs in a set of data."
    kcs: ["kc.mth.o.statistics.read_tables", "kc.mth.o.statistics.averages_frequency"]
  - term: frequency table
    definition: "Frequency table: a table listing each value or class with its frequency."
    kcs: ["kc.mth.o.statistics.read_tables", "kc.mth.o.statistics.averages_frequency"]
  - term: tally
    definition: "Tally: a mark made for each item counted, grouped in fives with the fifth mark crossing the other
      four."
    kcs: ["kc.mth.o.statistics.read_tables"]
  - term: two-way table
    definition: "Two-way table: a table showing frequencies for two categories at once, with rows and columns that
      add to their totals."
    kcs: ["kc.mth.o.statistics.read_tables"]
  - term: total frequency
    definition: "Total frequency: the sum of all the frequencies, equal to the number of data values."
    kcs: ["kc.mth.o.statistics.averages_frequency"]
  - term: average
    definition: "Average: a single value that represents a set of data; the mean, the median and the mode are all
      averages."
    kcs: ["kc.mth.o.statistics.averages_list", "kc.mth.o.statistics.averages_frequency"]
  - term: mean
    definition: "Mean: the sum of the values divided by the number of values; from a frequency table, sum of (f x
      x) divided by sum of f."
    kcs: ["kc.mth.o.statistics.averages_list", "kc.mth.o.statistics.averages_frequency", "kc.mth.o.statistics.grouped_mean"]
  - term: median
    definition: "Median: the middle value when the data are in order; for n values it is in position (n + one) /
      two."
    kcs: ["kc.mth.o.statistics.averages_list", "kc.mth.o.statistics.averages_frequency"]
  - term: mode
    definition: "Mode: the value that occurs most often; for grouped data, the class with the highest frequency is
      the modal class."
    kcs: ["kc.mth.o.statistics.averages_list", "kc.mth.o.statistics.averages_frequency"]
  - term: range
    definition: "Range: the largest value minus the smallest value; it measures the spread of the data."
    kcs: ["kc.mth.o.statistics.averages_list"]
  - term: grouped data
    definition: "Grouped data: data sorted into classes; the exact values are lost, so the mean can only be
      estimated using class midpoints."
    kcs: ["kc.mth.o.statistics.grouped_mean"]
  - term: class interval
    aliases: [class]
    definition: "Class interval: a group of values in grouped data, given by its lower and upper limits, such as
      from ten up to twenty."
    kcs: ["kc.mth.o.statistics.grouped_mean", kc.mth.o.statistics.histograms]
  - term: class width
    definition: "Class width: the upper class boundary minus the lower class boundary of a class."
    kcs: [kc.mth.o.statistics.histograms]
  - term: frequency density
    definition: "Frequency density: frequency divided by class width; it is the height of each bar of a
      histogram."
    kcs: [kc.mth.o.statistics.histograms]
  - term: histogram
    definition: "Histogram: a chart for continuous grouped data with no gaps, in which the area of each bar is
      proportional to the frequency; the vertical axis shows frequency density."
    kcs: [kc.mth.o.statistics.histograms]
  - term: pie chart
    definition: "Pie chart: a circle split into sectors whose angles are proportional to the frequencies; the
      angles add up to three hundred and sixty degrees."
    kcs: ["kc.mth.o.statistics.pie_charts"]
  - term: sector angle
    definition: "Sector angle: the angle of one slice of a pie chart, frequency / total frequency x three hundred
      and sixty degrees."
    kcs: ["kc.mth.o.statistics.pie_charts"]
  - term: scatter diagram
    definition: "Scatter diagram: a graph plotting pairs of values as points to show whether two quantities are
      related."
    kcs: ["kc.mth.o.statistics.scatter_correlation"]
  - term: correlation
    definition: "Correlation: a relationship between two variables shown on a scatter diagram; it can be positive,
      negative or none, and does not prove that one causes the other."
    kcs: ["kc.mth.o.statistics.scatter_correlation"]
  - term: positive correlation
    definition: "Positive correlation: as one variable increases the other tends to increase; points slope upwards
      from left to right."
    kcs: ["kc.mth.o.statistics.scatter_correlation"]
  - term: negative correlation
    definition: "Negative correlation: as one variable increases the other tends to decrease; points slope
      downwards from left to right."
    kcs: ["kc.mth.o.statistics.scatter_correlation"]
  - term: line of best fit
    definition: "Line of best fit: a straight line drawn through the middle of the points on a scatter diagram,
      following the trend; use it to estimate values within the range of the data."
    kcs: ["kc.mth.o.statistics.scatter_correlation"]
  - term: outlier
    definition: "Outlier: a value that does not fit the pattern of the rest of the data; ignore it when drawing a
      line of best fit."
    kcs: ["kc.mth.o.statistics.scatter_correlation"]
  - term: cumulative frequency
    definition: "Cumulative frequency: the running total of frequencies; it is plotted at the upper class boundary
      of each class and joined with a smooth curve."
    kcs: ["kc.mth.o.statistics.cumulative_frequency"]
  - term: quartile
    definition: "Quartile: one of the values that split ordered data into four equal parts: the lower quartile,
      the median and the upper quartile."
    kcs: ["kc.mth.o.statistics.cumulative_frequency"]
  - term: lower quartile
    definition: "Lower quartile: the value one quarter of the way through the ordered data; on a cumulative
      frequency curve, read across at one quarter of the total frequency."
    kcs: ["kc.mth.o.statistics.cumulative_frequency"]
  - term: upper quartile
    definition: "Upper quartile: the value three quarters of the way through the ordered data; on a cumulative
      frequency curve, read across at three quarters of the total frequency."
    kcs: ["kc.mth.o.statistics.cumulative_frequency"]
  - term: interquartile range
    definition: "Interquartile range: upper quartile minus lower quartile; the spread of the middle half of the
      data."
    kcs: ["kc.mth.o.statistics.cumulative_frequency"]
  - term: percentile
    definition: "Percentile: the value below which a given percentage of the data lies; the pth percentile is read
      at p percent of the total frequency."
    kcs: ["kc.mth.o.statistics.cumulative_frequency"]
  # Physics
  - term: a.c. generator
    definition: "A.c. generator: a coil turned in a magnetic field so an alternating e.m.f. is induced; slip rings
      and brushes keep the coil connected to the outside circuit."
    kcs: ["kc.phy.o.electromagnetism.electromagnetic_induction"]
  - term: absolute zero
    definition: "Absolute zero: the lowest possible temperature, zero kelvin (about minus two hundred and
      seventy-three degrees Celsius), where particles have the least possible kinetic energy."
    kcs: ["kc.phy.o.particles.temperature_scales"]
  - term: absorption
    aliases: [absorb]
    definition: "Absorption: taking in radiation that falls on a surface, so the energy goes into the material's
      thermal store. Dull black surfaces absorb infrared best; shiny white or silver surfaces absorb least."
    kcs: ["kc.phy.o.heat_transfer.radiation"]
  - term: absorber
    definition: "Absorber: a surface judged by how well it takes in infrared radiation. Dull black surfaces are
      good absorbers; shiny white or silver surfaces are poor absorbers and reflect most of it."
    kcs: ["kc.phy.o.heat_transfer.radiation"]
  - term: acceleration
    aliases: [accelerate]
    definition: "Acceleration: the rate of change of velocity, a = (v - u) / t, measured in metres per second
      squared (m/s squared). It is a vector."
    kcs: ["kc.phy.o.motion.acceleration_from_change", "kc.phy.o.forces.force_mass_acceleration", "kc.phy.o.motion.velocity_time_gradient"]
  - term: acceleration due to gravity
    definition: "Acceleration due to gravity (acceleration of free fall), g: the acceleration of an object falling
      with no air resistance, about nine point eight m/s squared near the Earth's surface."
    kcs: ["kc.phy.o.motion.free_fall"]
  - term: activity
    definition: "Activity: the number of nuclei in a radioactive sample that decay each second, measured in
      becquerels (Bq). It halves every half-life."
    kcs: ["kc.phy.o.radioactivity.half_life"]
  - term: air resistance
    definition: "Air resistance: the drag force from the air on a moving object, acting against its motion and
      growing as its speed increases."
    kcs: ["kc.phy.o.forces.friction_and_terminal_velocity", "kc.phy.o.motion.free_fall"]
  - term: alpha particle
    aliases: [alpha]
    definition: "Alpha particle: two protons and two neutrons (a helium nucleus) emitted by an unstable nucleus.
      Charge plus two; strongly ionising; stopped by paper or a few cm of air."
    kcs: ["kc.phy.o.radioactivity.types_of_radiation", "kc.phy.o.radioactivity.decay_equations"]
  - term: alpha-particle scattering
    definition: "Alpha-particle scattering: alpha particles fired at thin gold foil. Most passed straight through,
      a few were deflected through large angles, so the atom has a tiny, dense, positive nucleus and is mostly
      empty space."
    kcs: ["kc.phy.o.atom.nuclear_model_evidence"]
  - term: alternating current
    definition: "Alternating current (a.c.): a current that keeps reversing its direction, many times each
      second."
    kcs: ["kc.phy.o.electromagnetism.electromagnetic_induction", kc.phy.o.electromagnetism.transformers]
  - term: ammeter
    definition: "Ammeter: a meter that measures current in amperes. It is connected in series with the component
      and has a very small resistance."
    kcs: ["kc.phy.o.electrical_quantities.current_and_charge", "kc.phy.o.circuits.series_circuits"]
  - term: ampere
    aliases: [amp]
    definition: "Ampere (A, amp): the SI unit of current; one ampere is a flow of one coulomb of charge per
      second."
    kcs: ["kc.phy.o.electrical_quantities.current_and_charge"]
  - term: amplitude
    definition: "Amplitude: the greatest displacement of a point on a wave from its rest position. For sound, a
      larger amplitude means a louder sound."
    kcs: ["kc.phy.o.wave_properties.describing_waves", "kc.phy.o.sound.pitch_and_loudness", "kc.phy.o.oscilloscope.y_gain"]
  - term: angle of incidence
    definition: "Angle of incidence (i): the angle between the incident ray and the normal at the point where the
      ray meets the surface."
    kcs: ["kc.phy.o.light.plane_mirrors", kc.phy.o.light.refraction]
  - term: angle of reflection
    definition: "Angle of reflection (r): the angle between the reflected ray and the normal. It always equals the
      angle of incidence."
    kcs: ["kc.phy.o.light.plane_mirrors"]
  - term: angle of refraction
    definition: "Angle of refraction (r): the angle between the refracted ray and the normal, inside the second
      medium."
    kcs: [kc.phy.o.light.refraction]
  - term: anticlockwise
    definition: "Anticlockwise moment: a moment that tends to turn an object the opposite way to the hands of a
      clock. In balance, total anticlockwise moments equal total clockwise moments about the same pivot."
    kcs: [kc.phy.o.forces.moments]
  - term: clockwise
    definition: "Clockwise moment: a moment that tends to turn an object the same way as the hands of a clock. In
      balance, total clockwise moments equal total anticlockwise moments about the same pivot."
    kcs: [kc.phy.o.forces.moments]
  - term: area under
    definition: "Area under a velocity-time graph: equals the distance travelled (displacement) in that time;
      split the area into rectangles and triangles to find it."
    kcs: ["kc.phy.o.motion.velocity_time_area"]
  - term: armature
    definition: "Armature: the coil of wire that rotates in the magnetic field of a motor or generator, usually
      wound on a soft iron core."
    kcs: ["kc.phy.o.electromagnetism.motor_effect"]
  - term: asteroid
    definition: "Asteroid: a small rocky object orbiting the Sun, mostly in the belt between Mars and Jupiter."
    kcs: ["kc.phy.o.solar_system.planets_and_gravity"]
  - term: atmospheric pressure
    definition: "Atmospheric pressure: the pressure caused by the weight of the air above a surface, about one
      hundred kilopascals at sea level; it falls as height increases."
    kcs: ["kc.phy.o.pressure.gas_and_atmospheric_pressure", "kc.phy.o.pressure.liquid_pressure"]
  - term: atom
    definition: "Atom: a tiny positive nucleus of protons and neutrons, with negative electrons around it. A
      neutral atom has equal numbers of protons and electrons."
    kcs: ["kc.phy.o.atom.atomic_structure", "kc.phy.o.atom.nuclear_model_evidence"]
  - term: atomic vibrations
    definition: "Atomic vibrations: in a solid, particles vibrate about fixed positions; in conduction, hotter
      particles vibrate more and pass energy to their neighbours."
    kcs: ["kc.phy.o.heat_transfer.conduction"]
  - term: attraction
    aliases: [attract]
    definition: "Attraction: a force pulling two objects together. Unlike charges attract, and unlike magnetic
      poles (north and south) attract; a magnet also attracts unmagnetised magnetic materials."
    kcs: ["kc.phy.o.electrical_quantities.electric_charge", "kc.phy.o.magnetism.magnets_and_materials"]
  - term: audible
    definition: "Audible: able to be heard by humans; the audible range is about twenty hertz to twenty
      kilohertz."
    kcs: ["kc.phy.o.sound.pitch_and_loudness"]
  - term: average force
    definition: "Average force: the change in momentum divided by the time it takes, F = (m v - m u) / t, in
      newtons."
    kcs: [kc.phy.o.momentum.impulse]
  - term: average kinetic energy
    definition: "Average kinetic energy (of particles): the mean kinetic energy of the particles of a substance;
      it rises as temperature rises and is least at absolute zero."
    kcs: ["kc.phy.o.particles.temperature_scales"]
  - term: average orbital speed
    definition: "Average orbital speed: the distance round the orbit divided by the orbital period, v = two x pi x
      r / T, where r is the average orbit radius."
    kcs: ["kc.phy.o.solar_system.orbital_speed"]
  - term: average speed
    definition: "Average speed: the total distance travelled divided by the total time taken, in metres per
      second."
    kcs: ["kc.phy.o.motion.average_speed"]
  - term: axis
    definition: "Axis (of the Earth): the imaginary line through the poles about which the Earth spins once a day.
      It is tilted, which causes the seasons."
    kcs: ["kc.phy.o.solar_system.earth_and_moon"]
  - term: background radiation
    definition: "Background radiation: ionising radiation around us all the time, from radon gas, rocks and
      buildings, food and drink, medical uses and cosmic rays."
    kcs: ["kc.phy.o.radioactivity.background_radiation"]
  - term: background count
    definition: "Background count (rate): the count rate a detector records from background radiation alone, with
      no source present. It is subtracted from readings."
    kcs: ["kc.phy.o.radioactivity.background_radiation"]
  - term: balance
    definition: "Balance (equilibrium): an object is in balance when there is no resultant force and no resultant
      moment on it, so the sum of clockwise moments equals the sum of anticlockwise moments."
    kcs: [kc.phy.o.forces.moments]
  - term: balanced
    definition: "Balanced forces: forces whose resultant is zero, so the object stays at rest or keeps moving at
      constant velocity."
    kcs: ["kc.phy.o.forces.resultant_force"]
  - term: bar magnet
    definition: "Bar magnet: a straight permanent magnet with a north pole at one end and a south pole at the
      other; its field is strongest at the poles."
    kcs: ["kc.phy.o.magnetism.magnetic_fields"]
  - term: barometer
    definition: "Barometer: an instrument that measures atmospheric pressure, for example by the height of a
      mercury column the air can hold up."
    kcs: ["kc.phy.o.pressure.gas_and_atmospheric_pressure"]
  - term: becquerel
    definition: "Becquerel (Bq): the unit of activity; one becquerel is one nucleus decaying per second."
    kcs: ["kc.phy.o.radioactivity.half_life"]
  - term: beta particle
    aliases: [beta]
    definition: "Beta particle: a fast electron emitted from a nucleus when a neutron changes into a proton.
      Charge minus one; moderately ionising; stopped by a few mm of aluminium."
    kcs: ["kc.phy.o.radioactivity.types_of_radiation", "kc.phy.o.radioactivity.decay_equations"]
  - term: big bang
    definition: "Big Bang theory: the Universe began from a tiny, extremely hot and dense point about fourteen
      billion years ago and has been expanding ever since."
    kcs: ["kc.phy.o.stars.expanding_universe"]
  - term: bimetallic strip
    definition: "Bimetallic strip: two metals that expand by different amounts, joined side by side; when heated
      it bends towards the metal that expands less. Used in thermostats."
    kcs: ["kc.phy.o.thermal_properties.thermal_expansion"]
  - term: biofuel
    definition: "Biofuel: a fuel made from plants or animal waste, such as wood or ethanol. It is renewable
      because new plants can be grown."
    kcs: ["kc.phy.o.energy.energy_resources"]
  - term: black hole
    definition: "Black hole: the end of a very massive star, where gravity is so strong that not even light can
      escape."
    kcs: ["kc.phy.o.stars.life_cycle_of_stars"]
  - term: boiling
    aliases: [boil]
    definition: "Boiling: a liquid turning to gas throughout the liquid, with bubbles, at a fixed temperature (the
      boiling point) while energy is supplied."
    kcs: ["kc.phy.o.thermal_properties.changes_of_state", "kc.phy.o.thermal_properties.latent_heat"]
  - term: boiling point
    definition: "Boiling point: the fixed temperature at which a liquid boils; it stays constant while the liquid
      changes to gas."
    kcs: ["kc.phy.o.thermal_properties.changes_of_state"]
  - term: boundary
    definition: "Boundary: the surface where two media meet. A wave reaching it can be reflected, and if it passes
      through it is refracted as its speed changes."
    kcs: [kc.phy.o.light.refraction, "kc.phy.o.wave_properties.wave_behaviour"]
  - term: boyle's law
    definition: "Boyle's law: for a fixed mass of gas at constant temperature, pressure x volume is constant, so p
      x V before = p x V after."
    kcs: ["kc.phy.o.particles.pressure_and_volume"]
  - term: branch
    definition: "Branch: one of the separate paths in a parallel circuit. The branch currents add up to the
      current in the main circuit."
    kcs: ["kc.phy.o.circuits.parallel_circuits"]
  - term: brownian motion
    definition: "Brownian motion: the random, jerky movement of small visible particles, such as smoke, caused by
      collisions with fast-moving, invisible air or water molecules."
    kcs: ["kc.phy.o.particles.states_of_matter"]
  - term: brushes
    definition: "Brushes: carbon contacts that press against the commutator (or slip rings) and carry current
      between the rotating coil and the fixed circuit."
    kcs: ["kc.phy.o.electromagnetism.motor_effect"]
  - term: cell
    definition: "Cell (electrical): a single source of e.m.f. that transfers energy from its chemical store to the
      circuit. Two or more cells joined together form a battery."
    kcs: ["kc.phy.o.circuits.series_circuits", "kc.phy.o.electrical_quantities.potential_difference"]
  - term: celsius scale
    aliases: [celsius]
    definition: "Celsius scale: a temperature scale in degrees Celsius; temperature in kelvin = temperature in
      degrees Celsius + two hundred and seventy-three."
    kcs: ["kc.phy.o.particles.temperature_scales"]
  - term: centre of gravity
    definition: "Centre of gravity: the point where the whole weight of an object seems to act. A lower centre of
      gravity and a wider base make an object more stable."
    kcs: ["kc.phy.o.forces.centre_of_gravity"]
  - term: centripetal force
    definition: "Centripetal force: the resultant force towards the centre of a circle that keeps an object moving
      in the circle; it changes the direction of the velocity, not the speed."
    kcs: ["kc.phy.o.forces.circular_motion"]
  - term: change in momentum
    definition: "Change in momentum: final momentum minus initial momentum, m v - m u; it equals the impulse, F x
      t, in N s (kg m/s)."
    kcs: [kc.phy.o.momentum.impulse]
  - term: change in velocity
    definition: "Change in velocity: final velocity minus initial velocity, v - u; dividing it by the time taken
      gives the acceleration."
    kcs: ["kc.phy.o.motion.acceleration_from_change"]
  - term: change of state
    definition: "Change of state: melting, freezing, boiling, evaporating or condensing. During it the temperature
      stays constant while energy is taken in or given out."
    kcs: ["kc.phy.o.thermal_properties.changes_of_state", "kc.phy.o.thermal_properties.latent_heat"]
  - term: electric charge
    aliases: [charge, charged]
    definition: "Electric charge (Q): a property of particles; electrons are negative, protons positive. Like
      charges repel and unlike charges attract. Measured in coulombs (C); Q = I x t."
    kcs: ["kc.phy.o.electrical_quantities.electric_charge", "kc.phy.o.electrical_quantities.current_and_charge"]
  - term: chemical store
    definition: "Chemical store: energy held in fuels, food and cells, released by chemical reactions."
    kcs: ["kc.phy.o.energy.stores_and_transfers"]
  - term: circuit
    definition: "Circuit: a complete closed path of conductors and components around which charge can flow from
      one terminal of the supply to the other."
    kcs: ["kc.phy.o.circuits.series_circuits", "kc.phy.o.circuits.parallel_circuits"]
  - term: circuit breaker
    definition: "Circuit breaker: a switch that opens automatically when the current is too large, and can be
      reset instead of replaced like a fuse."
    kcs: ["kc.phy.o.practical_electricity.fuses_and_safety"]
  - term: circuit symbol
    definition: "Circuit symbol: the standard drawing used for a component, such as a cell, resistor, lamp, diode
      or fuse, in a circuit diagram."
    kcs: ["kc.phy.o.circuits.circuit_components"]
  - term: circular motion
    definition: "Circular motion: moving in a circle. Even at constant speed the velocity changes direction, so a
      resultant force towards the centre is needed."
    kcs: ["kc.phy.o.forces.circular_motion"]
  - term: circumference
    definition: "Circumference: the distance once round a circle, two x pi x r; for an orbit it is the distance
      travelled in one orbital period."
    kcs: ["kc.phy.o.solar_system.orbital_speed"]
  - term: coil
    definition: "Coil: wire wound into many turns. More turns give a stronger electromagnet and a larger induced
      e.m.f.; a transformer's turns ratio sets its output voltage."
    kcs: ["kc.phy.o.electromagnetism.fields_of_currents", kc.phy.o.electromagnetism.transformers]
  - term: collision
    definition: "Collision: objects hitting each other and exerting forces for a short time. The total momentum is
      the same before and after if no outside force acts."
    kcs: ["kc.phy.o.momentum.conservation_of_momentum", kc.phy.o.momentum.impulse]
  - term: combined resistance
    definition: "Combined resistance: the single resistance that could replace a group of resistors. In series,
      add the resistances; in parallel the combined resistance is less than the smallest one."
    kcs: ["kc.phy.o.circuits.parallel_circuits", "kc.phy.o.circuits.mixed_circuits"]
  - term: comet
    definition: "Comet: a lump of ice and dust in a very elongated orbit round the Sun; near the Sun it heats up
      and forms a tail."
    kcs: ["kc.phy.o.solar_system.planets_and_gravity"]
  - term: communications satellite
    definition: "Communications satellite: a satellite that relays signals, often in a geostationary orbit above
      the equator so it stays over the same place on Earth."
    kcs: ["kc.phy.o.solar_system.orbital_speed"]
  - term: commutator
    definition: "Commutator: a split ring on a d.c. motor that reverses the current in the coil every half turn,
      so the coil keeps turning the same way."
    kcs: ["kc.phy.o.electromagnetism.motor_effect"]
  - term: compass
    definition: "Compass: a small magnet free to turn; its north pole points along the magnetic field line, so it
      is used to plot field direction."
    kcs: ["kc.phy.o.magnetism.magnetic_fields", "kc.phy.o.electromagnetism.fields_of_currents"]
  - term: component
    definition: "Component: a part of a circuit, such as a cell, lamp, resistor, switch, diode or meter."
    kcs: ["kc.phy.o.circuits.series_circuits", "kc.phy.o.circuits.parallel_circuits"]
  - term: compression
    definition: "Compression: a region of a longitudinal wave where the particles are closer together and the
      pressure is higher."
    kcs: ["kc.phy.o.sound.sound_waves", "kc.phy.o.wave_properties.transverse_and_longitudinal"]
  - term: condensation
    definition: "Condensation: a gas turning into a liquid as it cools; energy is given out without a change in
      temperature."
    kcs: ["kc.phy.o.thermal_properties.changes_of_state"]
  - term: conduction
    aliases: [conduct]
    definition: "Conduction (thermal): energy passing through a material from hotter to colder parts by vibrating
      particles and, in metals, by free electrons; the material itself does not move."
    kcs: ["kc.phy.o.heat_transfer.conduction"]
  - term: conductor
    definition: "Conductor: a material that lets electric charge or thermal energy pass through easily. Metals are
      good conductors of both because they have free electrons."
    kcs: ["kc.phy.o.electrical_quantities.electric_charge", "kc.phy.o.heat_transfer.conduction"]
  - term: conservation of energy
    definition: "Conservation of energy: energy cannot be created or destroyed, only transferred from one store to
      another, so the total energy stays the same."
    kcs: ["kc.phy.o.energy.stores_and_transfers", "kc.phy.o.energy.energy_conversion"]
  - term: conservation of momentum
    definition: "Conservation of momentum: when no external resultant force acts, the total momentum of the
      objects before a collision or explosion equals the total after."
    kcs: ["kc.phy.o.momentum.conservation_of_momentum"]
  - term: constant speed
    definition: "Constant speed: equal distances covered in equal times; a distance-time graph is then a straight
      sloping line."
    kcs: ["kc.phy.o.motion.distance_time_gradient", "kc.phy.o.forces.circular_motion"]
  - term: constant temperature
    definition: "Constant temperature: the temperature is kept the same throughout, a condition for Boyle's law, p
      x V = constant."
    kcs: ["kc.phy.o.particles.pressure_and_volume"]
  - term: contamination
    definition: "Contamination: radioactive material getting onto or into an object or person, so it keeps
      emitting radiation there."
    kcs: ["kc.phy.o.radioactivity.uses_and_safety"]
  - term: contraction
    aliases: [contract]
    definition: "Contraction: getting smaller when cooled, because the particles move or vibrate less and take up
      less space; the particles themselves do not shrink."
    kcs: ["kc.phy.o.thermal_properties.thermal_expansion"]
  - term: convection
    definition: "Convection: thermal energy carried by the movement of a liquid or gas: the warmer part expands,
      becomes less dense and rises, and cooler, denser fluid sinks."
    kcs: ["kc.phy.o.heat_transfer.convection"]
  - term: convection current
    definition: "Convection current: the circulating flow of a liquid or gas when warm, less dense fluid rises and
      cooler, denser fluid sinks to replace it."
    kcs: ["kc.phy.o.heat_transfer.convection"]
  - term: converging lens
    definition: "Converging lens: a lens thicker in the middle that bends parallel rays of light so they meet at
      the principal focus."
    kcs: ["kc.phy.o.light.converging_lens"]
  - term: cooling curve
    definition: "Cooling curve: a graph of temperature against time as a substance cools; a flat part shows a
      change of state (condensing or freezing)."
    kcs: ["kc.phy.o.thermal_properties.changes_of_state"]
  - term: heating curve
    definition: "Heating curve: a graph of temperature against time as a substance is heated; a flat part shows a
      change of state (melting or boiling)."
    kcs: ["kc.phy.o.thermal_properties.changes_of_state"]
  - term: count rate
    definition: "Count rate: the number of counts a detector records per second (or per minute) from radiation
      reaching it."
    kcs: ["kc.phy.o.radioactivity.half_life", "kc.phy.o.radioactivity.background_radiation"]
  - term: corrected count rate
    definition: "Corrected count rate: the measured count rate minus the background count rate, giving the count
      rate due to the source alone."
    kcs: ["kc.phy.o.radioactivity.background_radiation"]
  - term: cosmic microwave background radiation
    aliases: [cosmic microwave background]
    definition: "Cosmic microwave background radiation (CMBR): microwaves reaching us from every direction, left
      over from the early Universe; evidence for the Big Bang."
    kcs: ["kc.phy.o.stars.expanding_universe"]
  - term: cosmic ray
    definition: "Cosmic rays: high-energy particles from space that reach the Earth; one source of background
      radiation."
    kcs: ["kc.phy.o.radioactivity.background_radiation"]
  - term: coulomb
    definition: "Coulomb (C): the unit of charge; one coulomb passes a point when a current of one ampere flows
      for one second."
    kcs: ["kc.phy.o.electrical_quantities.current_and_charge"]
  - term: crest
    definition: "Crest: the highest point of a transverse wave, one amplitude above the rest position; the
      distance from one crest to the next is one wavelength."
    kcs: ["kc.phy.o.wave_properties.describing_waves"]
  - term: critical angle
    definition: "Critical angle (c): the angle of incidence in the denser medium for which the angle of refraction
      is a right angle; n = one / sin c."
    kcs: ["kc.phy.o.light.total_internal_reflection"]
  - term: cross-sectional area
    definition: "Cross-sectional area: the area of the end face of a wire. A thicker wire, with a larger area, has
      a smaller resistance."
    kcs: ["kc.phy.o.electrical_quantities.resistance_of_wires"]
  - term: crumple zone
    definition: "Crumple zone: part of a car designed to crush in a crash, making the collision last longer so the
      average force for the same change in momentum is smaller."
    kcs: [kc.phy.o.momentum.impulse]
  - term: cubic centimetre
    definition: "Cubic centimetre (cm cubed): a unit of volume; one million cubic centimetres make one cubic
      metre."
    kcs: ["kc.phy.o.density.density_calculation"]
  - term: cubic metre
    definition: "Cubic metre (m cubed): the SI unit of volume, a cube one metre on each side; density is measured
      in kg/m cubed."
    kcs: ["kc.phy.o.density.density_calculation"]
  - term: current-carrying
    definition: "Current-carrying conductor: a wire with a current in it; in a magnetic field it feels a force
      unless it is parallel to the field."
    kcs: ["kc.phy.o.electromagnetism.motor_effect"]
  - term: current-voltage graph
    definition: "Current-voltage graph: current plotted against potential difference. A fixed resistor gives a
      straight line through the origin; a filament lamp curves; a diode conducts one way only."
    kcs: ["kc.phy.o.electrical_quantities.current_voltage_graphs"]
  - term: cycle
    definition: "Cycle: one complete oscillation or wave; the time for one cycle is the period."
    kcs: ["kc.phy.o.wave_properties.describing_waves", "kc.phy.o.oscilloscope.time_base"]
  - term: d.c. motor
    definition: "D.c. motor: a coil in a magnetic field that turns when a direct current flows through it; a
      split-ring commutator keeps it turning one way."
    kcs: ["kc.phy.o.electromagnetism.motor_effect"]
  - term: decay
    definition: "Radioactive decay: an unstable nucleus changing at random to a more stable one by emitting an
      alpha particle, a beta particle or gamma radiation."
    kcs: ["kc.phy.o.radioactivity.decay_equations", "kc.phy.o.radioactivity.half_life"]
  - term: decay equation
    definition: "Decay equation: a nuclide equation for a decay in which the nucleon numbers and the proton
      numbers on each side balance."
    kcs: ["kc.phy.o.radioactivity.decay_equations"]
  - term: deceleration
    aliases: [decelerate]
    definition: "Deceleration: slowing down, a negative acceleration; on a velocity-time graph the line slopes
      downward."
    kcs: ["kc.phy.o.motion.acceleration_from_change", "kc.phy.o.motion.velocity_time_gradient"]
  - term: deflection
    aliases: [deflected]
    definition: "Deflection: being turned from a straight path. Alpha and beta particles are deflected by electric
      and magnetic fields in opposite directions; gamma rays are not."
    kcs: ["kc.phy.o.radioactivity.types_of_radiation", "kc.phy.o.atom.nuclear_model_evidence"]
  - term: denser
    definition: "Denser (optically denser) medium: one in which light travels more slowly and which has a larger
      refractive index; light entering it bends towards the normal."
    kcs: [kc.phy.o.light.refraction, "kc.phy.o.light.speed_in_medium"]
  - term: density
    definition: "Density: mass per unit volume, rho = m / V, measured in kg/m cubed or g/cm cubed."
    kcs: ["kc.phy.o.density.density_calculation", "kc.phy.o.density.measuring_density", "kc.phy.o.density.floating_and_sinking"]
  - term: depth
    definition: "Depth: the vertical distance below the surface of a liquid; the pressure change is rho x g x h,
      where h is the change in depth."
    kcs: ["kc.phy.o.pressure.liquid_pressure"]
  - term: diffraction
    aliases: [diffract]
    definition: "Diffraction: the spreading of a wave as it passes through a gap or round an edge. It is greatest
      when the gap is about the same size as the wavelength."
    kcs: ["kc.phy.o.wave_properties.wave_behaviour"]
  - term: diminished
    definition: "Diminished: an image smaller than the object."
    kcs: ["kc.phy.o.light.converging_lens"]
  - term: diode
    definition: "Diode: a component that lets current flow in one direction only, the forward direction, and has a
      very high resistance in the reverse direction."
    kcs: ["kc.phy.o.circuits.circuit_components", "kc.phy.o.electrical_quantities.current_voltage_graphs"]
  - term: direction of the force
    definition: "Distance moved in the direction of the force: the only distance that counts in work done, W = F x
      d; if an object moves at right angles to a force, that force does no work."
    kcs: ["kc.phy.o.energy.work_done"]
  - term: displacement
    definition: "Displacement: the distance moved in a stated direction from the start point, in a straight line.
      It is a vector; distance is a scalar."
    kcs: ["kc.phy.o.motion.distance_or_displacement", "kc.phy.o.measurement.scalars_and_vectors"]
  - term: displacement can
    definition: "Displacement can (eureka can): a can with a spout; an object lowered into it pushes out its own
      volume of water, which is collected in a measuring cylinder."
    kcs: ["kc.phy.o.density.measuring_density"]
  - term: displacement-time graph
    definition: "Displacement-time graph (of a wave): the displacement of one point on the wave plotted against
      time; it shows the amplitude and the period."
    kcs: ["kc.phy.o.wave_properties.describing_waves"]
  - term: distance travelled
    definition: "Distance travelled: the total length of the path moved, a scalar; on a velocity-time graph it is
      the area under the line."
    kcs: ["kc.phy.o.motion.velocity_time_area"]
  - term: distance-time graph
    definition: "Distance-time graph: distance plotted against time. Its gradient is the speed; a horizontal line
      means the object is at rest."
    kcs: ["kc.phy.o.motion.distance_time_gradient"]
  - term: division
    definition: "Division: one square of the grid on an oscilloscope screen, usually one centimetre; settings are
      given per division."
    kcs: ["kc.phy.o.oscilloscope.time_base", "kc.phy.o.oscilloscope.y_gain"]
  - term: double insulation
    definition: "Double insulation: an appliance with a non-conducting case and no exposed metal parts, so it
      needs no earth wire."
    kcs: ["kc.phy.o.practical_electricity.fuses_and_safety"]
  - term: drag
    definition: "Drag: a resistive force on an object moving through a liquid or gas, acting against its motion
      and increasing with speed."
    kcs: ["kc.phy.o.forces.friction_and_terminal_velocity"]
  - term: driving force
    definition: "Driving force: the forward force that makes something move, such as the thrust from an engine."
    kcs: ["kc.phy.o.forces.resultant_force"]
  - term: dwarf planet
    definition: "Dwarf planet: a body, such as Pluto, that orbits the Sun and is nearly round but has not cleared
      other objects from its orbit."
    kcs: ["kc.phy.o.solar_system.planets_and_gravity"]
  - term: generator
    aliases: [dynamo]
    definition: "Generator (dynamo): a machine that transfers energy from a kinetic store to electrical energy by
      electromagnetic induction, as a coil and a magnet move relative to each other."
    kcs: ["kc.phy.o.electromagnetism.electromagnetic_induction", "kc.phy.o.energy.energy_resources"]
  - term: earth wire
    definition: "Earth wire: the green-and-yellow wire joining an appliance's metal case to earth. If the live
      wire touches the case, a large current flows and blows the fuse."
    kcs: ["kc.phy.o.practical_electricity.fuses_and_safety"]
  - term: earthing
    definition: "Earthing: connecting the metal case of an appliance to the ground through the earth wire, so the
      case cannot become live and give a shock."
    kcs: ["kc.phy.o.practical_electricity.fuses_and_safety"]
  - term: echo
    definition: "Echo: a sound (or ultrasound) reflected from a surface. The time measured covers the journey
      there and back, so distance = speed x time / two."
    kcs: ["kc.phy.o.sound.speed_and_echoes", kc.phy.o.sound.ultrasound]
  - term: efficiency
    definition: "Efficiency: useful energy (or power) output divided by total energy (or power) input, often given
      as a percentage. It can never be more than one hundred percent."
    kcs: [kc.phy.o.energy.efficiency]
  - term: elastic
    definition: "Elastic: able to return to its original shape and size when the stretching force is removed."
    kcs: [kc.phy.o.forces.springs]
  - term: elastic store
    definition: "Elastic (strain) store: energy held in a stretched, squashed or bent object, such as a spring."
    kcs: ["kc.phy.o.energy.stores_and_transfers"]
  - term: electrical energy
    definition: "Electrical energy: energy transferred by an electric current, E = V x I x t, in joules, or in
      kilowatt-hours for household bills."
    kcs: ["kc.phy.o.practical_electricity.energy_cost"]
  - term: electrical power
    definition: "Electrical power: the energy transferred per second by a current, P = I x V = I squared x R,
      measured in watts (W)."
    kcs: ["kc.phy.o.practical_electricity.electrical_power"]
  - term: electromagnet
    definition: "Electromagnet: a coil of wire, usually on a soft iron core, that is magnetic only while a current
      flows. More turns, more current or an iron core make it stronger."
    kcs: ["kc.phy.o.electromagnetism.fields_of_currents"]
  - term: electromagnetic induction
    definition: "Electromagnetic induction: an e.m.f. is induced in a conductor when the magnetic field through it
      changes, or it cuts field lines. Faster change, a stronger magnet or more turns give a larger e.m.f."
    kcs: ["kc.phy.o.electromagnetism.electromagnetic_induction"]
  - term: electromagnetic wave
    aliases: [electromagnetic radiation]
    definition: "Electromagnetic waves: transverse waves that can travel through a vacuum, all at the same speed
      there, the speed of light, about three hundred million m/s."
    kcs: ["kc.phy.o.em_spectrum.order_and_properties", "kc.phy.o.em_spectrum.em_wave_calculations", "kc.phy.o.em_spectrum.uses_and_hazards"]
  - term: electromagnetic spectrum
    definition: "Electromagnetic spectrum: radio waves, microwaves, infrared, visible light, ultraviolet, X-rays,
      gamma rays, in order of decreasing wavelength and increasing frequency."
    kcs: ["kc.phy.o.em_spectrum.order_and_properties", "kc.phy.o.em_spectrum.uses_and_hazards"]
  - term: electron
    definition: "Electron: a tiny negatively charged particle around the nucleus of an atom. Charging by friction
      moves electrons; current in a metal is a flow of electrons."
    kcs: ["kc.phy.o.atom.atomic_structure", "kc.phy.o.electrical_quantities.electric_charge"]
  - term: element
    definition: "Element: a substance whose atoms all have the same proton number."
    kcs: ["kc.phy.o.atom.atomic_structure", kc.phy.o.atom.isotopes]
  - term: emission
    aliases: [emit, emitting]
    definition: "Emission: giving out radiation, such as infrared from a warm surface, or an alpha particle, beta
      particle or gamma ray from an unstable nucleus."
    kcs: ["kc.phy.o.heat_transfer.radiation", "kc.phy.o.radioactivity.decay_equations"]
  - term: emitter
    definition: "Emitter: a surface judged by how well it gives out infrared radiation. Dull black surfaces are
      the best emitters; shiny white or silver surfaces are the poorest."
    kcs: ["kc.phy.o.heat_transfer.radiation"]
  - term: energy meter
    definition: "Energy meter: the meter that records the electrical energy used in a building, in
      kilowatt-hours."
    kcs: ["kc.phy.o.practical_electricity.energy_cost"]
  - term: energy resource
    definition: "Energy resource: a source of energy we can use, such as fossil fuels, nuclear fuel, wind, solar,
      hydro or geothermal; renewable ones are not used up."
    kcs: ["kc.phy.o.energy.energy_resources"]
  - term: energy store
    definition: "Energy store: a way energy is held, such as kinetic, gravitational, chemical, elastic, thermal or
      nuclear."
    kcs: ["kc.phy.o.energy.stores_and_transfers"]
  - term: energy transfer
    definition: "Energy transfer: energy moving from one store to another, by forces (mechanical work), electric
      current, heating or waves; the total energy does not change."
    kcs: [kc.phy.o.energy.efficiency]
  - term: energy transferred
    definition: "Energy transferred: the amount of energy moved from one store to another, in joules; it equals
      the work done."
    kcs: ["kc.phy.o.energy.work_done", kc.phy.o.energy.power]
  - term: equation of motion
    definition: "Equations of motion (uniform acceleration): v = u + a x t; s = u x t + half x a x t squared; v
      squared = u squared + two x a x s; s = (u + v) x t / two."
    kcs: ["kc.phy.o.motion.choose_equation", "kc.phy.o.motion.solve_with_equation"]
  - term: evaporation
    aliases: [evaporate, evaporating]
    definition: "Evaporation: the fastest-moving particles escaping from the surface of a liquid at any
      temperature below the boiling point; the liquid left behind cools."
    kcs: ["kc.phy.o.thermal_properties.changes_of_state"]
  - term: expanding universe
    definition: "Expanding Universe: distant galaxies are moving away from us, and the further away they are, the
      faster they recede, shown by the redshift of their light."
    kcs: ["kc.phy.o.stars.expanding_universe"]
  - term: expansion
    aliases: [expand]
    definition: "Expansion (thermal): getting larger when heated, because the particles move or vibrate more and
      take up more space; the particles themselves do not grow."
    kcs: ["kc.phy.o.thermal_properties.thermal_expansion", "kc.phy.o.heat_transfer.convection"]
  - term: expansion gap
    definition: "Expansion gap: a small space left between sections of a bridge or railway track so they can
      expand in hot weather without buckling."
    kcs: ["kc.phy.o.thermal_properties.thermal_expansion"]
  - term: explosion
    definition: "Explosion: parts of an object pushed apart by internal forces. If it starts at rest, the total
      momentum afterwards is still zero, so the parts move in opposite directions."
    kcs: ["kc.phy.o.momentum.conservation_of_momentum"]
  - term: extension
    definition: "Extension: the increase in length of a spring from its natural length, x = stretched length -
      original length."
    kcs: [kc.phy.o.forces.springs]
  - term: field line
    definition: "Magnetic field line: a line showing the direction of the force on a north pole, from north to
      south; lines closer together mean a stronger field."
    kcs: ["kc.phy.o.magnetism.magnetic_fields", "kc.phy.o.electromagnetism.fields_of_currents"]
  - term: filament lamp
    definition: "Filament lamp: a lamp with a thin wire that glows when hot. Its resistance increases as it heats
      up, so its current-voltage graph curves."
    kcs: ["kc.phy.o.electrical_quantities.current_voltage_graphs"]
  - term: final velocity
    definition: "Final velocity (v): the velocity at the end of the time being studied."
    kcs: ["kc.phy.o.motion.choose_equation", "kc.phy.o.motion.solve_with_equation"]
  - term: initial velocity
    definition: "Initial velocity (u): the velocity at the start of the time being studied; zero if the object
      starts from rest."
    kcs: ["kc.phy.o.motion.choose_equation", "kc.phy.o.motion.solve_with_equation", "kc.phy.o.motion.free_fall"]
  - term: fixed mass
    definition: "Fixed mass (of gas): the amount of gas stays the same because none escapes or is added, a
      condition for Boyle's law."
    kcs: ["kc.phy.o.particles.pressure_and_volume"]
  - term: fleming's left-hand rule
    definition: "Fleming's left-hand rule: with thumb, first and second fingers of the left hand at right angles,
      the first finger points along the field, the second along the current, and the thumb gives the force
      (motion)."
    kcs: ["kc.phy.o.electromagnetism.motor_effect"]
  - term: fluid
    definition: "Fluid: a liquid or a gas, a substance that can flow; convection happens only in fluids."
    kcs: ["kc.phy.o.heat_transfer.convection"]
  - term: focal length
    definition: "Focal length (f): the distance from the centre of a lens to its principal focus."
    kcs: ["kc.phy.o.light.converging_lens"]
  - term: focal point
    definition: "Focal point (principal focus, F): the point where rays parallel to the principal axis meet after
      passing through a converging lens."
    kcs: ["kc.phy.o.light.converging_lens"]
  - term: force
    definition: "Force: a push or a pull, measured in newtons (N). It is a vector, so it has both size and
      direction."
    kcs: ["kc.phy.o.forces.resultant_force", "kc.phy.o.forces.force_mass_acceleration"]
  - term: forward direction
    definition: "Forward direction (of a diode): the direction in which a diode lets current flow, shown by the
      arrow in its symbol."
    kcs: ["kc.phy.o.circuits.circuit_components"]
  - term: fossil fuel
    definition: "Fossil fuel: coal, oil or natural gas, formed from ancient remains. They are non-renewable and
      give out carbon dioxide when burned."
    kcs: ["kc.phy.o.energy.energy_resources"]
  - term: free electrons
    definition: "Free electrons: electrons in a metal that are not tied to one atom and move freely; they carry
      charge and thermal energy, which makes metals good conductors."
    kcs: ["kc.phy.o.heat_transfer.conduction"]
  - term: free fall
    definition: "Free fall: motion under gravity alone, with no air resistance; the acceleration is g, about nine
      point eight m/s squared, whatever the mass."
    kcs: ["kc.phy.o.motion.free_fall"]
  - term: frequency
    definition: "Frequency (f): the number of complete waves passing a point each second, measured in hertz (Hz);
      f = one / T, where T is the period."
    kcs: ["kc.phy.o.wave_properties.describing_waves", "kc.phy.o.wave_properties.wave_equation", "kc.phy.o.oscilloscope.time_base"]
  - term: friction
    definition: "Friction: a force between surfaces in contact that acts against motion or attempted motion; it
      heats the surfaces and can charge insulators by moving electrons."
    kcs: ["kc.phy.o.forces.friction_and_terminal_velocity", "kc.phy.o.electrical_quantities.electric_charge"]
  - term: fuse
    definition: "Fuse: a thin wire in the live side of a circuit that melts and breaks the circuit when the
      current is larger than its rating."
    kcs: ["kc.phy.o.practical_electricity.fuses_and_safety", "kc.phy.o.circuits.circuit_components"]
  - term: fuse rating
    definition: "Fuse rating: the current above which a fuse melts. Choose the value just above the appliance's
      normal current, I = P / V."
    kcs: ["kc.phy.o.practical_electricity.fuses_and_safety"]
  - term: galaxy
    aliases: [galaxies]
    definition: "Galaxy: a huge group of billions of stars held together by gravity; our Sun is in the Milky Way
      galaxy."
    kcs: ["kc.phy.o.stars.light_years", "kc.phy.o.stars.expanding_universe"]
  - term: galvanometer
    definition: "Galvanometer: a sensitive meter, often with zero in the centre, that detects small currents and
      shows their direction."
    kcs: ["kc.phy.o.electromagnetism.electromagnetic_induction"]
  - term: gamma ray
    aliases: [gamma, gamma radiation]
    definition: "Gamma rays: electromagnetic waves of very short wavelength emitted by unstable nuclei. No charge
      or mass; weakly ionising; most penetrating, reduced by thick lead or concrete."
    kcs: ["kc.phy.o.radioactivity.types_of_radiation", "kc.phy.o.em_spectrum.order_and_properties"]
  - term: gas pressure
    definition: "Gas pressure: caused by gas particles colliding with the walls of the container; more frequent or
      harder collisions give a higher pressure."
    kcs: ["kc.phy.o.particles.gas_pressure_particles", "kc.phy.o.pressure.gas_and_atmospheric_pressure"]
  - term: geiger-muller tube
    definition: "Geiger-Muller (GM) tube: a detector that gives a pulse each time ionising radiation enters it;
      joined to a counter it measures the count."
    kcs: ["kc.phy.o.radioactivity.background_radiation"]
  - term: geiger counter
    definition: "Geiger counter: a Geiger-Muller tube joined to a counter or ratemeter, used to measure the count
      rate of radiation."
    kcs: ["kc.phy.o.radioactivity.background_radiation"]
  - term: geostationary
    definition: "Geostationary orbit: an orbit above the equator with a period of one day, moving the same way the
      Earth turns, so the satellite stays above one place."
    kcs: ["kc.phy.o.solar_system.orbital_speed"]
  - term: geothermal
    definition: "Geothermal energy: energy from hot rocks underground, used to heat water to make steam for
      heating or generating electricity; renewable."
    kcs: ["kc.phy.o.energy.energy_resources"]
  - term: giga
    definition: "Giga (G): a prefix meaning one thousand million times (ten to the power nine)."
    kcs: ["kc.phy.o.measurement.si_prefixes"]
  - term: gigahertz
    definition: "Gigahertz (GHz): a unit of frequency equal to one thousand million hertz."
    kcs: ["kc.phy.o.em_spectrum.em_wave_calculations"]
  - term: gradient
    definition: "Gradient: the steepness of a graph line, change in the y quantity / change in the x quantity. On
      a distance-time graph it gives speed; on a velocity-time graph, acceleration."
    kcs: ["kc.phy.o.motion.distance_time_gradient", "kc.phy.o.motion.velocity_time_gradient"]
  - term: gravitational field strength
    definition: "Gravitational field strength (g): the gravitational force per unit mass, g = W / m, in N/kg;
      about nine point eight N/kg on Earth, less on the Moon."
    kcs: ["kc.phy.o.mass_weight.weight_from_mass", "kc.phy.o.mass_weight.mass_or_weight", "kc.phy.o.energy.potential_energy"]
  - term: gravitational force
    definition: "Gravitational force: the attraction between any two masses. The Sun's gravitational force on a
      planet provides the force that keeps it in orbit."
    kcs: ["kc.phy.o.solar_system.planets_and_gravity"]
  - term: gravitational potential energy
    definition: "Gravitational potential energy: energy in the gravitational store due to height; its change is m
      x g x h, where h is the change in height."
    kcs: ["kc.phy.o.energy.potential_energy", "kc.phy.o.energy.energy_conversion"]
  - term: gravitational store
    definition: "Gravitational store: energy held by an object because of its height in a gravitational field; it
      increases when the object is raised."
    kcs: ["kc.phy.o.energy.stores_and_transfers", "kc.phy.o.energy.potential_energy"]
  - term: gravity
    definition: "Gravity: the attractive force between masses; on Earth it pulls objects downwards, giving them
      weight, W = m x g."
    kcs: ["kc.phy.o.mass_weight.weight_from_mass", "kc.phy.o.motion.free_fall"]
  - term: half-life
    definition: "Half-life: the time taken for half the unstable nuclei in a sample to decay, so the activity or
      count rate falls to half."
    kcs: ["kc.phy.o.radioactivity.half_life", "kc.phy.o.radioactivity.uses_and_safety"]
  - term: hard magnetic material
    definition: "Hard magnetic material: a material such as steel that is hard to magnetise but keeps its
      magnetism; used for permanent magnets."
    kcs: ["kc.phy.o.magnetism.magnets_and_materials"]
  - term: heating element
    definition: "Heating element: a resistor in an appliance designed to transfer electrical energy to thermal
      energy, as in a kettle or heater."
    kcs: ["kc.phy.o.circuits.parallel_circuits"]
  - term: helium nucleus
    definition: "Helium nucleus: two protons and two neutrons; this is what an alpha particle is."
    kcs: ["kc.phy.o.radioactivity.types_of_radiation"]
  - term: hemisphere
    definition: "Hemisphere: half of the Earth, north or south of the equator. The hemisphere tilted towards the
      Sun has summer."
    kcs: ["kc.phy.o.solar_system.earth_and_moon"]
  - term: hertz
    definition: "Hertz (Hz): the unit of frequency; one hertz is one complete wave or cycle per second."
    kcs: ["kc.phy.o.wave_properties.describing_waves", "kc.phy.o.wave_properties.wave_equation"]
  - term: hooke's law
    definition: "Hooke's law: the extension of a spring is proportional to the force on it, F = k x x, up to the
      limit of proportionality."
    kcs: [kc.phy.o.forces.springs]
  - term: hubble constant
    definition: "Hubble constant (H): the recession speed of a galaxy divided by its distance from us; its unit is
      per second."
    kcs: ["kc.phy.o.stars.expanding_universe"]
  - term: hubble's law
    definition: "Hubble's law: the speed at which a galaxy moves away from us is proportional to its distance, v =
      H x d."
    kcs: ["kc.phy.o.stars.expanding_universe"]
  - term: hydroelectric
    definition: "Hydroelectric power: water stored behind a dam flows down through turbines, transferring
      gravitational energy to electrical energy; renewable."
    kcs: ["kc.phy.o.energy.energy_resources"]
  - term: ideal transformer
    definition: "Ideal transformer: a transformer with no energy losses, so input power equals output power, V p x
      I p = V s x I s."
    kcs: ["kc.phy.o.electromagnetism.power_transmission"]
  - term: image
    definition: "Image: where light from an object appears to come from, or meets, after reflection or refraction;
      described by position, size, upright or inverted, and real or virtual."
    kcs: ["kc.phy.o.light.plane_mirrors", "kc.phy.o.light.converging_lens"]
  - term: impulse
    definition: "Impulse: force x time for which it acts, F x t; it equals the change in momentum, in newton
      seconds (N s)."
    kcs: [kc.phy.o.momentum.impulse]
  - term: incident ray
    definition: "Incident ray: the ray of light travelling towards a surface, before it is reflected or
      refracted."
    kcs: ["kc.phy.o.light.plane_mirrors"]
  - term: induce
    aliases: [induced]
    definition: "Induce: to produce an e.m.f. in a conductor by changing the magnetic field through it; if the
      circuit is complete, a current flows."
    kcs: ["kc.phy.o.electromagnetism.electromagnetic_induction"]
  - term: induced current
    definition: "Induced current: the current that flows in a complete circuit because of an induced e.m.f.; it
      flows only while the magnetic field through the circuit is changing."
    kcs: ["kc.phy.o.electromagnetism.electromagnetic_induction"]
  - term: induced magnetism
    definition: "Induced magnetism: a magnetic material becoming a temporary magnet when placed near a magnet; the
      near end gets the opposite pole, so it is attracted."
    kcs: ["kc.phy.o.magnetism.magnets_and_materials"]
  - term: infrared
    aliases: [infrared radiation]
    definition: "Infrared radiation: electromagnetic waves just longer in wavelength than red light, given out by
      all warm objects; hotter objects emit more."
    kcs: ["kc.phy.o.heat_transfer.radiation", "kc.phy.o.em_spectrum.order_and_properties"]
  - term: input power
    definition: "Input power: the power supplied to the primary coil of a transformer, V p x I p; for an ideal
      transformer it equals the output power."
    kcs: ["kc.phy.o.electromagnetism.power_transmission"]
  - term: input voltage
    definition: "Input voltage: the voltage supplied to a device, such as across the primary coil of a transformer
      or across the whole of a potential divider."
    kcs: [kc.phy.o.electromagnetism.transformers, "kc.phy.o.circuits.potential_dividers"]
  - term: insulation
    definition: "Insulation (electrical): plastic or rubber covering on wires and appliances that stops current
      reaching people; damaged insulation is a shock hazard."
    kcs: ["kc.phy.o.practical_electricity.fuses_and_safety"]
  - term: insulator
    definition: "Insulator: a material that does not let electric charge or thermal energy pass through easily,
      such as plastic, rubber, glass or air."
    kcs: ["kc.phy.o.electrical_quantities.electric_charge", "kc.phy.o.heat_transfer.conduction"]
  - term: inversely proportional
    definition: "Inversely proportional: when one quantity doubles the other halves, so their product stays
      constant."
    kcs: ["kc.phy.o.heat_transfer.conduction"]
  - term: inverted
    definition: "Inverted: an image that is upside down compared with the object."
    kcs: ["kc.phy.o.light.converging_lens"]
  - term: ionisation
    aliases: [ionise, ionising]
    definition: "Ionisation: knocking electrons off atoms so they become charged ions. Alpha is the most ionising,
      gamma the least; ionising radiation can damage living cells."
    kcs: ["kc.phy.o.radioactivity.types_of_radiation", "kc.phy.o.radioactivity.uses_and_safety"]
  - term: iron core
    definition: "Iron core: soft iron inside a coil that makes the magnetic field much stronger and, in a
      transformer, links the field of the primary coil to the secondary coil."
    kcs: ["kc.phy.o.electromagnetism.fields_of_currents", kc.phy.o.electromagnetism.transformers]
  - term: irradiate
    definition: "Irradiate: to expose an object to ionising radiation, for example to kill bacteria. The object
      does not become radioactive."
    kcs: ["kc.phy.o.radioactivity.uses_and_safety"]
  - term: irregular solid
    definition: "Irregular solid: an object whose volume cannot be worked out from its measurements; it is found
      by displacement of water."
    kcs: ["kc.phy.o.density.measuring_density"]
  - term: isotope
    definition: "Isotopes: atoms of the same element with the same proton number but different nucleon numbers, so
      a different number of neutrons."
    kcs: [kc.phy.o.atom.isotopes]
  - term: joule
    definition: "Joule (J): the unit of energy and work done; one joule is transferred when a force of one newton
      moves through one metre."
    kcs: ["kc.phy.o.energy.work_done", "kc.phy.o.energy.kinetic_energy"]
  - term: junction
    definition: "Junction: a point where a circuit splits or joins. The current into a junction equals the current
      out of it."
    kcs: ["kc.phy.o.circuits.parallel_circuits", "kc.phy.o.circuits.mixed_circuits"]
  - term: kelvin
    definition: "Kelvin (K): the unit of thermodynamic temperature; zero kelvin is absolute zero, and kelvin =
      degrees Celsius + two hundred and seventy-three."
    kcs: ["kc.phy.o.particles.temperature_scales"]
  - term: kilo
    definition: "Kilo (k): a prefix meaning one thousand times, as in kilometre or kilogram."
    kcs: ["kc.phy.o.measurement.si_prefixes"]
  - term: kilogram
    definition: "Kilogram (kg): the SI unit of mass; one kilogram is one thousand grams."
    kcs: ["kc.phy.o.mass_weight.mass_or_weight", "kc.phy.o.density.density_calculation"]
  - term: kilogram metre per second
    definition: "Kilogram metre per second (kg m/s): the unit of momentum, the same as the newton second (N s)."
    kcs: ["kc.phy.o.momentum.momentum_calculation"]
  - term: kilohertz
    definition: "Kilohertz (kHz): a unit of frequency equal to one thousand hertz."
    kcs: ["kc.phy.o.sound.pitch_and_loudness", "kc.phy.o.wave_properties.wave_equation"]
  - term: kilojoule
    definition: "Kilojoule (kJ): a unit of energy equal to one thousand joules."
    kcs: ["kc.phy.o.thermal_properties.specific_heat_capacity", "kc.phy.o.thermal_properties.latent_heat"]
  - term: kilometres per hour
    definition: "Kilometres per hour (km/h): a unit of speed. To get metres per second, multiply by one thousand
      and divide by three thousand six hundred."
    kcs: ["kc.phy.o.motion.speed_unit_conversion"]
  - term: kilopascal
    definition: "Kilopascal (kPa): a unit of pressure equal to one thousand pascals (newtons per square metre)."
    kcs: ["kc.phy.o.pressure.liquid_pressure", "kc.phy.o.pressure.gas_and_atmospheric_pressure"]
  - term: kilowatt
    definition: "Kilowatt (kW): a unit of power equal to one thousand watts (joules per second)."
    kcs: [kc.phy.o.energy.power, "kc.phy.o.practical_electricity.energy_cost"]
  - term: kilowatt-hour
    definition: "Kilowatt-hour (kWh): a unit of energy, the energy a one-kilowatt appliance uses in one hour,
      equal to three point six million joules. Energy = power in kW x time in hours."
    kcs: ["kc.phy.o.practical_electricity.energy_cost"]
    wrong: [kilowatt per hour, kilowatts per hour]
  - term: kinetic energy
    definition: "Kinetic energy: energy an object has because it is moving, E k = half x m x v squared, in
      joules."
    kcs: ["kc.phy.o.energy.kinetic_energy", "kc.phy.o.energy.energy_conversion"]
  - term: kinetic particle model
    definition: "Kinetic particle model: all matter is made of tiny particles in constant motion; their
      arrangement and motion explain solids, liquids and gases."
    kcs: ["kc.phy.o.particles.states_of_matter"]
  - term: kinetic store
    definition: "Kinetic store: energy held by a moving object; it increases when the object speeds up."
    kcs: ["kc.phy.o.energy.stores_and_transfers", "kc.phy.o.energy.kinetic_energy"]
  - term: latent heat
    definition: "Latent heat: energy taken in or given out during a change of state with no change in temperature.
      Specific latent heat L = E / m, in J/kg."
    kcs: ["kc.phy.o.thermal_properties.latent_heat"]
  - term: law of reflection
    definition: "Law of reflection: the angle of incidence equals the angle of reflection, both measured from the
      normal."
    kcs: ["kc.phy.o.light.plane_mirrors"]
  - term: lens
    definition: "Lens: a shaped piece of glass or plastic that refracts light to form an image."
    kcs: ["kc.phy.o.light.converging_lens"]
  - term: lever
    definition: "Lever: a rigid bar that turns about a pivot, so a small force far from the pivot can balance a
      larger force close to it."
    kcs: [kc.phy.o.forces.moments]
  - term: light-dependent resistor
    definition: "Light-dependent resistor (LDR): a resistor whose resistance decreases as the light falling on it
      gets brighter."
    kcs: ["kc.phy.o.circuits.circuit_components", "kc.phy.o.circuits.potential_dividers"]
  - term: light-emitting diode
    definition: "Light-emitting diode (LED): a diode that gives out light when current flows through it in the
      forward direction."
    kcs: ["kc.phy.o.circuits.circuit_components"]
  - term: light-year
    definition: "Light-year: a unit of distance, the distance light travels through space in one year, about nine
      and a half million million kilometres."
    kcs: ["kc.phy.o.stars.light_years"]
  - term: limit of proportionality
    definition: "Limit of proportionality: the point beyond which extension is no longer proportional to the force
      on a spring; the force-extension graph starts to curve."
    kcs: [kc.phy.o.forces.springs]
  - term: liquid pressure
    definition: "Liquid pressure: pressure in a liquid acts in all directions and increases with depth and
      density; change in pressure = rho x g x change in depth."
    kcs: ["kc.phy.o.pressure.liquid_pressure"]
  - term: live wire
    definition: "Live wire: the brown wire carrying the alternating voltage from the mains; the fuse and switch
      are placed in it."
    kcs: ["kc.phy.o.practical_electricity.fuses_and_safety"]
  - term: longitudinal
    definition: "Longitudinal wave: the particles vibrate parallel to the direction the wave travels, making
      compressions and rarefactions; sound is an example."
    kcs: ["kc.phy.o.wave_properties.transverse_and_longitudinal", "kc.phy.o.sound.sound_waves"]
  - term: longitudinal wave
    definition: "Longitudinal wave: a wave in which the particles vibrate parallel to the direction the wave
      travels, making compressions and rarefactions; sound waves and seismic P-waves are examples."
    kcs: ["kc.phy.o.wave_properties.transverse_and_longitudinal", "kc.phy.o.sound.sound_waves"]
  - term: transverse wave
    aliases: [transverse]
    definition: "Transverse wave: a wave in which the vibrations are at right angles to the direction the wave
      travels; light and all electromagnetic waves, water ripples and seismic S-waves are examples."
    kcs: ["kc.phy.o.wave_properties.transverse_and_longitudinal", "kc.phy.o.em_spectrum.order_and_properties"]
  - term: p-wave
    definition: "P-wave: a longitudinal seismic wave from an earthquake; it travels through both solids and
      liquids."
    kcs: ["kc.phy.o.wave_properties.transverse_and_longitudinal"]
  - term: s-wave
    definition: "S-wave: a transverse seismic wave from an earthquake; it travels through solids but not through
      liquids."
    kcs: ["kc.phy.o.wave_properties.transverse_and_longitudinal"]
  - term: seismic wave
    definition: "Seismic wave: a wave produced by an earthquake that travels through the Earth; P-waves are
      longitudinal and S-waves are transverse."
    kcs: ["kc.phy.o.wave_properties.transverse_and_longitudinal"]
  - term: rarefaction
    definition: "Rarefaction: a region of a longitudinal wave where the particles are spread further apart than
      normal, so the pressure is lower."
    kcs: ["kc.phy.o.sound.sound_waves", "kc.phy.o.wave_properties.transverse_and_longitudinal"]
  - term: oscillation
    definition: "Oscillation: a repeated back-and-forth movement about a rest position; one complete oscillation
      ends where it started, moving the same way."
    kcs: ["kc.phy.o.wave_properties.describing_waves", "kc.phy.o.measurement.measuring_techniques"]
  - term: vibration
    aliases: [vibrate]
    definition: "Vibration: a rapid back-and-forth movement about a fixed position; vibrating sources make sound,
      and vibrating particles pass energy along in conduction."
    kcs: ["kc.phy.o.sound.sound_waves", "kc.phy.o.sound.pitch_and_loudness"]
  - term: rest position
    definition: "Rest position: the undisturbed position of the particles or the medium when no wave passes; the
      amplitude is measured from it to a crest or trough."
    kcs: ["kc.phy.o.wave_properties.describing_waves"]
  - term: period
    definition: "Period (T): the time for one complete oscillation or for one complete wave to pass a point,
      measured in seconds; T = one / f."
    kcs: ["kc.phy.o.wave_properties.describing_waves", "kc.phy.o.oscilloscope.time_base", "kc.phy.o.measurement.measuring_techniques"]
  - term: trough
    definition: "Trough: a lowest point of a transverse wave, the greatest displacement below the rest position."
    kcs: ["kc.phy.o.wave_properties.describing_waves"]
  - term: wavelength
    definition: "Wavelength (λ): the distance between two neighbouring crests, or any two neighbouring points at
      the same stage of the wave, measured in metres."
    kcs: ["kc.phy.o.wave_properties.describing_waves", "kc.phy.o.wave_properties.wave_equation", "kc.phy.o.em_spectrum.em_wave_calculations"]
  - term: wave equation
    definition: "Wave equation: wave speed = frequency x wavelength, v = f x λ, with v in m/s, f in hertz and λ in
      metres."
    kcs: ["kc.phy.o.wave_properties.wave_equation"]
  - term: wave speed
    definition: "Wave speed: the distance a wave travels per unit time, measured in m/s; v = f x λ. It depends on
      the medium, so it changes when a wave refracts."
    kcs: ["kc.phy.o.wave_properties.wave_equation", "kc.phy.o.wave_properties.wave_behaviour", "kc.phy.o.em_spectrum.em_wave_calculations"]
  - term: wavefront
    definition: "Wavefront: a line joining points on a wave that are at the same stage, such as along one crest;
      the wave travels at right angles to its wavefronts."
    kcs: ["kc.phy.o.wave_properties.wave_behaviour"]
  - term: ripple tank
    definition: "Ripple tank: a shallow tank of water in which water waves are made and watched to show
      reflection, refraction and diffraction."
    kcs: ["kc.phy.o.wave_properties.wave_behaviour"]
  - term: reflection
    aliases: [reflect]
    definition: "Reflection: the bouncing back of a wave from a surface; the angle of incidence equals the angle
      of reflection, both measured from the normal. An echo is reflected sound."
    kcs: ["kc.phy.o.wave_properties.wave_behaviour", "kc.phy.o.light.plane_mirrors", "kc.phy.o.sound.speed_and_echoes"]
  - term: refraction
    aliases: [refract]
    definition: "Refraction: the change in direction of a wave when it crosses into a different medium at an
      angle, because its speed changes there; the frequency stays the same."
    kcs: [kc.phy.o.light.refraction, "kc.phy.o.wave_properties.wave_behaviour"]
  - term: medium
    definition: "Medium: the material a wave travels through, such as air, water or glass. Sound needs a medium;
      electromagnetic waves can also travel through a vacuum."
    kcs: ["kc.phy.o.sound.sound_waves", "kc.phy.o.light.speed_in_medium", kc.phy.o.light.refraction]
  - term: vacuum
    definition: "Vacuum: a space with no particles of matter in it. Sound cannot travel through a vacuum;
      electromagnetic waves travel through it at the speed of light."
    kcs: ["kc.phy.o.sound.sound_waves", "kc.phy.o.em_spectrum.order_and_properties", "kc.phy.o.light.speed_in_medium"]
    wrong: [sound can travel through a vacuum, sound travels through a vacuum]
  - term: sound wave
    definition: "Sound wave: a longitudinal wave of compressions and rarefactions made by a vibrating source; it
      needs a medium and cannot travel through a vacuum."
    kcs: ["kc.phy.o.sound.sound_waves", "kc.phy.o.sound.speed_and_echoes"]
  - term: speed of sound
    definition: "Speed of sound: about three hundred and thirty to three hundred and fifty m/s in air; sound
      travels faster in liquids and faster still in solids."
    kcs: ["kc.phy.o.sound.speed_and_echoes"]
  - term: pitch
    definition: "Pitch: how high or low a sound is; a higher frequency gives a higher pitch."
    kcs: ["kc.phy.o.sound.pitch_and_loudness"]
    wrong: [pitch depends on amplitude, pitch depends on the amplitude]
  - term: loudness
    definition: "Loudness: how loud a sound is; a larger amplitude gives a louder sound."
    kcs: ["kc.phy.o.sound.pitch_and_loudness"]
    wrong: [loudness depends on frequency, loudness depends on the frequency]
  - term: range of human hearing
    definition: "Range of human hearing: the frequencies a healthy young person can hear, from about twenty hertz
      to about twenty kilohertz."
    kcs: ["kc.phy.o.sound.pitch_and_loudness"]
  - term: ultrasound
    definition: "Ultrasound: sound with a frequency above about twenty kilohertz, too high for humans to hear;
      used in medical scanning, sonar and finding cracks in materials."
    kcs: [kc.phy.o.sound.ultrasound]
  - term: sonar
    definition: "Sonar: sending ultrasound pulses through water and timing their echoes to find depths or objects;
      distance = speed x time / two, since the pulse goes there and back."
    kcs: [kc.phy.o.sound.ultrasound]
  - term: pulse
    definition: "Pulse: a short burst of waves; the time for a pulse to return as an echo is used to find a
      distance."
    kcs: [kc.phy.o.sound.ultrasound]
  - term: oscilloscope
    definition: "Oscilloscope: an instrument that draws a trace of a voltage against time on a screen marked in
      divisions, used to measure periods, frequencies and peak voltages."
    kcs: ["kc.phy.o.oscilloscope.time_base", "kc.phy.o.oscilloscope.y_gain"]
  - term: trace
    definition: "Trace: the line drawn on an oscilloscope screen showing how the input voltage changes with time."
    kcs: ["kc.phy.o.oscilloscope.time_base", "kc.phy.o.oscilloscope.y_gain"]
  - term: time base
    aliases: [time-base]
    definition: "Time base: the oscilloscope setting that gives the time for each horizontal division, such as
      milliseconds per division; period = divisions for one wave x time-base setting."
    kcs: ["kc.phy.o.oscilloscope.time_base"]
  - term: y-gain
    definition: "Y-gain: the oscilloscope setting that gives the voltage for each vertical division, such as volts
      per division."
    kcs: ["kc.phy.o.oscilloscope.y_gain"]
  - term: peak voltage
    definition: "Peak voltage: the greatest voltage of a signal, measured from the centre line of the trace to a
      peak; peak voltage = vertical divisions x Y-gain setting."
    kcs: ["kc.phy.o.oscilloscope.y_gain"]
  - term: spectrum
    definition: "Electromagnetic spectrum: the family of electromagnetic waves in order of wavelength: radio
      waves, microwaves, infrared, visible light, ultraviolet, X-rays and gamma rays."
    kcs: ["kc.phy.o.em_spectrum.order_and_properties"]
  - term: radio wave
    definition: "Radio wave: the electromagnetic waves with the longest wavelength and lowest frequency; used for
      radio and television broadcasting and in radio astronomy."
    kcs: ["kc.phy.o.em_spectrum.order_and_properties", "kc.phy.o.em_spectrum.uses_and_hazards"]
  - term: microwave
    definition: "Microwave: electromagnetic waves between radio waves and infrared; used for mobile phones,
      satellite communication and microwave ovens; they can heat body tissue internally."
    kcs: ["kc.phy.o.em_spectrum.order_and_properties", "kc.phy.o.em_spectrum.uses_and_hazards"]
  - term: visible light
    definition: "Visible light: the only part of the electromagnetic spectrum our eyes detect, from red (longest
      wavelength) to violet (shortest)."
    kcs: ["kc.phy.o.em_spectrum.order_and_properties", "kc.phy.o.em_spectrum.uses_and_hazards"]
  - term: ultraviolet
    definition: "Ultraviolet: electromagnetic waves just beyond violet light, between visible light and X-rays;
      used for security marks and sterilising water; it can damage skin and eyes."
    kcs: ["kc.phy.o.em_spectrum.order_and_properties", "kc.phy.o.em_spectrum.uses_and_hazards"]
  - term: x-ray
    definition: "X-ray: short-wavelength electromagnetic waves between ultraviolet and gamma rays; used for
      medical and security imaging; they are ionising and can cause cell damage and cancer."
    kcs: ["kc.phy.o.em_spectrum.order_and_properties", "kc.phy.o.em_spectrum.uses_and_hazards"]
  - term: radar
    definition: "Radar: finding the position of an object such as an aircraft by sending out pulses of radio waves
      or microwaves and timing their reflections."
    kcs: ["kc.phy.o.em_spectrum.uses_and_hazards"]
  - term: speed of light
    definition: "Speed of light: the speed of all electromagnetic waves in a vacuum, about three hundred million
      metres per second (three times ten to the power eight m/s); light is slower in glass or water."
    kcs: ["kc.phy.o.em_spectrum.em_wave_calculations", "kc.phy.o.light.speed_in_medium", "kc.phy.o.stars.light_years"]
  - term: megahertz
    definition: "Megahertz (MHz): a unit of frequency equal to one million hertz."
    kcs: ["kc.phy.o.em_spectrum.em_wave_calculations"]
  - term: satellite
    definition: "Satellite: an object that orbits a larger body; the Moon is a natural satellite, and artificial
      satellites relay communications using microwaves."
    kcs: ["kc.phy.o.solar_system.orbital_speed", "kc.phy.o.em_spectrum.uses_and_hazards"]
  - term: sterilise
    aliases: [sterilising]
    definition: "Sterilise: to kill bacteria and other microorganisms, for example on medical equipment or food,
      using gamma rays or ultraviolet."
    kcs: ["kc.phy.o.radioactivity.uses_and_safety", "kc.phy.o.em_spectrum.uses_and_hazards"]
  - term: normal
    definition: "Normal: a line drawn at right angles to a surface at the point where a ray meets it; angles of
      incidence, reflection and refraction are measured from it."
    kcs: ["kc.phy.o.light.plane_mirrors", kc.phy.o.light.refraction, "kc.phy.o.light.total_internal_reflection"]
  - term: ray
    definition: "Ray: a straight line with an arrow showing the direction in which light travels."
    kcs: [kc.phy.o.light.refraction]
  - term: reflected ray
    definition: "Reflected ray: the ray that leaves a mirror after reflection; it makes the same angle with the
      normal as the incident ray."
    kcs: ["kc.phy.o.light.plane_mirrors"]
  - term: plane mirror
    definition: "Plane mirror: a flat mirror; its image is virtual, upright, the same size as the object,
      laterally inverted, and as far behind the mirror as the object is in front."
    kcs: ["kc.phy.o.light.plane_mirrors"]
  - term: refractive index
    definition: "Refractive index (n): n = sin i / sin r, also equal to the speed of light in a vacuum divided by
      the speed of light in the material; it has no unit."
    kcs: [kc.phy.o.light.refraction, "kc.phy.o.light.speed_in_medium", "kc.phy.o.light.total_internal_reflection"]
  - term: sine
    definition: "Sine (sin): the trigonometric ratio of an angle used in refraction: n = sin i / sin r, and at the
      critical angle c, sin c = one / n."
    kcs: [kc.phy.o.light.refraction, "kc.phy.o.light.total_internal_reflection"]
  - term: total internal reflection
    aliases: [totally internally reflected]
    definition: "Total internal reflection: when light going towards a material of lower refractive index meets
      the boundary at an angle of incidence greater than the critical angle, all of it is reflected back."
    kcs: ["kc.phy.o.light.total_internal_reflection"]
  - term: optical fibre
    definition: "Optical fibre: a thin glass fibre that carries light along it by repeated total internal
      reflection; used in communications and endoscopes."
    kcs: ["kc.phy.o.light.total_internal_reflection"]
  - term: principal axis
    definition: "Principal axis: the line through the centre of a lens at right angles to the lens."
    kcs: ["kc.phy.o.light.converging_lens"]
  - term: principal focus
    definition: "Principal focus (F): the point on the principal axis where rays parallel to the axis meet after
      passing through a converging lens."
    kcs: ["kc.phy.o.light.converging_lens"]
  - term: real image
    definition: "Real image: an image formed where light rays actually meet, so it can be shown on a screen; a
      converging lens forms a real, inverted image of an object beyond F."
    kcs: ["kc.phy.o.light.converging_lens"]
  - term: virtual image
    definition: "Virtual image: an image from which light rays only appear to come, so it cannot be shown on a
      screen; a plane mirror and a magnifying glass give virtual images."
    kcs: ["kc.phy.o.light.plane_mirrors", "kc.phy.o.light.converging_lens"]
  - term: magnified
    definition: "Magnified: describes an image that is larger than the object."
    kcs: ["kc.phy.o.light.converging_lens"]
  - term: upright
    definition: "Upright: describes an image the same way up as the object, not inverted."
    kcs: ["kc.phy.o.light.converging_lens"]
  - term: magnet
    definition: "Magnet: an object with a north pole and a south pole that produces a magnetic field and attracts
      magnetic materials."
    kcs: ["kc.phy.o.magnetism.magnets_and_materials"]
  - term: magnetic material
    definition: "Magnetic material: a material that is attracted by a magnet and can be magnetised, such as iron,
      steel, nickel and cobalt."
    kcs: ["kc.phy.o.magnetism.magnets_and_materials"]
  - term: soft magnetic material
    definition: "Soft magnetic material: a material such as iron that is easily magnetised and easily loses its
      magnetism; used in electromagnets and transformer cores."
    kcs: ["kc.phy.o.magnetism.magnets_and_materials"]
  - term: permanent magnet
    definition: "Permanent magnet: a magnet made of a hard magnetic material such as steel, which keeps its
      magnetism."
    kcs: ["kc.phy.o.magnetism.magnets_and_materials"]
  - term: magnetic pole
    aliases: [pole]
    definition: "Magnetic pole: an end of a magnet where its field is strongest; like poles repel and unlike poles
      attract."
    kcs: ["kc.phy.o.magnetism.magnets_and_materials", "kc.phy.o.magnetism.magnetic_fields"]
  - term: north pole
    definition: "North pole: the end of a freely hanging magnet that points towards the Earth's geographic north;
      magnetic field lines point away from it."
    kcs: ["kc.phy.o.magnetism.magnets_and_materials", "kc.phy.o.magnetism.magnetic_fields"]
  - term: south pole
    definition: "South pole: the end of a freely hanging magnet that points towards the Earth's geographic south;
      magnetic field lines point towards it."
    kcs: ["kc.phy.o.magnetism.magnets_and_materials", "kc.phy.o.magnetism.magnetic_fields"]
  - term: repel
    aliases: [repulsion]
    definition: "Repel: to push apart. Like magnetic poles repel, and like charges repel; repulsion is the only
      sure test that an object is a magnet."
    kcs: ["kc.phy.o.magnetism.magnets_and_materials", "kc.phy.o.electrical_quantities.electric_charge"]
  - term: magnetic field
    definition: "Magnetic field: the region around a magnet or a current-carrying wire where a magnetic pole or
      magnetic material feels a force."
    kcs: ["kc.phy.o.magnetism.magnetic_fields", "kc.phy.o.electromagnetism.fields_of_currents"]
  - term: magnetic field line
    definition: "Magnetic field line: a line showing the direction of the force on a north pole, pointing from
      north to south outside a magnet; lines closer together mean a stronger field."
    kcs: ["kc.phy.o.magnetism.magnetic_fields", "kc.phy.o.electromagnetism.fields_of_currents"]
  - term: plotting compass
    definition: "Plotting compass: a small compass whose needle lines up with a magnetic field, used to trace the
      direction of field lines."
    kcs: ["kc.phy.o.magnetism.magnetic_fields"]
  - term: solenoid
    definition: "Solenoid: a long coil of wire; a current through it makes a magnetic field like a bar magnet's,
      strong and nearly uniform inside the coil."
    kcs: ["kc.phy.o.electromagnetism.fields_of_currents"]
  - term: right-hand grip rule
    definition: "Right-hand grip rule: grip the wire with the right hand, thumb along the conventional current;
      the curled fingers show the direction of the magnetic field lines."
    kcs: ["kc.phy.o.electromagnetism.fields_of_currents"]
  - term: turns
    definition: "Turns: the number of loops of wire in a coil; more turns give a stronger electromagnet, and the
      turns on each transformer coil set its voltages."
    kcs: ["kc.phy.o.electromagnetism.fields_of_currents", kc.phy.o.electromagnetism.transformers]
  - term: motor effect
    definition: "Motor effect: a current-carrying wire in a magnetic field feels a force; the force is greatest
      when the wire is at right angles to the field and reverses if current or field reverses."
    kcs: ["kc.phy.o.electromagnetism.motor_effect"]
  - term: motor
    definition: "Motor: an electric motor uses the motor effect on a current-carrying coil in a magnetic field to
      transfer electrical energy to kinetic energy; some energy is wasted as thermal energy."
    kcs: [kc.phy.o.energy.efficiency]
  - term: split-ring commutator
    definition: "Split-ring commutator: the split ring on a d.c. motor that reverses the current in the coil every
      half turn, so the coil keeps turning the same way."
    kcs: ["kc.phy.o.electromagnetism.motor_effect"]
  - term: slip ring
    definition: "Slip ring: one of a pair of whole rings on an a.c. generator's coil that keep contact with the
      brushes without reversing the connection, so the output is alternating."
    kcs: ["kc.phy.o.electromagnetism.electromagnetic_induction"]
  - term: transformer
    definition: "Transformer: a primary coil and a secondary coil on a soft iron core; an alternating current in
      the primary induces an alternating voltage in the secondary. It works only with a.c."
    kcs: [kc.phy.o.electromagnetism.transformers, "kc.phy.o.electromagnetism.power_transmission"]
  - term: primary coil
    definition: "Primary coil: the input coil of a transformer, connected to the alternating supply."
    kcs: [kc.phy.o.electromagnetism.transformers]
  - term: secondary coil
    definition: "Secondary coil: the output coil of a transformer, in which the changing magnetic field induces an
      alternating voltage."
    kcs: [kc.phy.o.electromagnetism.transformers]
  - term: turns ratio
    definition: "Turns ratio: the number of turns on the primary coil compared with the secondary; for a
      transformer Vp / Vs = Np / Ns."
    kcs: [kc.phy.o.electromagnetism.transformers]
  - term: step-up
    definition: "Step-up transformer: a transformer with more turns on the secondary than on the primary, so the
      output voltage is higher than the input voltage."
    kcs: [kc.phy.o.electromagnetism.transformers, "kc.phy.o.electromagnetism.power_transmission"]
  - term: step-down
    definition: "Step-down transformer: a transformer with fewer turns on the secondary than on the primary, so
      the output voltage is lower than the input voltage."
    kcs: [kc.phy.o.electromagnetism.transformers, "kc.phy.o.electromagnetism.power_transmission"]
  - term: output voltage
    definition: "Output voltage: the voltage a device supplies at its output, such as across the secondary coil of
      a transformer or across the output resistor of a potential divider."
    kcs: [kc.phy.o.electromagnetism.transformers, "kc.phy.o.circuits.potential_dividers"]
  - term: output power
    definition: "Output power: the power delivered by the secondary coil, Vs x Is; for an ideal transformer it
      equals the input power, Vp x Ip."
    kcs: ["kc.phy.o.electromagnetism.power_transmission"]
  - term: national grid
    definition: "National grid: the network of power stations, transformers and transmission lines that carries
      electricity across a country to its users."
    kcs: ["kc.phy.o.electromagnetism.power_transmission"]
  - term: transmission line
    aliases: [power line]
    definition: "Transmission line: a cable that carries electrical power over long distances; power is sent at
      high voltage and low current to reduce the energy lost as heat in the cable."
    kcs: ["kc.phy.o.electromagnetism.power_transmission"]
  - term: negative charge
    definition: "Negative charge: the type of charge carried by electrons; an object becomes negatively charged by
      gaining electrons."
    kcs: ["kc.phy.o.electrical_quantities.electric_charge"]
  - term: positive charge
    aliases: [positively charged]
    definition: "Positive charge: the type of charge carried by protons; an object becomes positively charged by
      losing electrons, and the nucleus of an atom is positively charged."
    kcs: ["kc.phy.o.electrical_quantities.electric_charge", "kc.phy.o.atom.nuclear_model_evidence"]
  - term: uncharged
    definition: "Uncharged: having no overall charge, because the object holds equal amounts of positive and
      negative charge."
    kcs: ["kc.phy.o.electrical_quantities.electric_charge"]
  - term: milliamp
    definition: "Milliamp (mA): a unit of current equal to one thousandth of an ampere."
    kcs: ["kc.phy.o.electrical_quantities.current_and_charge"]
  - term: volt
    definition: "Volt (V): the unit of potential difference and e.m.f.; one volt is one joule of energy
      transferred per coulomb of charge."
    kcs: ["kc.phy.o.electrical_quantities.potential_difference"]
  - term: ohm
    definition: "Ohm: the unit of resistance; a resistance of one ohm lets a current of one ampere flow when the
      potential difference across it is one volt."
    kcs: ["kc.phy.o.electrical_quantities.resistance", "kc.phy.o.electrical_quantities.resistance_of_wires"]
  - term: ohmic
    definition: "Ohmic: describes a conductor, such as a fixed resistor at constant temperature, whose current is
      directly proportional to the potential difference; its I-V graph is a straight line through the origin."
    kcs: ["kc.phy.o.electrical_quantities.current_voltage_graphs"]
  - term: resistor
    definition: "Resistor: a component with a set resistance, used to control the current in a circuit."
    kcs: ["kc.phy.o.circuits.circuit_components", "kc.phy.o.electrical_quantities.resistance"]
  - term: variable resistor
    definition: "Variable resistor: a resistor whose resistance can be changed, used to vary the current in a
      circuit."
    kcs: ["kc.phy.o.circuits.circuit_components", "kc.phy.o.circuits.potential_dividers"]
  - term: thermistor
    definition: "Thermistor: a resistor whose resistance decreases as its temperature rises; used in temperature
      sensors."
    kcs: ["kc.phy.o.circuits.circuit_components", "kc.phy.o.circuits.potential_dividers"]
  - term: reverse direction
    definition: "Reverse direction: a diode connected against the arrow of its symbol; its resistance is very
      high, so almost no current flows."
    kcs: ["kc.phy.o.circuits.circuit_components"]
  - term: voltmeter
    definition: "Voltmeter: a meter that measures potential difference; it is connected in parallel across the
      component and has a very high resistance."
    kcs: ["kc.phy.o.circuits.circuit_components", "kc.phy.o.circuits.series_circuits"]
  - term: series circuit
    aliases: [series]
    definition: "Series circuit: components joined one after another in a single loop; the current is the same
      everywhere and the supply p.d. is shared between the components."
    kcs: ["kc.phy.o.circuits.series_circuits", "kc.phy.o.circuits.mixed_circuits"]
  - term: total resistance
    definition: "Total resistance: the single resistance that could replace a combination; in series it is the sum
      of the separate resistances."
    kcs: ["kc.phy.o.circuits.series_circuits"]
  - term: parallel circuit
    aliases: [parallel]
    definition: "Parallel circuit: components joined across the same two points, each in its own branch; each
      branch has the full p.d., and the branch currents add up to the total current."
    kcs: ["kc.phy.o.circuits.parallel_circuits", "kc.phy.o.circuits.mixed_circuits"]
  - term: potential divider
    definition: "Potential divider: two resistors in series across a supply; the supply p.d. is shared between
      them in the same ratio as their resistances."
    kcs: ["kc.phy.o.circuits.potential_dividers"]
  - term: power
    aliases: [power transferred]
    definition: "Power: the energy transferred or work done per unit time, P = E / t, measured in watts; in a
      circuit P = I x V."
    kcs: [kc.phy.o.energy.power, "kc.phy.o.practical_electricity.electrical_power"]
  - term: watt
    definition: "Watt (W): the unit of power; one watt is one joule transferred per second."
    kcs: [kc.phy.o.energy.power, "kc.phy.o.practical_electricity.electrical_power"]
  - term: megajoule
    definition: "Megajoule (MJ): a unit of energy equal to one million joules."
    kcs: ["kc.phy.o.practical_electricity.energy_cost"]
  - term: neutral wire
    definition: "Neutral wire: the wire that completes the circuit from an appliance back to the supply; it stays
      at or near zero potential."
    kcs: ["kc.phy.o.practical_electricity.fuses_and_safety"]
  - term: residual current device
    definition: "Residual current device (RCD): a safety device that cuts off the supply very quickly when the
      currents in the live and neutral wires become different, as when current leaks to earth."
    kcs: ["kc.phy.o.practical_electricity.fuses_and_safety"]
  - term: magnitude
    definition: "Magnitude: the size of a quantity, a number with a unit, without any direction."
    kcs: ["kc.phy.o.measurement.scalars_and_vectors", "kc.phy.o.measurement.resultant_vectors"]
  - term: scalar
    definition: "Scalar: a quantity that has magnitude only, such as distance, speed, mass, time, energy and
      temperature."
    kcs: ["kc.phy.o.measurement.scalars_and_vectors", "kc.phy.o.motion.distance_or_displacement"]
  - term: vector
    definition: "Vector: a quantity that has both magnitude and direction, such as displacement, velocity,
      acceleration, force, weight and momentum."
    kcs: ["kc.phy.o.measurement.scalars_and_vectors", "kc.phy.o.measurement.resultant_vectors"]
  - term: resultant
    definition: "Resultant: the single vector that has the same effect as all the vectors acting together; along
      one line, add those in the same direction and subtract opposite ones."
    kcs: ["kc.phy.o.measurement.resultant_vectors"]
  - term: right angles
    definition: "Right angles: perpendicular, at ninety degrees to each other; the resultant of two vectors at
      right angles is found with Pythagoras or a scale drawing."
    kcs: ["kc.phy.o.measurement.resultant_vectors"]
  - term: pythagoras
    definition: "Pythagoras: for two vectors a and b at right angles, the resultant R has R squared = a squared +
      b squared."
    kcs: ["kc.phy.o.measurement.resultant_vectors"]
  - term: scale drawing
    definition: "Scale drawing: an accurate diagram in which each vector is drawn as an arrow whose length stands
      for its size to a chosen scale; the resultant is measured from it."
    kcs: ["kc.phy.o.measurement.resultant_vectors"]
  - term: si unit
    definition: "SI unit: a unit of the international system used in science, such as the metre, kilogram, second,
      ampere and kelvin."
    kcs: ["kc.phy.o.measurement.si_prefixes"]
  - term: prefix
    definition: "Prefix: a word put before a unit to multiply it by a power of ten, such as milli (one thousandth)
      or kilo (one thousand)."
    kcs: ["kc.phy.o.measurement.si_prefixes"]
  - term: mega
    definition: "Mega (M): a prefix meaning one million times, ten to the power six."
    kcs: ["kc.phy.o.measurement.si_prefixes"]
  - term: milli
    definition: "Milli (m): a prefix meaning one thousandth, ten to the power minus three."
    kcs: ["kc.phy.o.measurement.si_prefixes"]
  - term: micro
    definition: "Micro (μ): a prefix meaning one millionth, ten to the power minus six."
    kcs: ["kc.phy.o.measurement.si_prefixes"]
  - term: nano
    definition: "Nano (n): a prefix meaning one thousand-millionth, ten to the power minus nine."
    kcs: ["kc.phy.o.measurement.si_prefixes"]
  - term: micrometer
    definition: "Micrometer: a screw gauge for measuring small lengths such as the diameter of a wire, reading to
      one hundredth of a millimetre."
    kcs: ["kc.phy.o.measurement.measuring_techniques"]
  - term: vernier calipers
    definition: "Vernier calipers: an instrument with jaws and a sliding vernier scale for measuring lengths and
      diameters to one tenth of a millimetre."
    kcs: ["kc.phy.o.measurement.measuring_techniques"]
  - term: reaction time
    definition: "Reaction time: the delay between seeing an event and responding to it; it makes hand timing
      uncertain, so many oscillations are timed together and divided."
    kcs: ["kc.phy.o.measurement.measuring_techniques"]
  - term: pendulum
    definition: "Pendulum: a mass on a string that swings to and fro; its period is found by timing many swings
      and dividing. As it swings, energy changes between gravitational potential and kinetic."
    kcs: ["kc.phy.o.measurement.measuring_techniques", "kc.phy.o.energy.energy_conversion"]
  - term: measuring cylinder
    definition: "Measuring cylinder: a marked glass or plastic cylinder for measuring the volume of a liquid, read
      at the bottom of the meniscus with the eye level with it."
    kcs: ["kc.phy.o.density.measuring_density"]
  - term: overflow can
    definition: "Overflow can: a can with a spout; an object lowered into the full can pushes out its own volume
      of water, which is collected and measured to find the object's volume."
    kcs: ["kc.phy.o.density.measuring_density"]
  - term: square metre
    definition: "Square metre (m squared): the SI unit of area, the area of a square with sides of one metre; it
      equals ten thousand square centimetres."
    kcs: ["kc.phy.o.pressure.pressure_on_surfaces"]
  - term: square centimetre
    definition: "Square centimetre (cm squared): a unit of area, the area of a square with sides of one
      centimetre; one ten-thousandth of a square metre."
    kcs: ["kc.phy.o.pressure.pressure_on_surfaces"]
  - term: metres per second
    definition: "Metres per second (m/s): the SI unit of speed and velocity; to change km/h to m/s, multiply by
      one thousand and divide by three thousand six hundred."
    kcs: ["kc.phy.o.motion.speed_unit_conversion"]
  - term: volume
    definition: "Volume: the amount of space an object or substance takes up, measured in m cubed or cm cubed."
    kcs: ["kc.phy.o.density.density_calculation", "kc.phy.o.density.measuring_density", "kc.phy.o.particles.pressure_and_volume"]
  - term: mass
    definition: "Mass: the amount of matter in an object, measured in kilograms; it is the same everywhere and
      resists changes in motion."
    kcs: ["kc.phy.o.mass_weight.mass_or_weight", "kc.phy.o.mass_weight.weight_from_mass", "kc.phy.o.density.density_calculation"]
    wrong: [mass is measured in newtons]
  - term: weight
    definition: "Weight: the gravitational force on an object, W = m x g, measured in newtons; it changes with the
      gravitational field strength, so it is less on the Moon."
    kcs: ["kc.phy.o.mass_weight.mass_or_weight", "kc.phy.o.mass_weight.weight_from_mass"]
    wrong: [weight is measured in kilograms, weight is measured in kg]
  - term: newton
    definition: "Newton (N): the SI unit of force; a resultant force of one newton gives a mass of one kilogram an
      acceleration of one metre per second squared."
    kcs: ["kc.phy.o.forces.force_mass_acceleration", "kc.phy.o.mass_weight.weight_from_mass"]
  - term: newton meter
    definition: "Newton meter: a spring balance that measures a force, such as a weight, in newtons."
    kcs: ["kc.phy.o.mass_weight.weight_from_mass", "kc.phy.o.mass_weight.mass_or_weight"]
  - term: newton metre
    definition: "Newton metre (N m): the unit of the moment of a force, force in newtons x perpendicular distance
      in metres."
    kcs: [kc.phy.o.forces.moments]
  - term: planet
    definition: "Planet: a large body that orbits the Sun, held by the Sun's gravity; each planet has its own
      gravitational field strength, so an object's weight differs there."
    kcs: ["kc.phy.o.solar_system.planets_and_gravity", "kc.phy.o.mass_weight.mass_or_weight"]
  - term: resultant force
    definition: "Resultant force: the single force with the same effect as all the forces on an object; if it is
      zero the velocity stays constant, otherwise F = m x a."
    kcs: ["kc.phy.o.forces.resultant_force", "kc.phy.o.forces.force_mass_acceleration"]
  - term: unbalanced
    definition: "Unbalanced: forces whose resultant is not zero; unbalanced forces change an object's speed or
      direction."
    kcs: ["kc.phy.o.forces.resultant_force"]
  - term: steady velocity
    definition: "Steady velocity: motion at constant speed in a straight line; it happens when the resultant force
      is zero."
    kcs: ["kc.phy.o.forces.resultant_force", "kc.phy.o.forces.force_mass_acceleration"]
  - term: terminal velocity
    definition: "Terminal velocity: the constant velocity a falling object reaches when air resistance has grown
      to equal its weight, so the resultant force is zero."
    kcs: ["kc.phy.o.forces.friction_and_terminal_velocity"]
  - term: spring
    definition: "Spring: a coil that stretches when a load is applied; within its limit of proportionality the
      extension is proportional to the force."
    kcs: [kc.phy.o.forces.springs]
  - term: spring constant
    definition: "Spring constant (k): the force per unit extension of a spring, k = F / x, measured in N/m; a
      stiffer spring has a larger k."
    kcs: [kc.phy.o.forces.springs]
  - term: moment
    definition: "Moment: the turning effect of a force, moment = force x perpendicular distance from the pivot to
      the line of action of the force, measured in N m."
    kcs: [kc.phy.o.forces.moments, "kc.phy.o.forces.centre_of_gravity"]
  - term: pivot
    definition: "Pivot: the fixed point about which an object turns; moments are taken about it."
    kcs: [kc.phy.o.forces.moments]
  - term: perpendicular distance
    definition: "Perpendicular distance: the shortest distance from the pivot to the line of action of a force,
      measured at right angles to that line."
    kcs: [kc.phy.o.forces.moments]
  - term: principle of moments
    definition: "Principle of moments: for an object in equilibrium, the sum of the clockwise moments about any
      point equals the sum of the anticlockwise moments about that point."
    kcs: [kc.phy.o.forces.moments]
  - term: stability
    aliases: [stable]
    definition: "Stability: how hard an object is to topple; a low centre of gravity and a wide base make it more
      stable, because its weight then gives a moment that turns it back."
    kcs: ["kc.phy.o.forces.centre_of_gravity"]
  - term: unstable
    definition: "Unstable: easily toppled; an object topples when its centre of gravity moves outside its base, so
      its weight gives a moment that turns it over."
    kcs: ["kc.phy.o.forces.centre_of_gravity"]
  - term: upthrust
    definition: "Upthrust: the upward force a liquid or gas exerts on an object in it; an object floats when it is
      less dense than the liquid."
    kcs: ["kc.phy.o.density.floating_and_sinking"]
  - term: speed
    definition: "Speed: the distance travelled per unit time, measured in m/s; it is a scalar, with no direction."
    kcs: ["kc.phy.o.motion.distance_or_displacement", "kc.phy.o.motion.average_speed", "kc.phy.o.motion.distance_time_gradient"]
  - term: velocity
    definition: "Velocity: the speed in a stated direction, the rate of change of displacement, measured in m/s;
      it is a vector."
    kcs: ["kc.phy.o.motion.distance_or_displacement", "kc.phy.o.measurement.scalars_and_vectors", "kc.phy.o.motion.acceleration_from_change"]
  - term: velocity-time graph
    definition: "Velocity-time graph: a graph of velocity against time; its gradient is the acceleration and the
      area under it is the distance travelled."
    kcs: ["kc.phy.o.motion.velocity_time_gradient", "kc.phy.o.motion.velocity_time_area"]
  - term: total distance
    definition: "Total distance: the full length of path travelled on a journey, all stages added together."
    kcs: ["kc.phy.o.motion.average_speed"]
  - term: total time
    definition: "Total time: the whole time taken for a journey, including any stops; average speed = total
      distance / total time."
    kcs: ["kc.phy.o.motion.average_speed"]
  - term: uniform acceleration
    definition: "Uniform acceleration: acceleration that stays constant; only then can the equations such as v = u
      + a x t and s = (u + v) x t / two be used."
    kcs: ["kc.phy.o.motion.choose_equation", "kc.phy.o.motion.solve_with_equation", "kc.phy.o.motion.free_fall"]
  - term: maximum height
    definition: "Maximum height: the highest point reached by an object thrown upwards, where its vertical
      velocity is momentarily zero."
    kcs: ["kc.phy.o.motion.free_fall"]
  - term: momentum
    definition: "Momentum: mass x velocity, p = m x v, measured in kg m/s; it is a vector, so its direction is
      shown by a sign."
    kcs: ["kc.phy.o.momentum.momentum_calculation", "kc.phy.o.momentum.conservation_of_momentum", kc.phy.o.momentum.impulse]
  - term: total momentum
    definition: "Total momentum: the sum of the momenta of all objects, with signs for direction; it is the same
      before and after a collision or explosion when no external force acts."
    kcs: ["kc.phy.o.momentum.conservation_of_momentum"]
  - term: recoil
    definition: "Recoil: the backward movement of an object, such as a gun, when it pushes something forward; if
      both start at rest the total momentum stays zero, so their momenta are equal and opposite."
    kcs: ["kc.phy.o.momentum.conservation_of_momentum"]
  - term: potential energy
    definition: "Potential energy (gravitational): energy stored because of an object's height in a gravitational
      field; the change is m x g x change in height."
    kcs: ["kc.phy.o.energy.potential_energy", "kc.phy.o.energy.energy_conversion"]
  - term: nuclear store
    definition: "Nuclear store: energy stored in the nuclei of atoms, released by nuclear fission or fusion."
    kcs: ["kc.phy.o.energy.stores_and_transfers"]
  - term: thermal store
    definition: "Thermal store: the energy an object holds because of its temperature; heating it raises its
      temperature, and wasted energy usually ends up in the thermal store of the surroundings."
    kcs: ["kc.phy.o.energy.stores_and_transfers", kc.phy.o.energy.efficiency, "kc.phy.o.thermal_properties.specific_heat_capacity"]
  - term: work done
    definition: "Work done: the energy transferred when a force moves an object, W = F x d, where d is the
      distance moved in the direction of the force; measured in joules."
    kcs: ["kc.phy.o.energy.work_done", kc.phy.o.energy.power]
  - term: total input
    definition: "Total input: all the energy (or power) supplied to a device; efficiency = useful output / total
      input."
    kcs: [kc.phy.o.energy.efficiency]
  - term: useful output
    aliases: [useful energy]
    definition: "Useful output: the energy (or power) a device transfers in the form that is wanted, such as
      kinetic energy from a motor."
    kcs: [kc.phy.o.energy.efficiency]
  - term: wasted energy
    definition: "Wasted energy: energy transferred to stores that are not wanted, usually the thermal store of the
      surroundings; it equals total input minus useful output."
    kcs: [kc.phy.o.energy.efficiency]
  - term: renewable
    aliases: [renewability]
    definition: "Renewable: an energy resource that is replaced naturally and will not run out, such as solar,
      wind, hydroelectric, tidal, geothermal and biofuels."
    kcs: ["kc.phy.o.energy.energy_resources"]
  - term: non-renewable
    definition: "Non-renewable: an energy resource that cannot be replaced once used and will run out, such as
      coal, oil, natural gas and nuclear fuel."
    kcs: ["kc.phy.o.energy.energy_resources"]
  - term: power station
    definition: "Power station: a plant that generates electricity, usually by using an energy resource to spin a
      turbine that drives a generator."
    kcs: ["kc.phy.o.energy.energy_resources", "kc.phy.o.energy.stores_and_transfers", "kc.phy.o.electromagnetism.power_transmission"]
  - term: nuclear power station
    definition: "Nuclear power station: a power station in which fission of uranium nuclei heats water to steam
      that drives turbines; it gives no carbon dioxide but leaves radioactive waste."
    kcs: ["kc.phy.o.energy.energy_resources"]
  - term: uranium
    definition: "Uranium: a heavy radioactive element whose nuclei are split by fission as the fuel in nuclear
      power stations; some of its isotopes decay by alpha emission."
    kcs: ["kc.phy.o.energy.energy_resources", "kc.phy.o.radioactivity.decay_equations"]
  - term: turbine
    definition: "Turbine: a set of blades made to spin by steam, wind or moving water; it turns a generator in a
      power station."
    kcs: ["kc.phy.o.energy.energy_resources", "kc.phy.o.energy.stores_and_transfers"]
  - term: wind turbine
    definition: "Wind turbine: a turbine turned by the wind to generate electricity; renewable and clean, but it
      gives power only when the wind blows."
    kcs: ["kc.phy.o.energy.energy_resources"]
  - term: tidal barrage
    definition: "Tidal barrage: a dam across an estuary that traps water at high tide and lets it out through
      turbines; renewable and predictable, but it changes habitats."
    kcs: ["kc.phy.o.energy.energy_resources"]
  - term: solar cell
    definition: "Solar cell: a device that transfers energy from light directly to electrical energy; renewable,
      but it gives no output at night."
    kcs: ["kc.phy.o.energy.energy_resources", kc.phy.o.energy.efficiency]
  - term: molecule
    definition: "Molecule: a group of atoms joined together; in the particle model, molecules are the particles
      whose arrangement and motion explain solids, liquids and gases."
    kcs: ["kc.phy.o.particles.states_of_matter", "kc.phy.o.particles.gas_pressure_particles"]
  - term: particle
    definition: "Particle: a tiny piece of matter, an atom, molecule or ion; the particle model explains states of
      matter, temperature and gas pressure."
    kcs: ["kc.phy.o.particles.states_of_matter", "kc.phy.o.particles.gas_pressure_particles"]
  - term: states of matter
    definition: "States of matter: solid, liquid and gas, which differ in how closely their particles are packed
      and how freely they move."
    kcs: ["kc.phy.o.particles.states_of_matter"]
  - term: vapour
    definition: "Vapour: the gas state of a substance that is a liquid or solid at room temperature, such as water
      vapour."
    kcs: ["kc.phy.o.particles.states_of_matter", "kc.phy.o.thermal_properties.changes_of_state"]
  - term: temperature
    definition: "Temperature: how hot an object is, measured in degrees Celsius or kelvin; a higher temperature
      means a higher average kinetic energy of the particles."
    kcs: ["kc.phy.o.particles.temperature_scales", "kc.phy.o.particles.gas_pressure_particles"]
  - term: proportional
    definition: "Proportional: two quantities are directly proportional when doubling one doubles the other; their
      ratio stays constant and their graph is a straight line through the origin."
    kcs: ["kc.phy.o.particles.temperature_scales"]
  - term: pressure
    definition: "Pressure: the force acting per unit area at right angles to a surface, p = F / A, measured in
      pascals; in a gas it is caused by particles colliding with the walls."
    kcs: ["kc.phy.o.pressure.pressure_on_surfaces", "kc.phy.o.particles.gas_pressure_particles", "kc.phy.o.pressure.liquid_pressure"]
  - term: pascal
    aliases: [newton per square metre]
    definition: "Pascal (Pa): the SI unit of pressure, equal to one newton per square metre."
    kcs: ["kc.phy.o.pressure.pressure_on_surfaces", "kc.phy.o.pressure.liquid_pressure"]
  - term: manometer
    definition: "Manometer: a U-tube of liquid; the difference in liquid levels shows how much a gas pressure is
      above or below atmospheric pressure."
    kcs: ["kc.phy.o.pressure.gas_and_atmospheric_pressure"]
  - term: thermal energy
    definition: "Thermal energy: energy transferred by heating because of a temperature difference; E = m x c x
      change in temperature."
    kcs: ["kc.phy.o.thermal_properties.specific_heat_capacity"]
  - term: temperature change
    aliases: [temperature rise]
    definition: "Temperature change: the final temperature minus the starting temperature; a change of one degree
      Celsius equals a change of one kelvin."
    kcs: ["kc.phy.o.thermal_properties.specific_heat_capacity"]
  - term: specific heat capacity
    definition: "Specific heat capacity (c): the energy needed to raise the temperature of one kilogram of a
      substance by one degree Celsius, measured in J/(kg °C); E = m x c x change in temperature."
    kcs: ["kc.phy.o.thermal_properties.specific_heat_capacity"]
  - term: specific latent heat
    definition: "Specific latent heat (L): the energy needed to change the state of one kilogram of a substance
      without changing its temperature, measured in J/kg; E = m x L."
    kcs: ["kc.phy.o.thermal_properties.latent_heat", "kc.phy.o.thermal_properties.changes_of_state"]
  - term: melting
    aliases: [melt]
    definition: "Melting: the change from solid to liquid; it takes in energy while the temperature stays at the
      melting point."
    kcs: ["kc.phy.o.thermal_properties.latent_heat", "kc.phy.o.thermal_properties.changes_of_state"]
  - term: melting point
    definition: "Melting point: the temperature at which a solid turns to liquid; it stays constant while melting
      happens and is the same as the freezing point."
    kcs: ["kc.phy.o.thermal_properties.changes_of_state"]
  - term: solidification
    definition: "Solidification: the change from liquid to solid (freezing); it gives out energy while the
      temperature stays at the melting point."
    kcs: ["kc.phy.o.thermal_properties.changes_of_state"]
  - term: vaporisation
    definition: "Vaporisation: the change from liquid to gas; the specific latent heat of vaporisation is the
      energy to do this for one kilogram at the boiling point."
    kcs: ["kc.phy.o.thermal_properties.latent_heat"]
  - term: thermal expansion
    definition: "Thermal expansion: the increase in size of a material when it is heated, because its particles
      move more and take up more space; gases expand most and solids least."
    kcs: ["kc.phy.o.thermal_properties.thermal_expansion"]
  - term: thermometer
    definition: "Thermometer: an instrument for measuring temperature; a liquid-in-glass thermometer uses the
      expansion of a liquid along a narrow tube."
    kcs: ["kc.phy.o.thermal_properties.thermal_expansion"]
  - term: thermostat
    definition: "Thermostat: a switch that turns a heater off and on to keep a temperature steady; many use a
      bimetallic strip that bends as it is heated."
    kcs: ["kc.phy.o.thermal_properties.thermal_expansion"]
  - term: thermal conductor
    definition: "Thermal conductor: a material that lets thermal energy pass through it easily by conduction;
      metals are good thermal conductors, while plastics and air are poor ones (insulators)."
    kcs: ["kc.phy.o.heat_transfer.conduction"]
  - term: rate of conduction
    definition: "Rate of conduction: how quickly thermal energy passes through a material by conduction; it is
      greater for a better conductor and a larger temperature difference."
    kcs: ["kc.phy.o.heat_transfer.conduction"]
  - term: matt
    definition: "Matt: describes a dull, non-shiny surface; dull and dark surfaces are better emitters and
      absorbers of infrared radiation than shiny, light ones."
    kcs: ["kc.phy.o.heat_transfer.radiation"]
  - term: nucleus
    aliases: [nuclei]
    definition: "Nucleus: the tiny, dense, positively charged centre of an atom, made of protons and neutrons and
      holding almost all of its mass."
    kcs: ["kc.phy.o.atom.atomic_structure", "kc.phy.o.atom.nuclear_model_evidence"]
  - term: proton
    definition: "Proton: a particle in the nucleus with a positive charge and a relative mass of one."
    kcs: ["kc.phy.o.atom.atomic_structure"]
  - term: neutron
    definition: "Neutron: an uncharged particle in the nucleus with a relative mass of one."
    kcs: ["kc.phy.o.atom.atomic_structure"]
  - term: nucleon
    definition: "Nucleon: a proton or a neutron, the particles found in the nucleus."
    kcs: ["kc.phy.o.atom.atomic_structure"]
  - term: proton number
    definition: "Proton number (Z): the number of protons in the nucleus of an atom; it fixes which element the
      atom is."
    kcs: ["kc.phy.o.atom.atomic_structure", kc.phy.o.atom.isotopes, "kc.phy.o.radioactivity.decay_equations"]
  - term: nucleon number
    definition: "Nucleon number (A): the total number of protons and neutrons in a nucleus; number of neutrons = A
      minus Z."
    kcs: ["kc.phy.o.atom.atomic_structure", kc.phy.o.atom.isotopes, "kc.phy.o.radioactivity.decay_equations"]
  - term: nuclide
    definition: "Nuclide: a particular type of nucleus, fixed by its proton number and its nucleon number."
    kcs: ["kc.phy.o.atom.atomic_structure", kc.phy.o.atom.isotopes]
  - term: nuclide notation
    definition: "Nuclide notation: the element symbol with the nucleon number A written top left and the proton
      number Z written bottom left."
    kcs: ["kc.phy.o.atom.atomic_structure"]
  - term: neutral atom
    definition: "Neutral atom: an atom with equal numbers of protons and electrons, so it has no overall charge."
    kcs: ["kc.phy.o.atom.atomic_structure"]
  - term: nuclear model
    definition: "Nuclear model: the model of the atom as a tiny, dense, positive nucleus with electrons around it,
      so the atom is mostly empty space."
    kcs: ["kc.phy.o.atom.nuclear_model_evidence"]
  - term: scattering experiment
    definition: "Scattering experiment: alpha particles fired at thin gold foil; most passed straight through but
      a few were deflected through large angles, showing a small, dense, positive nucleus."
    kcs: ["kc.phy.o.atom.nuclear_model_evidence"]
  - term: radioactive
    definition: "Radioactive: describes unstable nuclei that decay randomly and spontaneously, giving out alpha,
      beta or gamma radiation."
    kcs: ["kc.phy.o.radioactivity.types_of_radiation", "kc.phy.o.radioactivity.half_life", "kc.phy.o.radioactivity.decay_equations"]
  - term: penetration
    aliases: [penetrate, penetrating]
    definition: "Penetration: how far radiation passes through materials; alpha is stopped by paper, beta by a few
      millimetres of aluminium, and gamma is only reduced by thick lead."
    kcs: ["kc.phy.o.radioactivity.types_of_radiation"]
  - term: undecayed
    definition: "Undecayed: nuclei that have not yet decayed; their number halves every half-life."
    kcs: ["kc.phy.o.radioactivity.half_life"]
  - term: radon
    definition: "Radon: a radioactive gas that seeps from rocks and soil into the air and buildings; a major
      source of background radiation."
    kcs: ["kc.phy.o.radioactivity.background_radiation"]
  - term: radioactive source
    definition: "Radioactive source: a material that gives out ionising radiation; handled with tongs, kept in a
      lead-lined box and used for the shortest time and at the greatest distance possible."
    kcs: ["kc.phy.o.radioactivity.uses_and_safety"]
  - term: tracer
    definition: "Tracer: a radioactive isotope put into a system so its path can be followed with a detector;
      chosen with a short half-life and a radiation that can reach the detector."
    kcs: ["kc.phy.o.radioactivity.uses_and_safety"]
  - term: orbit
    definition: "Orbit: the curved path of one body around another, such as a planet around the Sun, kept in place
      by the gravitational attraction towards the central body."
    kcs: ["kc.phy.o.solar_system.planets_and_gravity", "kc.phy.o.solar_system.orbital_speed", "kc.phy.o.forces.circular_motion"]
  - term: orbit radius
    aliases: [radius]
    definition: "Orbit radius (r): the average distance from the centre of the central body to the orbiting
      object."
    kcs: ["kc.phy.o.solar_system.orbital_speed"]
  - term: orbital period
    definition: "Orbital period (T): the time an object takes to go once around its orbit."
    kcs: ["kc.phy.o.solar_system.orbital_speed", "kc.phy.o.solar_system.planets_and_gravity"]
  - term: orbital speed
    definition: "Orbital speed: the average speed of an object in its orbit, v = (two x π x r) / T."
    kcs: ["kc.phy.o.solar_system.orbital_speed"]
  - term: solar system
    definition: "Solar system: the Sun and everything that orbits it: eight planets, dwarf planets, moons,
      asteroids and comets."
    kcs: ["kc.phy.o.solar_system.planets_and_gravity"]
  - term: rotation
    aliases: [rotate]
    definition: "Rotation: the Earth spins on its axis once about every twenty-four hours, which causes day and
      night."
    kcs: ["kc.phy.o.solar_system.earth_and_moon"]
  - term: tilt
    definition: "Tilt: the Earth's axis leans at an angle to the plane of its orbit; as the Earth orbits the Sun,
      this tilt causes the seasons."
    kcs: ["kc.phy.o.solar_system.earth_and_moon"]
  - term: season
    definition: "Season: part of the year with its own weather; seasons happen because the tilted Earth leans one
      hemisphere towards the Sun, giving it longer days and more direct sunlight."
    kcs: ["kc.phy.o.solar_system.earth_and_moon"]
  - term: sunlit
    definition: "Sunlit: lit by the Sun; one half of the Moon is always sunlit, and its phases show how much of
      that half we can see from the Earth."
    kcs: ["kc.phy.o.solar_system.earth_and_moon"]
  - term: moon's phases
    aliases: [phase, phases]
    definition: "Moon's phases: the changing shapes of the Moon we see over about a month, as it orbits the Earth
      and we see different amounts of its sunlit half."
    kcs: ["kc.phy.o.solar_system.earth_and_moon"]
  - term: star
    definition: "Star: a huge ball of hot gas that gives out energy from nuclear fusion of hydrogen in its core."
    kcs: ["kc.phy.o.stars.life_cycle_of_stars", "kc.phy.o.stars.light_years"]
  - term: nebula
    definition: "Nebula: a huge cloud of gas, mostly hydrogen, and dust in space where stars form."
    kcs: ["kc.phy.o.stars.life_cycle_of_stars"]
  - term: protostar
    definition: "Protostar: a cloud of gas and dust pulled together by gravity, getting hotter, before nuclear
      fusion starts."
    kcs: ["kc.phy.o.stars.life_cycle_of_stars"]
  - term: nuclear fusion
    definition: "Nuclear fusion: light nuclei joining to form a heavier nucleus and releasing energy; in stars,
      hydrogen nuclei fuse to form helium."
    kcs: ["kc.phy.o.stars.life_cycle_of_stars"]
  - term: main-sequence star
    aliases: [main sequence]
    definition: "Main-sequence star: a stable star fusing hydrogen into helium in its core; the inward pull of
      gravity is balanced by the outward pressure from the hot core."
    kcs: ["kc.phy.o.stars.life_cycle_of_stars"]
  - term: red giant
    definition: "Red giant: the stage a low-mass star, like the Sun, reaches when the hydrogen in its core runs
      out; it swells and its surface cools."
    kcs: ["kc.phy.o.stars.life_cycle_of_stars"]
  - term: red supergiant
    definition: "Red supergiant: the very large star a high-mass star becomes when the hydrogen in its core runs
      out; it later explodes as a supernova."
    kcs: ["kc.phy.o.stars.life_cycle_of_stars"]
  - term: planetary nebula
    definition: "Planetary nebula: the shell of gas thrown off by a red giant at the end of its life, leaving a
      white dwarf at the centre."
    kcs: ["kc.phy.o.stars.life_cycle_of_stars"]
  - term: white dwarf
    definition: "White dwarf: the small, hot, dense core left when a low-mass star ends its life; it slowly
      cools."
    kcs: ["kc.phy.o.stars.life_cycle_of_stars"]
  - term: supernova
    definition: "Supernova: the huge explosion of a red supergiant; it leaves a neutron star or a black hole and
      spreads heavy elements into a new nebula."
    kcs: ["kc.phy.o.stars.life_cycle_of_stars"]
  - term: neutron star
    definition: "Neutron star: the very small, extremely dense remnant left after a supernova of a high-mass
      star."
    kcs: ["kc.phy.o.stars.life_cycle_of_stars"]
  - term: universe
    definition: "Universe: everything that exists, made of billions of galaxies; redshift shows it is expanding."
    kcs: ["kc.phy.o.stars.expanding_universe"]
  - term: redshift
    definition: "Redshift: an increase in the observed wavelength of light or other radiation from a galaxy moving
      away from us; more distant galaxies show a greater redshift."
    kcs: ["kc.phy.o.stars.expanding_universe"]
  - term: recession speed
    definition: "Recession speed: the speed at which a galaxy moves away from us; recession speed = Hubble
      constant x distance."
    kcs: ["kc.phy.o.stars.expanding_universe"]
  - term: radio telescope
    definition: "Radio telescope: a large dish that collects radio waves and microwaves from space, such as the
      cosmic microwave background radiation."
    kcs: ["kc.phy.o.stars.expanding_universe"]
  # Chemistry
  - term: abundance
    definition: "Abundance: how common an isotope is in a natural sample of the element, usually given as a
      percentage of all the atoms of that element."
    kcs: [kc.chm.o.atoms.isotopes]
  - term: acid
    definition: "Acid: a substance that releases hydrogen ions, H+, when dissolved in water; it is a proton donor.
      Acid solutions have a pH below seven and turn blue litmus red."
    kcs: ["kc.chm.o.acids.reactions_of_acids", "kc.chm.o.acids.ph_and_indicators", "kc.chm.o.acids.strong_and_weak"]
  - term: acid rain
    definition: "Acid rain: rain that is more acidic than normal because sulfur dioxide and oxides of nitrogen
      dissolve in it; it damages buildings, trees, lakes and the life in them."
    kcs: ["kc.chm.o.environment.air_pollution"]
  - term: acid-alkali titration
    definition: "Acid-alkali titration: adding one solution from a burette to a measured volume of the other, with
      an indicator, until the end-point, to find the exact volume needed for neutralisation."
    kcs: ["kc.chm.o.analysis.titration_technique"]
  - term: acidic
    definition: "Acidic: having a pH below seven; an acidic solution contains more hydrogen ions than hydroxide
      ions."
    kcs: ["kc.chm.o.acids.ph_and_indicators"]
  - term: acidic oxide
    definition: "Acidic oxide: an oxide, usually of a non-metal, that reacts with bases and alkalis to form a salt
      and water, such as carbon dioxide or sulfur dioxide."
    kcs: [kc.chm.o.acids.oxides]
  - term: acidified
    aliases: [acidify]
    definition: "Acidified: with acid added. In anion tests the sample is first acidified with dilute nitric acid
      so that carbonate ions are removed and cannot give a false precipitate."
    kcs: ["kc.chm.o.analysis.anion_tests"]
  - term: acidified potassium manganate(VII)
    definition: "Acidified potassium manganate(VII): a purple oxidising agent; when it oxidises another substance
      the manganate(VII) ions are reduced and the purple colour turns colourless."
    kcs: [kc.chm.o.reactions.redox]
  - term: activation energy
    definition: "Activation energy (Ea): the minimum energy that colliding particles must have for a reaction to
      happen."
    kcs: [kc.chm.o.energetics.profiles, "kc.chm.o.reactions.collision_theory", "kc.chm.o.reactions.rate_factors"]
  - term: actual yield
    definition: "Actual yield: the mass of product really obtained in an experiment, usually less than the
      theoretical yield. Percentage yield = actual yield / theoretical yield x one hundred."
    kcs: ["kc.chm.o.stoichiometry.yield_and_purity"]
  - term: addition polymer
    definition: "Addition polymer: a polymer made when many unsaturated monomers, such as alkenes, join together
      with no other product formed; for example poly(ethene) from ethene."
    kcs: [kc.chm.o.organic.polymers]
  - term: addition reaction
    definition: "Addition reaction: a reaction in which atoms add across the carbon-carbon double bond of an
      alkene to give a single product, such as ethene reacting with bromine, hydrogen or steam."
    kcs: ["kc.chm.o.organic.alkanes_and_alkenes"]
  - term: alcohol
    definition: "Alcohol: an organic compound with the hydroxyl functional group, -OH, bonded to carbon; names end
      in -ol, such as ethanol."
    kcs: ["kc.chm.o.organic.functional_groups", "kc.chm.o.organic.alcohols_and_acids"]
  - term: alkali
    definition: "Alkali: a base that dissolves in water, giving hydroxide ions, OH-, in solution, such as sodium
      hydroxide. Alkali solutions have a pH above seven. Not every base is an alkali."
    kcs: ["kc.chm.o.acids.reactions_of_acids", "kc.chm.o.acids.ph_and_indicators"]
    wrong: [all bases are alkalis, every base is an alkali]
  - term: alkali metal
    definition: "Alkali metal: an element in Group I, such as lithium, sodium or potassium; a soft, reactive metal
      that reacts with water to form an alkaline hydroxide and hydrogen."
    kcs: ["kc.chm.o.periodic.group_i"]
  - term: alkaline
    definition: "Alkaline: having a pH above seven; an alkaline solution contains more hydroxide ions than
      hydrogen ions."
    kcs: ["kc.chm.o.acids.ph_and_indicators", "kc.chm.o.periodic.group_i"]
  - term: alkane
    definition: "Alkane: a saturated hydrocarbon with only single carbon-carbon bonds; names end in -ane, such as
      methane and ethane."
    kcs: ["kc.chm.o.organic.functional_groups", "kc.chm.o.organic.alkanes_and_alkenes"]
  - term: alkene
    definition: "Alkene: an unsaturated hydrocarbon with one carbon-carbon double bond; names end in -ene, such as
      ethene. Alkenes decolourise bromine water."
    kcs: ["kc.chm.o.organic.functional_groups", "kc.chm.o.organic.alkanes_and_alkenes"]
  - term: alloy
    definition: "Alloy: a mixture of a metal with other elements, such as brass or steel. Atoms of different sizes
      disrupt the regular layers so they slide less easily, which makes an alloy harder than the pure metal."
    kcs: [kc.chm.o.metals.alloys, "kc.chm.o.metals.properties_and_uses"]
    wrong: [alloy is a compound, alloys are compounds]
  - term: aluminium
    definition: "Aluminium (Al): a reactive metal with a low density, extracted by electrolysis of aluminium oxide
      dissolved in molten cryolite; a thin oxide layer on its surface protects it from corrosion."
    kcs: [kc.chm.o.electrolysis.applications, kc.chm.o.metals.extraction, "kc.chm.o.metals.properties_and_uses"]
  - term: aluminium oxide
    definition: "Aluminium oxide: an amphoteric oxide, the main compound in the ore bauxite; it is dissolved in
      molten cryolite and electrolysed to extract aluminium."
    kcs: [kc.chm.o.acids.oxides, kc.chm.o.metals.extraction]
  - term: ammonia
    definition: "Ammonia: a colourless, pungent gas of nitrogen and hydrogen made by the Haber process; it turns
      damp red litmus blue and is a weak base in water."
    kcs: ["kc.chm.o.analysis.gas_tests", kc.chm.o.reactions.equilibrium]
  - term: ammonium
    definition: "Ammonium: the ion made of one nitrogen atom and four hydrogen atoms with a single positive
      charge; it is found in fertilisers such as ammonium nitrate."
    kcs: [kc.chm.o.environment.fertilisers, "kc.chm.o.stoichiometry.ionic_formulae"]
  - term: ammonium nitrate
    definition: "Ammonium nitrate: a salt used as a nitrogen fertiliser; both its ammonium ion and its nitrate ion
      supply nitrogen."
    kcs: [kc.chm.o.environment.fertilisers]
  - term: ammonium sulfate
    definition: "Ammonium sulfate: a salt used as a nitrogen fertiliser, made by neutralising sulfuric acid with
      ammonia."
    kcs: [kc.chm.o.environment.fertilisers]
  - term: amount of substance
    definition: "Amount of substance: the quantity of particles, measured in moles (mol); amount in mol = mass in
      g / molar mass in g/mol."
    kcs: ["kc.chm.o.stoichiometry.moles_and_mass"]
  - term: amphoteric oxide
    aliases: [amphoteric]
    definition: "Amphoteric oxide: an oxide that reacts with both acids and bases to form a salt and water, such
      as aluminium oxide and zinc oxide."
    kcs: [kc.chm.o.acids.oxides]
  - term: anhydrous copper(II) sulfate
    definition: "Anhydrous copper(II) sulfate: a white solid that turns blue when water is added; used to test for
      the presence of water."
    kcs: [kc.chm.o.environment.water]
  - term: anion
    definition: "Anion: a negative ion, formed when an atom or group of atoms gains electrons; in electrolysis it
      moves to the anode."
    kcs: ["kc.chm.o.analysis.anion_tests", "kc.chm.o.atoms.ion_formation"]
  - term: anode
    definition: "Anode: the positive electrode in electrolysis; negative ions move to it and lose electrons there,
      which is oxidation."
    kcs: ["kc.chm.o.electrolysis.molten_products", "kc.chm.o.electrolysis.aqueous_products", "kc.chm.o.electrolysis.half_equations"]
    wrong: [anode is negative, negative anode]
  - term: antimony
    definition: "Antimony (Sb): an element in Group V with two naturally occurring isotopes; its relative atomic
      mass is the mean of their masses weighted by their abundances."
    kcs: [kc.chm.o.atoms.isotopes]
  - term: apparatus
    definition: "Apparatus: the equipment for an experiment, chosen by what is measured: a stopwatch for time, a
      thermometer for temperature, a balance for mass, and a burette, pipette, measuring cylinder or gas syringe
      for volume."
    kcs: [kc.chm.o.analysis.apparatus]
  - term: aqueous
    definition: "Aqueous (aq): dissolved in water; an aqueous solution has water as the solvent."
    kcs: ["kc.chm.o.acids.reactions_of_acids", "kc.chm.o.electrolysis.aqueous_products"]
  - term: aqueous ammonia
    definition: "Aqueous ammonia: ammonia dissolved in water, a weak alkali; added a little at a time and then in
      excess to identify a metal cation from the colour of any precipitate and whether it dissolves."
    kcs: ["kc.chm.o.analysis.cation_tests"]
  - term: aqueous sodium hydroxide
    definition: "Aqueous sodium hydroxide: a strong alkali added a little at a time and then in excess to identify
      a metal cation from the colour of the hydroxide precipitate and whether it dissolves."
    kcs: ["kc.chm.o.analysis.cation_tests"]
  - term: argon
    definition: "Argon: a noble gas in Group VIII; because it is unreactive it is used to fill filament lamps and
      to shield metals during welding."
    kcs: ["kc.chm.o.periodic.noble_gases"]
  - term: astatine
    definition: "Astatine: the halogen at the bottom of Group VII; from the group trends it is predicted to be a
      dark solid and the least reactive halogen."
    kcs: ["kc.chm.o.periodic.group_vii"]
  - term: atomic number
    definition: "Atomic number (proton number, Z): the number of protons in the nucleus of an atom; in a neutral
      atom it also equals the number of electrons."
    kcs: ["kc.chm.o.atoms.subatomic_particles"]
  - term: Avogadro constant
    definition: "Avogadro constant: the number of particles in one mole of a substance, about six point zero two x
      ten to the power twenty-three per mol."
    kcs: ["kc.chm.o.stoichiometry.moles_and_mass"]
  - term: balance
    definition: "Balance: an instrument used to measure mass, usually in grams."
    kcs: [kc.chm.o.analysis.apparatus]
  - term: balanced equation
    definition: "Balanced equation: a symbol equation with the same number of atoms of each element on both sides;
      it is balanced by changing coefficients only, never the formulae."
    kcs: ["kc.chm.o.stoichiometry.balancing_equations", "kc.chm.o.stoichiometry.reacting_masses", kc.chm.o.organic.combustion]
  - term: barium nitrate
    definition: "Barium nitrate: the reagent for the sulfate test; added with dilute nitric acid, it gives a white
      precipitate of barium sulfate if sulfate ions are present."
    kcs: ["kc.chm.o.analysis.anion_tests"]
  - term: barrier method
    definition: "Barrier method: preventing rusting by covering iron or steel with a layer such as paint, oil,
      grease or plastic that keeps out oxygen and water."
    kcs: [kc.chm.o.metals.corrosion]
  - term: base
    definition: "Base: a substance that neutralises an acid to form a salt and water, such as a metal oxide or
      hydroxide; it is a proton acceptor. A base that dissolves in water is an alkali."
    kcs: ["kc.chm.o.acids.reactions_of_acids", "kc.chm.o.acids.salt_preparation"]
  - term: baseline
    definition: "Baseline: the line drawn in pencil near the bottom of chromatography paper, on which the spots
      are put; it must stay above the solvent level."
    kcs: [kc.chm.o.analysis.chromatography]
  - term: basic oxide
    definition: "Basic oxide: an oxide, usually of a metal, that reacts with acids to form a salt and water, such
      as magnesium oxide or copper(II) oxide."
    kcs: [kc.chm.o.acids.oxides, "kc.chm.o.metals.properties_of_metals"]
  - term: binary compound
    definition: "Binary compound: a compound made of only two elements, such as lead(II) bromide or sodium
      chloride."
    kcs: ["kc.chm.o.electrolysis.molten_products"]
  - term: bitumen
    definition: "Bitumen: the petroleum fraction with the largest molecules and highest boiling points, collected
      at the bottom of the fractionating column; used for making roads."
    kcs: ["kc.chm.o.organic.fuels_and_cracking"]
  - term: blast furnace
    definition: "Blast furnace: where iron is extracted from hematite; coke burns to form carbon monoxide, which
      reduces iron(III) oxide to iron, and limestone removes impurities as slag."
    kcs: [kc.chm.o.metals.extraction]
  - term: boiling
    definition: "Boiling: the change from liquid to gas that happens throughout the liquid, at a fixed temperature
      called the boiling point."
    kcs: ["kc.chm.o.states.changes_of_state"]
  - term: boiling point
    definition: "Boiling point: the temperature at which a liquid boils; a pure substance boils at one fixed
      temperature, while impurities raise the boiling point."
    kcs: ["kc.chm.o.states.changes_of_state", kc.chm.o.analysis.purity]
  - term: bond breaking
    definition: "Bond breaking: an endothermic process; energy must be taken in to break bonds."
    kcs: ["kc.chm.o.energetics.bond_energies"]
  - term: bond energy
    aliases: [bond energies]
    definition: "Bond energy: the energy needed to break one mole of a particular covalent bond, in kJ/mol; the
      same amount of energy is given out when that bond forms."
    kcs: ["kc.chm.o.energetics.bond_energies"]
  - term: bond making
    definition: "Bond making: an exothermic process; energy is given out when new bonds form."
    kcs: ["kc.chm.o.energetics.bond_energies"]
  - term: brass
    definition: "Brass: an alloy of copper and zinc, harder than pure copper and resistant to corrosion."
    kcs: [kc.chm.o.metals.alloys]
  - term: bromine
    definition: "Bromine: a Group VII halogen, a red-brown liquid at room temperature; it is less reactive than
      chlorine and more reactive than iodine."
    kcs: ["kc.chm.o.periodic.group_vii"]
  - term: bromine water
    definition: "Bromine water: an orange solution used to test for a carbon-carbon double bond; an alkene turns
      it from orange to colourless, while an alkane leaves it orange."
    kcs: ["kc.chm.o.organic.alkanes_and_alkenes"]
  - term: bronze
    definition: "Bronze: an alloy of copper and tin, harder than pure copper."
    kcs: [kc.chm.o.metals.alloys]
  - term: burette
    definition: "Burette: a long graduated tube with a tap, used to add a measured volume of liquid in a
      titration; it is read to the nearest zero point zero five cm cubed."
    kcs: ["kc.chm.o.analysis.titration_technique", kc.chm.o.analysis.apparatus]
  - term: butane
    definition: "Butane: the alkane with four carbon atoms and ten hydrogen atoms in each molecule."
    kcs: [kc.chm.o.organic.naming]
  - term: butanoic acid
    definition: "Butanoic acid: the carboxylic acid with four carbon atoms, counting the carbon of its -COOH
      group."
    kcs: [kc.chm.o.organic.naming]
  - term: butanol
    definition: "Butanol: the alcohol with an unbranched chain of four carbon atoms and one -OH group."
    kcs: [kc.chm.o.organic.naming]
  - term: butene
    definition: "Butene: the alkene with four carbon atoms and one carbon-carbon double bond."
    kcs: [kc.chm.o.organic.naming]
  - term: caesium
    definition: "Caesium: a Group I alkali metal below rubidium; it is more reactive than the Group I metals above
      it and reacts explosively with water."
    kcs: ["kc.chm.o.periodic.group_i"]
  - term: calcium carbonate
    definition: "Calcium carbonate: the main compound in limestone and marble; it reacts with acids to give a
      salt, water and carbon dioxide, and is used to neutralise acidic gases and soils."
    kcs: ["kc.chm.o.acids.reactions_of_acids", "kc.chm.o.environment.air_pollution"]
  - term: calorimetry
    definition: "Calorimetry: measuring the energy transferred in a reaction from the temperature change of a
      known mass of water or solution, using Q = m x c x ΔT."
    kcs: [kc.chm.o.energetics.calorimetry]
  - term: carbon dioxide
    definition: "Carbon dioxide: a colourless greenhouse gas formed when carbon fuels burn completely and when
      acids react with carbonates; it turns limewater milky."
    kcs: ["kc.chm.o.analysis.gas_tests", kc.chm.o.environment.climate]
  - term: carbon monoxide
    definition: "Carbon monoxide: a toxic, colourless, odourless gas formed by incomplete combustion of carbon
      fuels; it stops blood carrying oxygen. It is a neutral oxide and a reducing agent."
    kcs: ["kc.chm.o.environment.air_pollution", kc.chm.o.organic.combustion]
  - term: carbonate
    definition: "Carbonate: a compound containing the carbonate ion, one carbon and three oxygen atoms with a
      charge of two minus; carbonates react with acids to give a salt, water and carbon dioxide."
    kcs: ["kc.chm.o.acids.reactions_of_acids", "kc.chm.o.analysis.anion_tests"]
  - term: carboxylic acid
    definition: "Carboxylic acid: an organic compound with the -COOH functional group; names end in -oic acid,
      such as ethanoic acid. Carboxylic acids are weak acids."
    kcs: ["kc.chm.o.organic.functional_groups", "kc.chm.o.organic.carboxylic_acids"]
  - term: catalyst
    definition: "Catalyst: a substance that increases the rate of a reaction and is chemically unchanged at the
      end; it provides a different pathway with a lower activation energy."
    kcs: ["kc.chm.o.reactions.rate_factors", kc.chm.o.energetics.profiles]
    wrong: [catalyst is used up, catalysts are used up, catalyst gets used up]
  - term: catalytic converter
    definition: "Catalytic converter: a device in a car exhaust where catalysts change carbon monoxide and oxides
      of nitrogen into carbon dioxide and nitrogen."
    kcs: ["kc.chm.o.environment.air_pollution"]
  - term: cathode
    definition: "Cathode: the negative electrode in electrolysis; positive ions move to it and gain electrons
      there, which is reduction."
    kcs: ["kc.chm.o.electrolysis.molten_products", "kc.chm.o.electrolysis.aqueous_products", "kc.chm.o.electrolysis.half_equations"]
    wrong: [cathode is positive, positive cathode]
  - term: cation
    definition: "Cation: a positive ion, formed when an atom loses electrons; in electrolysis it moves to the
      cathode."
    kcs: ["kc.chm.o.analysis.cation_tests", "kc.chm.o.atoms.ion_formation"]
  - term: chemical change
    definition: "Chemical change: a change in which a new substance is formed; it is usually hard to reverse and
      often gives out or takes in energy."
    kcs: ["kc.chm.o.reactions.physical_chemical_change"]
  - term: formula
    aliases: [formulae, chemical formula]
    definition: "Formula: the symbols of the elements in a substance with numbers showing the ratio of their
      atoms; for an ionic compound it shows the simplest ratio of its ions."
    kcs: ["kc.chm.o.atoms.element_compound_mixture", "kc.chm.o.stoichiometry.ionic_formulae", "kc.chm.o.stoichiometry.balancing_equations"]
  - term: chloride
    definition: "Chloride: a compound containing the chloride ion, Cl-; hydrochloric acid forms chloride salts."
    kcs: ["kc.chm.o.acids.reactions_of_acids"]
  - term: chlorination
    definition: "Chlorination: adding chlorine to the water supply to kill bacteria and other microbes."
    kcs: [kc.chm.o.environment.water]
  - term: chlorine
    definition: "Chlorine: a pale green, toxic halogen gas in Group VII; it bleaches damp litmus paper and is more
      reactive than bromine and iodine."
    kcs: ["kc.chm.o.analysis.gas_tests", "kc.chm.o.periodic.group_vii"]
  - term: chloroethene
    definition: "Chloroethene: the monomer of poly(chloroethene), PVC; it is like ethene with one hydrogen atom
      replaced by a chlorine atom."
    kcs: [kc.chm.o.organic.polymers]
  - term: chromatogram
    definition: "Chromatogram: the dried chromatography paper showing the separated spots, used to identify
      substances and to calculate Rf values."
    kcs: [kc.chm.o.analysis.chromatography]
  - term: chromatography
    definition: "Chromatography: separating and identifying the soluble substances in a mixture as a solvent moves
      up the paper and carries each substance a different distance; a pure substance gives one spot."
    kcs: [kc.chm.o.analysis.chromatography, kc.chm.o.analysis.separation, kc.chm.o.analysis.purity]
  - term: climate change
    definition: "Climate change: long-term changes in global temperatures and weather patterns, caused largely by
      rising amounts of greenhouse gases from human activities."
    kcs: [kc.chm.o.environment.climate]
  - term: cobalt(II) chloride
    definition: "Cobalt(II) chloride: used to test for water; the anhydrous solid, often on paper, turns from blue
      to pink when water is added."
    kcs: [kc.chm.o.environment.water]
  - term: coefficient
    definition: "Coefficient: the number written in front of a formula in an equation to show how many units of
      that substance react or form; equations are balanced by changing coefficients only."
    kcs: ["kc.chm.o.stoichiometry.balancing_equations"]
  - term: collision
    aliases: [collide]
    definition: "Collision: particles hitting each other; a reaction happens only in a successful collision, where
      the particles have at least the activation energy."
    kcs: ["kc.chm.o.reactions.collision_theory", "kc.chm.o.reactions.rate_factors"]
  - term: collision frequency
    definition: "Collision frequency: the number of collisions between reacting particles per unit time; raising
      concentration, pressure, surface area or temperature increases it."
    kcs: ["kc.chm.o.reactions.collision_theory"]
  - term: collision theory
    definition: "Collision theory: particles react only when they collide with energy equal to or greater than the
      activation energy; the rate depends on how often these successful collisions happen."
    kcs: ["kc.chm.o.reactions.collision_theory"]
  - term: coloured compound
    definition: "Coloured compound: transition elements typically form coloured compounds, such as blue copper(II)
      sulfate, while the compounds of Group I metals are usually white."
    kcs: ["kc.chm.o.periodic.transition_elements"]
  - term: colourless
    definition: "Colourless: having no colour. It is not the same as clear, which means see-through: a solution
      can be clear but coloured."
    kcs: [kc.chm.o.reactions.redox]
  - term: combustion
    definition: "Combustion: an exothermic reaction in which a substance burns in oxygen, such as a fuel forming
      carbon dioxide and water."
    kcs: [kc.chm.o.organic.combustion, "kc.chm.o.energetics.exo_endo"]
  - term: complete combustion
    definition: "Complete combustion: burning in plenty of oxygen; a hydrocarbon or an alcohol forms only carbon
      dioxide and water."
    kcs: [kc.chm.o.organic.combustion]
  - term: compound
    definition: "Compound: a substance made of two or more elements chemically combined in a fixed ratio; it can
      be separated only by a chemical reaction."
    kcs: ["kc.chm.o.atoms.element_compound_mixture"]
  - term: concentrated
    definition: "Concentrated: containing a large amount of solute in a given volume of solution. It is not the
      same as strong, which describes how fully an acid ionises."
    kcs: ["kc.chm.o.acids.strong_and_weak", "kc.chm.o.electrolysis.aqueous_products"]
  - term: concentrated sulfuric acid
    definition: "Concentrated sulfuric acid: used as the catalyst when a carboxylic acid and an alcohol are heated
      to make an ester."
    kcs: ["kc.chm.o.organic.carboxylic_acids", "kc.chm.o.organic.alcohols_and_acids"]
  - term: concentration
    definition: "Concentration: the amount of solute in a given volume of solution, in mol/dm cubed or g/dm cubed;
      concentration = amount / volume."
    kcs: ["kc.chm.o.stoichiometry.solution_concentration", "kc.chm.o.acids.titration_calculations"]
  - term: concordant
    definition: "Concordant: titres that agree closely, within zero point one zero cm cubed of each other; only
      concordant titres are used to work out the mean titre."
    kcs: ["kc.chm.o.analysis.titration_technique"]
  - term: condensation polymer
    definition: "Condensation polymer: a polymer formed when monomers join and a small molecule, such as water, is
      removed at each link; polyesters and polyamides are examples."
    kcs: [kc.chm.o.organic.polymers]
  - term: condensing
    definition: "Condensing: the change from gas to liquid as a gas cools; energy is given out."
    kcs: ["kc.chm.o.states.changes_of_state"]
  - term: electrical conductivity
    aliases: [conductivity, conduct electricity]
    definition: "Electrical conductivity: how well a substance lets an electric current pass. It needs mobile
      charged particles: delocalised electrons in metals and graphite, or ions free to move in molten or dissolved
      ionic compounds."
    kcs: ["kc.chm.o.atoms.structure_and_properties", "kc.chm.o.acids.strong_and_weak"]
  - term: conductor
    definition: "Conductor: a material that lets heat or an electric current pass through it easily; metals are
      good conductors of both."
    kcs: ["kc.chm.o.metals.properties_and_uses", "kc.chm.o.metals.properties_of_metals"]
  - term: electrical conductor
    definition: "Electrical conductor: a material that lets an electric current pass through it; metals conduct
      because their delocalised electrons can move through the structure."
    kcs: ["kc.chm.o.metals.properties_and_uses", "kc.chm.o.metals.properties_of_metals"]
  - term: conical flask
    definition: "Conical flask: a flask with a wide base and narrow neck; in a titration it holds the measured
      solution so it can be swirled without splashing."
    kcs: ["kc.chm.o.analysis.titration_technique", kc.chm.o.analysis.apparatus]
  - term: Contact process
    definition: "Contact process: the industrial manufacture of sulfuric acid; its key step is the reversible
      reaction of sulfur dioxide with oxygen to form sulfur trioxide, using a vanadium(V) oxide catalyst."
    kcs: [kc.chm.o.reactions.equilibrium]
  - term: corrosion
    definition: "Corrosion: the slow reaction of a metal with substances around it, such as oxygen and water; the
      corrosion of iron and steel is called rusting."
    kcs: [kc.chm.o.metals.corrosion, "kc.chm.o.metals.properties_and_uses"]
  - term: coulomb
    definition: "Coulomb (C): the unit of electric charge; Q = I x t, so one coulomb passes when a current of one
      ampere flows for one second."
    kcs: [kc.chm.o.electrolysis.quantitative]
  - term: covalent bond
    aliases: [covalent]
    definition: "Covalent bond: a shared pair of electrons between two atoms, usually non-metal atoms, held by the
      attraction of both nuclei for the shared electrons."
    kcs: ["kc.chm.o.atoms.covalent_bonding", "kc.chm.o.atoms.giant_covalent"]
  - term: cracking
    definition: "Cracking: breaking long-chain alkanes into shorter alkanes and alkenes, or hydrogen, by heating
      with a catalyst; it makes more useful fuels such as gasoline and alkenes for polymers."
    kcs: ["kc.chm.o.organic.fuels_and_cracking"]
  - term: crude oil
    definition: "Crude oil (petroleum): a mixture of many hydrocarbons, mainly alkanes, separated into fractions
      by fractional distillation."
    kcs: ["kc.chm.o.organic.fuels_and_cracking"]
  - term: cryolite
    definition: "Cryolite: an aluminium compound whose molten form dissolves aluminium oxide in the extraction of
      aluminium; this lowers the operating temperature and saves energy."
    kcs: [kc.chm.o.electrolysis.applications]
  - term: crystallisation
    definition: "Crystallisation: heating a solution to evaporate some solvent until it is saturated, then leaving
      it to cool so crystals form; the crystals are filtered off and dried."
    kcs: ["kc.chm.o.acids.salt_preparation", kc.chm.o.analysis.separation]
  - term: current
    definition: "Current: the rate of flow of charge, measured in amperes (A); in electrolysis the charge passed
      is Q = I x t, in coulombs."
    kcs: [kc.chm.o.electrolysis.quantitative]
  - term: decomposition
    definition: "Decomposition: a reaction in which one substance breaks down into two or more simpler substances;
      thermal decomposition uses heat and is endothermic."
    kcs: ["kc.chm.o.energetics.exo_endo"]
  - term: deforestation
    definition: "Deforestation: cutting down large areas of forest; fewer trees take in carbon dioxide by
      photosynthesis, and burning the wood releases more, adding to climate change."
    kcs: [kc.chm.o.environment.climate]
  - term: delocalised electrons
    aliases: [delocalised, delocalised electron]
    definition: "Delocalised electrons: electrons not held by one atom or bond, free to move through the whole
      structure, as in metals and graphite; they let these substances conduct electricity."
    kcs: ["kc.chm.o.atoms.metallic_bonding", "kc.chm.o.atoms.giant_covalent"]
  - term: density
    definition: "Density: mass per unit volume, density = mass / volume, often in g/cm cubed; transition elements
      have high densities and Group I metals low ones."
    kcs: ["kc.chm.o.metals.properties_and_uses", "kc.chm.o.periodic.transition_elements"]
  - term: desulfurisation
    definition: "Desulfurisation: removing sulfur from fuels before burning, or sulfur dioxide from waste gases,
      so that less sulfur dioxide reaches the air and causes acid rain."
    kcs: ["kc.chm.o.environment.air_pollution"]
  - term: diamond
    definition: "Diamond: a giant covalent form of carbon in which each atom forms four covalent bonds; very hard,
      with a very high melting point, and it does not conduct electricity."
    kcs: ["kc.chm.o.atoms.giant_covalent"]
  - term: diesel oil
    definition: "Diesel oil: a petroleum fraction with larger molecules and higher boiling points than kerosene;
      used as fuel in diesel engines."
    kcs: ["kc.chm.o.organic.fuels_and_cracking"]
  - term: diffusion
    aliases: [diffuse]
    definition: "Diffusion: the net movement of particles from a higher to a lower concentration by their random
      motion; a gas with a lower relative molecular mass, or at a higher temperature, diffuses faster."
    kcs: [kc.chm.o.states.diffusion]
    wrong: [heavier gases diffuse faster, heavier molecules diffuse faster]
  - term: dilute
    definition: "Dilute: containing a small amount of solute in a given volume of solution. Dilute describes
      concentration, not strength: a dilute acid can still be a strong acid."
    kcs: ["kc.chm.o.acids.strong_and_weak", "kc.chm.o.electrolysis.aqueous_products"]
  - term: displacement
    aliases: [displace]
    definition: "Displacement: a reaction in which a more reactive element takes the place of a less reactive one
      in its compound, such as zinc displacing copper from copper(II) sulfate, or chlorine displacing bromine from
      a bromide."
    kcs: ["kc.chm.o.metals.reactivity_series", "kc.chm.o.periodic.group_vii"]
  - term: dissolving
    definition: "Dissolving: a physical change in which a solute mixes into a solvent to form a solution; no new
      substance forms and the solute can be recovered."
    kcs: ["kc.chm.o.reactions.physical_chemical_change"]
    wrong: [dissolving is a chemical change]
  - term: distillation
    definition: "Distillation: separating a liquid from a solution, or liquids with different boiling points, by
      boiling and then condensing the vapour."
    kcs: [kc.chm.o.analysis.separation]
  - term: dm³
    definition: "Cubic decimetre (dm cubed): a unit of volume equal to one thousand cm cubed, or one litre; one
      mole of any gas at room temperature and pressure fills twenty-four dm cubed."
    kcs: ["kc.chm.o.stoichiometry.gas_volumes"]
  - term: dodecane
    definition: "Dodecane: a long-chain alkane with twelve carbon atoms; it can be cracked into smaller alkanes
      and alkenes."
    kcs: ["kc.chm.o.organic.fuels_and_cracking"]
  - term: dot-and-cross diagram
    definition: "Dot-and-cross diagram: a diagram of the outer-shell electrons in a molecule, with dots for one
      atom's electrons and crosses for the other's, showing the shared pairs."
    kcs: ["kc.chm.o.atoms.covalent_bonding"]
  - term: double bond
    definition: "Double bond: two shared pairs of electrons between two atoms; a carbon-carbon double bond makes
      alkenes unsaturated."
    kcs: ["kc.chm.o.organic.alkanes_and_alkenes"]
  - term: ductile
    definition: "Ductile: able to be drawn out into wires, a typical property of metals used for electrical
      cables."
    kcs: ["kc.chm.o.metals.properties_and_uses", "kc.chm.o.metals.properties_of_metals"]
  - term: dynamic equilibrium
    aliases: [equilibrium]
    definition: "Dynamic equilibrium: the state of a reversible reaction in a closed system where the forward and
      reverse reactions go on at the same rate, so the concentrations stay constant."
    kcs: [kc.chm.o.reactions.equilibrium]
  - term: effervescence
    definition: "Effervescence: bubbling or fizzing as a gas is given off, such as carbon dioxide when an acid
      reacts with a carbonate."
    kcs: ["kc.chm.o.acids.reactions_of_acids"]
  - term: electrode
    definition: "Electrode: a solid conductor, usually graphite or a metal, through which the current enters or
      leaves the electrolyte; the positive one is the anode and the negative one the cathode."
    kcs: ["kc.chm.o.electrolysis.molten_products", "kc.chm.o.electrolysis.aqueous_products"]
  - term: electrolysis
    aliases: [electrolysed]
    definition: "Electrolysis: the breakdown of an ionic compound, molten or in aqueous solution, by passing an
      electric current through it."
    kcs: ["kc.chm.o.electrolysis.molten_products", "kc.chm.o.electrolysis.aqueous_products"]
  - term: electrolyte
    definition: "Electrolyte: a molten or aqueous ionic compound that conducts electricity because its ions move,
      and is broken down by the current."
    kcs: ["kc.chm.o.electrolysis.molten_products", "kc.chm.o.electrolysis.aqueous_products"]
    wrong: [electrons flow through the electrolyte, electrons move through the electrolyte]
  - term: electron
    definition: "Electron: a negatively charged particle with a relative charge of minus one and almost no mass,
      found in shells around the nucleus."
    kcs: ["kc.chm.o.atoms.subatomic_particles", "kc.chm.o.atoms.electron_arrangement"]
  - term: electron arrangement
    definition: "Electron arrangement: how an atom's electrons fill its shells, such as two, eight, one for
      sodium; the number of outer-shell electrons gives the group and the number of shells gives the period."
    kcs: ["kc.chm.o.atoms.electron_arrangement", kc.chm.o.periodic.arrangement]
  - term: electron pair
    definition: "Electron pair: two electrons together in an outer shell; a shared pair forms a covalent bond,
      while a lone pair is not shared."
    kcs: ["kc.chm.o.atoms.covalent_bonding"]
  - term: electroplating
    aliases: [electroplated]
    definition: "Electroplating: using electrolysis to coat an object with a thin layer of metal; the object is
      the cathode, the plating metal is the anode, and the electrolyte contains ions of that metal."
    kcs: [kc.chm.o.electrolysis.applications]
  - term: element
    definition: "Element: a substance made of only one kind of atom, all with the same proton number; it cannot be
      broken down into simpler substances by chemical means."
    kcs: ["kc.chm.o.atoms.element_compound_mixture", kc.chm.o.periodic.arrangement]
  - term: empirical formula
    definition: "Empirical formula: the simplest whole-number ratio of the atoms of each element in a compound."
    kcs: ["kc.chm.o.stoichiometry.empirical_formula"]
  - term: end-point
    definition: "End-point: the point in a titration where the indicator just changes colour permanently, showing
      that the reaction is complete."
    kcs: ["kc.chm.o.analysis.titration_technique"]
  - term: endothermic
    definition: "Endothermic: describes a reaction that takes in energy from the surroundings, so the temperature
      falls; its enthalpy change, ΔH, is positive."
    kcs: ["kc.chm.o.energetics.exo_endo", kc.chm.o.energetics.profiles, "kc.chm.o.energetics.bond_energies"]
  - term: energy profile
    definition: "Energy profile (reaction pathway diagram): a diagram showing the energy of the reactants and
      products and the activation energy hump between them."
    kcs: [kc.chm.o.energetics.profiles]
  - term: energy transferred
    definition: "Energy transferred: in calorimetry, the heat gained or lost by the water or solution, Q = m x c x
      ΔT, in joules."
    kcs: [kc.chm.o.energetics.calorimetry]
  - term: enthalpy change
    definition: "Enthalpy change (ΔH): the heat energy transferred in a reaction, in kJ/mol, negative for
      exothermic and positive for endothermic. From bond energies, ΔH = energy to break bonds minus energy
      released making bonds."
    kcs: ["kc.chm.o.energetics.exo_endo", "kc.chm.o.energetics.bond_energies", kc.chm.o.energetics.profiles]
  - term: equation
    definition: "Equation: a statement of a reaction with the reactants on the left and the products on the right;
      a symbol equation uses formulae and must be balanced."
    kcs: ["kc.chm.o.stoichiometry.balancing_equations", "kc.chm.o.stoichiometry.reacting_masses"]
  - term: ester
    definition: "Ester: a sweet-smelling compound made when a carboxylic acid reacts with an alcohol, such as
      ethyl ethanoate; esters are used in flavourings and perfumes."
    kcs: ["kc.chm.o.organic.carboxylic_acids", "kc.chm.o.organic.alcohols_and_acids"]
  - term: esterification
    definition: "Esterification: the reversible reaction of a carboxylic acid with an alcohol, heated with a
      concentrated sulfuric acid catalyst, to form an ester and water."
    kcs: ["kc.chm.o.organic.carboxylic_acids", "kc.chm.o.organic.alcohols_and_acids"]
  - term: ethane
    definition: "Ethane: the alkane with two carbon atoms and six hydrogen atoms in each molecule."
    kcs: [kc.chm.o.organic.naming]
  - term: ethanoic acid
    definition: "Ethanoic acid: the carboxylic acid with two carbon atoms; a weak acid found in vinegar, made by
      oxidising ethanol."
    kcs: ["kc.chm.o.organic.carboxylic_acids", "kc.chm.o.organic.alcohols_and_acids"]
  - term: ethanol
    definition: "Ethanol: the alcohol with two carbon atoms; made by fermentation of sugars or by hydration of
      ethene with steam, and used as a fuel and a solvent."
    kcs: ["kc.chm.o.organic.alcohols_and_acids", kc.chm.o.organic.naming]
  - term: ethene
    definition: "Ethene: the simplest alkene, two carbon atoms joined by a double bond; it is the monomer of
      poly(ethene)."
    kcs: [kc.chm.o.organic.naming]
  - term: ethyl ethanoate
    definition: "Ethyl ethanoate: the ester made from ethanol and ethanoic acid."
    kcs: ["kc.chm.o.organic.alcohols_and_acids", "kc.chm.o.organic.carboxylic_acids"]
  - term: evaporation
    definition: "Evaporation: the change from liquid to gas at the surface of a liquid, below its boiling point;
      also used to obtain a dissolved solid by removing the solvent."
    kcs: ["kc.chm.o.states.changes_of_state", kc.chm.o.analysis.separation]
  - term: excess
    definition: "Excess: more of a reactant than is needed, so some is left at the end. In cation tests, adding a
      reagent in excess means adding much more to see whether the precipitate dissolves."
    kcs: ["kc.chm.o.stoichiometry.reacting_masses", "kc.chm.o.analysis.cation_tests"]
  - term: exothermic
    definition: "Exothermic: describes a reaction that gives out energy to the surroundings, so the temperature
      rises; its enthalpy change, ΔH, is negative."
    kcs: ["kc.chm.o.energetics.exo_endo", kc.chm.o.energetics.profiles, "kc.chm.o.energetics.bond_energies"]
  - term: extraction
    definition: "Extraction: obtaining a metal from its ore; metals above carbon in the reactivity series are
      extracted by electrolysis, and metals below carbon by reduction with carbon."
    kcs: [kc.chm.o.metals.extraction, "kc.chm.o.metals.extraction_yield"]
  - term: Faraday constant
    definition: "Faraday constant (F): the charge carried by one mole of electrons, about ninety-six thousand five
      hundred coulombs per mole."
    kcs: [kc.chm.o.electrolysis.quantitative]
  - term: fermentation
    definition: "Fermentation: making ethanol from sugars such as glucose using yeast, warm and without air;
      carbon dioxide also forms."
    kcs: ["kc.chm.o.organic.alcohols_and_acids"]
  - term: fertiliser
    definition: "Fertiliser: a substance added to soil to supply elements plants need, mainly nitrogen, phosphorus
      and potassium, so crops grow better."
    kcs: [kc.chm.o.environment.fertilisers]
  - term: filtrate
    definition: "Filtrate: the liquid that passes through the filter paper during filtration."
    kcs: [kc.chm.o.analysis.separation, "kc.chm.o.acids.salt_preparation"]
  - term: filtration
    definition: "Filtration: separating an insoluble solid from a liquid by passing the mixture through filter
      paper; the solid left behind is the residue."
    kcs: [kc.chm.o.analysis.separation, kc.chm.o.environment.water]
  - term: flavouring
    definition: "Flavouring: a substance added to food for its taste or smell; many esters are used as flavourings
      because of their fruity smells."
    kcs: ["kc.chm.o.organic.carboxylic_acids"]
  - term: flue gas desulfurisation
    definition: "Flue gas desulfurisation: removing sulfur dioxide from the waste gases of power stations by
      reacting it with calcium carbonate or calcium oxide."
    kcs: ["kc.chm.o.environment.air_pollution"]
  - term: fossil fuel
    definition: "Fossil fuel: a fuel such as coal, petroleum or natural gas, formed over millions of years from
      the remains of living things; burning it releases carbon dioxide."
    kcs: [kc.chm.o.environment.climate]
  - term: fraction
    definition: "Fraction: a mixture of hydrocarbons with similar boiling points, collected at one level of the
      fractionating column."
    kcs: ["kc.chm.o.organic.fuels_and_cracking"]
  - term: fractional distillation
    definition: "Fractional distillation: separating liquids with different boiling points using a fractionating
      column; used to separate ethanol from water and petroleum into fractions."
    kcs: [kc.chm.o.analysis.separation, "kc.chm.o.organic.fuels_and_cracking"]
  - term: fractionating column
    definition: "Fractionating column: a tall column that is hottest at the bottom and coolest at the top, so
      fractions with lower boiling points condense higher up."
    kcs: ["kc.chm.o.organic.fuels_and_cracking"]
  - term: freezing
    definition: "Freezing: the change from liquid to solid, at the melting point; energy is given out."
    kcs: ["kc.chm.o.states.changes_of_state"]
  - term: functional group
    definition: "Functional group: the atom or group of atoms that gives a homologous series its typical
      reactions, such as C=C in alkenes, -OH in alcohols and -COOH in carboxylic acids."
    kcs: ["kc.chm.o.organic.functional_groups"]
  - term: "g/dm³"
    definition: "Grams per cubic decimetre (g/dm cubed): a unit of concentration, the mass of solute in one dm
      cubed of solution; g/dm cubed = mol/dm cubed x molar mass."
    kcs: ["kc.chm.o.stoichiometry.solution_concentration"]
  - term: galvanising
    aliases: [galvanised]
    definition: "Galvanising: coating iron or steel with zinc; the zinc is a barrier and, being more reactive than
      iron, also gives sacrificial protection if the coating is scratched."
    kcs: [kc.chm.o.metals.corrosion]
  - term: gas
    definition: "Gas: a state in which particles are far apart, randomly arranged and moving quickly in all
      directions; a gas has no fixed shape or volume."
    kcs: ["kc.chm.o.states.particle_model"]
  - term: gas syringe
    definition: "Gas syringe: a graduated syringe used to collect a gas and measure its volume, usually in cm
      cubed."
    kcs: [kc.chm.o.analysis.apparatus, "kc.chm.o.reactions.rate_data"]
  - term: gasoline
    definition: "Gasoline (petrol): a petroleum fraction with small molecules and low boiling points, used as fuel
      for cars."
    kcs: ["kc.chm.o.organic.fuels_and_cracking"]
  - term: general formula
    definition: "General formula: a formula in n, the number of carbon atoms, that fits every member of a
      homologous series; for example an alkane has two n plus two hydrogen atoms."
    kcs: ["kc.chm.o.organic.general_formulae", "kc.chm.o.organic.functional_groups"]
  - term: giant covalent
    definition: "Giant covalent: a structure of very many atoms joined by covalent bonds in a lattice, such as
      diamond, graphite and silicon(IV) oxide; these have very high melting points."
    kcs: ["kc.chm.o.atoms.giant_covalent", "kc.chm.o.atoms.structure_and_properties"]
  - term: giant structure
    definition: "Giant structure: a lattice of very many particles held by strong bonds throughout, as in ionic,
      metallic and giant covalent substances; these have high melting points."
    kcs: ["kc.chm.o.atoms.structure_and_properties"]
  - term: glowing splint
    definition: "Glowing splint: used in the test for oxygen; a glowing splint relights in oxygen."
    kcs: ["kc.chm.o.analysis.gas_tests"]
  - term: graphite
    definition: "Graphite: a giant covalent form of carbon in layers; each carbon forms three bonds and has one
      delocalised electron, so it conducts, and the layers slide easily, so it is soft."
    kcs: ["kc.chm.o.atoms.giant_covalent"]
  - term: greenhouse effect
    definition: "Greenhouse effect: greenhouse gases absorb infrared radiation given out by the Earth's surface
      and re-emit it, keeping the lower atmosphere warmer."
    kcs: [kc.chm.o.environment.climate]
  - term: greenhouse gas
    definition: "Greenhouse gas: a gas that absorbs and re-emits infrared radiation in the atmosphere, such as
      carbon dioxide and methane."
    kcs: [kc.chm.o.environment.climate]
  - term: group
    definition: "Group: a vertical column of the Periodic Table; elements in the same group have the same number
      of outer-shell electrons and similar chemical properties."
    kcs: [kc.chm.o.periodic.arrangement]
    wrong: [group is a row, groups are rows]
  - term: Group VIII
    aliases: [Group 0]
    definition: "Group VIII (also called Group zero): the noble gases in the last column of the Periodic Table;
      their atoms have full outer shells, so they are unreactive."
    kcs: ["kc.chm.o.periodic.noble_gases"]
  - term: Group I
    definition: "Group I: the alkali metals, the first column of the Periodic Table; each atom has one outer-shell
      electron, and reactivity increases down the group."
    kcs: ["kc.chm.o.periodic.group_i", "kc.chm.o.periodic.transition_elements"]
  - term: Group VII
    definition: "Group VII: the halogens; each atom has seven outer-shell electrons. Down the group, reactivity
      decreases, colour gets darker and melting point rises."
    kcs: ["kc.chm.o.periodic.group_vii"]
  - term: Haber process
    definition: "Haber process: the industrial manufacture of ammonia from nitrogen and hydrogen in a reversible
      reaction, using an iron catalyst, about four hundred and fifty degrees C and about two hundred atmospheres."
    kcs: [kc.chm.o.reactions.equilibrium]
  - term: half-equation
    definition: "Half-equation: an ionic equation showing the electrons gained or lost at one electrode, such as a
      metal ion gaining electrons at the cathode."
    kcs: ["kc.chm.o.electrolysis.half_equations", "kc.chm.o.electrolysis.aqueous_products"]
  - term: halide
    definition: "Halide: a compound containing a halogen ion with a charge of minus one, such as chloride, bromide
      or iodide; tested with acidified silver nitrate."
    kcs: ["kc.chm.o.analysis.anion_tests", "kc.chm.o.periodic.group_vii"]
  - term: halogen
    definition: "Halogen: an element in Group VII, such as chlorine, bromine or iodine; a non-metal made of
      diatomic molecules, less reactive further down the group."
    kcs: ["kc.chm.o.periodic.group_vii"]
  - term: helium
    definition: "Helium: the noble gas with the lowest density; because it is unreactive and light it is used to
      fill balloons and airships."
    kcs: ["kc.chm.o.periodic.noble_gases"]
  - term: homologous series
    definition: "Homologous series: a family of organic compounds with the same functional group and general
      formula, similar chemical properties and a trend in physical properties; each member has one more CH two
      unit."
    kcs: ["kc.chm.o.organic.functional_groups", "kc.chm.o.organic.general_formulae"]
  - term: hydrated iron(III) oxide
    definition: "Hydrated iron(III) oxide: rust, the brown solid formed when iron or steel reacts with both oxygen
      and water."
    kcs: [kc.chm.o.metals.corrosion]
  - term: hydration
    definition: "Hydration: an addition reaction that adds water; ethanol is made by reacting ethene with steam
      over a phosphoric acid catalyst at high temperature and pressure."
    kcs: ["kc.chm.o.organic.alcohols_and_acids"]
  - term: hydrocarbon
    definition: "Hydrocarbon: a compound made of hydrogen and carbon atoms only, such as an alkane or an alkene."
    kcs: ["kc.chm.o.organic.functional_groups", "kc.chm.o.organic.alkanes_and_alkenes", kc.chm.o.organic.combustion]
  - term: hydrochloric acid
    definition: "Hydrochloric acid: a strong acid, hydrogen chloride dissolved in water; its salts are chlorides."
    kcs: ["kc.chm.o.acids.reactions_of_acids", "kc.chm.o.acids.strong_and_weak"]
  - term: hydrogen
    definition: "Hydrogen: the lightest element, a colourless gas; it forms when reactive metals react with acids
      or water, and it burns with a squeaky pop when tested with a lighted splint."
    kcs: ["kc.chm.o.analysis.gas_tests", "kc.chm.o.metals.reactivity_series"]
  - term: hydrogen chloride
    definition: "Hydrogen chloride: a colourless gas; where it meets ammonia gas a white ring of ammonium chloride
      forms, closer to the hydrogen chloride end because ammonia diffuses faster."
    kcs: [kc.chm.o.states.diffusion]
  - term: hydrogen ion
    definition: "Hydrogen ion (H+): the ion that acids release in water; the higher the concentration of hydrogen
      ions, the lower the pH."
    kcs: ["kc.chm.o.acids.strong_and_weak"]
  - term: hydrogencarbonate
    definition: "Hydrogencarbonate: a compound containing the ion of one hydrogen, one carbon and three oxygen
      atoms with a charge of minus one; sodium hydrogencarbonate reacting with an acid is endothermic."
    kcs: ["kc.chm.o.energetics.exo_endo", kc.chm.o.energetics.calorimetry]
  - term: hydroxide
    definition: "Hydroxide: a compound containing the hydroxide ion, OH-; soluble hydroxides are alkalis, and many
      metal hydroxides form coloured precipitates in cation tests."
    kcs: ["kc.chm.o.acids.reactions_of_acids", "kc.chm.o.analysis.cation_tests"]
  - term: impurity
    aliases: [impurities]
    definition: "Impurity: an unwanted substance mixed with the substance you want; impurities lower the melting
      point and make it melt over a range, and raise the boiling point."
    kcs: [kc.chm.o.analysis.purity, "kc.chm.o.stoichiometry.yield_and_purity"]
  - term: incomplete combustion
    definition: "Incomplete combustion: burning in too little oxygen; a hydrocarbon forms carbon monoxide or
      carbon (soot) and water instead of only carbon dioxide and water."
    kcs: [kc.chm.o.organic.combustion]
  - term: indicator
    definition: "Indicator: a substance whose colour depends on pH, used to show whether a solution is acidic,
      neutral or alkaline, or to show the end-point of a titration."
    kcs: ["kc.chm.o.acids.ph_and_indicators", "kc.chm.o.analysis.titration_technique"]
  - term: inert
    definition: "Inert: very unreactive, as the noble gases are because their atoms have full outer shells."
    kcs: ["kc.chm.o.periodic.noble_gases"]
  - term: inert electrode
    definition: "Inert electrode: an electrode, such as graphite or platinum, that does not react during
      electrolysis."
    kcs: ["kc.chm.o.electrolysis.aqueous_products"]
  - term: infrared radiation
    definition: "Infrared radiation: heat radiation; the warm Earth gives it out, and greenhouse gases absorb it
      and re-emit it."
    kcs: [kc.chm.o.environment.climate]
  - term: soluble
    definition: "Soluble: able to dissolve in a solvent, usually water, to form a solution."
    kcs: ["kc.chm.o.acids.salt_preparation", kc.chm.o.analysis.separation]
  - term: insoluble
    definition: "Insoluble: does not dissolve in the solvent, usually water. An insoluble solid can be separated
      from a liquid by filtration and can form as a precipitate."
    kcs: ["kc.chm.o.acids.salt_preparation", kc.chm.o.analysis.separation, "kc.chm.o.analysis.cation_tests"]
  - term: iodine
    definition: "Iodine: a Group VII halogen, a grey-black solid that gives a purple vapour and a brown solution.
      It is the least reactive of chlorine, bromine and iodine, so it cannot displace them."
    kcs: ["kc.chm.o.periodic.group_vii"]
  - term: ion
    definition: "Ion: an atom or group of atoms that carries an electrical charge because it has gained or lost
      electrons."
    kcs: ["kc.chm.o.atoms.ion_formation", "kc.chm.o.atoms.subatomic_particles", "kc.chm.o.stoichiometry.ionic_formulae"]
  - term: positive ion
    definition: "Positive ion (cation): an ion formed when an atom loses electrons, so it has more protons than
      electrons. Metals form positive ions."
    kcs: ["kc.chm.o.atoms.ion_formation", "kc.chm.o.atoms.metallic_bonding"]
  - term: negative ion
    definition: "Negative ion (anion): an ion formed when an atom gains electrons, so it has more electrons than
      protons. Non-metals form negative ions."
    kcs: ["kc.chm.o.atoms.ion_formation"]
  - term: ionic compound
    definition: "Ionic compound: a compound made of positive and negative ions held together by ionic bonds,
      usually a metal with a non-metal. The charges cancel, so the compound has no overall charge."
    kcs: ["kc.chm.o.stoichiometry.ionic_formulae"]
  - term: ionic formula
    definition: "Ionic formula: the formula of an ionic compound, showing the simplest ratio of ions in which the
      positive and negative charges add up to zero."
    kcs: ["kc.chm.o.stoichiometry.ionic_formulae"]
  - term: ionic half-equation
    definition: "Ionic half-equation: an equation for the change at one electrode only, with electrons written as
      e-, for example a copper ion gaining two electrons to form a copper atom. Atoms and charges must balance."
    kcs: ["kc.chm.o.electrolysis.half_equations"]
  - term: ionic lattice
    aliases: [ionic]
    definition: "Ionic lattice: a giant regular arrangement of alternating positive and negative ions held by
      strong electrostatic attraction in all directions. Ionic substances have high melting points and conduct
      only when molten or dissolved."
    kcs: ["kc.chm.o.atoms.structure_and_properties"]
  - term: ionisation
    aliases: [ionise, ionised]
    definition: "Ionisation: the splitting of molecules into ions when a substance dissolves in water. An acid
      ionises to release hydrogen ions, H+."
    kcs: ["kc.chm.o.acids.strong_and_weak"]
  - term: partly ionised
    definition: "Partly ionised: only a small fraction of the molecules split into ions in water; most stay as
      whole molecules. Weak acids such as ethanoic acid are partly ionised."
    kcs: ["kc.chm.o.organic.carboxylic_acids"]
  - term: iridium
    definition: "Iridium: a dense transition metal, symbol Ir. Its atoms occur as two isotopes, so its relative
      atomic mass is the weighted average of their masses."
    kcs: [kc.chm.o.atoms.isotopes]
  - term: iron(III) oxide
    definition: "Iron(III) oxide: the main compound in the iron ore haematite. In the blast furnace it is reduced
      by carbon monoxide to iron."
    kcs: ["kc.chm.o.metals.extraction_yield"]
  - term: isotope
    definition: "Isotopes: atoms of the same element with the same proton number but different numbers of
      neutrons, so different nucleon numbers. They have the same chemical properties."
    kcs: [kc.chm.o.atoms.isotopes]
  - term: kerosene
    definition: "Kerosene: a fraction from the fractional distillation of petroleum, used as fuel for jet
      aircraft."
    kcs: ["kc.chm.o.organic.fuels_and_cracking"]
  - term: kinetic energy
    definition: "Kinetic energy: the energy a particle has because it is moving. Heating a substance increases the
      average kinetic energy of its particles, so they move faster."
    kcs: ["kc.chm.o.states.particle_model"]
  - term: lattice
    definition: "Lattice: a regular, repeating three-dimensional arrangement of particles (atoms, ions or
      molecules) in a solid. A metal is a lattice of positive ions in a sea of delocalised electrons."
    kcs: ["kc.chm.o.atoms.giant_covalent", "kc.chm.o.atoms.metallic_bonding", "kc.chm.o.metals.properties_of_metals"]
  - term: lighted splint
    definition: "Lighted splint: the test for hydrogen. A lighted splint held at the mouth of the tube gives a
      squeaky pop if hydrogen is present."
    kcs: ["kc.chm.o.analysis.gas_tests"]
  - term: limewater
    definition: "Limewater: aqueous calcium hydroxide. It turns milky (cloudy white) when carbon dioxide is
      bubbled through it; this is the test for carbon dioxide."
    kcs: ["kc.chm.o.analysis.gas_tests", "kc.chm.o.analysis.anion_tests"]
  - term: limiting reactant
    definition: "Limiting reactant: the reactant that is used up first. It fixes the maximum amount of product;
      the other reactant is in excess."
    kcs: ["kc.chm.o.stoichiometry.reacting_masses"]
  - term: liquid
    definition: "Liquid: a state in which particles are close together in a random arrangement and slide past each
      other. A liquid has a fixed volume but takes the shape of its container."
    kcs: ["kc.chm.o.states.particle_model"]
  - term: solid
    definition: "Solid: a state in which particles are closely packed in a regular arrangement and only vibrate
      about fixed positions. A solid has a fixed shape and a fixed volume."
    kcs: ["kc.chm.o.states.particle_model"]
  - term: vibrate
    definition: "Vibrate: move rapidly to and fro about a fixed position, as the particles in a solid do. They
      vibrate more as the temperature rises."
    kcs: ["kc.chm.o.states.particle_model"]
  - term: lithium
    definition: "Lithium: the first Group I alkali metal. It is the least reactive of lithium, sodium and
      potassium, and reacts steadily with water to give lithium hydroxide and hydrogen."
    kcs: ["kc.chm.o.periodic.group_i"]
  - term: sodium
    definition: "Sodium: a Group I alkali metal, stored under oil. It reacts vigorously with cold water, melting
      into a ball that moves about, giving sodium hydroxide and hydrogen."
    kcs: ["kc.chm.o.periodic.group_i"]
  - term: potassium
    definition: "Potassium: a Group I alkali metal, more reactive than sodium. It forms K+ ions and reacts
      violently with water to give potassium hydroxide and hydrogen. It is one of the nutrients in NPK
      fertilisers."
    kcs: ["kc.chm.o.periodic.group_i", "kc.chm.o.metals.reactivity_series", kc.chm.o.environment.fertilisers]
  - term: rubidium
    definition: "Rubidium: a Group I alkali metal below potassium. Following the trend down the group, it is more
      reactive than potassium and reacts explosively with water."
    kcs: ["kc.chm.o.periodic.group_i"]
  - term: litmus
    definition: "Litmus: an indicator that is red in acidic solutions and blue in alkaline solutions. Damp red
      litmus paper turns blue in ammonia gas; chlorine bleaches damp litmus paper."
    kcs: ["kc.chm.o.acids.ph_and_indicators", "kc.chm.o.analysis.gas_tests"]
  - term: locating agent
    definition: "Locating agent: a chemical sprayed on a chromatogram to make colourless spots visible so that
      their positions can be measured."
    kcs: [kc.chm.o.analysis.chromatography]
  - term: lone pair
    aliases: [non-bonding pair]
    definition: "Lone pair (non-bonding pair): a pair of outer-shell electrons on an atom that is not shared in a
      covalent bond."
    kcs: ["kc.chm.o.atoms.covalent_bonding"]
  - term: shared pair
    definition: "Shared pair: a pair of electrons shared between two atoms, one from each atom; each shared pair
      is one covalent bond."
    kcs: ["kc.chm.o.atoms.covalent_bonding"]
  - term: magnesium
    definition: "Magnesium: a reactive Group II metal that forms ions with a two-plus charge. It burns with a
      bright white flame to form magnesium oxide and reacts with dilute acids to give a salt and hydrogen."
    kcs: ["kc.chm.o.metals.reactivity_series", "kc.chm.o.atoms.ion_formation", "kc.chm.o.metals.properties_and_uses"]
  - term: malleable
    aliases: [malleability]
    definition: "Malleable: can be hammered or pressed into shape without breaking. Metals are malleable because
      layers of positive ions slide over each other while the delocalised electrons keep holding them."
    kcs: ["kc.chm.o.atoms.metallic_bonding", "kc.chm.o.metals.properties_of_metals"]
  - term: potassium manganate(VII)
    aliases: [manganate(VII)]
    definition: "Potassium manganate(VII): a purple oxidising agent, used acidified. It turns from purple to
      colourless when it oxidises a substance, for example ethanol to ethanoic acid."
    kcs: [kc.chm.o.reactions.redox, "kc.chm.o.organic.alcohols_and_acids"]
  - term: manganese
    definition: "Manganese: a transition element that shows several oxidation states, for example plus seven in
      the manganate(VII) ion and plus two in manganese(II) compounds."
    kcs: ["kc.chm.o.reactions.oxidation_numbers"]
  - term: nucleon number
    aliases: [mass number]
    definition: "Nucleon number (mass number): the total number of protons and neutrons in the nucleus of an atom.
      Number of neutrons = nucleon number - proton number."
    kcs: ["kc.chm.o.atoms.subatomic_particles", kc.chm.o.atoms.isotopes]
  - term: proton number
    definition: "Proton number (atomic number): the number of protons in the nucleus of an atom. It identifies the
      element and, in a neutral atom, equals the number of electrons."
    kcs: ["kc.chm.o.atoms.subatomic_particles", "kc.chm.o.atoms.electron_arrangement", kc.chm.o.periodic.arrangement]
  - term: proton
    definition: "Proton: a particle in the nucleus with relative mass one and relative charge plus one."
    kcs: ["kc.chm.o.atoms.subatomic_particles"]
  - term: neutron
    definition: "Neutron: a particle in the nucleus with relative mass one and no charge."
    kcs: ["kc.chm.o.atoms.subatomic_particles"]
  - term: nucleus
    definition: "Nucleus: the tiny, positively charged centre of an atom. It contains the protons and neutrons and
      nearly all of the atom's mass."
    kcs: ["kc.chm.o.atoms.subatomic_particles"]
  - term: mean rate
    definition: "Mean rate: the change in the amount of a reactant or product (such as gas volume or mass) divided
      by the time taken for that change, for example in cm cubed per second."
    kcs: ["kc.chm.o.reactions.rate_data"]
  - term: rate of reaction
    definition: "Rate of reaction: how fast reactants are used up or products are formed, the change in amount per
      unit time. It is found by measuring gas volume or mass over time."
    kcs: ["kc.chm.o.reactions.rate_factors", "kc.chm.o.reactions.rate_data"]
  - term: measuring cylinder
    definition: "Measuring cylinder: a graduated cylinder for measuring approximate volumes of liquid. It is less
      precise than a pipette or a burette."
    kcs: [kc.chm.o.analysis.apparatus]
  - term: melting
    definition: "Melting: the change from solid to liquid. Energy is taken in to overcome the forces between
      particles, and the temperature stays constant while a pure solid melts."
    kcs: ["kc.chm.o.states.changes_of_state"]
  - term: melting point
    definition: "Melting point: the temperature at which a solid turns into a liquid. A pure substance melts at a
      sharp, fixed temperature; impurities lower the melting point and make it melt over a range."
    kcs: [kc.chm.o.analysis.purity, "kc.chm.o.states.changes_of_state", "kc.chm.o.atoms.structure_and_properties"]
  - term: sublimation
    definition: "Sublimation: the change of a solid directly into a gas without first becoming a liquid."
    kcs: ["kc.chm.o.states.changes_of_state"]
  - term: metal oxide
    definition: "Metal oxide: a compound of a metal with oxygen, formed when a metal burns in oxygen or reacts
      with steam. Most metal oxides are basic; a few, such as aluminium oxide and zinc oxide, are amphoteric."
    kcs: ["kc.chm.o.metals.properties_of_metals"]
  - term: metallic bonding
    aliases: [metallic bond, metallic]
    definition: "Metallic bonding: the strong electrostatic attraction between a lattice of positive metal ions
      and a sea of delocalised electrons that move freely through the structure."
    kcs: ["kc.chm.o.atoms.metallic_bonding", "kc.chm.o.metals.properties_of_metals"]
  - term: methane
    definition: "Methane: the simplest alkane, one carbon atom bonded to four hydrogen atoms. It is the main part
      of natural gas and a greenhouse gas released by cattle, rice fields and landfill sites."
    kcs: [kc.chm.o.organic.naming, kc.chm.o.environment.climate]
  - term: methanoic acid
    definition: "Methanoic acid: the carboxylic acid with one carbon atom, HCOOH."
    kcs: [kc.chm.o.organic.naming]
  - term: methanol
    definition: "Methanol: the alcohol with one carbon atom, a methyl group joined to an -OH group."
    kcs: [kc.chm.o.organic.naming]
  - term: propane
    definition: "Propane: the alkane with three carbon atoms in an unbranched chain, joined by single bonds."
    kcs: [kc.chm.o.organic.naming]
  - term: propene
    definition: "Propene: the alkene with three carbon atoms and one carbon-carbon double bond."
    kcs: [kc.chm.o.organic.naming]
  - term: propanol
    definition: "Propanol: the alcohol with three carbon atoms in an unbranched chain and an -OH group."
    kcs: [kc.chm.o.organic.naming]
  - term: propanoic acid
    definition: "Propanoic acid: the carboxylic acid with three carbon atoms, counting the carbon of the -COOH
      group."
    kcs: [kc.chm.o.organic.naming]
  - term: methyl ethanoate
    definition: "Methyl ethanoate: the ester made from methanol and ethanoic acid. The alcohol part gives the
      first word of the name, the acid part the second."
    kcs: ["kc.chm.o.organic.carboxylic_acids"]
  - term: propyl ethanoate
    definition: "Propyl ethanoate: the ester made from propanol and ethanoic acid, with water as the other
      product."
    kcs: ["kc.chm.o.organic.carboxylic_acids"]
  - term: perfume
    definition: "Perfume: a pleasant-smelling mixture. Esters are used in perfumes and flavourings because many
      have sweet, fruity smells."
    kcs: ["kc.chm.o.organic.carboxylic_acids"]
  - term: methyl orange
    definition: "Methyl orange: an acid-base indicator that is red in acidic solutions and yellow in alkaline
      solutions, and orange at the end point of a titration."
    kcs: ["kc.chm.o.acids.ph_and_indicators"]
  - term: universal indicator
    definition: "Universal indicator: a mixture of indicators that shows a range of colours across the pH scale:
      red for strongly acidic, green for neutral, purple for strongly alkaline."
    kcs: ["kc.chm.o.acids.ph_and_indicators", "kc.chm.o.acids.strong_and_weak"]
  - term: pH
    definition: "pH: a scale from zero to fourteen showing how acidic or alkaline a solution is. Below seven is
      acidic, seven is neutral, above seven is alkaline; the lower the pH, the higher the concentration of H+
      ions."
    kcs: ["kc.chm.o.acids.ph_and_indicators", "kc.chm.o.acids.strong_and_weak"]
  - term: neutral
    definition: "Neutral: neither acidic nor alkaline; a neutral solution has a pH of seven and turns universal
      indicator green."
    kcs: ["kc.chm.o.acids.ph_and_indicators"]
  - term: mixture
    definition: "Mixture: two or more substances mixed but not chemically combined. It has no fixed composition
      and can be separated by physical methods."
    kcs: ["kc.chm.o.atoms.element_compound_mixture", kc.chm.o.analysis.separation]
  - term: "mol/dm³"
    definition: "Moles per decimetre cubed (mol/dm cubed): the unit of concentration, the amount of solute in
      moles in each dm cubed of solution; concentration = moles / volume in dm cubed."
    kcs: ["kc.chm.o.stoichiometry.solution_concentration", "kc.chm.o.acids.titration_calculations"]
  - term: molar gas volume
    definition: "Molar gas volume: the volume of one mole of any gas, twenty-four dm cubed at room temperature and
      pressure. Volume of gas = moles x twenty-four dm cubed."
    kcs: ["kc.chm.o.stoichiometry.gas_volumes"]
  - term: room temperature and pressure
    definition: "Room temperature and pressure (r.t.p.): twenty degrees Celsius and one atmosphere. At r.t.p. one
      mole of any gas takes up twenty-four dm cubed."
    kcs: ["kc.chm.o.stoichiometry.gas_volumes", "kc.chm.o.reactions.rate_data"]
    cues: [r.t.p., rtp]
  - term: molar mass
    definition: "Molar mass: the mass of one mole of a substance, in g/mol, numerically equal to its relative
      formula mass. Moles = mass / molar mass."
    kcs: ["kc.chm.o.stoichiometry.moles_and_mass", "kc.chm.o.stoichiometry.reacting_masses"]
  - term: mole
    definition: "Mole: the amount of substance that contains the Avogadro constant of particles, about six point
      zero two times ten to the power twenty-three. Moles = mass / molar mass."
    kcs: ["kc.chm.o.stoichiometry.moles_and_mass", "kc.chm.o.stoichiometry.gas_volumes"]
  - term: mole ratio
    definition: "Mole ratio: the ratio of the amounts in moles of substances, taken from the coefficients of a
      balanced equation or from the atoms in a formula."
    kcs: ["kc.chm.o.stoichiometry.reacting_masses", "kc.chm.o.stoichiometry.empirical_formula"]
  - term: reacting mass
    definition: "Reacting mass: the mass of a substance that reacts or is formed, found by converting a given mass
      to moles, using the mole ratio from the balanced equation, then converting back to mass."
    kcs: ["kc.chm.o.stoichiometry.reacting_masses"]
  - term: simple molecular
    aliases: [molecular]
    definition: "Simple molecular: made of small molecules with strong covalent bonds inside each molecule but
      weak forces between molecules, so melting and boiling points are low and the substance does not conduct."
    kcs: ["kc.chm.o.atoms.structure_and_properties"]
  - term: molecular formula
    definition: "Molecular formula: the actual number of atoms of each element in one molecule. It is a
      whole-number multiple of the empirical formula."
    kcs: ["kc.chm.o.stoichiometry.empirical_formula", "kc.chm.o.organic.general_formulae"]
  - term: molecule
    definition: "Molecule: a particle of two or more atoms joined by covalent bonds."
    kcs: ["kc.chm.o.atoms.covalent_bonding", "kc.chm.o.atoms.element_compound_mixture"]
  - term: molten
    definition: "Molten: melted, in the liquid state, said of a substance that is solid at room temperature. A
      molten ionic compound conducts electricity because its ions can move."
    kcs: ["kc.chm.o.electrolysis.molten_products", "kc.chm.o.atoms.structure_and_properties"]
  - term: monomer
    definition: "Monomer: a small molecule that can join with many other such molecules to form a polymer."
    kcs: [kc.chm.o.organic.polymers]
  - term: polymer
    definition: "Polymer: a very large molecule made by joining many monomer molecules, built from a repeat unit."
    kcs: [kc.chm.o.organic.polymers]
  - term: polymerisation
    definition: "Polymerisation: joining many monomers into a polymer. In addition polymerisation alkene monomers
      join with no other product; in condensation polymerisation a small molecule such as water is also formed."
    kcs: [kc.chm.o.organic.polymers]
  - term: repeat unit
    definition: "Repeat unit: the smallest section of a polymer chain that repeats over and over to make the whole
      chain."
    kcs: [kc.chm.o.organic.polymers]
  - term: poly(ethene)
    definition: "Poly(ethene): the addition polymer made from ethene, used for plastic bags and bottles. It is not
      biodegradable."
    kcs: [kc.chm.o.organic.polymers]
  - term: poly(chloroethene)
    definition: "Poly(chloroethene), PVC: the addition polymer made from chloroethene, used for water pipes and
      the insulation on electrical wires."
    kcs: [kc.chm.o.organic.polymers]
  - term: polyamide
    definition: "Polyamide: a condensation polymer whose monomers are joined by amide links, -CONH-, with water
      formed as well. Nylon is a polyamide; proteins are natural polyamides."
    kcs: [kc.chm.o.organic.polymers]
  - term: polyester
    definition: "Polyester: a condensation polymer whose monomers are joined by ester links, -COO-, with water
      formed as well. PET is a polyester."
    kcs: [kc.chm.o.organic.polymers]
  - term: naphtha
    definition: "Naphtha: a fraction from the fractional distillation of petroleum, used as the feedstock for
      making chemicals."
    kcs: ["kc.chm.o.organic.fuels_and_cracking"]
  - term: petroleum
    definition: "Petroleum (crude oil): a mixture of hydrocarbons, separated into useful fractions by fractional
      distillation."
    kcs: ["kc.chm.o.organic.fuels_and_cracking"]
  - term: refinery
    definition: "Refinery: an industrial plant where petroleum is separated into fractions by fractional
      distillation and some fractions are cracked."
    kcs: ["kc.chm.o.organic.fuels_and_cracking"]
  - term: refinery gas
    definition: "Refinery gas: the fraction with the smallest molecules and lowest boiling points, collected at
      the top of the column and used as bottled gas for heating and cooking."
    kcs: ["kc.chm.o.organic.fuels_and_cracking"]
  - term: neon
    definition: "Neon: a noble gas with a full outer shell, so it is unreactive. It is used in advertising signs
      because it glows when electricity passes through it."
    kcs: ["kc.chm.o.periodic.noble_gases"]
  - term: noble gas
    definition: "Noble gases: the elements in the last group of the Periodic Table (Group VIII, also called Group
      zero). They have full outer shells, so they are unreactive and exist as single atoms."
    kcs: ["kc.chm.o.periodic.noble_gases"]
  - term: unreactive
    definition: "Unreactive: does not react, or reacts only with great difficulty. Noble gases are unreactive
      because their outer shells are full, so they do not need to gain, lose or share electrons."
    kcs: ["kc.chm.o.periodic.noble_gases"]
  - term: neutral oxide
    definition: "Neutral oxide: an oxide that reacts with neither acids nor bases, such as carbon monoxide and
      nitrogen monoxide."
    kcs: [kc.chm.o.acids.oxides]
  - term: oxide
    definition: "Oxide: a compound of an element with oxygen only. Oxides are classed as acidic, basic, amphoteric
      or neutral by how they react."
    kcs: [kc.chm.o.acids.oxides]
  - term: neutralisation
    aliases: [neutralise, neutralised]
    definition: "Neutralisation: the reaction of an acid with a base to form a salt and water; H+ ions react with
      OH- ions to form water. It is exothermic."
    kcs: ["kc.chm.o.acids.reactions_of_acids", "kc.chm.o.acids.ph_and_indicators", "kc.chm.o.energetics.exo_endo"]
  - term: salt
    definition: "Salt: a compound formed when the hydrogen of an acid is replaced by a metal ion or an ammonium
      ion, for example sodium chloride from hydrochloric acid."
    kcs: ["kc.chm.o.acids.reactions_of_acids", "kc.chm.o.acids.salt_preparation"]
  - term: new substance
    definition: "New substance: a substance with different properties from the starting materials. A chemical
      change makes a new substance; a physical change does not."
    kcs: ["kc.chm.o.reactions.physical_chemical_change"]
  - term: physical change
    definition: "Physical change: a change in state or form, such as melting or dissolving, in which no new
      substance is made. It is usually easy to reverse."
    kcs: ["kc.chm.o.reactions.physical_chemical_change"]
  - term: nitrate
    definition: "Nitrate: the ion of one nitrogen and three oxygen atoms with a one-minus charge, found in salts
      of nitric acid. All nitrates are soluble in water."
    kcs: ["kc.chm.o.acids.reactions_of_acids", "kc.chm.o.stoichiometry.ionic_formulae"]
  - term: sulfate
    definition: "Sulfate: the ion of one sulfur and four oxygen atoms with a two-minus charge, found in salts of
      sulfuric acid. Test: acidify, add aqueous barium nitrate; a white precipitate of barium sulfate forms."
    kcs: ["kc.chm.o.analysis.anion_tests", "kc.chm.o.acids.reactions_of_acids", "kc.chm.o.stoichiometry.ionic_formulae"]
  - term: nitric acid
    definition: "Nitric acid: a strong acid that forms nitrate salts. Dilute nitric acid is used to acidify a
      sample before the halide test with silver nitrate."
    kcs: ["kc.chm.o.acids.reactions_of_acids", "kc.chm.o.acids.strong_and_weak", "kc.chm.o.analysis.anion_tests"]
  - term: sulfuric acid
    definition: "Sulfuric acid: a strong acid that forms sulfate salts. Concentrated sulfuric acid is the catalyst
      when an ester is made from an alcohol and a carboxylic acid."
    kcs: ["kc.chm.o.acids.reactions_of_acids", "kc.chm.o.acids.strong_and_weak", "kc.chm.o.organic.carboxylic_acids"]
  - term: strong acid
    definition: "Strong acid: an acid that is completely ionised in water, such as hydrochloric, nitric or
      sulfuric acid."
    kcs: ["kc.chm.o.acids.strong_and_weak"]
  - term: weak acid
    definition: "Weak acid: an acid that is only partly ionised in water, such as ethanoic acid. At the same
      concentration it has a higher pH than a strong acid. Weak does not mean dilute."
    kcs: ["kc.chm.o.acids.strong_and_weak", "kc.chm.o.organic.carboxylic_acids"]
    wrong: [weak acid is a dilute acid]
  - term: nitrogen
    definition: "Nitrogen: an unreactive gas that makes up about four fifths of the air. Its molecule has a triple
      covalent bond. Plants need nitrogen for growth, so it is supplied in fertilisers."
    kcs: ["kc.chm.o.atoms.covalent_bonding", kc.chm.o.environment.fertilisers]
  - term: nitrogen monoxide
    definition: "Nitrogen monoxide: a neutral oxide formed in car engines when nitrogen and oxygen from the air
      react at high temperature. In air it is oxidised to nitrogen dioxide."
    kcs: ["kc.chm.o.environment.air_pollution", kc.chm.o.acids.oxides]
  - term: nitrogen dioxide
    definition: "Nitrogen dioxide: a brown, toxic acidic gas formed from nitrogen monoxide in air. It causes acid
      rain, photochemical smog and breathing problems."
    kcs: ["kc.chm.o.environment.air_pollution"]
  - term: nitrogen oxides
    aliases: [oxides of nitrogen]
    definition: "Oxides of nitrogen: nitrogen monoxide and nitrogen dioxide, formed in hot car engines. They cause
      acid rain, photochemical smog and breathing problems; catalytic converters reduce them to nitrogen."
    kcs: ["kc.chm.o.environment.air_pollution"]
  - term: sulfur dioxide
    definition: "Sulfur dioxide: an acidic gas formed when fuels containing sulfur burn. It causes acid rain; it
      is reduced by using low-sulfur fuels and by flue gas desulfurisation with calcium oxide."
    kcs: ["kc.chm.o.environment.air_pollution"]
  - term: particulates
    definition: "Particulates: tiny solid particles, mainly carbon (soot), released by incomplete combustion of
      fuels such as diesel. Breathing them in increases the risk of breathing problems and cancer."
    kcs: ["kc.chm.o.environment.air_pollution"]
  - term: pollutant
    definition: "Pollutant: a substance released into the environment that harms living things or damages
      materials."
    kcs: ["kc.chm.o.environment.air_pollution"]
  - term: pollution
    definition: "Pollution: the presence of harmful substances (pollutants) in the air, water or land, often from
      burning fuels, industry or farming."
    kcs: ["kc.chm.o.environment.air_pollution"]
  - term: sulfur trioxide
    definition: "Sulfur trioxide: made in the Contact process by the reversible, exothermic reaction of sulfur
      dioxide with oxygen over a vanadium(V) oxide catalyst."
    kcs: [kc.chm.o.reactions.equilibrium]
  - term: NPK fertiliser
    definition: "NPK fertiliser: a fertiliser containing compounds of nitrogen (N), phosphorus (P) and potassium
      (K), the three main elements plants need for growth."
    kcs: [kc.chm.o.environment.fertilisers]
  - term: phosphorus
    definition: "Phosphorus: one of the three main plant nutrients in NPK fertilisers, supplied as phosphate
      compounds."
    kcs: [kc.chm.o.environment.fertilisers]
  - term: urea
    definition: "Urea: a nitrogen fertiliser with a very high percentage by mass of nitrogen, so a small mass
      supplies a lot of nitrogen."
    kcs: [kc.chm.o.environment.fertilisers]
  - term: ore
    definition: "Ore: a rock that contains enough of a metal or metal compound to make extracting the metal
      worthwhile."
    kcs: [kc.chm.o.metals.extraction, "kc.chm.o.metals.extraction_yield"]
  - term: organic compound
    definition: "Organic compound: a compound based on chains of carbon atoms, usually with hydrogen, such as
      alkanes, alkenes, alcohols and carboxylic acids."
    kcs: ["kc.chm.o.organic.functional_groups"]
  - term: outer shell
    aliases: [outer-shell]
    definition: "Outer shell: the occupied electron shell furthest from the nucleus. Its electrons take part in
      bonding; a full outer shell is stable."
    kcs: ["kc.chm.o.atoms.electron_arrangement", "kc.chm.o.atoms.ion_formation", kc.chm.o.periodic.arrangement]
  - term: outer-shell electrons
    aliases: [outer electron]
    definition: "Outer-shell electrons: the electrons in the outer shell. For Groups I to VII their number equals
      the group number, and they decide how an element reacts."
    kcs: [kc.chm.o.periodic.arrangement, "kc.chm.o.periodic.group_i"]
  - term: shell
    definition: "Shell: an energy level around the nucleus that holds electrons. For the first twenty elements the
      first shell holds up to two electrons and the next shells up to eight."
    kcs: ["kc.chm.o.atoms.electron_arrangement"]
  - term: period
    definition: "Period: a horizontal row of the Periodic Table. Elements in the same period have the same number
      of occupied electron shells."
    kcs: [kc.chm.o.periodic.arrangement]
  - term: Periodic Table
    definition: "Periodic Table: the table of elements in order of increasing proton number, arranged in groups
      (columns) of similar elements and periods (rows)."
    kcs: [kc.chm.o.periodic.arrangement]
  - term: overall charge
    definition: "Overall charge: the total charge of a compound or ion. A compound has overall charge zero; the
      oxidation numbers of all the atoms add up to the overall charge."
    kcs: ["kc.chm.o.reactions.oxidation_numbers"]
  - term: oxidation number
    aliases: [oxidation state]
    definition: "Oxidation number: the charge an atom would have if all its bonds were ionic. An uncombined
      element has oxidation number zero; it is shown by Roman numerals in names such as iron(III)."
    kcs: ["kc.chm.o.reactions.oxidation_numbers", "kc.chm.o.periodic.transition_elements"]
  - term: oxidation
    aliases: [oxidised]
    definition: "Oxidation: the gain of oxygen, the loss of electrons, or an increase in oxidation number. A
      substance that undergoes this is oxidised."
    kcs: [kc.chm.o.reactions.redox, "kc.chm.o.reactions.oxidation_numbers", "kc.chm.o.organic.alcohols_and_acids"]
    wrong: [oxidation is gain of electrons, oxidation is the gain of electrons]
  - term: reduction
    aliases: [reduced]
    definition: "Reduction: the loss of oxygen, the gain of electrons, or a decrease in oxidation number. Metal
      oxides are reduced to metals in extraction."
    kcs: [kc.chm.o.reactions.redox, kc.chm.o.metals.extraction]
    wrong: [reduction is loss of electrons, reduction is the loss of electrons]
  - term: redox
    definition: "Redox: a reaction in which oxidation and reduction happen together; one substance loses electrons
      while another gains them."
    kcs: [kc.chm.o.reactions.redox]
  - term: oxidising agent
    definition: "Oxidising agent: a substance that oxidises another substance and is itself reduced, by gaining
      electrons."
    kcs: [kc.chm.o.reactions.redox]
    wrong: [oxidising agent is oxidised]
  - term: reducing agent
    definition: "Reducing agent: a substance that reduces another substance and is itself oxidised, by losing
      electrons."
    kcs: [kc.chm.o.reactions.redox]
    wrong: [reducing agent is reduced]
  - term: oxygen
    definition: "Oxygen: a gas making up about one fifth of the air. It relights a glowing splint, is needed for
      combustion and rusting, and forms oxide ions with a two-minus charge."
    kcs: ["kc.chm.o.analysis.gas_tests", "kc.chm.o.atoms.ion_formation", kc.chm.o.metals.corrosion]
  - term: particle
    definition: "Particle: a tiny piece of matter, an atom, ion or molecule. All substances are made of particles
      that are always moving."
    kcs: ["kc.chm.o.states.particle_model", "kc.chm.o.reactions.collision_theory"]
  - term: particle model
    definition: "Particle model: the idea that all matter is made of tiny particles in constant motion; their
      arrangement, spacing and movement explain the properties of solids, liquids and gases."
    kcs: ["kc.chm.o.states.particle_model"]
  - term: state
    definition: "State: the physical form of a substance, solid, liquid or gas, shown in equations by state
      symbols (s), (l), (g), and (aq) for aqueous."
    kcs: ["kc.chm.o.states.changes_of_state"]
  - term: steam
    definition: "Steam: water as a gas. Metals such as magnesium, zinc and iron react with steam to form the metal
      oxide and hydrogen."
    kcs: ["kc.chm.o.metals.properties_of_metals"]
  - term: percentage abundance
    definition: "Percentage abundance: the percentage of the atoms of an element that are a particular isotope. It
      is used to find the relative atomic mass as a weighted average."
    kcs: [kc.chm.o.atoms.isotopes]
  - term: relative atomic mass
    definition: "Relative atomic mass (Ar): the weighted average mass of the atoms of an element, taking account
      of its isotopes, compared with one twelfth of the mass of a carbon-twelve atom. It has no units."
    kcs: [kc.chm.o.atoms.isotopes, "kc.chm.o.stoichiometry.relative_formula_mass"]
  - term: relative formula mass
    definition: "Relative formula mass (Mr): the sum of the relative atomic masses of all the atoms in the formula
      of a substance. It has no units."
    kcs: ["kc.chm.o.stoichiometry.relative_formula_mass", "kc.chm.o.stoichiometry.moles_and_mass"]
  - term: relative molecular mass
    definition: "Relative molecular mass (Mr): the sum of the relative atomic masses of all the atoms in one
      molecule. It has no units."
    kcs: ["kc.chm.o.stoichiometry.relative_formula_mass", "kc.chm.o.organic.general_formulae", kc.chm.o.states.diffusion]
  - term: percentage by mass
    definition: "Percentage by mass of an element: (number of its atoms in the formula x its Ar) / Mr of the
      compound x one hundred."
    kcs: ["kc.chm.o.stoichiometry.percentage_composition", kc.chm.o.environment.fertilisers, "kc.chm.o.metals.extraction_yield"]
  - term: percentage composition
    definition: "Percentage composition: the percentage by mass of each element in a compound; the percentages add
      up to one hundred."
    kcs: ["kc.chm.o.stoichiometry.percentage_composition"]
  - term: percentage purity
    definition: "Percentage purity: mass of the pure substance / mass of the impure sample x one hundred."
    kcs: ["kc.chm.o.stoichiometry.yield_and_purity"]
  - term: percentage yield
    definition: "Percentage yield: actual yield / theoretical yield x one hundred. It is less than one hundred
      percent when some product is lost or the reaction is incomplete."
    kcs: ["kc.chm.o.stoichiometry.yield_and_purity"]
  - term: theoretical yield
    definition: "Theoretical yield: the maximum mass of product, calculated from the balanced equation assuming
      all the limiting reactant reacts and none is lost."
    kcs: ["kc.chm.o.stoichiometry.yield_and_purity"]
  - term: yield
    definition: "Yield: the amount of product obtained from a reaction. In a reversible reaction it is the amount
      of product present at equilibrium."
    kcs: ["kc.chm.o.stoichiometry.yield_and_purity", kc.chm.o.reactions.equilibrium]
  - term: photosynthesis
    definition: "Photosynthesis: the endothermic process in which plants use light energy to make glucose and
      oxygen from carbon dioxide and water."
    kcs: ["kc.chm.o.energetics.exo_endo"]
  - term: respiration
    definition: "Respiration: the exothermic process in living cells in which glucose reacts with oxygen to give
      carbon dioxide and water, releasing energy."
    kcs: ["kc.chm.o.energetics.exo_endo"]
  - term: thermal decomposition
    definition: "Thermal decomposition: the breaking down of a compound into simpler substances by heating, for
      example calcium carbonate into calcium oxide and carbon dioxide. It is endothermic."
    kcs: ["kc.chm.o.energetics.exo_endo"]
  - term: sodium hydrogencarbonate
    definition: "Sodium hydrogencarbonate: baking soda. Its reaction with an acid is endothermic, so the
      temperature of the mixture falls."
    kcs: ["kc.chm.o.energetics.exo_endo"]
  - term: pipette
    aliases: [volumetric pipette]
    definition: "Pipette (volumetric pipette): glassware that delivers one fixed, accurate volume of solution,
      such as twenty-five cm cubed, when filled to the mark with a pipette filler."
    kcs: [kc.chm.o.analysis.apparatus, "kc.chm.o.analysis.titration_technique"]
  - term: stopwatch
    definition: "Stopwatch: apparatus used to measure time, for example in rate experiments."
    kcs: [kc.chm.o.analysis.apparatus]
  - term: thermometer
    definition: "Thermometer: apparatus used to measure temperature, in degrees Celsius."
    kcs: [kc.chm.o.analysis.apparatus]
  - term: polystyrene cup
    definition: "Polystyrene cup: an insulated cup used as a simple calorimeter; it reduces heat loss to the
      surroundings."
    kcs: [kc.chm.o.energetics.calorimetry]
  - term: specific heat capacity
    definition: "Specific heat capacity (c): the energy needed to raise the temperature of one gram of a substance
      by one degree Celsius. For water it is taken as four point two J/g/°C; energy Q = m x c x ΔT."
    kcs: [kc.chm.o.energetics.calorimetry]
  - term: temperature change
    definition: "Temperature change (ΔT): final temperature minus initial temperature. A rise shows an exothermic
      reaction, a fall an endothermic one; it is used in Q = m x c x ΔT."
    kcs: [kc.chm.o.energetics.calorimetry]
  - term: titration
    definition: "Titration: adding a solution from a burette to a measured volume of another solution in a flask
      until an indicator shows the end point, to find a concentration or to prepare a soluble salt."
    kcs: ["kc.chm.o.acids.titration_calculations", "kc.chm.o.analysis.titration_technique", "kc.chm.o.acids.salt_preparation"]
  - term: titre
    definition: "Titre: the volume of solution added from the burette to reach the end point, final burette
      reading minus initial reading."
    kcs: ["kc.chm.o.acids.titration_calculations", "kc.chm.o.analysis.titration_technique"]
  - term: rough titre
    definition: "Rough titre: the titre from a first, quick titration that finds roughly where the end point is.
      It is not used when working out the mean titre."
    kcs: ["kc.chm.o.analysis.titration_technique"]
  - term: pure substance
    definition: "Pure substance: a single element or compound with nothing else mixed in. It has a sharp, fixed
      melting point and boiling point."
    kcs: [kc.chm.o.analysis.purity]
  - term: purity
    definition: "Purity: how free a substance is from other substances. It is judged by melting and boiling points
      and calculated as percentage purity."
    kcs: [kc.chm.o.analysis.purity, "kc.chm.o.stoichiometry.yield_and_purity"]
  - term: pure metal
    definition: "Pure metal: a metal with only one kind of atom, all the same size, in regular layers that slide
      easily. This is why a pure metal is softer than its alloys."
    kcs: [kc.chm.o.metals.alloys]
  - term: steel
    definition: "Steel: an alloy of iron with a small amount of carbon, harder and stronger than pure iron."
    kcs: [kc.chm.o.metals.alloys]
  - term: stainless steel
    definition: "Stainless steel: an alloy of iron with chromium and nickel that resists rusting, used for cutlery
      and cooking pans."
    kcs: [kc.chm.o.metals.alloys]
  - term: purification
    aliases: [purified]
    definition: "Purification of copper: electrolysis with impure copper as the anode, pure copper as the cathode
      and copper(II) sulfate solution. Copper dissolves from the anode and is deposited on the cathode."
    kcs: [kc.chm.o.electrolysis.applications]
  - term: reactant
    aliases: [reactants]
    definition: "Reactant: a substance that takes part in a reaction, written on the left of the equation."
    kcs: ["kc.chm.o.stoichiometry.balancing_equations", kc.chm.o.energetics.profiles]
  - term: product
    aliases: [products]
    definition: "Product: a substance formed in a reaction, written on the right of the equation."
    kcs: ["kc.chm.o.stoichiometry.balancing_equations", kc.chm.o.energetics.profiles]
  - term: symbol equation
    definition: "Symbol equation: an equation written with chemical formulae, balanced by changing only the
      numbers in front of formulae so each element has the same number of atoms on both sides."
    kcs: ["kc.chm.o.stoichiometry.balancing_equations"]
  - term: reaction pathway diagram
    definition: "Reaction pathway diagram: a graph of energy against progress of reaction showing reactants,
      products, the enthalpy change (ΔH) and the activation energy (Ea) as the hump."
    kcs: [kc.chm.o.energetics.profiles]
  - term: reactivity
    definition: "Reactivity: how readily a substance reacts. Group I metals get more reactive down the group
      because the outer electron is lost more easily."
    kcs: ["kc.chm.o.metals.reactivity_series", "kc.chm.o.periodic.group_i"]
  - term: reactivity series
    definition: "Reactivity series: metals listed from most to least reactive. A metal displaces a less reactive
      metal from its compounds; metals above carbon are extracted by electrolysis."
    kcs: ["kc.chm.o.metals.reactivity_series", kc.chm.o.metals.extraction]
  - term: reversible reaction
    aliases: [reversible]
    definition: "Reversible reaction: a reaction that can go both forwards and backwards, shown by a double arrow.
      In a closed system it reaches equilibrium."
    kcs: [kc.chm.o.reactions.equilibrium]
  - term: position of equilibrium
    definition: "Position of equilibrium: the relative amounts of reactants and products at equilibrium. When
      conditions change, it shifts in the direction that opposes the change."
    kcs: [kc.chm.o.reactions.equilibrium]
  - term: pressure
    definition: "Pressure (of a gas): caused by gas particles hitting the container walls. Raising it speeds up
      reactions of gases and shifts an equilibrium towards the side with fewer moles of gas."
    kcs: [kc.chm.o.reactions.equilibrium]
  - term: temperature
    definition: "Temperature: a measure of how hot a substance is. At a higher temperature particles have more
      kinetic energy, so they collide more often and more collisions have at least the activation energy."
    kcs: ["kc.chm.o.reactions.rate_factors", "kc.chm.o.reactions.collision_theory"]
  - term: surface area
    definition: "Surface area: the area of a solid exposed to the other reactant. Smaller pieces or powder have a
      larger surface area, giving more collisions per second and a faster rate."
    kcs: ["kc.chm.o.reactions.rate_factors"]
  - term: successful collision
    definition: "Successful collision: a collision between reactant particles with energy equal to or greater than
      the activation energy, so that a reaction happens."
    kcs: ["kc.chm.o.reactions.collision_theory", "kc.chm.o.reactions.rate_factors"]
  - term: residue
    definition: "Residue: the solid left behind in the filter paper after filtration. The liquid that passes
      through is the filtrate."
    kcs: [kc.chm.o.analysis.separation]
  - term: separation
    aliases: [separating]
    definition: "Separation: splitting a mixture into its components using a difference in their properties, for
      example by filtration, crystallisation, distillation or chromatography."
    kcs: [kc.chm.o.analysis.separation]
  - term: simple distillation
    definition: "Simple distillation: separating a solvent from a solution by boiling it and condensing the
      vapour, for example pure water from salt water. The solute stays in the flask."
    kcs: [kc.chm.o.analysis.separation]
  - term: Rf value
    definition: "Rf value: distance moved by a substance / distance moved by the solvent front, both measured from
      the base line. It is always less than one and identifies a substance under the same conditions."
    kcs: [kc.chm.o.analysis.chromatography]
  - term: solvent front
    definition: "Solvent front: the furthest point the solvent has reached up the chromatography paper, marked
      when the paper is taken out."
    kcs: [kc.chm.o.analysis.chromatography]
  - term: solute
    definition: "Solute: the substance that dissolves in a solvent to make a solution."
    kcs: ["kc.chm.o.stoichiometry.solution_concentration"]
  - term: solvent
    definition: "Solvent: the liquid in which a solute dissolves to make a solution, usually water."
    kcs: ["kc.chm.o.stoichiometry.solution_concentration", kc.chm.o.analysis.separation, kc.chm.o.analysis.chromatography]
  - term: solution
    definition: "Solution: a mixture formed when a solute dissolves in a solvent; an aqueous solution has water as
      the solvent."
    kcs: ["kc.chm.o.stoichiometry.solution_concentration"]
  - term: precipitate
    definition: "Precipitate: an insoluble solid that forms when two solutions are mixed and react."
    kcs: ["kc.chm.o.analysis.cation_tests", "kc.chm.o.analysis.anion_tests", "kc.chm.o.acids.salt_preparation"]
  - term: precipitation
    definition: "Precipitation: making an insoluble salt by mixing solutions of two soluble salts, then filtering,
      washing and drying the precipitate."
    kcs: ["kc.chm.o.acids.salt_preparation"]
  - term: rusting
    definition: "Rusting: the corrosion of iron and steel. It needs both water and oxygen and forms hydrated
      iron(III) oxide."
    kcs: [kc.chm.o.metals.corrosion]
  - term: sacrificial protection
    definition: "Sacrificial protection: attaching a more reactive metal such as zinc or magnesium to iron. The
      more reactive metal loses electrons and corrodes instead of the iron."
    kcs: [kc.chm.o.metals.corrosion]
  - term: saturated
    definition: "Saturated: a hydrocarbon with only single carbon-carbon bonds, such as an alkane. It does not
      decolourise bromine water."
    kcs: ["kc.chm.o.organic.alkanes_and_alkenes"]
  - term: unsaturated
    definition: "Unsaturated: a compound with at least one carbon-carbon double bond, such as an alkene. It
      decolourises bromine water (orange to colourless)."
    kcs: ["kc.chm.o.organic.alkanes_and_alkenes"]
  - term: substitution reaction
    definition: "Substitution reaction: a reaction in which one atom is replaced by another, such as an alkane
      reacting with chlorine in ultraviolet light, where a hydrogen atom is replaced by a chlorine atom."
    kcs: ["kc.chm.o.organic.alkanes_and_alkenes"]
  - term: sedimentation
    definition: "Sedimentation: a stage of water treatment in which water is left to stand so that heavy insoluble
      particles settle to the bottom."
    kcs: [kc.chm.o.environment.water]
  - term: water treatment
    definition: "Water treatment: making water safe to drink by sedimentation and filtration to remove solids,
      carbon to remove tastes and smells, and chlorination to kill microbes."
    kcs: [kc.chm.o.environment.water]
  - term: parts per million
    definition: "Parts per million (ppm): a unit for very low concentrations, the number of parts of a substance
      in every million parts of the mixture. Carbon dioxide in air is a little over four hundred ppm."
    kcs: [kc.chm.o.environment.climate]
  - term: silicon
    definition: "Silicon: a Group IV element, symbol Si. Its oxide, silicon(IV) oxide, is a giant covalent
      structure like diamond."
    kcs: ["kc.chm.o.atoms.giant_covalent"]
  - term: silicon(IV) oxide
    aliases: [silicon dioxide]
    definition: "Silicon(IV) oxide (silica, sand): a giant covalent structure in which each silicon atom bonds to
      four oxygen atoms and each oxygen to two silicon atoms. Very high melting point, hard, does not conduct."
    kcs: ["kc.chm.o.atoms.giant_covalent"]
  - term: silver nitrate
    definition: "Silver nitrate: the test for halide ions. Acidify with dilute nitric acid, then add aqueous
      silver nitrate: chloride gives a white precipitate, bromide cream, iodide yellow."
    kcs: ["kc.chm.o.analysis.anion_tests"]
  - term: sodium hydroxide
    definition: "Sodium hydroxide (NaOH): a strong alkali that neutralises acids to form sodium salts and water.
      In cation tests its solution gives coloured or white precipitates of metal hydroxides."
    kcs: ["kc.chm.o.acids.reactions_of_acids", "kc.chm.o.analysis.cation_tests", "kc.chm.o.acids.strong_and_weak"]
  - term: potassium hydroxide
    definition: "Potassium hydroxide (KOH): a strong alkali, completely ionised in water to give OH- ions. It
      neutralises acids to form potassium salts and water."
    kcs: ["kc.chm.o.acids.reactions_of_acids", "kc.chm.o.acids.strong_and_weak"]
  - term: potassium bromide
    definition: "Potassium bromide (KBr): a soluble salt. Chlorine displaces bromine from its solution, which
      turns orange; iodine does not react with it."
    kcs: ["kc.chm.o.periodic.group_vii"]
  - term: potassium chloride
    definition: "Potassium chloride (KCl): a soluble salt. Bromine and iodine do not react with it because
      chlorine is more reactive than both."
    kcs: ["kc.chm.o.periodic.group_vii"]
  - term: potassium iodide
    definition: "Potassium iodide (KI): a soluble salt and a reducing agent. Chlorine, bromine or other oxidising
      agents oxidise its iodide ions to iodine, turning the solution brown."
    kcs: ["kc.chm.o.periodic.group_vii", kc.chm.o.reactions.redox]
  - term: transition element
    aliases: [transition metal]
    definition: "Transition elements: the metals in the central block of the Periodic Table. Compared with Group I
      they have high densities and melting points, form coloured compounds, show variable oxidation states and act
      as catalysts."
    kcs: ["kc.chm.o.periodic.transition_elements"]
