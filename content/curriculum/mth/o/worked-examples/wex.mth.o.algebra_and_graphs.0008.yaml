  reason: Put the two numbers in the brackets
  check_id: chk_build_mth_alg_w0008_final
- n: 3
  latex: '\text{Check: the solutions of } x^2 + 2x - 8 = 0 \text{ are } x = -4, 2'
  reason: Each bracket equal to zero
  check_id: chk_build_mth_alg_w0008_roots
final_answer:
  latex: (x + 4)(x - 2)
  check_id: chk_build_mth_alg_w0008_final
