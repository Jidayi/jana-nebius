problem: The probability that Ama scores a goal is 0.7. The probability that Kofi scores a goal is 0.75. The two events are independent. Find the probability that at least one of them happens.
steps:
- n: 1
  latex: P(\text{neither}) = (1 - 0.7)(1 - 0.75) = 0.075
  reason: Both fail to happen
  check_id: chk_build_mth_prb_w0005_n
- n: 2
  latex: P(\text{at least one}) = 1 - 0.075 = 0.925
  reason: Everything except neither
  check_id: chk_build_mth_prb_w0005_ans
