id: wex.mth.o.statistics.0010
kc_ids:
- kc.mth.o.statistics.grouped_mean
problem: 'The times, t minutes, that students took to finish a task are grouped: 20 ≤ t < 30: 8; 30 ≤ t < 40: 12; 40 ≤ t < 50: 4; 50 ≤ t < 60: 13. Estimate the mean time. Give your answer to 3 significant figures.'
steps:
- n: 1
  latex: '\text{midpoints: } 25, 35, 45, 55'
  reason: Middle of each class
  check_id: chk_build_mth_sta_w0010_mids
- n: 2
  latex: \Sigma fx = 1515,\ \Sigma f = 37
  reason: Midpoint times frequency, added
  check_id: chk_build_mth_sta_w0010_t
- n: 3
  latex: \text{mean} \approx \frac{1515}{37} = 40.9
  reason: Divide by the total frequency
  check_id: chk_build_mth_sta_w0010_sc
final_answer:
  latex: 40.9\ \text{minutes}
  check_id: chk_build_mth_sta_w0010_ans
fading_order:
- 3
- 2
- 1
