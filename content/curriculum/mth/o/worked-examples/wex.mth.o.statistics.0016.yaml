problem: 'The masses (kg) of 55 parcels are summarised in a cumulative frequency table: none under 40; up to 50: 7; up to 60: 21; up to 70: 33; up to 80: 48; up to 90: 55. Estimate the median mass, to 3 significant figures, by interpolating within the class.'
steps:
- n: 1
  latex: \frac{55}{2} = 27.5
  reason: Position of the median
  check_id: chk_build_mth_sta_w0016_h
- n: 2
  latex: \text{class frequency} = 33 - 21 = 12
  reason: Parcels in the median class
  check_id: chk_build_mth_sta_w0016_f
- n: 3
  latex: \text{median} \approx 60 + \frac{27.5 - 21}{12} \times 10 = 65.4
  reason: Interpolate in the median class
  check_id: chk_build_mth_sta_w0016_ans
final_answer:
  latex: 65.4\ \text{kg}
  check_id: chk_build_mth_sta_w0016_ans
