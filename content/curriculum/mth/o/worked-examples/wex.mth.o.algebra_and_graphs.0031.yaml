  reason: Change minutes to hours
  check_id: chk_build_mth_alg_w0031_h
- n: 2
  latex: v = 6 \div 0.5 = 12\ \text{km/h}
  reason: Speed is distance over time
  check_id: chk_build_mth_alg_w0031_ans
final_answer:
  latex: 12\ \text{km/h}
  check_id: chk_build_mth_alg_w0031_ans
