problem: A line of best fit on a scatter diagram of mark (y) against hours of revision (x) passes through (10, 40) and (50, 70). Use the line to estimate the mark for 35 hours of revision.
steps:
- n: 1
  latex: m = \frac{70 - 40}{50 - 10} = 0.75
  reason: Gradient of the line
  check_id: chk_build_mth_sta_w0015_m
- n: 2
  latex: y = 40 + 0.75 \times (35 - 10) = 58.75
  reason: Move along the line from the first point
  check_id: chk_build_mth_sta_w0015_ans
final_answer:
  latex: '58.75'
  check_id: chk_build_mth_sta_w0015_ans
