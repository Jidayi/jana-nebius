problem: In a right-angled triangle, the side opposite angle θ is 9 cm and the side adjacent to it is 12 cm. Find θ, to 1 decimal place.
steps:
- n: 1
  latex: \tan \theta = \frac{9}{12} = 0.75
  reason: Opposite over adjacent
  check_id: chk_build_mth_trg_w0006_r
- n: 2
  latex: \theta = \tan^{-1}\left(\frac{9}{12}\right) = 36.9
  reason: Inverse tangent
  check_id: chk_build_mth_trg_w0006_ans
