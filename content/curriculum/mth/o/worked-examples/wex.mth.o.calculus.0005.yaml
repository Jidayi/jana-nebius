problem: A curve has equation $y = x^3 - 75x - 5$. Find the x-coordinate of its maximum point.
steps:
- n: 1
  latex: \frac{dy}{dx} = 3x^2 + 0x - 75
  reason: Differentiate
  check_id: chk_build_mth_cal_w0005_dd
- n: 2
  latex: \frac{dy}{dx} = 0 \Rightarrow x = -5 \text{ or } x = 5
  reason: Set the gradient equal to zero
  check_id: chk_build_mth_cal_w0005_sx
- n: 3
  latex: \frac{d^2y}{dx^2} = 6x
  reason: The second derivative decides the nature
  check_id: chk_build_mth_cal_w0005_d2
- n: 4
  latex: \text{maximum at } x = -5
  reason: 'Negative second derivative: maximum; positive: minimum'
  check_id: chk_build_mth_cal_w0005_d
final_answer:
  latex: '-5'
  check_id: chk_build_mth_cal_w0005_ans
