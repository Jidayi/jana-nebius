id: wex.mth.o.statistics.0011
kc_ids:
- kc.mth.o.statistics.grouped_mean
problem: 'The times, t minutes, that students took to finish a task are grouped: 10 ≤ t < 30: 8; 30 ≤ t < 50: 3; 50 ≤ t < 70: 11; 70 ≤ t < 90: 5. Estimate the mean time. Give your answer to 3 significant figures.'
steps:
- n: 1
  latex: '\text{midpoints: } 20, 40, 60, 80'
  reason: Middle of each class
  check_id: chk_build_mth_sta_w0011_mids
- n: 2
  latex: \Sigma fx = 1340,\ \Sigma f = 27
  reason: Midpoint times frequency, added
  check_id: chk_build_mth_sta_w0011_t
- n: 3
  latex: \text{mean} \approx \frac{1340}{27} = 49.6
  reason: Divide by the total frequency
  check_id: chk_build_mth_sta_w0011_sc
final_answer:
  latex: 49.6\ \text{minutes}
  check_id: chk_build_mth_sta_w0011_ans
fading_order:
- 3
- 2
- 1
