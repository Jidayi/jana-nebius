- n: 3
  latex: '\text{Check: the solutions of } x^2 - 3x - 40 = 0 \text{ are } x = -5, 8'
  reason: Each bracket equal to zero
  check_id: chk_build_mth_alg_w0007_roots
final_answer:
  latex: (x + 5)(x - 8)
  check_id: chk_build_mth_alg_w0007_final
