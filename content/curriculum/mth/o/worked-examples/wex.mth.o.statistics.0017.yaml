problem: 'The masses (kg) of 57 parcels are summarised in a cumulative frequency table: none under 0; up to 20: 14; up to 40: 26; up to 60: 36; up to 80: 45; up to 100: 57. Estimate the median mass, to 3 significant figures, by interpolating within the class.'
steps:
- n: 1
  latex: \frac{57}{2} = 28.5
  reason: Position of the median
  check_id: chk_build_mth_sta_w0017_h
- n: 2
  latex: \text{class frequency} = 36 - 26 = 10
  reason: Parcels in the median class
  check_id: chk_build_mth_sta_w0017_f
- n: 3
  latex: \text{median} \approx 40 + \frac{28.5 - 26}{10} \times 20 = 45.0
  reason: Interpolate in the median class
  check_id: chk_build_mth_sta_w0017_ans
final_answer:
  latex: 45.0\ \text{kg}
  check_id: chk_build_mth_sta_w0017_ans
fading_order:
- 3
- 2
- 1
