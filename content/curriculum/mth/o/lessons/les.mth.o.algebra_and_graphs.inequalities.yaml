title: Inequalities
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Treat the sign like an equals sign and see what you get.
  item_id: itm.mth.o.algebra_and_graphs.0178
  action: try_first
  why:
    en: You solved it just like an equation and found that x must be below a boundary. The largest whole number is the one just under it.
  names:
    en: 'That has a name: an inequality. Its solution is a whole range of numbers, not just one.'
- type: step
  text:
    en: Solve it as you would an equation. Then decide if the boundary itself is allowed.
  item_id: itm.mth.o.algebra_and_graphs.0188
  action: choose
  why:
    en: The sign is strict, so x cannot equal the boundary; take the whole number just below it. To remove a number term, do the opposite on both sides.
- type: step
  text:
    en: Same again, with less help this time.
  item_id: itm.mth.o.algebra_and_graphs.0181
  action: calculate
  why:
    en: Take away the number term, then divide by the number in front of x. The largest whole number sits just below the boundary.
- type: step
  text:
    en: 'Now x is squeezed between two limits. Before you work it out, predict: which end is left out, and which end is included?'
  item_id: itm.mth.o.algebra_and_graphs.0182
  action: predict
  why:
    en: Solve both parts at once, doing the same to all three sides. The strict sign leaves its end out, while the sign with a line under it lets its end in.
  names:
    en: An inequality with two limits like this is called a double inequality.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.algebra_and_graphs.0195
  action: choose
  why:
    en: Solve all three parts together, then count the whole numbers in the range. Check each end against the sign next to it.
- type: check
  item_ids:
