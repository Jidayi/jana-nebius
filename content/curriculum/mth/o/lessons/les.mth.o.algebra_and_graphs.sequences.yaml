title: Number sequences and the nth term
estimated_minutes: 12
blocks:
- type: step
  text:
    en: Try this before any rules. Look at how much the sequence goes up each time.
  item_id: itm.mth.o.algebra_and_graphs.0196
  action: try_first
  why:
    en: The sequence goes up by the same amount each time, so the rule starts with that many lots of n. The number added makes the first term come out right.
  names:
    en: 'That rule has a name: the nth term. The step up each time is the common difference.'
- type: step
  text:
    en: Find the nth term first, then put in the term number.
  item_id: itm.mth.o.algebra_and_graphs.0209
  action: choose
  why:
    en: The common difference goes in front of n, and the number added fixes the first term. Check your rule with n equal to one before you use it.
- type: step
  text:
    en: 'Now go the other way: you know a term and want its position. Write the nth term, then set it equal to that term.'
  item_id: itm.mth.o.algebra_and_graphs.0201
  action: calculate
  why:
    en: Setting the nth term equal to the value gives an equation. Solve it to find n.
- type: step
  text:
    en: 'Before you work it out, predict: do the gaps between these terms stay the same, or grow?'
  item_id: itm.mth.o.algebra_and_graphs.0221
  action: predict
  why:
    en: The gaps grow by the same amount each time. Add that amount to the last gap, then add the new gap to the last term.
  names:
    en: A sequence whose gaps grow steadily is called quadratic. The change in the gaps is the second difference.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.algebra_and_graphs.0216
  action: calculate
  why:
    en: Find the first differences, then the second difference. The number in front of n squared is half the second difference.
- type: check
  item_ids:
