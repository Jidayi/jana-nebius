id: les.mth.o.geometry.circle_theorems_ii
node_id: cur.mth.o.geometry.circle_theorems_ii
kc_ids:
- kc.mth.o.geometry.circle_theorems_cyclic
title: 'Angles in circles: cyclic quadrilaterals and segments'
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Angles ABC and ADC face each other across the circle.
  item_id: itm.mth.o.geometry.0186
  action: try_first
  why:
    en: Opposite angles of a quadrilateral drawn in a circle add to 180°, so take the given angle from 180°.
  names:
    en: 'This is a circle theorem: opposite angles of a cyclic quadrilateral add to 180°.'
- type: step
  text:
    en: 'Use the same fact: opposite angles share a half turn.'
  item_id: itm.mth.o.geometry.0185
  action: calculate
  why:
    en: Angle ADC sits opposite angle ABC, so the two add to 180°.
- type: step
  text:
    en: 'Choose with care: only one total links opposite angles.'
  item_id: itm.mth.o.geometry.0195
  action: choose
  why:
    en: All four angles make a full turn, but each opposite pair makes 180°. Treating them as equal, or using a quarter turn, are the usual slips.
- type: step
  text:
    en: 'A new fact now: C and D are on the same side of the chord AB. Before you work it out, predict: are the angles at C and D equal, or do they add up to something?'
  item_id: itm.mth.o.geometry.0187
  action: predict
  why:
    en: Angles standing on the same chord, on the same side of it, are equal.
  names:
    en: These are called angles in the same segment.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.geometry.0198
  action: choose
  why:
    en: C and D sit on the same side of the chord, so the two angles are equal. Making them add to a half turn belongs to cyclic quadrilaterals, not here.
- type: check
  item_ids:
  - itm.mth.o.geometry.0188
  - itm.mth.o.geometry.0189
  - itm.mth.o.geometry.0197
