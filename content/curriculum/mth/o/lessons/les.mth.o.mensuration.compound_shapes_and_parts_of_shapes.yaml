id: les.mth.o.mensuration.compound_shapes_and_parts_of_shapes
node_id: cur.mth.o.mensuration.compound_shapes_and_parts_of_shapes
kc_ids:
- kc.mth.o.mensuration.compound_shapes
title: Compound shapes and parts of shapes
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Picture the whole rectangle, then the corner that is missing.
  item_id: itm.mth.o.mensuration.0092
  action: try_first
  why:
    en: Find the area of the whole rectangle, then subtract the corner piece that was cut away.
  names:
    en: A shape built from simpler ones is a compound shape.
- type: step
  text:
    en: 'Same plan: the whole shape, then take away the cut-out.'
  item_id: itm.mth.o.mensuration.0104
  action: choose
  why:
    en: Subtract the cut-out from the whole rectangle. Adding it, or forgetting it, are the usual slips.
- type: step
  text:
    en: Here the two parts are added. The top side is the diameter of the semicircle, so halve it for the radius.
  item_id: itm.mth.o.mensuration.0093
  action: calculate
  why:
    en: Add the rectangle to half a circle whose radius is half the width.
- type: step
  text:
    en: 'Before you work it out, predict: can you subtract the radii first, or must you subtract whole areas?'
  item_id: itm.mth.o.mensuration.0103
  action: predict
  why:
    en: The ring is the big disc with the small disc removed, so find both areas and subtract. Subtracting the radii first gives far too little.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.mensuration.0105
  action: choose
  why:
    en: Add the rectangle and a semicircle of radius half the width. A full circle, or the diameter as the radius, gives too much.
- type: check
  item_ids:
  - itm.mth.o.mensuration.0095
  - itm.mth.o.mensuration.0091
  - itm.mth.o.mensuration.0102
