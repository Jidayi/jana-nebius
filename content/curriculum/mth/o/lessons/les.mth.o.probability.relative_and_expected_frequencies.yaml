id: les.mth.o.probability.relative_and_expected_frequencies
node_id: cur.mth.o.probability.relative_and_expected_frequencies
kc_ids:
- kc.mth.o.probability.expected_frequency
title: Relative and expected frequency
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Think about what the probability tells you about each single try.
  item_id: itm.mth.o.probability.0020
  action: try_first
  why:
    en: The probability is the share of tries you expect to succeed. Multiplying it by the number of trials gives how many times you expect it.
  names:
    en: That number is the expected frequency. It is a best estimate, not a promise.
- type: step
  text:
    en: Pick the expected number of plants. Use the probability of the event you are counting.
  item_id: itm.mth.o.probability.0026
  action: choose
  why:
    en: Multiply the number of trials by the probability that the seed grows. Dividing, or using the chance that it does not grow, are the usual slips.
- type: step
  text:
    en: 'Now go the other way: you have results, not a probability. How often did it land point up, out of all the drops?'
  item_id: itm.mth.o.probability.0017
  action: calculate
  why:
    en: Divide the number of times it landed point up by the number of drops.
  names:
    en: That fraction is the relative frequency. It estimates the probability.
- type: step
  text:
    en: 'Before you work it out, predict: can a relative frequency ever be bigger than one?'
  item_id: itm.mth.o.probability.0027
  action: predict
  why:
    en: Times it happened over number of trials can never be more than one. Dividing the other way, or by the times it failed, gives a wrong answer.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.probability.0024
  action: calculate
  why:
    en: 'Multiply the probability by the number of trials: 0.35 times 120 is 42.'
- type: check
  item_ids:
  - itm.mth.o.probability.0028
  - itm.mth.o.probability.0021
  - itm.mth.o.probability.0029
