title: Surds
estimated_minutes: 12
blocks:
- type: step
  text:
    en: Try this before any rules. Look for a square number that divides into 12.
  item_id: itm.mth.o.number.0372
  action: try_first
  why:
    en: 12 is 4 × 3, and the square root of 4 is 2, so √12 = 2√3.
  names:
    en: A root left in exact form like this is called a surd. Taking out a square factor simplifies it.
- type: step
  text:
    en: Simplify each surd first, then add the ones with the same root.
  item_id: itm.mth.o.number.0384
  action: choose
  why:
    en: √32 is 4√2 and √18 is 3√2, so together they make 7√2. Adding the numbers under the roots, or forgetting to root the square factor, are the usual slips.
- type: step
  text:
    en: Same idea with a different root. Split off the largest square factor of each.
  item_id: itm.mth.o.number.0373
  action: calculate
  why:
    en: √75 is 5√3 and √48 is 4√3, so k = 5 + 4 = 9.
- type: step
  text:
    en: 'Before you work it out, predict: what does √2 × √2 make?'
  item_id: itm.mth.o.number.0385
  action: predict
  why:
    en: 'Multiply top and bottom by √2: the bottom becomes 2, so 12√2 over 2 is 6√2. Multiplying only the top and leaving the bottom alone is the usual slip.'
  names:
    en: Clearing the root from the bottom of a fraction is called rationalising the denominator.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.number.0378
  action: calculate
  why:
    en: Multiplying top and bottom by √7 gives 63√7 over 7, which is 9√7.
- type: check
  item_ids:
