id: les.mth.o.coordinate_geometry.drawing_linear_graphs
node_id: cur.mth.o.coordinate_geometry.drawing_linear_graphs
kc_ids:
- kc.mth.o.coordinate_geometry.axis_intercepts
title: Where lines cross the axes
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Think about what every point on the x-axis has in common.
  item_id: itm.mth.o.coordinate_geometry.0016
  action: try_first
  why:
    en: Every point on the x-axis has y = 0, so you set y to zero. The y term vanished and you solved for x.
  names:
    en: 'That crossing point has a name: the x-intercept. Where a line crosses the y-axis is its y-intercept.'
- type: step
  text:
    en: Now find where a line crosses the y-axis. Which letter is zero on that axis?
  item_id: itm.mth.o.coordinate_geometry.0018
  action: calculate
  why:
    en: Every point on the y-axis has x = 0, so the x term drops out. Then you solve what is left for y.
- type: step
  text:
    en: Pick where this line crosses the x-axis. Take care over which letter you set to zero.
  item_id: itm.mth.o.coordinate_geometry.0026
  action: choose
  why:
    en: On the x-axis y is zero, so the y term vanishes and you solve for x. Setting x to zero instead finds the other intercept, a common mix-up.
- type: step
  text:
    en: This equation starts with y on its own. The same idea works here.
  item_id: itm.mth.o.coordinate_geometry.0019
  action: calculate
  why:
    en: Set y to zero, move the constant to the other side, then divide by the number in front of x. The answer is negative because the constant moves across with its sign changed.
- type: step
  text:
    en: 'Before you work it out, predict: will this line cross the x-axis to the left or the right of the y-axis?'
  item_id: itm.mth.o.coordinate_geometry.0029
  action: predict
  why:
    en: Both numbers in the equation are positive, so x must be negative to make y zero. Giving the constant itself, or dropping the minus sign, are the usual slips.
- type: check
  item_ids:
  - itm.mth.o.coordinate_geometry.0021
  - itm.mth.o.coordinate_geometry.0027
  - itm.mth.o.coordinate_geometry.0022
