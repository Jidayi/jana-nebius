id: les.mth.o.transformations_and_vectors.transformations
node_id: cur.mth.o.transformations_and_vectors.transformations
kc_ids:
- kc.mth.o.transformations_and_vectors.transform_points
- kc.mth.o.transformations_and_vectors.enlargement
title: Translations, reflections, rotations and enlargements
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Think about what scale factor 2 does to every length.
  item_id: itm.mth.o.transformations_and_vectors.0020
  action: try_first
  why:
    en: Every length in the image is the old length times the scale factor. So the side doubles.
  names:
    en: Making a shape bigger by the same factor in every direction is called an enlargement.
- type: step
  text:
    en: 'Now go the other way: you know both lengths. Compare the new length with the old one.'
  item_id: itm.mth.o.transformations_and_vectors.0027
  action: choose
  why:
    en: Divide an image length by the matching original length to get the scale factor. Using the difference, or dividing the wrong way round, are the usual slips.
- type: step
  text:
    en: Now move a point. The top number of the vector moves it across; the bottom number moves it up.
  item_id: itm.mth.o.transformations_and_vectors.0005
  action: calculate
  why:
    en: 'Add the bottom number to the y-coordinate: -2 add 3 is 1.'
  names:
    en: Sliding a point by a vector like this is called a translation.
- type: step
  text:
    en: 'Before you work it out, predict: which coordinate changes when you reflect in the line y = 4?'
  item_id: itm.mth.o.transformations_and_vectors.0013
  action: predict
  why:
    en: The line y = 4 runs across, so only y changes, and the image is as far beyond the line as the point is before it. Stopping on the mirror line is the usual slip.
- type: step
  text:
    en: 'Now one on your own: an area this time.'
  item_id: itm.mth.o.transformations_and_vectors.0018
  action: calculate
  why:
    en: Areas grow by the square of the scale factor, which is 9 here. So the new area is 15 times 9.
- type: check
  item_ids:
  - itm.mth.o.transformations_and_vectors.0003
  - itm.mth.o.transformations_and_vectors.0028
  - itm.mth.o.transformations_and_vectors.0011
