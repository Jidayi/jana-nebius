- kc.mth.o.trigonometry.cosine_rule
- kc.mth.o.trigonometry.triangle_area_sine
title: 'Any triangle: sine rule, cosine rule and area'
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Half the base times the height still works, and the angle helps you find the height.
  item_id: itm.mth.o.trigonometry.0092
  action: try_first
  why:
    en: Take one side as the base; the height is then the other side multiplied by sin of the angle. So the area is half the product of the two sides and the sine of the included angle.
  names:
    en: That is the area formula, a half ab sin C. It needs two sides and the angle between them.
- type: step
  text:
    en: Use the same formula here. Check your calculator is set to degrees.
  item_id: itm.mth.o.trigonometry.0102
  action: choose
  why:
    en: Multiply a half by both sides and by the sine of the angle. Leaving out the half doubles the answer, and radians mode gives a wrong sine.
- type: step
  text:
    en: Now a missing side. Each side pairs with the angle opposite it, and side over sine is the same for every pair.
  item_id: itm.mth.o.trigonometry.0062
  action: calculate
  why:
    en: Side b over sin B equals side a over sin A. Multiply both sides by sin B to get b on its own.
  names:
    en: This is called the sine rule.
- type: step
  text:
    en: 'Before you work it out, predict: you know two sides and the angle between them, so can the sine rule help?'
  item_id: itm.mth.o.trigonometry.0089
  action: predict
  why:
    en: No known side is paired with its opposite angle, so you need a new rule. Work out 2bc cos A first, take it away from b squared plus c squared, then take the square root.
  names:
    en: That is the cosine rule. Forgetting the square root, or adding the last term, are the usual slips.
- type: step
  text:
    en: 'Now one on your own: an angle from three sides.'
  item_id: itm.mth.o.trigonometry.0081
  action: calculate
  why:
    en: Rearranged, the cosine rule gives cos A as b squared plus c squared minus a squared, all over 2bc. Inverse cosine then gives the angle.
- type: check
  item_ids:
  - itm.mth.o.trigonometry.0072
  - itm.mth.o.trigonometry.0082
  - itm.mth.o.trigonometry.0097
