id: les.mth.o.geometry.similarity
node_id: cur.mth.o.geometry.similarity
kc_ids:
- kc.mth.o.geometry.similar_lengths
- kc.mth.o.geometry.similar_area_volume
title: Similar shapes
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Compare the two matching sides you know first.
  item_id: itm.mth.o.geometry.0066
  action: try_first
  why:
    en: Side DE is twice side AB, so every side of Q is twice the matching side of P.
  names:
    en: 'That multiplier is the scale factor: the new length divided by the old length.'
- type: step
  text:
    en: Find the scale factor first, then multiply the matching side by it.
  item_id: itm.mth.o.geometry.0077
  action: choose
  why:
    en: Each side of Q is the scale factor times the matching side of P. Adding the difference, or dividing by the factor, are the usual slips.
- type: step
  text:
    en: The scale factor need not be a whole number. Divide the matching sides to find it.
  item_id: itm.mth.o.geometry.0071
  action: calculate
  why:
    en: DE divided by AB gives the scale factor, so multiply BC by it to get EF.
- type: step
  text:
    en: 'Now areas. Before you work it out, predict: does the area grow by the scale factor, or by more?'
  item_id: itm.mth.o.geometry.0093
  action: predict
  why:
    en: Area has two dimensions, so the area factor is the scale factor squared. Using the plain scale factor gives too small an area.
  names:
    en: The scale factor squared is called the area factor.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.geometry.0090
  action: choose
  why:
    en: Volume has three dimensions, so the volume factor is the scale factor cubed. Squaring it instead is the usual slip.
- type: check
  item_ids:
  - itm.mth.o.geometry.0072
  - itm.mth.o.geometry.0083
  - itm.mth.o.geometry.0084
