blocks:
- type: prior_knowledge
  item_ids:
  - itm.mth.o.number.0085
  - itm.mth.o.number.0070
- type: idea
  text:
    en: A probability is a number from zero to one. When outcomes are equally likely, the probability of an event is the number of outcomes in the event divided by the total number of outcomes. The probability that something does not happen is one minus the probability that it does. For two independent events, multiply along the branches of a tree diagram to find the probability that both happen, and add the results of different paths that lead to the same outcome.
- type: worked_example
  worked_example_id: wex.mth.o.probability.0001
- type: guided_step
  item_id: itm.mth.o.probability.0001
- type: quick_check
  item_ids:
  - itm.mth.o.probability.0011
  - itm.mth.o.probability.0041
- type: common_mistakes
  text:
    en: Multiply for 'and' along a path, add for 'or' between paths, and make the probabilities of all outcomes add to one.
  misconception_ids:
  - mc.mth.o.and_as_add
  - mc.mth.o.at_least_one_added
  - mc.mth.o.complement_not_taken
  - mc.mth.o.complement_of_both
- type: exit_check
  item_ids:
  - itm.mth.o.probability.0002
  - itm.mth.o.probability.0031
- type: summary
  text:
    en: Probability is favourable outcomes over all outcomes. Use one minus for 'not', multiply along branches and add across paths.
