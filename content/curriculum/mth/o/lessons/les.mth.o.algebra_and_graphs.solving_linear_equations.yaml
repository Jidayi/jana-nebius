- type: idea
  text:
    en: 'An equation is a balance: both sides have the same value. To find the unknown, undo what has been done to it, in reverse order, and do exactly the same to both sides each time. If x was multiplied and then had a number added, subtract the number first and then divide. When a problem is in words, give the unknown a letter, write each sentence as algebra, and then solve the equation you have made. Check your answer by putting it back into the original equation or the words.'
