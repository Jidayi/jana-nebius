title: Fractions, decimals and percentages
estimated_minutes: 12
blocks:
- type: step
  text:
    en: Try this before any rules. Think of sharing one whole into equal parts.
  item_id: itm.mth.o.number.0085
  action: try_first
  why:
    en: 'A fraction is a division: the top divided by the bottom. Sharing one whole into four parts gives 0.25 each.'
  names:
    en: The same amount can be a fraction, a decimal or a percentage. They are three ways to write one number.
- type: step
  text:
    en: Per cent means out of a hundred. So to turn a decimal into a percentage, multiply by a hundred.
  item_id: itm.mth.o.number.0088
  action: calculate
  why:
    en: Multiplying by 100 moves each digit two places, so 0.35 becomes 35%.
- type: step
  text:
    en: Go from a fraction to a percentage. Change it to a decimal first.
  item_id: itm.mth.o.number.0098
  action: choose
  why:
    en: Divide to get a decimal, then multiply by 100 to get the percentage. Moving the point only one place is the usual slip.
- type: step
  text:
    en: 'Before you work it out, predict: can the sum be smaller than the first fraction? Then find a denominator both fit into.'
  item_id: itm.mth.o.number.0078
  action: predict
  why:
    en: Write both fractions in twelfths, then add only the tops. Adding tops and bottoms gives an answer smaller than the first fraction, which cannot be right.
  names:
    en: A bottom number that both fractions share is called a common denominator.
- type: step
  text:
    en: 'Now one on your own: this time a division.'
  item_id: itm.mth.o.number.0080
  action: choose
  why:
    en: Keep the first fraction, change the sign to multiply, and flip only the second fraction. Flipping the first one, or not flipping at all, are the usual slips.
- type: check
  item_ids:
