title: Rates and compound measures
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. How many grams are there in each cubic centimetre?
  item_id: itm.mth.o.number.0250
  action: try_first
  why:
    en: Sharing the 54 g across 20 cm³ gives 2.7 g in each cubic centimetre.
  names:
    en: 'That has a name: density, the mass per unit volume. It is mass divided by volume.'
- type: step
  text:
    en: 'Same idea again: mass on top, volume underneath.'
  item_id: itm.mth.o.number.0253
  action: calculate
  why:
    en: Density is mass divided by volume, so 270 ÷ 15 = 18 g/cm³.
- type: step
  text:
    en: Speed is distance per hour, but this time is in minutes. Change it into hours first.
  item_id: itm.mth.o.number.0265
  action: choose
  why:
    en: 24 minutes is 24/60 of an hour, so the speed is 12 ÷ 24/60 = 30 km/h. Using the minutes as hours, or dividing the wrong way, are the usual slips.
- type: step
  text:
    en: 'Before you work it out, predict: will the price per kilogram be more or less than the price of the bag?'
  item_id: itm.mth.o.number.0252
  action: predict
  why:
    en: 'A kilogram is more than the bag holds, so its price is higher. Find the price of one gram, 2.4 ÷ 400, then scale up to a kilogram: $6.00.'
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.number.0254
  action: calculate
  why:
    en: 45 minutes is 45/60 of an hour, and 12 ÷ 45/60 = 16 km/h.
- type: check
  item_ids:
  - itm.mth.o.number.0261
  - itm.mth.o.number.0258
