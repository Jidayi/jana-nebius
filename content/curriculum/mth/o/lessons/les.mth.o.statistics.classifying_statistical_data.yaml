id: les.mth.o.statistics.classifying_statistical_data
node_id: cur.mth.o.statistics.classifying_statistical_data
kc_ids:
- kc.mth.o.statistics.data_types
title: Kinds of data
estimated_minutes: 9
blocks:
- type: step
  text:
    en: Try this before any rules. Think about how you would get each number.
  item_id: itm.mth.o.statistics.0002
  action: try_first
  why:
    en: You find the number of brothers and sisters by counting, so the data is numbers. A count jumps in whole steps, since nobody has half a sister.
  names:
    en: Data given as numbers is called quantitative; data given in words, like colours, is qualitative. Data you count, in whole steps, is called discrete.
- type: step
  text:
    en: 'Now ask the key question: was this counted or measured?'
  item_id: itm.mth.o.statistics.0020
  action: choose
  why:
    en: 'A time is measured, so it can be any value within a range. Calling it discrete swaps the two kinds: counted is discrete, measured is not.'
  names:
    en: Measured data, which can take any value in a range, is called continuous.
- type: step
  text:
    en: 'Before you choose, predict: can a team score a number of goals halfway between two whole numbers?'
  item_id: itm.mth.o.statistics.0022
  action: predict
  why:
    en: Goals are counted, so the data jumps in whole steps and is discrete. Data is not continuous just because it is numerical; only measured data can take any value.
- type: step
  text:
    en: 'Sort each kind of data first: words, counts or measures. Watch out for numbers that are only labels.'
  item_id: itm.mth.o.statistics.0006
  action: calculate
  why:
    en: Only the mass of the rice and the run time are measured, so only they are continuous. Shirt numbers are just names, so that data is qualitative.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.statistics.0012
  action: calculate
  why:
    en: The run time and the noon temperature are measured, so they are continuous. Pages are counted, shoe sizes come in set steps, and shirt numbers are labels.
- type: check
  item_ids:
  - itm.mth.o.statistics.0008
  - itm.mth.o.statistics.0015
  - itm.mth.o.statistics.0010
