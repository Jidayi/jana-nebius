title: Gradients of curves
estimated_minutes: 12
blocks:
- type: prior_knowledge
  item_ids:
  - itm.mth.o.algebra_and_graphs.0092
  - itm.mth.o.algebra_and_graphs.0140
- type: idea
  text:
    en: The gradient of a curve changes from point to point. Differentiation gives a formula for the gradient at any point. For a power of x, multiply by the power and then reduce the power by one; a number on its own has a gradient of zero, so it disappears. Substitute an x-value into the derivative to get the gradient there. Where the gradient is zero the curve has a stationary point, a maximum or a minimum, and the second derivative tells you which.
- type: worked_example
  worked_example_id: wex.mth.o.calculus.0001
- type: guided_step
  item_id: itm.mth.o.calculus.0001
- type: quick_check
  item_ids:
  - itm.mth.o.calculus.0011
  - itm.mth.o.calculus.0041
- type: common_mistakes
  text:
    en: Multiply by the power before you reduce it, and set the derivative, not the curve, equal to zero for stationary points.
  misconception_ids:
  - mc.mth.o.derivative_power_not_brought_down
  - mc.mth.o.derivative_power_not_reduced
  - mc.mth.o.gradient_from_y
  - mc.mth.o.max_min_confused
- type: exit_check
  item_ids:
  - itm.mth.o.calculus.0002
  - itm.mth.o.calculus.0031
- type: summary
  text:
    en: Bring the power down and reduce it by one. The derivative gives the gradient; where it is zero the curve turns.
