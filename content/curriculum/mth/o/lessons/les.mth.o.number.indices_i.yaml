id: les.mth.o.number.indices_i
node_id: cur.mth.o.number.indices_i
kc_ids:
- kc.mth.o.number.index_laws_numeric
title: Powers with zero, negative and fractional indices
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Think about what happens each time the power goes down by one.
  item_id: itm.mth.o.number.0132
  action: try_first
  why:
    en: Each step down in the power divides by the base. Dropping to a power of zero leaves 1, not nothing.
  names:
    en: 'This is the zero index rule: any number except zero to the power zero is 1.'
- type: step
  text:
    en: Keep going down past zero. One more step divides by the base again.
  item_id: itm.mth.o.number.0139
  action: calculate
  why:
    en: Going one step below zero gives one over the base, which is 0.2 as a decimal.
  names:
    en: A negative index means one over the positive power, called the reciprocal.
- type: step
  text:
    en: Use the same idea with a bigger negative power.
  item_id: itm.mth.o.number.0144
  action: choose
  why:
    en: Find the positive power first, then take one over it. A negative index makes a small number, not a negative one.
- type: step
  text:
    en: 'Before you work it out, predict: does a power of a half mean halving the number?'
  item_id: itm.mth.o.number.0138
  action: predict
  why:
    en: The answer times itself must give back the base, so a power of a half is the square root. Halving would give a far bigger answer.
  names:
    en: 'A fractional index means a root: the bottom of the fraction tells you which root.'
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.number.0141
  action: choose
  why:
    en: Take the cube root, then one over it, because the index is negative. Dividing by the bottom of the fraction is the usual slip.
- type: check
  item_ids:
