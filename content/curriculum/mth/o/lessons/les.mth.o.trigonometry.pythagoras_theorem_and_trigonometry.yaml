id: les.mth.o.trigonometry.pythagoras_theorem_and_trigonometry
node_id: cur.mth.o.trigonometry.pythagoras_theorem_and_trigonometry
kc_ids:
- kc.mth.o.trigonometry.three_d
title: Lengths and angles in three dimensions
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. The diagonal goes across the base and up at the same time.
  item_id: itm.mth.o.trigonometry.0108
  action: try_first
  why:
    en: Pythagoras in the base gives the base diagonal. That diagonal and the height make a second right-angled triangle, and its hypotenuse is the answer.
  names:
    en: A line from a bottom corner to the opposite top corner is called a space diagonal.
- type: step
  text:
    en: Find a space diagonal again. Use two right-angled triangles, one after the other.
  item_id: itm.mth.o.trigonometry.0117
  action: choose
  why:
    en: The base diagonal squared is 41; add the height squared and take the square root. Stopping at the base diagonal, or forgetting the root, are the usual slips.
- type: step
  text:
    en: 'Two steps of Pythagoras again: the base first, then the height.'
  item_id: itm.mth.o.trigonometry.0110
  action: calculate
  why:
    en: The base diagonal squared is 89. Adding 4 squared and taking the square root gives 10.2 cm.
- type: step
  text:
    en: 'Before you work it out, predict: which side of the upright triangle lies along the base, an edge or the base diagonal?'
  item_id: itm.mth.o.trigonometry.0118
  action: predict
  why:
    en: The angle with the base sits in an upright triangle whose bottom side is the base diagonal. So the angle is inverse tan of the height over the base diagonal, not over an edge.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.trigonometry.0109
  action: calculate
  why:
    en: The base diagonal is 6.708 cm. Inverse tan of 5 over 6.708 gives the angle, 36.7 degrees.
- type: check
  item_ids:
  - itm.mth.o.trigonometry.0113
  - itm.mth.o.trigonometry.0119
  - itm.mth.o.trigonometry.0116
