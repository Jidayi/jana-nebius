id: les.mth.o.statistics.cumulative_frequency_diagrams
node_id: cur.mth.o.statistics.cumulative_frequency_diagrams
kc_ids:
- kc.mth.o.statistics.cumulative_frequency
title: Cumulative frequency
estimated_minutes: 12
blocks:
- type: step
  text:
    en: Try this before any rules. Find the class that holds the middle parcel, then ask how far into that class it sits.
  item_id: itm.mth.o.statistics.0116
  action: try_first
  why:
    en: The middle parcel is number 33, and the running totals put it in the class from 40 to 50 kg. It sits part way through that class, so the median is a little more than 40.
  names:
    en: Running totals like these are called cumulative frequency. Going part way into a class in step with the count is called interpolation.
- type: step
  text:
    en: 'Use the same steps: half the total, then the class, then part way in.'
  item_id: itm.mth.o.statistics.0126
  action: choose
  why:
    en: Half the total tells you which parcel to look for; the median is that parcel's mass, not its place in the line. The middle of the class is too rough, so go part way in by the right fraction.
- type: step
  text:
    en: Find the class that holds the middle parcel, then interpolate.
  item_id: itm.mth.o.statistics.0120
  action: calculate
  why:
    en: Take the running total before the class away from the median position, and divide by the parcels in the class. Scale that fraction by the class width and add it to the start of the class.
- type: step
  text:
    en: 'Now measure spread. Read the masses a quarter and three quarters of the way through the parcels. Before you work it out, predict: will the gap between them be smaller than the larger of the two?'
  item_id: itm.mth.o.statistics.0125
  action: predict
  why:
    en: Subtract the lower quartile from the upper quartile to get the spread, so it is smaller than the upper one. Giving the upper quartile alone, or the largest mass, are the usual slips.
  names:
    en: Those two readings are the lower and upper quartiles, and the gap between them is the interquartile range.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.statistics.0119
  action: calculate
  why:
    en: Interpolate to find the lower and upper quartiles. Then subtract the lower quartile from the upper one.
- type: check
  item_ids:
  - itm.mth.o.statistics.0121
  - itm.mth.o.statistics.0128
  - itm.mth.o.statistics.0118
