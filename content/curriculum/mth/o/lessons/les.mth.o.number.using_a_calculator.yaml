id: les.mth.o.number.using_a_calculator
node_id: cur.mth.o.number.using_a_calculator
kc_ids:
- kc.mth.o.number.rounding
title: Calculator use and rounding
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Keep just one digit after the decimal point.
  item_id: itm.mth.o.number.0305
  action: try_first
  why:
    en: The digit after the one you keep is small, so nothing rounds up and you get 32.5.
  names:
    en: 'That has a name: rounding to decimal places. Always look at the next digit before you cut.'
- type: step
  text:
    en: Significant figures count from the first non-zero digit, not from the decimal point.
  item_id: itm.mth.o.number.0309
  action: choose
  why:
    en: Keep the first two figures and look at the next digit, which is big enough to round up to 14. Giving 13.77 rounds to decimal places; 13 cuts off without rounding.
  names:
    en: Rounding to significant figures keeps a set number of digits, counted from the first non-zero one.
- type: step
  text:
    en: The zeros at the start of a small decimal only hold the place. Start counting at the first non-zero digit.
  item_id: itm.mth.o.number.0298
  action: calculate
  why:
    en: The leading zeros are not significant, so the figures you keep start at the first non-zero digit. The digit after them is small, so nothing rounds up.
- type: step
  text:
    en: 'Before you work it out, predict: should the rounded answer still be about the size of the first number?'
  item_id: itm.mth.o.number.0299
  action: predict
  why:
    en: 'A rounded number keeps its size, so zeros fill the places after the kept figures: 45678 becomes 46000.'
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.number.0310
  action: choose
  why:
    en: Count from the first non-zero digit, then the next digit rounds the last kept figure up to 0.00074. Cutting off without rounding gives 0.00073.
- type: check
  item_ids:
  - itm.mth.o.number.0296
  - itm.mth.o.number.0303
  - itm.mth.o.number.0307
