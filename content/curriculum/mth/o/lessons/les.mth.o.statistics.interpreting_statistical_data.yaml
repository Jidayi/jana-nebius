id: les.mth.o.statistics.interpreting_statistical_data
node_id: cur.mth.o.statistics.interpreting_statistical_data
kc_ids:
- kc.mth.o.statistics.read_tables
title: Reading tables and charts
estimated_minutes: 8
blocks:
- type: step
  text:
    en: Try this before any rules. Work it out any way you like.
  item_id: itm.mth.o.statistics.0023
  action: try_first
  why:
    en: The boys' total counts every boy, however they travel. Take away the boys you already know about, and the ones left are the walkers.
  names:
    en: A table that sorts people two ways at once, here by boy or girl and by how they travel, is called a two-way table.
- type: step
  text:
    en: The same idea finds any gap. Use the line of the table where only one entry is missing.
  item_id: itm.mth.o.statistics.0033
  action: choose
  why:
    en: The boys' total is the sum of the boys' entries, so subtract the known ones from it. Adding them on, or using a girls' number, are the usual slips.
- type: step
  text:
    en: 'Before you work it out, predict: should the missing number be bigger or smaller than the boys'' total?'
  item_id: itm.mth.o.statistics.0035
  action: predict
  why:
    en: 'Each entry is part of the total, so it must be smaller: take the other boys away from the total. An answer bigger than the total means you added instead.'
- type: step
  text:
    en: This time the bus number is missing. Keep to the boys' own row.
  item_id: itm.mth.o.statistics.0027
  action: calculate
  why:
    en: Add the boys who walk and the boys who go by car. Take that from the boys' total to leave the bus users.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.statistics.0032
  action: calculate
  why:
    en: The boys who take the bus or a car are known, so subtract them from the boys' total. What is left is the number who walk.
- type: check
  item_ids:
  - itm.mth.o.statistics.0025
  - itm.mth.o.statistics.0036
  - itm.mth.o.statistics.0029
