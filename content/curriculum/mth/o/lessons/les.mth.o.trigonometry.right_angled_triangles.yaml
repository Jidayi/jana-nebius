- type: idea
  text:
    en: 'In a right-angled triangle the longest side, the hypotenuse, is opposite the right angle. Pythagoras'' theorem says the square on the hypotenuse equals the sum of the squares on the other two sides. Sine, cosine and tangent link an angle to the ratio of two sides: label the sides opposite, adjacent and hypotenuse from the angle you are using, choose the ratio that has the side you know and the side you want, then rearrange.'
