title: Expanding and factorising
estimated_minutes: 14
blocks:
- type: step
  text:
    en: Try this before any rules. Each term in the first bracket must meet each term in the second.
  item_id: itm.mth.o.algebra_and_graphs.0024
  action: try_first
  why:
    en: 'There are four products: x times x, the two x terms, and the two numbers multiplied. Then you add the two x terms together.'
  names:
    en: 'That has a name: expanding the brackets. A grid with one bracket on each side shows all four products.'
- type: step
  text:
    en: Both brackets hold a minus sign now. Watch the signs as you multiply.
  item_id: itm.mth.o.algebra_and_graphs.0029
  action: choose
  why:
    en: Minus times minus is plus, so the last term is plus and the middle term is minus. Do not add the two numbers or drop the middle terms.
- type: step
  text:
    en: Now go backwards. Find the largest number and letter that divide both terms, and take them outside a bracket.
  item_id: itm.mth.o.algebra_and_graphs.0903
  action: calculate
  why:
    en: The highest common factor of both terms goes outside, and each term is divided by it. Expand your answer to check it.
  names:
    en: Putting the brackets back in is called factorising. It undoes expanding.
- type: step
  text:
    en: This one has no x term. Look for two perfect squares with a minus sign between them.
  item_id: itm.mth.o.algebra_and_graphs.0044
  action: choose
  why:
    en: The brackets hold the square root of the number, with one plus and one minus sign. With the same sign twice, a middle term would appear.
  names:
    en: An expression like this is called a difference of two squares.
- type: step
  text:
    en: 'Before you work it out, predict: will the two numbers in the brackets have the same sign or different signs?'
  item_id: itm.mth.o.algebra_and_graphs.0057
  action: predict
  why:
    en: The number term is negative, so the two numbers have different signs; they multiply to the last term and add to the middle coefficient. Expand your brackets to check the sign of the middle term.
- type: step
  text:
    en: Now make t the subject. Undo what was done to t, in reverse order.
  item_id: itm.mth.o.algebra_and_graphs.0062
  action: choose
  why:
    en: First take u from both sides, then divide both sides by a. Moving a term without changing its sign, or dividing first, are the usual slips.
  names:
    en: Getting a letter on its own on one side is called changing the subject.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.algebra_and_graphs.0071
  action: calculate
  why:
    en: Take c from both sides, then divide by m, and put the numbers in at the end.
- type: check
