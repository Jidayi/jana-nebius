title: Very large and very small numbers in standard form
estimated_minutes: 12
blocks:
- type: step
  text:
    en: Try this before any rules. Multiplying by ten moves every digit one place to the left.
  item_id: itm.mth.o.number.0149
  action: try_first
  why:
    en: The power of ten tells you how many places the decimal point moves to the right. Here it moves 3 places.
  names:
    en: A number between one and ten times a power of ten is in standard form.
- type: step
  text:
    en: Now go the other way. Move the point until the first number is between one and ten, and count the places.
  item_id: itm.mth.o.number.0146
  action: calculate
  why:
    en: The point moves six places to give 2.4, and the number is large, so the power is positive.
- type: step
  text:
    en: A small number this time. Count places moved, not zeros.
  item_id: itm.mth.o.number.0156
  action: choose
  why:
    en: The point moves to the right to make a number between one and ten, so the power is negative. Counting only the zeros gives the wrong size of power.
- type: step
  text:
    en: 'Before you work it out, predict: after you multiply the first numbers, will the result still be less than ten?'
  item_id: itm.mth.o.number.0160
  action: predict
  why:
    en: Multiply the first numbers and add the powers. The product is 24, which is too big, so move the point once and add one to the power.
- type: step
  text:
    en: 'Now one on your own: this time a division.'
  item_id: itm.mth.o.number.0174
  action: choose
  why:
    en: Divide the first numbers and subtract the powers. Adding the powers when you divide is the usual slip.
- type: check
  item_ids:
  - itm.mth.o.number.0145
  - itm.mth.o.number.0171
  - itm.mth.o.number.0166
