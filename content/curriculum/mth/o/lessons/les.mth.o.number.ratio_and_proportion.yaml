title: Ratio and proportion
estimated_minutes: 12
blocks:
- type: step
  text:
    en: Try this before any rules. Think about how many equal parts the money is split into.
  item_id: itm.mth.o.number.0221
  action: try_first
  why:
    en: The ratio makes 2 + 3 = 5 equal parts, each worth $25, and Sipho gets 2 of them.
  names:
    en: 'That has a name: sharing in a ratio. First find the value of one part.'
- type: step
  text:
    en: Share in the same way. Find one part first, then count the parts for the right person.
  item_id: itm.mth.o.number.0231
  action: choose
  why:
    en: Fatima has 3 parts, so you multiply one part by 3. Splitting the money in half, stopping at one part, or giving Obi's share are the usual slips.
- type: step
  text:
    en: Three people this time. The method does not change.
  item_id: itm.mth.o.number.0220
  action: calculate
  why:
    en: There are 12 parts, each worth $15, and Ade has the last 5 of them.
- type: step
  text:
    en: 'A new idea: find the cost of one mango first, then scale up.'
  item_id: itm.mth.o.number.0235
  action: calculate
  why:
    en: One mango costs $0.85, and multiplying by 7 gives $5.95.
  names:
    en: Finding the value for one first is called the unitary method.
- type: step
  text:
    en: 'Now one on your own. Before you work it out, predict: will fewer workers take more days or fewer?'
  item_id: itm.mth.o.number.0249
  action: predict
  why:
    en: 'Fewer workers need more days: the job is 60 worker-days, shared between 3 workers. Treating it like the mango price gives too few days.'
  names:
    en: When one quantity halves as the other doubles, they are in inverse proportion.
- type: check
  item_ids:
  - itm.mth.o.number.0234
  - itm.mth.o.number.0247
  - itm.mth.o.number.0237
