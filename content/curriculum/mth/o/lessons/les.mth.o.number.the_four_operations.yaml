id: les.mth.o.number.the_four_operations
node_id: cur.mth.o.number.the_four_operations
kc_ids:
- kc.mth.o.number.order_of_operations
title: Calculating in the right order, with negatives
estimated_minutes: 9
blocks:
- type: step
  text:
    en: Try this before any rules. Which part would you work out first?
  item_id: itm.mth.o.number.0115
  action: try_first
  why:
    en: Multiplying comes before adding, so work out the product first and then add.
  names:
    en: The agreed order is brackets, then powers, then multiply and divide, then add and subtract. It is called the order of operations.
- type: step
  text:
    en: 'Use the same order: the multiplication goes first.'
  item_id: itm.mth.o.number.0126
  action: choose
  why:
    en: Working straight from left to right adds first and gives a much bigger answer. Multiply first, then add.
- type: step
  text:
    en: Here there is a power. Powers come before adding and subtracting.
  item_id: itm.mth.o.number.0128
  action: choose
  why:
    en: Square first, then add and subtract from left to right. A square means the number times itself, not times two.
- type: step
  text:
    en: 'Before you work it out, predict: will the answer be bigger or smaller than the first number?'
  item_id: itm.mth.o.number.0118
  action: predict
  why:
    en: The product is negative, and taking away a negative is the same as adding. So the answer is bigger than 5.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.number.0124
  action: calculate
  why:
    en: The bracket gives a negative number first, then multiply, then subtract.
- type: check
  item_ids:
  - itm.mth.o.number.0121
  - itm.mth.o.number.0122
  - itm.mth.o.number.0127
