id: les.mth.o.number.sets
node_id: cur.mth.o.number.sets
kc_ids:
- kc.mth.o.number.venn_counting
title: Sets and Venn diagrams
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Some students are counted in both groups, so think about who to leave out.
  item_id: itm.mth.o.number.0041
  action: try_first
  why:
    en: The students who take both are inside the art count too. Taking them away leaves those who take art only.
  names:
    en: Two overlapping circles that show this are called a Venn diagram. The middle part, in both sets, is the intersection.
- type: step
  text:
    en: 'Before you work it out, predict: is the number in at least one set just the two counts added together?'
  item_id: itm.mth.o.number.0040
  action: predict
  why:
    en: Adding the two counts counts the overlap twice, once in each set. Subtract the overlap once to fix it.
  names:
    en: Everything in at least one of the two sets is called the union.
- type: step
  text:
    en: Find the union again, with care over the middle part.
  item_id: itm.mth.o.number.0051
  action: choose
  why:
    en: Shade one circle, then the other, and the middle gets shaded twice, so take it away once. Adding the two counts with no change is the usual slip.
- type: step
  text:
    en: Now find who is outside both circles. Start from the union.
  item_id: itm.mth.o.number.0042
  action: calculate
  why:
    en: Work out the union first, then take it from the class total. What is left is outside both circles.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.number.0053
  action: choose
  why:
    en: Find the union first, then subtract it from the total. Taking both set counts straight off the total removes the overlap twice.
- type: check
  item_ids:
  - itm.mth.o.number.0046
  - itm.mth.o.number.0048
