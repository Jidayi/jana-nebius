id: les.mth.o.geometry.symmetry
node_id: cur.mth.o.geometry.symmetry
kc_ids:
- kc.mth.o.geometry.symmetry
title: Symmetry
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Picture folding the shape so one half lands exactly on the other.
  item_id: itm.mth.o.geometry.0097
  action: try_first
  why:
    en: A rectangle folds onto itself across its middle, both ways. A fold along a diagonal does not match.
  names:
    en: Each fold line that works is a line of symmetry.
- type: step
  text:
    en: 'Before you work it out, predict: will a fold along a diagonal work for this shape?'
  item_id: itm.mth.o.geometry.0099
  action: predict
  why:
    en: Fold a parallelogram along a diagonal and the halves do not match. No other fold works either.
- type: step
  text:
    en: Now turn the shape instead of folding it. Count how often it looks the same in one full turn.
  item_id: itm.mth.o.geometry.0096
  action: calculate
  why:
    en: A rectangle looks the same after a half turn and again after a full turn.
  names:
    en: That count is the order of rotational symmetry.
- type: step
  text:
    en: In a regular shape all sides and angles are equal. Count the positions where it fits.
  item_id: itm.mth.o.geometry.0107
  action: choose
  why:
    en: A regular polygon fits onto itself once for each side. Every shape fits at least once in a full turn, so the order is never zero.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.geometry.0095
  action: calculate
  why:
    en: 'Count the sides of a regular polygon: that count equals its lines of symmetry, some through corners and some through the midpoints of sides. Counting only lines through corners gives half the right number.'
- type: check
  item_ids:
  - itm.mth.o.geometry.0104
  - itm.mth.o.geometry.0103
  - itm.mth.o.geometry.0108
