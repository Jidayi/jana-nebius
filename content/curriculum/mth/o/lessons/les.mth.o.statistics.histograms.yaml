title: Histograms
estimated_minutes: 9
blocks:
- type: step
  text:
    en: Try this before any rules. Share the frequency out evenly across the width of the class.
  item_id: itm.mth.o.statistics.0130
  action: try_first
  why:
    en: The class runs from 20 to 40, so it is 20 wide. Sharing the frequency over that width tells you how many fall in each unit.
  names:
    en: 'That is called the frequency density: frequency divided by class width. It gives the height of the bar in a histogram.'
- type: step
  text:
    en: Find the class width first, from the two ends of the class.
  item_id: itm.mth.o.statistics.0144
  action: choose
  why:
    en: The width is the upper end minus the lower end, and the density is the frequency divided by that width. Multiplying instead, or using the wrong width, are the usual slips.
- type: step
  text:
    en: 'Same steps: the width, then the frequency over the width.'
  item_id: itm.mth.o.statistics.0137
  action: calculate
  why:
    en: The class starts at 0, so its width is just its upper end. Divide the frequency by that width.
- type: step
  text:
    en: 'Now go backwards: you know the height of the bar. Before you work it out, predict: does the height alone tell you the frequency?'
  item_id: itm.mth.o.statistics.0143
  action: predict
  why:
    en: In a histogram the area of a bar shows the frequency, so multiply the density by the class width. Reading the height alone ignores the width.
  names:
    en: 'This is the key idea of a histogram: area, not height, shows frequency.'
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.statistics.0138
  action: calculate
  why:
    en: Multiply the frequency density by the class width. That is the area of the bar, which is the frequency.
- type: check
  item_ids:
  - itm.mth.o.statistics.0131
  - itm.mth.o.statistics.0135
  - itm.mth.o.statistics.0146
