id: les.mth.o.mensuration.units_of_measure
node_id: cur.mth.o.mensuration.units_of_measure
kc_ids:
- kc.mth.o.mensuration.metric_units
title: Metric units of measure
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Use what you know about litres and cubic centimetres.
  item_id: itm.mth.o.mensuration.0002
  action: try_first
  why:
    en: One litre is 1000 cm³, so divide by 1000 to change to the larger unit.
  names:
    en: This is a unit conversion. Going to a larger unit, the number gets smaller.
- type: step
  text:
    en: 'Go one step at a time: kilometres to metres, then metres to centimetres.'
  item_id: itm.mth.o.mensuration.0004
  action: calculate
  why:
    en: Metres are smaller than kilometres, and centimetres are smaller again. Going to smaller units, the number gets bigger at each step.
- type: step
  text:
    en: 'Before you work it out, predict: does a square metre hold just 100 square centimetres, or more?'
  item_id: itm.mth.o.mensuration.0001
  action: predict
  why:
    en: A square metre is 100 cm by 100 cm, so it holds 10000 cm². Multiply the area by that.
- type: step
  text:
    en: Area units grow in both directions at once.
  item_id: itm.mth.o.mensuration.0013
  action: choose
  why:
    en: Each metre is 100 cm both ways, so multiply by 10000. Multiplying by just 100, as for a length, is the usual slip.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.mensuration.0015
  action: choose
  why:
    en: A cubic metre is 100 cm long, wide and high, so it holds 1000000 cm³. Using the factor for a length or an area gives too small an answer.
- type: check
  item_ids:
  - itm.mth.o.mensuration.0012
  - itm.mth.o.mensuration.0003
  - itm.mth.o.mensuration.0005
