title: Perpendicular lines
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'Try this before any rules. Picture the line turned through a right angle: does it now go up or down?'
  item_id: itm.mth.o.coordinate_geometry.0121
  action: try_first
  why:
    en: A line at right angles to a rising line must fall, and its slope is flipped over. That makes the two gradients multiply to give -1.
  names:
    en: Lines that meet at right angles are perpendicular. The flipped gradient with its sign changed is the negative reciprocal.
- type: step
  text:
    en: This time the gradient is negative. Flip it over and change its sign.
  item_id: itm.mth.o.coordinate_geometry.0125
  action: calculate
  why:
    en: 'Flipping -0.5 gives -2, and changing the sign gives 2. Check: -0.5 times 2 is -1.'
- type: step
  text:
    en: Now a full equation. Find the new gradient first, then put the point in to find c.
  item_id: itm.mth.o.coordinate_geometry.0131
  action: choose
  why:
    en: The new gradient is 0.5, so c is 1 take away 2. Changing only the sign, or only flipping, gives a line that is not at right angles.
- type: step
  text:
    en: 'Before you work it out, predict: will the new line go up or down from left to right?'
  item_id: itm.mth.o.coordinate_geometry.0132
  action: predict
  why:
    en: Line L goes up, so the perpendicular line goes down, with gradient -0.5. Then -0.5 times 6 is -3, so c is 0.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.coordinate_geometry.0129
  action: calculate
  why:
    en: The new gradient is -4, and -4 times -2 is 8. So c is -3 take away 8, which is -11.
- type: check
  item_ids:
  - itm.mth.o.coordinate_geometry.0126
  - itm.mth.o.coordinate_geometry.0127
  - itm.mth.o.coordinate_geometry.0134
