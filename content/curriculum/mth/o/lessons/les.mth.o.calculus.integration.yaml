id: les.mth.o.calculus.integration
node_id: cur.mth.o.calculus.integration
kc_ids:
- kc.mth.o.calculus.definite_integrals
title: Definite integrals and areas
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Integrating undoes differentiating; then use the two numbers on the sign.
  item_id: itm.mth.o.calculus.0049
  action: try_first
  why:
    en: You integrated each term to get F(x). Then you worked out F at the top number take away F at the bottom number.
  names:
    en: This is a definite integral. The two numbers on the sign are its limits.
- type: step
  text:
    en: Pick the value. Raise each power by one and divide by the new power.
  item_id: itm.mth.o.calculus.0060
  action: choose
  why:
    en: So 3x squared becomes x cubed and 3 becomes 3x, giving F(2) = 14 and F(1) = 4. Differentiating instead, or not dividing by the new power, are the usual slips.
- type: step
  text:
    en: Now integrate each term yourself. Keep a bracket round the negative limit.
  item_id: itm.mth.o.calculus.0052
  action: calculate
  why:
    en: F(x) is 2x cubed plus 2x squared plus x. F(3) is 75 and F(-1) is -1, so the answer is 76.
- type: step
  text:
    en: 'Before you work it out, predict: which limit comes first in the subtraction, the top or the bottom?'
  item_id: itm.mth.o.calculus.0057
  action: predict
  why:
    en: 'Work out F at the top limit take away F at the bottom limit: 30 take away 6. The other way round gives the right size with the wrong sign.'
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.calculus.0053
  action: calculate
  why:
    en: F(2) is -4 and F(-2) is 20. So the answer is -4 take away 20, which is -24.
- type: check
  item_ids:
  - itm.mth.o.calculus.0047
  - itm.mth.o.calculus.0056
  - itm.mth.o.calculus.0059
