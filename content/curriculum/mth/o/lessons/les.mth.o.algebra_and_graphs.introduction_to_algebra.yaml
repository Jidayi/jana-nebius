title: 'Letters for numbers: expressions and substitution'
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Put the numbers in place of the letters and work it out.
  item_id: itm.mth.o.algebra_and_graphs.0009
  action: try_first
  why:
    en: You swapped each letter for its number, worked out the bracket first, then multiplied. The half takes half of the whole result.
  names:
    en: 'That has a name: substitution. A formula tells you what to do; the numbers tell you what to do it to.'
- type: step
  text:
    en: This time the value of x is negative. Put it in a bracket, with its sign, before you start.
  item_id: itm.mth.o.algebra_and_graphs.0001
  action: calculate
  why:
    en: The bracket keeps the minus sign with the number, so the square comes out positive and the middle term negative. Then add the three terms.
- type: step
  text:
    en: Find the square first, then multiply by the number in front.
  item_id: itm.mth.o.algebra_and_graphs.0013
  action: choose
  why:
    en: The power belongs only to x, so square x before you multiply. A negative number squared is positive, and dropping the minus sign changes the middle term.
- type: step
  text:
    en: 'Before you work it out, predict: does the half multiply the mass, the speed, or both?'
  item_id: itm.mth.o.algebra_and_graphs.0015
  action: predict
  why:
    en: The half multiplies everything after it, and only the speed is squared. Leaving out the half, or the square, are the usual slips.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.algebra_and_graphs.0003
  action: calculate
  why:
    en: Work out each term on its own, then add them. Only t is squared in the second term, and the half applies to the whole term.
  names:
    en: An expression with an equals sign that links quantities, like this one, is called a formula.
- type: check
  item_ids:
