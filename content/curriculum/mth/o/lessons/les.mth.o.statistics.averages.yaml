title: Averages and spread
estimated_minutes: 12
blocks:
- type: prior_knowledge
  item_ids:
  - itm.mth.o.number.0115
- type: idea
  text:
    en: 'An average is one value that represents a whole set of data. The mean shares the total equally: add the values and divide by how many there are. The median is the middle value once the data are in order. The mode is the value that appears most often. The range, the largest value minus the smallest, measures how spread out the data are. In a frequency table, multiply each value by its frequency to find the total, and divide by the total frequency.'
- type: worked_example
  worked_example_id: wex.mth.o.statistics.0006
- type: guided_step
  item_id: itm.mth.o.statistics.0038
- type: quick_check
  item_ids:
  - itm.mth.o.statistics.0048
  - itm.mth.o.statistics.0063
- type: common_mistakes
  text:
    en: Put the data in order before finding a median, and divide by the total frequency, not by the number of rows.
  misconception_ids:
  - mc.mth.o.frequency_ignored
  - mc.mth.o.frequency_mean_rows
  - mc.mth.o.mean_wrong_count
  - mc.mth.o.median_not_ordered
- type: exit_check
  item_ids:
  - itm.mth.o.statistics.0039
  - itm.mth.o.statistics.0053
- type: summary
  text:
    en: Mean is total over count, median is the middle of the ordered data, mode is the most common value, range is the spread.
