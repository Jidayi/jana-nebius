id: les.mth.o.statistics.scatter_diagrams
node_id: cur.mth.o.statistics.scatter_diagrams
kc_ids:
- kc.mth.o.statistics.scatter_correlation
title: Scatter diagrams and correlation
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'Try this before any rules. Picture the points: as one quantity goes up, what does the other do?'
  item_id: itm.mth.o.statistics.0107
  action: try_first
  why:
    en: As revision hours go up, marks tend to go up too, so the points rise from left to right. It is a trend, not a promise about every student.
  names:
    en: When both quantities tend to rise together, that is called positive correlation.
- type: step
  text:
    en: 'Read the sentence with care: which way does each quantity move?'
  item_id: itm.mth.o.statistics.0110
  action: choose
  why:
    en: As the height goes up, the temperature tends to go down. A downward trend is still a link, so this is not no correlation.
  names:
    en: When one quantity tends to fall as the other rises, that is called negative correlation.
- type: step
  text:
    en: A line of best fit lets you estimate. Find how much the mark rises for each extra hour, then move along the line from one of its points.
  item_id: itm.mth.o.statistics.0100
  action: calculate
  why:
    en: The line rises by 1 mark for each hour, which is its gradient. Moving along from the first point to the given hours gives the estimate.
- type: step
  text:
    en: 'Before you work it out, predict: should the estimate lie between the marks of the two points on the line?'
  item_id: itm.mth.o.statistics.0113
  action: predict
  why:
    en: The gradient is the change in mark divided by the change in hours, and the hours belong on the x-axis. Dividing the other way, or using the hours as the mark, are the usual slips.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.statistics.0109
  action: calculate
  why:
    en: Find the gradient from the two points. Then move along the line from the first point to the given number of hours.
- type: check
  item_ids:
  - itm.mth.o.statistics.0102
  - itm.mth.o.statistics.0103
  - itm.mth.o.statistics.0114
