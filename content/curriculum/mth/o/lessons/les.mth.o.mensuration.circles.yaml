title: Circumference and area of a circle
estimated_minutes: 12
blocks:
- type: prior_knowledge
  item_ids:
  - itm.mth.o.mensuration.0016
- type: idea
  text:
    en: 'Every circle has the same shape, so its measurements follow fixed rules using the number π. The circumference, the distance round the edge, is π times the diameter. The area is π times the radius squared. Read carefully whether you are given the radius or the diameter: the radius is half the diameter. An arc is part of the circumference and a sector is part of the area; each is the fraction of the full turn that its angle makes at the centre.'
- type: worked_example
  worked_example_id: wex.mth.o.mensuration.0005
- type: guided_step
  item_id: itm.mth.o.mensuration.0031
- type: quick_check
  item_ids:
  - itm.mth.o.mensuration.0041
  - itm.mth.o.mensuration.0056
- type: common_mistakes
  text:
    en: Square only the radius when you find an area, and halve a diameter before you use a radius formula.
  misconception_ids:
  - mc.mth.o.circumference_area_confused
  - mc.mth.o.diameter_for_radius
  - mc.mth.o.radius_not_squared
  - mc.mth.o.sector_fraction_180
- type: exit_check
  item_ids:
  - itm.mth.o.mensuration.0032
  - itm.mth.o.mensuration.0046
- type: summary
  text:
    en: Circumference is π times the diameter, area is π times the radius squared, and arcs and sectors are fractions of these.
