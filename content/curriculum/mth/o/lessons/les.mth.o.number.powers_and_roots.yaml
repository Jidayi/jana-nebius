id: les.mth.o.number.powers_and_roots
node_id: cur.mth.o.number.powers_and_roots
kc_ids:
- kc.mth.o.number.powers_and_roots
title: Squares, cubes and roots
estimated_minutes: 9
blocks:
- type: step
  text:
    en: Try this before any rules. Which number, times itself, gives the number under the sign?
  item_id: itm.mth.o.number.0060
  action: try_first
  why:
    en: You looked for a number that multiplies by itself to give the one under the sign.
  names:
    en: That number is the square root. Multiplying a number by itself is squaring it.
- type: step
  text:
    en: This time you need three equal factors, not two. Which number, used three times, multiplies to give it?
  item_id: itm.mth.o.number.0061
  action: calculate
  why:
    en: Three equal factors of 4 multiply to give 64, so 4 is the answer.
  names:
    en: This is the cube root. Multiplying a number by itself three times is cubing it.
- type: step
  text:
    en: Square a decimal. Think in tenths.
  item_id: itm.mth.o.number.0065
  action: choose
  why:
    en: Tenths times tenths give hundredths, so the answer has two decimal places. Doubling the number, or keeping one decimal place, are the usual slips.
- type: step
  text:
    en: 'Before you work it out, predict: will the answer be positive or negative?'
  item_id: itm.mth.o.number.0067
  action: predict
  why:
    en: Two negatives make a positive, and the third one makes it negative again. So the cube of a negative is negative.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.number.0068
  action: choose
  why:
    en: The answer times itself must give the number under the sign, so check by squaring it. Halving the number is not the same as taking its root.
- type: check
  item_ids:
