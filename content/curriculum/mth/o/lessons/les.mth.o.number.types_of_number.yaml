id: les.mth.o.number.types_of_number
node_id: cur.mth.o.number.types_of_number
kc_ids:
- kc.mth.o.number.prime_factors
- kc.mth.o.number.hcf_lcm
title: Factors, multiples and primes
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Split the number into smaller factors, and keep going until nothing more will split.
  item_id: itm.mth.o.number.0001
  action: try_first
  why:
    en: Dividing by 2 again and again, then by 3, breaks the number into factors that cannot be split. Two of those factors are 2s.
  names:
    en: A number that will not split is a prime. A number written as primes times each other is its prime factorisation.
- type: step
  text:
    en: Break the number down into primes, then count the factors of one prime only.
  item_id: itm.mth.o.number.0012
  action: choose
  why:
    en: The index counts how many 2s are multiplied, not their value, and the 3 has its own index. Stopping at a factor that is not prime, such as 4, gives too few.
- type: step
  text:
    en: 'Before you work it out, predict: can the highest common factor be bigger than the smaller number? Then find it from the primes the two numbers share.'
  item_id: itm.mth.o.number.0017
  action: predict
  why:
    en: The HCF must divide both numbers, so it can never be bigger than the smaller one. Take each shared prime to its lower power.
  names:
    en: The biggest number that divides both is the highest common factor, or HCF.
- type: step
  text:
    en: 'Now the other way round: the smallest number that both of them divide into.'
  item_id: itm.mth.o.number.0038
  action: choose
  why:
    en: Take every prime once, at its higher power, to get the lowest common multiple. Multiplying the two numbers gives a common multiple, but not the lowest one.
  names:
    en: This is the lowest common multiple, or LCM.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.number.0020
  action: calculate
  why:
    en: Take the top power of 2 and the top power of 3 from the two numbers. Multiply them to get the LCM.
- type: check
  item_ids:
  - itm.mth.o.number.0013
  - itm.mth.o.number.0023
  - itm.mth.o.number.0027
