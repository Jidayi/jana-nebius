title: Index laws with letters
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Write out the xs if it helps, then count what is left.
  item_id: itm.mth.o.algebra_and_graphs.0098
  action: try_first
  why:
    en: Multiplying put the xs together, so the powers added. Dividing cancelled some of them, so the power went down.
  names:
    en: 'That has a name: the laws of indices. Multiply means add the indices; divide means subtract them.'
- type: step
  text:
    en: Multiply first. Then divide.
  item_id: itm.mth.o.algebra_and_graphs.0102
  action: choose
  why:
    en: Add the indices to multiply, then subtract to divide. Multiplying or dividing the indices themselves are the usual slips.
- type: step
  text:
    en: Now a power of a power. Think of the bracket written out several times.
  item_id: itm.mth.o.algebra_and_graphs.0101
  action: calculate
  why:
    en: The bracket is multiplied by itself, so the index is added again and again. That is the same as multiplying the two indices.
- type: step
  text:
    en: 'Before you work it out, predict: does the power apply to the number in front as well as to x?'
  item_id: itm.mth.o.algebra_and_graphs.0099
  action: predict
  why:
    en: The power applies to everything in the bracket, so the number is raised to the power too. Multiplying the number by the power is the usual slip.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.algebra_and_graphs.0093
  action: calculate
  why:
    en: Raise the number to the power, and multiply the indices of x. Here you only need the number in front.
- type: check
  item_ids:
  - itm.mth.o.algebra_and_graphs.0103
  - itm.mth.o.algebra_and_graphs.0100
