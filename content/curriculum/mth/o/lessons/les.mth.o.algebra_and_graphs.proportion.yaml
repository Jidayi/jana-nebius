id: les.mth.o.algebra_and_graphs.proportion
node_id: cur.mth.o.algebra_and_graphs.proportion
kc_ids:
- kc.mth.o.algebra_and_graphs.variation
title: Direct and inverse variation
estimated_minutes: 12
blocks:
- type: step
  text:
    en: Try this before any rules. Use the pair of values you are given to find how y and x squared are linked.
  item_id: itm.mth.o.algebra_and_graphs.0230
  action: try_first
  why:
    en: Dividing y by x squared gave a fixed number, so y is always that many lots of x squared. You then used that number for the new x.
  names:
    en: 'That has a name: direct proportion. The fixed number that links them is the constant of proportion, k.'
- type: step
  text:
    en: This time y goes with the square root of x. Write the rule with k first.
  item_id: itm.mth.o.algebra_and_graphs.0240
  action: choose
  why:
    en: Write y as k times the square root of x, then use the first pair to find k. Leaving out the square root, or skipping k, are the usual slips.
- type: step
  text:
    en: Now y is inversely proportional to x, so the rule is y equals k divided by x.
  item_id: itm.mth.o.algebra_and_graphs.0231
  action: calculate
  why:
    en: Multiply the first pair to find k, since k is y times x. Then divide k by the new x.
  names:
    en: When one quantity goes up as the other goes down like this, it is called inverse proportion.
- type: step
  text:
    en: 'Before you work it out, predict: as x gets bigger here, will y get bigger or smaller?'
  item_id: itm.mth.o.algebra_and_graphs.0241
  action: predict
  why:
    en: Inverse means y gets smaller as x grows, so the answer must be below the first y. Write the rule with x squared on the bottom, find k, then use it.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.algebra_and_graphs.0229
  action: calculate
  why:
    en: Write the rule with x cubed, find k from the first pair, then put in the new x.
- type: check
  item_ids:
