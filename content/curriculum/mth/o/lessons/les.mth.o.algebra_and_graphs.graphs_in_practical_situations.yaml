title: Travel graphs and other real-life graphs
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. How far does the walker go, and how long does it take?
  item_id: itm.mth.o.algebra_and_graphs.0243
  action: try_first
  why:
    en: You found the change in distance and the change in time between the two points, then divided. A steeper line would mean a faster walker.
  names:
    en: 'That has a name: the gradient of a distance-time graph. It gives the speed.'
- type: step
  text:
    en: The time is in minutes but the speed is in km/h. Change the time first.
  item_id: itm.mth.o.algebra_and_graphs.0250
  action: calculate
  why:
    en: Divide the minutes by 60 to get hours. Then divide the distance by the time.
- type: step
  text:
    en: 'This is a speed-time graph. Before you work it out, predict: will you use the slope of the line or the area under it?'
  item_id: itm.mth.o.algebra_and_graphs.0247
  action: predict
  why:
    en: On a speed-time graph the area under the line gives the distance. Here the shape is a triangle, so take half of base times height.
- type: step
  text:
    en: Now the line starts above zero, so the shape under it is a trapezium.
  item_id: itm.mth.o.algebra_and_graphs.0252
  action: choose
  why:
    en: Add the two speeds, halve, then multiply by the time. Using the slope, or leaving out the half, are the usual slips.
  names:
    en: 'The slope of a speed-time graph has its own name: the acceleration.'
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.algebra_and_graphs.0255
  action: choose
  why:
    en: The area under the line is a trapezium, so it is half the sum of the two speeds times the time.
- type: check
