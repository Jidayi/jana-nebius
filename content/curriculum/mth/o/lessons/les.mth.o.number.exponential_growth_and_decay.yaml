id: les.mth.o.number.exponential_growth_and_decay
node_id: cur.mth.o.number.exponential_growth_and_decay
kc_ids:
- kc.mth.o.number.compound_growth
title: Compound interest, growth and decay
estimated_minutes: 12
blocks:
- type: step
  text:
    en: Try this before any rules. Work out the first year, then use that new total for the second year.
  item_id: itm.mth.o.number.0358
  action: try_first
  why:
    en: 'Each year the money grows by 5%, so it is multiplied by 1.05 each time: 5000 × 1.05 × 1.05 = 5512.50.'
  names:
    en: 'That is compound interest: each year''s interest is worked out on the new total.'
- type: step
  text:
    en: Use the yearly multiplier, once for each year.
  item_id: itm.mth.o.number.0367
  action: choose
  why:
    en: The multiplier is 1.04, raised to the power 4 for the 4 years. Adding the same interest each year, or multiplying the multiplier by 4, are the usual slips.
- type: step
  text:
    en: A loss works the same way, with a multiplier smaller than 1.
  item_id: itm.mth.o.number.0359
  action: calculate
  why:
    en: Losing 3% each year gives the multiplier 0.97, used once for each of the 2 years.
  names:
    en: Shrinking by the same percentage each period is called exponential decay.
- type: step
  text:
    en: 'Before you work it out, predict: does the value fall by the same amount each year?'
  item_id: itm.mth.o.number.0368
  action: predict
  why:
    en: 'No: the second year loses 8% of a smaller value, so it loses less. Using 0.92 for each year gives 4232.00, a little more than taking the same loss twice.'
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.number.0361
  action: calculate
  why:
    en: 'The multiplier is 1.08, used once for each of the 3 years: 800 × 1.08 to the power 3 = 1007.77.'
- type: check
  item_ids:
  - itm.mth.o.number.0369
  - itm.mth.o.number.0365
  - itm.mth.o.number.0363
