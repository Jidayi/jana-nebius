title: Graphs of functions and graphical solutions
estimated_minutes: 12
blocks:
- type: step
  text:
    en: Try this before any rules. Put the value of x into each term, then add.
  item_id: itm.mth.o.algebra_and_graphs.0263
  action: try_first
  why:
    en: You worked out each term on its own and added them. Each pair of x and y you find gives one point to plot.
  names:
    en: 'That has a name: a table of values. It gives the points you join to draw the curve.'
- type: step
  text:
    en: Now x is negative. Keep it in a bracket and watch the sign of the cube.
  item_id: itm.mth.o.algebra_and_graphs.0267
  action: choose
  why:
    en: Three negative numbers multiplied give a negative answer, so the cube stays negative. Dropping the minus sign, or the power, are the usual slips.
- type: step
  text:
    en: This curve has x on the bottom of a fraction. Work out each term, keeping the signs.
  item_id: itm.mth.o.algebra_and_graphs.0258
  action: calculate
  why:
    en: Both terms come out negative here, so keep each sign. Then add the two terms.
- type: step
  text:
    en: 'Now two graphs are drawn together. Before you work it out, predict: do you need where the curve meets the x-axis, or where the two graphs meet?'
  item_id: itm.mth.o.algebra_and_graphs.0279
  action: predict
  why:
    en: Where the graphs meet, their y-values are equal, so set the two right-hand sides equal and solve. Then pick the smaller x.
  names:
    en: Solving an equation from where two graphs cross is called a graphical solution.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.algebra_and_graphs.0285
  action: choose
  why:
    en: Set the two expressions equal, solve, and give the larger x. The answer is an x-value, not the y-value where they meet.
- type: check
