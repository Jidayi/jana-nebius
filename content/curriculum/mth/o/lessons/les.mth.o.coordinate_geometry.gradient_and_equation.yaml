  - itm.mth.o.coordinate_geometry.0099
- type: common_mistakes
  text:
    en: Keep the change in y on top, and subtract the coordinates in the same order on the top and the bottom.
  misconception_ids:
  - mc.mth.o.c_as_y_coordinate
