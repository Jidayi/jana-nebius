blocks:
- type: prior_knowledge
  item_ids:
  - itm.mth.o.coordinate_geometry.0001
- type: idea
  text:
    en: 'The gradient of a line tells you how steep it is: how far it goes up for every one step to the right. Take any two points on the line and divide the change in y by the change in x. Lines going down from left to right have negative gradients. Every straight line can be written as y = mx + c, where m is the gradient and c is where the line crosses the y-axis. Once you know m, put one point into the equation to find c.'
- type: worked_example
  worked_example_id: wex.mth.o.coordinate_geometry.0005
- type: guided_step
  item_id: itm.mth.o.coordinate_geometry.0032
- type: quick_check
