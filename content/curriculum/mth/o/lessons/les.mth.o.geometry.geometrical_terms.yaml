id: les.mth.o.geometry.geometrical_terms
node_id: cur.mth.o.geometry.geometrical_terms
kc_ids:
- kc.mth.o.geometry.shape_properties
title: Naming and describing shapes
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Picture each shape and count its pairs of parallel sides.
  item_id: itm.mth.o.geometry.0001
  action: try_first
  why:
    en: A trapezium has just one pair of parallel sides. A parallelogram has two pairs.
  names:
    en: Each four-sided shape has a family name. The name is fixed by its sides and angles.
- type: step
  text:
    en: Check every property in the question, one at a time.
  item_id: itm.mth.o.geometry.0007
  action: choose
  why:
    en: A kite has two pairs of equal sides that sit next to each other. A rhombus has all four sides equal.
- type: step
  text:
    en: The opposite sides of a parallelogram are parallel. Think about the two angles along one side.
  item_id: itm.mth.o.geometry.0002
  action: calculate
  why:
    en: Angles next to each other in a parallelogram add to 180°, so take the given angle from 180°.
- type: step
  text:
    en: 'Before you work it out, predict: will the angle next to it be bigger or smaller than the one given?'
  item_id: itm.mth.o.geometry.0015
  action: predict
  why:
    en: The two angles share 180°, so a small angle sits beside a large one. Copying the given angle, or using a quarter turn or a full turn as the total, are the usual slips.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.geometry.0014
  action: choose
  why:
    en: A rhombus is a special parallelogram, so angles next to each other still add to 180°.
- type: check
  item_ids:
  - itm.mth.o.geometry.0017
  - itm.mth.o.geometry.0010
  - itm.mth.o.geometry.0003
