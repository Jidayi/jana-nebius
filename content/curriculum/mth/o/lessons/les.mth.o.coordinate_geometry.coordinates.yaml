id: les.mth.o.coordinate_geometry.coordinates
node_id: cur.mth.o.coordinate_geometry.coordinates
kc_ids:
- kc.mth.o.coordinate_geometry.points_on_lines
title: Points and lines on the grid
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. The point sits on the line, so its coordinates must fit the equation.
  item_id: itm.mth.o.coordinate_geometry.0002
  action: try_first
  why:
    en: You put the x-coordinate in place of x and worked out y. A point lies on a line exactly when its coordinates make the equation true.
  names:
    en: Putting a number in place of a letter like this is called substituting.
- type: step
  text:
    en: Pick the right value. Put the x-coordinate in place of x, inside a bracket.
  item_id: itm.mth.o.coordinate_geometry.0012
  action: choose
  why:
    en: A point is written with x first, then y, so the first number replaces x. Swapping x and y, or losing a minus sign, are the usual slips.
- type: step
  text:
    en: Now you know the y-coordinate instead. Put it in place of y, then solve for x.
  item_id: itm.mth.o.coordinate_geometry.0003
  action: calculate
  why:
    en: After swapping in y, add the 1 to both sides first. Then divide by 4 to leave x on its own.
- type: step
  text:
    en: 'Before you work it out, predict: should you divide first, or take away the constant first?'
  item_id: itm.mth.o.coordinate_geometry.0013
  action: predict
  why:
    en: The constant was added last, so take it away first, then divide by the number in front of x. Dividing first, or moving the constant without changing its sign, gives a wrong answer.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.coordinate_geometry.0004
  action: calculate
  why:
    en: Put y in, add the 1 to both sides, then divide by -3. Dividing by a negative number changes the sign.
- type: check
  item_ids:
  - itm.mth.o.coordinate_geometry.0011
  - itm.mth.o.coordinate_geometry.0014
  - itm.mth.o.coordinate_geometry.0008
