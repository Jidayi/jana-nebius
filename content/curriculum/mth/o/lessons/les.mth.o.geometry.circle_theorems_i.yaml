title: 'Angles in circles: the first theorems'
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Both angles stand on the same arc, but one is at the centre and one is on the edge.
  item_id: itm.mth.o.geometry.0170
  action: try_first
  why:
    en: The angle at the centre is twice the angle at the edge standing on the same arc.
  names:
    en: 'That is a circle theorem: the angle at the centre is twice the angle at the circumference.'
- type: step
  text:
    en: When AB is a diameter, the angle at C is always a right angle. Then use the angles in a triangle.
  item_id: itm.mth.o.geometry.0176
  action: calculate
  why:
    en: The angle in a semicircle is 90°, so the other two angles share what is left of 180°.
  names:
    en: This fact is called the angle in a semicircle.
- type: step
  text:
    en: 'Same set-up: find the right angle first.'
  item_id: itm.mth.o.geometry.0180
  action: choose
  why:
    en: With the right angle at C, the other two angles add to 90°. Forgetting the right angle gives an answer far too big.
- type: step
  text:
    en: 'A tangent touches the circle at just one point. Before you work it out, predict: what angle does it make with the radius there?'
  item_id: itm.mth.o.geometry.0172
  action: predict
  why:
    en: A tangent meets the radius at 90°, so triangle OTP has a right angle at T.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.geometry.0182
  action: choose
  why:
    en: The right angle sits at T, between the tangent and the radius. Leaving it out of the triangle is the usual slip.
- type: check
  item_ids:
  - itm.mth.o.geometry.0175
  - itm.mth.o.geometry.0178
  - itm.mth.o.geometry.0177
