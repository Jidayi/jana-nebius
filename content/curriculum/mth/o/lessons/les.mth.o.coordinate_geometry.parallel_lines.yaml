id: les.mth.o.coordinate_geometry.parallel_lines
node_id: cur.mth.o.coordinate_geometry.parallel_lines
kc_ids:
- kc.mth.o.coordinate_geometry.parallel_lines
title: Parallel lines
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Think about what two lines that never meet must share.
  item_id: itm.mth.o.coordinate_geometry.0112
  action: try_first
  why:
    en: Lines that never meet climb at the same rate, so the new line also has gradient 3. Putting the point into the equation leaves only c to find.
  names:
    en: Lines with the same gradient are called parallel lines.
- type: step
  text:
    en: Pick the right value of c. Keep the gradient, then use the new point.
  item_id: itm.mth.o.coordinate_geometry.0117
  action: choose
  why:
    en: The new line shares the gradient but not the intercept, so put the point in to find c. Copying the old intercept is the usual slip.
- type: step
  text:
    en: This gradient is negative. Put each number in a bracket with its sign.
  item_id: itm.mth.o.coordinate_geometry.0107
  action: calculate
  why:
    en: The gradient is -3, so -3 times 2 is -6. Then c is -1 take away -6, which is 5.
- type: step
  text:
    en: 'Before you work it out, predict: will c be bigger or smaller than the y-coordinate of the point?'
  item_id: itm.mth.o.coordinate_geometry.0115
  action: predict
  why:
    en: Here the gradient times x is negative, so taking it away makes c bigger than y. Using the y-coordinate as c, or slipping on the sign, are the usual mistakes.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.coordinate_geometry.0109
  action: calculate
  why:
    en: The gradient is -3, and -3 times -2 is 6. So c is 5 take away 6, which is -1.
- type: check
  item_ids:
  - itm.mth.o.coordinate_geometry.0105
  - itm.mth.o.coordinate_geometry.0118
  - itm.mth.o.coordinate_geometry.0120
