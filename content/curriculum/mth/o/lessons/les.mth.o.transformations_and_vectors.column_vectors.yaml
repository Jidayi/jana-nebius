  - itm.mth.o.transformations_and_vectors.0057
- type: common_mistakes
  text:
    en: Work on the top and bottom rows separately, keep their signs, and square both parts before adding for the magnitude.
  misconception_ids:
  - mc.mth.o.magnitude_signed_sum
