- type: idea
  text:
    en: 'A column vector describes a movement: the top number is the move to the right and the bottom number is the move up. Negative numbers mean left or down. To add vectors, add the top numbers and add the bottom numbers. To multiply a vector by a number, multiply both of its numbers. The length of a vector, its magnitude, comes from Pythagoras'' theorem, because the two parts of the movement are at right angles.'
- type: worked_example
  worked_example_id: wex.mth.o.transformations_and_vectors.0005
- type: guided_step
  item_id: itm.mth.o.transformations_and_vectors.0032
- type: quick_check
