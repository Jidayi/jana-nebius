id: les.mth.o.number.ordering
node_id: cur.mth.o.number.ordering
kc_ids:
- kc.mth.o.number.ordering_quantities
title: Putting numbers in order
estimated_minutes: 9
blocks:
- type: step
  text:
    en: Try this before any rules. The numbers are written in different ways, so compare them with care.
  item_id: itm.mth.o.number.0101
  action: try_first
  why:
    en: Written as decimals, the fraction is small and the percentage is 0.45, so the decimal with the most tenths wins.
  names:
    en: Put every number in the same form, such as a decimal, before you compare. Then size is easy to see.
- type: step
  text:
    en: Change every number to a decimal first. Then compare the tenths.
  item_id: itm.mth.o.number.0110
  action: choose
  why:
    en: 'Compare tenths first: more digits after the point does not make a decimal bigger. Padding with zeros so both have three places helps.'
- type: step
  text:
    en: Before you sort them, predict which number is smallest. Then turn each one into a decimal to check.
  item_id: itm.mth.o.number.0100
  action: predict
  why:
    en: The fraction is about two tenths, the smallest by far. The percentage is 0.58, just below 0.585.
- type: step
  text:
    en: Watch the percentage this time.
  item_id: itm.mth.o.number.0112
  action: choose
  why:
    en: A percentage is out of a hundred, so 58% is 0.58, not fifty-eight. Compared as a decimal, it is smaller than 0.65.
- type: step
  text:
    en: Now one on your own. Predict the smallest first, then put them all in order.
  item_id: itm.mth.o.number.0102
  action: predict
  why:
    en: As decimals the four numbers are easy to line up by their tenths. The fraction is smallest and 0.7 is largest.
- type: check
  item_ids:
  - itm.mth.o.number.0104
  - itm.mth.o.number.0105
  - itm.mth.o.number.0114
