id: les.mth.o.number.time
node_id: cur.mth.o.number.time
kc_ids:
- kc.mth.o.number.time_intervals
title: Clocks and time intervals
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Count on from the start time to the arrival time.
  item_id: itm.mth.o.number.0318
  action: try_first
  why:
    en: From 8:55 it is 5 minutes to 9:00, then 1 h 30 min more to 10:30, so 95 minutes in all.
  names:
    en: That is counting on to find a time interval. Go to the next whole hour, then whole hours, then the minutes left.
- type: step
  text:
    en: One time is am and one is pm. Count up to noon first, then on into the afternoon.
  item_id: itm.mth.o.number.0322
  action: choose
  why:
    en: 1:00 pm is 13:00, so count on 35 minutes to 12:00, then 1 hour more. Subtracting the times like decimals is the usual slip, because minutes do not count up to a hundred.
- type: step
  text:
    en: Count on to the next hour, then whole hours, then the minutes left.
  item_id: itm.mth.o.number.0311
  action: calculate
  why:
    en: 'From 10:50 it is 10 minutes to 11:00, then 3 h 15 min to 14:15. Change the hours into minutes and add: 205 minutes.'
- type: step
  text:
    en: 'Before you work it out, predict: is the journey more or less than 4 hours?'
  item_id: itm.mth.o.number.0321
  action: predict
  why:
    en: 2:05 pm is 14:05, so the journey is 5 minutes plus 4 h 5 min, just over 4 hours. That is 250 minutes.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.number.0319
  action: calculate
  why:
    en: 2:03 pm is 14:03. Count 45 minutes to 12:00, then 2 h 3 min more, giving 168 minutes.
- type: check
  item_ids:
  - itm.mth.o.number.0313
  - itm.mth.o.number.0324
  - itm.mth.o.number.0316
