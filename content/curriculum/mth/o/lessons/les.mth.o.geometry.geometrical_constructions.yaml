title: Ruler-and-compasses constructions
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Lay the longest side down and imagine the other two swinging up from its ends.
  item_id: itm.mth.o.geometry.0021
  action: try_first
  why:
    en: The two shorter sides together are longer than the longest side. So their ends can meet above it.
  names:
    en: 'That test has a name: the triangle inequality. The longest side has to be less than the other two sides added together.'
- type: step
  text:
    en: 'Use the same test: add the two shorter sides and compare.'
  item_id: itm.mth.o.geometry.0030
  action: choose
  why:
    en: The two shorter sides add to less than the longest, so they cannot reach each other. A right angle or a different drawing order cannot fix that.
- type: step
  text:
    en: 'Before you work it out, predict: what happens when the two shorter sides add to exactly the longest side?'
  item_id: itm.mth.o.geometry.0029
  action: predict
  why:
    en: The two short sides would lie flat along the longest one, with no room to rise. So no triangle can be drawn.
- type: step
  text:
    en: 'Before you sort the steps, predict: do the compass arcs come before or after the straight line?'
  item_id: itm.mth.o.geometry.0020
  action: predict
  why:
    en: The arcs fix the points the line must pass through, and the line then joins them. Keep the compass width the same for arcs that must cross.
  names:
    en: Drawing with only compasses and a straight edge, with no measuring, is called a construction.
- type: step
  text:
    en: Now one on your own. Predict the first step before you sort the rest.
  item_id: itm.mth.o.geometry.0024
  action: predict
  why:
    en: Draw one side first, then arcs from each end fix the third corner. Join the corner to both ends last.
- type: check
  item_ids:
  - itm.mth.o.geometry.0022
  - itm.mth.o.geometry.0031
  - itm.mth.o.geometry.0028
