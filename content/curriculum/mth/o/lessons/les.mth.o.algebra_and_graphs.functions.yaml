title: Functions, composites and inverses
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Work out g of the number first, then put the result into f.
  item_id: itm.mth.o.algebra_and_graphs.0306
  action: try_first
  why:
    en: You fed the number into g, then fed the output of g into f. The function written next to the number acts first.
  names:
    en: 'That has a name: a composite function. It means one function after another.'
- type: step
  text:
    en: This time the order is swapped. Which function acts first?
  item_id: itm.mth.o.algebra_and_graphs.0314
  action: choose
  why:
    en: The function next to the number acts first, so do f, then g. Multiplying the two functions, or doing them in the wrong order, are the usual slips.
- type: step
  text:
    en: Same again, with a negative input. Keep the signs.
  item_id: itm.mth.o.algebra_and_graphs.0311
  action: calculate
  why:
    en: Put the input into f first, then put that answer into g.
- type: step
  text:
    en: 'Now go backwards. Before you work it out, predict: will the input be bigger or smaller than the output here?'
  item_id: itm.mth.o.algebra_and_graphs.0317
  action: predict
  why:
    en: The inverse asks which input gives this output, so solve f of x equal to the number. It is not one over f.
  names:
    en: Undoing a function like this is called its inverse function.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.algebra_and_graphs.0308
  action: calculate
  why:
    en: Set the function equal to the output, then rearrange to find x.
- type: check
  item_ids:
