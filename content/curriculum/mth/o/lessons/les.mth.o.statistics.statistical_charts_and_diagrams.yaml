id: les.mth.o.statistics.statistical_charts_and_diagrams
node_id: cur.mth.o.statistics.statistical_charts_and_diagrams
kc_ids:
- kc.mth.o.statistics.pie_charts
title: Pie charts
estimated_minutes: 9
blocks:
- type: step
  text:
    en: Try this before any rules. Think about what share of the people chose football.
  item_id: itm.mth.o.statistics.0087
  action: try_first
  why:
    en: Football is a share of everyone asked, so its slice is the same share of the whole circle. A full turn is 360°, so the angle is that share of 360°.
  names:
    en: A circle cut into slices like this is a pie chart. Each slice is called a sector.
- type: step
  text:
    en: Find the share of the people first, then turn that share into degrees.
  item_id: itm.mth.o.statistics.0095
  action: choose
  why:
    en: The angle is the share times 360°, not the number of people itself. Turning the share into a percentage and using that as the angle is the other usual slip.
- type: step
  text:
    en: 'Same method, with a bigger survey: share of the people, then share of the circle.'
  item_id: itm.mth.o.statistics.0091
  action: calculate
  why:
    en: Football's share of the people, times 360°, gives the size of its sector.
- type: step
  text:
    en: 'Now go the other way: you know the angle and want the number of students. Before you work it out, predict: will the answer be more or less than the angle?'
  item_id: itm.mth.o.statistics.0096
  action: predict
  why:
    en: The sector is a share of 360°, so the bus students are the same share of all the students. Taking the angle as the number, or dividing the wrong way round, are the usual slips.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.statistics.0090
  action: calculate
  why:
    en: The bus sector's share of 360° is the share of the students who take the bus. Multiply that share by the total.
- type: check
  item_ids:
  - itm.mth.o.statistics.0084
  - itm.mth.o.statistics.0088
  - itm.mth.o.statistics.0097
