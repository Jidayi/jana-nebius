title: Algebraic fractions
estimated_minutes: 12
blocks:
- type: step
  text:
    en: Try this before any rules. Can you write the top and the bottom as products?
  item_id: itm.mth.o.algebra_and_graphs.0910
  action: try_first
  why:
    en: The top has a common factor, and the bottom is a difference of two squares. One bracket appears on both, so it cancels.
  names:
    en: 'That has a name: simplifying an algebraic fraction. Factorise first, then cancel whole factors.'
- type: step
  text:
    en: Factorise the top and the bottom first, then look for a bracket they share.
  item_id: itm.mth.o.algebra_and_graphs.0089
  action: choose
  why:
    en: Only whole factors cancel, so the x squared terms cannot just be crossed out. Factorise, then cancel the shared bracket.
- type: step
  text:
    en: Same method again, with less help this time.
  item_id: itm.mth.o.algebra_and_graphs.0909
  action: calculate
  why:
    en: The top is a quadratic and the bottom a difference of two squares. They share one bracket, which cancels.
- type: step
  text:
    en: 'Now add two fractions. Before you work it out, predict: can you add the tops and add the bottoms?'
  item_id: itm.mth.o.algebra_and_graphs.0088
  action: predict
  why:
    en: 'No: fractions need a common denominator first, here the two bottoms multiplied. Whatever you multiply a bottom by, multiply its top by too.'
  names:
    en: The shared bottom is called the common denominator.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.algebra_and_graphs.0090
  action: choose
  why:
    en: Write both fractions over the common denominator, scaling each top, then expand and collect like terms. Multiply each term in the bracket by the number in front of it.
- type: check
