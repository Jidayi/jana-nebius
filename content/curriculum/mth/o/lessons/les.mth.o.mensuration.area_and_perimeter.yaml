id: les.mth.o.mensuration.area_and_perimeter
node_id: cur.mth.o.mensuration.area_and_perimeter
kc_ids:
- kc.mth.o.mensuration.area_perimeter
title: Perimeter and area of flat shapes
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Walk once round the edge of the garden and add up the distance.
  item_id: itm.mth.o.mensuration.0018
  action: try_first
  why:
    en: A rectangle has two lengths and two widths, so add them all.
  names:
    en: The distance all the way round the edge is the perimeter.
- type: step
  text:
    en: Sketch the rectangle and label all four sides first.
  item_id: itm.mth.o.mensuration.0027
  action: choose
  why:
    en: The perimeter adds two lengths and two widths. Adding only one of each, or multiplying, are the usual slips.
- type: step
  text:
    en: Now the space inside. A triangle is half of a rectangle with the same base and height.
  item_id: itm.mth.o.mensuration.0016
  action: calculate
  why:
    en: The area of a triangle is half of base times height.
  names:
    en: The space inside a shape is its area, measured in square units.
- type: step
  text:
    en: 'Before you work it out, predict: will the area be more or less than base times height?'
  item_id: itm.mth.o.mensuration.0028
  action: predict
  why:
    en: It is half of base times height. Leaving out the half, or adding the two lengths, are the usual slips.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.mensuration.0026
  action: choose
  why:
    en: The area of a parallelogram is base times the perpendicular height. The sloping side is longer than the height, so using it gives too much.
- type: check
  item_ids:
  - itm.mth.o.mensuration.0021
  - itm.mth.o.mensuration.0019
  - itm.mth.o.mensuration.0017
