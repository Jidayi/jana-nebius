id: les.mth.o.algebra_and_graphs.sketching_curves
node_id: cur.mth.o.algebra_and_graphs.sketching_curves
kc_ids:
- kc.mth.o.algebra_and_graphs.quadratic_features
title: Shapes of curves
estimated_minutes: 12
blocks:
- type: step
  text:
    en: Try this before any rules. On the x-axis, what is the value of y?
  item_id: itm.mth.o.algebra_and_graphs.0291
  action: try_first
  why:
    en: On the x-axis y is zero, so you solved the quadratic equal to zero. Factorising gave two values, and you kept the positive one.
  names:
    en: 'That has a name: the x-intercepts, or roots. They are where the curve crosses the x-axis.'
- type: step
  text:
    en: 'Same idea again: set y to zero and factorise.'
  item_id: itm.mth.o.algebra_and_graphs.0297
  action: choose
  why:
    en: Set each bracket equal to zero and solve it, so a plus in the bracket gives a minus root. Reading the root with the brackets sign is the usual slip.
- type: step
  text:
    en: Now find the lowest point. Write the expression as a bracket squared, plus or minus a number.
  item_id: itm.mth.o.algebra_and_graphs.0289
  action: calculate
  why:
    en: The bracket squared is never below zero, so y is lowest when the bracket is zero. That x gives the turning point.
  names:
    en: Writing it this way is called completing the square. The lowest point is the turning point.
- type: step
  text:
    en: 'Use the same method: what makes the bracket zero?'
  item_id: itm.mth.o.algebra_and_graphs.0302
  action: choose
  why:
    en: The x-coordinate is minus half the x coefficient. Using plus half, or the number term, are the usual slips.
- type: step
  text:
    en: 'Before you work it out, predict: is the y-coordinate of the turning point the number at the end of the equation?'
  item_id: itm.mth.o.algebra_and_graphs.0300
  action: predict
  why:
    en: 'No: that number is where the curve crosses the y-axis. Find the x of the turning point, then put it into the equation.'
- type: step
  text:
    en: Now one on your own.
  item_id: itm.mth.o.algebra_and_graphs.0294
  action: calculate
  why:
    en: Find the x of the turning point first, then substitute it to get y.
- type: check
