title: Angle facts on lines and in triangles
estimated_minutes: 12
blocks:
- type: prior_knowledge
  item_ids:
  - itm.mth.o.number.0115
- type: idea
  text:
    en: Angles that sit together on a straight line make a half turn, and angles all the way round a point make a full turn. When two straight lines cross, the angles opposite each other are equal. The three angles inside any triangle also make a half turn, and an isosceles triangle has two equal angles opposite its equal sides. An exterior angle of a triangle equals the sum of the two interior angles that are not next to it. Write the reason for each angle you find.
- type: worked_example
  worked_example_id: wex.mth.o.geometry.0016
- type: guided_step
  item_id: itm.mth.o.geometry.0110
- type: quick_check
  item_ids:
  - itm.mth.o.geometry.0120
  - itm.mth.o.geometry.0150
- type: common_mistakes
  text:
    en: Check which angles are on a straight line and which go round a point, and find the equal pair in an isosceles triangle before you subtract.
  misconception_ids:
  - mc.mth.o.adjacent_angles_complementary
  - mc.mth.o.alternate_supplementary
  - mc.mth.o.angle_sum_one_angle_only
  - mc.mth.o.exterior_as_supplement
- type: exit_check
  item_ids:
  - itm.mth.o.geometry.0111
  - itm.mth.o.geometry.0140
- type: summary
  text:
    en: Use the straight-line, full-turn and triangle facts, name the reason each time, and look for equal angles.
