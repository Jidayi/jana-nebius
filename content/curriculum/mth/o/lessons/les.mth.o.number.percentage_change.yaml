- kc.mth.o.number.reverse_percentage
title: Percentages of amounts and percentage change
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Try this before any rules. Work it out any way you like.
  item_id: itm.mth.o.number.0269
  action: try_first
  why:
    en: A 20% rise keeps the whole price and adds a fifth of it on top, so the new price is 120% of the old one.
  names:
    en: 'That 1.2 has a name: the multiplier. A rise makes it bigger than 1; a fall makes it smaller than 1.'
- type: step
  text:
    en: 'Use a multiplier this time: one multiplication does it.'
  item_id: itm.mth.o.number.0278
  action: choose
  why:
    en: A 12% rise gives the multiplier 1.12, so one multiplication finds the new price. Adding 12, or stopping at the change, are the usual slips.
- type: step
  text:
    en: A fall works the same way, with a multiplier smaller than 1.
  item_id: itm.mth.o.number.0267
  action: calculate
  why:
    en: A 12% fall leaves 88% of the price, so the multiplier is 0.88.
- type: step
  text:
    en: 'Before you work it out, predict: is the change measured against 80 or against 70?'
  item_id: itm.mth.o.number.0277
  action: predict
  why:
    en: A percentage change compares the change with where you started, so you divide by the original 80.
- type: step
  text:
    en: 'Now go backwards: you know the salary after the change.'
  item_id: itm.mth.o.number.0281
  action: calculate
  why:
    en: The new salary is 1.2 times the old one, so divide by 1.2 to undo the rise. Taking 20% off the new salary gives the wrong answer, because the 20% was of the old salary.
  names:
    en: Undoing a change by dividing by its multiplier is called a reverse percentage.
- type: check
  item_ids:
  - itm.mth.o.number.0275
  - itm.mth.o.number.0276
  - itm.mth.o.number.0291
