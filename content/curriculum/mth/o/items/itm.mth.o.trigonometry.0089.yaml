id: itm.mth.o.trigonometry.0089
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.trigonometry.cosine_rule
stem: In triangle ABC, b = AC = 5 cm, c = AB = 10 cm and the angle between them, A, is 55°.
parts:
- id: a
  prompt: Find a = BC, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 13.5 cm
      correct: false
      misconception_id: mc.mth.o.cosine_rule_sign
      feedback: 'a² = b² + c² − 2bc cos A: the last term is taken away.'
    - id: B
      text: 8.22 cm
      correct: true
    - id: C
      text: 67.6 cm
      correct: false
      misconception_id: mc.mth.o.pythag_no_root
      feedback: a² + b² is the square of the side. Take the square root as the last step.
    - id: D
      text: 3.79 cm
      correct: false
      misconception_id: mc.mth.o.cosine_rule_order
      feedback: Only 2bc is multiplied by cos A. Work out 2bc cos A first, then subtract it from b² + c².
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: You know two sides and the angle between them.
  - rung: 2
    name: concept
    text:
      en: 'Use the cosine rule: a² = b² + c² − 2bc cos A.'
  - rung: 3
    name: first_step
    text:
      en: Work out 2 × 5 × 10 × cos 55° first, then subtract it from 5² + 10².
  - rung: 4
    name: worked_step
    text:
      en: a² = 67.64; now take the square root.
  - rung: 5
    name: full_step
    text:
      en: a = 8.22 cm.
  misconception_ids:
  - mc.mth.o.cosine_rule_order
  - mc.mth.o.cosine_rule_sign
  - mc.mth.o.pythag_no_root
solution:
  steps:
  - n: 1
    latex: a^2 = b^2 + c^2 - 2bc\cos A
    reason: The cosine rule
  - n: 2
    latex: a^2 = 5^2 + 10^2 - 2 \times 5 \times 10 \times \cos 55 = 67.64
    reason: Substitute
    check_id: chk_build_mth_trg_0089_sq
  - n: 3
    latex: a = 8.22\ \text{cm}
    reason: Square root
    check_id: chk_build_mth_trg_0089_ans
