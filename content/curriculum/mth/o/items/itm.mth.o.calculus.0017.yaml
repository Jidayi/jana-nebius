stem: A curve has equation $y = x^2 + 3x + 5$.
parts:
- id: a
  prompt: Find the gradient of the normal to the curve at the point where x = 2. Give your answer to 3 significant figures.
  marks: 3
  answer:
    kind: numeric
    value: '-0.143'
    unit: null
    unit_policy: none
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_cal_0017_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The normal is the line at right angles to the tangent.
  - rung: 2
    name: concept
    text:
      en: First find the tangent's gradient from dy/dx, then take the negative reciprocal.
  - rung: 3
    name: first_step
    text:
      en: Differentiate and substitute x = 2.
  - rung: 4
    name: worked_step
    text:
      en: The tangent's gradient is 7.
  - rung: 5
    name: full_step
    text:
      en: The normal's gradient is -0.143.
  misconception_ids:
  - mc.mth.o.normal_gradient_as_tangent
  - mc.mth.o.perpendicular_reciprocal_only
  - mc.mth.o.gradient_from_y
solution:
  steps:
  - n: 1
    latex: \frac{dy}{dx} = 7 \text{ at } x = 2
    reason: The tangent's gradient
    check_id: chk_build_mth_cal_0017_m
  - n: 2
    latex: m_{\text{normal}} = -\frac{1}{7} = -0.143
    reason: Perpendicular to the tangent
    check_id: chk_build_mth_cal_0017_ans
