    text:
      en: Think about what each step needs to have been done before it.
  - rung: 2
    name: concept
    text:
      en: Compass arcs come before the straight line that joins the points they fix.
  - rung: 3
    name: first_step
    text:
      en: The first step starts from a point or a line you already have.
  - rung: 4
    name: worked_step
    text:
      en: The final step always draws a straight line through crossing points.
  - rung: 5
    name: full_step
    text:
      en: 'The steps go in the order given by the construction: Put the compass point on the vertex and draw an arc that crosses both arms; Keeping the same width, put the point where the arc crosses one arm and draw an arc inside the angle; With the same width, do the same from where the arc crosses the other arm; Draw a straight line from the vertex through the point where the two small arcs cross.'
solution:
