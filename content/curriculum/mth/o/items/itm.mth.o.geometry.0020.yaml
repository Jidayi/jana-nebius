stem: These are the steps to bisect an angle with a ruler and compasses.
parts:
- id: a
  prompt: Put the steps in order.
  marks: 2
  answer:
    kind: ordering
    scoring: exact
    elements:
    - id: e4
      text: Draw a straight line from the vertex through the point where the two small arcs cross
    - id: e1
      text: Put the compass point on the vertex and draw an arc that crosses both arms
    - id: e2
      text: Keeping the same width, put the point where the arc crosses one arm and draw an arc inside the angle
    - id: e3
      text: With the same width, do the same from where the arc crosses the other arm
    correct_order:
    - e1
    - e2
    - e3
    - e4
  show_working: false
  hints:
  - rung: 1
