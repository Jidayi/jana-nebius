id: itm.mth.o.geometry.0091
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.geometry.similar_area_volume
stem: Two similar photographs have heights 5 cm and 8 cm. The smaller one has an area of 40 cm².
parts:
- id: a
  prompt: Find the area of the larger one.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 64 cm²
      correct: false
      misconception_id: mc.mth.o.similar_length_factor_for_area
      feedback: 'Doubling every length of a square makes four copies of it: the area factor is the square.'
    - id: B
      text: 163.84 cm²
      correct: false
      misconception_id: mc.mth.o.similar_area_factor_for_length
      feedback: Lengths use the scale factor itself; only areas use its square.
    - id: C
      text: 15.625 cm²
      correct: false
      misconception_id: mc.mth.o.similar_factor_inverted
      feedback: Scale factor = new length ÷ old length. Going to the larger shape, lengths get bigger.
    - id: D
      text: 102.4 cm²
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the length scale factor first.
  - rung: 2
    name: concept
    text:
      en: For similar shapes, areas change by the square of the length scale factor.
  - rung: 3
    name: first_step
    text:
      en: The length scale factor is 8 ÷ 5.
  - rung: 4
    name: worked_step
    text:
      en: The area factor is 2.56.
  - rung: 5
    name: full_step
    text:
      en: The larger area is 40 × 2.56 = 102.4.
  misconception_ids:
  - mc.mth.o.similar_area_factor_for_length
  - mc.mth.o.similar_factor_inverted
  - mc.mth.o.similar_length_factor_for_area
solution:
  steps:
  - n: 1
    latex: k = \frac{8}{5}
    reason: Length scale factor
    check_id: chk_build_mth_geo_0091_k
  - n: 2
    latex: \text{area factor} = k^2 = 2.56
    reason: Areas scale by k^2
    check_id: chk_build_mth_geo_0091_f
  - n: 3
    latex: 40 \times 2.56 = 102.4
    reason: Multiply
    check_id: chk_build_mth_geo_0091_ans
