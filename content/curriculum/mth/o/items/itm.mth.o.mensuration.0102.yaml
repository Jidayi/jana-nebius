id: itm.mth.o.mensuration.0102
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.mensuration.compound_shapes
stem: A shape is a rectangle 8 cm wide and 7 cm tall with a semicircle on top. The diameter of the semicircle is the 8 cm side.
parts:
- id: a
  prompt: Find the total area, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 106 cm²
      correct: false
      misconception_id: mc.mth.o.semicircle_full_circle
      feedback: 'A semicircle is half a circle: halve πr².'
    - id: B
      text: 56.0 cm²
      correct: false
      misconception_id: mc.mth.o.compound_part_missing
      feedback: Split the shape into simple parts, label each one, and add every part.
    - id: C
      text: 81.1 cm²
      correct: true
    - id: D
      text: 157 cm²
      correct: false
      misconception_id: mc.mth.o.diameter_for_radius
      feedback: The radius is half the diameter. Halve the diameter before using πr².
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Split the shape into a rectangle and a semicircle.
  - rung: 2
    name: concept
    text:
      en: Find each area separately and add them.
  - rung: 3
    name: first_step
    text:
      en: The semicircle's radius is half of 8 cm.
  - rung: 4
    name: worked_step
    text:
      en: The rectangle is 56 cm² and the semicircle is 25.13 cm².
  - rung: 5
    name: full_step
    text:
      en: The total is 81.1 cm².
  misconception_ids:
  - mc.mth.o.compound_part_missing
  - mc.mth.o.diameter_for_radius
  - mc.mth.o.semicircle_full_circle
solution:
  steps:
  - n: 1
    latex: \text{rectangle} = 8 \times 7 = 56
    reason: Area of the rectangle
    check_id: chk_build_mth_mns_0102_rect
  - n: 2
    latex: \text{semicircle} = \tfrac{1}{2} \pi \times 4^2 = 25.13
    reason: Half a circle of radius half the width
    check_id: chk_build_mth_mns_0102_semi
  - n: 3
    latex: A = 81.1\ \text{cm}^2
    reason: Add the two parts
    check_id: chk_build_mth_mns_0102_ans
