id: itm.mth.o.algebra_and_graphs.0044
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.factorise_common
stem: Factorise $x^2 - 25$.
parts:
- id: a
  prompt: Choose the complete factorisation.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $(x - 5)(x + 5)$
      correct: true
    - id: B
      text: $(x - 5)^2$
      correct: false
      misconception_id: mc.mth.o.dots_as_square
      feedback: 'Expand (x − a)²: it has a middle term −2ax. A difference of two squares has no middle term, so the brackets must have opposite signs.'
    - id: C
      text: $(x - 25)(x + 25)$
      correct: false
      misconception_id: mc.mth.o.dots_not_rooted
      feedback: x² − 49 = x² − 7², so the brackets hold 7, the square root of 49.
    - id: D
      text: $x(x - 25)$
      correct: false
      misconception_id: mc.mth.o.factor_one_term_only
      feedback: Expand your answer to check it. Every term inside the bracket must be divided by the factor you took out.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Look at the two terms: is each one a perfect square?'
  - rung: 2
    name: concept
    text:
      en: A difference of two squares a² − b² factorises as (a − b)(a + b).
  - rung: 3
    name: first_step
    text:
      en: 'Write 25 as a square: which number squared gives 25?'
  - rung: 4
    name: worked_step
    text:
      en: 25 = 5², so a = x and b = 5.
  - rung: 5
    name: full_step
    text:
      en: The factorisation is $(x - 5)(x + 5)$.
  misconception_ids:
  - mc.mth.o.dots_as_square
  - mc.mth.o.dots_not_rooted
  - mc.mth.o.factor_one_term_only
solution:
  steps:
  - n: 1
    latex: x^2 - 25 = (x)^2 - 5^2
    reason: Both terms are perfect squares
    check_id: chk_build_mth_alg_0044_root
  - n: 2
    latex: = (x - 5)(x + 5)
    reason: a² − b² = (a − b)(a + b)
