id: itm.mth.o.geometry.0045
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.geometry.map_scales
stem: 'A plan is drawn to a scale of 1 : 25000. A straight road is 6 km long.'
parts:
- id: a
  prompt: How long is the road on the plan, in centimetres?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 15000000000 cm
      correct: false
      misconception_id: mc.mth.o.scale_wrong_direction
      feedback: 'Real distances are bigger than map distances: from map to real, multiply.'
    - id: B
      text: 24 cm
      correct: true
    - id: C
      text: 0.000240 cm
      correct: false
      misconception_id: mc.mth.o.scale_units_not_converted
      feedback: 100 cm = 1 m and 1000 m = 1 km, so 100000 cm = 1 km.
    - id: D
      text: 0.24 cm
      correct: false
      misconception_id: mc.mth.o.scale_conversion_factor
      feedback: 'Go one step at a time: cm to m divide by 100, then m to km divide by 1000.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The plan is much smaller than real life, so the answer is a small number of centimetres.
  - rung: 2
    name: concept
    text:
      en: Change the real length to centimetres, then divide by the scale.
  - rung: 3
    name: first_step
    text:
      en: 6 km = 6 × 1000 × 100 cm.
  - rung: 4
    name: worked_step
    text:
      en: That is 600000 cm. Divide by 25000.
  - rung: 5
    name: full_step
    text:
      en: On the plan the road is 24 cm.
  misconception_ids:
  - mc.mth.o.scale_conversion_factor
  - mc.mth.o.scale_units_not_converted
  - mc.mth.o.scale_wrong_direction
solution:
  steps:
  - n: 1
    latex: 6\ \text{km} = 600000\ \text{cm}
    reason: Change kilometres to centimetres
    check_id: chk_build_mth_geo_0045_cm
  - n: 2
    latex: 600000 \div 25000 = 24\ \text{cm}
    reason: Divide by the scale
    check_id: chk_build_mth_geo_0045_ans
