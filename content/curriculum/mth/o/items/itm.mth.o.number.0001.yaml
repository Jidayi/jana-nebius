stem: Write 36 as a product of its prime factors in index form.
parts:
- id: a
  prompt: What is the index of 2?
  marks: 2
  answer:
    kind: numeric
    value: '2'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_num_0001_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Start dividing by the smallest prime as many times as you can.
  - rung: 2
    name: concept
    text:
      en: Then divide by the next primes in turn until you reach 1. The index of the smallest prime counts how many times it divided.
  - rung: 3
    name: first_step
    text:
      en: Begin by halving 36, and keep halving.
  - rung: 4
    name: worked_step
    text:
      en: Count how many times you halved before moving on to the next prime.
  - rung: 5
    name: full_step
    text:
      en: 36 = 2^2 × 3^2, so the index of 2 is 2.
  misconception_ids:
  - mc.mth.o.prime_power_value_for_index
