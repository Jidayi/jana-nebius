  steps:
  - n: 1
    latex: 2x + 3y = 10,\quad 3x + 3y = 12
    reason: The two equations
  - n: 2
    latex: x = -2
    reason: Subtract the equations to eliminate y
    check_id: chk_build_mth_alg_0132_e
  - n: 3
    latex: x = 2
    reason: Divide
    check_id: chk_build_mth_alg_0132_ans
  - n: 4
    latex: y = 2
    reason: Substitute back to find y as a check
    check_id: chk_build_mth_alg_0132_sol
