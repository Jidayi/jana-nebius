  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The angle sits in a vertical right-angled triangle inside the cuboid.
  - rung: 2
    name: concept
    text:
      en: That triangle has the base diagonal along the bottom and the height going up.
  - rung: 3
    name: first_step
    text:
      en: Find the base diagonal from 3 and 6.
  - rung: 4
    name: worked_step
    text:
      en: The base diagonal is 6.708 cm; tan θ = 5 ÷ 6.708.
  - rung: 5
    name: full_step
    text:
      en: θ = 36.7°.
  misconception_ids:
