solution:
  steps:
  - n: 1
    latex: \text{base diagonal} = \sqrt{3^2 + 6^2} = 6.708
    reason: Pythagoras in the base
    check_id: chk_build_mth_trg_0109_bd
  - n: 2
    latex: \theta = \tan^{-1}\left(\frac{5}{6.708}\right) = 36.7
    reason: Height over base diagonal
    check_id: chk_build_mth_trg_0109_ans
