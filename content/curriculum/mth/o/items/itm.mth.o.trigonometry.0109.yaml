stem: A cuboid measures 3 cm by 6 cm by 5 cm.
parts:
- id: a
  prompt: Find the angle between a diagonal from a bottom corner to the opposite top corner and the base, to 1 decimal place.
  marks: 3
  answer:
    kind: numeric
    value: '36.7'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.05
