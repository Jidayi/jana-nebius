kc_ids:
- kc.mth.o.trigonometry.trig_side
stem: In a right-angled triangle, one angle is 58° and the side opposite the angle is 8 cm.
parts:
- id: a
  prompt: Find the hypotenuse, to 3 significant figures.
  marks: 3
  answer:
    kind: numeric
    value: '9.43'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_trg_0019_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Label the sides opposite, adjacent and hypotenuse from the given angle.
  - rung: 2
    name: concept
    text:
      en: 'SOH CAH TOA: choose the ratio that uses the side you know and the side you want.'
  - rung: 3
    name: first_step
    text:
      en: Here the ratio is sin.
  - rung: 4
    name: worked_step
    text:
      en: Write the ratio as an equation and rearrange for the unknown side; check your calculator is in degrees.
  - rung: 5
    name: full_step
    text:
      en: The side is 9.43 cm.
  misconception_ids:
  - mc.mth.o.trig_ratio_wrong
  - mc.mth.o.trig_rearrange_wrong
  - mc.mth.o.calculator_radians
solution:
  steps:
  - n: 1
    latex: \sin \theta = \frac{\text{opp}}{\text{hyp}}
    reason: The ratio linking the known side and the wanted side is sin
  - n: 2
    latex: x = \frac{8}{\sin 58} = 9.43\ \text{cm}
    reason: Rearrange and evaluate in degrees
    check_id: chk_build_mth_trg_0019_ans
