subject: mth
level: o
kc_ids:
- kc.mth.o.calculus.tangents_normals
stem: A curve has equation $y = 3x^2 + 3x + 1$.
parts:
- id: a
  prompt: Find the gradient of the normal to the curve at the point where x = 1. Give your answer to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '9'
      correct: false
      misconception_id: mc.mth.o.normal_gradient_as_tangent
      feedback: 'The normal is at right angles to the tangent: m_normal = −1 ÷ m_tangent.'
    - id: B
      text: '0.111'
      correct: false
      misconception_id: mc.mth.o.perpendicular_reciprocal_only
      feedback: 'If one line goes up, a line at right angles to it goes down: the signs must be opposite.'
    - id: C
      text: '-0.143'
      correct: false
      misconception_id: mc.mth.o.gradient_from_y
      feedback: The gradient comes from dy/dx. The curve's equation gives the y-coordinate.
    - id: D
      text: '-0.111'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The normal is the line at right angles to the tangent.
  - rung: 2
    name: concept
    text:
      en: First find the tangent's gradient from dy/dx, then take the negative reciprocal.
  - rung: 3
    name: first_step
    text:
      en: Differentiate and substitute x = 1.
  - rung: 4
    name: worked_step
    text:
      en: The tangent's gradient is 9.
  - rung: 5
    name: full_step
    text:
      en: The normal's gradient is -0.111.
  misconception_ids:
  - mc.mth.o.gradient_from_y
  - mc.mth.o.normal_gradient_as_tangent
  - mc.mth.o.perpendicular_reciprocal_only
solution:
  steps:
  - n: 1
    latex: \frac{dy}{dx} = 9 \text{ at } x = 1
    reason: The tangent's gradient
    check_id: chk_build_mth_cal_0027_m
  - n: 2
    latex: m_{\text{normal}} = -\frac{1}{9} = -0.111
    reason: Perpendicular to the tangent
    check_id: chk_build_mth_cal_0027_ans
