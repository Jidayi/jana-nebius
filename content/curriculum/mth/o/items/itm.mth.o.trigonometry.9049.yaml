    text:
      en: A diagonal splits a rhombus into two triangles.
  - rung: 2
    name: concept
    text:
      en: Each uses the same two side lengths and the sine of the included angle or its supplement.
  - rung: 3
    name: first_step
    text:
      en: Find half the product of the two sides and the sine of the angle, then double it for the whole rhombus.
  - rung: 4
