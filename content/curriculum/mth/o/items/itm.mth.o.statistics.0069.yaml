id: itm.mth.o.statistics.0069
version: 0.1.0
type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.statistics.grouped_mean
stem: 'The times, t minutes, that students took to finish a task are grouped: 20 ≤ t < 25: 6; 25 ≤ t < 30: 5; 30 ≤ t < 35: 8; 35 ≤ t < 40: 5.'
parts:
- id: a
  prompt: Estimate the mean time.
  marks: 3
  answer:
    kind: numeric
    value: '30'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_sta_0069_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You do not know the exact times, so use one value for each class.
  - rung: 2
    name: concept
    text:
      en: Use the midpoint of each class, multiply by its frequency, add, and divide by the total frequency.
  - rung: 3
    name: first_step
    text:
      en: The first class has midpoint (20 + 25) ÷ 2.
  - rung: 4
    name: worked_step
    text:
      en: Σfx = 720 and Σf = 24.
  - rung: 5
    name: full_step
    text:
      en: The estimated mean is 30 minutes.
  misconception_ids:
  - mc.mth.o.grouped_upper_bound
  - mc.mth.o.frequency_mean_rows
  - mc.mth.o.class_width_wrong
solution:
  steps:
  - n: 1
    latex: '\text{midpoints: } 22.5, 27.5, 32.5, 37.5'
    reason: Middle of each class
    check_id: chk_build_mth_sta_0069_mids
  - n: 2
    latex: \Sigma fx = 720,\ \Sigma f = 24
    reason: Midpoint times frequency, added
    check_id: chk_build_mth_sta_0069_t
  - n: 3
    latex: \text{mean} \approx \frac{720}{24} = 30
    reason: Divide by the total frequency
    check_id: chk_build_mth_sta_0069_sc
difficulty:
  prior: 0.4
  band: core
estimated_seconds: 120
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
