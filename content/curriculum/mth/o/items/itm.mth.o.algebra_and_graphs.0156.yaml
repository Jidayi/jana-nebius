stem: Solve the equation $x^2 - 7x - 2 = 0$, giving your answers to 3 significant figures.
parts:
- id: a
  prompt: Give the larger solution.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '7.27'
      correct: true
    - id: B
      text: '0.275'
      correct: false
      misconception_id: mc.mth.o.formula_b_sign
      feedback: The formula begins with the opposite of b. If b is negative, −b is positive.
    - id: C
      text: '10.8'
      correct: false
      misconception_id: mc.mth.o.formula_partial_division
      feedback: The whole of −b ± √(b² − 4ac) sits above the fraction line, so all of it is divided by 2a.
    - id: D
      text: '-0.275'
      correct: false
      misconception_id: mc.mth.o.root_sign_from_factor
      feedback: 'Set each bracket equal to zero and solve it: x + 3 = 0 gives x = −3.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: This quadratic does not factorise with whole numbers. Which method works for any quadratic?
  - rung: 2
    name: concept
    text:
      en: Use the quadratic formula with a, b and c read from the equation.
  - rung: 3
    name: first_step
    text:
      en: Here a = 1, b = −7 and c = −2. Work out b² − 4ac first.
  - rung: 4
    name: worked_step
    text:
      en: b² − 4ac = 57. Now use x = (−b + √(57)) ÷ (2 × 1).
  - rung: 5
    name: full_step
    text:
      en: x = 7.27 (3 s.f.).
  misconception_ids:
