id: itm.mth.o.mensuration.0088
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.mensuration.pyramid_cone_sphere
stem: A cone has base radius 3 cm and vertical height 10 cm.
parts:
- id: a
  prompt: Find its volume, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 94.2 cm³
      correct: true
    - id: B
      text: 283 cm³
      correct: false
      misconception_id: mc.mth.o.cone_third_dropped
      feedback: A cone fills one third of the cylinder with the same base and height.
    - id: C
      text: 377 cm³
      correct: false
      misconception_id: mc.mth.o.diameter_for_radius
      feedback: The radius is half the diameter. Halve the diameter before using πr².
    - id: D
      text: 31.4 cm³
      correct: false
      misconception_id: mc.mth.o.radius_not_squared
      feedback: 'Area needs two lengths multiplied: π × r × r.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A cone is like a pyramid with a circular base.
  - rung: 2
    name: concept
    text:
      en: Volume of a cone = ⅓ × π × r² × h.
  - rung: 3
    name: first_step
    text:
      en: Work out π × 3² × 10 first.
  - rung: 4
    name: worked_step
    text:
      en: Then divide by 3.
  - rung: 5
    name: full_step
    text:
      en: The volume is 94.2 cm³.
  misconception_ids:
  - mc.mth.o.cone_third_dropped
  - mc.mth.o.diameter_for_radius
  - mc.mth.o.radius_not_squared
solution:
  steps:
  - n: 1
    latex: V = \tfrac{1}{3}\pi r^2 h
    reason: Volume of a cone
  - n: 2
    latex: V = \tfrac{1}{3} \times \pi \times 3^2 \times 10 = 94.2\ \text{cm}^3
    reason: Substitute and round
    check_id: chk_build_mth_mns_0088_ans
