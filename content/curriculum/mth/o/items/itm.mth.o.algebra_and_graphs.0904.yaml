    required_form: factorised
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Is each term a perfect square? Then this is a difference of two squares.
  - rung: 2
    name: concept
    text:
      en: a² − b² factorises as (a − b)(a + b).
  - rung: 3
    name: first_step
    text:
      en: Write 25 as a number squared.
  - rung: 4
    name: worked_step
    text:
      en: 25 = 5², so b = 5.
  - rung: 5
    name: full_step
    text:
      en: The factorisation is $(3x - 5)(3x + 5)$.
solution:
  steps:
  - n: 1
    latex: 9x^2 - 25 = (3x)^2 - 5^2
    reason: Both terms are perfect squares
    check_id: chk_build_mth_alg_0904_n
  - n: 2
    latex: = (3x - 5)(3x + 5)
    reason: A difference of two squares a² − b² is (a − b)(a + b)
