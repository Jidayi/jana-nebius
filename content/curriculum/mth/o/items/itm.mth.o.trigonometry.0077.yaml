subject: mth
level: o
kc_ids:
- kc.mth.o.trigonometry.cosine_rule
stem: In triangle ABC, b = AC = 8 cm, c = AB = 6 cm and the angle between them, A, is 64°.
parts:
- id: a
  prompt: Find a = BC, to 3 significant figures.
  marks: 3
  answer:
    kind: numeric
    value: '7.61'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_trg_0077_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You know two sides and the angle between them.
  - rung: 2
    name: concept
    text:
      en: 'Use the cosine rule: a² = b² + c² − 2bc cos A.'
  - rung: 3
    name: first_step
    text:
      en: Work out 2 × 8 × 6 × cos 64° first, then subtract it from 8² + 6².
  - rung: 4
    name: worked_step
    text:
      en: a² = 57.92; now take the square root.
  - rung: 5
    name: full_step
    text:
      en: a = 7.61 cm.
  misconception_ids:
  - mc.mth.o.cosine_rule_sign
  - mc.mth.o.pythag_no_root
  - mc.mth.o.cosine_rule_order
solution:
  steps:
  - n: 1
    latex: a^2 = b^2 + c^2 - 2bc\cos A
    reason: The cosine rule
  - n: 2
    latex: a^2 = 8^2 + 6^2 - 2 \times 8 \times 6 \times \cos 64 = 57.92
    reason: Substitute
    check_id: chk_build_mth_trg_0077_sq
  - n: 3
    latex: a = 7.61\ \text{cm}
    reason: Square root
    check_id: chk_build_mth_trg_0077_ans
