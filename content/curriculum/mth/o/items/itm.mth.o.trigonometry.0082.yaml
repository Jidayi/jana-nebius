level: o
kc_ids:
- kc.mth.o.trigonometry.cosine_rule
stem: In triangle ABC, b = AC = 7 cm, c = AB = 12 cm and the angle between them, A, is 47°.
parts:
- id: a
  prompt: Find a = BC, to 3 significant figures.
  marks: 3
  answer:
    kind: numeric
    value: '8.86'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_trg_0082_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You know two sides and the angle between them.
  - rung: 2
    name: concept
    text:
      en: 'Use the cosine rule: a² = b² + c² − 2bc cos A.'
  - rung: 3
    name: first_step
    text:
      en: Work out 2 × 7 × 12 × cos 47° first, then subtract it from 7² + 12².
  - rung: 4
    name: worked_step
    text:
      en: a² = 78.42; now take the square root.
  - rung: 5
    name: full_step
    text:
      en: a = 8.86 cm.
  misconception_ids:
  - mc.mth.o.cosine_rule_sign
  - mc.mth.o.pythag_no_root
  - mc.mth.o.cosine_rule_order
solution:
  steps:
  - n: 1
    latex: a^2 = b^2 + c^2 - 2bc\cos A
    reason: The cosine rule
  - n: 2
    latex: a^2 = 7^2 + 12^2 - 2 \times 7 \times 12 \times \cos 47 = 78.42
    reason: Substitute
    check_id: chk_build_mth_trg_0082_sq
  - n: 3
    latex: a = 8.86\ \text{cm}
    reason: Square root
    check_id: chk_build_mth_trg_0082_ans
