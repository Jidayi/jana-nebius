    latex: x + 5 = 0 \text{ or } x + 3 = 0
    reason: One of the brackets must be zero
  - n: 3
    latex: x = -5 \text{ or } x = -3
    reason: Solve each one
    check_id: chk_build_mth_alg_0915_key
