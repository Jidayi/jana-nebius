    text:
      en: If two brackets multiply to give zero, one of them must be zero.
  - rung: 3
    name: first_step
    text:
      en: Find two numbers that multiply to 15 and add to 8.
  - rung: 4
    name: worked_step
    text:
      en: 'Set each bracket equal to zero and solve it: there are two answers.'
  - rung: 5
    name: full_step
    text:
      en: x = -5 or x = -3.
