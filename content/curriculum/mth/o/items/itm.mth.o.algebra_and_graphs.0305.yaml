    text:
      en: gf(x) means g(f(x)). Which function is applied first?
  - rung: 2
    name: concept
    text:
      en: Work out f of the number first, then put that answer into g.
  - rung: 3
    name: first_step
    text:
      en: f(3) = 5 × (3) - 7.
  - rung: 4
    name: worked_step
    text:
      en: f(3) = 8. Now find g(8).
  - rung: 5
    name: full_step
    text:
      en: gf(3) = 65.
