id: itm.mth.o.statistics.0142
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.statistics.histograms
stem: In a frequency table, the class 20 < x ≤ 40 has frequency 12.
parts:
- id: a
  prompt: Find the frequency density for a histogram.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '240'
      correct: false
      misconception_id: mc.mth.o.density_multiplied
      feedback: Frequency density = frequency ÷ class width.
    - id: B
      text: '0.3'
      correct: false
      misconception_id: mc.mth.o.class_width_wrong
      feedback: Class width = upper boundary − lower boundary.
    - id: C
      text: '0.6'
      correct: true
    - id: D
      text: '1.67'
      correct: false
      misconception_id: mc.mth.o.frequency_density_inverted
      feedback: Frequency density is frequency ÷ class width, not class width ÷ frequency.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: In a histogram with unequal widths, the height is not the frequency.
  - rung: 2
    name: concept
    text:
      en: Frequency density = frequency ÷ class width.
  - rung: 3
    name: first_step
    text:
      en: The class width is 40 − 20.
  - rung: 4
    name: worked_step
    text:
      en: Divide 12 by the width.
  - rung: 5
    name: full_step
    text:
      en: The frequency density is 0.6.
  misconception_ids:
  - mc.mth.o.class_width_wrong
  - mc.mth.o.density_multiplied
  - mc.mth.o.frequency_density_inverted
solution:
  steps:
  - n: 1
    latex: \text{width} = 40 - 20
    reason: Class width
  - n: 2
    latex: \text{density} = \frac{12}{20} = 0.6
    reason: Frequency over width
    check_id: chk_build_mth_sta_0142_ans
