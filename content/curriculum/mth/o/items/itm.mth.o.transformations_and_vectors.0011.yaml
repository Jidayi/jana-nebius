id: itm.mth.o.transformations_and_vectors.0011
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.transformations_and_vectors.transform_points
stem: The point P(2, 7) is enlarged by scale factor 0.5 with centre (1, 1).
parts:
- id: a
  prompt: Find the x-coordinate of the image P′.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '1'
      correct: false
      misconception_id: mc.mth.o.enlargement_centre_ignored
      feedback: 'Measure from the centre: multiply the distance from the centre by the scale factor, then add it back to the centre.'
    - id: B
      text: '2.5'
      correct: false
      misconception_id: mc.mth.o.enlargement_added
      feedback: A scale factor of 2 doubles every length; adding 2 would change a 1 cm side and a 10 cm side by the same amount.
    - id: C
      text: '0.5'
      correct: false
      misconception_id: mc.mth.o.translation_sign
      feedback: 'The top number moves right (negative: left); the bottom number moves up (negative: down). Add each to the matching coordinate.'
    - id: D
      text: '1.5'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Enlargement scales distances measured from the centre.
  - rung: 2
    name: concept
    text:
      en: Find how far P is from the centre in the x-direction, multiply by 0.5, then add to the centre.
  - rung: 3
    name: first_step
    text:
      en: The distance is 2 − (1).
  - rung: 4
    name: worked_step
    text:
      en: The distance is 1; multiply it by 0.5.
  - rung: 5
    name: full_step
    text:
      en: The image has x = 1.5.
  misconception_ids:
  - mc.mth.o.enlargement_added
  - mc.mth.o.enlargement_centre_ignored
  - mc.mth.o.translation_sign
solution:
  steps:
  - n: 1
    latex: \text{distance from the centre} = 2 - (1) = 1
    reason: In the x-direction
    check_id: chk_build_mth_vec_0011_d
  - n: 2
    latex: x' = 1 + 0.5 \times 1 = 1.5
    reason: Scale the distance and add it to the centre
    check_id: chk_build_mth_vec_0011_ans
