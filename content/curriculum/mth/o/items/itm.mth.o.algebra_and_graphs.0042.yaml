id: itm.mth.o.algebra_and_graphs.0042
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.factorise_common
stem: Factorise completely $20x^2 + 36x$.
parts:
- id: a
  prompt: Choose the complete factorisation.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $x(20x + 36)$
      correct: false
      misconception_id: mc.mth.o.factorise_not_fully
      feedback: 'Check the bracket at the end: if its terms still share a number or a letter, take that out too.'
    - id: B
      text: $4x(5x + 36)$
      correct: false
      misconception_id: mc.mth.o.factor_one_term_only
      feedback: Expand your answer to check it. Every term inside the bracket must be divided by the factor you took out.
    - id: C
      text: $4x(5x + 9)$
      correct: true
    - id: D
      text: $4(5x^2 + 9x)$
      correct: false
      misconception_id: mc.mth.o.factorise_not_fully
      feedback: 'Check the bracket at the end: if its terms still share a number or a letter, take that out too.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Find what the two terms have in common: a number and a letter.'
  - rung: 2
    name: concept
    text:
      en: Take out the highest common factor of the numbers and the letters, then divide each term by it.
  - rung: 3
    name: first_step
    text:
      en: The highest common factor of 20 and 36 goes in front, together with x.
  - rung: 4
    name: worked_step
    text:
      en: The common factor is 4x. Divide 20x² and 36x by it.
  - rung: 5
    name: full_step
    text:
      en: The complete factorisation is $4x(5x + 9)$.
  misconception_ids:
  - mc.mth.o.factor_one_term_only
  - mc.mth.o.factorise_not_fully
solution:
  steps:
  - n: 1
    latex: \text{HCF of } 20x^2 \text{ and } 36x = 4x
    reason: Largest number and letter in both terms
    check_id: chk_build_mth_alg_0042_hcf
  - n: 2
    latex: 20x^2 + 36x = 4x(5x + 9)
    reason: Divide each term by the HCF
    check_id: chk_build_mth_alg_0042_t
