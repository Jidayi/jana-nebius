stem: 'Obi and Fatima share $100 in the ratio 2 : 3, in that order.'
parts:
- id: a
  prompt: How much does Fatima receive?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '20'
      correct: false
      misconception_id: mc.mth.o.ratio_one_part
      feedback: 'One part is only the start: multiply it by the number of parts in the share you want.'
    - id: B
      text: '50'
      correct: false
      misconception_id: mc.mth.o.ratio_divide_by_terms
      feedback: 'A ratio of 2 : 3 shares unequally, in 5 parts, not 2 equal halves.'
    - id: C
      text: '40'
      correct: false
      misconception_id: mc.mth.o.ratio_wrong_share
      feedback: Match the order of the ratio to the order of the names.
    - id: D
      text: '60'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: How many equal parts is the money split into?
  - rung: 2
    name: concept
    text:
      en: Add the numbers in the ratio to find the total number of parts; then find the value of one part.
  - rung: 3
    name: first_step
    text:
      en: There are 5 parts altogether.
  - rung: 4
    name: worked_step
    text:
      en: One part is $100 ÷ 5 = $20. Fatima gets 3 parts.
  - rung: 5
    name: full_step
    text:
      en: Fatima receives $60.
  misconception_ids:
  - mc.mth.o.ratio_divide_by_terms
  - mc.mth.o.ratio_one_part
  - mc.mth.o.ratio_wrong_share
solution:
  steps:
  - n: 1
    latex: 2 + 3 = 5
    reason: Total number of parts
    check_id: chk_build_mth_num_0231_parts
  - n: 2
    latex: \$ 100 \div 5 = \$ 20
    reason: Value of one part
    check_id: chk_build_mth_num_0231_one
  - n: 3
    latex: 20 \times 3 = 60
    reason: Fatima has 3 parts
    check_id: chk_build_mth_num_0231_ans
