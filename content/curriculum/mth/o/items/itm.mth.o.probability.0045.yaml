stem: The probability that Ama scores a goal is 0.25. The probability that Kofi scores a goal is 0.1. The two events are independent.
parts:
- id: a
  prompt: Find the probability that both happen.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '0.35'
      correct: false
      misconception_id: mc.mth.o.and_as_add
      feedback: 'Two coins both landing heads is less likely than one: ½ × ½ = ¼, not ½ + ½ = 1.'
    - id: B
      text: '0.025'
      correct: true
    - id: C
      text: '0.975'
      correct: false
      misconception_id: mc.mth.o.complement_of_both
      feedback: '''At least one'' fails only when neither happens, so subtract P(neither) from 1.'
    - id: D
      text: '0.675'
      correct: false
      misconception_id: mc.mth.o.complement_not_taken
      feedback: P(not A) = 1 − P(A).
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Both events have to happen.
  - rung: 2
    name: concept
    text:
      en: For independent events, P(A and B) = P(A) × P(B).
  - rung: 3
    name: first_step
    text:
      en: Multiply 0.25 by 0.1.
  - rung: 4
    name: worked_step
    text:
      en: The answer must be smaller than both probabilities.
  - rung: 5
    name: full_step
    text:
      en: P(both) = 0.025.
  misconception_ids:
  - mc.mth.o.and_as_add
  - mc.mth.o.complement_not_taken
  - mc.mth.o.complement_of_both
solution:
  steps:
  - n: 1
    latex: P(\text{both}) = 0.25 \times 0.1 = 0.025
    reason: 'Independent events: multiply'
    check_id: chk_build_mth_prb_0045_ans
