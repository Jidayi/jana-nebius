id: itm.mth.o.algebra_and_graphs.0014
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.substitution
stem: Find the value of $2x^2 - 3x - 4$ when $x = -5$.
parts:
- id: a
  prompt: Give the value.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '111'
      correct: false
      misconception_id: mc.mth.o.multiply_before_power
      feedback: The power belongs only to the letter next to it. Square x first, then multiply by the number in front.
    - id: B
      text: '-39'
      correct: false
      misconception_id: mc.mth.o.negative_squared_negative
      feedback: A negative times a negative is positive, so (−3)² = (−3) × (−3) = 9. Keep the bracket round the negative number when you substitute.
    - id: C
      text: '61'
      correct: true
    - id: D
      text: '31'
      correct: false
      misconception_id: mc.mth.o.sign_lost_substitution
      feedback: Write the value in a bracket with its sign, for example x = (−4), before you calculate.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Replace every x by the value in a bracket, sign and all.
  - rung: 2
    name: concept
    text:
      en: 'Follow the order of operations: the power first, then multiplication, then addition and subtraction.'
  - rung: 3
    name: first_step
    text:
      en: Start with (-5)². A negative number squared is positive.
  - rung: 4
    name: worked_step
    text:
      en: The terms are 2 × (-5)² = 50 and −3 × (-5) = 15.
  - rung: 5
    name: full_step
    text:
      en: 50 + 15 - 4 = 61.
  misconception_ids:
  - mc.mth.o.multiply_before_power
  - mc.mth.o.negative_squared_negative
  - mc.mth.o.sign_lost_substitution
solution:
  steps:
  - n: 1
    latex: 2x^2 - 3x - 4 = 2 \times (-5)^2 - 3 \times (-5) - 4
    reason: Substitute, keeping the negative value in a bracket
  - n: 2
    latex: = 50 + 15 - 4
    reason: Powers first, then multiply
    check_id: chk_build_mth_alg_0014_t
  - n: 3
    latex: = 61
    reason: Add the terms
    check_id: chk_build_mth_alg_0014_ans
