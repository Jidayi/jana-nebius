stem: The number of students in a club changes from 80 to 70.
parts:
- id: a
  prompt: Find the percentage change. Use a negative number for a decrease.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: -14.3%
      correct: false
      misconception_id: mc.mth.o.percent_change_new_base
      feedback: 'Percentage change compares the change with where you started: divide by the original value.'
    - id: B
      text: -12.5%
      correct: true
    - id: C
      text: -10%
      correct: false
      misconception_id: mc.mth.o.percent_change_only
      feedback: After finding the change, add it to (or take it from) the original, or use a multiplier.
    - id: D
      text: 87.5%
      correct: false
      misconception_id: mc.mth.o.percent_scale_wrong
      feedback: 'Per cent means out of 100: to go from a percentage to a decimal, divide by 100, so 35% = 0.35.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Percentage change compares the change with the original amount.
  - rung: 2
    name: concept
    text:
      en: Percentage change = change ÷ original × 100.
  - rung: 3
    name: first_step
    text:
      en: The change is 70 − 80.
  - rung: 4
    name: worked_step
    text:
      en: The change is -10. Divide by 80, the original, and multiply by 100.
  - rung: 5
    name: full_step
    text:
      en: The percentage change is -12.5%.
  misconception_ids:
  - mc.mth.o.percent_change_new_base
  - mc.mth.o.percent_change_only
  - mc.mth.o.percent_scale_wrong
solution:
