id: itm.mth.o.geometry.0046
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.geometry.map_scales
stem: 'A map has a scale of 1 : 200000. Two villages are 12 cm apart on the map.'
parts:
- id: a
  prompt: Find the real distance between them in kilometres.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 2400000 km
      correct: false
      misconception_id: mc.mth.o.scale_units_not_converted
      feedback: 100 cm = 1 m and 1000 m = 1 km, so 100000 cm = 1 km.
    - id: B
      text: 6 km
      correct: false
      misconception_id: mc.mth.o.scale_wrong_direction
      feedback: 'Real distances are bigger than map distances: from map to real, multiply.'
    - id: C
      text: 24 km
      correct: true
    - id: D
      text: 2400 km
      correct: false
      misconception_id: mc.mth.o.scale_conversion_factor
      feedback: 'Go one step at a time: cm to m divide by 100, then m to km divide by 1000.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The scale means 1 cm on the map is 200000 cm on the ground.
  - rung: 2
    name: concept
    text:
      en: Multiply the map distance by the scale, then change the units.
  - rung: 3
    name: first_step
    text:
      en: Work out 12 × 200000 to get centimetres.
  - rung: 4
    name: worked_step
    text:
      en: That is 2400000 cm. Divide by 100 to get metres, then by 1000 to get kilometres.
  - rung: 5
    name: full_step
    text:
      en: The real distance is 24 km.
  misconception_ids:
  - mc.mth.o.scale_conversion_factor
  - mc.mth.o.scale_units_not_converted
  - mc.mth.o.scale_wrong_direction
solution:
  steps:
  - n: 1
    latex: 12 \times 200000 = 2400000\ \text{cm}
    reason: Every map centimetre is 200000 real centimetres
    check_id: chk_build_mth_geo_0046_real
  - n: 2
    latex: 2400000\ \text{cm} = 24\ \text{km}
    reason: Divide by 100 for metres, then by 1000 for kilometres
    check_id: chk_build_mth_geo_0046_ans
