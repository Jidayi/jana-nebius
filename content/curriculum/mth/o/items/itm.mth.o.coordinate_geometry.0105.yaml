id: itm.mth.o.coordinate_geometry.0105
version: 0.1.0
type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.coordinate_geometry.parallel_lines
stem: Line L has equation $y = 5x - 5$. Line N is parallel to L and passes through (4, -1).
parts:
- id: a
  prompt: The equation of N is y = mx + c. Find c.
  marks: 2
  answer:
    kind: numeric
    value: '-21'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_crd_0105_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Parallel lines never meet, so they have the same steepness.
  - rung: 2
    name: concept
    text:
      en: N has gradient 5, the same as L, but a different intercept.
  - rung: 3
    name: first_step
    text:
      en: Substitute x = 4, y = -1 and m = 5 into y = mx + c.
  - rung: 4
    name: worked_step
    text:
      en: 5 × (4) = 20.
  - rung: 5
    name: full_step
    text:
      en: c = -21.
  misconception_ids:
  - mc.mth.o.parallel_same_intercept
  - mc.mth.o.parallel_perpendicular_confused
  - mc.mth.o.intercept_sign
solution:
  steps:
  - n: 1
    latex: m = 5
    reason: Parallel lines have the same gradient
  - n: 2
    latex: -1 = 5 \times (4) + c
    reason: Substitute the point
  - n: 3
    latex: 5 \times (4) = 20
    reason: Multiply
    check_id: chk_build_mth_crd_0105_t
  - n: 4
    latex: c = -1 - 20 = -21
    reason: Solve for c
    check_id: chk_build_mth_crd_0105_ans
