stem: P is the point (2, 2) and Q is the point (1, 5).
parts:
- id: a
  prompt: Find the length of PQ, to 3 significant figures.
  marks: 3
  answer:
    kind: numeric
    value: '3.16'
    unit: null
    unit_policy: none
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_crd_0067_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Sketch the two points: the segment is the hypotenuse of a right-angled triangle.'
  - rung: 2
    name: concept
    text:
      en: The other two sides are the change in x and the change in y.
  - rung: 3
    name: first_step
    text:
      en: Change in x = 1 − (2); change in y = 5 − (2).
  - rung: 4
    name: worked_step
    text:
      en: 'Square both changes and add: 10. Then take the square root.'
  - rung: 5
    name: full_step
    text:
      en: PQ = 3.16.
  misconception_ids:
