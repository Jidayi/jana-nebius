id: itm.mth.o.geometry.0034
version: 0.1.1
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.geometry.constructions
stem: A plan asks for a triangle with sides 5 cm, 5 cm and 13 cm to be constructed. Is this possible?
parts:
- id: a
  prompt: Choose the correct answer.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Yes, any three lengths make a triangle
      correct: false
      misconception_id: mc.mth.o.triangle_inequality_ignored
      feedback: 'Try 3 cm, 4 cm and 10 cm: the two short sides cannot reach each other across 10 cm.'
    - id: B
      text: Only if one angle is measured as a right angle
      correct: false
      misconception_id: mc.mth.o.construction_measures_with_protractor
      feedback: A construction uses only a straight edge and compasses; measuring is not constructing.
    - id: C
      text: 'No'
      correct: true
    - id: D
      text: Yes, if the longest side is drawn last
      correct: false
      misconception_id: mc.mth.o.construction_wrong_order
      feedback: Arcs first to find the points, then join the points with a straight edge.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Imagine drawing the longest side, then swinging the other two from its ends.
  - rung: 2
    name: concept
    text:
      en: The two shorter sides must reach each other, so together they must be longer than the longest side.
  - rung: 3
    name: first_step
    text:
      en: Add 5 and 5.
  - rung: 4
    name: worked_step
    text:
      en: Compare 10 with 13.
  - rung: 5
    name: full_step
    text:
      en: The two shorter sides add to 10, which is not more than 13, so the answer is No.
  misconception_ids:
  - mc.mth.o.construction_measures_with_protractor
  - mc.mth.o.construction_wrong_order
  - mc.mth.o.triangle_inequality_ignored
solution:
  steps:
  - n: 1
    latex: 5 + 5 = 10
    reason: Add the two shorter sides
    check_id: chk_build_mth_geo_0034_s
  - n: 2
    latex: 10 < 13
    reason: Compare with the longest side
