stem: A prism has a triangular cross-section with base 4 cm and height 7 cm. The prism is 20 cm long.
parts:
- id: a
  prompt: Find its volume.
  marks: 2
  answer:
    kind: numeric
    value: '280'
    unit: cm^3
    unit_policy: equivalent
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_mns_0070_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The volume of any prism is the area of its cross-section times its length.
  - rung: 2
    name: concept
    text:
      en: 'The cross-section here is a triangle: ½ × base × height.'
  - rung: 3
    name: first_step
    text:
      en: Area = ½ × 4 × 7.
  - rung: 4
    name: worked_step
    text:
      en: The cross-section is 14 cm². Multiply by 20.
  - rung: 5
    name: full_step
    text:
      en: The volume is 280 cm³.
  misconception_ids:
  - mc.mth.o.prism_triangle_half_dropped
  - mc.mth.o.compound_part_missing
  - mc.mth.o.perimeter_area_confused
solution:
  steps:
  - n: 1
    latex: \text{cross-section} = \tfrac{1}{2} \times 4 \times 7 = 14\ \text{cm}^2
    reason: Area of the triangle
    check_id: chk_build_mth_mns_0070_a
  - n: 2
    latex: V = 14 \times 20 = 280\ \text{cm}^3
    reason: Cross-section times length
    check_id: chk_build_mth_mns_0070_ans
