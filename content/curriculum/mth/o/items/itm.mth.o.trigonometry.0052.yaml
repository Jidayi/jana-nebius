stem: From the top of a cliff 60 m high, the angle of depression of a boat at sea is 43°.
parts:
- id: a
  prompt: Find how far the boat is from the foot of the cliff, to 3 significant figures.
  marks: 3
  answer:
    kind: numeric
    value: '64.3'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_trg_0052_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The angle of depression is measured down from the horizontal at the top of the cliff.
  - rung: 2
    name: concept
    text:
      en: By alternate angles it equals the angle of elevation of the cliff top from the boat.
  - rung: 3
    name: first_step
    text:
      en: 'In the triangle at the boat, 60 m is opposite and the distance is adjacent: use tan.'
  - rung: 4
    name: worked_step
    text:
      en: d = 60 ÷ tan 43°.
  - rung: 5
    name: full_step
    text:
      en: The boat is 64.3 m from the foot of the cliff.
  misconception_ids:
  - mc.mth.o.trig_rearrange_wrong
  - mc.mth.o.depression_from_vertical
  - mc.mth.o.trig_ratio_wrong
solution:
  steps:
  - n: 1
    latex: \tan 43 = \frac{60}{d}
    reason: The angle at the boat equals the angle of depression
  - n: 2
    latex: d = \frac{60}{\tan 43} = 64.3\ \text{m}
    reason: Rearrange
    check_id: chk_build_mth_trg_0052_ans
