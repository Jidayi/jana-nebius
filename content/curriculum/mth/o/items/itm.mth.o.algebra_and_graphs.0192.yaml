id: itm.mth.o.algebra_and_graphs.0192
version: 0.1.1
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.linear_inequalities
stem: The integer x satisfies $-6 < 3x + 3 \leq 12$.
parts:
- id: a
  prompt: How many integer values of x are there?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '6'
      correct: true
    - id: B
      text: '7'
      correct: false
      misconception_id: mc.mth.o.inequality_boundary
      feedback: < and > leave the boundary out; ≤ and ≥ include it. Test the boundary value in the original inequality.
    - id: C
      text: '5'
      correct: false
      misconception_id: mc.mth.o.inequality_no_flip
      feedback: 2 < 3, but after multiplying by −1 we get −2 > −3. Dividing by a negative number reverses the inequality.
    - id: D
      text: '0'
      correct: false
      misconception_id: mc.mth.o.rearrange_inverse_sign
      feedback: 'Do the same to both sides: to remove + u, subtract u from both sides.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Do the same thing to all three parts of the inequality.
  - rung: 2
    name: concept
    text:
      en: Subtract 3 from every part, then divide every part by 3.
  - rung: 3
    name: first_step
    text:
      en: Find the two boundary values for x.
  - rung: 4
    name: worked_step
    text:
      en: You should get -3 < x ≤ 3. Which end is included?
  - rung: 5
    name: full_step
    text:
      en: 'List the integers from just above -3 up to 3: there are 6 of them.'
  misconception_ids:
  - mc.mth.o.inequality_boundary
  - mc.mth.o.inequality_no_flip
  - mc.mth.o.rearrange_inverse_sign
solution:
  steps:
  - n: 1
    latex: -6 < 3x + 3 \leq 12
    reason: The double inequality
  - n: 2
    latex: -3 < x \leq 3
    reason: Solve both parts together
    check_id: chk_build_mth_alg_0192_b1
  - n: 3
    latex: \text{count} = 6
    reason: 'Count the integers: the lower end is left out, the upper end included'
    check_id: chk_build_mth_alg_0192_ans
