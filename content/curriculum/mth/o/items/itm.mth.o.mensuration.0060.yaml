stem: A sector has radius 9 cm and angle 60° at the centre.
parts:
- id: a
  prompt: Find the length of its arc, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 9.42 cm
      correct: true
    - id: B
      text: 56.5 cm
      correct: false
      misconception_id: mc.mth.o.sector_fraction_dropped
      feedback: A sector with angle θ is θ/360 of the whole circle.
    - id: C
      text: 42.4 cm
      correct: false
      misconception_id: mc.mth.o.circumference_area_confused
      feedback: 'Area is in square units, so its formula has r²: A = πr². The circumference is a length: C = 2πr.'
    - id: D
      text: 18.8 cm
      correct: false
      misconception_id: mc.mth.o.sector_fraction_180
      feedback: A full turn is 360°, so the fraction is the angle over 360.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: An arc is part of the circumference.
  - rung: 2
    name: concept
    text:
      en: The arc is 60/360 of the whole circumference.
  - rung: 3
    name: first_step
    text:
      en: The whole circumference is 2 × π × 9.
  - rung: 4
    name: worked_step
    text:
      en: Multiply it by 60/360.
  - rung: 5
    name: full_step
    text:
      en: The arc length is 9.42 cm.
  misconception_ids:
  - mc.mth.o.circumference_area_confused
  - mc.mth.o.sector_fraction_180
  - mc.mth.o.sector_fraction_dropped
solution:
  steps:
  - n: 1
    latex: \text{arc} = \frac{60}{360} \times 2\pi \times 9
    reason: The fraction of the circumference
  - n: 2
    latex: = 9.42\ \text{cm}
    reason: Evaluate and round
    check_id: chk_build_mth_mns_0060_ans
