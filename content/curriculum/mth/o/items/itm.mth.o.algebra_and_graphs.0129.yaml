  - rung: 2
    name: concept
    text:
      en: The y terms have opposite signs, so add the equations to eliminate y.
  - rung: 3
    name: first_step
    text:
      en: Add the left sides and add the right sides.
  - rung: 4
    name: worked_step
    text:
      en: You get 6x = 12. Divide to find x.
  - rung: 5
    name: full_step
    text:
