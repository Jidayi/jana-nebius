id: itm.mth.o.algebra_and_graphs.0222
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.quadratic_sequences
stem: A quadratic sequence begins 4, 11, 22, 37, …
parts:
- id: a
  prompt: Find the coefficient of n² in its nth term.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '4'
      correct: false
      misconception_id: mc.mth.o.second_difference_not_halved
      feedback: For n² the second difference is 2, yet the coefficient is 1. Halve the second difference.
    - id: B
      text: '7'
      correct: false
      misconception_id: mc.mth.o.quadratic_sequence_as_linear
      feedback: The first differences of a quadratic sequence change. Add the second difference to the first differences to continue them.
    - id: C
      text: '2'
      correct: true
    - id: D
      text: '3'
      correct: false
      misconception_id: mc.mth.o.nth_term_off_by_one
      feedback: 'Check with n = 1: your rule must give the first term itself.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the differences between consecutive terms. Are they the same?
  - rung: 2
    name: concept
    text:
      en: For a quadratic sequence the second differences are constant, and the coefficient of n² is half the second difference.
  - rung: 3
    name: first_step
    text:
      en: Work out the first differences, then their differences.
  - rung: 4
    name: worked_step
    text:
      en: The second difference is 4.
  - rung: 5
    name: full_step
    text:
      en: The coefficient of n² is 4 ÷ 2 = 2.
  misconception_ids:
  - mc.mth.o.nth_term_off_by_one
  - mc.mth.o.quadratic_sequence_as_linear
  - mc.mth.o.second_difference_not_halved
solution:
  steps:
  - n: 1
    latex: '\text{first differences: } 7, 11, \ldots'
    reason: Subtract consecutive terms
  - n: 2
    latex: \text{second difference} = 4
    reason: Subtract consecutive first differences
    check_id: chk_build_mth_alg_0222_d
  - n: 3
    latex: \text{coefficient of } n^2 = \frac{4}{2} = 2
    reason: Halve the second difference
    check_id: chk_build_mth_alg_0222_ans
