    args:
      expression: '-2'
    tool: math_evaluate
  chk_build_mth_cal_0040_d:
    args:
      expression: (1)*x^3 + (-3)*x^2 + (-24)*x^1 + (-8)*x^0
      stationary_points: true
      variable: x
    tool: math_differentiate
  chk_build_mth_cal_0040_dd:
    args:
      equations:
      - p = 3*-2*4
      - q = -3*(-2 + 4)
      - r = 6
      unknowns:
      - p
      - q
      - r
    tool: math_solve
  chk_build_mth_cal_0040_sx:
    args:
      equations:
      - 3*x^2 + (-6)*x + (-24) = 0
      unknowns:
      - x
    tool: math_solve
