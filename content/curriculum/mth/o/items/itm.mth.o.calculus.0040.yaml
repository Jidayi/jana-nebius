id: itm.mth.o.calculus.0040
version: 0.1.0
type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.calculus.stationary_points
stem: A curve has equation $y = x^3 - 3x^2 - 24x - 8$.
parts:
- id: a
  prompt: Find the x-coordinate of its maximum point.
  marks: 4
  answer:
    kind: numeric
    value: '-2'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_cal_0040_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Stationary points are where the gradient is zero.
  - rung: 2
    name: concept
    text:
      en: Solve dy/dx = 0, then use the second derivative to tell a maximum from a minimum.
  - rung: 3
    name: first_step
    text:
      en: Differentiate, set the result equal to zero and solve the quadratic.
  - rung: 4
    name: worked_step
    text:
      en: At a maximum the second derivative is negative; at a minimum it is positive.
  - rung: 5
    name: full_step
    text:
      en: The maximum is at x = -2.
  misconception_ids:
  - mc.mth.o.max_min_confused
  - mc.mth.o.stationary_from_y_zero
  - mc.mth.o.gradient_from_y
solution:
  steps:
  - n: 1
    latex: \frac{dy}{dx} = 3x^2 - 6x - 24
    reason: Differentiate
    check_id: chk_build_mth_cal_0040_dd
  - n: 2
    latex: \frac{dy}{dx} = 0 \Rightarrow x = -2 \text{ or } x = 4
    reason: Set the gradient equal to zero
    check_id: chk_build_mth_cal_0040_sx
  - n: 3
    latex: \frac{d^2y}{dx^2} = 6x - 6
    reason: The second derivative decides the nature
  - n: 4
    latex: \text{maximum at } x = -2
    reason: 'Negative second derivative: maximum; positive: minimum'
    check_id: chk_build_mth_cal_0040_d
difficulty:
  prior: 1.2
  band: core
estimated_seconds: 160
