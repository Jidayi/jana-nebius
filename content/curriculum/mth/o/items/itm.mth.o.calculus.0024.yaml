stem: A curve has equation $y = x^2 + 6x$. The tangent to the curve at the point where x = 3 has equation y = mx + c.
parts:
- id: a
  prompt: Find c.
  marks: 4
  answer:
    kind: numeric
    value: '-9'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_cal_0024_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A tangent touches the curve at one point and has the curve's gradient there.
  - rung: 2
    name: concept
    text:
      en: Find the point on the curve, then the gradient from dy/dx, then c from y = mx + c.
  - rung: 3
    name: first_step
    text:
      en: Substitute x = 3 into the curve for y, and into dy/dx for m.
  - rung: 4
    name: worked_step
    text:
      en: y = 27 and m = 12; now solve 27 = m × (3) + c.
  - rung: 5
    name: full_step
    text:
      en: c = -9.
  misconception_ids:
  - mc.mth.o.intercept_sign
  - mc.mth.o.c_as_y_coordinate
  - mc.mth.o.derivative_power_not_brought_down
solution:
  steps:
  - n: 1
    latex: 'y = x^2 + 6x \text{ at } x = 3: y = 27'
    reason: The point of contact
    check_id: chk_build_mth_cal_0024_y
  - n: 2
    latex: m = \frac{dy}{dx} = 12
    reason: Gradient from the derivative
    check_id: chk_build_mth_cal_0024_m
  - n: 3
    latex: c = 27 - 12 \times (3) = -9
    reason: Substitute the point into y = mx + c
    check_id: chk_build_mth_cal_0024_ans
