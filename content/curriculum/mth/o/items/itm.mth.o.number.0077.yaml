    latex: \frac{2}{9} \div \frac{1}{4} = \frac{2}{9} \times \frac{4}{1}
    reason: Multiply by the reciprocal of the second fraction
  - n: 2
    latex: = \frac{8}{9}
    reason: Multiply across
