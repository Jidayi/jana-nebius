id: itm.mth.o.algebra_and_graphs.0034
version: 0.1.0
type: mcq
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.factorise_common
stem: Factorise completely $30x^2 - 66x$.
parts:
- id: a
  prompt: Choose the complete factorisation.
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: $x(30x - 66)$
      correct: false
      misconception_id: mc.mth.o.factorise_not_fully
      feedback: 'Check the bracket at the end: if its terms still share a number or a letter, take that out too.'
    - id: B
      text: $6x(5x - 66)$
      correct: false
      misconception_id: mc.mth.o.factor_one_term_only
      feedback: Expand your answer to check it. Every term inside the bracket must be divided by the factor you took out.
    - id: C
      text: $6x(5x - 11)$
      correct: true
    - id: D
      text: $6(5x^2 - 11x)$
      correct: false
      misconception_id: mc.mth.o.factorise_not_fully
      feedback: 'Check the bracket at the end: if its terms still share a number or a letter, take that out too.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Find what the two terms have in common: a number and a letter.'
  - rung: 2
    name: concept
    text:
      en: Take out the highest common factor of the numbers and the letters, then divide each term by it.
  - rung: 3
    name: first_step
    text:
      en: The highest common factor of 30 and 66 goes in front, together with x.
  - rung: 4
    name: worked_step
    text:
      en: The common factor is 6x. Divide 30x² and 66x by it.
  - rung: 5
    name: full_step
    text:
      en: The complete factorisation is $6x(5x - 11)$.
  misconception_ids:
  - mc.mth.o.factor_one_term_only
  - mc.mth.o.factorise_not_fully
solution:
  steps:
  - n: 1
    latex: \text{HCF of } 30x^2 \text{ and } 66x = 6x
    reason: Largest number and letter in both terms
    check_id: chk_build_mth_alg_0034_hcf
  - n: 2
    latex: 30x^2 - 66x = 6x(5x - 11)
    reason: Divide each term by the HCF
    check_id: chk_build_mth_alg_0034_t
