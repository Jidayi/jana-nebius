  hints:
  - rung: 1
    name: orient
    text:
      en: The gradient measures how steep the line is.
  - rung: 2
    name: concept
    text:
      en: Gradient = change in y ÷ change in x.
  - rung: 3
    name: first_step
    text:
      en: Change in y = 16 − (6); change in x = 5 − (0).
  - rung: 4
    name: worked_step
    text:
      en: The changes are 10 and 5.
  - rung: 5
    name: full_step
    text:
      en: The gradient is 2.
