  - n: 1
    latex: m = \frac{y_2 - y_1}{x_2 - x_1}
    reason: Change in y over change in x
  - n: 2
    latex: m = \frac{16 - (6)}{5 - (0)} = \frac{10}{5} = 2
    reason: Same order on top and bottom
