  hints:
  - rung: 1
    name: orient
    text:
      en: Litres are a bigger unit than cubic centimetres.
  - rung: 2
    name: concept
    text:
      en: One litre is the same as 1000 cm³.
  - rung: 3
    name: first_step
    text:
      en: To change to the bigger unit, divide.
  - rung: 4
    name: worked_step
    text:
      en: Work out 12000 ÷ 1000.
  - rung: 5
    name: full_step
    text:
      en: 12000 cm³ = 12 litres.
  misconception_ids:
