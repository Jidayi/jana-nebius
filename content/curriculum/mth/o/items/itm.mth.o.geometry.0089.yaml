stem: Two similar photographs have heights 3 cm and 5 cm. The smaller one has an area of 36 cm².
parts:
- id: a
  prompt: Find the area of the larger one.
  marks: 3
  answer:
    kind: numeric
    value: '100'
    unit: cm^2
    unit_policy: equivalent
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_geo_0089_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the length scale factor first.
  - rung: 2
    name: concept
    text:
      en: For similar shapes, areas change by the square of the length scale factor.
  - rung: 3
    name: first_step
    text:
      en: The length scale factor is 5 ÷ 3.
  - rung: 4
    name: worked_step
    text:
      en: The area factor is 2.78.
  - rung: 5
    name: full_step
    text:
      en: The larger area is 36 × 2.78 = 100.
  misconception_ids:
