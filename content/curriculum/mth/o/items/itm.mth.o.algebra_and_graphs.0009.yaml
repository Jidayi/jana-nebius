stem: The area of a trapezium is $A = \tfrac{1}{2}(a + b)h$. The parallel sides are a = 9 cm and b = 8 cm, and the height is h = 6 cm.
parts:
- id: a
  prompt: Find the area A.
  marks: 2
  answer:
    kind: numeric
    value: '51'
    unit: cm^2
    unit_policy: equivalent
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_alg_0009_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Put the three values into the formula in place of a, b and h.
  - rung: 2
    name: concept
    text:
      en: Work out the bracket first, then multiply by h and halve.
  - rung: 3
    name: first_step
    text:
      en: a + b = 9 + 8.
  - rung: 4
    name: worked_step
    text:
      en: a + b = 17. Now work out ½ × 17 × 6.
  - rung: 5
    name: full_step
    text:
      en: A = ½ × 17 × 6 = 51 cm².
  misconception_ids:
  - mc.mth.o.formula_half_dropped
  - mc.mth.o.brackets_ignored
  - mc.mth.o.sum_as_product
solution:
  steps:
  - n: 1
    latex: A = \tfrac{1}{2}(a + b)h
    reason: The formula
  - n: 2
    latex: A = \tfrac{1}{2}(9 + 8) \times 6
    reason: Substitute
  - n: 3
    latex: A = \tfrac{1}{2} \times 17 \times 6
    reason: Bracket first
    check_id: chk_build_mth_alg_0009_s
  - n: 4
    latex: A = 51\ \text{cm}^2
    reason: Multiply
    check_id: chk_build_mth_alg_0009_ans
