stem: The probability that a seed from packet A grows is 0.4. The probability that a seed from packet B grows is 0.3. The two events are independent.
parts:
- id: a
  prompt: Find the probability that at least one of them happens.
  marks: 3
  answer:
    kind: numeric
    value: '0.58'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_prb_0034_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: '''At least one'' covers several cases. Which single case is left out?'
  - rung: 2
    name: concept
    text:
      en: P(at least one) = 1 − P(neither).
  - rung: 3
    name: first_step
    text:
      en: P(neither) = (1 − 0.4) × (1 − 0.3).
  - rung: 4
    name: worked_step
    text:
      en: P(neither) = 0.42; subtract it from 1.
  - rung: 5
    name: full_step
    text:
      en: P(at least one) = 0.58.
  misconception_ids:
  - mc.mth.o.at_least_one_added
  - mc.mth.o.complement_of_both
  - mc.mth.o.and_as_add
solution:
  steps:
  - n: 1
    latex: P(\text{neither}) = (1 - 0.4)(1 - 0.3) = 0.42
    reason: Both fail to happen
    check_id: chk_build_mth_prb_0034_n
  - n: 2
    latex: P(\text{at least one}) = 1 - 0.42 = 0.58
    reason: Everything except neither
    check_id: chk_build_mth_prb_0034_ans
