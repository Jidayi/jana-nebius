id: itm.mth.o.statistics.0130
version: 0.1.0
type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.statistics.histograms
stem: In a frequency table, the class 20 < x ≤ 40 has frequency 60.
parts:
- id: a
  prompt: Find the frequency density for a histogram.
  marks: 2
  answer:
    kind: numeric
    value: '3'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_sta_0130_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: In a histogram with unequal widths, the height is not the frequency.
  - rung: 2
    name: concept
    text:
      en: Frequency density = frequency ÷ class width.
  - rung: 3
    name: first_step
    text:
      en: The class width is 40 − 20.
  - rung: 4
    name: worked_step
    text:
      en: Divide 60 by the width.
  - rung: 5
    name: full_step
    text:
      en: The frequency density is 3.
  misconception_ids:
  - mc.mth.o.density_multiplied
  - mc.mth.o.class_width_wrong
  - mc.mth.o.pie_angle_inverted
solution:
  steps:
  - n: 1
    latex: \text{width} = 40 - 20
    reason: Class width
  - n: 2
    latex: \text{density} = \frac{60}{20} = 3
    reason: Frequency over width
    check_id: chk_build_mth_sta_0130_ans
