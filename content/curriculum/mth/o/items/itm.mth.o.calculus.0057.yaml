stem: Evaluate $\int_{1}^{3} (3x^2 - 4x + 7)\,dx$.
parts:
- id: a
  prompt: Give the exact value.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '12'
      correct: false
      misconception_id: mc.mth.o.integrate_by_differentiating
      feedback: To integrate xⁿ, add one to the power and divide by the new power.
    - id: B
      text: '24'
      correct: true
    - id: C
      text: '60'
      correct: false
      misconception_id: mc.mth.o.integral_power_not_divided
      feedback: '∫xⁿ dx = xⁿ⁺¹ ÷ (n + 1): check by differentiating your answer.'
    - id: D
      text: '-24'
      correct: false
      misconception_id: mc.mth.o.integral_limits_reversed
      feedback: 'Top limit first: [F(x)] from a to b = F(b) − F(a).'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'A definite integral is evaluated in two stages: integrate, then substitute the limits.'
  - rung: 2
    name: concept
    text:
      en: 'Integrate each term: xⁿ becomes xⁿ⁺¹ ÷ (n + 1).'
  - rung: 3
    name: first_step
    text:
      en: Write F(x), then work out F(3) and F(1).
  - rung: 4
    name: worked_step
    text:
      en: F(3) = 30 and F(1) = 6.
  - rung: 5
    name: full_step
    text:
      en: The integral is 24.
  misconception_ids:
  - mc.mth.o.integral_limits_reversed
  - mc.mth.o.integral_power_not_divided
  - mc.mth.o.integrate_by_differentiating
solution:
  steps:
  - n: 1
    latex: \int x^n\,dx = \frac{x^{n+1}}{n+1}
    reason: Raise each power by one and divide by the new power
  - n: 2
    latex: F(3) = 30,\ F(1) = 6
    reason: Substitute the limits
    check_id: chk_build_mth_cal_0057_fb
  - n: 3
    latex: F(3) - F(1) = 24
    reason: Top limit minus bottom limit
    check_id: chk_build_mth_cal_0057_ig
