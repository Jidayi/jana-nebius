subject: mth
level: o
kc_ids:
- kc.mth.o.mensuration.circle_measures
stem: A circle has radius 6 cm.
parts:
- id: a
  prompt: Find its area, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 452 cm²
      correct: false
      misconception_id: mc.mth.o.diameter_for_radius
      feedback: The radius is half the diameter. Halve the diameter before using πr².
    - id: B
      text: 37.7 cm²
      correct: false
      misconception_id: mc.mth.o.circumference_area_confused
      feedback: 'Area is in square units, so its formula has r²: A = πr². The circumference is a length: C = 2πr.'
    - id: C
      text: 18.8 cm²
      correct: false
      misconception_id: mc.mth.o.radius_not_squared
      feedback: 'Area needs two lengths multiplied: π × r × r.'
    - id: D
      text: 113 cm²
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The area formula uses the radius.
  - rung: 2
    name: concept
    text:
      en: Area of a circle = π × radius².
  - rung: 3
    name: first_step
    text:
      en: Square 6 first.
  - rung: 4
    name: worked_step
    text:
      en: Work out π × 6².
  - rung: 5
    name: full_step
    text:
      en: The area is 113 cm².
  misconception_ids:
  - mc.mth.o.circumference_area_confused
  - mc.mth.o.diameter_for_radius
  - mc.mth.o.radius_not_squared
solution:
  steps:
  - n: 1
    latex: A = \pi r^2
    reason: Area of a circle
  - n: 2
    latex: A = \pi \times 6^2 = 113\ \text{cm}^2
    reason: Substitute and round
    check_id: chk_build_mth_mns_0043_ans
