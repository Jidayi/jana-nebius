stem: A straight line passes through A(2, -5) and B(-2, 5).
parts:
- id: a
  prompt: Find its gradient.
  marks: 2
  answer:
    kind: numeric
    value: '-2.5'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_crd_0032_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The gradient measures how steep the line is.
  - rung: 2
    name: concept
    text:
      en: Gradient = change in y ÷ change in x.
  - rung: 3
    name: first_step
    text:
      en: Change in y = 5 − (-5); change in x = -2 − (2).
  - rung: 4
    name: worked_step
    text:
      en: The changes are 10 and −4.
  - rung: 5
    name: full_step
    text:
      en: The gradient is -2.5.
  misconception_ids:
  - mc.mth.o.gradient_inverted
  - mc.mth.o.gradient_order_mixed
  - mc.mth.o.graph_one_point
solution:
  steps:
  - n: 1
    latex: m = \frac{y_2 - y_1}{x_2 - x_1}
    reason: Change in y over change in x
  - n: 2
    latex: m = \frac{5 - (-5)}{-2 - (2)} = \frac{10}{-\,4} = -2.5
    reason: Same order on top and bottom
    check_id: chk_build_mth_crd_0032_ans
