stem: In a class of 50 students, 20 own a bicycle, 16 own a phone and 6 do both. Let A be the set of students who own a bicycle and B the set who own a phone.
parts:
- id: a
  prompt: Find n(A ∪ B), the number who do at least one of them.
  marks: 2
  answer:
    kind: numeric
    value: '30'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_num_0048_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Draw a Venn diagram with two overlapping circles.
  - rung: 2
    name: concept
    text:
      en: Students who do both are inside both circles, so adding n(A) and n(B) counts them twice.
  - rung: 3
    name: first_step
    text:
      en: Put 6 in the overlap first.
  - rung: 4
    name: worked_step
    text:
      en: Add 20 and 16, then take away the 6 counted twice.
  - rung: 5
    name: full_step
    text:
      en: n(A ∪ B) = 20 + 16 − 6 = 30.
  misconception_ids:
  - mc.mth.o.venn_double_count
  - mc.mth.o.venn_only_includes_overlap
  - mc.mth.o.venn_complement_wrong
solution:
  steps:
  - n: 1
    latex: n(A \cup B) = n(A) + n(B) - n(A \cap B)
    reason: The overlap is counted in both sets
  - n: 2
    latex: = 20 + 16 - 6 = 30
    reason: Substitute
    check_id: chk_build_mth_num_0048_ans
