  chk_build_mth_alg_0052_final:
    args:
      equations:
      - p = abs(-9)
      - q = abs(-6)
      unknowns:
      - p
      - q
    tool: math_solve
  chk_build_mth_alg_0052_m:
    args:
      equations:
      - p = abs((-9)*(-6))
      - q = abs((-9) + (-6))
      unknowns:
      - p
      - q
    tool: math_solve
  chk_build_mth_alg_0052_roots:
    args:
      equations:
      - x^2 + (-15)*x + (54) = 0
      unknowns:
      - x
    tool: math_solve
