solution:
  steps:
  - n: 1
    latex: PQ^2 = (x_2 - x_1)^2 + (y_2 - y_1)^2
    reason: Pythagoras on the changes
  - n: 2
    latex: PQ^2 = (-\,3)^2 + (5)^2 = 34
    reason: Square and add
    check_id: chk_build_mth_crd_0066_s
  - n: 3
    latex: PQ = \sqrt{34} = 5.83
    reason: Square root
    check_id: chk_build_mth_crd_0066_ans
