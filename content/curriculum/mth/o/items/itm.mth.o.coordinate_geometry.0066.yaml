    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_crd_0066_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Sketch the two points: the segment is the hypotenuse of a right-angled triangle.'
  - rung: 2
    name: concept
    text:
      en: The other two sides are the change in x and the change in y.
  - rung: 3
    name: first_step
    text:
      en: Change in x = 0 − (3); change in y = 5 − (0).
  - rung: 4
    name: worked_step
    text:
      en: 'Square both changes and add: 34. Then take the square root.'
  - rung: 5
    name: full_step
    text:
      en: PQ = 5.83.
  misconception_ids:
