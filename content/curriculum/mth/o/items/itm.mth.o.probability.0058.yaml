stem: A bag holds 3 red and 8 blue counters. Two counters are taken out, one after the other, without replacement.
parts:
- id: a
  prompt: Find the probability that one is red and one is blue. Give your answer to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '0.397'
      correct: false
      misconception_id: mc.mth.o.without_replacement_ignored
      feedback: After one item is taken, there is one fewer item in the bag, and one fewer of that colour if it was that colour.
    - id: B
      text: '0.218'
      correct: false
      misconception_id: mc.mth.o.and_as_add
      feedback: 'Two coins both landing heads is less likely than one: ½ × ½ = ¼, not ½ + ½ = 1.'
    - id: C
      text: '0.436'
      correct: true
    - id: D
      text: '1.07'
      correct: false
      misconception_id: mc.mth.o.denominator_not_reduced
      feedback: Taking an item out reduces the total as well.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Draw a tree diagram: the second set of branches depends on the first pick.'
  - rung: 2
    name: concept
    text:
      en: Without replacement, the second probability has one fewer counter in the total.
  - rung: 3
    name: first_step
    text:
      en: 'There are two orders: red then blue, and blue then red. Each second pick is out of one fewer counter.'
  - rung: 4
    name: worked_step
    text:
      en: Multiply along each path, then add the paths you need.
  - rung: 5
    name: full_step
    text:
      en: The probability is 0.436.
  misconception_ids:
