  - n: 1
    latex: \text{total} = 11,\ \text{then } 10 \text{ after one is taken}
    reason: Count the counters before and after the first pick
    check_id: chk_build_mth_prb_0058_tot
  - n: 2
    latex: \frac{3}{11} \times \frac{8}{11 - 1} + \frac{8}{11} \times \frac{3}{11 - 1}
    reason: Red then blue, or blue then red
