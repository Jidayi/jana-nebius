stem: A tangent touches a circle with centre O at point T. A point P on the tangent is joined to O, and angle OPT = 22°.
parts:
- id: a
  prompt: Find angle TOP.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 158°
      correct: false
      misconception_id: mc.mth.o.tangent_radius_not_right
      feedback: A tangent touches the circle at one point and is at 90° to the radius there.
    - id: B
      text: 22°
      correct: false
      misconception_id: mc.mth.o.centre_angle_halved
      feedback: The angle at the centre is twice the angle at the circumference standing on the same arc.
    - id: C
      text: 112°
      correct: false
      misconception_id: mc.mth.o.semicircle_not_right
      feedback: An angle drawn from the two ends of a diameter to the circle is always 90°.
    - id: D
      text: 68°
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: OT is a radius and PT lies along the tangent.
