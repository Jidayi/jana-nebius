    name: concept
    text:
      en: The tangent meets the radius at 90°.
  - rung: 3
    name: first_step
    text:
      en: So triangle OTP has a right angle at T.
  - rung: 4
    name: worked_step
    text:
      en: 'The other two angles add to 90°: subtract 22.'
  - rung: 5
    name: full_step
    text:
