  hints:
  - rung: 1
    name: orient
    text:
      en: gf(x) means g(f(x)). Which function is applied first?
  - rung: 2
    name: concept
    text:
      en: Work out f of the number first, then put that answer into g.
  - rung: 3
    name: first_step
    text:
      en: f(2) = 2 × (2) + 2.
  - rung: 4
    name: worked_step
    text:
      en: f(2) = 6. Now find g(6).
  - rung: 5
    name: full_step
    text:
      en: gf(2) = 34.
  misconception_ids:
