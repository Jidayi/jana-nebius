stem: The line $y = 3x - 12$ is drawn on a grid.
parts:
- id: a
  prompt: Find the x-coordinate where it crosses the x-axis.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '-4'
      correct: false
      misconception_id: mc.mth.o.intercept_sign
      feedback: 'Solve 0 = mx + c carefully: mx = −c, so x = −c/m.'
