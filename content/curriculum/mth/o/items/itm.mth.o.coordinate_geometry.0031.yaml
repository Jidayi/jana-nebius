      text: '-12'
      correct: false
      misconception_id: mc.mth.o.c_as_x_intercept
      feedback: c is where the line crosses the y-axis, because that is where x = 0.
    - id: C
      text: '0.25'
      correct: false
      misconception_id: mc.mth.o.gradient_inverted
      feedback: 'Gradient = change in y ÷ change in x: how far up for each step across.'
