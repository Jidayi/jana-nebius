id: itm.mth.o.algebra_and_graphs.0084
version: 0.1.0
type: mcq
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.algebraic_fractions
stem: Write $\frac{5}{x} + \frac{3}{x + 4}$ as a single fraction.
parts:
- id: a
  prompt: Choose the correct single fraction.
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: $\frac{8x + 20}{x(x + 4)}$
      correct: true
    - id: B
      text: $\frac{8}{2x + 4}$
      correct: false
      misconception_id: mc.mth.o.add_tops_and_bottoms
      feedback: One half plus one half is one, not two quarters. Fractions need a common denominator before you add the numerators.
    - id: C
      text: $\frac{8}{x(x + 4)}$
      correct: false
      misconception_id: mc.mth.o.numerator_not_scaled
      feedback: Whatever you multiply the bottom by, multiply the top by too, so each fraction keeps its value.
    - id: D
      text: $\frac{8x + 4}{x(x + 4)}$
      correct: false
      misconception_id: mc.mth.o.expand_first_term_only
      feedback: 'The number outside multiplies every term inside: 3(x + 4) = 3x + 12, not 3x + 4.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: To add fractions you need a common denominator.
  - rung: 2
    name: concept
    text:
      en: The simplest common denominator here is the product of the two denominators.
  - rung: 3
    name: first_step
    text:
      en: Multiply the top and bottom of the first fraction by (x + 4), and the second by x.
  - rung: 4
    name: worked_step
    text:
      en: The top becomes 5(x + 4) + 3x. Expand and collect.
  - rung: 5
    name: full_step
    text:
      en: The single fraction is $\frac{8x + 20}{x(x + 4)}$.
  misconception_ids:
  - mc.mth.o.add_tops_and_bottoms
  - mc.mth.o.expand_first_term_only
  - mc.mth.o.numerator_not_scaled
solution:
  steps:
  - n: 1
    latex: \frac{5(x + 4)}{x(x + 4)} + \frac{3x}{x(x + 4)}
    reason: Use the common denominator x(x + 4)
  - n: 2
    latex: = \frac{5x + 20 + 3x}{x(x + 4)}
    reason: Expand the top
    check_id: chk_build_mth_alg_0084_t
  - n: 3
    latex: = \frac{8x + 20}{x(x + 4)}
    reason: Collect like terms
    check_id: chk_build_mth_alg_0084_final
