id: itm.mth.o.geometry.0090
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.geometry.similar_area_volume
stem: Two similar jugs have heights 3 cm and 5 cm. The smaller one has a volume of 40 cm³.
parts:
- id: a
  prompt: Find the volume of the larger one.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 66.7 cm³
      correct: false
      misconception_id: mc.mth.o.similar_length_factor_for_area
      feedback: 'Doubling every length of a square makes four copies of it: the area factor is the square.'
    - id: B
      text: 111 cm³
      correct: false
      misconception_id: mc.mth.o.similar_area_factor_for_volume
      feedback: Volume has three dimensions, so the volume factor is the length factor cubed.
    - id: C
      text: 185 cm³
      correct: true
    - id: D
      text: 8.64 cm³
      correct: false
      misconception_id: mc.mth.o.similar_factor_inverted
      feedback: Scale factor = new length ÷ old length. Going to the larger shape, lengths get bigger.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the length scale factor first.
  - rung: 2
    name: concept
    text:
      en: For similar shapes, volumes change by the cube of the length scale factor.
  - rung: 3
    name: first_step
    text:
      en: The length scale factor is 5 ÷ 3.
  - rung: 4
    name: worked_step
    text:
      en: The volume factor is 4.63.
  - rung: 5
    name: full_step
    text:
      en: The larger volume is 40 × 4.63 = 185.
  misconception_ids:
  - mc.mth.o.similar_area_factor_for_volume
  - mc.mth.o.similar_factor_inverted
  - mc.mth.o.similar_length_factor_for_area
solution:
  steps:
  - n: 1
    latex: k = \frac{5}{3}
    reason: Length scale factor
    check_id: chk_build_mth_geo_0090_k
  - n: 2
    latex: \text{volume factor} = k^3 = 4.63
    reason: Volumes scale by k^3
    check_id: chk_build_mth_geo_0090_f
  - n: 3
    latex: 40 \times 4.63 = 185
    reason: Multiply
    check_id: chk_build_mth_geo_0090_ans
