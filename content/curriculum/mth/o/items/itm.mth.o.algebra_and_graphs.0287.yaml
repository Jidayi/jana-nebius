    text:
      en: The turning point of a parabola lies on its line of symmetry.
  - rung: 2
    name: concept
    text:
      en: Completing the square, x² + bx + c = (x + b/2)² + …, puts the turning point at x = −b/2.
  - rung: 3
    name: first_step
    text:
      en: Here b = 2.
  - rung: 4
    name: worked_step
    text:
      en: x = −(2) ÷ 2.
  - rung: 5
    name: full_step
    text:
      en: x = -1.
