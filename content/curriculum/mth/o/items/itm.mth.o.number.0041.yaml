      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_num_0041_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Draw the Venn diagram and fill in the overlap first.
  - rung: 2
    name: concept
    text:
      en: The 'A only' region is circle A without the overlap.
  - rung: 3
    name: first_step
    text:
      en: The overlap holds 4.
  - rung: 4
    name: worked_step
    text:
      en: A only = 14 − 4.
  - rung: 5
    name: full_step
    text:
      en: A only = 14 − 4 = 10.
  misconception_ids:
