stem: The area of a trapezium is $A = \tfrac{1}{2}(a + b)h$. The parallel sides are a = 9 cm and b = 15 cm, and the height is h = 6 cm.
parts:
- id: a
  prompt: Find the area A.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 72 cm²
      correct: true
    - id: B
      text: 144 cm²
      correct: false
      misconception_id: mc.mth.o.formula_half_dropped
      feedback: Read the formula one symbol at a time and tick each one off as you substitute; the ½ multiplies everything that follows it.
    - id: C
      text: 94.5 cm²
      correct: false
      misconception_id: mc.mth.o.brackets_ignored
      feedback: 'A bracket is one quantity: work it out first, then multiply the whole result.'
    - id: D
      text: 405 cm²
      correct: false
      misconception_id: mc.mth.o.sum_as_product
      feedback: 'Read each sign in the formula: + means add, even when the letters sit next to brackets.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Put the three values into the formula in place of a, b and h.
  - rung: 2
    name: concept
    text:
      en: Work out the bracket first, then multiply by h and halve.
  - rung: 3
    name: first_step
    text:
      en: a + b = 9 + 15.
  - rung: 4
    name: worked_step
    text:
      en: a + b = 24. Now work out ½ × 24 × 6.
  - rung: 5
    name: full_step
    text:
      en: A = ½ × 24 × 6 = 72 cm².
  misconception_ids:
  - mc.mth.o.brackets_ignored
  - mc.mth.o.formula_half_dropped
  - mc.mth.o.sum_as_product
