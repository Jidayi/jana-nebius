id: itm.mth.o.algebra_and_graphs.0314
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.function_notation
stem: The functions f and g are given by $f(x) = 3x + 2$ and $g(x) = x^2 - 2$.
parts:
- id: a
  prompt: Find gf(2).
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '8'
      correct: false
      misconception_id: mc.mth.o.composite_order_reversed
      feedback: 'fg(x) means f(g(x)): the function next to x acts first, so do g, then f.'
    - id: B
      text: '16'
      correct: false
      misconception_id: mc.mth.o.composite_as_product
      feedback: fg(x) feeds the output of g into f; it is not a multiplication.
    - id: C
      text: '62'
      correct: true
    - id: D
      text: '14'
      correct: false
      misconception_id: mc.mth.o.multiply_before_power
      feedback: The power belongs only to the letter next to it. Square x first, then multiply by the number in front.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: gf(x) means g(f(x)). Which function is applied first?
  - rung: 2
    name: concept
    text:
      en: Work out f of the number first, then put that answer into g.
  - rung: 3
    name: first_step
    text:
      en: f(2) = 3 × (2) + 2.
  - rung: 4
    name: worked_step
    text:
      en: f(2) = 8. Now find g(8).
  - rung: 5
    name: full_step
    text:
      en: gf(2) = 62.
  misconception_ids:
  - mc.mth.o.composite_as_product
  - mc.mth.o.composite_order_reversed
  - mc.mth.o.multiply_before_power
solution:
  steps:
  - n: 1
    latex: f(2) = 3 \times (2) + 2 = 8
    reason: The function next to x acts first
    check_id: chk_build_mth_alg_0314_f
  - n: 2
    latex: g(8) = (8)^2 - 2 = 62
    reason: Then apply g
    check_id: chk_build_mth_alg_0314_ans
