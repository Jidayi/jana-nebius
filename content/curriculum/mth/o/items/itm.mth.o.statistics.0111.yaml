id: itm.mth.o.statistics.0111
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.statistics.scatter_correlation
stem: A line of best fit on a scatter diagram of mark (y) against hours of revision (x) passes through (20, 40) and (60, 95).
parts:
- id: a
  prompt: Use the line to estimate the mark for 35 hours of revision.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '16.4'
      correct: false
      misconception_id: mc.mth.o.best_fit_read_wrong_axis
      feedback: Check which axis the given value belongs to before you use the line.
    - id: B
      text: '50.9'
      correct: false
      misconception_id: mc.mth.o.gradient_inverted
      feedback: 'Gradient = change in y ÷ change in x: how far up for each step across.'
    - id: C
      text: '35'
      correct: false
      misconception_id: mc.mth.o.coordinates_swapped
      feedback: 'A point is written (x, y): along first, then up.'
    - id: D
      text: '60.625'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The line of best fit models the relationship; read the estimate from it.
  - rung: 2
    name: concept
    text:
      en: Find the gradient from the two points, then go along the line to the given x.
  - rung: 3
    name: first_step
    text:
      en: Gradient = (95 − 40) ÷ (60 − 20).
  - rung: 4
    name: worked_step
    text:
      en: The gradient is 1.375; the x-value is 35 − 20 beyond the first point.
  - rung: 5
    name: full_step
    text:
      en: The estimated mark is 60.625.
  misconception_ids:
  - mc.mth.o.best_fit_read_wrong_axis
  - mc.mth.o.coordinates_swapped
  - mc.mth.o.gradient_inverted
solution:
  steps:
  - n: 1
    latex: m = \frac{95 - 40}{60 - 20} = 1.375
    reason: Gradient of the line
    check_id: chk_build_mth_sta_0111_m
  - n: 2
    latex: y = 40 + 1.375 \times (35 - 20) = 60.625
    reason: Move along the line from the first point
    check_id: chk_build_mth_sta_0111_ans
