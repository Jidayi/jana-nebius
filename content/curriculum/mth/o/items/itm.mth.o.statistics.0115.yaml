- kc.mth.o.statistics.cumulative_frequency
stem: 'The masses (kg) of 69 parcels are summarised in a cumulative frequency table: none under 0; up to 20: 15; up to 40: 32; up to 60: 46; up to 80: 53; up to 100: 69.'
parts:
- id: a
  prompt: Estimate the median mass, to 3 significant figures, by interpolating within the class.
  marks: 3
  answer:
    kind: numeric
    value: '43.6'
    unit: null
    unit_policy: none
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_sta_0115_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The median is the value halfway through the data.
  - rung: 2
    name: concept
    text:
      en: Find half the total frequency, then the class where the cumulative frequency passes it.
  - rung: 3
    name: first_step
    text:
      en: Half of 69 is 34.5.
  - rung: 4
    name: worked_step
    text:
      en: The median lies in the class 40 to 60; work out how far into it.
  - rung: 5
    name: full_step
    text:
      en: The median is about 43.6 kg.
  misconception_ids:
  - mc.mth.o.median_class_midpoint
  - mc.mth.o.median_position_as_value
  - mc.mth.o.iqr_as_quartile
solution:
  steps:
  - n: 1
    latex: \frac{69}{2} = 34.5
    reason: Position of the median
    check_id: chk_build_mth_sta_0115_h
  - n: 2
    latex: \text{class frequency} = 46 - 32 = 14
    reason: Parcels in the median class
    check_id: chk_build_mth_sta_0115_f
  - n: 3
    latex: \text{median} \approx 40 + \frac{34.5 - 32}{14} \times 20 = 43.6
    reason: Interpolate in the median class
    check_id: chk_build_mth_sta_0115_ans
