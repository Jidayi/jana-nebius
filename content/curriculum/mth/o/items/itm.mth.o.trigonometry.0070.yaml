  - mc.mth.o.trig_ratio_wrong
  - mc.mth.o.calculator_radians
solution:
  steps:
  - n: 1
    latex: \frac{b}{\sin B} = \frac{a}{\sin A}
    reason: The sine rule
  - n: 2
    latex: b = \frac{9 \sin 35}{\sin 50} = 6.74\ \text{cm}
    reason: Rearrange and evaluate
    check_id: chk_build_mth_trg_0070_ans
