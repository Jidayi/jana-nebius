stem: In triangle ABC, angle A = 50°, angle B = 35° and side a = BC = 9 cm.
parts:
- id: a
  prompt: Find side b = AC, to 3 significant figures.
  marks: 3
  answer:
    kind: numeric
    value: '6.74'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_trg_0070_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You know two angles and the side opposite one of them.
  - rung: 2
    name: concept
    text:
      en: The sine rule pairs each side with the sine of the angle opposite it.
  - rung: 3
    name: first_step
    text:
      en: b is opposite B = 35° and a is opposite A = 50°.
  - rung: 4
    name: worked_step
    text:
      en: b = 9 × sin 35° ÷ sin 50°.
  - rung: 5
    name: full_step
    text:
      en: b = 6.74 cm.
  misconception_ids:
