- kc.mth.o.number.venn_counting
stem: In a class of 32 students, 20 take art, 9 take music and 3 do both. Let A be the set of students who take art and B the set who take music.
parts:
- id: a
  prompt: How many students take art only (and do not take music)?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '17'
      correct: true
    - id: B
      text: '20'
      correct: false
      misconception_id: mc.mth.o.venn_only_includes_overlap
      feedback: '''A only'' is the part of circle A outside circle B: n(A) minus the overlap.'
    - id: C
      text: '23'
      correct: false
      misconception_id: mc.mth.o.venn_double_count
      feedback: 'Shade A, then shade B: the middle region gets shaded twice. Subtract it once.'
    - id: D
      text: '6'
      correct: false
      misconception_id: mc.mth.o.venn_complement_wrong
      feedback: Find n(A ∪ B) first, then subtract it from the total.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Draw the Venn diagram and fill in the overlap first.
  - rung: 2
    name: concept
    text:
      en: The 'A only' region is circle A without the overlap.
  - rung: 3
    name: first_step
    text:
      en: The overlap holds 3.
  - rung: 4
    name: worked_step
    text:
      en: A only = 20 − 3.
  - rung: 5
    name: full_step
    text:
      en: A only = 20 − 3 = 17.
  misconception_ids:
  - mc.mth.o.venn_complement_wrong
  - mc.mth.o.venn_double_count
  - mc.mth.o.venn_only_includes_overlap
solution:
  steps:
  - n: 1
    latex: n(A \cap B') = n(A) - n(A \cap B)
    reason: Remove the overlap from A
  - n: 2
    latex: = 20 - 3 = 17
    reason: Subtract
    check_id: chk_build_mth_num_0052_ans
