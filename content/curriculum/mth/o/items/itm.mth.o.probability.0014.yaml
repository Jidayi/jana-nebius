stem: A bag holds 1 red, 2 blue and 6 green counters. One counter is taken at random.
parts:
- id: a
  prompt: Find the probability that it is red. Give your answer to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '0.125'
      correct: false
      misconception_id: mc.mth.o.probability_as_odds
      feedback: 'A probability compares the outcomes you want with all the outcomes: divide by the total.'
    - id: B
      text: '0.333'
      correct: false
      misconception_id: mc.mth.o.probability_equal_categories
      feedback: With 9 red and 1 blue, red is far more likely than blue, even though there are two colours.
    - id: C
      text: '0.111'
      correct: true
    - id: D
      text: '0.889'
      correct: false
      misconception_id: mc.mth.o.complement_not_taken
      feedback: P(not A) = 1 − P(A).
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Every counter is equally likely to be taken.
  - rung: 2
    name: concept
    text:
      en: Probability = number of favourable outcomes ÷ total number of outcomes.
  - rung: 3
    name: first_step
    text:
      en: Find the total number of counters first.
  - rung: 4
    name: worked_step
    text:
      en: There are 9 counters; count the ones that are red.
  - rung: 5
    name: full_step
    text:
      en: P(red) = 0.111.
  misconception_ids:
  - mc.mth.o.complement_not_taken
  - mc.mth.o.probability_as_odds
  - mc.mth.o.probability_equal_categories
solution:
  steps:
  - n: 1
    latex: \text{total} = 1 + 2 + 6 = 9
    reason: Count every counter
    check_id: chk_build_mth_prb_0014_n
  - n: 2
    latex: P = \frac{1}{9} = 0.111
    reason: Favourable over total
    check_id: chk_build_mth_prb_0014_ans
