      value: 1.0e-06
    check_id: chk_build_mth_alg_0098_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: All the powers have the same base, x.
  - rung: 2
    name: concept
    text:
      en: Multiplying powers of the same base adds the indices; dividing subtracts them.
  - rung: 3
    name: first_step
    text:
      en: First combine x^3 × x^4.
  - rung: 4
    name: worked_step
    text:
      en: x^3 × x^4 = x^7. Now divide by x^2.
  - rung: 5
    name: full_step
    text:
      en: n = 7 − 2 = 5.
  misconception_ids:
