id: itm.mth.o.trigonometry.0102
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.trigonometry.triangle_area_sine
stem: A triangular field has two sides of 6 m and 4 m with an angle of 40° between them.
parts:
- id: a
  prompt: Find the area of the field, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 15.4 m²
      correct: false
      misconception_id: mc.mth.o.formula_half_dropped
      feedback: Read the formula one symbol at a time and tick each one off as you substitute; the ½ multiplies everything that follows it.
    - id: B
      text: 9.19 m²
      correct: false
      misconception_id: mc.mth.o.trig_ratio_wrong
      feedback: 'Label the sides from the angle you are using: opposite faces it, adjacent is next to it, hypotenuse is opposite the right angle.'
    - id: C
      text: 7.71 m²
      correct: true
    - id: D
      text: 8.94 m²
      correct: false
      misconception_id: mc.mth.o.calculator_radians
      feedback: 'Check the calculator shows D (degrees): sin 30 should give 0.5.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: You know two sides and the angle between them, not the height.
  - rung: 2
    name: concept
    text:
      en: Area = ½ × a × b × sin C, where C is the angle between sides a and b.
  - rung: 3
    name: first_step
    text:
      en: Work out 6 × 4 × sin 40°.
  - rung: 4
    name: worked_step
    text:
      en: Then halve it.
  - rung: 5
    name: full_step
    text:
      en: The area is 7.71 m².
  misconception_ids:
  - mc.mth.o.calculator_radians
  - mc.mth.o.formula_half_dropped
  - mc.mth.o.trig_ratio_wrong
solution:
  steps:
  - n: 1
    latex: A = \tfrac{1}{2}ab\sin C
    reason: Two sides and the included angle
  - n: 2
    latex: A = \tfrac{1}{2} \times 6 \times 4 \times \sin 40 = 7.71\ \text{m}^2
    reason: Substitute and evaluate
    check_id: chk_build_mth_trg_0102_ans
