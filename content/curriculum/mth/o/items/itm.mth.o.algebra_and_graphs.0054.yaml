  chk_build_mth_alg_0054_final:
    args:
      equations:
      - p = abs(-9)
      - q = abs(-4)
      unknowns:
      - p
      - q
    tool: math_solve
  chk_build_mth_alg_0054_m:
    args:
      equations:
      - p = abs((-9)*(-4))
      - q = abs((-9) + (-4))
      unknowns:
      - p
      - q
    tool: math_solve
  chk_build_mth_alg_0054_roots:
    args:
      equations:
      - x^2 + (-13)*x + (36) = 0
      unknowns:
      - x
    tool: math_solve
