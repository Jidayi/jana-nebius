stem: 'A scatter diagram is drawn for this data: The older a car is, the lower its price tends to be.'
parts:
- id: a
  prompt: Which description fits it best?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: no correlation
      correct: false
      misconception_id: mc.mth.o.correlation_negative_as_none
      feedback: 'Negative correlation still shows a relationship: as one goes up, the other goes down.'
    - id: B
      text: age is the only cause of the price
      correct: false
      misconception_id: mc.mth.o.correlation_causation
      feedback: Ice-cream sales and sunburn rise together, but one does not cause the other.
    - id: C
      text: negative correlation
      correct: true
    - id: D
      text: positive correlation
      correct: false
      misconception_id: mc.mth.o.correlation_direction_swapped
      feedback: 'Positive correlation: as one quantity goes up, the other tends to go up. Negative correlation: as one goes up, the other tends to go down.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture the points on the scatter diagram.
  - rung: 2
    name: concept
    text:
      en: Up from left to right is positive; down is negative; no pattern is no correlation.
  - rung: 3
    name: first_step
    text:
      en: Correlation describes a pattern, not a cause.
  - rung: 4
    name: worked_step
    text:
      en: Decide which way the trend goes.
  - rung: 5
    name: full_step
    text:
      en: It shows negative correlation.
  misconception_ids:
  - mc.mth.o.correlation_causation
  - mc.mth.o.correlation_negative_as_none
  - mc.mth.o.correlation_direction_swapped
