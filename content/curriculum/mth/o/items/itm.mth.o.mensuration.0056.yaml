stem: A sector has radius 6 cm and angle 135° at the centre.
parts:
- id: a
  prompt: Find its area, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 42.4 cm²
      correct: true
    - id: B
      text: 113 cm²
      correct: false
      misconception_id: mc.mth.o.sector_fraction_dropped
      feedback: A sector with angle θ is θ/360 of the whole circle.
    - id: C
      text: 14.1 cm²
      correct: false
      misconception_id: mc.mth.o.circumference_area_confused
      feedback: 'Area is in square units, so its formula has r²: A = πr². The circumference is a length: C = 2πr.'
    - id: D
      text: 84.8 cm²
      correct: false
      misconception_id: mc.mth.o.sector_fraction_180
      feedback: A full turn is 360°, so the fraction is the angle over 360.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A sector is a slice of the circle.
  - rung: 2
    name: concept
    text:
      en: The sector is 135/360 of the whole circle's area.
  - rung: 3
    name: first_step
    text:
      en: The whole area is π × 6².
  - rung: 4
    name: worked_step
    text:
      en: Multiply it by 135/360.
  - rung: 5
    name: full_step
    text:
      en: The sector area is 42.4 cm².
  misconception_ids:
  - mc.mth.o.circumference_area_confused
  - mc.mth.o.sector_fraction_180
  - mc.mth.o.sector_fraction_dropped
solution:
  steps:
  - n: 1
    latex: A = \frac{135}{360} \times \pi \times 6^2
    reason: The fraction of the circle's area
  - n: 2
    latex: = 42.4\ \text{cm}^2
    reason: Evaluate and round
