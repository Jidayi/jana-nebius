stem: The point P(5, -2) is reflected in the line y = 4.
parts:
- id: a
  prompt: Find the y-coordinate of the image P′.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '4'
      correct: false
      misconception_id: mc.mth.o.reflection_not_doubled
      feedback: The image is as far behind the mirror line as the point is in front of it.
    - id: B
      text: '10'
      correct: true
    - id: C
      text: '-2'
      correct: false
      misconception_id: mc.mth.o.reflection_axis_confused
      feedback: Reflecting in a vertical line x = k moves points left or right only, so only x changes.
    - id: D
      text: '6'
      correct: false
      misconception_id: mc.mth.o.translation_sign
      feedback: 'The top number moves right (negative: left); the bottom number moves up (negative: down). Add each to the matching coordinate.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The mirror line is horizontal.
  - rung: 2
    name: concept
    text:
      en: Only the y-coordinate changes; the image is the same distance beyond the line.
  - rung: 3
    name: first_step
    text:
      en: Find how far -2 is from 4.
  - rung: 4
    name: worked_step
    text:
      en: The distance is 6 (with its direction). Go the same again past the line.
  - rung: 5
    name: full_step
    text:
      en: The image has y = 10.
  misconception_ids:
  - mc.mth.o.reflection_axis_confused
  - mc.mth.o.reflection_not_doubled
  - mc.mth.o.translation_sign
solution:
  steps:
  - n: 1
    latex: \text{distance to the line} = 6
    reason: Along the y-direction
    check_id: chk_build_mth_vec_0013_d
  - n: 2
    latex: y' = 4 + 6 = 10
    reason: The same distance beyond the line
    check_id: chk_build_mth_vec_0013_ans
