stem: Which quadrilateral has exactly one pair of parallel sides?
parts:
- id: a
  prompt: Choose the correct name.
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: parallelogram
      correct: false
      misconception_id: mc.mth.o.trapezium_two_pairs
      feedback: A trapezium has exactly one pair of parallel sides; with two pairs it is a parallelogram.
    - id: B
      text: trapezium
      correct: true
    - id: C
      text: kite
      correct: false
      misconception_id: mc.mth.o.kite_rhombus_confused
      feedback: A kite has two pairs of equal sides next to each other; a rhombus has all four sides equal.
    - id: D
      text: rectangle
      correct: false
      misconception_id: mc.mth.o.square_not_rectangle
      feedback: A rectangle needs four right angles; a square has them, so every square is a rectangle.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'List the properties given: sides, angles and parallel lines.'
  - rung: 2
    name: concept
    text:
      en: Check each name against every property, not just one of them.
  - rung: 3
    name: first_step
    text:
      en: 'Remember that a shape can belong to more than one family: a square is also a rectangle and a rhombus.'
  - rung: 4
    name: worked_step
    text:
      en: Rule out each name that breaks one of the properties.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: trapezium.'
  misconception_ids:
