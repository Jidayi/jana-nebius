stem: Complete the table of values for $y = 3x^2 + x + 7$.
parts:
- id: a
  prompt: Find y when x = 2.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '45'
      correct: false
      misconception_id: mc.mth.o.multiply_before_power
      feedback: The power belongs only to the letter next to it. Square x first, then multiply by the number in front.
    - id: B
      text: '21'
      correct: true
    - id: C
      text: '-3'
      correct: false
      misconception_id: mc.mth.o.negative_squared_negative
      feedback: A negative times a negative is positive, so (−3)² = (−3) × (−3) = 9. Keep the bracket round the negative number when you substitute.
    - id: D
      text: '15'
      correct: false
      misconception_id: mc.mth.o.power_dropped
      feedback: A small raised number tells you to multiply the value by itself. Check every power before you add the terms.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Substitute the x-value into every x.
  - rung: 2
    name: concept
    text:
      en: Square first, then multiply by the coefficient.
  - rung: 3
    name: first_step
    text:
      en: (2)² is positive.
  - rung: 4
    name: worked_step
    text:
      en: The terms are 12 and 2.
  - rung: 5
    name: full_step
    text:
      en: y = 21.
  misconception_ids:
  - mc.mth.o.multiply_before_power
  - mc.mth.o.negative_squared_negative
  - mc.mth.o.power_dropped
solution:
  steps:
  - n: 1
    latex: y = 3(2)^2 + 1(2) + 7
    reason: Substitute
  - n: 2
    latex: y = 12 + 2 + 7
    reason: Work out each term
    check_id: chk_build_mth_alg_0269_t
  - n: 3
    latex: y = 21
    reason: Add
    check_id: chk_build_mth_alg_0269_ans
