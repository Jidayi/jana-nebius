id: itm.mth.o.trigonometry.0010
version: 0.1.1
type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.trigonometry.pythagoras
stem: A right-angled triangle has hypotenuse 15 cm and one other side 8 cm.
parts:
- id: a
  prompt: Find the length of the third side, to 3 significant figures.
  marks: 3
  answer:
    kind: numeric
    value: '12.7'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_trg_0010_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which side is the hypotenuse? It is the longest side.
  - rung: 2
    name: concept
    text:
      en: 'To find a shorter side, subtract the squares: b² = c² − a².'
  - rung: 3
    name: first_step
    text:
      en: Work out 15² − 8².
  - rung: 4
    name: worked_step
    text:
      en: That is 161; take the square root.
  - rung: 5
    name: full_step
    text:
      en: The third side is 12.7 cm.
  misconception_ids:
  - mc.mth.o.pythag_add_for_leg
  - mc.mth.o.pythag_no_root
  - mc.mth.o.pythag_sides_added
solution:
  steps:
  - n: 1
    latex: b^2 = c^2 - a^2
    reason: Pythagoras' theorem, rearranged
  - n: 2
    latex: b^2 = 15^2 - 8^2 = 161
    reason: Square and subtract
    check_id: chk_build_mth_trg_0010_s
  - n: 3
    latex: b = \sqrt{161} = 12.7\ \text{cm}
    reason: Square root
    check_id: chk_build_mth_trg_0010_ans
