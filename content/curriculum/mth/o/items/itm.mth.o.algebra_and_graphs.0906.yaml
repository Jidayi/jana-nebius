id: itm.mth.o.algebra_and_graphs.0906
version: 0.1.0
type: algebraic
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.factorise_quadratic
stem: Factorise $2x^2 - 5x + 3$.
parts:
- id: a
  prompt: Type the expression as a product of two brackets.
  marks: 2
  answer:
    kind: algebraic
    check_id: chk_build_mth_alg_0906_key
    expression: (2x - 3)(x - 1)
    variables:
    - x
    required_form: factorised
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The x² term has coefficient 2, so one bracket starts with 2x and the other with x.
  - rung: 2
    name: concept
    text:
      en: Multiply the coefficient of x² by the number term, then find two numbers with that product that add to the coefficient of x.
  - rung: 3
    name: first_step
    text:
      en: Use the two numbers to split the x term, then factorise the first pair and the last pair.
  - rung: 4
    name: worked_step
    text:
      en: 'Both pairs should share the same bracket: take it out as a common factor.'
  - rung: 5
    name: full_step
    text:
      en: The factorisation is $(2x - 3)(x - 1)$.
solution:
  steps:
  - n: 1
    latex: 2 \times 3 = 6
    reason: Multiply the x² coefficient by the number term
    check_id: chk_build_mth_alg_0906_ac
  - n: 2
    latex: '\text{numbers with product } 6 \text{ and sum } -\,5: -2, -3'
    reason: Find the pair to split the middle term
    check_id: chk_build_mth_alg_0906_s
  - n: 3
    latex: 2x^2 - 5x + 3 = 2x^2 - 2x - 3x + 3
    reason: Split the x term with the pair
    check_id: chk_build_mth_alg_0906_k
  - n: 4
    latex: = (2x - 3)(x - 1)
    reason: Factorise in pairs
