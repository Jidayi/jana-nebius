  - n: 1
    latex: P(A, \text{not } B) = 0.25(1 - 0.3) = 0.175
    reason: First way
    check_id: chk_build_mth_prb_0038_t
  - n: 2
    latex: P(\text{not } A, B) = (1 - 0.25)0.3 = 0.225
    reason: Second way
  - n: 3
    latex: 0.175 + 0.225 = 0.4
    reason: Add the two ways
    check_id: chk_build_mth_prb_0038_ans
