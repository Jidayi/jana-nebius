stem: The probability that it rains on Monday is 0.25. The probability that the bus is late on Tuesday is 0.3. The two events are independent.
parts:
- id: a
  prompt: Find the probability that exactly one of them happens.
  marks: 3
  answer:
    kind: numeric
    value: '0.4'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_prb_0038_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Draw a tree diagram with two sets of branches.
  - rung: 2
    name: concept
    text:
      en: 'Exactly one can happen in two ways: the first but not the second, or the second but not the first.'
  - rung: 3
    name: first_step
    text:
      en: 'Multiply along each path: 0.25 × (1 − 0.3), and (1 − 0.25) × 0.3.'
  - rung: 4
    name: worked_step
    text:
      en: The paths give 0.175 and 0.225; add them.
  - rung: 5
    name: full_step
    text:
      en: P(exactly one) = 0.4.
  misconception_ids:
  - mc.mth.o.complement_not_taken
  - mc.mth.o.and_as_add
  - mc.mth.o.complement_of_both
solution:
