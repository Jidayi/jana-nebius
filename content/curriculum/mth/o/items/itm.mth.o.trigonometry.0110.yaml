stem: A cuboid measures 8 cm by 5 cm by 4 cm.
parts:
- id: a
  prompt: Find the length of a diagonal running from a bottom corner to the opposite top corner, to 3 significant figures.
  marks: 3
  answer:
    kind: numeric
    value: '10.2'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_trg_0110_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The diagonal goes through the inside of the cuboid.
  - rung: 2
    name: concept
    text:
      en: 'Use Pythagoras twice: first across the base, then up to the top corner.'
  - rung: 3
    name: first_step
    text:
      en: The base diagonal squared is 8² + 5².
  - rung: 4
    name: worked_step
    text:
      en: That is 89. Now add 4² and take the square root.
  - rung: 5
    name: full_step
    text:
      en: The diagonal is 10.2 cm.
  misconception_ids:
