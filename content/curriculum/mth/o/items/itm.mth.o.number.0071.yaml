id: itm.mth.o.number.0071
version: 0.1.0
type: mcq
subject: mth
level: o
kc_ids:
- kc.mth.o.number.fraction_arithmetic
stem: Work out $\frac{5}{6} - \frac{1}{2}$.
parts:
- id: a
  prompt: Choose the answer in its simplest form.
  marks: 2
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: $\frac{1}{2}$
      correct: false
      misconception_id: mc.mth.o.add_tops_and_bottoms
      feedback: One half plus one half is one, not two quarters. Fractions need a common denominator before you add the numerators.
    - id: B
      text: $\frac{2}{3}$
      correct: false
      misconception_id: mc.mth.o.numerator_not_scaled
      feedback: Whatever you multiply the bottom by, multiply the top by too, so each fraction keeps its value.
    - id: C
      text: $\frac{1}{4}$
      correct: false
      misconception_id: mc.mth.o.denominators_added
      feedback: Once the fractions share a denominator, the denominator stays the same; only the numerators are added.
    - id: D
      text: $\frac{1}{3}$
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: You can only add or subtract fractions with the same denominator.
  - rung: 2
    name: concept
    text:
      en: Find the lowest common multiple of 6 and 2.
  - rung: 3
    name: first_step
    text:
      en: The common denominator is 6.
  - rung: 4
    name: worked_step
    text:
      en: Write both fractions with denominator 6, then subtract the numerators.
  - rung: 5
    name: full_step
    text:
      en: The answer is $\frac{1}{3}$.
  misconception_ids:
  - mc.mth.o.add_tops_and_bottoms
  - mc.mth.o.denominators_added
  - mc.mth.o.numerator_not_scaled
solution:
  steps:
  - n: 1
    latex: \frac{5}{6} = \frac{5}{6},\ \frac{1}{2} = \frac{3}{6}
    reason: Write both fractions over the lowest common denominator
    check_id: chk_build_mth_num_0071_t
  - n: 2
    latex: \frac{5 - 3}{6} = \frac{2}{6}
    reason: Subtract the numerators
    check_id: chk_build_mth_num_0071_s
  - n: 3
    latex: = \frac{1}{3}
    reason: Simplify
    check_id: chk_build_mth_num_0071_k
