    text:
      en: gf(x) means g(f(x)). Which function is applied first?
  - rung: 2
    name: concept
    text:
      en: Work out f of the number first, then put that answer into g.
  - rung: 3
    name: first_step
    text:
      en: f(-3) = 4 × (-3) - 3.
  - rung: 4
    name: worked_step
    text:
      en: f(-3) = -15. Now find g(-15).
  - rung: 5
    name: full_step
    text:
      en: gf(-3) = 228.
  misconception_ids:
