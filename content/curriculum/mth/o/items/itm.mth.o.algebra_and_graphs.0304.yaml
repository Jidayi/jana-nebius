solution:
  steps:
  - n: 1
    latex: f(-3) = 4 \times (-3) - 3 = -15
    reason: The function next to x acts first
    check_id: chk_build_mth_alg_0304_f
  - n: 2
    latex: g(-15) = (-15)^2 + 3 = 228
    reason: Then apply g
    check_id: chk_build_mth_alg_0304_ans
