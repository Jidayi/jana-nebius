stem: In a histogram, the bar for the class 30 < x ≤ 40 has frequency density 2.5.
parts:
- id: a
  prompt: Find the frequency of this class.
  marks: 2
  answer:
    kind: numeric
    value: '25'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_sta_0131_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: In a histogram, the area of a bar shows the frequency.
  - rung: 2
    name: concept
    text:
      en: Frequency = frequency density × class width.
  - rung: 3
    name: first_step
    text:
      en: The class width is 40 − 30.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 2.5 by the width.
  - rung: 5
    name: full_step
    text:
      en: The frequency is 25.
  misconception_ids:
  - mc.mth.o.histogram_height_as_frequency
  - mc.mth.o.density_multiplied
  - mc.mth.o.class_width_wrong
solution:
  steps:
  - n: 1
    latex: \text{frequency} = 2.5 \times 10 = 25
    reason: 'Area of the bar: density times width'
    check_id: chk_build_mth_sta_0131_ans
