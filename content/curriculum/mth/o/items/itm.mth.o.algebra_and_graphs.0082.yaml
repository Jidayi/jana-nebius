id: itm.mth.o.algebra_and_graphs.0082
version: 0.1.0
type: mcq
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.algebraic_fractions
stem: Simplify $\frac{x^2 + 5x + 4}{x^2 - 16}$.
parts:
- id: a
  prompt: Choose the fully simplified fraction.
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: $\frac{5x + 4}{-16}$
      correct: false
      misconception_id: mc.mth.o.cancel_terms_not_factors
      feedback: 'Only whole factors cancel. Put x = 2 into the original and your answer: if they differ, the cancelling was wrong. Factorise first, then cancel.'
    - id: B
      text: $\frac{x + 1}{x + 4}$
      correct: false
      misconception_id: mc.mth.o.factor_signs_swapped
      feedback: Expand your brackets to check the middle term. If its sign is wrong, swap the signs in the brackets.
    - id: C
      text: $\frac{x + 1}{x - 4}$
      correct: true
    - id: D
      text: $\frac{x + 4}{x - 16}$
      correct: false
      misconception_id: mc.mth.o.dots_not_rooted
      feedback: x² − 49 = x² − 7², so the brackets hold 7, the square root of 49.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Can the top and the bottom be factorised?
  - rung: 2
    name: concept
    text:
      en: Only whole factors that appear on the top and the bottom can be cancelled.
  - rung: 3
    name: first_step
    text:
      en: The bottom is a difference of two squares; the top is a quadratic.
  - rung: 4
    name: worked_step
    text:
      en: Factorise both, then look for a bracket that appears in both.
  - rung: 5
    name: full_step
    text:
      en: The simplified fraction is $\frac{x + 1}{x - 4}$.
  misconception_ids:
  - mc.mth.o.cancel_terms_not_factors
  - mc.mth.o.dots_not_rooted
  - mc.mth.o.factor_signs_swapped
solution:
  steps:
  - n: 1
    latex: \frac{x^2 + 5x + 4}{x^2 - 16} = \frac{(x + 1)(x + 4)}{(x - 4)(x + 4)}
    reason: Factorise the top and the bottom
    check_id: chk_build_mth_alg_0082_f
  - n: 2
    latex: = \frac{x + 1}{x - 4}
    reason: Cancel the common factor (x + 4)
    check_id: chk_build_mth_alg_0082_final
