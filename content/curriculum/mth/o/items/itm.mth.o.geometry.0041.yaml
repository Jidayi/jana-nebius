stem: 'A map has a scale of 1 : 25000. Two villages are 4.5 cm apart on the map.'
parts:
- id: a
  prompt: Find the real distance between them in kilometres.
  marks: 2
  answer:
    kind: numeric
    value: '1.125'
    unit: km
    unit_policy: equivalent
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_geo_0041_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The scale means 1 cm on the map is 25000 cm on the ground.
  - rung: 2
    name: concept
    text:
      en: Multiply the map distance by the scale, then change the units.
  - rung: 3
    name: first_step
    text:
      en: Work out 4.5 × 25000 to get centimetres.
  - rung: 4
    name: worked_step
    text:
      en: That is 112500 cm. Divide by 100 to get metres, then by 1000 to get kilometres.
  - rung: 5
    name: full_step
    text:
      en: The real distance is 1.125 km.
  misconception_ids:
  - mc.mth.o.scale_units_not_converted
  - mc.mth.o.scale_wrong_direction
  - mc.mth.o.scale_conversion_factor
solution:
  steps:
  - n: 1
    latex: 4.5 \times 25000 = 112500\ \text{cm}
    reason: Every map centimetre is 25000 real centimetres
    check_id: chk_build_mth_geo_0041_real
  - n: 2
    latex: 112500\ \text{cm} = 1.125\ \text{km}
    reason: Divide by 100 for metres, then by 1000 for kilometres
    check_id: chk_build_mth_geo_0041_ans
