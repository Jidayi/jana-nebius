subject: mth
level: o
kc_ids:
- kc.mth.o.mensuration.area_perimeter
stem: A parallelogram has base 10 cm, sloping sides 9 cm and perpendicular height 6 cm.
parts:
- id: a
  prompt: Find its area.
  marks: 2
  answer:
    kind: numeric
    value: '60'
    unit: cm^2
    unit_policy: equivalent
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_mns_0020_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Cut a triangle off one end and move it to the other: you get a rectangle.'
  - rung: 2
    name: concept
    text:
      en: Area of a parallelogram = base × perpendicular height.
  - rung: 3
    name: first_step
    text:
      en: The perpendicular height is 6 cm, not the sloping side.
  - rung: 4
    name: worked_step
    text:
      en: Work out 10 × 6.
  - rung: 5
    name: full_step
    text:
      en: The area is 60 cm².
  misconception_ids:
  - mc.mth.o.slant_height_used
  - mc.mth.o.perimeter_area_confused
  - mc.mth.o.formula_half_dropped
solution:
  steps:
  - n: 1
    latex: A = bh
    reason: Base times perpendicular height
  - n: 2
    latex: A = 10 \times 6 = 60\ \text{cm}^2
    reason: Use the height, not the sloping side
    check_id: chk_build_mth_mns_0020_ans
