id: itm.mth.o.algebra_and_graphs.0268
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.tables_of_values
stem: Complete the table of values for $y = \frac{12}{x} - x$.
parts:
- id: a
  prompt: Find y when x = -4.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '1'
      correct: true
    - id: B
      text: '7'
      correct: false
      misconception_id: mc.mth.o.sign_lost_substitution
      feedback: Write the value in a bracket with its sign, for example x = (−4), before you calculate.
    - id: C
      text: '-44'
      correct: false
      misconception_id: mc.mth.o.multiply_before_power
      feedback: The power belongs only to the letter next to it. Square x first, then multiply by the number in front.
    - id: D
      text: '-7'
      correct: false
      misconception_id: mc.mth.o.negative_squared_negative
      feedback: A negative times a negative is positive, so (−3)² = (−3) × (−3) = 9. Keep the bracket round the negative number when you substitute.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Substitute the x-value into both terms.
  - rung: 2
    name: concept
    text:
      en: The first term is 12 divided by x.
  - rung: 3
    name: first_step
    text:
      en: 12 ÷ (-4) keeps the sign of x.
  - rung: 4
    name: worked_step
    text:
      en: The terms are -3 and 4.
  - rung: 5
    name: full_step
    text:
      en: y = 1.
  misconception_ids:
  - mc.mth.o.multiply_before_power
  - mc.mth.o.negative_squared_negative
  - mc.mth.o.sign_lost_substitution
solution:
  steps:
  - n: 1
    latex: y = \frac{12}{-4} - 1 \times (-4)
    reason: Substitute
  - n: 2
    latex: y = (-3) + 4
    reason: Work out each term
    check_id: chk_build_mth_alg_0268_t
  - n: 3
    latex: y = 1
    reason: Add
    check_id: chk_build_mth_alg_0268_ans
