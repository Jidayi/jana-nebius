id: itm.mth.o.mensuration.0075
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.mensuration.prism_volume
stem: A cylinder has radius 6 cm and height 8 cm.
parts:
- id: a
  prompt: Find its volume, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 3620 cm³
      correct: false
      misconception_id: mc.mth.o.diameter_for_radius
      feedback: The radius is half the diameter. Halve the diameter before using πr².
    - id: B
      text: 151 cm³
      correct: false
      misconception_id: mc.mth.o.radius_not_squared
      feedback: 'Area needs two lengths multiplied: π × r × r.'
    - id: C
      text: 302 cm³
      correct: false
      misconception_id: mc.mth.o.circumference_area_confused
      feedback: 'Area is in square units, so its formula has r²: A = πr². The circumference is a length: C = 2πr.'
    - id: D
      text: 905 cm³
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A cylinder is a prism with a circular cross-section.
  - rung: 2
    name: concept
    text:
      en: Volume = area of cross-section × height.
  - rung: 3
    name: first_step
    text:
      en: The end has area π × 6².
  - rung: 4
    name: worked_step
    text:
      en: Multiply that by 8.
  - rung: 5
    name: full_step
    text:
      en: The volume is 905 cm³.
  misconception_ids:
  - mc.mth.o.circumference_area_confused
  - mc.mth.o.diameter_for_radius
  - mc.mth.o.radius_not_squared
solution:
  steps:
  - n: 1
    latex: V = \pi r^2 h
    reason: Area of the circular end times the height
  - n: 2
    latex: V = \pi \times 6^2 \times 8 = 905\ \text{cm}^3
    reason: Substitute and round
    check_id: chk_build_mth_mns_0075_ans
