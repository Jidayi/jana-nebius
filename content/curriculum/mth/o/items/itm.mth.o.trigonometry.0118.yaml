stem: A cuboid measures 6 cm by 2 cm by 5 cm.
parts:
- id: a
  prompt: Find the angle between a diagonal from a bottom corner to the opposite top corner and the base, to 1 decimal place.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 39.8°
