  - rung: 3
    name: first_step
    text:
      en: Find the base diagonal from 6 and 2.
  - rung: 4
    name: worked_step
    text:
      en: The base diagonal is 6.325 cm; tan θ = 5 ÷ 6.325.
  - rung: 5
