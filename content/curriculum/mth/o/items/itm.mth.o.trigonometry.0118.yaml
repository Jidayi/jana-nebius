  - n: 1
    latex: \text{base diagonal} = \sqrt{6^2 + 2^2} = 6.325
    reason: Pythagoras in the base
    check_id: chk_build_mth_trg_0118_bd
  - n: 2
    latex: \theta = \tan^{-1}\left(\frac{5}{6.325}\right) = 38.3
    reason: Height over base diagonal
    check_id: chk_build_mth_trg_0118_ans
