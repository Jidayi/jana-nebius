stem: In a right-angled triangle, one angle is 71° and the hypotenuse is 6 cm.
parts:
- id: a
  prompt: Find the side opposite the angle, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 1.95 cm
      correct: false
      misconception_id: mc.mth.o.trig_ratio_wrong
      feedback: 'Label the sides from the angle you are using: opposite faces it, adjacent is next to it, hypotenuse is opposite the right angle.'
    - id: B
      text: 6.35 cm
      correct: false
      misconception_id: mc.mth.o.trig_rearrange_wrong
      feedback: If x is the hypotenuse, sin θ = opp/x, so x = opp ÷ sin θ.
    - id: C
      text: 5.71 cm
      correct: false
      misconception_id: mc.mth.o.calculator_radians
      feedback: 'Check the calculator shows D (degrees): sin 30 should give 0.5.'
    - id: D
      text: 5.67 cm
      correct: true
  show_working: false
  hints:
