  - mc.mth.o.trig_ratio_wrong
  - mc.mth.o.trig_rearrange_wrong
solution:
  steps:
  - n: 1
    latex: \sin \theta = \frac{\text{opp}}{\text{hyp}}
    reason: The ratio linking the known side and the wanted side is sin
  - n: 2
    latex: x = 6 \sin 71 = 5.67\ \text{cm}
    reason: Rearrange and evaluate in degrees
    check_id: chk_build_mth_trg_0031_ans
