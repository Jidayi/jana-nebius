stem: A closed box is a cuboid 5 cm long, 4 cm wide and 9 cm high.
parts:
- id: a
  prompt: Find its total surface area.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 101 cm²
      correct: false
      misconception_id: mc.mth.o.surface_area_half_faces
      feedback: 'A cuboid has six faces in three matching pairs: double the sum of the three different faces.'
    - id: B
      text: 180 cm²
      correct: false
      misconception_id: mc.mth.o.perimeter_area_confused
      feedback: Perimeter is a length around the edge (add the sides); area is the space inside (square units).
    - id: C
      text: 120 cm²
      correct: false
      misconception_id: mc.mth.o.compound_part_missing
      feedback: Split the shape into simple parts, label each one, and add every part.
    - id: D
      text: 202 cm²
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A cuboid has six rectangular faces.
  - rung: 2
    name: concept
    text:
      en: The faces come in three matching pairs.
  - rung: 3
    name: first_step
    text:
      en: Find the areas 5 × 4, 5 × 9 and 4 × 9.
  - rung: 4
    name: worked_step
    text:
      en: Add the three areas and double.
  - rung: 5
    name: full_step
    text:
      en: The surface area is 202 cm².
  misconception_ids:
  - mc.mth.o.compound_part_missing
  - mc.mth.o.perimeter_area_confused
  - mc.mth.o.surface_area_half_faces
solution:
  steps:
  - n: 1
    latex: 5 \times 4 = 20,\ 5 \times 9 = 45,\ 4 \times 9 = 36
    reason: The three different faces
    check_id: chk_build_mth_mns_0071_t
  - n: 2
    latex: 2(20 + 45 + 36) = 202\ \text{cm}^2
    reason: Each face has a matching opposite face
    check_id: chk_build_mth_mns_0071_ans
