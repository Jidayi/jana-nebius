stem: Find the value of $2x^2 - 7x - 4$ when $x = -2$.
parts:
- id: a
  prompt: Give the value.
  marks: 2
  answer:
    kind: numeric
    value: '18'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_alg_0005_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Replace every x by the value in a bracket, sign and all.
  - rung: 2
    name: concept
    text:
      en: 'Follow the order of operations: the power first, then multiplication, then addition and subtraction.'
  - rung: 3
    name: first_step
    text:
      en: Start with (-2)². A negative number squared is positive.
  - rung: 4
    name: worked_step
    text:
      en: The terms are 2 × (-2)² = 8 and −7 × (-2) = 14.
  - rung: 5
    name: full_step
    text:
      en: 8 + 14 - 4 = 18.
  misconception_ids:
  - mc.mth.o.multiply_before_power
  - mc.mth.o.negative_squared_negative
  - mc.mth.o.sign_lost_substitution
solution:
  steps:
  - n: 1
    latex: 2x^2 - 7x - 4 = 2 \times (-2)^2 - 7 \times (-2) - 4
    reason: Substitute, keeping the negative value in a bracket
  - n: 2
    latex: = 8 + 14 - 4
    reason: Powers first, then multiply
    check_id: chk_build_mth_alg_0005_t
  - n: 3
    latex: = 18
    reason: Add the terms
    check_id: chk_build_mth_alg_0005_ans
