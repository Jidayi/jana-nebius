id: itm.mth.o.calculus.0030
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.calculus.tangents_normals
stem: A curve has equation $y = x^2 + 4x + 6$. The tangent to the curve at the point where x = 1 has equation y = mx + c.
parts:
- id: a
  prompt: Find c.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '17'
      correct: false
      misconception_id: mc.mth.o.intercept_sign
      feedback: 'Solve 0 = mx + c carefully: mx = −c, so x = −c/m.'
    - id: B
      text: '11'
      correct: false
      misconception_id: mc.mth.o.c_as_y_coordinate
      feedback: 'Substitute the point into y = mx + c and solve for c: c = y₁ − mx₁.'
    - id: C
      text: '5'
      correct: true
    - id: D
      text: '6'
      correct: false
      misconception_id: mc.mth.o.derivative_power_not_brought_down
      feedback: 'Bring the power down as a multiplier, then reduce it by one: x³ becomes 3x².'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A tangent touches the curve at one point and has the curve's gradient there.
  - rung: 2
    name: concept
    text:
      en: Find the point on the curve, then the gradient from dy/dx, then c from y = mx + c.
  - rung: 3
    name: first_step
    text:
      en: Substitute x = 1 into the curve for y, and into dy/dx for m.
  - rung: 4
    name: worked_step
    text:
      en: y = 11 and m = 6; now solve 11 = m × (1) + c.
  - rung: 5
    name: full_step
    text:
      en: c = 5.
  misconception_ids:
  - mc.mth.o.c_as_y_coordinate
  - mc.mth.o.derivative_power_not_brought_down
  - mc.mth.o.intercept_sign
solution:
  steps:
  - n: 1
    latex: 'y = x^2 + 4x + 6 \text{ at } x = 1: y = 11'
    reason: The point of contact
    check_id: chk_build_mth_cal_0030_y
  - n: 2
    latex: m = \frac{dy}{dx} = 6
    reason: Gradient from the derivative
    check_id: chk_build_mth_cal_0030_m
  - n: 3
    latex: c = 11 - 6 \times (1) = 5
    reason: Substitute the point into y = mx + c
    check_id: chk_build_mth_cal_0030_ans
