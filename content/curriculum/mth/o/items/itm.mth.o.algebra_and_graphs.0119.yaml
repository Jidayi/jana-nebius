  steps:
  - n: 1
    latex: 6x + 1 = 4x - 3
    reason: The equation
  - n: 2
    latex: 2x = -4
    reason: Collect x terms on the left and numbers on the right
    check_id: chk_build_mth_alg_0119_s
  - n: 3
