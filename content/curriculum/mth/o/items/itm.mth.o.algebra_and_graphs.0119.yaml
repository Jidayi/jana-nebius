stem: Solve the equation $6x + 1 = 4x - 3$.
parts:
- id: a
  prompt: Find x.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '-1'
      correct: false
      misconception_id: mc.mth.o.rearrange_inverse_sign
      feedback: 'Do the same to both sides: to remove + u, subtract u from both sides.'
    - id: B
      text: '-8'
      correct: false
      misconception_id: mc.mth.o.rearrange_wrong_inverse
      feedback: The opposite of multiplying by a is dividing by a. Check by putting numbers back into your answer.
    - id: C
      text: '-0.4'
      correct: false
      misconception_id: mc.mth.o.expand_sign_slip
      feedback: 'Multiply the signs as well as the numbers: negative times positive is negative, negative times negative is positive.'
    - id: D
      text: '-2'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: There are x terms on both sides. Get all the x terms on one side.
  - rung: 2
    name: concept
    text:
      en: Subtract 4x from both sides, then deal with the numbers.
  - rung: 3
    name: first_step
    text:
      en: Subtracting 4x gives 2x on the left.
  - rung: 4
    name: worked_step
    text:
      en: You should reach 2x = -4.
  - rung: 5
    name: full_step
    text:
      en: x = -4 ÷ 2 = -2.
  misconception_ids:
  - mc.mth.o.expand_sign_slip
  - mc.mth.o.rearrange_inverse_sign
  - mc.mth.o.rearrange_wrong_inverse
