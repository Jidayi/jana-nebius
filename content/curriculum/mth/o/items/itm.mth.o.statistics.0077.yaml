id: itm.mth.o.statistics.0077
version: 0.1.0
type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.statistics.grouped_mean
stem: 'The times, t minutes, that students took to finish a task are grouped: 40 ≤ t < 50: 14; 50 ≤ t < 60: 6; 60 ≤ t < 70: 9; 70 ≤ t < 80: 6.'
parts:
- id: a
  prompt: Estimate the mean time.
  marks: 3
  answer:
    kind: numeric
    value: '57'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_sta_0077_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You do not know the exact times, so use one value for each class.
  - rung: 2
    name: concept
    text:
      en: Use the midpoint of each class, multiply by its frequency, add, and divide by the total frequency.
  - rung: 3
    name: first_step
    text:
      en: The first class has midpoint (40 + 50) ÷ 2.
  - rung: 4
    name: worked_step
    text:
      en: Σfx = 1995 and Σf = 35.
  - rung: 5
    name: full_step
    text:
      en: The estimated mean is 57 minutes.
  misconception_ids:
  - mc.mth.o.grouped_upper_bound
  - mc.mth.o.frequency_mean_rows
  - mc.mth.o.class_width_wrong
solution:
  steps:
  - n: 1
    latex: '\text{midpoints: } 45, 55, 65, 75'
    reason: Middle of each class
    check_id: chk_build_mth_sta_0077_mids
  - n: 2
    latex: \Sigma fx = 1995,\ \Sigma f = 35
    reason: Midpoint times frequency, added
    check_id: chk_build_mth_sta_0077_t
  - n: 3
    latex: \text{mean} \approx \frac{1995}{35} = 57
    reason: Divide by the total frequency
    check_id: chk_build_mth_sta_0077_sc
difficulty:
  prior: 0.4
  band: core
estimated_seconds: 120
