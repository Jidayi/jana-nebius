solution:
  steps:
  - n: 1
    latex: \tan \theta = \frac{4}{13}
    reason: Opposite over adjacent
  - n: 2
    latex: \theta = \tan^{-1}\left(\frac{4}{13}\right) = 17.1
    reason: Inverse tangent
