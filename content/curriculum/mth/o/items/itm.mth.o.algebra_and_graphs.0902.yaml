  - rung: 1
    name: orient
    text:
      en: Expand each bracket on its own first, then collect like terms.
  - rung: 2
    name: concept
    text:
      en: Each bracket's multiplier reaches every term inside, so keep track of the signs.
  - rung: 3
    name: first_step
    text:
      en: The first bracket gives 12x + 3.
  - rung: 4
    name: worked_step
    text:
      en: In the second bracket, −2 × (−6) is positive.
  - rung: 5
    name: full_step
    text:
      en: The result is $6x + 15$.
solution:
  steps:
  - n: 1
    latex: 3(4x + 1) = 12x + 3
    reason: Multiply each term inside by the number outside
    check_id: chk_build_mth_alg_0902_f
  - n: 2
    latex: -\,2(3x - 6) = -\,6x + 12
    reason: A minus times a minus is a plus
  - n: 3
    latex: 12x - 6x = 6x
    reason: Collect the x terms
    check_id: chk_build_mth_alg_0902_x
  - n: 4
    latex: 3 + 12 = 15
    reason: Add up the constant terms
    check_id: chk_build_mth_alg_0902_n
  - n: 5
    latex: 3(4x + 1) - 2(3x - 6) = 6x + 15
    reason: Put the two together
