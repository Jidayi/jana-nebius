    text:
      en: The hypotenuse is the longest side, opposite the right angle.
  - rung: 2
    name: concept
    text:
      en: 'Pythagoras: hypotenuse² = sum of the squares of the other two sides.'
  - rung: 3
    name: first_step
    text:
      en: Square 6 and 13 and add them.
  - rung: 4
    name: worked_step
    text:
      en: The sum is 205; now take the square root.
  - rung: 5
    name: full_step
    text:
      en: The hypotenuse is 14.3 m.
