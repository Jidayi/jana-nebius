id: itm.mth.o.algebra_and_graphs.0224
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.quadratic_sequences
stem: A quadratic sequence begins 0, 2, 6, 12, …
parts:
- id: a
  prompt: Find the next term.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '20'
      correct: true
    - id: B
      text: '18'
      correct: false
      misconception_id: mc.mth.o.quadratic_sequence_as_linear
      feedback: The first differences of a quadratic sequence change. Add the second difference to the first differences to continue them.
    - id: C
      text: '14'
      correct: false
      misconception_id: mc.mth.o.nth_term_off_by_one
      feedback: 'Check with n = 1: your rule must give the first term itself.'
    - id: D
      text: '16'
      correct: false
      misconception_id: mc.mth.o.second_difference_not_halved
      feedback: For n² the second difference is 2, yet the coefficient is 1. Halve the second difference.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the differences between consecutive terms.
  - rung: 2
    name: concept
    text:
      en: In a quadratic sequence the first differences go up by the same amount each time.
  - rung: 3
    name: first_step
    text:
      en: The first differences are 2, 4, 6. How do they change?
  - rung: 4
    name: worked_step
    text:
      en: The next first difference is 6 + 2 = 8.
  - rung: 5
    name: full_step
    text:
      en: The next term is 12 + 8 = 20.
  misconception_ids:
  - mc.mth.o.nth_term_off_by_one
  - mc.mth.o.quadratic_sequence_as_linear
  - mc.mth.o.second_difference_not_halved
solution:
  steps:
  - n: 1
    latex: '\text{first differences: } 2, 4, 6'
    reason: Subtract consecutive terms
    check_id: chk_build_mth_alg_0224_d
  - n: 2
    latex: \text{next first difference} = 6 + 2 = 8
    reason: The second difference is constant
    check_id: chk_build_mth_alg_0224_nd
  - n: 3
    latex: 12 + 8 = 20
    reason: Add it to the last term
    check_id: chk_build_mth_alg_0224_ans
