id: itm.mth.o.transformations_and_vectors.0016
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.transformations_and_vectors.transform_points
stem: The point P(6, 1) is reflected in the line x = 3.
parts:
- id: a
  prompt: Find the x-coordinate of the image P′.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '0'
      correct: true
    - id: B
      text: '3'
      correct: false
      misconception_id: mc.mth.o.reflection_not_doubled
      feedback: The image is as far behind the mirror line as the point is in front of it.
    - id: C
      text: '6'
      correct: false
      misconception_id: mc.mth.o.reflection_axis_confused
      feedback: Reflecting in a vertical line x = k moves points left or right only, so only x changes.
    - id: D
      text: '12'
      correct: false
      misconception_id: mc.mth.o.translation_sign
      feedback: 'The top number moves right (negative: left); the bottom number moves up (negative: down). Add each to the matching coordinate.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The mirror line is vertical.
  - rung: 2
    name: concept
    text:
      en: Only the x-coordinate changes; the image is the same distance beyond the line.
  - rung: 3
    name: first_step
    text:
      en: Find how far 6 is from 3.
  - rung: 4
    name: worked_step
    text:
      en: The distance is -3 (with its direction). Go the same again past the line.
  - rung: 5
    name: full_step
    text:
      en: The image has x = 0.
  misconception_ids:
  - mc.mth.o.reflection_axis_confused
  - mc.mth.o.reflection_not_doubled
  - mc.mth.o.translation_sign
solution:
  steps:
  - n: 1
    latex: \text{distance to the line} = -3
    reason: Along the x-direction
    check_id: chk_build_mth_vec_0016_d
  - n: 2
    latex: x' = 3 + (-3) = 0
    reason: The same distance beyond the line
    check_id: chk_build_mth_vec_0016_ans
