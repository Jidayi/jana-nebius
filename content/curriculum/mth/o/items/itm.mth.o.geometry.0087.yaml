stem: Two similar photographs have heights 5 cm and 8 cm. The smaller one has an area of 12 cm².
parts:
- id: a
  prompt: Find the area of the larger one.
  marks: 3
  answer:
    kind: numeric
    value: '30.72'
    unit: cm^2
    unit_policy: equivalent
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_geo_0087_ans
  show_working: true
