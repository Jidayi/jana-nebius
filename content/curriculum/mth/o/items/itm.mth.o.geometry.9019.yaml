stem: Two solid models are similar. Their volumes are 64 cm^3 and 216 cm^3. The surface area of the smaller model is 80 cm^2.
parts:
- id: a
  prompt: Find the surface area of the larger model.
  marks: 2
  answer:
    kind: numeric
    value: '180'
    unit: cm^2
    unit_policy: equivalent
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mastery_supplement_mth_9019
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The cube root of the volume ratio is the length factor; the area ratio is the square of that factor.
  - rung: 2
    name: concept
    text:
      en: Convert the volume ratio into an area ratio before multiplying the smaller area.
  - rung: 3
    name: first_step
    text:
      en: Convert the volume ratio into an area ratio before multiplying the smaller area.
  - rung: 4
    name: worked_step
    text:
      en: 'Do not multiply the area by the volume ratio: first change to the area ratio.'
  - rung: 5
    name: full_step
    text:
      en: The answer is 180 cm^2.
solution:
  steps:
  - n: 1
    latex: 80 \left(\frac{216}{64}\right)^{\frac{2}{3}}
    reason: Convert the volume ratio into an area ratio before multiplying the smaller area.
    check_id: chk_build_mastery_supplement_mth_9019
  - n: 2
    latex: '180'
    reason: Evaluate in degree mode where needed; state the requested unit.
