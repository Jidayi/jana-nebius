stem: The functions f and g are given by $f(x) = 4x + 5$ and $g(x) = x^2 + 3$.
parts:
- id: a
  prompt: Find fg(-3).
  marks: 2
  answer:
    kind: numeric
    value: '53'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_alg_0303_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: fg(x) means f(g(x)). Which function is applied first?
  - rung: 2
    name: concept
    text:
      en: Work out g of the number first, then put that answer into f.
  - rung: 3
    name: first_step
    text:
      en: g(-3) = (-3)² + 3.
  - rung: 4
    name: worked_step
    text:
      en: g(-3) = 12. Now find f(12).
  - rung: 5
    name: full_step
    text:
      en: fg(-3) = 53.
  misconception_ids:
  - mc.mth.o.composite_order_reversed
  - mc.mth.o.composite_as_product
solution:
  steps:
  - n: 1
    latex: g(-3) = (-3)^2 + 3 = 12
    reason: The function next to x acts first
    check_id: chk_build_mth_alg_0303_g
  - n: 2
    latex: f(12) = 4 \times 12 + 5 = 53
    reason: Then apply f
    check_id: chk_build_mth_alg_0303_ans
