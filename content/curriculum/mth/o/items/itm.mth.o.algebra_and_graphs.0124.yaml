stem: Solve the simultaneous equations $4x + y = -12$ and $2x + y = -8$.
parts:
- id: a
  prompt: Find the value of x.
  marks: 3
  answer:
    kind: numeric
    value: '-2'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_alg_0124_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Look at the y terms: they have the same size of coefficient.'
  - rung: 2
    name: concept
    text:
      en: The y terms have the same signs, so subtract the equations to eliminate y.
  - rung: 3
    name: first_step
    text:
      en: Subtract the left sides and subtract the right sides.
  - rung: 4
    name: worked_step
    text:
      en: You get 2x = -4. Divide to find x.
  - rung: 5
    name: full_step
    text:
      en: x = -2.
  misconception_ids:
  - mc.mth.o.simultaneous_wrong_operation
  - mc.mth.o.simultaneous_other_unknown
  - mc.mth.o.back_substitution_slip
