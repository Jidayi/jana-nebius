  - n: 1
    latex: 4x + y = -12,\quad 2x + y = -8
    reason: The two equations
  - n: 2
    latex: 2x = -4
    reason: Subtract the equations to eliminate y
    check_id: chk_build_mth_alg_0124_e
  - n: 3
    latex: x = -2
    reason: Divide
    check_id: chk_build_mth_alg_0124_ans
  - n: 4
    latex: y = -4
    reason: Substitute back to find y as a check
    check_id: chk_build_mth_alg_0124_sol
