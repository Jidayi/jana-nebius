type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.statistics.grouped_mean
stem: 'The times, t minutes, that students took to finish a task are grouped: 20 ≤ t < 30: 11; 30 ≤ t < 40: 4; 40 ≤ t < 50: 10; 50 ≤ t < 60: 7.'
parts:
- id: a
  prompt: Estimate the mean time.
  marks: 3
  answer:
    kind: numeric
    value: '39.0625'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_sta_0071_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You do not know the exact times, so use one value for each class.
  - rung: 2
    name: concept
    text:
      en: Use the midpoint of each class, multiply by its frequency, add, and divide by the total frequency.
  - rung: 3
    name: first_step
    text:
      en: The first class has midpoint (20 + 30) ÷ 2.
  - rung: 4
    name: worked_step
    text:
      en: Σfx = 1250 and Σf = 32.
  - rung: 5
    name: full_step
    text:
      en: The estimated mean is 39.0625 minutes.
  misconception_ids:
  - mc.mth.o.grouped_upper_bound
  - mc.mth.o.frequency_mean_rows
  - mc.mth.o.class_width_wrong
solution:
  steps:
  - n: 1
    latex: '\text{midpoints: } 25, 35, 45, 55'
    reason: Middle of each class
    check_id: chk_build_mth_sta_0071_mids
  - n: 2
    latex: \Sigma fx = 1250,\ \Sigma f = 32
    reason: Midpoint times frequency, added
    check_id: chk_build_mth_sta_0071_t
  - n: 3
    latex: \text{mean} \approx \frac{1250}{32} = 39.0625
    reason: Divide by the total frequency
    check_id: chk_build_mth_sta_0071_sc
