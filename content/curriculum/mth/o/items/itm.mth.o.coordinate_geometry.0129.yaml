stem: Line L has gradient 0.25. Line P is perpendicular to L and passes through (-2, -3).
parts:
- id: a
  prompt: The equation of P is y = mx + c. Find c.
  marks: 3
  answer:
    kind: numeric
    value: '-11'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_crd_0129_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: First find the gradient of P.
  - rung: 2
    name: concept
    text:
      en: Perpendicular gradients multiply to −1.
  - rung: 3
    name: first_step
    text:
      en: The gradient of P is -4.
  - rung: 4
    name: worked_step
    text:
      en: Substitute (-2, -3) into y = -4x + c.
  - rung: 5
    name: full_step
    text:
      en: c = -11.
  misconception_ids:
