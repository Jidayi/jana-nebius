    latex: m = -\frac{1}{0.25} = -4
    reason: Negative reciprocal
    check_id: chk_build_mth_crd_0129_m2
  - n: 2
    latex: -3 = -4 \times (-2) + c
    reason: Substitute the point
  - n: 3
    latex: -4 \times (-2) = 8
    reason: Multiply
    check_id: chk_build_mth_crd_0129_t
  - n: 4
    latex: c = -3 - 8 = -11
    reason: Solve for c
    check_id: chk_build_mth_crd_0129_ans
