id: itm.mth.o.algebra_and_graphs.0030
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.expand_brackets
stem: Expand and simplify $(2x - 3)(5x + 3)$. The answer has the form px² + qx + r.
parts:
- id: a
  prompt: Find q, the coefficient of x.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '6'
      correct: false
      misconception_id: mc.mth.o.expand_missing_middle
      feedback: Draw a grid with x and a on one side and x and b on the other. Every box gives a term, so there are four products, not two.
    - id: B
      text: '21'
      correct: false
      misconception_id: mc.mth.o.expand_sign_slip
      feedback: 'Multiply the signs as well as the numbers: negative times positive is negative, negative times negative is positive.'
    - id: C
      text: '-9'
      correct: true
    - id: D
      text: '0'
      correct: false
      misconception_id: mc.mth.o.expand_add_constants
      feedback: 'Try x = 1 in both forms: the brackets and your expansion must give the same value. The last term comes from multiplying the two numbers.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Multiply every term in the first bracket by every term in the second: four products.'
  - rung: 2
    name: concept
    text:
      en: Only two of the four products contain x to the power one.
  - rung: 3
    name: first_step
    text:
      en: One x term is 2x × (3); the other is (−3) × 5x.
  - rung: 4
    name: worked_step
    text:
      en: The x terms are 6x and -15x.
  - rung: 5
    name: full_step
    text:
      en: q = 6 + (-15) = -9.
  misconception_ids:
  - mc.mth.o.expand_add_constants
  - mc.mth.o.expand_missing_middle
  - mc.mth.o.expand_sign_slip
solution:
  steps:
  - n: 1
    latex: (2x - 3)(5x + 3) = 10x^2 + 6x + (-15)x + (-9)
    reason: Four products, one for each pair of terms
    check_id: chk_build_mth_alg_0030_t
  - n: 2
    latex: q = 6 + (-15) = -9
    reason: Add the two x terms
    check_id: chk_build_mth_alg_0030_ans
