- kc.mth.o.algebra_and_graphs.substitution
stem: The kinetic energy of a moving object is given by $E = \tfrac{1}{2}mv^2$. An object has mass m = 8 kg and speed v = 7 m/s.
parts:
- id: a
  prompt: Find E in joules.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 784 J
      correct: false
      misconception_id: mc.mth.o.multiply_before_power
      feedback: The power belongs only to the letter next to it. Square x first, then multiply by the number in front.
    - id: B
      text: 392 J
      correct: false
      misconception_id: mc.mth.o.formula_half_dropped
      feedback: Read the formula one symbol at a time and tick each one off as you substitute; the ½ multiplies everything that follows it.
    - id: C
      text: 28 J
      correct: false
      misconception_id: mc.mth.o.power_dropped
      feedback: A small raised number tells you to multiply the value by itself. Check every power before you add the terms.
    - id: D
      text: 196 J
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Write the formula, then put each value in place of its letter.
  - rung: 2
    name: concept
    text:
      en: 'Only v is squared: the half and m are not.'
  - rung: 3
    name: first_step
    text:
      en: Work out 7² first.
  - rung: 4
    name: worked_step
    text:
      en: 7² = 49. Now multiply by 8 and halve.
  - rung: 5
    name: full_step
    text:
      en: E = ½ × 8 × 49 = 196 J.
  misconception_ids:
  - mc.mth.o.formula_half_dropped
  - mc.mth.o.multiply_before_power
  - mc.mth.o.power_dropped
solution:
  steps:
  - n: 1
    latex: E = \tfrac{1}{2}mv^2
    reason: The formula
  - n: 2
    latex: E = \tfrac{1}{2} \times 8 \times 7^2
    reason: Substitute
  - n: 3
    latex: E = \tfrac{1}{2} \times 8 \times 49
    reason: Square v first
    check_id: chk_build_mth_alg_0015_sq
  - n: 4
    latex: E = 196\ \text{J}
    reason: Multiply
    check_id: chk_build_mth_alg_0015_ans
