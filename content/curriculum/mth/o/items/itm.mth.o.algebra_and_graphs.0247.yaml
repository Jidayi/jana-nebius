stem: A speed-time graph for a motorbike is a straight line from (0 s, 0 m/s) to (15 s, 24 m/s).
parts:
- id: a
  prompt: Find the distance travelled in this time.
  marks: 2
  answer:
    kind: numeric
    value: '180'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_alg_0247_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: On a speed-time graph, which feature gives the distance travelled?
  - rung: 2
    name: concept
    text:
      en: The distance is the area under the graph.
  - rung: 3
    name: first_step
    text:
      en: The shape under the line is a trapezium (or a triangle if it starts at zero).
  - rung: 4
    name: worked_step
    text:
      en: Area = ½ × (0 + 24) × 15.
  - rung: 5
    name: full_step
    text:
      en: Distance = 180 m.
  misconception_ids:
  - mc.mth.o.graph_one_point
  - mc.mth.o.gradient_for_area
  - mc.mth.o.formula_half_dropped
solution:
  steps:
  - n: 1
    latex: d = \tfrac{1}{2}(u + v)t
    reason: The area is a triangle
  - n: 2
    latex: d = \tfrac{1}{2} \times 24 \times 15 = 180\ \text{m}
    reason: Evaluate
    check_id: chk_build_mth_alg_0247_s
