stem: Simplify $x^{6} \times x^{5} \div x^{3}$ and write the answer as $x^n$.
parts:
- id: a
  prompt: Find n.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '8'
      correct: true
    - id: B
      text: '27'
      correct: false
      misconception_id: mc.mth.o.index_multiply_for_product
      feedback: 'Write the powers out: x³ × x⁴ is three x''s times four x''s, which is seven x''s. Add the indices.'
    - id: C
      text: '3.67'
      correct: false
      misconception_id: mc.mth.o.index_divide_for_quotient
      feedback: 'Cancel the x''s one by one: dividing removes factors, so subtract the indices.'
    - id: D
      text: '14'
      correct: false
      misconception_id: mc.mth.o.index_add_for_quotient
      feedback: 'Dividing cancels factors, so the power goes down: subtract the index of the divisor.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: All the powers have the same base, x.
  - rung: 2
    name: concept
    text:
      en: Multiplying powers of the same base adds the indices; dividing subtracts them.
  - rung: 3
    name: first_step
    text:
      en: First combine x^6 × x^5.
  - rung: 4
    name: worked_step
    text:
      en: x^6 × x^5 = x^11. Now divide by x^3.
  - rung: 5
    name: full_step
    text:
      en: n = 11 − 3 = 8.
  misconception_ids:
  - mc.mth.o.index_add_for_quotient
  - mc.mth.o.index_divide_for_quotient
  - mc.mth.o.index_multiply_for_product
solution:
  steps:
  - n: 1
    latex: x^m \times x^k = x^{m + k}
    reason: 'Multiplying powers of the same base: add the indices'
  - n: 2
    latex: x^{6} \times x^{5} = x^{11}
    reason: Add
    check_id: chk_build_mth_alg_0104_s
  - n: 3
    latex: n = 11 - 3 = 8
    reason: 'Dividing: subtract the indices'
    check_id: chk_build_mth_alg_0104_ans
