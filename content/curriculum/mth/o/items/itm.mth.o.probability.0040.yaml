stem: The probability that it rains on Monday is 0.7. The probability that the bus is late on Tuesday is 0.75. The two events are independent.
parts:
- id: a
  prompt: Find the probability that at least one of them happens.
  marks: 3
  answer:
    kind: numeric
    value: '0.925'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_prb_0040_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: '''At least one'' covers several cases. Which single case is left out?'
  - rung: 2
    name: concept
    text:
      en: P(at least one) = 1 − P(neither).
  - rung: 3
    name: first_step
    text:
      en: P(neither) = (1 − 0.7) × (1 − 0.75).
  - rung: 4
    name: worked_step
    text:
      en: P(neither) = 0.075; subtract it from 1.
  - rung: 5
    name: full_step
    text:
      en: P(at least one) = 0.925.
  misconception_ids:
  - mc.mth.o.at_least_one_added
  - mc.mth.o.complement_of_both
  - mc.mth.o.and_as_add
solution:
  steps:
  - n: 1
    latex: P(\text{neither}) = (1 - 0.7)(1 - 0.75) = 0.075
    reason: Both fail to happen
    check_id: chk_build_mth_prb_0040_n
  - n: 2
    latex: P(\text{at least one}) = 1 - 0.075 = 0.925
    reason: Everything except neither
    check_id: chk_build_mth_prb_0040_ans
