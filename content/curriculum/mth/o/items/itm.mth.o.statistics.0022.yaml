id: itm.mth.o.statistics.0022
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.statistics.data_types
stem: A student collects data on the number of goals in a match.
parts:
- id: a
  prompt: What type of data is this?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: quantitative and continuous
      correct: false
      misconception_id: mc.mth.o.numbers_always_continuous
      feedback: 'Counted data (people, goals) jumps in whole steps: discrete. Measured data (height, time) can take any value: continuous.'
    - id: B
      text: qualitative
      correct: false
      misconception_id: mc.mth.o.coded_numbers_quantitative
      feedback: Adding two shirt numbers means nothing; they are names, so the data is qualitative.
    - id: C
      text: quantitative and discrete
      correct: true
    - id: D
      text: quantitative and both discrete and continuous
      correct: false
      misconception_id: mc.mth.o.discrete_continuous_swapped
      feedback: 'Ask: is it counted or measured? Counted is discrete; measured is continuous.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Is the data a number or a description?
  - rung: 2
    name: concept
    text:
      en: Numbers that are counted are discrete; numbers that are measured are continuous.
  - rung: 3
    name: first_step
    text:
      en: Numbers used only as labels are qualitative.
  - rung: 4
    name: worked_step
    text:
      en: Decide whether the value can be any number in a range, or only separate values.
  - rung: 5
    name: full_step
    text:
      en: The data is quantitative and discrete.
  misconception_ids:
  - mc.mth.o.coded_numbers_quantitative
  - mc.mth.o.discrete_continuous_swapped
  - mc.mth.o.numbers_always_continuous
solution:
  steps:
  - n: 1
    latex: \text{quantitative and discrete}
    reason: Counted, measured or described
