    text:
      en: 'There are two terms: ut and ½at². Work each one out separately.'
  - rung: 2
    name: concept
    text:
      en: In the second term only t is squared.
  - rung: 3
    name: first_step
    text:
      en: The first term is 4 × 7.
  - rung: 4
    name: worked_step
    text:
      en: ut = 28 and ½ × 2 × 7² = 49.
  - rung: 5
    name: full_step
    text:
      en: s = 28 + 49 = 77.
