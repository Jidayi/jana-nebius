    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_alg_0243_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The speed is the gradient of the distance-time graph.
  - rung: 2
    name: concept
    text:
      en: Gradient = change in distance ÷ change in time, between two points.
  - rung: 3
    name: first_step
    text:
      en: Change in distance = 160 − 120; change in time = 30 − 10.
  - rung: 4
    name: worked_step
    text:
      en: The changes are 40 m and 20 s.
  - rung: 5
    name: full_step
    text:
      en: Speed = 40 ÷ 20 = 2 m/s.
  misconception_ids:
