stem: The probability that spinner A shows a 6 is 0.3. The probability that spinner B shows a 6 is 0.75. The two events are independent.
parts:
- id: a
  prompt: Find the probability that exactly one of them happens.
  marks: 3
  answer:
    kind: numeric
    value: '0.6'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_prb_0035_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Draw a tree diagram with two sets of branches.
  - rung: 2
    name: concept
    text:
      en: 'Exactly one can happen in two ways: the first but not the second, or the second but not the first.'
  - rung: 3
    name: first_step
    text:
      en: 'Multiply along each path: 0.3 × (1 − 0.75), and (1 − 0.3) × 0.75.'
  - rung: 4
    name: worked_step
    text:
      en: The paths give 0.075 and 0.525; add them.
  - rung: 5
    name: full_step
    text:
      en: P(exactly one) = 0.6.
  misconception_ids:
  - mc.mth.o.complement_not_taken
  - mc.mth.o.and_as_add
  - mc.mth.o.complement_of_both
solution:
  steps:
  - n: 1
    latex: P(A, \text{not } B) = 0.3(1 - 0.75) = 0.075
    reason: First way
    check_id: chk_build_mth_prb_0035_t
  - n: 2
    latex: P(\text{not } A, B) = (1 - 0.3)0.75 = 0.525
    reason: Second way
  - n: 3
    latex: 0.075 + 0.525 = 0.6
    reason: Add the two ways
    check_id: chk_build_mth_prb_0035_ans
