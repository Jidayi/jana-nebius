stem: A sequence begins 2, 5, 8, 11, …
parts:
- id: a
  prompt: Find the 25th term.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '77'
      correct: false
      misconception_id: mc.mth.o.nth_term_off_by_one
      feedback: 'Check with n = 1: your rule must give the first term itself.'
    - id: B
      text: '74'
      correct: true
    - id: C
      text: '75'
      correct: false
      misconception_id: mc.mth.o.nth_term_no_constant
      feedback: dn gives the multiples of d. Compare them with the sequence and find what must be added or taken away.
    - id: D
      text: '53'
      correct: false
      misconception_id: mc.mth.o.nth_term_first_as_coefficient
      feedback: 'The number in front of n is how much the sequence goes up each time: the common difference.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: How much does the sequence change from one term to the next?
  - rung: 2
    name: concept
    text:
      en: The nth term of a linear sequence is dn + c, where d is the common difference.
  - rung: 3
    name: first_step
    text:
      en: Here d = 3. To find c, compare 3n with the first term.
  - rung: 4
    name: worked_step
    text:
      en: The nth term is 3n + (-1). Substitute n = 25.
  - rung: 5
    name: full_step
    text:
      en: The 25th term is 74.
  misconception_ids:
  - mc.mth.o.nth_term_first_as_coefficient
  - mc.mth.o.nth_term_no_constant
  - mc.mth.o.nth_term_off_by_one
solution:
  steps:
  - n: 1
    latex: d = 3
    reason: The common difference
    check_id: chk_build_mth_alg_0209_dd
  - n: 2
    latex: \text{nth term} = 3n + (-1)
    reason: The number added is the first term minus the difference
    check_id: chk_build_mth_alg_0209_c
  - n: 3
    latex: 3 \times 25 + (-1) = 74
    reason: Substitute n = 25
    check_id: chk_build_mth_alg_0209_ans
