  - n: 1
    latex: 5x + 3y = 40,\quad x + 3y = 20
    reason: The two equations
  - n: 2
    latex: 4x = 20
    reason: Subtract the equations to eliminate y
    check_id: chk_build_mth_alg_0128_e
  - n: 3
    latex: x = 5
    reason: Divide
    check_id: chk_build_mth_alg_0128_ans
  - n: 4
