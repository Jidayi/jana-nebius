stem: Evaluate $\int_{-2}^{3} (3x^2 + 2x + 4)\,dx$.
parts:
- id: a
  prompt: Give the exact value.
  marks: 4
  answer:
    kind: numeric
    value: '60'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_cal_0049_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'A definite integral is evaluated in two stages: integrate, then substitute the limits.'
  - rung: 2
    name: concept
    text:
      en: 'Integrate each term: xⁿ becomes xⁿ⁺¹ ÷ (n + 1).'
  - rung: 3
    name: first_step
    text:
      en: Write F(x), then work out F(3) and F(-2).
  - rung: 4
    name: worked_step
    text:
      en: F(3) = 48 and F(-2) = -12.
  - rung: 5
    name: full_step
    text:
      en: The integral is 60.
  misconception_ids:
  - mc.mth.o.integrate_by_differentiating
  - mc.mth.o.integral_power_not_divided
  - mc.mth.o.integral_limits_reversed
solution:
  steps:
  - n: 1
    latex: \int x^n\,dx = \frac{x^{n+1}}{n+1}
    reason: Raise each power by one and divide by the new power
  - n: 2
    latex: F(3) = 48,\ F(-2) = -12
    reason: Substitute the limits
    check_id: chk_build_mth_cal_0049_fb
  - n: 3
    latex: F(3) - F(-2) = 60
    reason: Top limit minus bottom limit
    check_id: chk_build_mth_cal_0049_ig
