id: itm.mth.o.coordinate_geometry.0056
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.coordinate_geometry.gradient
stem: A straight line passes through A(0, 6) and B(4, 0).
parts:
- id: a
  prompt: Find its gradient.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '-1.5'
      correct: true
    - id: B
      text: '-0.667'
      correct: false
      misconception_id: mc.mth.o.gradient_inverted
      feedback: 'Gradient = change in y ÷ change in x: how far up for each step across.'
    - id: C
      text: '1.5'
      correct: false
      misconception_id: mc.mth.o.gradient_order_mixed
      feedback: 'Use the same point first on the top and the bottom: (y₂ − y₁) ÷ (x₂ − x₁).'
    - id: D
      text: '0'
      correct: false
      misconception_id: mc.mth.o.graph_one_point
      feedback: A line that does not start at the origin gives the wrong value from one point. Use the change between two points.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The gradient measures how steep the line is.
  - rung: 2
    name: concept
    text:
      en: Gradient = change in y ÷ change in x.
  - rung: 3
    name: first_step
    text:
      en: Change in y = 0 − (6); change in x = 4 − (0).
  - rung: 4
    name: worked_step
    text:
      en: The changes are −6 and 4.
  - rung: 5
    name: full_step
    text:
      en: The gradient is -1.5.
  misconception_ids:
  - mc.mth.o.gradient_inverted
  - mc.mth.o.gradient_order_mixed
  - mc.mth.o.graph_one_point
solution:
  steps:
  - n: 1
    latex: m = \frac{y_2 - y_1}{x_2 - x_1}
    reason: Change in y over change in x
  - n: 2
    latex: m = \frac{0 - (6)}{4 - (0)} = \frac{-\,6}{4} = -1.5
    reason: Same order on top and bottom
    check_id: chk_build_mth_crd_0056_ans
