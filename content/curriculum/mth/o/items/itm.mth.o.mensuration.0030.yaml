    name: orient
    text:
      en: A triangle is half of a rectangle with the same base and height.
  - rung: 2
    name: concept
    text:
      en: Area of a triangle = ½ × base × height.
  - rung: 3
    name: first_step
    text:
      en: Work out 7.5 × 10 first.
  - rung: 4
    name: worked_step
    text:
      en: Then halve it.
  - rung: 5
    name: full_step
    text:
      en: The area is 37.5 cm².
  misconception_ids:
