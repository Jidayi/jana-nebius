stem: A triangle has base 7.5 cm and perpendicular height 10 cm.
parts:
- id: a
  prompt: Find its area.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 75 cm²
      correct: false
      misconception_id: mc.mth.o.formula_half_dropped
      feedback: Read the formula one symbol at a time and tick each one off as you substitute; the ½ multiplies everything that follows it.
    - id: B
      text: 17.5 cm²
      correct: false
      misconception_id: mc.mth.o.perimeter_area_confused
      feedback: Perimeter is a length around the edge (add the sides); area is the space inside (square units).
    - id: C
      text: 37.5 cm²
      correct: true
    - id: D
      text: 8.75 cm²
      correct: false
      misconception_id: mc.mth.o.sum_as_product
