stem: Solve the equation $\frac{x + 1}{2} = -1$.
parts:
- id: a
  prompt: Find x.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '-1'
      correct: false
      misconception_id: mc.mth.o.rearrange_inverse_sign
      feedback: 'Do the same to both sides: to remove + u, subtract u from both sides.'
    - id: B
      text: '-1.5'
      correct: false
      misconception_id: mc.mth.o.rearrange_wrong_inverse
      feedback: The opposite of multiplying by a is dividing by a. Check by putting numbers back into your answer.
    - id: C
      text: '-2'
      correct: false
      misconception_id: mc.mth.o.equation_divide_first
      feedback: 'Undo in reverse order: the + b was done last, so remove it first, then divide by a.'
    - id: D
      text: '-3'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The left side is divided by a number. How do you undo dividing?
  - rung: 2
    name: concept
    text:
      en: Multiply both sides by 2 first, then deal with the + 1.
  - rung: 3
    name: first_step
    text:
      en: Multiplying by 2 gives x + 1 = -2.
  - rung: 4
    name: worked_step
    text:
      en: Now subtract 1 from -2.
  - rung: 5
    name: full_step
    text:
      en: x = -3.
  misconception_ids:
