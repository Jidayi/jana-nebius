id: itm.mth.o.coordinate_geometry.0118
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.coordinate_geometry.parallel_lines
stem: Line L has equation $y = 3x - 1$. Line N is parallel to L and passes through (1, -6).
parts:
- id: a
  prompt: The equation of N is y = mx + c. Find c.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '-1'
      correct: false
      misconception_id: mc.mth.o.parallel_same_intercept
      feedback: Parallel lines share the gradient, not the intercept. Find the new c from the new point.
    - id: B
      text: '-5.67'
      correct: false
      misconception_id: mc.mth.o.parallel_perpendicular_confused
      feedback: 'Parallel: same gradient. Perpendicular: gradients multiply to −1.'
    - id: C
      text: '-9'
      correct: true
    - id: D
      text: '-3'
      correct: false
      misconception_id: mc.mth.o.intercept_sign
      feedback: 'Solve 0 = mx + c carefully: mx = −c, so x = −c/m.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Parallel lines never meet, so they have the same steepness.
  - rung: 2
    name: concept
    text:
      en: N has gradient 3, the same as L, but a different intercept.
  - rung: 3
    name: first_step
    text:
      en: Substitute x = 1, y = -6 and m = 3 into y = mx + c.
  - rung: 4
    name: worked_step
    text:
      en: 3 × (1) = 3.
  - rung: 5
    name: full_step
    text:
      en: c = -9.
  misconception_ids:
  - mc.mth.o.intercept_sign
  - mc.mth.o.parallel_perpendicular_confused
  - mc.mth.o.parallel_same_intercept
solution:
  steps:
  - n: 1
    latex: m = 3
    reason: Parallel lines have the same gradient
  - n: 2
    latex: -6 = 3 \times (1) + c
    reason: Substitute the point
  - n: 3
    latex: 3 \times (1) = 3
    reason: Multiply
    check_id: chk_build_mth_crd_0118_t
  - n: 4
    latex: c = -6 - 3 = -9
    reason: Solve for c
    check_id: chk_build_mth_crd_0118_ans
