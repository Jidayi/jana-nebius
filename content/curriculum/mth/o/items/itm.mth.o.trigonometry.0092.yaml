subject: mth
level: o
kc_ids:
- kc.mth.o.trigonometry.triangle_area_sine
stem: A triangular field has two sides of 9 m and 7 m with an angle of 57° between them.
parts:
- id: a
  prompt: Find the area of the field, to 3 significant figures.
  marks: 2
  answer:
    kind: numeric
    value: '26.4'
    unit: m^2
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_trg_0092_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You know two sides and the angle between them, not the height.
  - rung: 2
    name: concept
    text:
      en: Area = ½ × a × b × sin C, where C is the angle between sides a and b.
  - rung: 3
    name: first_step
    text:
      en: Work out 9 × 7 × sin 57°.
  - rung: 4
    name: worked_step
    text:
      en: Then halve it.
  - rung: 5
    name: full_step
    text:
      en: The area is 26.4 m².
  misconception_ids:
  - mc.mth.o.formula_half_dropped
  - mc.mth.o.trig_ratio_wrong
  - mc.mth.o.calculator_radians
solution:
  steps:
  - n: 1
    latex: A = \tfrac{1}{2}ab\sin C
    reason: Two sides and the included angle
  - n: 2
    latex: A = \tfrac{1}{2} \times 9 \times 7 \times \sin 57 = 26.4\ \text{m}^2
    reason: Substitute and evaluate
    check_id: chk_build_mth_trg_0092_ans
