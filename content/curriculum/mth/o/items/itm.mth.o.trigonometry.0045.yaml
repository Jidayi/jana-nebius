stem: In a right-angled triangle, the hypotenuse is 11 cm and the side opposite angle θ is 5 cm.
parts:
- id: a
  prompt: Find θ, to 1 decimal place.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 63.0°
      correct: false
      misconception_id: mc.mth.o.trig_ratio_wrong
      feedback: 'Label the sides from the angle you are using: opposite faces it, adjacent is next to it, hypotenuse is opposite the right angle.'
    - id: B
      text: 27.0°
      correct: true
    - id: C
      text: 24.4°
      correct: false
      misconception_id: mc.mth.o.trig_ratio_inverted
      feedback: tan θ = opposite ÷ adjacent. Write the ratio before pressing tan⁻¹.
    - id: D
      text: 0.47°
      correct: false
      misconception_id: mc.mth.o.calculator_radians
      feedback: 'Check the calculator shows D (degrees): sin 30 should give 0.5.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Which two sides do you know, measured from θ?
  - rung: 2
    name: concept
    text:
      en: 'Opposite and hypotenuse: use sin.'
  - rung: 3
    name: first_step
    text:
      en: sin θ = 5/11.
  - rung: 4
    name: worked_step
    text:
      en: Use the inverse sine of 5/11, in degrees.
  - rung: 5
    name: full_step
    text:
      en: θ = 27.0°.
  misconception_ids:
  - mc.mth.o.calculator_radians
  - mc.mth.o.trig_ratio_inverted
  - mc.mth.o.trig_ratio_wrong
solution:
  steps:
  - n: 1
    latex: \sin \theta = \frac{5}{11}
    reason: Opposite over hypotenuse
  - n: 2
    latex: \theta = \sin^{-1}\left(\frac{5}{11}\right) = 27.0
    reason: Inverse sine
    check_id: chk_build_mth_trg_0045_ans
