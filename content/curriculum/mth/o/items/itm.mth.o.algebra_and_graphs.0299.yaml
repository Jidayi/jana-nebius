id: itm.mth.o.algebra_and_graphs.0299
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.quadratic_features
stem: The graph of $y = x^2 + 6x + 5$ is a parabola.
parts:
- id: a
  prompt: Find the x-coordinate of its turning point.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '3'
      correct: false
      misconception_id: mc.mth.o.turning_point_sign
      feedback: 'Complete the square: x² + bx = (x + b/2)² − (b/2)², so the turning point is at x = −b/2.'
    - id: B
      text: '5'
      correct: false
      misconception_id: mc.mth.o.turning_value_as_intercept
      feedback: The y-intercept is where x = 0. The turning point is usually somewhere else, so substitute its x-value.
    - id: C
      text: '-6'
      correct: false
      misconception_id: mc.mth.o.formula_partial_division
      feedback: The whole of −b ± √(b² − 4ac) sits above the fraction line, so all of it is divided by 2a.
    - id: D
      text: '-3'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The turning point of a parabola lies on its line of symmetry.
  - rung: 2
    name: concept
    text:
      en: Completing the square, x² + bx + c = (x + b/2)² + …, puts the turning point at x = −b/2.
  - rung: 3
    name: first_step
    text:
      en: Here b = 6.
  - rung: 4
    name: worked_step
    text:
      en: x = −(6) ÷ 2.
  - rung: 5
    name: full_step
    text:
      en: x = -3.
  misconception_ids:
  - mc.mth.o.formula_partial_division
  - mc.mth.o.turning_point_sign
  - mc.mth.o.turning_value_as_intercept
solution:
  steps:
  - n: 1
    latex: x^2 + 6x + 5 = (x + 3)^2 - 4
    reason: Complete the square
    check_id: chk_build_mth_alg_0299_cs
  - n: 2
    latex: x = -3
    reason: The bracket is zero at the turning point
    check_id: chk_build_mth_alg_0299_ans
