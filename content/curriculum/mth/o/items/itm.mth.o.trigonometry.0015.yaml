stem: A right-angled triangle has shorter sides 9 m and 13 m.
parts:
- id: a
  prompt: Find the length of the hypotenuse, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 250 m
      correct: false
      misconception_id: mc.mth.o.pythag_no_root
      feedback: a² + b² is the square of the side. Take the square root as the last step.
    - id: B
      text: 22 m
      correct: false
      misconception_id: mc.mth.o.pythag_sides_added
      feedback: 'A 3, 4 triangle has hypotenuse 5, not 7: the direct route is shorter than going round two sides.'
    - id: C
      text: 9.38 m
      correct: false
      misconception_id: mc.mth.o.pythag_add_for_leg
      feedback: 'The hypotenuse is the longest side. To find a shorter side, subtract: b² = c² − a².'
    - id: D
      text: 15.8 m
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The hypotenuse is the longest side, opposite the right angle.
  - rung: 2
    name: concept
    text:
      en: 'Pythagoras: hypotenuse² = sum of the squares of the other two sides.'
  - rung: 3
    name: first_step
    text:
      en: Square 9 and 13 and add them.
  - rung: 4
    name: worked_step
    text:
      en: The sum is 250; now take the square root.
  - rung: 5
    name: full_step
    text:
      en: The hypotenuse is 15.8 m.
  misconception_ids:
