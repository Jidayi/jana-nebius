solution:
  steps:
  - n: 1
    latex: c^2 = a^2 + b^2
    reason: Pythagoras' theorem
  - n: 2
    latex: c^2 = 9^2 + 13^2 = 250
    reason: Square and add
    check_id: chk_build_mth_trg_0015_s
  - n: 3
    latex: c = \sqrt{250} = 15.8\ \text{m}
    reason: Square root
    check_id: chk_build_mth_trg_0015_ans
