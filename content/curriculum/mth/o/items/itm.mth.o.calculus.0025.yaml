stem: A curve has equation $y = -x^2 + 4x + 6$.
parts:
- id: a
  prompt: Find the gradient of the normal to the curve at the point where x = 1.
  marks: 3
  answer:
    kind: numeric
    value: '-0.5'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_cal_0025_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The normal is the line at right angles to the tangent.
  - rung: 2
    name: concept
    text:
      en: First find the tangent's gradient from dy/dx, then take the negative reciprocal.
  - rung: 3
    name: first_step
    text:
      en: Differentiate and substitute x = 1.
  - rung: 4
    name: worked_step
    text:
      en: The tangent's gradient is 2.
  - rung: 5
    name: full_step
    text:
      en: The normal's gradient is -0.5.
  misconception_ids:
  - mc.mth.o.normal_gradient_as_tangent
  - mc.mth.o.perpendicular_reciprocal_only
  - mc.mth.o.gradient_from_y
solution:
  steps:
  - n: 1
    latex: \frac{dy}{dx} = 2 \text{ at } x = 1
    reason: The tangent's gradient
    check_id: chk_build_mth_cal_0025_m
  - n: 2
    latex: m_{\text{normal}} = -\frac{1}{2} = -0.5
    reason: Perpendicular to the tangent
    check_id: chk_build_mth_cal_0025_ans
