stem: Simplify $\frac{x^2 + 6x + 8}{x^2 - 4}$ fully.
parts:
- id: a
  prompt: Type the fraction in its simplest form.
  marks: 2
  answer:
    kind: algebraic
    check_id: chk_build_mth_alg_0909_key
    expression: \frac{x + 4}{x - 2}
    variables:
    - x
    required_form: simplest
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'A fraction simplifies only by cancelling factors, not terms: factorise first.'
  - rung: 2
    name: concept
    text:
      en: The denominator is a difference of two squares; the numerator is a quadratic with number term 8.
  - rung: 3
    name: first_step
    text:
      en: x² − 4 = (x − 2)(x + 2).
  - rung: 4
    name: worked_step
    text:
      en: Look for a bracket that appears in both the numerator and the denominator.
  - rung: 5
    name: full_step
    text:
      en: After cancelling, the fraction is $\frac{x + 4}{x - 2}$.
solution:
  steps:
  - n: 1
    latex: \frac{x^2 + 6x + 8}{x^2 - 4} = \frac{(x + 4)(x + 2)}{(x - 2)(x + 2)}
    reason: Factorise the numerator and the denominator
    check_id: chk_build_mth_alg_0909_m
  - n: 2
    latex: = \frac{x + 4}{x - 2}
    reason: Cancel the common factor (x + 2)
