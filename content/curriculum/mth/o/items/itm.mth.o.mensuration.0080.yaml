subject: mth
level: o
kc_ids:
- kc.mth.o.mensuration.pyramid_cone_sphere
stem: A cone has base radius 6 cm and vertical height 10 cm.
parts:
- id: a
  prompt: Find its volume, to 3 significant figures.
  marks: 2
  answer:
    kind: numeric
    value: '377'
    unit: cm^3
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_mns_0080_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A cone is like a pyramid with a circular base.
  - rung: 2
    name: concept
    text:
      en: Volume of a cone = ⅓ × π × r² × h.
  - rung: 3
    name: first_step
    text:
      en: Work out π × 6² × 10 first.
  - rung: 4
    name: worked_step
    text:
      en: Then divide by 3.
  - rung: 5
    name: full_step
    text:
      en: The volume is 377 cm³.
  misconception_ids:
  - mc.mth.o.cone_third_dropped
  - mc.mth.o.diameter_for_radius
  - mc.mth.o.radius_not_squared
solution:
  steps:
  - n: 1
    latex: V = \tfrac{1}{3}\pi r^2 h
    reason: Volume of a cone
  - n: 2
    latex: V = \tfrac{1}{3} \times \pi \times 6^2 \times 10 = 377\ \text{cm}^3
    reason: Substitute and round
    check_id: chk_build_mth_mns_0080_ans
