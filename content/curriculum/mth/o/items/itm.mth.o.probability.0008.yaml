stem: A bag holds 11 red, 2 blue and 1 green counters. One counter is taken at random.
parts:
- id: a
  prompt: Find the probability that it is blue. Give your answer to 3 significant figures.
  marks: 2
  answer:
    kind: numeric
    value: '0.143'
    unit: null
    unit_policy: none
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_prb_0008_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Every counter is equally likely to be taken.
  - rung: 2
    name: concept
    text:
      en: Probability = number of favourable outcomes ÷ total number of outcomes.
  - rung: 3
    name: first_step
    text:
      en: Find the total number of counters first.
  - rung: 4
    name: worked_step
    text:
      en: There are 14 counters; count the ones that are blue.
  - rung: 5
    name: full_step
    text:
      en: P(blue) = 0.143.
  misconception_ids:
  - mc.mth.o.probability_as_odds
  - mc.mth.o.probability_equal_categories
  - mc.mth.o.complement_not_taken
solution:
  steps:
  - n: 1
    latex: \text{total} = 11 + 2 + 1 = 14
    reason: Count every counter
    check_id: chk_build_mth_prb_0008_n
  - n: 2
    latex: P = \frac{2}{14} = 0.143
    reason: Favourable over total
    check_id: chk_build_mth_prb_0008_ans
