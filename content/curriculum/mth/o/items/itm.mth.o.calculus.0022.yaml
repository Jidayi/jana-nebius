id: itm.mth.o.calculus.0022
version: 0.1.0
type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.calculus.tangents_normals
stem: A curve has equation $y = 2x^2 + 3x + 5$. The tangent to the curve at the point where x = 1 has equation y = mx + c.
parts:
- id: a
  prompt: Find c.
  marks: 4
  answer:
    kind: numeric
    value: '3'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_cal_0022_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A tangent touches the curve at one point and has the curve's gradient there.
  - rung: 2
    name: concept
    text:
      en: Find the point on the curve, then the gradient from dy/dx, then c from y = mx + c.
  - rung: 3
    name: first_step
    text:
      en: Substitute x = 1 into the curve for y, and into dy/dx for m.
  - rung: 4
    name: worked_step
    text:
      en: y = 10 and m = 7; now solve 10 = m × (1) + c.
  - rung: 5
    name: full_step
    text:
      en: c = 3.
  misconception_ids:
  - mc.mth.o.intercept_sign
  - mc.mth.o.c_as_y_coordinate
  - mc.mth.o.derivative_power_not_brought_down
solution:
  steps:
  - n: 1
    latex: 'y = 2x^2 + 3x + 5 \text{ at } x = 1: y = 10'
    reason: The point of contact
    check_id: chk_build_mth_cal_0022_y
  - n: 2
    latex: m = \frac{dy}{dx} = 7
    reason: Gradient from the derivative
    check_id: chk_build_mth_cal_0022_m
  - n: 3
    latex: c = 10 - 7 \times (1) = 3
    reason: Substitute the point into y = mx + c
    check_id: chk_build_mth_cal_0022_ans
