id: itm.mth.o.mensuration.0014
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.mensuration.metric_units
stem: A road is 0.4 km long.
parts:
- id: a
  prompt: Write this length in centimetres.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 400 cm
      correct: false
      misconception_id: mc.mth.o.scale_conversion_factor
      feedback: 'Go one step at a time: cm to m divide by 100, then m to km divide by 1000.'
    - id: B
      text: 0.000004 cm
      correct: false
      misconception_id: mc.mth.o.unit_conversion_direction
      feedback: 'Smaller units mean more of them: going to a smaller unit, the number gets bigger.'
    - id: C
      text: 40000 cm
      correct: true
    - id: D
      text: 40 cm
      correct: false
      misconception_id: mc.mth.o.area_units_linear
      feedback: A square of side 1 m is 100 cm by 100 cm, so it holds 10000 square centimetres.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Go one step at a time: kilometres to metres, then metres to centimetres.'
  - rung: 2
    name: concept
    text:
      en: 1 km = 1000 m and 1 m = 100 cm.
  - rung: 3
    name: first_step
    text:
      en: First multiply 0.4 by 1000.
  - rung: 4
    name: worked_step
    text:
      en: Then multiply by 100.
  - rung: 5
    name: full_step
    text:
      en: 0.4 km = 40000 cm.
  misconception_ids:
  - mc.mth.o.area_units_linear
  - mc.mth.o.scale_conversion_factor
  - mc.mth.o.unit_conversion_direction
solution:
  steps:
  - n: 1
    latex: 0.4\ \text{km} = 400\ \text{m}
    reason: 1 km = 1000 m
    check_id: chk_build_mth_mns_0014_m
  - n: 2
    latex: = 40000\ \text{cm}
    reason: 1 m = 100 cm
    check_id: chk_build_mth_mns_0014_ans
