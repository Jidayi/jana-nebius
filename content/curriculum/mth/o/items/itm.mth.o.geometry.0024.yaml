    text:
      en: Think about what each step needs to have been done before it.
  - rung: 2
    name: concept
    text:
      en: Compass arcs come before the straight line that joins the points they fix.
  - rung: 3
    name: first_step
    text:
      en: The first step starts from a point or a line you already have.
  - rung: 4
    name: worked_step
    text:
      en: The final step always draws a straight line through crossing points.
  - rung: 5
    name: full_step
    text:
      en: 'The steps go in the order given by the construction: Draw the longest side with a ruler and label its ends; Set the compasses to the second length and draw an arc from one end; Set the compasses to the third length and draw an arc from the other end; Join the point where the arcs cross to both ends of the first side.'
solution:
