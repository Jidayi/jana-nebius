stem: These are the steps to construct a triangle from its three sides with a ruler and compasses.
parts:
- id: a
  prompt: Put the steps in order.
  marks: 2
  answer:
    kind: ordering
    scoring: exact
    elements:
    - id: e2
      text: Set the compasses to the second length and draw an arc from one end
    - id: e3
      text: Set the compasses to the third length and draw an arc from the other end
    - id: e4
      text: Join the point where the arcs cross to both ends of the first side
    - id: e1
      text: Draw the longest side with a ruler and label its ends
    correct_order:
    - e1
    - e2
    - e3
    - e4
  show_working: false
