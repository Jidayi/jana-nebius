    text:
      en: Multiply every component of a by 2 and of b by 5, then subtract.
  - rung: 3
    name: first_step
    text:
      en: 'In the bottom row: 2 × (-1) and 5 × (-2).'
  - rung: 4
    name: worked_step
    text:
