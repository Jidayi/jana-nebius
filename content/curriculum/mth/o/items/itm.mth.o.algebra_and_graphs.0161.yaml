stem: A rectangular garden is 5 m longer than it is wide. Its perimeter is 62 m.
parts:
- id: a
  prompt: Form an equation in w, the width in metres, and solve it to find the width.
  marks: 3
  answer:
    kind: numeric
    value: '13'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_alg_0161_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Let the width be w. What is the length?
  - rung: 2
    name: concept
    text:
      en: The length is w + 5. A rectangle has two lengths and two widths.
  - rung: 3
    name: first_step
    text:
      en: The perimeter is 2(w + w + 5) = 62.
  - rung: 4
    name: worked_step
    text:
      en: Halving both sides gives 2w + 5 = 31.
  - rung: 5
    name: full_step
    text:
      en: w = 13 m.
  misconception_ids:
