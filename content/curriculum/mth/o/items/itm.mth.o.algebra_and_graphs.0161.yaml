    latex: 2(w + w + 5) = 62
    reason: Perimeter is twice length plus width
  - n: 2
    latex: 2w + 5 = 31
    reason: Divide both sides by 2
  - n: 3
    latex: 2w = 26
    reason: Subtract 5
    check_id: chk_build_mth_alg_0161_s
