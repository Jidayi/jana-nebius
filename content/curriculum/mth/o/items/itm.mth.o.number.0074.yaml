stem: Work out $\frac{1}{6} + \frac{4}{5}$.
parts:
- id: a
  prompt: Choose the answer in its simplest form.
  marks: 2
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: $\frac{5}{11}$
      correct: false
      misconception_id: mc.mth.o.add_tops_and_bottoms
      feedback: One half plus one half is one, not two quarters. Fractions need a common denominator before you add the numerators.
    - id: B
      text: $\frac{1}{6}$
      correct: false
      misconception_id: mc.mth.o.numerator_not_scaled
      feedback: Whatever you multiply the bottom by, multiply the top by too, so each fraction keeps its value.
    - id: C
      text: $\frac{29}{30}$
      correct: true
    - id: D
      text: $\frac{29}{11}$
      correct: false
      misconception_id: mc.mth.o.denominators_added
      feedback: Once the fractions share a denominator, the denominator stays the same; only the numerators are added.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: You can only add or subtract fractions with the same denominator.
  - rung: 2
    name: concept
    text:
      en: Find the lowest common multiple of 6 and 5.
  - rung: 3
    name: first_step
    text:
      en: The common denominator is 30.
  - rung: 4
    name: worked_step
    text:
      en: Write both fractions with denominator 30, then add the numerators.
  - rung: 5
    name: full_step
    text:
      en: The answer is $\frac{29}{30}$.
  misconception_ids:
  - mc.mth.o.add_tops_and_bottoms
  - mc.mth.o.denominators_added
  - mc.mth.o.numerator_not_scaled
solution:
  steps:
  - n: 1
    latex: \frac{1}{6} = \frac{5}{30},\ \frac{4}{5} = \frac{24}{30}
    reason: Write both fractions over the lowest common denominator
    check_id: chk_build_mth_num_0074_t
  - n: 2
    latex: \frac{5 + 24}{30} = \frac{29}{30}
    reason: Add the numerators
    check_id: chk_build_mth_num_0074_s
  - n: 3
    latex: = \frac{29}{30}
    reason: Simplify
    check_id: chk_build_mth_num_0074_k
