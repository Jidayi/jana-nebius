stem: Evaluate $\int_{-1}^{3} (6x^2 + 4x + 1)\,dx$.
parts:
- id: a
  prompt: Give the exact value.
  marks: 4
  answer:
    kind: numeric
    value: '76'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_cal_0052_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'A definite integral is evaluated in two stages: integrate, then substitute the limits.'
  - rung: 2
    name: concept
    text:
      en: 'Integrate each term: xⁿ becomes xⁿ⁺¹ ÷ (n + 1).'
  - rung: 3
    name: first_step
    text:
      en: Write F(x), then work out F(3) and F(-1).
  - rung: 4
    name: worked_step
    text:
      en: F(3) = 75 and F(-1) = -1.
  - rung: 5
    name: full_step
    text:
      en: The integral is 76.
  misconception_ids:
