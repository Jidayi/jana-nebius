  - mc.mth.o.integral_power_not_divided
  - mc.mth.o.integral_limits_reversed
solution:
  steps:
  - n: 1
    latex: \int x^n\,dx = \frac{x^{n+1}}{n+1}
    reason: Raise each power by one and divide by the new power
  - n: 2
    latex: F(3) = 75,\ F(-1) = -1
    reason: Substitute the limits
    check_id: chk_build_mth_cal_0052_fb
  - n: 3
    latex: F(3) - F(-1) = 76
    reason: Top limit minus bottom limit
    check_id: chk_build_mth_cal_0052_ig
