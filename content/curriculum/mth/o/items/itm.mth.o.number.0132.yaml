  - rung: 1
    name: orient
    text:
      en: 'Look at the index: is it zero, negative or a fraction?'
  - rung: 2
    name: concept
    text:
      en: A negative index means 'one over'; the denominator of a fractional index is a root and the numerator is a power; a number to the power zero is the number divided by itself.
  - rung: 3
    name: first_step
    text:
      en: 'Think of the pattern of powers going down: each step divides by the base.'
  - rung: 4
    name: worked_step
    text:
      en: Dividing a power by itself leaves the base to the power zero.
  - rung: 5
    name: full_step
    text:
      en: $100^{0}$ = 1.
