stem: In a class of 32 students, 18 play football, 13 play netball and 7 do both. Let A be the set of students who play football and B the set who play netball.
parts:
- id: a
  prompt: How many students do neither?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '1'
      correct: false
      misconception_id: mc.mth.o.venn_complement_wrong
      feedback: Find n(A ∪ B) first, then subtract it from the total.
    - id: B
      text: '8'
      correct: true
    - id: C
      text: '15'
      correct: false
      misconception_id: mc.mth.o.venn_double_count
      feedback: 'Shade A, then shade B: the middle region gets shaded twice. Subtract it once.'
    - id: D
      text: '24'
      correct: false
      misconception_id: mc.mth.o.venn_only_includes_overlap
      feedback: '''A only'' is the part of circle A outside circle B: n(A) minus the overlap.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The students who do neither are outside both circles.
  - rung: 2
    name: concept
    text:
      en: Find how many are inside at least one circle, then subtract from the class total.
  - rung: 3
    name: first_step
    text:
      en: n(A ∪ B) = 18 + 13 − 7.
  - rung: 4
    name: worked_step
    text:
      en: n(A ∪ B) = 24. Now subtract from 32.
  - rung: 5
    name: full_step
    text:
      en: Neither = 32 − 24 = 8.
  misconception_ids:
  - mc.mth.o.venn_complement_wrong
  - mc.mth.o.venn_double_count
  - mc.mth.o.venn_only_includes_overlap
solution:
  steps:
  - n: 1
    latex: n(A \cup B) = 24
    reason: 18 + 13 - 7
    check_id: chk_build_mth_num_0053_u
  - n: 2
    latex: n((A \cup B)') = 32 - 24 = 8
    reason: The rest are outside both circles
    check_id: chk_build_mth_num_0053_ans
