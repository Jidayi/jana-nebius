id: itm.mth.o.coordinate_geometry.0109
version: 0.1.0
type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.coordinate_geometry.parallel_lines
stem: Line L has equation $y = -3x - 5$. Line N is parallel to L and passes through (-2, 5).
parts:
- id: a
  prompt: The equation of N is y = mx + c. Find c.
  marks: 2
  answer:
    kind: numeric
    value: '-1'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_crd_0109_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Parallel lines never meet, so they have the same steepness.
  - rung: 2
    name: concept
    text:
      en: N has gradient -3, the same as L, but a different intercept.
  - rung: 3
    name: first_step
    text:
      en: Substitute x = -2, y = 5 and m = -3 into y = mx + c.
  - rung: 4
    name: worked_step
    text:
      en: -3 × (-2) = 6.
  - rung: 5
    name: full_step
    text:
      en: c = -1.
  misconception_ids:
  - mc.mth.o.parallel_same_intercept
  - mc.mth.o.parallel_perpendicular_confused
  - mc.mth.o.intercept_sign
solution:
  steps:
  - n: 1
    latex: m = -3
    reason: Parallel lines have the same gradient
  - n: 2
    latex: 5 = -3 \times (-2) + c
    reason: Substitute the point
  - n: 3
    latex: -3 \times (-2) = 6
    reason: Multiply
    check_id: chk_build_mth_crd_0109_t
  - n: 4
    latex: c = 5 - 6 = -1
    reason: Solve for c
    check_id: chk_build_mth_crd_0109_ans
