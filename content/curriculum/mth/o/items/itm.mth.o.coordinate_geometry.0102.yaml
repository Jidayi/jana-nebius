id: itm.mth.o.coordinate_geometry.0102
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.coordinate_geometry.line_equation
stem: A straight line passes through (2, 13) and (4, 21). Its equation is y = mx + c.
parts:
- id: a
  prompt: Find c.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '21'
      correct: false
      misconception_id: mc.mth.o.intercept_sign
      feedback: 'Solve 0 = mx + c carefully: mx = −c, so x = −c/m.'
    - id: B
      text: '13'
      correct: false
      misconception_id: mc.mth.o.c_as_y_coordinate
      feedback: 'Substitute the point into y = mx + c and solve for c: c = y₁ − mx₁.'
    - id: C
      text: '5'
      correct: true
    - id: D
      text: '12.5'
      correct: false
      misconception_id: mc.mth.o.gradient_inverted
      feedback: 'Gradient = change in y ÷ change in x: how far up for each step across.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the gradient first, from the two points.
  - rung: 2
    name: concept
    text:
      en: Then put one point into y = mx + c and solve for c.
  - rung: 3
    name: first_step
    text:
      en: m = (21 − (13)) ÷ (4 − (2)).
  - rung: 4
    name: worked_step
    text:
      en: m = 4. Substitute (2, 13).
  - rung: 5
    name: full_step
    text:
      en: c = 5.
  misconception_ids:
  - mc.mth.o.c_as_y_coordinate
  - mc.mth.o.gradient_inverted
  - mc.mth.o.intercept_sign
solution:
  steps:
  - n: 1
    latex: m = \frac{21 - (13)}{4 - (2)} = 4
    reason: Gradient first
    check_id: chk_build_mth_crd_0102_m
  - n: 2
    latex: 13 = 4 \times (2) + c
    reason: Substitute one point
  - n: 3
    latex: c = 5
    reason: Solve for c
    check_id: chk_build_mth_crd_0102_ans
