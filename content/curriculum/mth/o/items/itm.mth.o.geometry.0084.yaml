stem: Two similar jugs have heights 2 cm and 3 cm. The smaller one has a volume of 40 cm³.
parts:
- id: a
  prompt: Find the volume of the larger one.
  marks: 3
  answer:
    kind: numeric
    value: '135'
    unit: cm^3
    unit_policy: equivalent
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_geo_0084_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the length scale factor first.
  - rung: 2
    name: concept
    text:
      en: For similar shapes, volumes change by the cube of the length scale factor.
  - rung: 3
    name: first_step
    text:
      en: The length scale factor is 3 ÷ 2.
  - rung: 4
    name: worked_step
    text:
      en: The volume factor is 3.375.
  - rung: 5
    name: full_step
    text:
      en: The larger volume is 40 × 3.375 = 135.
  misconception_ids:
  - mc.mth.o.similar_length_factor_for_area
  - mc.mth.o.similar_area_factor_for_volume
  - mc.mth.o.similar_factor_inverted
solution:
  steps:
  - n: 1
    latex: k = \frac{3}{2}
    reason: Length scale factor
    check_id: chk_build_mth_geo_0084_k
  - n: 2
    latex: \text{volume factor} = k^3 = 3.375
    reason: Volumes scale by k^3
    check_id: chk_build_mth_geo_0084_f
  - n: 3
    latex: 40 \times 3.375 = 135
    reason: Multiply
    check_id: chk_build_mth_geo_0084_ans
