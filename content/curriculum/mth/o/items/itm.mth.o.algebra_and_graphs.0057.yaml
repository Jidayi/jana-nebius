  reviewers: []
checks:
  chk_build_mth_alg_0057_final:
    args:
      equations:
      - p = abs(2)
      - q = abs(-3)
      unknowns:
      - p
      - q
    tool: math_solve
  chk_build_mth_alg_0057_m:
    args:
      equations:
      - p = abs((2)*(-3))
      - q = abs((2) + (-3))
      unknowns:
      - p
      - q
    tool: math_solve
  chk_build_mth_alg_0057_roots:
    args:
      equations:
      - x^2 + (-1)*x + (-6) = 0
      unknowns:
      - x
    tool: math_solve
