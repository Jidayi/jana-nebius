id: itm.mth.o.algebra_and_graphs.0057
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.factorise_quadratic
stem: Factorise $x^2 - x - 6$.
parts:
- id: a
  prompt: Choose the correct factorisation.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $(x - 2)(x + 3)$
      correct: false
      misconception_id: mc.mth.o.factor_signs_swapped
      feedback: Expand your brackets to check the middle term. If its sign is wrong, swap the signs in the brackets.
    - id: B
      text: $(x + 2)(x - 3)$
      correct: true
    - id: C
      text: $(x + 1)(x - 6)$
      correct: false
      misconception_id: mc.mth.o.factor_pair_product_only
      feedback: You need two numbers that multiply to give the last term and also add to give the middle coefficient. List the factor pairs and test both conditions.
    - id: D
      text: $(x + 2)(x + 3)$
      correct: false
      misconception_id: mc.mth.o.expand_sign_slip
      feedback: 'Multiply the signs as well as the numbers: negative times positive is negative, negative times negative is positive.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: You need two brackets of the form (x + m)(x + n).
  - rung: 2
    name: concept
    text:
      en: Find two numbers that multiply to give the number term and add to give the coefficient of x.
  - rung: 3
    name: first_step
    text:
      en: List the factor pairs of −6 and check which pair adds to −1.
  - rung: 4
    name: worked_step
    text:
      en: 'Watch the signs: a negative product means one number is negative; a negative sum means the larger one is negative.'
  - rung: 5
    name: full_step
    text:
      en: The numbers are 2 and −3, so the answer is $(x + 2)(x - 3)$.
  misconception_ids:
  - mc.mth.o.expand_sign_slip
  - mc.mth.o.factor_pair_product_only
  - mc.mth.o.factor_signs_swapped
solution:
  steps:
  - n: 1
    latex: 2 \times (-\,3) = (-\,6),\ 2 + (-\,3) = (-\,1)
    reason: Two numbers that multiply to the last term and add to the middle coefficient
    check_id: chk_build_mth_alg_0057_m
  - n: 2
    latex: x^2 - x - 6 = (x + 2)(x - 3)
    reason: Put the two numbers in the brackets
    check_id: chk_build_mth_alg_0057_final
  - n: 3
    latex: '\text{Check: the solutions of } x^2 - x - 6 = 0 \text{ are } x = -2, 3'
    reason: Each bracket equal to zero
    check_id: chk_build_mth_alg_0057_roots
difficulty:
  prior: 0.3
  band: core
estimated_seconds: 60
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: false
context_tags:
- none
provenance:
