id: itm.mth.o.probability.0041
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.probability.independent_events
stem: The probability that Ama scores a goal is 0.2. The probability that Kofi scores a goal is 0.75. The two events are independent.
parts:
- id: a
  prompt: Find the probability that exactly one of them happens.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '0.05'
      correct: false
      misconception_id: mc.mth.o.complement_not_taken
      feedback: P(not A) = 1 − P(A).
    - id: B
      text: '0.65'
      correct: true
    - id: C
      text: '0.95'
      correct: false
      misconception_id: mc.mth.o.and_as_add
      feedback: 'Two coins both landing heads is less likely than one: ½ × ½ = ¼, not ½ + ½ = 1.'
    - id: D
      text: '0.15'
      correct: false
      misconception_id: mc.mth.o.complement_of_both
      feedback: '''At least one'' fails only when neither happens, so subtract P(neither) from 1.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Draw a tree diagram with two sets of branches.
  - rung: 2
    name: concept
    text:
      en: 'Exactly one can happen in two ways: the first but not the second, or the second but not the first.'
  - rung: 3
    name: first_step
    text:
      en: 'Multiply along each path: 0.2 × (1 − 0.75), and (1 − 0.2) × 0.75.'
  - rung: 4
    name: worked_step
    text:
      en: The paths give 0.05 and 0.6; add them.
  - rung: 5
    name: full_step
    text:
      en: P(exactly one) = 0.65.
  misconception_ids:
  - mc.mth.o.and_as_add
  - mc.mth.o.complement_not_taken
  - mc.mth.o.complement_of_both
solution:
  steps:
  - n: 1
    latex: P(A, \text{not } B) = 0.2(1 - 0.75) = 0.05
    reason: First way
    check_id: chk_build_mth_prb_0041_t
  - n: 2
    latex: P(\text{not } A, B) = (1 - 0.2)0.75 = 0.6
    reason: Second way
  - n: 3
    latex: 0.05 + 0.6 = 0.65
    reason: Add the two ways
    check_id: chk_build_mth_prb_0041_ans
