id: itm.mth.o.algebra_and_graphs.0216
version: 0.1.0
type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.quadratic_sequences
stem: A quadratic sequence begins 2, 10, 22, 38, …
parts:
- id: a
  prompt: Find the coefficient of n² in its nth term.
  marks: 2
  answer:
    kind: numeric
    value: '2'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_alg_0216_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the differences between consecutive terms. Are they the same?
  - rung: 2
    name: concept
    text:
      en: For a quadratic sequence the second differences are constant, and the coefficient of n² is half the second difference.
  - rung: 3
    name: first_step
    text:
      en: Work out the first differences, then their differences.
  - rung: 4
    name: worked_step
    text:
      en: The second difference is 4.
  - rung: 5
    name: full_step
    text:
      en: The coefficient of n² is 4 ÷ 2 = 2.
  misconception_ids:
  - mc.mth.o.second_difference_not_halved
  - mc.mth.o.quadratic_sequence_as_linear
  - mc.mth.o.nth_term_off_by_one
solution:
  steps:
  - n: 1
    latex: '\text{first differences: } 8, 12, \ldots'
    reason: Subtract consecutive terms
  - n: 2
    latex: \text{second difference} = 4
    reason: Subtract consecutive first differences
    check_id: chk_build_mth_alg_0216_d
  - n: 3
    latex: \text{coefficient of } n^2 = \frac{4}{2} = 2
    reason: Halve the second difference
    check_id: chk_build_mth_alg_0216_ans
