    name: orient
    text:
      en: This quadratic does not factorise with whole numbers. Which method works for any quadratic?
  - rung: 2
    name: concept
    text:
      en: Use the quadratic formula with a, b and c read from the equation.
  - rung: 3
    name: first_step
    text:
      en: Here a = 1, b = −3 and c = −2. Work out b² − 4ac first.
  - rung: 4
    name: worked_step
    text:
      en: b² − 4ac = 17. Now use x = (−b - √(17)) ÷ (2 × 1).
  - rung: 5
    name: full_step
    text:
