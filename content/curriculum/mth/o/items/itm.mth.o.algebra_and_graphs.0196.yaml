    text:
      en: The nth term of a linear sequence is dn + c, where d is the common difference.
  - rung: 3
    name: first_step
    text:
      en: Here d = 3. To find c, compare 3n with the first term.
  - rung: 4
    name: worked_step
    text:
      en: The nth term is 3n + (-1). Substitute n = 50.
  - rung: 5
    name: full_step
    text:
      en: The 50th term is 149.
