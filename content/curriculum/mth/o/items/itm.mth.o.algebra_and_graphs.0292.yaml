  - n: 1
    latex: x = -\frac{b}{2} = 1
    reason: The line of symmetry
    check_id: chk_build_mth_alg_0292_x0
  - n: 2
    latex: y = (1)^2 - 2(1) + 0 = -1
    reason: Substitute into the equation
    check_id: chk_build_mth_alg_0292_ans
