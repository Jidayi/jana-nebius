    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_alg_0292_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: First find where the turning point is across the graph.
  - rung: 2
    name: concept
    text:
      en: The turning point is at x = −b/2; substitute that x into the equation.
  - rung: 3
    name: first_step
    text:
      en: x = −(−2) ÷ 2 = 1.
  - rung: 4
    name: worked_step
    text:
      en: Substitute x = 1.
  - rung: 5
    name: full_step
    text:
      en: y = -1.
  misconception_ids:
