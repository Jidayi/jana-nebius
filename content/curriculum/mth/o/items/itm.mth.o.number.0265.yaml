stem: A taxi travels 12 km in 24 minutes.
parts:
- id: a
  prompt: Find its average speed in km/h.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 0.5 km/h
      correct: false
      misconception_id: mc.mth.o.minutes_as_hours
      feedback: Change minutes into hours by dividing by 60 before you divide the distance by the time.
    - id: B
      text: 30 km/h
      correct: true
    - id: C
      text: 0.0333 km/h
      correct: false
      misconception_id: mc.mth.o.rate_inverted
      feedback: 'Read the unit: g/cm³ means grams divided by cubic centimetres.'
    - id: D
      text: 4.8 km/h
      correct: false
      misconception_id: mc.mth.o.rate_multiplied
      feedback: 'A rate is ''per'': how much for each one, so it is a division.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The speed is wanted in km/h, so the time must be in hours.
  - rung: 2
    name: concept
    text:
      en: Average speed is distance divided by time.
  - rung: 3
    name: first_step
    text:
      en: 24 minutes is 24/60 of an hour.
  - rung: 4
    name: worked_step
    text:
      en: Divide 12 by 24/60.
  - rung: 5
    name: full_step
    text:
      en: Speed = 30 km/h.
  misconception_ids:
  - mc.mth.o.minutes_as_hours
  - mc.mth.o.rate_inverted
  - mc.mth.o.rate_multiplied
solution:
  steps:
  - n: 1
    latex: 24\ \text{min} = \frac{24}{60}\ \text{h}
    reason: Change to hours
  - n: 2
    latex: \text{speed} = 12 \div \frac{24}{60} = 30\ \text{km/h}
    reason: Distance over time
