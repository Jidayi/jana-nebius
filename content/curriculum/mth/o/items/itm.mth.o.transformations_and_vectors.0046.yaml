  hints:
  - rung: 1
    name: orient
    text:
      en: Work with one row of the column vectors at a time.
  - rung: 2
    name: concept
    text:
      en: Multiply every component of a by 3 and of b by 3, then subtract.
  - rung: 3
    name: first_step
    text:
      en: 'In the top row: 3 × (5) and 3 × (2).'
  - rung: 4
    name: worked_step
    text:
      en: Those are 15 and 6. Subtract, keeping the signs.
  - rung: 5
    name: full_step
    text:
      en: The component is 9.
  misconception_ids:
