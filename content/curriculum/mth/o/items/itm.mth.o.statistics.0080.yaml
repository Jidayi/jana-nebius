id: itm.mth.o.statistics.0080
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.statistics.grouped_mean
stem: 'The times, t minutes, that students took to finish a task are grouped: 20 ≤ t < 30: 4; 30 ≤ t < 40: 12; 40 ≤ t < 50: 7; 50 ≤ t < 60: 9.'
parts:
- id: a
  prompt: Estimate the mean time.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 41.5625 minutes
      correct: true
    - id: B
      text: 46.5625 minutes
      correct: false
      misconception_id: mc.mth.o.grouped_upper_bound
      feedback: 'The midpoint is the best single value for a class: add the ends and halve.'
    - id: C
      text: 332.5 minutes
      correct: false
      misconception_id: mc.mth.o.frequency_mean_rows
      feedback: 'The mean shares the total among all the items: divide by Σf.'
    - id: D
      text: 36.5625 minutes
      correct: false
      misconception_id: mc.mth.o.class_width_wrong
      feedback: Class width = upper boundary − lower boundary.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: You do not know the exact times, so use one value for each class.
  - rung: 2
    name: concept
    text:
      en: Use the midpoint of each class, multiply by its frequency, add, and divide by the total frequency.
  - rung: 3
    name: first_step
    text:
      en: The first class has midpoint (20 + 30) ÷ 2.
  - rung: 4
    name: worked_step
    text:
      en: Σfx = 1330 and Σf = 32.
  - rung: 5
    name: full_step
    text:
      en: The estimated mean is 41.5625 minutes.
  misconception_ids:
  - mc.mth.o.class_width_wrong
  - mc.mth.o.frequency_mean_rows
  - mc.mth.o.grouped_upper_bound
solution:
  steps:
  - n: 1
    latex: '\text{midpoints: } 25, 35, 45, 55'
    reason: Middle of each class
    check_id: chk_build_mth_sta_0080_mids
  - n: 2
    latex: \Sigma fx = 1330,\ \Sigma f = 32
    reason: Midpoint times frequency, added
    check_id: chk_build_mth_sta_0080_t
  - n: 3
    latex: \text{mean} \approx \frac{1330}{32} = 41.5625
    reason: Divide by the total frequency
    check_id: chk_build_mth_sta_0080_sc
