stem: Two similar jugs have heights 3 cm and 4 cm. The smaller one has a volume of 24 cm³.
parts:
- id: a
  prompt: Find the volume of the larger one.
  marks: 3
  answer:
    kind: numeric
    value: '56.9'
    unit: cm^3
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_geo_0081_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the length scale factor first.
  - rung: 2
    name: concept
    text:
      en: For similar shapes, volumes change by the cube of the length scale factor.
  - rung: 3
    name: first_step
    text:
      en: The length scale factor is 4 ÷ 3.
  - rung: 4
    name: worked_step
    text:
      en: The volume factor is 2.37.
  - rung: 5
    name: full_step
    text:
      en: The larger volume is 24 × 2.37 = 56.9.
