stem: In triangle ABC, angle A = 71°, side a = BC = 12 cm and side b = AC = 8.0 cm. Angle B is acute.
parts:
- id: a
  prompt: Find angle B, to 1 decimal place.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 47.3°
      correct: false
      misconception_id: mc.mth.o.sine_rule_inverted
      feedback: 'In the sine rule each side is paired with the angle opposite it: a with A, b with B.'
    - id: B
      text: 50.9°
      correct: false
      misconception_id: mc.mth.o.trig_ratio_wrong
      feedback: 'Label the sides from the angle you are using: opposite faces it, adjacent is next to it, hypotenuse is opposite the right angle.'
    - id: C
      text: 0.69°
      correct: false
      misconception_id: mc.mth.o.calculator_radians
      feedback: 'Check the calculator shows D (degrees): sin 30 should give 0.5.'
    - id: D
      text: 39.1°
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: You know two sides and an angle opposite one of them.
  - rung: 2
    name: concept
    text:
      en: 'Use the sine rule with the angles on top: sin B / b = sin A / a.'
  - rung: 3
    name: first_step
    text:
      en: sin B = 8.0 × sin 71° ÷ 12.
  - rung: 4
    name: worked_step
    text:
      en: Then use the inverse sine.
  - rung: 5
    name: full_step
    text:
      en: B = 39.1°.
  misconception_ids:
