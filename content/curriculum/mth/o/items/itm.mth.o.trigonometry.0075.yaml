  - mc.mth.o.sine_rule_inverted
  - mc.mth.o.trig_ratio_wrong
solution:
  steps:
  - n: 1
    latex: \frac{\sin B}{b} = \frac{\sin A}{a}
    reason: The sine rule, angles on top
  - n: 2
    latex: \sin B = \frac{8.0 \sin 71}{12}
    reason: Rearrange
  - n: 3
    latex: B = 39.1
    reason: Inverse sine, in degrees
