subject: mth
level: o
kc_ids:
- kc.mth.o.mensuration.compound_shapes
stem: An L-shaped floor is a 10 m by 8 m rectangle with a 6 m by 3 m rectangle cut from one corner.
parts:
- id: a
  prompt: Find the area of the floor.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 62 m²
      correct: true
    - id: B
      text: 80 m²
      correct: false
      misconception_id: mc.mth.o.compound_part_missing
      feedback: Split the shape into simple parts, label each one, and add every part.
    - id: C
      text: 98 m²
      correct: false
      misconception_id: mc.mth.o.compound_overlap_added
      feedback: Shade the region you want. A part that is cut away must be subtracted.
    - id: D
      text: 36 m²
      correct: false
      misconception_id: mc.mth.o.perimeter_area_confused
      feedback: Perimeter is a length around the edge (add the sides); area is the space inside (square units).
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think of the floor as a big rectangle with a piece missing.
  - rung: 2
    name: concept
    text:
      en: Area of the L = big rectangle − the piece cut out.
  - rung: 3
    name: first_step
    text:
      en: The big rectangle is 10 × 8.
  - rung: 4
    name: worked_step
    text:
      en: Subtract the corner, 6 × 3.
  - rung: 5
    name: full_step
    text:
      en: The floor's area is 62 m².
  misconception_ids:
  - mc.mth.o.compound_overlap_added
  - mc.mth.o.compound_part_missing
  - mc.mth.o.perimeter_area_confused
solution:
  steps:
  - n: 1
    latex: 10 \times 8 = 80
    reason: The whole rectangle
    check_id: chk_build_mth_mns_0104_big
  - n: 2
    latex: 6 \times 3 = 18
    reason: The part cut out
    check_id: chk_build_mth_mns_0104_cut
  - n: 3
    latex: 80 - 18 = 62\ \text{m}^2
    reason: Subtract
    check_id: chk_build_mth_mns_0104_ans
