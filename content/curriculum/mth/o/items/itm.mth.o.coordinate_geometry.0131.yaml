stem: Line L has gradient -2. Line P is perpendicular to L and passes through (4, 1).
parts:
- id: a
  prompt: The equation of P is y = mx + c. Find c.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '-7'
      correct: false
      misconception_id: mc.mth.o.perpendicular_negative_only
      feedback: 'Gradients 2 and −2 make a V shape, not a right angle. The product must be −1: 2 × (−½) = −1.'
    - id: B
      text: '3'
      correct: false
      misconception_id: mc.mth.o.perpendicular_reciprocal_only
      feedback: 'If one line goes up, a line at right angles to it goes down: the signs must be opposite.'
    - id: C
      text: '9'
      correct: false
      misconception_id: mc.mth.o.parallel_perpendicular_confused
      feedback: 'Parallel: same gradient. Perpendicular: gradients multiply to −1.'
    - id: D
      text: '-1'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: First find the gradient of P.
  - rung: 2
    name: concept
    text:
      en: Perpendicular gradients multiply to −1.
  - rung: 3
    name: first_step
    text:
      en: The gradient of P is 0.5.
  - rung: 4
    name: worked_step
    text:
      en: Substitute (4, 1) into y = 0.5x + c.
  - rung: 5
    name: full_step
    text:
      en: c = -1.
  misconception_ids:
  - mc.mth.o.parallel_perpendicular_confused
  - mc.mth.o.perpendicular_negative_only
  - mc.mth.o.perpendicular_reciprocal_only
solution:
  steps:
  - n: 1
    latex: m = -\frac{1}{-2} = 0.5
    reason: Negative reciprocal
    check_id: chk_build_mth_crd_0131_m2
  - n: 2
    latex: 1 = 0.5 \times (4) + c
    reason: Substitute the point
  - n: 3
    latex: 0.5 \times (4) = 2
    reason: Multiply
    check_id: chk_build_mth_crd_0131_t
  - n: 4
    latex: c = 1 - 2 = -1
    reason: Solve for c
    check_id: chk_build_mth_crd_0131_ans
