    text:
      en: Multiply every component of a by 3 and of b by 2, then subtract.
  - rung: 3
    name: first_step
    text:
      en: 'In the bottom row: 3 × (2) and 2 × (5).'
  - rung: 4
    name: worked_step
    text:
