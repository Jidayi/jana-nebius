id: itm.mth.o.algebra_and_graphs.0130
version: 0.1.0
type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.simultaneous_equations
stem: Solve the simultaneous equations $2x + 2y = 0$ and $x + 2y = -4$.
parts:
- id: a
  prompt: Find the value of y.
  marks: 3
  answer:
    kind: numeric
    value: '-4'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_alg_0130_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Look at the y terms: they have the same size of coefficient.'
  - rung: 2
    name: concept
    text:
      en: The y terms have the same signs, so subtract the equations to eliminate y.
  - rung: 3
    name: first_step
    text:
      en: Subtract the left sides and subtract the right sides.
  - rung: 4
    name: worked_step
    text:
      en: You get 1x = 4, so x = 4. Substitute this into the first equation.
  - rung: 5
    name: full_step
    text:
      en: y = -4.
  misconception_ids:
  - mc.mth.o.simultaneous_wrong_operation
  - mc.mth.o.simultaneous_other_unknown
  - mc.mth.o.back_substitution_slip
solution:
  steps:
  - n: 1
    latex: 2x + 2y = 0,\quad x + 2y = -4
    reason: The two equations
  - n: 2
    latex: x = 4
    reason: Subtract the equations to eliminate y
    check_id: chk_build_mth_alg_0130_e
  - n: 3
    latex: x = 4
    reason: Divide
    check_id: chk_build_mth_alg_0130_sol
  - n: 4
    latex: 2(4) + 2y = 0 \Rightarrow y = -4
    reason: Substitute x into the first equation
    check_id: chk_build_mth_alg_0130_ans
