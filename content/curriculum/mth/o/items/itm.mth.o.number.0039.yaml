stem: Two numbers are 8 and 12.
parts:
- id: a
  prompt: Find their highest common factor (HCF).
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '24'
      correct: false
      misconception_id: mc.mth.o.hcf_lcm_swapped
      feedback: The HCF divides both numbers, so it is no bigger than the smaller number. The LCM is a multiple of both, so it is at least as big as the larger number.
    - id: B
      text: '2'
      correct: false
      misconception_id: mc.mth.o.hcf_not_highest
      feedback: Take every prime the two numbers share, each to the lower of its two powers.
    - id: C
      text: '96'
      correct: false
      misconception_id: mc.mth.o.lcm_as_product
      feedback: 6 × 4 = 24 is a common multiple of 6 and 4, but 12 is smaller. Use the highest power of each prime only once.
    - id: D
      text: '4'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Write each number as a product of prime factors.
  - rung: 2
    name: concept
    text:
      en: For the HCF, take the lower power of each prime they share.
  - rung: 3
    name: first_step
    text:
      en: 8 = 2^3 and 12 = 2^2 × 3.
  - rung: 4
    name: worked_step
    text:
      en: Compare the power of each prime in the two numbers.
  - rung: 5
    name: full_step
    text:
      en: The HCF is 2^2 = 4.
  misconception_ids:
  - mc.mth.o.hcf_lcm_swapped
  - mc.mth.o.hcf_not_highest
  - mc.mth.o.lcm_as_product
solution:
  steps:
  - n: 1
    latex: 8 = 2^{3},\quad 12 = 2^{2} \times 3
    reason: Prime factorise both numbers
    check_id: chk_build_mth_num_0039_f
  - n: 2
    latex: \text{HCF} = 2^{2} = 4
    reason: Take the lower power of each prime they share
    check_id: chk_build_mth_num_0039_ans
