    text:
      en: In a quadratic sequence the first differences go up by the same amount each time.
  - rung: 3
    name: first_step
    text:
      en: The first differences are 13, 19, 25. How do they change?
  - rung: 4
    name: worked_step
    text:
      en: The next first difference is 25 + 6 = 31.
  - rung: 5
    name: full_step
    text:
      en: The next term is 69 + 31 = 100.
