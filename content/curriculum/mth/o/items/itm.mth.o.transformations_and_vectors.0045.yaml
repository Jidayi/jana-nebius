stem: $\mathbf{a} = \begin{pmatrix} 3 \\ -3 \end{pmatrix}$ and $\mathbf{b} = \begin{pmatrix} 2 \\ 1 \end{pmatrix}$.
parts:
- id: a
  prompt: Find the bottom (y) component of $4\mathbf{a} - 3\mathbf{b}$.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '-9'
      correct: false
      misconception_id: mc.mth.o.vector_subtract_sign
      feedback: 'Subtract component by component, keeping each sign in a bracket: 4 − (−3) = 7.'
    - id: B
      text: '-15'
      correct: true
    - id: C
      text: '-13'
      correct: false
      misconception_id: mc.mth.o.vector_scalar_dropped
      feedback: 3b means every component of b is multiplied by 3.
    - id: D
      text: '6'
      correct: false
      misconception_id: mc.mth.o.translation_components_swapped
      feedback: 'A column vector is (across, up): the top number goes with x.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Work with one row of the column vectors at a time.
  - rung: 2
    name: concept
    text:
      en: Multiply every component of a by 4 and of b by 3, then subtract.
  - rung: 3
    name: first_step
    text:
      en: 'In the bottom row: 4 × (-3) and 3 × (1).'
  - rung: 4
    name: worked_step
    text:
      en: Those are -12 and 3. Subtract, keeping the signs.
  - rung: 5
    name: full_step
    text:
      en: The component is -15.
  misconception_ids:
  - mc.mth.o.translation_components_swapped
  - mc.mth.o.vector_scalar_dropped
  - mc.mth.o.vector_subtract_sign
solution:
  steps:
  - n: 1
    latex: 4 \times (-3) = -12,\quad 3 \times (1) = 3
    reason: Multiply each vector by its number
    check_id: chk_build_mth_vec_0045_t
  - n: 2
    latex: -12 - 3 = -15
    reason: Subtract component by component
    check_id: chk_build_mth_vec_0045_ans
