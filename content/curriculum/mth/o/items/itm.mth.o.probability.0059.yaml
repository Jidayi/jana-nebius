stem: A bag holds 3 red and 3 blue counters. Two counters are taken out, one after the other, without replacement.
parts:
- id: a
  prompt: Find the probability that both are red.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '0.25'
      correct: false
      misconception_id: mc.mth.o.without_replacement_ignored
      feedback: After one item is taken, there is one fewer item in the bag, and one fewer of that colour if it was that colour.
    - id: B
      text: '0.167'
      correct: false
      misconception_id: mc.mth.o.denominator_not_reduced
      feedback: Taking an item out reduces the total as well.
    - id: C
      text: '0.9'
      correct: false
      misconception_id: mc.mth.o.and_as_add
      feedback: 'Two coins both landing heads is less likely than one: ½ × ½ = ¼, not ½ + ½ = 1.'
    - id: D
      text: '0.2'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Draw a tree diagram: the second set of branches depends on the first pick.'
  - rung: 2
    name: concept
    text:
      en: Without replacement, the second probability has one fewer counter in the total.
  - rung: 3
    name: first_step
    text:
      en: The first pick is red with probability 3/6; then the bag has one fewer red and one fewer counter.
  - rung: 4
    name: worked_step
    text:
      en: Multiply along each path, then add the paths you need.
  - rung: 5
    name: full_step
    text:
      en: The probability is 0.2.
  misconception_ids:
  - mc.mth.o.and_as_add
  - mc.mth.o.denominator_not_reduced
  - mc.mth.o.without_replacement_ignored
solution:
  steps:
  - n: 1
    latex: \text{total} = 6,\ \text{then } 5 \text{ after one is taken}
    reason: Count the counters before and after the first pick
    check_id: chk_build_mth_prb_0059_tot
  - n: 2
    latex: P(\text{red, red}) = \frac{3}{6} \times \frac{3 - 1}{6 - 1}
    reason: One red is gone for the second pick
  - n: 3
    latex: = 0.2
    reason: Multiply
    check_id: chk_build_mth_prb_0059_ans
