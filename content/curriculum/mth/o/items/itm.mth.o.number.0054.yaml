id: itm.mth.o.number.0054
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.number.venn_counting
stem: In a class of 30 students, 18 take art, 9 take music and 6 do both. Let A be the set of students who take art and B the set who take music.
parts:
- id: a
  prompt: Find n(A ∪ B), the number who do at least one of them.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '27'
      correct: false
      misconception_id: mc.mth.o.venn_double_count
      feedback: 'Shade A, then shade B: the middle region gets shaded twice. Subtract it once.'
    - id: B
      text: '15'
      correct: false
      misconception_id: mc.mth.o.venn_only_includes_overlap
      feedback: '''A only'' is the part of circle A outside circle B: n(A) minus the overlap.'
    - id: C
      text: '21'
      correct: true
    - id: D
      text: '9'
      correct: false
      misconception_id: mc.mth.o.venn_complement_wrong
      feedback: Find n(A ∪ B) first, then subtract it from the total.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Draw a Venn diagram with two overlapping circles.
  - rung: 2
    name: concept
    text:
      en: Students who do both are inside both circles, so adding n(A) and n(B) counts them twice.
  - rung: 3
    name: first_step
    text:
      en: Put 6 in the overlap first.
  - rung: 4
    name: worked_step
    text:
      en: Add 18 and 9, then take away the 6 counted twice.
  - rung: 5
    name: full_step
    text:
      en: n(A ∪ B) = 18 + 9 − 6 = 21.
  misconception_ids:
  - mc.mth.o.venn_complement_wrong
  - mc.mth.o.venn_double_count
  - mc.mth.o.venn_only_includes_overlap
solution:
  steps:
  - n: 1
    latex: n(A \cup B) = n(A) + n(B) - n(A \cap B)
    reason: The overlap is counted in both sets
  - n: 2
    latex: = 18 + 9 - 6 = 21
    reason: Substitute
    check_id: chk_build_mth_num_0054_ans
