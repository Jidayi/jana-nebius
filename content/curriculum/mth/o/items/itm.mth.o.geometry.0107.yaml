stem: Think about a regular pentagon.
parts:
- id: a
  prompt: What is the order of rotational symmetry?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '2.5'
      correct: false
      misconception_id: mc.mth.o.regular_symmetry_half
      feedback: 'A regular polygon with n sides has n lines of symmetry: through vertices and through the middles of sides.'
    - id: B
      text: '10'
      correct: false
      misconception_id: mc.mth.o.symmetry_lines_double_counted
      feedback: A line of symmetry passes right across the shape; count each line once.
    - id: C
      text: '0'
      correct: false
      misconception_id: mc.mth.o.rotation_order_zero
      feedback: Every shape fits onto itself once in a full turn, so the lowest order is 1.
    - id: D
      text: '5'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about folding the shape, or turning it about its centre.
  - rung: 2
    name: concept
    text:
      en: A regular polygon looks the same from every vertex.
  - rung: 3
    name: first_step
    text:
      en: Count how many times it fits onto itself in one full turn.
  - rung: 4
    name: worked_step
    text:
      en: It fits once for each vertex it can be turned to.
  - rung: 5
    name: full_step
    text:
      en: The answer is 5.
  misconception_ids:
  - mc.mth.o.regular_symmetry_half
  - mc.mth.o.rotation_order_zero
  - mc.mth.o.symmetry_lines_double_counted
