id: itm.mth.o.trigonometry.0085
version: 0.1.1
type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.trigonometry.cosine_rule
stem: In triangle ABC, b = AC = 5 cm, c = AB = 9 cm and the angle between them, A, is 105°.
parts:
- id: a
  prompt: Find a = BC, to 3 significant figures.
  marks: 3
  answer:
    kind: numeric
    value: '11.4'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_trg_0085_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You know two sides and the angle between them.
  - rung: 2
    name: concept
    text:
      en: 'Use the cosine rule: a² = b² + c² − 2bc cos A.'
  - rung: 3
    name: first_step
    text:
      en: Work out 2 × 5 × 9 × cos 105° first, then subtract it from 5² + 9².
  - rung: 4
    name: worked_step
    text:
      en: a² = 129.3; now take the square root.
  - rung: 5
    name: full_step
    text:
      en: a = 11.4 cm.
  misconception_ids:
  - mc.mth.o.cosine_rule_sign
  - mc.mth.o.pythag_no_root
  - mc.mth.o.cosine_rule_order
solution:
  steps:
  - n: 1
    latex: a^2 = b^2 + c^2 - 2bc\cos A
    reason: The cosine rule
  - n: 2
    latex: a^2 = 5^2 + 9^2 - 2 \times 5 \times 9 \times \cos 105 = 129.3
    reason: Substitute
    check_id: chk_build_mth_trg_0085_sq
  - n: 3
    latex: a = 11.4\ \text{cm}
    reason: Square root
    check_id: chk_build_mth_trg_0085_ans
