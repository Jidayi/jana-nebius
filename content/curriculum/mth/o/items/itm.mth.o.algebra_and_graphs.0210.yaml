    reason: The common difference
    check_id: chk_build_mth_alg_0210_dd
  - n: 2
    latex: \text{nth term} = 7n + (-2)
    reason: The number added is the first term minus the difference
    check_id: chk_build_mth_alg_0210_c
  - n: 3
    latex: 7 \times 20 + (-2) = 138
    reason: Substitute n = 20
    check_id: chk_build_mth_alg_0210_ans
