id: itm.mth.o.algebra_and_graphs.0255
version: 0.1.1
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.travel_graphs
stem: A speed-time graph for a lorry is a straight line from (0 s, 10 m/s) to (8 s, 24 m/s).
parts:
- id: a
  prompt: Find the distance travelled in this time.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 192 m
      correct: false
      misconception_id: mc.mth.o.graph_one_point
      feedback: A line that does not start at the origin gives the wrong value from one point. Use the change between two points.
    - id: B
      text: 1.75 m
      correct: false
      misconception_id: mc.mth.o.gradient_for_area
      feedback: On a speed-time graph the slope gives the acceleration and the area underneath gives the distance.
    - id: C
      text: 272 m
      correct: false
      misconception_id: mc.mth.o.formula_half_dropped
      feedback: Read the formula one symbol at a time and tick each one off as you substitute; the ½ multiplies everything that follows it.
    - id: D
      text: 136 m
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: On a speed-time graph, which feature gives the distance travelled?
  - rung: 2
    name: concept
    text:
      en: The distance is the area under the graph.
  - rung: 3
    name: first_step
    text:
      en: The shape under the line is a trapezium (or a triangle if it starts at zero).
  - rung: 4
    name: worked_step
    text:
      en: Area = ½ × (10 + 24) × 8.
  - rung: 5
    name: full_step
    text:
      en: Distance = 136 m.
  misconception_ids:
  - mc.mth.o.formula_half_dropped
  - mc.mth.o.gradient_for_area
  - mc.mth.o.graph_one_point
solution:
  steps:
  - n: 1
    latex: d = \tfrac{1}{2}(u + v)t
    reason: The area under the line is a trapezium
  - n: 2
    latex: u + v = 10 + 24 = 34
    reason: Add the two speeds
    check_id: chk_build_mth_alg_0255_s
  - n: 3
    latex: d = \tfrac{1}{2} \times 34 \times 8 = 136\ \text{m}
    reason: Evaluate
    check_id: chk_build_mth_alg_0255_ans
