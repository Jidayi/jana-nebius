subject: mth
level: o
kc_ids:
- kc.mth.o.trigonometry.three_d
stem: A cuboid measures 6 cm by 5 cm by 7 cm.
parts:
- id: a
  prompt: Find the length of a diagonal running from a bottom corner to the opposite top corner, to 3 significant figures.
  marks: 3
  answer:
    kind: numeric
    value: '10.5'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_trg_0108_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The diagonal goes through the inside of the cuboid.
  - rung: 2
    name: concept
    text:
      en: 'Use Pythagoras twice: first across the base, then up to the top corner.'
  - rung: 3
    name: first_step
    text:
      en: The base diagonal squared is 6² + 5².
  - rung: 4
    name: worked_step
    text:
      en: That is 61. Now add 7² and take the square root.
  - rung: 5
    name: full_step
    text:
      en: The diagonal is 10.5 cm.
  misconception_ids:
  - mc.mth.o.three_d_two_dimensions
  - mc.mth.o.pythag_sides_added
  - mc.mth.o.pythag_no_root
solution:
  steps:
  - n: 1
    latex: \text{base diagonal}^2 = 6^2 + 5^2 = 61
    reason: Pythagoras in the base
    check_id: chk_build_mth_trg_0108_bd
  - n: 2
    latex: d = \sqrt{61 + 7^2} = 10.5\ \text{cm}
    reason: Pythagoras again with the height
    check_id: chk_build_mth_trg_0108_ans
