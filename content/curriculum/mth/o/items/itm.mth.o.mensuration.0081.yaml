solution:
  steps:
  - n: 1
    latex: V = \tfrac{4}{3}\pi r^3
    reason: Volume of a sphere
  - n: 2
    latex: V = \tfrac{4}{3} \times \pi \times 5^3 = 524\ \text{cm}^3
    reason: Substitute and round
    check_id: chk_build_mth_mns_0081_ans
