    text:
      en: V = (4/3) × π × r³.
  - rung: 3
    name: first_step
    text:
      en: 'Cube the radius: 5 × 5 × 5.'
  - rung: 4
    name: worked_step
    text:
      en: Multiply by π, then by 4 and divide by 3.
  - rung: 5
    name: full_step
