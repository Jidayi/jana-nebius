stem: A cylinder has radius 6 cm and height 7 cm.
parts:
- id: a
  prompt: Find the area of its curved surface, to 3 significant figures.
  marks: 2
  answer:
    kind: numeric
    value: '264'
    unit: cm^2
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_mns_0068_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Imagine peeling the label off a tin: it opens into a rectangle.'
  - rung: 2
    name: concept
    text:
      en: The rectangle is as long as the circumference and as wide as the height.
  - rung: 3
    name: first_step
    text:
      en: The circumference is 2 × π × 6.
  - rung: 4
    name: worked_step
    text:
      en: Multiply the circumference by 7.
  - rung: 5
    name: full_step
    text:
      en: The curved surface area is 264 cm².
  misconception_ids:
  - mc.mth.o.radius_not_squared
  - mc.mth.o.circumference_area_confused
  - mc.mth.o.diameter_for_radius
solution:
  steps:
  - n: 1
    latex: A = 2\pi rh
    reason: The curved surface unrolls into a rectangle
  - n: 2
    latex: A = 2 \times \pi \times 6 \times 7 = 264\ \text{cm}^2
    reason: Substitute and round
    check_id: chk_build_mth_mns_0068_ans
