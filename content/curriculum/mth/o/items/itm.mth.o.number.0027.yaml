stem: Two numbers are 12 and 18.
parts:
- id: a
  prompt: Find their lowest common multiple (LCM).
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '6'
      correct: false
      misconception_id: mc.mth.o.hcf_lcm_swapped
      feedback: The HCF divides both numbers, so it is no bigger than the smaller number. The LCM is a multiple of both, so it is at least as big as the larger number.
    - id: B
      text: '216'
      correct: false
      misconception_id: mc.mth.o.lcm_as_product
      feedback: 6 × 4 = 24 is a common multiple of 6 and 4, but 12 is smaller. Use the highest power of each prime only once.
    - id: C
      text: '72'
      correct: false
      misconception_id: mc.mth.o.lcm_not_lowest
      feedback: Use each prime once, at its highest power in either number; anything more is a bigger common multiple.
    - id: D
      text: '36'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Write each number as a product of prime factors.
  - rung: 2
    name: concept
    text:
      en: For the LCM, take the higher power of every prime.
  - rung: 3
    name: first_step
    text:
      en: 12 = 2^2 × 3 and 18 = 2 × 3^2.
  - rung: 4
    name: worked_step
    text:
      en: Compare the power of each prime in the two numbers.
  - rung: 5
    name: full_step
    text:
      en: The LCM is 2^2 × 3^2 = 36.
  misconception_ids:
  - mc.mth.o.hcf_lcm_swapped
  - mc.mth.o.lcm_as_product
  - mc.mth.o.lcm_not_lowest
