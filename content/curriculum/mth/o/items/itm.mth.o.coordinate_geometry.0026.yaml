stem: The line $3x + 6y = 18$ is drawn on a grid.
parts:
- id: a
  prompt: Find where it crosses the x-axis (give the x-coordinate).
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '3'
      correct: false
      misconception_id: mc.mth.o.intercepts_swapped
      feedback: On the x-axis every point has y = 0, so set y = 0 to find where the line crosses the x-axis.
    - id: B
      text: '18'
      correct: false
      misconception_id: mc.mth.o.c_as_x_intercept
      feedback: c is where the line crosses the y-axis, because that is where x = 0.
    - id: C
      text: '6'
      correct: true
    - id: D
      text: '-6'
      correct: false
      misconception_id: mc.mth.o.intercept_sign
      feedback: 'Solve 0 = mx + c carefully: mx = −c, so x = −c/m.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: What is the value of y everywhere on the x-axis?
  - rung: 2
    name: concept
    text:
      en: Set y = 0 in the equation.
  - rung: 3
    name: first_step
    text:
      en: The y term disappears, leaving 3x = 18.
  - rung: 4
    name: worked_step
    text:
      en: Divide 18 by 3.
  - rung: 5
    name: full_step
    text:
      en: The line crosses the x-axis at x = 6.
  misconception_ids:
  - mc.mth.o.c_as_x_intercept
  - mc.mth.o.intercept_sign
  - mc.mth.o.intercepts_swapped
solution:
  steps:
  - n: 1
    latex: y = 0
    reason: Every point on the x-axis has y = 0
  - n: 2
    latex: 3x = 18 \Rightarrow x = 6
    reason: Solve
    check_id: chk_build_mth_crd_0026_ans
