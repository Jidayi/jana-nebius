    text:
      en: Volume = ⅓ × base area × height.
  - rung: 3
    name: first_step
    text:
      en: The base area is 4 × 4.
  - rung: 4
    name: worked_step
    text:
      en: The base area is 16 cm². Multiply by 9 and divide by 3.
  - rung: 5
