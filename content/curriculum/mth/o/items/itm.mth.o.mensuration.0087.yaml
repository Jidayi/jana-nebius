stem: A pyramid has a square base of side 4 cm and a vertical height of 9 cm.
parts:
- id: a
  prompt: Find its volume.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 144 cm³
