solution:
  steps:
  - n: 1
    latex: \text{base area} = 4^2 = 16
    reason: Area of the square base
    check_id: chk_build_mth_mns_0087_b
  - n: 2
    latex: V = \tfrac{1}{3} \times 16 \times 9 = 48\ \text{cm}^3
    reason: One third of base times height
    check_id: chk_build_mth_mns_0087_ans
