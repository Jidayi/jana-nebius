stem: 'A two-way table shows how students travel to school. Boys: walk 21, bus 11, car ?, total 37. Girls: walk 10, bus 9, car 4, total 23.'
parts:
- id: a
  prompt: How many boys travel by car?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '18'
      correct: false
      misconception_id: mc.mth.o.table_row_column_confused
      feedback: 'That mixes the girls'' walk and bus numbers with the boys'' total. Use the boys'' row only: its own total minus its own entries.'
    - id: B
      text: '5'
      correct: true
    - id: C
      text: '69'
      correct: false
      misconception_id: mc.mth.o.table_total_ignored
      feedback: The total is the sum of the entries, so a missing entry is the total minus the others.
    - id: D
      text: '16'
      correct: false
      misconception_id: mc.mth.o.table_entry_missed
      feedback: Subtract every known entry in the row from the row total, not just one of them.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Look only at the boys' row.
  - rung: 2
    name: concept
    text:
      en: The entries in a row add up to the row total.
  - rung: 3
    name: first_step
    text:
      en: 'Add the boys'' entries you know: 21 and 11.'
  - rung: 4
    name: worked_step
    text:
      en: They make 32. Subtract this from 37.
  - rung: 5
    name: full_step
    text:
      en: 5 boys travel by car.
  misconception_ids:
  - mc.mth.o.table_row_column_confused
  - mc.mth.o.table_total_ignored
  - mc.mth.o.table_entry_missed
solution:
  steps:
  - n: 1
    latex: 21 + 11 = 32
    reason: The boys you know about
    check_id: chk_build_mth_sta_0037_s
  - n: 2
    latex: 37 - 32 = 5
    reason: The rest of the boys' total
    check_id: chk_build_mth_sta_0037_ans
