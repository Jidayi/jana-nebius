id: itm.mth.o.algebra_and_graphs.0067
version: 0.1.0
type: mcq
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.change_subject
stem: Make h the subject of the formula $V = \pi r^2 h$.
parts:
- id: a
  prompt: Choose the correct rearrangement.
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: $h = V\pi r^2$
      correct: false
      misconception_id: mc.mth.o.rearrange_wrong_inverse
      feedback: The opposite of multiplying by a is dividing by a. Check by putting numbers back into your answer.
    - id: B
      text: $h = V - \pi r^2$
      correct: false
      misconception_id: mc.mth.o.rearrange_inverse_sign
      feedback: 'Do the same to both sides: to remove + u, subtract u from both sides.'
    - id: C
      text: $h = \frac{V}{\pi r}$
      correct: false
      misconception_id: mc.mth.o.rearrange_root_forgotten
      feedback: If the letter you want is squared, the last step is to take the square root of the other side.
    - id: D
      text: $h = \frac{V}{\pi r^2}$
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Which operations have been done to h, and in what order?
  - rung: 2
    name: concept
    text:
      en: Undo them in reverse order, doing the same to both sides each time, until h is alone.
  - rung: 3
    name: first_step
    text:
      en: Start with the operation that was done last.
  - rung: 4
    name: worked_step
    text:
      en: 'Each step uses the inverse operation: subtract to undo adding, divide to undo multiplying, take the square root to undo squaring.'
  - rung: 5
    name: full_step
    text:
      en: The rearranged formula is $h = \frac{V}{\pi r^2}$.
  misconception_ids:
  - mc.mth.o.rearrange_inverse_sign
  - mc.mth.o.rearrange_root_forgotten
  - mc.mth.o.rearrange_wrong_inverse
solution:
  steps:
  - n: 1
    latex: V = \pi r^2 h
    reason: Start from the formula
  - n: 2
    latex: h = \frac{V}{\pi r^2}
    reason: Undo each operation on h in reverse order, doing the same to both sides
