  - mc.mth.o.numerator_not_scaled
solution:
  steps:
  - n: 1
    latex: \frac{11}{12} = \frac{77}{84},\ \frac{3}{7} = \frac{36}{84}
    reason: Write both fractions over the lowest common denominator
    check_id: chk_build_mth_num_0082_t
  - n: 2
    latex: \frac{77 - 36}{84} = \frac{41}{84}
    reason: Subtract the numerators
    check_id: chk_build_mth_num_0082_s
  - n: 3
    latex: = \frac{41}{84}
    reason: Simplify
    check_id: chk_build_mth_num_0082_k
