stem: A box has a volume of 2.5 m³.
parts:
- id: a
  prompt: Write this volume in cm³.
  marks: 1
  answer:
    kind: numeric
    value: '2500000'
    unit: cm^3
    unit_policy: equivalent
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_mns_0009_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'A volume unit is a cube: think of a cubic metre.'
  - rung: 2
    name: concept
    text:
      en: A cubic metre is 100 cm long, wide and high.
  - rung: 3
    name: first_step
    text:
      en: So one cubic metre is 100 × 100 × 100 cubic centimetres.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 2.5 by 100 three times.
  - rung: 5
    name: full_step
    text:
      en: 2.5 m³ = 2500000 cm³.
  misconception_ids:
  - mc.mth.o.volume_units_linear
  - mc.mth.o.area_units_linear
  - mc.mth.o.unit_conversion_direction
solution:
  steps:
  - n: 1
    latex: 1\ \text{m}^3 = 100 \times 100 \times 100\ \text{cm}^3 = 1000000\ \text{cm}^3
    reason: Each metre is 100 cm, in three directions
    check_id: chk_build_mth_mns_0009_f
  - n: 2
    latex: 2.5 \times 1000000 = 2500000
    reason: Multiply
    check_id: chk_build_mth_mns_0009_ans
