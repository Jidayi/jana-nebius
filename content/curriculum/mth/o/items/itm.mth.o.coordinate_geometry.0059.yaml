stem: P is the point (-2, 2) and Q is the point (-5, 6).
parts:
- id: a
  prompt: Find the length of PQ.
  marks: 3
  answer:
    kind: numeric
    value: '5'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_crd_0059_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Sketch the two points: the segment is the hypotenuse of a right-angled triangle.'
  - rung: 2
    name: concept
    text:
      en: The other two sides are the change in x and the change in y.
  - rung: 3
    name: first_step
    text:
      en: Change in x = -5 − (-2); change in y = 6 − (2).
  - rung: 4
    name: worked_step
    text:
      en: 'Square both changes and add: 25. Then take the square root.'
  - rung: 5
    name: full_step
    text:
      en: PQ = 5.
  misconception_ids:
  - mc.mth.o.length_changes_added
  - mc.mth.o.pythag_no_root
  - mc.mth.o.coordinates_added_not_subtracted
solution:
  steps:
  - n: 1
    latex: PQ^2 = (x_2 - x_1)^2 + (y_2 - y_1)^2
    reason: Pythagoras on the changes
  - n: 2
    latex: PQ^2 = (-\,3)^2 + (4)^2 = 25
    reason: Square and add
    check_id: chk_build_mth_crd_0059_s
  - n: 3
    latex: PQ = \sqrt{25} = 5
    reason: Square root
    check_id: chk_build_mth_crd_0059_ans
