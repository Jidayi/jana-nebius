id: itm.mth.o.probability.0043
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.probability.independent_events
stem: The probability that a seed from packet A grows is 0.4. The probability that a seed from packet B grows is 0.5. The two events are independent.
parts:
- id: a
  prompt: Find the probability that at least one of them happens.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '0.9'
      correct: false
      misconception_id: mc.mth.o.at_least_one_added
      feedback: P(at least one) = 1 − P(neither).
    - id: B
      text: '0.8'
      correct: false
      misconception_id: mc.mth.o.complement_of_both
      feedback: '''At least one'' fails only when neither happens, so subtract P(neither) from 1.'
    - id: C
      text: '0.2'
      correct: false
      misconception_id: mc.mth.o.and_as_add
      feedback: 'Two coins both landing heads is less likely than one: ½ × ½ = ¼, not ½ + ½ = 1.'
    - id: D
      text: '0.7'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: '''At least one'' covers several cases. Which single case is left out?'
  - rung: 2
    name: concept
    text:
      en: P(at least one) = 1 − P(neither).
  - rung: 3
    name: first_step
    text:
      en: P(neither) = (1 − 0.4) × (1 − 0.5).
  - rung: 4
    name: worked_step
    text:
      en: P(neither) = 0.3; subtract it from 1.
  - rung: 5
    name: full_step
    text:
      en: P(at least one) = 0.7.
  misconception_ids:
  - mc.mth.o.and_as_add
  - mc.mth.o.at_least_one_added
  - mc.mth.o.complement_of_both
solution:
  steps:
  - n: 1
    latex: P(\text{neither}) = (1 - 0.4)(1 - 0.5) = 0.3
    reason: Both fail to happen
    check_id: chk_build_mth_prb_0043_n
  - n: 2
    latex: P(\text{at least one}) = 1 - 0.3 = 0.7
    reason: Everything except neither
    check_id: chk_build_mth_prb_0043_ans
