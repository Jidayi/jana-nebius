stem: 'A survey records five kinds of data: the shirt numbers of a football team; the number of pages in books; the shoe sizes of a class; the time taken to run 100 m; the temperature at noon each day.'
parts:
- id: a
  prompt: How many of the five are continuous?
  marks: 1
  answer:
    kind: numeric
    value: '2'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_sta_0012_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Decide for each one: is it counted, measured, or a description?'
  - rung: 2
    name: concept
    text:
      en: Measured quantities are continuous; counted ones are discrete; descriptions are qualitative.
  - rung: 3
    name: first_step
    text:
      en: Lengths, times, masses, volumes and temperatures are measured.
  - rung: 4
    name: worked_step
    text:
      en: Numbers used as labels are not quantities at all.
  - rung: 5
    name: full_step
    text:
      en: There are 2 continuous kinds.
  misconception_ids:
  - mc.mth.o.numbers_always_continuous
  - mc.mth.o.discrete_continuous_swapped
  - mc.mth.o.coded_numbers_quantitative
solution:
  steps:
  - n: 1
    latex: \text{continuous} = \text{measured, not counted}
    reason: Sort each kind of data
  - n: 2
    latex: '2'
    reason: Count the measured quantities
    check_id: chk_build_mth_sta_0012_ans
