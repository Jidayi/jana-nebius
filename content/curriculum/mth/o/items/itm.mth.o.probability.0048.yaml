stem: A bag holds 4 red and 2 blue counters. Two counters are taken out, one after the other, without replacement.
parts:
- id: a
  prompt: Find the probability that both are red.
  marks: 3
  answer:
    kind: numeric
    value: '0.4'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_prb_0048_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Draw a tree diagram: the second set of branches depends on the first pick.'
  - rung: 2
    name: concept
    text:
      en: Without replacement, the second probability has one fewer counter in the total.
  - rung: 3
    name: first_step
    text:
      en: The first pick is red with probability 4/6; then the bag has one fewer red and one fewer counter.
  - rung: 4
    name: worked_step
    text:
      en: Multiply along each path, then add the paths you need.
  - rung: 5
    name: full_step
    text:
      en: The probability is 0.4.
  misconception_ids:
