  - mc.mth.o.denominator_not_reduced
  - mc.mth.o.and_as_add
solution:
  steps:
  - n: 1
    latex: \text{total} = 6,\ \text{then } 5 \text{ after one is taken}
    reason: Count the counters before and after the first pick
    check_id: chk_build_mth_prb_0048_tot
  - n: 2
    latex: P(\text{red, red}) = \frac{4}{6} \times \frac{4 - 1}{6 - 1}
    reason: One red is gone for the second pick
  - n: 3
    latex: = 0.4
    reason: Multiply
    check_id: chk_build_mth_prb_0048_ans
