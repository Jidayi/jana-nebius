id: itm.mth.o.algebra_and_graphs.0300
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.quadratic_features
stem: The graph of $y = x^2 - 4x + 7$ has one turning point.
parts:
- id: a
  prompt: Find the y-coordinate of the turning point.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '3'
      correct: true
    - id: B
      text: '7'
      correct: false
      misconception_id: mc.mth.o.turning_value_as_intercept
      feedback: The y-intercept is where x = 0. The turning point is usually somewhere else, so substitute its x-value.
    - id: C
      text: '19'
      correct: false
      misconception_id: mc.mth.o.turning_point_sign
      feedback: 'Complete the square: x² + bx = (x + b/2)² − (b/2)², so the turning point is at x = −b/2.'
    - id: D
      text: '-3'
      correct: false
      misconception_id: mc.mth.o.sign_lost_substitution
      feedback: Write the value in a bracket with its sign, for example x = (−4), before you calculate.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: First find where the turning point is across the graph.
  - rung: 2
    name: concept
    text:
      en: The turning point is at x = −b/2; substitute that x into the equation.
  - rung: 3
    name: first_step
    text:
      en: x = −(−4) ÷ 2 = 2.
  - rung: 4
    name: worked_step
    text:
      en: Substitute x = 2.
  - rung: 5
    name: full_step
    text:
      en: y = 3.
  misconception_ids:
  - mc.mth.o.sign_lost_substitution
  - mc.mth.o.turning_point_sign
  - mc.mth.o.turning_value_as_intercept
solution:
  steps:
  - n: 1
    latex: x = -\frac{b}{2} = 2
    reason: The line of symmetry
    check_id: chk_build_mth_alg_0300_x0
  - n: 2
    latex: y = (2)^2 - 4(2) + 7 = 3
    reason: Substitute into the equation
    check_id: chk_build_mth_alg_0300_ans
