id: itm.mth.o.geometry.0093
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.geometry.similar_area_volume
stem: Two similar photographs have heights 3 cm and 4 cm. The smaller one has an area of 12 cm².
parts:
- id: a
  prompt: Find the area of the larger one.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 16 cm²
      correct: false
      misconception_id: mc.mth.o.similar_length_factor_for_area
      feedback: 'Doubling every length of a square makes four copies of it: the area factor is the square.'
    - id: B
      text: 21.3 cm²
      correct: true
    - id: C
      text: 28.4 cm²
      correct: false
      misconception_id: mc.mth.o.similar_area_factor_for_length
      feedback: Lengths use the scale factor itself; only areas use its square.
    - id: D
      text: 6.75 cm²
      correct: false
      misconception_id: mc.mth.o.similar_factor_inverted
      feedback: Scale factor = new length ÷ old length. Going to the larger shape, lengths get bigger.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the length scale factor first.
  - rung: 2
    name: concept
    text:
      en: For similar shapes, areas change by the square of the length scale factor.
  - rung: 3
    name: first_step
    text:
      en: The length scale factor is 4 ÷ 3.
  - rung: 4
    name: worked_step
    text:
      en: The area factor is 1.78.
  - rung: 5
    name: full_step
    text:
      en: The larger area is 12 × 1.78 = 21.3.
  misconception_ids:
  - mc.mth.o.similar_area_factor_for_length
  - mc.mth.o.similar_factor_inverted
  - mc.mth.o.similar_length_factor_for_area
solution:
  steps:
  - n: 1
    latex: k = \frac{4}{3}
    reason: Length scale factor
    check_id: chk_build_mth_geo_0093_k
  - n: 2
    latex: \text{area factor} = k^2 = 1.78
    reason: Areas scale by k^2
    check_id: chk_build_mth_geo_0093_f
  - n: 3
    latex: 12 \times 1.78 = 21.3
    reason: Multiply
    check_id: chk_build_mth_geo_0093_ans
