stem: In triangle ABC, angle A = 58°, angle B = 54° and side a = BC = 14 cm.
parts:
- id: a
  prompt: Find side b = AC, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 14.7 cm
      correct: false
      misconception_id: mc.mth.o.sine_rule_inverted
      feedback: 'In the sine rule each side is paired with the angle opposite it: a with A, b with B.'
    - id: B
      text: 15.5 cm
      correct: false
      misconception_id: mc.mth.o.trig_ratio_wrong
      feedback: 'Label the sides from the angle you are using: opposite faces it, adjacent is next to it, hypotenuse is opposite the right angle.'
    - id: C
      text: 13.4 cm
      correct: true
    - id: D
