  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: You know two angles and the side opposite one of them.
  - rung: 2
    name: concept
    text:
      en: The sine rule pairs each side with the sine of the angle opposite it.
  - rung: 3
    name: first_step
    text:
      en: b is opposite B = 54° and a is opposite A = 58°.
  - rung: 4
    name: worked_step
    text:
      en: b = 14 × sin 54° ÷ sin 58°.
  - rung: 5
    name: full_step
    text:
      en: b = 13.4 cm.
  misconception_ids:
