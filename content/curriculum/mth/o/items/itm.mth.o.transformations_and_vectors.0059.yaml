stem: The vector $\mathbf{v} = \begin{pmatrix} 4 \\ -6 \end{pmatrix}$.
parts:
- id: a
  prompt: Find its magnitude |v|, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '52'
      correct: false
      misconception_id: mc.mth.o.pythag_no_root
      feedback: a² + b² is the square of the side. Take the square root as the last step.
    - id: B
      text: '10'
      correct: false
      misconception_id: mc.mth.o.pythag_sides_added
      feedback: 'A 3, 4 triangle has hypotenuse 5, not 7: the direct route is shorter than going round two sides.'
    - id: C
      text: '2'
      correct: false
      misconception_id: mc.mth.o.magnitude_signed_sum
      feedback: 'The magnitude is the length of the arrow: the hypotenuse of a right-angled triangle with the components as its sides.'
    - id: D
      text: '7.21'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The magnitude is the length of the arrow.
  - rung: 2
    name: concept
    text:
      en: 'The two components and the arrow make a right-angled triangle: use Pythagoras.'
  - rung: 3
    name: first_step
    text:
      en: Square 4 and -6; squares are never negative.
  - rung: 4
    name: worked_step
    text:
      en: The sum of the squares is 52; take its square root.
  - rung: 5
    name: full_step
    text:
      en: '|v| = 7.21.'
  misconception_ids:
  - mc.mth.o.magnitude_signed_sum
  - mc.mth.o.pythag_no_root
  - mc.mth.o.pythag_sides_added
solution:
  steps:
  - n: 1
    latex: '|\mathbf{v}| = \sqrt{x^2 + y^2}'
    reason: Pythagoras on the components
  - n: 2
    latex: (4)^2 + (-6)^2 = 52
    reason: Square and add
    check_id: chk_build_mth_vec_0059_s
  - n: 3
    latex: '|\mathbf{v}| = \sqrt{52} = 7.21'
    reason: Square root
    check_id: chk_build_mth_vec_0059_ans
