  prompt: Find the length of EF.
  marks: 2
  answer:
    kind: numeric
    value: '36'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_geo_0065_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: In similar shapes every length is multiplied by the same scale factor.
  - rung: 2
    name: concept
    text:
      en: Find the scale factor from a pair of corresponding sides you know both of.
  - rung: 3
    name: first_step
    text:
      en: Scale factor = 18 ÷ 6.
  - rung: 4
    name: worked_step
    text:
      en: The scale factor is 3. Multiply BC by it.
  - rung: 5
    name: full_step
    text:
      en: EF = 36 cm.
  misconception_ids:
