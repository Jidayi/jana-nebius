type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.trigonometry.pythagoras
stem: A right-angled triangle has hypotenuse 12 m and one other side 5 m.
parts:
- id: a
  prompt: Find the length of the third side, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 13.0 m
      correct: false
      misconception_id: mc.mth.o.pythag_add_for_leg
      feedback: 'The hypotenuse is the longest side. To find a shorter side, subtract: b² = c² − a².'
    - id: B
      text: 119 m
      correct: false
      misconception_id: mc.mth.o.pythag_no_root
      feedback: a² + b² is the square of the side. Take the square root as the last step.
    - id: C
      text: 10.9 m
      correct: true
    - id: D
      text: 7 m
      correct: false
      misconception_id: mc.mth.o.pythag_sides_added
      feedback: 'A 3, 4 triangle has hypotenuse 5, not 7: the direct route is shorter than going round two sides.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Which side is the hypotenuse? It is the longest side.
  - rung: 2
    name: concept
    text:
      en: 'To find a shorter side, subtract the squares: b² = c² − a².'
  - rung: 3
    name: first_step
    text:
      en: Work out 12² − 5².
  - rung: 4
    name: worked_step
    text:
      en: That is 119; take the square root.
  - rung: 5
    name: full_step
    text:
      en: The third side is 10.9 m.
  misconception_ids:
  - mc.mth.o.pythag_add_for_leg
  - mc.mth.o.pythag_no_root
  - mc.mth.o.pythag_sides_added
solution:
  steps:
  - n: 1
    latex: b^2 = c^2 - a^2
    reason: Pythagoras' theorem, rearranged
  - n: 2
    latex: b^2 = 12^2 - 5^2 = 119
    reason: Square and subtract
    check_id: chk_build_mth_trg_0014_s
  - n: 3
    latex: b = \sqrt{119} = 10.9\ \text{m}
    reason: Square root
    check_id: chk_build_mth_trg_0014_ans
