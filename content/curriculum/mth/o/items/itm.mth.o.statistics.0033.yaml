stem: 'A two-way table shows how students travel to school. Boys: walk 12, bus ?, car 5, total 33. Girls: walk 14, bus 19, car 10, total 43.'
parts:
- id: a
  prompt: How many boys travel by bus?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '26'
      correct: false
      misconception_id: mc.mth.o.table_row_column_confused
      feedback: Find a row or column where only one entry is missing, and use that line's own total.
    - id: B
      text: '16'
      correct: true
    - id: C
      text: '50'
      correct: false
      misconception_id: mc.mth.o.table_total_ignored
      feedback: The total is the sum of the entries, so a missing entry is the total minus the others.
    - id: D
      text: '21'
      correct: false
      misconception_id: mc.mth.o.table_entry_missed
      feedback: Subtract every known entry in the row from the row total, not just one of them.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Look only at the boys' row.
  - rung: 2
    name: concept
    text:
      en: The entries in a row add up to the row total.
  - rung: 3
    name: first_step
    text:
      en: 'Add the boys'' entries you know: 12 and 5.'
  - rung: 4
    name: worked_step
    text:
      en: They make 17. Subtract this from 33.
  - rung: 5
    name: full_step
    text:
      en: 16 boys travel by bus.
  misconception_ids:
  - mc.mth.o.table_row_column_confused
  - mc.mth.o.table_total_ignored
  - mc.mth.o.table_entry_missed
solution:
  steps:
  - n: 1
    latex: 12 + 5 = 17
    reason: The boys you know about
    check_id: chk_build_mth_sta_0033_s
  - n: 2
    latex: 33 - 17 = 16
    reason: The rest of the boys' total
    check_id: chk_build_mth_sta_0033_ans
