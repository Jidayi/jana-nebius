stem: Solve the inequality $4x - 3 < 25$.
parts:
- id: a
  prompt: Find the largest integer x that satisfies it.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '7'
      correct: false
      misconception_id: mc.mth.o.inequality_boundary
      feedback: < and > leave the boundary out; ≤ and ≥ include it. Test the boundary value in the original inequality.
    - id: B
      text: '6'
      correct: true
    - id: C
      text: '4.5'
      correct: false
      misconception_id: mc.mth.o.rearrange_inverse_sign
      feedback: 'Do the same to both sides: to remove + u, subtract u from both sides.'
    - id: D
      text: '8'
      correct: false
      misconception_id: mc.mth.o.inequality_no_flip
      feedback: 2 < 3, but after multiplying by −1 we get −2 > −3. Dividing by a negative number reverses the inequality.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Solve it like an equation, keeping the inequality sign.
  - rung: 2
    name: concept
    text:
      en: Add 3 on both sides, then divide by 4.
  - rung: 3
    name: first_step
    text:
      en: Find the boundary value first.
  - rung: 4
    name: worked_step
    text:
      en: You should get x < 7. The boundary itself is not included.
  - rung: 5
    name: full_step
    text:
      en: The largest integer less than 7 is 6.
  misconception_ids:
  - mc.mth.o.inequality_boundary
  - mc.mth.o.inequality_no_flip
  - mc.mth.o.rearrange_inverse_sign
