solution:
  steps:
  - n: 1
    latex: x = -5 + 2y
    reason: Make x the subject of the second equation
  - n: 2
    latex: 5(-5 + 2y) - 2y = -17
    reason: Substitute it into the first equation
  - n: 3
    latex: 8y = 8
    reason: Expand and collect the y terms and the numbers
    check_id: chk_build_mth_alg_0913_cy
  - n: 4
    latex: y = 1, \ x = -3
    reason: Divide, then substitute y back
    check_id: chk_build_mth_alg_0913_key
