id: itm.mth.o.calculus.0003
version: 0.1.0
type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.calculus.differentiate_powers
stem: A curve has equation $y = 5x^2 + 3x + 5$.
parts:
- id: a
  prompt: Find the gradient of the curve at the point where x = -1.
  marks: 3
  answer:
    kind: numeric
    value: '-7'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_cal_0003_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The gradient of a curve changes; dy/dx gives it at any point.
  - rung: 2
    name: concept
    text:
      en: For each term axⁿ, the derivative is naxⁿ⁻¹; a constant term disappears.
  - rung: 3
    name: first_step
    text:
      en: Differentiate term by term.
  - rung: 4
    name: worked_step
    text:
      en: Substitute x = -1 into dy/dx, not into y.
  - rung: 5
    name: full_step
    text:
      en: The gradient at x = -1 is -7.
  misconception_ids:
  - mc.mth.o.derivative_power_not_brought_down
  - mc.mth.o.derivative_power_not_reduced
  - mc.mth.o.gradient_from_y
solution:
  steps:
  - n: 1
    latex: \frac{dy}{dx} = 10x + 3
    reason: Multiply by each power, then reduce the power by one
    check_id: chk_build_mth_cal_0003_d
  - n: 2
    latex: '\text{at } x = -1: \frac{dy}{dx} = -7'
    reason: Substitute into the derivative
    check_id: chk_build_mth_cal_0003_ans
