id: itm.mth.o.algebra_and_graphs.0016
version: 0.1.0
type: mcq
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.expand_brackets
stem: Expand and simplify $(x - 2)(x + 5)$.
parts:
- id: a
  prompt: Choose the correct expansion.
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: $x^2 + 3x - 10$
      correct: true
    - id: B
      text: $x^2 - 10$
      correct: false
      misconception_id: mc.mth.o.expand_missing_middle
      feedback: Draw a grid with x and a on one side and x and b on the other. Every box gives a term, so there are four products, not two.
    - id: C
      text: $x^2 - 3x - 10$
      correct: false
      misconception_id: mc.mth.o.expand_sign_slip
      feedback: 'Multiply the signs as well as the numbers: negative times positive is negative, negative times negative is positive.'
    - id: D
      text: $x^2 + 3x + 3$
      correct: false
      misconception_id: mc.mth.o.expand_add_constants
      feedback: 'Try x = 1 in both forms: the brackets and your expansion must give the same value. The last term comes from multiplying the two numbers.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: There are two terms in each bracket, so you should get four products.
  - rung: 2
    name: concept
    text:
      en: Multiply x by both terms in the second bracket, then the number by both terms.
  - rung: 3
    name: first_step
    text:
      en: x × x = x², and x × 5 gives the first x term.
  - rung: 4
    name: worked_step
    text:
      en: The two x terms are 5x and −2x; the number term is −2 × 5.
  - rung: 5
    name: full_step
    text:
      en: Collecting gives $x^2 + 3x - 10$.
  misconception_ids:
  - mc.mth.o.expand_add_constants
  - mc.mth.o.expand_missing_middle
  - mc.mth.o.expand_sign_slip
solution:
  steps:
  - n: 1
    latex: (x - 2)(x + 5) = x^2 + 5x - 2x - 10
    reason: Multiply each term in the first bracket by each term in the second
    check_id: chk_build_mth_alg_0016_m
  - n: 2
    latex: = x^2 + 3x - 10
    reason: Collect the two x terms
    check_id: chk_build_mth_alg_0016_final
