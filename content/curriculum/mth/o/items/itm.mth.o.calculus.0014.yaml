id: itm.mth.o.calculus.0014
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.calculus.differentiate_powers
stem: A curve has equation $y = 2x^2 + x - 5$.
parts:
- id: a
  prompt: Find the gradient of the curve at the point where x = -2.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '-3'
      correct: false
      misconception_id: mc.mth.o.derivative_power_not_brought_down
      feedback: 'Bring the power down as a multiplier, then reduce it by one: x³ becomes 3x².'
    - id: B
      text: '14'
      correct: false
      misconception_id: mc.mth.o.derivative_power_not_reduced
      feedback: After multiplying by the power, reduce the power by one.
    - id: C
      text: '-7'
      correct: true
    - id: D
      text: '1'
      correct: false
      misconception_id: mc.mth.o.gradient_from_y
      feedback: The gradient comes from dy/dx. The curve's equation gives the y-coordinate.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The gradient of a curve changes; dy/dx gives it at any point.
  - rung: 2
    name: concept
    text:
      en: For each term axⁿ, the derivative is naxⁿ⁻¹; a constant term disappears.
  - rung: 3
    name: first_step
    text:
      en: Differentiate term by term.
  - rung: 4
    name: worked_step
    text:
      en: Substitute x = -2 into dy/dx, not into y.
  - rung: 5
    name: full_step
    text:
      en: The gradient at x = -2 is -7.
  misconception_ids:
  - mc.mth.o.derivative_power_not_brought_down
  - mc.mth.o.derivative_power_not_reduced
  - mc.mth.o.gradient_from_y
solution:
  steps:
  - n: 1
    latex: \frac{dy}{dx} = 4x + 1
    reason: Multiply by each power, then reduce the power by one
    check_id: chk_build_mth_cal_0014_d
  - n: 2
    latex: '\text{at } x = -2: \frac{dy}{dx} = -7'
    reason: Substitute into the derivative
    check_id: chk_build_mth_cal_0014_ans
