id: itm.mth.o.number.0050
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.number.venn_counting
stem: In a class of 50 students, 15 own a bicycle, 10 own a phone and 3 do both. Let A be the set of students who own a bicycle and B the set who own a phone.
parts:
- id: a
  prompt: How many students do neither?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '25'
      correct: false
      misconception_id: mc.mth.o.venn_complement_wrong
      feedback: Find n(A ∪ B) first, then subtract it from the total.
    - id: B
      text: '31'
      correct: false
      misconception_id: mc.mth.o.venn_double_count
      feedback: 'Shade A, then shade B: the middle region gets shaded twice. Subtract it once.'
    - id: C
      text: '28'
      correct: true
    - id: D
      text: '22'
      correct: false
      misconception_id: mc.mth.o.venn_only_includes_overlap
      feedback: '''A only'' is the part of circle A outside circle B: n(A) minus the overlap.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The students who do neither are outside both circles.
  - rung: 2
    name: concept
    text:
      en: Find how many are inside at least one circle, then subtract from the class total.
  - rung: 3
    name: first_step
    text:
      en: n(A ∪ B) = 15 + 10 − 3.
  - rung: 4
    name: worked_step
    text:
      en: n(A ∪ B) = 22. Now subtract from 50.
  - rung: 5
    name: full_step
    text:
      en: Neither = 50 − 22 = 28.
  misconception_ids:
  - mc.mth.o.venn_complement_wrong
  - mc.mth.o.venn_double_count
  - mc.mth.o.venn_only_includes_overlap
solution:
  steps:
  - n: 1
    latex: n(A \cup B) = 22
    reason: 15 + 10 - 3
    check_id: chk_build_mth_num_0050_u
  - n: 2
    latex: n((A \cup B)') = 50 - 22 = 28
    reason: The rest are outside both circles
    check_id: chk_build_mth_num_0050_ans
