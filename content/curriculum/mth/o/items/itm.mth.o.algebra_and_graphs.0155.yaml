- kc.mth.o.algebra_and_graphs.quadratic_equations
stem: Solve the equation $x^2 - x - 6 = 0$.
parts:
- id: a
  prompt: Give the smaller solution.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '-3'
      correct: false
      misconception_id: mc.mth.o.root_sign_from_factor
      feedback: 'Set each bracket equal to zero and solve it: x + 3 = 0 gives x = −3.'
    - id: B
      text: '2'
      correct: false
      misconception_id: mc.mth.o.factor_signs_swapped
      feedback: Expand your brackets to check the middle term. If its sign is wrong, swap the signs in the brackets.
    - id: C
      text: '-6'
      correct: false
      misconception_id: mc.mth.o.formula_partial_division
      feedback: The whole of −b ± √(b² − 4ac) sits above the fraction line, so all of it is divided by 2a.
    - id: D
      text: '-2'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Can the quadratic be factorised?
  - rung: 2
    name: concept
    text:
      en: If two brackets multiply to give zero, one of them must be zero.
  - rung: 3
    name: first_step
    text:
      en: Find two numbers that multiply to −6 and add to −1.
  - rung: 4
    name: worked_step
    text:
      en: The factorised form is $(x - 3)(x + 2) = 0$. Set each bracket equal to zero.
  - rung: 5
    name: full_step
    text:
      en: The solutions are x = -2 and x = 3, so the smaller one is -2.
  misconception_ids:
  - mc.mth.o.factor_signs_swapped
  - mc.mth.o.formula_partial_division
  - mc.mth.o.root_sign_from_factor
solution:
  steps:
  - n: 1
    latex: x^2 - x - 6 = (x - 3)(x + 2)
    reason: Factorise
  - n: 2
    latex: (x - 3)(x + 2) = 0
    reason: Each bracket can be zero
  - n: 3
    latex: x = -2 \text{ or } x = 3
    reason: Solve each bracket equal to zero
    check_id: chk_build_mth_alg_0155_sol
  - n: 4
    latex: x = -2
    reason: The smaller solution
    check_id: chk_build_mth_alg_0155_ans
