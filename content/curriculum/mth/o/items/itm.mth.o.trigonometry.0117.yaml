id: itm.mth.o.trigonometry.0117
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.trigonometry.three_d
stem: A cuboid measures 4 cm by 5 cm by 7 cm.
parts:
- id: a
  prompt: Find the length of a diagonal running from a bottom corner to the opposite top corner, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 6.40 cm
      correct: false
      misconception_id: mc.mth.o.three_d_two_dimensions
      feedback: 'The space diagonal needs a second right-angled triangle: the base diagonal and the height.'
    - id: B
      text: 9.49 cm
      correct: true
    - id: C
      text: 16 cm
      correct: false
      misconception_id: mc.mth.o.pythag_sides_added
      feedback: 'A 3, 4 triangle has hypotenuse 5, not 7: the direct route is shorter than going round two sides.'
    - id: D
      text: 90 cm
      correct: false
      misconception_id: mc.mth.o.pythag_no_root
      feedback: a² + b² is the square of the side. Take the square root as the last step.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The diagonal goes through the inside of the cuboid.
  - rung: 2
    name: concept
    text:
      en: 'Use Pythagoras twice: first across the base, then up to the top corner.'
  - rung: 3
    name: first_step
    text:
      en: The base diagonal squared is 4² + 5².
  - rung: 4
    name: worked_step
    text:
      en: That is 41. Now add 7² and take the square root.
  - rung: 5
    name: full_step
    text:
      en: The diagonal is 9.49 cm.
  misconception_ids:
  - mc.mth.o.pythag_no_root
  - mc.mth.o.pythag_sides_added
  - mc.mth.o.three_d_two_dimensions
solution:
  steps:
  - n: 1
    latex: \text{base diagonal}^2 = 4^2 + 5^2 = 41
    reason: Pythagoras in the base
    check_id: chk_build_mth_trg_0117_bd
  - n: 2
    latex: d = \sqrt{41 + 7^2} = 9.49\ \text{cm}
    reason: Pythagoras again with the height
    check_id: chk_build_mth_trg_0117_ans
