stem: A triangle has a side of length 3 cm. It is enlarged by scale factor 3.
parts:
- id: a
  prompt: Find the length of the matching side of the image.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 6 cm
      correct: false
      misconception_id: mc.mth.o.enlargement_added
      feedback: A scale factor of 2 doubles every length; adding 2 would change a 1 cm side and a 10 cm side by the same amount.
    - id: B
      text: 1 cm
      correct: false
      misconception_id: mc.mth.o.similar_factor_inverted
      feedback: Scale factor = new length ÷ old length. Going to the larger shape, lengths get bigger.
    - id: C
      text: 9 cm
      correct: true
    - id: D
      text: 27 cm
      correct: false
      misconception_id: mc.mth.o.similar_area_factor_for_length
      feedback: Lengths use the scale factor itself; only areas use its square.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: An enlargement keeps the shape but changes the size.
  - rung: 2
    name: concept
    text:
      en: Every length is multiplied by the scale factor.
  - rung: 3
    name: first_step
    text:
      en: Multiply 3 by 3.
  - rung: 4
    name: worked_step
    text:
      en: A scale factor less than 1 makes the shape smaller.
  - rung: 5
    name: full_step
    text:
      en: The side is 9 cm.
  misconception_ids:
  - mc.mth.o.enlargement_added
  - mc.mth.o.similar_area_factor_for_length
  - mc.mth.o.similar_factor_inverted
