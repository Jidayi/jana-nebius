  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The speed is the gradient of the distance-time graph.
  - rung: 2
    name: concept
    text:
      en: Gradient = change in distance ÷ change in time, between two points.
  - rung: 3
    name: first_step
    text:
      en: Change in distance = 350 − 50; change in time = 80 − 20.
  - rung: 4
    name: worked_step
    text:
      en: The changes are 300 m and 60 s.
  - rung: 5
    name: full_step
    text:
      en: Speed = 300 ÷ 60 = 5 m/s.
  misconception_ids:
