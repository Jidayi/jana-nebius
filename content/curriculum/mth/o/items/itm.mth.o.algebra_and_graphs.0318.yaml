stem: The functions f and g are given by $f(x) = 3x - 1$ and $g(x) = x^2 + 2$.
parts:
- id: a
  prompt: Find gf(-3).
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '32'
      correct: false
      misconception_id: mc.mth.o.composite_order_reversed
      feedback: 'fg(x) means f(g(x)): the function next to x acts first, so do g, then f.'
    - id: B
      text: '-110'
      correct: false
      misconception_id: mc.mth.o.composite_as_product
      feedback: fg(x) feeds the output of g into f; it is not a multiplication.
    - id: C
      text: '102'
      correct: true
    - id: D
      text: '-18'
      correct: false
      misconception_id: mc.mth.o.multiply_before_power
      feedback: The power belongs only to the letter next to it. Square x first, then multiply by the number in front.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: gf(x) means g(f(x)). Which function is applied first?
  - rung: 2
    name: concept
    text:
      en: Work out f of the number first, then put that answer into g.
  - rung: 3
    name: first_step
    text:
      en: f(-3) = 3 × (-3) - 1.
  - rung: 4
    name: worked_step
    text:
      en: f(-3) = -10. Now find g(-10).
  - rung: 5
    name: full_step
    text:
      en: gf(-3) = 102.
  misconception_ids:
  - mc.mth.o.composite_as_product
  - mc.mth.o.composite_order_reversed
  - mc.mth.o.multiply_before_power
solution:
  steps:
  - n: 1
    latex: f(-3) = 3 \times (-3) - 1 = -10
    reason: The function next to x acts first
    check_id: chk_build_mth_alg_0318_f
  - n: 2
    latex: g(-10) = (-10)^2 + 2 = 102
    reason: Then apply g
    check_id: chk_build_mth_alg_0318_ans
