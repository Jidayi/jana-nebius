id: itm.mth.o.statistics.0082
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.statistics.grouped_mean
stem: 'The times, t minutes, that students took to finish a task are grouped: 0 ≤ t < 20: 5; 20 ≤ t < 40: 7; 40 ≤ t < 60: 13; 60 ≤ t < 80: 3.'
parts:
- id: a
  prompt: Estimate the mean time.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 50 minutes
      correct: false
      misconception_id: mc.mth.o.grouped_upper_bound
      feedback: 'The midpoint is the best single value for a class: add the ends and halve.'
    - id: B
      text: 280 minutes
      correct: false
      misconception_id: mc.mth.o.frequency_mean_rows
      feedback: 'The mean shares the total among all the items: divide by Σf.'
    - id: C
      text: 40 minutes
      correct: true
    - id: D
      text: 30 minutes
      correct: false
      misconception_id: mc.mth.o.class_width_wrong
      feedback: Class width = upper boundary − lower boundary.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: You do not know the exact times, so use one value for each class.
  - rung: 2
    name: concept
    text:
      en: Use the midpoint of each class, multiply by its frequency, add, and divide by the total frequency.
  - rung: 3
    name: first_step
    text:
      en: The first class has midpoint (0 + 20) ÷ 2.
  - rung: 4
    name: worked_step
    text:
      en: Σfx = 1120 and Σf = 28.
  - rung: 5
    name: full_step
    text:
      en: The estimated mean is 40 minutes.
  misconception_ids:
  - mc.mth.o.class_width_wrong
  - mc.mth.o.frequency_mean_rows
  - mc.mth.o.grouped_upper_bound
solution:
  steps:
  - n: 1
    latex: '\text{midpoints: } 10, 30, 50, 70'
    reason: Middle of each class
    check_id: chk_build_mth_sta_0082_mids
  - n: 2
    latex: \Sigma fx = 1120,\ \Sigma f = 28
    reason: Midpoint times frequency, added
    check_id: chk_build_mth_sta_0082_t
  - n: 3
    latex: \text{mean} \approx \frac{1120}{28} = 40
    reason: Divide by the total frequency
    check_id: chk_build_mth_sta_0082_sc
difficulty:
  prior: 0.4
  band: core
estimated_seconds: 120
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
context_tags:
- none
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_mth_sta_0082_ans:
    args:
      expression: 1120.0/28
    tool: math_evaluate
  chk_build_mth_sta_0082_mids:
    args:
      equations:
      - p = (0 + 20)/2
      - q = (20 + 40)/2
      - r = (40 + 60)/2
      - s = (60 + 80)/2
      unknowns:
      - p
      - q
      - r
      - s
    tool: math_solve
  chk_build_mth_sta_0082_sc:
    args:
      grouped:
      - frequency: 5
        lower: 0
        upper: 20
      - frequency: 7
        lower: 20
        upper: 40
      - frequency: 13
        lower: 40
        upper: 60
      - frequency: 3
        lower: 60
        upper: 80
      quartile_method: exclusive
    tool: stats_compute
  chk_build_mth_sta_0082_t:
    args:
      equations:
      - p = 1120.0
      - q = 28
      unknowns:
      - p
      - q
    tool: math_solve
authoring:
  drafted_by: rev_author_agent
  history:
  - drafted
  - verified
  - in_eval_bank
  - published
