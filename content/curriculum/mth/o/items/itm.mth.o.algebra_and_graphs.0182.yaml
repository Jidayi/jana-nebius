    name: orient
    text:
      en: Do the same thing to all three parts of the inequality.
  - rung: 2
    name: concept
    text:
      en: Subtract 3 from every part, then divide every part by 3.
  - rung: 3
    name: first_step
    text:
      en: Find the two boundary values for x.
  - rung: 4
    name: worked_step
    text:
      en: You should get -1 < x ≤ 3. Which end is included?
  - rung: 5
    name: full_step
    text:
      en: 'List the integers from just above -1 up to 3: there are 4 of them.'
  misconception_ids:
