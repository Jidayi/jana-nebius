id: itm.mth.o.algebra_and_graphs.0065
version: 0.1.0
type: mcq
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.change_subject
stem: Make r the subject of the formula $A = \pi r^2$.
parts:
- id: a
  prompt: Choose the correct rearrangement.
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: $r = \frac{A}{\pi}$
      correct: false
      misconception_id: mc.mth.o.rearrange_root_forgotten
      feedback: If the letter you want is squared, the last step is to take the square root of the other side.
    - id: B
      text: $r = \sqrt{\frac{A}{\pi}}$
      correct: true
    - id: C
      text: $r = \sqrt{A - \pi}$
      correct: false
      misconception_id: mc.mth.o.rearrange_wrong_inverse
      feedback: The opposite of multiplying by a is dividing by a. Check by putting numbers back into your answer.
    - id: D
      text: $r = \sqrt{A\pi}$
      correct: false
      misconception_id: mc.mth.o.rearrange_wrong_inverse
      feedback: The opposite of multiplying by a is dividing by a. Check by putting numbers back into your answer.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Which operations have been done to r, and in what order?
  - rung: 2
    name: concept
    text:
      en: Undo them in reverse order, doing the same to both sides each time, until r is alone.
  - rung: 3
    name: first_step
    text:
      en: Start with the operation that was done last.
  - rung: 4
    name: worked_step
    text:
      en: 'Each step uses the inverse operation: subtract to undo adding, divide to undo multiplying, take the square root to undo squaring.'
  - rung: 5
    name: full_step
    text:
      en: The rearranged formula is $r = \sqrt{\frac{A}{\pi}}$.
  misconception_ids:
  - mc.mth.o.rearrange_root_forgotten
  - mc.mth.o.rearrange_wrong_inverse
solution:
  steps:
  - n: 1
    latex: A = \pi r^2
    reason: Start from the formula
  - n: 2
    latex: r = \sqrt{\frac{A}{\pi}}
    reason: Undo each operation on r in reverse order, doing the same to both sides
