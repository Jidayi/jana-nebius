      expression: '-1'
    tool: math_evaluate
  chk_build_mth_cal_0044_d:
    args:
      expression: (1)*x^3 + (-3)*x^2 + (-9)*x^1 + (-1)*x^0
      stationary_points: true
      variable: x
    tool: math_differentiate
  chk_build_mth_cal_0044_dd:
    args:
      equations:
      - p = 3*-1*3
      - q = -3*(-1 + 3)
      - r = 6
      unknowns:
