    latex: \text{height above eye level} = 40 \tan 37 = 30.14
    reason: Opposite = adjacent × tan
    check_id: chk_build_mth_trg_0047_o
  - n: 2
    latex: 30.14 + 1.6 = 31.7\ \text{m}
    reason: Add the eye height
    check_id: chk_build_mth_trg_0047_ans
