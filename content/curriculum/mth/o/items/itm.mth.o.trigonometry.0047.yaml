stem: A student stands 40 m from the foot of a tree on level ground. Her eyes are 1.6 m above the ground, and the angle of elevation of the top of the tree from her eyes is 37°.
parts:
- id: a
  prompt: Find the height of the tree, to 3 significant figures.
  marks: 3
  answer:
    kind: numeric
    value: '31.7'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_trg_0047_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Draw a horizontal line from her eyes to the tree: it makes a right-angled triangle.'
  - rung: 2
    name: concept
    text:
      en: The horizontal distance 40 m is adjacent to the angle; the part of the tree above eye level is opposite.
  - rung: 3
    name: first_step
    text:
      en: 'Use tan: height above eye level = 40 × tan 37°.'
  - rung: 4
    name: worked_step
    text:
      en: That gives 30.14 m. Do not forget the 1.6 m below eye level.
  - rung: 5
    name: full_step
    text:
      en: The tree is 31.7 m tall.
  misconception_ids:
