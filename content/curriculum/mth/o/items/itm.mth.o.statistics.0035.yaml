stem: 'A two-way table shows how students travel to school. Boys: walk ?, bus 13, car 7, total 41. Girls: walk 10, bus 24, car 4, total 38.'
parts:
- id: a
  prompt: How many boys travel by walk?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '18'
      correct: false
      misconception_id: mc.mth.o.table_row_column_confused
      feedback: Find a row or column where only one entry is missing, and use that line's own total.
    - id: B
      text: '61'
      correct: false
      misconception_id: mc.mth.o.table_total_ignored
      feedback: The total is the sum of the entries, so a missing entry is the total minus the others.
    - id: C
      text: '28'
      correct: false
      misconception_id: mc.mth.o.table_entry_missed
      feedback: Subtract every known entry in the row from the row total, not just one of them.
    - id: D
      text: '21'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Look only at the boys' row.
  - rung: 2
    name: concept
    text:
      en: The entries in a row add up to the row total.
  - rung: 3
    name: first_step
    text:
      en: 'Add the boys'' entries you know: 13 and 7.'
  - rung: 4
    name: worked_step
    text:
      en: They make 20. Subtract this from 41.
  - rung: 5
    name: full_step
    text:
      en: 21 boys travel by walk.
  misconception_ids:
  - mc.mth.o.table_row_column_confused
  - mc.mth.o.table_total_ignored
  - mc.mth.o.table_entry_missed
