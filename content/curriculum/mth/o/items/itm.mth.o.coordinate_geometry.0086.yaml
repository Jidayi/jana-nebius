      text: '3'
      correct: false
      misconception_id: mc.mth.o.midpoint_subtracted
      feedback: 'The midpoint is the average of the two coordinates: add, then halve.'
    - id: B
      text: '4'
      correct: false
      misconception_id: mc.mth.o.midpoint_not_halved
      feedback: 'A midpoint is halfway: the average, so divide the sum by 2.'
    - id: C
