    text:
      en: You know two sides and an angle opposite one of them.
  - rung: 2
    name: concept
    text:
      en: 'Use the sine rule with the angles on top: sin B / b = sin A / a.'
  - rung: 3
    name: first_step
    text:
      en: sin B = 10.2 × sin 63° ÷ 12.
  - rung: 4
    name: worked_step
