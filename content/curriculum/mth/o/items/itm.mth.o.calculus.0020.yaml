- kc.mth.o.calculus.tangents_normals
stem: A curve has equation $y = 3x^2 - 5x + 4$. The tangent to the curve at the point where x = -2 has equation y = mx + c.
parts:
- id: a
  prompt: Find c.
  marks: 4
  answer:
    kind: numeric
    value: '-8'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_cal_0020_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A tangent touches the curve at one point and has the curve's gradient there.
  - rung: 2
    name: concept
    text:
      en: Find the point on the curve, then the gradient from dy/dx, then c from y = mx + c.
  - rung: 3
    name: first_step
    text:
      en: Substitute x = -2 into the curve for y, and into dy/dx for m.
  - rung: 4
    name: worked_step
    text:
      en: y = 26 and m = -17; now solve 26 = m × (-2) + c.
  - rung: 5
    name: full_step
    text:
      en: c = -8.
  misconception_ids:
  - mc.mth.o.intercept_sign
  - mc.mth.o.c_as_y_coordinate
  - mc.mth.o.derivative_power_not_brought_down
solution:
  steps:
  - n: 1
    latex: 'y = 3x^2 - 5x + 4 \text{ at } x = -2: y = 26'
    reason: The point of contact
    check_id: chk_build_mth_cal_0020_y
  - n: 2
    latex: m = \frac{dy}{dx} = -17
    reason: Gradient from the derivative
    check_id: chk_build_mth_cal_0020_m
  - n: 3
    latex: c = 26 - (-17) \times (-2) = -8
    reason: Substitute the point into y = mx + c
    check_id: chk_build_mth_cal_0020_ans
