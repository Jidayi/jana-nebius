stem: Solve the equation $x^2 - 3x - 10 = 0$.
parts:
- id: a
  prompt: Give the smaller solution.
  marks: 3
  answer:
    kind: numeric
    value: '-2'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_alg_0146_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Can the quadratic be factorised?
  - rung: 2
    name: concept
    text:
      en: If two brackets multiply to give zero, one of them must be zero.
  - rung: 3
    name: first_step
    text:
      en: Find two numbers that multiply to −10 and add to −3.
  - rung: 4
    name: worked_step
    text:
      en: The factorised form is $(x + 2)(x - 5) = 0$. Set each bracket equal to zero.
  - rung: 5
    name: full_step
    text:
      en: The solutions are x = -2 and x = 5, so the smaller one is -2.
  misconception_ids:
  - mc.mth.o.root_sign_from_factor
  - mc.mth.o.factor_signs_swapped
  - mc.mth.o.formula_partial_division
solution:
  steps:
  - n: 1
    latex: x^2 - 3x - 10 = (x + 2)(x - 5)
    reason: Factorise
  - n: 2
    latex: (x + 2)(x - 5) = 0
    reason: Each bracket can be zero
  - n: 3
    latex: x = -2 \text{ or } x = 5
    reason: Solve each bracket equal to zero
    check_id: chk_build_mth_alg_0146_sol
  - n: 4
    latex: x = -2
    reason: The smaller solution
    check_id: chk_build_mth_alg_0146_ans
