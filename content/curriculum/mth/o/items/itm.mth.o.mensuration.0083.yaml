    latex: \text{base area} = 10^2 = 100
    reason: Area of the square base
    check_id: chk_build_mth_mns_0083_b
  - n: 2
    latex: V = \tfrac{1}{3} \times 100 \times 9 = 300\ \text{cm}^3
    reason: One third of base times height
