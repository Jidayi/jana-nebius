    text:
      en: A pyramid has one third of the volume of the prism with the same base and height.
  - rung: 2
    name: concept
    text:
      en: Volume = ⅓ × base area × height.
  - rung: 3
    name: first_step
    text:
      en: The base area is 10 × 10.
