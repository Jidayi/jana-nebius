stem: Line L has equation $y = -3x + 7$. Line N is parallel to L and passes through (4, 9).
parts:
- id: a
  prompt: The equation of N is y = mx + c. Find c.
  marks: 2
  answer:
    kind: numeric
    value: '21'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_crd_0110_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Parallel lines never meet, so they have the same steepness.
  - rung: 2
    name: concept
    text:
      en: N has gradient -3, the same as L, but a different intercept.
  - rung: 3
    name: first_step
    text:
      en: Substitute x = 4, y = 9 and m = -3 into y = mx + c.
  - rung: 4
    name: worked_step
    text:
      en: -3 × (4) = -12.
  - rung: 5
    name: full_step
    text:
      en: c = 21.
  misconception_ids:
  - mc.mth.o.parallel_same_intercept
  - mc.mth.o.parallel_perpendicular_confused
  - mc.mth.o.intercept_sign
solution:
  steps:
  - n: 1
    latex: m = -3
    reason: Parallel lines have the same gradient
  - n: 2
    latex: 9 = -3 \times (4) + c
    reason: Substitute the point
  - n: 3
    latex: -3 \times (4) = -12
    reason: Multiply
    check_id: chk_build_mth_crd_0110_t
  - n: 4
    latex: c = 9 - (-12) = 21
    reason: Solve for c
    check_id: chk_build_mth_crd_0110_ans
