id: itm.mth.o.coordinate_geometry.0073
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.coordinate_geometry.segment_length
stem: P is the point (3, -3) and Q is the point (4, 0).
parts:
- id: a
  prompt: Find the length of PQ, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '4'
      correct: false
      misconception_id: mc.mth.o.length_changes_added
      feedback: The segment is the hypotenuse of a right-angled triangle with the two changes as its other sides.
    - id: B
      text: '3.16'
      correct: true
    - id: C
      text: '10'
      correct: false
      misconception_id: mc.mth.o.pythag_no_root
      feedback: a² + b² is the square of the side. Take the square root as the last step.
    - id: D
      text: '7.62'
      correct: false
      misconception_id: mc.mth.o.coordinates_added_not_subtracted
      feedback: 'A change is a difference: subtract the coordinates.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Sketch the two points: the segment is the hypotenuse of a right-angled triangle.'
  - rung: 2
    name: concept
    text:
      en: The other two sides are the change in x and the change in y.
  - rung: 3
    name: first_step
    text:
      en: Change in x = 4 − (3); change in y = 0 − (-3).
  - rung: 4
    name: worked_step
    text:
      en: 'Square both changes and add: 10. Then take the square root.'
  - rung: 5
    name: full_step
    text:
      en: PQ = 3.16.
  misconception_ids:
  - mc.mth.o.coordinates_added_not_subtracted
  - mc.mth.o.length_changes_added
  - mc.mth.o.pythag_no_root
solution:
  steps:
  - n: 1
    latex: PQ^2 = (x_2 - x_1)^2 + (y_2 - y_1)^2
    reason: Pythagoras on the changes
  - n: 2
    latex: PQ^2 = (1)^2 + (3)^2 = 10
    reason: Square and add
    check_id: chk_build_mth_crd_0073_s
  - n: 3
    latex: PQ = \sqrt{10} = 3.16
    reason: Square root
    check_id: chk_build_mth_crd_0073_ans
