id: itm.mth.o.algebra_and_graphs.0081
version: 0.1.0
type: mcq
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.algebraic_fractions
stem: Write $\frac{2}{x} + \frac{2}{x + 2}$ as a single fraction.
parts:
- id: a
  prompt: Choose the correct single fraction.
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: $\frac{4}{2x + 2}$
      correct: false
      misconception_id: mc.mth.o.add_tops_and_bottoms
      feedback: One half plus one half is one, not two quarters. Fractions need a common denominator before you add the numerators.
    - id: B
      text: $\frac{4x + 4}{x(x + 2)}$
      correct: true
    - id: C
      text: $\frac{4}{x(x + 2)}$
      correct: false
      misconception_id: mc.mth.o.numerator_not_scaled
      feedback: Whatever you multiply the bottom by, multiply the top by too, so each fraction keeps its value.
    - id: D
      text: $\frac{4x + 2}{x(x + 2)}$
      correct: false
      misconception_id: mc.mth.o.expand_first_term_only
      feedback: 'The number outside multiplies every term inside: 3(x + 4) = 3x + 12, not 3x + 4.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: To add fractions you need a common denominator.
  - rung: 2
    name: concept
    text:
      en: The simplest common denominator here is the product of the two denominators.
  - rung: 3
    name: first_step
    text:
      en: Multiply the top and bottom of the first fraction by (x + 2), and the second by x.
  - rung: 4
    name: worked_step
    text:
      en: The top becomes 2(x + 2) + 2x. Expand and collect.
  - rung: 5
    name: full_step
    text:
      en: The single fraction is $\frac{4x + 4}{x(x + 2)}$.
  misconception_ids:
  - mc.mth.o.add_tops_and_bottoms
  - mc.mth.o.expand_first_term_only
  - mc.mth.o.numerator_not_scaled
solution:
  steps:
  - n: 1
    latex: \frac{2(x + 2)}{x(x + 2)} + \frac{2x}{x(x + 2)}
    reason: Use the common denominator x(x + 2)
  - n: 2
    latex: = \frac{2x + 4 + 2x}{x(x + 2)}
    reason: Expand the top
    check_id: chk_build_mth_alg_0081_t
  - n: 3
    latex: = \frac{4x + 4}{x(x + 2)}
    reason: Collect like terms
    check_id: chk_build_mth_alg_0081_final
