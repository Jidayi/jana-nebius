id: itm.mth.o.probability.0050
version: 0.1.0
type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.probability.dependent_events
stem: A bag holds 4 red and 3 blue counters. Two counters are taken out, one after the other, without replacement.
parts:
- id: a
  prompt: Find the probability that both are red. Give your answer to 3 significant figures.
  marks: 3
  answer:
    kind: numeric
    value: '0.286'
    unit: null
    unit_policy: none
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_prb_0050_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Draw a tree diagram: the second set of branches depends on the first pick.'
  - rung: 2
    name: concept
    text:
      en: Without replacement, the second probability has one fewer counter in the total.
  - rung: 3
    name: first_step
    text:
      en: The first pick is red with probability 4/7; then the bag has one fewer red and one fewer counter.
  - rung: 4
    name: worked_step
    text:
      en: Multiply along each path, then add the paths you need.
  - rung: 5
    name: full_step
    text:
      en: The probability is 0.286.
  misconception_ids:
  - mc.mth.o.without_replacement_ignored
  - mc.mth.o.denominator_not_reduced
  - mc.mth.o.and_as_add
solution:
  steps:
  - n: 1
    latex: \text{total} = 7,\ \text{then } 6 \text{ after one is taken}
    reason: Count the counters before and after the first pick
    check_id: chk_build_mth_prb_0050_tot
  - n: 2
    latex: P(\text{red, red}) = \frac{4}{7} \times \frac{4 - 1}{7 - 1}
    reason: One red is gone for the second pick
  - n: 3
    latex: = 0.286
    reason: Multiply
    check_id: chk_build_mth_prb_0050_ans
