  - mc.mth.o.compound_part_missing
solution:
  steps:
  - n: 1
    latex: A = \pi \times 6^2 - \pi \times 3^2
    reason: Big circle minus small circle
  - n: 2
    latex: A = 84.8\ \text{cm}^2
    reason: Evaluate and round
