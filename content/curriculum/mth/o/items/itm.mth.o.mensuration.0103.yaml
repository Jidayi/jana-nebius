stem: A flat ring is the region between two circles with the same centre, of radii 6 cm and 3 cm.
parts:
- id: a
  prompt: Find the area of the ring, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 28.3 cm²
      correct: false
      misconception_id: mc.mth.o.annulus_difference_squared
      feedback: 'Work out each circle''s area and subtract: the ring is the big disc with the small disc removed.'
    - id: B
      text: 113 cm²
      correct: false
      misconception_id: mc.mth.o.compound_part_missing
      feedback: Split the shape into simple parts, label each one, and add every part.
    - id: C
      text: 18.8 cm²
      correct: false
      misconception_id: mc.mth.o.circumference_area_confused
      feedback: 'Area is in square units, so its formula has r²: A = πr². The circumference is a length: C = 2πr.'
    - id: D
      text: 84.8 cm²
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The ring is the big disc with the small disc cut out.
  - rung: 2
    name: concept
    text:
      en: Find both circle areas and subtract.
  - rung: 3
    name: first_step
    text:
      en: The big circle has area π × 6².
  - rung: 4
    name: worked_step
    text:
      en: Subtract π × 3².
  - rung: 5
    name: full_step
    text:
      en: The area of the ring is 84.8 cm².
  misconception_ids:
  - mc.mth.o.annulus_difference_squared
