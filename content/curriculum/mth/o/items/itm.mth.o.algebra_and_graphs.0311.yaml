stem: The functions f and g are given by $f(x) = 2x + 5$ and $g(x) = x^2 - 2$.
parts:
- id: a
  prompt: Find gf(-2).
  marks: 2
  answer:
    kind: numeric
    value: '-1'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_alg_0311_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: gf(x) means g(f(x)). Which function is applied first?
  - rung: 2
    name: concept
    text:
      en: Work out f of the number first, then put that answer into g.
  - rung: 3
    name: first_step
    text:
      en: f(-2) = 2 × (-2) + 5.
  - rung: 4
    name: worked_step
    text:
      en: f(-2) = 1. Now find g(1).
  - rung: 5
    name: full_step
    text:
      en: gf(-2) = -1.
  misconception_ids:
  - mc.mth.o.composite_order_reversed
  - mc.mth.o.composite_as_product
  - mc.mth.o.multiply_before_power
solution:
  steps:
  - n: 1
    latex: f(-2) = 2 \times (-2) + 5 = 1
    reason: The function next to x acts first
    check_id: chk_build_mth_alg_0311_f
  - n: 2
    latex: g(1) = (1)^2 - 2 = -1
    reason: Then apply g
    check_id: chk_build_mth_alg_0311_ans
