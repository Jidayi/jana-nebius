id: itm.mth.o.mensuration.0035
version: 0.1.0
type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.mensuration.circle_measures
stem: A circle has diameter 5 cm.
parts:
- id: a
  prompt: Find its area, to 3 significant figures.
  marks: 2
  answer:
    kind: numeric
    value: '19.6'
    unit: cm^2
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_mns_0035_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The area formula uses the radius.
  - rung: 2
    name: concept
    text:
      en: Area of a circle = π × radius².
  - rung: 3
    name: first_step
    text:
      en: Halve the diameter to get the radius.
  - rung: 4
    name: worked_step
    text:
      en: Work out π × 2.5².
  - rung: 5
    name: full_step
    text:
      en: The area is 19.6 cm².
  misconception_ids:
  - mc.mth.o.diameter_for_radius
  - mc.mth.o.circumference_area_confused
  - mc.mth.o.radius_not_squared
solution:
  steps:
  - n: 1
    latex: r = \frac{5}{2} = 2.5
    reason: Halve the diameter
    check_id: chk_build_mth_mns_0035_rr
  - n: 2
    latex: A = \pi r^2
    reason: Area of a circle
  - n: 3
    latex: A = \pi \times 2.5^2 = 19.6\ \text{cm}^2
    reason: Substitute and round
    check_id: chk_build_mth_mns_0035_ans
