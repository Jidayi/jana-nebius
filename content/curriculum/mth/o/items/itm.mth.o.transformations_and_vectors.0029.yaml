id: itm.mth.o.transformations_and_vectors.0029
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.transformations_and_vectors.enlargement
stem: A rectangle 5 cm long is enlarged. In the image, the matching side is 2.5 cm.
parts:
- id: a
  prompt: Find the scale factor of the enlargement.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '2'
      correct: false
      misconception_id: mc.mth.o.similar_factor_inverted
      feedback: Scale factor = new length ÷ old length. Going to the larger shape, lengths get bigger.
    - id: B
      text: '0.5'
      correct: true
    - id: C
      text: '-2.5'
      correct: false
      misconception_id: mc.mth.o.enlargement_added
      feedback: A scale factor of 2 doubles every length; adding 2 would change a 1 cm side and a 10 cm side by the same amount.
    - id: D
      text: '0.707'
      correct: false
      misconception_id: mc.mth.o.similar_area_factor_for_length
      feedback: Lengths use the scale factor itself; only areas use its square.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The scale factor compares matching lengths.
  - rung: 2
    name: concept
    text:
      en: Scale factor = image length ÷ original length.
  - rung: 3
    name: first_step
    text:
      en: Divide 2.5 by 5.
  - rung: 4
    name: worked_step
    text:
      en: 'Check: does multiplying the original by your factor give the image?'
  - rung: 5
    name: full_step
    text:
      en: The scale factor is 0.5.
  misconception_ids:
  - mc.mth.o.enlargement_added
  - mc.mth.o.similar_area_factor_for_length
  - mc.mth.o.similar_factor_inverted
solution:
  steps:
  - n: 1
    latex: k = \frac{2.5}{5} = 0.5
    reason: Image length over original length
    check_id: chk_build_mth_vec_0029_ans
