      expression: 910.0/26
    tool: math_evaluate
  chk_build_mth_sta_0078_mids:
    args:
      equations:
      - p = (10 + 20)/2
      - q = (20 + 30)/2
      - r = (30 + 40)/2
      - s = (40 + 50)/2
      unknowns:
