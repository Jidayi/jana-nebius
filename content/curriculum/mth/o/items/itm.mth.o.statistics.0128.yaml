type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.statistics.cumulative_frequency
stem: 'The masses (kg) of 39 parcels are summarised in a cumulative frequency table: none under 0; up to 20: 7; up to 40: 11; up to 60: 24; up to 80: 28; up to 100: 39.'
parts:
- id: a
  prompt: Estimate the median mass, to 3 significant figures, by interpolating within the class.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 53.1 kg
      correct: true
    - id: B
      text: 50 kg
      correct: false
      misconception_id: mc.mth.o.median_class_midpoint
      feedback: Read across from half the total frequency on the cumulative frequency curve, or interpolate within the class.
    - id: C
      text: 19.5 kg
      correct: false
      misconception_id: mc.mth.o.median_position_as_value
      feedback: n/2 tells you where to read across from; the median is the value on the other axis.
    - id: D
      text: 82.3 kg
      correct: false
      misconception_id: mc.mth.o.iqr_as_quartile
      feedback: Interquartile range = upper quartile − lower quartile.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The median is the value halfway through the data.
  - rung: 2
    name: concept
    text:
      en: Find half the total frequency, then the class where the cumulative frequency passes it.
  - rung: 3
    name: first_step
    text:
      en: Half of 39 is 19.5.
  - rung: 4
    name: worked_step
    text:
      en: The median lies in the class 40 to 60; work out how far into it.
  - rung: 5
    name: full_step
    text:
      en: The median is about 53.1 kg.
  misconception_ids:
  - mc.mth.o.iqr_as_quartile
  - mc.mth.o.median_class_midpoint
  - mc.mth.o.median_position_as_value
solution:
  steps:
  - n: 1
    latex: \frac{39}{2} = 19.5
    reason: Position of the median
    check_id: chk_build_mth_sta_0128_h
  - n: 2
    latex: \text{class frequency} = 24 - 11 = 13
    reason: Parcels in the median class
    check_id: chk_build_mth_sta_0128_f
  - n: 3
    latex: \text{median} \approx 40 + \frac{19.5 - 11}{13} \times 20 = 53.1
    reason: Interpolate in the median class
    check_id: chk_build_mth_sta_0128_ans
