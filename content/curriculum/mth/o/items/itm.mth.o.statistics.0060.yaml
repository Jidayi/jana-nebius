type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.statistics.averages_frequency
stem: 'A frequency table shows the goals scored in a season: 0 goals: 7 matches, 1 goals: 3 matches, 2 goals: 9 matches, 3 goals: 8 matches, 5 goals: 9 matches.'
parts:
- id: a
  prompt: Find the mean number of goals per match.
  marks: 3
  answer:
    kind: numeric
    value: '2.5'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_sta_0060_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Each value appears several times; the frequency says how many.
  - rung: 2
    name: concept
    text:
      en: 'Mean = Σfx ÷ Σf: the total of all the goals divided by the number of matches.'
  - rung: 3
    name: first_step
    text:
      en: Multiply each number of goals by its frequency, then add.
  - rung: 4
    name: worked_step
    text:
      en: Σfx = 90 and Σf = 36.
  - rung: 5
    name: full_step
    text:
      en: The mean is 2.5.
  misconception_ids:
  - mc.mth.o.frequency_mean_rows
  - mc.mth.o.frequency_ignored
  - mc.mth.o.mean_wrong_count
solution:
  steps:
  - n: 1
    latex: \Sigma fx = 90,\ \Sigma f = 36
    reason: Multiply each value by its frequency and add
    check_id: chk_build_mth_sta_0060_t
  - n: 2
    latex: \text{mean} = \frac{90}{36} = 2.5
    reason: Divide by the total frequency
    check_id: chk_build_mth_sta_0060_sc
