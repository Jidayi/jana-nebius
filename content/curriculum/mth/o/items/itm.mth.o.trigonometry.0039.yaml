stem: In a right-angled triangle, the hypotenuse is 20 cm and the side opposite angle θ is 5 cm.
parts:
- id: a
  prompt: Find θ, to 1 decimal place.
  marks: 3
  answer:
    kind: numeric
    value: '14.5'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.05
    check_id: chk_build_mth_trg_0039_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which two sides do you know, measured from θ?
  - rung: 2
    name: concept
    text:
      en: 'Opposite and hypotenuse: use sin.'
  - rung: 3
    name: first_step
    text:
      en: sin θ = 5/20.
  - rung: 4
    name: worked_step
    text:
      en: Use the inverse sine of 5/20, in degrees.
  - rung: 5
    name: full_step
    text:
      en: θ = 14.5°.
  misconception_ids:
  - mc.mth.o.trig_ratio_wrong
  - mc.mth.o.trig_ratio_inverted
  - mc.mth.o.calculator_radians
solution:
  steps:
  - n: 1
    latex: \sin \theta = \frac{5}{20}
    reason: Opposite over hypotenuse
  - n: 2
    latex: \theta = \sin^{-1}\left(\frac{5}{20}\right) = 14.5
    reason: Inverse sine
    check_id: chk_build_mth_trg_0039_ans
