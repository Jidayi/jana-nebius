  - rung: 2
    name: concept
    text:
      en: Find each area separately and add them.
  - rung: 3
    name: first_step
    text:
      en: The semicircle's radius is half of 10 cm.
  - rung: 4
    name: worked_step
    text:
      en: The rectangle is 50 cm² and the semicircle is 39.27 cm².
  - rung: 5
    name: full_step
    text:
      en: The total is 89.3 cm².
  misconception_ids:
