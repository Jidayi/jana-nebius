solution:
  steps:
  - n: 1
    latex: \text{rectangle} = 10 \times 5 = 50
    reason: Area of the rectangle
    check_id: chk_build_mth_mns_0093_rect
  - n: 2
    latex: \text{semicircle} = \tfrac{1}{2} \pi \times 5^2 = 39.27
    reason: Half a circle of radius half the width
    check_id: chk_build_mth_mns_0093_semi
  - n: 3
    latex: A = 89.3\ \text{cm}^2
    reason: Add the two parts
    check_id: chk_build_mth_mns_0093_ans
