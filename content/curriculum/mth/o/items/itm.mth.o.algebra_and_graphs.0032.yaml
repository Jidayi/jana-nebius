  chk_build_mth_alg_0032_hcf:
    args:
      expression: abs(4*14)/abs(2*7)/2
    tool: math_evaluate
  chk_build_mth_alg_0032_t:
    args:
      equations:
      - p = 4/2
      - q = 14/2
      unknowns:
      - p
      - q
    tool: math_solve
