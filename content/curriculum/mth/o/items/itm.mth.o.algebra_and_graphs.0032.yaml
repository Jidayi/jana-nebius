id: itm.mth.o.algebra_and_graphs.0032
version: 0.1.0
type: mcq
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.factorise_common
stem: Factorise completely $4x^2 - 14x$.
parts:
- id: a
  prompt: Choose the complete factorisation.
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: $2x(2x - 7)$
      correct: true
    - id: B
      text: $x(4x - 14)$
      correct: false
      misconception_id: mc.mth.o.factorise_not_fully
      feedback: 'Check the bracket at the end: if its terms still share a number or a letter, take that out too.'
    - id: C
      text: $2x(2x - 14)$
      correct: false
      misconception_id: mc.mth.o.factor_one_term_only
      feedback: Expand your answer to check it. Every term inside the bracket must be divided by the factor you took out.
    - id: D
      text: $2x(2x + 7)$
      correct: false
      misconception_id: mc.mth.o.expand_sign_slip
      feedback: 'Multiply the signs as well as the numbers: negative times positive is negative, negative times negative is positive.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Find what the two terms have in common: a number and a letter.'
  - rung: 2
    name: concept
    text:
      en: Take out the highest common factor of the numbers and the letters, then divide each term by it.
  - rung: 3
    name: first_step
    text:
      en: The highest common factor of 4 and 14 goes in front, together with x.
  - rung: 4
    name: worked_step
    text:
      en: The common factor is 2x. Divide 4x² and 14x by it.
  - rung: 5
    name: full_step
    text:
      en: The complete factorisation is $2x(2x - 7)$.
  misconception_ids:
  - mc.mth.o.expand_sign_slip
  - mc.mth.o.factor_one_term_only
  - mc.mth.o.factorise_not_fully
solution:
  steps:
  - n: 1
    latex: \text{HCF of } 4x^2 \text{ and } 14x = 2x
    reason: Largest number and letter in both terms
    check_id: chk_build_mth_alg_0032_hcf
  - n: 2
    latex: 4x^2 - 14x = 2x(2x - 7)
    reason: Divide each term by the HCF
    check_id: chk_build_mth_alg_0032_t
difficulty:
  prior: 0.0
  band: core
estimated_seconds: 60
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: false
context_tags:
- none
provenance:
  origin: original
  licence: LicenseRef-Own
