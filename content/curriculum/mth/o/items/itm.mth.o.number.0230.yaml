    latex: 3 + 4 + 5 = 12
    reason: Total number of parts
    check_id: chk_build_mth_num_0230_parts
  - n: 2
    latex: \$ 144 \div 12 = \$ 12
    reason: Value of one part
    check_id: chk_build_mth_num_0230_one
  - n: 3
    latex: 12 \times 3 = 36
    reason: Esi has 3 parts
    check_id: chk_build_mth_num_0230_ans
