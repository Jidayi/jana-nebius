stem: 'Esi, Nia and Kwame share $144 in the ratio 3 : 4 : 5, in that order.'
parts:
- id: a
  prompt: How much does Esi receive?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '12'
      correct: false
      misconception_id: mc.mth.o.ratio_one_part
      feedback: 'One part is only the start: multiply it by the number of parts in the share you want.'
    - id: B
      text: '48'
      correct: false
      misconception_id: mc.mth.o.ratio_divide_by_terms
      feedback: 'A ratio of 2 : 3 shares unequally, in 5 parts, not 2 equal halves.'
    - id: C
      text: '36'
      correct: true
    - id: D
      text: '60'
      correct: false
      misconception_id: mc.mth.o.ratio_wrong_share
      feedback: Match the order of the ratio to the order of the names.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: How many equal parts is the money split into?
  - rung: 2
    name: concept
    text:
      en: Add the numbers in the ratio to find the total number of parts; then find the value of one part.
  - rung: 3
    name: first_step
    text:
      en: There are 12 parts altogether.
  - rung: 4
    name: worked_step
    text:
      en: One part is $144 ÷ 12 = $12. Esi gets 3 parts.
  - rung: 5
    name: full_step
    text:
      en: Esi receives $36.
  misconception_ids:
