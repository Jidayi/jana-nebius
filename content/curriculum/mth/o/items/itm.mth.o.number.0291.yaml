type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.number.reverse_percentage
stem: In a sale every price is reduced by 40%. A coat now costs $120.
parts:
- id: a
  prompt: Find the price of the coat before the change.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '168'
      correct: false
      misconception_id: mc.mth.o.reverse_percent_of_new
      feedback: A 20% rise on 100 gives 120, but 20% off 120 gives 96, not 100. Divide by the multiplier instead.
    - id: B
      text: '72'
      correct: false
      misconception_id: mc.mth.o.reverse_multiplied
      feedback: The original was multiplied to get the new amount, so divide to go back.
    - id: C
      text: '160'
      correct: false
      misconception_id: mc.mth.o.percent_added_as_number
      feedback: 15% of 240 is 36, not 15. Find the percentage of the amount first.
    - id: D
      text: '200'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The new amount is the original times a multiplier.
  - rung: 2
    name: concept
    text:
      en: To go back, divide by the multiplier; do not take the percentage of the new amount.
  - rung: 3
    name: first_step
    text:
      en: The multiplier is 1 - 40/100 = 0.6.
  - rung: 4
    name: worked_step
    text:
      en: Divide 120 by 0.6.
  - rung: 5
    name: full_step
    text:
      en: The original was $200.
  misconception_ids:
  - mc.mth.o.percent_added_as_number
  - mc.mth.o.reverse_multiplied
  - mc.mth.o.reverse_percent_of_new
solution:
  steps:
  - n: 1
    latex: \text{multiplier} = 1 - \frac{40}{100} = 0.6
    reason: The original was multiplied by this
    check_id: chk_build_mth_num_0291_m
  - n: 2
    latex: 120 \div 0.6 = 200
    reason: Divide to undo the change
    check_id: chk_build_mth_num_0291_ans
