id: itm.mth.o.statistics.0081
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.statistics.grouped_mean
stem: 'The times, t minutes, that students took to finish a task are grouped: 10 ≤ t < 15: 10; 15 ≤ t < 20: 11; 20 ≤ t < 25: 11; 25 ≤ t < 30: 13.'
parts:
- id: a
  prompt: Estimate the mean time.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 23 minutes
      correct: false
      misconception_id: mc.mth.o.grouped_upper_bound
      feedback: 'The midpoint is the best single value for a class: add the ends and halve.'
    - id: B
      text: 20.5 minutes
      correct: true
    - id: C
      text: 230.625 minutes
      correct: false
      misconception_id: mc.mth.o.frequency_mean_rows
      feedback: 'The mean shares the total among all the items: divide by Σf.'
    - id: D
      text: 18 minutes
      correct: false
      misconception_id: mc.mth.o.class_width_wrong
      feedback: Class width = upper boundary − lower boundary.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: You do not know the exact times, so use one value for each class.
  - rung: 2
    name: concept
    text:
      en: Use the midpoint of each class, multiply by its frequency, add, and divide by the total frequency.
  - rung: 3
    name: first_step
    text:
      en: The first class has midpoint (10 + 15) ÷ 2.
  - rung: 4
    name: worked_step
    text:
      en: Σfx = 922.5 and Σf = 45.
  - rung: 5
    name: full_step
    text:
      en: The estimated mean is 20.5 minutes.
  misconception_ids:
  - mc.mth.o.class_width_wrong
  - mc.mth.o.frequency_mean_rows
  - mc.mth.o.grouped_upper_bound
solution:
  steps:
  - n: 1
    latex: '\text{midpoints: } 12.5, 17.5, 22.5, 27.5'
    reason: Middle of each class
    check_id: chk_build_mth_sta_0081_mids
  - n: 2
    latex: \Sigma fx = 922.5,\ \Sigma f = 45
    reason: Midpoint times frequency, added
    check_id: chk_build_mth_sta_0081_t
  - n: 3
    latex: \text{mean} \approx \frac{922.5}{45} = 20.5
    reason: Divide by the total frequency
    check_id: chk_build_mth_sta_0081_sc
