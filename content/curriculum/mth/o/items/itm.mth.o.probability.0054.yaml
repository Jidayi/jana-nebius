stem: A bag holds 5 red and 8 blue counters. Two counters are taken out, one after the other, without replacement.
parts:
- id: a
  prompt: Find the probability that one is red and one is blue. Give your answer to 3 significant figures.
  marks: 3
  answer:
    kind: numeric
    value: '0.513'
    unit: null
    unit_policy: none
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_prb_0054_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Draw a tree diagram: the second set of branches depends on the first pick.'
  - rung: 2
    name: concept
    text:
      en: Without replacement, the second probability has one fewer counter in the total.
  - rung: 3
    name: first_step
    text:
      en: 'There are two orders: red then blue, and blue then red. Each second pick is out of one fewer counter.'
  - rung: 4
    name: worked_step
    text:
      en: Multiply along each path, then add the paths you need.
  - rung: 5
    name: full_step
    text:
      en: The probability is 0.513.
  misconception_ids:
  - mc.mth.o.without_replacement_ignored
  - mc.mth.o.and_as_add
  - mc.mth.o.denominator_not_reduced
solution:
  steps:
  - n: 1
    latex: \text{total} = 13,\ \text{then } 12 \text{ after one is taken}
    reason: Count the counters before and after the first pick
    check_id: chk_build_mth_prb_0054_tot
  - n: 2
    latex: \frac{5}{13} \times \frac{8}{13 - 1} + \frac{8}{13} \times \frac{5}{13 - 1}
    reason: Red then blue, or blue then red
    check_id: chk_build_mth_prb_0054_t
  - n: 3
    latex: = 0.513
    reason: Add
    check_id: chk_build_mth_prb_0054_ans
