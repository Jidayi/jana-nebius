id: itm.mth.o.algebra_and_graphs.0007
version: 0.1.0
type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.algebra_and_graphs.substitution
stem: The kinetic energy of a moving object is given by $E = \tfrac{1}{2}mv^2$. An object has mass m = 4 kg and speed v = 11 m/s.
parts:
- id: a
  prompt: Find E in joules.
  marks: 2
  answer:
    kind: numeric
    value: '242'
    unit: J
    unit_policy: equivalent
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_alg_0007_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Write the formula, then put each value in place of its letter.
  - rung: 2
    name: concept
    text:
      en: 'Only v is squared: the half and m are not.'
  - rung: 3
    name: first_step
    text:
      en: Work out 11² first.
  - rung: 4
    name: worked_step
    text:
      en: 11² = 121. Now multiply by 4 and halve.
  - rung: 5
    name: full_step
    text:
      en: E = ½ × 4 × 121 = 242 J.
  misconception_ids:
  - mc.mth.o.multiply_before_power
  - mc.mth.o.formula_half_dropped
  - mc.mth.o.power_dropped
solution:
  steps:
  - n: 1
    latex: E = \tfrac{1}{2}mv^2
    reason: The formula
  - n: 2
    latex: E = \tfrac{1}{2} \times 4 \times 11^2
    reason: Substitute
  - n: 3
    latex: E = \tfrac{1}{2} \times 4 \times 121
    reason: Square v first
    check_id: chk_build_mth_alg_0007_sq
  - n: 4
    latex: E = 242\ \text{J}
    reason: Multiply
    check_id: chk_build_mth_alg_0007_ans
