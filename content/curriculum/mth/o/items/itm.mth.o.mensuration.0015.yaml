id: itm.mth.o.mensuration.0015
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.mensuration.metric_units
stem: A box has a volume of 0.08 m³.
parts:
- id: a
  prompt: Write this volume in cm³.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 8 cm³
      correct: false
      misconception_id: mc.mth.o.volume_units_linear
      feedback: 'A cube of side 1 m is 100 cm long, wide and high: 1000000 cubic centimetres.'
    - id: B
      text: 800 cm³
      correct: false
      misconception_id: mc.mth.o.area_units_linear
      feedback: A square of side 1 m is 100 cm by 100 cm, so it holds 10000 square centimetres.
    - id: C
      text: 0.00000008 cm³
      correct: false
      misconception_id: mc.mth.o.unit_conversion_direction
      feedback: 'Smaller units mean more of them: going to a smaller unit, the number gets bigger.'
    - id: D
      text: 80000 cm³
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'A volume unit is a cube: think of a cubic metre.'
  - rung: 2
    name: concept
    text:
      en: A cubic metre is 100 cm long, wide and high.
  - rung: 3
    name: first_step
    text:
      en: So one cubic metre is 100 × 100 × 100 cubic centimetres.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 0.08 by 100 three times.
  - rung: 5
    name: full_step
    text:
      en: 0.08 m³ = 80000 cm³.
  misconception_ids:
  - mc.mth.o.area_units_linear
  - mc.mth.o.unit_conversion_direction
  - mc.mth.o.volume_units_linear
solution:
  steps:
  - n: 1
    latex: 1\ \text{m}^3 = 100 \times 100 \times 100\ \text{cm}^3 = 1000000\ \text{cm}^3
    reason: Each metre is 100 cm, in three directions
    check_id: chk_build_mth_mns_0015_f
  - n: 2
    latex: 0.08 \times 1000000 = 80000
    reason: Multiply
    check_id: chk_build_mth_mns_0015_ans
