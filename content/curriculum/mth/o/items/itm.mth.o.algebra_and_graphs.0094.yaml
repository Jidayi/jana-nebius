solution:
  steps:
  - n: 1
    latex: x^m \times x^k = x^{m + k}
    reason: 'Multiplying powers of the same base: add the indices'
  - n: 2
    latex: x^{6} \times x^{8} = x^{14}
    reason: Add
    check_id: chk_build_mth_alg_0094_s
  - n: 3
    latex: n = 14 - 4 = 10
    reason: 'Dividing: subtract the indices'
    check_id: chk_build_mth_alg_0094_ans
