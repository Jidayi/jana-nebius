      value: 1.0e-06
    check_id: chk_build_mth_alg_0094_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: All the powers have the same base, x.
  - rung: 2
    name: concept
    text:
      en: Multiplying powers of the same base adds the indices; dividing subtracts them.
  - rung: 3
    name: first_step
    text:
      en: First combine x^6 × x^8.
  - rung: 4
    name: worked_step
    text:
      en: x^6 × x^8 = x^14. Now divide by x^4.
  - rung: 5
    name: full_step
    text:
      en: n = 14 − 4 = 10.
  misconception_ids:
