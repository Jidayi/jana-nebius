      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_sta_0055_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Each value appears several times; the frequency says how many.
  - rung: 2
    name: concept
    text:
      en: 'Mean = Σfx ÷ Σf: the total of all the goals divided by the number of matches.'
  - rung: 3
    name: first_step
    text:
      en: Multiply each number of goals by its frequency, then add.
  - rung: 4
    name: worked_step
    text:
      en: Σfx = 92 and Σf = 32.
  - rung: 5
    name: full_step
    text:
      en: The mean is 2.875.
