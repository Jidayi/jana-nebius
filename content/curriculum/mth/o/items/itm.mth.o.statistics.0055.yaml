stem: 'A frequency table shows the goals scored in a season: 0 goals: 5 matches, 2 goals: 11 matches, 3 goals: 2 matches, 4 goals: 10 matches, 6 goals: 4 matches.'
parts:
- id: a
  prompt: Find the mean number of goals per match.
  marks: 3
  answer:
    kind: numeric
    value: '2.875'
    unit: null
    unit_policy: none
