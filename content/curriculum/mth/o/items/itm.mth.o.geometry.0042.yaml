stem: 'A plan is drawn to a scale of 1 : 50000. A straight road is 1.5 km long.'
parts:
- id: a
  prompt: How long is the road on the plan, in centimetres?
  marks: 2
  answer:
    kind: numeric
    value: '3'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_geo_0042_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The plan is much smaller than real life, so the answer is a small number of centimetres.
  - rung: 2
    name: concept
    text:
      en: Change the real length to centimetres, then divide by the scale.
  - rung: 3
    name: first_step
    text:
      en: 1.5 km = 1.5 × 1000 × 100 cm.
  - rung: 4
    name: worked_step
    text:
      en: That is 150000 cm. Divide by 50000.
  - rung: 5
    name: full_step
    text:
      en: On the plan the road is 3 cm.
  misconception_ids:
  - mc.mth.o.scale_wrong_direction
  - mc.mth.o.scale_units_not_converted
  - mc.mth.o.scale_conversion_factor
solution:
  steps:
  - n: 1
    latex: 1.5\ \text{km} = 150000\ \text{cm}
    reason: Change kilometres to centimetres
    check_id: chk_build_mth_geo_0042_cm
  - n: 2
    latex: 150000 \div 50000 = 3\ \text{cm}
    reason: Divide by the scale
    check_id: chk_build_mth_geo_0042_ans
