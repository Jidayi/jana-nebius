stem: Solve the simultaneous equations $3x + 3y = -9$ and $2x - 3y = -1$.
parts:
- id: a
  prompt: Find the value of y.
  marks: 3
  answer:
    kind: numeric
    value: '-1'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_alg_0131_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Look at the y terms: they have the same size of coefficient.'
  - rung: 2
    name: concept
    text:
      en: The y terms have opposite signs, so add the equations to eliminate y.
  - rung: 3
    name: first_step
    text:
      en: Add the left sides and add the right sides.
  - rung: 4
    name: worked_step
    text:
      en: You get 5x = -10, so x = -2. Substitute this into the first equation.
  - rung: 5
    name: full_step
    text:
      en: y = -1.
  misconception_ids:
