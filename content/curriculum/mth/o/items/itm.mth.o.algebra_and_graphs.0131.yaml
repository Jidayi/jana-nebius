  - n: 1
    latex: 3x + 3y = -9,\quad 2x - 3y = -1
    reason: The two equations
  - n: 2
    latex: 5x = -10
    reason: Add the equations to eliminate y
    check_id: chk_build_mth_alg_0131_e
  - n: 3
