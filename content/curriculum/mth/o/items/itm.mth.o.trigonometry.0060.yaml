id: itm.mth.o.trigonometry.0060
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.trigonometry.elevation_depression
stem: A student stands 30 m from the foot of a tree on level ground. Her eyes are 1.7 m above the ground, and the angle of elevation of the top of the tree from her eyes is 32°.
parts:
- id: a
  prompt: Find the height of the tree, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 20.4 m
      correct: true
    - id: B
      text: 18.7 m
      correct: false
      misconception_id: mc.mth.o.eye_height_ignored
      feedback: Draw the right-angled triangle from the eye; then add the height of the eye above the ground.
    - id: C
      text: 17.6 m
      correct: false
      misconception_id: mc.mth.o.trig_ratio_wrong
      feedback: 'Label the sides from the angle you are using: opposite faces it, adjacent is next to it, hypotenuse is opposite the right angle.'
    - id: D
      text: 49.7 m
      correct: false
      misconception_id: mc.mth.o.depression_from_vertical
      feedback: Angles of elevation and depression are always measured from the horizontal line.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Draw a horizontal line from her eyes to the tree: it makes a right-angled triangle.'
  - rung: 2
    name: concept
    text:
      en: The horizontal distance 30 m is adjacent to the angle; the part of the tree above eye level is opposite.
  - rung: 3
    name: first_step
    text:
      en: 'Use tan: height above eye level = 30 × tan 32°.'
  - rung: 4
    name: worked_step
    text:
      en: That gives 18.75 m. Do not forget the 1.7 m below eye level.
  - rung: 5
    name: full_step
    text:
      en: The tree is 20.4 m tall.
  misconception_ids:
  - mc.mth.o.depression_from_vertical
  - mc.mth.o.eye_height_ignored
  - mc.mth.o.trig_ratio_wrong
solution:
  steps:
  - n: 1
    latex: \text{height above eye level} = 30 \tan 32 = 18.75
    reason: Opposite = adjacent × tan
    check_id: chk_build_mth_trg_0060_o
  - n: 2
    latex: 18.75 + 1.7 = 20.4\ \text{m}
    reason: Add the eye height
    check_id: chk_build_mth_trg_0060_ans
