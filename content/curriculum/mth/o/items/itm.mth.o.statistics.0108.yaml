stem: A line of best fit on a scatter diagram of mark (y) against hours of revision (x) passes through (20, 35) and (50, 80).
parts:
- id: a
  prompt: Use the line to estimate the mark for 45 hours of revision.
  marks: 2
  answer:
    kind: numeric
    value: '72.5'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_sta_0108_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The line of best fit models the relationship; read the estimate from it.
  - rung: 2
    name: concept
    text:
      en: Find the gradient from the two points, then go along the line to the given x.
  - rung: 3
    name: first_step
    text:
      en: Gradient = (80 − 35) ÷ (50 − 20).
  - rung: 4
    name: worked_step
    text:
      en: The gradient is 1.5; the x-value is 45 − 20 beyond the first point.
  - rung: 5
    name: full_step
    text:
      en: The estimated mark is 72.5.
  misconception_ids:
  - mc.mth.o.best_fit_read_wrong_axis
  - mc.mth.o.gradient_inverted
  - mc.mth.o.coordinates_swapped
solution:
  steps:
  - n: 1
    latex: m = \frac{80 - 35}{50 - 20} = 1.5
    reason: Gradient of the line
    check_id: chk_build_mth_sta_0108_m
  - n: 2
    latex: y = 35 + 1.5 \times (45 - 20) = 72.5
    reason: Move along the line from the first point
    check_id: chk_build_mth_sta_0108_ans
