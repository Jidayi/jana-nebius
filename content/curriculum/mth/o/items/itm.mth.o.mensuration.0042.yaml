stem: A circle has diameter 18 cm.
parts:
- id: a
  prompt: Find its circumference, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 113 cm
      correct: false
      misconception_id: mc.mth.o.diameter_for_radius
      feedback: The radius is half the diameter. Halve the diameter before using πr².
    - id: B
      text: 254 cm
      correct: false
      misconception_id: mc.mth.o.circumference_area_confused
      feedback: 'Area is in square units, so its formula has r²: A = πr². The circumference is a length: C = 2πr.'
    - id: C
      text: 56.5 cm
      correct: true
    - id: D
      text: 28.3 cm
      correct: false
      misconception_id: mc.mth.o.radius_not_squared
      feedback: 'Area needs two lengths multiplied: π × r × r.'
