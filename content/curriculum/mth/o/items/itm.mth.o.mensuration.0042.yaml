  hints:
  - rung: 1
    name: orient
    text:
      en: The circumference is the distance round the circle.
  - rung: 2
    name: concept
    text:
      en: Circumference = π × diameter = 2 × π × radius.
  - rung: 3
    name: first_step
    text:
      en: The diameter is 18 cm.
  - rung: 4
    name: worked_step
    text:
      en: Work out π × 18.
  - rung: 5
    name: full_step
    text:
      en: The circumference is 56.5 cm.
  misconception_ids:
