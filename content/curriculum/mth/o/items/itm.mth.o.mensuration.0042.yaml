  - mc.mth.o.diameter_for_radius
  - mc.mth.o.radius_not_squared
solution:
  steps:
  - n: 1
    latex: C = \pi d = 2\pi r
    reason: Circumference of a circle
  - n: 2
    latex: C = \pi \times 18 = 56.5\ \text{cm}
    reason: Substitute and round
