type: numeric
subject: mth
level: o
kc_ids:
- kc.mth.o.statistics.cumulative_frequency
stem: 'The masses (kg) of 60 parcels are summarised in a cumulative frequency table: none under 20; up to 40: 8; up to 60: 17; up to 80: 25; up to 100: 42; up to 120: 60.'
parts:
- id: a
  prompt: Estimate the median mass, to 3 significant figures, by interpolating within the class.
  marks: 3
  answer:
    kind: numeric
    value: '85.9'
    unit: null
    unit_policy: none
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_sta_0122_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The median is the value halfway through the data.
  - rung: 2
    name: concept
    text:
      en: Find half the total frequency, then the class where the cumulative frequency passes it.
  - rung: 3
    name: first_step
    text:
      en: Half of 60 is 30.
  - rung: 4
    name: worked_step
    text:
      en: The median lies in the class 80 to 100; work out how far into it.
  - rung: 5
    name: full_step
    text:
      en: The median is about 85.9 kg.
  misconception_ids:
  - mc.mth.o.median_class_midpoint
  - mc.mth.o.median_position_as_value
  - mc.mth.o.iqr_as_quartile
solution:
  steps:
  - n: 1
    latex: \frac{60}{2} = 30
    reason: Position of the median
    check_id: chk_build_mth_sta_0122_h
  - n: 2
    latex: \text{class frequency} = 42 - 25 = 17
    reason: Parcels in the median class
    check_id: chk_build_mth_sta_0122_f
  - n: 3
    latex: \text{median} \approx 80 + \frac{30 - 25}{17} \times 20 = 85.9
    reason: Interpolate in the median class
    check_id: chk_build_mth_sta_0122_ans
