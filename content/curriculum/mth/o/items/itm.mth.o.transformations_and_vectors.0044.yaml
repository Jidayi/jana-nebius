stem: $\mathbf{a} = \begin{pmatrix} 3 \\ -1 \end{pmatrix}$ and $\mathbf{b} = \begin{pmatrix} -5 \\ 5 \end{pmatrix}$.
parts:
- id: a
  prompt: Find the top (x) component of $3\mathbf{a} - 2\mathbf{b}$.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '19'
      correct: true
    - id: B
      text: '-1'
      correct: false
      misconception_id: mc.mth.o.vector_subtract_sign
      feedback: 'Subtract component by component, keeping each sign in a bracket: 4 − (−3) = 7.'
    - id: C
      text: '14'
      correct: false
      misconception_id: mc.mth.o.vector_scalar_dropped
      feedback: 3b means every component of b is multiplied by 3.
