  - rung: 2
    name: concept
    text:
      en: Multiply every component of a by 3 and of b by 2, then subtract.
  - rung: 3
    name: first_step
    text:
      en: 'In the top row: 3 × (3) and 2 × (-5).'
  - rung: 4
    name: worked_step
    text:
      en: Those are 9 and -10. Subtract, keeping the signs.
  - rung: 5
    name: full_step
    text:
