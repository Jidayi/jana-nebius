id: itm.mth.o.mensuration.0013
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.mensuration.metric_units
stem: A floor tile has an area of 1.75 m².
parts:
- id: a
  prompt: Write this area in cm².
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 175 cm²
      correct: false
      misconception_id: mc.mth.o.area_units_linear
      feedback: A square of side 1 m is 100 cm by 100 cm, so it holds 10000 square centimetres.
    - id: B
      text: 17500 cm²
      correct: true
    - id: C
      text: 0.000175 cm²
      correct: false
      misconception_id: mc.mth.o.unit_conversion_direction
      feedback: 'Smaller units mean more of them: going to a smaller unit, the number gets bigger.'
    - id: D
      text: 1750000 cm²
      correct: false
      misconception_id: mc.mth.o.volume_units_linear
      feedback: 'A cube of side 1 m is 100 cm long, wide and high: 1000000 cubic centimetres.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'An area unit is a square: think of a square metre.'
  - rung: 2
    name: concept
    text:
      en: A square metre is 100 cm by 100 cm.
  - rung: 3
    name: first_step
    text:
      en: So one square metre is 100 × 100 square centimetres.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 1.75 by 100 × 100.
  - rung: 5
    name: full_step
    text:
      en: 1.75 m² = 17500 cm².
  misconception_ids:
  - mc.mth.o.area_units_linear
  - mc.mth.o.unit_conversion_direction
  - mc.mth.o.volume_units_linear
solution:
  steps:
  - n: 1
    latex: 1\ \text{m}^2 = 100 \times 100\ \text{cm}^2 = 10000\ \text{cm}^2
    reason: Each metre is 100 cm, in both directions
    check_id: chk_build_mth_mns_0013_f
  - n: 2
    latex: 1.75 \times 10000 = 17500
    reason: Multiply
    check_id: chk_build_mth_mns_0013_ans
