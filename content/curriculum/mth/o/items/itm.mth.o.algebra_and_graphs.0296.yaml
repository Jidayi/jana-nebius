stem: The graph of $y = x^2 - 2x + 3$ is a parabola.
parts:
- id: a
  prompt: Find the x-coordinate of its turning point.
  marks: 2
  answer:
    kind: numeric
    value: '1'
    unit: null
    unit_policy: none
    tolerance:
      mode: absolute
      value: 1.0e-06
    check_id: chk_build_mth_alg_0296_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The turning point of a parabola lies on its line of symmetry.
  - rung: 2
    name: concept
    text:
      en: Completing the square, x² + bx + c = (x + b/2)² + …, puts the turning point at x = −b/2.
  - rung: 3
    name: first_step
    text:
      en: Here b = −2.
  - rung: 4
    name: worked_step
    text:
      en: x = −(−2) ÷ 2.
  - rung: 5
    name: full_step
    text:
      en: x = 1.
  misconception_ids:
  - mc.mth.o.turning_point_sign
  - mc.mth.o.turning_value_as_intercept
  - mc.mth.o.formula_partial_division
solution:
  steps:
  - n: 1
    latex: x^2 - 2x + 3 = (x - 1)^2 + 2
    reason: Complete the square
    check_id: chk_build_mth_alg_0296_cs
  - n: 2
    latex: x = 1
    reason: The bracket is zero at the turning point
    check_id: chk_build_mth_alg_0296_ans
