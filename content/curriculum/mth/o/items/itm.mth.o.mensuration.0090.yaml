id: itm.mth.o.mensuration.0090
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.mensuration.pyramid_cone_sphere
stem: A cone has base radius 6 cm and vertical height 8 cm.
parts:
- id: a
  prompt: Find its volume, to 3 significant figures.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 905 cm³
      correct: false
      misconception_id: mc.mth.o.cone_third_dropped
      feedback: A cone fills one third of the cylinder with the same base and height.
    - id: B
      text: 1210 cm³
      correct: false
      misconception_id: mc.mth.o.diameter_for_radius
      feedback: The radius is half the diameter. Halve the diameter before using πr².
    - id: C
      text: 302 cm³
      correct: true
    - id: D
      text: 50.3 cm³
      correct: false
      misconception_id: mc.mth.o.radius_not_squared
      feedback: 'Area needs two lengths multiplied: π × r × r.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A cone is like a pyramid with a circular base.
  - rung: 2
    name: concept
    text:
      en: Volume of a cone = ⅓ × π × r² × h.
  - rung: 3
    name: first_step
    text:
      en: Work out π × 6² × 8 first.
  - rung: 4
    name: worked_step
    text:
      en: Then divide by 3.
  - rung: 5
    name: full_step
    text:
      en: The volume is 302 cm³.
  misconception_ids:
  - mc.mth.o.cone_third_dropped
  - mc.mth.o.diameter_for_radius
  - mc.mth.o.radius_not_squared
solution:
  steps:
  - n: 1
    latex: V = \tfrac{1}{3}\pi r^2 h
    reason: Volume of a cone
  - n: 2
    latex: V = \tfrac{1}{3} \times \pi \times 6^2 \times 8 = 302\ \text{cm}^3
    reason: Substitute and round
    check_id: chk_build_mth_mns_0090_ans
