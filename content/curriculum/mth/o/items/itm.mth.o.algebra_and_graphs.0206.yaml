stem: A sequence begins 7, 4, 1, -2, … One of its terms is -92.
parts:
- id: a
  prompt: Which term number is equal to -92?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '30.7'
      correct: false
      misconception_id: mc.mth.o.nth_term_no_constant
      feedback: dn gives the multiples of d. Compare them with the sequence and find what must be added or taken away.
    - id: B
      text: '33'
      correct: false
      misconception_id: mc.mth.o.nth_term_off_by_one
      feedback: 'Check with n = 1: your rule must give the first term itself.'
    - id: C
      text: '34'
      correct: true
    - id: D
      text: '-12.7'
      correct: false
      misconception_id: mc.mth.o.nth_term_first_as_coefficient
      feedback: 'The number in front of n is how much the sequence goes up each time: the common difference.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: First find the rule for the nth term.
  - rung: 2
    name: concept
    text:
      en: Then set the rule equal to the value and solve for n.
  - rung: 3
    name: first_step
    text:
      en: The common difference is -3.
  - rung: 4
    name: worked_step
    text:
      en: The nth term is -3n + 10. Solve -3n + 10 = -92.
  - rung: 5
    name: full_step
    text:
      en: n = 34.
  misconception_ids:
