stem: 'A two-way table shows how students travel to school. Boys: walk 15, bus 13, car ?, total 37. Girls: walk 14, bus 24, car 10, total 48.'
parts:
- id: a
  prompt: How many boys travel by car?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '20'
      correct: false
      misconception_id: mc.mth.o.table_row_column_confused
      feedback: Find a row or column where only one entry is missing, and use that line's own total.
    - id: B
      text: '65'
      correct: false
      misconception_id: mc.mth.o.table_total_ignored
      feedback: The total is the sum of the entries, so a missing entry is the total minus the others.
    - id: C
      text: '9'
      correct: true
    - id: D
      text: '22'
      correct: false
      misconception_id: mc.mth.o.table_entry_missed
      feedback: Subtract every known entry in the row from the row total, not just one of them.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Look only at the boys' row.
  - rung: 2
    name: concept
    text:
      en: The entries in a row add up to the row total.
  - rung: 3
    name: first_step
    text:
      en: 'Add the boys'' entries you know: 15 and 13.'
  - rung: 4
    name: worked_step
    text:
      en: They make 28. Subtract this from 37.
  - rung: 5
    name: full_step
    text:
      en: 9 boys travel by car.
  misconception_ids:
  - mc.mth.o.table_row_column_confused
  - mc.mth.o.table_total_ignored
  - mc.mth.o.table_entry_missed
solution:
  steps:
  - n: 1
    latex: 15 + 13 = 28
    reason: The boys you know about
    check_id: chk_build_mth_sta_0034_s
  - n: 2
    latex: 37 - 28 = 9
    reason: The rest of the boys' total
    check_id: chk_build_mth_sta_0034_ans
