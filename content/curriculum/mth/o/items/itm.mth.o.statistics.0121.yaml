- kc.mth.o.statistics.cumulative_frequency
stem: 'The masses (kg) of 63 parcels are summarised in a cumulative frequency table: none under 0; up to 20: 19; up to 40: 36; up to 60: 47; up to 80: 56; up to 100: 63.'
parts:
- id: a
  prompt: Estimate the median mass, to 3 significant figures, by interpolating within the class.
  marks: 3
  answer:
    kind: numeric
    value: '34.7'
    unit: null
    unit_policy: none
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_mth_sta_0121_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The median is the value halfway through the data.
  - rung: 2
    name: concept
    text:
      en: Find half the total frequency, then the class where the cumulative frequency passes it.
  - rung: 3
    name: first_step
    text:
      en: Half of 63 is 31.5.
  - rung: 4
    name: worked_step
    text:
      en: The median lies in the class 20 to 40; work out how far into it.
  - rung: 5
    name: full_step
    text:
      en: The median is about 34.7 kg.
  misconception_ids:
  - mc.mth.o.median_class_midpoint
  - mc.mth.o.median_position_as_value
  - mc.mth.o.iqr_as_quartile
solution:
  steps:
  - n: 1
    latex: \frac{63}{2} = 31.5
    reason: Position of the median
    check_id: chk_build_mth_sta_0121_h
  - n: 2
    latex: \text{class frequency} = 36 - 19 = 17
    reason: Parcels in the median class
    check_id: chk_build_mth_sta_0121_f
  - n: 3
    latex: \text{median} \approx 20 + \frac{31.5 - 19}{17} \times 20 = 34.7
    reason: Interpolate in the median class
    check_id: chk_build_mth_sta_0121_ans
