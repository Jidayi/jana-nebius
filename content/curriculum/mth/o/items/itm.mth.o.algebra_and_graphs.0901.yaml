stem: Multiply out the brackets in $(x - 4)(x + 2)$ and collect like terms.
parts:
- id: a
  prompt: Type the expression with no brackets left.
  marks: 2
  answer:
    kind: algebraic
    check_id: chk_build_mth_alg_0901_key
    expression: x^2 - 2x - 8
    variables:
    - x
    required_form: expanded
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Each bracket has two terms, so multiplying them out gives four products.
  - rung: 2
    name: concept
    text:
      en: Multiply the x in the first bracket by both terms of the second, then do the same with the number.
  - rung: 3
    name: first_step
    text:
      en: The x² term is x × x and the number term is −4 × 2.
  - rung: 4
    name: worked_step
    text:
      en: 'Two of the four products are x terms: add their coefficients to make one term.'
  - rung: 5
    name: full_step
    text:
      en: Collecting gives $x^2 - 2x - 8$.
solution:
  steps:
  - n: 1
    latex: (x - 4)(x + 2) = x^2 + 2x - 4x - 8
    reason: Every term of one bracket times every term of the other
    check_id: chk_build_mth_alg_0901_m
  - n: 2
    latex: = x^2 - 2x - 8
    reason: Collect the two x terms
