id: itm.mth.o.coordinate_geometry.0120
version: 0.1.0
type: mcq_diagnostic
subject: mth
level: o
kc_ids:
- kc.mth.o.coordinate_geometry.parallel_lines
stem: Line L has equation $y = -2x - 1$. Line N is parallel to L and passes through (-2, 9).
parts:
- id: a
  prompt: The equation of N is y = mx + c. Find c.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '5'
      correct: true
    - id: B
      text: '-1'
      correct: false
      misconception_id: mc.mth.o.parallel_same_intercept
      feedback: Parallel lines share the gradient, not the intercept. Find the new c from the new point.
    - id: C
      text: '10'
      correct: false
      misconception_id: mc.mth.o.parallel_perpendicular_confused
      feedback: 'Parallel: same gradient. Perpendicular: gradients multiply to −1.'
    - id: D
      text: '13'
      correct: false
      misconception_id: mc.mth.o.intercept_sign
      feedback: 'Solve 0 = mx + c carefully: mx = −c, so x = −c/m.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Parallel lines never meet, so they have the same steepness.
  - rung: 2
    name: concept
    text:
      en: N has gradient -2, the same as L, but a different intercept.
  - rung: 3
    name: first_step
    text:
      en: Substitute x = -2, y = 9 and m = -2 into y = mx + c.
  - rung: 4
    name: worked_step
    text:
      en: -2 × (-2) = 4.
  - rung: 5
    name: full_step
    text:
      en: c = 5.
  misconception_ids:
  - mc.mth.o.intercept_sign
  - mc.mth.o.parallel_perpendicular_confused
  - mc.mth.o.parallel_same_intercept
solution:
  steps:
  - n: 1
    latex: m = -2
    reason: Parallel lines have the same gradient
  - n: 2
    latex: 9 = -2 \times (-2) + c
    reason: Substitute the point
  - n: 3
    latex: -2 \times (-2) = 4
    reason: Multiply
    check_id: chk_build_mth_crd_0120_t
  - n: 4
    latex: c = 9 - 4 = 5
    reason: Solve for c
    check_id: chk_build_mth_crd_0120_ans
