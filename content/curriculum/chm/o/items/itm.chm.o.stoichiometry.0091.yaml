id: itm.chm.o.stoichiometry.0091
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.solution_concentration
stem: 2.00 g of sodium hydroxide, NaOH is dissolved to make 250 cm³ of solution.
parts:
- id: a
  prompt: Calculate the concentration of the solution in mol/dm³.
  marks: 2
  answer:
    kind: numeric
    value: '0.200'
    unit: mol/dm^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0091_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You need moles of solute and the volume in dm³.
  - rung: 2
    name: concept
    text:
      en: Convert the mass to moles (÷ Mr), then c = n ÷ V.
  - rung: 3
    name: first_step
    text:
      en: Moles = 2.00 ÷ 40 = 0.0500 mol.
  - rung: 4
    name: worked_step
    text:
      en: Volume = 250 ÷ 1000 dm³; now divide 0.0500 by it.
  - rung: 5
    name: full_step
    text:
      en: c = 0.200 mol/dm³.
  misconception_ids:
  - mc.chm.o.conc_mass_as_moles
  - mc.chm.o.conc_volume_not_converted
solution:
  steps:
  - n: 1
    latex: n = \frac{2.00}{40} = 0.0500\ \text{mol}
    reason: Mass to moles
    check_id: chk_build_chm_stoichiometry_0091_mr
  - n: 2
    latex: c = \frac{0.0500}{250 \div 1000} = 0.200\ \text{mol/dm}^3
    reason: Amount over volume in dm³
    check_id: chk_build_chm_stoichiometry_0091_chain
difficulty:
  prior: 0.2
  band: core
