id: itm.chm.o.metals.0038
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.metals.corrosion
stem: A steel ship's hull sits in sea water. Blocks of another metal are bolted to the hull to stop it rusting.
parts:
- id: a
  prompt: Which metal should the blocks be made of, and why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Silver, because it is too unreactive to be attacked by sea water.
      correct: false
      misconception_id: mc.chm.o.metals_sacrificial_less_reactive
      feedback: Sacrificial protection needs a metal MORE reactive than iron, such as zinc or magnesium. It corrodes first, losing electrons instead of the iron, so the iron is saved.
    - id: B
      text: Aluminium, because unlike iron it can never rust.
      correct: false
      misconception_id: mc.chm.o.metals_all_metals_rust
      feedback: Rust is hydrated iron(III) oxide, so only iron and steel rust. Other metals may corrode, but their corrosion is not called rusting.
    - id: C
      text: Magnesium, because it is more reactive than iron and corrodes first.
      correct: true
    - id: D
      text: Copper, because it is less reactive than iron and will not corrode.
      correct: false
      misconception_id: mc.chm.o.metals_sacrificial_less_reactive
      feedback: Sacrificial protection needs a metal MORE reactive than iron, such as zinc or magnesium. It corrodes first, losing electrons instead of the iron, so the iron is saved.
  hints:
  - rung: 1
    name: orient
    text:
      en: The blocks are meant to be eaten away, not to last for ever.
  - rung: 2
    name: concept
    text:
      en: In sacrificial protection a metal corrodes in place of the iron.
  - rung: 3
    name: first_step
    text:
      en: For that to happen the block metal must lose electrons more easily than iron.
  - rung: 4
    name: worked_step
    text:
      en: So choose a metal that sits above iron in the reactivity series.
  - rung: 5
    name: full_step
    text:
      en: Magnesium is above iron, so it corrodes first and the hull is protected; the blocks are replaced.
  misconception_ids:
  - mc.chm.o.metals_sacrificial_less_reactive
  - mc.chm.o.metals_all_metals_rust
solution:
  steps:
  - n: 1
    latex: \text{Mg above Fe}
    reason: Sacrificial metal is more reactive
