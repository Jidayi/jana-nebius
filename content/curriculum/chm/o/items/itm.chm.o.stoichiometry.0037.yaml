id: itm.chm.o.stoichiometry.0037
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.percentage_composition
stem: Calcium hydroxide, Ca(OH)₂ contains the element O.
parts:
- id: a
  prompt: What is the percentage by mass of O in Ca(OH)₂?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 231%
      correct: false
      misconception_id: mc.chm.o.percent_inverted
      feedback: A part is smaller than the whole, so the percentage of one element is always below 100.
    - id: B
      text: '0.432'
      correct: false
      misconception_id: mc.chm.o.percent_ar_over_mr_no_100
      feedback: 'A percentage is a fraction of 100: multiply the fraction by 100.'
    - id: C
      text: 21.6%
      correct: false
      misconception_id: mc.chm.o.percent_count_ignored
      feedback: 'The top of the fraction is the mass of all the atoms of that element in the formula: number of atoms × Ar.'
    - id: D
      text: 43.2%
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You need the share of the mass of Ca(OH)₂ that is O.
  - rung: 2
    name: concept
    text:
      en: Percentage by mass = (number of atoms × Ar of the element) ÷ Mr × 100.
  - rung: 3
    name: first_step
    text:
      en: Mr of Ca(OH)₂ is 74.
  - rung: 4
    name: worked_step
    text:
      en: The O atoms in Ca(OH)₂ have a total mass of 32; divide this by 74.
  - rung: 5
    name: full_step
    text:
      en: 32 ÷ 74 × 100 = 43.2%.
  misconception_ids:
  - mc.chm.o.percent_count_ignored
  - mc.chm.o.percent_inverted
  - mc.chm.o.percent_ar_over_mr_no_100
solution:
  steps:
  - n: 1
    latex: M_r = 74
    reason: Relative formula mass of Ca(OH)₂
    check_id: chk_build_chm_stoichiometry_0037_mr
