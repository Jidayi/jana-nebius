  - rung: 2
    name: concept
    text:
      en: '% nitrogen in potassium nitrate = mass of the nitrogen atoms ÷ Mr × 100.'
  - rung: 3
    name: first_step
    text:
      en: Mr of KNO₃ is 101.
  - rung: 4
    name: worked_step
    text:
      en: KNO₃ has one nitrogen atom, of total mass 14. Work out 14 ÷ 101 × 100.
  - rung: 5
    name: full_step
    text:
      en: 14 ÷ 101 × 100 = 13.9% nitrogen.
