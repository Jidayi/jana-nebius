id: itm.chm.o.stoichiometry.0110
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.yield_and_purity
stem: Magnesium is burned to make magnesium oxide. The equation is 2Mg + O₂ → 2MgO. 4.80 g of Mg gives 7.20 g of MgO.
parts:
- id: a
  prompt: What is the percentage yield?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 0.900%
      correct: false
      misconception_id: mc.chm.o.percent_ar_over_mr_no_100
    - id: B
      text: 150%
      correct: false
      misconception_id: mc.chm.o.yield_uses_reactant_mass
      feedback: The theoretical yield is the mass of product the equation predicts from the reactant, not the mass of the reactant itself.
    - id: C
      text: 90.0%
      correct: true
    - id: D
      text: 111%
      correct: false
      misconception_id: mc.chm.o.yield_inverted
      feedback: 'You never get more product than the equation allows, so the percentage yield is at most 100%: actual ÷ theoretical × 100.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Percentage yield compares what you got with what the equation says you could get.
  - rung: 2
    name: concept
    text:
      en: Percentage yield = actual mass ÷ theoretical mass × 100.
  - rung: 3
    name: first_step
    text:
      en: 'Theoretical yield: moles of Mg = 4.80 ÷ 24 = 0.200; moles of MgO = 0.200.'
  - rung: 4
    name: worked_step
    text:
      en: Theoretical mass of MgO = 0.200 × 40 = 8.00 g. Now compare 7.20 g with it.
  - rung: 5
    name: full_step
    text:
      en: 7.20 ÷ 8.00 × 100 = 90.0%.
  misconception_ids:
  - mc.chm.o.yield_inverted
  - mc.chm.o.yield_uses_reactant_mass
  - mc.chm.o.percent_ar_over_mr_no_100
solution:
  steps:
  - n: 1
    latex: n(\text{Mg}) = \frac{4.80}{24} = 0.200
    reason: Moles of reactant
    check_id: chk_build_chm_stoichiometry_0110_ma
  - n: 2
    latex: m(\text{MgO}) = 0.200 \times 40 = 8.00\ \text{g}
    reason: Theoretical yield
    check_id: chk_build_chm_stoichiometry_0110_mb
  - n: 3
    latex: \frac{7.20}{8.00} \times 100 = 90.0\%
    reason: Actual over theoretical
    check_id: chk_build_chm_stoichiometry_0110_chain
