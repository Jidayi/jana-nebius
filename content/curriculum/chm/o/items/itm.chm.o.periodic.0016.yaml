stem: A small piece of sodium is dropped into water containing universal indicator.
parts:
- id: a
  prompt: Which describes the products?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Sodium hydroxide solution and oxygen gas
      correct: false
      misconception_id: mc.chm.o.periodic_group1_water_gives_oxygen
      feedback: The metal takes the place of hydrogen in water, so hydrogen is released; a lighted splint gives a pop.
    - id: B
      text: An acidic solution and hydrogen gas
      correct: false
      misconception_id: mc.chm.o.periodic_group1_solution_acidic
      feedback: 'The hydroxide formed is an alkali: universal indicator turns blue or purple.'
    - id: C
      text: Sodium oxide and hydrogen gas
      correct: false
      misconception_id: mc.chm.o.periodic_group1_forms_oxide
      feedback: Group I metals with water give a hydroxide (which dissolves to make an alkaline solution) and hydrogen.
    - id: D
      text: Sodium hydroxide solution and hydrogen gas
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: What does sodium take from the water molecules?
  - rung: 2
    name: concept
    text:
      en: A Group I metal with water gives a metal hydroxide and a gas.
  - rung: 3
    name: first_step
    text:
      en: The hydroxide dissolves. Is a metal hydroxide solution acidic or alkaline?
  - rung: 4
    name: worked_step
    text:
      en: The gas comes from the hydrogen in water; a lighted splint would pop.
  - rung: 5
    name: full_step
    text:
      en: Sodium + water → sodium hydroxide + hydrogen; the indicator turns blue or purple.
  misconception_ids:
  - mc.chm.o.periodic_group1_water_gives_oxygen
  - mc.chm.o.periodic_group1_forms_oxide
  - mc.chm.o.periodic_group1_solution_acidic
