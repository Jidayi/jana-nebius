stem: Take the molar gas volume at room temperature and pressure as 24 dm³.
parts:
- id: a
  prompt: Calculate the amount, in moles, of CO₂ in 480 cm³ of the gas at room conditions.
  marks: 2
  answer:
    kind: numeric
    value: '0.0200'
    unit: mol
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0076_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The volume is in cm³ but the molar gas volume is in dm³.
  - rung: 2
    name: concept
    text:
      en: Convert cm³ to dm³ by dividing by 1000, then divide by 24 dm³/mol.
  - rung: 3
    name: first_step
    text:
      en: 480 cm³ ÷ 1000 gives the volume in dm³.
  - rung: 4
    name: worked_step
    text:
      en: Work out (480 ÷ 1000) ÷ 24.
  - rung: 5
    name: full_step
    text:
      en: (480 ÷ 1000) ÷ 24 = 0.0200 mol.
  misconception_ids:
  - mc.chm.o.gas_volume_divided
  - mc.chm.o.gas_cm3_dm3
solution:
  steps:
  - n: 1
    latex: V = \frac{480}{1000}\ \text{dm}^3
    reason: cm³ to dm³
  - n: 2
    latex: n = \frac{V}{24} = 0.0200\ \text{mol}
    reason: Divide by the molar gas volume
    check_id: chk_build_chm_stoichiometry_0076_chain
