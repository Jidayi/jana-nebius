      constants:
      - source: pack
        symbol: ar_al
      - source: pack
        symbol: ar_o
      equation: 2Al2O3 -> 4Al + 3O2
      sf: 3
      steps:
      - id: na
        mass: 20.4 g
        op: amount_from_mass
        species: Al2O3
      - amount: '@na'
        from: Al2O3
        id: nb
        op: mole_ratio
        to: Al
      - amount: '@nb'
        id: mb
        op: mass_from_amount
        species: Al
    tool: chem_stoichiometry
  chk_build_chm_metals_0060_coef:
    args:
      constants:
      - source: pack
        symbol: ar_al
      - source: pack
        symbol: ar_o
      equation: 2Al2O3 -> 4Al + 3O2
      sf: 3
      steps:
      - amount: '2'
        from: Al2O3
        id: ca
        op: mole_ratio
        to: Al2O3
      - amount: '2'
        from: Al2O3
        id: cb
        op: mole_ratio
        to: Al
    tool: chem_stoichiometry
  chk_build_chm_metals_0060_ma:
    args:
      constants:
