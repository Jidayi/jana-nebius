id: itm.chm.o.metals.0060
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.metals.extraction_yield
stem: Aluminium is made by the electrolysis of molten aluminium oxide. The equation is 2Al₂O₃ → 4Al + 3O₂.
parts:
- id: a
  prompt: What mass of aluminium can be obtained from 20.4 g of Al₂O₃?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 10.8 g
      correct: true
    - id: B
      text: 2.70 g
      correct: false
      misconception_id: mc.chm.o.metals_yield_ratio_inverted
      feedback: 'Write the ratio as ''wanted : given''. For Fe₂O₃ → 2Fe the wanted iron is two for every one of oxide, so moles of iron = moles of oxide × 2.'
    - id: C
      text: 5.40 g
      correct: false
      misconception_id: mc.chm.o.metals_yield_ratio_ignored
      feedback: 'Look at the equation: Fe₂O₃ gives 2Fe. Each mole of iron(III) oxide holds two moles of iron atoms, so multiply by the equation''s ratio before you turn moles back into grams.'
    - id: D
      text: 40.8 g
      correct: false
      misconception_id: mc.chm.o.metals_yield_mass_ratio
      feedback: The equation counts particles, not grams. Change the mass of ore into moles first, use the ratio, then change the moles of metal back into grams.
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Plan: mass of Al₂O₃ → moles → ratio from the equation → moles of Al → mass.'
  - rung: 2
    name: concept
    text:
      en: The numbers in the equation are a ratio of moles, never of grams.
  - rung: 3
    name: first_step
    text:
      en: Moles of Al₂O₃ = 20.4 ÷ 102 = 0.200 mol.
  - rung: 4
    name: worked_step
    text:
      en: 'The equation gives 2 Al₂O₃ : 4 Al, so moles of Al = 0.400 mol.'
  - rung: 5
    name: full_step
    text:
      en: Mass of Al = 0.400 × 27 = 10.8 g.
  misconception_ids:
  - mc.chm.o.metals_yield_ratio_ignored
  - mc.chm.o.metals_yield_mass_ratio
  - mc.chm.o.metals_yield_ratio_inverted
solution:
  steps:
  - n: 1
    latex: n(\text{Al}_2\text{O}_3) = \frac{20.4}{102} = 0.200\ \text{mol}
    reason: Mass to moles
    check_id: chk_build_chm_metals_0060_ma
  - n: 2
    latex: '\text{Al}_2\text{O}_3 : \text{Al} = 2 : 4'
    reason: Ratio from the equation
    check_id: chk_build_chm_metals_0060_coef
  - n: 3
    latex: n(\text{Al}) = 0.400\ \text{mol}
    reason: Mole ratio from the equation
    check_id: chk_build_chm_metals_0060_chain
  - n: 4
    latex: m(\text{Al}) = 0.400 \times 27 = 10.8\ \text{g}
    reason: Moles to mass
    check_id: chk_build_chm_metals_0060_mb
