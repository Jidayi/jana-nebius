stem: Forests are cut down and burned to clear land for farming.
parts:
- id: a
  prompt: Why does this add to climate change?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Trees give out methane when they are cut
      correct: false
    - id: B
      text: Burning releases carbon dioxide, and fewer trees remain to remove it by photosynthesis
      correct: true
    - id: C
      text: Burning wood makes a hole in the ozone layer
      correct: false
      misconception_id: mc.chm.o.environment_greenhouse_ozone_confused
      feedback: These are two different problems. The ozone layer stops harmful ultraviolet light; damage to it raises the risk of skin cancer. Global warming is caused by greenhouse gases trapping heat (infrared) given off by the Earth.
    - id: D
      text: Without trees, nitrogen in the air turns into a greenhouse gas
      correct: false
      misconception_id: mc.chm.o.environment_climate_wrong_gas
      feedback: The main greenhouse gases to know are carbon dioxide and methane. Nitrogen and oxygen are not greenhouse gases. Catalytic converters and desulfurisation fight other pollutants, not climate change.
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Think about two effects: the burning and the loss of trees.'
  - rung: 2
    name: concept
    text:
      en: Wood is a carbon compound, so it burns to give carbon dioxide.
  - rung: 3
    name: first_step
    text:
      en: Living trees take carbon dioxide from the air in photosynthesis.
  - rung: 4
    name: worked_step
    text:
      en: With fewer trees, what happens to the amount of carbon dioxide taken out of the air?
  - rung: 5
    name: full_step
    text:
      en: Burning adds carbon dioxide and the lost trees can no longer remove it by photosynthesis.
  misconception_ids:
  - mc.chm.o.environment_greenhouse_ozone_confused
  - mc.chm.o.environment_climate_wrong_gas
solution:
  steps:
  - n: 1
    latex: \text{CO}_2\text{ added; less removed by photosynthesis}
    reason: Deforestation
