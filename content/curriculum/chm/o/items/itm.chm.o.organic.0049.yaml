id: itm.chm.o.organic.0049
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.alkanes_and_alkenes
stem: Bromine water is shaken with propene in one tube and with propane in another tube, at room temperature.
parts:
- id: a
  prompt: What is seen?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 'Propene: colourless to orange. Propane: no change.'
      correct: false
      misconception_id: mc.chm.o.organic_bromine_colour_reversed
      feedback: 'Bromine water starts orange-brown. An alkene adds the bromine across its double bond, so the orange colour disappears: orange to colourless. No change means no C=C bond.'
    - id: B
      text: Both turn from orange to colourless
      correct: false
      misconception_id: mc.chm.o.organic_alkanes_decolourise_bromine
      feedback: 'Alkanes are saturated: they have no C=C bond for bromine to add to. An alkane leaves bromine water orange. Only an alkene removes the colour quickly, by addition.'
    - id: C
      text: 'Propene: orange to colourless. Propane: stays orange.'
      correct: true
    - id: D
      text: 'Propane: orange to colourless. Propene: stays orange.'
      correct: false
      misconception_id: mc.chm.o.organic_alkanes_decolourise_bromine
      feedback: 'Alkanes are saturated: they have no C=C bond for bromine to add to. An alkane leaves bromine water orange. Only an alkene removes the colour quickly, by addition.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Which of the two hydrocarbons has a C=C double bond?
  - rung: 2
    name: concept
    text:
      en: Bromine adds across a C=C double bond; a molecule with only single bonds has nowhere to add it.
  - rung: 3
    name: first_step
    text:
      en: Propene, C₃H₆, is an alkene. Propane, C₃H₈, is an alkane.
  - rung: 4
    name: worked_step
    text:
      en: Bromine water starts orange. Decide which tube loses its bromine to a reaction.
  - rung: 5
    name: full_step
    text:
      en: Propene decolourises the bromine water (orange to colourless); propane leaves it orange.
  misconception_ids:
  - mc.chm.o.organic_alkanes_decolourise_bromine
  - mc.chm.o.organic_bromine_colour_reversed
solution:
  steps:
  - n: 1
    latex: \text{C}_3\text{H}_6 + \text{Br}_2 \rightarrow \text{C}_3\text{H}_6\text{Br}_2
    reason: Addition across C=C
    check_id: chk_build_chm_organic_0049_bal
  - n: 2
    latex: '\text{propane: no C=C, no reaction}'
    reason: Saturated
