stem: On a reaction pathway diagram the reactants are at 100 kJ/mol, the top of the energy hump is at 260 kJ/mol and the products are at 30 kJ/mol.
parts:
- id: a
  prompt: What is the activation energy?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 260 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_ea_from_zero
      feedback: 'Activation energy is the climb from the reactants'' level to the top of the hump: peak − reactants.'
    - id: B
      text: 160 kJ/mol
      correct: true
    - id: C
      text: 70 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_dh_reactants_minus_products
