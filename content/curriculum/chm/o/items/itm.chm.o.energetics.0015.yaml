      text: 230 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_ea_from_products
      feedback: The reaction starts at the reactants, so the hump it must climb starts at the reactants' level.
  hints:
  - rung: 1
    name: orient
    text:
      en: The activation energy is a climb on the diagram. Where does the climb start?
  - rung: 2
    name: concept
    text:
      en: Activation energy = energy at the top of the hump − energy of the reactants.
  - rung: 3
    name: first_step
    text:
      en: The reactants are at 100 kJ/mol and the top is at 260 kJ/mol.
  - rung: 4
    name: worked_step
    text:
      en: Work out 260 − 100.
  - rung: 5
    name: full_step
    text:
      en: 260 − 100 = 160 kJ/mol.
