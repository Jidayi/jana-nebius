    text:
      en: Only the prefix matters here, not the ending.
  - rung: 2
    name: concept
    text:
      en: Meth- means one carbon, eth- two, prop- three, but- four.
  - rung: 3
    name: first_step
    text:
      en: Methanol starts with meth-, so it comes first.
  - rung: 4
    name: worked_step
    text:
      en: Ethene comes next; then compare prop- with but-.
  - rung: 5
    name: full_step
    text:
      en: Methanol (one), ethene (two), propane (three), butanoic acid (four).
