stem: A catalyst is added to a reaction.
parts:
- id: a
  prompt: Which quantity does the catalyst change?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: The temperature of the mixture
      correct: false
      misconception_id: mc.chm.o.reactions_catalyst_gives_energy
      feedback: 'Heating gives particles more energy, so more collisions reach the activation energy. A catalyst does not add energy: it gives a different route with a lower activation energy, so more collisions succeed at the same temperature.'
    - id: B
      text: The activation energy
      correct: true
    - id: C
      text: The energy change (ΔH) of the reaction
      correct: false
    - id: D
      text: The total amount of product
      correct: false
  hints:
