    name: orient
    text:
      en: A catalyst changes the route of the reaction.
  - rung: 2
    name: concept
    text:
      en: A new route has a different energy barrier.
  - rung: 3
    name: first_step
    text:
      en: The energies of the reactants and products are the same with or without the catalyst.
  - rung: 4
    name: worked_step
    text:
      en: So the energy change stays the same. What changes?
  - rung: 5
    name: full_step
    text:
      en: The catalyst lowers the activation energy; the energy change and the amount of product stay the same.
  misconception_ids:
