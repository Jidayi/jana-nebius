id: itm.chm.o.organic.0073
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.polymers
stem: Poly(ethene) is made from ethene, C₂H₄.
parts:
- id: a
  prompt: Which statement describes how poly(ethene) forms?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Ethene molecules join and give off a molecule of water at each link
      correct: false
      misconception_id: mc.chm.o.organic_addition_condensation_mixed
      feedback: In addition polymerisation, monomers with a C=C bond simply join and nothing else forms. In condensation polymerisation, groups on two monomers react as they join and a small molecule, such as water, is given off each time.
    - id: B
      text: Many ethene molecules join; each C=C opens to a single bond and nothing else forms
      correct: true
    - id: C
      text: Many ethane molecules lose hydrogen and join into a chain
      correct: false
      misconception_id: mc.chm.o.organic_monomer_is_alkane
      feedback: A monomer for addition polymerisation must have a C=C double bond. Alkanes are saturated and cannot add to one another. Poly(ethene) is made from ethene, not ethane.
    - id: D
      text: Many ethene molecules join and each keeps its C=C double bond
      correct: false
      misconception_id: mc.chm.o.organic_polymer_keeps_double_bond
      feedback: When an alkene polymerises, each C=C double bond opens into a single bond, and the freed bonds link to the next monomer. The polymer chain has only single C–C bonds.
  hints:
  - rung: 1
    name: orient
    text:
      en: Ethene has a C=C double bond. What can that bond do?
  - rung: 2
    name: concept
    text:
      en: In addition polymerisation, one bond of each C=C breaks so the molecules can link to their neighbours.
  - rung: 3
    name: first_step
    text:
      en: All the atoms of every ethene molecule end up in the chain.
  - rung: 4
    name: worked_step
    text:
      en: Think about whether any small molecule is left over, and about the bonds in the finished chain.
  - rung: 5
    name: full_step
    text:
      en: Each C=C opens, the molecules join into a long chain of single bonds, and no other product forms.
  misconception_ids:
  - mc.chm.o.organic_polymer_keeps_double_bond
  - mc.chm.o.organic_monomer_is_alkane
  - mc.chm.o.organic_addition_condensation_mixed
solution:
  steps:
  - n: 1
    latex: \text{n C}_2\text{H}_4\text{ }\rightarrow\text{ –(CH}_2\text{–CH}_2\text{)}_n\text{–}
    reason: Addition polymerisation
