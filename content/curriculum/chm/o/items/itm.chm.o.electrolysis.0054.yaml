stem: A current of 10.0 A flows through copper(II) sulfate solution for 965 s. One mole of electrons carries 96500 C.
parts:
- id: a
  prompt: Calculate the number of moles of electrons that pass.
  marks: 2
  answer:
    kind: numeric
    value: '0.100'
    unit: mol
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_electrolysis_0054_e
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: First find the charge, then turn it into moles of electrons.
  - rung: 2
    name: concept
    text:
      en: Q = I × t; moles of electrons = Q ÷ 96500.
  - rung: 3
    name: first_step
    text:
      en: Q = 10.0 × 965 = 9650 C.
  - rung: 4
    name: worked_step
    text:
      en: Divide 9650 by 96500.
  - rung: 5
    name: full_step
    text:
      en: Moles of electrons = 9650 ÷ 96500 = 0.100 mol.
  misconception_ids:
  - mc.chm.o.electrolysis_time_not_in_seconds
solution:
  steps:
  - n: 1
    latex: Q = 10.0 \times 965 = 9650\ \text{C}
    reason: Charge
    check_id: chk_build_chm_electrolysis_0054_m
  - n: 2
    latex: n(e^-) = \frac{9650}{96500} = 0.100\ \text{mol}
    reason: Divide by the Faraday constant
    check_id: chk_build_chm_electrolysis_0054_e
