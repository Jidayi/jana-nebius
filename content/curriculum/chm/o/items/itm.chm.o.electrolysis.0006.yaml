id: itm.chm.o.electrolysis.0006
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.electrolysis.molten_products
stem: A current passes through molten sodium chloride.
parts:
- id: a
  prompt: Which describes how the charge moves through the molten compound?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: H⁺ ions move to the cathode and Cl⁻ ions move to the anode.
      correct: false
      misconception_id: mc.chm.o.electrolysis_molten_gives_hydrogen
      feedback: A molten binary compound contains only its own two kinds of ion. There is no water, so there are no hydrogen or hydroxide ions. The metal forms at the cathode and the non-metal at the anode.
    - id: B
      text: Na⁺ ions move to the cathode and Cl⁻ ions move to the anode.
      correct: true
    - id: C
      text: Na⁺ ions move to the anode and Cl⁻ ions move to the cathode.
      correct: false
      misconception_id: mc.chm.o.electrolysis_metal_at_anode
      feedback: Opposite charges attract. Positive metal ions (cations) move to the negative electrode, the cathode, and become metal there. Negative non-metal ions (anions) move to the positive electrode, the anode.
    - id: D
      text: Electrons move through the melt from one electrode to the other.
      correct: false
      misconception_id: mc.chm.o.electrolysis_electrons_through_electrolyte
      feedback: Electrons flow only in the wires and electrodes. In the electrolyte the ions carry the charge, and ions can move only when the compound is molten or dissolved. That is why a solid ionic compound cannot be electrolysed.
  hints:
  - rung: 1
    name: orient
    text:
      en: The molten compound is the electrolyte. What particles are in it?
  - rung: 2
    name: concept
    text:
      en: Ions carry the charge in an electrolyte; electrons carry it in the wires.
  - rung: 3
    name: first_step
    text:
      en: Molten sodium chloride contains only Na⁺ and Cl⁻ ions.
  - rung: 4
    name: worked_step
    text:
      en: Each ion is attracted to the electrode of opposite charge.
  - rung: 5
    name: full_step
    text:
      en: Positive Na⁺ ions move to the negative cathode and negative Cl⁻ ions move to the positive anode.
  misconception_ids:
  - mc.chm.o.electrolysis_metal_at_anode
  - mc.chm.o.electrolysis_electrons_through_electrolyte
  - mc.chm.o.electrolysis_molten_gives_hydrogen
solution:
  steps:
  - n: 1
    latex: \text{Na}^{+} \rightarrow \text{cathode; Cl}^{-} \rightarrow \text{anode}
    reason: Opposite charges attract
