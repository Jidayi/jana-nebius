stem: A base that dissolves in water is called an alkali.
parts:
- id: a
  prompt: Which of these is an alkali?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Sodium hydroxide
      correct: true
    - id: B
      text: Iron(III) oxide
      correct: false
    - id: C
      text: Copper(II) hydroxide
      correct: false
    - id: D
      text: Copper(II) oxide
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: All four are bases. Which one dissolves in water?
  - rung: 2
    name: concept
    text:
      en: An alkali is a soluble base. Its solution contains hydroxide ions.
  - rung: 3
    name: first_step
    text:
      en: Most metal oxides and hydroxides do not dissolve in water. Those of Group I metals do.
  - rung: 4
    name: worked_step
    text:
      en: Sodium is a Group I metal.
  - rung: 5
    name: full_step
    text:
      en: Sodium hydroxide dissolves in water to give OH⁻ ions, so it is an alkali; the others are insoluble bases.
