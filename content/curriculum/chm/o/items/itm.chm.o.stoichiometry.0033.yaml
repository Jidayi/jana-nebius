      value: 0.005
    check_id: chk_build_chm_stoichiometry_0033_mr
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Mr is the sum of the relative atomic masses of all the atoms in HNO₃.
  - rung: 2
    name: concept
    text:
      en: Multiply each element's relative atomic mass by the number of its atoms, then add.
  - rung: 3
    name: first_step
    text:
      en: Count the atoms of each element in HNO₃.
  - rung: 4
    name: worked_step
    text:
      en: 'In HNO₃: one H atom gives 1, one N atom gives 14 and three O atoms give 48.'
  - rung: 5
    name: full_step
    text:
      en: Mr of HNO₃ = 63.
  misconception_ids:
