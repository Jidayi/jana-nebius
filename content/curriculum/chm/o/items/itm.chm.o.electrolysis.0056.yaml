stem: 'A spoon is silver-plated in silver nitrate solution: Ag⁺ + e⁻ → Ag. The current is 0.50 A. One mole of electrons carries 96500 C.'
parts:
- id: a
  prompt: How long, in seconds, does it take to deposit 1.08 g of silver?
  marks: 3
  answer:
    kind: numeric
    value: '1930'
    unit: s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_electrolysis_0056_t
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Work backwards: mass → moles of silver → moles of electrons → charge → time.'
  - rung: 2
    name: concept
    text:
      en: Moles = mass ÷ Ar; Q = moles of electrons × 96500; t = Q ÷ I.
  - rung: 3
    name: first_step
    text:
      en: Moles of silver = 1.08 ÷ 108 = 0.0100 mol, and one electron is needed per silver ion.
  - rung: 4
    name: worked_step
    text:
      en: Q = 0.0100 × 96500 = 965 C. Now divide by the current, 0.50 A.
  - rung: 5
    name: full_step
    text:
      en: t = 965 ÷ 0.50 = 1930 s.
  misconception_ids:
  - mc.chm.o.electrolysis_time_not_in_seconds
solution:
