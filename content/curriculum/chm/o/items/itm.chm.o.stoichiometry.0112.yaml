- kc.chm.o.stoichiometry.reacting_masses
stem: Iron(III) oxide is reduced to iron. The equation is Fe₂O₃ + 3CO → 2Fe + 3CO₂. 32.0 g of Fe₂O₃ gives 19.6 g of Fe.
parts:
- id: a
  prompt: Calculate the percentage yield.
  marks: 3
  answer:
    kind: numeric
    value: '87.5'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0112_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Work out the mass you should get, then compare the mass you did get.
  - rung: 2
    name: concept
    text:
      en: Percentage yield = actual ÷ theoretical × 100; the theoretical mass comes from the equation.
  - rung: 3
    name: first_step
    text:
      en: Moles of Fe₂O₃ = 32.0 ÷ 160 = 0.200 mol, so moles of Fe = 0.400 mol.
  - rung: 4
    name: worked_step
    text:
      en: Theoretical mass = 0.400 × 56 = 22.4 g.
  - rung: 5
    name: full_step
    text:
      en: Percentage yield = 19.6 ÷ 22.4 × 100 = 87.5%.
  misconception_ids:
  - mc.chm.o.yield_inverted
  - mc.chm.o.yield_uses_reactant_mass
solution:
  steps:
  - n: 1
    latex: n(\text{Fe}_2\text{O}_3) = \frac{32.0}{160} = 0.200\ \text{mol}
    reason: Moles of reactant
    check_id: chk_build_chm_stoichiometry_0112_ma
  - n: 2
    latex: m_{theory} = 0.400 \times 56 = 22.4\ \text{g}
    reason: Theoretical yield
    check_id: chk_build_chm_stoichiometry_0112_mb
  - n: 3
    latex: \text{yield} = \frac{19.6}{22.4} \times 100 = 87.5\%
    reason: Actual over theoretical
    check_id: chk_build_chm_stoichiometry_0112_chain
