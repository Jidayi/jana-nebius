stem: The chlorate ion (ClO₃⁻) contains chlorine. Oxygen has oxidation number -2, and the overall charge on the ion is -1.
parts:
- id: a
  prompt: What is the oxidation number of chlorine in the chlorate ion (ClO₃⁻)?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: '+6'
      correct: false
      misconception_id: mc.chm.o.reactions_oxnum_charge_ignored
      feedback: In a compound the oxidation numbers add up to zero, but in an ion they add up to the charge on the ion. For SO₄²⁻ the total must be −2, not zero.
    - id: B
      text: '+1'
      correct: false
      misconception_id: mc.chm.o.reactions_oxnum_count_ignored
      feedback: Each atom counts. In SO₄²⁻ there are four oxygen atoms, so oxygen contributes four lots of −2. In Cr₂O₇²⁻ there are two chromium atoms sharing the total.
    - id: C
      text: '+5'
      correct: true
    - id: D
      text: −5
      correct: false
      misconception_id: mc.chm.o.reactions_oxnum_sign_flipped
      feedback: 'When you move a number to the other side of an equation, its sign changes. Check your answer: put it back into the sum and make sure the total equals the overall charge.'
  hints:
  - rung: 1
    name: orient
    text:
      en: The chlorate ion (ClO₃⁻) carries a charge, so its oxidation numbers do not add up to zero.
  - rung: 2
    name: concept
    text:
      en: The oxidation numbers of every atom in the chlorate ion (ClO₃⁻) add up to the charge on the ion.
  - rung: 3
    name: first_step
    text:
      en: 'Count every atom: write x + 3(-2) = -1.'
  - rung: 4
    name: worked_step
    text:
      en: In x + 3(-2) = -1, move the oxygen total to the right, change its sign and add it to the charge.
  - rung: 5
    name: full_step
    text:
      en: x = -1 - 3(-2) = +5. The oxidation number of chlorine is +5.
  misconception_ids:
  - mc.chm.o.reactions_oxnum_charge_ignored
  - mc.chm.o.reactions_oxnum_sign_flipped
  - mc.chm.o.reactions_oxnum_count_ignored
