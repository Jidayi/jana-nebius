id: itm.chm.o.stoichiometry.0021
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.balancing_equations
stem: A student balances the equation Fe + O₂ → Fe₂O₃.
parts:
- id: a
  prompt: Which version is balanced correctly, using the smallest whole numbers and the correct formulae?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 2Fe + O₃ → Fe₂O₃
      correct: false
      misconception_id: mc.chm.o.subscript_changed_to_balance
      feedback: 'A formula is fixed by the substance: H₂O is water, H₂O₂ is something else. Balance only with the big numbers in front of each formula.'
    - id: B
      text: 4Fe + 3O₂ → 2Fe₂O₃
      correct: true
    - id: C
      text: 8Fe + 6O₂ → 4Fe₂O₃
      correct: false
      misconception_id: mc.chm.o.balanced_not_lowest
      feedback: After balancing, check whether every coefficient can be divided by the same number. If so, divide them all.
    - id: D
      text: 4Fe + 3O₂ → Fe₂O₃
      correct: false
      misconception_id: mc.chm.o.balance_one_element_only
      feedback: Make a tally of every element on both sides. The equation is balanced only when every row of the tally matches.
  hints:
  - rung: 1
    name: orient
    text:
      en: Check each option against the formulae in Fe + O₂ → Fe₂O₃ first.
  - rung: 2
    name: concept
    text:
      en: A correct equation keeps every formula unchanged, has the same number of each atom on both sides, and uses the smallest whole numbers.
  - rung: 3
    name: first_step
    text:
      en: Rule out any option whose formulae differ from the ones given.
  - rung: 4
    name: worked_step
    text:
      en: For the options left, tally each element on both sides, then see whether the numbers can all be divided by the same factor.
  - rung: 5
    name: full_step
    text:
      en: 4Fe + 3O₂ → 2Fe₂O₃ keeps the formulae, balances every element and cannot be simplified.
  misconception_ids:
  - mc.chm.o.subscript_changed_to_balance
  - mc.chm.o.balanced_not_lowest
  - mc.chm.o.balance_one_element_only
solution:
  steps:
  - n: 1
    latex: \text{Fe} + \text{O}_2 \rightarrow \text{Fe}_2\text{O}_3
    reason: The formulae stay as given
    check_id: chk_build_chm_stoichiometry_0021_bal
  - n: 2
    latex: 4\text{Fe} + 3\text{O}_2 \rightarrow 2\text{Fe}_2\text{O}_3
    reason: Every element balances with the lowest numbers
    check_id: chk_build_chm_stoichiometry_0021_ratios
difficulty:
  prior: 0.1
  band: core
estimated_seconds: 60
exam_style:
  paper_style: objective
