id: itm.chm.o.reactions.0029
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.reactions.collision_theory
stem: Raising the pressure of a mixture of reacting gases makes the reaction faster.
parts:
- id: a
  prompt: Why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Raising the pressure lowers the activation energy.
      correct: false
      misconception_id: mc.chm.o.reactions_catalyst_gives_energy
      feedback: 'Heating gives particles more energy, so more collisions reach the activation energy. A catalyst does not add energy: it gives a different route with a lower activation energy, so more collisions succeed at the same temperature.'
    - id: B
      text: Under pressure every collision produces a reaction.
      correct: false
      misconception_id: mc.chm.o.reactions_all_collisions_react
      feedback: Particles in a gas collide billions of times a second, yet many mixtures hardly react. Only collisions with at least the activation energy lead to a reaction; the rest bounce apart unchanged.
    - id: C
      text: The gas particles are closer together, so they collide more often.
      correct: true
    - id: D
      text: The squeezed particles hit each other harder.
      correct: false
      misconception_id: mc.chm.o.reactions_concentration_harder_collisions
      feedback: Concentration, pressure and surface area change how often particles collide, not how hard. Only temperature changes the energy of the particles.
  hints:
  - rung: 1
    name: orient
    text:
      en: What happens to gas particles when the pressure is raised?
  - rung: 2
    name: concept
    text:
      en: Higher pressure for a gas works like higher concentration for a solution.
  - rung: 3
    name: first_step
    text:
      en: The particles are pushed into a smaller space but keep the same speed, since the temperature is unchanged.
  - rung: 4
    name: worked_step
    text:
      en: Ask whether pressure changes how hard the particles collide or how often.
  - rung: 5
    name: full_step
    text:
      en: At higher pressure the particles are closer together, so they collide more often. The energy of each collision is unchanged.
  misconception_ids:
  - mc.chm.o.reactions_concentration_harder_collisions
  - mc.chm.o.reactions_catalyst_gives_energy
  - mc.chm.o.reactions_all_collisions_react
solution:
  steps:
  - n: 1
    latex: '\text{closer particles: more frequent collisions}'
    reason: Collision theory
