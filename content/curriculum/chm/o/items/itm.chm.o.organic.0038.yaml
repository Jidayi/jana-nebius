id: itm.chm.o.organic.0038
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.fuels_and_cracking
stem: The petrol (gasoline) fraction is collected from a fractionating column.
parts:
- id: a
  prompt: Which statement about the petrol fraction is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Its molecules are made in the column by breaking up larger ones
      correct: false
      misconception_id: mc.chm.o.organic_cracking_is_separation
      feedback: 'Distillation separates molecules without changing them. Cracking is a chemical reaction: heat and a catalyst break C–C bonds, so large alkanes become smaller alkanes and alkenes.'
    - id: B
      text: It is a single pure compound, octane
      correct: false
      misconception_id: mc.chm.o.organic_fraction_is_one_compound
      feedback: Fractional distillation sorts molecules into groups by boiling point. Each fraction is still a mixture of many hydrocarbons whose boiling points lie in a similar range.
    - id: C
      text: It is a mixture of hydrocarbons with boiling points in a similar range
      correct: true
    - id: D
      text: Its molecules are larger than those in the fuel oil fraction
      correct: false
      misconception_id: mc.chm.o.organic_big_molecules_boil_low
      feedback: Larger molecules attract each other more strongly, so they need more energy to boil. They stay low in the column, where it is hottest; small molecules rise to the cool top.
  hints:
  - rung: 1
    name: orient
    text:
      en: Fractional distillation does not make new substances; it sorts the ones already present.
  - rung: 2
    name: concept
    text:
      en: A fraction contains every molecule that condenses in one part of the column.
  - rung: 3
    name: first_step
    text:
      en: Many different hydrocarbons have boiling points close to that of octane.
  - rung: 4
    name: worked_step
    text:
      en: Petrol leaves the column high up. Compare its molecules with those of fuel oil, which leaves low down.
  - rung: 5
    name: full_step
    text:
      en: Petrol is a mixture of many hydrocarbons whose boiling points lie in a similar range.
  misconception_ids:
  - mc.chm.o.organic_fraction_is_one_compound
  - mc.chm.o.organic_big_molecules_boil_low
  - mc.chm.o.organic_cracking_is_separation
solution:
  steps:
  - n: 1
    latex: \text{fraction = mixture with similar boiling points}
    reason: What a fraction is
