id: itm.chm.o.stoichiometry.0072
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.reacting_masses
stem: Sodium hydroxide is neutralised by sulfuric acid. The equation is 2NaOH + H₂SO₄ → Na₂SO₄ + 2H₂O.
parts:
- id: a
  prompt: Calculate the mass of Na₂SO₄ that forms from 6.5 g of NaOH.
  marks: 3
  answer:
    kind: numeric
    value: '11.5'
    unit: g
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0072_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'You know the mass of NaOH. Plan: mass → moles → ratio → moles → mass.'
  - rung: 2
    name: concept
    text:
      en: Use the balanced equation's numbers as a mole ratio.
  - rung: 3
    name: first_step
    text:
      en: Moles of NaOH = 6.5 ÷ 40 = 0.163 mol.
  - rung: 4
    name: worked_step
    text:
      en: 'Ratio NaOH : Na₂SO₄ is 2 : 1, so moles of Na₂SO₄ = 0.0813 mol.'
  - rung: 5
    name: full_step
    text:
      en: Mass of Na₂SO₄ = 0.0813 × 142 = 11.5 g.
  misconception_ids:
  - mc.chm.o.ratio_ignored
  - mc.chm.o.mass_ratio_as_mole_ratio
solution:
  steps:
  - n: 1
    latex: n(\text{NaOH}) = \frac{6.5}{40} = 0.163\ \text{mol}
    reason: Moles of the given substance
    check_id: chk_build_chm_stoichiometry_0072_ma
  - n: 2
    latex: '\text{NaOH} : \text{Na}_2\text{SO}_4 = 2 : 1'
    reason: Ratio from the equation
    check_id: chk_build_chm_stoichiometry_0072_coef
  - n: 3
    latex: n(\text{Na}_2\text{SO}_4) = 0.0813\ \text{mol}
    reason: Mole ratio from the equation
    check_id: chk_build_chm_stoichiometry_0072_chain
  - n: 4
    latex: m(\text{Na}_2\text{SO}_4) = 0.0813 \times 142 = 11.5\ \text{g}
    reason: Moles times molar mass
    check_id: chk_build_chm_stoichiometry_0072_mb
