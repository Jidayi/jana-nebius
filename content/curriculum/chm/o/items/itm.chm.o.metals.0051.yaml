stem: A company wants to obtain sodium.
parts:
- id: a
  prompt: Which method is used to obtain sodium?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Heating its oxide with carbon
      correct: false
      misconception_id: mc.chm.o.metals_carbon_reduces_all
      feedback: Carbon can only take oxygen from metals BELOW it in the reactivity series (zinc, iron, lead, copper). Metals above carbon hold their oxygen more strongly, so electrolysis is needed.
    - id: B
      text: Electrolysis of the molten chloride
      correct: true
    - id: C
      text: Heating its oxide with carbon monoxide in a blast furnace
      correct: false
      misconception_id: mc.chm.o.metals_carbon_reduces_all
      feedback: Carbon can only take oxygen from metals BELOW it in the reactivity series (zinc, iron, lead, copper). Metals above carbon hold their oxygen more strongly, so electrolysis is needed.
    - id: D
      text: It is found as the metal, so it is simply separated from rock
      correct: false
  hints:
