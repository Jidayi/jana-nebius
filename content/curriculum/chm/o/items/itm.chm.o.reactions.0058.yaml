id: itm.chm.o.reactions.0058
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.reactions.equilibrium
stem: In the Haber process, N₂ + 3H₂ ⇌ 2NH₃, the forward reaction is exothermic. Even so, a temperature of about 450 °C is used instead of a much lower one.
parts:
- id: a
  prompt: Why is a lower temperature not used?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: The iron catalyst only moves the equilibrium to the right when it is hot.
      correct: false
      misconception_id: mc.chm.o.reactions_catalyst_shifts_equilibrium
      feedback: A catalyst speeds up the forward and backward reactions by the same amount. Equilibrium is reached sooner, but the position, and so the yield, does not change.
    - id: B
      text: At a lower temperature the forward and backward reactions would stop.
      correct: false
      misconception_id: mc.chm.o.reactions_equilibrium_static
      feedback: 'Equilibrium is dynamic: the forward and backward reactions both keep going, at the same rate. Change the conditions and one reaction speeds up more than the other, so the amounts change until a new equilibrium is reached.'
    - id: C
      text: A lower temperature would give a lower yield of ammonia.
      correct: false
      misconception_id: mc.chm.o.reactions_shift_reinforces_change
      feedback: The position of equilibrium moves to oppose a change. Heating favours the direction that takes in heat. Higher pressure favours the side with fewer gas molecules. Adding a substance favours the reaction that uses it up.
    - id: D
      text: A lower temperature would give a higher yield, but the reaction would be far too slow.
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Two things matter in industry: how much ammonia forms and how fast.'
  - rung: 2
    name: concept
    text:
      en: Cooling favours the exothermic direction; but every reaction is slower when it is colder.
  - rung: 3
    name: first_step
    text:
      en: The forward reaction is exothermic, so a lower temperature moves the position to the right.
  - rung: 4
    name: worked_step
    text:
      en: Now think about how long the gases would take to reach equilibrium if they were cold.
  - rung: 5
    name: full_step
    text:
      en: At a low temperature the yield would be higher, but ammonia would form far too slowly; about 450 °C gives a reasonable yield quickly. It is a compromise.
  misconception_ids:
  - mc.chm.o.reactions_shift_reinforces_change
  - mc.chm.o.reactions_catalyst_shifts_equilibrium
  - mc.chm.o.reactions_equilibrium_static
