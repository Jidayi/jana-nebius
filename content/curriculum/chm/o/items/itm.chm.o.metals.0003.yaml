id: itm.chm.o.metals.0003
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.metals.properties_and_uses
stem: Window frames and drinks cans are often made of aluminium.
parts:
- id: a
  prompt: Which statement explains why aluminium is suitable?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: It has a low density, and a thin oxide layer on its surface stops it corroding.
      correct: true
    - id: B
      text: It is chosen because it conducts electricity well.
      correct: false
      misconception_id: mc.chm.o.metals_use_wrong_property
      feedback: Ask what the job needs first. A wire must carry current and bend; a plane body must be light and strong; a ring must stay shiny. Then pick the property that meets that need.
    - id: C
      text: Its positive ions move about, which makes the metal shiny and easy to shape.
      correct: false
      misconception_id: mc.chm.o.metals_conduct_by_moving_ions
      feedback: In a solid metal the positive ions stay in their places in the lattice. The delocalised electrons move through the structure and carry the current.
    - id: D
      text: It is high in the reactivity series, so it corrodes quickly and must be replaced often.
      correct: false
      misconception_id: mc.chm.o.metals_aluminium_corrodes_easily
      feedback: Aluminium is quite reactive, but a thin, tough layer of aluminium oxide forms on its surface at once. This layer seals the metal off, so aluminium objects last a long time outdoors.
  hints:
  - rung: 1
    name: orient
    text:
      en: Window frames stand in the rain for years; cans hold wet drinks.
  - rung: 2
    name: concept
    text:
      en: Both jobs need a light metal that does not corrode.
  - rung: 3
    name: first_step
    text:
      en: Aluminium is quite reactive, so ask why it does not corrode away in wet air.
  - rung: 4
    name: worked_step
    text:
      en: Think about what forms on the surface of aluminium as soon as it meets air.
  - rung: 5
    name: full_step
    text:
      en: Aluminium is light, and its oxide layer seals the surface, so it resists corrosion.
  misconception_ids:
  - mc.chm.o.metals_aluminium_corrodes_easily
  - mc.chm.o.metals_use_wrong_property
  - mc.chm.o.metals_conduct_by_moving_ions
