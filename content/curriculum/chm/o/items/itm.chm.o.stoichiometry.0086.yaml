stem: 0.0125 mol of hydrochloric acid, HCl is dissolved in water and made up to 50.0 cm³ of solution.
parts:
- id: a
  prompt: Calculate the concentration of the solution in mol/dm³.
  marks: 2
  answer:
    kind: numeric
    value: '0.250'
    unit: mol/dm^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0086_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Concentration tells you how many moles are in each dm³.
  - rung: 2
    name: concept
    text:
      en: c = n ÷ V, with V in dm³.
  - rung: 3
    name: first_step
    text:
      en: Convert 50.0 cm³ to dm³ by dividing by 1000.
  - rung: 4
    name: worked_step
    text:
      en: Work out 0.0125 ÷ (50.0 ÷ 1000).
  - rung: 5
    name: full_step
    text:
      en: 0.0125 ÷ (50.0 ÷ 1000) = 0.250 mol/dm³.
  misconception_ids:
  - mc.chm.o.conc_volume_not_converted
  - mc.chm.o.conc_inverted
solution:
  steps:
  - n: 1
    latex: V = \frac{50.0}{1000}\ \text{dm}^3
    reason: cm³ to dm³
  - n: 2
    latex: c = \frac{0.0125}{V} = 0.250\ \text{mol/dm}^3
    reason: Amount over volume
    check_id: chk_build_chm_stoichiometry_0086_chain
