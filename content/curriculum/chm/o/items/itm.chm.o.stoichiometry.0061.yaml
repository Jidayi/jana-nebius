id: itm.chm.o.stoichiometry.0061
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.reacting_masses
stem: Methane burns completely in oxygen. The equation is CH₄ + 2O₂ → CO₂ + 2H₂O.
parts:
- id: a
  prompt: What mass of H₂O forms from 16.0 g of CH₄?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 36.0 g
      correct: true
    - id: B
      text: 18.0 g
      correct: false
      misconception_id: mc.chm.o.ratio_ignored
      feedback: 'Read the ratio from the balanced equation: the numbers in front of the formulae tell you how many moles of each react or form.'
    - id: C
      text: 32.0 g
      correct: false
      misconception_id: mc.chm.o.mass_ratio_as_mole_ratio
      feedback: 'The equation counts particles, not grams: 2 g of hydrogen does not make 2 g of water. Convert the mass to moles first.'
    - id: D
      text: 9.00 g
      correct: false
      misconception_id: mc.chm.o.ratio_inverted
      feedback: 'Write the ratio as ''wanted : given'' from the equation, then multiply the given amount by wanted ÷ given.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Go from mass of CH₄ to moles, use the equation, then go back to mass of H₂O.
  - rung: 2
    name: concept
    text:
      en: The numbers in a balanced equation are a ratio of moles, never of grams.
  - rung: 3
    name: first_step
    text:
      en: Moles of CH₄ = 16.0 ÷ 16 = 1.00 mol.
  - rung: 4
    name: worked_step
    text:
      en: 'The equation gives 1 CH₄ : 2 H₂O, so moles of H₂O = 2.00 mol.'
  - rung: 5
    name: full_step
    text:
      en: Mass of H₂O = 2.00 × 18 = 36.0 g.
  misconception_ids:
  - mc.chm.o.ratio_ignored
  - mc.chm.o.mass_ratio_as_mole_ratio
  - mc.chm.o.ratio_inverted
solution:
  steps:
  - n: 1
    latex: n(\text{CH}_4) = \frac{16.0}{16} = 1.00
    reason: Moles of the given substance
    check_id: chk_build_chm_stoichiometry_0061_ma
  - n: 2
    latex: '\text{CH}_4 : \text{H}_2\text{O} = 1 : 2'
    reason: Ratio from the equation
    check_id: chk_build_chm_stoichiometry_0061_coef
  - n: 3
    latex: n(\text{H}_2\text{O}) = 2.00
    reason: Mole ratio from the equation
    check_id: chk_build_chm_stoichiometry_0061_chain
  - n: 4
    latex: m(\text{H}_2\text{O}) = 2.00 \times 18 = 36.0\ \text{g}
    reason: Back to mass
    check_id: chk_build_chm_stoichiometry_0061_mb
