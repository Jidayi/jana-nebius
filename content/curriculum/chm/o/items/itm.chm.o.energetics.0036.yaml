stem: 'For the reaction C₂H₄ + Cl₂ → C₂H₄Cl₂, use these bond energies in kJ/mol: C=C 612, Cl–Cl 242, C–C 348, C–Cl 346.'
parts:
- id: a
  prompt: Calculate the enthalpy change, ΔH, in kJ/mol.
  marks: 3
  answer:
    kind: numeric
    value: '-186'
    unit: kJ/mol
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_energetics_0036_dh
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: List the bonds that break and the bonds that form in C₂H₄ + Cl₂ → C₂H₄Cl₂.
  - rung: 2
    name: concept
    text:
      en: Breaking bonds takes energy in; forming bonds gives energy out. ΔH = broken − formed.
  - rung: 3
    name: first_step
    text:
      en: 'Bonds broken: one C=C and one Cl–Cl, a total of 854 kJ/mol.'
  - rung: 4
    name: worked_step
    text:
      en: 'Bonds formed: one C–C and two C–Cl, a total of 1040 kJ/mol. Subtract.'
  - rung: 5
    name: full_step
    text:
      en: ΔH = 854 − 1040 = -186 kJ/mol.
  misconception_ids:
