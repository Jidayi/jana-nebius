kc_ids:
- kc.chm.o.stoichiometry.percentage_composition
stem: Sodium carbonate, Na₂CO₃ contains the element Na.
parts:
- id: a
  prompt: What is the percentage by mass of Na in Na₂CO₃?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 21.7%
      correct: false
      misconception_id: mc.chm.o.percent_count_ignored
      feedback: 'The top of the fraction is the mass of all the atoms of that element in the formula: number of atoms × Ar.'
    - id: B
      text: 230%
      correct: false
      misconception_id: mc.chm.o.percent_inverted
      feedback: A part is smaller than the whole, so the percentage of one element is always below 100.
    - id: C
      text: '0.434'
      correct: false
      misconception_id: mc.chm.o.percent_ar_over_mr_no_100
      feedback: 'A percentage is a fraction of 100: multiply the fraction by 100.'
    - id: D
      text: 43.4%
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You need the share of the mass of Na₂CO₃ that is Na.
  - rung: 2
    name: concept
    text:
      en: Percentage by mass = (number of atoms × Ar of the element) ÷ Mr × 100.
  - rung: 3
    name: first_step
    text:
      en: Mr of Na₂CO₃ is 106.
  - rung: 4
    name: worked_step
    text:
      en: The Na atoms in Na₂CO₃ have a total mass of 46; divide this by 106.
  - rung: 5
    name: full_step
    text:
      en: 46 ÷ 106 × 100 = 43.4%.
  misconception_ids:
  - mc.chm.o.percent_count_ignored
  - mc.chm.o.percent_inverted
  - mc.chm.o.percent_ar_over_mr_no_100
solution:
