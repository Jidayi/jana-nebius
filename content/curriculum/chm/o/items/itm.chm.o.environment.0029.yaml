stem: Coal-burning power stations use flue gas desulfurisation.
parts:
- id: a
  prompt: How does this reduce pollution?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Water is sprayed in to turn carbon monoxide into acid
      correct: false
    - id: B
      text: The gases are cooled until the nitrogen condenses
      correct: false
    - id: C
      text: The waste gases pass through calcium oxide or calcium carbonate, which removes sulfur dioxide
      correct: true
    - id: D
      text: A catalyst turns the carbon dioxide into oxygen
      correct: false
      misconception_id: mc.chm.o.environment_converter_removes_co2
      feedback: A catalytic converter changes carbon monoxide and oxides of nitrogen into carbon dioxide and nitrogen. It makes carbon dioxide; it does not remove it, and it does nothing to sulfur dioxide.
  hints:
  - rung: 1
    name: orient
    text:
      en: Desulfurisation means removing sulfur.
  - rung: 2
    name: concept
    text:
      en: Sulfur dioxide is an acidic gas, so it reacts with bases.
  - rung: 3
    name: first_step
    text:
      en: Calcium oxide and calcium carbonate are cheap bases made from limestone.
  - rung: 4
    name: worked_step
    text:
      en: Which acidic gas from burning coal reacts with them?
  - rung: 5
    name: full_step
    text:
      en: Calcium oxide or calcium carbonate reacts with the sulfur dioxide and removes it from the waste gases.
  misconception_ids:
  - mc.chm.o.environment_converter_removes_co2
solution:
  steps:
  - n: 1
    latex: \text{CaO} + \text{SO}_2 \rightarrow \text{CaSO}_3
    reason: Basic oxide + acidic oxide
