stem: A student puts a piece of copper foil into dilute hydrochloric acid and leaves it for ten minutes.
parts:
- id: a
  prompt: What happens?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: The copper dissolves and carbon dioxide is given off
      correct: false
      misconception_id: mc.chm.o.acids_wrong_gas
      feedback: Look at what the acid reacts with. A metal gives hydrogen. A carbonate gives carbon dioxide, because the carbonate contains carbon and oxygen. An oxide or hydroxide gives only a salt and water, with no gas.
    - id: B
      text: Copper(II) chloride and hydrogen form, with fizzing
      correct: false
    - id: C
      text: Nothing happens, because copper is less reactive than hydrogen
      correct: true
    - id: D
      text: Copper(II) chloride and water form
      correct: false
      misconception_id: mc.chm.o.acids_metal_gives_water
      feedback: 'A base such as an oxide or hydroxide has oxygen to make water with the acid''s hydrogen. A metal has no oxygen, so the acid''s hydrogen is given off as hydrogen gas: metal + acid → salt + hydrogen.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Not every metal reacts with a dilute acid. Where is copper in the reactivity series?
  - rung: 2
    name: concept
    text:
      en: Only metals above hydrogen in the reactivity series push hydrogen out of a dilute acid.
  - rung: 3
    name: first_step
    text:
      en: Copper sits below hydrogen in the reactivity series.
  - rung: 4
    name: worked_step
    text:
      en: A metal below hydrogen cannot take the place of hydrogen in the acid.
  - rung: 5
    name: full_step
    text:
      en: Copper is less reactive than hydrogen, so there is no reaction with dilute hydrochloric acid.
  misconception_ids:
  - mc.chm.o.acids_metal_gives_water
  - mc.chm.o.acids_wrong_gas
solution:
  steps:
  - n: 1
    latex: \text{Cu below H in the reactivity series}
    reason: No displacement of hydrogen
