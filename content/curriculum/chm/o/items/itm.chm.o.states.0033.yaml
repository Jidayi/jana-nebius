    text:
      en: The same diffusion experiment is done at 20 °C and at 40 °C. What are the particles doing?
  - rung: 2
    name: concept
    text:
      en: Particles move randomly and spread from high to low concentration; lighter and hotter particles move faster.
  - rung: 3
    name: first_step
    text:
      en: Think about the speed of the particles involved.
  - rung: 4
    name: worked_step
    text:
      en: Decide which particles travel further in the same time.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: 40 °C.'
