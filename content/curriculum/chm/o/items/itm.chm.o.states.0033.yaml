stem: The same diffusion experiment is done at 20 °C and at 40 °C.
parts:
- id: a
  prompt: At which temperature is diffusion faster?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 40 °C
      correct: true
    - id: B
      text: the same at both
      correct: false
      misconception_id: mc.chm.o.states_all_gases_same_rate
      feedback: Ammonia and hydrogen chloride released at opposite ends of a tube meet nearer the hydrogen chloride end, so ammonia must travel faster.
    - id: C
      text: 20 °C
      correct: false
      misconception_id: mc.chm.o.states_colder_faster
      feedback: Heating gives particles more energy, so they move faster and diffuse faster.
    - id: D
      text: neither, diffusion needs stirring
      correct: false
      misconception_id: mc.chm.o.states_diffusion_needs_mixing
      feedback: Particles move randomly all the time. Diffusion happens on its own, even in still air; stirring only speeds it up.
