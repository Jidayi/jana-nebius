id: itm.chm.o.metals.0063
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.metals.extraction_yield
stem: Zinc oxide is heated strongly with carbon. The equation is ZnO + C → Zn + CO.
parts:
- id: a
  prompt: Calculate the mass of zinc that can be extracted from 16.2 g of ZnO.
  marks: 3
  answer:
    kind: numeric
    value: '13.0'
    unit: g
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_metals_0063_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Go from the mass of ZnO to moles, use the equation, then go back to a mass of zinc.
  - rung: 2
    name: concept
    text:
      en: Divide a mass by the molar mass to get moles; multiply moles by the molar mass to get grams.
  - rung: 3
    name: first_step
    text:
      en: Moles of ZnO = 16.2 ÷ 81 = 0.200 mol.
  - rung: 4
    name: worked_step
    text:
      en: 'The ratio ZnO : Zn is 1 : 1, so moles of Zn = 0.200 mol.'
  - rung: 5
    name: full_step
    text:
      en: Mass of zinc = 0.200 × 65 = 13.0 g.
  misconception_ids:
  - mc.chm.o.metals_yield_ratio_ignored
  - mc.chm.o.metals_yield_mass_ratio
solution:
  steps:
  - n: 1
    latex: n(\text{ZnO}) = \frac{16.2}{81} = 0.200\ \text{mol}
    reason: Mass to moles
    check_id: chk_build_chm_metals_0063_ma
  - n: 2
    latex: '\text{ZnO} : \text{Zn} = 1 : 1'
    reason: Ratio from the equation
    check_id: chk_build_chm_metals_0063_coef
  - n: 3
    latex: n(\text{Zn}) = 0.200\ \text{mol}
    reason: Mole ratio from the equation
    check_id: chk_build_chm_metals_0063_chain
  - n: 4
    latex: m(\text{Zn}) = 0.200 \times 65 = 13.0\ \text{g}
    reason: Moles to mass
    check_id: chk_build_chm_metals_0063_mb
