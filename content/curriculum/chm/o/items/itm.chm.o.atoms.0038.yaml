id: itm.chm.o.atoms.0038
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.atoms.isotopes
stem: Natural chlorine is 75% chlorine-35 and 25% chlorine-37.
parts:
- id: a
  prompt: What is the relative atomic mass of chlorine?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: '36.0'
      correct: false
      misconception_id: mc.chm.o.isotope_simple_average
      feedback: If almost all atoms are the lighter isotope, the average must be close to the lighter mass. Weight each mass by its percentage.
    - id: B
      text: '36.5'
      correct: false
      misconception_id: mc.chm.o.isotope_abundance_swapped
      feedback: 'Keep each mass with its own percentage: the more common isotope pulls the average towards its own mass.'
    - id: C
      text: '35.5'
      correct: true
    - id: D
      text: '3550'
      correct: false
      misconception_id: mc.chm.o.isotope_no_divide_100
      feedback: Percentages add up to 100, so after multiplying and adding, divide by 100 to get the average mass of one atom.
  hints:
  - rung: 1
    name: orient
    text:
      en: Relative atomic mass is the average mass of a chlorine atom, taking account of how common each isotope is.
  - rung: 2
    name: concept
    text:
      en: Multiply each isotope's mass by its percentage, add the results, then divide by 100.
  - rung: 3
    name: first_step
    text:
      en: Pair 35 with 75% and 37 with 25%.
  - rung: 4
    name: worked_step
    text:
      en: 35 × 75 + 37 × 25 = 3550.
  - rung: 5
    name: full_step
    text:
      en: 3550 ÷ 100 = 35.5.
  misconception_ids:
  - mc.chm.o.isotope_simple_average
  - mc.chm.o.isotope_no_divide_100
  - mc.chm.o.isotope_abundance_swapped
solution:
  steps:
  - n: 1
    latex: 35 \times 75 + 37 \times 25 = 3550
    reason: Weight each mass by its abundance
    check_id: chk_build_chm_atoms_0038_prod
  - n: 2
    latex: A_r = \frac{3550}{100} = 35.5
    reason: Divide by the total percentage
    check_id: chk_build_chm_atoms_0038_ar
