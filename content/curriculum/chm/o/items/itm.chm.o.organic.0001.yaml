id: itm.chm.o.organic.0001
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.functional_groups
stem: A compound has the formula C₃H₇OH.
parts:
- id: a
  prompt: To which homologous series does it belong?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Alkalis, because it contains an OH group
      correct: false
      misconception_id: mc.chm.o.organic_oh_group_is_hydroxide
      feedback: In sodium hydroxide the OH is a separate ion, OH⁻, which is set free in water. In an alcohol the O–H group is held to a carbon atom by a covalent bond and does not leave as an ion. A solution of ethanol is neutral.
    - id: B
      text: Alcohols
      correct: true
    - id: C
      text: Carboxylic acids, because it contains an O–H group
      correct: false
      misconception_id: mc.chm.o.organic_oh_and_cooh_confused
      feedback: Look at the carbon at the end of the chain. If it carries C=O as well as O–H (written –COOH), the compound is a carboxylic acid. If a carbon carries only –OH, the compound is an alcohol.
    - id: D
      text: Alkanes, because like propane it has three carbon atoms
      correct: false
      misconception_id: mc.chm.o.organic_series_by_carbon_count
      feedback: A homologous series shares a functional group and a general formula. Ethane, ethene and ethanol all have two carbon atoms, but they belong to three different series and react in different ways. Neighbouring members of one series differ by CH₂.
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Find the part of C₃H₇OH that is not just carbon and hydrogen: that is its functional group.'
  - rung: 2
    name: concept
    text:
      en: Compounds in one homologous series share a functional group. –OH joined to carbon marks an alcohol; –COOH marks a carboxylic acid.
  - rung: 3
    name: first_step
    text:
      en: C₃H₇OH has a single –OH group on a chain of carbon atoms, with no C=O group.
  - rung: 4
    name: worked_step
    text:
      en: Ask whether this OH is a separate ion, as in sodium hydroxide, or a group held in the molecule by a covalent bond.
  - rung: 5
    name: full_step
    text:
      en: C₃H₇OH fits CₙH₂ₙ₊₁OH with n = 3, so it is an alcohol (propanol).
  misconception_ids:
  - mc.chm.o.organic_oh_group_is_hydroxide
  - mc.chm.o.organic_series_by_carbon_count
  - mc.chm.o.organic_oh_and_cooh_confused
solution:
  steps:
  - n: 1
    latex: '\text{C}_3\text{H}_7\text{OH}: \text{one –OH on a carbon chain}'
    reason: Alcohol functional group
  - n: 2
    latex: \text{C}_n\text{H}_{2n+1}\text{OH, n = 3}
    reason: Fits the alcohol general formula
