id: itm.chm.o.stoichiometry.0016
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.balancing_equations
stem: The unbalanced equation is Li + O₂ → Li₂O.
parts:
- id: a
  prompt: Balance the equation using the smallest whole numbers. What number goes in front of Li?
  marks: 2
  answer:
    kind: numeric
    value: '4'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0016_ratios
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Count the atoms of each element on each side of Li + O₂ → Li₂O.
  - rung: 2
    name: concept
    text:
      en: Only the numbers in front of formulae may change; the formulae themselves stay as they are.
  - rung: 3
    name: first_step
    text:
      en: Start with an element that appears in only one substance on each side, and leave elements that appear on their own until last.
  - rung: 4
    name: worked_step
    text:
      en: Adjust one number at a time and recount every element after each change; you should find O₂, 2Li₂O.
  - rung: 5
    name: full_step
    text:
      en: 'Balanced: 4Li + O₂ → 2Li₂O. The number in front of Li is 4.'
  misconception_ids:
  - mc.chm.o.subscript_changed_to_balance
  - mc.chm.o.balance_one_element_only
solution:
  steps:
  - n: 1
    latex: 4\text{Li} + \text{O}_2 \rightarrow 2\text{Li}_2\text{O}
    reason: Smallest whole numbers that balance every element
    check_id: chk_build_chm_stoichiometry_0016_bal
  - n: 2
    latex: '\text{Li}: 4'
    reason: Coefficient of Li
    check_id: chk_build_chm_stoichiometry_0016_ratios
