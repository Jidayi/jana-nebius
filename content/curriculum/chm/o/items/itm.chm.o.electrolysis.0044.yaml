stem: Many steel objects, such as bicycle handlebars, are electroplated.
parts:
- id: a
  prompt: Give a reason for electroplating steel.
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: To make it lighter
      correct: false
    - id: B
      text: To make it softer and easier to bend
      correct: false
    - id: C
      text: To protect it from rusting and to improve its appearance
      correct: true
    - id: D
      text: To make it a better conductor of electricity
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what happens to bare steel left outdoors.
  - rung: 2
    name: concept
    text:
      en: A coating of a less easily corroded metal keeps air and water away from the steel.
  - rung: 3
    name: first_step
    text:
      en: Chromium and nickel coatings are also shiny.
  - rung: 4
    name: worked_step
    text:
      en: Two benefits come from one thin layer of metal.
  - rung: 5
    name: full_step
    text:
      en: Electroplating protects the steel from corrosion and gives it an attractive finish.
