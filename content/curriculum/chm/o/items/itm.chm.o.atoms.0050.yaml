id: itm.chm.o.atoms.0050
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.atoms.ion_formation
stem: An atom of sodium has the electron arrangement 2,8,1.
parts:
- id: a
  prompt: Which ion does sodium form?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Na⁻
      correct: false
      misconception_id: mc.chm.o.ion_sign_reversed
      feedback: Electrons carry negative charge. Take negatives away and the ion is left positive; add negatives and it becomes negative.
    - id: B
      text: Na⁺
      correct: true
    - id: C
      text: Na³⁺
      correct: false
      misconception_id: mc.chm.o.ion_charge_from_period
      feedback: The charge depends on outer-shell electrons (the group), not on how many shells there are (the period).
    - id: D
      text: Na⁷⁻
      correct: false
      misconception_id: mc.chm.o.ion_wrong_direction
      feedback: 'Atoms take the shortest route to a full outer shell: one or two outer electrons are lost; six or seven are completed by gaining one or two.'
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Look at the outer shell of sodium: how far is it from being full?'
  - rung: 2
    name: concept
    text:
      en: Atoms lose or gain the fewest electrons that give a full outer shell. Losing electrons gives a positive ion; gaining gives a negative ion.
  - rung: 3
    name: first_step
    text:
      en: Sodium has one outer electron.
  - rung: 4
    name: worked_step
    text:
      en: It is easier for sodium to lose electrons than to gain them.
  - rung: 5
    name: full_step
    text:
      en: Sodium loses one electron, forming Na⁺.
  misconception_ids:
  - mc.chm.o.ion_sign_reversed
  - mc.chm.o.ion_wrong_direction
  - mc.chm.o.ion_charge_from_period
solution:
  steps:
  - n: 1
    latex: \text{outer electrons} = 1
    reason: From the arrangement
    check_id: chk_build_chm_atoms_0050_outer
  - n: 2
    latex: \text{electrons lost} = 1
    reason: Shortest way to a full shell
    check_id: chk_build_chm_atoms_0050_moved
