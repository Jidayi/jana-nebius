type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.metals.corrosion
stem: 'A steel bucket is galvanised: it is coated with zinc. The coating gets scratched, but the steel underneath still does not rust.'
parts:
- id: a
  prompt: Why does the steel not rust?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: The zinc rusts instead of the iron, turning orange-brown.
      correct: false
      misconception_id: mc.chm.o.metals_all_metals_rust
      feedback: Rust is hydrated iron(III) oxide, so only iron and steel rust. Other metals may corrode, but their corrosion is not called rusting.
    - id: B
      text: Zinc is less reactive than iron, so it never corrodes and keeps the iron safe.
      correct: false
      misconception_id: mc.chm.o.metals_sacrificial_less_reactive
      feedback: Sacrificial protection needs a metal MORE reactive than iron, such as zinc or magnesium. It corrodes first, losing electrons instead of the iron, so the iron is saved.
    - id: C
      text: Zinc keeps out air but not water, and air alone causes rusting.
      correct: false
      misconception_id: mc.chm.o.metals_rust_one_condition
      feedback: 'Compare the test tubes: a nail in boiled water under oil (no air) and a nail in dry air (no water) both stay shiny. Only the nail with water AND air rusts.'
    - id: D
      text: Zinc is more reactive than iron, so it corrodes instead and protects the iron.
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A scratch lets water and air reach the steel, so a barrier alone cannot explain it.
  - rung: 2
    name: concept
    text:
      en: Compare the positions of zinc and iron in the reactivity series.
  - rung: 3
    name: first_step
    text:
      en: Zinc is above iron, so zinc loses electrons more readily.
  - rung: 4
    name: worked_step
    text:
      en: Think about which metal reacts first when both touch the same water and air.
  - rung: 5
    name: full_step
    text:
      en: 'Zinc is more reactive, so it corrodes in place of the iron: sacrificial protection.'
  misconception_ids:
  - mc.chm.o.metals_sacrificial_less_reactive
  - mc.chm.o.metals_all_metals_rust
  - mc.chm.o.metals_rust_one_condition
solution:
  steps:
  - n: 1
    latex: \text{Zn above Fe}
    reason: Reactivity series
  - n: 2
    latex: \text{Zn corrodes instead of Fe}
    reason: Sacrificial protection
