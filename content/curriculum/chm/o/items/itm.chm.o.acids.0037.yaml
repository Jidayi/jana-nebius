subject: chm
level: o
kc_ids:
- kc.chm.o.acids.oxides
stem: Zinc oxide, ZnO, reacts with dilute hydrochloric acid. It also reacts with warm sodium hydroxide solution.
parts:
- id: a
  prompt: What type of oxide is zinc oxide?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Acidic
      correct: false
      misconception_id: mc.chm.o.acids_oxide_type_swapped
      feedback: 'Metal oxides such as CaO and CuO are bases: they react with acids. Non-metal oxides such as CO₂ and SO₂ are acidic: they react with alkalis and give acidic solutions in water.'
    - id: B
      text: Basic
      correct: false
      misconception_id: mc.chm.o.acids_oxide_by_element_only
      feedback: 'The metal / non-metal rule has exceptions. Test the oxide: aluminium oxide and zinc oxide also react with alkalis (amphoteric), and carbon monoxide and nitrogen monoxide react with neither acids nor alkalis (neutral).'
    - id: C
      text: Neutral
      correct: false
      misconception_id: mc.chm.o.acids_amphoteric_neutral_confused
      feedback: 'Amphoteric means ''both'': aluminium oxide and zinc oxide react with acids and with alkalis. Neutral means ''neither'': carbon monoxide, nitrogen monoxide and water react with neither.'
    - id: D
      text: Amphoteric
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Does zinc oxide react with acids, with alkalis, or with both?
  - rung: 2
    name: concept
    text:
      en: Basic oxides react with acids; acidic oxides react with alkalis.
  - rung: 3
    name: first_step
    text:
      en: Zinc oxide reacts with both an acid and an alkali.
  - rung: 4
    name: worked_step
    text:
      en: Zinc is a metal, but the test result matters more than the metal rule here.
  - rung: 5
    name: full_step
    text:
      en: An oxide that reacts with both acids and alkalis is amphoteric, so zinc oxide is amphoteric.
  misconception_ids:
  - mc.chm.o.acids_amphoteric_neutral_confused
  - mc.chm.o.acids_oxide_by_element_only
  - mc.chm.o.acids_oxide_type_swapped
solution:
  steps:
  - n: 1
    latex: \text{reacts with acid and with alkali} \Rightarrow \text{amphoteric}
    reason: Definition
