stem: A reversible reaction in a closed container has reached dynamic equilibrium.
parts:
- id: a
  prompt: Which statement is true at dynamic equilibrium?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Only the forward reaction is still happening.
      correct: false
    - id: B
      text: The amounts of reactants and products are always equal.
      correct: false
    - id: C
      text: The forward and backward reactions continue at the same rate, so the amounts stay constant.
      correct: true
    - id: D
      text: Both reactions have stopped.
      correct: false
      misconception_id: mc.chm.o.reactions_equilibrium_static
      feedback: 'Equilibrium is dynamic: the forward and backward reactions both keep going, at the same rate. Change the conditions and one reaction speeds up more than the other, so the amounts change until a new equilibrium is reached.'
  hints:
  - rung: 1
    name: orient
    text:
      en: '''Dynamic'' means that something is still happening.'
  - rung: 2
    name: concept
    text:
      en: At equilibrium, the forward reaction makes products as fast as the backward reaction uses them up.
  - rung: 3
    name: first_step
    text:
      en: Because the two rates are equal, the amounts no longer change.
  - rung: 4
    name: worked_step
    text:
      en: Constant amounts do not have to be equal amounts.
  - rung: 5
    name: full_step
    text:
      en: Both reactions continue at the same rate, so the amounts of reactants and products stay constant.
  misconception_ids:
  - mc.chm.o.reactions_equilibrium_static
solution:
  steps:
  - n: 1
    latex: \text{rate forward = rate backward}
    reason: Dynamic equilibrium
