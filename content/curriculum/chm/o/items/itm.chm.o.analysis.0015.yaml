id: itm.chm.o.analysis.0015
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.analysis.titration_technique
stem: 'A student records these titres in cm³: rough 24.60, then 24.15, 24.40, 24.10.'
parts:
- id: a
  prompt: What is the mean titre to use?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 24.22 cm³
      correct: false
      misconception_id: mc.chm.o.analysis_mean_includes_rough
      feedback: Use only concordant titres (within 0.10 cm³ of each other) for the mean; the rough titre is a guide only.
    - id: B
      text: 24.13 cm³
      correct: true
    - id: C
      text: 24.60 cm³
      correct: false
      misconception_id: mc.chm.o.analysis_mean_includes_rough
      feedback: That is the rough titre. The rough run only finds where the end point is, so leave it out and average the titres that agree.
    - id: D
      text: 24.31 cm³
      correct: false
      misconception_id: mc.chm.o.analysis_mean_includes_rough
      feedback: Use only concordant titres (within 0.10 cm³ of each other) for the mean; the rough titre is a guide only.
  hints:
  - rung: 1
    name: orient
    text:
      en: Which titres should go into the mean?
  - rung: 2
    name: concept
    text:
      en: 'Use only concordant titres: those within 0.10 cm³ of each other. Leave out the rough one.'
  - rung: 3
    name: first_step
    text:
      en: Check which of 24.15, 24.40, 24.10 agree within 0.10 cm³.
  - rung: 4
    name: worked_step
    text:
      en: Average the 2 concordant titres.
  - rung: 5
    name: full_step
    text:
      en: Mean = 24.13 cm³.
  misconception_ids:
  - mc.chm.o.analysis_mean_includes_rough
solution:
  steps:
  - n: 1
    latex: \text{mean} = \frac{24.15 + 24.10}{2} = 24.13
    reason: Concordant titres only
    check_id: chk_build_chm_analysis_0015_mean
