id: itm.chm.o.atoms.0065
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.atoms.covalent_bonding
stem: A chlorine molecule, Cl₂, is held together by covalent bonding.
parts:
- id: a
  prompt: Which describes the bonding in one Cl₂ molecule?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: two shared pairs
      correct: false
      misconception_id: mc.chm.o.covalent_pairs_equal_atoms
      feedback: 'Count bonds, not atoms: a molecule of two atoms joined by one pair has one bond, not two.'
    - id: B
      text: one shared pair (a single bond)
      correct: true
    - id: C
      text: seven shared pairs
      correct: false
      misconception_id: mc.chm.o.covalent_lone_pairs_counted
      feedback: Only pairs between two atoms are shared. Pairs that stay on one atom are lone pairs and are not bonds.
    - id: D
      text: electrons transferred from one atom to another, forming ions
      correct: false
      misconception_id: mc.chm.o.covalent_as_transfer
      feedback: Between two non-metals, neither atom can easily lose electrons, so they share pairs. Transfer happens between a metal and a non-metal.
  hints:
  - rung: 1
    name: orient
    text:
      en: How many more electrons does each chlorine atom need for a full outer shell?
  - rung: 2
    name: concept
    text:
      en: Non-metal atoms share pairs of electrons; each shared pair is one covalent bond.
  - rung: 3
    name: first_step
    text:
      en: Each chlorine atom needs 1 more electron.
  - rung: 4
    name: worked_step
    text:
      en: Count only the pairs between atoms, not the pairs that stay on one atom.
  - rung: 5
    name: full_step
    text:
      en: Cl₂ has one shared pair (a single bond).
  misconception_ids:
  - mc.chm.o.covalent_as_transfer
  - mc.chm.o.covalent_lone_pairs_counted
  - mc.chm.o.covalent_pairs_equal_atoms
solution:
  steps:
  - n: 1
    latex: 8 - \text{outer electrons} = 1
    reason: Electrons each atom needs
    check_id: chk_build_chm_atoms_0065_need
  - n: 2
    latex: \text{one shared pair (a single bond)}
    reason: Shared pairs only
