  - rung: 1
    name: orient
    text:
      en: What fraction of the mass of CuSO₄ is Cu?
  - rung: 2
    name: concept
    text:
      en: Percentage = mass of the element's atoms in the formula ÷ Mr × 100.
  - rung: 3
    name: first_step
    text:
      en: Mr of CuSO₄ is 160.
  - rung: 4
    name: worked_step
    text:
      en: The Cu atoms contribute 64. Work out 64 ÷ 160 × 100.
  - rung: 5
    name: full_step
    text:
      en: 64 ÷ 160 × 100 = 40.0%.
