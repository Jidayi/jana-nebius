  - rung: 1
    name: orient
    text:
      en: What fraction of the mass of KNO₃ is N?
  - rung: 2
    name: concept
    text:
      en: Percentage = mass of the element's atoms in the formula ÷ Mr × 100.
  - rung: 3
    name: first_step
    text:
      en: Mr of KNO₃ is 101.
  - rung: 4
    name: worked_step
    text:
      en: The N atoms contribute 14. Work out 14 ÷ 101 × 100.
  - rung: 5
    name: full_step
    text:
      en: 14 ÷ 101 × 100 = 13.9%.
