id: itm.chm.o.reactions.0011
version: 0.1.0
type: mcq
subject: chm
level: o
kc_ids:
- kc.chm.o.reactions.physical_chemical_change
stem: Purple crystals of iodine are warmed gently in a closed flask. A purple vapour forms, and on cooling crystals reappear on the cold glass.
parts:
- id: a
  prompt: Which kind of change is this?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: 'A physical change: iodine changes from solid to gas and back again.'
      correct: true
    - id: B
      text: 'A chemical change: the iodine reacts with the glass.'
      correct: false
    - id: C
      text: 'A chemical change: the iodine reacts with air in the flask.'
      correct: false
    - id: D
      text: 'A chemical change: the purple vapour is a new substance.'
      correct: false
      misconception_id: mc.chm.o.reactions_state_change_is_chemical
      feedback: Ice, liquid water and steam are all the same substance, made of the same water molecules. A change of state only changes how close together the particles are and how they move. No new substance forms, so it is a physical change.
  hints:
  - rung: 1
    name: orient
    text:
      en: Is the substance at the end of the experiment the same as at the start?
  - rung: 2
    name: concept
    text:
      en: Changes of state, including solid straight to gas, are physical changes.
  - rung: 3
    name: first_step
    text:
      en: The crystals that reappear on the cold glass are iodine again.
  - rung: 4
    name: worked_step
    text:
      en: Decide whether the iodine molecules have changed, or only how far apart they are.
  - rung: 5
    name: full_step
    text:
      en: 'It is physical: the iodine only changes state (it sublimes) and the same crystals come back on cooling.'
  misconception_ids:
  - mc.chm.o.reactions_state_change_is_chemical
solution:
  steps:
  - n: 1
    latex: \text{I}_2\text{(s)} \rightleftharpoons \text{I}_2\text{(g)}
    reason: Same substance, different state
