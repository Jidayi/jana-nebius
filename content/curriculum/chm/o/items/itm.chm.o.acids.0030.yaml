- kc.chm.o.organic.carboxylic_acids
stem: Ethanoic acid is a weak acid.
parts:
- id: a
  prompt: Which equation shows how ethanoic acid behaves in water?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: CH₃COOH → CH₃COO⁻ + H⁺
      correct: false
      misconception_id: mc.chm.o.acids_strong_means_concentrated
      feedback: Strength is about how fully an acid ionises in water. Concentration is about how much acid is in each dm³. A dilute solution of hydrochloric acid is still a strong acid; a concentrated solution of ethanoic acid is still a weak acid.
    - id: B
      text: CH₃COOH → CH₃COO + H
      correct: false
      misconception_id: mc.chm.o.acids_weak_not_ionised
      feedback: 'A weak acid is partly ionised: most molecules stay whole, but some give H⁺ ions. That is why ethanoic acid still turns indicators red or orange, conducts a little and reacts slowly with metals.'
    - id: C
      text: CH₃COOH ⇌ CH₃COO⁻ + H⁺
      correct: true
    - id: D
      text: CH₃COOH → CH₃COOH⁺ + OH⁻
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A weak acid only partly ionises. How does an equation show a reaction that does not go to completion?
  - rung: 2
    name: concept
    text:
      en: A reversible reaction is shown with the double arrow ⇌.
  - rung: 3
    name: first_step
    text:
      en: Acids give hydrogen ions, H⁺, when they ionise.
  - rung: 4
    name: worked_step
    text:
      en: Look for the equation that gives H⁺ and uses the double arrow.
  - rung: 5
    name: full_step
    text:
      en: 'CH₃COOH ⇌ CH₃COO⁻ + H⁺: the double arrow shows only some molecules ionise at any time.'
  misconception_ids:
  - mc.chm.o.acids_strong_means_concentrated
  - mc.chm.o.acids_weak_not_ionised
solution:
  steps:
  - n: 1
    latex: \text{CH}_3\text{COOH} \rightleftharpoons \text{CH}_3\text{COO}^{-} + \text{H}^{+}
    reason: 'Weak acid: reversible, partial ionisation'
