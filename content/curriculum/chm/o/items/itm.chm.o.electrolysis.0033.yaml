id: itm.chm.o.electrolysis.0033
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.electrolysis.half_equations
stem: 'In the electrolysis of dilute sulfuric acid, hydroxide ions are discharged at the anode: 4OH⁻ → O₂ + 2H₂O + ne⁻.'
parts:
- id: a
  prompt: How many electrons, n, are in the balanced half-equation?
  marks: 1
  answer:
    kind: numeric
    value: '4'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_electrolysis_0033_n
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Count charges, not atoms: the atoms are already balanced.'
  - rung: 2
    name: concept
    text:
      en: Charges on both sides of a half-equation must be equal.
  - rung: 3
    name: first_step
    text:
      en: Every hydroxide ion carries one negative charge; oxygen and water molecules carry none.
  - rung: 4
    name: worked_step
    text:
      en: The electrons on the right must carry the whole charge of the hydroxide ions on the left.
  - rung: 5
    name: full_step
    text:
      en: '4OH⁻ → O₂ + 2H₂O + 4e⁻: n = 4, so the charges balance.'
  misconception_ids:
  - mc.chm.o.electrolysis_half_charge_unbalanced
solution:
  steps:
  - n: 1
    latex: '\text{left: } -4;\ \text{right without electrons: } 0'
    reason: Charges before electrons
    check_id: chk_build_chm_electrolysis_0033_l
  - n: 2
    latex: n = 0 - (-4) = 4
    reason: Electrons carry the difference
    check_id: chk_build_chm_electrolysis_0033_n
  - n: 3
    latex: 4\text{OH}^{-} \rightarrow \text{O}_2 + 2\text{H}_2\text{O} + 4e^{-}
    reason: Balanced half-equation
    check_id: chk_build_chm_electrolysis_0033_bal
