id: itm.chm.o.stoichiometry.0065
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.reacting_masses
stem: Zinc reacts with excess hydrochloric acid. The equation is Zn + 2HCl → ZnCl₂ + H₂.
parts:
- id: a
  prompt: Calculate the mass of ZnCl₂ that forms from 16.0 g of Zn.
  marks: 3
  answer:
    kind: numeric
    value: '33.5'
    unit: g
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0065_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'You know the mass of Zn. Plan: mass → moles → ratio → moles → mass.'
  - rung: 2
    name: concept
    text:
      en: Use the balanced equation's numbers as a mole ratio.
  - rung: 3
    name: first_step
    text:
      en: Moles of Zn = 16.0 ÷ 65 = 0.246 mol.
  - rung: 4
    name: worked_step
    text:
      en: 'Ratio Zn : ZnCl₂ is 1 : 1, so moles of ZnCl₂ = 0.246 mol.'
  - rung: 5
    name: full_step
    text:
      en: Mass of ZnCl₂ = 0.246 × 136 = 33.5 g.
  misconception_ids:
  - mc.chm.o.ratio_ignored
  - mc.chm.o.mass_ratio_as_mole_ratio
solution:
  steps:
  - n: 1
    latex: n(\text{Zn}) = \frac{16.0}{65} = 0.246\ \text{mol}
    reason: Moles of the given substance
    check_id: chk_build_chm_stoichiometry_0065_ma
  - n: 2
    latex: '\text{Zn} : \text{ZnCl}_2 = 1 : 1'
    reason: Ratio from the equation
    check_id: chk_build_chm_stoichiometry_0065_coef
  - n: 3
    latex: n(\text{ZnCl}_2) = 0.246\ \text{mol}
    reason: Mole ratio from the equation
    check_id: chk_build_chm_stoichiometry_0065_chain
  - n: 4
    latex: m(\text{ZnCl}_2) = 0.246 \times 136 = 33.5\ \text{g}
    reason: Moles times molar mass
    check_id: chk_build_chm_stoichiometry_0065_mb
