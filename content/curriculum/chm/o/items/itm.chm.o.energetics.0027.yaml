stem: 'For the reaction 2H₂ + O₂ → 2H₂O, use these bond energies in kJ/mol: H–H 436, O=O 498, O–H 464.'
parts:
- id: a
  prompt: What is the enthalpy change, ΔH, for the reaction?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: +470 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_bond_count_ignored
      feedback: 'Count every bond: CH₄ has four C–H bonds, and 2H₂O has four O–H bonds. Multiply each bond energy by its number.'
    - id: B
      text: -486 kJ/mol
      correct: true
    - id: C
      text: +486 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_formed_minus_broken
      feedback: ΔH = energy in (bonds broken) − energy out (bonds formed). More out than in gives a negative ΔH.
    - id: D
      text: +1370 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_only_broken
      feedback: 'Both halves matter: energy goes in to break bonds and comes out when new bonds form. ΔH is the difference.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Which bonds break in the reactants of 2H₂ + O₂ → 2H₂O, and which form in the products?
  - rung: 2
    name: concept
    text:
      en: ΔH = total energy of bonds broken − total energy of bonds formed.
  - rung: 3
    name: first_step
    text:
      en: 'Bonds broken: two H–H and one O=O, a total of 1370 kJ/mol.'
  - rung: 4
    name: worked_step
    text:
      en: 'Bonds formed: four O–H, a total of 1856 kJ/mol.'
  - rung: 5
    name: full_step
    text:
      en: ΔH = 1370 − 1856 = -486 kJ/mol.
  misconception_ids:
  - mc.chm.o.energetics_formed_minus_broken
  - mc.chm.o.energetics_bond_count_ignored
  - mc.chm.o.energetics_only_broken
