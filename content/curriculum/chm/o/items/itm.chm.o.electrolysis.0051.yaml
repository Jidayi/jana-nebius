id: itm.chm.o.electrolysis.0051
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.electrolysis.quantitative
stem: 'Aluminium forms at the cathode of an aluminium cell: Al³⁺ + 3e⁻ → Al. A current of 5.0 A flows for 5790 s. (Faraday constant: 96500 C per mole of electrons.)'
parts:
- id: a
  prompt: Calculate the mass of aluminium deposited.
  marks: 3
  answer:
    kind: numeric
    value: '2.70'
    unit: g
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_electrolysis_0051_m
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Plan: charge → moles of electrons → moles of aluminium → mass of aluminium.'
  - rung: 2
    name: concept
    text:
      en: Q = I × t; moles of electrons = Q ÷ 96500; the half-equation gives the electrons per aluminium atom.
  - rung: 3
    name: first_step
    text:
      en: Q = 5.0 × 5790 = 28950 C, so moles of electrons = 28950 ÷ 96500 = 0.300 mol.
  - rung: 4
    name: worked_step
    text:
      en: Each aluminium ion needs 3 electrons, so moles of aluminium = 0.300 ÷ 3 = 0.100 mol. Multiply by 27.
  - rung: 5
    name: full_step
    text:
      en: Mass = 0.100 × 27 = 2.70 g.
  misconception_ids:
  - mc.chm.o.electrolysis_electron_ratio_ignored
solution:
  steps:
  - n: 1
    latex: Q = 5.0 \times 5790 = 28950\ \text{C}
    reason: Charge = current × time
    check_id: chk_build_chm_electrolysis_0051_m
  - n: 2
    latex: n(e^-) = \frac{28950}{96500} = 0.300\ \text{mol}
    reason: Divide by the Faraday constant
    check_id: chk_build_chm_electrolysis_0051_e
  - n: 3
    latex: n(\text{Al}) = \frac{0.300}{3} = 0.100\ \text{mol}
    reason: 3 mol of electrons per mol of aluminium
    check_id: chk_build_chm_electrolysis_0051_n
  - n: 4
    latex: m = n \times 27 = 2.70\ \text{g}
    reason: Moles to mass
    check_id: chk_build_chm_electrolysis_0051_m
