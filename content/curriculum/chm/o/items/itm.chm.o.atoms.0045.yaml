    text:
      en: You need the weighted average mass of a silver atom.
  - rung: 2
    name: concept
    text:
      en: Relative atomic mass = (mass × % + mass × %) ÷ 100.
  - rung: 3
    name: first_step
    text:
      en: Multiply 107 by 52 and 109 by 48.
  - rung: 4
    name: worked_step
    text:
      en: The two products add to 10796.
  - rung: 5
    name: full_step
    text:
      en: 10796 ÷ 100 = 108.
