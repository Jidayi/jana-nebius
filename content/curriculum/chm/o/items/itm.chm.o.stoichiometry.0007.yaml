    text:
      en: The formula is Fe(NO₃)₃. Now count the atoms of each element in it.
  - rung: 4
    name: worked_step
    text:
      en: 'In Fe(NO₃)₃: one Fe atom gives 56, three N atoms give 42 and nine O atoms give 144.'
  - rung: 5
