    name: orient
    text:
      en: 'Start from the job: what must a metal used for water pipes do?'
  - rung: 2
    name: concept
    text:
      en: Match the need of the job to one property of the metal.
  - rung: 3
    name: first_step
    text:
      en: For water pipes, think about the conditions the metal meets every day.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that are true of some metals but do not help with this job.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: copper does not react with water and can be bent into shape. Here copper is low in the reactivity series and is easy to bend.'
