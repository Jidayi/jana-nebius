stem: Water pipes in many houses are made of copper.
parts:
- id: a
  prompt: Why is copper suitable for water pipes?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Copper reacts with water to make a protective layer of hydroxide.
      correct: false
    - id: B
      text: Copper has a very low density.
      correct: false
    - id: C
      text: Copper does not react with water and can be bent into shape.
      correct: true
    - id: D
      text: Copper is magnetic, so the pipes hold to the wall.
      correct: false
      misconception_id: mc.chm.o.metals_use_wrong_property
      feedback: Ask what the job needs first. A wire must carry current and bend; a plane body must be light and strong; a ring must stay shiny. Then pick the property that meets that need.
