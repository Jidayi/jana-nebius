id: itm.chm.o.acids.0057
version: 0.1.0
type: mcq
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.salt_preparation
stem: Copper(II) carbonate is added to dilute hydrochloric acid in small portions.
parts:
- id: a
  prompt: How can the student tell when all of the acid has reacted?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: The solution turns colourless
      correct: false
    - id: B
      text: The mixture stops fizzing and green solid stays undissolved
      correct: true
    - id: C
      text: A white precipitate forms
      correct: false
      misconception_id: mc.chm.o.acids_precipitation_confused
      feedback: 'An insoluble salt comes out of solution as a precipitate as soon as two solutions are mixed: filter it off and wash it. A soluble salt stays dissolved: you get it by evaporating and crystallising the solution.'
    - id: D
      text: The mixture starts to fizz more quickly
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: What gas forms when a carbonate reacts with an acid?
  - rung: 2
    name: concept
    text:
      en: Carbon dioxide bubbles form only while acid is left to react.
  - rung: 3
    name: first_step
    text:
      en: When the acid is used up, extra carbonate has nothing to react with.
  - rung: 4
    name: worked_step
    text:
      en: 'Look for two signs: what happens to the bubbles, and what happens to the added solid.'
  - rung: 5
    name: full_step
    text:
      en: When the acid is used up, the fizzing stops and the extra copper(II) carbonate stays as a solid.
  misconception_ids:
  - mc.chm.o.acids_precipitation_confused
solution:
  steps:
  - n: 1
    latex: \text{CuCO}_3 + 2\text{HCl} \rightarrow \text{CuCl}_2 + \text{H}_2\text{O} + \text{CO}_2
    reason: Carbonate + acid gives carbon dioxide
