id: itm.chm.o.organic.0015
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.naming
stem: A bottle is labelled butanoic acid.
parts:
- id: a
  prompt: Which formula is butanoic acid?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: C₄H₉COOH
      correct: false
      misconception_id: mc.chm.o.organic_prefix_wrong_atoms
      feedback: The prefix counts every carbon atom in the molecule, including the carbon inside –COOH. CH₃COOH has two carbon atoms, so it is ethanoic acid. Hydrogen atoms never set the prefix.
    - id: B
      text: C₂H₅COOH
      correct: false
      misconception_id: mc.chm.o.organic_prefix_order_mixed
      feedback: 'Learn the order: meth- means one carbon atom, eth- two, prop- three and but- four. A memory aid: Monkeys Eat Peeled Bananas.'
    - id: C
      text: C₄H₉OH
      correct: false
      misconception_id: mc.chm.o.organic_ending_wrong_series
      feedback: 'The ending names the family: -ane for alkanes, -ene for alkenes, -ol for alcohols and -oic acid for carboxylic acids. Find the functional group first, then choose the ending.'
    - id: D
      text: C₃H₇COOH
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The name tells you the family and the total number of carbon atoms.
  - rung: 2
    name: concept
    text:
      en: But- means four carbon atoms. -oic acid means the molecule has a –COOH group.
  - rung: 3
    name: first_step
    text:
      en: One of the four carbon atoms is inside the –COOH group.
  - rung: 4
    name: worked_step
    text:
      en: So the chain joined to –COOH holds the other carbon atoms. How many is that?
  - rung: 5
    name: full_step
    text:
      en: 'Four carbons with one in –COOH leaves three in the chain: C₃H₇COOH.'
  misconception_ids:
  - mc.chm.o.organic_prefix_wrong_atoms
  - mc.chm.o.organic_ending_wrong_series
  - mc.chm.o.organic_prefix_order_mixed
solution:
  steps:
  - n: 1
    latex: \text{but- = 4 C; 4 - 1 = 3 in the chain}
    reason: The –COOH carbon counts
  - n: 2
    latex: \text{C}_3\text{H}_7\text{COOH}
    reason: Formula
