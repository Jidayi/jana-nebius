- kc.chm.o.metals.corrosion
stem: Some steel objects are protected by coating them with plastic, others by attaching zinc.
parts:
- id: a
  prompt: Which statement compares the two methods correctly?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Plastic is a barrier that fails when scratched; zinc still protects the iron after a scratch.
      correct: true
    - id: B
      text: Zinc works because it is less reactive than iron.
      correct: false
      misconception_id: mc.chm.o.metals_sacrificial_less_reactive
      feedback: Sacrificial protection needs a metal MORE reactive than iron, such as zinc or magnesium. It corrodes first, losing electrons instead of the iron, so the iron is saved.
    - id: C
      text: Plastic protects by corroding in place of the iron.
      correct: false
    - id: D
      text: Both are barrier methods and both fail when scratched.
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: One method keeps water and air away; the other uses the reactivity series.
  - rung: 2
    name: concept
    text:
      en: A barrier works only while it covers all the iron.
  - rung: 3
    name: first_step
    text:
      en: Zinc is more reactive than iron.
  - rung: 4
    name: worked_step
    text:
      en: Ask what happens with each method once water reaches the bare steel.
  - rung: 5
    name: full_step
    text:
      en: Plastic is a barrier only; zinc gives sacrificial protection even through a scratch.
  misconception_ids:
  - mc.chm.o.metals_sacrificial_less_reactive
