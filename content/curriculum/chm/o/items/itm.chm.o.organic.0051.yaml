id: itm.chm.o.organic.0051
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.alkanes_and_alkenes
stem: 'Four hydrocarbons are tested: C₂H₆, C₃H₆, C₄H₁₀ and C₂H₄.'
parts:
- id: a
  prompt: Which of them decolourise bromine water quickly at room temperature?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: C₂H₆ and C₄H₁₀, because bromine can swap places with their hydrogen atoms
      correct: false
      misconception_id: mc.chm.o.organic_addition_substitution_mixed
      feedback: In addition, two molecules join into one product and the double bond becomes single. In substitution an atom such as H is swapped for another such as Cl, so a second product (HCl) forms. Alkenes add; alkanes substitute, in ultraviolet light.
    - id: B
      text: 'None: alkenes turn bromine water orange rather than colourless'
      correct: false
      misconception_id: mc.chm.o.organic_bromine_colour_reversed
      feedback: 'Bromine water starts orange-brown. An alkene adds the bromine across its double bond, so the orange colour disappears: orange to colourless. No change means no C=C bond.'
    - id: C
      text: C₃H₆ and C₂H₄ only
      correct: true
    - id: D
      text: All four, because they are all hydrocarbons
      correct: false
      misconception_id: mc.chm.o.organic_alkanes_decolourise_bromine
      feedback: 'Alkanes are saturated: they have no C=C bond for bromine to add to. An alkane leaves bromine water orange. Only an alkene removes the colour quickly, by addition.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Sort the four into alkanes (CₙH₂ₙ₊₂) and alkenes (CₙH₂ₙ).
  - rung: 2
    name: concept
    text:
      en: Only an unsaturated hydrocarbon, with a C=C bond, adds bromine quickly.
  - rung: 3
    name: first_step
    text:
      en: C₂H₆ and C₄H₁₀ fit CₙH₂ₙ₊₂. C₃H₆ and C₂H₄ have twice as many H atoms as C atoms.
  - rung: 4
    name: worked_step
    text:
      en: Which pair fit CₙH₂ₙ and so contain a C=C double bond?
  - rung: 5
    name: full_step
    text:
      en: C₃H₆ (propene) and C₂H₄ (ethene) are alkenes and decolourise bromine water.
  misconception_ids:
  - mc.chm.o.organic_alkanes_decolourise_bromine
  - mc.chm.o.organic_addition_substitution_mixed
  - mc.chm.o.organic_bromine_colour_reversed
