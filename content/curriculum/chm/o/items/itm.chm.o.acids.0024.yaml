id: itm.chm.o.acids.0024
version: 0.1.0
type: mcq
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.ph_and_indicators
stem: A student wants to compare how acidic lemon juice and vinegar are.
parts:
- id: a
  prompt: Why is universal indicator better than litmus for this?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Litmus does not work in acids
      correct: false
    - id: B
      text: Litmus is red in alkali, so it cannot show an acid
      correct: false
      misconception_id: mc.chm.o.acids_indicator_colours_swapped
      feedback: 'Learn each pair: litmus is red in acid and blue in alkali; methyl orange is red in acid and yellow in alkali; phenolphthalein is colourless in acid and pink in alkali.'
    - id: C
      text: It shows a range of colours, so it gives an approximate pH value
      correct: true
    - id: D
      text: Universal indicator turns the acids neutral
      correct: false
      misconception_id: mc.chm.o.acids_dilution_ph_wrong
      feedback: Adding water spreads the same ions through more solution, so the pH moves towards 7. Water itself is neutral, so it can never make an acid alkaline or an alkali acidic.
  hints:
  - rung: 1
    name: orient
    text:
      en: What can litmus tell you, and what can it not tell you?
  - rung: 2
    name: concept
    text:
      en: 'Litmus only has two colours: it tells acid from alkali, but not how strongly acidic.'
  - rung: 3
    name: first_step
    text:
      en: Universal indicator is a mixture of indicators that changes colour many times across the pH scale.
  - rung: 4
    name: worked_step
    text:
      en: To compare two acids you need a number on the pH scale, not just 'acid'.
  - rung: 5
    name: full_step
    text:
      en: Universal indicator gives a different colour for each part of the pH scale, so it shows an approximate pH; litmus only shows acid or alkali.
  misconception_ids:
  - mc.chm.o.acids_dilution_ph_wrong
  - mc.chm.o.acids_indicator_colours_swapped
solution:
  steps:
  - n: 1
    latex: \text{many colours} \Rightarrow \text{approximate pH}
    reason: Universal indicator vs litmus
