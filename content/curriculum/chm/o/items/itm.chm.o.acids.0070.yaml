id: itm.chm.o.acids.0070
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.titration_calculations
stem: 25.0 cm³ of nitric acid of unknown concentration is neutralised by 18.0 cm³ of 0.150 mol/dm³ sodium hydroxide solution. The equation is HNO₃ + NaOH → NaNO₃ + H₂O.
parts:
- id: a
  prompt: Calculate the concentration of the nitric acid in mol/dm³.
  marks: 3
  answer:
    kind: numeric
    value: '0.108'
    unit: mol/dm^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_acids_0070_r
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: This time the sodium hydroxide is the solution you know everything about.
  - rung: 2
    name: concept
    text:
      en: Moles of alkali = c × V. The equation shows one mole of HNO₃ reacts with one mole of NaOH.
  - rung: 3
    name: first_step
    text:
      en: Moles of NaOH = 0.150 × 18.0 ÷ 1000 = 0.00270 mol.
  - rung: 4
    name: worked_step
    text:
      en: Moles of HNO₃ = 0.00270 = 0.00270 mol, in 25.0 cm³. Divide by (25.0 ÷ 1000) dm³.
  - rung: 5
    name: full_step
    text:
      en: c(HNO₃) = 0.00270 ÷ (25.0 ÷ 1000) = 0.108 mol/dm³.
  misconception_ids:
  - mc.chm.o.acids_titration_values_swapped
solution:
  steps:
  - n: 1
    latex: n(\text{base}) = 0.150 \times \frac{18.0}{1000} = 0.00270\ \text{mol}
    reason: Moles of alkali
    check_id: chk_build_chm_acids_0070_ab
  - n: 2
    latex: n(\text{acid}) = 0.00270 = 0.00270\ \text{mol}
    reason: Mole ratio from the equation
    check_id: chk_build_chm_acids_0070_ab
  - n: 3
    latex: c = \frac{0.00270}{25.0 \div 1000} = 0.108\ \text{mol/dm}^3
    reason: Amount over volume
    check_id: chk_build_chm_acids_0070_r
