stem: Aluminium is used for overhead power cables and drinks cans.
parts:
- id: a
  prompt: Why is electrolysis needed to obtain the aluminium, even though it costs a lot of electricity?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Electrolysis gives a heavier metal.
      correct: false
    - id: B
      text: Electrolysis is the only way to melt aluminium oxide.
      correct: false
    - id: C
      text: No cheaper chemical reducing agent can remove oxygen from aluminium oxide on a large scale.
      correct: true
    - id: D
      text: Carbon would turn the aluminium into an alloy.
      correct: false
      misconception_id: mc.chm.o.electrolysis_aluminium_by_carbon
      feedback: Carbon can only remove oxygen from oxides of metals less reactive than carbon. Aluminium is more reactive than carbon, so its oxide must be decomposed by electrolysis, even though that uses a lot of electricity.
  hints:
  - rung: 1
    name: orient
    text:
      en: How are metals extracted from their oxides in general?
  - rung: 2
    name: concept
    text:
      en: Metals below carbon are extracted with carbon; metals above it need electrolysis.
  - rung: 3
    name: first_step
    text:
      en: Aluminium is high in the reactivity series.
  - rung: 4
    name: worked_step
    text:
      en: Electrolysis is costly but it is the only practical method for very reactive metals.
  - rung: 5
    name: full_step
    text:
      en: Aluminium is too reactive for carbon to reduce its oxide, so electrolysis is the only practical method.
  misconception_ids:
  - mc.chm.o.electrolysis_aluminium_by_carbon
solution:
  steps:
  - n: 1
    latex: '\text{reactive metal: electrolysis}'
    reason: Above carbon
