      feedback: Strength is about how fully an acid ionises in water. Concentration is about how much acid is in each dm³. A dilute solution of hydrochloric acid is still a strong acid; a concentrated solution of ethanoic acid is still a weak acid.
  hints:
  - rung: 1
    name: orient
    text:
      en: Is ethanoic acid a strong or a weak acid?
  - rung: 2
    name: concept
    text:
      en: A weak acid only partly ionises in water.
  - rung: 3
    name: first_step
    text:
      en: In a weak acid, at any moment only a small fraction of molecules have split into ions.
  - rung: 4
    name: worked_step
    text:
      en: If only a few molecules ionise, what are most of them still?
  - rung: 5
    name: full_step
    text:
      en: Ethanoic acid is weak, so most of it stays as ethanoic acid molecules; only a few ionise.
