stem: A drop of solution P is put on blue litmus paper. The paper turns red.
parts:
- id: a
  prompt: What does this tell you about solution P?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: P is acidic, so its pH is below 7
      correct: true
    - id: B
      text: P is acidic, so its pH is above 7
      correct: false
      misconception_id: mc.chm.o.acids_high_ph_more_acidic
      feedback: 'Picture the pH scale as a line: acids at the low end (below 7), neutral at 7, alkalis at the high end (above 7). The lower the pH, the more acidic the solution.'
    - id: C
      text: P is alkaline, so its pH is below 7
      correct: false
      misconception_id: mc.chm.o.acids_indicator_colours_swapped
      feedback: 'Learn each pair: litmus is red in acid and blue in alkali; methyl orange is red in acid and yellow in alkali; phenolphthalein is colourless in acid and pink in alkali.'
    - id: D
      text: P is alkaline, so its pH is above 7
      correct: false
      misconception_id: mc.chm.o.acids_indicator_colours_swapped
      feedback: 'Learn each pair: litmus is red in acid and blue in alkali; methyl orange is red in acid and yellow in alkali; phenolphthalein is colourless in acid and pink in alkali.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Litmus has one colour in acid and another in alkali. Which colour did the paper turn?
  - rung: 2
    name: concept
    text:
      en: Litmus is red in acid and blue in alkali.
  - rung: 3
    name: first_step
    text:
      en: Decide first whether P is acidic or alkaline, then place it on the pH scale.
  - rung: 4
    name: worked_step
    text:
      en: On the pH scale, neutral is 7. Acids lie on one side of 7 and alkalis on the other.
  - rung: 5
    name: full_step
    text:
      en: Blue litmus turning red shows an acid, and acids have a pH below 7.
  misconception_ids:
  - mc.chm.o.acids_indicator_colours_swapped
  - mc.chm.o.acids_high_ph_more_acidic
solution:
  steps:
  - n: 1
    latex: \text{litmus red} \Rightarrow \text{acid},\ \text{pH} < 7
    reason: Litmus colours and the pH scale
