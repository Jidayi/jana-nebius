stem: A student weighs out 3.2 g of copper(II) sulfate, CuSO₄.
parts:
- id: a
  prompt: Calculate the amount of CuSO₄ in moles.
  marks: 2
  answer:
    kind: numeric
    value: '0.0200'
    unit: mol
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0053_n
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You have a mass of CuSO₄; you want an amount in moles.
  - rung: 2
    name: concept
    text:
      en: Amount (mol) = mass (g) ÷ molar mass (g/mol); the molar mass is Mr in g/mol.
  - rung: 3
    name: first_step
    text:
      en: The molar mass of CuSO₄ is 160 g/mol.
  - rung: 4
    name: worked_step
    text:
      en: Work out 3.2 ÷ 160.
  - rung: 5
    name: full_step
    text:
      en: 3.2 ÷ 160 = 0.0200 mol.
  misconception_ids:
  - mc.chm.o.moles_ratio_inverted
  - mc.chm.o.moles_multiply_mass
solution:
  steps:
  - n: 1
    latex: M(\text{CuSO}_4) = 160\ \text{g/mol}
    reason: Molar mass from Mr
    check_id: chk_build_chm_stoichiometry_0053_mr
  - n: 2
    latex: n = \frac{3.2}{160}
    reason: Amount is mass over molar mass
  - n: 3
    latex: n = 0.0200\ \text{mol}
    reason: Divide
    check_id: chk_build_chm_stoichiometry_0053_n
