id: itm.chm.o.acids.0063
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.titration_calculations
stem: 25.0 cm³ of sulfuric acid is neutralised by 20.0 cm³ of 0.100 mol/dm³ sodium hydroxide solution. The equation is H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O.
parts:
- id: a
  prompt: What is the concentration of the sulfuric acid?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 0.0400 mol/dm³
      correct: true
    - id: B
      text: 0.0625 mol/dm³
      correct: false
      misconception_id: mc.chm.o.acids_titration_values_swapped
      feedback: 'Work in two steps instead of one formula: first moles = concentration × volume for the solution you know everything about, then concentration = moles ÷ volume for the other one.'
    - id: C
      text: 0.0800 mol/dm³
      correct: false
      misconception_id: mc.chm.o.acids_titration_ratio_ignored
      feedback: 'Always write the balanced equation first. H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O: one mole of sulfuric acid needs two moles of alkali.'
    - id: D
      text: 0.160 mol/dm³
      correct: false
      misconception_id: mc.chm.o.acids_titration_ratio_upside_down
      feedback: Ask which substance needs more moles. With sulfuric acid, the alkali needs twice as many moles as the acid, so moles of alkali = 2 × moles of acid.
  hints:
  - rung: 1
    name: orient
    text:
      en: This time you know everything about the alkali, so start with the alkali.
  - rung: 2
    name: concept
    text:
      en: Moles of alkali first; then use the equation to find the moles of acid.
  - rung: 3
    name: first_step
    text:
      en: Moles of NaOH = 0.100 × 20.0 ÷ 1000 = 0.00200 mol.
  - rung: 4
    name: worked_step
    text:
      en: Two NaOH react with one H₂SO₄, so moles of acid = 0.00200 ÷ 2 = 0.00100 mol. Now divide by the acid's volume in dm³.
  - rung: 5
    name: full_step
    text:
      en: c(H₂SO₄) = 0.00100 ÷ (25.0 ÷ 1000) = 0.0400 mol/dm³.
  misconception_ids:
  - mc.chm.o.acids_titration_ratio_ignored
  - mc.chm.o.acids_titration_ratio_upside_down
  - mc.chm.o.acids_titration_values_swapped
solution:
  steps:
  - n: 1
    latex: n(\text{NaOH}) = 0.100 \times \frac{20.0}{1000} = 0.00200
    reason: Moles of alkali
    check_id: chk_build_chm_acids_0063_ab
  - n: 2
    latex: n(\text{H}_2\text{SO}_4) = \frac{0.00200}{2} = 0.00100
    reason: 'Ratio 1 : 2'
    check_id: chk_build_chm_acids_0063_ab
  - n: 3
    latex: c = \frac{0.00100}{25.0 \div 1000} = 0.0400\ \text{mol/dm}^3
    reason: Amount over volume
    check_id: chk_build_chm_acids_0063_ab
