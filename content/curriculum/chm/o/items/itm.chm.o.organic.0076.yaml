type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.polymers
stem: Nylon is made from two different monomers. Each time two monomers join, a small molecule is given off.
parts:
- id: a
  prompt: What type of polymerisation is this?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Addition polymerisation in which the C=C bonds stay in the chain
      correct: false
      misconception_id: mc.chm.o.organic_polymer_keeps_double_bond
      feedback: When an alkene polymerises, each C=C double bond opens into a single bond, and the freed bonds link to the next monomer. The polymer chain has only single C–C bonds.
    - id: B
      text: Addition polymerisation, like making poly(ethene)
      correct: false
      misconception_id: mc.chm.o.organic_addition_condensation_mixed
      feedback: In addition polymerisation, monomers with a C=C bond simply join and nothing else forms. In condensation polymerisation, groups on two monomers react as they join and a small molecule, such as water, is given off each time.
    - id: C
      text: Addition polymerisation of alkane monomers
      correct: false
      misconception_id: mc.chm.o.organic_monomer_is_alkane
      feedback: A monomer for addition polymerisation must have a C=C double bond. Alkanes are saturated and cannot add to one another. Poly(ethene) is made from ethene, not ethane.
    - id: D
      text: Condensation polymerisation
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Look at what else forms besides the polymer.
  - rung: 2
    name: concept
    text:
      en: In addition polymerisation the polymer is the only product.
  - rung: 3
    name: first_step
    text:
      en: Here a small molecule, such as water, is lost each time a link forms.
  - rung: 4
    name: worked_step
    text:
      en: What do chemists call a reaction in which two molecules join and a small molecule is lost?
  - rung: 5
    name: full_step
    text:
      en: A small molecule is given off at each link, so nylon is a condensation polymer.
  misconception_ids:
  - mc.chm.o.organic_addition_condensation_mixed
  - mc.chm.o.organic_monomer_is_alkane
  - mc.chm.o.organic_polymer_keeps_double_bond
solution:
  steps:
  - n: 1
    latex: \text{monomer + monomer }\rightarrow\text{ link + small molecule}
    reason: Condensation polymerisation
