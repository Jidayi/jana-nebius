id: itm.chm.o.stoichiometry.0017
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.balancing_equations
stem: The unbalanced equation is N₂ + H₂ → NH₃.
parts:
- id: a
  prompt: Balance the equation using the smallest whole numbers. What number goes in front of H₂?
  marks: 2
  answer:
    kind: numeric
    value: '3'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0017_ratios
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Count the atoms of each element on each side of N₂ + H₂ → NH₃.
  - rung: 2
    name: concept
    text:
      en: Only the numbers in front of formulae may change; the formulae themselves stay as they are.
  - rung: 3
    name: first_step
    text:
      en: Start with an element that appears in only one substance on each side, and leave elements that appear on their own until last.
  - rung: 4
    name: worked_step
    text:
      en: Adjust one number at a time and recount every element after each change; you should find N₂, 2NH₃.
  - rung: 5
    name: full_step
    text:
      en: 'Balanced: N₂ + 3H₂ → 2NH₃. The number in front of H₂ is 3.'
  misconception_ids:
  - mc.chm.o.subscript_changed_to_balance
  - mc.chm.o.balance_one_element_only
solution:
  steps:
  - n: 1
    latex: \text{N}_2 + 3\text{H}_2 \rightarrow 2\text{NH}_3
    reason: Smallest whole numbers that balance every element
    check_id: chk_build_chm_stoichiometry_0017_bal
  - n: 2
    latex: '\text{H}_2: 3'
    reason: Coefficient of H₂
    check_id: chk_build_chm_stoichiometry_0017_ratios
