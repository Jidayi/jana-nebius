id: itm.chm.o.acids.0062
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.titration_calculations
stem: A student titrates 25.0 cm³ of 0.100 mol/dm³ sulfuric acid with 0.160 mol/dm³ potassium hydroxide solution. The equation is H₂SO₄ + 2KOH → K₂SO₄ + 2H₂O.
parts:
- id: a
  prompt: What volume of potassium hydroxide solution is needed?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 15.6 cm³
      correct: false
      misconception_id: mc.chm.o.acids_titration_ratio_ignored
      feedback: 'Always write the balanced equation first. H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O: one mole of sulfuric acid needs two moles of alkali.'
    - id: B
      text: 7.81 cm³
      correct: false
      misconception_id: mc.chm.o.acids_titration_ratio_upside_down
      feedback: Ask which substance needs more moles. With sulfuric acid, the alkali needs twice as many moles as the acid, so moles of alkali = 2 × moles of acid.
    - id: C
      text: 31.3 cm³
      correct: true
    - id: D
      text: 80.0 cm³
      correct: false
      misconception_id: mc.chm.o.acids_titration_values_swapped
      feedback: 'Work in two steps instead of one formula: first moles = concentration × volume for the solution you know everything about, then concentration = moles ÷ volume for the other one.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the moles of acid, then the moles of alkali needed, then the volume that holds them.
  - rung: 2
    name: concept
    text:
      en: Moles = concentration × volume in dm³; volume = moles ÷ concentration.
  - rung: 3
    name: first_step
    text:
      en: Moles of H₂SO₄ = 0.100 × 25.0 ÷ 1000 = 0.00250 mol.
  - rung: 4
    name: worked_step
    text:
      en: Moles of KOH = 2 × 0.00250 = 0.00500 mol. Divide by 0.160 to get dm³, then multiply by 1000.
  - rung: 5
    name: full_step
    text:
      en: V(KOH) = 0.00500 ÷ 0.160 × 1000 = 31.3 cm³.
  misconception_ids:
  - mc.chm.o.acids_titration_ratio_ignored
  - mc.chm.o.acids_titration_ratio_upside_down
  - mc.chm.o.acids_titration_values_swapped
solution:
  steps:
  - n: 1
    latex: n(\text{H}_2\text{SO}_4) = 0.00250
    reason: Moles of acid
    check_id: chk_build_chm_acids_0062_ab
  - n: 2
    latex: n(\text{KOH}) = 2 \times 0.00250 = 0.00500
    reason: 'Ratio 1 : 2'
    check_id: chk_build_chm_acids_0062_ab
  - n: 3
    latex: V = \frac{0.00500}{0.160} \times 1000 = 31.3\ \text{cm}^3
    reason: Moles over concentration
    check_id: chk_build_chm_acids_0062_r
