stem: Methane, ethane and propane are the first three alkanes.
parts:
- id: a
  prompt: How do their boiling points change from methane to propane, and why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: They fall, because larger molecules move more slowly
      correct: false
    - id: B
      text: They stay the same, because all alkanes have the same functional group
      correct: false
    - id: C
      text: They rise, because more covalent bonds inside each molecule must break
      correct: false
    - id: D
      text: They rise, because larger molecules have stronger forces between them
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Physical properties change gradually along a homologous series.
  - rung: 2
    name: concept
    text:
      en: Boiling separates molecules from each other; it does not break the bonds inside them.
  - rung: 3
    name: first_step
    text:
      en: Propane molecules are larger than methane molecules.
  - rung: 4
    name: worked_step
    text:
      en: Larger molecules attract each other more strongly. What does that mean for the energy needed to boil?
  - rung: 5
    name: full_step
    text:
      en: Boiling points rise along the series, because the forces between molecules get stronger as the molecules get larger.
solution:
  steps:
  - n: 1
    latex: \text{larger molecule, stronger intermolecular forces, higher boiling point}
    reason: Trend in a series
