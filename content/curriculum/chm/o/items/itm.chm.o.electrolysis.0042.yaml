stem: In the extraction of aluminium, the aluminium oxide is dissolved in molten cryolite.
parts:
- id: a
  prompt: Why is cryolite used?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: It is a catalyst that makes the aluminium purer.
      correct: false
    - id: B
      text: It reacts with the oxide ions to stop oxygen forming.
      correct: false
    - id: C
      text: It provides the aluminium ions.
      correct: false
    - id: D
      text: It lowers the melting point, so less energy is needed to keep the electrolyte molten.
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Pure aluminium oxide has a very high melting point.
  - rung: 2
    name: concept
    text:
      en: Keeping a substance molten at a very high temperature costs a lot of energy.
  - rung: 3
    name: first_step
    text:
      en: A solution of aluminium oxide in cryolite melts at a much lower temperature.
  - rung: 4
    name: worked_step
    text:
      en: Think about the cost of electricity and heat.
  - rung: 5
    name: full_step
    text:
      en: Cryolite lowers the operating temperature, saving energy and money; the aluminium oxide still provides the ions.
solution:
  steps:
  - n: 1
    latex: '\text{cryolite: lower melting point}'
    reason: Saves energy
