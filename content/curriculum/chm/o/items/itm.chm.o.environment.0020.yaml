id: itm.chm.o.environment.0020
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.environment.fertilisers
stem: A bag holds 500 g of ammonium nitrate, NH₄NO₃.
parts:
- id: a
  prompt: Calculate the mass of nitrogen, in grams, that the bag supplies to the soil.
  marks: 2
  answer:
    kind: numeric
    value: '175'
    unit: g
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_environment_0020_m
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the fraction of NH₄NO₃ that is nitrogen, then take that fraction of 500 g.
  - rung: 2
    name: concept
    text:
      en: Mass of nitrogen = mass of ammonium nitrate × (mass of N atoms ÷ Mr).
  - rung: 3
    name: first_step
    text:
      en: Mr of NH₄NO₃ is 80, and its two nitrogen atoms have a mass of 28.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 500 g by 28 ÷ 80.
  - rung: 5
    name: full_step
    text:
      en: 500 × 28 ÷ 80 = 175 g of nitrogen.
  misconception_ids:
  - mc.chm.o.environment_n_atoms_count_ignored
  - mc.chm.o.environment_n_percent_inverted
solution:
  steps:
  - n: 1
    latex: M_r(\text{NH}_4\text{NO}_3) = 80
    reason: Relative formula mass of ammonium nitrate
    check_id: chk_build_chm_environment_0020_mr
  - n: 2
    latex: 2 \times 14 = 28
    reason: Mass of nitrogen in one formula unit
    check_id: chk_build_chm_environment_0020_n
  - n: 3
    latex: 500 \times \frac{28}{80} = 175\ \text{g}
    reason: Nitrogen's share of the bag
    check_id: chk_build_chm_environment_0020_m
