stem: A few drops of phenolphthalein are added to solution Q. The solution turns pink.
parts:
- id: a
  prompt: What does this tell you about solution Q?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Q is alkaline, so its pH is above 7
      correct: true
    - id: B
      text: Q is alkaline, so its pH is below 7
      correct: false
      misconception_id: mc.chm.o.acids_high_ph_more_acidic
      feedback: 'Picture the pH scale as a line: acids at the low end (below 7), neutral at 7, alkalis at the high end (above 7). The lower the pH, the more acidic the solution.'
    - id: C
      text: Q is acidic, so its pH is above 7
      correct: false
      misconception_id: mc.chm.o.acids_high_ph_more_acidic
      feedback: 'Picture the pH scale as a line: acids at the low end (below 7), neutral at 7, alkalis at the high end (above 7). The lower the pH, the more acidic the solution.'
    - id: D
      text: Q is acidic, so its pH is below 7
      correct: false
      misconception_id: mc.chm.o.acids_indicator_colours_swapped
      feedback: 'Learn each pair: litmus is red in acid and blue in alkali; methyl orange is red in acid and yellow in alkali; phenolphthalein is colourless in acid and pink in alkali.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Phenolphthalein has two colours. Which colour did Q give?
  - rung: 2
    name: concept
    text:
      en: Phenolphthalein is colourless in acid and pink in alkali.
  - rung: 3
    name: first_step
    text:
      en: Decide whether Q is acidic or alkaline, then think about where that is on the pH scale.
  - rung: 4
    name: worked_step
    text:
      en: Alkalis lie on the high side of pH 7.
  - rung: 5
    name: full_step
    text:
      en: Pink phenolphthalein shows an alkali, and alkalis have a pH above 7.
  misconception_ids:
  - mc.chm.o.acids_indicator_colours_swapped
  - mc.chm.o.acids_high_ph_more_acidic
