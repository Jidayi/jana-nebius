id: itm.chm.o.stoichiometry.0019
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.balancing_equations
stem: The unbalanced equation is NH₃ + O₂ → NO + H₂O.
parts:
- id: a
  prompt: Balance the equation using the smallest whole numbers. What number goes in front of H₂O?
  marks: 2
  answer:
    kind: numeric
    value: '6'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0019_ratios
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Count the atoms of each element on each side of NH₃ + O₂ → NO + H₂O.
  - rung: 2
    name: concept
    text:
      en: Only the numbers in front of formulae may change; the formulae themselves stay as they are.
  - rung: 3
    name: first_step
    text:
      en: Start with an element that appears in only one substance on each side, and leave elements that appear on their own until last.
  - rung: 4
    name: worked_step
    text:
      en: Adjust one number at a time and recount every element after each change; you should find 4NH₃, 5O₂, 4NO.
  - rung: 5
    name: full_step
    text:
      en: 'Balanced: 4NH₃ + 5O₂ → 4NO + 6H₂O. The number in front of H₂O is 6.'
  misconception_ids:
  - mc.chm.o.subscript_changed_to_balance
  - mc.chm.o.balance_one_element_only
solution:
  steps:
  - n: 1
    latex: 4\text{NH}_3 + 5\text{O}_2 \rightarrow 4\text{NO} + 6\text{H}_2\text{O}
    reason: Smallest whole numbers that balance every element
    check_id: chk_build_chm_stoichiometry_0019_bal
  - n: 2
    latex: '\text{H}_2\text{O}: 6'
    reason: Coefficient of H₂O
    check_id: chk_build_chm_stoichiometry_0019_ratios
