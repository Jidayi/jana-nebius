id: itm.chm.o.metals.0061
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.metals.extraction_yield
stem: Magnetite, an iron ore, is reduced by carbon monoxide. The equation is Fe₃O₄ + 4CO → 3Fe + 4CO₂.
parts:
- id: a
  prompt: What mass of iron can be obtained from 11.6 g of Fe₃O₄?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 34.8 g
      correct: false
      misconception_id: mc.chm.o.metals_yield_mass_ratio
      feedback: The equation counts particles, not grams. Change the mass of ore into moles first, use the ratio, then change the moles of metal back into grams.
    - id: B
      text: 8.40 g
      correct: true
    - id: C
      text: 2.80 g
      correct: false
      misconception_id: mc.chm.o.metals_yield_ratio_ignored
      feedback: 'Look at the equation: Fe₂O₃ gives 2Fe. Each mole of iron(III) oxide holds two moles of iron atoms, so multiply by the equation''s ratio before you turn moles back into grams.'
    - id: D
      text: 0.933 g
      correct: false
      misconception_id: mc.chm.o.metals_yield_ratio_inverted
      feedback: 'Write the ratio as ''wanted : given''. For Fe₂O₃ → 2Fe the wanted iron is two for every one of oxide, so moles of iron = moles of oxide × 2.'
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Plan: mass of Fe₃O₄ → moles → ratio from the equation → moles of Fe → mass.'
  - rung: 2
    name: concept
    text:
      en: The numbers in the equation are a ratio of moles, never of grams.
  - rung: 3
    name: first_step
    text:
      en: Moles of Fe₃O₄ = 11.6 ÷ 232 = 0.0500 mol.
  - rung: 4
    name: worked_step
    text:
      en: 'The equation gives 1 Fe₃O₄ : 3 Fe, so moles of Fe = 0.150 mol.'
  - rung: 5
    name: full_step
    text:
      en: Mass of Fe = 0.150 × 56 = 8.40 g.
  misconception_ids:
  - mc.chm.o.metals_yield_ratio_ignored
  - mc.chm.o.metals_yield_mass_ratio
  - mc.chm.o.metals_yield_ratio_inverted
solution:
  steps:
  - n: 1
    latex: n(\text{Fe}_3\text{O}_4) = \frac{11.6}{232} = 0.0500\ \text{mol}
    reason: Mass to moles
    check_id: chk_build_chm_metals_0061_ma
  - n: 2
    latex: '\text{Fe}_3\text{O}_4 : \text{Fe} = 1 : 3'
    reason: Ratio from the equation
    check_id: chk_build_chm_metals_0061_coef
  - n: 3
    latex: n(\text{Fe}) = 0.150\ \text{mol}
    reason: Mole ratio from the equation
    check_id: chk_build_chm_metals_0061_chain
  - n: 4
    latex: m(\text{Fe}) = 0.150 \times 56 = 8.40\ \text{g}
    reason: Moles to mass
    check_id: chk_build_chm_metals_0061_mb
