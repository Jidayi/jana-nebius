id: itm.chm.o.organic.0021
version: 0.1.0
type: mcq
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.naming
stem: An alcohol has the structure CH₃CH₂CH₂OH, with the –OH group on the end carbon atom.
parts:
- id: a
  prompt: What is its name?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Propanol (propan-1-ol)
      correct: true
    - id: B
      text: Butanol
      correct: false
      misconception_id: mc.chm.o.organic_prefix_order_mixed
      feedback: 'Learn the order: meth- means one carbon atom, eth- two, prop- three and but- four. A memory aid: Monkeys Eat Peeled Bananas.'
    - id: C
      text: Ethanol
      correct: false
      misconception_id: mc.chm.o.organic_prefix_wrong_atoms
      feedback: The prefix counts every carbon atom in the molecule, including the carbon inside –COOH. CH₃COOH has two carbon atoms, so it is ethanoic acid. Hydrogen atoms never set the prefix.
    - id: D
      text: Propane
      correct: false
      misconception_id: mc.chm.o.organic_ending_wrong_series
      feedback: 'The ending names the family: -ane for alkanes, -ene for alkenes, -ol for alcohols and -oic acid for carboxylic acids. Find the functional group first, then choose the ending.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Count the carbon atoms along the chain CH₃CH₂CH₂OH.
  - rung: 2
    name: concept
    text:
      en: An –OH group gives the ending -ol.
  - rung: 3
    name: first_step
    text:
      en: There is a CH₃, then a CH₂, then another CH₂ carrying the –OH.
  - rung: 4
    name: worked_step
    text:
      en: 'Three carbon atoms: which prefix is that?'
  - rung: 5
    name: full_step
    text:
      en: 'Three carbon atoms (prop-) and an –OH group: propanol, also written propan-1-ol.'
  misconception_ids:
  - mc.chm.o.organic_ending_wrong_series
  - mc.chm.o.organic_prefix_wrong_atoms
  - mc.chm.o.organic_prefix_order_mixed
solution:
  steps:
  - n: 1
    latex: \text{3 C, –OH}
    reason: Prefix and family
