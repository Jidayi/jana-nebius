- kc.chm.o.reactions.collision_theory
stem: Zinc reacts quickly with dilute acid at first, but the bubbling slows down and then stops.
parts:
- id: a
  prompt: Why does the reaction slow down?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: The activation energy rises as the reaction goes on.
      correct: false
    - id: B
      text: The hydrogen formed acts as a catalyst for the backward reaction.
      correct: false
    - id: C
      text: The zinc becomes too hot to react.
      correct: false
    - id: D
      text: The acid is used up, so its concentration falls and collisions become less frequent.
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: What happens to the amounts of the reactants as the reaction goes on?
  - rung: 2
    name: concept
    text:
      en: The rate depends on how often reactant particles collide.
  - rung: 3
    name: first_step
    text:
      en: As acid particles react, fewer are left in each cm³.
  - rung: 4
    name: worked_step
    text:
      en: Fewer reactant particles means fewer collisions each second.
  - rung: 5
    name: full_step
    text:
      en: 'The reaction slows because the reactants are used up: the concentration of acid falls, so collisions happen less often.'
solution:
  steps:
  - n: 1
    latex: '\text{reactants used up: fewer collisions}'
    reason: Rate falls
