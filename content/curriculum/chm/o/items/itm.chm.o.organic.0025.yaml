id: itm.chm.o.organic.0025
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.general_formulae
stem: A molecule of an alkene has 4 carbon atoms. The series has the general formula CₙH₂ₙ.
parts:
- id: a
  prompt: Which gives its molecular formula and relative molecular mass?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: C₄H₁₀, Mr 58
      correct: false
      misconception_id: mc.chm.o.organic_gf_wrong_series
      feedback: 'Match the formula to the family: alkanes CₙH₂ₙ₊₂, alkenes CₙH₂ₙ, alcohols CₙH₂ₙ₊₁OH, carboxylic acids CₙH₂ₙ₊₁COOH. Check: an alkene has exactly twice as many hydrogen atoms as carbon atoms.'
    - id: B
      text: C₄H₈, Mr 56
      correct: true
    - id: C
      text: C₄H₆, Mr 54
      correct: false
      misconception_id: mc.chm.o.organic_gf_wrong_series
      feedback: 'Match the formula to the family: alkanes CₙH₂ₙ₊₂, alkenes CₙH₂ₙ, alcohols CₙH₂ₙ₊₁OH, carboxylic acids CₙH₂ₙ₊₁COOH. Check: an alkene has exactly twice as many hydrogen atoms as carbon atoms.'
    - id: D
      text: C₄H₈, Mr 48
      correct: false
      misconception_id: mc.chm.o.organic_gf_hydrogen_mass_ignored
      feedback: 'Every atom adds its mass. Hydrogen atoms are light, but there are many of them: each CH₂ unit has a mass of 14, not 12.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Put n = 4 into CₙH₂ₙ, then add the masses of all the atoms.
  - rung: 2
    name: concept
    text:
      en: 'Use Ar: C = 12, H = 1. The hydrogen atoms count as well as the carbon atoms.'
  - rung: 3
    name: first_step
    text:
      en: Hydrogen atoms in the chain = 2 × 4 = 8.
  - rung: 4
    name: worked_step
    text:
      en: The formula is C₄H₈. Add 4 × 12 for the carbon and 1 for each hydrogen atom.
  - rung: 5
    name: full_step
    text:
      en: 'C₄H₈: Mr = 56.'
  misconception_ids:
  - mc.chm.o.organic_gf_wrong_series
  - mc.chm.o.organic_gf_hydrogen_mass_ignored
solution:
  steps:
  - n: 1
    latex: H = 2 \times 4 = 8
    reason: Hydrogen atoms from the general formula
    check_id: chk_build_chm_organic_0025_h
  - n: 2
    latex: M_r(\text{C}_4\text{H}_8) = 56
    reason: Sum of the Ar values
    check_id: chk_build_chm_organic_0025_mr
