  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: In the ion MnO₄⁻ the oxidation numbers of all the atoms add up to the overall charge, -1.
  - rung: 2
    name: concept
    text:
      en: 'Every oxygen atom in the ion MnO₄⁻ counts: multiply its oxidation number by the number of atoms.'
  - rung: 3
    name: first_step
    text:
      en: 'Let the oxidation number of manganese be x and write the sum: x + 4(-2) = -1.'
  - rung: 4
    name: worked_step
    text:
      en: 'Get x on its own in x + 4(-2) = -1: move the oxygen total across and change its sign.'
  - rung: 5
    name: full_step
    text:
      en: x = -1 - 4(-2) = +7, so manganese has oxidation number +7.
