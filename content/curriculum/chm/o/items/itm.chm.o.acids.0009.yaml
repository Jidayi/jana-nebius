stem: Sodium carbonate powder is added to dilute hydrochloric acid. The gas given off is bubbled through limewater.
parts:
- id: a
  prompt: What is seen in the limewater, and why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: It turns milky, because the gas is hydrogen
      correct: false
      misconception_id: mc.chm.o.acids_wrong_gas
      feedback: Look at what the acid reacts with. A metal gives hydrogen. A carbonate gives carbon dioxide, because the carbonate contains carbon and oxygen. An oxide or hydroxide gives only a salt and water, with no gas.
    - id: B
      text: It turns milky, because the gas is carbon dioxide
      correct: true
    - id: C
      text: Nothing happens, because the gas is hydrogen
      correct: false
      misconception_id: mc.chm.o.acids_wrong_gas
      feedback: Look at what the acid reacts with. A metal gives hydrogen. A carbonate gives carbon dioxide, because the carbonate contains carbon and oxygen. An oxide or hydroxide gives only a salt and water, with no gas.
    - id: D
      text: It turns blue, because the gas is alkaline
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Sodium carbonate is a carbonate. Which gas do carbonates give with acids?
  - rung: 2
    name: concept
    text:
      en: Carbonate + acid → salt + water + carbon dioxide.
  - rung: 3
    name: first_step
    text:
      en: Limewater is the test for one particular gas.
  - rung: 4
    name: worked_step
    text:
      en: Carbon dioxide reacts with limewater to make a fine white solid.
  - rung: 5
    name: full_step
    text:
      en: Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂. The carbon dioxide turns limewater milky.
  misconception_ids:
  - mc.chm.o.acids_wrong_gas
solution:
  steps:
  - n: 1
    latex: \text{Na}_2\text{CO}_3 + 2\text{HCl} \rightarrow 2\text{NaCl} + \text{H}_2\text{O} + \text{CO}_2
    reason: Carbonate + acid gives carbon dioxide
    check_id: chk_build_chm_acids_0009_bal
  - n: 2
    latex: \text{CO}_2 \text{ turns limewater milky}
    reason: Test for carbon dioxide
