stem: Limestone (calcium carbonate) is added to the blast furnace with the iron ore and coke.
parts:
- id: a
  prompt: What is the job of the limestone?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: It burns to heat the furnace.
      correct: false
    - id: B
      text: It reduces the iron(III) oxide to iron.
      correct: false
      misconception_id: mc.chm.o.metals_reduction_gains_oxygen
      feedback: Reduction is LOSS of oxygen. In extraction the metal oxide loses its oxygen and becomes the metal; the carbon or carbon monoxide gains that oxygen and is oxidised.
    - id: C
      text: It removes impurities such as sand (silicon dioxide) as slag.
      correct: true
    - id: D
      text: It adds calcium to make the iron harder.
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The iron ore is not pure; it contains rocky material.
  - rung: 2
    name: concept
    text:
      en: Limestone breaks down in the heat to calcium oxide, a basic oxide.
  - rung: 3
    name: first_step
    text:
      en: Sand (silicon dioxide) is an acidic oxide.
  - rung: 4
    name: worked_step
    text:
      en: Think about what a basic oxide does to an acidic one.
  - rung: 5
    name: full_step
    text:
      en: Calcium oxide reacts with the silicon dioxide to form slag (calcium silicate), removing the impurity.
  misconception_ids:
  - mc.chm.o.metals_reduction_gains_oxygen
solution:
  steps:
  - n: 1
    latex: \text{CaO + SiO}_2 \rightarrow \text{CaSiO}_3
    reason: Slag removes impurities
