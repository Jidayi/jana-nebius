stem: Zinc reacts with dilute sulfuric acid. 60 cm³ of hydrogen is collected at room temperature and pressure in the first 25 s. One mole of any gas occupies 24 dm³ under these conditions.
parts:
- id: a
  prompt: Calculate the mean rate of production of hydrogen over the first 25 s, in mol/s.
  marks: 3
  answer:
    kind: numeric
    value: '0.000100'
    unit: mol/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_reactions_0042_r
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The rate is wanted in moles per second, so change the gas volume into moles first.
  - rung: 2
    name: concept
    text:
      en: Moles of gas = volume in dm³ ÷ 24; then mean rate = moles ÷ time.
  - rung: 3
    name: first_step
    text:
      en: 60 cm³ is 60 ÷ 1000 dm³, so moles = 60 ÷ 1000 ÷ 24 = 0.0025 mol.
  - rung: 4
    name: worked_step
    text:
      en: Divide 0.0025 mol by the time, 25 s.
  - rung: 5
    name: full_step
    text:
      en: 0.0025 ÷ 25 = 0.000100 mol/s.
  misconception_ids:
  - mc.chm.o.reactions_rate_inverted
solution:
  steps:
  - n: 1
    latex: n = \frac{60}{1000 \times 24} = 0.0025\ \text{mol}
    reason: Volume to moles
    check_id: chk_build_chm_reactions_0042_n
  - n: 2
    latex: \text{rate} = \frac{0.0025}{25} = 0.000100\ \text{mol/s}
    reason: Moles ÷ time
    check_id: chk_build_chm_reactions_0042_r
