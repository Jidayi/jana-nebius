id: itm.chm.o.environment.0015
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.environment.fertilisers
stem: A farmer compares fertilisers. One of them is urea, CO(NH₂)₂.
parts:
- id: a
  prompt: What is the percentage by mass of nitrogen in urea?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 23.3%
      correct: false
      misconception_id: mc.chm.o.environment_n_atoms_count_ignored
      feedback: Count every nitrogen atom in the formula, including those in brackets and in both ions. NH₄NO₃ has two nitrogen atoms, so the nitrogen mass is 2 × 14 = 28.
    - id: B
      text: '0.467'
      correct: false
      misconception_id: mc.chm.o.environment_percent_not_times_100
      feedback: 'A fraction becomes a percentage when you multiply by 100: a fraction of 0.35 is 35%.'
    - id: C
      text: 214%
      correct: false
      misconception_id: mc.chm.o.environment_n_percent_inverted
      feedback: 'The nitrogen is part of the whole compound, so its percentage must be below 100. Put the nitrogen mass on top: % N = mass of N ÷ Mr × 100.'
    - id: D
      text: 46.7%
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You need the share of the mass of CO(NH₂)₂ that is nitrogen.
  - rung: 2
    name: concept
    text:
      en: '% nitrogen in urea = (number of N atoms × 14) ÷ Mr × 100.'
  - rung: 3
    name: first_step
    text:
      en: 'Mr of CO(NH₂)₂ is 60. Count the nitrogen atoms: one in each of the two NH₂ groups.'
  - rung: 4
    name: worked_step
    text:
      en: The two nitrogen atoms have a mass of 28; divide this by 60, then multiply by 100.
  - rung: 5
    name: full_step
    text:
      en: 28 ÷ 60 × 100 = 46.7% nitrogen in urea.
  misconception_ids:
  - mc.chm.o.environment_n_atoms_count_ignored
  - mc.chm.o.environment_n_percent_inverted
  - mc.chm.o.environment_percent_not_times_100
solution:
  steps:
  - n: 1
    latex: M_r(\text{CO(NH}_2\text{)}_2) = 60
    reason: Relative formula mass of urea
    check_id: chk_build_chm_environment_0015_mr
  - n: 2
    latex: 2 \times 14 = 28
    reason: Mass of the nitrogen atoms
    check_id: chk_build_chm_environment_0015_n
  - n: 3
    latex: \% N = \frac{28}{60} \times 100 = 46.7\%
    reason: Part over whole, times 100
    check_id: chk_build_chm_environment_0015_pct
