  - rung: 2
    name: concept
    text:
      en: The ground must warm up before it can give off heat.
  - rung: 3
    name: first_step
    text:
      en: Heat leaves the warm Earth as infrared radiation.
  - rung: 4
    name: worked_step
    text:
      en: Greenhouse gases act on the infrared on its way out, before the result.
  - rung: 5
    name: full_step
    text:
      en: Sunlight in, surface warms, infrared out, gases absorb and re-emit, surface stays warm.
