stem: A student explains the greenhouse effect.
parts:
- id: a
  prompt: Put the steps of the explanation in order.
  marks: 2
  answer:
    kind: ordering
    scoring: adjacent_pairs
    elements:
    - id: s1
      text: Sunlight passes through the atmosphere.
    - id: s4
      text: Greenhouse gases absorb the infrared and re-emit some of it back towards the surface.
    - id: s5
      text: The lower atmosphere and the surface stay warmer.
    - id: s3
      text: The warm surface gives off infrared radiation.
    - id: s2
      text: The Earth's surface absorbs it and warms up.
    correct_order:
    - s1
    - s2
    - s3
    - s4
    - s5
  hints:
