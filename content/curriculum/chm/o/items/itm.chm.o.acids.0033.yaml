id: itm.chm.o.acids.0033
version: 0.1.0
type: mcq
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.strong_and_weak
stem: A bottle is labelled 'dilute hydrochloric acid'.
parts:
- id: a
  prompt: What does the word 'dilute' tell you?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: The solution is neutral
      correct: false
    - id: B
      text: The acid has no hydrogen ions
      correct: false
      misconception_id: mc.chm.o.acids_weak_not_ionised
      feedback: 'A weak acid is partly ionised: most molecules stay whole, but some give H⁺ ions. That is why ethanoic acid still turns indicators red or orange, conducts a little and reacts slowly with metals.'
    - id: C
      text: There is only a small amount of acid in each dm³ of solution
      correct: true
    - id: D
      text: The acid is weak and only partly ionised
      correct: false
      misconception_id: mc.chm.o.acids_strong_means_concentrated
      feedback: Strength is about how fully an acid ionises in water. Concentration is about how much acid is in each dm³. A dilute solution of hydrochloric acid is still a strong acid; a concentrated solution of ethanoic acid is still a weak acid.
  hints:
  - rung: 1
    name: orient
    text:
      en: Is 'dilute' about how much acid is present, or about how it ionises?
  - rung: 2
    name: concept
    text:
      en: Dilute and concentrated describe the amount of acid dissolved in each dm³.
  - rung: 3
    name: first_step
    text:
      en: Strong and weak describe how fully the acid ionises.
  - rung: 4
    name: worked_step
    text:
      en: Hydrochloric acid is strong whatever its concentration.
  - rung: 5
    name: full_step
    text:
      en: '''Dilute'' means only a small amount of acid in each dm³; it is still the strong acid hydrochloric acid.'
  misconception_ids:
  - mc.chm.o.acids_strong_means_concentrated
  - mc.chm.o.acids_weak_not_ionised
solution:
  steps:
  - n: 1
    latex: '\text{dilute: low concentration}'
    reason: Concentration, not strength
