id: itm.chm.o.electrolysis.0034
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.electrolysis.half_equations
stem: 'Concentrated aqueous sodium chloride is electrolysed. At the anode: 2Cl⁻ → Cl₂ + ne⁻.'
parts:
- id: a
  prompt: How many electrons, n, are in the balanced half-equation?
  marks: 1
  answer:
    kind: numeric
    value: '2'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_electrolysis_0034_n
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Use the charges of the particles to find the number of electrons.
  - rung: 2
    name: concept
    text:
      en: The total charge must be the same on both sides.
  - rung: 3
    name: first_step
    text:
      en: Each chloride ion carries one negative charge, and the chlorine molecule is neutral.
  - rung: 4
    name: worked_step
    text:
      en: The electrons must carry away the charge of both chloride ions.
  - rung: 5
    name: full_step
    text:
      en: '2Cl⁻ → Cl₂ + 2e⁻: n = 2, so the charges balance.'
  misconception_ids:
  - mc.chm.o.electrolysis_half_charge_unbalanced
solution:
  steps:
  - n: 1
    latex: '\text{left: } -2;\ \text{right without electrons: } 0'
    reason: Charges before electrons
    check_id: chk_build_chm_electrolysis_0034_l
  - n: 2
    latex: n = 0 - (-2) = 2
    reason: Electrons carry the difference
    check_id: chk_build_chm_electrolysis_0034_n
  - n: 3
    latex: 2\text{Cl}^{-} \rightarrow \text{Cl}_2 + 2e^{-}
    reason: Balanced half-equation
    check_id: chk_build_chm_electrolysis_0034_bal
