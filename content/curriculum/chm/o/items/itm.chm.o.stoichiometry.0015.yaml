id: itm.chm.o.stoichiometry.0015
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.balancing_equations
stem: The unbalanced equation is Fe₂O₃ + CO → Fe + CO₂.
parts:
- id: a
  prompt: Balance the equation using the smallest whole numbers. What number goes in front of CO₂?
  marks: 2
  answer:
    kind: numeric
    value: '3'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0015_ratios
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Count the atoms of each element on each side of Fe₂O₃ + CO → Fe + CO₂.
  - rung: 2
    name: concept
    text:
      en: Only the numbers in front of formulae may change; the formulae themselves stay as they are.
  - rung: 3
    name: first_step
    text:
      en: Start with an element that appears in only one substance on each side, and leave elements that appear on their own until last.
  - rung: 4
    name: worked_step
    text:
      en: Adjust one number at a time and recount every element after each change; you should find Fe₂O₃, 2Fe.
  - rung: 5
    name: full_step
    text:
      en: 'Balanced: Fe₂O₃ + 3CO → 2Fe + 3CO₂. The number in front of CO₂ is 3.'
  misconception_ids:
  - mc.chm.o.subscript_changed_to_balance
  - mc.chm.o.balance_one_element_only
solution:
  steps:
  - n: 1
    latex: \text{Fe}_2\text{O}_3 + 3\text{CO} \rightarrow 2\text{Fe} + 3\text{CO}_2
    reason: Smallest whole numbers that balance every element
    check_id: chk_build_chm_stoichiometry_0015_bal
  - n: 2
    latex: '\text{CO}_2: 3'
    reason: Coefficient of CO₂
    check_id: chk_build_chm_stoichiometry_0015_ratios
