id: itm.chm.o.metals.0024
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.metals.reactivity_series
stem: A piece of magnesium is placed in copper(II) sulfate solution.
parts:
- id: a
  prompt: What happens?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Bubbles of oxygen form as magnesium reacts with the water in the solution.
      correct: false
      misconception_id: mc.chm.o.metals_gas_is_oxygen
      feedback: 'The metal takes the oxygen (or the non-metal part) and keeps it, so it is hydrogen that is set free. The gas burns with a squeaky pop: that is the test for hydrogen.'
    - id: B
      text: 'Magnesium displaces copper: a brown coating of copper forms, because magnesium is more reactive than copper.'
      correct: true
    - id: C
      text: 'No reaction: a more reactive metal stays as the metal and only a less reactive one can push copper out.'
      correct: false
      misconception_id: mc.chm.o.metals_displacement_reversed
      feedback: 'A metal can only take the place of a metal BELOW it in the reactivity series. Find both metals in the series: if the free metal is higher, it displaces the other; if it is lower, nothing happens.'
    - id: D
      text: No reaction, because copper is more reactive than magnesium.
      correct: false
      misconception_id: mc.chm.o.metals_displacement_reversed
      feedback: 'A metal can only take the place of a metal BELOW it in the reactivity series. Find both metals in the series: if the free metal is higher, it displaces the other; if it is lower, nothing happens.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Find magnesium and copper in the reactivity series.
  - rung: 2
    name: concept
    text:
      en: A metal displaces another metal from a solution of its salt only if it is more reactive.
  - rung: 3
    name: first_step
    text:
      en: 'Order: K, Na, Ca, Mg, Al, Zn, Fe, Cu, Ag, Au. Where are magnesium and copper?'
  - rung: 4
    name: worked_step
    text:
      en: Magnesium is higher than copper, so decide which metal ends up in the solution as ions.
  - rung: 5
    name: full_step
    text:
      en: 'Magnesium is above copper, so it displaces copper: a brown coating of copper appears and magnesium ions go into solution.'
  misconception_ids:
  - mc.chm.o.metals_displacement_reversed
  - mc.chm.o.metals_gas_is_oxygen
solution:
  steps:
  - n: 1
    latex: \text{magnesium above copper}
    reason: Position in the reactivity series
  - n: 2
    latex: \text{displacement}
    reason: Only a higher metal displaces
