id: itm.chm.o.stoichiometry.0050
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.moles_and_mass
stem: A gas jar contains 14.2 g of chlorine gas, Cl₂.
parts:
- id: a
  prompt: What amount of Cl₂, in moles, is in the jar?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 5.00 mol
      correct: false
      misconception_id: mc.chm.o.moles_ratio_inverted
      feedback: 'Amount (mol) = mass (g) ÷ molar mass (g/mol). Check the units: g ÷ g/mol gives mol.'
    - id: B
      text: 0.200 mol
      correct: true
    - id: C
      text: 0.400 mol
      correct: false
      misconception_id: mc.chm.o.diatomic_as_atoms
      feedback: 'Oxygen, hydrogen, nitrogen and chlorine gases are made of molecules of two atoms: use O₂ = 32, not 16.'
    - id: D
      text: 1010 mol
      correct: false
      misconception_id: mc.chm.o.moles_multiply_mass
      feedback: 'Try easy numbers: 36 g of water (M = 18 g/mol) is 2 mol, so you divide the mass by the molar mass.'
  hints:
  - rung: 1
    name: orient
    text:
      en: You know the mass of chlorine and want the amount in moles.
  - rung: 2
    name: concept
    text:
      en: Amount (mol) = mass (g) ÷ molar mass (g/mol).
  - rung: 3
    name: first_step
    text:
      en: 'Chlorine gas is made of Cl₂ molecules, so use the molar mass of Cl₂, not of one Cl atom: it is 71 g/mol.'
  - rung: 4
    name: worked_step
    text:
      en: Work out 14.2 ÷ 71.
  - rung: 5
    name: full_step
    text:
      en: 14.2 ÷ 71 = 0.200 mol.
  misconception_ids:
  - mc.chm.o.moles_ratio_inverted
  - mc.chm.o.moles_multiply_mass
  - mc.chm.o.diatomic_as_atoms
solution:
  steps:
  - n: 1
    latex: M(\text{Cl}_2) = 71\ \text{g/mol}
    reason: Molar mass of the molecule
    check_id: chk_build_chm_stoichiometry_0050_mr
  - n: 2
    latex: n = \frac{14.2}{71} = 0.200\ \text{mol}
    reason: Mass divided by molar mass
    check_id: chk_build_chm_stoichiometry_0050_n
