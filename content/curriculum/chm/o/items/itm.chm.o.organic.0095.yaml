stem: Pentane, C₅H₁₂, burns completely in air. The unbalanced equation is C₅H₁₂ + O₂ → CO₂ + H₂O.
parts:
- id: a
  prompt: Balance the equation using the smallest whole numbers. What number goes in front of O₂?
  marks: 2
  answer:
    kind: numeric
    value: '8'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_organic_0095_ratios
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'When pentane burns completely, the only products are carbon dioxide and water: C₅H₁₂ + O₂ → CO₂ + H₂O.'
  - rung: 2
    name: concept
    text:
      en: Balance carbon first, then hydrogen, and leave oxygen until last, because oxygen turns up in both products when pentane burns.
  - rung: 3
    name: first_step
    text:
      en: One C₅H₁₂ molecule gives 5 CO₂ (from its carbon) and 6 H₂O (from its hydrogen).
  - rung: 4
    name: worked_step
    text:
      en: 'For one C₅H₁₂: oxygen atoms on the right = 2 × 5 + 6 = 16. Each O₂ molecule supplies two of them.'
  - rung: 5
    name: full_step
    text:
      en: 'Balanced: C₅H₁₂ + 8O₂ → 5CO₂ + 6H₂O. The number in front of O₂ is 8.'
  misconception_ids:
  - mc.chm.o.organic_combustion_not_lowest
  - mc.chm.o.organic_oxygen_formula_changed
solution:
  steps:
  - n: 1
    latex: '\text{one }\text{C}_5\text{H}_{12}: 5\text{CO}_2 + 6\text{H}_2\text{O}'
    reason: Carbon and hydrogen first
    check_id: chk_build_chm_organic_0095_one
  - n: 2
    latex: 2 \times 5 + 6 = 16
    reason: Oxygen atoms needed on the right
    check_id: chk_build_chm_organic_0095_oright
  - n: 3
    latex: \text{C}_5\text{H}_{12} + 8\text{O}_2 \rightarrow 5\text{CO}_2 + 6\text{H}_2\text{O}
    reason: Smallest whole numbers
    check_id: chk_build_chm_organic_0095_bal
  - n: 4
    latex: '\text{O}_2: 8'
    reason: Coefficient of O₂
    check_id: chk_build_chm_organic_0095_ratios
