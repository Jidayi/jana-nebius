id: itm.chm.o.stoichiometry.0040
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.percentage_composition
stem: Ethanol, C₂H₅OH contains the element C.
parts:
- id: a
  prompt: What is the percentage by mass of C in C₂H₅OH?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 52.2%
      correct: true
    - id: B
      text: '0.522'
      correct: false
      misconception_id: mc.chm.o.percent_ar_over_mr_no_100
      feedback: 'A percentage is a fraction of 100: multiply the fraction by 100.'
    - id: C
      text: 192%
      correct: false
      misconception_id: mc.chm.o.percent_inverted
      feedback: A part is smaller than the whole, so the percentage of one element is always below 100.
    - id: D
      text: 26.1%
      correct: false
      misconception_id: mc.chm.o.percent_count_ignored
      feedback: 'The top of the fraction is the mass of all the atoms of that element in the formula: number of atoms × Ar.'
  hints:
  - rung: 1
    name: orient
    text:
      en: You need the share of the mass of C₂H₅OH that is C.
  - rung: 2
    name: concept
    text:
      en: Percentage by mass = (number of atoms × Ar of the element) ÷ Mr × 100.
  - rung: 3
    name: first_step
    text:
      en: Mr of C₂H₅OH is 46.
  - rung: 4
    name: worked_step
    text:
      en: The C atoms in C₂H₅OH have a total mass of 24; divide this by 46.
  - rung: 5
    name: full_step
    text:
      en: 24 ÷ 46 × 100 = 52.2%.
  misconception_ids:
  - mc.chm.o.percent_count_ignored
  - mc.chm.o.percent_inverted
  - mc.chm.o.percent_ar_over_mr_no_100
solution:
  steps:
  - n: 1
    latex: M_r = 46
    reason: Relative formula mass of C₂H₅OH
    check_id: chk_build_chm_stoichiometry_0040_mr
  - n: 2
    latex: \text{C}_2 = 24
    reason: Mass of the C atoms
    check_id: chk_build_chm_stoichiometry_0040_el
  - n: 3
    latex: \% = \frac{24}{46} \times 100 = 52.2\%
    reason: Fraction of the whole
    check_id: chk_build_chm_stoichiometry_0040_pct
