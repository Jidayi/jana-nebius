subject: chm
level: o
kc_ids:
- kc.chm.o.reactions.physical_chemical_change
stem: A spoonful of sugar is stirred into warm water. After a while the sugar can no longer be seen, but the water tastes sweet.
parts:
- id: a
  prompt: Which statement is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 'It is a chemical change: the sugar has been used up, so its mass has gone.'
      correct: false
      misconception_id: mc.chm.o.reactions_dissolving_is_chemical
      feedback: 'When salt or sugar dissolves, its particles spread out between the water particles. Nothing new forms: evaporate the water and the same solid is left, with the same mass. Dissolving is a physical change.'
    - id: B
      text: 'It is a chemical change: the sugar has melted, and liquid sugar is a new substance.'
      correct: false
      misconception_id: mc.chm.o.reactions_state_change_is_chemical
      feedback: Ice, liquid water and steam are all the same substance, made of the same water molecules. A change of state only changes how close together the particles are and how they move. No new substance forms, so it is a physical change.
    - id: C
      text: 'It is a physical change: the sugar particles have spread out between the water particles.'
      correct: true
    - id: D
      text: 'It is a chemical change: the sugar has reacted with the water to make a new sweet substance.'
      correct: false
      misconception_id: mc.chm.o.reactions_dissolving_is_chemical
      feedback: 'When salt or sugar dissolves, its particles spread out between the water particles. Nothing new forms: evaporate the water and the same solid is left, with the same mass. Dissolving is a physical change.'
  hints:
  - rung: 1
    name: orient
    text:
      en: The water still tastes sweet. What does that tell you about the sugar?
  - rung: 2
    name: concept
    text:
      en: Dissolving mixes the particles of a solid with the particles of a liquid. Nothing new is made.
  - rung: 3
    name: first_step
    text:
      en: If you evaporated the water, what would be left in the dish?
  - rung: 4
    name: worked_step
    text:
      en: Sugar does not melt in warm water; it dissolves. Decide whether dissolving makes a new substance.
  - rung: 5
    name: full_step
    text:
      en: 'It is physical: the sugar is still sugar, spread through the water, and evaporating the water gives it back.'
  misconception_ids:
  - mc.chm.o.reactions_dissolving_is_chemical
  - mc.chm.o.reactions_state_change_is_chemical
solution:
  steps:
  - n: 1
    latex: '\text{sugar + water: a solution, no new substance}'
    reason: Dissolving is physical
