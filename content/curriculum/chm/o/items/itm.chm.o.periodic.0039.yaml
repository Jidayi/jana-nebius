stem: Iron forms two chlorides, FeCl₂ and FeCl₃.
parts:
- id: a
  prompt: Which statement explains this?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: FeCl₃ must be a mixture, because iron forms only one ion.
      correct: false
      misconception_id: mc.chm.o.periodic_transition_one_charge
      feedback: Transition elements can form ions with different charges; the Roman numeral in the name gives the charge.
    - id: B
      text: Iron is so reactive that it takes extra chlorine, like sodium.
      correct: false
      misconception_id: mc.chm.o.periodic_transition_like_group1
      feedback: Iron and copper are hard, dense and melt at high temperatures, and they react slowly. Sodium is soft, light and melts below 100 °C.
    - id: C
      text: Both chlorides are white powders with the same properties.
      correct: false
      misconception_id: mc.chm.o.periodic_transition_white_compounds
      feedback: 'Copper(II) sulfate solution is blue and iron(III) compounds are orange-brown: transition metal compounds are usually coloured.'
    - id: D
      text: Iron can form ions with a 2+ charge and with a 3+ charge.
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Iron forms two chlorides, FeCl₂ and FeCl₃. Think about the typical properties of transition elements.
  - rung: 2
    name: concept
    text:
      en: Transition elements are hard, dense metals with high melting points; they form coloured compounds, ions with different charges, and act as catalysts.
  - rung: 3
    name: first_step
    text:
      en: 'Group I metals are the opposite in most physical properties: soft, light, low melting.'
  - rung: 4
    name: worked_step
    text:
      en: Check each statement against these typical properties.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Iron can form ions with a 2+ charge and with a 3+ charge.'
  misconception_ids:
