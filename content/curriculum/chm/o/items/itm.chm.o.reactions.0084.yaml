stem: The dichromate ion (Cr₂O₇²⁻) contains chromium. Oxygen has oxidation number -2, and the overall charge on the ion is -2.
parts:
- id: a
  prompt: What is the oxidation number of chromium in the dichromate ion (Cr₂O₇²⁻)?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: −6
      correct: false
      misconception_id: mc.chm.o.reactions_oxnum_sign_flipped
      feedback: 'When you move a number to the other side of an equation, its sign changes. Check your answer: put it back into the sum and make sure the total equals the overall charge.'
    - id: B
      text: '+12'
      correct: false
      misconception_id: mc.chm.o.reactions_oxnum_count_ignored
      feedback: Each atom counts. In SO₄²⁻ there are four oxygen atoms, so oxygen contributes four lots of −2. In Cr₂O₇²⁻ there are two chromium atoms sharing the total.
    - id: C
      text: '+7'
      correct: false
      misconception_id: mc.chm.o.reactions_oxnum_charge_ignored
      feedback: In a compound the oxidation numbers add up to zero, but in an ion they add up to the charge on the ion. For SO₄²⁻ the total must be −2, not zero.
    - id: D
      text: '+6'
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The dichromate ion (Cr₂O₇²⁻) carries a charge, so its oxidation numbers do not add up to zero.
  - rung: 2
    name: concept
    text:
      en: The oxidation numbers of every atom in the dichromate ion (Cr₂O₇²⁻) add up to the charge on the ion.
  - rung: 3
    name: first_step
    text:
      en: 'Count every atom: write 2x + 7(-2) = -2.'
  - rung: 4
    name: worked_step
    text:
      en: There are two chromium atoms, so solve for 2x first and then halve it.
  - rung: 5
    name: full_step
    text:
      en: x = (-2 - 7(-2)) / 2 = +6. The oxidation number of chromium is +6.
  misconception_ids:
