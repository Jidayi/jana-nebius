stem: Solutions of four substances are made, all with the same concentration.
parts:
- id: a
  prompt: Which solution has the lowest pH?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Ethanoic acid
      correct: false
      misconception_id: mc.chm.o.acids_strong_means_concentrated
      feedback: Strength is about how fully an acid ionises in water. Concentration is about how much acid is in each dm³. A dilute solution of hydrochloric acid is still a strong acid; a concentrated solution of ethanoic acid is still a weak acid.
    - id: B
      text: Sodium chloride
      correct: false
    - id: C
      text: Hydrochloric acid
      correct: true
    - id: D
      text: Aqueous ammonia
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Which of the four are acids?
  - rung: 2
    name: concept
    text:
      en: The lowest pH belongs to the solution with the most H⁺ ions per dm³.
  - rung: 3
    name: first_step
    text:
      en: Sodium chloride is neutral and aqueous ammonia is an alkali, so they have pH 7 or above.
  - rung: 4
    name: worked_step
    text:
      en: Of the two acids, one is fully ionised and one is partly ionised.
  - rung: 5
    name: full_step
    text:
      en: Hydrochloric acid is strong and fully ionised, so it has the most H⁺ ions and the lowest pH.
  misconception_ids:
  - mc.chm.o.acids_strong_means_concentrated
solution:
  steps:
  - n: 1
    latex: \text{HCl fully ionised} \Rightarrow \text{lowest pH}
    reason: Strong acid
