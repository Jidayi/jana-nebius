stem: A molecule of a carboxylic acid in the series CₙH₂ₙ₊₁COOH has n = 3 in the general formula CₙH₂ₙ₊₁COOH.
parts:
- id: a
  prompt: Calculate the relative molecular mass, Mr, of this compound.
  marks: 2
  answer:
    kind: numeric
    value: '88'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_organic_0032_mr
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Write the molecular formula from CₙH₂ₙ₊₁COOH, then add the masses of the atoms.
  - rung: 2
    name: concept
    text:
      en: 'Ar: C = 12, H = 1, O = 16. In C₃H₇COOH, count the COOH atoms as well as the chain.'
  - rung: 3
    name: first_step
    text:
      en: Hydrogen atoms in the chain = 2 × 3 + 1 = 7, so the formula is C₃H₇COOH.
  - rung: 4
    name: worked_step
    text:
      en: The 3 carbon atoms of the chain give 3 × 12 = 36; the chain hydrogens give 7. The –COOH group adds 12 + 16 + 16 + 1.
  - rung: 5
    name: full_step
    text:
      en: Mr of C₃H₇COOH = 88.
  misconception_ids:
  - mc.chm.o.organic_gf_group_atoms_missed
  - mc.chm.o.organic_gf_wrong_series
solution:
  steps:
  - n: 1
    latex: H = 2 \times 3 + 1 = 7
    reason: Hydrogen atoms in the chain
    check_id: chk_build_chm_organic_0032_h
  - n: 2
    latex: 3 \times 12 = 36
    reason: Mass of the chain carbon atoms
    check_id: chk_build_chm_organic_0032_c
  - n: 3
    latex: M_r(\text{C}_3\text{H}_7\text{COOH}) = 88
    reason: Add every atom's Ar
    check_id: chk_build_chm_organic_0032_mr
