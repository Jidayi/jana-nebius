type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.ionic_formulae
stem: Magnesium phosphate is made of Mg²⁺ and PO₄³⁻ ions.
parts:
- id: a
  prompt: Which is the formula of magnesium phosphate?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Mg₂(PO₄)₃
      correct: false
      misconception_id: mc.chm.o.formula_own_charge_as_count
      feedback: 'Cross the charges over: the size of the cation''s charge becomes the number of anions, and the anion''s charge becomes the number of cations. Then check that the charges add up to zero.'
    - id: B
      text: MgPO₄
      correct: false
      misconception_id: mc.chm.o.formula_one_of_each
      feedback: The total positive charge must cancel the total negative charge. Count how many of each ion you need before you write the formula.
    - id: C
      text: Mg₃PO₄₂
      correct: false
      misconception_id: mc.chm.o.formula_brackets_missing
      feedback: 'When you need more than one of an ion made of several atoms, put that ion in brackets and write the number after the bracket: (OH)₂, (NO₃)₂, (SO₄)₃.'
    - id: D
      text: Mg₃(PO₄)₂
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Look at the size of the charge on each ion in magnesium phosphate.
  - rung: 2
    name: concept
    text:
      en: In an ionic compound the positive and negative charges cancel exactly.
  - rung: 3
    name: first_step
    text:
      en: Work out how many Mg²⁺ ions balance how many PO₄³⁻ ions.
  - rung: 4
    name: worked_step
    text:
      en: Swap the sizes of the charges to get the numbers of each ion, and keep a group ion in brackets if you need more than one of it.
  - rung: 5
    name: full_step
    text:
      en: The charges cancel in Mg₃(PO₄)₂, so that is the formula of magnesium phosphate.
  misconception_ids:
  - mc.chm.o.formula_one_of_each
  - mc.chm.o.formula_own_charge_as_count
  - mc.chm.o.formula_brackets_missing
solution:
  steps:
  - n: 1
    latex: \text{Mg}_3\text{(PO}_4\text{)}_2
    reason: Total positive charge equals total negative charge in magnesium phosphate
