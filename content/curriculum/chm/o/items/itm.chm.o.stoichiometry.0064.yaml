id: itm.chm.o.stoichiometry.0064
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.reacting_masses
stem: Nitrogen and hydrogen react to make ammonia. The equation is N₂ + 3H₂ → 2NH₃.
parts:
- id: a
  prompt: What mass of NH₃ forms from 6.5 g of H₂?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 36.8 g
      correct: true
    - id: B
      text: 4.33 g
      correct: false
      misconception_id: mc.chm.o.mass_ratio_as_mole_ratio
      feedback: 'The equation counts particles, not grams: 2 g of hydrogen does not make 2 g of water. Convert the mass to moles first.'
    - id: C
      text: 82.9 g
      correct: false
      misconception_id: mc.chm.o.ratio_inverted
      feedback: 'Write the ratio as ''wanted : given'' from the equation, then multiply the given amount by wanted ÷ given.'
    - id: D
      text: 55.3 g
      correct: false
      misconception_id: mc.chm.o.ratio_ignored
      feedback: 'Read the ratio from the balanced equation: the numbers in front of the formulae tell you how many moles of each react or form.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Go from mass of H₂ to moles, use the equation, then go back to mass of NH₃.
  - rung: 2
    name: concept
    text:
      en: The numbers in a balanced equation are a ratio of moles, never of grams.
  - rung: 3
    name: first_step
    text:
      en: Moles of H₂ = 6.5 ÷ 2 = 3.25 mol.
  - rung: 4
    name: worked_step
    text:
      en: 'The equation gives 3 H₂ : 2 NH₃, so moles of NH₃ = 2.17 mol.'
  - rung: 5
    name: full_step
    text:
      en: Mass of NH₃ = 2.17 × 17 = 36.8 g.
  misconception_ids:
  - mc.chm.o.ratio_ignored
  - mc.chm.o.mass_ratio_as_mole_ratio
  - mc.chm.o.ratio_inverted
solution:
  steps:
  - n: 1
    latex: n(\text{H}_2) = \frac{6.5}{2} = 3.25
    reason: Moles of the given substance
    check_id: chk_build_chm_stoichiometry_0064_ma
  - n: 2
    latex: '\text{H}_2 : \text{NH}_3 = 3 : 2'
    reason: Ratio from the equation
    check_id: chk_build_chm_stoichiometry_0064_coef
  - n: 3
    latex: n(\text{NH}_3) = 2.17
    reason: Mole ratio from the equation
    check_id: chk_build_chm_stoichiometry_0064_chain
  - n: 4
    latex: m(\text{NH}_3) = 2.17 \times 17 = 36.8\ \text{g}
    reason: Back to mass
    check_id: chk_build_chm_stoichiometry_0064_mb
