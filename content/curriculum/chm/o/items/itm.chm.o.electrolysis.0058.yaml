id: itm.chm.o.electrolysis.0058
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.electrolysis.quantitative
stem: 'Copper is deposited from copper(II) sulfate solution: Cu²⁺ + 2e⁻ → Cu. A current of 0.50 A flows for 30 minutes (1 minute = 60 s). One mole of electrons carries 96500 C.'
parts:
- id: a
  prompt: What mass of copper is deposited, in grams?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: '0.298'
      correct: true
    - id: B
      text: '0.597'
      correct: false
      misconception_id: mc.chm.o.electrolysis_electron_ratio_ignored
      feedback: Look at the half-equation. Cu²⁺ + 2e⁻ → Cu needs two moles of electrons for every mole of copper, so divide the moles of electrons by two.
    - id: C
      text: '0.00497'
      correct: false
      misconception_id: mc.chm.o.electrolysis_time_not_in_seconds
      feedback: In Q = I × t the current is in amperes and the time must be in seconds, so that Q comes out in coulombs. Change minutes to seconds first.
    - id: D
      text: '1.19'
      correct: false
      misconception_id: mc.chm.o.electrolysis_electron_ratio_inverted
      feedback: More electrons per ion means fewer ions discharged by the same charge. If each ion needs two electrons, the moles of metal are half the moles of electrons, not double.
  hints:
  - rung: 1
    name: orient
    text:
      en: Convert the 30 minutes to seconds first, then find the charge.
  - rung: 2
    name: concept
    text:
      en: Q = I × t with t in seconds; moles of electrons = Q ÷ 96500; then use the copper half-equation.
  - rung: 3
    name: first_step
    text:
      en: t = 30 × 60 = 1800 s, so Q = 0.50 × 1800 = 900 C.
  - rung: 4
    name: worked_step
    text:
      en: Moles of electrons = 0.00933 mol. Each copper ion needs 2 electrons, so moles of copper = 0.00466 mol.
  - rung: 5
    name: full_step
    text:
      en: Mass = moles × 64 = 0.298 g.
  misconception_ids:
  - mc.chm.o.electrolysis_time_not_in_seconds
  - mc.chm.o.electrolysis_electron_ratio_ignored
  - mc.chm.o.electrolysis_electron_ratio_inverted
solution:
  steps:
  - n: 1
    latex: t = 30 \times 60 = 1800\ \text{s}
    reason: Minutes to seconds
    check_id: chk_build_chm_electrolysis_0058_t
  - n: 2
    latex: Q = 0.50 \times 1800 = 900\ \text{C}
    reason: Charge = current × time
    check_id: chk_build_chm_electrolysis_0058_m
  - n: 3
    latex: n(e^-) = \frac{900}{96500} = 0.00933\ \text{mol}
    reason: Divide by the Faraday constant
    check_id: chk_build_chm_electrolysis_0058_e
  - n: 4
    latex: n(\text{Cu}) = \frac{0.00933}{2} = 0.00466\ \text{mol}
    reason: 2 mol of electrons per mol of copper
    check_id: chk_build_chm_electrolysis_0058_n
  - n: 5
    latex: m = n \times 64 = 0.298\ \text{g}
    reason: Moles to mass
    check_id: chk_build_chm_electrolysis_0058_m
