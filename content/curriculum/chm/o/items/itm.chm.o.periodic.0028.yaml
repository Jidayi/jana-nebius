stem: Astatine is the element below iodine in Group VII.
parts:
- id: a
  prompt: Which prediction about astatine is most likely?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: It is a dark solid and less reactive than iodine
      correct: true
    - id: B
      text: It is a gas and more reactive than chlorine
      correct: false
      misconception_id: mc.chm.o.periodic_halogen_reactivity_increases
      feedback: 'Halogens react by gaining an electron. Lower down, the outer shell is further from the nucleus and attracts an electron less strongly, so reactivity decreases: chlorine > bromine > iodine.'
    - id: C
      text: It has exactly the same properties as iodine
      correct: false
      misconception_id: mc.chm.o.periodic_same_group_identical
      feedback: 'Lithium fizzes gently on water but potassium bursts into flame: same type of reaction, very different vigour.'
    - id: D
      text: It is a pale yellow gas like fluorine
      correct: false
      misconception_id: mc.chm.o.periodic_halogen_state_trend_reversed
      feedback: 'Going down Group VII the halogens get darker and their melting and boiling points rise: chlorine is a pale gas, bromine a red-brown liquid, iodine a grey-black solid.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Use the trends down Group VII and continue them one step further.
  - rung: 2
    name: concept
    text:
      en: 'Down the group: colour darkens, melting and boiling points rise, reactivity falls.'
  - rung: 3
    name: first_step
    text:
      en: Iodine is already a grey-black solid.
  - rung: 4
    name: worked_step
    text:
      en: Continue the reactivity trend past iodine.
  - rung: 5
    name: full_step
    text:
      en: Astatine should be a dark solid, less reactive than iodine.
  misconception_ids:
