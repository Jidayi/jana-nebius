id: itm.chm.o.electrolysis.0018
version: 0.1.0
type: mcq
subject: chm
level: o
kc_ids:
- kc.chm.o.electrolysis.aqueous_products
stem: Blue aqueous copper(II) sulfate is electrolysed using inert graphite electrodes. The blue colour slowly fades.
parts:
- id: a
  prompt: Which products form?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Copper at the cathode and oxygen at the anode
      correct: true
    - id: B
      text: Copper at the cathode and sulfur dioxide at the anode
      correct: false
    - id: C
      text: Copper at the cathode and hydrogen at the anode
      correct: false
    - id: D
      text: Hydrogen at the cathode and oxygen at the anode
      correct: false
      misconception_id: mc.chm.o.electrolysis_hydrogen_always_at_cathode
      feedback: Hydrogen forms at the cathode only when the metal is more reactive than hydrogen. Copper and silver are less reactive, so their ions are discharged first and the metal coats the cathode.
  hints:
  - rung: 1
    name: orient
    text:
      en: The solution contains Cu²⁺, SO₄²⁻, H⁺ and OH⁻ ions.
  - rung: 2
    name: concept
    text:
      en: Copper is less reactive than hydrogen; sulfate is not a halide.
  - rung: 3
    name: first_step
    text:
      en: At the cathode, the ion of the less reactive element, copper or hydrogen, is discharged.
  - rung: 4
    name: worked_step
    text:
      en: At the anode there is no halide, so look at the ion from water that is discharged instead.
  - rung: 5
    name: full_step
    text:
      en: Copper forms on the cathode (Cu²⁺ ions are removed, so the blue fades) and oxygen forms at the anode from hydroxide ions.
  misconception_ids:
  - mc.chm.o.electrolysis_hydrogen_always_at_cathode
solution:
  steps:
  - n: 1
    latex: '\text{cathode: Cu; anode: }\text{O}_2'
    reason: Cu below H; no halide
