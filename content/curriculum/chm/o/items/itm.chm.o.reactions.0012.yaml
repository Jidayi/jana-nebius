stem: A student is writing a definition.
parts:
- id: a
  prompt: Which sentence describes a physical change?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: No new substance forms, and the change is usually easy to reverse.
      correct: true
    - id: B
      text: Energy is always taken in, and a gas is given off.
      correct: false
    - id: C
      text: A new substance forms, and the change is hard to reverse.
      correct: false
    - id: D
      text: A new substance forms, but the mass stays the same.
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A physical change is the opposite of a chemical change in one key way.
  - rung: 2
    name: concept
    text:
      en: Melting, boiling, dissolving and mixing are all physical changes.
  - rung: 3
    name: first_step
    text:
      en: In each of those examples, ask whether a new substance appears.
  - rung: 4
    name: worked_step
    text:
      en: Also think about how easy it is to get the starting substance back after melting or dissolving.
  - rung: 5
    name: full_step
    text:
      en: A physical change makes no new substance and is usually easy to reverse, for example by cooling or evaporating.
solution:
  steps:
  - n: 1
    latex: '\text{physical change: no new substance}'
    reason: The definition
