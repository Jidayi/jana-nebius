id: itm.chm.o.electrolysis.0050
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.electrolysis.quantitative
stem: 'A spoon is silver-plated in silver nitrate solution: Ag⁺ + e⁻ → Ag. A current of 0.50 A flows for 1930 s. (Faraday constant: 96500 C per mole of electrons.)'
parts:
- id: a
  prompt: Calculate the mass of silver deposited.
  marks: 3
  answer:
    kind: numeric
    value: '1.08'
    unit: g
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_electrolysis_0050_m
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Plan: charge → moles of electrons → moles of silver → mass of silver.'
  - rung: 2
    name: concept
    text:
      en: Q = I × t; moles of electrons = Q ÷ 96500; the half-equation gives the electrons per silver atom.
  - rung: 3
    name: first_step
    text:
      en: Q = 0.50 × 1930 = 965 C, so moles of electrons = 965 ÷ 96500 = 0.0100 mol.
  - rung: 4
    name: worked_step
    text:
      en: Each silver ion needs one electron, so moles of silver = 0.0100 mol. Multiply by 108.
  - rung: 5
    name: full_step
    text:
      en: Mass = 0.0100 × 108 = 1.08 g.
  misconception_ids:
  - mc.chm.o.electrolysis_time_not_in_seconds
solution:
  steps:
  - n: 1
    latex: Q = 0.50 \times 1930 = 965\ \text{C}
    reason: Charge = current × time
    check_id: chk_build_chm_electrolysis_0050_m
  - n: 2
    latex: n(e^-) = \frac{965}{96500} = 0.0100\ \text{mol}
    reason: Divide by the Faraday constant
    check_id: chk_build_chm_electrolysis_0050_e
  - n: 3
    latex: n(\text{Ag}) = \frac{0.0100}{1} = 0.0100\ \text{mol}
    reason: One electron per ion
    check_id: chk_build_chm_electrolysis_0050_n
  - n: 4
    latex: m = n \times 108 = 1.08\ \text{g}
    reason: Moles to mass
    check_id: chk_build_chm_electrolysis_0050_m
