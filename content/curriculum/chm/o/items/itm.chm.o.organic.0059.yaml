id: itm.chm.o.organic.0059
version: 0.1.0
type: mcq
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.alkanes_and_alkenes
stem: Methane and chlorine are mixed and left in ultraviolet light.
parts:
- id: a
  prompt: Which are the products?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: 'No products: methane does not react with anything except oxygen'
      correct: false
    - id: B
      text: Chloromethane, CH₃Cl, and hydrogen chloride
      correct: true
    - id: C
      text: Dichloromethane only, made by addition
      correct: false
      misconception_id: mc.chm.o.organic_addition_substitution_mixed
      feedback: In addition, two molecules join into one product and the double bond becomes single. In substitution an atom such as H is swapped for another such as Cl, so a second product (HCl) forms. Alkenes add; alkanes substitute, in ultraviolet light.
    - id: D
      text: Chloromethane, CH₃Cl, only
      correct: false
      misconception_id: mc.chm.o.organic_addition_substitution_mixed
      feedback: In addition, two molecules join into one product and the double bond becomes single. In substitution an atom such as H is swapped for another such as Cl, so a second product (HCl) forms. Alkenes add; alkanes substitute, in ultraviolet light.
  hints:
  - rung: 1
    name: orient
    text:
      en: Methane is an alkane, so it has no C=C bond to add to.
  - rung: 2
    name: concept
    text:
      en: Alkanes react with chlorine by substitution when ultraviolet light supplies energy.
  - rung: 3
    name: first_step
    text:
      en: In substitution, a chlorine atom takes the place of one hydrogen atom.
  - rung: 4
    name: worked_step
    text:
      en: The hydrogen atom that leaves joins the other chlorine atom.
  - rung: 5
    name: full_step
    text:
      en: 'CH₄ + Cl₂ → CH₃Cl + HCl: chloromethane and hydrogen chloride.'
  misconception_ids:
  - mc.chm.o.organic_addition_substitution_mixed
solution:
  steps:
  - n: 1
    latex: \text{CH}_4 + \text{Cl}_2 \rightarrow \text{CH}_3\text{Cl} + \text{HCl}
    reason: Substitution in UV light
    check_id: chk_build_chm_organic_0059_bal
