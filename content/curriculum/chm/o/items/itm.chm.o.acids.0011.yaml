id: itm.chm.o.acids.0011
version: 0.1.0
type: mcq
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.reactions_of_acids
stem: When any acid reacts with any alkali, the same reaction between two ions happens.
parts:
- id: a
  prompt: Which ionic equation shows this reaction?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: H⁺ + Cl⁻ → HCl
      correct: false
    - id: B
      text: Na⁺ + Cl⁻ → NaCl
      correct: false
    - id: C
      text: 2H⁺ → H₂
      correct: false
      misconception_id: mc.chm.o.acids_wrong_gas
      feedback: Look at what the acid reacts with. A metal gives hydrogen. A carbonate gives carbon dioxide, because the carbonate contains carbon and oxygen. An oxide or hydroxide gives only a salt and water, with no gas.
    - id: D
      text: H⁺ + OH⁻ → H₂O
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which ion do all acids give in water, and which ion do all alkalis give?
  - rung: 2
    name: concept
    text:
      en: Acids give hydrogen ions, H⁺. Alkalis give hydroxide ions, OH⁻.
  - rung: 3
    name: first_step
    text:
      en: In neutralisation these two ions join together.
  - rung: 4
    name: worked_step
    text:
      en: The product of the two ions is a neutral molecule made of hydrogen and oxygen.
  - rung: 5
    name: full_step
    text:
      en: 'H⁺ + OH⁻ → H₂O: hydrogen ions from the acid join hydroxide ions from the alkali to make water.'
  misconception_ids:
  - mc.chm.o.acids_wrong_gas
solution:
  steps:
  - n: 1
    latex: \text{H}^{+} + \text{OH}^{-} \rightarrow \text{H}_2\text{O}
    reason: Neutralisation as an ionic equation
