stem: Magnesium burns in oxygen to make magnesium oxide. When this oxide is shaken with water and tested with universal indicator, the indicator turns blue.
parts:
- id: a
  prompt: What does this show about metal oxides?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Metal oxides are always neutral.
      correct: false
    - id: B
      text: Metal oxides are acidic and turn indicator red.
      correct: false
    - id: C
      text: Metal oxides are basic; those that dissolve give alkaline solutions.
      correct: true
    - id: D
      text: The blue colour comes from oxygen released by the oxide.
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: This is a chemical property of metals, not a physical one.
  - rung: 2
    name: concept
    text:
      en: Non-metal oxides tend to be acidic; metal oxides tend to be basic.
  - rung: 3
    name: first_step
    text:
      en: Blue indicator means the solution has a pH above 7.
  - rung: 4
    name: worked_step
    text:
      en: Decide whether a pH above 7 is acidic or alkaline.
  - rung: 5
    name: full_step
    text:
      en: The solution is alkaline, which shows that magnesium oxide, like most metal oxides, is basic.
solution:
  steps:
  - n: 1
    latex: '\text{pH > 7: alkaline, so the oxide is basic}'
    reason: Metal oxides are basic
