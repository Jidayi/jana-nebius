id: itm.chm.o.acids.0036
version: 0.1.0
type: mcq
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.strong_and_weak
stem: Aqueous ammonia and sodium hydroxide solution of the same concentration are both tested with universal indicator.
parts:
- id: a
  prompt: Which statement is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Aqueous ammonia has the higher pH
      correct: false
    - id: B
      text: Both have the same pH, because their concentrations are equal
      correct: false
      misconception_id: mc.chm.o.acids_strong_means_concentrated
      feedback: Strength is about how fully an acid ionises in water. Concentration is about how much acid is in each dm³. A dilute solution of hydrochloric acid is still a strong acid; a concentrated solution of ethanoic acid is still a weak acid.
    - id: C
      text: Both are alkaline, but sodium hydroxide has the higher pH
      correct: true
    - id: D
      text: Aqueous ammonia is neutral, because it does not form ions
      correct: false
      misconception_id: mc.chm.o.acids_weak_not_ionised
      feedback: 'A weak acid is partly ionised: most molecules stay whole, but some give H⁺ ions. That is why ethanoic acid still turns indicators red or orange, conducts a little and reacts slowly with metals.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Strength applies to alkalis too. Which of these is a weak alkali?
  - rung: 2
    name: concept
    text:
      en: Sodium hydroxide is fully ionised in water; ammonia reacts with water only partly to give OH⁻ ions.
  - rung: 3
    name: first_step
    text:
      en: More OH⁻ ions per dm³ means a more alkaline solution.
  - rung: 4
    name: worked_step
    text:
      en: A more alkaline solution is further above 7 on the pH scale.
  - rung: 5
    name: full_step
    text:
      en: Sodium hydroxide gives more OH⁻ ions, so it has the higher pH; aqueous ammonia is a weak alkali with a pH above 7.
  misconception_ids:
  - mc.chm.o.acids_strong_means_concentrated
  - mc.chm.o.acids_weak_not_ionised
solution:
  steps:
  - n: 1
    latex: '[\text{OH}^{-}]_{\text{NaOH}} > [\text{OH}^{-}]_{\text{NH}_3}'
    reason: Strong vs weak alkali
