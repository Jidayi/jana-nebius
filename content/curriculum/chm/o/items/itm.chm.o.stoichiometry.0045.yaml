id: itm.chm.o.stoichiometry.0045
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.percentage_composition
stem: A sample of methane, CH₄ is analysed.
parts:
- id: a
  prompt: Calculate the percentage by mass of H in CH₄.
  marks: 2
  answer:
    kind: numeric
    value: '25.0'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0045_pct
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: What fraction of the mass of CH₄ is H?
  - rung: 2
    name: concept
    text:
      en: Percentage = mass of the element's atoms in the formula ÷ Mr × 100.
  - rung: 3
    name: first_step
    text:
      en: Mr of CH₄ is 16.
  - rung: 4
    name: worked_step
    text:
      en: The H atoms contribute 4. Work out 4 ÷ 16 × 100.
  - rung: 5
    name: full_step
    text:
      en: 4 ÷ 16 × 100 = 25.0%.
  misconception_ids:
  - mc.chm.o.percent_count_ignored
  - mc.chm.o.percent_inverted
solution:
  steps:
  - n: 1
    latex: M_r = 16
    reason: Relative formula mass of CH₄
    check_id: chk_build_chm_stoichiometry_0045_mr
  - n: 2
    latex: \text{H}_4 = 4
    reason: Mass of the H atoms
    check_id: chk_build_chm_stoichiometry_0045_el
  - n: 3
    latex: \% = \frac{4}{16} \times 100 = 25.0\%
    reason: Fraction of the whole
    check_id: chk_build_chm_stoichiometry_0045_pct
