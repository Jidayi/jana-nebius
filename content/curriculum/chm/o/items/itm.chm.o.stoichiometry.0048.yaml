stem: A sample of carbon dioxide, CO₂ is analysed.
parts:
- id: a
  prompt: Calculate the percentage by mass of C in CO₂.
  marks: 2
  answer:
    kind: numeric
    value: '27.3'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0048_pct
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: What fraction of the mass of CO₂ is C?
  - rung: 2
    name: concept
    text:
      en: Percentage = mass of the element's atoms in the formula ÷ Mr × 100.
  - rung: 3
    name: first_step
    text:
      en: Mr of CO₂ is 44.
  - rung: 4
    name: worked_step
    text:
      en: The C atoms contribute 12. Work out 12 ÷ 44 × 100.
  - rung: 5
    name: full_step
    text:
      en: 12 ÷ 44 × 100 = 27.3%.
  misconception_ids:
  - mc.chm.o.percent_count_ignored
  - mc.chm.o.percent_inverted
solution:
  steps:
  - n: 1
    latex: M_r = 44
    reason: Relative formula mass of CO₂
    check_id: chk_build_chm_stoichiometry_0048_mr
  - n: 2
    latex: \text{C} = 12
    reason: Mass of the C atoms
    check_id: chk_build_chm_stoichiometry_0048_el
  - n: 3
    latex: \% = \frac{12}{44} \times 100 = 27.3\%
    reason: Fraction of the whole
    check_id: chk_build_chm_stoichiometry_0048_pct
