id: itm.chm.o.acids.0027
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.strong_and_weak
stem: Solutions of hydrochloric acid and ethanoic acid are made with the same concentration.
parts:
- id: a
  prompt: How do their pH values compare?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Ethanoic acid has pH 7, because it does not ionise
      correct: false
      misconception_id: mc.chm.o.acids_weak_not_ionised
      feedback: 'A weak acid is partly ionised: most molecules stay whole, but some give H⁺ ions. That is why ethanoic acid still turns indicators red or orange, conducts a little and reacts slowly with metals.'
    - id: B
      text: Hydrochloric acid has the lower pH
      correct: true
    - id: C
      text: They have the same pH, because their concentrations are equal
      correct: false
      misconception_id: mc.chm.o.acids_strong_means_concentrated
      feedback: Strength is about how fully an acid ionises in water. Concentration is about how much acid is in each dm³. A dilute solution of hydrochloric acid is still a strong acid; a concentrated solution of ethanoic acid is still a weak acid.
    - id: D
      text: Ethanoic acid has the lower pH, because it is weaker
      correct: false
      misconception_id: mc.chm.o.acids_high_ph_more_acidic
      feedback: 'Picture the pH scale as a line: acids at the low end (below 7), neutral at 7, alkalis at the high end (above 7). The lower the pH, the more acidic the solution.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Which acid releases more hydrogen ions into the solution?
  - rung: 2
    name: concept
    text:
      en: pH depends on the concentration of H⁺ ions, not on the concentration of acid molecules.
  - rung: 3
    name: first_step
    text:
      en: Hydrochloric acid is fully ionised; ethanoic acid is only partly ionised.
  - rung: 4
    name: worked_step
    text:
      en: More H⁺ ions per dm³ means a more acidic solution. Which end of the pH scale is more acidic?
  - rung: 5
    name: full_step
    text:
      en: Hydrochloric acid gives more H⁺ ions, so it has the lower pH; ethanoic acid still has a pH below 7.
  misconception_ids:
  - mc.chm.o.acids_strong_means_concentrated
  - mc.chm.o.acids_weak_not_ionised
  - mc.chm.o.acids_high_ph_more_acidic
solution:
  steps:
  - n: 1
    latex: '[\text{H}^{+}]_{\text{HCl}} > [\text{H}^{+}]_{\text{ethanoic}}'
    reason: Full vs partial ionisation
  - n: 2
    latex: \text{lower pH for HCl}
    reason: More hydrogen ions, lower pH
