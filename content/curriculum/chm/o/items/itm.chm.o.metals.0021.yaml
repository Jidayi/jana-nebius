stem: Knives, forks and sinks are often made of stainless steel.
parts:
- id: a
  prompt: Why is stainless steel used rather than ordinary steel?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: It is a pure metal, so it cannot react.
      correct: false
    - id: B
      text: It is softer, so it is easier to shape.
      correct: false
      misconception_id: mc.chm.o.metals_alloy_impure_weaker
      feedback: Pure iron is soft and bends easily; steel, iron with a little carbon, is much harder. Alloys are made on purpose because they are usually harder and stronger than the pure metal.
    - id: C
      text: It conducts electricity better.
      correct: false
    - id: D
      text: It resists corrosion (does not rust easily), because of the chromium and nickel in it.
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Cutlery and sinks are wet for much of their life.
  - rung: 2
    name: concept
    text:
      en: Ordinary steel rusts in water and air.
  - rung: 3
    name: first_step
    text:
      en: Stainless steel contains other metals besides iron and carbon.
  - rung: 4
    name: worked_step
    text:
      en: Think about what the added chromium and nickel do in wet conditions.
  - rung: 5
    name: full_step
    text:
      en: Stainless steel is chosen because it resists rusting, thanks to its chromium and nickel.
  misconception_ids:
  - mc.chm.o.metals_alloy_impure_weaker
