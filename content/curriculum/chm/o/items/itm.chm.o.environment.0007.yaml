stem: Muddy river water is pumped into large tanks and left to stand.
parts:
- id: a
  prompt: What is this stage called, and what does it remove?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: 'Distillation: dissolved salts are removed'
      correct: false
    - id: B
      text: 'Sedimentation: large insoluble particles settle to the bottom'
      correct: true
    - id: C
      text: 'Filtration: tastes and smells are removed'
      correct: false
      misconception_id: mc.chm.o.environment_treatment_stages_mixed
      feedback: Each stage has one job. Sedimentation lets large particles settle. Filtration removes small insoluble particles. Carbon removes tastes and smells. Chlorine kills microbes. None of these removes dissolved salts, so tap water is not pure.
