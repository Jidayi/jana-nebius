id: itm.chm.o.metals.0015
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.metals.alloys
stem: Pure iron is soft and bends easily. Steel is iron mixed with a small amount of carbon.
parts:
- id: a
  prompt: How does the hardness of steel compare with pure iron, and why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Steel is harder, because the small carbon atoms disrupt the layers of iron atoms.
      correct: true
    - id: B
      text: Steel is harder, because carbon and iron form the compound FeC with ionic bonds.
      correct: false
      misconception_id: mc.chm.o.metals_alloy_is_compound
      feedback: An alloy is a mixture. Its make-up can vary (brass can be more or less copper), and no new compound with a fixed formula forms. The metal atoms are still held by metallic bonding.
    - id: C
      text: Steel is softer, because the carbon is an impurity that weakens the iron.
      correct: false
      misconception_id: mc.chm.o.metals_alloy_impure_weaker
      feedback: Pure iron is soft and bends easily; steel, iron with a little carbon, is much harder. Alloys are made on purpose because they are usually harder and stronger than the pure metal.
    - id: D
      text: Steel is harder, because carbon makes the metallic bonds between iron atoms much stronger.
      correct: false
      misconception_id: mc.chm.o.metals_alloy_stronger_bonds
      feedback: Draw the layers. In a pure metal the atoms are all one size, so the layers slide easily. Atoms of a different size break up the neat layers, so the layers cannot slide as easily. The bonding is still metallic.
  hints:
  - rung: 1
    name: orient
    text:
      en: Steel is used for bridges and car bodies; pure iron is not.
  - rung: 2
    name: concept
    text:
      en: Alloys are usually harder than the pure metal they are made from.
  - rung: 3
    name: first_step
    text:
      en: Carbon atoms are much smaller than iron atoms.
  - rung: 4
    name: worked_step
    text:
      en: Think about what small atoms placed among the iron atoms do to the regular layers.
  - rung: 5
    name: full_step
    text:
      en: 'Steel is harder: the carbon atoms disrupt the layers of iron so they slide less easily.'
  misconception_ids:
  - mc.chm.o.metals_alloy_impure_weaker
  - mc.chm.o.metals_alloy_is_compound
  - mc.chm.o.metals_alloy_stronger_bonds
