id: itm.chm.o.acids.0051
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.salt_preparation
stem: A student wants a dry sample of barium sulfate, which is insoluble in water.
parts:
- id: a
  prompt: Which method should the student use?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Mix barium chloride solution with sodium sulfate solution, filter, wash the residue with water and dry it
      correct: true
    - id: B
      text: Add excess barium carbonate to sulfuric acid, filter, then crystallise the filtrate
      correct: false
      misconception_id: mc.chm.o.acids_precipitation_confused
      feedback: 'An insoluble salt comes out of solution as a precipitate as soon as two solutions are mixed: filter it off and wash it. A soluble salt stays dissolved: you get it by evaporating and crystallising the solution.'
    - id: C
      text: Mix barium chloride solution with sodium sulfate solution, filter, then evaporate the filtrate
      correct: false
      misconception_id: mc.chm.o.acids_filtrate_residue_confused
      feedback: Draw the filter funnel. The solid that stays on the paper is the residue; the liquid that passes through is the filtrate. A soluble salt is in the filtrate; an insoluble salt is the residue.
    - id: D
      text: Titrate barium chloride solution against sodium sulfate solution, then crystallise
      correct: false
      misconception_id: mc.chm.o.acids_method_mismatch_base
      feedback: Ask whether the starting base, metal or carbonate dissolves in water. If it is insoluble, add an excess and filter off what is left. If it is soluble (sodium, potassium or ammonium), an excess cannot be filtered off, so use a titration to find the exact amounts.
  hints:
  - rung: 1
    name: orient
    text:
      en: Is barium sulfate soluble or insoluble?
  - rung: 2
    name: concept
    text:
      en: 'An insoluble salt is made by mixing two solutions: one gives the metal ion and one gives the negative ion.'
  - rung: 3
    name: first_step
    text:
      en: The barium sulfate forms at once as a solid in the mixture.
  - rung: 4
    name: worked_step
    text:
      en: After filtering, the barium sulfate is on the filter paper. What must be washed off it?
  - rung: 5
    name: full_step
    text:
      en: Mix the two solutions, filter off the barium sulfate precipitate, wash it with distilled water and dry it.
  misconception_ids:
  - mc.chm.o.acids_precipitation_confused
  - mc.chm.o.acids_filtrate_residue_confused
  - mc.chm.o.acids_method_mismatch_base
solution:
  steps:
  - n: 1
    latex: \text{Ba}^{2+}\text{(aq)} + \text{SO}_4^{2-}\text{(aq)} \rightarrow \text{BaSO}_4\text{(s)}
    reason: Precipitation
  - n: 2
    latex: \text{residue} \rightarrow \text{wash, dry}
    reason: Insoluble salt is the residue
