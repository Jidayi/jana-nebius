id: itm.chm.o.reactions.0027
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.reactions.collision_theory
stem: A catalyst makes a reaction faster without being used up.
parts:
- id: a
  prompt: How does the catalyst increase the rate?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: It makes every collision between the particles successful.
      correct: false
      misconception_id: mc.chm.o.reactions_all_collisions_react
      feedback: Particles in a gas collide billions of times a second, yet many mixtures hardly react. Only collisions with at least the activation energy lead to a reaction; the rest bounce apart unchanged.
    - id: B
      text: It gives the particles extra kinetic energy so they move faster.
      correct: false
      misconception_id: mc.chm.o.reactions_catalyst_gives_energy
      feedback: 'Heating gives particles more energy, so more collisions reach the activation energy. A catalyst does not add energy: it gives a different route with a lower activation energy, so more collisions succeed at the same temperature.'
    - id: C
      text: It provides a different pathway with a lower activation energy, so more collisions succeed.
      correct: true
    - id: D
      text: It packs the particles closer together so that they hit harder.
      correct: false
      misconception_id: mc.chm.o.reactions_concentration_harder_collisions
      feedback: Concentration, pressure and surface area change how often particles collide, not how hard. Only temperature changes the energy of the particles.
  hints:
  - rung: 1
    name: orient
    text:
      en: A catalyst does not change the temperature. What does it change?
  - rung: 2
    name: concept
    text:
      en: The activation energy is the smallest energy a collision needs for a reaction.
  - rung: 3
    name: first_step
    text:
      en: With a catalyst present the reaction takes another route.
  - rung: 4
    name: worked_step
    text:
      en: If the energy barrier is lower, think about what fraction of collisions can now get over it.
  - rung: 5
    name: full_step
    text:
      en: The catalyst gives a route with a lower activation energy, so a larger fraction of collisions have enough energy to react at the same temperature.
  misconception_ids:
  - mc.chm.o.reactions_catalyst_gives_energy
  - mc.chm.o.reactions_all_collisions_react
  - mc.chm.o.reactions_concentration_harder_collisions
solution:
  steps:
  - n: 1
    latex: \text{lower activation energy route}
    reason: Collision theory
