id: itm.chm.o.atoms.0026
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.atoms.electron_arrangement
stem: An atom of potassium has proton number 19 and nucleon number 39.
parts:
- id: a
  prompt: Which is the electron arrangement of a potassium atom?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 2,8,9
      correct: false
      misconception_id: mc.chm.o.third_shell_overfilled
      feedback: For the first twenty elements the third shell holds eight; potassium and calcium start a fourth shell.
    - id: B
      text: 8,8,3
      correct: false
      misconception_id: mc.chm.o.first_shell_holds_eight
      feedback: 'The first shell is small: it holds at most two electrons. Then 8, then 8 for the first twenty elements.'
    - id: C
      text: 2,8,8,1
      correct: true
    - id: D
      text: 2,8,8,8,8,5
      correct: false
      misconception_id: mc.chm.o.arrangement_from_nucleon_number
      feedback: A neutral atom has as many electrons as protons. Use the proton number, the smaller of the two numbers.
  hints:
  - rung: 1
    name: orient
    text:
      en: Which of the two numbers, 19 or 39, tells you how many electrons the atom has?
  - rung: 2
    name: concept
    text:
      en: A neutral atom has as many electrons as protons. Shells fill from the nucleus outwards and hold 2, then 8, then 8.
  - rung: 3
    name: first_step
    text:
      en: 'Place 19 electrons: the first shell takes 2.'
  - rung: 4
    name: worked_step
    text:
      en: Fill the second shell with up to 8 before you start the next shell.
  - rung: 5
    name: full_step
    text:
      en: The arrangement is 2,8,8,1, with 1 in the outer shell.
  misconception_ids:
  - mc.chm.o.first_shell_holds_eight
  - mc.chm.o.third_shell_overfilled
  - mc.chm.o.arrangement_from_nucleon_number
solution:
  steps:
  - n: 1
    latex: 19 = 2 + 8 + 8 + 1
    reason: Fill each shell in turn
    check_id: chk_build_chm_atoms_0026_outer
  - n: 2
    latex: '\text{outer shell}: 1'
    reason: What is left after the inner shells
    check_id: chk_build_chm_atoms_0026_outer
