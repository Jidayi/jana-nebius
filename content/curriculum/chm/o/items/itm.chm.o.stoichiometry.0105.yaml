id: itm.chm.o.stoichiometry.0105
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.empirical_formula
stem: A compound has the empirical formula CH₂ and a relative molecular mass of 70.
parts:
- id: a
  prompt: How many H atoms are there in one molecule of the compound?
  marks: 2
  answer:
    kind: numeric
    value: '10'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0105_atoms
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The molecular formula is a whole-number multiple of the empirical formula.
  - rung: 2
    name: concept
    text:
      en: Divide the relative molecular mass by the mass of one empirical formula unit to find the multiple.
  - rung: 3
    name: first_step
    text:
      en: The empirical formula CH₂ has a mass of 14.
  - rung: 4
    name: worked_step
    text:
      en: 70 ÷ 14 = 5, so multiply every number in CH₂ by 5.
  - rung: 5
    name: full_step
    text:
      en: The molecular formula is C₅H₁₀, which has 10 H atoms.
  misconception_ids:
  - mc.chm.o.empirical_mass_ratio
solution:
  steps:
  - n: 1
    latex: M_r(\text{CH}_2) = 14
    reason: Mass of the empirical unit
    check_id: chk_build_chm_stoichiometry_0105_emp
  - n: 2
    latex: \frac{70}{14} = 5
    reason: How many units in one molecule
    check_id: chk_build_chm_stoichiometry_0105_factor
  - n: 3
    latex: '\text{C}_5\text{H}_{10}: M_r = 70'
    reason: Molecular formula
    check_id: chk_build_chm_stoichiometry_0105_mol
  - n: 4
    latex: H = 10
    reason: Atoms of H
    check_id: chk_build_chm_stoichiometry_0105_atoms
