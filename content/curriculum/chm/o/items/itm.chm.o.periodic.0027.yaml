stem: Iodine solution is added to potassium chloride solution.
parts:
- id: a
  prompt: What happens?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Iodine is displaced and the solution turns brown
      correct: false
      misconception_id: mc.chm.o.periodic_displacement_reversed
      feedback: 'The more reactive halogen takes the place of the less reactive one in the compound, setting the less reactive halogen free: Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂.'
    - id: B
      text: No reaction, because iodine is less reactive than chlorine
      correct: true
    - id: C
      text: Chlorine is displaced, because iodine is more reactive
      correct: false
      misconception_id: mc.chm.o.periodic_halogen_reactivity_increases
      feedback: 'Halogens react by gaining an electron. Lower down, the outer shell is further from the nucleus and attracts an electron less strongly, so reactivity decreases: chlorine > bromine > iodine.'
    - id: D
      text: The two halogens swap, because both are in Group VII
      correct: false
      misconception_id: mc.chm.o.periodic_same_group_identical
      feedback: 'Lithium fizzes gently on water but potassium bursts into flame: same type of reaction, very different vigour.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Which halogen is more reactive, iodine or chlorine?
  - rung: 2
    name: concept
    text:
      en: Only a more reactive halogen can displace a less reactive one from its halide.
  - rung: 3
    name: first_step
    text:
      en: Chlorine is near the top of Group VII; iodine is lower down.
  - rung: 4
    name: worked_step
    text:
      en: Can the less reactive halogen push out the more reactive one?
  - rung: 5
    name: full_step
    text:
      en: Iodine is less reactive than chlorine, so there is no reaction.
  misconception_ids:
  - mc.chm.o.periodic_halogen_reactivity_increases
  - mc.chm.o.periodic_displacement_reversed
  - mc.chm.o.periodic_same_group_identical
