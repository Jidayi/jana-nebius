stem: Graphite is used in pencils and as electrodes.
parts:
- id: a
  prompt: Why does graphite conduct electricity?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: The weak covalent bonds in graphite break and release electrons.
      correct: false
      misconception_id: mc.chm.o.graphite_soft_bonds_weak
      feedback: Inside each layer the covalent bonds are very strong. Between the layers the forces are weak, so layers slide over each other.
    - id: B
      text: Graphite contains ions that move when a voltage is applied.
      correct: false
      misconception_id: mc.chm.o.graphite_conducts_by_ions
      feedback: Graphite has no ions. Each carbon atom uses three of its outer electrons in bonds; the fourth is delocalised and moves along the layers.
    - id: C
      text: Each carbon atom has one delocalised electron that can move along the layers.
      correct: true
    - id: D
      text: Graphite is made of small molecules that carry charge.
      correct: false
      misconception_id: mc.chm.o.giant_covalent_as_molecules
      feedback: CO₂ is made of small molecules, but SiO₂ is one huge network of Si–O bonds. Melting it means breaking many strong covalent bonds.
  hints:
  - rung: 1
    name: orient
    text:
      en: Graphite is used in pencils and as electrodes. Picture how the atoms are arranged.
  - rung: 2
    name: concept
    text:
      en: Giant covalent structures are networks of atoms joined by strong covalent bonds, with no separate molecules.
  - rung: 3
    name: first_step
    text:
      en: Decide which bonds or forces are involved in the property asked about.
  - rung: 4
    name: worked_step
    text:
      en: 'Remember the special features: graphite has layers and spare (delocalised) electrons; diamond and SiO₂ have rigid networks in three dimensions.'
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Each carbon atom has one delocalised electron that can move along the layers.'
  misconception_ids:
  - mc.chm.o.graphite_conducts_by_ions
  - mc.chm.o.giant_covalent_as_molecules
  - mc.chm.o.graphite_soft_bonds_weak
