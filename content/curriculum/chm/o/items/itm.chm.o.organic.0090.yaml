id: itm.chm.o.organic.0090
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.combustion
stem: Ethane, C₂H₆, burns completely in air. The unbalanced equation is C₂H₆ + O₂ → CO₂ + H₂O.
parts:
- id: a
  prompt: Balance the equation using the smallest whole numbers. What number goes in front of O₂?
  marks: 2
  answer:
    kind: numeric
    value: '7'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_organic_0090_ratios
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'When ethane burns completely, the only products are carbon dioxide and water: C₂H₆ + O₂ → CO₂ + H₂O.'
  - rung: 2
    name: concept
    text:
      en: Balance carbon first, then hydrogen, and leave oxygen until last, because oxygen turns up in both products when ethane burns.
  - rung: 3
    name: first_step
    text:
      en: One C₂H₆ molecule gives 2 CO₂ (from its carbon) and 3 H₂O (from its hydrogen).
  - rung: 4
    name: worked_step
    text:
      en: 'For one C₂H₆: oxygen atoms on the right = 2 × 2 + 3, an odd number, so you would need half an O₂ molecule. Double every coefficient instead.'
  - rung: 5
    name: full_step
    text:
      en: 'Balanced: 2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O. The number in front of O₂ is 7.'
  misconception_ids:
  - mc.chm.o.organic_combustion_not_lowest
  - mc.chm.o.organic_oxygen_formula_changed
solution:
  steps:
  - n: 1
    latex: '\text{one }\text{C}_2\text{H}_6: 2\text{CO}_2 + 3\text{H}_2\text{O}'
    reason: Carbon and hydrogen first
    check_id: chk_build_chm_organic_0090_one
  - n: 2
    latex: 2 \times 2 + 3 = 7
    reason: Oxygen atoms needed on the right
    check_id: chk_build_chm_organic_0090_oright
  - n: 3
    latex: 2\text{C}_2\text{H}_6 + 7\text{O}_2 \rightarrow 4\text{CO}_2 + 6\text{H}_2\text{O}
    reason: Smallest whole numbers
    check_id: chk_build_chm_organic_0090_bal
  - n: 4
    latex: '\text{O}_2: 7'
    reason: Coefficient of O₂
    check_id: chk_build_chm_organic_0090_ratios
