stem: A metal is a good conductor of electricity whether it is solid or molten.
parts:
- id: a
  prompt: Which particles carry the current through a solid metal wire?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Protons that pass from one atom to the next
      correct: false
      misconception_id: mc.chm.o.metals_conduct_by_moving_ions
      feedback: Protons stay in the nucleus of each atom and never move along the wire. The delocalised electrons carry the current.
    - id: B
      text: Positive metal ions that move along the wire
      correct: false
      misconception_id: mc.chm.o.metals_conduct_by_moving_ions
      feedback: In a solid metal the positive ions stay in their places in the lattice. The delocalised electrons move through the structure and carry the current.
    - id: C
      text: Negative ions that move towards the positive end
      correct: false
      misconception_id: mc.chm.o.metals_conduct_by_moving_ions
      feedback: In a solid metal the positive ions stay in their places in the lattice. The delocalised electrons move through the structure and carry the current.
    - id: D
      text: Delocalised electrons that move through the lattice of positive ions
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A current is a flow of charged particles.
  - rung: 2
    name: concept
    text:
      en: In metallic bonding, positive ions sit in fixed places and some electrons are free to move.
  - rung: 3
    name: first_step
    text:
      en: Ask which particles in a solid metal are free to move.
  - rung: 4
    name: worked_step
    text:
      en: The ions in a solid are held in place in the lattice.
  - rung: 5
    name: full_step
