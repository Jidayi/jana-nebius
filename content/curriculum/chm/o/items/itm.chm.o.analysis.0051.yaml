type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.analysis.purity
stem: Two samples of the same solid are tested. Sample A melts sharply at 80 °C; sample B melts from 74 °C to 78 °C.
parts:
- id: a
  prompt: Which statement is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Sample B is purer, because impurities raise the melting point.
      correct: false
      misconception_id: mc.chm.o.analysis_impurity_raises_mp
      feedback: Impurities lower the melting point and make the solid melt over a range of temperatures.
    - id: B
      text: Sample B is purer, because it melts over a range.
      correct: false
      misconception_id: mc.chm.o.analysis_range_means_pure
      feedback: A pure substance melts sharply at one temperature. Melting over a range is a sign of impurity.
    - id: C
      text: You cannot tell without looking at their colour.
      correct: false
      misconception_id: mc.chm.o.analysis_purity_by_appearance
      feedback: 'Salt water is clear and colourless but is not pure water: it boils above 100 °C.'
    - id: D
      text: Sample A is purer than sample B.
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Two samples of the same solid are tested. Sample A melts sharply at 80 °C; sample B melts from 74 °C to 78 °C. Compare with the pure substance.
  - rung: 2
    name: concept
    text:
      en: A pure substance melts and boils at one fixed temperature.
  - rung: 3
    name: first_step
    text:
      en: Impurities lower the melting point, raise the boiling point and spread melting over a range.
  - rung: 4
    name: worked_step
    text:
      en: Appearance alone cannot show purity.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Sample A is purer than sample B.'
  misconception_ids:
  - mc.chm.o.analysis_range_means_pure
  - mc.chm.o.analysis_impurity_raises_mp
  - mc.chm.o.analysis_purity_by_appearance
solution:
