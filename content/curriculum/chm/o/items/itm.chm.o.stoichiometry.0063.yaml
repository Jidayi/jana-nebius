id: itm.chm.o.stoichiometry.0063
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.reacting_masses
stem: Hydrogen peroxide decomposes. The equation is 2H₂O₂ → 2H₂O + O₂.
parts:
- id: a
  prompt: What mass of O₂ forms from 16.0 g of H₂O₂?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 7.53 g
      correct: true
    - id: B
      text: 8.00 g
      correct: false
      misconception_id: mc.chm.o.mass_ratio_as_mole_ratio
      feedback: 'The equation counts particles, not grams: 2 g of hydrogen does not make 2 g of water. Convert the mass to moles first.'
    - id: C
      text: 15.1 g
      correct: false
      misconception_id: mc.chm.o.ratio_ignored
      feedback: 'Read the ratio from the balanced equation: the numbers in front of the formulae tell you how many moles of each react or form.'
    - id: D
      text: 30.1 g
      correct: false
      misconception_id: mc.chm.o.ratio_inverted
      feedback: 'Write the ratio as ''wanted : given'' from the equation, then multiply the given amount by wanted ÷ given.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Go from mass of H₂O₂ to moles, use the equation, then go back to mass of O₂.
  - rung: 2
    name: concept
    text:
      en: The numbers in a balanced equation are a ratio of moles, never of grams.
  - rung: 3
    name: first_step
    text:
      en: Moles of H₂O₂ = 16.0 ÷ 34 = 0.471 mol.
  - rung: 4
    name: worked_step
    text:
      en: 'The equation gives 2 H₂O₂ : 1 O₂, so moles of O₂ = 0.235 mol.'
  - rung: 5
    name: full_step
    text:
      en: Mass of O₂ = 0.235 × 32 = 7.53 g.
  misconception_ids:
  - mc.chm.o.ratio_ignored
  - mc.chm.o.mass_ratio_as_mole_ratio
  - mc.chm.o.ratio_inverted
solution:
  steps:
  - n: 1
    latex: n(\text{H}_2\text{O}_2) = \frac{16.0}{34} = 0.471
    reason: Moles of the given substance
    check_id: chk_build_chm_stoichiometry_0063_ma
  - n: 2
    latex: '\text{H}_2\text{O}_2 : \text{O}_2 = 2 : 1'
    reason: Ratio from the equation
    check_id: chk_build_chm_stoichiometry_0063_coef
  - n: 3
    latex: n(\text{O}_2) = 0.235
    reason: Mole ratio from the equation
    check_id: chk_build_chm_stoichiometry_0063_chain
  - n: 4
    latex: m(\text{O}_2) = 0.235 \times 32 = 7.53\ \text{g}
    reason: Back to mass
    check_id: chk_build_chm_stoichiometry_0063_mb
