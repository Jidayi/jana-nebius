stem: Sulfur burns in air to form sulfur dioxide, SO₂. The gas dissolves in rain.
parts:
- id: a
  prompt: What type of oxide is sulfur dioxide?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Neutral
      correct: false
    - id: B
      text: Acidic
      correct: true
    - id: C
      text: Amphoteric
      correct: false
      misconception_id: mc.chm.o.acids_amphoteric_neutral_confused
      feedback: 'Amphoteric means ''both'': aluminium oxide and zinc oxide react with acids and with alkalis. Neutral means ''neither'': carbon monoxide, nitrogen monoxide and water react with neither.'
    - id: D
      text: Basic
      correct: false
      misconception_id: mc.chm.o.acids_oxide_type_swapped
      feedback: 'Metal oxides such as CaO and CuO are bases: they react with acids. Non-metal oxides such as CO₂ and SO₂ are acidic: they react with alkalis and give acidic solutions in water.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Is sulfur a metal or a non-metal?
  - rung: 2
    name: concept
    text:
      en: 'Most non-metal oxides are acidic: they react with alkalis and dissolve to give acidic solutions.'
  - rung: 3
    name: first_step
    text:
      en: Sulfur dioxide in rain gives acid rain.
  - rung: 4
    name: worked_step
    text:
      en: 'Think about what sulfur dioxide would react with: an acid or an alkali?'
  - rung: 5
    name: full_step
    text:
      en: Sulfur dioxide is a non-metal oxide that gives an acidic solution and reacts with alkalis, so it is acidic.
  misconception_ids:
  - mc.chm.o.acids_oxide_type_swapped
  - mc.chm.o.acids_amphoteric_neutral_confused
solution:
  steps:
  - n: 1
    latex: \text{SO}_2 + \text{H}_2\text{O} \rightarrow \text{acidic solution}
    reason: Non-metal oxide
