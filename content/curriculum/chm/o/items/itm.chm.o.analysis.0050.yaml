subject: chm
level: o
kc_ids:
- kc.chm.o.analysis.purity
stem: Pure water boils at 100 °C at standard pressure.
parts:
- id: a
  prompt: Which liquid is pure water?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: A colourless liquid that boils at exactly 100 °C
      correct: true
    - id: B
      text: A clear liquid that boils at 102 °C
      correct: false
      misconception_id: mc.chm.o.analysis_purity_by_appearance
      feedback: 'Salt water is clear and colourless but is not pure water: it boils above 100 °C.'
    - id: C
      text: A colourless liquid that freezes at 2 °C
      correct: false
      misconception_id: mc.chm.o.analysis_impurity_raises_mp
      feedback: Impurities lower the melting point and make the solid melt over a range of temperatures.
    - id: D
      text: A colourless liquid that boils steadily from 100 °C to 104 °C
      correct: false
      misconception_id: mc.chm.o.analysis_range_means_pure
      feedback: A pure substance melts sharply at one temperature. Melting over a range is a sign of impurity.
  hints:
  - rung: 1
    name: orient
    text:
      en: Pure water boils at 100 °C at standard pressure. Compare with the pure substance.
  - rung: 2
    name: concept
    text:
      en: A pure substance melts and boils at one fixed temperature.
  - rung: 3
    name: first_step
    text:
      en: Impurities lower the melting point, raise the boiling point and spread melting over a range.
  - rung: 4
    name: worked_step
    text:
      en: Appearance alone cannot show purity.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: A colourless liquid that boils at exactly 100 °C.'
  misconception_ids:
  - mc.chm.o.analysis_purity_by_appearance
  - mc.chm.o.analysis_range_means_pure
  - mc.chm.o.analysis_impurity_raises_mp
solution:
  steps:
  - n: 1
    latex: \text{sharp fixed point = pure}
    reason: Reason
