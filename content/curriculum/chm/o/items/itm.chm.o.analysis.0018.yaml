kc_ids:
- kc.chm.o.analysis.titration_technique
stem: Put these steps for finding the end point carefully in order.
parts:
- id: a
  prompt: Drag the steps into the correct order.
  marks: 2
  answer:
    kind: ordering
    scoring: adjacent_pairs
    elements:
    - id: s3
      text: Add the acid drop by drop, swirling, until the colour just changes.
    - id: s4
      text: Repeat until two titres agree within 0.10 cm³.
    - id: s2
      text: Refill the burette and repeat, adding acid quickly to within about 1 cm³ of the rough value.
    - id: s1
      text: Do a rough titration to find the approximate end point.
    correct_order:
    - s1
    - s2
    - s3
    - s4
  hints:
  - rung: 1
    name: orient
    text:
      en: What has to be ready before anything else can happen?
  - rung: 2
    name: concept
    text:
      en: 'Each step needs something from the step before it: work out what must already be done.'
  - rung: 3
    name: first_step
    text:
      en: 'The first step is: do a rough titration to find the approximate end point.'
  - rung: 4
    name: worked_step
    text:
      en: 'The last step is: repeat until two titres agree within 0.10 cm³.'
  - rung: 5
    name: full_step
    text:
      en: 'Correct order: Do a rough titration to find the approximate end point → Refill the burette and repeat, adding acid quickly to within about 1 cm³ of the rough value → Add the acid drop by drop, swirling, until the colour just changes → Repeat until two titres agree within 0.10 cm³.'
  misconception_ids:
