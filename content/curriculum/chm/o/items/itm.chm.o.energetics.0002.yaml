id: itm.chm.o.energetics.0002
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.energetics.exo_endo
stem: Ammonium nitrate is dissolved in water. The temperature changes from 22 °C to 14 °C.
parts:
- id: a
  prompt: Which describes this change?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Exothermic, so ΔH is positive
      correct: false
      misconception_id: mc.chm.o.energetics_dh_sign_reversed
      feedback: ΔH is the energy change of the chemicals. When they give energy out, they end with less, so ΔH is negative for an exothermic reaction.
    - id: B
      text: 'Endothermic: energy is taken in from the surroundings'
      correct: true
    - id: C
      text: 'Exothermic: bonds were broken, which gives out heat'
      correct: false
      misconception_id: mc.chm.o.energetics_breaking_releases
      feedback: You must put energy in to pull two bonded atoms apart, just as you must pull to separate two magnets. Energy is given out when bonds form.
    - id: D
      text: 'Exothermic: the solution has lost heat to the reaction, so heat was given out'
      correct: false
      misconception_id: mc.chm.o.energetics_temp_rise_endo
      feedback: 'The thermometer measures the surroundings. If they get warmer, the reaction gave energy out: exothermic.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Did the temperature go up or down when this happened (22 °C to 14 °C)?
  - rung: 2
    name: concept
    text:
      en: The thermometer measures the surroundings (the water and the beaker), not the chemicals.
  - rung: 3
    name: first_step
    text:
      en: The change in temperature is -8 °C.
  - rung: 4
    name: worked_step
    text:
      en: If the surroundings get warmer, energy left the reacting chemicals; if they cool, energy went into the chemicals.
  - rung: 5
    name: full_step
    text:
      en: The temperature fell, so the change is endothermic.
  misconception_ids:
  - mc.chm.o.energetics_temp_rise_endo
  - mc.chm.o.energetics_dh_sign_reversed
  - mc.chm.o.energetics_breaking_releases
solution:
  steps:
  - n: 1
    latex: \Delta T = 14 - 22 = -8
    reason: Temperature change
    check_id: chk_build_chm_energetics_0002_d
  - n: 2
    latex: \text{endothermic}
    reason: Warmer surroundings mean energy out
