id: itm.chm.o.stoichiometry.0068
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.reacting_masses
stem: Aluminium reacts with chlorine. The equation is 2Al + 3Cl₂ → 2AlCl₃.
parts:
- id: a
  prompt: Calculate the mass of AlCl₃ that forms from 12.0 g of Al.
  marks: 3
  answer:
    kind: numeric
    value: '59.3'
    unit: g
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0068_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'You know the mass of Al. Plan: mass → moles → ratio → moles → mass.'
  - rung: 2
    name: concept
    text:
      en: Use the balanced equation's numbers as a mole ratio.
  - rung: 3
    name: first_step
    text:
      en: Moles of Al = 12.0 ÷ 27 = 0.444 mol.
  - rung: 4
    name: worked_step
    text:
      en: 'Ratio Al : AlCl₃ is 2 : 2, so moles of AlCl₃ = 0.444 mol.'
  - rung: 5
    name: full_step
    text:
      en: Mass of AlCl₃ = 0.444 × 133.5 = 59.3 g.
  misconception_ids:
  - mc.chm.o.ratio_ignored
  - mc.chm.o.mass_ratio_as_mole_ratio
solution:
  steps:
  - n: 1
    latex: n(\text{Al}) = \frac{12.0}{27} = 0.444\ \text{mol}
    reason: Moles of the given substance
    check_id: chk_build_chm_stoichiometry_0068_ma
  - n: 2
    latex: '\text{Al} : \text{AlCl}_3 = 2 : 2'
    reason: Ratio from the equation
    check_id: chk_build_chm_stoichiometry_0068_coef
  - n: 3
    latex: n(\text{AlCl}_3) = 0.444\ \text{mol}
    reason: Mole ratio from the equation
    check_id: chk_build_chm_stoichiometry_0068_chain
  - n: 4
    latex: m(\text{AlCl}_3) = 0.444 \times 133.5 = 59.3\ \text{g}
    reason: Moles times molar mass
    check_id: chk_build_chm_stoichiometry_0068_mb
