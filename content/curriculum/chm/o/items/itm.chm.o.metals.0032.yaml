stem: Four metals P, Q, R and S are tested. P reacts with cold water. S does not react with cold water but displaces Q from a solution of a salt of Q. Q displaces R from a solution of a salt of R. R does not react with dilute acid.
parts:
- id: a
  prompt: Put the metals in order of reactivity, most reactive first.
  marks: 2
  answer:
    kind: ordering
    scoring: adjacent_pairs
    elements:
    - id: s1
      text: P
    - id: s3
      text: Q
    - id: s4
      text: R
    - id: s2
      text: S
    correct_order:
    - s1
    - s2
    - s3
    - s4
  hints:
  - rung: 1
    name: orient
    text:
      en: Use each observation to place one metal above or below another.
  - rung: 2
    name: concept
    text:
      en: Reacting with cold water marks a very reactive metal; a metal displaces only a less reactive one.
  - rung: 3
    name: first_step
    text:
      en: P is the only metal that reacts with cold water, so it goes first.
  - rung: 4
    name: worked_step
    text:
      en: S displaces Q, and Q displaces R, so these form a chain.
  - rung: 5
    name: full_step
    text:
      en: 'Order: P, S, Q, R. R does not even react with acid, so it is the least reactive.'
  misconception_ids:
