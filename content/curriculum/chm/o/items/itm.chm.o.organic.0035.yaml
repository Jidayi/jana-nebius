id: itm.chm.o.organic.0035
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.general_formulae
stem: A compound is an alcohol with general formula CₙH₂ₙ₊₁OH. Its relative molecular mass is 60.
parts:
- id: a
  prompt: How many carbon atoms, n, does one molecule contain?
  marks: 2
  answer:
    kind: numeric
    value: '3'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_organic_0035_n
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Write the Mr of CₙH₂ₙ₊₁OH in terms of n, then set it equal to 60.
  - rung: 2
    name: concept
    text:
      en: CₙH₂ₙ₊₁OH is n CH₂ units plus one H and one OH.
  - rung: 3
    name: first_step
    text:
      en: Mr = 14n + 18 for this series.
  - rung: 4
    name: worked_step
    text:
      en: Set 14n + 18 = 60. Subtract 18, then divide by 14.
  - rung: 5
    name: full_step
    text:
      en: 'n = (60 − 18) ÷ 14 = 3: the molecule is C₃H₇OH.'
  misconception_ids:
  - mc.chm.o.organic_gf_group_atoms_missed
  - mc.chm.o.organic_gf_hydrogen_mass_ignored
solution:
  steps:
  - n: 1
    latex: \text{CH}_2 = 14
    reason: One CH₂ unit
    check_id: chk_build_chm_organic_0035_ch2
  - n: 2
    latex: 16 + 1 + 1 = 18
    reason: Atoms outside the CH₂ units
    check_id: chk_build_chm_organic_0035_rest
  - n: 3
    latex: n = \frac{60 - 18}{14} = 3
    reason: Solve for n
    check_id: chk_build_chm_organic_0035_n
