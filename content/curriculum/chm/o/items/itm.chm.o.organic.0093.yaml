id: itm.chm.o.organic.0093
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.combustion
stem: Ethene, C₂H₄, burns completely in air. The unbalanced equation is C₂H₄ + O₂ → CO₂ + H₂O.
parts:
- id: a
  prompt: Balance the equation using the smallest whole numbers. What number goes in front of O₂?
  marks: 2
  answer:
    kind: numeric
    value: '3'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_organic_0093_ratios
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'When ethene burns completely, the only products are carbon dioxide and water: C₂H₄ + O₂ → CO₂ + H₂O.'
  - rung: 2
    name: concept
    text:
      en: Balance carbon first, then hydrogen, and leave oxygen until last, because oxygen turns up in both products when ethene burns.
  - rung: 3
    name: first_step
    text:
      en: One C₂H₄ molecule gives 2 CO₂ (from its carbon) and 2 H₂O (from its hydrogen).
  - rung: 4
    name: worked_step
    text:
      en: 'For one C₂H₄: oxygen atoms on the right = 2 × 2 + 2 = 6. Each O₂ molecule supplies two of them.'
  - rung: 5
    name: full_step
    text:
      en: 'Balanced: C₂H₄ + 3O₂ → 2CO₂ + 2H₂O. The number in front of O₂ is 3.'
  misconception_ids:
  - mc.chm.o.organic_combustion_not_lowest
  - mc.chm.o.organic_oxygen_formula_changed
solution:
  steps:
  - n: 1
    latex: '\text{one }\text{C}_2\text{H}_4: 2\text{CO}_2 + 2\text{H}_2\text{O}'
    reason: Carbon and hydrogen first
    check_id: chk_build_chm_organic_0093_one
  - n: 2
    latex: 2 \times 2 + 2 = 6
    reason: Oxygen atoms needed on the right
    check_id: chk_build_chm_organic_0093_oright
  - n: 3
    latex: \text{C}_2\text{H}_4 + 3\text{O}_2 \rightarrow 2\text{CO}_2 + 2\text{H}_2\text{O}
    reason: Smallest whole numbers
    check_id: chk_build_chm_organic_0093_bal
  - n: 4
    latex: '\text{O}_2: 3'
    reason: Coefficient of O₂
    check_id: chk_build_chm_organic_0093_ratios
