- kc.chm.o.energetics.calorimetry
stem: 0.0200 mol of an acid is neutralised in a polystyrene cup. The 40.0 g of water (or solution) changes temperature from 20.5 °C to 26.0 °C. Take the specific heat capacity of water as 4.2 J/(g °C).
parts:
- id: a
  prompt: Calculate the energy transferred to or from the water, in kJ.
  marks: 2
  answer:
    kind: numeric
    value: '0.924'
    unit: kJ
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_energetics_0042_q
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The water's temperature changed; that tells you the energy transferred.
  - rung: 2
    name: concept
    text:
      en: Q = m × c × ΔT, using the mass of the water and c = 4.2 J/(g °C).
  - rung: 3
    name: first_step
    text:
      en: ΔT = 26.0 − 20.5 = 5.5 °C.
  - rung: 4
    name: worked_step
    text:
      en: Q = 40.0 × 4.2 × 5.5 J; divide by 1000 for kJ.
  - rung: 5
    name: full_step
    text:
      en: Q = 924 J = 0.924 kJ.
  misconception_ids:
  - mc.chm.o.energetics_mass_of_reactant
solution:
  steps:
  - n: 1
    latex: \Delta T = 5.5
    reason: Change in temperature
    check_id: chk_build_chm_energetics_0042_dh
  - n: 2
    latex: Q = 40.0 \times 4.2 \times 5.5 = 924\ \text{J}
    reason: Q = mc\Delta T
    check_id: chk_build_chm_energetics_0042_dh
  - n: 3
    latex: Q = 0.924\ \text{kJ}
    reason: J to kJ
    check_id: chk_build_chm_energetics_0042_q
