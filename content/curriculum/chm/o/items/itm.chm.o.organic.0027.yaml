id: itm.chm.o.organic.0027
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.general_formulae
stem: A carboxylic acid in the series CₙH₂ₙ₊₁COOH has 3 carbon atoms in each molecule.
parts:
- id: a
  prompt: Which gives its molecular formula and relative molecular mass?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: C₂H₅COOH, Mr 36
      correct: false
      misconception_id: mc.chm.o.organic_gf_hydrogen_mass_ignored
      feedback: 'Every atom adds its mass. Hydrogen atoms are light, but there are many of them: each CH₂ unit has a mass of 14, not 12.'
    - id: B
      text: C₃H₇OH, Mr 60
      correct: false
      misconception_id: mc.chm.o.organic_gf_wrong_series
      feedback: 'Match the formula to the family: alkanes CₙH₂ₙ₊₂, alkenes CₙH₂ₙ, alcohols CₙH₂ₙ₊₁OH, carboxylic acids CₙH₂ₙ₊₁COOH. Check: an alkene has exactly twice as many hydrogen atoms as carbon atoms.'
    - id: C
      text: C₂H₅COOH, Mr 74
      correct: true
    - id: D
      text: C₃H₇COOH, Mr 88
      correct: false
      misconception_id: mc.chm.o.organic_gf_group_atoms_missed
      feedback: Write the full formula first, functional group included, and count every atom. In CₙH₂ₙ₊₁COOH the –COOH group holds one more carbon atom, so the molecule has n + 1 carbon atoms.
  hints:
  - rung: 1
    name: orient
    text:
      en: In CₙH₂ₙ₊₁COOH, n counts only the carbon atoms in the chain joined to –COOH.
  - rung: 2
    name: concept
    text:
      en: The –COOH group holds one carbon atom of its own, so the molecule has n + 1 carbon atoms.
  - rung: 3
    name: first_step
    text:
      en: With 3 carbon atoms in total, n = 3 − 1.
  - rung: 4
    name: worked_step
    text:
      en: So the chain is C₂H₅ and the formula is C₂H₅COOH. Add the masses of every atom, including both oxygens.
  - rung: 5
    name: full_step
    text:
      en: 'C₂H₅COOH (propanoic acid): Mr = 74.'
  misconception_ids:
  - mc.chm.o.organic_gf_group_atoms_missed
  - mc.chm.o.organic_gf_wrong_series
  - mc.chm.o.organic_gf_hydrogen_mass_ignored
solution:
  steps:
  - n: 1
    latex: n = 3 - 1 = 2
    reason: One carbon is in –COOH
    check_id: chk_build_chm_organic_0027_n
  - n: 2
    latex: M_r(\text{C}_2\text{H}_5\text{COOH}) = 74
    reason: Sum of the Ar values
    check_id: chk_build_chm_organic_0027_mr
