- kc.chm.o.organic.fuels_and_cracking
stem: Long-chain alkanes from petroleum are cracked at a refinery.
parts:
- id: a
  prompt: Which statement describes cracking?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Small molecules are joined into larger ones that boil more easily
      correct: false
      misconception_id: mc.chm.o.organic_big_molecules_boil_low
      feedback: Larger molecules attract each other more strongly, so they need more energy to boil. They stay low in the column, where it is hottest; small molecules rise to the cool top.
    - id: B
      text: Heat and a catalyst break large alkane molecules into smaller alkanes and alkenes
      correct: true
    - id: C
      text: Each fraction is purified until it contains only one compound
      correct: false
      misconception_id: mc.chm.o.organic_fraction_is_one_compound
      feedback: Fractional distillation sorts molecules into groups by boiling point. Each fraction is still a mixture of many hydrocarbons whose boiling points lie in a similar range.
    - id: D
      text: Large and small molecules already in the mixture are separated by boiling point
      correct: false
      misconception_id: mc.chm.o.organic_cracking_is_separation
      feedback: 'Distillation separates molecules without changing them. Cracking is a chemical reaction: heat and a catalyst break C–C bonds, so large alkanes become smaller alkanes and alkenes.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Cracking is a chemical reaction, not a way of separating a mixture.
  - rung: 2
    name: concept
    text:
      en: In cracking, C–C bonds in long chains are broken at a high temperature, with a catalyst.
  - rung: 3
    name: first_step
    text:
      en: The products are shorter molecules than the starting alkane.
  - rung: 4
    name: worked_step
    text:
      en: There are not enough hydrogen atoms for every product to be an alkane, so some products have a C=C bond.
  - rung: 5
    name: full_step
    text:
      en: Cracking breaks large alkanes into smaller alkanes and alkenes, using heat and a catalyst.
  misconception_ids:
  - mc.chm.o.organic_cracking_is_separation
  - mc.chm.o.organic_big_molecules_boil_low
  - mc.chm.o.organic_fraction_is_one_compound
solution:
  steps:
  - n: 1
    latex: \text{large alkane }\rightarrow\text{ smaller alkane + alkene}
    reason: Thermal decomposition with a catalyst
