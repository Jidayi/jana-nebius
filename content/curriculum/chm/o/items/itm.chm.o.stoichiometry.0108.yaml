stem: A compound has the empirical formula C₂H₄O and a relative molecular mass of 88.
parts:
- id: a
  prompt: How many C atoms are there in one molecule of the compound?
  marks: 2
  answer:
    kind: numeric
    value: '4'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0108_atoms
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The molecular formula is a whole-number multiple of the empirical formula.
  - rung: 2
    name: concept
    text:
      en: Divide the relative molecular mass by the mass of one empirical formula unit to find the multiple.
  - rung: 3
    name: first_step
    text:
      en: The empirical formula C₂H₄O has a mass of 44.
  - rung: 4
    name: worked_step
    text:
      en: 88 ÷ 44 = 2, so multiply every number in C₂H₄O by 2.
  - rung: 5
    name: full_step
    text:
      en: The molecular formula is C₄H₈O₂, which has 4 C atoms.
  misconception_ids:
  - mc.chm.o.empirical_mass_ratio
solution:
  steps:
  - n: 1
    latex: M_r(\text{C}_2\text{H}_4\text{O}) = 44
    reason: Mass of the empirical unit
    check_id: chk_build_chm_stoichiometry_0108_emp
  - n: 2
    latex: \frac{88}{44} = 2
    reason: How many units in one molecule
    check_id: chk_build_chm_stoichiometry_0108_factor
  - n: 3
    latex: '\text{C}_4\text{H}_8\text{O}_2: M_r = 88'
    reason: Molecular formula
    check_id: chk_build_chm_stoichiometry_0108_mol
  - n: 4
    latex: C = 4
    reason: Atoms of C
    check_id: chk_build_chm_stoichiometry_0108_atoms
