id: itm.chm.o.analysis.0038
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.analysis.separation
stem: A student wants pure water from sea water.
parts:
- id: a
  prompt: Which method gives pure water?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Chromatography
      correct: false
      misconception_id: mc.chm.o.analysis_method_for_wrong_mixture
      feedback: Chromatography separates small amounts of dissolved coloured substances to identify them. It cannot collect pure water from sea water.
    - id: B
      text: Simple distillation
      correct: true
    - id: C
      text: Filtration
      correct: false
      misconception_id: mc.chm.o.analysis_filter_dissolved
      feedback: Dissolved particles are as small as water particles and pass through filter paper. Filtration only removes undissolved solids.
    - id: D
      text: Evaporation to dryness
      correct: false
      misconception_id: mc.chm.o.analysis_evaporate_to_collect_liquid
      feedback: Evaporation keeps the solid and loses the liquid. To collect the liquid, distil it and condense the vapour.
  hints:
  - rung: 1
    name: orient
    text:
      en: A student wants pure water from sea water. Which parts are dissolved, which are solids, and which are liquids?
  - rung: 2
    name: concept
    text:
      en: Filtration removes undissolved solids; crystallisation and evaporation recover a dissolved solid; distillation recovers a liquid; fractional distillation separates liquids that mix.
  - rung: 3
    name: first_step
    text:
      en: Decide which part you want to keep.
  - rung: 4
    name: worked_step
    text:
      en: Pick the method that keeps that part and removes the rest.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Simple distillation.'
  misconception_ids:
  - mc.chm.o.analysis_filter_dissolved
  - mc.chm.o.analysis_evaporate_to_collect_liquid
  - mc.chm.o.analysis_method_for_wrong_mixture
solution:
