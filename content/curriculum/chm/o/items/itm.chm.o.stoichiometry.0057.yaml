  - rung: 2
    name: concept
    text:
      en: Amount (mol) = mass (g) ÷ molar mass (g/mol); the molar mass is Mr in g/mol.
  - rung: 3
    name: first_step
    text:
      en: The molar mass of Al₂O₃ is 102 g/mol.
  - rung: 4
    name: worked_step
