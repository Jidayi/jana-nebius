stem: Acidified potassium manganate(VII) solution is purple. It turns colourless when it reacts with a reducing agent such as iron(II) ions.
parts:
- id: a
  prompt: What happens to the manganate(VII) ions in this reaction?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: They are reduced.
      correct: true
    - id: B
      text: They are neutralised.
      correct: false
    - id: C
      text: They are not changed.
      correct: false
    - id: D
      text: They are oxidised.
      correct: false
      misconception_id: mc.chm.o.reactions_oxidising_agent_is_oxidised
      feedback: An agent does the job to something else. The oxidising agent oxidises another substance by taking its electrons, so the oxidising agent itself is reduced. The reducing agent gives electrons away and is oxidised.
  hints:
  - rung: 1
    name: orient
    text:
      en: The manganate(VII) reacts with a reducing agent.
  - rung: 2
    name: concept
    text:
      en: A reducing agent reduces something else and is itself oxidised.
  - rung: 3
    name: first_step
    text:
      en: The manganate(VII) ions are the substance being acted on by the reducing agent.
  - rung: 4
    name: worked_step
    text:
      en: The colour change from purple to colourless shows that the manganate(VII) ions have changed.
  - rung: 5
    name: full_step
    text:
      en: The manganate(VII) ions are reduced, which is why the purple colour disappears; they act as an oxidising agent.
  misconception_ids:
  - mc.chm.o.reactions_oxidising_agent_is_oxidised
