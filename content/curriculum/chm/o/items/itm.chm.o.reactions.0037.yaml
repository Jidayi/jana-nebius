  - rung: 2
    name: concept
    text:
      en: Mean rate = volume of gas formed ÷ time taken.
  - rung: 3
    name: first_step
    text:
      en: Volume of hydrogen = 48; time taken = 30 s.
  - rung: 4
    name: worked_step
    text:
      en: 'Put the amount on top: divide 48 by 30.'
  - rung: 5
