stem: Put these steps of an acid-alkali titration in order.
parts:
- id: a
  prompt: Drag the steps into the correct order.
  marks: 2
  answer:
    kind: ordering
    scoring: adjacent_pairs
    elements:
    - id: s3
      text: Rinse the burette with the acid, fill it and record the starting volume.
    - id: s4
      text: Add acid from the burette, swirling, until the indicator just changes colour.
    - id: s1
      text: Rinse the pipette with the alkali and transfer a measured volume of alkali to a conical flask.
    - id: s2
      text: Add a few drops of indicator to the flask.
    - id: s5
      text: Record the final burette reading and work out the titre.
    correct_order:
    - s1
    - s2
    - s3
    - s4
    - s5
