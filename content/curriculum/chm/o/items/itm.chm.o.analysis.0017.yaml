  - rung: 3
    name: first_step
    text:
      en: 'The first step is: rinse the pipette with the alkali and transfer a measured volume of alkali to a conical flask.'
  - rung: 4
    name: worked_step
    text:
      en: 'The last step is: record the final burette reading and work out the titre.'
  - rung: 5
    name: full_step
    text:
      en: 'Correct order: Rinse the pipette with the alkali and transfer a measured volume of alkali to a conical flask → Add a few drops of indicator to the flask → Rinse the burette with the acid, fill it and record the starting volume → Add acid from the burette, swirling, until the indicator just changes colour → Record the final burette reading and work out the titre.'
