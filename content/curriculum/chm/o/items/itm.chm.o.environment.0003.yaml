id: itm.chm.o.environment.0003
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.environment.water
stem: Pure water melts at 0 °C and boils at 100 °C at standard pressure. A student wants to show that a sample of water is pure.
parts:
- id: a
  prompt: Which test shows that the sample is pure?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Filter it and check that nothing is left on the filter paper
      correct: false
      misconception_id: mc.chm.o.environment_treatment_stages_mixed
      feedback: Each stage has one job. Sedimentation lets large particles settle. Filtration removes small insoluble particles. Carbon removes tastes and smells. Chlorine kills microbes. None of these removes dissolved salts, so tap water is not pure.
    - id: B
      text: Check that it boils at exactly 100 °C at standard pressure
      correct: true
    - id: C
      text: Touch it with cobalt(II) chloride paper and see it turn from pink to blue
      correct: false
      misconception_id: mc.chm.o.environment_water_test_colours_reversed
      feedback: The dry form is the starting colour and water gives the hydrated colour. Anhydrous copper(II) sulfate is white and turns blue. Dry cobalt(II) chloride paper is blue and turns pink.
    - id: D
      text: Add anhydrous copper(II) sulfate and see it turn blue
      correct: false
      misconception_id: mc.chm.o.environment_water_test_shows_purity
      feedback: These tests react with any water, even water with salt or other substances dissolved in it. They show that water is present, not that it is pure. To check purity, measure the boiling point or the melting point and compare it with the value for pure water.
  hints:
  - rung: 1
    name: orient
    text:
      en: A pure substance has a fixed melting point and a fixed boiling point.
  - rung: 2
    name: concept
    text:
      en: Dissolved substances raise the boiling point of water and lower its melting point.
  - rung: 3
    name: first_step
    text:
      en: Colour tests show that water is there; they cannot tell pure water from salty water.
  - rung: 4
    name: worked_step
    text:
      en: Filtration removes only insoluble bits, so dissolved substances pass straight through the filter.
  - rung: 5
    name: full_step
    text:
      en: Pure water boils at exactly 100 °C at standard pressure, so measuring the boiling point tests purity.
  misconception_ids:
  - mc.chm.o.environment_water_test_shows_purity
  - mc.chm.o.environment_water_test_colours_reversed
  - mc.chm.o.environment_treatment_stages_mixed
