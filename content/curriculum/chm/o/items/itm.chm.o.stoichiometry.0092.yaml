stem: 4.00 g of copper(II) sulfate, CuSO₄ is dissolved to make 100 cm³ of solution.
parts:
- id: a
  prompt: Calculate the concentration of the solution in mol/dm³.
  marks: 2
  answer:
    kind: numeric
    value: '0.250'
    unit: mol/dm^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0092_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You need moles of solute and the volume in dm³.
  - rung: 2
    name: concept
    text:
      en: Convert the mass to moles (÷ Mr), then c = n ÷ V.
  - rung: 3
    name: first_step
    text:
      en: Moles = 4.00 ÷ 160 = 0.0250 mol.
  - rung: 4
    name: worked_step
    text:
      en: Volume = 100 ÷ 1000 dm³; now divide 0.0250 by it.
  - rung: 5
    name: full_step
    text:
      en: c = 0.250 mol/dm³.
  misconception_ids:
  - mc.chm.o.conc_mass_as_moles
  - mc.chm.o.conc_volume_not_converted
solution:
  steps:
  - n: 1
    latex: n = \frac{4.00}{160} = 0.0250\ \text{mol}
    reason: Mass to moles
    check_id: chk_build_chm_stoichiometry_0092_mr
  - n: 2
    latex: c = \frac{0.0250}{100 \div 1000} = 0.250\ \text{mol/dm}^3
    reason: Amount over volume in dm³
    check_id: chk_build_chm_stoichiometry_0092_chain
