id: itm.chm.o.environment.0039
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.environment.climate
stem: A government wants to slow down climate change.
parts:
- id: a
  prompt: Which action would help most?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Adding flue gas desulfurisation to every coal power station
      correct: false
      misconception_id: mc.chm.o.environment_climate_wrong_gas
      feedback: The main greenhouse gases to know are carbon dioxide and methane. Nitrogen and oxygen are not greenhouse gases. Catalytic converters and desulfurisation fight other pollutants, not climate change.
    - id: B
      text: Generating electricity from wind and solar power instead of burning coal
      correct: true
    - id: C
      text: Banning aerosol sprays that damage the ozone layer
      correct: false
      misconception_id: mc.chm.o.environment_greenhouse_ozone_confused
      feedback: These are two different problems. The ozone layer stops harmful ultraviolet light; damage to it raises the risk of skin cancer. Global warming is caused by greenhouse gases trapping heat (infrared) given off by the Earth.
    - id: D
      text: Fitting catalytic converters to remove carbon dioxide from car exhausts
      correct: false
      misconception_id: mc.chm.o.environment_converter_removes_co2
      feedback: A catalytic converter changes carbon monoxide and oxides of nitrogen into carbon dioxide and nitrogen. It makes carbon dioxide; it does not remove it, and it does nothing to sulfur dioxide.
  hints:
  - rung: 1
    name: orient
    text:
      en: Which gas is released in the largest amounts by human activity?
  - rung: 2
    name: concept
    text:
      en: Burning fossil fuels releases carbon dioxide, a greenhouse gas.
  - rung: 3
    name: first_step
    text:
      en: Catalytic converters and desulfurisation remove other pollutants; they do not remove carbon dioxide.
  - rung: 4
    name: worked_step
    text:
      en: Which choice stops carbon dioxide being made in the first place?
  - rung: 5
    name: full_step
    text:
      en: Using wind and solar power instead of coal cuts the carbon dioxide released, slowing climate change.
  misconception_ids:
  - mc.chm.o.environment_greenhouse_ozone_confused
  - mc.chm.o.environment_converter_removes_co2
  - mc.chm.o.environment_climate_wrong_gas
solution:
  steps:
  - n: 1
    latex: \text{less fossil fuel burned }\rightarrow\text{ less CO}_2
    reason: Reducing emissions
