stem: Dilute nitric acid and then barium nitrate solution are added to a solution. A white precipitate forms.
parts:
- id: a
  prompt: Which anion is present?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: CO₃²⁻
      correct: false
      misconception_id: mc.chm.o.analysis_carbonate_gas_hydrogen
      feedback: Acid + carbonate gives carbon dioxide, which turns limewater milky. Hydrogen comes from acid + metal.
    - id: B
      text: I⁻
      correct: false
      misconception_id: mc.chm.o.analysis_halide_colours_mixed
      feedback: 'Silver chloride is white, silver bromide cream, silver iodide yellow: the colour deepens down Group VII.'
    - id: C
      text: SO₄²⁻
      correct: true
    - id: D
      text: Cl⁻
      correct: false
      misconception_id: mc.chm.o.analysis_wrong_reagent_for_anion
      feedback: 'Halides: acidified silver nitrate. Sulfate: acidified barium nitrate (or chloride). Carbonate: dilute acid.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Which reagent was used, and what was seen?
  - rung: 2
    name: concept
    text:
      en: Silver nitrate tests for halides; barium nitrate for sulfate; dilute acid for carbonate.
  - rung: 3
    name: first_step
    text:
      en: 'Silver halides: chloride white, bromide cream, iodide yellow.'
  - rung: 4
    name: worked_step
    text:
      en: Match the reagent and the observation to one ion.
  - rung: 5
    name: full_step
    text:
      en: The anion is SO₄²⁻; the solid involved is BaSO₄ (Mr 233).
  misconception_ids:
