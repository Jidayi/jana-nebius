stem: In the aluminium cell, oxygen forms at the carbon anodes, which are hot.
parts:
- id: a
  prompt: Why must the anodes be replaced regularly?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: The hot carbon reacts with the oxygen and burns away as carbon dioxide.
      correct: true
    - id: B
      text: Aluminium builds up on them.
      correct: false
    - id: C
      text: They are used up by reducing aluminium oxide.
      correct: false
      misconception_id: mc.chm.o.electrolysis_aluminium_by_carbon
      feedback: Carbon can only remove oxygen from oxides of metals less reactive than carbon. Aluminium is more reactive than carbon, so its oxide must be decomposed by electrolysis, even though that uses a lot of electricity.
    - id: D
      text: They dissolve in the cryolite as carbon ions.
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: What forms at the anode, and what are the anodes made of?
  - rung: 2
    name: concept
    text:
      en: Hot carbon reacts with oxygen.
  - rung: 3
    name: first_step
    text:
      en: The product of carbon burning in oxygen is a gas.
  - rung: 4
    name: worked_step
    text:
      en: As the gas forms, carbon is lost from the anode.
  - rung: 5
    name: full_step
    text:
      en: The carbon anodes react with the oxygen formed on them, making carbon dioxide, so they wear away.
  misconception_ids:
  - mc.chm.o.electrolysis_aluminium_by_carbon
solution:
  steps:
  - n: 1
    latex: \text{C + }\text{O}_2 \rightarrow \text{CO}_2
    reason: The anodes burn away
