stem: 'A gas reaction is at equilibrium in a sealed vessel: N2(g) + 3H2(g) <=> 2NH3(g). More hydrogen is added at constant temperature.'
parts:
- id: a
  prompt: After equilibrium is re-established, which change is expected?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: More ammonia is present because added hydrogen favours the forward reaction.
      correct: true
    - id: B
      text: All nitrogen and hydrogen disappear because the reaction becomes irreversible.
      correct: false
    - id: C
      text: Less ammonia is present because a reactant was added.
      correct: false
    - id: D
      text: The amounts of every gas stay the same because equilibrium prevents change.
      correct: false
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: An equilibrium shifts in the direction that consumes some of an added reactant.
  - rung: 2
    name: concept
    text:
      en: The reaction remains reversible.
  - rung: 3
    name: first_step
    text:
      en: Identify the side on which the added gas appears, then choose the direction that uses some of it.
  - rung: 4
    name: worked_step
    text:
      en: The added reactant is partly consumed; the reaction remains reversible rather than going to completion.
  - rung: 5
    name: full_step
    text:
      en: The answer is More ammonia is present because added hydrogen favours the forward reaction..
solution:
