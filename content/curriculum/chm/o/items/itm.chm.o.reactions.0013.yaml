stem: Two experiments use the same mass of calcium carbonate and the same volume and concentration of excess dilute hydrochloric acid. In one the carbonate is large lumps; in the other it is powder.
parts:
- id: a
  prompt: Which statement is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: The lumps react faster and give more carbon dioxide in total.
      correct: false
      misconception_id: mc.chm.o.reactions_bigger_pieces_faster
      feedback: Only the particles on the surface of a solid can be hit by the other reactant. Cutting a lump into small pieces, or grinding it to powder, exposes much more surface for the same mass, so the reaction is faster.
    - id: B
      text: The powder reacts faster, and both give the same total volume of carbon dioxide.
      correct: true
    - id: C
      text: The powder reacts faster and gives more carbon dioxide in total.
      correct: false
      misconception_id: mc.chm.o.reactions_rate_changes_amount
      feedback: The rate is how fast product forms; the total amount depends on how much of the limiting reactant there is. With the same amount of that reactant, a faster reaction reaches the same final amount, only sooner.
    - id: D
      text: The lumps react faster, because each lump has more carbonate in it.
      correct: false
      misconception_id: mc.chm.o.reactions_bigger_pieces_faster
      feedback: Only the particles on the surface of a solid can be hit by the other reactant. Cutting a lump into small pieces, or grinding it to powder, exposes much more surface for the same mass, so the reaction is faster.
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Two questions: which is faster, and does the total amount of gas change?'
  - rung: 2
    name: concept
    text:
      en: Only the surface of a solid can react. The total gas depends on how much carbonate there is.
  - rung: 3
    name: first_step
    text:
      en: The same mass of carbonate is used in both experiments, and the acid is in excess.
  - rung: 4
    name: worked_step
    text:
      en: Powder has far more surface exposed than a few lumps of the same mass.
  - rung: 5
    name: full_step
    text:
      en: The powder is faster because it has a larger surface area. The total volume of gas is the same, because the same mass of carbonate reacts completely.
  misconception_ids:
  - mc.chm.o.reactions_bigger_pieces_faster
  - mc.chm.o.reactions_rate_changes_amount
solution:
  steps:
  - n: 1
    latex: '\text{powder: larger surface area, faster}'
    reason: Rate
  - n: 2
