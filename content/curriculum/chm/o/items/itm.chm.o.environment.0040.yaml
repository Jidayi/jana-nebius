id: itm.chm.o.environment.0040
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.environment.climate
stem: The average temperature of the Earth is rising.
parts:
- id: a
  prompt: Which is a likely effect of this climate change?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: The Earth cools, because greenhouse gases stop sunlight reaching the ground
      correct: false
      misconception_id: mc.chm.o.environment_greenhouse_blocks_sunlight
      feedback: Most sunlight passes through the air and warms the ground. The warm ground gives off infrared radiation. Greenhouse gases absorb this infrared and send some of it back towards the surface, so the lower air stays warmer.
    - id: B
      text: More skin cancer, because more ultraviolet light gets through
      correct: false
      misconception_id: mc.chm.o.environment_greenhouse_ozone_confused
      feedback: These are two different problems. The ozone layer stops harmful ultraviolet light; damage to it raises the risk of skin cancer. Global warming is caused by greenhouse gases trapping heat (infrared) given off by the Earth.
    - id: C
      text: More acid rain falls on forests
      correct: false
      misconception_id: mc.chm.o.environment_climate_wrong_gas
      feedback: The main greenhouse gases to know are carbon dioxide and methane. Nitrogen and oxygen are not greenhouse gases. Catalytic converters and desulfurisation fight other pollutants, not climate change.
    - id: D
      text: Sea levels rise as ice melts, and extreme weather becomes more common
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what happens to ice and to weather when the Earth warms.
  - rung: 2
    name: concept
    text:
      en: Warmer temperatures melt glaciers and ice sheets.
  - rung: 3
    name: first_step
    text:
      en: Warmer seas also expand and give more energy to storms.
  - rung: 4
    name: worked_step
    text:
      en: Ultraviolet light and acid rain are linked to other problems, not to warming.
  - rung: 5
    name: full_step
    text:
      en: Climate change causes rising sea levels, more floods, droughts and storms.
  misconception_ids:
  - mc.chm.o.environment_greenhouse_ozone_confused
  - mc.chm.o.environment_greenhouse_blocks_sunlight
  - mc.chm.o.environment_climate_wrong_gas
solution:
  steps:
  - n: 1
    latex: \text{warming }\rightarrow\text{ melting ice, rising seas, extreme weather}
    reason: Effects
