  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Mr is the sum of the relative atomic masses of all the atoms in Na₂CO₃.
  - rung: 2
    name: concept
    text:
      en: Multiply each element's relative atomic mass by the number of its atoms, then add.
  - rung: 3
    name: first_step
    text:
      en: Count the atoms of each element in Na₂CO₃.
  - rung: 4
    name: worked_step
    text:
      en: 'In Na₂CO₃: two Na atoms give 46, one C atom gives 12 and three O atoms give 48.'
  - rung: 5
    name: full_step
    text:
      en: Mr of Na₂CO₃ = 106.
  misconception_ids:
