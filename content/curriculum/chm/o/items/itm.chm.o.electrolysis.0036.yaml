  - rung: 1
    name: orient
    text:
      en: This time the metal atom is turned into an ion, so electrons are lost.
  - rung: 2
    name: concept
    text:
      en: The charge on the left must equal the total charge on the right.
  - rung: 3
    name: first_step
    text:
      en: A copper atom is neutral; the copper ion it forms is Cu²⁺.
  - rung: 4
    name: worked_step
    text:
      en: The electrons on the right must cancel the positive charge of the copper ion.
  - rung: 5
    name: full_step
    text:
      en: 'Cu → Cu²⁺ + 2e⁻: n = 2, so the charges balance.'
  misconception_ids:
