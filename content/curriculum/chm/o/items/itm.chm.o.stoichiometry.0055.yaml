id: itm.chm.o.stoichiometry.0055
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.moles_and_mass
stem: A student weighs out 20.0 g of sulfuric acid, H₂SO₄.
parts:
- id: a
  prompt: Calculate the amount of H₂SO₄ in moles.
  marks: 2
  answer:
    kind: numeric
    value: '0.204'
    unit: mol
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0055_n
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You have a mass of H₂SO₄; you want an amount in moles.
  - rung: 2
    name: concept
    text:
      en: Amount (mol) = mass (g) ÷ molar mass (g/mol); the molar mass is Mr in g/mol.
  - rung: 3
    name: first_step
    text:
      en: The molar mass of H₂SO₄ is 98 g/mol.
  - rung: 4
    name: worked_step
    text:
      en: Work out 20.0 ÷ 98.
  - rung: 5
    name: full_step
    text:
      en: 20.0 ÷ 98 = 0.204 mol.
  misconception_ids:
  - mc.chm.o.moles_ratio_inverted
  - mc.chm.o.moles_multiply_mass
solution:
  steps:
  - n: 1
    latex: M(\text{H}_2\text{SO}_4) = 98\ \text{g/mol}
    reason: Molar mass from Mr
    check_id: chk_build_chm_stoichiometry_0055_mr
  - n: 2
    latex: n = \frac{20.0}{98}
    reason: Amount is mass over molar mass
  - n: 3
    latex: n = 0.204\ \text{mol}
    reason: Divide
    check_id: chk_build_chm_stoichiometry_0055_n
