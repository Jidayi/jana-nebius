stem: Potassium hydroxide solution is neutralised by dilute nitric acid.
parts:
- id: a
  prompt: Which salt forms?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Potassium chloride
      correct: false
      misconception_id: mc.chm.o.acids_salt_anion_confused
      feedback: The acid names the salt. Hydrochloric acid makes chlorides, sulfuric acid makes sulfates and nitric acid makes nitrates. The metal (or ammonium) gives the first part of the name.
    - id: B
      text: Potassium sulfate
      correct: false
      misconception_id: mc.chm.o.acids_salt_anion_confused
      feedback: The acid names the salt. Hydrochloric acid makes chlorides, sulfuric acid makes sulfates and nitric acid makes nitrates. The metal (or ammonium) gives the first part of the name.
    - id: C
      text: Potassium nitrate
      correct: true
    - id: D
      text: Potassium nitride
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Neutralisation gives a salt and water. Which acid was used?
  - rung: 2
    name: concept
    text:
      en: The metal gives the first part of the salt's name and the acid gives the second part.
  - rung: 3
    name: first_step
    text:
      en: Hydrochloric acid gives chlorides, sulfuric acid gives sulfates and nitric acid gives nitrates.
  - rung: 4
    name: worked_step
    text:
      en: Combine potassium with the ending that nitric acid gives.
  - rung: 5
    name: full_step
    text:
      en: 'KOH + HNO₃ → KNO₃ + H₂O: the salt is potassium nitrate.'
  misconception_ids:
  - mc.chm.o.acids_salt_anion_confused
