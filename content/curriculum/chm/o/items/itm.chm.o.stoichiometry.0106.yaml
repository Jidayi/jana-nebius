stem: A compound has the empirical formula P₂O₅ and a relative molecular mass of 284.
parts:
- id: a
  prompt: How many O atoms are there in one molecule of the compound?
  marks: 2
  answer:
    kind: numeric
    value: '10'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0106_atoms
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The molecular formula is a whole-number multiple of the empirical formula.
  - rung: 2
    name: concept
    text:
      en: Divide the relative molecular mass by the mass of one empirical formula unit to find the multiple.
  - rung: 3
    name: first_step
    text:
      en: The empirical formula P₂O₅ has a mass of 142.
  - rung: 4
    name: worked_step
    text:
      en: 284 ÷ 142 = 2, so multiply every number in P₂O₅ by 2.
  - rung: 5
    name: full_step
    text:
      en: The molecular formula is P₄O₁₀, which has 10 O atoms.
  misconception_ids:
  - mc.chm.o.empirical_mass_ratio
solution:
  steps:
  - n: 1
    latex: M_r(\text{P}_2\text{O}_5) = 142
    reason: Mass of the empirical unit
    check_id: chk_build_chm_stoichiometry_0106_emp
  - n: 2
    latex: \frac{284}{142} = 2
    reason: How many units in one molecule
    check_id: chk_build_chm_stoichiometry_0106_factor
  - n: 3
    latex: '\text{P}_4\text{O}_{10}: M_r = 284'
    reason: Molecular formula
    check_id: chk_build_chm_stoichiometry_0106_mol
  - n: 4
