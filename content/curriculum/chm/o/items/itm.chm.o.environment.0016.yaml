id: itm.chm.o.environment.0016
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.environment.fertilisers
stem: A farmer compares fertilisers. One of them is ammonium phosphate, (NH₄)₃PO₄.
parts:
- id: a
  prompt: What is the percentage by mass of nitrogen in ammonium phosphate?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 355%
      correct: false
      misconception_id: mc.chm.o.environment_n_percent_inverted
      feedback: 'The nitrogen is part of the whole compound, so its percentage must be below 100. Put the nitrogen mass on top: % N = mass of N ÷ Mr × 100.'
    - id: B
      text: 9.40%
      correct: false
      misconception_id: mc.chm.o.environment_n_atoms_count_ignored
      feedback: Count every nitrogen atom in the formula, including those in brackets and in both ions. NH₄NO₃ has two nitrogen atoms, so the nitrogen mass is 2 × 14 = 28.
    - id: C
      text: 28.2%
      correct: true
    - id: D
      text: '0.282'
      correct: false
      misconception_id: mc.chm.o.environment_percent_not_times_100
      feedback: 'A fraction becomes a percentage when you multiply by 100: a fraction of 0.35 is 35%.'
  hints:
  - rung: 1
    name: orient
    text:
      en: You need the share of the mass of (NH₄)₃PO₄ that is nitrogen.
  - rung: 2
    name: concept
    text:
      en: '% nitrogen in ammonium phosphate = (number of N atoms × 14) ÷ Mr × 100.'
  - rung: 3
    name: first_step
    text:
      en: 'Mr of (NH₄)₃PO₄ is 149. Count the nitrogen atoms: one in each of the three ammonium ions.'
  - rung: 4
    name: worked_step
    text:
      en: The three nitrogen atoms have a mass of 42; divide this by 149, then multiply by 100.
  - rung: 5
    name: full_step
    text:
      en: 42 ÷ 149 × 100 = 28.2% nitrogen in ammonium phosphate.
  misconception_ids:
  - mc.chm.o.environment_n_atoms_count_ignored
  - mc.chm.o.environment_n_percent_inverted
  - mc.chm.o.environment_percent_not_times_100
solution:
  steps:
  - n: 1
    latex: M_r(\text{(NH}_4\text{)}_3\text{PO}_4) = 149
    reason: Relative formula mass of ammonium phosphate
    check_id: chk_build_chm_environment_0016_mr
  - n: 2
    latex: 3 \times 14 = 42
    reason: Mass of the nitrogen atoms
    check_id: chk_build_chm_environment_0016_n
  - n: 3
    latex: \% N = \frac{42}{149} \times 100 = 28.2\%
    reason: Part over whole, times 100
    check_id: chk_build_chm_environment_0016_pct
