stem: A flask holds 150 cm³ of sodium chloride, NaCl, of concentration 2.00 mol/dm³.
parts:
- id: a
  prompt: Calculate the amount of NaCl in moles in the flask.
  marks: 2
  answer:
    kind: numeric
    value: '0.300'
    unit: mol
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0088_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You know a concentration and a volume and want an amount.
  - rung: 2
    name: concept
    text:
      en: n = c × V, with V in dm³.
  - rung: 3
    name: first_step
    text:
      en: 150 cm³ is 150 ÷ 1000 dm³.
  - rung: 4
    name: worked_step
    text:
      en: Work out 2.00 × (150 ÷ 1000).
  - rung: 5
    name: full_step
    text:
      en: 2.00 × (150 ÷ 1000) = 0.300 mol.
  misconception_ids:
  - mc.chm.o.conc_volume_not_converted
solution:
  steps:
  - n: 1
    latex: n = 2.00 \times \frac{150}{1000}
    reason: Concentration times volume in dm³
  - n: 2
    latex: n = 0.300\ \text{mol}
    reason: Evaluate
    check_id: chk_build_chm_stoichiometry_0088_chain
