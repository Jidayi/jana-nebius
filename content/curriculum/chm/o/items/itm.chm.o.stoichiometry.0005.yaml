stem: Potassium carbonate contains K⁺ and CO₃²⁻ ions.
parts:
- id: a
  prompt: Write the formula of potassium carbonate and use it to calculate its relative formula mass.
  marks: 3
  answer:
    kind: numeric
    value: '138'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0005_mr
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: First you need the formula of potassium carbonate; then add up the relative atomic masses in it.
  - rung: 2
    name: concept
    text:
      en: The charges on the ions must cancel; the relative formula mass is the sum of the relative atomic masses of every atom in the formula.
  - rung: 3
    name: first_step
    text:
      en: The formula is K₂CO₃. Now count the atoms of each element in it.
  - rung: 4
    name: worked_step
    text:
      en: 'In K₂CO₃: two K atoms give 78, one C atom gives 12 and three O atoms give 48.'
  - rung: 5
    name: full_step
    text:
      en: Mr of K₂CO₃ = 138.
  misconception_ids:
  - mc.chm.o.formula_one_of_each
  - mc.chm.o.formula_own_charge_as_count
solution:
  steps:
  - n: 1
    latex: \text{K}_2\text{CO}_3
    reason: Charges cancel in potassium carbonate
  - n: 2
    latex: \text{K}_2 = 78
    reason: Two K atoms times Ar
    check_id: chk_build_chm_stoichiometry_0005_g_k
  - n: 3
