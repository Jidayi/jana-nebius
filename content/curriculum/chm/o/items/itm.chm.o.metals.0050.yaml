stem: 'Four metals: magnesium, zinc, copper and gold.'
parts:
- id: a
  prompt: Which metal must be extracted by electrolysis?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Gold, because the most unreactive metals are the hardest to free
      correct: false
      misconception_id: mc.chm.o.metals_extraction_reversed
      feedback: A reactive metal clings to the elements in its compounds, so it is HARD to extract. The higher a metal is in the series, the more energy its extraction needs; gold is so unreactive it is found as the metal.
    - id: B
      text: Zinc, because carbon can only reduce metals above it
      correct: false
      misconception_id: mc.chm.o.metals_carbon_reduces_all
      feedback: Carbon can only take oxygen from metals BELOW it in the reactivity series (zinc, iron, lead, copper). Metals above carbon hold their oxygen more strongly, so electrolysis is needed.
    - id: C
      text: Copper, because it is low in the series
      correct: false
      misconception_id: mc.chm.o.metals_extraction_reversed
      feedback: A reactive metal clings to the elements in its compounds, so it is HARD to extract. The higher a metal is in the series, the more energy its extraction needs; gold is so unreactive it is found as the metal.
    - id: D
      text: Magnesium
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which of these metals is above carbon in the reactivity series?
  - rung: 2
    name: concept
    text:
      en: Metals above carbon need electrolysis; metals below carbon can be reduced by carbon.
  - rung: 3
    name: first_step
    text:
      en: Magnesium is above carbon; zinc and copper are below it.
  - rung: 4
