id: itm.chm.o.reactions.0056
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.reactions.equilibrium
stem: The reaction 2SO₂ + O₂ ⇌ 2SO₃ has reached equilibrium in a closed container. The forward reaction is exothermic. A catalyst is added.
parts:
- id: a
  prompt: What happens to the position of equilibrium?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: The position does not move, but equilibrium is reached sooner.
      correct: true
    - id: B
      text: The position moves to the right, and more sulfur trioxide forms.
      correct: false
      misconception_id: mc.chm.o.reactions_catalyst_shifts_equilibrium
      feedback: A catalyst speeds up the forward and backward reactions by the same amount. Equilibrium is reached sooner, but the position, and so the yield, does not change.
    - id: C
      text: The forward and backward reactions both stop.
      correct: false
      misconception_id: mc.chm.o.reactions_equilibrium_static
      feedback: 'Equilibrium is dynamic: the forward and backward reactions both keep going, at the same rate. Change the conditions and one reaction speeds up more than the other, so the amounts change until a new equilibrium is reached.'
    - id: D
      text: The position moves to the left, and less sulfur trioxide is present.
      correct: false
      misconception_id: mc.chm.o.reactions_catalyst_shifts_equilibrium
      feedback: A catalyst speeds up the forward and backward reactions by the same amount. Equilibrium is reached sooner, but the position, and so the yield, does not change.
  hints:
  - rung: 1
    name: orient
    text:
      en: A catalyst is added, so the mixture 2SO₂ + O₂ ⇌ 2SO₃ is no longer at equilibrium. Which way will it move?
  - rung: 2
    name: concept
    text:
      en: A catalyst speeds up the forward and the backward reactions by the same amount.
  - rung: 3
    name: first_step
    text:
      en: Equal speeding up of both reactions changes only how soon equilibrium is reached.
  - rung: 4
    name: worked_step
    text:
      en: 'For 2SO₂ + O₂ ⇌ 2SO₃: ask whether speeding up both reactions equally can favour either side.'
  - rung: 5
    name: full_step
    text:
      en: The position does not move, but equilibrium is reached sooner, because a catalyst speeds up both reactions equally.
  misconception_ids:
  - mc.chm.o.reactions_catalyst_shifts_equilibrium
  - mc.chm.o.reactions_equilibrium_static
