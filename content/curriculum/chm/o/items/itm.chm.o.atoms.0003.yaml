id: itm.chm.o.atoms.0003
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.atoms.element_compound_mixture
stem: A student sorts substances into elements, compounds and mixtures.
parts:
- id: a
  prompt: Which one of these is a compound?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Chlorine gas, Cl₂
      correct: false
      misconception_id: mc.chm.o.diatomic_as_compound
      feedback: A compound has atoms of two or more different elements bonded together. O₂ has two atoms, but both are oxygen, so it is still an element.
    - id: B
      text: Salt solution
      correct: false
      misconception_id: mc.chm.o.mixture_as_compound
      feedback: In a compound the elements are chemically joined in a fixed ratio and have new properties. In a mixture the parts are not joined, can be in any ratio and keep their own properties.
    - id: C
      text: Brass (copper and zinc)
      correct: false
      misconception_id: mc.chm.o.mixture_as_compound
      feedback: In a compound the elements are chemically joined in a fixed ratio and have new properties. In a mixture the parts are not joined, can be in any ratio and keep their own properties.
    - id: D
      text: Sodium chloride, NaCl
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about which elements each substance contains and whether they are chemically joined.
  - rung: 2
    name: concept
    text:
      en: A compound contains two or more different elements chemically bonded in a fixed ratio.
  - rung: 3
    name: first_step
    text:
      en: 'Check chlorine gas first: how many different elements does it contain?'
  - rung: 4
    name: worked_step
    text:
      en: 'Then check brass (copper and zinc) and salt solution: are their parts joined in a fixed ratio, or just mixed?'
  - rung: 5
    name: full_step
    text:
      en: 'Sodium chloride, NaCl is a compound: different elements chemically joined in a fixed ratio.'
  misconception_ids:
  - mc.chm.o.diatomic_as_compound
  - mc.chm.o.mixture_as_compound
