stem: Magnesium oxide has a very high melting point.
parts:
- id: a
  prompt: Which statement explains this?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Strong attraction between oppositely charged ions acts throughout a giant lattice.
      correct: true
    - id: B
      text: Strong forces between small MgO molecules must be overcome.
      correct: false
      misconception_id: mc.chm.o.ionic_compound_as_molecules
      feedback: 'An ionic compound is a giant lattice: every ion is surrounded by ions of opposite charge, with no separate molecules.'
    - id: C
      text: Strong covalent bonds between magnesium and oxygen atoms must be broken.
      correct: false
      misconception_id: mc.chm.o.ionic_as_covalent
      feedback: A metal joined to a non-metal gives ions. The bonding is the attraction between oppositely charged ions, not shared pairs.
    - id: D
      text: Delocalised electrons hold the magnesium oxide particles together.
      correct: false
      misconception_id: mc.chm.o.conducts_means_metallic
      feedback: Metals conduct as solids and liquids. Ionic compounds conduct only when molten or dissolved.
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Magnesium oxide has a very high melting point.: what kind of structure is it, and what particles is it made of?'
  - rung: 2
    name: concept
    text:
      en: Properties depend on what has to be overcome (forces between molecules, ionic attractions, covalent networks) and on whether charged particles can move.
  - rung: 3
    name: first_step
    text:
      en: Decide first whether the substance is made of ions, small molecules, a covalent network or metal atoms.
  - rung: 4
    name: worked_step
    text:
      en: Then ask which forces are overcome, or which charged particles move, in this case.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Strong attraction between oppositely charged ions acts throughout a giant lattice.'
  misconception_ids:
  - mc.chm.o.ionic_as_covalent
  - mc.chm.o.conducts_means_metallic
  - mc.chm.o.ionic_compound_as_molecules
