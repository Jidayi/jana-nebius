stem: A sample of ammonium chloride, NH₄Cl is analysed.
parts:
- id: a
  prompt: Calculate the percentage by mass of N in NH₄Cl.
  marks: 2
  answer:
    kind: numeric
    value: '26.2'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0044_pct
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: What fraction of the mass of NH₄Cl is N?
  - rung: 2
    name: concept
    text:
      en: Percentage = mass of the element's atoms in the formula ÷ Mr × 100.
  - rung: 3
    name: first_step
    text:
      en: Mr of NH₄Cl is 53.5.
  - rung: 4
    name: worked_step
    text:
      en: The N atoms contribute 14. Work out 14 ÷ 53.5 × 100.
  - rung: 5
    name: full_step
    text:
      en: 14 ÷ 53.5 × 100 = 26.2%.
  misconception_ids:
  - mc.chm.o.percent_count_ignored
  - mc.chm.o.percent_inverted
solution:
  steps:
  - n: 1
    latex: M_r = 53.5
    reason: Relative formula mass of NH₄Cl
    check_id: chk_build_chm_stoichiometry_0044_mr
  - n: 2
    latex: \text{N} = 14
    reason: Mass of the N atoms
    check_id: chk_build_chm_stoichiometry_0044_el
  - n: 3
    latex: \% = \frac{14}{53.5} \times 100 = 26.2\%
    reason: Fraction of the whole
    check_id: chk_build_chm_stoichiometry_0044_pct
