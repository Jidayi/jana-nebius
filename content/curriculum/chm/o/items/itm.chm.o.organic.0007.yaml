stem: Chemists sort organic compounds into homologous series.
parts:
- id: a
  prompt: Which statement is true for every homologous series?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Its members have the same number of carbon atoms
      correct: false
      misconception_id: mc.chm.o.organic_series_by_carbon_count
      feedback: A homologous series shares a functional group and a general formula. Ethane, ethene and ethanol all have two carbon atoms, but they belong to three different series and react in different ways. Neighbouring members of one series differ by CH₂.
    - id: B
      text: Its members all have the same boiling point
      correct: false
    - id: C
      text: Its members have the same functional group and the same general formula
      correct: true
    - id: D
      text: Its members contain only carbon and hydrogen
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Think of the alcohols: methanol, ethanol, propanol. What do they have in common?'
  - rung: 2
    name: concept
    text:
      en: A homologous series is a family of compounds that react in the same way.
  - rung: 3
    name: first_step
    text:
      en: Methanol and ethanol have different numbers of carbon atoms and different boiling points.
  - rung: 4
    name: worked_step
    text:
      en: What gives every alcohol the same reactions, and what formula do they all fit?
  - rung: 5
    name: full_step
    text:
      en: Members share a functional group and a general formula, so they have similar chemical properties.
