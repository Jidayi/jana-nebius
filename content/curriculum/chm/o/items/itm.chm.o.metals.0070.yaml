  chk_build_chm_metals_0070_chain:
    args:
      constants:
      - source: pack
        symbol: ar_fe
      - source: pack
        symbol: ar_o
      - source: pack
        symbol: ar_c
      equation: Fe2O3 + 3CO -> 2Fe + 3CO2
      sf: 3
      steps:
      - id: na
        mass: 240 g
        op: amount_from_mass
        species: Fe2O3
      - amount: '@na'
        from: Fe2O3
        id: nb
        op: mole_ratio
        to: Fe
      - amount: '@nb'
        id: mb
        op: mass_from_amount
        species: Fe
    tool: chem_stoichiometry
  chk_build_chm_metals_0070_coef:
    args:
      constants:
      - source: pack
