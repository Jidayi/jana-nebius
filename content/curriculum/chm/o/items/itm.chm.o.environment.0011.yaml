stem: Blue hydrated copper(II) sulfate crystals are heated strongly in a test tube.
parts:
- id: a
  prompt: What is seen?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: The crystals turn white and drops of water collect at the cool top of the tube
      correct: true
    - id: B
      text: The crystals turn pink and give off oxygen
      correct: false
      misconception_id: mc.chm.o.environment_water_test_colours_reversed
      feedback: The dry form is the starting colour and water gives the hydrated colour. Anhydrous copper(II) sulfate is white and turns blue. Dry cobalt(II) chloride paper is blue and turns pink.
    - id: C
      text: The crystals turn darker blue and take in water
      correct: false
      misconception_id: mc.chm.o.environment_water_test_colours_reversed
      feedback: The dry form is the starting colour and water gives the hydrated colour. Anhydrous copper(II) sulfate is white and turns blue. Dry cobalt(II) chloride paper is blue and turns pink.
    - id: D
      text: Nothing happens, because the crystals are already dry
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Hydrated means the crystals contain water as part of their structure.
  - rung: 2
    name: concept
    text:
      en: Heating drives the water out of the crystals.
  - rung: 3
    name: first_step
    text:
      en: Copper(II) sulfate without water is the anhydrous form.
  - rung: 4
    name: worked_step
    text:
      en: What colour is anhydrous copper(II) sulfate, and where would the steam condense?
  - rung: 5
    name: full_step
    text:
      en: The blue crystals lose their water and turn white; the steam condenses to liquid water at the top.
  misconception_ids:
  - mc.chm.o.environment_water_test_colours_reversed
solution:
  steps:
  - n: 1
    latex: \text{blue hydrated CuSO}_4\text{ }\rightleftharpoons\text{ white CuSO}_4\text{ + water}
    reason: Reversible reaction
