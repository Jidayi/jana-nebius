stem: 'For the reaction H₂ + I₂ → 2HI, use these bond energies in kJ/mol: H–H 436, I–I 151, H–I 299.'
parts:
- id: a
  prompt: Calculate the enthalpy change, ΔH, in kJ/mol.
  marks: 3
  answer:
    kind: numeric
    value: '-11.0'
    unit: kJ/mol
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_energetics_0031_dh
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: List the bonds that break and the bonds that form in H₂ + I₂ → 2HI.
  - rung: 2
    name: concept
    text:
      en: Breaking bonds takes energy in; forming bonds gives energy out. ΔH = broken − formed.
  - rung: 3
    name: first_step
    text:
      en: 'Bonds broken: one H–H and one I–I, a total of 587 kJ/mol.'
  - rung: 4
    name: worked_step
    text:
      en: 'Bonds formed: two H–I, a total of 598 kJ/mol. Subtract.'
  - rung: 5
    name: full_step
    text:
      en: ΔH = 587 − 598 = -11.0 kJ/mol.
  misconception_ids:
  - mc.chm.o.energetics_formed_minus_broken
  - mc.chm.o.energetics_bond_count_ignored
solution:
  steps:
  - n: 1
    latex: \text{broken} = 587\ \text{kJ/mol}
    reason: Energy in
    check_id: chk_build_chm_energetics_0031_dh
  - n: 2
