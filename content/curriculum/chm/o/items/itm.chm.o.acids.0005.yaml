id: itm.chm.o.acids.0005
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.reactions_of_acids
stem: Black copper(II) oxide powder is warmed with dilute sulfuric acid. The solid dissolves and the solution turns blue. No bubbles are seen.
parts:
- id: a
  prompt: Which are the products?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Copper(II) sulfate and hydrogen
      correct: false
      misconception_id: mc.chm.o.acids_wrong_gas
      feedback: Look at what the acid reacts with. A metal gives hydrogen. A carbonate gives carbon dioxide, because the carbonate contains carbon and oxygen. An oxide or hydroxide gives only a salt and water, with no gas.
    - id: B
      text: Copper(II) sulfate, water and carbon dioxide
      correct: false
      misconception_id: mc.chm.o.acids_wrong_gas
      feedback: Look at what the acid reacts with. A metal gives hydrogen. A carbonate gives carbon dioxide, because the carbonate contains carbon and oxygen. An oxide or hydroxide gives only a salt and water, with no gas.
    - id: C
      text: Copper(II) sulfate and water
      correct: true
    - id: D
      text: Copper(II) chloride and water
      correct: false
      misconception_id: mc.chm.o.acids_salt_anion_confused
      feedback: The acid names the salt. Hydrochloric acid makes chlorides, sulfuric acid makes sulfates and nitric acid makes nitrates. The metal (or ammonium) gives the first part of the name.
  hints:
  - rung: 1
    name: orient
    text:
      en: Copper(II) oxide is a base. What does a base give with an acid?
  - rung: 2
    name: concept
    text:
      en: Acid + base → salt + water. This is neutralisation, and no gas forms.
  - rung: 3
    name: first_step
    text:
      en: The salt is named from copper(II) and from sulfuric acid.
  - rung: 4
    name: worked_step
    text:
      en: The oxygen of the oxide joins with hydrogen from the acid. No bubbles were seen, so think about whether a gas forms.
  - rung: 5
    name: full_step
    text:
      en: 'CuO + H₂SO₄ → CuSO₄ + H₂O: copper(II) sulfate (blue in solution) and water, with no gas.'
  misconception_ids:
  - mc.chm.o.acids_wrong_gas
  - mc.chm.o.acids_salt_anion_confused
solution:
  steps:
  - n: 1
    latex: \text{CuO} + \text{H}_2\text{SO}_4 \rightarrow \text{CuSO}_4 + \text{H}_2\text{O}
    reason: Base + acid → salt + water
    check_id: chk_build_chm_acids_0005_bal
