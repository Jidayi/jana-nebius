    text:
      en: What fraction of the mass of NH₄Cl is nitrogen?
  - rung: 2
    name: concept
    text:
      en: '% nitrogen in ammonium chloride = mass of the nitrogen atoms ÷ Mr × 100.'
  - rung: 3
    name: first_step
    text:
      en: Mr of NH₄Cl is 53.5.
  - rung: 4
    name: worked_step
    text:
      en: NH₄Cl has one nitrogen atom, of total mass 14. Work out 14 ÷ 53.5 × 100.
  - rung: 5
    name: full_step
    text:
      en: 14 ÷ 53.5 × 100 = 26.2% nitrogen.
  misconception_ids:
