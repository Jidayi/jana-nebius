    latex: M_r(\text{NH}_4\text{Cl}) = 53.5
    reason: Relative formula mass of ammonium chloride
    check_id: chk_build_chm_environment_0017_mr
  - n: 2
    latex: \text{N} = 14
    reason: Mass of the nitrogen atoms
    check_id: chk_build_chm_environment_0017_n
  - n: 3
    latex: \% N = \frac{14}{53.5} \times 100 = 26.2\%
    reason: Part over whole, times 100
    check_id: chk_build_chm_environment_0017_pct
