stem: An alcohol has the formula CH₃OH.
parts:
- id: a
  prompt: What is its name?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Methane
      correct: false
      misconception_id: mc.chm.o.organic_ending_wrong_series
      feedback: 'The ending names the family: -ane for alkanes, -ene for alkenes, -ol for alcohols and -oic acid for carboxylic acids. Find the functional group first, then choose the ending.'
    - id: B
      text: Methanoic acid
      correct: false
      misconception_id: mc.chm.o.organic_ending_wrong_series
      feedback: 'The ending names the family: -ane for alkanes, -ene for alkenes, -ol for alcohols and -oic acid for carboxylic acids. Find the functional group first, then choose the ending.'
    - id: C
      text: Ethanol
      correct: false
      misconception_id: mc.chm.o.organic_prefix_wrong_atoms
      feedback: The prefix counts every carbon atom in the molecule, including the carbon inside –COOH. CH₃COOH has two carbon atoms, so it is ethanoic acid. Hydrogen atoms never set the prefix.
    - id: D
      text: Methanol
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Alcohols end in -ol.
  - rung: 2
    name: concept
    text:
      en: The prefix counts carbon atoms only, not oxygen or hydrogen.
  - rung: 3
    name: first_step
    text:
      en: CH₃OH has one carbon atom.
  - rung: 4
    name: worked_step
    text:
      en: Which prefix means one carbon atom?
  - rung: 5
    name: full_step
    text:
      en: 'One carbon atom (meth-) and an –OH group (-ol): methanol.'
  misconception_ids:
  - mc.chm.o.organic_ending_wrong_series
  - mc.chm.o.organic_prefix_wrong_atoms
solution:
  steps:
  - n: 1
    latex: \text{1 C, –OH}
    reason: Prefix and family
  - n: 2
