id: itm.chm.o.organic.0089
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.combustion
stem: Butane, C₄H₁₀, burns completely in a plentiful supply of air.
parts:
- id: a
  prompt: Which is the correct balanced equation for the complete combustion of butane?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 4C₄H₁₀ + 26O₂ → 16CO₂ + 20H₂O
      correct: false
      misconception_id: mc.chm.o.organic_combustion_not_lowest
      feedback: 'After balancing, check whether every coefficient divides by the same number. If it does, divide them all: 2, 4, 2, 4 becomes 1, 2, 1, 2.'
    - id: B
      text: 2C₄H₁₀ + 13O₂ → 8CO₂ + 10H₂O
      correct: true
    - id: C
      text: C₄H₁₀ + 13O → 4CO₂ + 5H₂O
      correct: false
      misconception_id: mc.chm.o.organic_oxygen_formula_changed
      feedback: 'Oxygen gas is made of O₂ molecules. Never change a formula, or write O on its own, to make the atoms fit: balance only with the numbers in front of the formulae.'
    - id: D
      text: 2C₄H₁₀ + 9O₂ → 8CO + 10H₂O
      correct: false
      misconception_id: mc.chm.o.organic_incomplete_products_in_complete
      feedback: 'Complete combustion means plenty of oxygen: all the carbon becomes carbon dioxide and all the hydrogen becomes water. Carbon monoxide and soot form only when the oxygen supply is limited.'
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Complete combustion of butane gives only carbon dioxide and water: C₄H₁₀ + O₂ → CO₂ + H₂O.'
  - rung: 2
    name: concept
    text:
      en: A correct equation keeps every formula as it is (oxygen is O₂), balances each element and uses the smallest whole numbers; check butane's carbon, then hydrogen, then oxygen.
  - rung: 3
    name: first_step
    text:
      en: Rule out any option for butane that has carbon monoxide as a product or oxygen written as O.
  - rung: 4
    name: worked_step
    text:
      en: Of the options left for butane, see whether all the numbers can be divided by the same factor.
  - rung: 5
    name: full_step
    text:
      en: '2C₄H₁₀ + 13O₂ → 8CO₂ + 10H₂O: every element balances with the smallest whole numbers.'
  misconception_ids:
  - mc.chm.o.organic_incomplete_products_in_complete
  - mc.chm.o.organic_combustion_not_lowest
  - mc.chm.o.organic_oxygen_formula_changed
solution:
  steps:
  - n: 1
    latex: \text{C}_4\text{H}_{10} + \text{O}_2 \rightarrow \text{CO}_2 + \text{H}_2\text{O}
    reason: Fuel + oxygen → carbon dioxide + water
    check_id: chk_build_chm_organic_0089_bal
  - n: 2
    latex: 2\text{C}_4\text{H}_{10} + 13\text{O}_2 \rightarrow 8\text{CO}_2 + 10\text{H}_2\text{O}
    reason: Every element balances with the lowest numbers
    check_id: chk_build_chm_organic_0089_ratios
