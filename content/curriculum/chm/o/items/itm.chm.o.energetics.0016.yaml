stem: On a reaction pathway diagram the reactants are at 20 kJ/mol, the top of the energy hump is at 150 kJ/mol and the products are at 90 kJ/mol.
parts:
- id: a
  prompt: What is the enthalpy change, ΔH, of the reaction?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: -70 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_dh_reactants_minus_products
      feedback: ΔH = energy of products − energy of reactants. Going downhill gives a negative value.
    - id: B
      text: 70 kJ/mol
      correct: true
    - id: C
      text: 60 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_ea_from_products
      feedback: The reaction starts at the reactants, so the hump it must climb starts at the reactants' level.
    - id: D
      text: 150 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_ea_from_zero
      feedback: 'Activation energy is the climb from the reactants'' level to the top of the hump: peak − reactants.'
  hints:
  - rung: 1
    name: orient
    text:
      en: ΔH compares where the reaction ends with where it starts.
  - rung: 2
    name: concept
    text:
      en: ΔH = energy of products − energy of reactants; the hump does not matter.
  - rung: 3
    name: first_step
    text:
      en: 'Products: 90 kJ/mol. Reactants: 20 kJ/mol.'
  - rung: 4
    name: worked_step
    text:
      en: Work out 90 − 20, keeping the sign.
  - rung: 5
    name: full_step
    text:
      en: ΔH = 90 − 20 = 70 kJ/mol.
  misconception_ids:
  - mc.chm.o.energetics_dh_reactants_minus_products
  - mc.chm.o.energetics_ea_from_products
  - mc.chm.o.energetics_ea_from_zero
