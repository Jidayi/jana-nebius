  - n: 1
    latex: \text{CaBr}_2
    reason: Charges cancel in calcium bromide
  - n: 2
    latex: \text{Ca} = 40
    reason: One Ca atom times Ar
    check_id: chk_build_chm_stoichiometry_0006_g_ca
