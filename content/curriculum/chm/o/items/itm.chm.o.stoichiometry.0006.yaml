  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: First you need the formula of calcium bromide; then add up the relative atomic masses in it.
  - rung: 2
    name: concept
    text:
      en: The charges on the ions must cancel; the relative formula mass is the sum of the relative atomic masses of every atom in the formula.
  - rung: 3
    name: first_step
    text:
      en: The formula is CaBr₂. Now count the atoms of each element in it.
  - rung: 4
    name: worked_step
    text:
      en: 'In CaBr₂: one Ca atom gives 40 and two Br atoms give 160.'
  - rung: 5
    name: full_step
    text:
      en: Mr of CaBr₂ = 200.
  misconception_ids:
