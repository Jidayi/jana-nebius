stem: 'For the reaction CH₄ + Cl₂ → CH₃Cl + HCl, use these bond energies in kJ/mol: C–H 413, Cl–Cl 242, C–Cl 346, H–Cl 431.'
parts:
- id: a
  prompt: Calculate the enthalpy change, ΔH, in kJ/mol.
  marks: 3
  answer:
    kind: numeric
    value: '-122'
    unit: kJ/mol
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_energetics_0033_dh
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: List the bonds that break and the bonds that form in CH₄ + Cl₂ → CH₃Cl + HCl.
  - rung: 2
    name: concept
    text:
      en: Breaking bonds takes energy in; forming bonds gives energy out. ΔH = broken − formed.
  - rung: 3
    name: first_step
    text:
      en: 'Bonds broken: one C–H and one Cl–Cl, a total of 655 kJ/mol.'
  - rung: 4
    name: worked_step
    text:
      en: 'Bonds formed: one C–Cl and one H–Cl, a total of 777 kJ/mol. Subtract.'
  - rung: 5
    name: full_step
    text:
      en: ΔH = 655 − 777 = -122 kJ/mol.
  misconception_ids:
  - mc.chm.o.energetics_formed_minus_broken
  - mc.chm.o.energetics_bond_count_ignored
