stem: A balloon is filled with helium.
parts:
- id: a
  prompt: In what form is the helium in the balloon?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: As He²⁺ ions that float upwards
      correct: false
      misconception_id: mc.chm.o.periodic_noble_unreactive_because_gas
      feedback: Oxygen and chlorine are gases but react readily. Noble gases are unreactive because their outer shells are full.
    - id: B
      text: As He₂ molecules
      correct: false
      misconception_id: mc.chm.o.periodic_noble_diatomic
      feedback: 'Noble gas atoms already have full outer shells, so they do not bond to each other: they exist as single atoms.'
    - id: C
      text: As atoms with eight outer electrons
      correct: false
      misconception_id: mc.chm.o.periodic_helium_eight
      feedback: Helium has only two electrons, which fill its only shell. A full first shell holds two.
    - id: D
      text: As single helium atoms
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A balloon is filled with helium. Think about the outer shells of noble gas atoms.
  - rung: 2
    name: concept
    text:
      en: Noble gases have full outer shells, so they do not need to gain, lose or share electrons.
  - rung: 3
    name: first_step
    text:
      en: Because they do not bond, they exist as single atoms.
  - rung: 4
    name: worked_step
    text:
      en: Helium's only shell is full with two electrons; the others have eight outer electrons.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: As single helium atoms'
  misconception_ids:
  - mc.chm.o.periodic_noble_diatomic
  - mc.chm.o.periodic_noble_unreactive_because_gas
  - mc.chm.o.periodic_helium_eight
solution:
  steps:
  - n: 1
    latex: \text{full outer shell} \Rightarrow \text{unreactive, monatomic}
    reason: Electron arrangement
