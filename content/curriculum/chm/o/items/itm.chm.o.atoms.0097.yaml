stem: Diamond, graphite and silicon(IV) oxide have giant covalent structures.
parts:
- id: a
  prompt: Why does diamond not conduct electricity?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Its ions cannot move.
      correct: false
    - id: B
      text: It has no electrons.
      correct: false
    - id: C
      text: All its outer electrons are used in covalent bonds, so none are free to move.
      correct: true
    - id: D
      text: It is made of separate molecules.
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Recall how the atoms are joined in each giant covalent structure.
  - rung: 2
    name: concept
    text:
      en: 'Diamond: each carbon bonded to four others in three dimensions. Graphite: layers, each carbon bonded to three others, with weak forces between layers.'
  - rung: 3
    name: first_step
    text:
      en: Link the property in the question to the bonding.
  - rung: 4
    name: worked_step
    text:
      en: Strong covalent bonds everywhere give hardness and high melting points; layers give softness; delocalised electrons give conduction.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: All its outer electrons are used in covalent bonds, so none are free to move..'
