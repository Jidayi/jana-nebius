stem: Sodium chloride has the formula NaCl.
parts:
- id: a
  prompt: Which statement about sodium chloride is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: It is a mixture of sodium and chlorine that keeps their properties.
      correct: false
      misconception_id: mc.chm.o.compound_as_mixture
      feedback: 'Water is not a mixture of hydrogen and oxygen: it does not burn or help things burn, and filtering or distilling it never gives the two gases.'
    - id: B
      text: It is an element, because sodium chloride is one substance with one formula.
      correct: false
      misconception_id: mc.chm.o.compound_as_element
      feedback: 'Look at the symbols in the formula: more than one element symbol means a compound, even though it is one pure substance.'
    - id: C
      text: It is a mixture, because it contains more than one element.
      correct: false
      misconception_id: mc.chm.o.compound_as_mixture
      feedback: In a compound the elements are chemically joined in a fixed ratio and have new properties. In a mixture the parts are not joined, can be in any ratio and keep their own properties.
    - id: D
      text: 'It is a compound: sodium and chlorine are chemically joined in a fixed ratio.'
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Look at the formula NaCl: which elements does it contain?'
  - rung: 2
    name: concept
    text:
      en: An element has one kind of atom; a compound has different elements bonded in a fixed ratio; a mixture's parts are not bonded.
  - rung: 3
    name: first_step
    text:
      en: Are sodium and chlorine in sodium chloride bonded together, or just mixed?
  - rung: 4
    name: worked_step
    text:
      en: Compare the properties of sodium chloride with those of sodium and chlorine.
  - rung: 5
    name: full_step
    text:
      en: 'Sodium chloride is a compound: sodium and chlorine are bonded in a fixed ratio and the properties are new.'
  misconception_ids:
  - mc.chm.o.compound_as_mixture
  - mc.chm.o.compound_as_element
