stem: An electrolysis cell has two electrodes connected to a d.c. power supply.
parts:
- id: a
  prompt: Which electrode is the cathode?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: The positive electrode
      correct: false
      misconception_id: mc.chm.o.electrolysis_metal_at_anode
      feedback: Opposite charges attract. Positive metal ions (cations) move to the negative electrode, the cathode, and become metal there. Negative non-metal ions (anions) move to the positive electrode, the anode.
    - id: B
      text: Whichever electrode is made of metal
      correct: false
    - id: C
      text: The negative electrode
      correct: true
    - id: D
      text: The electrode where a gas always forms
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The two electrodes have opposite charges.
  - rung: 2
    name: concept
    text:
      en: Cations are positive ions; they move to the cathode.
  - rung: 3
    name: first_step
    text:
      en: Positive ions are attracted to a negative electrode.
  - rung: 4
    name: worked_step
    text:
      en: So the cathode must carry the charge that attracts positive ions.
  - rung: 5
    name: full_step
    text:
      en: The cathode is the negative electrode; the anode is the positive electrode.
  misconception_ids:
