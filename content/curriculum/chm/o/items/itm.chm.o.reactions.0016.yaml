stem: Iron is used in the Haber process, which makes ammonia from nitrogen and hydrogen.
parts:
- id: a
  prompt: Why is the iron used?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: It makes more ammonia from the same amounts of nitrogen and hydrogen.
      correct: false
      misconception_id: mc.chm.o.reactions_rate_changes_amount
      feedback: The rate is how fast product forms; the total amount depends on how much of the limiting reactant there is. With the same amount of that reactant, a faster reaction reaches the same final amount, only sooner.
    - id: B
      text: It speeds up the reaction, and it is not used up, so it works for a long time.
      correct: true
    - id: C
      text: It is a reactant that supplies some of the hydrogen.
      correct: false
      misconception_id: mc.chm.o.reactions_catalyst_used_up
      feedback: 'A catalyst speeds up a reaction but is not used up. Weigh it before and after: the mass is the same, and it can be used again. That is why a small amount of catalyst works for a long time.'
    - id: D
      text: It reacts with the nitrogen and has to be replaced after each batch.
      correct: false
      misconception_id: mc.chm.o.reactions_catalyst_used_up
      feedback: 'A catalyst speeds up a reaction but is not used up. Weigh it before and after: the mass is the same, and it can be used again. That is why a small amount of catalyst works for a long time.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Iron is a catalyst in this process. What does a catalyst change?
  - rung: 2
    name: concept
    text:
      en: A catalyst changes how fast a reaction happens, not what it makes or how much.
  - rung: 3
    name: first_step
    text:
      en: A catalyst is still there, unchanged, at the end of the reaction.
  - rung: 4
    name: worked_step
    text:
      en: Iron contains no hydrogen, and it does not change the amount of ammonia in the end.
  - rung: 5
    name: full_step
    text:
      en: 'Iron is a catalyst: it makes ammonia form faster and is not used up, so the same iron is used again and again.'
  misconception_ids:
  - mc.chm.o.reactions_catalyst_used_up
  - mc.chm.o.reactions_rate_changes_amount
