stem: Molten lead(II) bromide is electrolysed using inert graphite electrodes.
parts:
- id: a
  prompt: Which products form at the cathode and at the anode?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Lead at the cathode and oxygen at the anode
      correct: false
      misconception_id: mc.chm.o.electrolysis_molten_gives_hydrogen
      feedback: A molten binary compound contains only its own two kinds of ion. There is no water, so there are no hydrogen or hydroxide ions. The metal forms at the cathode and the non-metal at the anode.
    - id: B
      text: Hydrogen at the cathode and bromine at the anode
      correct: false
      misconception_id: mc.chm.o.electrolysis_molten_gives_hydrogen
      feedback: A molten binary compound contains only its own two kinds of ion. There is no water, so there are no hydrogen or hydroxide ions. The metal forms at the cathode and the non-metal at the anode.
    - id: C
      text: Lead at the cathode and bromine at the anode
      correct: true
    - id: D
      text: Bromine at the cathode and lead at the anode
      correct: false
      misconception_id: mc.chm.o.electrolysis_metal_at_anode
      feedback: Opposite charges attract. Positive metal ions (cations) move to the negative electrode, the cathode, and become metal there. Negative non-metal ions (anions) move to the positive electrode, the anode.
  hints:
  - rung: 1
    name: orient
    text:
      en: Which ions are in molten lead(II) bromide? There is no water present.
  - rung: 2
    name: concept
    text:
      en: The cathode is negative and attracts positive ions; the anode is positive and attracts negative ions.
  - rung: 3
    name: first_step
    text:
      en: Molten lead(II) bromide contains only Pb²⁺ and Br⁻ ions.
  - rung: 4
    name: worked_step
    text:
      en: Send each ion to the electrode of opposite charge, then name the element that each ion forms.
  - rung: 5
    name: full_step
    text:
      en: Pb²⁺ ions go to the cathode and form lead (silvery molten lead); Br⁻ ions go to the anode and form bromine (red-brown bromine vapour).
  misconception_ids:
  - mc.chm.o.electrolysis_metal_at_anode
  - mc.chm.o.electrolysis_molten_gives_hydrogen
solution:
  steps:
  - n: 1
    latex: '\text{cathode: lead; anode: bromine}'
    reason: Cations to the cathode, anions to the anode
