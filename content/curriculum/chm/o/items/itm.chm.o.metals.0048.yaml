id: itm.chm.o.metals.0048
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.metals.extraction
stem: Aluminium is extracted by electrolysis, but iron is extracted by heating its oxide with carbon.
parts:
- id: a
  prompt: Why are different methods used?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Carbon could reduce both, but electrolysis is cheaper for aluminium.
      correct: false
      misconception_id: mc.chm.o.metals_carbon_reduces_all
      feedback: Carbon can only take oxygen from metals BELOW it in the reactivity series (zinc, iron, lead, copper). Metals above carbon hold their oxygen more strongly, so electrolysis is needed.
    - id: B
      text: Electrolysis adds oxygen to aluminium; carbon adds oxygen to iron.
      correct: false
      misconception_id: mc.chm.o.metals_reduction_gains_oxygen
      feedback: Reduction is LOSS of oxygen. In extraction the metal oxide loses its oxygen and becomes the metal; the carbon or carbon monoxide gains that oxygen and is oxidised.
    - id: C
      text: Aluminium is less reactive than iron, so it needs more energy to free.
      correct: false
      misconception_id: mc.chm.o.metals_extraction_reversed
      feedback: A reactive metal clings to the elements in its compounds, so it is HARD to extract. The higher a metal is in the series, the more energy its extraction needs; gold is so unreactive it is found as the metal.
    - id: D
      text: Aluminium is more reactive than carbon, so carbon cannot remove its oxygen; iron is less reactive than carbon.
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Place aluminium, carbon and iron in the reactivity series.
  - rung: 2
    name: concept
    text:
      en: Carbon takes oxygen only from the oxide of a less reactive metal.
  - rung: 3
    name: first_step
    text:
      en: 'Order: aluminium, then carbon, then zinc and iron.'
  - rung: 4
    name: worked_step
    text:
      en: Decide for each metal whether carbon is above or below it.
  - rung: 5
    name: full_step
    text:
      en: Carbon is below aluminium but above iron, so carbon reduces iron oxide but not aluminium oxide.
  misconception_ids:
  - mc.chm.o.metals_extraction_reversed
  - mc.chm.o.metals_carbon_reduces_all
  - mc.chm.o.metals_reduction_gains_oxygen
solution:
  steps:
  - n: 1
    latex: \text{Al > C > Fe}
    reason: Reactivity series
  - n: 2
    latex: \text{C reduces Fe oxide only}
    reason: Choice of method
