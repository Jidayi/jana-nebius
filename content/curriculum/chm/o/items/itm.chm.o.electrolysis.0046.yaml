stem: Impure copper is purified using a copper(II) sulfate electrolyte. The blue colour of the solution stays about the same throughout.
parts:
- id: a
  prompt: Why does the colour not fade?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: The copper(II) sulfate is a catalyst and is not used up.
      correct: false
    - id: B
      text: Copper ions are not discharged at the cathode.
      correct: false
    - id: C
      text: No copper ions take part in the electrolysis.
      correct: false
    - id: D
      text: Copper ions enter the solution at the anode as fast as they leave it at the cathode.
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The blue colour comes from Cu²⁺ ions. What happens to their concentration?
  - rung: 2
    name: concept
    text:
      en: Cu²⁺ ions are removed from the solution at one electrode and added at the other.
  - rung: 3
    name: first_step
    text:
      en: At the cathode Cu²⁺ ions gain electrons; at the anode copper atoms lose electrons.
  - rung: 4
    name: worked_step
    text:
      en: Compare the rate at which copper ions are added with the rate at which they are removed.
  - rung: 5
    name: full_step
    text:
      en: The anode supplies Cu²⁺ ions as fast as the cathode removes them, so the concentration of Cu²⁺, and the colour, stay the same.
solution:
  steps:
  - n: 1
    latex: \text{Cu}^{2+} \text{ in = } \text{Cu}^{2+} \text{ out}
    reason: Concentration unchanged
