id: itm.chm.o.energetics.0038
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.energetics.calorimetry
stem: 0.0500 mol of hydrochloric acid is neutralised by sodium hydroxide solution. The 100 g of water (or solution) changes temperature from 21.0 °C to 27.5 °C. Take the specific heat capacity of water as 4.2 J/(g °C).
parts:
- id: a
  prompt: What is the enthalpy change, ΔH, in kJ/mol?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: -2.73 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_q_not_per_mole
      feedback: ΔH is per mole. Divide the energy in kJ by the number of moles that reacted.
    - id: B
      text: -54.6 kJ/mol
      correct: true
    - id: C
      text: -0.0546 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_mass_of_reactant
      feedback: Q = mcΔT is about the water (or solution) whose temperature changed, so m is the mass of that water.
    - id: D
      text: 54.6 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_calorimetry_sign
      feedback: The water gained the energy that the reaction lost, so ΔH for the reaction is negative when the water warms.
  hints:
  - rung: 1
    name: orient
    text:
      en: First find the energy the water took in or gave out, then share it per mole.
  - rung: 2
    name: concept
    text:
      en: Q = m × c × ΔT, with m the mass of water; ΔH = −Q ÷ moles (negative when the water warms).
  - rung: 3
    name: first_step
    text:
      en: ΔT = 6.5 °C, so Q = 100 × 4.2 × ΔT = 2730 J = 2.73 kJ.
  - rung: 4
    name: worked_step
    text:
      en: Divide 2.73 kJ by 0.0500 mol and decide the sign.
  - rung: 5
    name: full_step
    text:
      en: ΔH = -54.6 kJ/mol.
  misconception_ids:
  - mc.chm.o.energetics_calorimetry_sign
  - mc.chm.o.energetics_q_not_per_mole
  - mc.chm.o.energetics_mass_of_reactant
solution:
  steps:
  - n: 1
    latex: Q = 100 \times 4.2 \times 6.5 = 2730\ \text{J}
    reason: Energy taken in by the water
    check_id: chk_build_chm_energetics_0038_dh
  - n: 2
    latex: Q = 2.73\ \text{kJ}
    reason: J to kJ
    check_id: chk_build_chm_energetics_0038_q
  - n: 3
    latex: \Delta H = -\frac{2.73}{0.0500} = -54.6\ \text{kJ/mol}
    reason: Per mole, with sign
    check_id: chk_build_chm_energetics_0038_dh
