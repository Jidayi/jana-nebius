stem: 'Hydrogen and iodine vapour react in a sealed container: H₂ + I₂ ⇌ 2HI. The mixture is at equilibrium.'
parts:
- id: a
  prompt: What happens to the position of equilibrium if the pressure is increased?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: It moves to the right, because pressure speeds up the reaction.
      correct: false
    - id: B
      text: It moves to the right, because the product is favoured by pressure.
      correct: false
    - id: C
      text: It does not move, because both sides have the same number of gas molecules.
      correct: true
    - id: D
      text: It moves to the left, because there are two reactants.
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Pressure changes favour the side with fewer gas molecules.
  - rung: 2
    name: concept
    text:
      en: Count the molecules of gas on each side of the equation.
  - rung: 3
    name: first_step
    text:
      en: 'On the left: one H₂ and one I₂. On the right: two HI.'
  - rung: 4
    name: worked_step
    text:
      en: If the two sides have the same number of gas molecules, neither side lowers the pressure.
  - rung: 5
    name: full_step
    text:
      en: 'The position does not move: both sides have two molecules of gas, so pressure favours neither side.'
solution:
  steps:
  - n: 1
    latex: \text{H}_2 + \text{I}_2 \rightleftharpoons 2\text{HI}
    reason: Two gas molecules on each side
