id: itm.chm.o.electrolysis.0026
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.electrolysis.half_equations
stem: Molten sodium chloride is electrolysed.
parts:
- id: a
  prompt: Which half-equation shows the change at the anode?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 2Cl⁻ + 2e⁻ → Cl₂
      correct: false
      misconception_id: mc.chm.o.electrolysis_electrons_wrong_side
      feedback: 'At the cathode, positive ions gain electrons, so electrons are on the left: M²⁺ + 2e⁻ → M. At the anode, negative ions lose electrons, so electrons are on the right: 2Cl⁻ → Cl₂ + 2e⁻.'
    - id: B
      text: 2Cl⁻ → Cl₂ + 2e⁻
      correct: true
    - id: C
      text: 2Cl⁻ → Cl₂ + e⁻
      correct: false
      misconception_id: mc.chm.o.electrolysis_half_charge_unbalanced
      feedback: 'After balancing the atoms, add up the charges on each side. Add electrons until both sides have the same total charge: for Al³⁺ you need three electrons to reach a neutral Al atom.'
    - id: D
      text: Cl⁻ → Cl + e⁻
      correct: false
      misconception_id: mc.chm.o.electrolysis_single_atoms_formed
      feedback: 'Chlorine, bromine, iodine and oxygen exist as molecules of two atoms: Cl₂, Br₂, I₂, O₂. So two chloride ions are needed to make one chlorine molecule: 2Cl⁻ → Cl₂ + 2e⁻.'
  hints:
  - rung: 1
    name: orient
    text:
      en: At the anode, chloride ions are turned into chlorine.
  - rung: 2
    name: concept
    text:
      en: Negative ions lose electrons at the anode, so the electrons appear with the products.
  - rung: 3
    name: first_step
    text:
      en: Chlorine gas is made of Cl₂ molecules, so two chloride ions are needed for each molecule.
  - rung: 4
    name: worked_step
    text:
      en: The two chloride ions carry a total charge of two minus. How many electrons must leave so that the chlorine molecule is neutral?
  - rung: 5
    name: full_step
    text:
      en: '2Cl⁻ → Cl₂ + 2e⁻: two chloride ions each lose one electron and join as a chlorine molecule.'
  misconception_ids:
  - mc.chm.o.electrolysis_single_atoms_formed
  - mc.chm.o.electrolysis_electrons_wrong_side
  - mc.chm.o.electrolysis_half_charge_unbalanced
solution:
  steps:
  - n: 1
    latex: 2\text{Cl}^{-} \rightarrow \text{Cl}_2 + 2e^{-}
    reason: Balanced half-equation at the anode
    check_id: chk_build_chm_electrolysis_0026_bal
