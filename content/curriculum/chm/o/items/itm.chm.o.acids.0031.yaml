id: itm.chm.o.acids.0031
version: 0.1.0
type: mcq
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.strong_and_weak
stem: A solution of ethanoic acid is tested with a conductivity meter and compared with hydrochloric acid of the same concentration.
parts:
- id: a
  prompt: What is observed?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Ethanoic acid conducts, but less well than hydrochloric acid
      correct: true
    - id: B
      text: Both conduct equally well, because the concentrations are equal
      correct: false
      misconception_id: mc.chm.o.acids_strong_means_concentrated
      feedback: Strength is about how fully an acid ionises in water. Concentration is about how much acid is in each dm³. A dilute solution of hydrochloric acid is still a strong acid; a concentrated solution of ethanoic acid is still a weak acid.
    - id: C
      text: Ethanoic acid does not conduct at all
      correct: false
      misconception_id: mc.chm.o.acids_weak_not_ionised
      feedback: 'A weak acid is partly ionised: most molecules stay whole, but some give H⁺ ions. That is why ethanoic acid still turns indicators red or orange, conducts a little and reacts slowly with metals.'
    - id: D
      text: Ethanoic acid conducts better, because it has more molecules
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: What particles carry the current through a solution?
  - rung: 2
    name: concept
    text:
      en: Ions carry charge through a solution. More ions per dm³ means better conduction.
  - rung: 3
    name: first_step
    text:
      en: Hydrochloric acid is fully ionised; ethanoic acid is only partly ionised.
  - rung: 4
    name: worked_step
    text:
      en: A partly ionised acid still has some ions.
  - rung: 5
    name: full_step
    text:
      en: Ethanoic acid has fewer ions than hydrochloric acid of the same concentration, so it conducts, but less well.
  misconception_ids:
  - mc.chm.o.acids_weak_not_ionised
  - mc.chm.o.acids_strong_means_concentrated
solution:
  steps:
  - n: 1
    latex: \text{fewer ions in ethanoic acid}
    reason: Partial ionisation
