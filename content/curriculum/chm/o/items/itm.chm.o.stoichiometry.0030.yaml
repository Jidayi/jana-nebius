  hints:
  - rung: 1
    name: orient
    text:
      en: Mr is the sum of the relative atomic masses of all the atoms in BaSO₄.
  - rung: 2
    name: concept
    text:
      en: Multiply each element's relative atomic mass by the number of its atoms, then add.
  - rung: 3
    name: first_step
    text:
      en: Count the atoms of each element in BaSO₄.
  - rung: 4
    name: worked_step
    text:
      en: 'In BaSO₄: one Ba atom gives 137, one S atom gives 32 and four O atoms give 64.'
  - rung: 5
    name: full_step
    text:
      en: Mr of BaSO₄ = 233.
  misconception_ids:
