stem: A few drops of universal indicator are added to a solution of ethanol in water and to a solution of ethanoic acid in water.
parts:
- id: a
  prompt: What colour does the ethanol solution turn, and why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Red or orange, because ethanol and ethanoic acid both have two carbon atoms and so are one family
      correct: false
      misconception_id: mc.chm.o.organic_series_by_carbon_count
      feedback: A homologous series shares a functional group and a general formula. Ethane, ethene and ethanol all have two carbon atoms, but they belong to three different series and react in different ways. Neighbouring members of one series differ by CH₂.
    - id: B
      text: Blue or purple, because ethanol releases hydroxide ions
      correct: false
      misconception_id: mc.chm.o.organic_oh_group_is_hydroxide
      feedback: In sodium hydroxide the OH is a separate ion, OH⁻, which is set free in water. In an alcohol the O–H group is held to a carbon atom by a covalent bond and does not leave as an ion. A solution of ethanol is neutral.
    - id: C
      text: 'Green, because ethanol is neutral: its –OH group does not leave as an ion'
      correct: true
    - id: D
      text: Red or orange, because ethanol has the same functional group as ethanoic acid
      correct: false
      misconception_id: mc.chm.o.organic_oh_and_cooh_confused
      feedback: Look at the carbon at the end of the chain. If it carries C=O as well as O–H (written –COOH), the compound is a carboxylic acid. If a carbon carries only –OH, the compound is an alcohol.
  hints:
  - rung: 1
    name: orient
    text:
      en: Ethanol is an alcohol and ethanoic acid is a carboxylic acid. Do they share a functional group?
  - rung: 2
    name: concept
    text:
      en: Only a carboxylic acid group, –COOH, gives off H⁺ ions in water. An alcohol's O–H stays bonded to carbon.
  - rung: 3
    name: first_step
    text:
      en: Ethanol, C₂H₅OH, has an –OH group but no –COOH group.
  - rung: 4
    name: worked_step
    text:
      en: Think about which ions, if any, ethanol releases into water.
  - rung: 5
    name: full_step
    text:
      en: Ethanol releases neither H⁺ nor OH⁻ ions, so its solution is neutral and the indicator stays green.
  misconception_ids:
  - mc.chm.o.organic_oh_group_is_hydroxide
  - mc.chm.o.organic_oh_and_cooh_confused
  - mc.chm.o.organic_series_by_carbon_count
solution:
  steps:
  - n: 1
    latex: '\text{C}_2\text{H}_5\text{OH: no H}^{+}\text{ or OH}^{-}\text{ released}'
    reason: Alcohols are neutral
