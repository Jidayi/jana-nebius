kc_ids:
- kc.chm.o.analysis.titration_technique
stem: A student washes a burette with distilled water and then fills it with hydrochloric acid.
parts:
- id: a
  prompt: What should the student have done before filling it?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 'Nothing more: rinsing with water is enough'
      correct: false
      misconception_id: mc.chm.o.analysis_rinse_with_water
      feedback: Rinse with water, then with a little of the solution that will go in. Otherwise leftover water dilutes it.
    - id: B
      text: Rinsed it with a little of the hydrochloric acid
      correct: true
    - id: C
      text: Dried it with a paper towel and read the top of the liquid
      correct: false
      misconception_id: mc.chm.o.analysis_meniscus_top
      feedback: Read the bottom of the meniscus with your eye level with it.
    - id: D
      text: Filled it only halfway so that readings are easier
      correct: false
      misconception_id: mc.chm.o.analysis_beaker_as_measure
      feedback: Beaker and flask markings are only rough guides. Use a measuring cylinder for rough volumes, and a pipette or burette for accurate ones.
  hints:
  - rung: 1
    name: orient
    text:
      en: A student washes a burette with distilled water and then fills it with hydrochloric acid. What could make the result wrong?
  - rung: 2
    name: concept
    text:
      en: Every step of a titration is designed to keep concentrations and readings accurate.
  - rung: 3
    name: first_step
    text:
      en: Water left in a burette dilutes the solution poured in.
  - rung: 4
    name: worked_step
    text:
      en: Volumes are read at the bottom of the meniscus with the eye level.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Rinsed it with a little of the hydrochloric acid.'
  misconception_ids:
  - mc.chm.o.analysis_rinse_with_water
  - mc.chm.o.analysis_meniscus_top
  - mc.chm.o.analysis_beaker_as_measure
