id: itm.chm.o.acids.0052
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.salt_preparation
stem: A student wants crystals of zinc sulfate, starting from zinc granules and dilute sulfuric acid.
parts:
- id: a
  prompt: Which method should the student use?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Titrate the zinc against the acid using an indicator, then crystallise
      correct: false
      misconception_id: mc.chm.o.acids_method_mismatch_base
      feedback: Ask whether the starting base, metal or carbonate dissolves in water. If it is insoluble, add an excess and filter off what is left. If it is soluble (sodium, potassium or ammonium), an excess cannot be filtered off, so use a titration to find the exact amounts.
    - id: B
      text: Add zinc to the acid and filter off the zinc sulfate precipitate
      correct: false
      misconception_id: mc.chm.o.acids_precipitation_confused
      feedback: 'An insoluble salt comes out of solution as a precipitate as soon as two solutions are mixed: filter it off and wash it. A soluble salt stays dissolved: you get it by evaporating and crystallising the solution.'
    - id: C
      text: Add zinc until fizzing stops and some is left, filter, then crystallise the filtrate
      correct: true
    - id: D
      text: Add zinc until fizzing stops, filter, and keep the solid left on the filter paper
      correct: false
      misconception_id: mc.chm.o.acids_filtrate_residue_confused
      feedback: Draw the filter funnel. The solid that stays on the paper is the residue; the liquid that passes through is the filtrate. A soluble salt is in the filtrate; an insoluble salt is the residue.
  hints:
  - rung: 1
    name: orient
    text:
      en: Does zinc metal dissolve in water? Is zinc sulfate soluble?
  - rung: 2
    name: concept
    text:
      en: An insoluble metal can be added in excess, then the leftover removed by filtering.
  - rung: 3
    name: first_step
    text:
      en: When fizzing stops and zinc is left over, all the acid has been used up.
  - rung: 4
    name: worked_step
    text:
      en: The zinc sulfate is dissolved. Decide which part of the filtered mixture contains it.
  - rung: 5
    name: full_step
    text:
      en: Excess zinc uses up the acid, filtering removes the leftover zinc, and the zinc sulfate crystallises from the filtrate.
  misconception_ids:
  - mc.chm.o.acids_method_mismatch_base
  - mc.chm.o.acids_filtrate_residue_confused
  - mc.chm.o.acids_precipitation_confused
solution:
  steps:
  - n: 1
    latex: \text{Zn} + \text{H}_2\text{SO}_4 \rightarrow \text{ZnSO}_4 + \text{H}_2
    reason: Metal + acid
    check_id: chk_build_chm_acids_0052_bal
  - n: 2
    latex: \text{filtrate} \rightarrow \text{crystals}
    reason: Soluble salt
