stem: Argon is used to fill electric light bulbs.
parts:
- id: a
  prompt: Why is argon used?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: It is unreactive, because its atoms have a full outer shell, so the hot filament does not react.
      correct: true
    - id: B
      text: It reacts with the filament to make it glow.
      correct: false
      misconception_id: mc.chm.o.periodic_noble_gas_reacts
      feedback: 'Argon does not react with the filament: its atoms have a full outer shell. The filament glows because it is hot, and argon stops it reacting with oxygen.'
    - id: C
      text: It exists as Ar₂ molecules that are too stable to react.
      correct: false
      misconception_id: mc.chm.o.periodic_noble_diatomic
      feedback: 'Noble gas atoms already have full outer shells, so they do not bond to each other: they exist as single atoms.'
    - id: D
      text: It is unreactive because it is a gas.
      correct: false
      misconception_id: mc.chm.o.periodic_noble_unreactive_because_gas
      feedback: Oxygen and chlorine are gases but react readily. Noble gases are unreactive because their outer shells are full.
  hints:
  - rung: 1
    name: orient
    text:
      en: Argon is used to fill electric light bulbs. Think about the outer shells of noble gas atoms.
  - rung: 2
    name: concept
    text:
      en: Noble gases have full outer shells, so they do not need to gain, lose or share electrons.
  - rung: 3
    name: first_step
    text:
      en: Because they do not bond, they exist as single atoms.
  - rung: 4
    name: worked_step
    text:
      en: Helium's only shell is full with two electrons; the others have eight outer electrons.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It is unreactive, because its atoms have a full outer shell, so the hot filament does not react.'
  misconception_ids:
  - mc.chm.o.periodic_noble_unreactive_because_gas
  - mc.chm.o.periodic_noble_diatomic
  - mc.chm.o.periodic_noble_gas_reacts
