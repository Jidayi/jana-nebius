stem: Universal indicator is added to a solution with a pH of 2.
parts:
- id: a
  prompt: Which describes the solution?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Neutral; the indicator turns green
      correct: false
    - id: B
      text: Strongly acidic; the indicator turns red
      correct: true
    - id: C
      text: Strongly acidic; the indicator turns purple
      correct: false
      misconception_id: mc.chm.o.acids_indicator_colours_swapped
      feedback: 'Learn each pair: litmus is red in acid and blue in alkali; methyl orange is red in acid and yellow in alkali; phenolphthalein is colourless in acid and pink in alkali.'
    - id: D
      text: Strongly alkaline; the indicator turns purple
      correct: false
      misconception_id: mc.chm.o.acids_high_ph_more_acidic
      feedback: 'Picture the pH scale as a line: acids at the low end (below 7), neutral at 7, alkalis at the high end (above 7). The lower the pH, the more acidic the solution.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Where does pH 2 sit on the pH scale?
  - rung: 2
    name: concept
    text:
      en: Below 7 is acidic, 7 is neutral and above 7 is alkaline. The further from 7, the stronger.
  - rung: 3
    name: first_step
    text:
      en: pH 2 is far below 7.
  - rung: 4
    name: worked_step
    text:
      en: Universal indicator runs from red at the acid end, through green at 7, to purple at the alkali end.
  - rung: 5
    name: full_step
    text:
      en: pH 2 is strongly acidic, and universal indicator is red for strongly acidic solutions.
  misconception_ids:
  - mc.chm.o.acids_high_ph_more_acidic
  - mc.chm.o.acids_indicator_colours_swapped
solution:
  steps:
  - n: 1
    latex: \text{pH} = 2 < 7 \Rightarrow \text{strongly acidic, red}
    reason: pH scale and universal indicator
