id: itm.chm.o.environment.0001
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.environment.water
stem: A few drops of a colourless liquid are added to some white anhydrous copper(II) sulfate. The solid turns blue.
parts:
- id: a
  prompt: What does this result show?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: The liquid contains no water, because water turns blue copper(II) sulfate white
      correct: false
      misconception_id: mc.chm.o.environment_water_test_colours_reversed
      feedback: The dry form is the starting colour and water gives the hydrated colour. Anhydrous copper(II) sulfate is white and turns blue. Dry cobalt(II) chloride paper is blue and turns pink.
    - id: B
      text: The liquid is pure water
      correct: false
      misconception_id: mc.chm.o.environment_water_test_shows_purity
      feedback: These tests react with any water, even water with salt or other substances dissolved in it. They show that water is present, not that it is pure. To check purity, measure the boiling point or the melting point and compare it with the value for pure water.
    - id: C
      text: The liquid has been filtered, so it must be pure water
      correct: false
      misconception_id: mc.chm.o.environment_treatment_stages_mixed
      feedback: Each stage has one job. Sedimentation lets large particles settle. Filtration removes small insoluble particles. Carbon removes tastes and smells. Chlorine kills microbes. None of these removes dissolved salts, so tap water is not pure.
    - id: D
      text: The liquid contains water
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Anhydrous copper(II) sulfate is a chemical test for water.
  - rung: 2
    name: concept
    text:
      en: Anhydrous means without water. When the white solid takes in water it becomes blue hydrated copper(II) sulfate.
  - rung: 3
    name: first_step
    text:
      en: Here the white solid turned blue, so water reached it.
  - rung: 4
    name: worked_step
    text:
      en: Would the test also turn blue if the water had salt or sugar dissolved in it?
  - rung: 5
    name: full_step
    text:
      en: The blue colour shows water is present in the liquid; it does not show the liquid is pure.
  misconception_ids:
  - mc.chm.o.environment_water_test_shows_purity
  - mc.chm.o.environment_water_test_colours_reversed
  - mc.chm.o.environment_treatment_stages_mixed
solution:
  steps:
  - n: 1
    latex: \text{CuSO}_4\text{ (white) + water }\rightarrow\text{ blue hydrated CuSO}_4
    reason: Test for water
