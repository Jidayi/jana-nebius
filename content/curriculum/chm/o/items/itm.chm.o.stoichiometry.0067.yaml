stem: When calcium carbonate is heated strongly it decomposes. The equation is CaCO₃ → CaO + CO₂.
parts:
- id: a
  prompt: Calculate the mass of CaO that forms from 8.0 g of CaCO₃.
  marks: 3
  answer:
    kind: numeric
    value: '4.48'
    unit: g
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0067_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'You know the mass of CaCO₃. Plan: mass → moles → ratio → moles → mass.'
  - rung: 2
    name: concept
    text:
      en: Use the balanced equation's numbers as a mole ratio.
  - rung: 3
    name: first_step
    text:
      en: Moles of CaCO₃ = 8.0 ÷ 100 = 0.0800 mol.
  - rung: 4
    name: worked_step
    text:
      en: 'Ratio CaCO₃ : CaO is 1 : 1, so moles of CaO = 0.0800 mol.'
  - rung: 5
    name: full_step
    text:
      en: Mass of CaO = 0.0800 × 56 = 4.48 g.
  misconception_ids:
  - mc.chm.o.ratio_ignored
  - mc.chm.o.mass_ratio_as_mole_ratio
solution:
  steps:
  - n: 1
    latex: n(\text{CaCO}_3) = \frac{8.0}{100} = 0.0800\ \text{mol}
    reason: Moles of the given substance
    check_id: chk_build_chm_stoichiometry_0067_ma
  - n: 2
    latex: '\text{CaCO}_3 : \text{CaO} = 1 : 1'
    reason: Ratio from the equation
    check_id: chk_build_chm_stoichiometry_0067_coef
  - n: 3
    latex: n(\text{CaO}) = 0.0800\ \text{mol}
    reason: Mole ratio from the equation
    check_id: chk_build_chm_stoichiometry_0067_chain
  - n: 4
    latex: m(\text{CaO}) = 0.0800 \times 56 = 4.48\ \text{g}
    reason: Moles times molar mass
    check_id: chk_build_chm_stoichiometry_0067_mb
