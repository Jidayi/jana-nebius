id: itm.chm.o.stoichiometry.0069
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.reacting_masses
stem: In a blast furnace iron(III) oxide is reduced by carbon monoxide. The equation is Fe₂O₃ + 3CO → 2Fe + 3CO₂.
parts:
- id: a
  prompt: Calculate the mass of Fe that forms from 12.0 g of Fe₂O₃.
  marks: 3
  answer:
    kind: numeric
    value: '8.40'
    unit: g
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0069_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'You know the mass of Fe₂O₃. Plan: mass → moles → ratio → moles → mass.'
  - rung: 2
    name: concept
    text:
      en: Use the balanced equation's numbers as a mole ratio.
  - rung: 3
    name: first_step
    text:
      en: Moles of Fe₂O₃ = 12.0 ÷ 160 = 0.0750 mol.
  - rung: 4
    name: worked_step
    text:
      en: 'Ratio Fe₂O₃ : Fe is 1 : 2, so moles of Fe = 0.150 mol.'
  - rung: 5
    name: full_step
    text:
      en: Mass of Fe = 0.150 × 56 = 8.40 g.
  misconception_ids:
  - mc.chm.o.ratio_ignored
  - mc.chm.o.mass_ratio_as_mole_ratio
solution:
  steps:
  - n: 1
    latex: n(\text{Fe}_2\text{O}_3) = \frac{12.0}{160} = 0.0750\ \text{mol}
    reason: Moles of the given substance
    check_id: chk_build_chm_stoichiometry_0069_ma
  - n: 2
    latex: '\text{Fe}_2\text{O}_3 : \text{Fe} = 1 : 2'
    reason: Ratio from the equation
    check_id: chk_build_chm_stoichiometry_0069_coef
  - n: 3
    latex: n(\text{Fe}) = 0.150\ \text{mol}
    reason: Mole ratio from the equation
    check_id: chk_build_chm_stoichiometry_0069_chain
  - n: 4
    latex: m(\text{Fe}) = 0.150 \times 56 = 8.40\ \text{g}
    reason: Moles times molar mass
    check_id: chk_build_chm_stoichiometry_0069_mb
