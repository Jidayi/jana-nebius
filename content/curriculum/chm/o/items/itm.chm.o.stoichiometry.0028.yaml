id: itm.chm.o.stoichiometry.0028
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.relative_formula_mass
stem: A student calculates the relative formula mass of calcium phosphate, Ca₃(PO₄)₂.
parts:
- id: a
  prompt: Which value is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: '310'
      correct: true
    - id: B
      text: '279'
      correct: false
      misconception_id: mc.chm.o.mr_bracket_multiplier
      feedback: 'The number after a bracket multiplies everything inside it: (OH)₂ is two O atoms and two H atoms.'
    - id: C
      text: '87'
      correct: false
      misconception_id: mc.chm.o.mr_count_ignored
      feedback: Write out the atoms one by one for a small formula such as H₂O (H + H + O) and see that each atom counts.
    - id: D
      text: '154'
      correct: false
      misconception_id: mc.chm.o.mr_atomic_number
      feedback: Use the relative atomic mass (the larger number for most elements), not the proton number.
  hints:
  - rung: 1
    name: orient
    text:
      en: Every atom in Ca₃(PO₄)₂ adds its relative atomic mass to the total.
  - rung: 2
    name: concept
    text:
      en: Use relative atomic masses (not proton numbers), multiply each by its number of atoms, and remember that a number after a bracket multiplies everything inside it.
  - rung: 3
    name: first_step
    text:
      en: List the atoms of each element in Ca₃(PO₄)₂, counting through the bracket.
  - rung: 4
    name: worked_step
    text:
      en: 'In Ca₃(PO₄)₂: three Ca atoms give 120, two P atoms give 62 and eight O atoms give 128.'
  - rung: 5
    name: full_step
    text:
      en: Adding these gives Mr = 310.
  misconception_ids:
  - mc.chm.o.mr_count_ignored
  - mc.chm.o.mr_bracket_multiplier
  - mc.chm.o.mr_atomic_number
solution:
  steps:
  - n: 1
    latex: \text{Ca}_3 = 120
    reason: Three Ca atoms times Ar
    check_id: chk_build_chm_stoichiometry_0028_g_ca
