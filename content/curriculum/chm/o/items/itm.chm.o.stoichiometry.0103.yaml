stem: A compound has the empirical formula C₂H₅ and a relative molecular mass of 58.
parts:
- id: a
  prompt: How many H atoms are there in one molecule of the compound?
  marks: 2
  answer:
    kind: numeric
    value: '10'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0103_atoms
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The molecular formula is a whole-number multiple of the empirical formula.
  - rung: 2
    name: concept
    text:
      en: Divide the relative molecular mass by the mass of one empirical formula unit to find the multiple.
  - rung: 3
    name: first_step
    text:
      en: The empirical formula C₂H₅ has a mass of 29.
  - rung: 4
    name: worked_step
    text:
      en: 58 ÷ 29 = 2, so multiply every number in C₂H₅ by 2.
  - rung: 5
    name: full_step
    text:
      en: The molecular formula is C₄H₁₀, which has 10 H atoms.
  misconception_ids:
  - mc.chm.o.empirical_mass_ratio
solution:
  steps:
  - n: 1
    latex: M_r(\text{C}_2\text{H}_5) = 29
    reason: Mass of the empirical unit
    check_id: chk_build_chm_stoichiometry_0103_emp
  - n: 2
    latex: \frac{58}{29} = 2
    reason: How many units in one molecule
    check_id: chk_build_chm_stoichiometry_0103_factor
  - n: 3
    latex: '\text{C}_4\text{H}_{10}: M_r = 58'
    reason: Molecular formula
    check_id: chk_build_chm_stoichiometry_0103_mol
  - n: 4
