stem: 'For the reaction C₂H₄ + H₂ → C₂H₆, use these bond energies in kJ/mol: C=C 612, H–H 436, C–C 348, C–H 413.'
parts:
- id: a
  prompt: Calculate the enthalpy change, ΔH, in kJ/mol.
  marks: 3
  answer:
    kind: numeric
    value: '-126'
    unit: kJ/mol
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_energetics_0030_dh
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: List the bonds that break and the bonds that form in C₂H₄ + H₂ → C₂H₆.
  - rung: 2
    name: concept
    text:
      en: Breaking bonds takes energy in; forming bonds gives energy out. ΔH = broken − formed.
  - rung: 3
    name: first_step
    text:
      en: 'Bonds broken: one C=C and one H–H, a total of 1048 kJ/mol.'
  - rung: 4
    name: worked_step
    text:
      en: 'Bonds formed: one C–C and two C–H, a total of 1174 kJ/mol. Subtract.'
  - rung: 5
    name: full_step
    text:
      en: ΔH = 1048 − 1174 = -126 kJ/mol.
  misconception_ids:
  - mc.chm.o.energetics_formed_minus_broken
  - mc.chm.o.energetics_bond_count_ignored
solution:
