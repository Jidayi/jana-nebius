stem: A hydrocarbon has the formula C₃H₈.
parts:
- id: a
  prompt: What is its name?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Butane
      correct: false
      misconception_id: mc.chm.o.organic_prefix_order_mixed
      feedback: 'Learn the order: meth- means one carbon atom, eth- two, prop- three and but- four. A memory aid: Monkeys Eat Peeled Bananas.'
    - id: B
      text: Propene
      correct: false
    - id: C
      text: Octane
      correct: false
      misconception_id: mc.chm.o.organic_prefix_wrong_atoms
      feedback: The prefix counts every carbon atom in the molecule, including the carbon inside –COOH. CH₃COOH has two carbon atoms, so it is ethanoic acid. Hydrogen atoms never set the prefix.
    - id: D
      text: Propane
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Is C₃H₈ an alkane or an alkene? Then count its carbon atoms.
  - rung: 2
    name: concept
    text:
      en: Alkanes end in -ane. For C₃H₈, choose from meth- (one carbon), eth- (two), prop- (three), but- (four).
  - rung: 3
    name: first_step
    text:
      en: C₃H₈ has three carbon atoms and only single bonds.
  - rung: 4
    name: worked_step
    text:
      en: Which prefix means three carbon atoms? The eight hydrogen atoms do not count.
  - rung: 5
    name: full_step
    text:
      en: C₃H₈ is an alkane named propane.
  misconception_ids:
