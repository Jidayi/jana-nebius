    kind: numeric
    value: '-206'
    unit: kJ/mol
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_energetics_0035_dh
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: List the bonds that break and the bonds that form in 2H₂O₂ → 2H₂O + O₂.
  - rung: 2
    name: concept
    text:
      en: Breaking bonds takes energy in; forming bonds gives energy out. ΔH = broken − formed.
  - rung: 3
    name: first_step
    text:
      en: 'Bonds broken: four O–H and two O–O, a total of 2148 kJ/mol.'
  - rung: 4
    name: worked_step
    text:
      en: 'Bonds formed: four O–H and one O=O, a total of 2354 kJ/mol. Subtract.'
  - rung: 5
    name: full_step
    text:
      en: ΔH = 2148 − 2354 = -206 kJ/mol.
  misconception_ids:
