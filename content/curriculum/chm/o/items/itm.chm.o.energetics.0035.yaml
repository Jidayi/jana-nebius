stem: 'For the reaction 2H₂O₂ → 2H₂O + O₂, use these bond energies in kJ/mol: O–H 464, O–O 146, O=O 498.'
parts:
- id: a
  prompt: Calculate the enthalpy change, ΔH, in kJ/mol.
