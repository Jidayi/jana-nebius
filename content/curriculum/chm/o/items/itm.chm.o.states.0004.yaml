id: itm.chm.o.states.0004
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.states.particle_model
stem: A balloon is warmed and gets bigger.
parts:
- id: a
  prompt: What happens to the gas particles inside it?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: They move closer together.
      correct: false
      misconception_id: mc.chm.o.states_liquid_far_apart
      feedback: Liquid particles are close together and touching, almost as close as in a solid, which is why liquids cannot be squashed. They slide past each other.
    - id: B
      text: They stop moving and spread out.
      correct: false
      misconception_id: mc.chm.o.states_solid_particles_still
      feedback: Particles in a solid cannot move from place to place, but they vibrate about fixed positions; the hotter the solid, the more they vibrate.
    - id: C
      text: They move faster and hit the balloon wall harder and more often.
      correct: true
    - id: D
      text: Each gas particle gets larger.
      correct: false
      misconception_id: mc.chm.o.states_particles_expand
      feedback: Particles stay the same size. When heated they move faster and take up more room, so the gaps between them grow.
  hints:
  - rung: 1
    name: orient
    text:
      en: A balloon is warmed and gets bigger. Think about how the particles are arranged and how they move.
  - rung: 2
    name: concept
    text:
      en: 'Solid: close, regular, vibrating. Liquid: close, irregular, sliding past each other. Gas: far apart, fast, random.'
  - rung: 3
    name: first_step
    text:
      en: Particles never change size; heating changes how fast they move and how far apart they are.
  - rung: 4
    name: worked_step
    text:
      en: Use the model to explain the observation in the question.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: They move faster and hit the balloon wall harder and more often.'
  misconception_ids:
  - mc.chm.o.states_particles_expand
  - mc.chm.o.states_solid_particles_still
  - mc.chm.o.states_liquid_far_apart
