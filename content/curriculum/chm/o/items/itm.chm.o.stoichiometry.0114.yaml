- kc.chm.o.stoichiometry.reacting_masses
stem: Zinc reacts with sulfuric acid and the zinc sulfate is collected. The equation is Zn + H₂SO₄ → ZnSO₄ + H₂. 6.50 g of Zn gives 12.1 g of ZnSO₄.
parts:
- id: a
  prompt: Calculate the percentage yield.
  marks: 3
  answer:
    kind: numeric
    value: '75.2'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0114_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Work out the mass you should get, then compare the mass you did get.
  - rung: 2
    name: concept
    text:
      en: Percentage yield = actual ÷ theoretical × 100; the theoretical mass comes from the equation.
  - rung: 3
    name: first_step
    text:
      en: Moles of Zn = 6.50 ÷ 65 = 0.100 mol, so moles of ZnSO₄ = 0.100 mol.
  - rung: 4
    name: worked_step
    text:
      en: Theoretical mass = 0.100 × 161 = 16.1 g.
  - rung: 5
    name: full_step
    text:
      en: Percentage yield = 12.1 ÷ 16.1 × 100 = 75.2%.
  misconception_ids:
  - mc.chm.o.yield_inverted
  - mc.chm.o.yield_uses_reactant_mass
solution:
  steps:
  - n: 1
    latex: n(\text{Zn}) = \frac{6.50}{65} = 0.100\ \text{mol}
    reason: Moles of reactant
    check_id: chk_build_chm_stoichiometry_0114_ma
  - n: 2
    latex: m_{theory} = 0.100 \times 161 = 16.1\ \text{g}
    reason: Theoretical yield
    check_id: chk_build_chm_stoichiometry_0114_mb
  - n: 3
    latex: \text{yield} = \frac{12.1}{16.1} \times 100 = 75.2\%
    reason: Actual over theoretical
    check_id: chk_build_chm_stoichiometry_0114_chain
