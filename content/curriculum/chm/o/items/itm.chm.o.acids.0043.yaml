stem: Carbon dioxide is bubbled into sodium hydroxide solution.
parts:
- id: a
  prompt: Which products form?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: No reaction, because carbon dioxide is neutral
      correct: false
      misconception_id: mc.chm.o.acids_amphoteric_neutral_confused
      feedback: 'Amphoteric means ''both'': aluminium oxide and zinc oxide react with acids and with alkalis. Neutral means ''neither'': carbon monoxide, nitrogen monoxide and water react with neither.'
    - id: B
      text: Sodium carbonate and water
      correct: true
    - id: C
      text: Sodium hydrogen and carbon monoxide
      correct: false
    - id: D
      text: Sodium oxide and carbonic acid
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Is carbon dioxide an acidic oxide or a basic oxide?
  - rung: 2
    name: concept
    text:
      en: An acidic oxide reacts with an alkali to give a salt and water.
  - rung: 3
    name: first_step
    text:
      en: Carbon dioxide gives the carbonate salt.
  - rung: 4
    name: worked_step
    text:
      en: Combine sodium from the alkali with the carbonate that carbon dioxide forms.
  - rung: 5
    name: full_step
    text:
      en: 'CO₂ + 2NaOH → Na₂CO₃ + H₂O: an acidic oxide and an alkali give a salt (sodium carbonate) and water.'
  misconception_ids:
  - mc.chm.o.acids_amphoteric_neutral_confused
