id: itm.chm.o.acids.0002
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.reactions_of_acids
stem: A piece of zinc is dropped into dilute sulfuric acid. Bubbles of gas form and the zinc slowly disappears.
parts:
- id: a
  prompt: Which are the products of this reaction?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Zinc sulfate and water
      correct: false
      misconception_id: mc.chm.o.acids_metal_gives_water
      feedback: 'A base such as an oxide or hydroxide has oxygen to make water with the acid''s hydrogen. A metal has no oxygen, so the acid''s hydrogen is given off as hydrogen gas: metal + acid → salt + hydrogen.'
    - id: B
      text: Zinc sulfate and hydrogen
      correct: true
    - id: C
      text: Zinc chloride and hydrogen
      correct: false
      misconception_id: mc.chm.o.acids_salt_anion_confused
      feedback: The acid names the salt. Hydrochloric acid makes chlorides, sulfuric acid makes sulfates and nitric acid makes nitrates. The metal (or ammonium) gives the first part of the name.
    - id: D
      text: Zinc sulfate and carbon dioxide
      correct: false
      misconception_id: mc.chm.o.acids_wrong_gas
      feedback: Look at what the acid reacts with. A metal gives hydrogen. A carbonate gives carbon dioxide, because the carbonate contains carbon and oxygen. An oxide or hydroxide gives only a salt and water, with no gas.
  hints:
  - rung: 1
    name: orient
    text:
      en: 'What kind of substance is zinc: a metal, a base or a carbonate?'
  - rung: 2
    name: concept
    text:
      en: A metal that is more reactive than hydrogen reacts with a dilute acid to give a salt and a gas.
  - rung: 3
    name: first_step
    text:
      en: The salt takes its first name from zinc and its second name from sulfuric acid.
  - rung: 4
    name: worked_step
    text:
      en: The zinc has no oxygen or carbon to give away, so think about which element the gas must come from.
  - rung: 5
    name: full_step
    text:
      en: 'Zinc + sulfuric acid → zinc sulfate + hydrogen: Zn + H₂SO₄ → ZnSO₄ + H₂. The fizzing is hydrogen.'
  misconception_ids:
  - mc.chm.o.acids_metal_gives_water
  - mc.chm.o.acids_wrong_gas
  - mc.chm.o.acids_salt_anion_confused
