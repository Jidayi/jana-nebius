stem: Cars near the sea, and cars driven on salted roads in cold countries, rust faster than other cars.
parts:
- id: a
  prompt: What does this show?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Salt water contains no oxygen, so rusting needs only water.
      correct: false
      misconception_id: mc.chm.o.metals_rust_one_condition
      feedback: 'Compare the test tubes: a nail in boiled water under oil (no air) and a nail in dry air (no water) both stay shiny. Only the nail with water AND air rusts.'
    - id: B
      text: Salt dissolved in the water speeds up rusting.
      correct: true
    - id: C
      text: Salt is needed for rusting to happen at all.
      correct: false
    - id: D
      text: Salt turns the steel into aluminium.
      correct: false
