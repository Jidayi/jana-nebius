    text:
      en: Rusting needs water and oxygen; other substances can change how fast it goes.
  - rung: 3
    name: first_step
    text:
      en: The extra factor near the sea and on salted roads is the same thing.
  - rung: 4
    name: worked_step
    text:
      en: Cars inland still rust, only more slowly.
  - rung: 5
    name: full_step
    text:
      en: Dissolved salt speeds up rusting; it is not needed for rusting to happen.
