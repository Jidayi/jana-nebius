stem: A car engine is badly tuned, so the petrol does not get enough air.
parts:
- id: a
  prompt: Which pollutant is the engine likely to give out much more of?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Carbon monoxide
      correct: true
    - id: B
      text: Oxygen
      correct: false
    - id: C
      text: Sulfur dioxide
      correct: false
    - id: D
      text: Nitrogen
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what happens when a fuel burns without enough oxygen.
  - rung: 2
    name: concept
    text:
      en: Complete combustion needs plenty of oxygen and gives carbon dioxide and water.
  - rung: 3
    name: first_step
    text:
      en: With too little oxygen, the carbon in the fuel cannot all become carbon dioxide.
  - rung: 4
    name: worked_step
    text:
      en: Name the oxide of carbon with one oxygen atom.
  - rung: 5
    name: full_step
    text:
      en: Incomplete combustion gives carbon monoxide (and soot) instead of carbon dioxide.
solution:
  steps:
  - n: 1
    latex: \text{petrol + too little oxygen }\rightarrow\text{ carbon monoxide + water}
    reason: Incomplete combustion
