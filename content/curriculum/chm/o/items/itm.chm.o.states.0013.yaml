stem: Ethanol melts at -114 °C and boils at 78 °C.
parts:
- id: a
  prompt: What is the state of ethanol at 25 °C?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: gas
      correct: false
      misconception_id: mc.chm.o.states_above_mp_gas
      feedback: Above its melting point a substance is a liquid until it reaches its boiling point.
    - id: B
      text: liquid
      correct: true
    - id: C
      text: partly solid and partly liquid
      correct: false
      misconception_id: mc.chm.o.states_melting_over_range
      feedback: A pure substance melts at one temperature. Once it is above that temperature it is all liquid.
    - id: D
      text: solid
      correct: false
      misconception_id: mc.chm.o.states_mp_bp_swapped
      feedback: 'Below the melting point: solid. Between the melting point and the boiling point: liquid. Above the boiling point: gas.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Compare 25 °C with the melting point and with the boiling point.
  - rung: 2
    name: concept
    text:
      en: Below the melting point it is solid; between the two it is liquid; above the boiling point it is gas.
  - rung: 3
    name: first_step
    text:
      en: 25 °C is above the melting point of -114 °C.
  - rung: 4
    name: worked_step
    text:
      en: Is 25 °C above or below the boiling point of 78 °C?
  - rung: 5
    name: full_step
    text:
      en: 25 °C lies between -114 °C and 78 °C, so ethanol is a liquid.
  misconception_ids:
  - mc.chm.o.states_above_mp_gas
