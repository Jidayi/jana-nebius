id: itm.chm.o.reactions.0050
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.reactions.equilibrium
stem: The reaction N₂ + 3H₂ ⇌ 2NH₃ has reached equilibrium in a closed container. The forward reaction is exothermic. The pressure is increased.
parts:
- id: a
  prompt: What happens to the position of equilibrium?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: The position moves to the left, and less ammonia is present.
      correct: false
      misconception_id: mc.chm.o.reactions_shift_reinforces_change
      feedback: The position of equilibrium moves to oppose a change. Heating favours the direction that takes in heat. Higher pressure favours the side with fewer gas molecules. Adding a substance favours the reaction that uses it up.
    - id: B
      text: The position does not move.
      correct: false
      misconception_id: mc.chm.o.reactions_equilibrium_static
      feedback: 'Equilibrium is dynamic: the forward and backward reactions both keep going, at the same rate. Change the conditions and one reaction speeds up more than the other, so the amounts change until a new equilibrium is reached.'
    - id: C
      text: The forward and backward reactions both stop.
      correct: false
      misconception_id: mc.chm.o.reactions_equilibrium_static
      feedback: 'Equilibrium is dynamic: the forward and backward reactions both keep going, at the same rate. Change the conditions and one reaction speeds up more than the other, so the amounts change until a new equilibrium is reached.'
    - id: D
      text: The position moves to the right, and more ammonia forms.
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The pressure is increased, so the mixture N₂ + 3H₂ ⇌ 2NH₃ is no longer at equilibrium. Which way will it move?
  - rung: 2
    name: concept
    text:
      en: 'The position moves to oppose a pressure change: higher pressure favours the side with fewer gas molecules, lower pressure the side with more.'
  - rung: 3
    name: first_step
    text:
      en: 'Count the gas molecules in the equation: four on the left and two on the right.'
  - rung: 4
    name: worked_step
    text:
      en: 'For N₂ + 3H₂ ⇌ 2NH₃: find the side with fewer gas molecules, because moving there lowers the pressure.'
  - rung: 5
    name: full_step
    text:
      en: The position moves to the right, and more ammonia forms, because the right side has fewer gas molecules.
  misconception_ids:
  - mc.chm.o.reactions_shift_reinforces_change
  - mc.chm.o.reactions_equilibrium_static
solution:
  steps:
  - n: 1
    latex: \text{N}_2 + 3\text{H}_2 \rightleftharpoons 2\text{NH}_3
    reason: The equilibrium
  - n: 2
