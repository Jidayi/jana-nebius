stem: Concentrated aqueous sodium chloride is electrolysed. Hydrogen forms at the cathode and chlorine at the anode.
parts:
- id: a
  prompt: Which substance is left in the solution?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Hydrochloric acid
      correct: false
    - id: B
      text: Sodium hydroxide
      correct: true
    - id: C
      text: Sodium metal
      correct: false
      misconception_id: mc.chm.o.electrolysis_reactive_metal_from_solution
      feedback: In a solution, water also provides H⁺ ions. At the cathode, hydrogen forms unless the metal is less reactive than hydrogen (such as copper or silver). Sodium and potassium are far more reactive, so hydrogen forms instead.
    - id: D
      text: Pure water
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Which ions are removed from the solution, and which remain?
  - rung: 2
    name: concept
    text:
      en: H⁺ ions leave as hydrogen and Cl⁻ ions leave as chlorine.
  - rung: 3
    name: first_step
    text:
      en: Na⁺ ions and OH⁻ ions are not discharged.
  - rung: 4
    name: worked_step
    text:
      en: Put together the two ions that stay behind.
  - rung: 5
    name: full_step
    text:
      en: Sodium ions and hydroxide ions remain, so the solution becomes sodium hydroxide.
  misconception_ids:
  - mc.chm.o.electrolysis_reactive_metal_from_solution
