subject: chm
level: o
kc_ids:
- kc.chm.o.energetics.calorimetry
stem: 0.0500 mol of sodium hydroxide dissolves in water. The 100 g of water (or solution) changes temperature from 20.0 °C to 30.5 °C. Take the specific heat capacity of water as 4.2 J/(g °C).
parts:
- id: a
  prompt: Calculate the enthalpy change, ΔH, in kJ/mol.
  marks: 3
  answer:
    kind: numeric
    value: '-88.2'
    unit: kJ/mol
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_energetics_0047_dh
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the energy transferred to the water, then divide by the moles that reacted.
  - rung: 2
    name: concept
    text:
      en: Q = mcΔT; ΔH = −Q ÷ n, negative when the water warms up.
  - rung: 3
    name: first_step
    text:
      en: ΔT = 10.5 °C; Q = 100 × 4.2 × 10.5 = 4410 J.
  - rung: 4
    name: worked_step
    text:
      en: In kJ, Q = 4.41. Divide by 0.0500 mol and give the sign.
  - rung: 5
    name: full_step
    text:
      en: ΔH = -88.2 kJ/mol.
  misconception_ids:
  - mc.chm.o.energetics_q_not_per_mole
  - mc.chm.o.energetics_calorimetry_sign
solution:
  steps:
  - n: 1
    latex: Q = 100 \times 4.2 \times 10.5 = 4410\ \text{J}
    reason: Energy to the water
    check_id: chk_build_chm_energetics_0047_dh
  - n: 2
    latex: Q = 4.41\ \text{kJ}
    reason: J to kJ
    check_id: chk_build_chm_energetics_0047_q
  - n: 3
    latex: \Delta H = -88.2\ \text{kJ/mol}
    reason: Per mole, sign from the temperature change
    check_id: chk_build_chm_energetics_0047_dh
