stem: Use relative atomic masses to work out the relative formula mass of silver nitrate, AgNO₃.
parts:
- id: a
  prompt: Calculate the relative formula mass, Mr, of AgNO₃.
  marks: 2
  answer:
    kind: numeric
    value: '170'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0035_mr
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Mr is the sum of the relative atomic masses of all the atoms in AgNO₃.
  - rung: 2
    name: concept
    text:
      en: Multiply each element's relative atomic mass by the number of its atoms, then add.
  - rung: 3
    name: first_step
    text:
      en: Count the atoms of each element in AgNO₃.
  - rung: 4
    name: worked_step
    text:
      en: 'In AgNO₃: one Ag atom gives 108, one N atom gives 14 and three O atoms give 48.'
  - rung: 5
    name: full_step
    text:
      en: Mr of AgNO₃ = 170.
  misconception_ids:
