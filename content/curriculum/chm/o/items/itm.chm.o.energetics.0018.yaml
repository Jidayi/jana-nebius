  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Activation energy is the energy needed to start the reaction.
  - rung: 2
    name: concept
    text:
      en: It is measured from the reactants up to the highest point.
  - rung: 3
    name: first_step
    text:
      en: The reactants are at 80 kJ/mol.
  - rung: 4
    name: worked_step
    text:
      en: The highest point is at 300 kJ/mol; subtract the reactants.
  - rung: 5
    name: full_step
    text:
      en: Ea = 300 − 80 = 220 kJ/mol.
  misconception_ids:
