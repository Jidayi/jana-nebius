- kc.chm.o.electrolysis.aqueous_products
stem: Concentrated aqueous copper(II) chloride is electrolysed using inert electrodes.
parts:
- id: a
  prompt: Which products form at the cathode and at the anode?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Copper at the cathode and chlorine at the anode
      correct: true
    - id: B
      text: Hydrogen at the cathode and oxygen at the anode
      correct: false
      misconception_id: mc.chm.o.electrolysis_hydrogen_always_at_cathode
      feedback: Hydrogen forms at the cathode only when the metal is more reactive than hydrogen. Copper and silver are less reactive, so their ions are discharged first and the metal coats the cathode.
    - id: C
      text: Hydrogen at the cathode and chlorine at the anode
      correct: false
      misconception_id: mc.chm.o.electrolysis_hydrogen_always_at_cathode
      feedback: Hydrogen forms at the cathode only when the metal is more reactive than hydrogen. Copper and silver are less reactive, so their ions are discharged first and the metal coats the cathode.
    - id: D
      text: Copper at the cathode and oxygen at the anode
      correct: false
      misconception_id: mc.chm.o.electrolysis_halide_concentration_ignored
      feedback: At the anode, a concentrated chloride, bromide or iodide solution gives the halogen. A dilute halide solution, or a solution with no halide (a sulfate or nitrate), gives oxygen from the water.
  hints:
  - rung: 1
    name: orient
    text:
      en: 'List the ions in concentrated aqueous copper(II) chloride: those from the salt and H⁺ and OH⁻ from the water.'
  - rung: 2
    name: concept
    text:
      en: 'Cathode: hydrogen forms unless the metal is less reactive than hydrogen. Anode: a concentrated halide gives the halogen; otherwise oxygen forms.'
  - rung: 3
    name: first_step
    text:
      en: Copper is less reactive than hydrogen, so Cu²⁺ ions are discharged at the cathode rather than H⁺.
  - rung: 4
    name: worked_step
    text:
      en: At the anode, the chloride is concentrated. Decide whether chloride or hydroxide ions are discharged.
  - rung: 5
    name: full_step
    text:
      en: 'The cathode gives copper and the anode gives chlorine: the copper ions are discharged because copper is less reactive than hydrogen, and the concentrated chloride is discharged as chlorine.'
  misconception_ids:
  - mc.chm.o.electrolysis_hydrogen_always_at_cathode
  - mc.chm.o.electrolysis_halide_concentration_ignored
