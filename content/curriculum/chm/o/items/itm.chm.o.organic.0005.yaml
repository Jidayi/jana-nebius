stem: The alkenes are a homologous series of hydrocarbons.
parts:
- id: a
  prompt: Which is the functional group of the alkenes?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: The –COOH group
      correct: false
    - id: B
      text: The C–H single bond
      correct: false
    - id: C
      text: The C=C double bond
      correct: true
    - id: D
      text: The –OH group
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Alkenes are hydrocarbons, so the group cannot contain oxygen.
  - rung: 2
    name: concept
    text:
      en: A functional group is the part of a molecule that gives the family its reactions.
  - rung: 3
    name: first_step
    text:
      en: Alkanes and alkenes both have C–H bonds, so C–H cannot be what makes alkenes different.
  - rung: 4
    name: worked_step
    text:
      en: Compare ethane with ethene and look at the bond between the two carbon atoms.
  - rung: 5
    name: full_step
    text:
      en: The functional group of the alkenes is the C=C double bond.
