id: itm.chm.o.stoichiometry.0111
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.yield_and_purity
- kc.chm.o.stoichiometry.reacting_masses
stem: Copper(II) oxide reacts with sulfuric acid and the copper(II) sulfate is crystallised. The equation is CuO + H₂SO₄ → CuSO₄ + H₂O. 8.00 g of CuO gives 12.0 g of CuSO₄.
parts:
- id: a
  prompt: Calculate the percentage yield.
  marks: 3
  answer:
    kind: numeric
    value: '75.0'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0111_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Work out the mass you should get, then compare the mass you did get.
  - rung: 2
    name: concept
    text:
      en: Percentage yield = actual ÷ theoretical × 100; the theoretical mass comes from the equation.
  - rung: 3
    name: first_step
    text:
      en: Moles of CuO = 8.00 ÷ 80 = 0.100 mol, so moles of CuSO₄ = 0.100 mol.
  - rung: 4
    name: worked_step
    text:
      en: Theoretical mass = 0.100 × 160 = 16.0 g.
  - rung: 5
    name: full_step
    text:
      en: Percentage yield = 12.0 ÷ 16.0 × 100 = 75.0%.
  misconception_ids:
  - mc.chm.o.yield_inverted
  - mc.chm.o.yield_uses_reactant_mass
solution:
  steps:
  - n: 1
    latex: n(\text{CuO}) = \frac{8.00}{80} = 0.100\ \text{mol}
    reason: Moles of reactant
    check_id: chk_build_chm_stoichiometry_0111_ma
  - n: 2
    latex: m_{theory} = 0.100 \times 160 = 16.0\ \text{g}
    reason: Theoretical yield
    check_id: chk_build_chm_stoichiometry_0111_mb
  - n: 3
    latex: \text{yield} = \frac{12.0}{16.0} \times 100 = 75.0\%
    reason: Actual over theoretical
    check_id: chk_build_chm_stoichiometry_0111_chain
