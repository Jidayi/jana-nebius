stem: 'For the reaction H₂ + F₂ → 2HF, use these bond energies in kJ/mol: H–H 436, F–F 158, H–F 568.'
parts:
- id: a
  prompt: Calculate the enthalpy change, ΔH, in kJ/mol.
  marks: 3
  answer:
    kind: numeric
    value: '-542'
    unit: kJ/mol
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_energetics_0032_dh
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: List the bonds that break and the bonds that form in H₂ + F₂ → 2HF.
  - rung: 2
    name: concept
    text:
      en: Breaking bonds takes energy in; forming bonds gives energy out. ΔH = broken − formed.
  - rung: 3
    name: first_step
    text:
      en: 'Bonds broken: one H–H and one F–F, a total of 594 kJ/mol.'
  - rung: 4
    name: worked_step
    text:
      en: 'Bonds formed: two H–F, a total of 1136 kJ/mol. Subtract.'
  - rung: 5
    name: full_step
    text:
      en: ΔH = 594 − 1136 = -542 kJ/mol.
  misconception_ids:
