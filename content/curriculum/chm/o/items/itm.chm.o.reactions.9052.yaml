stem: In a sealed vessel at constant temperature, a reversible reaction has reached dynamic equilibrium. A catalyst is then added without changing the temperature.
parts:
- id: a
  prompt: What effect does the catalyst have?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: The equilibrium mixture becomes all product.
      correct: false
    - id: B
      text: Only the forward reaction becomes faster.
      correct: false
    - id: C
      text: Both forward and reverse reactions become faster; the equilibrium composition is unchanged.
      correct: true
    - id: D
      text: The forward and reverse reactions both stop.
      correct: false
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: At equilibrium the forward and reverse rates are equal, not zero.
  - rung: 2
    name: concept
    text:
      en: A catalyst speeds up both directions without changing the equilibrium position.
  - rung: 3
    name: first_step
    text:
      en: Separate the rate at which equilibrium is reached from the composition of the equilibrium mixture.
  - rung: 4
    name: worked_step
    text:
      en: Do not confuse a faster approach to equilibrium with a change in the equilibrium mixture.
  - rung: 5
    name: full_step
    text:
      en: The answer is Both forward and reverse reactions become faster; the equilibrium composition is unchanged..
solution:
  steps:
  - n: 1
    latex: \text{C}
    reason: A catalyst speeds up both directions equally and does not change the equilibrium composition.
