stem: Zinc granules react slowly with dilute sulfuric acid at room temperature.
parts:
- id: a
  prompt: Which change would make the reaction faster?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Adding water to the acid
      correct: false
    - id: B
      text: Cooling the flask in ice
      correct: false
    - id: C
      text: Using larger zinc lumps of the same total mass
      correct: false
      misconception_id: mc.chm.o.reactions_bigger_pieces_faster
      feedback: Only the particles on the surface of a solid can be hit by the other reactant. Cutting a lump into small pieces, or grinding it to powder, exposes much more surface for the same mass, so the reaction is faster.
    - id: D
      text: Warming the acid
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which change gives the particles more energy or more chances to react?
  - rung: 2
    name: concept
    text:
      en: Higher temperature, higher concentration, larger surface area and a catalyst all increase the rate.
  - rung: 3
    name: first_step
    text:
      en: Adding water dilutes the acid; larger lumps have less surface; ice lowers the temperature.
  - rung: 4
    name: worked_step
    text:
      en: Only one option increases one of the four factors.
  - rung: 5
    name: full_step
    text:
      en: Warming the acid makes the reaction faster.
  misconception_ids:
  - mc.chm.o.reactions_bigger_pieces_faster
