stem: Oxides can be acidic, basic, amphoteric or neutral.
parts:
- id: a
  prompt: Which oxide is amphoteric?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Copper(II) oxide, CuO
      correct: false
      misconception_id: mc.chm.o.acids_oxide_by_element_only
      feedback: 'The metal / non-metal rule has exceptions. Test the oxide: aluminium oxide and zinc oxide also react with alkalis (amphoteric), and carbon monoxide and nitrogen monoxide react with neither acids nor alkalis (neutral).'
    - id: B
      text: Sulfur dioxide, SO₂
      correct: false
    - id: C
      text: Aluminium oxide, Al₂O₃
      correct: true
    - id: D
      text: Carbon monoxide, CO
      correct: false
      misconception_id: mc.chm.o.acids_amphoteric_neutral_confused
      feedback: 'Amphoteric means ''both'': aluminium oxide and zinc oxide react with acids and with alkalis. Neutral means ''neither'': carbon monoxide, nitrogen monoxide and water react with neither.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Amphoteric oxides react with acids and with alkalis. Which metals form them?
  - rung: 2
    name: concept
    text:
      en: Most metal oxides are only basic, but a few are amphoteric.
  - rung: 3
    name: first_step
    text:
      en: The common amphoteric oxides are those of aluminium and zinc.
  - rung: 4
    name: worked_step
    text:
      en: Copper(II) oxide is basic; carbon monoxide is neutral.
  - rung: 5
    name: full_step
    text:
      en: Aluminium oxide reacts with both acids and alkalis, so it is amphoteric.
  misconception_ids:
  - mc.chm.o.acids_oxide_by_element_only
  - mc.chm.o.acids_amphoteric_neutral_confused
