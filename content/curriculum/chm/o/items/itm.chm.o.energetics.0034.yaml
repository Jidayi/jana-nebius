stem: 'For the reaction N₂ + O₂ → 2NO, use these bond energies in kJ/mol: N≡N 945, O=O 498, N=O 630.'
parts:
- id: a
  prompt: Calculate the enthalpy change, ΔH, in kJ/mol.
  marks: 3
