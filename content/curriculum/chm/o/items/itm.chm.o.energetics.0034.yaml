    kind: numeric
    value: '183'
    unit: kJ/mol
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_energetics_0034_dh
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: List the bonds that break and the bonds that form in N₂ + O₂ → 2NO.
  - rung: 2
    name: concept
    text:
      en: Breaking bonds takes energy in; forming bonds gives energy out. ΔH = broken − formed.
  - rung: 3
    name: first_step
    text:
      en: 'Bonds broken: one N≡N and one O=O, a total of 1443 kJ/mol.'
  - rung: 4
    name: worked_step
    text:
      en: 'Bonds formed: two N=O, a total of 1260 kJ/mol. Subtract.'
  - rung: 5
    name: full_step
    text:
      en: ΔH = 1443 − 1260 = 183 kJ/mol.
  misconception_ids:
