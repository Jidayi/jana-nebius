id: itm.chm.o.acids.0069
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.titration_calculations
stem: A student titrates 25.0 cm³ of 0.100 mol/dm³ sulfuric acid with 0.250 mol/dm³ potassium hydroxide solution. The equation is H₂SO₄ + 2KOH → K₂SO₄ + 2H₂O.
parts:
- id: a
  prompt: Calculate the volume of potassium hydroxide solution, in cm³, needed to neutralise the acid.
  marks: 3
  answer:
    kind: numeric
    value: '20.0'
    unit: cm^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_acids_0069_r
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the moles of sulfuric acid, then the moles of potassium hydroxide that react with it, then the volume that holds them.
  - rung: 2
    name: concept
    text:
      en: The equation shows one mole of H₂SO₄ reacts with two moles of KOH. Volume in dm³ = moles ÷ concentration.
  - rung: 3
    name: first_step
    text:
      en: Moles of H₂SO₄ = 0.100 × 25.0 ÷ 1000 = 0.00250 mol.
  - rung: 4
    name: worked_step
    text:
      en: Moles of KOH needed = 0.00500 mol. Divide by 0.250 to get dm³, then multiply by 1000.
  - rung: 5
    name: full_step
    text:
      en: V = 0.00500 ÷ 0.250 × 1000 = 20.0 cm³.
  misconception_ids:
  - mc.chm.o.acids_titration_ratio_ignored
  - mc.chm.o.acids_titration_ratio_upside_down
solution:
  steps:
  - n: 1
    latex: n(\text{acid}) = 0.100 \times \frac{25.0}{1000} = 0.00250\ \text{mol}
    reason: Moles of acid from c × V
    check_id: chk_build_chm_acids_0069_ab
  - n: 2
    latex: n(\text{base}) = 2 \times 0.00250 = 0.00500\ \text{mol}
    reason: Mole ratio from the equation
    check_id: chk_build_chm_acids_0069_ab
  - n: 3
    latex: V = \frac{0.00500}{0.250} \times 1000 = 20.0\ \text{cm}^3
    reason: Moles over concentration, in cm³
    check_id: chk_build_chm_acids_0069_r
