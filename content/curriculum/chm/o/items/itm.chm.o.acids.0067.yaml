id: itm.chm.o.acids.0067
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.titration_calculations
stem: In a titration, 25.0 cm³ of 0.100 mol/dm³ sulfuric acid is exactly neutralised by 25.0 cm³ of sodium hydroxide solution. The equation is H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O.
parts:
- id: a
  prompt: Calculate the concentration of the sodium hydroxide solution in mol/dm³.
  marks: 3
  answer:
    kind: numeric
    value: '0.200'
    unit: mol/dm^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_acids_0067_r
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You know the concentration and volume of the sulfuric acid, so work out its moles first.
  - rung: 2
    name: concept
    text:
      en: Moles = concentration × volume in dm³. The equation shows one mole of H₂SO₄ reacts with two moles of NaOH.
  - rung: 3
    name: first_step
    text:
      en: Moles of H₂SO₄ = 0.100 × 25.0 ÷ 1000 = 0.00250 mol.
  - rung: 4
    name: worked_step
    text:
      en: So the 25.0 cm³ of NaOH holds 0.00500 mol. Divide this by (25.0 ÷ 1000) dm³.
  - rung: 5
    name: full_step
    text:
      en: c(NaOH) = 0.00500 ÷ (25.0 ÷ 1000) = 0.200 mol/dm³.
  misconception_ids:
  - mc.chm.o.acids_titration_ratio_ignored
  - mc.chm.o.acids_titration_ratio_upside_down
solution:
  steps:
  - n: 1
    latex: n(\text{acid}) = 0.100 \times \frac{25.0}{1000} = 0.00250\ \text{mol}
    reason: Moles of acid from c × V
    check_id: chk_build_chm_acids_0067_ab
  - n: 2
    latex: n(\text{base}) = 2 \times 0.00250 = 0.00500\ \text{mol}
    reason: Mole ratio from the equation
    check_id: chk_build_chm_acids_0067_ab
  - n: 3
    latex: c = \frac{0.00500}{25.0 \div 1000} = 0.200\ \text{mol/dm}^3
    reason: Amount over volume in dm³
    check_id: chk_build_chm_acids_0067_r
