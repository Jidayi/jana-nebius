stem: During the purification of copper, a sludge collects below the anode.
parts:
- id: a
  prompt: What is in the sludge?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Carbon from the electrodes
      correct: false
    - id: B
      text: Pure copper that falls off the cathode
      correct: false
      misconception_id: mc.chm.o.electrolysis_impure_copper_as_cathode
      feedback: 'The impure copper is the anode: its copper atoms lose electrons and go into solution as Cu²⁺. These ions gain electrons at the cathode, a thin sheet of pure copper, which grows. Impurities fall below the anode.'
    - id: C
      text: Copper(II) sulfate crystals
      correct: false
    - id: D
      text: Impurities such as silver and gold that do not dissolve
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The anode is impure copper. What happens to its impurities as it dissolves?
  - rung: 2
    name: concept
    text:
      en: Copper atoms leave the anode as ions; some impurities do not.
  - rung: 3
    name: first_step
    text:
      en: Unreactive metals such as silver and gold are not oxidised at the anode.
  - rung: 4
    name: worked_step
    text:
      en: Particles that do not dissolve fall to the bottom of the cell.
  - rung: 5
    name: full_step
    text:
      en: The sludge (anode mud) contains insoluble impurities such as silver and gold, which can be sold.
