id: itm.chm.o.metals.0041
version: 0.1.0
type: mcq
subject: chm
level: o
kc_ids:
- kc.chm.o.metals.corrosion
stem: A bicycle chain is protected from rust with oil, while the frame is painted.
parts:
- id: a
  prompt: Why is oil used on the chain rather than paint?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Paint only stops air, but oil stops water.
      correct: false
      misconception_id: mc.chm.o.metals_rust_one_condition
      feedback: 'Compare the test tubes: a nail in boiled water under oil (no air) and a nail in dry air (no water) both stay shiny. Only the nail with water AND air rusts.'
    - id: B
      text: Oil reacts with iron to make it more reactive than zinc.
      correct: false
      misconception_id: mc.chm.o.metals_sacrificial_less_reactive
      feedback: Sacrificial protection needs a metal MORE reactive than iron, such as zinc or magnesium. It corrodes first, losing electrons instead of the iron, so the iron is saved.
    - id: C
      text: The chain moves, so paint would crack off; oil keeps out water and air and also lubricates.
      correct: true
    - id: D
      text: Oil removes the oxygen from the chain's iron.
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about how the chain is used compared with the frame.
  - rung: 2
    name: concept
    text:
      en: 'Paint, oil and grease are barriers: they keep water and oxygen away from the iron.'
  - rung: 3
    name: first_step
    text:
      en: A barrier only works while it is unbroken.
  - rung: 4
    name: worked_step
    text:
      en: Think about what happens to a hard coat of paint on links that bend all the time.
  - rung: 5
    name: full_step
    text:
      en: Paint would crack on the moving chain; oil stays in place as a barrier and helps it run smoothly.
  misconception_ids:
  - mc.chm.o.metals_sacrificial_less_reactive
  - mc.chm.o.metals_rust_one_condition
solution:
  steps:
  - n: 1
    latex: \text{barrier method suited to moving parts}
    reason: Oil keeps out water and air
