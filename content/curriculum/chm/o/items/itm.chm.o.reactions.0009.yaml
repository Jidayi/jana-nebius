stem: Chemical changes and physical changes can look alike at first.
parts:
- id: a
  prompt: Which is true of every chemical change?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: A flame or a spark is always seen.
      correct: false
    - id: B
      text: At least one new substance is formed.
      correct: true
    - id: C
      text: It can always be reversed by cooling.
      correct: false
    - id: D
      text: The total mass of the substances decreases.
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what makes a change chemical rather than physical.
  - rung: 2
    name: concept
    text:
      en: The key idea is the formation of something that was not there before.
  - rung: 3
    name: first_step
    text:
      en: Mass is conserved in every change, and many reactions happen without a flame.
  - rung: 4
    name: worked_step
    text:
      en: Only one of the options is true for every chemical change, from rusting to cooking.
  - rung: 5
    name: full_step
    text:
      en: Every chemical change makes at least one new substance.
solution:
  steps:
  - n: 1
    latex: '\text{chemical change: new substance formed}'
