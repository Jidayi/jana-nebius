stem: Aqueous ammonia is added to dilute sulfuric acid until the acid is neutralised. The solution is used to make a fertiliser.
parts:
- id: a
  prompt: Which salt is in the solution?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Ammonium chloride
      correct: false
      misconception_id: mc.chm.o.acids_salt_anion_confused
      feedback: The acid names the salt. Hydrochloric acid makes chlorides, sulfuric acid makes sulfates and nitric acid makes nitrates. The metal (or ammonium) gives the first part of the name.
    - id: B
      text: Nitrogen sulfate
      correct: false
    - id: C
      text: Ammonium nitrate
      correct: false
      misconception_id: mc.chm.o.acids_salt_anion_confused
      feedback: The acid names the salt. Hydrochloric acid makes chlorides, sulfuric acid makes sulfates and nitric acid makes nitrates. The metal (or ammonium) gives the first part of the name.
    - id: D
      text: Ammonium sulfate
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Ammonia is an alkali. What kind of product does it give with an acid?
  - rung: 2
    name: concept
    text:
      en: Ammonia and an acid give an ammonium salt.
  - rung: 3
    name: first_step
    text:
      en: The acid used was sulfuric acid, which gives sulfates.
  - rung: 4
    name: worked_step
    text:
      en: Put the ammonium part together with the name that sulfuric acid gives.
  - rung: 5
    name: full_step
    text:
      en: '2NH₃ + H₂SO₄ → (NH₄)₂SO₄: ammonium sulfate, a common fertiliser.'
  misconception_ids:
  - mc.chm.o.acids_salt_anion_confused
