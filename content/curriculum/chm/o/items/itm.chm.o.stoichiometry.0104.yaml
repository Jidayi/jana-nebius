id: itm.chm.o.stoichiometry.0104
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.empirical_formula
stem: A compound has the empirical formula NO₂ and a relative molecular mass of 92.
parts:
- id: a
  prompt: How many O atoms are there in one molecule of the compound?
  marks: 2
  answer:
    kind: numeric
    value: '4'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0104_atoms
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The molecular formula is a whole-number multiple of the empirical formula.
  - rung: 2
    name: concept
    text:
      en: Divide the relative molecular mass by the mass of one empirical formula unit to find the multiple.
  - rung: 3
    name: first_step
    text:
      en: The empirical formula NO₂ has a mass of 46.
  - rung: 4
    name: worked_step
    text:
      en: 92 ÷ 46 = 2, so multiply every number in NO₂ by 2.
  - rung: 5
    name: full_step
    text:
      en: The molecular formula is N₂O₄, which has 4 O atoms.
  misconception_ids:
  - mc.chm.o.empirical_mass_ratio
solution:
  steps:
  - n: 1
    latex: M_r(\text{NO}_2) = 46
    reason: Mass of the empirical unit
    check_id: chk_build_chm_stoichiometry_0104_emp
  - n: 2
    latex: \frac{92}{46} = 2
    reason: How many units in one molecule
    check_id: chk_build_chm_stoichiometry_0104_factor
  - n: 3
    latex: '\text{N}_2\text{O}_4: M_r = 92'
    reason: Molecular formula
    check_id: chk_build_chm_stoichiometry_0104_mol
  - n: 4
    latex: O = 4
    reason: Atoms of O
    check_id: chk_build_chm_stoichiometry_0104_atoms
