id: itm.chm.o.reactions.0066
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.reactions.redox
stem: Reduction can be described in more than one way.
parts:
- id: a
  prompt: Which description of reduction is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: The change that a reducing agent undergoes
      correct: false
      misconception_id: mc.chm.o.reactions_oxidising_agent_is_oxidised
      feedback: An agent does the job to something else. The oxidising agent oxidises another substance by taking its electrons, so the oxidising agent itself is reduced. The reducing agent gives electrons away and is oxidised.
    - id: B
      text: Only loss of oxygen; nothing else counts as reduction
      correct: false
      misconception_id: mc.chm.o.reactions_redox_needs_oxygen
      feedback: 'Oxygen is only one way to see redox. Any transfer of electrons is redox: when magnesium burns in chlorine, magnesium loses electrons (oxidised) and chlorine gains them (reduced), with no oxygen at all.'
    - id: C
      text: Loss of electrons
      correct: false
      misconception_id: mc.chm.o.reactions_oxidation_is_gaining_electrons
      feedback: Oxidation is loss of electrons; reduction is gain of electrons. A metal atom that becomes a positive ion has lost electrons, so it has been oxidised.
    - id: D
      text: Gain of electrons, loss of oxygen, or a decrease in oxidation number
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'There are three ways to recognise reduction: oxygen, electrons and oxidation numbers.'
  - rung: 2
    name: concept
    text:
      en: Reduction is the opposite of oxidation in every one of those ways.
  - rung: 3
    name: first_step
    text:
      en: Oxidation is gain of oxygen, loss of electrons and an increase in oxidation number.
  - rung: 4
    name: worked_step
    text:
      en: Reverse each part of the description of oxidation.
  - rung: 5
    name: full_step
    text:
      en: Reduction is gain of electrons, loss of oxygen, or a decrease in oxidation number.
  misconception_ids:
  - mc.chm.o.reactions_oxidation_is_gaining_electrons
  - mc.chm.o.reactions_redox_needs_oxygen
  - mc.chm.o.reactions_oxidising_agent_is_oxidised
