id: itm.chm.o.acids.0042
version: 0.1.0
type: mcq
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.oxides
stem: Four oxides are tested with dilute nitric acid.
parts:
- id: a
  prompt: Which oxide is a basic oxide?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Calcium oxide, CaO
      correct: true
    - id: B
      text: Carbon dioxide, CO₂
      correct: false
      misconception_id: mc.chm.o.acids_oxide_type_swapped
      feedback: 'Metal oxides such as CaO and CuO are bases: they react with acids. Non-metal oxides such as CO₂ and SO₂ are acidic: they react with alkalis and give acidic solutions in water.'
    - id: C
      text: Sulfur dioxide, SO₂
      correct: false
      misconception_id: mc.chm.o.acids_oxide_type_swapped
      feedback: 'Metal oxides such as CaO and CuO are bases: they react with acids. Non-metal oxides such as CO₂ and SO₂ are acidic: they react with alkalis and give acidic solutions in water.'
    - id: D
      text: Carbon monoxide, CO
      correct: false
      misconception_id: mc.chm.o.acids_amphoteric_neutral_confused
      feedback: 'Amphoteric means ''both'': aluminium oxide and zinc oxide react with acids and with alkalis. Neutral means ''neither'': carbon monoxide, nitrogen monoxide and water react with neither.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Which of these is the oxide of a metal?
  - rung: 2
    name: concept
    text:
      en: 'Most metal oxides are basic: they react with acids to form a salt and water.'
  - rung: 3
    name: first_step
    text:
      en: Carbon and sulfur are non-metals.
  - rung: 4
    name: worked_step
    text:
      en: Find the oxide of a metal from Group II.
  - rung: 5
    name: full_step
    text:
      en: Calcium oxide is a metal oxide that reacts with acids, so it is basic.
  misconception_ids:
  - mc.chm.o.acids_oxide_type_swapped
  - mc.chm.o.acids_amphoteric_neutral_confused
solution:
  steps:
  - n: 1
    latex: \text{CaO} + 2\text{HNO}_3 \rightarrow \text{Ca(NO}_3\text{)}_2 + \text{H}_2\text{O}
    reason: Basic oxide + acid → salt + water
