id: itm.chm.o.acids.0028
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.strong_and_weak
stem: A student adds a large volume of water to some concentrated nitric acid.
parts:
- id: a
  prompt: Which statement about the new solution is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: It is now a weak acid, so it no longer contains ions
      correct: false
      misconception_id: mc.chm.o.acids_weak_not_ionised
      feedback: 'A weak acid is partly ionised: most molecules stay whole, but some give H⁺ ions. That is why ethanoic acid still turns indicators red or orange, conducts a little and reacts slowly with metals.'
    - id: B
      text: It is still a strong acid, but now it is dilute
      correct: true
    - id: C
      text: It has become a weak acid, because there is less acid in each dm³
      correct: false
      misconception_id: mc.chm.o.acids_strong_means_concentrated
      feedback: Strength is about how fully an acid ionises in water. Concentration is about how much acid is in each dm³. A dilute solution of hydrochloric acid is still a strong acid; a concentrated solution of ethanoic acid is still a weak acid.
    - id: D
      text: It becomes neutral once enough water is added
      correct: false
      misconception_id: mc.chm.o.acids_dilution_ph_wrong
      feedback: Adding water spreads the same ions through more solution, so the pH moves towards 7. Water itself is neutral, so it can never make an acid alkaline or an alkali acidic.
  hints:
  - rung: 1
    name: orient
    text:
      en: Which word describes how much acid is in each dm³, and which describes how fully it ionises?
  - rung: 2
    name: concept
    text:
      en: Concentrated and dilute describe the amount per dm³. Strong and weak describe ionisation.
  - rung: 3
    name: first_step
    text:
      en: Adding water changes how much acid is in each dm³.
  - rung: 4
    name: worked_step
    text:
      en: Does water change whether each nitric acid molecule splits into ions?
  - rung: 5
    name: full_step
    text:
      en: The nitric acid is still fully ionised, so it is still a strong acid; it is now dilute.
  misconception_ids:
  - mc.chm.o.acids_strong_means_concentrated
  - mc.chm.o.acids_dilution_ph_wrong
  - mc.chm.o.acids_weak_not_ionised
solution:
  steps:
  - n: 1
    latex: \text{strong} \neq \text{concentrated}
    reason: Two different ideas
