stem: Copper(II) carbonate decomposes on heating. The equation is CuCO₃ → CuO + CO₂.
parts:
- id: a
  prompt: Calculate the mass of CuO that forms from 8.0 g of CuCO₃.
  marks: 3
  answer:
    kind: numeric
    value: '5.16'
    unit: g
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0071_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'You know the mass of CuCO₃. Plan: mass → moles → ratio → moles → mass.'
  - rung: 2
    name: concept
    text:
      en: Use the balanced equation's numbers as a mole ratio.
  - rung: 3
    name: first_step
    text:
      en: Moles of CuCO₃ = 8.0 ÷ 124 = 0.0645 mol.
  - rung: 4
    name: worked_step
    text:
      en: 'Ratio CuCO₃ : CuO is 1 : 1, so moles of CuO = 0.0645 mol.'
  - rung: 5
    name: full_step
    text:
      en: Mass of CuO = 0.0645 × 80 = 5.16 g.
  misconception_ids:
  - mc.chm.o.ratio_ignored
  - mc.chm.o.mass_ratio_as_mole_ratio
solution:
  steps:
  - n: 1
    latex: n(\text{CuCO}_3) = \frac{8.0}{124} = 0.0645\ \text{mol}
    reason: Moles of the given substance
    check_id: chk_build_chm_stoichiometry_0071_ma
  - n: 2
    latex: '\text{CuCO}_3 : \text{CuO} = 1 : 1'
    reason: Ratio from the equation
    check_id: chk_build_chm_stoichiometry_0071_coef
  - n: 3
    latex: n(\text{CuO}) = 0.0645\ \text{mol}
    reason: Mole ratio from the equation
    check_id: chk_build_chm_stoichiometry_0071_chain
  - n: 4
    latex: m(\text{CuO}) = 0.0645 \times 80 = 5.16\ \text{g}
    reason: Moles times molar mass
    check_id: chk_build_chm_stoichiometry_0071_mb
