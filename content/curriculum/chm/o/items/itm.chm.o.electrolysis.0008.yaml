stem: Molten lead(II) bromide is electrolysed with graphite electrodes in a fume cupboard.
parts:
- id: a
  prompt: What is seen at the anode?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Red-brown fumes of bromine
      correct: true
    - id: B
      text: Bubbles of colourless hydrogen
      correct: false
      misconception_id: mc.chm.o.electrolysis_molten_gives_hydrogen
      feedback: A molten binary compound contains only its own two kinds of ion. There is no water, so there are no hydrogen or hydroxide ions. The metal forms at the cathode and the non-metal at the anode.
    - id: C
      text: No change
      correct: false
    - id: D
      text: Silvery beads of lead
      correct: false
      misconception_id: mc.chm.o.electrolysis_metal_at_anode
      feedback: Opposite charges attract. Positive metal ions (cations) move to the negative electrode, the cathode, and become metal there. Negative non-metal ions (anions) move to the positive electrode, the anode.
  hints:
  - rung: 1
    name: orient
    text:
      en: The anode is the positive electrode. Which ions go there?
  - rung: 2
    name: concept
    text:
      en: Negative ions are discharged at the anode.
  - rung: 3
    name: first_step
    text:
      en: The negative ions in lead(II) bromide are bromide ions, Br⁻.
  - rung: 4
    name: worked_step
    text:
      en: Bromide ions lose electrons and form an element. What colour is that element as a vapour?
  - rung: 5
    name: full_step
    text:
      en: Bromide ions are discharged at the anode as bromine, seen as red-brown fumes. That is why a fume cupboard is used.
  misconception_ids:
  - mc.chm.o.electrolysis_metal_at_anode
  - mc.chm.o.electrolysis_molten_gives_hydrogen
solution:
  steps:
  - n: 1
    latex: '\text{anode: bromine (red-brown)}'
    reason: Anions discharged at the anode
