id: itm.chm.o.energetics.0044
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.energetics.calorimetry
stem: 0.00250 mol of ethanol burns and heats some water. The 150 g of water (or solution) changes temperature from 20.0 °C to 31.5 °C. Take the specific heat capacity of water as 4.2 J/(g °C).
parts:
- id: a
  prompt: Calculate the energy transferred to or from the water, in kJ.
  marks: 2
  answer:
    kind: numeric
    value: '7.25'
    unit: kJ
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_energetics_0044_q
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The water's temperature changed; that tells you the energy transferred.
  - rung: 2
    name: concept
    text:
      en: Q = m × c × ΔT, using the mass of the water and c = 4.2 J/(g °C).
  - rung: 3
    name: first_step
    text:
      en: ΔT = 31.5 − 20.0 = 11.5 °C.
  - rung: 4
    name: worked_step
    text:
      en: Q = 150 × 4.2 × 11.5 J; divide by 1000 for kJ.
  - rung: 5
    name: full_step
    text:
      en: Q = 7245 J = 7.25 kJ.
  misconception_ids:
  - mc.chm.o.energetics_mass_of_reactant
solution:
  steps:
  - n: 1
    latex: \Delta T = 11.5
    reason: Change in temperature
    check_id: chk_build_chm_energetics_0044_dh
  - n: 2
    latex: Q = 150 \times 4.2 \times 11.5 = 7245\ \text{J}
    reason: Q = mc\Delta T
    check_id: chk_build_chm_energetics_0044_dh
  - n: 3
    latex: Q = 7.25\ \text{kJ}
    reason: J to kJ
    check_id: chk_build_chm_energetics_0044_q
