stem: When 2.4 g of magnesium ribbon burns completely in air, 4.0 g of white magnesium oxide forms.
parts:
- id: a
  prompt: Where does the extra mass come from?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Oxygen from the air, which has combined with the magnesium
      correct: true
    - id: B
      text: Heat from the flame, which has been added to the magnesium
      correct: false
    - id: C
      text: Smoke from the flame, which has settled on the magnesium
      correct: false
    - id: D
      text: 'Nowhere: the balance must be wrong, because mass cannot increase'
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Burning is a reaction with a gas from the air. Which gas?
  - rung: 2
    name: concept
    text:
      en: In a chemical change atoms are rearranged, never made or destroyed.
  - rung: 3
    name: first_step
    text:
      en: The mass went up by 4.0 − 2.4 = 1.6 g.
  - rung: 4
    name: worked_step
    text:
      en: That extra mass must be atoms of another element that joined the magnesium.
  - rung: 5
    name: full_step
    text:
      en: The extra 1.6 g is oxygen from the air, which combined with the magnesium to make magnesium oxide, a new substance.
