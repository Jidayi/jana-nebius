stem: River water is treated before it is piped to homes.
parts:
- id: a
  prompt: Which stage of treatment kills microbes?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Adding chlorine
      correct: true
    - id: B
      text: Passing it through carbon
      correct: false
      misconception_id: mc.chm.o.environment_treatment_stages_mixed
      feedback: Each stage has one job. Sedimentation lets large particles settle. Filtration removes small insoluble particles. Carbon removes tastes and smells. Chlorine kills microbes. None of these removes dissolved salts, so tap water is not pure.
    - id: C
      text: Filtering through beds of sand
      correct: false
      misconception_id: mc.chm.o.environment_treatment_stages_mixed
      feedback: Each stage has one job. Sedimentation lets large particles settle. Filtration removes small insoluble particles. Carbon removes tastes and smells. Chlorine kills microbes. None of these removes dissolved salts, so tap water is not pure.
    - id: D
      text: Leaving it to stand in sedimentation tanks
      correct: false
      misconception_id: mc.chm.o.environment_treatment_stages_mixed
      feedback: Each stage has one job. Sedimentation lets large particles settle. Filtration removes small insoluble particles. Carbon removes tastes and smells. Chlorine kills microbes. None of these removes dissolved salts, so tap water is not pure.
  hints:
  - rung: 1
    name: orient
    text:
      en: Microbes such as bacteria are living things. Which stage uses a chemical that kills them?
  - rung: 2
    name: concept
    text:
      en: Sedimentation and filtration remove particles; carbon removes tastes and smells.
  - rung: 3
    name: first_step
    text:
      en: Bacteria are so small that many pass through sand filters.
  - rung: 4
    name: worked_step
    text:
      en: Which substance, added to swimming pools too, kills germs?
  - rung: 5
    name: full_step
    text:
      en: Chlorination kills microbes, making the water safe to drink.
