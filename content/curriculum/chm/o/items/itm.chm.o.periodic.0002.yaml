id: itm.chm.o.periodic.0002
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.periodic.arrangement
stem: An atom of element X has the electron arrangement 2,8,8,2.
parts:
- id: a
  prompt: Where is X in the Periodic Table?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Group VIII, fourth period
      correct: false
      misconception_id: mc.chm.o.periodic_group_from_full_shell
      feedback: Only the last number in the arrangement, the outer shell, gives the group.
    - id: B
      text: Group IV, second period
      correct: false
      misconception_id: mc.chm.o.periodic_group_period_swapped
      feedback: Group = number of outer-shell electrons (down the columns). Period = number of occupied shells (along the rows).
    - id: C
      text: Group II, third period
      correct: false
      misconception_id: mc.chm.o.periodic_period_full_shells_only
      feedback: Count every shell that has electrons in it, including the outer one, even if it is not full.
    - id: D
      text: Group II, fourth period
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Two things come from 2,8,8,2: how many shells there are, and how many electrons are in the outer one.'
  - rung: 2
    name: concept
    text:
      en: The group is the number of outer-shell electrons; the period is the number of occupied shells.
  - rung: 3
    name: first_step
    text:
      en: The outer shell is the last number in 2,8,8,2.
  - rung: 4
    name: worked_step
    text:
      en: Now count how many numbers there are in the arrangement.
  - rung: 5
    name: full_step
    text:
      en: 'X has 2 outer electrons and 4 shells: Group II, fourth period (it is calcium).'
  misconception_ids:
  - mc.chm.o.periodic_group_period_swapped
  - mc.chm.o.periodic_group_from_full_shell
  - mc.chm.o.periodic_period_full_shells_only
solution:
  steps:
  - n: 1
    latex: \text{outer electrons} = 2
    reason: Gives the group
    check_id: chk_build_chm_periodic_0002_o
  - n: 2
    latex: \text{Group II, fourth period}
    reason: Shells give the period
