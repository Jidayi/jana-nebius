id: itm.chm.o.stoichiometry.0039
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.percentage_composition
stem: Calcium carbonate, CaCO₃ contains the element O.
parts:
- id: a
  prompt: What is the percentage by mass of O in CaCO₃?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 16.0%
      correct: false
      misconception_id: mc.chm.o.percent_count_ignored
      feedback: 'The top of the fraction is the mass of all the atoms of that element in the formula: number of atoms × Ar.'
    - id: B
      text: 208%
      correct: false
      misconception_id: mc.chm.o.percent_inverted
      feedback: A part is smaller than the whole, so the percentage of one element is always below 100.
    - id: C
      text: '0.480'
      correct: false
      misconception_id: mc.chm.o.percent_ar_over_mr_no_100
      feedback: 'A percentage is a fraction of 100: multiply the fraction by 100.'
    - id: D
      text: 48.0%
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You need the share of the mass of CaCO₃ that is O.
  - rung: 2
    name: concept
    text:
      en: Percentage by mass = (number of atoms × Ar of the element) ÷ Mr × 100.
  - rung: 3
    name: first_step
    text:
      en: Mr of CaCO₃ is 100.
  - rung: 4
    name: worked_step
    text:
      en: The O atoms in CaCO₃ have a total mass of 48; divide this by 100.
  - rung: 5
    name: full_step
    text:
      en: 48 ÷ 100 × 100 = 48.0%.
  misconception_ids:
  - mc.chm.o.percent_count_ignored
  - mc.chm.o.percent_inverted
  - mc.chm.o.percent_ar_over_mr_no_100
solution:
  steps:
  - n: 1
    latex: M_r = 100
    reason: Relative formula mass of CaCO₃
    check_id: chk_build_chm_stoichiometry_0039_mr
  - n: 2
    latex: \text{O}_3 = 48
    reason: Mass of the O atoms
    check_id: chk_build_chm_stoichiometry_0039_el
  - n: 3
    latex: \% = \frac{48}{100} \times 100 = 48.0\%
    reason: Fraction of the whole
    check_id: chk_build_chm_stoichiometry_0039_pct
