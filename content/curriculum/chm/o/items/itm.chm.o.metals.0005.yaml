stem: Jewellery such as rings is often made of gold.
parts:
- id: a
  prompt: Which property matters most for this use?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Gold is hard and strong.
      correct: false
    - id: B
      text: Gold has a low density.
      correct: false
    - id: C
      text: Gold is very unreactive, so it stays shiny and does not tarnish.
      correct: true
    - id: D
      text: Gold is a good conductor of electricity.
      correct: false
      misconception_id: mc.chm.o.metals_use_wrong_property
      feedback: Ask what the job needs first. A wire must carry current and bend; a plane body must be light and strong; a ring must stay shiny. Then pick the property that meets that need.
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Start from the job: what must a metal used for jewellery do?'
  - rung: 2
    name: concept
    text:
      en: Match the need of the job to one property of the metal.
  - rung: 3
    name: first_step
    text:
      en: For jewellery, think about the conditions the metal meets every day.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that are true of some metals but do not help with this job.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: gold is very unreactive, so it stays shiny and does not tarnish. Here gold stays shiny for many years because it does not react with air or water.'
  misconception_ids:
  - mc.chm.o.metals_use_wrong_property
