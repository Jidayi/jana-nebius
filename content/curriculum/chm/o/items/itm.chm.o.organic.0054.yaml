  - rung: 4
    name: worked_step
    text:
      en: 'Count the atoms: two carbon atoms and six hydrogen atoms. Which compound is that?'
  - rung: 5
    name: full_step
    text:
      en: 'C₂H₄ + H₂ → C₂H₆: the product is ethane. The same reaction hardens vegetable oils into margarine.'
