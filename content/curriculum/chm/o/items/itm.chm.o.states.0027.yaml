id: itm.chm.o.states.0027
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.states.diffusion
stem: Equal amounts of methane, CH₄, and carbon dioxide, CO₂, are released at the same temperature.
parts:
- id: a
  prompt: Which gas diffuses faster, and why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Neither, unless the air is stirred
      correct: false
      misconception_id: mc.chm.o.states_diffusion_needs_mixing
      feedback: Particles move randomly all the time. Diffusion happens on its own, even in still air; stirring only speeds it up.
    - id: B
      text: Carbon dioxide, because its heavier molecules push harder
      correct: false
      misconception_id: mc.chm.o.states_heavier_faster
      feedback: At the same temperature lighter molecules move faster on average, so the gas with the lower Mr diffuses faster.
    - id: C
      text: Both the same, because all gases diffuse at the same rate
      correct: false
      misconception_id: mc.chm.o.states_all_gases_same_rate
      feedback: Ammonia and hydrogen chloride released at opposite ends of a tube meet nearer the hydrogen chloride end, so ammonia must travel faster.
    - id: D
      text: Methane, because its molecules are lighter and move faster
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Compare the masses of the molecules of methane and carbon dioxide.
  - rung: 2
    name: concept
    text:
      en: At the same temperature, lighter molecules move faster on average.
  - rung: 3
    name: first_step
    text:
      en: Mr of CH₄ is 16; Mr of CO₂ is 44.
  - rung: 4
    name: worked_step
    text:
      en: The gas whose molecules move faster spreads out faster.
  - rung: 5
    name: full_step
    text:
      en: Methane (Mr 16) diffuses faster than carbon dioxide (Mr 44).
  misconception_ids:
  - mc.chm.o.states_heavier_faster
  - mc.chm.o.states_all_gases_same_rate
  - mc.chm.o.states_diffusion_needs_mixing
solution:
  steps:
