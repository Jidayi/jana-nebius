id: itm.chm.o.stoichiometry.0025
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.relative_formula_mass
stem: A student calculates the relative formula mass of calcium hydroxide, Ca(OH)₂.
parts:
- id: a
  prompt: Which value is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: '38'
      correct: false
      misconception_id: mc.chm.o.mr_atomic_number
      feedback: Use the relative atomic mass (the larger number for most elements), not the proton number.
    - id: B
      text: '58'
      correct: false
      misconception_id: mc.chm.o.mr_bracket_multiplier
      feedback: 'The number after a bracket multiplies everything inside it: (OH)₂ is two O atoms and two H atoms.'
    - id: C
      text: '74'
      correct: true
    - id: D
      text: '57'
      correct: false
      misconception_id: mc.chm.o.mr_count_ignored
      feedback: Write out the atoms one by one for a small formula such as H₂O (H + H + O) and see that each atom counts.
  hints:
  - rung: 1
    name: orient
    text:
      en: Every atom in Ca(OH)₂ adds its relative atomic mass to the total.
  - rung: 2
    name: concept
    text:
      en: Use relative atomic masses (not proton numbers), multiply each by its number of atoms, and remember that a number after a bracket multiplies everything inside it.
  - rung: 3
    name: first_step
    text:
      en: List the atoms of each element in Ca(OH)₂, counting through the bracket.
  - rung: 4
    name: worked_step
    text:
      en: 'In Ca(OH)₂: one Ca atom gives 40, two O atoms give 32 and two H atoms give 2.'
  - rung: 5
    name: full_step
    text:
      en: Adding these gives Mr = 74.
  misconception_ids:
  - mc.chm.o.mr_count_ignored
  - mc.chm.o.mr_bracket_multiplier
  - mc.chm.o.mr_atomic_number
solution:
  steps:
  - n: 1
    latex: \text{Ca} = 40
    reason: One Ca atom times Ar
    check_id: chk_build_chm_stoichiometry_0025_g_ca
  - n: 2
    latex: \text{O}_2 = 32
    reason: Two O atoms times Ar
    check_id: chk_build_chm_stoichiometry_0025_g_o
  - n: 3
    latex: \text{H}_2 = 2
    reason: Two H atoms times Ar
    check_id: chk_build_chm_stoichiometry_0025_g_h
  - n: 4
    latex: M_r = 74
    reason: Add the shares
    check_id: chk_build_chm_stoichiometry_0025_mr
