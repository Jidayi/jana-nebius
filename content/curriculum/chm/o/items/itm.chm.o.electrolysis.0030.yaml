id: itm.chm.o.electrolysis.0030
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.electrolysis.half_equations
stem: Dilute sulfuric acid is electrolysed with inert electrodes. Oxygen forms at the anode from hydroxide ions.
parts:
- id: a
  prompt: Which half-equation shows the change at the anode?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 4OH⁻ → O₂ + 2H₂O + 4e⁻
      correct: true
    - id: B
      text: 4OH⁻ → O₂ + 2H₂O + 2e⁻
      correct: false
      misconception_id: mc.chm.o.electrolysis_half_charge_unbalanced
      feedback: 'After balancing the atoms, add up the charges on each side. Add electrons until both sides have the same total charge: for Al³⁺ you need three electrons to reach a neutral Al atom.'
    - id: C
      text: 4OH⁻ + 4e⁻ → O₂ + 2H₂O
      correct: false
      misconception_id: mc.chm.o.electrolysis_electrons_wrong_side
      feedback: 'At the cathode, positive ions gain electrons, so electrons are on the left: M²⁺ + 2e⁻ → M. At the anode, negative ions lose electrons, so electrons are on the right: 2Cl⁻ → Cl₂ + 2e⁻.'
    - id: D
      text: 4OH⁻ → 2O + 2H₂O + 4e⁻
      correct: false
      misconception_id: mc.chm.o.electrolysis_single_atoms_formed
      feedback: 'Chlorine, bromine, iodine and oxygen exist as molecules of two atoms: Cl₂, Br₂, I₂, O₂. So two chloride ions are needed to make one chlorine molecule: 2Cl⁻ → Cl₂ + 2e⁻.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Hydroxide ions lose electrons at the anode and give oxygen and water.
  - rung: 2
    name: concept
    text:
      en: Electrons lost at the anode are written on the product side.
  - rung: 3
    name: first_step
    text:
      en: Oxygen forms O₂ molecules; the hydrogen and remaining oxygen end up in water.
  - rung: 4
    name: worked_step
    text:
      en: Total the charge of the hydroxide ions on the left; the electrons on the right must carry the same total.
  - rung: 5
    name: full_step
    text:
      en: '4OH⁻ → O₂ + 2H₂O + 4e⁻: four hydroxide ions lose four electrons, giving one oxygen molecule and two water molecules.'
  misconception_ids:
  - mc.chm.o.electrolysis_electrons_wrong_side
  - mc.chm.o.electrolysis_single_atoms_formed
  - mc.chm.o.electrolysis_half_charge_unbalanced
solution:
  steps:
  - n: 1
    latex: 4\text{OH}^{-} \rightarrow \text{O}_2 + 2\text{H}_2\text{O} + 4e^{-}
    reason: Balanced half-equation at the anode
    check_id: chk_build_chm_electrolysis_0030_bal
