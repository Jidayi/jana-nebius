id: itm.chm.o.reactions.0057
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.reactions.equilibrium
stem: 'A sealed glass tube holds an equilibrium mixture: N₂O₄ (colourless) ⇌ 2NO₂ (brown). The forward reaction is endothermic. The tube is placed in iced water.'
parts:
- id: a
  prompt: What is seen?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: The colour does not change, because the mixture is already at equilibrium.
      correct: false
      misconception_id: mc.chm.o.reactions_equilibrium_static
      feedback: 'Equilibrium is dynamic: the forward and backward reactions both keep going, at the same rate. Change the conditions and one reaction speeds up more than the other, so the amounts change until a new equilibrium is reached.'
    - id: B
      text: The colour fades because both reactions stop in the cold.
      correct: false
      misconception_id: mc.chm.o.reactions_equilibrium_static
      feedback: 'Equilibrium is dynamic: the forward and backward reactions both keep going, at the same rate. Change the conditions and one reaction speeds up more than the other, so the amounts change until a new equilibrium is reached.'
    - id: C
      text: The gas becomes paler, because the position moves to the left.
      correct: true
    - id: D
      text: The gas becomes darker brown, because the position moves to the right.
      correct: false
      misconception_id: mc.chm.o.reactions_shift_reinforces_change
      feedback: The position of equilibrium moves to oppose a change. Heating favours the direction that takes in heat. Higher pressure favours the side with fewer gas molecules. Adding a substance favours the reaction that uses it up.
  hints:
  - rung: 1
    name: orient
    text:
      en: Iced water lowers the temperature. Which colour belongs to which gas?
  - rung: 2
    name: concept
    text:
      en: Cooling favours the exothermic direction.
  - rung: 3
    name: first_step
    text:
      en: The forward reaction (to brown NO₂) is endothermic, so the backward reaction is exothermic.
  - rung: 4
    name: worked_step
    text:
      en: Work out which gas there will be more of, and so whether the brown colour deepens or fades.
  - rung: 5
    name: full_step
    text:
      en: 'The gas becomes paler: cooling favours the exothermic backward reaction, which turns brown NO₂ into colourless N₂O₄.'
  misconception_ids:
  - mc.chm.o.reactions_shift_reinforces_change
  - mc.chm.o.reactions_equilibrium_static
solution:
  steps:
  - n: 1
    latex: \text{N}_2\text{O}_4 \rightleftharpoons 2\text{NO}_2
    reason: Forward reaction endothermic
  - n: 2
    latex: '\text{cooling: moves left, paler}'
    reason: Exothermic direction favoured
