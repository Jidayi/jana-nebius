stem: An atom of barium has proton number 56 and nucleon number 137.
parts:
- id: a
  prompt: How many neutrons does it have?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: '193'
      correct: false
      misconception_id: mc.chm.o.neutrons_added
      feedback: 'Try hydrogen-2: one proton, nucleon number 2, so one neutron. Subtract, do not add.'
    - id: B
      text: '81'
      correct: true
    - id: C
      text: '56'
      correct: false
      misconception_id: mc.chm.o.neutrons_equal_protons
      feedback: Sodium-23 has 11 protons but 12 neutrons. Work the neutrons out each time from the nucleon number.
    - id: D
      text: '137'
      correct: false
      misconception_id: mc.chm.o.neutrons_nucleon_number
      feedback: The nucleon number counts protons and neutrons together. Neutrons = nucleon number − proton number.
  hints:
  - rung: 1
    name: orient
    text:
      en: What does each of the numbers 56 and 137 count?
  - rung: 2
    name: concept
    text:
      en: The proton number counts protons; the nucleon number counts protons and neutrons together.
  - rung: 3
    name: first_step
    text:
      en: So neutrons = nucleon number − proton number.
  - rung: 4
    name: worked_step
    text:
      en: Work out 137 − 56.
  - rung: 5
    name: full_step
    text:
      en: 137 − 56 = 81 neutrons.
  misconception_ids:
  - mc.chm.o.neutrons_nucleon_number
  - mc.chm.o.neutrons_added
  - mc.chm.o.neutrons_equal_protons
