stem: Gold can be hammered into very thin sheets.
parts:
- id: a
  prompt: Which statement explains this?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Pairs of electrons between gold atoms swap partners as it bends.
      correct: false
      misconception_id: mc.chm.o.metallic_as_shared_pairs
      feedback: In a metal the outer electrons are not held in pairs between two atoms; they are delocalised over the whole lattice.
    - id: B
      text: The positive ions move freely through the metal like a liquid.
      correct: false
      misconception_id: mc.chm.o.metal_conducts_by_ions
      feedback: In a solid metal the positive ions stay in their lattice positions; the delocalised electrons move.
    - id: C
      text: The metallic bonds in gold are weak, so the layers fall apart easily.
      correct: false
      misconception_id: mc.chm.o.malleable_because_bonds_weak
      feedback: Iron is malleable yet melts above 1500 °C, so its bonds are strong. Layers of ions slide while the delocalised electrons keep holding them together.
    - id: D
      text: Layers of ions slide over each other while the delocalised electrons keep holding them together.
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Gold can be hammered into very thin sheets. Picture the particles in a metal.
  - rung: 2
    name: concept
    text:
      en: A metal is a lattice of positive ions in a sea of delocalised electrons that are free to move.
  - rung: 3
    name: first_step
    text:
      en: The attraction between the ions and the electrons is strong.
  - rung: 4
    name: worked_step
    text:
      en: Ask which particles can move, and what happens to the layers of ions when a force is applied.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Layers of ions slide over each other while the delocalised electrons keep holding them together.'
  misconception_ids:
