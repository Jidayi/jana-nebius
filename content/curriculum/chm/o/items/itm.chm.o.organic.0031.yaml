stem: A molecule of an alcohol has n = 4 in the general formula CₙH₂ₙ₊₁OH.
parts:
- id: a
  prompt: Calculate the relative molecular mass, Mr, of this compound.
  marks: 2
  answer:
    kind: numeric
    value: '74'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_organic_0031_mr
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Write the molecular formula from CₙH₂ₙ₊₁OH, then add the masses of the atoms.
  - rung: 2
    name: concept
    text:
      en: 'Ar: C = 12, H = 1, O = 16. In C₄H₉OH, count the OH atoms as well as the chain.'
  - rung: 3
    name: first_step
    text:
      en: Hydrogen atoms in the chain = 2 × 4 + 1 = 9, so the formula is C₄H₉OH.
  - rung: 4
    name: worked_step
    text:
      en: The 4 carbon atoms of the chain give 4 × 12 = 48; the chain hydrogens give 9. The –OH group adds 16 + 1.
  - rung: 5
    name: full_step
    text:
      en: Mr of C₄H₉OH = 74.
  misconception_ids:
