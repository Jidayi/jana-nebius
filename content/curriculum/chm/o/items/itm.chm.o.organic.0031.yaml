    reason: Mass of the chain carbon atoms
    check_id: chk_build_chm_organic_0031_c
  - n: 3
    latex: M_r(\text{C}_4\text{H}_9\text{OH}) = 74
    reason: Add every atom's Ar
    check_id: chk_build_chm_organic_0031_mr
