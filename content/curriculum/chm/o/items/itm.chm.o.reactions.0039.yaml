stem: 'The volume of oxygen given off by hydrogen peroxide with a catalyst is read from a gas syringe: 36 cm³ at 20 s and 84 cm³ at 60 s.'
parts:
- id: a
  prompt: Calculate the mean rate of reaction between 20 s and 60 s, in cm³/s.
  marks: 2
  answer:
    kind: numeric
    value: '1.20'
    unit: cm^3/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_reactions_0039_r
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Use the change during the interval, not a single reading.
  - rung: 2
    name: concept
    text:
      en: Mean rate = change in the reading ÷ time taken for that change.
  - rung: 3
    name: first_step
    text:
      en: Gas made = 84 − 36 = 48; time taken = 60 − 20 = 40 s.
  - rung: 4
    name: worked_step
    text:
      en: Now divide 48 by 40.
  - rung: 5
    name: full_step
    text:
      en: 48 ÷ 40 = 1.20 cm³/s.
  misconception_ids:
  - mc.chm.o.reactions_rate_reading_not_change
  - mc.chm.o.reactions_rate_end_time_not_interval
solution:
  steps:
  - n: 1
    latex: \Delta = 84 - 36 = 48
    reason: Change in the reading
    check_id: chk_build_chm_reactions_0039_dv
  - n: 2
    latex: \Delta t = 60 - 20 = 40\ \text{s}
    reason: Time taken
    check_id: chk_build_chm_reactions_0039_dt
  - n: 3
    latex: \text{rate} = \frac{48}{40} = 1.20
    reason: Change ÷ time
    check_id: chk_build_chm_reactions_0039_r
