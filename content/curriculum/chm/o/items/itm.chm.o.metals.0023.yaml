stem: A student explains why an alloy is usually harder than the pure metal.
parts:
- id: a
  prompt: Put the steps of the explanation in order.
  marks: 2
  answer:
    kind: ordering
    scoring: adjacent_pairs
    elements:
    - id: s4
      text: The layers cannot slide over each other easily, so the alloy is harder.
    - id: s1
      text: In a pure metal all the atoms are the same size and lie in regular layers.
    - id: s2
      text: Atoms of a different element, with a different size, are mixed in.
    - id: s3
      text: The regular layers are disrupted.
    correct_order:
    - s1
    - s2
    - s3
    - s4
  hints:
  - rung: 1
    name: orient
    text:
      en: Start with the structure of the pure metal.
  - rung: 2
    name: concept
    text:
      en: Hardness depends on how easily layers of atoms can slide.
  - rung: 3
    name: first_step
    text:
      en: Next comes the change you make to the metal.
  - rung: 4
    name: worked_step
    text:
      en: Then describe what that change does to the layers before the result.
  - rung: 5
    name: full_step
    text:
      en: Pure metal in regular layers; different-sized atoms added; layers disrupted; layers cannot slide, so the alloy is harder.
  misconception_ids:
