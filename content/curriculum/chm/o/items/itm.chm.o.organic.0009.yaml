    text:
      en: C₅H₁₂ contains only carbon and hydrogen, so only two of the series are possible.
  - rung: 2
    name: concept
    text:
      en: Alkanes fit CₙH₂ₙ₊₂ and alkenes fit CₙH₂ₙ.
  - rung: 3
    name: first_step
    text:
      en: C₅H₁₂ has five carbon atoms. Work out twice five, then twice five plus two.
  - rung: 4
    name: worked_step
    text:
      en: 'Twice five is ten, and twice five plus two is twelve: compare these with the twelve hydrogen atoms.'
  - rung: 5
    name: full_step
    text:
      en: 'Twelve hydrogen atoms is twice five plus two, so C₅H₁₂ fits CₙH₂ₙ₊₂: it is an alkane (pentane).'
