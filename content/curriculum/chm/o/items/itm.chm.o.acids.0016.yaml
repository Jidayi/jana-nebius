subject: chm
level: o
kc_ids:
- kc.chm.o.acids.ph_and_indicators
stem: A solution of sodium hydroxide has a pH of 13. A student dilutes it with a large volume of water.
parts:
- id: a
  prompt: What happens to the pH?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: It falls towards 7 but stays above 7
      correct: true
    - id: B
      text: It stays at 13, because no alkali has been removed
      correct: false
      misconception_id: mc.chm.o.acids_dilution_ph_wrong
      feedback: Adding water spreads the same ions through more solution, so the pH moves towards 7. Water itself is neutral, so it can never make an acid alkaline or an alkali acidic.
    - id: C
      text: It rises, because the alkali is now weaker
      correct: false
      misconception_id: mc.chm.o.acids_high_ph_more_acidic
      feedback: 'Picture the pH scale as a line: acids at the low end (below 7), neutral at 7, alkalis at the high end (above 7). The lower the pH, the more acidic the solution.'
    - id: D
      text: It falls below 7, so the solution becomes acidic
      correct: false
      misconception_id: mc.chm.o.acids_dilution_ph_wrong
      feedback: Adding water spreads the same ions through more solution, so the pH moves towards 7. Water itself is neutral, so it can never make an acid alkaline or an alkali acidic.
  hints:
  - rung: 1
    name: orient
    text:
      en: What does adding water do to the number of hydroxide ions in each dm³?
  - rung: 2
    name: concept
    text:
      en: Diluting an alkali lowers the concentration of hydroxide ions, so the solution is less alkaline.
  - rung: 3
    name: first_step
    text:
      en: A less alkaline solution is closer to neutral on the pH scale.
  - rung: 4
    name: worked_step
    text:
      en: The solution started at pH 13. Decide which way it moves and whether pure water could ever make it acidic.
  - rung: 5
    name: full_step
    text:
      en: 'The pH falls towards 7 but stays above 7: the alkali becomes more dilute, and water alone cannot make it acidic.'
  misconception_ids:
  - mc.chm.o.acids_dilution_ph_wrong
  - mc.chm.o.acids_high_ph_more_acidic
solution:
  steps:
  - n: 1
    latex: \text{fewer OH}^{-}\ \text{per dm}^3
    reason: Dilution lowers the concentration of hydroxide ions
  - n: 2
    latex: 7 < \text{pH} < 13
    reason: Less alkaline, but still alkaline
