stem: Aluminium sulfate contains Al³⁺ and SO₄²⁻ ions.
parts:
- id: a
  prompt: Write the formula of aluminium sulfate and use it to calculate its relative formula mass.
  marks: 3
  answer:
    kind: numeric
    value: '342'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0008_mr
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: First you need the formula of aluminium sulfate; then add up the relative atomic masses in it.
  - rung: 2
    name: concept
    text:
      en: The charges on the ions must cancel; the relative formula mass is the sum of the relative atomic masses of every atom in the formula.
  - rung: 3
    name: first_step
    text:
      en: The formula is Al₂(SO₄)₃. Now count the atoms of each element in it.
  - rung: 4
    name: worked_step
    text:
      en: 'In Al₂(SO₄)₃: two Al atoms give 54, three S atoms give 96 and twelve O atoms give 192.'
  - rung: 5
    name: full_step
    text:
      en: Mr of Al₂(SO₄)₃ = 342.
  misconception_ids:
  - mc.chm.o.formula_one_of_each
  - mc.chm.o.formula_own_charge_as_count
solution:
  steps:
  - n: 1
    latex: \text{Al}_2\text{(SO}_4\text{)}_3
    reason: Charges cancel in aluminium sulfate
  - n: 2
    latex: \text{Al}_2 = 54
    reason: Two Al atoms times Ar
    check_id: chk_build_chm_stoichiometry_0008_g_al
  - n: 3
    latex: \text{S}_3 = 96
    reason: Three S atoms times Ar
    check_id: chk_build_chm_stoichiometry_0008_g_s
  - n: 4
    latex: \text{O}_{12} = 192
    reason: Twelve O atoms times Ar
    check_id: chk_build_chm_stoichiometry_0008_g_o
  - n: 5
    latex: M_r = 342
    reason: Add the shares
    check_id: chk_build_chm_stoichiometry_0008_mr
