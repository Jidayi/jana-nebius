stem: Without a catalyst the reactants are at 30 kJ/mol, the peak at 160 kJ/mol and the products at 110 kJ/mol. A catalyst lowers the peak to 130 kJ/mol.
parts:
- id: a
  prompt: What is the activation energy with the catalyst?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 130 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_ea_from_zero
      feedback: The activation energy is measured from the reactants up to the peak, not from zero.
    - id: B
      text: 100 kJ/mol
      correct: true
    - id: C
      text: 20 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_ea_from_products
      feedback: The activation energy is measured from the reactants, not from the products, up to the lowered peak.
    - id: D
      text: 50 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_ea_from_products
      feedback: The activation energy is measured from the reactants, not from the products, up to the lowered peak.
  hints:
  - rung: 1
    name: orient
    text:
      en: The activation energy is the energy needed to start the reaction.
  - rung: 2
    name: concept
    text:
      en: It is measured from the reactants up to the peak. With a catalyst, use the lowered peak.
  - rung: 3
    name: first_step
    text:
      en: The lowered peak is at 130 kJ/mol and the reactants are at 30 kJ/mol.
  - rung: 4
    name: worked_step
    text:
      en: Subtract the reactants' level from the lowered peak.
  - rung: 5
    name: full_step
    text:
      en: Ea = 130 − 30 = 100 kJ/mol.
  misconception_ids:
  - mc.chm.o.energetics_catalyst_changes_dh
