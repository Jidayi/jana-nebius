stem: Red litmus paper is dipped into a solution of calcium hydroxide (limewater).
parts:
- id: a
  prompt: What happens to the litmus paper?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: It stays red, because the solution is alkaline
      correct: false
      misconception_id: mc.chm.o.acids_indicator_colours_swapped
      feedback: 'Learn each pair: litmus is red in acid and blue in alkali; methyl orange is red in acid and yellow in alkali; phenolphthalein is colourless in acid and pink in alkali.'
    - id: B
      text: It turns blue, because the solution is alkaline
      correct: true
    - id: C
      text: It stays red, because the solution is neutral
      correct: false
    - id: D
      text: It turns colourless, because the solution is alkaline
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Is calcium hydroxide solution acidic, neutral or alkaline?
  - rung: 2
    name: concept
    text:
      en: Calcium hydroxide is a soluble base, so its solution is an alkali.
  - rung: 3
    name: first_step
    text:
      en: Litmus is red in acid and blue in alkali.
  - rung: 4
    name: worked_step
    text:
      en: Red litmus can only change colour if the solution is not acidic or neutral.
  - rung: 5
    name: full_step
    text:
      en: Limewater is alkaline, so red litmus turns blue.
  misconception_ids:
