id: itm.chm.o.organic.0034
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.general_formulae
stem: A compound is an alkane with general formula CₙH₂ₙ₊₂. Its relative molecular mass is 86.
parts:
- id: a
  prompt: How many carbon atoms, n, does one molecule contain?
  marks: 2
  answer:
    kind: numeric
    value: '6'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_organic_0034_n
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Write the Mr of CₙH₂ₙ₊₂ in terms of n, then set it equal to 86.
  - rung: 2
    name: concept
    text:
      en: CₙH₂ₙ₊₂ is n CH₂ units plus two extra hydrogen atoms.
  - rung: 3
    name: first_step
    text:
      en: Mr = 14n + 2 for this series.
  - rung: 4
    name: worked_step
    text:
      en: Set 14n + 2 = 86. Subtract 2, then divide by 14.
  - rung: 5
    name: full_step
    text:
      en: 'n = (86 − 2) ÷ 14 = 6: the molecule is C₆H₁₄.'
  misconception_ids:
  - mc.chm.o.organic_gf_wrong_series
  - mc.chm.o.organic_gf_hydrogen_mass_ignored
solution:
  steps:
  - n: 1
    latex: \text{CH}_2 = 14
    reason: One CH₂ unit
    check_id: chk_build_chm_organic_0034_ch2
  - n: 2
    latex: 2 \times 1 = 2
    reason: Atoms outside the CH₂ units
    check_id: chk_build_chm_organic_0034_rest
  - n: 3
    latex: n = \frac{86 - 2}{14} = 6
    reason: Solve for n
    check_id: chk_build_chm_organic_0034_n
