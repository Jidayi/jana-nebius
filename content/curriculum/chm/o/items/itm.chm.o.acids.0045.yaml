stem: A small amount of calcium oxide is shaken with water and universal indicator is added.
parts:
- id: a
  prompt: What is the pH of the solution?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Above 7
      correct: true
    - id: B
      text: It has no pH
      correct: false
    - id: C
      text: Exactly 7
      correct: false
    - id: D
      text: Below 7
      correct: false
      misconception_id: mc.chm.o.acids_oxide_type_swapped
      feedback: 'Metal oxides such as CaO and CuO are bases: they react with acids. Non-metal oxides such as CO₂ and SO₂ are acidic: they react with alkalis and give acidic solutions in water.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Calcium oxide is a basic oxide. What does it form with water?
  - rung: 2
    name: concept
    text:
      en: Some basic oxides react with water to make an alkali.
  - rung: 3
    name: first_step
    text:
      en: CaO + H₂O → Ca(OH)₂.
  - rung: 4
    name: worked_step
    text:
      en: Calcium hydroxide solution is limewater. Is it acidic or alkaline?
  - rung: 5
    name: full_step
    text:
      en: Calcium oxide reacts with water to give calcium hydroxide, an alkali, so the pH is above 7.
  misconception_ids:
  - mc.chm.o.acids_oxide_type_swapped
