stem: A sealed sample contains only identical molecules. Each molecule has one carbon atom joined to two oxygen atoms.
parts:
- id: a
  prompt: How should the sample be classified?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: An element, because all its molecules are identical.
      correct: false
    - id: B
      text: A compound, because different elements are chemically joined in a fixed ratio.
      correct: true
    - id: C
      text: A mixture, because it contains two elements.
      correct: false
    - id: D
      text: A mixture, because the molecules can move.
      correct: false
  show_working: false
  hints:
  - rung: 1
