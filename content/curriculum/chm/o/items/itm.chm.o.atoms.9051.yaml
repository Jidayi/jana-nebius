    text:
      en: A mixture contains substances that are not chemically joined to one another.
  - rung: 3
    name: first_step
    text:
      en: Decide whether the different atoms are bonded within each particle or merely mixed as separate substances.
  - rung: 4
    name: worked_step
    text:
      en: Identical particles can contain different kinds of bonded atom; that does not make the sample an element.
  - rung: 5
    name: full_step
    text:
      en: The answer is A compound, because different elements are chemically joined in a fixed ratio..
solution:
