  - rung: 4
    name: worked_step
    text:
      en: 'In CuSO₄·5H₂O: one Cu atom gives 64, one S atom gives 32, nine O atoms give 144 and ten H atoms give 10.'
  - rung: 5
    name: full_step
    text:
      en: Mr of CuSO₄·5H₂O = 250.
