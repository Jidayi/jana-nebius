    text:
      en: Mr is the sum of the relative atomic masses of all the atoms in CuSO₄·5H₂O.
  - rung: 2
    name: concept
    text:
      en: Multiply each element's relative atomic mass by the number of its atoms, then add.
  - rung: 3
    name: first_step
    text:
