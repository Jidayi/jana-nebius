  - rung: 3
    name: first_step
    text:
      en: An acidic gas turns damp blue litmus red.
  - rung: 4
    name: worked_step
    text:
      en: A bleach then removes the colour from the litmus.
  - rung: 5
    name: full_step
    text:
      en: 'The anode gas is chlorine: damp blue litmus turns red and is then bleached white.'
