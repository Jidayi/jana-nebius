  prompt: What is seen, and what is the gas?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Nothing happens; chlorine
      correct: false
    - id: B
      text: The paper turns red; hydrogen
      correct: false
    - id: C
      text: The paper turns red then white; chlorine
      correct: true
    - id: D
      text: A glowing splint relights; oxygen
      correct: false
      misconception_id: mc.chm.o.electrolysis_halide_concentration_ignored
      feedback: At the anode, a concentrated chloride, bromide or iodide solution gives the halogen. A dilute halide solution, or a solution with no halide (a sulfate or nitrate), gives oxygen from the water.
