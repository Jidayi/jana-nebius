id: itm.chm.o.electrolysis.0025
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.electrolysis.half_equations
stem: Molten lead(II) bromide is electrolysed.
parts:
- id: a
  prompt: Which half-equation shows the change at the cathode?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Pb²⁺ + e⁻ → Pb
      correct: false
      misconception_id: mc.chm.o.electrolysis_half_charge_unbalanced
      feedback: 'After balancing the atoms, add up the charges on each side. Add electrons until both sides have the same total charge: for Al³⁺ you need three electrons to reach a neutral Al atom.'
    - id: B
      text: Pb²⁺ + 2e⁻ → Pb
      correct: true
    - id: C
      text: Pb²⁺ → Pb + 2e⁻
      correct: false
      misconception_id: mc.chm.o.electrolysis_electrons_wrong_side
      feedback: 'At the cathode, positive ions gain electrons, so electrons are on the left: M²⁺ + 2e⁻ → M. At the anode, negative ions lose electrons, so electrons are on the right: 2Cl⁻ → Cl₂ + 2e⁻.'
    - id: D
      text: Pb + 2e⁻ → Pb²⁺
      correct: false
      misconception_id: mc.chm.o.electrolysis_electrons_wrong_side
      feedback: 'At the cathode, positive ions gain electrons, so electrons are on the left: M²⁺ + 2e⁻ → M. At the anode, negative ions lose electrons, so electrons are on the right: 2Cl⁻ → Cl₂ + 2e⁻.'
  hints:
  - rung: 1
    name: orient
    text:
      en: At the cathode, positive lead ions are turned into lead atoms.
  - rung: 2
    name: concept
    text:
      en: Positive ions gain electrons at the cathode, so the electrons appear with the reactants.
  - rung: 3
    name: first_step
    text:
      en: A lead ion carries a charge of two plus; a lead atom is neutral.
  - rung: 4
    name: worked_step
    text:
      en: Count how many electrons cancel the charge on one lead ion, and put them on the left.
  - rung: 5
    name: full_step
    text:
      en: 'Pb²⁺ + 2e⁻ → Pb: each lead ion gains two electrons, so both sides have zero charge.'
  misconception_ids:
  - mc.chm.o.electrolysis_electrons_wrong_side
  - mc.chm.o.electrolysis_half_charge_unbalanced
solution:
  steps:
  - n: 1
    latex: \text{Pb}^{2+} + 2e^{-} \rightarrow \text{Pb}
    reason: Balanced half-equation at the cathode
    check_id: chk_build_chm_electrolysis_0025_bal
