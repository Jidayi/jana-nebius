stem: Silicon(IV) oxide, SiO₂, melts at about 1700 °C, but carbon dioxide is a gas at room temperature.
parts:
- id: a
  prompt: Which statement explains the difference?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: SiO₂ molecules are heavier than CO₂ molecules, so they need more energy.
      correct: false
      misconception_id: mc.chm.o.giant_covalent_as_molecules
      feedback: CO₂ is made of small molecules, but SiO₂ is one huge network of Si–O bonds. Melting it means breaking many strong covalent bonds.
    - id: B
      text: SiO₂ is a giant network of strong covalent bonds; CO₂ is small molecules with weak forces between them.
      correct: true
    - id: C
      text: The covalent bonds in CO₂ are weak and break when it melts.
      correct: false
      misconception_id: mc.chm.o.melting_breaks_covalent_bonds
      feedback: 'Melting a simple molecular substance only separates whole molecules: the weak forces between molecules are overcome, while the strong covalent bonds inside each molecule stay.'
    - id: D
      text: SiO₂ contains ions but CO₂ does not.
      correct: false
      misconception_id: mc.chm.o.structure_type_misidentified
      feedback: Ions need a metal and a non-metal. Non-metals alone give molecules or a covalent network. Metals alone give metallic bonding.
  hints:
  - rung: 1
    name: orient
    text:
      en: Silicon(IV) oxide, SiO₂, melts at about 1700 °C, but carbon dioxide is a gas at room temperature. Picture how the atoms are arranged.
  - rung: 2
    name: concept
    text:
      en: Giant covalent structures are networks of atoms joined by strong covalent bonds, with no separate molecules.
  - rung: 3
    name: first_step
    text:
      en: Decide which bonds or forces are involved in the property asked about.
  - rung: 4
    name: worked_step
    text:
      en: 'Remember the special features: graphite has layers and spare (delocalised) electrons; diamond and SiO₂ have rigid networks in three dimensions.'
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: SiO₂ is a giant network of strong covalent bonds; CO₂ is small molecules with weak forces between them.'
  misconception_ids:
  - mc.chm.o.giant_covalent_as_molecules
  - mc.chm.o.structure_type_misidentified
  - mc.chm.o.melting_breaks_covalent_bonds
