id: itm.chm.o.atoms.0029
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.atoms.electron_arrangement
stem: An atom of chlorine has proton number 17 and nucleon number 35.
parts:
- id: a
  prompt: Which is the electron arrangement of a chlorine atom?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 2,8,7
      correct: true
    - id: B
      text: 8,8,1
      correct: false
      misconception_id: mc.chm.o.first_shell_holds_eight
      feedback: 'The first shell is small: it holds at most two electrons. Then 8, then 8 for the first twenty elements.'
    - id: C
      text: 2,8,8,8,8,1
      correct: false
      misconception_id: mc.chm.o.arrangement_from_nucleon_number
      feedback: A neutral atom has as many electrons as protons. Use the proton number, the smaller of the two numbers.
    - id: D
      text: 7,8,2
      correct: false
      misconception_id: mc.chm.o.shells_filled_outside_in
      feedback: 'Electrons fill the shell nearest the nucleus first. Write the arrangement from the inside out: 2 first.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Which of the two numbers, 17 or 35, tells you how many electrons the atom has?
  - rung: 2
    name: concept
    text:
      en: A neutral atom has as many electrons as protons. Shells fill from the nucleus outwards and hold 2, then 8, then 8.
  - rung: 3
    name: first_step
    text:
      en: 'Place 17 electrons: the first shell takes 2.'
  - rung: 4
    name: worked_step
    text:
      en: Fill the second shell with up to 8 before you start the next shell.
  - rung: 5
    name: full_step
    text:
      en: The arrangement is 2,8,7, with 7 in the outer shell.
  misconception_ids:
  - mc.chm.o.first_shell_holds_eight
  - mc.chm.o.shells_filled_outside_in
  - mc.chm.o.arrangement_from_nucleon_number
solution:
  steps:
  - n: 1
    latex: 17 = 2 + 8 + 7
    reason: Fill each shell in turn
    check_id: chk_build_chm_atoms_0029_outer
  - n: 2
    latex: '\text{outer shell}: 7'
    reason: What is left after the inner shells
    check_id: chk_build_chm_atoms_0029_outer
