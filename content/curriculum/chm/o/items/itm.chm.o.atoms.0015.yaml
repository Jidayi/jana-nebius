stem: A magnesium ion has a positive charge of 2 and the proton number of magnesium is 12.
parts:
- id: a
  prompt: How many electrons does the ion have?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: '12'
      correct: false
      misconception_id: mc.chm.o.ion_electrons_unchanged
      feedback: An ion is charged because its electrons no longer match its protons. A 2+ ion has two fewer electrons than protons; a 2− ion has two more.
    - id: B
      text: '10'
      correct: true
    - id: C
      text: '14'
      correct: false
      misconception_id: mc.chm.o.ion_charge_sign_reversed
      feedback: Electrons are negative. Losing electrons leaves an ion positive; gaining electrons makes it negative.
    - id: D
      text: '2'
      correct: false
      misconception_id: mc.chm.o.ion_electrons_equal_charge
      feedback: The charge tells you how many electrons were lost or gained, not how many the ion has. Start from the proton number.
  hints:
  - rung: 1
    name: orient
    text:
      en: A neutral magnesium atom has as many electrons as protons. What does the charge tell you?
  - rung: 2
    name: concept
    text:
      en: 'Electrons are negative: an atom that loses electrons becomes positive; one that gains electrons becomes negative.'
  - rung: 3
    name: first_step
    text:
      en: The atom has 12 electrons before it forms the ion.
  - rung: 4
    name: worked_step
    text:
      en: A positive charge of 2 means losing two electrons.
  - rung: 5
    name: full_step
    text:
      en: 12 − 2 = 10 electrons.
  misconception_ids:
