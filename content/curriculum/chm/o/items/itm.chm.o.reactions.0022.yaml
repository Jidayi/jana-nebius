id: itm.chm.o.reactions.0022
version: 0.1.0
type: mcq
subject: chm
level: o
kc_ids:
- kc.chm.o.reactions.rate_factors
stem: A student adds a catalyst to a reaction that produces a gas.
parts:
- id: a
  prompt: Which statement about the catalyst is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: It is used up, so more must be added as the reaction goes on.
      correct: false
      misconception_id: mc.chm.o.reactions_catalyst_used_up
      feedback: 'A catalyst speeds up a reaction but is not used up. Weigh it before and after: the mass is the same, and it can be used again. That is why a small amount of catalyst works for a long time.'
    - id: B
      text: It makes the gas form faster but does not change the total volume of gas.
      correct: true
    - id: C
      text: It slows the reaction down so that it is safer.
      correct: false
    - id: D
      text: It makes more gas form in total.
      correct: false
      misconception_id: mc.chm.o.reactions_rate_changes_amount
      feedback: The rate is how fast product forms; the total amount depends on how much of the limiting reactant there is. With the same amount of that reactant, a faster reaction reaches the same final amount, only sooner.
  hints:
  - rung: 1
    name: orient
    text:
      en: What does a catalyst do to the rate, and what does it leave unchanged?
  - rung: 2
    name: concept
    text:
      en: A catalyst speeds up a reaction and is not used up.
  - rung: 3
    name: first_step
    text:
      en: The total amount of gas depends on the amounts of the reactants.
  - rung: 4
    name: worked_step
    text:
      en: Adding a catalyst does not add any more reactant.
  - rung: 5
    name: full_step
    text:
      en: The catalyst makes the gas form faster; the total volume stays the same and the catalyst is not used up.
  misconception_ids:
  - mc.chm.o.reactions_rate_changes_amount
  - mc.chm.o.reactions_catalyst_used_up
solution:
  steps:
  - n: 1
    latex: '\text{catalyst: faster, same total}'
    reason: Rate, not amount
