id: itm.chm.o.environment.0013
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.environment.fertilisers
stem: A farmer compares fertilisers. One of them is ammonium nitrate, NH₄NO₃.
parts:
- id: a
  prompt: What is the percentage by mass of nitrogen in ammonium nitrate?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: '0.350'
      correct: false
      misconception_id: mc.chm.o.environment_percent_not_times_100
      feedback: 'A fraction becomes a percentage when you multiply by 100: a fraction of 0.35 is 35%.'
    - id: B
      text: 286%
      correct: false
      misconception_id: mc.chm.o.environment_n_percent_inverted
      feedback: 'The nitrogen is part of the whole compound, so its percentage must be below 100. Put the nitrogen mass on top: % N = mass of N ÷ Mr × 100.'
    - id: C
      text: 17.5%
      correct: false
      misconception_id: mc.chm.o.environment_n_atoms_count_ignored
      feedback: Count every nitrogen atom in the formula, including those in brackets and in both ions. NH₄NO₃ has two nitrogen atoms, so the nitrogen mass is 2 × 14 = 28.
    - id: D
      text: 35.0%
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You need the share of the mass of NH₄NO₃ that is nitrogen.
  - rung: 2
    name: concept
    text:
      en: '% nitrogen in ammonium nitrate = (number of N atoms × 14) ÷ Mr × 100.'
  - rung: 3
    name: first_step
    text:
      en: 'Mr of NH₄NO₃ is 80. Count the nitrogen atoms: one in the ammonium ion and one in the nitrate ion.'
  - rung: 4
    name: worked_step
    text:
      en: The two nitrogen atoms have a mass of 28; divide this by 80, then multiply by 100.
  - rung: 5
    name: full_step
    text:
      en: 28 ÷ 80 × 100 = 35.0% nitrogen in ammonium nitrate.
  misconception_ids:
  - mc.chm.o.environment_n_atoms_count_ignored
  - mc.chm.o.environment_n_percent_inverted
  - mc.chm.o.environment_percent_not_times_100
solution:
  steps:
  - n: 1
    latex: M_r(\text{NH}_4\text{NO}_3) = 80
    reason: Relative formula mass of ammonium nitrate
    check_id: chk_build_chm_environment_0013_mr
  - n: 2
    latex: 2 \times 14 = 28
    reason: Mass of the nitrogen atoms
    check_id: chk_build_chm_environment_0013_n
  - n: 3
    latex: \% N = \frac{28}{80} \times 100 = 35.0\%
    reason: Part over whole, times 100
    check_id: chk_build_chm_environment_0013_pct
