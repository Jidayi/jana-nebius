id: itm.chm.o.stoichiometry.0014
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.balancing_equations
stem: The unbalanced equation is Fe + O₂ → Fe₂O₃.
parts:
- id: a
  prompt: Balance the equation using the smallest whole numbers. What number goes in front of O₂?
  marks: 2
  answer:
    kind: numeric
    value: '3'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0014_ratios
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Count the atoms of each element on each side of Fe + O₂ → Fe₂O₃.
  - rung: 2
    name: concept
    text:
      en: Only the numbers in front of formulae may change; the formulae themselves stay as they are.
  - rung: 3
    name: first_step
    text:
      en: Start with an element that appears in only one substance on each side, and leave elements that appear on their own until last.
  - rung: 4
    name: worked_step
    text:
      en: Adjust one number at a time and recount every element after each change; you should find 4Fe, 2Fe₂O₃.
  - rung: 5
    name: full_step
    text:
      en: 'Balanced: 4Fe + 3O₂ → 2Fe₂O₃. The number in front of O₂ is 3.'
  misconception_ids:
  - mc.chm.o.subscript_changed_to_balance
  - mc.chm.o.balance_one_element_only
solution:
  steps:
  - n: 1
    latex: 4\text{Fe} + 3\text{O}_2 \rightarrow 2\text{Fe}_2\text{O}_3
    reason: Smallest whole numbers that balance every element
    check_id: chk_build_chm_stoichiometry_0014_bal
  - n: 2
    latex: '\text{O}_2: 3'
    reason: Coefficient of O₂
    check_id: chk_build_chm_stoichiometry_0014_ratios
