    text:
      en: In the sulfate ion (SO₄²⁻) the oxidation numbers of all the atoms add up to the overall charge, -2.
  - rung: 2
    name: concept
    text:
      en: 'Every oxygen atom in the sulfate ion (SO₄²⁻) counts: multiply its oxidation number by the number of atoms.'
  - rung: 3
    name: first_step
    text:
      en: 'Let the oxidation number of sulfur be x and write the sum: x + 4(-2) = -2.'
  - rung: 4
