id: itm.chm.o.analysis.0026
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.analysis.chromatography
stem: On a chromatogram the start line is 2.0 cm above the bottom of the paper. A spot has moved 6.3 cm from the start line and the solvent front is 9.0 cm from the start line.
parts:
- id: a
  prompt: What is the Rf value of the spot?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: '0.30'
      correct: false
      misconception_id: mc.chm.o.analysis_rf_gap
      feedback: Measure how far the spot moved from the start line, not how far it is from the solvent front.
    - id: B
      text: '0.75'
      correct: false
      misconception_id: mc.chm.o.analysis_rf_from_paper_edge
      feedback: Both distances start at the pencil line where the sample was put.
    - id: C
      text: '0.70'
      correct: true
    - id: D
      text: '1.4'
      correct: false
      misconception_id: mc.chm.o.analysis_rf_inverted
      feedback: 'The spot never travels further than the solvent, so Rf is always less than 1: spot distance ÷ solvent distance.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Rf compares how far the spot moved with how far the solvent moved.
  - rung: 2
    name: concept
    text:
      en: Rf = distance moved by the spot ÷ distance moved by the solvent, both from the start line.
  - rung: 3
    name: first_step
    text:
      en: The spot moved 6.3 cm and the solvent 9.0 cm.
  - rung: 4
    name: worked_step
    text:
      en: Work out 6.3 ÷ 9.0.
  - rung: 5
    name: full_step
    text:
      en: Rf = 6.3 ÷ 9.0 = 0.70.
  misconception_ids:
  - mc.chm.o.analysis_rf_inverted
  - mc.chm.o.analysis_rf_from_paper_edge
  - mc.chm.o.analysis_rf_gap
solution:
  steps:
  - n: 1
    latex: R_f = \frac{6.3}{9.0} = 0.70
    reason: Spot over solvent
    check_id: chk_build_chm_analysis_0026_r
