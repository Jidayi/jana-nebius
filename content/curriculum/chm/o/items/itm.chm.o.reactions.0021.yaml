stem: Two gases react in a sealed container at a fixed temperature.
parts:
- id: a
  prompt: What happens to the rate if the gas mixture is compressed into a smaller volume?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: It increases.
      correct: true
    - id: B
      text: It decreases.
