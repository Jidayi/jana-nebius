  hints:
  - rung: 1
    name: orient
    text:
      en: Compressing a gas raises its pressure.
  - rung: 2
    name: concept
    text:
      en: For gases, a higher pressure has the same effect as a higher concentration.
  - rung: 3
    name: first_step
    text:
      en: The same number of gas particles is now packed into a smaller space.
  - rung: 4
    name: worked_step
    text:
      en: Think about how this affects how often the particles meet.
  - rung: 5
    name: full_step
    text:
      en: The rate increases, because raising the pressure crowds the gas particles together.
