id: itm.chm.o.reactions.0026
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.reactions.collision_theory
stem: Magnesium reacts faster with more concentrated hydrochloric acid at the same temperature.
parts:
- id: a
  prompt: Why is the reaction faster?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: There are more acid particles in each cm³, so they collide with the magnesium more often.
      correct: true
    - id: B
      text: The concentrated acid lowers the activation energy, like a catalyst.
      correct: false
      misconception_id: mc.chm.o.reactions_catalyst_gives_energy
      feedback: 'Heating gives particles more energy, so more collisions reach the activation energy. A catalyst does not add energy: it gives a different route with a lower activation energy, so more collisions succeed at the same temperature.'
    - id: C
      text: Each acid particle hits the magnesium with more energy.
      correct: false
      misconception_id: mc.chm.o.reactions_concentration_harder_collisions
      feedback: Concentration, pressure and surface area change how often particles collide, not how hard. Only temperature changes the energy of the particles.
    - id: D
      text: Every collision now leads to a reaction.
      correct: false
      misconception_id: mc.chm.o.reactions_all_collisions_react
      feedback: Particles in a gas collide billions of times a second, yet many mixtures hardly react. Only collisions with at least the activation energy lead to a reaction; the rest bounce apart unchanged.
  hints:
  - rung: 1
    name: orient
    text:
      en: What does 'more concentrated' mean in terms of particles?
  - rung: 2
    name: concept
    text:
      en: Concentration is how many particles of a substance are in a given volume.
  - rung: 3
    name: first_step
    text:
      en: The temperature is the same, so the particles have the same energy as before.
  - rung: 4
    name: worked_step
    text:
      en: With more particles in the same space, think about how often they reach the magnesium surface.
  - rung: 5
    name: full_step
    text:
      en: The concentrated acid has more acid particles in each cm³, so collisions with the magnesium are more frequent. Their energy is unchanged.
  misconception_ids:
  - mc.chm.o.reactions_concentration_harder_collisions
  - mc.chm.o.reactions_all_collisions_react
  - mc.chm.o.reactions_catalyst_gives_energy
