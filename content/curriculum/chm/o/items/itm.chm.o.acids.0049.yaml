id: itm.chm.o.acids.0049
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.salt_preparation
stem: A student wants crystals of copper(II) sulfate, starting from copper(II) oxide (an insoluble black powder) and dilute sulfuric acid.
parts:
- id: a
  prompt: Which method should the student use?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Titrate the copper(II) oxide against the acid using an indicator, then crystallise
      correct: false
      misconception_id: mc.chm.o.acids_method_mismatch_base
      feedback: Ask whether the starting base, metal or carbonate dissolves in water. If it is insoluble, add an excess and filter off what is left. If it is soluble (sodium, potassium or ammonium), an excess cannot be filtered off, so use a titration to find the exact amounts.
    - id: B
      text: Mix the oxide with the acid and filter off the copper(II) sulfate precipitate
      correct: false
      misconception_id: mc.chm.o.acids_precipitation_confused
      feedback: 'An insoluble salt comes out of solution as a precipitate as soon as two solutions are mixed: filter it off and wash it. A soluble salt stays dissolved: you get it by evaporating and crystallising the solution.'
    - id: C
      text: Add copper(II) oxide to warm acid until some is left over, filter, then crystallise the filtrate
      correct: true
    - id: D
      text: Add excess copper(II) oxide, filter, and keep the solid left on the filter paper
      correct: false
      misconception_id: mc.chm.o.acids_filtrate_residue_confused
      feedback: Draw the filter funnel. The solid that stays on the paper is the residue; the liquid that passes through is the filtrate. A soluble salt is in the filtrate; an insoluble salt is the residue.
  hints:
  - rung: 1
    name: orient
    text:
      en: Does copper(II) oxide dissolve in water? Does copper(II) sulfate?
  - rung: 2
    name: concept
    text:
      en: An insoluble base can be added in excess, and the leftover solid removed by filtering.
  - rung: 3
    name: first_step
    text:
      en: Copper(II) sulfate is soluble, so it ends up dissolved in the liquid.
  - rung: 4
    name: worked_step
    text:
      en: 'After filtering, decide which part holds the copper(II) sulfate: the solid on the paper or the liquid that passes through.'
  - rung: 5
    name: full_step
    text:
      en: Excess copper(II) oxide uses up all the acid; filtering removes the leftover oxide; the filtrate holds copper(II) sulfate, which crystallises on concentrating and cooling.
  misconception_ids:
  - mc.chm.o.acids_method_mismatch_base
  - mc.chm.o.acids_filtrate_residue_confused
  - mc.chm.o.acids_precipitation_confused
solution:
  steps:
  - n: 1
    latex: \text{CuO} + \text{H}_2\text{SO}_4 \rightarrow \text{CuSO}_4 + \text{H}_2\text{O}
    reason: Insoluble base + acid
    check_id: chk_build_chm_acids_0049_bal
  - n: 2
    latex: \text{filtrate} \rightarrow \text{crystals}
    reason: Soluble salt
