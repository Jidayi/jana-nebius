id: itm.chm.o.analysis.0037
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.analysis.separation
stem: A student wants to get the salt back out of salt water.
parts:
- id: a
  prompt: Which method works?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Pour it through a separating funnel
      correct: false
      misconception_id: mc.chm.o.analysis_method_for_wrong_mixture
      feedback: A separating funnel separates two liquids that do not mix. Salt is dissolved in the water, so the two never form separate layers.
    - id: B
      text: Evaporate some water and leave the solution to crystallise
      correct: true
    - id: C
      text: Filter the salt water
      correct: false
      misconception_id: mc.chm.o.analysis_filter_dissolved
      feedback: Dissolved particles are as small as water particles and pass through filter paper. Filtration only removes undissolved solids.
    - id: D
      text: Use fractional distillation and keep the first liquid
      correct: false
      misconception_id: mc.chm.o.analysis_method_for_wrong_mixture
      feedback: Distillation collects the water and leaves the salt behind in the flask. To get the salt, evaporate some water and let crystals form.
  hints:
  - rung: 1
    name: orient
    text:
      en: A student wants to get the salt back out of salt water. Which parts are dissolved, which are solids, and which are liquids?
  - rung: 2
    name: concept
    text:
      en: Filtration removes undissolved solids; crystallisation and evaporation recover a dissolved solid; distillation recovers a liquid; fractional distillation separates liquids that mix.
  - rung: 3
    name: first_step
    text:
      en: Decide which part you want to keep.
  - rung: 4
    name: worked_step
    text:
      en: Pick the method that keeps that part and removes the rest.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Evaporate some water and leave the solution to crystallise.'
  misconception_ids:
  - mc.chm.o.analysis_filter_dissolved
  - mc.chm.o.analysis_method_for_wrong_mixture
solution:
  steps:
  - n: 1
    latex: \text{method from properties}
    reason: Reason
