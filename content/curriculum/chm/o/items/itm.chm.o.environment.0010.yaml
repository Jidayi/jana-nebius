stem: Tap water has been through sedimentation, filtration, carbon and chlorination.
parts:
- id: a
  prompt: Why is tap water still not pure water?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: It still contains dissolved substances such as salts and chlorine
      correct: true
    - id: B
      text: It still contains mud that the filters missed
      correct: false
    - id: C
      text: It contains no water molecules after treatment
      correct: false
    - id: D
      text: It still contains living microbes
      correct: false
      misconception_id: mc.chm.o.environment_treatment_stages_mixed
      feedback: Each stage has one job. Sedimentation lets large particles settle. Filtration removes small insoluble particles. Carbon removes tastes and smells. Chlorine kills microbes. None of these removes dissolved salts, so tap water is not pure.
  hints:
  - rung: 1
    name: orient
    text:
      en: Pure water contains only water molecules.
  - rung: 2
    name: concept
    text:
      en: Treatment removes insoluble solids and microbes, but not most dissolved substances.
  - rung: 3
    name: first_step
    text:
      en: Rain and river water dissolve salts from rocks, and chlorine is added on purpose.
  - rung: 4
    name: worked_step
    text:
      en: Which kind of substance passes through every stage of treatment?
  - rung: 5
    name: full_step
    text:
      en: Tap water still holds dissolved salts and a little chlorine, so it is not pure.
  misconception_ids:
  - mc.chm.o.environment_treatment_stages_mixed
solution:
  steps:
  - n: 1
    latex: \text{dissolved substances remain}
    reason: Treated is not pure
