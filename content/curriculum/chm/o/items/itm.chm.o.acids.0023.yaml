stem: Solutions of sodium hydroxide, potassium hydroxide and calcium hydroxide are all alkaline.
parts:
- id: a
  prompt: Which ion makes these solutions alkaline?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: O²⁻
      correct: false
    - id: B
      text: Na⁺
      correct: false
    - id: C
      text: H⁺
      correct: false
      misconception_id: mc.chm.o.acids_high_ph_more_acidic
      feedback: 'Picture the pH scale as a line: acids at the low end (below 7), neutral at 7, alkalis at the high end (above 7). The lower the pH, the more acidic the solution.'
    - id: D
      text: OH⁻
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: What do all three substances have in common in their formulae?
  - rung: 2
    name: concept
    text:
      en: Alkalis are soluble bases. In water they release the same negative ion.
  - rung: 3
    name: first_step
    text:
      en: Acids give H⁺ ions in water; alkalis give a different ion.
  - rung: 4
    name: worked_step
    text:
      en: Look at the part of NaOH, KOH and Ca(OH)₂ that is the same.
  - rung: 5
    name: full_step
    text:
      en: All three release hydroxide ions, OH⁻, in water; these make the solutions alkaline.
