stem: An iron gate rusts slowly in damp air.
parts:
- id: a
  prompt: What happens to the iron when it rusts?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: It is decomposed.
      correct: false
    - id: B
      text: It is oxidised.
      correct: true
    - id: C
      text: It is reduced.
      correct: false
      misconception_id: mc.chm.o.reactions_oxidation_is_gaining_electrons
      feedback: Oxidation is loss of electrons; reduction is gain of electrons. A metal atom that becomes a positive ion has lost electrons, so it has been oxidised.
    - id: D
      text: It is neutralised.
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Rust is hydrated iron(III) oxide.
  - rung: 2
    name: concept
    text:
      en: Gaining oxygen is oxidation.
  - rung: 3
    name: first_step
    text:
      en: Iron atoms become iron(III) ions in rust.
  - rung: 4
    name: worked_step
    text:
      en: An atom that becomes a positive ion has lost electrons.
  - rung: 5
    name: full_step
    text:
      en: 'Iron is oxidised when it rusts: it gains oxygen and its atoms lose electrons.'
  misconception_ids:
  - mc.chm.o.reactions_oxidation_is_gaining_electrons
solution:
  steps:
  - n: 1
    latex: \text{Fe} \rightarrow \text{Fe}^{3+} + 3e^-
    reason: Iron loses electrons
