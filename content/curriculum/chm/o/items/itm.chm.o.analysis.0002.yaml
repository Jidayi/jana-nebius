id: itm.chm.o.analysis.0002
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.analysis.apparatus
stem: Acid is added a little at a time to an alkali until the indicator changes colour.
parts:
- id: a
  prompt: Which apparatus measures the volume of acid added accurately?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: a top-pan balance
      correct: false
      misconception_id: mc.chm.o.analysis_mass_volume_confused
      feedback: A balance measures mass in grams; cylinders, pipettes, burettes and gas syringes measure volume in cm³.
    - id: B
      text: a conical flask
      correct: false
      misconception_id: mc.chm.o.analysis_beaker_as_measure
      feedback: Beaker and flask markings are only rough guides. Use a measuring cylinder for rough volumes, and a pipette or burette for accurate ones.
    - id: C
      text: a measuring cylinder
      correct: false
      misconception_id: mc.chm.o.analysis_cylinder_for_exact
      feedback: A pipette delivers one fixed volume very accurately; a burette measures a variable volume accurately. A measuring cylinder is less precise.
    - id: D
      text: a burette
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Acid is added a little at a time to an alkali until the indicator changes colour. What quantity is being measured?
  - rung: 2
    name: concept
    text:
      en: 'Match the instrument to the quantity: time, temperature, mass or volume.'
  - rung: 3
    name: first_step
    text:
      en: For volumes, decide whether you need an exact fixed volume, an accurate variable volume, a rough volume or a gas volume.
  - rung: 4
    name: worked_step
    text:
      en: 'Pipette: one exact volume. Burette: accurate variable volume. Gas syringe: gas volume.'
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: a burette.'
  misconception_ids:
  - mc.chm.o.analysis_cylinder_for_exact
  - mc.chm.o.analysis_beaker_as_measure
  - mc.chm.o.analysis_mass_volume_confused
solution:
  steps:
  - n: 1
    latex: \text{quantity} \Rightarrow \text{instrument}
    reason: Reason
