    text:
      en: Iron is a transition element and sodium is in Group I. Think about the typical properties of transition elements.
  - rung: 2
    name: concept
    text:
      en: Transition elements are hard, dense metals with high melting points; they form coloured compounds, ions with different charges, and act as catalysts.
  - rung: 3
    name: first_step
    text:
      en: 'Group I metals are the opposite in most physical properties: soft, light, low melting.'
  - rung: 4
    name: worked_step
    text:
      en: Check each statement against these typical properties.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Iron is denser and has a much higher melting point than sodium.'
