id: itm.chm.o.acids.0044
version: 0.1.0
type: mcq
subject: chm
level: o
kc_ids:
- kc.chm.o.acids.oxides
stem: Magnesium oxide powder is added to dilute hydrochloric acid and the mixture is warmed.
parts:
- id: a
  prompt: What happens?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: No reaction, because magnesium oxide is neutral
      correct: false
      misconception_id: mc.chm.o.acids_amphoteric_neutral_confused
      feedback: 'Amphoteric means ''both'': aluminium oxide and zinc oxide react with acids and with alkalis. Neutral means ''neither'': carbon monoxide, nitrogen monoxide and water react with neither.'
    - id: B
      text: It reacts to give magnesium chloride and hydrogen
      correct: false
    - id: C
      text: No reaction, because magnesium oxide is acidic
      correct: false
      misconception_id: mc.chm.o.acids_oxide_type_swapped
      feedback: 'Metal oxides such as CaO and CuO are bases: they react with acids. Non-metal oxides such as CO₂ and SO₂ are acidic: they react with alkalis and give acidic solutions in water.'
    - id: D
      text: It reacts to give magnesium chloride and water
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Is magnesium oxide a metal oxide or a non-metal oxide?
  - rung: 2
    name: concept
    text:
      en: Basic oxides react with acids in a neutralisation.
  - rung: 3
    name: first_step
    text:
      en: A base and an acid give a salt and water.
  - rung: 4
    name: worked_step
    text:
      en: The salt comes from magnesium and from hydrochloric acid.
  - rung: 5
    name: full_step
    text:
      en: 'MgO + 2HCl → MgCl₂ + H₂O: magnesium oxide is basic, so it neutralises the acid to give magnesium chloride and water.'
  misconception_ids:
  - mc.chm.o.acids_oxide_type_swapped
  - mc.chm.o.acids_amphoteric_neutral_confused
solution:
  steps:
  - n: 1
    latex: \text{MgO} + 2\text{HCl} \rightarrow \text{MgCl}_2 + \text{H}_2\text{O}
    reason: Basic oxide + acid → salt + water
    check_id: chk_build_chm_acids_0044_bal
