id: itm.chm.o.metals.0064
version: 0.1.0
type: numeric
subject: chm
level: o
kc_ids:
- kc.chm.o.metals.extraction_yield
stem: Copper(II) oxide is heated with carbon. The equation is 2CuO + C → 2Cu + CO₂.
parts:
- id: a
  prompt: Calculate the mass of copper that can be extracted from 8.0 g of CuO.
  marks: 3
  answer:
    kind: numeric
    value: '6.40'
    unit: g
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_metals_0064_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Go from the mass of CuO to moles, use the equation, then go back to a mass of copper.
  - rung: 2
    name: concept
    text:
      en: Divide a mass by the molar mass to get moles; multiply moles by the molar mass to get grams.
  - rung: 3
    name: first_step
    text:
      en: Moles of CuO = 8.0 ÷ 80 = 0.100 mol.
  - rung: 4
    name: worked_step
    text:
      en: 'The ratio CuO : Cu is 2 : 2, so moles of Cu = 0.100 mol.'
  - rung: 5
    name: full_step
    text:
      en: Mass of copper = 0.100 × 64 = 6.40 g.
  misconception_ids:
  - mc.chm.o.metals_yield_ratio_ignored
  - mc.chm.o.metals_yield_mass_ratio
solution:
  steps:
  - n: 1
    latex: n(\text{CuO}) = \frac{8.0}{80} = 0.100\ \text{mol}
    reason: Mass to moles
    check_id: chk_build_chm_metals_0064_ma
  - n: 2
    latex: '\text{CuO} : \text{Cu} = 2 : 2'
    reason: Ratio from the equation
    check_id: chk_build_chm_metals_0064_coef
  - n: 3
    latex: n(\text{Cu}) = 0.100\ \text{mol}
    reason: Mole ratio from the equation
    check_id: chk_build_chm_metals_0064_chain
  - n: 4
    latex: m(\text{Cu}) = 0.100 \times 64 = 6.40\ \text{g}
    reason: Moles to mass
    check_id: chk_build_chm_metals_0064_mb
