id: itm.chm.o.organic.0086
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.combustion
stem: Propane, C₃H₈, burns completely in a plentiful supply of air.
parts:
- id: a
  prompt: Which is the correct balanced equation for the complete combustion of propane?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 2C₃H₈ + 10O₂ → 6CO₂ + 8H₂O
      correct: false
      misconception_id: mc.chm.o.organic_combustion_not_lowest
      feedback: 'After balancing, check whether every coefficient divides by the same number. If it does, divide them all: 2, 4, 2, 4 becomes 1, 2, 1, 2.'
    - id: B
      text: 2C₃H₈ + 7O₂ → 6CO + 8H₂O
      correct: false
      misconception_id: mc.chm.o.organic_incomplete_products_in_complete
      feedback: 'Complete combustion means plenty of oxygen: all the carbon becomes carbon dioxide and all the hydrogen becomes water. Carbon monoxide and soot form only when the oxygen supply is limited.'
    - id: C
      text: C₃H₈ + 10O → 3CO₂ + 4H₂O
      correct: false
      misconception_id: mc.chm.o.organic_oxygen_formula_changed
      feedback: 'Oxygen gas is made of O₂ molecules. Never change a formula, or write O on its own, to make the atoms fit: balance only with the numbers in front of the formulae.'
    - id: D
      text: C₃H₈ + 5O₂ → 3CO₂ + 4H₂O
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Complete combustion of propane gives only carbon dioxide and water: C₃H₈ + O₂ → CO₂ + H₂O.'
  - rung: 2
    name: concept
    text:
      en: A correct equation keeps every formula as it is (oxygen is O₂), balances each element and uses the smallest whole numbers; check propane's carbon, then hydrogen, then oxygen.
  - rung: 3
    name: first_step
    text:
      en: Rule out any option for propane that has carbon monoxide as a product or oxygen written as O.
  - rung: 4
    name: worked_step
    text:
      en: Of the options left for propane, see whether all the numbers can be divided by the same factor.
  - rung: 5
    name: full_step
    text:
      en: 'C₃H₈ + 5O₂ → 3CO₂ + 4H₂O: every element balances with the smallest whole numbers.'
  misconception_ids:
  - mc.chm.o.organic_incomplete_products_in_complete
  - mc.chm.o.organic_combustion_not_lowest
  - mc.chm.o.organic_oxygen_formula_changed
solution:
  steps:
  - n: 1
    latex: \text{C}_3\text{H}_8 + \text{O}_2 \rightarrow \text{CO}_2 + \text{H}_2\text{O}
    reason: Fuel + oxygen → carbon dioxide + water
    check_id: chk_build_chm_organic_0086_bal
  - n: 2
    latex: \text{C}_3\text{H}_8 + 5\text{O}_2 \rightarrow 3\text{CO}_2 + 4\text{H}_2\text{O}
    reason: Every element balances with the lowest numbers
    check_id: chk_build_chm_organic_0086_ratios
