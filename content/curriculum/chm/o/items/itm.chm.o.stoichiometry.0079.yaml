- kc.chm.o.stoichiometry.reacting_masses
stem: Calcium carbonate is heated until it stops losing mass. The equation is CaCO₃ → CaO + CO₂. Take the molar gas volume as 24 dm³ at room conditions.
parts:
- id: a
  prompt: Calculate the volume of CO₂ given off from 5.0 g of CaCO₃.
  marks: 3
  answer:
    kind: numeric
    value: '1.20'
    unit: dm^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_chm_stoichiometry_0079_chain
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Mass of CaCO₃ → moles → moles of CO₂ → volume.
  - rung: 2
    name: concept
    text:
      en: The equation gives the mole ratio; each mole of gas takes up 24 dm³.
  - rung: 3
    name: first_step
    text:
      en: Moles of CaCO₃ = 5.0 ÷ 100 = 0.0500 mol.
  - rung: 4
    name: worked_step
    text:
      en: The ratio is one to one, so moles of CO₂ = 0.0500 mol; multiply by 24.
  - rung: 5
    name: full_step
    text:
      en: 0.0500 × 24 = 1.20 dm³.
  misconception_ids:
  - mc.chm.o.ratio_ignored
  - mc.chm.o.gas_volume_from_mass
solution:
  steps:
  - n: 1
    latex: n(\text{CaCO}_3) = \frac{5.0}{100} = 0.0500
    reason: Moles of solid
    check_id: chk_build_chm_stoichiometry_0079_mr
  - n: 2
    latex: n(\text{CO}_2) = 0.0500
    reason: One to one from the equation
    check_id: chk_build_chm_stoichiometry_0079_chain
  - n: 3
    latex: V = 0.0500 \times 24 = 1.20\ \text{dm}^3
    reason: Molar gas volume
    check_id: chk_build_chm_stoichiometry_0079_chain
