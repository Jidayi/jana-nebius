id: itm.chm.o.organic.0064
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.alcohols_and_acids
stem: Glucose solution is fermented with yeast to make ethanol.
parts:
- id: a
  prompt: Which conditions give a good yield of ethanol?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: About 30 °C, with air kept out
      correct: true
    - id: B
      text: About 30 °C, with air bubbled through the mixture
      correct: false
      misconception_id: mc.chm.o.organic_fermentation_needs_air_or_heat
      feedback: 'Yeast is alive. It turns sugar into ethanol when air is kept out, and it works best when warm, not hot: high temperatures destroy its enzymes. With air, microbes would oxidise the ethanol to ethanoic acid.'
    - id: C
      text: About 30 °C, with acidified potassium manganate(VII) added
      correct: false
      misconception_id: mc.chm.o.organic_oxidation_means_burning
      feedback: Burning is one kind of oxidation, but a gentle oxidising agent such as acidified potassium manganate(VII), or bacteria in air, turns ethanol into ethanoic acid. That is why wine left open turns sour like vinegar.
    - id: D
      text: About 100 °C, so that the reaction is faster
      correct: false
      misconception_id: mc.chm.o.organic_fermentation_needs_air_or_heat
      feedback: 'Yeast is alive. It turns sugar into ethanol when air is kept out, and it works best when warm, not hot: high temperatures destroy its enzymes. With air, microbes would oxidise the ethanol to ethanoic acid.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Fermentation uses the enzymes in living yeast.
  - rung: 2
    name: concept
    text:
      en: Enzymes work best when warm; very high temperatures destroy them.
  - rung: 3
    name: first_step
    text:
      en: Yeast makes ethanol only when it has no oxygen.
  - rung: 4
    name: worked_step
    text:
      en: An oxidising agent would turn the ethanol into something else.
  - rung: 5
    name: full_step
    text:
      en: Warm, not hot, conditions with air kept out give the best yield of ethanol from the glucose.
  misconception_ids:
  - mc.chm.o.organic_fermentation_needs_air_or_heat
  - mc.chm.o.organic_oxidation_means_burning
solution:
  steps:
  - n: 1
    latex: \text{C}_6\text{H}_{12}\text{O}_6 \rightarrow 2\text{C}_2\text{H}_5\text{OH} + 2\text{CO}_2
    reason: Fermentation
    check_id: chk_build_chm_organic_0064_bal
