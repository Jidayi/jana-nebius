id: itm.chm.o.organic.0028
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.general_formulae
stem: An alcohol in the series CₙH₂ₙ₊₁OH has a relative molecular mass of 46.
parts:
- id: a
  prompt: How many carbon atoms does each molecule have?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 'Two: C₂H₅OH'
      correct: true
    - id: B
      text: 'Four: C₄H₉OH'
      correct: false
      misconception_id: mc.chm.o.organic_gf_hydrogen_mass_ignored
      feedback: 'Every atom adds its mass. Hydrogen atoms are light, but there are many of them: each CH₂ unit has a mass of 14, not 12.'
    - id: C
      text: 'Three: C₃H₇OH'
      correct: false
      misconception_id: mc.chm.o.organic_gf_group_atoms_missed
      feedback: Write the full formula first, functional group included, and count every atom. In CₙH₂ₙ₊₁COOH the –COOH group holds one more carbon atom, so the molecule has n + 1 carbon atoms.
    - id: D
      text: 'Three: C₃H₈'
      correct: false
      misconception_id: mc.chm.o.organic_gf_wrong_series
      feedback: 'Match the formula to the family: alkanes CₙH₂ₙ₊₂, alkenes CₙH₂ₙ, alcohols CₙH₂ₙ₊₁OH, carboxylic acids CₙH₂ₙ₊₁COOH. Check: an alkene has exactly twice as many hydrogen atoms as carbon atoms.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Write the Mr of CₙH₂ₙ₊₁OH in terms of n.
  - rung: 2
    name: concept
    text:
      en: CₙH₂ₙ is n units of CH₂, each of mass 14. The extra H and the –OH add 16 + 1 + 1.
  - rung: 3
    name: first_step
    text:
      en: So Mr = 14n + 18 for every alcohol in the series.
  - rung: 4
    name: worked_step
    text:
      en: Set 14n + 18 = 46 and solve for n.
  - rung: 5
    name: full_step
    text:
      en: '14n = 46 − 18, so n = 2: the alcohol is C₂H₅OH (ethanol).'
  misconception_ids:
  - mc.chm.o.organic_gf_group_atoms_missed
  - mc.chm.o.organic_gf_hydrogen_mass_ignored
  - mc.chm.o.organic_gf_wrong_series
solution:
  steps:
  - n: 1
    latex: \text{CH}_2 = 14
    reason: Mass of one CH₂ unit
    check_id: chk_build_chm_organic_0028_ch2
  - n: 2
    latex: 16 + 1 + 1 = 18
    reason: The OH and the extra H
    check_id: chk_build_chm_organic_0028_g
  - n: 3
    latex: n = \frac{46 - 18}{14} = 2
    reason: Solve 14n + 18 = 46
    check_id: chk_build_chm_organic_0028_n
