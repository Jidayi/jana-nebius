stem: The Periodic Table arranges the elements in groups (columns) and periods (rows).
parts:
- id: a
  prompt: How does the character of the elements change from left to right across a period?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: From metals to non-metals
      correct: true
    - id: B
      text: It does not change
      correct: false
    - id: C
      text: From gases to metals
      correct: false
    - id: D
      text: From non-metals to metals
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Recall what groups and periods have in common.
  - rung: 2
    name: concept
    text:
      en: Elements in a group share the number of outer electrons; elements in a period share the number of shells.
  - rung: 3
    name: first_step
    text:
      en: Metals are on the left and in the middle; non-metals are on the right.
  - rung: 4
    name: worked_step
    text:
      en: Use the electron arrangement of each element to check.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: From metals to non-metals.'
solution:
  steps:
  - n: 1
    latex: '\text{group: outer electrons; period: shells}'
    reason: How the table is built
