stem: Think about the neutralisation of an acid by an alkali.
parts:
- id: a
  prompt: Which statement about the neutralisation of an acid by an alkali is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: It is exothermic, so ΔH is positive.
      correct: false
      misconception_id: mc.chm.o.energetics_dh_sign_reversed
    - id: B
      text: It involves no energy change, so ΔH is zero.
      correct: false
    - id: C
      text: It is exothermic, so ΔH is negative.
      correct: true
    - id: D
      text: It is endothermic, so ΔH is positive.
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Does the neutralisation of an acid by an alkali give energy out or need energy to be supplied?
  - rung: 2
    name: concept
    text:
      en: Exothermic changes give energy out and have a negative ΔH; endothermic changes take energy in and have a positive ΔH.
  - rung: 3
    name: first_step
    text:
      en: 'Recall what happens in the neutralisation of an acid by an alkali: is heat or light released, or must it be supplied?'
  - rung: 4
    name: worked_step
    text:
      en: Then match the sign of ΔH to the direction of energy flow.
  - rung: 5
    name: full_step
    text:
      en: The neutralisation of an acid by an alkali is exothermic.
  misconception_ids:
  - mc.chm.o.energetics_dh_sign_reversed
