id: itm.chm.o.analysis.0040
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.analysis.separation
stem: A mixture contains sand and dissolved salt in water.
parts:
- id: a
  prompt: Which method removes the sand?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Crystallisation
      correct: false
      misconception_id: mc.chm.o.analysis_method_for_wrong_mixture
      feedback: Crystallisation gets a dissolved solid out of a solution. Sand does not dissolve, so filtering removes it.
    - id: B
      text: Fractional distillation
      correct: false
      misconception_id: mc.chm.o.analysis_simple_for_miscible
      feedback: Liquids that mix need fractional distillation; the column separates them by their boiling points.
    - id: C
      text: Evaporation
      correct: false
      misconception_id: mc.chm.o.analysis_evaporate_to_collect_liquid
      feedback: Evaporation keeps the solid and loses the liquid. To collect the liquid, distil it and condense the vapour.
    - id: D
      text: Filtration
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A mixture contains sand and dissolved salt in water. Which parts are dissolved, which are solids, and which are liquids?
  - rung: 2
    name: concept
    text:
      en: Filtration removes undissolved solids; crystallisation and evaporation recover a dissolved solid; distillation recovers a liquid; fractional distillation separates liquids that mix.
  - rung: 3
    name: first_step
    text:
      en: Decide which part you want to keep.
  - rung: 4
    name: worked_step
    text:
      en: Pick the method that keeps that part and removes the rest.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Filtration.'
  misconception_ids:
  - mc.chm.o.analysis_evaporate_to_collect_liquid
  - mc.chm.o.analysis_simple_for_miscible
  - mc.chm.o.analysis_method_for_wrong_mixture
