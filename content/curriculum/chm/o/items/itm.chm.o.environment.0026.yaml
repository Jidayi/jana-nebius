stem: Rain near a coal-burning power station is more acidic than normal.
parts:
- id: a
  prompt: Which gas from the power station is the main cause?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Sulfur dioxide, from sulfur compounds in the coal
      correct: true
    - id: B
      text: Soot particles, which dissolve to form sulfuric acid
      correct: false
      misconception_id: mc.chm.o.environment_pollutant_effects_mixed
      feedback: 'Learn each pollutant as a pair: source and effect. Carbon monoxide comes from incomplete combustion and is toxic. Sulfur dioxide comes from burning fuels that contain sulfur and causes acid rain. Oxides of nitrogen come from car engines and also cause acid rain. Particulates come from incomplete com'
    - id: C
      text: Carbon dioxide, which a catalytic converter would remove
      correct: false
      misconception_id: mc.chm.o.environment_converter_removes_co2
      feedback: A catalytic converter changes carbon monoxide and oxides of nitrogen into carbon dioxide and nitrogen. It makes carbon dioxide; it does not remove it, and it does nothing to sulfur dioxide.
    - id: D
      text: Carbon monoxide, from incomplete combustion
      correct: false
      misconception_id: mc.chm.o.environment_pollutant_effects_mixed
      feedback: 'Learn each pollutant as a pair: source and effect. Carbon monoxide comes from incomplete combustion and is toxic. Sulfur dioxide comes from burning fuels that contain sulfur and causes acid rain. Oxides of nitrogen come from car engines and also cause acid rain. Particulates come from incomplete com'
  hints:
  - rung: 1
    name: orient
    text:
      en: Coal is mostly carbon, but it also contains small amounts of other elements.
  - rung: 2
    name: concept
    text:
      en: Acid rain forms when acidic oxides dissolve in rain water.
  - rung: 3
    name: first_step
    text:
      en: Burning sulfur gives sulfur dioxide, an acidic gas.
  - rung: 4
    name: worked_step
    text:
      en: Carbon monoxide is toxic but it is not the gas that makes rain strongly acidic.
  - rung: 5
    name: full_step
    text:
      en: Sulfur dioxide from sulfur in the coal dissolves in rain and is oxidised, giving acid rain.
  misconception_ids:
  - mc.chm.o.environment_pollutant_effects_mixed
  - mc.chm.o.environment_converter_removes_co2
solution:
  steps:
  - n: 1
    latex: \text{S} + \text{O}_2 \rightarrow \text{SO}_2
    reason: Sulfur in the fuel burns
    check_id: chk_build_chm_environment_0026_bal
  - n: 2
    latex: \text{SO}_2\text{ + rain }\rightarrow\text{ acid rain}
    reason: Acidic oxide
