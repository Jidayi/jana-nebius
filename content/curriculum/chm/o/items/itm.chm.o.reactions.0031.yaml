stem: A student explains why a reaction is faster at a higher temperature.
parts:
- id: a
  prompt: Put the steps of the explanation in order.
  marks: 2
  answer:
    kind: ordering
    scoring: adjacent_pairs
    elements:
    - id: s2
      text: The particles gain kinetic energy and move faster.
    - id: s1
      text: The temperature of the reaction mixture is raised.
    - id: s4
      text: There are more successful collisions each second, so the rate increases.
    - id: s3
      text: Collisions are more frequent, and more of them have at least the activation energy.
    correct_order:
    - s1
    - s2
    - s3
    - s4
  hints:
