  - rung: 2
    name: concept
    text:
      en: Temperature affects the energy of the particles first.
  - rung: 3
    name: first_step
    text:
      en: Faster particles change both how often and how hard they collide.
  - rung: 4
    name: worked_step
    text:
      en: The rate depends on the number of successful collisions each second. Where does that go?
  - rung: 5
    name: full_step
    text:
      en: Temperature raised; particles move faster; more frequent and more energetic collisions; more successful collisions per second, so a higher rate.
