stem: 'Metals are malleable: they can be hammered into thin sheets without breaking.'
parts:
- id: a
  prompt: What happens to the particles in a metal when it is hammered?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: The metal atoms break apart into separate ions and electrons.
      correct: false
    - id: B
      text: The ions move freely through the metal, like in a liquid.
      correct: false
      misconception_id: mc.chm.o.metals_conduct_by_moving_ions
      feedback: In a solid metal the positive ions stay in their places in the lattice. The delocalised electrons move through the structure and carry the current.
    - id: C
      text: New covalent bonds form between the atoms.
      correct: false
    - id: D
      text: Layers of positive ions slide over each other, and the delocalised electrons keep holding them together.
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture the metal lattice as rows of positive ions in a sea of electrons.
  - rung: 2
    name: concept
    text:
      en: 'Metallic bonding is not directional: the electrons attract all the ions around them.'
  - rung: 3
    name: first_step
    text:
      en: When a force pushes on the metal, ask whether the layers can move.
  - rung: 4
    name: worked_step
    text:
      en: Think about whether the attraction between ions and electrons is lost when a layer shifts.
  - rung: 5
    name: full_step
    text:
      en: The layers slide over each other, but the sea of electrons still holds them, so the metal changes shape without breaking.
  misconception_ids:
  - mc.chm.o.metals_conduct_by_moving_ions
