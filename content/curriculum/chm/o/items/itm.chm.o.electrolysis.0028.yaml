id: itm.chm.o.electrolysis.0028
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.electrolysis.half_equations
stem: Aluminium oxide dissolved in molten cryolite is electrolysed.
parts:
- id: a
  prompt: Which half-equation shows the change at the anode?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 2O²⁻ → O₂ + 2e⁻
      correct: false
      misconception_id: mc.chm.o.electrolysis_half_charge_unbalanced
      feedback: 'After balancing the atoms, add up the charges on each side. Add electrons until both sides have the same total charge: for Al³⁺ you need three electrons to reach a neutral Al atom.'
    - id: B
      text: 2O²⁻ → O₂ + 4e⁻
      correct: true
    - id: C
      text: O²⁻ → O + 2e⁻
      correct: false
      misconception_id: mc.chm.o.electrolysis_single_atoms_formed
      feedback: 'Chlorine, bromine, iodine and oxygen exist as molecules of two atoms: Cl₂, Br₂, I₂, O₂. So two chloride ions are needed to make one chlorine molecule: 2Cl⁻ → Cl₂ + 2e⁻.'
    - id: D
      text: 2O²⁻ + 4e⁻ → O₂
      correct: false
      misconception_id: mc.chm.o.electrolysis_electrons_wrong_side
      feedback: 'At the cathode, positive ions gain electrons, so electrons are on the left: M²⁺ + 2e⁻ → M. At the anode, negative ions lose electrons, so electrons are on the right: 2Cl⁻ → Cl₂ + 2e⁻.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Oxide ions, O²⁻, are discharged at the anode of the aluminium cell.
  - rung: 2
    name: concept
    text:
      en: At the anode, ions lose electrons; the electrons go on the right.
  - rung: 3
    name: first_step
    text:
      en: Oxygen gas is O₂, so two oxide ions are needed for each molecule.
  - rung: 4
    name: worked_step
    text:
      en: Each oxide ion carries two negative charges, so find the total charge of two of them and match it with electrons on the right.
  - rung: 5
    name: full_step
    text:
      en: '2O²⁻ → O₂ + 4e⁻: two oxide ions lose two electrons each, four in total.'
  misconception_ids:
  - mc.chm.o.electrolysis_single_atoms_formed
  - mc.chm.o.electrolysis_half_charge_unbalanced
  - mc.chm.o.electrolysis_electrons_wrong_side
solution:
  steps:
  - n: 1
    latex: 2\text{O}^{2-} \rightarrow \text{O}_2 + 4e^{-}
    reason: Balanced half-equation at the anode
    check_id: chk_build_chm_electrolysis_0028_bal
