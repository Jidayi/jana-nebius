id: itm.chm.o.periodic.0025
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.periodic.group_vii
stem: Aqueous chlorine is added to colourless potassium bromide solution.
parts:
- id: a
  prompt: What happens?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Chlorine is displaced from the solution
      correct: false
      misconception_id: mc.chm.o.periodic_displacement_reversed
      feedback: 'The more reactive halogen takes the place of the less reactive one in the compound, setting the less reactive halogen free: Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂.'
    - id: B
      text: No reaction, because halogens in the same group react identically
      correct: false
      misconception_id: mc.chm.o.periodic_same_group_identical
      feedback: 'Lithium fizzes gently on water but potassium bursts into flame: same type of reaction, very different vigour.'
    - id: C
      text: No reaction, because chlorine is less reactive than bromine
      correct: false
      misconception_id: mc.chm.o.periodic_halogen_reactivity_increases
      feedback: 'Halogens react by gaining an electron. Lower down, the outer shell is further from the nucleus and attracts an electron less strongly, so reactivity decreases: chlorine > bromine > iodine.'
    - id: D
      text: The solution turns orange-brown because bromine is displaced
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which is higher in Group VII, chlorine or bromine?
  - rung: 2
    name: concept
    text:
      en: A more reactive halogen displaces a less reactive halogen from a solution of its halide.
  - rung: 3
    name: first_step
    text:
      en: Reactivity decreases down Group VII.
  - rung: 4
    name: worked_step
    text:
      en: So decide whether chlorine can take the place of bromine in potassium bromide.
  - rung: 5
    name: full_step
    text:
      en: Chlorine is more reactive, so it displaces bromine, which colours the solution orange-brown.
  misconception_ids:
  - mc.chm.o.periodic_halogen_reactivity_increases
  - mc.chm.o.periodic_displacement_reversed
  - mc.chm.o.periodic_same_group_identical
