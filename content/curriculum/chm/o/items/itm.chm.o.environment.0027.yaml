id: itm.chm.o.environment.0027
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.environment.air_pollution
stem: Most new petrol cars have a catalytic converter in the exhaust pipe.
parts:
- id: a
  prompt: What does the catalytic converter do?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: It removes the carbon dioxide from the exhaust gases
      correct: false
      misconception_id: mc.chm.o.environment_converter_removes_co2
      feedback: A catalytic converter changes carbon monoxide and oxides of nitrogen into carbon dioxide and nitrogen. It makes carbon dioxide; it does not remove it, and it does nothing to sulfur dioxide.
    - id: B
      text: It turns sulfur dioxide into carbon monoxide, which does not cause acid rain
      correct: false
      misconception_id: mc.chm.o.environment_pollutant_effects_mixed
      feedback: 'Learn each pollutant as a pair: source and effect. Carbon monoxide comes from incomplete combustion and is toxic. Sulfur dioxide comes from burning fuels that contain sulfur and causes acid rain. Oxides of nitrogen come from car engines and also cause acid rain. Particulates come from incomplete com'
    - id: C
      text: It changes carbon monoxide and nitrogen monoxide into carbon dioxide and nitrogen
      correct: true
    - id: D
      text: It removes the nitrogen compounds that were in the petrol
      correct: false
      misconception_id: mc.chm.o.environment_nox_from_fuel_nitrogen
      feedback: 'Petrol is a mixture of hydrocarbons: it contains almost no nitrogen. Air is mostly nitrogen. In the very hot engine, nitrogen and oxygen from the air combine to form nitrogen monoxide and nitrogen dioxide.'
  hints:
  - rung: 1
    name: orient
    text:
      en: A catalyst speeds up a reaction between harmful gases in the exhaust.
  - rung: 2
    name: concept
    text:
      en: The converter deals with the two most toxic gases from a petrol engine.
  - rung: 3
    name: first_step
    text:
      en: Carbon monoxide gains oxygen and nitrogen monoxide loses oxygen.
  - rung: 4
    name: worked_step
    text:
      en: Which harmless or less harmful gases form when CO and NO react with each other?
  - rung: 5
    name: full_step
    text:
      en: '2CO + 2NO → 2CO₂ + N₂: carbon monoxide and nitrogen monoxide become carbon dioxide and nitrogen.'
  misconception_ids:
  - mc.chm.o.environment_converter_removes_co2
  - mc.chm.o.environment_nox_from_fuel_nitrogen
  - mc.chm.o.environment_pollutant_effects_mixed
