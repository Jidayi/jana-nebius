id: itm.chm.o.organic.0050
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.organic.alkanes_and_alkenes
stem: Ethene gas is bubbled into bromine water.
parts:
- id: a
  prompt: Which describes the reaction?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 'Substitution: C₂H₃Br and HBr form'
      correct: false
      misconception_id: mc.chm.o.organic_addition_substitution_mixed
      feedback: In addition, two molecules join into one product and the double bond becomes single. In substitution an atom such as H is swapped for another such as Cl, so a second product (HCl) forms. Alkenes add; alkanes substitute, in ultraviolet light.
    - id: B
      text: 'Addition: C₂H₄Br₂ is the only product, and the orange colour disappears'
      correct: true
    - id: C
      text: 'Addition: C₂H₄Br₂ forms, and the water turns from colourless to orange'
      correct: false
      misconception_id: mc.chm.o.organic_bromine_colour_reversed
      feedback: 'Bromine water starts orange-brown. An alkene adds the bromine across its double bond, so the orange colour disappears: orange to colourless. No change means no C=C bond.'
    - id: D
      text: No reaction until ultraviolet light is shone on the mixture
      correct: false
      misconception_id: mc.chm.o.organic_addition_substitution_mixed
      feedback: In addition, two molecules join into one product and the double bond becomes single. In substitution an atom such as H is swapped for another such as Cl, so a second product (HCl) forms. Alkenes add; alkanes substitute, in ultraviolet light.
  hints:
  - rung: 1
    name: orient
    text:
      en: Ethene is an alkene. What does its C=C bond allow it to do?
  - rung: 2
    name: concept
    text:
      en: In an addition reaction, two molecules join to make one product.
  - rung: 3
    name: first_step
    text:
      en: The double bond opens, and one bromine atom joins each carbon atom.
  - rung: 4
    name: worked_step
    text:
      en: Bromine water is orange; think about what happens to the colour as the bromine is used up.
  - rung: 5
    name: full_step
    text:
      en: C₂H₄ + Br₂ → C₂H₄Br₂ (addition, one product); the orange colour disappears.
  misconception_ids:
  - mc.chm.o.organic_addition_substitution_mixed
  - mc.chm.o.organic_bromine_colour_reversed
