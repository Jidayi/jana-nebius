stem: Ethanol is the alcohol in alcoholic drinks.
parts:
- id: a
  prompt: Which is the formula of ethanol?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: CH₃COOH
      correct: false
      misconception_id: mc.chm.o.organic_ending_wrong_series
      feedback: 'The ending names the family: -ane for alkanes, -ene for alkenes, -ol for alcohols and -oic acid for carboxylic acids. Find the functional group first, then choose the ending.'
    - id: B
      text: CH₃OH
      correct: false
      misconception_id: mc.chm.o.organic_prefix_order_mixed
      feedback: 'Learn the order: meth- means one carbon atom, eth- two, prop- three and but- four. A memory aid: Monkeys Eat Peeled Bananas.'
    - id: C
      text: C₂H₅OH
      correct: true
    - id: D
      text: C₂H₆
      correct: false
      misconception_id: mc.chm.o.organic_ending_wrong_series
      feedback: 'The ending names the family: -ane for alkanes, -ene for alkenes, -ol for alcohols and -oic acid for carboxylic acids. Find the functional group first, then choose the ending.'
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Split the name: eth- and -ol.'
  - rung: 2
    name: concept
    text:
      en: Eth- means two carbon atoms; -ol means an alcohol with an –OH group.
  - rung: 3
    name: first_step
    text:
      en: Alcohols fit CₙH₂ₙ₊₁OH.
  - rung: 4
    name: worked_step
    text:
      en: 'Put n = 2: twice two plus one hydrogen atoms in the chain, then –OH.'
  - rung: 5
    name: full_step
    text:
      en: Ethanol is C₂H₅OH.
  misconception_ids:
