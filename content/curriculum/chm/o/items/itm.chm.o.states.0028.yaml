id: itm.chm.o.states.0028
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.states.diffusion
stem: Equal amounts of helium, He, and nitrogen, N₂, are released at the same temperature.
parts:
- id: a
  prompt: Which gas diffuses faster, and why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Both the same, because all gases diffuse at the same rate
      correct: false
      misconception_id: mc.chm.o.states_all_gases_same_rate
      feedback: Different gases diffuse at different rates. At the same temperature lighter particles move faster on average, so helium spreads faster than nitrogen.
    - id: B
      text: Helium, because its atoms are lighter and move faster
      correct: true
    - id: C
      text: Nitrogen, because its heavier molecules push harder
      correct: false
      misconception_id: mc.chm.o.states_heavier_faster
      feedback: At the same temperature lighter molecules move faster on average, so the gas with the lower Mr diffuses faster.
    - id: D
      text: Neither, unless the air is stirred
      correct: false
      misconception_id: mc.chm.o.states_diffusion_needs_mixing
      feedback: Particles move randomly all the time. Diffusion happens on its own, even in still air; stirring only speeds it up.
  hints:
  - rung: 1
    name: orient
    text:
      en: Compare the masses of the molecules of helium and nitrogen.
  - rung: 2
    name: concept
    text:
      en: At the same temperature, lighter molecules move faster on average.
  - rung: 3
    name: first_step
    text:
      en: Mr of He is 4; Mr of N₂ is 28.
  - rung: 4
    name: worked_step
    text:
      en: The gas whose molecules move faster spreads out faster.
  - rung: 5
    name: full_step
    text:
      en: Helium (Mr 4) diffuses faster than nitrogen (Mr 28).
  misconception_ids:
  - mc.chm.o.states_heavier_faster
  - mc.chm.o.states_all_gases_same_rate
  - mc.chm.o.states_diffusion_needs_mixing
solution:
  steps:
  - n: 1
    latex: 'M_r: 4\ \text{vs}\ 28'
    reason: Lighter molecules
    check_id: chk_build_chm_states_0028_m1
  - n: 2
