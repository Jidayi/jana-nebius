stem: Methane gas from a landfill site can be collected through pipes.
parts:
- id: a
  prompt: What is the best thing to do with it to help reduce climate change?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: Store it in a catalytic converter
      correct: false
      misconception_id: mc.chm.o.environment_converter_removes_co2
      feedback: A catalytic converter changes carbon monoxide and oxides of nitrogen into carbon dioxide and nitrogen. It makes carbon dioxide; it does not remove it, and it does nothing to sulfur dioxide.
    - id: B
      text: Pump it into a lake to dissolve
      correct: false
    - id: C
      text: Burn it as a fuel to generate electricity
      correct: true
    - id: D
      text: Release it into the air through a tall chimney
      correct: false
