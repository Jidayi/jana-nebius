    text:
      en: Methane is a much stronger greenhouse gas than carbon dioxide.
  - rung: 2
    name: concept
    text:
      en: Burning methane turns it into carbon dioxide and water.
  - rung: 3
    name: first_step
    text:
      en: The energy released can replace energy from coal.
  - rung: 4
    name: worked_step
    text:
      en: Which choice both destroys the methane and makes use of it?
  - rung: 5
    name: full_step
    text:
      en: Burning the methane for electricity swaps a strong greenhouse gas for carbon dioxide and saves other fuel.
