stem: 'For the reaction H₂ + Cl₂ → 2HCl, use these bond energies in kJ/mol: H–H 436, Cl–Cl 242, H–Cl 431.'
parts:
- id: a
  prompt: What is the enthalpy change, ΔH, for the reaction?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: +247 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_bond_count_ignored
      feedback: 'Count every bond: CH₄ has four C–H bonds, and 2H₂O has four O–H bonds. Multiply each bond energy by its number.'
    - id: B
      text: +184 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_formed_minus_broken
      feedback: ΔH = energy in (bonds broken) − energy out (bonds formed). More out than in gives a negative ΔH.
    - id: C
      text: +678 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_only_broken
      feedback: 'Both halves matter: energy goes in to break bonds and comes out when new bonds form. ΔH is the difference.'
    - id: D
      text: -184 kJ/mol
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which bonds break in the reactants of H₂ + Cl₂ → 2HCl, and which form in the products?
  - rung: 2
    name: concept
    text:
      en: ΔH = total energy of bonds broken − total energy of bonds formed.
  - rung: 3
    name: first_step
    text:
      en: 'Bonds broken: one H–H and one Cl–Cl, a total of 678 kJ/mol.'
  - rung: 4
    name: worked_step
    text:
      en: 'Bonds formed: two H–Cl, a total of 862 kJ/mol.'
  - rung: 5
    name: full_step
    text:
      en: ΔH = 678 − 862 = -184 kJ/mol.
  misconception_ids:
