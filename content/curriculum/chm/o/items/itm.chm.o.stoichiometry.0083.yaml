stem: A reaction gives off 720 cm³ of hydrogen, H₂, measured at room temperature and pressure.
parts:
- id: a
  prompt: What amount of gas, in moles, is this? (The molar gas volume is 24 dm³.)
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 17.3 mol
      correct: false
      misconception_id: mc.chm.o.gas_volume_divided
      feedback: 'One mole of gas fills 24 dm³, so two moles fill twice as much: volume = amount × 24.'
    - id: B
      text: 0.0300 mol
      correct: true
    - id: C
      text: 30.0 mol
      correct: false
      misconception_id: mc.chm.o.gas_cm3_dm3
      feedback: 1 dm³ = 1000 cm³. The molar gas volume is 24 dm³, which is 24 000 cm³; convert before you divide.
    - id: D
      text: 0.0321 mol
      correct: false
      misconception_id: mc.chm.o.gas_stp_volume
      feedback: At room temperature and pressure one mole of gas occupies 24 dm³; use the value the question gives.
  hints:
  - rung: 1
    name: orient
    text:
      en: The volume is in cm³; the molar gas volume is in dm³.
  - rung: 2
    name: concept
    text:
      en: Convert to dm³ (÷ 1000), then divide by 24 dm³/mol.
  - rung: 3
    name: first_step
    text:
      en: 720 cm³ is 720 ÷ 1000 dm³.
  - rung: 4
    name: worked_step
    text:
      en: Now divide that volume in dm³ by 24.
  - rung: 5
    name: full_step
    text:
      en: (720 ÷ 1000) ÷ 24 = 0.0300 mol.
  misconception_ids:
  - mc.chm.o.gas_volume_divided
  - mc.chm.o.gas_cm3_dm3
  - mc.chm.o.gas_stp_volume
solution:
  steps:
  - n: 1
    latex: n = \frac{720 \div 1000}{24} = 0.0300\ \text{mol}
    reason: Convert, then divide
    check_id: chk_build_chm_stoichiometry_0083_chain
