subject: chm
level: o
kc_ids:
- kc.chm.o.acids.oxides
stem: Nitrogen monoxide, NO, is bubbled through dilute hydrochloric acid and then through sodium hydroxide solution. It reacts with neither.
parts:
- id: a
  prompt: What type of oxide is nitrogen monoxide?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Basic
      correct: false
      misconception_id: mc.chm.o.acids_oxide_type_swapped
      feedback: 'Metal oxides such as CaO and CuO are bases: they react with acids. Non-metal oxides such as CO₂ and SO₂ are acidic: they react with alkalis and give acidic solutions in water.'
    - id: B
      text: Amphoteric
      correct: false
      misconception_id: mc.chm.o.acids_amphoteric_neutral_confused
      feedback: 'Amphoteric means ''both'': aluminium oxide and zinc oxide react with acids and with alkalis. Neutral means ''neither'': carbon monoxide, nitrogen monoxide and water react with neither.'
    - id: C
      text: Acidic
      correct: false
      misconception_id: mc.chm.o.acids_oxide_by_element_only
      feedback: 'The metal / non-metal rule has exceptions. Test the oxide: aluminium oxide and zinc oxide also react with alkalis (amphoteric), and carbon monoxide and nitrogen monoxide react with neither acids nor alkalis (neutral).'
    - id: D
      text: Neutral
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Did the oxide react with the acid, the alkali, both or neither?
  - rung: 2
    name: concept
    text:
      en: Each type of oxide is defined by what it reacts with.
  - rung: 3
    name: first_step
    text:
      en: Nitrogen monoxide is a non-metal oxide, but it did not react with the alkali.
  - rung: 4
    name: worked_step
    text:
      en: An oxide that reacts with both is amphoteric. What is an oxide that reacts with neither called?
  - rung: 5
    name: full_step
    text:
      en: Nitrogen monoxide reacts with neither acids nor alkalis, so it is a neutral oxide.
  misconception_ids:
  - mc.chm.o.acids_amphoteric_neutral_confused
  - mc.chm.o.acids_oxide_by_element_only
  - mc.chm.o.acids_oxide_type_swapped
solution:
  steps:
  - n: 1
    latex: \text{no reaction with acid or alkali} \Rightarrow \text{neutral}
    reason: Definition
