stem: Aluminium oxide is dissolved in molten cryolite and electrolysed. The melt contains Al³⁺ and O²⁻ ions.
parts:
- id: a
  prompt: Which products form?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: Aluminium at the cathode and hydrogen at the anode
      correct: false
      misconception_id: mc.chm.o.electrolysis_molten_gives_hydrogen
      feedback: A molten binary compound contains only its own two kinds of ion. There is no water, so there are no hydrogen or hydroxide ions. The metal forms at the cathode and the non-metal at the anode.
    - id: B
      text: Hydrogen at the cathode and oxygen at the anode
      correct: false
      misconception_id: mc.chm.o.electrolysis_molten_gives_hydrogen
      feedback: A molten binary compound contains only its own two kinds of ion. There is no water, so there are no hydrogen or hydroxide ions. The metal forms at the cathode and the non-metal at the anode.
    - id: C
      text: Oxygen at the cathode and aluminium at the anode
      correct: false
      misconception_id: mc.chm.o.electrolysis_metal_at_anode
      feedback: Opposite charges attract. Positive metal ions (cations) move to the negative electrode, the cathode, and become metal there. Negative non-metal ions (anions) move to the positive electrode, the anode.
    - id: D
      text: Aluminium at the cathode and oxygen at the anode
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The melt contains only aluminium ions and oxide ions.
  - rung: 2
    name: concept
    text:
      en: Positive ions are discharged at the cathode, negative ions at the anode.
  - rung: 3
    name: first_step
    text:
      en: Al³⁺ is attracted to the negative electrode; O²⁻ is attracted to the positive electrode.
  - rung: 4
    name: worked_step
    text:
      en: There is no water, so hydrogen cannot form. Name the element made from each ion.
  - rung: 5
    name: full_step
    text:
      en: Al³⁺ ions gain electrons at the cathode to form aluminium; O²⁻ ions lose electrons at the anode to form oxygen.
  misconception_ids:
  - mc.chm.o.electrolysis_metal_at_anode
  - mc.chm.o.electrolysis_molten_gives_hydrogen
solution:
  steps:
  - n: 1
    latex: '\text{cathode: Al; anode: }\text{O}_2'
    reason: Cations to the cathode, anions to the anode
