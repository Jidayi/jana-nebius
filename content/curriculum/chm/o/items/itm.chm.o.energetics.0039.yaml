id: itm.chm.o.energetics.0039
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.energetics.calorimetry
stem: 0.0100 mol of magnesium reacts with excess dilute acid. The 50.0 g of water (or solution) changes temperature from 19.0 °C to 41.0 °C. Take the specific heat capacity of water as 4.2 J/(g °C).
parts:
- id: a
  prompt: What is the enthalpy change, ΔH, in kJ/mol?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: -0.462 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_mass_of_reactant
      feedback: Q = mcΔT is about the water (or solution) whose temperature changed, so m is the mass of that water.
    - id: B
      text: -4.62 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_q_not_per_mole
      feedback: ΔH is per mole. Divide the energy in kJ by the number of moles that reacted.
    - id: C
      text: 462 kJ/mol
      correct: false
      misconception_id: mc.chm.o.energetics_calorimetry_sign
      feedback: The water gained the energy that the reaction lost, so ΔH for the reaction is negative when the water warms.
    - id: D
      text: -462 kJ/mol
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: First find the energy the water took in or gave out, then share it per mole.
  - rung: 2
    name: concept
    text:
      en: Q = m × c × ΔT, with m the mass of water; ΔH = −Q ÷ moles (negative when the water warms).
  - rung: 3
    name: first_step
    text:
      en: ΔT = 22 °C, so Q = 50.0 × 4.2 × ΔT = 4620 J = 4.62 kJ.
  - rung: 4
    name: worked_step
    text:
      en: Divide 4.62 kJ by 0.0100 mol and decide the sign.
  - rung: 5
    name: full_step
    text:
      en: ΔH = -462 kJ/mol.
  misconception_ids:
  - mc.chm.o.energetics_calorimetry_sign
  - mc.chm.o.energetics_q_not_per_mole
  - mc.chm.o.energetics_mass_of_reactant
solution:
  steps:
  - n: 1
    latex: Q = 50.0 \times 4.2 \times 22 = 4620\ \text{J}
    reason: Energy taken in by the water
    check_id: chk_build_chm_energetics_0039_dh
  - n: 2
    latex: Q = 4.62\ \text{kJ}
