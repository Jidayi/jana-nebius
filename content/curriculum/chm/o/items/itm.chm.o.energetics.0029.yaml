  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: List the bonds that break and the bonds that form in CH₄ + 2O₂ → CO₂ + 2H₂O.
  - rung: 2
    name: concept
    text:
      en: Breaking bonds takes energy in; forming bonds gives energy out. ΔH = broken − formed.
  - rung: 3
    name: first_step
    text:
      en: 'Bonds broken: four C–H and two O=O, a total of 2648 kJ/mol.'
  - rung: 4
    name: worked_step
    text:
      en: 'Bonds formed: two C=O and four O–H, a total of 3466 kJ/mol. Subtract.'
  - rung: 5
    name: full_step
    text:
      en: ΔH = 2648 − 3466 = -818 kJ/mol.
  misconception_ids:
