stem: Natural gas, mainly methane, is burned in a plentiful supply of air in a modern boiler.
parts:
- id: a
  prompt: Does this still add to climate change?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: true
    options:
    - id: A
      text: No, because a plentiful supply of air stops any gas being made
      correct: false
    - id: B
      text: Yes, because it makes a hole in the ozone layer
      correct: false
      misconception_id: mc.chm.o.environment_greenhouse_ozone_confused
      feedback: These are two different problems. The ozone layer stops harmful ultraviolet light; damage to it raises the risk of skin cancer. Global warming is caused by greenhouse gases trapping heat (infrared) given off by the Earth.
    - id: C
      text: Yes, because complete combustion still gives carbon dioxide
      correct: true
    - id: D
      text: No, because complete combustion gives only water
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Write the products of the complete combustion of a hydrocarbon.
  - rung: 2
    name: concept
    text:
      en: Complete combustion gives carbon dioxide and water.
  - rung: 3
    name: first_step
    text:
      en: Plenty of air prevents carbon monoxide and soot, but not carbon dioxide.
  - rung: 4
    name: worked_step
    text:
      en: Carbon dioxide is a greenhouse gas.
  - rung: 5
    name: full_step
    text:
      en: 'Yes: CH₄ + 2O₂ → CO₂ + 2H₂O, and the carbon dioxide adds to the greenhouse effect.'
  misconception_ids:
  - mc.chm.o.environment_greenhouse_ozone_confused
