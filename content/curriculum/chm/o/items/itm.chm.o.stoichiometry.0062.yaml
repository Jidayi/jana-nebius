id: itm.chm.o.stoichiometry.0062
version: 0.1.0
type: mcq_diagnostic
subject: chm
level: o
kc_ids:
- kc.chm.o.stoichiometry.reacting_masses
stem: Potassium chlorate decomposes on heating. The equation is 2KClO₃ → 2KCl + 3O₂.
parts:
- id: a
  prompt: What mass of O₂ forms from 25.0 g of KClO₃?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: true
    options:
    - id: A
      text: 4.35 g
      correct: false
      misconception_id: mc.chm.o.ratio_inverted
      feedback: 'Write the ratio as ''wanted : given'' from the equation, then multiply the given amount by wanted ÷ given.'
    - id: B
      text: 6.53 g
      correct: false
      misconception_id: mc.chm.o.ratio_ignored
      feedback: 'Read the ratio from the balanced equation: the numbers in front of the formulae tell you how many moles of each react or form.'
    - id: C
      text: 9.80 g
      correct: true
    - id: D
      text: 37.5 g
      correct: false
      misconception_id: mc.chm.o.mass_ratio_as_mole_ratio
      feedback: 'The equation counts particles, not grams: 2 g of hydrogen does not make 2 g of water. Convert the mass to moles first.'
  hints:
  - rung: 1
    name: orient
    text:
      en: Go from mass of KClO₃ to moles, use the equation, then go back to mass of O₂.
  - rung: 2
    name: concept
    text:
      en: The numbers in a balanced equation are a ratio of moles, never of grams.
  - rung: 3
    name: first_step
    text:
      en: Moles of KClO₃ = 25.0 ÷ 122.5 = 0.204 mol.
  - rung: 4
    name: worked_step
    text:
      en: 'The equation gives 2 KClO₃ : 3 O₂, so moles of O₂ = 0.306 mol.'
  - rung: 5
    name: full_step
    text:
      en: Mass of O₂ = 0.306 × 32 = 9.80 g.
  misconception_ids:
  - mc.chm.o.ratio_ignored
  - mc.chm.o.mass_ratio_as_mole_ratio
  - mc.chm.o.ratio_inverted
solution:
  steps:
  - n: 1
    latex: n(\text{KClO}_3) = \frac{25.0}{122.5} = 0.204
    reason: Moles of the given substance
    check_id: chk_build_chm_stoichiometry_0062_ma
  - n: 2
    latex: '\text{KClO}_3 : \text{O}_2 = 2 : 3'
    reason: Ratio from the equation
    check_id: chk_build_chm_stoichiometry_0062_coef
  - n: 3
    latex: n(\text{O}_2) = 0.306
    reason: Mole ratio from the equation
    check_id: chk_build_chm_stoichiometry_0062_chain
  - n: 4
    latex: m(\text{O}_2) = 0.306 \times 32 = 9.80\ \text{g}
    reason: Back to mass
    check_id: chk_build_chm_stoichiometry_0062_mb
