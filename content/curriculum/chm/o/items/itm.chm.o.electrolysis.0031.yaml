stem: 'In the aluminium cell, aluminium ions are discharged at the cathode: Al³⁺ + ne⁻ → Al.'
parts:
- id: a
  prompt: How many electrons, n, are in the balanced half-equation?
  marks: 1
  answer:
    kind: numeric
    value: '3'
