  - rung: 1
    name: orient
    text:
      en: Electrons balance the charge in a half-equation.
  - rung: 2
    name: concept
    text:
      en: The total charge on the left must equal the total charge on the right.
  - rung: 3
    name: first_step
    text:
      en: On the right there is a neutral aluminium atom, with zero charge.
  - rung: 4
    name: worked_step
    text:
      en: Each electron carries one negative charge. How many cancel the charge on one aluminium ion?
  - rung: 5
    name: full_step
    text:
      en: 'Al³⁺ + 3e⁻ → Al: n = 3, so the charges balance.'
  misconception_ids:
