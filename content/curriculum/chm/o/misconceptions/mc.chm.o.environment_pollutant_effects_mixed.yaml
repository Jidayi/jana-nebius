student_name: Giving a pollutant another pollutant's effect
description: 'Mixes up the effects or sources of air pollutants: thinks carbon monoxide causes acid rain, sulfur dioxide poisons the blood, or carbon monoxide comes from complete combustion.'
signatures:
- kind: answer_transform
  expression: 'choice: pollutant given the source or effect of a different pollutant'
fix:
  strategy: contrast_example
  text:
    en: 'Learn each pollutant as a pair: source and effect. Carbon monoxide comes from incomplete combustion and is toxic. Sulfur dioxide comes from burning fuels that contain sulfur and causes acid rain. Oxides of nitrogen come from car engines and also cause acid rain. Particulates come from incomplete combustion, especially in diesel engines, and harm the lungs.'
