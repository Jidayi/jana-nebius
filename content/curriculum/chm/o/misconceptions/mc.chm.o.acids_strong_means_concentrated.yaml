student_name: Strong means concentrated
description: Uses 'strong' to mean 'concentrated' and 'weak' to mean 'dilute', so thinks adding water makes a strong acid weak, or that acids of equal concentration behave the same.
signatures:
- kind: answer_transform
  expression: 'choice: strength explained by concentration'
fix:
  strategy: contrast_example
  text:
    en: Strength is about how fully an acid ionises in water. Concentration is about how much acid is in each dm³. A dilute solution of hydrochloric acid is still a strong acid; a concentrated solution of ethanoic acid is still a weak acid.
