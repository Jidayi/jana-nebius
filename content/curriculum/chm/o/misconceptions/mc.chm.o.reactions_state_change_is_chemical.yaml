student_name: Changing state makes a new substance
description: Classes melting, boiling, freezing or condensing as chemical changes, as if ice, liquid water and steam were different substances.
signatures:
- kind: answer_transform
  expression: 'choice: a change of state classed as a chemical change'
fix:
