student_name: Counting the wrong atoms for the prefix
description: 'Takes the prefix from the wrong count: only the carbons written before –COOH (missing the carbon in the group), or the number of hydrogen atoms, instead of every carbon atom.'
signatures:
- kind: answer_transform
  expression: 'choice: prefix taken from part of the carbon chain or from the hydrogen count'
fix:
  strategy: rule_restatement
  text:
    en: The prefix counts every carbon atom in the molecule, including the carbon inside –COOH. CH₃COOH has two carbon atoms, so it is ethanoic acid. Hydrogen atoms never set the prefix.
