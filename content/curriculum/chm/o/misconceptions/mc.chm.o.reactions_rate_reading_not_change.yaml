student_name: Using a reading instead of the change
description: For an interval that does not start at zero, divides the reading at the end of the interval by the time taken, instead of the change between the two readings.
signatures:
- kind: answer_transform
  expression: reading_end / (t_end - t_start)
fix:
  strategy: simpler_numbers
  text:
    en: Gas collected before the interval began was not made during it. Subtract the earlier reading from the later one first, then divide that change by the time taken.
