id: mc.chm.o.reactions_new_substance_missed
kc_ids:
- kc.chm.o.reactions.physical_chemical_change
student_name: Heated or reversible means only physical
description: Calls a change physical because heat started it, because it looks like melting, or because it can be reversed, and misses the signs that a new substance has formed.
signatures:
- kind: answer_transform
  expression: 'choice: a change that makes a new substance classed as physical'
fix:
  strategy: rule_restatement
  text:
    en: 'Ask one question: has a new substance formed? Signs are a gas given off, a new solid, a new colour, or heat given out or taken in. Burning, rusting, cooking and breaking down by heat all make new substances, so they are chemical changes even when heat started them.'
