problem: Excess magnesium is added to 50.0 cm³ of 0.200 mol/dm³ ethanoic acid, a weak acid. How many moles of hydrogen form in the end?
steps:
- n: 1
  latex: n(\text{acid}) = 0.200 \times \frac{50.0}{1000} = 0.0100
  reason: Moles of acid
  check_id: chk_build_chm_acids_w0005_c
- n: 2
  latex: \text{Mg} + 2\text{CH}_3\text{COOH} \rightarrow \text{Mg(CH}_3\text{COO)}_2 + \text{H}_2
  reason: Two moles of acid give one mole of hydrogen
  check_id: chk_build_chm_acids_w0005_s2
- n: 3
  latex: n(\text{H}_2) = \frac{0.0100}{2}
  reason: The total depends on the amount of acid, not its strength
  check_id: chk_build_chm_acids_w0005_s3
final_answer:
  latex: 0.00500\ \text{mol}
  check_id: chk_build_chm_acids_w0005_c
