problem: An aluminium cell runs at 10.0 A for 2895 s (Al³⁺ + 3e⁻ → Al; 96500 C per mole of electrons). Find the mass of aluminium formed.
steps:
- n: 1
  latex: Q = 10.0 \times 2895 = 28950\ \text{C}
  reason: Charge = current × time
  check_id: chk_build_chm_electrolysis_w0010_m
- n: 2
  latex: n(e^-) = \frac{28950}{96500} = 0.300\ \text{mol}
  reason: Divide by the Faraday constant
  check_id: chk_build_chm_electrolysis_w0010_e
- n: 3
  latex: n(\text{Al}) = \frac{0.300}{3} = 0.100\ \text{mol}
  reason: 3 mol of electrons per mol of aluminium
  check_id: chk_build_chm_electrolysis_w0010_n
- n: 4
  latex: m = 0.100 \times 27
  reason: Moles to mass
  check_id: chk_build_chm_electrolysis_w0010_s4
final_answer:
  latex: 2.70\ \text{g}
  check_id: chk_build_chm_electrolysis_w0010_m
