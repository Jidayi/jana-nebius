id: wex.chm.o.organic.0016
kc_ids:
- kc.chm.o.organic.combustion
problem: Write the balanced equation for the complete combustion of ethanol, C₂H₅OH, and give the number of O₂ molecules needed.
steps:
- n: 1
  latex: '\text{one }\text{C}_2\text{H}_5\text{OH}: 2\text{CO}_2 + 3\text{H}_2\text{O}'
  reason: Balance carbon, then hydrogen
  check_id: chk_build_chm_organic_w0016_one
- n: 2
  latex: 2 \times 2 + 3 = 7
  reason: Oxygen atoms on the right
  check_id: chk_build_chm_organic_w0016_oright
- n: 3
  latex: 7 - 1 = 6
  reason: Ethanol supplies one oxygen atom
  check_id: chk_build_chm_organic_w0016_oneed
- n: 4
  latex: \text{C}_2\text{H}_5\text{OH} + 3\text{O}_2 \rightarrow 2\text{CO}_2 + 3\text{H}_2\text{O}
  reason: Balanced equation
  check_id: chk_build_chm_organic_w0016_bal
final_answer:
  latex: 3\text{O}_2
  check_id: chk_build_chm_organic_w0016_ratios
fading_order:
- 4
- 3
- 2
- 1
