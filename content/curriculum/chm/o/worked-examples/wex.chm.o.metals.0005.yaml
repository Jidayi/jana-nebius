problem: 6.5 g of zinc is added to excess copper(II) sulfate solution. Decide whether a reaction happens and find the mass of copper formed (Zn + CuSO₄ → ZnSO₄ + Cu).
steps:
- n: 1
  latex: \text{zinc is above copper, so it displaces copper}
  reason: Reactivity series
- n: 2
  latex: n(\text{Zn}) = \frac{6.5}{65} = 0.100\ \text{mol}
  reason: Mass to moles
  check_id: chk_build_chm_metals_w0005_ma
- n: 3
  latex: '\text{Zn} : \text{Cu} = 1 : 1'
  reason: Ratio from the equation
  check_id: chk_build_chm_metals_w0005_coef
- n: 4
  latex: n(\text{Cu}) = 0.100\ \text{mol}
  reason: Mole ratio from the equation
  check_id: chk_build_chm_metals_w0005_chain
- n: 5
  latex: m = 0.100 \times 64
  reason: Moles to mass
  check_id: chk_build_chm_metals_w0005_s5
final_answer:
  latex: 6.40\ \text{g of copper}
  check_id: chk_build_chm_metals_w0005_chain
