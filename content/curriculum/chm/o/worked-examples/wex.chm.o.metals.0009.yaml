problem: Aluminium is above carbon, so it is extracted by electrolysis of molten aluminium oxide. An aluminium atom has 13 electrons and an aluminium ion has 10. How many electrons must each aluminium ion gain at the cathode to become an atom?
steps:
- n: 1
  latex: '\text{Al above C: carbon cannot reduce it, so use electrolysis}'
  reason: Choice of method
- n: 2
  latex: 13 - 10 = 3
  reason: Electrons the ion is missing
  check_id: chk_build_chm_metals_w0009_e
- n: 3
  latex: \text{Al}^{3+} + 3\text{e}^- \rightarrow \text{Al}
  reason: Reduction at the cathode
  check_id: chk_build_chm_metals_w0009_s3
final_answer:
  latex: 3\ \text{electrons}
  check_id: chk_build_chm_metals_w0009_e
