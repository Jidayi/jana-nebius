- n: 4
  latex: n(\text{Ag}) = 0.100\ \text{mol}
  reason: Mole ratio from the equation
  check_id: chk_build_chm_metals_w0006_chain
- n: 5
  latex: m = 0.100 \times 108
  reason: Moles to mass
  check_id: chk_build_chm_metals_w0006_s5
final_answer:
  latex: 10.8\ \text{g of silver}
  check_id: chk_build_chm_metals_w0006_chain
