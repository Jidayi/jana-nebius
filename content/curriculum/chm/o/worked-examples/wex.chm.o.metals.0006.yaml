- n: 1
  latex: \text{magnesium is above silver, so it displaces silver}
  reason: Reactivity series
- n: 2
  latex: n(\text{Mg}) = \frac{1.2}{24} = 0.0500\ \text{mol}
  reason: Mass to moles
