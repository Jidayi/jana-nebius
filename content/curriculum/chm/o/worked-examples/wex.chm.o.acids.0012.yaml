problem: 25.0 cm³ of 0.100 mol/dm³ sulfuric acid is neutralised by 20.0 cm³ of potassium hydroxide solution (H₂SO₄ + 2KOH → K₂SO₄ + 2H₂O). Find the concentration of the potassium hydroxide.
steps:
- n: 1
  latex: n(\text{acid}) = 0.100 \times \frac{25.0}{1000} = 0.00250
  reason: Moles of acid
  check_id: chk_build_chm_acids_w0012_ab
- n: 2
  latex: n(\text{base}) = 2 \times 0.00250 = 0.00500
  reason: 'Mole ratio 1 : 2'
  check_id: chk_build_chm_acids_w0012_ab
- n: 3
  latex: c = \frac{0.00500}{20.0 \div 1000}
  reason: Amount over volume in dm³
  check_id: chk_build_chm_acids_w0012_s3
final_answer:
  latex: c = 0.250\ \text{mol/dm}^3
  check_id: chk_build_chm_acids_w0012_r
