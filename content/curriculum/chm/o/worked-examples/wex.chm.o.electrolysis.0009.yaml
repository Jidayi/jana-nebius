problem: Copper(II) sulfate solution is electrolysed with a current of 4.0 A for 965 s (Cu²⁺ + 2e⁻ → Cu; 96500 C per mole of electrons). Find the mass of copper deposited.
steps:
- n: 1
  latex: Q = 4.0 \times 965 = 3860\ \text{C}
  reason: Charge = current × time
  check_id: chk_build_chm_electrolysis_w0009_m
- n: 2
  latex: n(e^-) = \frac{3860}{96500} = 0.0400\ \text{mol}
  reason: Divide by the Faraday constant
  check_id: chk_build_chm_electrolysis_w0009_e
- n: 3
  latex: n(\text{Cu}) = \frac{0.0400}{2} = 0.0200\ \text{mol}
  reason: 2 mol of electrons per mol of copper
  check_id: chk_build_chm_electrolysis_w0009_n
- n: 4
  latex: m = 0.0200 \times 64
  reason: Moles to mass
  check_id: chk_build_chm_electrolysis_w0009_s4
final_answer:
  latex: 1.28\ \text{g}
  check_id: chk_build_chm_electrolysis_w0009_m
