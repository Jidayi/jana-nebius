problem: A brass door handle has a mass of 250 g. The brass is 70% copper and 30% zinc by mass. What mass of zinc does it contain, and why is brass used rather than pure copper?
steps:
- n: 1
  latex: \text{brass is a mixture, so its make-up is given as percentages}
  reason: Alloys are mixtures
- n: 2
  latex: \frac{30}{100} \times 250 = 75
  reason: Zinc's share of the mass
  check_id: chk_build_chm_metals_w0003_zn
- n: 3
  latex: \text{zinc atoms disrupt the copper layers, so brass is harder}
  reason: Why the alloy is used
final_answer:
  latex: 75\ \text{g of zinc}
  check_id: chk_build_chm_metals_w0003_zn
