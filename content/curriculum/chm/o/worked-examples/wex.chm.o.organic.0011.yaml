problem: 90 g of glucose is fermented completely by yeast, with air kept out (C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂). What mass of ethanol forms?
steps:
- n: 1
  latex: M_r(\text{C}_6\text{H}_{12}\text{O}_6) = 180
  reason: Glucose
  check_id: chk_build_chm_organic_w0011_g
- n: 2
  latex: n = \frac{90}{180} = 0.5\ \text{mol}
  reason: Moles of glucose
  check_id: chk_build_chm_organic_w0011_c
- n: 3
  latex: 2 \times 0.5 = 1\ \text{mol}
  reason: Two ethanol per glucose
  check_id: chk_build_chm_organic_w0011_c
- n: 4
  latex: M_r(\text{C}_2\text{H}_5\text{OH}) = 46
  reason: Ethanol
  check_id: chk_build_chm_organic_w0011_e
- n: 5
  latex: 1 \times 46
  reason: Mass of ethanol
  check_id: chk_build_chm_organic_w0011_c
final_answer:
  latex: 46\ \text{g}
  check_id: chk_build_chm_organic_w0011_c
