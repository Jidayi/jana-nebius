problem: A reaction takes 80 s to finish at 30 °C. Assume that its rate doubles for every 10 °C rise in temperature. Estimate how long it takes at 50 °C.
steps:
- n: 1
  latex: 50 - 30 = 20\ ^\circ\text{C}
  reason: Two rises of 10 °C
  check_id: chk_build_chm_reactions_w0004_dtemp
- n: 2
  latex: \text{rate} \times 2 \times 2 = \text{rate} \times 4
  reason: The rate doubles twice
  check_id: chk_build_chm_reactions_w0004_s2
- n: 3
  latex: t = \frac{80}{4} = 20\ \text{s}
  reason: 'Four times faster: a quarter of the time'
  check_id: chk_build_chm_reactions_w0004_t
final_answer:
  latex: t = 20\ \text{s}
  check_id: chk_build_chm_reactions_w0004_t
