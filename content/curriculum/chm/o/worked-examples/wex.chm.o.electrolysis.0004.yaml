problem: Aqueous copper(II) sulfate is electrolysed with inert electrodes. Name the products, and use the half-equations to find how many moles of copper form for each mole of oxygen.
steps:
- n: 1
  latex: '\text{cathode: copper (Cu below H)}'
  reason: Copper ions are discharged
- n: 2
  latex: '\text{anode: oxygen (no halide)}'
  reason: Hydroxide ions are discharged
- n: 3
  latex: 4\text{OH}^{-} \rightarrow \text{O}_2 + 2\text{H}_2\text{O} + 4e^{-}
  reason: Four electrons per oxygen molecule
  check_id: chk_build_chm_electrolysis_w0004_s3
- n: 4
  latex: \text{Cu}^{2+} + 2e^{-} \rightarrow \text{Cu}
  reason: Two electrons per copper atom
  check_id: chk_build_chm_electrolysis_w0004_s4
- n: 5
  latex: \frac{4}{2} = 2
  reason: Copper atoms made by four electrons
  check_id: chk_build_chm_electrolysis_w0004_r
final_answer:
  latex: 2\ \text{mol of copper per mol of oxygen}
  check_id: chk_build_chm_electrolysis_w0004_r
