problem: 25.0 cm³ of 0.100 mol/dm³ hydrochloric acid is neutralised by 22.5 cm³ of sodium hydroxide solution (HCl + NaOH → NaCl + H₂O). Find the concentration of the sodium hydroxide.
steps:
- n: 1
  latex: n(\text{acid}) = 0.100 \times \frac{25.0}{1000} = 0.00250
  reason: Moles of acid
  check_id: chk_build_chm_acids_w0011_ab
- n: 2
  latex: n(\text{base}) = 0.00250 = 0.00250
  reason: 'Mole ratio 1 : 1'
  check_id: chk_build_chm_acids_w0011_ab
- n: 3
  latex: c = \frac{0.00250}{22.5 \div 1000}
  reason: Amount over volume in dm³
  check_id: chk_build_chm_acids_w0011_s3
final_answer:
  latex: c = 0.111\ \text{mol/dm}^3
  check_id: chk_build_chm_acids_w0011_r
