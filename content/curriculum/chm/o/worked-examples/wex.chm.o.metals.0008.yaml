problem: A zinc block of mass 5.2 kg is bolted to a steel boat. The zinc loses 1.3 kg each year. Why does the zinc protect the steel, and after how many years must the block be replaced?
steps:
- n: 1
  latex: \text{zinc is more reactive than iron, so it corrodes instead}
  reason: Sacrificial protection
- n: 2
  latex: \frac{5.2}{1.3} = 4
  reason: Years until the zinc is used up
  check_id: chk_build_chm_metals_w0008_years
final_answer:
  latex: 4\ \text{years}
  check_id: chk_build_chm_metals_w0008_years
