  latex: \text{Cu}^{2+} + 2e^{-} \rightarrow \text{Cu}
  reason: Pure copper on the cathode
  check_id: chk_build_chm_electrolysis_w0008_s2
- n: 3
  latex: 3.20 - 3.00 = 0.20
  reason: The rest of the lost mass is impurities
  check_id: chk_build_chm_electrolysis_w0008_m
final_answer:
  latex: 0.20\ \text{g of impurities (sludge and dissolved ions)}
  check_id: chk_build_chm_electrolysis_w0008_m
