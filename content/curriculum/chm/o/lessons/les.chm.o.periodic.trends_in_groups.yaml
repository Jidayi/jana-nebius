title: Trends down Group I and Group VII
estimated_minutes: 14
blocks:
- type: prior_knowledge
  item_ids:
  - itm.chm.o.periodic.0006
- type: idea
  text:
    en: 'Elements in a group have the same number of outer electrons, so they react in similar ways, but not equally. Group I metals lose their one outer electron. Lower down the group that electron is further from the nucleus and is lost more easily, so reactivity increases: potassium reacts more violently with water than sodium. Halogens in Group VII gain one electron. Lower down the extra electron is attracted less strongly, so reactivity decreases. A more reactive halogen displaces a less reactive one from its salt.'
- type: worked_example
  worked_example_id: wex.chm.o.periodic.0005
- type: guided_step
  item_id: itm.chm.o.periodic.0025
- type: quick_check
  item_ids:
  - itm.chm.o.periodic.0013
  - itm.chm.o.periodic.0029
- type: common_mistakes
  text:
    en: 'The two groups have opposite trends: Group I gets more reactive going down, Group VII less. In a displacement the less reactive halogen is the one set free.'
  misconception_ids:
  - mc.chm.o.periodic_halogen_reactivity_increases
  - mc.chm.o.periodic_group1_reactivity_decreases
  - mc.chm.o.periodic_displacement_reversed
- type: exit_check
