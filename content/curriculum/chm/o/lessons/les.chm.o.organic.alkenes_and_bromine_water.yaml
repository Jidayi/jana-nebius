id: les.chm.o.organic.alkenes_and_bromine_water
node_id: cur.chm.o.organic_chemistry.alkenes
kc_ids:
- kc.chm.o.organic.alkanes_and_alkenes
title: Alkenes and the bromine water test
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'Compare how many hydrogen atoms each compound has for each carbon atom. Try this before any rule: which one has the fewest hydrogens for each carbon?'
  item_id: itm.chm.o.organic.0057
  action: try_first
  why:
    en: C₃H₆ has exactly twice as many hydrogens as carbons, so it fits CₙH₂ₙ and has a C=C double bond. The others have only single bonds.
  names:
    en: Hydrocarbons with a C=C double bond are alkenes, and they are unsaturated. Alkanes have only single bonds and are saturated.
- type: step
  text:
    en: 'Bromine water is orange. Predict: which tube will lose its colour, the alkene or the alkane?'
  item_id: itm.chm.o.organic.0049
  action: predict
  why:
    en: Bromine adds across the C=C bond in propene, so the orange colour disappears. Propane has no double bond, so the bromine water stays orange.
  names:
    en: 'That is the test for an alkene: bromine water turns from orange to colourless.'
- type: step
  text:
    en: When bromine reacts with an alkene, the double bond opens and both bromine atoms join on. Think about how many products that makes.
  item_id: itm.chm.o.organic.0050
  action: choose
  why:
    en: Ethene and bromine join into one product, C₂H₄Br₂, and the orange colour goes. Nothing is swapped out, so no HBr forms.
  names:
    en: A reaction where atoms join across a double bond to make a single product is an addition reaction.
- type: step
  text:
    en: Same idea, less help this time. Look for the formulas that fit the alkene pattern.
  item_id: itm.chm.o.organic.0051
  action: choose
  why:
    en: C₃H₆ and C₂H₄ fit CₙH₂ₙ, so they have a C=C bond and decolourise bromine water. The alkanes do not react with it quickly at room temperature.
- type: step
  text:
    en: 'Now one on your own: alkanes can react with chlorine, but only in ultraviolet light.'
  item_id: itm.chm.o.organic.0059
  action: choose
  why:
    en: A chlorine atom swaps places with a hydrogen atom, so both CH₃Cl and HCl form. A swap like this is a substitution reaction, unlike the addition reactions of alkenes.
- type: check
  item_ids:
  - itm.chm.o.organic.0052
  - itm.chm.o.organic.0055
  - itm.chm.o.organic.0058
