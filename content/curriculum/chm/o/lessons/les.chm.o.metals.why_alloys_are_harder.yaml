title: Why alloys are harder
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'Steel, brass and bronze are made by melting a metal with other elements and letting the mix set. Try this before any rule: what kind of substance is the result?'
  item_id: itm.chm.o.metals.0014
  action: try_first
  why:
    en: The elements are mixed, not chemically joined, so there is no fixed formula. That makes it a mixture, not a compound.
  names:
    en: A mixture of a metal with one or more other elements is called an alloy.
- type: step
  text:
    en: Many alloys have common names. Which two elements make plain steel?
  item_id: itm.chm.o.metals.0019
  action: choose
  why:
    en: Steel is mostly iron with a small amount of carbon mixed in.
- type: step
  text:
    en: 'In pure iron the atoms sit in neat layers that slide over each other easily. Predict: will adding carbon atoms make it harder or softer?'
  item_id: itm.chm.o.metals.0015
  action: predict
  why:
    en: The carbon atoms are a different size and break up the neat layers, so the layers cannot slide easily. The bonds do not get stronger and no compound forms.
  names:
    en: Atoms of a different size stopping the layers sliding is why most alloys are harder than the pure metal.
- type: step
  text:
    en: 'Same idea, less help: read the picture of bronze.'
  item_id: itm.chm.o.metals.0016
  action: choose
  why:
    en: The larger tin atoms distort the rows, so the layers are locked in place. That makes bronze harder, not softer, than copper.
- type: step
  text:
    en: 'Now one on your own: why is brass harder than pure copper?'
  item_id: itm.chm.o.metals.0013
  action: choose
  why:
    en: Zinc atoms of a different size disrupt the copper layers so they cannot slide. Brass is a mixture, not a compound, and the zinc does not weaken it.
- type: check
