title: Rusting and how to stop it
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'Three iron nails are kept in different conditions for a week. Try this before any rule: which ones do you think rust?'
  item_id: itm.chm.o.metals.0036
  action: try_first
  why:
    en: Only the nail in tube A has both water and air. Boiled water under oil has no air, and the drying agent takes away the water.
  names:
    en: Iron needs both water and oxygen from the air to rust. Rust is hydrated iron(III) oxide.
- type: step
  text:
    en: Rust is a word for iron and steel only. Other metals may corrode, but they do not rust.
  item_id: itm.chm.o.metals.0039
  action: choose
  why:
    en: Only the steel chain contains iron, so only it rusts. Aluminium, copper and gold do not form rust.
- type: step
  text:
    en: Paint, oil and plastic stop rust by keeping water and air away from the iron.
  item_id: itm.chm.o.metals.0041
  action: choose
  why:
    en: A moving chain would crack the paint off. Oil still keeps out water and air, and it lubricates the chain too.
  names:
    en: A coating that keeps out water and air gives barrier protection.
- type: step
  text:
    en: 'A scratch lets water and air reach the steel. Predict: will a scratched zinc coating still protect it?'
  item_id: itm.chm.o.metals.0037
  action: predict
  why:
    en: Zinc is more reactive than iron, so the zinc corrodes instead and the iron is spared.
  names:
    en: A more reactive metal that corrodes in place of iron gives sacrificial protection.
- type: step
  text:
    en: Now one on your own. Remember which metal is more reactive here.
  item_id: itm.chm.o.metals.0045
  action: choose
  why:
    en: Tin is less reactive than iron, so it cannot corrode in its place. Once the tin is scratched, the iron is exposed and rusts.
- type: check
  item_ids:
  - itm.chm.o.metals.0038
  - itm.chm.o.metals.0042
  - itm.chm.o.metals.0044
