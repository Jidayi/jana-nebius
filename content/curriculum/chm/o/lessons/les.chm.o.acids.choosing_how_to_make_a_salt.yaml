title: Choosing how to make a salt
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'A base that does not dissolve can be added to an acid until some is left at the bottom. Try this before any rule: why add so much?'
  item_id: itm.chm.o.acids.0056
  action: try_first
  why:
    en: Leftover solid means there is no acid left for it to react with. The extra solid is then easy to filter off.
  names:
    en: Adding an insoluble base, metal or carbonate in excess and then filtering is called the excess method. It makes a soluble salt.
- type: step
  text:
    en: A carbonate fizzes while it reacts with an acid. Look for the signs that the acid has run out.
  item_id: itm.chm.o.acids.0057
  action: choose
  why:
    en: When the acid is used up the fizzing stops and the extra carbonate stays as a solid.
- type: step
  text:
    en: 'Put the excess method together. Think about which part you keep after filtering: the liquid or the solid.'
  item_id: itm.chm.o.acids.0049
  action: choose
  why:
    en: The salt is dissolved in the filtrate, so that is what you crystallise. The solid on the paper is only leftover oxide, and no precipitate forms because the salt dissolves.
- type: step
  text:
    en: 'Here both starting chemicals dissolve, so any extra could not be filtered off. Predict: how could you add exactly the right amount?'
  item_id: itm.chm.o.acids.0050
  action: predict
  why:
    en: A titration finds the exact volumes that react. Mixing those volumes without indicator gives a pure salt solution to crystallise.
  names:
    en: This is the titration method. It is used when the base is a soluble alkali.
- type: step
  text:
    en: Now one on your own. This salt does not dissolve, so think about where it ends up.
  item_id: itm.chm.o.acids.0051
  action: choose
  why:
    en: Mixing two solutions makes the insoluble salt as a precipitate. You keep the residue, then wash and dry it.
  names:
    en: Making an insoluble salt by mixing two solutions is called precipitation.
- type: check
  item_ids:
  - itm.chm.o.acids.0052
  - itm.chm.o.acids.0059
  - itm.chm.o.acids.0060
