title: Diamond, graphite and silicon dioxide
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'Diamond and graphite are both pure carbon, with every atom joined to its neighbours by strong covalent bonds. Try this before any rule: what do they have in common?'
  item_id: itm.chm.o.atoms.0092
  action: try_first
  why:
    en: To melt either one you must break a huge number of strong covalent bonds, so both have a very high melting point.
  names:
    en: 'That is called a giant covalent structure: a huge network of atoms all held by strong covalent bonds, with no separate molecules.'
- type: step
  text:
    en: In graphite the atoms are arranged in flat layers. A carbon atom has four outer electrons, but in graphite not all of them are used for bonds.
  item_id: itm.chm.o.atoms.0091
  action: choose
  why:
    en: Each carbon atom in a layer bonds to three others, which leaves one outer electron spare.
- type: step
  text:
    en: Think about that spare electron on each carbon atom. Graphite has no ions and no small molecules.
  item_id: itm.chm.o.atoms.0086
  action: choose
  why:
    en: Each carbon atom has one spare electron. It can move along the layers and carry charge, so no bonds break and no ions are needed.
  names:
    en: An electron that is free to move instead of staying in one bond is called delocalised.
- type: step
  text:
    en: 'Same idea, less help. Predict: is graphite soft because its covalent bonds are weak, or for some other reason?'
  item_id: itm.chm.o.atoms.0088
  action: predict
  why:
    en: The bonds in each layer are strong. But the forces between layers are weak, so the layers slide.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.chm.o.atoms.0087
  action: choose
  why:
    en: To melt silicon dioxide you must break many strong bonds in its network. Carbon dioxide is small molecules with only weak forces between them.
- type: check
