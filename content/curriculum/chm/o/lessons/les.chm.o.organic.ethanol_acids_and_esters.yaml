title: Ethanol, ethanoic acid and esters
estimated_minutes: 12
blocks:
- type: step
  text:
    en: 'Yeast is alive, and it turns sugar into ethanol when it has no oxygen. Try this before any rule: what conditions would suit a living thing doing that job?'
  item_id: itm.chm.o.organic.0064
  action: try_first
  why:
    en: Yeast works best when warm, at about 30 °C, with air kept out. Too much heat kills the yeast, and air lets the ethanol turn sour.
  names:
    en: 'That is fermentation: yeast turns glucose into ethanol and carbon dioxide.'
- type: step
  text:
    en: 'Wine left open to the air slowly turns into vinegar. Predict: why does the flask need an air lock?'
  item_id: itm.chm.o.organic.0062
  action: predict
  why:
    en: With air, microbes oxidise the ethanol to ethanoic acid, the acid in vinegar. Nothing burns, and the yeast does not need oxygen to make ethanol.
- type: step
  text:
    en: Acidified potassium manganate(VII) is an oxidising agent. Here oxidation does not mean burning.
  item_id: itm.chm.o.organic.0063
  action: choose
  why:
    en: The ethanol is oxidised to ethanoic acid, and the purple colour fades as the manganate(VII) is used up. Burning to carbon dioxide and water would need a flame.
  names:
    en: 'Oxidising an alcohol makes a carboxylic acid: ethanol becomes ethanoic acid.'
- type: step
  text:
    en: An acid and an alcohol, warmed with a little concentrated sulfuric acid, make an ester and water. The ester name starts with the alcohol part and ends with the acid part.
  item_id: itm.chm.o.organic.0061
  action: choose
  why:
    en: Methanol gives the methyl part and ethanoic acid gives the ethanoate part, so the ester is methyl ethanoate. Water is the other product.
  names:
    en: Making an ester from an alcohol and a carboxylic acid is called esterification.
- type: step
  text:
    en: 'Now one on your own: work backwards from the name.'
  item_id: itm.chm.o.organic.0065
  action: choose
  why:
    en: Propyl comes from propanol, and ethanoate comes from ethanoic acid. The alcohol part always comes first in the name.
- type: check
  item_ids:
  - itm.chm.o.organic.0068
  - itm.chm.o.organic.0072
  - itm.chm.o.organic.0067
