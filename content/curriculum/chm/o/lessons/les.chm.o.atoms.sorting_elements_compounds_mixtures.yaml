title: Elements, compounds and mixtures
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'Look closely at the formula of each substance. Try this before any rule: which one is made of only one kind of atom?'
  item_id: itm.chm.o.atoms.0006
  action: try_first
  why:
    en: Nitrogen gas has only nitrogen atoms in it, even though they are joined in pairs. Each of the others has more than one kind of atom.
  names:
    en: 'That is called an element: a substance made of only one kind of atom.'
- type: step
  text:
    en: Some substances are just things stirred together, with nothing chemically joined. You can pull them apart without a reaction.
  item_id: itm.chm.o.atoms.0010
  action: choose
  why:
    en: Crude oil is many different substances mixed but not joined, so it can be separated by a physical method. The others are single substances.
  names:
    en: 'That is called a mixture: two or more substances together but not chemically joined.'
- type: step
  text:
    en: A compound has different elements chemically joined in a fixed ratio. Watch out for a gas made of pairs of the same atom, and for things that are only mixed.
  item_id: itm.chm.o.atoms.0001
  action: choose
  why:
    en: Water has hydrogen and oxygen bonded in a fixed ratio, so it is a compound. Oxygen gas has only one kind of atom, and air and steel are mixtures.
- type: step
  text:
    en: Same idea, less help this time.
  item_id: itm.chm.o.atoms.0003
  action: choose
  why:
    en: In sodium chloride two elements are bonded in a fixed ratio. Chlorine gas is an element, and salt solution and brass are mixtures.
- type: step
  text:
    en: 'Now one on your own. Predict first: is water an element, a compound or a mixture, and why?'
  item_id: itm.chm.o.atoms.0004
  action: predict
  why:
    en: Water is one substance, but it is made of two elements chemically joined in a fixed ratio, so it is a compound. It does not keep the properties of hydrogen and oxygen, so it is not a mixture.
- type: check
  item_ids:
  - itm.chm.o.atoms.0005
  - itm.chm.o.atoms.0002
  - itm.chm.o.atoms.0012
