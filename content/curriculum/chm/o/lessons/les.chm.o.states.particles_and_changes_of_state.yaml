  - itm.chm.o.states.0005
- type: idea
  text:
    en: Everything is made of particles that are always moving. In a solid they are close together in a regular pattern and vibrate. In a liquid they are still close but slide past each other. In a gas they are far apart and move quickly in all directions. Heating makes particles move faster. At the melting point a solid becomes a liquid; at the boiling point a liquid becomes a gas. Between the two fixed points the substance is a liquid.
