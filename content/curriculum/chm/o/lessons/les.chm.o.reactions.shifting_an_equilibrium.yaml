id: les.chm.o.reactions.shifting_an_equilibrium
node_id: cur.chm.o.chemical_reactions.reversible_reactions_and_equilibrium
kc_ids:
- kc.chm.o.reactions.equilibrium
title: Reversible reactions and equilibrium
estimated_minutes: 12
blocks:
- type: step
  text:
    en: 'In a closed container, a reversible reaction goes forwards and backwards at the same time. Try this before any rule: what is happening once the amounts stop changing?'
  item_id: itm.chm.o.reactions.0059
  action: try_first
  why:
    en: Both reactions keep going, but at the same rate, so what is made is used up just as fast and the amounts stay the same.
  names:
    en: 'That is called dynamic equilibrium: forward and backward reactions run at equal rates, so the amounts stay constant.'
- type: step
  text:
    en: If you change the conditions, the equilibrium shifts in the direction that works against your change. So adding a reactant makes the reaction use some of it up.
  item_id: itm.chm.o.reactions.0052
  action: choose
  why:
    en: Extra oxygen pushes the reaction to the right, which uses up sulfur dioxide as well, so there is less sulfur dioxide. The shift opposes the change instead of adding to it.
  names:
    en: The position of equilibrium always moves to oppose the change you make.
- type: step
  text:
    en: 'Higher pressure is opposed by making fewer gas molecules. Count the molecules on each side, then predict: left or right?'
  item_id: itm.chm.o.reactions.0050
  action: predict
  why:
    en: There are four gas molecules on the left and two on the right, so higher pressure moves the position to the right and more ammonia forms.
- type: step
  text:
    en: A catalyst speeds up a reaction. Think about which reaction it speeds up here.
  item_id: itm.chm.o.reactions.0056
  action: choose
  why:
    en: A catalyst speeds up both reactions by the same amount. So the mix gets to equilibrium sooner, but the position stays put.
- type: step
  text:
    en: Same idea, less help. Raising the temperature is opposed by the reaction that takes in heat. Predict which way the position moves.
  item_id: itm.chm.o.reactions.0049
  action: predict
  why:
    en: The forward reaction gives out heat, so the backward reaction takes it in. Raising the temperature favours the backward reaction and less ammonia is present.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.chm.o.reactions.0058
  action: choose
  why:
    en: A lower temperature would give more ammonia, but the reaction would be far too slow. So a middle temperature is a trade-off.
- type: check
  item_ids:
  - itm.chm.o.reactions.0051
  - itm.chm.o.reactions.0054
  - itm.chm.o.reactions.0057
