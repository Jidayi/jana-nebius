title: Energy in and energy out
estimated_minutes: 13
blocks:
- type: prior_knowledge
  item_ids:
  - itm.chm.o.energetics.0005
- type: idea
  text:
    en: Every reaction breaks bonds in the reactants and makes new bonds in the products. Breaking a bond takes energy in; making a bond gives energy out. If more energy comes out than goes in, the surroundings warm up and the reaction is exothermic, with a negative ΔH. If more goes in than comes out, the surroundings cool and the reaction is endothermic, with a positive ΔH. With bond energies, ΔH is the energy of bonds broken minus the energy of bonds formed.
- type: worked_example
  worked_example_id: wex.chm.o.energetics.0005
- type: guided_step
  item_id: itm.chm.o.energetics.0029
- type: quick_check
  item_ids:
  - itm.chm.o.energetics.0001
  - itm.chm.o.energetics.0030
- type: common_mistakes
  text:
    en: Breaking bonds needs energy; it never releases it. Work out ΔH as broken minus formed, and remember a warmer beaker means an exothermic reaction.
  misconception_ids:
  - mc.chm.o.energetics_breaking_releases
  - mc.chm.o.energetics_formed_minus_broken
  - mc.chm.o.energetics_temp_rise_endo
- type: exit_check
