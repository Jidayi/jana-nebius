title: How fast a reaction goes
estimated_minutes: 15
blocks:
- type: prior_knowledge
  item_ids:
  - itm.chm.o.reactions.0009
  - itm.chm.o.reactions.0005
- type: idea
  text:
    en: 'A reaction happens when reactant particles collide with at least the activation energy. Anything that makes these successful collisions more frequent speeds the reaction up. Higher concentration, higher gas pressure and a larger surface area (powder instead of lumps) bring more particles together, so collisions happen more often. Higher temperature makes particles move faster: they collide more often and many more collisions have enough energy. A catalyst gives a route with a lower activation energy and is not used up. None of these changes the total amount of product.'
- type: worked_example
  worked_example_id: wex.chm.o.reactions.0003
- type: guided_step
  item_id: itm.chm.o.reactions.0013
- type: quick_check
  item_ids:
  - itm.chm.o.reactions.0018
  - itm.chm.o.reactions.0026
- type: common_mistakes
  text:
    en: 'Smaller pieces, not bigger lumps, react faster. A catalyst is not used up. Most collisions do not lead to a reaction: only those with at least the activation energy do.'
  misconception_ids:
  - mc.chm.o.reactions_bigger_pieces_faster
  - mc.chm.o.reactions_catalyst_used_up
  - mc.chm.o.reactions_all_collisions_react
- type: exit_check
  item_ids:
  - itm.chm.o.reactions.0025
  - itm.chm.o.reactions.0027
- type: summary
  text:
    en: Rate rises with concentration, pressure, surface area, temperature and a catalyst. More frequent collisions, or more collisions with the activation energy, mean a faster reaction. The total product stays the same.
