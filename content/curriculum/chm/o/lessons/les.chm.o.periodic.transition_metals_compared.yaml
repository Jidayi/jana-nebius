id: les.chm.o.periodic.transition_metals_compared
node_id: cur.chm.o.the_periodic_table.transition_elements
kc_ids:
- kc.chm.o.periodic.transition_elements
title: Transition metals compared
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'Potassium is a Group I metal that is soft enough to cut with a knife. Try this before any rule: how might chromium, from the middle of the table, compare?'
  item_id: itm.chm.o.periodic.0047
  action: try_first
  why:
    en: Chromium is hard, dense and has a high melting point, while potassium is soft and light.
  names:
    en: The block of metals in the middle of the table are the transition elements. They are typically hard, dense and high melting.
- type: step
  text:
    en: Transition elements are metals, but they are not like Group I metals. Think about density and melting point.
  item_id: itm.chm.o.periodic.0037
  action: choose
  why:
    en: Iron is denser and melts at a much higher temperature than sodium. Group I metals are the soft, light, low-melting ones.
- type: step
  text:
    en: 'Predict: will a copper compound and a sodium compound give solutions of the same colour?'
  item_id: itm.chm.o.periodic.0038
  action: predict
  why:
    en: Compounds of transition elements are often coloured, so copper(II) sulfate is blue. Sodium compounds are white and give colourless solutions.
  names:
    en: Coloured compounds are a typical sign of a transition element.
- type: step
  text:
    en: 'Same idea, less help: one metal, two chlorides.'
  item_id: itm.chm.o.periodic.0039
  action: choose
  why:
    en: Iron can form ions with a 2+ charge and with a 3+ charge, so it makes two chlorides. A Group I metal forms only one kind of ion.
  names:
    en: Transition elements can form ions with different charges. The Roman numeral in a name gives the charge.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.chm.o.periodic.0040
  action: choose
  why:
    en: Iron and nickel speed up industrial reactions and are not used up. Being good catalysts is another typical property of transition elements.
- type: check
  item_ids:
  - itm.chm.o.periodic.0043
  - itm.chm.o.periodic.0046
  - itm.chm.o.periodic.0048
