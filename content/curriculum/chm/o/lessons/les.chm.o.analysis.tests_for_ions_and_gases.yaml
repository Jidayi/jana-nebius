- type: idea
  text:
    en: 'Chemists identify ions and gases from what they see in simple tests. For a cation, add aqueous sodium hydroxide: the colour of any precipitate, and whether it dissolves in excess, points to one ion. For an anion, choose the reagent first: silver nitrate for halides, barium nitrate for sulfate, dilute acid for carbonate. For a gas, use its own test: a lighted splint pops with hydrogen, a glowing splint relights in oxygen, limewater turns milky with carbon dioxide.'
