title: What metals are like
estimated_minutes: 12
blocks:
- type: step
  text:
    en: 'A copper wire carries a current for years and nothing in it gets used up. Try this before any rule: which particles in a metal are free to move?'
  item_id: itm.chm.o.metals.0004
  action: try_first
  why:
    en: Metal atoms share their outer electrons, and these delocalised electrons drift along the wire. The positive ions stay fixed in their places in the lattice.
  names:
    en: 'This is metallic bonding: a lattice of positive ions in a sea of delocalised electrons.'
- type: step
  text:
    en: A metal can be hammered flat without breaking. Use the same picture of ions and electrons.
  item_id: itm.chm.o.metals.0011
  action: choose
  why:
    en: The layers of ions slide over each other. The sea of electrons moves with them, so the bonding is never broken.
  names:
    en: A metal that can be hammered into shape is malleable; one that can be drawn into wire is ductile.
- type: step
  text:
    en: Most metals melt only when they are very hot. Think about what has to be pulled apart.
  item_id: itm.chm.o.atoms.0102
  action: choose
  why:
    en: The positive ions and the delocalised electrons attract each other strongly. A lot of energy is needed to overcome that attraction.
- type: step
  text:
    en: Metals react with other things too. Does every metal react with a dilute acid?
  item_id: itm.chm.o.metals.0026
  action: choose
  why:
    en: Zinc is above hydrogen in the reactivity series, so it gives off hydrogen with the acid. Copper is below hydrogen, so nothing happens.
  names:
    en: A metal that reacts with an acid gives a salt and hydrogen, never oxygen.
- type: step
  text:
    en: 'Now one on your own: look at what the oxide does to water.'
  item_id: itm.chm.o.metals.0012
  action: choose
  why:
    en: The oxide gives an alkaline solution, so it is a basic oxide. Metal oxides are basic, while many non-metal oxides are acidic.
- type: check
  item_ids:
  - itm.chm.o.metals.0027
  - itm.chm.o.metals.0030
  - itm.chm.o.atoms.0106
