title: Carboxylic acids and esters
estimated_minutes: 12
blocks:
- type: step
  text:
    en: 'Vinegar is safe to put on food, but hydrochloric acid would burn your mouth. Try this before any rule: which acid gives the higher pH at the same concentration?'
  item_id: itm.chm.o.organic.0067
  action: try_first
  why:
    en: Only some ethanoic acid molecules give off H⁺ ions, so there are fewer of them and the pH is higher. Hydrochloric acid gives off all its H⁺ ions.
  names:
    en: Ethanoic acid is a weak acid because it is only partly ionised in water.
- type: step
  text:
    en: A weak acid is still an acid. It reacts like other acids, only more slowly.
  item_id: itm.chm.o.organic.0066
  action: choose
  why:
    en: The acid reacts with the carbonate to make a salt and water, and carbon dioxide gas is given off. That gas makes the mixture fizz.
- type: step
  text:
    en: A carboxylic acid and an alcohol, warmed with a little concentrated sulfuric acid, make an ester and water. The ester name starts with the alcohol part and ends with the acid part.
  item_id: itm.chm.o.organic.0061
  action: choose
  why:
    en: Methanol gives the methyl part and ethanoic acid gives the ethanoate part, so the ester is methyl ethanoate. Water is the other product.
  names:
    en: Making an ester from an alcohol and a carboxylic acid is called esterification.
- type: step
  text:
    en: 'Now one on your own: work backwards from the name of the ester.'
  item_id: itm.chm.o.organic.0065
  action: choose
  why:
    en: Propyl comes from propanol, and ethanoate comes from ethanoic acid. The alcohol part always comes first in the name.
- type: check
