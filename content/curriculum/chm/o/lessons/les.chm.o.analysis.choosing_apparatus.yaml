id: les.chm.o.analysis.choosing_apparatus
node_id: cur.chm.o.experimental_techniques_and_chemical_ana.experimental_design
kc_ids:
- kc.chm.o.analysis.apparatus
title: Choosing the right apparatus
estimated_minutes: 8
blocks:
- type: step
  text:
    en: 'Some volumes need to be exact and some only need to be rough. Try this before any rule: how exact does this one need to be?'
  item_id: itm.chm.o.analysis.0011
  action: try_first
  why:
    en: Water for dissolving a solid only needs a rough volume, so a measuring cylinder is good enough.
  names:
    en: To choose apparatus, match the tool to what you measure and to how exact it must be.
- type: step
  text:
    en: A titration needs one exact volume of alkali in the flask. Beaker and cylinder markings are not accurate enough for that.
  item_id: itm.chm.o.analysis.0001
  action: choose
  why:
    en: A pipette gives one set volume, and it is very exact. A balance measures mass, not volume.
  names:
    en: A pipette gives one exact volume; a burette gives an accurate volume that can vary.
- type: step
  text:
    en: 'Same idea, less help this time. This volume is not fixed: you stop when the colour changes.'
  item_id: itm.chm.o.analysis.0002
  action: choose
  why:
    en: A burette lets you add acid a little at a time and read the volume accurately. A flask has only rough markings, and a balance measures mass.
- type: step
  text:
    en: 'Now the thing being measured is a gas. Predict: which instrument can collect a gas and show its volume?'
  item_id: itm.chm.o.analysis.0003
  action: predict
  why:
    en: A gas syringe collects the gas, and its plunger moves out to show the volume. A pipette is for liquids, and a beaker has no accurate scale.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.chm.o.analysis.0004
  action: choose
  why:
    en: Mass in grams is measured on a balance. Burettes and measuring cylinders measure volume, not mass.
- type: check
  item_ids:
  - itm.chm.o.analysis.0005
  - itm.chm.o.analysis.0006
  - itm.chm.o.analysis.0012
