title: Shared electrons and simple molecules
estimated_minutes: 12
blocks:
- type: step
  text:
    en: 'Two non-metal atoms both want more electrons, so neither will give one away. Try this before any rule: how could they hold together?'
  item_id: itm.chm.o.atoms.0069
  action: try_first
  why:
    en: Each atom puts one electron into a pair that both atoms share, and that shared pair holds them together.
  names:
    en: 'That is called a covalent bond: a pair of electrons shared between two atoms.'
- type: step
  text:
    en: A chlorine atom has seven outer electrons and wants eight, so each one shares a single pair. Count only the pairs that sit between the two atoms.
  item_id: itm.chm.o.atoms.0065
  action: choose
  why:
    en: Each chlorine atom shares one electron, giving one shared pair, which is a single bond. No electrons are handed over, and the outer electrons that are not shared do not count as bonds.
- type: step
  text:
    en: 'A nitrogen atom needs three more electrons to fill its outer shell. Predict: one shared pair, or more?'
  item_id: itm.chm.o.atoms.0062
  action: predict
  why:
    en: Each nitrogen atom shares three electrons, so the two atoms share three pairs, which is a triple bond.
  names:
    en: Two shared pairs make a double bond and three shared pairs make a triple bond.
- type: step
  text:
    en: 'Covalent bonds inside a molecule are strong, but the forces between separate molecules are weak. Predict: a low melting point and no conduction point to which structure?'
  item_id: itm.chm.o.atoms.0079
  action: predict
  why:
    en: Only the weak forces between molecules need to be overcome, so the melting point is low, and with no ions or free electrons nothing carries charge.
  names:
    en: A substance made of separate small molecules has a simple molecular structure.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.chm.o.atoms.0074
  action: choose
  why:
    en: When iodine melts, the molecules move apart but each I₂ molecule stays whole. Only the weak forces between molecules are overcome, not the covalent bonds.
- type: check
  item_ids:
  - itm.chm.o.atoms.0063
  - itm.chm.o.atoms.0075
  - itm.chm.o.atoms.0083
