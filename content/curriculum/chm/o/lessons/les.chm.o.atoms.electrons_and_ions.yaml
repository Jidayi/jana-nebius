title: Electron shells and ions
estimated_minutes: 12
blocks:
- type: prior_knowledge
  item_ids:
  - itm.chm.o.atoms.0018
- type: idea
  text:
    en: 'An atom has as many electrons as protons. The electrons sit in shells: the first holds two, the second eight and, for the first twenty elements, the third eight. The outer shell decides how an atom reacts. Atoms with one, two or three outer electrons, the metals, lose them and become positive ions. Atoms with six or seven outer electrons, the non-metals, gain electrons and become negative ions. Either way the ion ends with a full outer shell.'
