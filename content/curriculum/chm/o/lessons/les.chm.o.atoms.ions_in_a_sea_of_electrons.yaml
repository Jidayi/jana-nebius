title: How metal atoms hold together
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'In a metal, each atom lets go of its outer electrons, and those electrons are shared by the whole piece of metal. Try this before any rule: what is left behind, and where do the electrons go?'
  item_id: itm.chm.o.atoms.0105
  action: try_first
  why:
    en: Each sodium atom loses its outer electron and becomes a positive ion. The ions sit in rows, and the free electrons move all around them.
  names:
    en: 'That is called metallic bonding: the attraction between a lattice of positive ions and a sea of delocalised electrons.'
- type: step
  text:
    en: The delocalised electrons can move through the whole metal. Think about what moving charged particles can do.
  item_id: itm.chm.o.atoms.0104
  action: choose
  why:
    en: The free electrons can flow through the metal and carry charge. That is why a metal lets a current pass so well.
- type: step
  text:
    en: 'Two kinds of particle in copper are charged: the ions and the electrons. Only one kind is free to move.'
  item_id: itm.chm.o.atoms.0098
  action: choose
  why:
    en: The positive ions stay in fixed places. So the free electrons carry the current, not the ions or shared pairs.
- type: step
  text:
    en: 'Same idea, less help. Predict: does a metal bend because its bonds are weak?'
  item_id: itm.chm.o.atoms.0099
  action: predict
  why:
    en: Layers of ions slide past each other, but the sea of electrons still holds them together, so the metal changes shape without breaking. The bonding stays strong.
  names:
    en: A metal that can be hammered into shape without breaking is malleable.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.chm.o.atoms.0101
  action: choose
  why:
    en: Strong metallic bonding gives the high melting point, and the layers can still slide without breaking it, so iron is malleable too.
- type: check
