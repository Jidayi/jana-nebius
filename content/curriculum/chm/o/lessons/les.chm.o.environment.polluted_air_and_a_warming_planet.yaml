title: Polluted air and a warming planet
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'Petrol is made of carbon and hydrogen. Try this before any rule: what forms if it burns without enough air?'
  item_id: itm.chm.o.environment.0033
  action: try_first
  why:
    en: With too little oxygen, the carbon in petrol is only partly burned and gives carbon monoxide.
  names:
    en: 'Burning with too little oxygen is called incomplete combustion. Carbon monoxide is a poison: it stops blood carrying oxygen.'
- type: step
  text:
    en: Each pollutant has its own source and its own effect, and they are easy to mix up. Think about which element in coal ends up in acid rain.
  item_id: itm.chm.o.environment.0026
  action: choose
  why:
    en: Coal contains sulfur, which burns to sulfur dioxide, and that dissolves in rain to make it acidic. Carbon monoxide and soot do other kinds of harm.
- type: step
  text:
    en: 'Petrol has almost no nitrogen in it. Predict: where does the nitrogen in exhaust oxides come from?'
  item_id: itm.chm.o.environment.0025
  action: predict
  why:
    en: Air is mostly nitrogen. It is so hot in an engine that this nitrogen reacts with oxygen.
- type: step
  text:
    en: Now the climate. Greenhouse gases do not reflect sunlight, and they are not about the ozone layer.
  item_id: itm.chm.o.environment.0037
  action: choose
  why:
    en: The warm ground gives off infrared, and carbon dioxide and methane absorb it and send some back down. That keeps the Earth warmer.
  names:
    en: This is the greenhouse effect. More of these gases in the air leads to climate change.
- type: step
  text:
    en: 'Now one on your own: pick the action that cuts greenhouse gases, not other pollutants.'
  item_id: itm.chm.o.environment.0039
  action: choose
  why:
    en: Wind and solar power replace burning coal, so less carbon dioxide is made. The other actions deal with acid rain, the ozone layer, or a gas a converter cannot remove.
- type: check
  item_ids:
