title: Matching metals to jobs
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'A ring is worn every day and should still shine years later. Try this before any rule: what matters most about its metal?'
  item_id: itm.chm.o.metals.0005
  action: try_first
  why:
    en: Gold is very unreactive, so it does not tarnish and stays shiny.
  names:
    en: Each use needs a particular property. Choosing a metal means matching its properties to the job.
- type: step
  text:
    en: House wiring has to carry a current and be made into long, thin wires. Pick the properties that do both.
  item_id: itm.chm.o.metals.0002
  action: choose
  why:
    en: Copper is an excellent conductor and is ductile, so it can be drawn into wires. Corroding quickly would be a drawback, not a reason to use it.
- type: step
  text:
    en: Look inside the wire. What actually moves when a metal conducts?
  item_id: itm.chm.o.metals.0004
  action: choose
  why:
    en: Electrons that are free to move drift through the metal and carry the current. The positive ions stay where they are.
  names:
    en: Electrons that are free to move through the metal are called delocalised. They are not stuck to one atom.
- type: step
  text:
    en: 'Copper conducts a little better than aluminium. Predict: why might power companies still hang aluminium cables between pylons?'
  item_id: itm.chm.o.metals.0001
  action: predict
  why:
    en: Aluminium conducts well and has a much lower density, so long cables are lighter. It is not chosen for hardness, and it does not corrode away.
- type: step
  text:
    en: Now one on your own. Aluminium is quite high in the reactivity series, so think about why it lasts.
  item_id: itm.chm.o.metals.0003
  action: choose
  why:
    en: Aluminium has a low density, and a thin oxide layer on its surface stops it corroding any further.
- type: check
  item_ids:
  - itm.chm.o.metals.0010
  - itm.chm.o.metals.0011
  - itm.chm.o.metals.0012
