id: les.chm.o.analysis.carrying_out_a_titration
node_id: cur.chm.o.experimental_techniques_and_chemical_ana.acid_base_titrations
kc_ids:
- kc.chm.o.analysis.titration_technique
title: Carrying out a titration
estimated_minutes: 12
blocks:
- type: step
  text:
    en: 'In a titration, one solution is run from a burette into another in a flask until the indicator changes colour. Try this before any rule: why keep swirling the flask?'
  item_id: itm.chm.o.analysis.0022
  action: try_first
  why:
    en: Swirling mixes the acid into the alkali, so each drop reacts fully before the next one goes in. Then the colour change shows the true end point.
  names:
    en: The point where the indicator just changes colour is the end point, and the volume added to reach it is the titre.
- type: step
  text:
    en: 'First, predict in the simulation: the alkali in the burette is twice as concentrated as the acid in the flask, so how much alkali will reach the end point? Then watch closely for the colour change.'
  visual:
    visual_type: titration_sim
    params:
      acid:
        concentration: 0.1
        formula: HCl
      acid_volume: 25
      base:
        concentration: 0.2
        formula: NaOH
      indicator: phenolphthalein
      predict: poe.chm.titration_double_strength_alkali.v1
  item_id: itm.chm.o.analysis.0021
  action: predict
  why:
    en: A white tile makes the first colour change that stays easy to see, so you stop right at the end point. In the simulation the stronger alkali needed only half the volume of the acid, not double.
- type: step
  text:
    en: Water left inside a burette dilutes whatever goes in next. Think about how to stop that.
  item_id: itm.chm.o.analysis.0013
  action: choose
  why:
    en: Rinse the burette with a little of the acid it will hold, so any drops left behind are acid, not water. Rinsing with water alone dilutes the acid and changes the titre.
- type: step
  text:
    en: 'Same idea, less help this time: careful reading matters as much as careful mixing.'
  item_id: itm.chm.o.analysis.0014
  action: choose
  why:
    en: Read the bottom of the meniscus with your eye level with it. Looking from above or reading the top gives the wrong volume.
- type: step
  text:
    en: Now one on your own. Remember that the first run is only a rough guide.
  item_id: itm.chm.o.analysis.0015
  action: choose
  why:
    en: Leave out the rough titre and the one that does not agree, and average the two close ones, 24.15 and 24.10. Their mean is 24.13 cm³.
  names:
    en: Titres that agree closely with each other are called concordant.
- type: check
  item_ids:
  - itm.chm.o.analysis.0016
  - itm.chm.o.analysis.0023
  - itm.chm.o.analysis.0024
