id: les.chm.o.periodic.why_noble_gases_do_not_react
node_id: cur.chm.o.the_periodic_table.noble_gases
kc_ids:
- kc.chm.o.periodic.noble_gases
title: Why noble gases do not react
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'Atoms react by losing, gaining or sharing electrons to end up with a full outer shell. Try this before any rule: why would helium, neon and argon not bother?'
  item_id: itm.chm.o.periodic.0058
  action: try_first
  why:
    en: Their outer shells are already full, so they have no need to gain, lose or share electrons.
  names:
    en: These are the noble gases, at the right-hand end of the table. A full outer shell makes them unreactive.
- type: step
  text:
    en: A full outer shell does not always mean eight electrons. Look at the smallest noble gas.
  item_id: itm.chm.o.periodic.0050
  action: choose
  why:
    en: The only shell in a helium atom is full with two electrons. Neon needs eight in its outer shell, and it has them.
- type: step
  text:
    en: 'Hydrogen and oxygen gas are made of pairs of atoms. Predict: does helium need a partner atom too?'
  item_id: itm.chm.o.periodic.0051
  action: predict
  why:
    en: Helium atoms already have a full shell, so they do not bond to each other. The gas is made of single atoms.
  names:
    en: A gas made of single atoms is called monatomic.
- type: step
  text:
    en: Same idea, now for a use. Being a gas is not the reason; think about the outer shell.
  item_id: itm.chm.o.periodic.0049
  action: choose
  why:
    en: With its outer shell full, argon does not react with the hot filament. Plenty of gases react readily, so the gas state alone cannot explain it.
- type: step
  text:
    en: 'Now one on your own: compare two neighbours in the table.'
  item_id: itm.chm.o.periodic.0052
  action: choose
  why:
    en: Fluorine is one electron short of a full shell, so it grabs electrons readily. Neon already has a full shell.
- type: check
  item_ids:
  - itm.chm.o.periodic.0054
  - itm.chm.o.periodic.0057
  - itm.chm.o.periodic.0060
