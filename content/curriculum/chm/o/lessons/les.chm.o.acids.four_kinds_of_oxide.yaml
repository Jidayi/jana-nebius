title: Four kinds of oxide
estimated_minutes: 10
blocks:
- type: step
  text:
    en: Sulfur is a non-metal. When it burns, its oxide dissolves in rain. Try this before any rule.
  item_id: itm.chm.o.acids.0041
  action: try_first
  why:
    en: Sulfur dioxide dissolves in water to give an acidic solution, so it is an acidic oxide.
  names:
    en: Oxides of non-metals are usually acidic and react with alkalis. Oxides of metals are usually basic and react with acids.
- type: step
  text:
    en: 'Calcium is a metal. Predict: will its oxide make the water acidic or alkaline?'
  item_id: itm.chm.o.acids.0045
  action: predict
  why:
    en: Calcium oxide reacts with water to make calcium hydroxide, an alkali, so the pH is above 7.
- type: step
  text:
    en: Some oxides break the pattern. Decide from what the oxide reacts with, not just from which element it contains.
  item_id: itm.chm.o.acids.0037
  action: choose
  why:
    en: Zinc oxide reacts with an acid and with an alkali, so it is amphoteric. A neutral oxide would react with neither.
  names:
    en: An oxide that reacts with both acids and alkalis is called amphoteric.
- type: step
  text:
    en: 'Same idea, less help. Carbon is a non-metal, so predict: will this oxide behave like an acidic one?'
  item_id: itm.chm.o.acids.0039
  action: predict
  why:
    en: Carbon monoxide reacts with neither the acid nor the alkali, so it is neutral, even though most non-metal oxides are acidic.
  names:
    en: An oxide that reacts with neither acids nor alkalis is called neutral.
- type: step
  text:
    en: Now one on your own. Watch for a non-metal oxide that is not acidic.
  item_id: itm.chm.o.acids.0046
  action: choose
  why:
    en: Carbon dioxide, sulfur dioxide and nitrogen dioxide all react with alkalis. Carbon monoxide and nitrogen monoxide are neutral, and calcium oxide is basic.
- type: check
  item_ids:
  - itm.chm.o.acids.0038
  - itm.chm.o.acids.0040
  - itm.chm.o.acids.0047
