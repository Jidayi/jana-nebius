title: Petroleum fractions and cracking
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'Temperature falls as you go up the column: hot at the base, cooler near the top. Try this before any rule: which molecules turn to gas most easily, small ones or large ones?'
  item_id: itm.chm.o.organic.0037
  action: try_first
  why:
    en: Large molecules have the highest boiling points, so they stay liquid low down where it is hottest. Bitumen is a mixture, not one pure compound.
  names:
    en: 'That is fractional distillation: petroleum is split into fractions by boiling point, with small molecules at the top and large ones at the bottom.'
- type: step
  text:
    en: Each fraction comes off over a band of temperatures, not at one exact temperature. What does that tell you about what is inside it?
  item_id: itm.chm.o.organic.0038
  action: choose
  why:
    en: A fraction is a mixture of many hydrocarbons with boiling points close together. Petrol molecules are smaller than fuel oil molecules, which is why petrol collects higher up.
- type: step
  text:
    en: 'Long alkane chains are held together by strong bonds. Predict: to break them, would a refinery heat them or cool them?'
  item_id: itm.chm.o.organic.0048
  action: predict
  why:
    en: Cracking uses a high temperature and a catalyst to break long chains into shorter ones.
  names:
    en: 'That is cracking: breaking large alkane molecules into smaller, more useful ones.'
- type: step
  text:
    en: Same idea, less help this time. Ask yourself whether new molecules are made or old ones are just sorted.
  item_id: itm.chm.o.organic.0039
  action: choose
  why:
    en: Cracking breaks large alkanes into smaller alkanes and alkenes, so new molecules are made. Sorting molecules by boiling point is distillation, a different job.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.chm.o.organic.0040
  action: choose
  why:
    en: Heavy fractions are cracked to make more of the petrol people want, plus alkenes for making plastics. This matches supply to demand.
- type: check
  item_ids:
