title: Formula mass and percentage by mass
estimated_minutes: 12
blocks:
- type: step
  text:
    en: 'Every atom has a relative atomic mass, which you read from the periodic table. Try this before any rule: how heavy is one CO₂ compared with the atoms in it?'
  item_id: itm.chm.o.stoichiometry.0032
  action: try_first
  why:
    en: One carbon atom is 12 and two oxygen atoms are 32, so together they make 44.
  names:
    en: 'That is called the relative formula mass, Mr: the sum of the relative atomic masses of all the atoms in the formula.'
- type: step
  text:
    en: Same rule with more atoms. A small number after a symbol tells you how many of that atom there are.
  item_id: itm.chm.o.stoichiometry.0031
  action: calculate
  why:
    en: Two sodium atoms give 46, one carbon gives 12 and three oxygen atoms give 48, which add to 106.
- type: step
  text:
    en: A small number after a bracket counts all that is inside it. Use the atomic masses, not the atomic numbers.
  item_id: itm.chm.o.stoichiometry.0025
  action: choose
  why:
    en: There are two O and two H atoms, so add 40 for calcium, 32 for oxygen and 2 for hydrogen to get 74. Using atomic numbers or forgetting the bracket gives the wrong totals.
- type: step
  text:
    en: 'Now find what share of the mass comes from one element. Predict: is oxygen more than half the mass of calcium carbonate, or less?'
  item_id: itm.chm.o.stoichiometry.0039
  action: predict
  why:
    en: Three oxygen atoms weigh 48 out of an Mr of 100, so oxygen is 48.0% of the mass, just under half.
  names:
    en: The percentage by mass of an element is the mass of its atoms in the formula divided by Mr, times 100.
- type: step
  text:
    en: Now one on your own. Remember to count every atom of the element.
  item_id: itm.chm.o.stoichiometry.0046
  action: calculate
  why:
    en: Two aluminium atoms weigh 54 out of 102, which is 52.9% of the mass.
- type: check
  item_ids:
  - itm.chm.o.stoichiometry.0026
  - itm.chm.o.stoichiometry.0040
  - itm.chm.o.stoichiometry.0041
