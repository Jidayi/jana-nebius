title: Moles and reacting masses
estimated_minutes: 10
blocks:
- type: step
  text:
    en: One N₂ molecule has two nitrogen atoms, and one mole of N₂ has a mass of 28 g. Try this before any rule.
  item_id: itm.chm.o.stoichiometry.0051
  action: try_first
  why:
    en: One mole of N₂ has a mass of 28 g, and 7.0 g is a quarter of that, so it is a quarter of a mole.
  names:
    en: The mass of one mole is the molar mass, Mr in grams per mole. The amount in moles is the mass divided by the molar mass.
- type: step
  text:
    en: 'Use the rule on a compound: its molar mass comes from adding up its atoms.'
  item_id: itm.chm.o.stoichiometry.0053
  action: calculate
  why:
    en: Add the relative atomic masses to get Mr for CuSO₄, then divide the mass by it.
- type: step
  text:
    en: 'Now go the other way: you know the moles and want the mass.'
  item_id: itm.chm.o.stoichiometry.0058
  action: calculate
  why:
    en: 'The mass is the amount in moles times the molar mass: the same rule turned round.'
- type: step
  text:
    en: 'A balanced equation is a recipe in moles. Predict: does one mole of methane make one mole of water or two?'
  item_id: itm.chm.o.stoichiometry.0061
  action: predict
  why:
    en: One mole of methane makes two moles of water, so turn the methane into moles first and double it.
  names:
    en: Using the equation's numbers as a ratio of moles, never of grams, is how you find a reacting mass.
- type: step
  text:
    en: 'Put the three moves together: mass to moles, moles to moles with the equation, then moles back to mass.'
  item_id: itm.chm.o.stoichiometry.0066
  action: calculate
  why:
    en: One mole of CuO makes one mole of CuSO₄, so the moles stay the same and only the molar mass changes.
- type: check
  item_ids:
