id: les.chm.o.stoichiometry.writing_formulae_and_balancing
node_id: cur.chm.o.stoichiometry.formulae
kc_ids:
- kc.chm.o.stoichiometry.ionic_formulae
- kc.chm.o.stoichiometry.balancing_equations
title: Writing formulae and balancing equations
estimated_minutes: 12
blocks:
- type: step
  text:
    en: 'An ionic compound has no overall charge. Try this before any rule: how many chloride ions does one calcium ion need?'
  item_id: itm.chm.o.stoichiometry.0009
  action: try_first
  why:
    en: The calcium ion has a charge of two plus and each chloride ion only one minus, so two chloride ions are needed to cancel it.
  names:
    en: The formula of an ionic compound uses just enough of each ion to make the charges add up to zero.
- type: step
  text:
    en: Use the same rule with a group ion like nitrate. If you need more than one of a group ion, put it in brackets.
  item_id: itm.chm.o.stoichiometry.0001
  action: choose
  why:
    en: Two nitrate ions cancel the two plus charge on zinc, and the brackets show the whole NO₃ group is doubled. The charge on an ion is not the number of that ion.
- type: step
  text:
    en: An equation must have the same number of each kind of atom on both sides. You may only put numbers in front of formulae, never change the small numbers inside them.
  item_id: itm.chm.o.stoichiometry.0017
  action: calculate
  why:
    en: Making two NH₃ gives six hydrogen atoms on the right, so you need three H₂ on the left.
  names:
    en: 'That is called balancing an equation: changing the numbers in front until every kind of atom matches.'
- type: step
  text:
    en: Same idea, less help this time. Balance one element at a time and check them all at the end.
  item_id: itm.chm.o.stoichiometry.0019
  action: calculate
  why:
    en: 'Match nitrogen, then hydrogen: that gives four NH₃ and six H₂O. Then five O₂ balances the oxygen.'
- type: step
  text:
    en: Now one on your own. Predict which number goes in front of H₂ before you look at the choices.
  item_id: itm.chm.o.stoichiometry.0024
  action: predict
  why:
    en: With two of each on the left there are four hydrogen atoms in total, two of them in NaOH, so only one H₂ is needed. Changing formulae or doubling every number is not allowed.
- type: check
  item_ids:
  - itm.chm.o.stoichiometry.0004
  - itm.chm.o.stoichiometry.0021
  - itm.chm.o.stoichiometry.0018
