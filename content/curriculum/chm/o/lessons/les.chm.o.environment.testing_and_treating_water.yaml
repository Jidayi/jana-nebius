- type: idea
  text:
    en: 'Two colour tests show that water is present. White anhydrous copper(II) sulfate turns blue, and blue cobalt(II) chloride paper turns pink. They react with any water, so they cannot show that water is pure. A pure substance has fixed melting and boiling points: pure water melts at 0 °C and boils at 100 °C at standard pressure. Drinking water is treated in stages. Sedimentation lets large particles settle, filtration removes small insoluble particles, carbon removes tastes and smells, and chlorine kills microbes. Dissolved substances remain, so tap water is safe but not pure.'
