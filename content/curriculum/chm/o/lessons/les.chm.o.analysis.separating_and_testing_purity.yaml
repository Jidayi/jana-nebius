title: Separating mixtures and testing purity
estimated_minutes: 12
blocks:
- type: step
  text:
    en: 'Sand does not dissolve in water. Try this before any rule: how could you catch the sand but let the water through?'
  item_id: itm.chm.o.analysis.0041
  action: try_first
  why:
    en: Filter paper lets the water pass but holds back the sand grains.
  names:
    en: That is filtration. The solid left behind is the residue, and the liquid that passes through is the filtrate.
- type: step
  text:
    en: Here some salt is dissolved in the water as well. Dissolved salt is spread through the water as tiny particles.
  item_id: itm.chm.o.analysis.0040
  action: choose
  why:
    en: Filtration removes the sand because it is insoluble. The dissolved salt passes straight through the filter paper with the water.
- type: step
  text:
    en: Same idea, less help this time. You want back the solid that is dissolved, not the water.
  item_id: itm.chm.o.analysis.0037
  action: choose
  why:
    en: Evaporate some of the water, then let the solution cool so salt crystals form. A filter cannot catch salt that is dissolved.
  names:
    en: Getting a dissolved solid back as crystals is called crystallisation.
- type: step
  text:
    en: 'These two liquids mix completely, but they boil at different temperatures. Predict: is simple distillation enough, or is a column needed?'
  item_id: itm.chm.o.analysis.0039
  action: predict
  why:
    en: Their boiling points are fairly close, so a fractionating column is needed to separate them well. That is fractional distillation.
- type: step
  text:
    en: A pure solid melts at one sharp temperature. Think about what impurities do to that.
  item_id: itm.chm.o.analysis.0049
  action: choose
  why:
    en: The sample melts below the pure value of 136 °C and over a range, so it is impure. Impurities lower the melting point and spread it out, and looks prove nothing.
  names:
    en: A sharp melting point that matches the data book value is the sign of a pure solid.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.chm.o.analysis.0051
  action: choose
  why:
    en: Sample A melts sharply, so it is the purer one. Sample B melts lower and over a range, which is what impurities cause.
- type: check
  item_ids:
  - itm.chm.o.analysis.0038
  - itm.chm.o.analysis.0052
  - itm.chm.o.analysis.0050
