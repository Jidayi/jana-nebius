id: les.chm.o.organic.making_polymers
node_id: cur.chm.o.organic_chemistry.polymers
kc_ids:
- kc.chm.o.organic.polymers
title: Making polymers
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'Small molecules can join together into very long chains. Try this before any rule: which of these has a bond that could open up to link to its neighbours?'
  item_id: itm.chm.o.organic.0081
  action: try_first
  why:
    en: Only C₂H₄, ethene, has a C=C double bond that can open. CH₄ and C₂H₆ have only single bonds, so they cannot join up this way.
  names:
    en: The small molecule is called a monomer, and the long chain it makes is a polymer.
- type: step
  text:
    en: In an addition polymer, one bond of each C=C breaks and the monomers link up. Ask whether anything else is made.
  item_id: itm.chm.o.organic.0073
  action: choose
  why:
    en: Each C=C opens to a single bond and the ethene molecules join, with nothing else formed. No double bonds are left in the chain, and the monomer is ethene, not ethane.
  names:
    en: 'That is addition polymerisation: alkene monomers join and the polymer is the only product.'
- type: step
  text:
    en: Same idea, less help this time. The monomer of an addition polymer must have a double bond.
  item_id: itm.chm.o.organic.0074
  action: choose
  why:
    en: Chloroethene has a C=C bond that opens so it can join to others. No double bonds remain in the PVC chain.
- type: step
  text:
    en: 'Now work backwards from the chain. Predict: will the monomer have a double bond or not?'
  item_id: itm.chm.o.organic.0075
  action: predict
  why:
    en: Put the C=C back between the two chain carbons and you get propene, CH₂=CHCH₃. Propane has no double bond, so it cannot be the monomer.
- type: step
  text:
    en: Now one on your own. Watch for the small molecule given off.
  item_id: itm.chm.o.organic.0076
  action: choose
  why:
    en: When a small molecule is given off each time two monomers join, it is condensation polymerisation. Addition polymers form with no other product.
  names:
    en: Polymers made this way, such as nylon and polyesters, are condensation polymers.
- type: check
  item_ids:
  - itm.chm.o.organic.0084
  - itm.chm.o.organic.0083
  - itm.chm.o.organic.0080
