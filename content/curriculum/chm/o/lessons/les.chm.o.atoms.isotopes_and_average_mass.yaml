title: Isotopes and relative atomic mass
estimated_minutes: 12
blocks:
- type: step
  text:
    en: 'Two kinds of carbon atom have different masses but are still both carbon. Try this before any rule: what must be the same, and what can differ?'
  item_id: itm.chm.o.atoms.0049
  action: try_first
  why:
    en: Both are carbon, so both have the same number of protons. The difference in mass comes from a different number of neutrons.
  names:
    en: 'That is called an isotope: atoms of the same element with the same number of protons but different numbers of neutrons.'
- type: step
  text:
    en: How an atom reacts depends on its electrons. Do isotopes of one element have the same electrons?
  item_id: itm.chm.o.atoms.0048
  action: choose
  why:
    en: Isotopes have the same number of electrons, so they react in exactly the same way. Being heavier does not change how an atom reacts.
- type: step
  text:
    en: Most natural elements are a mix of isotopes, and some isotopes are far more common. So the average mass must count the common one more.
  item_id: itm.chm.o.atoms.0038
  action: choose
  why:
    en: Multiply each mass by its percentage, add them, and divide by 100 to get 35.5. A plain average of the two masses gives 36.0, which ignores that most chlorine is chlorine-35.
  names:
    en: 'That is the relative atomic mass: the average mass of an atom, weighted by how common each isotope is.'
- type: step
  text:
    en: Same idea, less help this time. Multiply, add, then divide.
  item_id: itm.chm.o.atoms.0042
  action: calculate
  why:
    en: Each mass times its percentage, added together and divided by 100, gives 80.0.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.chm.o.atoms.0044
  action: calculate
  why:
    en: The answer lies closer to the more common isotope, as it should.
- type: check
