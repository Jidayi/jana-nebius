- type: idea
  text:
    en: 'Acids release hydrogen ions in water and have a pH below 7; alkalis release hydroxide ions and have a pH above 7. Every acid reaction makes a salt. The metal (or ammonium) names the first part of the salt and the acid names the second: hydrochloric acid makes chlorides, sulfuric acid makes sulfates, nitric acid makes nitrates. What else forms depends on what the acid meets. A metal gives hydrogen. A base or alkali gives water. A carbonate gives water and carbon dioxide.'
