title: How particles spread out
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'A coloured crystal sits at the bottom of a beaker of still water. Nobody stirs it. Try this before any rule: what happens to the colour?'
  item_id: itm.chm.o.states.0032
  action: try_first
  why:
    en: The particles never stop moving. So the coloured ones slowly wander into all of the water on their own.
  names:
    en: 'That is called diffusion: particles moving at random spread from where they are crowded to where there are fewer of them.'
- type: step
  text:
    en: Two gases are let out at the same time and at the same temperature. Gas particles at the same temperature do not all move at the same speed. Think about which molecules are lighter.
  item_id: itm.chm.o.states.0025
  action: choose
  why:
    en: Ammonia molecules are lighter than hydrogen chloride molecules, so they move faster and spread faster. Heavier molecules are slower, they do not push harder, and no stirring is needed.
  names:
    en: The lower the relative molecular mass of a gas, the faster it diffuses.
- type: step
  text:
    en: 'Now change the temperature instead of the gas. Predict: will the warmer one spread faster or slower?'
  item_id: itm.chm.o.states.0033
  action: predict
  why:
    en: Warm particles move faster. So the gas spreads faster when it is hotter, not colder.
- type: step
  text:
    en: Compare a gas with a liquid. Think about how fast the particles move and how much room they have.
  item_id: itm.chm.o.states.0036
  action: choose
  why:
    en: Gas particles move faster and have lots of empty space between them, so they spread much more quickly than liquid particles.
- type: step
  text:
    en: Same idea, less help this time. Predict where the two gases meet before you choose.
  item_id: itm.chm.o.states.0031
  action: predict
  why:
    en: Ammonia is the lighter gas, so it moves further in the same time. The gases meet nearer the acid end.
- type: check
  item_ids:
