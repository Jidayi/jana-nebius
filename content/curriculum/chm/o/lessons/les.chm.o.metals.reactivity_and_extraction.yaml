  - itm.chm.o.metals.0001
  - itm.chm.o.metals.0004
- type: idea
  text:
    en: 'Metals can be ranked by how readily they react: potassium, sodium, calcium, magnesium, aluminium, (carbon), zinc, iron, (hydrogen), copper, silver, gold. A metal higher in this list displaces a lower one from a solution of its salt, and only metals above hydrogen give hydrogen with dilute acids. The same list tells us how to extract a metal. A reactive metal holds on to its compounds tightly, so metals above carbon need electrolysis. Metals below carbon are freed by heating their oxides with carbon or carbon monoxide: the oxide loses oxygen, so it is reduced.'
- type: worked_example
  worked_example_id: wex.chm.o.metals.0009
- type: guided_step
  item_id: itm.chm.o.metals.0024
- type: quick_check
