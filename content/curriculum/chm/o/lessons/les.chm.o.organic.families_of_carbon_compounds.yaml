- type: idea
  text:
    en: 'Carbon compounds come in families called homologous series. Every member of a family has the same functional group, fits the same general formula and reacts in the same way. Alkanes (CₙH₂ₙ₊₂) have only single bonds. Alkenes (CₙH₂ₙ) have a C=C double bond. Alcohols have an –OH group bonded to carbon, and carboxylic acids have a –COOH group. Neighbouring members differ by CH₂. A name has two parts: the prefix counts every carbon atom (meth- one, eth- two, prop- three, but- four) and the ending names the family (-ane, -ene, -ol, -oic acid).'
