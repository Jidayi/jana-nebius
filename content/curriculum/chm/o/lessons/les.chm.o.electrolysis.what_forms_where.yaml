- type: prior_knowledge
  item_ids:
  - itm.chm.o.electrolysis.0007
  - itm.chm.o.electrolysis.0001
- type: idea
  text:
    en: 'In electrolysis a current decomposes an ionic compound that is molten or dissolved, so that its ions can move. Positive ions go to the negative cathode and gain electrons; negative ions go to the positive anode and lose electrons. A melt has only its own two ions: the metal forms at the cathode and the non-metal at the anode. A solution also has H⁺ and OH⁻ from water. At the cathode, hydrogen forms unless the metal is less reactive than hydrogen, like copper or silver. At the anode, a concentrated halide gives the halogen; otherwise oxygen forms.'
