- type: summary
  text:
    en: 'Cations go to the cathode, anions to the anode. Melts give the metal and the non-metal. Solutions: hydrogen at the cathode unless the metal is below hydrogen; halogen at the anode only from a concentrated halide, otherwise oxygen.'
