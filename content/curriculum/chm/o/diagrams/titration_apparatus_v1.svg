<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380">
  <title>Apparatus for a titration</title>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--color-diagram-stroke)"/>
    </marker>
  </defs>
  <g data-part="burette">
    <rect x="184" y="40" width="12" height="190" fill="var(--color-paper)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <path d="M184,60 L190,60 M184,80 L190,80 M184,100 L190,100 M184,120 L190,120 M184,140 L190,140 M184,160 L190,160 M184,180 L190,180 M184,200 L190,200" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="210" y="60" font-size="13" fill="var(--color-ink)" data-label-for="burette">burette</text>
  </g>
  <g data-part="tap">
    <rect x="178" y="230" width="24" height="8" fill="var(--color-panel)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <path d="M188,238 L188,256 L192,256 L192,238" fill="var(--color-paper)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="215" y="240" font-size="13" fill="var(--color-ink)" data-label-for="tap">tap</text>
  </g>
  <g data-part="conical_flask">
    <polygon points="180,262 200,262 200,284 242,338 138,338 180,284" fill="var(--color-paper)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="250" y="300" font-size="13" fill="var(--color-ink)" data-label-for="conical_flask">conical flask</text>
  </g>
  <g data-part="solution">
    <polygon points="157,314 223,314 238,334 142,334" fill="var(--content-pink)" stroke="var(--color-line-strong)" stroke-width="1" data-content-colour="pink"/>
    <text x="250" y="326" font-size="13" fill="var(--color-ink)" data-label-for="solution">solution turns pink</text>
  </g>
  <g data-part="white_tile">
    <rect x="115" y="338" width="150" height="4" fill="var(--color-paper)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="280" y="352" font-size="13" fill="var(--color-ink)" data-label-for="white_tile">white tile</text>
  </g>
  <g data-part="clamp_stand">
    <rect x="40" y="342" width="150" height="12" fill="var(--color-panel)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <line x1="70" y1="342" x2="70" y2="30" stroke="var(--color-diagram-stroke)" stroke-width="3"/>
    <line x1="70" y1="80" x2="182" y2="80" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <rect x="64" y="74" width="12" height="12" fill="var(--color-panel)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="30" y="372" font-size="13" fill="var(--color-ink)" data-label-for="clamp_stand">clamp stand</text>
  </g>
  <g data-arrow="arrow_drip">
    <line x1="190" y1="262" x2="190" y2="290" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
</svg>
