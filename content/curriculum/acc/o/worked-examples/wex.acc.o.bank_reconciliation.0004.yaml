  reason: The layout starts from the statement
  check_id: chk_build_acc_bank_reconciliation_w0004_t
- n: 2
  latex: \text{Statement} = 2560 - 730 + 450 = 2280
  reason: Work back to the statement balance
  check_id: chk_build_acc_bank_reconciliation_w0004_a
- n: 3
  latex: 2280 + 730 - 450 = 2560
  reason: 'Check: it reconciles'
  check_id: chk_build_acc_bank_reconciliation_w0004_b
final_answer:
  latex: \$\,2280
  check_id: chk_build_acc_bank_reconciliation_w0004_a
