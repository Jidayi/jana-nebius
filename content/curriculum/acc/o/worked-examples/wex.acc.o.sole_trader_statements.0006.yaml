problem: 'A trader''s figures: gross profit $18200; discount received $420; wages $7400; insurance $950; carriage outwards $380. Find the profit for the year.'
steps:
- n: 1
  latex: \text{Profit for the year} = \text{gross profit} + \text{other income} - \text{expenses}
  reason: Drawings are not an expense
  check_id: chk_build_acc_sole_trader_statements_w0006_t
- n: 2
  latex: \text{Expenses} = 7400 + 950 + 380 = 8730
  reason: Total the expenses
  check_id: chk_build_acc_sole_trader_statements_w0006_s2
- n: 3
  latex: \text{Profit} = 18200 + 420 - 8730 = 9890
  reason: Substitute
  check_id: chk_build_acc_sole_trader_statements_w0006_a
final_answer:
  latex: \$\,9890
  check_id: chk_build_acc_sole_trader_statements_w0006_a
