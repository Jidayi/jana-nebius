problem: An item costs $240 and is sold at a mark-up of 25%. Find the selling price.
steps:
- n: 1
  latex: \text{Price} = \text{cost} + \text{mark-up} \times \text{cost}
  reason: Mark-up is on cost
  check_id: chk_build_acc_ratios_w0003_t
- n: 2
  latex: \text{Mark-up} = 25\% \times 240 = 60
  reason: Profit added
  check_id: chk_build_acc_ratios_w0003_s2
- n: 3
  latex: \text{Price} = 240 + 60 = 300
  reason: Add
  check_id: chk_build_acc_ratios_w0003_a
final_answer:
  latex: \$\,300
  check_id: chk_build_acc_ratios_w0003_a
