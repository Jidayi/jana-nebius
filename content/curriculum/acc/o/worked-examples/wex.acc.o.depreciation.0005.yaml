problem: A van costs $18000, will last 5 years and then be worth $3000. Find the yearly straight-line charge.
steps:
- n: 1
  latex: \text{Yearly charge} = \frac{\text{cost} - \text{residual}}{\text{life}}
  reason: Same each year
  check_id: chk_build_acc_depreciation_w0005_t
- n: 2
  latex: \text{Yearly charge} = \frac{18000 - 3000}{5} = 3000
  reason: Substitute
  check_id: chk_build_acc_depreciation_w0005_a
final_answer:
  latex: \$\,3000
  check_id: chk_build_acc_depreciation_w0005_a
