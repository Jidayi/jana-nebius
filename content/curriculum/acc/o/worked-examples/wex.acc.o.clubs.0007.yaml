problem: 'A club''s figures: subscriptions for the year $3500; competition fees $1850; rent $1200; groundsman''s wages $650; electricity $950; new equipment bought $4700; depreciation of equipment $250. Find the surplus or deficit.'
steps:
- n: 1
  latex: \text{Surplus} = \text{income} - \text{expenditure}
  reason: Leave out the equipment cost
  check_id: chk_build_acc_clubs_w0007_t
- n: 2
  latex: \text{Income} = 5350
  reason: Subscriptions and fees
  check_id: chk_build_acc_clubs_w0007_s2
- n: 3
  latex: \text{Expenditure} = 3050
  reason: Including depreciation
  check_id: chk_build_acc_clubs_w0007_s3
- n: 4
  latex: \text{Result} = 2300
  reason: Surplus
  check_id: chk_build_acc_clubs_w0007_a
final_answer:
  latex: \$\,2300
  check_id: chk_build_acc_clubs_w0007_a
