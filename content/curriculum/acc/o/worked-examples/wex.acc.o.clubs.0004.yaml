problem: 'A club: During the year the club received $6450 in subscriptions, including $540 owing from last year. At the start of the year members had already paid $470 for this year. At the end of the year $530 is owing for this year and $400 has been paid in advance for next year. Find the subscriptions income.'
steps:
- n: 1
  latex: \text{Income} = \text{received} - \text{old arrears} + \text{old advance} + \text{new arrears} - \text{new advance}
  reason: Earned this year
  check_id: chk_build_acc_clubs_w0004_t
- n: 2
  latex: 6450 - 540 + 470 + 530 - 400 = 6510
  reason: Substitute
  check_id: chk_build_acc_clubs_w0004_a
final_answer:
  latex: \$\,6510
  check_id: chk_build_acc_clubs_w0004_a
fading_order:
- 2
- 1
