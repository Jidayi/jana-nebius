problem: 'A shop: opening inventory 50 items at $11 each; then bought 90 at $12 each; then sold 110; then bought 50 at $13 each; then sold 60. Value the closing inventory by FIFO.'
steps:
- n: 1
  latex: '\text{FIFO: the goods left are the latest bought}'
  reason: Oldest goods go first
  check_id: chk_build_acc_inventory_w0001_t
- n: 2
  latex: \text{Units left} = (50 + 90 + 50) - (110 + 60) = 20
  reason: In less out
  check_id: chk_build_acc_inventory_w0001_s2
- n: 3
  latex: \text{Closing} = 20 \times 13 = 260
  reason: Value the remaining layers
  check_id: chk_build_acc_inventory_w0001_a
final_answer:
  latex: \$\,260
  check_id: chk_build_acc_inventory_w0001_a
fading_order:
- 3
- 2
- 1
