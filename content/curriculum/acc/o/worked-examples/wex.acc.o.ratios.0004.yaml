problem: An item costs $85 and is sold at a mark-up of 40%. Find the selling price.
steps:
- n: 1
  latex: \text{Price} = \text{cost} + \text{mark-up} \times \text{cost}
  reason: Mark-up is on cost
  check_id: chk_build_acc_ratios_w0004_t
- n: 2
  latex: \text{Mark-up} = 40\% \times 85 = 34
  reason: Profit added
  check_id: chk_build_acc_ratios_w0004_s2
- n: 3
  latex: \text{Price} = 85 + 34 = 119
  reason: Add
  check_id: chk_build_acc_ratios_w0004_a
final_answer:
  latex: \$\,119
  check_id: chk_build_acc_ratios_w0004_a
