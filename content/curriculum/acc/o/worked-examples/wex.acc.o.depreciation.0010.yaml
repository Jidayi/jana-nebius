problem: An asset cost $15000, residual value $0, life 6 years, straight line. Find its net book value after 4 years.
steps:
- n: 1
  latex: \text{Net book value} = \text{cost} - \text{accumulated depreciation}
  reason: What is left
  check_id: chk_build_acc_depreciation_w0010_t
- n: 2
  latex: \text{Yearly charge} = \frac{15000 - 0}{6} = 2500
  reason: Straight line
  check_id: chk_build_acc_depreciation_w0010_s2
- n: 3
  latex: \text{Accumulated} = 2500 \times 4 = 10000
  reason: Every year so far
  check_id: chk_build_acc_depreciation_w0010_s3
- n: 4
  latex: \text{Net book value} = 15000 - 10000 = 5000
  reason: Subtract
  check_id: chk_build_acc_depreciation_w0010_a
final_answer:
  latex: \$\,5000
  check_id: chk_build_acc_depreciation_w0010_a
fading_order:
- 4
- 3
- 2
- 1
