problem: A machine cost $10000 and is depreciated by $2000 a year. After 3 years it could be sold for $5500. Find its net book value and say whether it shows the selling price.
steps:
- n: 1
  latex: \text{Net book value} = \text{cost} - \text{accumulated depreciation}
  reason: Unused cost, not market value
  check_id: chk_build_acc_depreciation_w0003_t
- n: 2
  latex: \text{Net book value} = 10000 - 2000 \times 3 = 4000
  reason: Differs from the selling price
  check_id: chk_build_acc_depreciation_w0003_a
final_answer:
  latex: \$\,4000
  check_id: chk_build_acc_depreciation_w0003_a
