problem: 'A cash book shows a debit bank balance of $1950. On the bank statement only: interest paid by the bank $870; bank charges $410; a direct debit for electricity $370. Find the updated cash book balance.'
steps:
- n: 1
  latex: \text{Add statement-only receipts, subtract statement-only payments}
  reason: Bring the cash book up to date
  check_id: chk_build_acc_bank_reconciliation_w0001_t
- n: 2
  latex: \text{Updated balance} = 1950 + 870 - 410 - 370 = 2040
  reason: Substitute
  check_id: chk_build_acc_bank_reconciliation_w0001_a
final_answer:
  latex: \$\,2040
  check_id: chk_build_acc_bank_reconciliation_w0001_a
fading_order:
- 2
- 1
