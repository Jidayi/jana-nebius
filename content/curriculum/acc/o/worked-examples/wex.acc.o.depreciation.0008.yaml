problem: Equipment costs $9000 and is depreciated at 20% reducing balance. Find the second year's charge.
steps:
- n: 1
  latex: \text{Charge} = \text{rate} \times \text{opening net book value}
  reason: Reducing balance
  check_id: chk_build_acc_depreciation_w0008_t
- n: 2
  latex: \text{Year 1} = 20\% \times 9000 = 1800
  reason: On cost in the first year
  check_id: chk_build_acc_depreciation_w0008_s2
- n: 3
  latex: \text{Net book value} = 9000 - 1800 = 7200
  reason: What is left
  check_id: chk_build_acc_depreciation_w0008_s3
- n: 4
  latex: \text{Year 2} = 20\% \times 7200 = 1440
  reason: On the reduced balance
  check_id: chk_build_acc_depreciation_w0008_a
final_answer:
  latex: \$\,1440
  check_id: chk_build_acc_depreciation_w0008_a
