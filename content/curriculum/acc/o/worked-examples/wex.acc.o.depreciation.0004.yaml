problem: A machine cost $6000 and is depreciated by $1200 a year. After 2 years it could be sold for $2000. Find its net book value and say whether it shows the selling price.
steps:
- n: 1
  latex: \text{Net book value} = \text{cost} - \text{accumulated depreciation}
  reason: Unused cost, not market value
  check_id: chk_build_acc_depreciation_w0004_t
- n: 2
  latex: \text{Net book value} = 6000 - 1200 \times 2 = 3600
  reason: Differs from the selling price
  check_id: chk_build_acc_depreciation_w0004_a
final_answer:
  latex: \$\,3600
  check_id: chk_build_acc_depreciation_w0004_a
