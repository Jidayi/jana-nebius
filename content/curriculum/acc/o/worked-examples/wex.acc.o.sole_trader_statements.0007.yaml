problem: A trader has non-current assets of $45000, current assets of $12600, current liabilities of $5400 and a loan repayable in eight years of $15000. Show the sections and find the owner's capital.
steps:
- n: 1
  latex: \text{Assets} = \text{non-current} + \text{current}
  reason: Owned by the business
  check_id: chk_build_acc_sole_trader_statements_w0007_t
- n: 2
  latex: \text{Liabilities} = 5400 + 15000 = 20400
  reason: 'The loan is non-current: due after a year'
  check_id: chk_build_acc_sole_trader_statements_w0007_b
- n: 3
  latex: \text{Capital} = 45000 + 12600 - (5400 + 15000) = 37200
  reason: Assets less liabilities
  check_id: chk_build_acc_sole_trader_statements_w0007_a
final_answer:
  latex: \$\,37200
  check_id: chk_build_acc_sole_trader_statements_w0007_a
fading_order:
- 3
- 2
- 1
