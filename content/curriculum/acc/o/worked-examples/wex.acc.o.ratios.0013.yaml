id: wex.acc.o.ratios.0013
kc_ids:
- kc.acc.o.ratios.interpret_ratios
problem: Last year revenue $50000, cost of sales $30000; this year revenue $60000, cost of sales $39000. Compare the gross margins and suggest a cause.
steps:
- n: 1
  latex: \text{Gross margin each year}
  reason: Same definition both years
  check_id: chk_build_acc_ratios_w0013_t
- n: 2
  latex: \text{Last year} = 40.00\%
  reason: Gross profit over revenue
  check_id: chk_build_acc_ratios_w0013_s2
- n: 3
  latex: \text{This year} = 35.00\%
  reason: Gross profit over revenue
  check_id: chk_build_acc_ratios_w0013_s3
- n: 4
  latex: \text{Change} = 5.00\ \text{points; the margin fell}
  reason: Prices or the cost of goods changed
  check_id: chk_build_acc_ratios_w0013_a
final_answer:
  latex: 5.00\ \text{points}
  check_id: chk_build_acc_ratios_w0013_a
fading_order:
- 4
- 3
- 2
- 1
version: 0.1.0
