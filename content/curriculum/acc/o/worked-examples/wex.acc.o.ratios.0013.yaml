checks:
  chk_build_acc_ratios_w0013_a:
    args:
      dp: 2
      expression: abs((60000 - 39000) / 60000 * 100 - (50000 - 30000) / 50000 * 100)
    tool: math_evaluate
  chk_build_acc_ratios_w0013_s2:
    args:
      dp: 4
      expression: (50000 - 30000) / 50000 * 100
    tool: math_evaluate
  chk_build_acc_ratios_w0013_s3:
    args:
      dp: 4
      expression: (60000 - 39000) / 60000 * 100
    tool: math_evaluate
  chk_build_acc_ratios_w0013_t:
    args:
      cost_of_sales: '39000'
      definitions:
        capital_basis: closing
        capital_employed: capital_and_non_current_liabilities
        inventory_basis: average
        payables_purchases: credit_purchases
        quick_assets: less_inventory
        receivables_sales: credit_sales
        roce_profit: profit_for_the_year
        year_days: 365
      dp: 2
      ratios:
      - gross_margin
      revenue: '60000'
    tool: acc_ratios
