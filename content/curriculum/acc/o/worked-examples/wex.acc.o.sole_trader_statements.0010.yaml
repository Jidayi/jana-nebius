problem: 'A business has: inventory $10200; trade receivables $7400; prepaid expenses $800; bank balance $2500; cash in hand $550; trade payables $8700; accrued expenses $450; equipment $10100; loan repayable in six years $15000. Find the net current assets.'
steps:
- n: 1
  latex: \text{Net current assets} = \text{current assets} - \text{current liabilities}
  reason: Leave out non-current items
  check_id: chk_build_acc_sole_trader_statements_w0010_t
- n: 2
  latex: \text{Current assets} = 10200 + 7400 + 800 + 2500 + 550 = 21450
  reason: Turned into cash within a year
  check_id: chk_build_acc_sole_trader_statements_w0010_s2
- n: 3
  latex: \text{Current liabilities} = 8700 + 450 = 9150
  reason: Due within a year
  check_id: chk_build_acc_sole_trader_statements_w0010_s3
- n: 4
  latex: \text{Net current assets} = 21450 - 9150 = 12300
  reason: Subtract
  check_id: chk_build_acc_sole_trader_statements_w0010_a
final_answer:
  latex: \$\,12300
  check_id: chk_build_acc_sole_trader_statements_w0010_a
fading_order:
- 4
- 3
- 2
- 1
