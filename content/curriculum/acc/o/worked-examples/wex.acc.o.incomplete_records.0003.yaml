problem: A trader's capital was $34300 at the start of the year and $35100 at the end. During the year the trader took drawings of $7200 and paid in extra capital of $3000. Find the profit.
steps:
- n: 1
  latex: \text{Profit} = \text{closing} - \text{opening} + \text{drawings} - \text{introduced}
  reason: Explain the change in capital
  check_id: chk_build_acc_incomplete_records_w0003_t
- n: 2
  latex: \text{Profit} = 35100 - 34300 + 7200 - 3000 = 5000
  reason: Substitute
  check_id: chk_build_acc_incomplete_records_w0003_a
final_answer:
  latex: \$\,5000
  check_id: chk_build_acc_incomplete_records_w0003_a
