problem: 'A trader''s figures for the year: opening inventory $5000; purchases $42000; purchases returns $1200; carriage inwards $800; carriage outwards $600; closing inventory $6500. Find the cost of sales.'
steps:
- n: 1
  latex: \text{Cost of sales} = \text{opening inventory} + \text{net purchases} + \text{carriage inwards} - \text{closing inventory}
  reason: Carriage outwards is an expense
  check_id: chk_build_acc_sole_trader_statements_w0001_t
- n: 2
  latex: \text{Goods available} = 5000 + 42000 - 1200 + 800 = 46600
  reason: Everything that could have been sold
  check_id: chk_build_acc_sole_trader_statements_w0001_s2
- n: 3
  latex: \text{Cost of sales} = 46600 - 6500 = 40100
  reason: Less what is left
  check_id: chk_build_acc_sole_trader_statements_w0001_a
final_answer:
  latex: \$\,40100
  check_id: chk_build_acc_sole_trader_statements_w0001_a
fading_order:
- 3
- 2
- 1
