problem: A trader's revenue was $68000, with sales returns of $1500, and the cost of sales was $41200. Find the gross profit.
steps:
- n: 1
  latex: \text{Gross profit} = (\text{revenue} - \text{sales returns}) - \text{cost of sales}
  reason: Net revenue less cost of sales
  check_id: chk_build_acc_sole_trader_statements_w0003_t
- n: 2
  latex: \text{Gross profit} = (68000 - 1500) - 41200 = 25300
  reason: Substitute
  check_id: chk_build_acc_sole_trader_statements_w0003_a
final_answer:
  latex: \$\,25300
  check_id: chk_build_acc_sole_trader_statements_w0003_a
