problem: Opening inventory $5200; closing inventory $6800; cost of sales $48000. Find the rate of inventory turnover.
steps:
- n: 1
  latex: \text{Turnover} = \frac{\text{cost of sales}}{\text{average inventory}}
  reason: Average inventory
  check_id: chk_build_acc_ratios_w0007_t
- n: 2
  latex: \text{Average} = \frac{5200 + 6800}{2} = 6000
  reason: Halve the sum
  check_id: chk_build_acc_ratios_w0007_s2
- n: 3
  latex: \frac{48000}{6000} = 8.00
  reason: Times a year
  check_id: chk_build_acc_ratios_w0007_a
final_answer:
  latex: 8.00\ \text{times}
  check_id: chk_build_acc_ratios_w0007_a
