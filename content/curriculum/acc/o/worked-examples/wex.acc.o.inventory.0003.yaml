id: wex.acc.o.inventory.0003
kc_ids:
- kc.acc.o.inventory.avco
problem: 'A shop: opening inventory 40 items at $10 each; then bought 60 at $15 each; then sold 50. Value the closing inventory by AVCO.'
steps:
- n: 1
  latex: '\text{AVCO: unit cost} = \frac{\text{value held}}{\text{units held}}'
  reason: Weighted
  check_id: chk_build_acc_inventory_w0003_t
- n: 2
  latex: \text{Average} = \frac{40 \times 10 + 60 \times 15}{40 + 60} = 13
  reason: After the purchase
  check_id: chk_build_acc_inventory_w0003_s2
- n: 3
  latex: \text{Closing} = (40 + 60 - 50) \times 13 = 650.00
  reason: Units left at the average
  check_id: chk_build_acc_inventory_w0003_a
final_answer:
  latex: \$\,650.00
  check_id: chk_build_acc_inventory_w0003_a
fading_order:
- 3
- 2
- 1
