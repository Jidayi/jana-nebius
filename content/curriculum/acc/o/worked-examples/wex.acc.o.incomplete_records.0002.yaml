problem: 'A trader has: premises $16300; inventory $8000; equipment $9600; bank balance $16800; a loan $3200; expenses owing $2300. Find the capital.'
steps:
- n: 1
  latex: \text{Capital} = \text{assets} - \text{liabilities}
  reason: Statement of affairs
  check_id: chk_build_acc_incomplete_records_w0002_t
- n: 2
  latex: \text{Assets} = 16300 + 8000 + 9600 + 16800 = 50700
  reason: Owned
  check_id: chk_build_acc_incomplete_records_w0002_s2
- n: 3
  latex: \text{Capital} = 50700 - (3200 + 2300) = 45200
  reason: Less owed
  check_id: chk_build_acc_incomplete_records_w0002_a
final_answer:
  latex: \$\,45200
  check_id: chk_build_acc_incomplete_records_w0002_a
