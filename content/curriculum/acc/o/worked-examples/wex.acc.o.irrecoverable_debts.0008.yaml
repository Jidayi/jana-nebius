id: wex.acc.o.irrecoverable_debts.0008
kc_ids:
- kc.acc.o.irrecoverable_debts.net_receivables
problem: Receivables $7300; write off $300; allowance 10%. Find net trade receivables.
steps:
- n: 1
  latex: \text{Net} = \text{receivables} - \text{written off} - \text{allowance}
  reason: Expected to be collected
  check_id: chk_build_acc_irrecoverable_debts_w0008_t
- n: 2
  latex: \text{Allowance} = 10\% \times (7300 - 300) = 700
  reason: This year's
  check_id: chk_build_acc_irrecoverable_debts_w0008_s2
- n: 3
  latex: \text{Net} = (7300 - 300) - 700 = 6300
  reason: Subtract
  check_id: chk_build_acc_irrecoverable_debts_w0008_a
final_answer:
  latex: \$\,6300
  check_id: chk_build_acc_irrecoverable_debts_w0008_a
fading_order:
- 3
- 2
- 1
