id: wex.acc.o.sole_trader_statements.0009
kc_ids:
- kc.acc.o.sole_trader_statements.working_capital
problem: 'A business has: inventory $11000; trade receivables $2600; prepaid expenses $600; bank overdraft $3800; cash in hand $100; trade payables $6600; accrued expenses $400; equipment $25000; loan repayable in six years $12800. Find the net current assets.'
steps:
- n: 1
  latex: \text{Net current assets} = \text{current assets} - \text{current liabilities}
  reason: Leave out non-current items
  check_id: chk_build_acc_sole_trader_statements_w0009_t
- n: 2
  latex: \text{Current assets} = 11000 + 2600 + 600 + 100 = 14300
  reason: Turned into cash within a year
  check_id: chk_build_acc_sole_trader_statements_w0009_s2
- n: 3
  latex: \text{Current liabilities} = 6600 + 400 + 3800 = 10800
  reason: Due within a year
  check_id: chk_build_acc_sole_trader_statements_w0009_s3
- n: 4
  latex: \text{Net current assets} = 14300 - 10800 = 3500
  reason: Subtract
  check_id: chk_build_acc_sole_trader_statements_w0009_a
final_answer:
  latex: \$\,3500
  check_id: chk_build_acc_sole_trader_statements_w0009_a
fading_order:
- 4
- 3
- 2
- 1
