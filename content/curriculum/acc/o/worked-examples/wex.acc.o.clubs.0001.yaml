problem: A club received subscriptions of $5400 (all for this year) and paid $1800 for equipment, depreciated by $360. Show what each statement records as spending and find the surplus.
steps:
- n: 1
  latex: '\text{Receipts and payments: the equipment paid; income and expenditure: depreciation}'
  reason: Cash versus matching
  check_id: chk_build_acc_clubs_w0001_t
- n: 2
  latex: \text{Surplus} = 5400 - 360 = 5040
  reason: Income less expenditure
  check_id: chk_build_acc_clubs_w0001_a
final_answer:
  latex: \$\,5040
  check_id: chk_build_acc_clubs_w0001_a
fading_order:
- 2
- 1
