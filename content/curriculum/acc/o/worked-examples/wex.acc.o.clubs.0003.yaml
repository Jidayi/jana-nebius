problem: 'A club: During the year the club received $8000 in subscriptions, including $290 owing from last year. At the start of the year members had already paid $120 for this year. At the end of the year $210 is owing for this year and $410 has been paid in advance for next year. Find the subscriptions income.'
steps:
- n: 1
  latex: \text{Income} = \text{received} - \text{old arrears} + \text{old advance} + \text{new arrears} - \text{new advance}
  reason: Earned this year
  check_id: chk_build_acc_clubs_w0003_t
- n: 2
  latex: 8000 - 290 + 120 + 210 - 410 = 7630
  reason: Substitute
  check_id: chk_build_acc_clubs_w0003_a
final_answer:
  latex: \$\,7630
  check_id: chk_build_acc_clubs_w0003_a
fading_order:
- 2
- 1
