problem: A machine cost $20000, straight line over 5 years, no residual value. After 3 years' depreciation it is sold for $9500. Find the profit or loss.
steps:
- n: 1
  latex: \text{Result} = \text{proceeds} - \text{net book value}
  reason: Compare with the book value
  check_id: chk_build_acc_depreciation_w0011_t
- n: 2
  latex: \text{Net book value} = 20000 - \frac{20000}{5} \times 3 = 8000
  reason: Cost less accumulated depreciation
  check_id: chk_build_acc_depreciation_w0011_s2
- n: 3
  latex: \text{Result} = 9500 - 8000, \text{ a profit of } 1500
  reason: Positive is a profit
  check_id: chk_build_acc_depreciation_w0011_a
final_answer:
  latex: \text{Profit of }\$\,1500
  check_id: chk_build_acc_depreciation_w0011_a
