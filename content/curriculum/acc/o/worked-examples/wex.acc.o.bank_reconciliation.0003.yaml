  reason: The layout starts from the statement
  check_id: chk_build_acc_bank_reconciliation_w0003_t
- n: 2
  latex: \text{Statement} = 3870 - 450 + 230 = 3650
  reason: Work back to the statement balance
  check_id: chk_build_acc_bank_reconciliation_w0003_a
- n: 3
  latex: 3650 + 450 - 230 = 3870
  reason: 'Check: it reconciles'
  check_id: chk_build_acc_bank_reconciliation_w0003_b
final_answer:
  latex: \$\,3650
  check_id: chk_build_acc_bank_reconciliation_w0003_a
