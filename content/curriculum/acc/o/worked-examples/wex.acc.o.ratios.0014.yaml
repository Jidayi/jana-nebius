problem: Last year revenue $40000, cost of sales $28000; this year revenue $42000, cost of sales $27300. Compare the gross margins and suggest a cause.
steps:
- n: 1
  latex: \text{Gross margin each year}
  reason: Same definition both years
  check_id: chk_build_acc_ratios_w0014_t
- n: 2
  latex: \text{Last year} = 30.00\%
  reason: Gross profit over revenue
  check_id: chk_build_acc_ratios_w0014_s2
- n: 3
  latex: \text{This year} = 35.00\%
  reason: Gross profit over revenue
  check_id: chk_build_acc_ratios_w0014_s3
- n: 4
  latex: \text{Change} = 5.00\ \text{points; the margin rose}
  reason: Prices or the cost of goods changed
  check_id: chk_build_acc_ratios_w0014_a
final_answer:
  latex: 5.00\ \text{points}
  check_id: chk_build_acc_ratios_w0014_a
fading_order:
- 4
- 3
- 2
- 1
