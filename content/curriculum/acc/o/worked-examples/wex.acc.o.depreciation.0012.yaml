problem: A machine cost $12000, straight line over 4 years, no residual value. After 2 years' depreciation it is sold for $5000. Find the profit or loss.
steps:
- n: 1
  latex: \text{Result} = \text{proceeds} - \text{net book value}
  reason: Compare with the book value
  check_id: chk_build_acc_depreciation_w0012_t
- n: 2
  latex: \text{Net book value} = 12000 - \frac{12000}{4} \times 2 = 6000
  reason: Cost less accumulated depreciation
  check_id: chk_build_acc_depreciation_w0012_s2
- n: 3
  latex: \text{Result} = 5000 - 6000, \text{ a loss of } 1000
  reason: Positive is a profit
  check_id: chk_build_acc_depreciation_w0012_a
final_answer:
  latex: \text{Loss of }\$\,1000
  check_id: chk_build_acc_depreciation_w0012_a
