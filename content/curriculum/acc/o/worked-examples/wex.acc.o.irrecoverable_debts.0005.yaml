id: wex.acc.o.irrecoverable_debts.0005
kc_ids:
- kc.acc.o.irrecoverable_debts.allowance_change
problem: Old allowance $650; receivables $16000; new allowance 5%. Find the change and its effect on profit.
steps:
- n: 1
  latex: \text{Change} = \text{new} - \text{old}
  reason: Only the change affects profit
  check_id: chk_build_acc_irrecoverable_debts_w0005_t
- n: 2
  latex: \text{New} = 5\% \times 16000 = 800
  reason: This year's allowance
  check_id: chk_build_acc_irrecoverable_debts_w0005_s2
- n: 3
  latex: 800 - 650 \rightarrow 150\ \text{increase}
  reason: An increase reduces profit
  check_id: chk_build_acc_irrecoverable_debts_w0005_a
final_answer:
  latex: \$\,150\ \text{increase}
  check_id: chk_build_acc_irrecoverable_debts_w0005_a
fading_order:
- 3
- 2
- 1
version: 0.1.0
provenance:
  origin: original
  licence: LicenseRef-Own
