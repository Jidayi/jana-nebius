  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_irrecoverable_debts_w0005_a:
    args:
      dp: 2
      expression: abs(16000 * 5/100 - 650)
    tool: math_evaluate
  chk_build_acc_irrecoverable_debts_w0005_s2:
    args:
      dp: 4
      expression: 16000 * 5/100
    tool: math_evaluate
  chk_build_acc_irrecoverable_debts_w0005_s3:
    args:
      dp: 4
      expression: abs(16000 * 5/100 - 650)
    tool: math_evaluate
  chk_build_acc_irrecoverable_debts_w0005_t:
    args:
      adjustments:
      - amount: '1000'
        kind: closing_inventory
      - kind: allowance
        percent: '5'
      dp: 2
      layout: capital_and_liabilities
      trial_balance:
      - account: Sales
        credit: '80000'
        role: revenue
      - account: Purchases
        debit: '40000'
        role: purchases
      - account: Trade receivables
        debit: '16000'
        role: trade_receivables
      - account: Allowance for irrecoverable debts
        credit: '650'
        role: allowance_for_irrecoverable_debts
      - account: Land
        debit: '24650'
        role: non_current_asset
      - account: Inventory
        debit: '1000'
        role: opening_inventory
      - account: Capital
        credit: '1000'
        role: capital
    tool: acc_statements
