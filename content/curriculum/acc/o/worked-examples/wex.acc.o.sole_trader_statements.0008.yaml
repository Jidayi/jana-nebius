problem: A trader has non-current assets of $28000, current assets of $9300, current liabilities of $6100 and a loan repayable in eight years of $8000. Show the sections and find the owner's capital.
steps:
- n: 1
  latex: \text{Assets} = \text{non-current} + \text{current}
  reason: Owned by the business
  check_id: chk_build_acc_sole_trader_statements_w0008_t
- n: 2
  latex: \text{Liabilities} = 6100 + 8000 = 14100
  reason: 'The loan is non-current: due after a year'
  check_id: chk_build_acc_sole_trader_statements_w0008_b
- n: 3
  latex: \text{Capital} = 28000 + 9300 - (6100 + 8000) = 23200
  reason: Assets less liabilities
  check_id: chk_build_acc_sole_trader_statements_w0008_a
final_answer:
  latex: \$\,23200
  check_id: chk_build_acc_sole_trader_statements_w0008_a
fading_order:
- 3
- 2
- 1
