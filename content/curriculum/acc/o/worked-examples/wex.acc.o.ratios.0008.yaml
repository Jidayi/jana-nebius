problem: Opening inventory $3100; closing inventory $2900; cost of sales $27000. Find the rate of inventory turnover.
steps:
- n: 1
  latex: \text{Turnover} = \frac{\text{cost of sales}}{\text{average inventory}}
  reason: Average inventory
  check_id: chk_build_acc_ratios_w0008_t
- n: 2
  latex: \text{Average} = \frac{3100 + 2900}{2} = 3000
  reason: Halve the sum
  check_id: chk_build_acc_ratios_w0008_s2
- n: 3
  latex: \frac{27000}{3000} = 9.00
  reason: Times a year
  check_id: chk_build_acc_ratios_w0008_a
final_answer:
  latex: 9.00\ \text{times}
  check_id: chk_build_acc_ratios_w0008_a
