problem: 'A shop: opening inventory 30 items at $6 each; then bought 90 at $8 each; then sold 80. Value the closing inventory by AVCO.'
steps:
- n: 1
  latex: '\text{AVCO: unit cost} = \frac{\text{value held}}{\text{units held}}'
  reason: Weighted
  check_id: chk_build_acc_inventory_w0004_t
- n: 2
  latex: \text{Average} = \frac{30 \times 6 + 90 \times 8}{30 + 90} = 7.5
  reason: After the purchase
  check_id: chk_build_acc_inventory_w0004_s2
- n: 3
  latex: \text{Closing} = (30 + 90 - 80) \times 7.5 = 300.00
  reason: Units left at the average
  check_id: chk_build_acc_inventory_w0004_a
final_answer:
  latex: \$\,300.00
  check_id: chk_build_acc_inventory_w0004_a
fading_order:
- 3
- 2
- 1
