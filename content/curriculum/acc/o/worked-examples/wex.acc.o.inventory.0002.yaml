id: wex.acc.o.inventory.0002
kc_ids:
- kc.acc.o.inventory.fifo
problem: 'A shop: opening inventory 30 items at $14 each; then bought 50 at $15 each; then sold 40; then bought 30 at $17 each; then sold 20. Value the closing inventory by FIFO.'
steps:
- n: 1
  latex: '\text{FIFO: the goods left are the latest bought}'
  reason: Oldest goods go first
  check_id: chk_build_acc_inventory_w0002_t
- n: 2
  latex: \text{Units left} = (30 + 50 + 30) - (40 + 20) = 50
  reason: In less out
  check_id: chk_build_acc_inventory_w0002_s2
- n: 3
  latex: \text{From the older batch} = 50 - (30) = 20
  reason: The rest come from the batch before
  check_id: chk_build_acc_inventory_w0002_s3
- n: 4
  latex: \text{Closing} = 20 \times 15 + 30 \times 17 = 810
  reason: Value the remaining layers
  check_id: chk_build_acc_inventory_w0002_a
final_answer:
  latex: \$\,810
  check_id: chk_build_acc_inventory_w0002_a
fading_order:
- 4
- 3
- 2
- 1
