problem: An asset cost $24000, residual value $4000, life 5 years, straight line. Find its net book value after 3 years.
steps:
- n: 1
  latex: \text{Net book value} = \text{cost} - \text{accumulated depreciation}
  reason: What is left
  check_id: chk_build_acc_depreciation_w0009_t
- n: 2
  latex: \text{Yearly charge} = \frac{24000 - 4000}{5} = 4000
  reason: Straight line
  check_id: chk_build_acc_depreciation_w0009_s2
- n: 3
  latex: \text{Accumulated} = 4000 \times 3 = 12000
  reason: Every year so far
  check_id: chk_build_acc_depreciation_w0009_s3
- n: 4
  latex: \text{Net book value} = 24000 - 12000 = 12000
  reason: Subtract
  check_id: chk_build_acc_depreciation_w0009_a
final_answer:
  latex: \$\,12000
  check_id: chk_build_acc_depreciation_w0009_a
