problem: 'A trader''s figures: gross profit $31500; rent received $1800; wages $9600; rent $4800; electricity $1350; drawings $6000. Find the profit for the year.'
steps:
- n: 1
  latex: \text{Profit for the year} = \text{gross profit} + \text{other income} - \text{expenses}
  reason: Drawings are not an expense
  check_id: chk_build_acc_sole_trader_statements_w0005_t
- n: 2
  latex: \text{Expenses} = 9600 + 4800 + 1350 = 15750
  reason: Total the expenses
  check_id: chk_build_acc_sole_trader_statements_w0005_s2
- n: 3
  latex: \text{Profit} = 31500 + 1800 - 15750 = 17550
  reason: Substitute
  check_id: chk_build_acc_sole_trader_statements_w0005_a
final_answer:
  latex: \$\,17550
  check_id: chk_build_acc_sole_trader_statements_w0005_a
fading_order:
- 3
- 2
- 1
