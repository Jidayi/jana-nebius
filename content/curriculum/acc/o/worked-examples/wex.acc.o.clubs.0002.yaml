- kc.acc.o.clubs.surplus_deficit
problem: A club received subscriptions of $3900 (all for this year) and paid $2500 for equipment, depreciated by $500. Show what each statement records as spending and find the surplus.
steps:
- n: 1
  latex: '\text{Receipts and payments: the equipment paid; income and expenditure: depreciation}'
  reason: Cash versus matching
  check_id: chk_build_acc_clubs_w0002_t
- n: 2
  latex: \text{Surplus} = 3900 - 500 = 3400
  reason: Income less expenditure
  check_id: chk_build_acc_clubs_w0002_a
final_answer:
  latex: \$\,3400
  check_id: chk_build_acc_clubs_w0002_a
fading_order:
- 2
- 1
