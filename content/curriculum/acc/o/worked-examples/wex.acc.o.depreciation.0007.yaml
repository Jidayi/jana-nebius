problem: Equipment costs $16000 and is depreciated at 25% reducing balance. Find the second year's charge.
steps:
- n: 1
  latex: \text{Charge} = \text{rate} \times \text{opening net book value}
  reason: Reducing balance
  check_id: chk_build_acc_depreciation_w0007_t
- n: 2
  latex: \text{Year 1} = 25\% \times 16000 = 4000
  reason: On cost in the first year
  check_id: chk_build_acc_depreciation_w0007_s2
- n: 3
  latex: \text{Net book value} = 16000 - 4000 = 12000
  reason: What is left
  check_id: chk_build_acc_depreciation_w0007_s3
- n: 4
  latex: \text{Year 2} = 25\% \times 12000 = 3000
  reason: On the reduced balance
  check_id: chk_build_acc_depreciation_w0007_a
final_answer:
  latex: \$\,3000
  check_id: chk_build_acc_depreciation_w0007_a
