problem: Trade receivables $18400; a debt of $400 to write off; allowance 5%. Find the allowance.
steps:
- n: 1
  latex: \text{Allowance} = \text{rate} \times (\text{receivables} - \text{written off})
  reason: After known bad debts
  check_id: chk_build_acc_irrecoverable_debts_w0003_t
- n: 2
  latex: \text{Allowance} = 5\% \times (18400 - 400) = 900
  reason: Substitute
  check_id: chk_build_acc_irrecoverable_debts_w0003_a
final_answer:
  latex: \$\,900
  check_id: chk_build_acc_irrecoverable_debts_w0003_a
fading_order:
- 2
- 1
