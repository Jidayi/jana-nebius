problem: 'A trader''s figures for the year: opening inventory $3600; purchases $28400; carriage inwards $450; closing inventory $4100. Find the cost of sales.'
steps:
- n: 1
  latex: \text{Cost of sales} = \text{opening inventory} + \text{net purchases} + \text{carriage inwards} - \text{closing inventory}
  reason: Carriage outwards is an expense
  check_id: chk_build_acc_sole_trader_statements_w0002_t
- n: 2
  latex: \text{Goods available} = 3600 + 28400 + 450 = 32450
  reason: Everything that could have been sold
  check_id: chk_build_acc_sole_trader_statements_w0002_s2
- n: 3
  latex: \text{Cost of sales} = 32450 - 4100 = 28350
  reason: Less what is left
  check_id: chk_build_acc_sole_trader_statements_w0002_a
final_answer:
  latex: \$\,28350
  check_id: chk_build_acc_sole_trader_statements_w0002_a
fading_order:
- 3
- 2
- 1
