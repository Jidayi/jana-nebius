id: itm.acc.o.depreciation.0003
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.depreciation.capital_revenue_expenditure
stem: Adaeze is sorting the business's spending for the year.
parts:
- id: a
  prompt: Which of these is revenue expenditure?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Replacing worn tyres on the van
      correct: true
    - id: B
      text: Building an extension to the shop
      correct: false
      misconception_id: mc.acc.o.cre_big_amount_rule
    - id: C
      text: Legal fees on buying premises
      correct: false
      misconception_id: mc.acc.o.cre_installation_as_revenue
    - id: D
      text: The cost of installing a new machine
      correct: false
      misconception_id: mc.acc.o.cre_installation_as_revenue
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Ask what each payment buys: something the business keeps for years, or something used up this year?'
  - rung: 2
    name: concept
    text:
      en: Capital expenditure buys or improves a non-current asset, including the costs of getting it ready for use. Revenue expenditure runs and maintains the business.
  - rung: 3
    name: first_step
    text:
      en: Delivery and installation of a new asset are part of its cost. Repairs and running costs only keep things as they were.
  - rung: 4
    name: worked_step
    text:
      en: The size of the amount does not decide it; what it pays for does.
  - rung: 5
    name: full_step
    text:
      en: Replacing worn tyres on the van is revenue expenditure.
  misconception_ids:
  - mc.acc.o.cre_installation_as_revenue
  - mc.acc.o.cre_big_amount_rule
solution:
  steps:
  - n: 1
    latex: \text{Replacing worn tyres on the van} \rightarrow \text{revenue}
    reason: Keeps or improves an asset, or runs the business
