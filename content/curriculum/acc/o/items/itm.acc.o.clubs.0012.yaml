stem: 'A football club: During the year the club received $6500 in subscriptions, including $470 owing from last year. At the end of the year $130 is owing for this year and $110 has been paid in advance for next year.'
parts:
- id: a
  prompt: Calculate the subscriptions income for the year.
  marks: 3
  answer:
    kind: numeric
    value: '6050.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_clubs_0012_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which subscriptions belong to this year, whenever the money arrived?
  - rung: 2
    name: concept
    text:
      en: Income = received − last year's arrears received + paid in advance last year for this year + owing at the end − paid in advance for next year.
  - rung: 3
    name: first_step
    text:
      en: Subscriptions are income of the year they cover, just like rent received.
  - rung: 4
    name: worked_step
    text:
      en: Income = 6500 − 470 + 130 − 110.
  - rung: 5
    name: full_step
    text:
      en: Subscriptions income = $6050.
  misconception_ids:
  - mc.acc.o.club_receipts_only
  - mc.acc.o.club_arrears_reversed
solution:
  steps:
  - n: 1
    latex: \text{Income} = \text{received} - \text{old arrears} + \text{old advance} + \text{new arrears} - \text{new advance}
    reason: Earned this year
    check_id: chk_build_acc_clubs_0012_t
  - n: 2
    latex: \text{Income} = 6500 - 470 + 130 - 110 = 6050
    reason: Substitute
    check_id: chk_build_acc_clubs_0012_a
