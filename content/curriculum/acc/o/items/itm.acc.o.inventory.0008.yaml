id: itm.acc.o.inventory.0008
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.inventory.fifo
stem: 'Kojo''s shop: opening inventory 70 bags of cement at $15 each; then bought 120 at $18 each; then sold 150; then bought 90 at $19 each; then sold 60.'
parts:
- id: a
  prompt: Using FIFO, what is the closing inventory?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $1284.66
      correct: false
      misconception_id: mc.acc.o.inv_avco_for_fifo
    - id: B
      text: $1330
      correct: true
    - id: C
      text: $1050
      correct: false
      misconception_id: mc.acc.o.inv_fifo_reversed
    - id: D
      text: $3590
      correct: false
      misconception_id: mc.acc.o.inv_cos_for_closing
  hints:
  - rung: 1
    name: orient
    text:
      en: Which goods are sold first under FIFO?
  - rung: 2
    name: concept
    text:
      en: The oldest goods go first, so what is left is the newest.
  - rung: 3
    name: first_step
    text:
      en: Closing inventory is what remains, not what was sold.
  - rung: 4
    name: worked_step
    text:
      en: Count the units left and price them from the latest purchase backwards.
  - rung: 5
    name: full_step
    text:
      en: Closing inventory = $1330.
  misconception_ids:
  - mc.acc.o.inv_fifo_reversed
  - mc.acc.o.inv_avco_for_fifo
  - mc.acc.o.inv_cos_for_closing
solution:
  steps:
  - n: 1
    latex: '\text{FIFO: the goods left are the latest bought}'
    reason: Oldest goods go first
    check_id: chk_build_acc_inventory_0008_t
  - n: 2
    latex: \text{Units left} = (70 + 120 + 90) - (150 + 60) = 70
    reason: In less out
    check_id: chk_build_acc_inventory_0008_s2
  - n: 3
    latex: \text{Closing} = 70 \times 19 = 1330
    reason: Value the remaining layers
    check_id: chk_build_acc_inventory_0008_a
