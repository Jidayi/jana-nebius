stem: Adaeze sells 20 items at a list price of $245 each to K. Owusu on credit, less trade discount of 10%.
parts:
- id: a
  prompt: Calculate the amount entered in the sales journal.
  marks: 2
  answer:
    kind: numeric
    value: '4410.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_source_documents_0023_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Trade discount is taken off the list price before anything is recorded.
  - rung: 2
    name: concept
    text:
      en: Amount recorded = list price total − trade discount.
  - rung: 3
    name: first_step
    text:
      en: List price total = 20 × 245.
  - rung: 4
    name: worked_step
    text:
      en: Take 10% off 20 × 245.
  - rung: 5
    name: full_step
    text:
      en: The sales journal shows $4410.
  misconception_ids:
  - mc.acc.o.sd_trade_discount_recorded
solution:
  steps:
  - n: 1
    latex: \text{Recorded} = \text{list price} - \text{trade discount}
    reason: Trade discount is never recorded
    check_id: chk_build_acc_source_documents_0023_t
  - n: 2
    latex: \text{List price} = 20 \times 245 = 4900
    reason: Before discount
    check_id: chk_build_acc_source_documents_0023_s2
  - n: 3
    latex: \text{Recorded} = 4900 - 10\% \times 4900 = 4410
    reason: Less trade discount
    check_id: chk_build_acc_source_documents_0023_a
