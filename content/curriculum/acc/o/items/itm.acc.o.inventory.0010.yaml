    tool: math_evaluate
  chk_build_acc_inventory_0010_s2:
    args:
      dp: 4
      expression: (40 + 80 + 50) - (70 + 50)
    tool: math_evaluate
  chk_build_acc_inventory_0010_t:
    args:
      dp: 2
      method: fifo
      movements:
      - kind: opening
        quantity: 40
        unit_cost: '6'
      - kind: receipt
        quantity: 80
        unit_cost: '7'
      - kind: issue
        quantity: 70
      - kind: receipt
        quantity: 50
        unit_cost: '8'
      - kind: issue
        quantity: 50
