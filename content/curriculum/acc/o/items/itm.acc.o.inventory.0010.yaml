id: itm.acc.o.inventory.0010
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.inventory.fifo
stem: 'Tendai''s shop: opening inventory 40 bags of rice at $6 each; then bought 80 at $7 each; then sold 70; then bought 50 at $8 each; then sold 50.'
parts:
- id: a
  prompt: Using FIFO, what is the closing inventory?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $800
      correct: false
      misconception_id: mc.acc.o.inv_cos_for_closing
    - id: B
      text: $400
      correct: true
    - id: C
      text: $310
      correct: false
      misconception_id: mc.acc.o.inv_fifo_reversed
    - id: D
      text: $366.67
      correct: false
      misconception_id: mc.acc.o.inv_avco_for_fifo
  hints:
  - rung: 1
    name: orient
    text:
      en: Which goods are sold first under FIFO?
  - rung: 2
    name: concept
    text:
      en: The oldest goods go first, so what is left is the newest.
  - rung: 3
    name: first_step
    text:
      en: Closing inventory is what remains, not what was sold.
  - rung: 4
    name: worked_step
    text:
      en: Count the units left and price them from the latest purchase backwards.
  - rung: 5
    name: full_step
    text:
      en: Closing inventory = $400.
  misconception_ids:
  - mc.acc.o.inv_fifo_reversed
  - mc.acc.o.inv_avco_for_fifo
  - mc.acc.o.inv_cos_for_closing
solution:
  steps:
  - n: 1
    latex: '\text{FIFO: the goods left are the latest bought}'
    reason: Oldest goods go first
    check_id: chk_build_acc_inventory_0010_t
  - n: 2
    latex: \text{Units left} = (40 + 80 + 50) - (70 + 50) = 50
    reason: In less out
    check_id: chk_build_acc_inventory_0010_s2
  - n: 3
    latex: \text{Closing} = 50 \times 8 = 400
    reason: Value the remaining layers
    check_id: chk_build_acc_inventory_0010_a
difficulty:
  prior: 0.1
  band: core
estimated_seconds: 45
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
