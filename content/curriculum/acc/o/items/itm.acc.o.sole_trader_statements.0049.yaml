id: itm.acc.o.sole_trader_statements.0049
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.working_capital
stem: 'At the year end Amina''s business has: inventory $11700; trade receivables $3400; prepaid expenses $150; bank overdraft $1700; cash in hand $450; trade payables $8800; accrued expenses $350; equipment $16800; loan repayable in six years $12600.'
parts:
- id: a
  prompt: Calculate the total current assets.
  marks: 2
  answer:
    kind: numeric
    value: '15700.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0049_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Current assets are owned now and turn into cash within a year. Which items qualify?
  - rung: 2
    name: concept
    text:
      en: Inventory, trade receivables, prepayments, a bank balance in credit and cash are current assets. Equipment is non-current and an overdraft is a liability.
  - rung: 3
    name: first_step
    text:
      en: Start with inventory $11700 and trade receivables $3400.
  - rung: 4
    name: worked_step
    text:
      en: Total current assets = 11700 + 3400 + 150 + 450.
  - rung: 5
    name: full_step
    text:
      en: Total current assets = $15700.
  misconception_ids:
  - mc.acc.o.sofp_overdraft_as_asset
  - mc.acc.o.wc_non_current_included
solution:
  steps:
  - n: 1
    latex: \text{Current assets} = \text{inventory} + \text{receivables} + \text{prepayments} + \text{bank} + \text{cash}
    reason: Only items turned into cash within a year
    check_id: chk_build_acc_sole_trader_statements_0049_t
  - n: 2
    latex: \text{Current assets} = 11700 + 3400 + 150 + 450 = 15700
    reason: Add
    check_id: chk_build_acc_sole_trader_statements_0049_a
