id: itm.acc.o.costing.0037
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.margin_of_safety
stem: Aisha makes wooden chairs that sell for $10 each, with variable costs of $3 each and fixed costs of $8750. Expected output is 1800 units.
parts:
- id: a
  prompt: Calculate the margin of safety in units.
  marks: 3
  answer:
    kind: numeric
    value: '550.00'
    unit: units
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_costing_0037_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: How far can output fall before the business makes a loss?
  - rung: 2
    name: concept
    text:
      en: Margin of safety = expected output − break-even output.
  - rung: 3
    name: first_step
    text:
      en: Break-even = fixed costs ÷ contribution per unit.
  - rung: 4
    name: worked_step
    text:
      en: Work out 1800 − 8750 ÷ (10 − 3).
  - rung: 5
    name: full_step
    text:
      en: Margin of safety = 550 units.
  misconception_ids:
  - mc.acc.o.cost_mos_be_as_mos
  - mc.acc.o.cost_mos_output_as_mos
solution:
  steps:
  - n: 1
    latex: \text{Margin of safety} = \text{output} - \text{break-even}
    reason: Room before a loss
    check_id: chk_build_acc_costing_0037_t
  - n: 2
    latex: \text{Break-even} = \frac{8750}{10 - 3} = 1250
    reason: Units
    check_id: chk_build_acc_costing_0037_s2
  - n: 3
    latex: 1800 - 1250 = 550
    reason: Subtract
    check_id: chk_build_acc_costing_0037_a
