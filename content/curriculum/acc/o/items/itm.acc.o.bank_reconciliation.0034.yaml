id: itm.acc.o.bank_reconciliation.0034
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.bank_reconciliation.overdraft_sides
stem: The bank column of a trader's cash book shows a credit balance of $1580.
parts:
- id: a
  prompt: What does this balance mean?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Cheques of $1580 have not yet been presented
      correct: false
      misconception_id: mc.acc.o.br_update_vs_timing
    - id: B
      text: The bank owes the business $1580
      correct: false
      misconception_id: mc.acc.o.br_statement_view_reversed
    - id: C
      text: The business is overdrawn by $1580
      correct: true
    - id: D
      text: The business has $1580 in the bank
      correct: false
      misconception_id: mc.acc.o.br_credit_means_money
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Whose books are these: the business''s own cash book, or the bank''s statement?'
  - rung: 2
    name: concept
    text:
      en: In the business's cash book, money in the bank is a debit balance. The bank's statement shows the same money as a credit, because the bank owes it to the customer.
  - rung: 3
    name: first_step
    text:
      en: So a credit in the cash book, or a debit on the statement, means an overdraft.
  - rung: 4
    name: worked_step
    text:
      en: Decide whose point of view the record takes, then read the balance.
  - rung: 5
    name: full_step
    text:
      en: The business is overdrawn by $1580.
  misconception_ids:
  - mc.acc.o.br_credit_means_money
  - mc.acc.o.br_statement_view_reversed
  - mc.acc.o.br_update_vs_timing
solution:
  steps:
  - n: 1
    latex: '\text{Cash book: debit = money in the bank. Statement: credit = money in the bank}'
    reason: Two points of view
    check_id: chk_build_acc_bank_reconciliation_0034_t
