id: itm.acc.o.bank_reconciliation.0023
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.bank_reconciliation.reconciliation_statement
stem: 'After updating, Ama''s cash book shows a debit bank balance of $3850. Cheques not yet presented: $960, $1080. Lodgements not yet credited by the bank: $410.'
parts:
- id: a
  prompt: Calculate the balance shown on the bank statement.
  marks: 3
  answer:
    kind: numeric
    value: '5480.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_bank_reconciliation_0023_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which items has the bank not yet dealt with?
  - rung: 2
    name: concept
    text:
      en: The bank statement has not yet taken off the unpresented cheques, and has not yet added the outstanding lodgements.
  - rung: 3
    name: first_step
    text:
      en: So the statement balance is higher by the unpresented cheques and lower by the lodgements.
  - rung: 4
    name: worked_step
    text:
      en: Statement balance = 3850 − 410 + 960 + 1080.
  - rung: 5
    name: full_step
    text:
      en: Bank statement balance = $5480.
  misconception_ids:
  - mc.acc.o.br_rec_signs_reversed
  - mc.acc.o.br_unpresented_vs_lodgement
solution:
  steps:
  - n: 1
    latex: \text{Statement balance} + \text{lodgements} - \text{unpresented cheques} = \text{cash book balance}
    reason: The reconciliation
    check_id: chk_build_acc_bank_reconciliation_0023_t
  - n: 2
    latex: 3850 - 410 + 960 + 1080 = 5480
    reason: Substitute
    check_id: chk_build_acc_bank_reconciliation_0023_a
