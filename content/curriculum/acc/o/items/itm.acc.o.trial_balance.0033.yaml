id: itm.acc.o.trial_balance.0033
version: 0.1.0
type: multi_select
subject: acc
level: o
kc_ids:
- kc.acc.o.trial_balance.errors_not_revealed
stem: A trader's bookkeeper has made several kinds of error.
parts:
- id: a
  prompt: Select every error that the trial balance would reveal.
  marks: 2
  answer:
    kind: multi_select
    options:
    - id: A
      text: Wages paid entered only in the wages account
      correct: true
    - id: B
      text: A debit of $450 posted as a credit of $450
      correct: true
    - id: C
      text: Sales of $380 posted to the sales account as $830 and to cash as $380
      correct: true
    - id: D
      text: A credit sale not recorded at all
      correct: false
    - id: E
      text: Rent paid posted to the electricity account
      correct: false
    - id: F
      text: Both entries made for the wrong amount
      correct: false
    scoring: exact_set
  hints:
  - rung: 1
    name: orient
    text:
      en: The trial balance reveals an error only if it makes total debits differ from total credits.
  - rung: 2
    name: concept
    text:
      en: A one-sided entry, a posting to the wrong side of one account, or two different amounts all upset the totals.
  - rung: 3
    name: first_step
    text:
      en: Errors of omission, commission and original entry keep both sides equal.
  - rung: 4
    name: worked_step
    text:
      en: Pick the errors where one side is changed more than the other.
  - rung: 5
    name: full_step
    text:
      en: The one-sided entry, the wrong-side posting and the unequal amounts are revealed.
  misconception_ids:
  - mc.acc.o.err_thinks_tb_reveals
solution:
  steps:
  - n: 1
    latex: '\text{Revealed: one-sided, wrong side, unequal amounts}'
    reason: Debits no longer equal credits
