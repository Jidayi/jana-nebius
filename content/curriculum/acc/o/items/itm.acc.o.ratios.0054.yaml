id: itm.acc.o.ratios.0054
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.ratios.collection_periods
stem: Aisha's credit sales were $50500 and cash sales $12000. Year-end trade receivables were $9000 and trade payables $9300.
parts:
- id: a
  prompt: What is the trade receivables collection period (365-day year)?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 52.56 days
      correct: false
      misconception_id: mc.acc.o.rat_total_sales_used
    - id: B
      text: 65.05 days
      correct: true
    - id: C
      text: 2048.06 days
      correct: false
      misconception_id: mc.acc.o.rat_ratio_inverted
    - id: D
      text: 67.22 days
      correct: false
      misconception_id: mc.acc.o.rat_receivables_payables_swapped
  hints:
  - rung: 1
    name: orient
    text:
      en: Which balance belongs with which sales figure?
  - rung: 2
    name: concept
    text:
      en: Collection period = trade receivables ÷ credit sales × 365.
  - rung: 3
    name: first_step
    text:
      en: Cash sales never become receivables, so they are left out.
  - rung: 4
    name: worked_step
    text:
      en: Divide 9000 by 50500 and multiply by 365.
  - rung: 5
    name: full_step
    text:
      en: The collection period is 65.05 days.
  misconception_ids:
  - mc.acc.o.rat_total_sales_used
  - mc.acc.o.rat_ratio_inverted
  - mc.acc.o.rat_receivables_payables_swapped
solution:
  steps:
  - n: 1
    latex: \text{Period} = \frac{\text{trade receivables}}{\text{credit sales}} \times 365
    reason: The pack's definition
    check_id: chk_build_acc_ratios_0054_t
  - n: 2
    latex: \frac{9000}{50500} \times 365 = 65.05
    reason: Substitute
    check_id: chk_build_acc_ratios_0054_a
