id: itm.acc.o.costing.0034
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.margin_of_safety
stem: Kojo makes wooden chairs that sell for $12 each, with variable costs of $2 each and fixed costs of $28000. Expected output is 4350 units.
parts:
- id: a
  prompt: Calculate the profit at the expected output.
  marks: 3
  answer:
    kind: numeric
    value: '15500.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_costing_0034_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Profit is what is left of total contribution after fixed costs.
  - rung: 2
    name: concept
    text:
      en: Profit = units × contribution per unit − fixed costs.
  - rung: 3
    name: first_step
    text:
      en: Only the units above break-even make profit.
  - rung: 4
    name: worked_step
    text:
      en: Work out 4350 × (12 − 2) − 28000.
  - rung: 5
    name: full_step
    text:
      en: Profit = $15500.
  misconception_ids:
  - mc.acc.o.cost_contribution_as_profit
solution:
  steps:
  - n: 1
    latex: \text{Profit} = \text{total contribution} - \text{fixed costs}
    reason: After fixed costs
    check_id: chk_build_acc_costing_0034_t
  - n: 2
    latex: \text{Total contribution} = 4350 \times (12 - 2) = 43500
    reason: Units times contribution
    check_id: chk_build_acc_costing_0034_s2
  - n: 3
    latex: 43500 - 28000 = 15500
    reason: Less fixed costs
    check_id: chk_build_acc_costing_0034_a
difficulty:
  prior: 0.3
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
