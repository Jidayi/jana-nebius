id: itm.acc.o.ratios.0045
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.ratios.collection_periods
stem: Chipo runs a bakery. Credit purchases $73000; cash purchases $11500; trade payables at the year end $3400.
parts:
- id: a
  prompt: Calculate the trade payables payment period in days (365-day year).
  marks: 2
  answer:
    kind: numeric
    value: '17.00'
    unit: days
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_ratios_0045_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: How many days, on average, does it take to collect or pay a credit debt?
  - rung: 2
    name: concept
    text:
      en: Period = year-end balance ÷ credit sales (or credit purchases) × 365.
  - rung: 3
    name: first_step
    text:
      en: Only credit transactions create receivables or payables, so leave out the cash ones.
  - rung: 4
    name: worked_step
    text:
      en: Divide 3400 by 73000 and multiply by 365.
  - rung: 5
    name: full_step
    text:
      en: The period is 17.00 days.
  misconception_ids:
  - mc.acc.o.rat_total_sales_used
  - mc.acc.o.rat_ratio_inverted
solution:
  steps:
  - n: 1
    latex: \text{Period} = \frac{\text{balance}}{\text{credit transactions}} \times 365
    reason: 'The pack''s definition: credit figures, 365 days'
    check_id: chk_build_acc_ratios_0045_t
  - n: 2
    latex: \frac{3400}{73000} \times 365 = 17.00
    reason: Substitute
    check_id: chk_build_acc_ratios_0045_a
difficulty:
  prior: 0.3
  band: core
estimated_seconds: 90
