id: itm.acc.o.sole_trader_statements.0016
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.gross_profit
- kc.acc.o.sole_trader_statements.cost_of_sales
stem: 'Nia runs a phone repair business. Figures for the year: revenue $77700; opening inventory $8900; purchases $49900; carriage inwards $900; closing inventory $2900.'
parts:
- id: a
  prompt: Calculate the gross profit for the year.
  marks: 3
  answer:
    kind: numeric
    value: '20900.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0016_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Gross profit compares what the goods sold for with what they cost. What two figures do you need?
  - rung: 2
    name: concept
    text:
      en: Gross profit = net revenue − cost of sales, where net revenue is revenue less sales returns.
  - rung: 3
    name: first_step
    text:
      en: 'Find the cost of sales first: opening inventory + net purchases + carriage inwards − closing inventory.'
  - rung: 4
    name: worked_step
    text:
      en: Gross profit = (77700) − (8900 + 49900 + 900 − 2900).
  - rung: 5
    name: full_step
    text:
      en: Net revenue $77700 less cost of sales $56800 gives $20900.
  misconception_ids:
  - mc.acc.o.gp_sales_returns_ignored
  - mc.acc.o.gp_purchases_for_cos
solution:
  steps:
  - n: 1
    latex: \text{Gross profit} = (\text{revenue} - \text{sales returns}) - \text{cost of sales}
    reason: Net revenue less the cost of the goods sold
    check_id: chk_build_acc_sole_trader_statements_0016_t
  - n: 2
    latex: \text{Cost of sales} = 8900 + 49900 + 900 - 2900 = 56800
    reason: Goods available less closing inventory
    check_id: chk_build_acc_sole_trader_statements_0016_s2
  - n: 3
    latex: \text{Net revenue} = 77700 = 77700
    reason: Sales returns reduce revenue
    check_id: chk_build_acc_sole_trader_statements_0016_s3
  - n: 4
    latex: \text{Gross profit} = 77700 - 56800 = 20900
    reason: Subtract
    check_id: chk_build_acc_sole_trader_statements_0016_a
