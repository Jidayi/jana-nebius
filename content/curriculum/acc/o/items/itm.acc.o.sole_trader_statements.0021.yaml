id: itm.acc.o.sole_trader_statements.0021
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.gross_profit
stem: 'Kofi''s figures for the year: revenue $48700; sales returns $300; opening inventory $2500; purchases $35400; closing inventory $6500; wages $6500.'
parts:
- id: a
  prompt: What is the gross profit?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $17000
      correct: true
    - id: B
      text: $17300
      correct: false
      misconception_id: mc.acc.o.gp_sales_returns_ignored
    - id: C
      text: $10500
      correct: false
      misconception_id: mc.acc.o.gp_expenses_deducted
    - id: D
      text: $13000
      correct: false
      misconception_id: mc.acc.o.gp_purchases_for_cos
  hints:
  - rung: 1
    name: orient
    text:
      en: Gross profit is worked out before any running expenses. Which figures belong in it?
  - rung: 2
    name: concept
    text:
      en: Gross profit = (revenue − sales returns) − cost of sales.
  - rung: 3
    name: first_step
    text:
      en: Cost of sales uses the inventories as well as the purchases.
  - rung: 4
    name: worked_step
    text:
      en: Work out (48700 − 300) − (2500 + 35400 − 6500).
  - rung: 5
    name: full_step
    text:
      en: (48700 − 300) − (2500 + 35400 − 6500) = $17000; wages come later, in profit for the year.
  misconception_ids:
  - mc.acc.o.gp_sales_returns_ignored
  - mc.acc.o.gp_purchases_for_cos
  - mc.acc.o.gp_expenses_deducted
solution:
  steps:
  - n: 1
    latex: \text{Gross profit} = (\text{revenue} - \text{sales returns}) - \text{cost of sales}
    reason: Expenses are not deducted yet
    check_id: chk_build_acc_sole_trader_statements_0021_t
  - n: 2
    latex: \text{Gross profit} = (48700 - 300) - (2500 + 35400 - 6500) = 17000
    reason: Substitute
    check_id: chk_build_acc_sole_trader_statements_0021_a
difficulty:
  prior: -0.2
  band: foundation
estimated_seconds: 45
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
