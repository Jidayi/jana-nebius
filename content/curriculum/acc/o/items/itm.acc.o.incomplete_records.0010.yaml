stem: 'Femi''s business on the last day of the year: trade receivables $400; cash in hand $1400; bank balance $20500; premises $23800; a loan $6000; expenses owing $5700.'
parts:
- id: a
  prompt: What is the capital shown by the statement of affairs?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $57800
      correct: false
      misconception_id: mc.acc.o.ae_equation_signs_wrong
    - id: B
      text: $46100
      correct: false
      misconception_id: mc.acc.o.ir_soa_assets_only
    - id: C
      text: $34400
      correct: true
    - id: D
      text: $46400
      correct: false
      misconception_id: mc.acc.o.ir_soa_item_misclassified
  hints:
  - rung: 1
    name: orient
    text:
      en: What does the business own, and what does it owe?
  - rung: 2
    name: concept
    text:
      en: Capital = assets − liabilities.
  - rung: 3
    name: first_step
    text:
      en: Every amount owed reduces the owner's capital.
  - rung: 4
    name: worked_step
    text:
      en: Work out (400 + 1400 + 20500 + 23800) − (6000 + 5700).
  - rung: 5
    name: full_step
    text:
      en: Capital = $34400.
  misconception_ids:
  - mc.acc.o.ae_equation_signs_wrong
  - mc.acc.o.ir_soa_item_misclassified
  - mc.acc.o.ir_soa_assets_only
solution:
  steps:
  - n: 1
    latex: \text{Capital} = \text{assets} - \text{liabilities}
    reason: Statement of affairs
    check_id: chk_build_acc_incomplete_records_0010_t
  - n: 2
    latex: (400 + 1400 + 20500 + 23800) - (6000 + 5700) = 34400
    reason: Substitute
    check_id: chk_build_acc_incomplete_records_0010_a
