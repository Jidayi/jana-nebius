id: itm.acc.o.costing.0035
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.margin_of_safety
stem: Nia makes printed T-shirts that sell for $40 each, with variable costs of $3 each and fixed costs of $74000. Expected output is 3500 units.
parts:
- id: a
  prompt: Calculate the profit at the expected output.
  marks: 3
  answer:
    kind: numeric
    value: '55500.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_costing_0035_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Profit is what is left of total contribution after fixed costs.
  - rung: 2
    name: concept
    text:
      en: Profit = units × contribution per unit − fixed costs.
  - rung: 3
    name: first_step
    text:
      en: Only the units above break-even make profit.
  - rung: 4
    name: worked_step
    text:
      en: Work out 3500 × (40 − 3) − 74000.
  - rung: 5
    name: full_step
    text:
      en: Profit = $55500.
  misconception_ids:
  - mc.acc.o.cost_contribution_as_profit
solution:
  steps:
  - n: 1
    latex: \text{Profit} = \text{total contribution} - \text{fixed costs}
    reason: After fixed costs
    check_id: chk_build_acc_costing_0035_t
  - n: 2
    latex: \text{Total contribution} = 3500 \times (40 - 3) = 129500
    reason: Units times contribution
    check_id: chk_build_acc_costing_0035_s2
  - n: 3
    latex: 129500 - 74000 = 55500
    reason: Less fixed costs
    check_id: chk_build_acc_costing_0035_a
