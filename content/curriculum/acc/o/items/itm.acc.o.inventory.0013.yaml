id: itm.acc.o.inventory.0013
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.inventory.avco
stem: 'Halima''s shop: opening inventory 40 rolls of fabric at $12 each; then bought 70 at $13 each; then sold 40; then bought 100 at $14 each; then sold 20.'
parts:
- id: a
  prompt: Using AVCO (a new average after each purchase), calculate the value of the closing inventory. Give your answer to 2 decimal places.
  marks: 4
  answer:
    kind: numeric
    value: '2015.78'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_inventory_0013_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The weighted average cost changes each time new goods arrive at a different price.
  - rung: 2
    name: concept
    text:
      en: 'After each purchase: average unit cost = total value held ÷ units held. Goods sold are valued at that average.'
  - rung: 3
    name: first_step
    text:
      en: 'After the first purchase: (40 × 12 + 70 × 13) ÷ (40 + 70).'
  - rung: 4
    name: worked_step
    text:
      en: Take out the units sold at that average, add the next purchase, and find the new average.
  - rung: 5
    name: full_step
    text:
      en: Closing inventory = $2015.78.
  misconception_ids:
  - mc.acc.o.inv_simple_average
  - mc.acc.o.inv_fifo_for_avco
solution:
  steps:
  - n: 1
    latex: '\text{AVCO: unit cost} = \frac{\text{value held}}{\text{units held}}'
    reason: Recalculate after each purchase
    check_id: chk_build_acc_inventory_0013_t
  - n: 2
    latex: \text{First average} = \frac{40 \times 12 + 70 \times 13}{40 + 70} = 12.6364
    reason: Weighted by quantity
    check_id: chk_build_acc_inventory_0013_s2
  - n: 3
    latex: \text{Closing inventory} = 2015.78
    reason: After all the movements
    check_id: chk_build_acc_inventory_0013_a
difficulty:
  prior: 0.4
  band: stretch
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 4
  calculator: true
context_tags:
- local_currency
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_inventory_0013_a:
    args:
      dp: 2
      expression: (((((0 + 40 * 12) + 70 * 13) * (110 - 40) / 110) + 100 * 14) * (170 - 20) / 170)
    tool: math_evaluate
  chk_build_acc_inventory_0013_s2:
    args:
      dp: 4
      expression: (40 * 12 + 70 * 13) / (40 + 70)
    tool: math_evaluate
  chk_build_acc_inventory_0013_t:
    args:
      avco_basis: perpetual
      dp: 2
      method: avco
      movements:
      - kind: opening
        quantity: 40
        unit_cost: '12'
      - kind: receipt
        quantity: 70
        unit_cost: '13'
      - kind: issue
        quantity: 40
      - kind: receipt
        quantity: 100
        unit_cost: '14'
      - kind: issue
        quantity: 20
      round_unit_cost: false
    tool: acc_inventory
