stem: 'Nia''s figures for the year: gross profit $22200; commission received $200; discount allowed $2800; insurance $4050; repairs $2100; drawings $4700; new equipment bought $6100.'
parts:
- id: a
  prompt: What is the profit for the year?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $7350
      correct: false
      misconception_id: mc.acc.o.pfy_capital_spending_deducted
    - id: B
      text: $13250
      correct: false
      misconception_id: mc.acc.o.pfy_other_income_omitted
    - id: C
      text: $13450
      correct: true
    - id: D
      text: $8750
      correct: false
      misconception_id: mc.acc.o.pfy_drawings_deducted
  hints:
  - rung: 1
    name: orient
    text:
      en: Some of these figures are not income or expenses of the year. Which ones?
  - rung: 2
    name: concept
    text:
      en: Profit for the year = gross profit + other income − running expenses. Drawings reduce capital; equipment is a non-current asset.
  - rung: 3
    name: first_step
    text:
      en: 'Other income: commission received of $200.'
  - rung: 4
    name: worked_step
    text:
      en: Work out 22200 + 200 − (2800 + 4050 + 2100).
  - rung: 5
    name: full_step
    text:
      en: 22200 + 200 − (2800 + 4050 + 2100) = $13450.
  misconception_ids:
  - mc.acc.o.pfy_drawings_deducted
  - mc.acc.o.pfy_other_income_omitted
  - mc.acc.o.pfy_capital_spending_deducted
solution:
  steps:
  - n: 1
    latex: \text{Profit for the year} = \text{gross profit} + \text{other income} - \text{expenses}
    reason: Only income and expenses of the year
    check_id: chk_build_acc_sole_trader_statements_0032_t
  - n: 2
    latex: \text{Profit for the year} = 22200 + 200 - (2800 + 4050 + 2100) = 13450
    reason: Substitute
    check_id: chk_build_acc_sole_trader_statements_0032_a
