id: itm.acc.o.sole_trader_statements.0018
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.gross_profit
- kc.acc.o.sole_trader_statements.cost_of_sales
stem: 'Yaw runs a stationery shop. Figures for the year: revenue $39100; opening inventory $2800; purchases $27800; purchases returns $1100; carriage inwards $1050; closing inventory $6300.'
parts:
- id: a
  prompt: Calculate the gross profit for the year.
  marks: 3
  answer:
    kind: numeric
    value: '14850.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0018_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Gross profit compares what the goods sold for with what they cost. What two figures do you need?
  - rung: 2
    name: concept
    text:
      en: Gross profit = net revenue − cost of sales, where net revenue is revenue less sales returns.
  - rung: 3
    name: first_step
    text:
      en: 'Find the cost of sales first: opening inventory + net purchases + carriage inwards − closing inventory.'
  - rung: 4
    name: worked_step
    text:
      en: Gross profit = (39100) − (2800 + 27800 − 1100 + 1050 − 6300).
  - rung: 5
    name: full_step
    text:
      en: Net revenue $39100 less cost of sales $24250 gives $14850.
  misconception_ids:
  - mc.acc.o.gp_sales_returns_ignored
  - mc.acc.o.gp_purchases_for_cos
solution:
  steps:
  - n: 1
    latex: \text{Gross profit} = (\text{revenue} - \text{sales returns}) - \text{cost of sales}
    reason: Net revenue less the cost of the goods sold
    check_id: chk_build_acc_sole_trader_statements_0018_t
  - n: 2
    latex: \text{Cost of sales} = 2800 + 27800 - 1100 + 1050 - 6300 = 24250
    reason: Goods available less closing inventory
    check_id: chk_build_acc_sole_trader_statements_0018_s2
  - n: 3
    latex: \text{Net revenue} = 39100 = 39100
    reason: Sales returns reduce revenue
    check_id: chk_build_acc_sole_trader_statements_0018_s3
  - n: 4
    latex: \text{Gross profit} = 39100 - 24250 = 14850
    reason: Subtract
    check_id: chk_build_acc_sole_trader_statements_0018_a
