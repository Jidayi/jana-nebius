id: itm.acc.o.ratios.0043
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.ratios.inventory_turnover
stem: Femi's opening inventory was $11900 and closing inventory $7700. Revenue was $145000 and cost of sales $112000.
parts:
- id: a
  prompt: What is the rate of inventory turnover (times a year)?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 11.43 times
      correct: true
    - id: B
      text: 14.55 times
      correct: false
      misconception_id: mc.acc.o.rat_closing_inventory_used
    - id: C
      text: 0.09 times
      correct: false
      misconception_id: mc.acc.o.rat_ratio_inverted
    - id: D
      text: 14.80 times
      correct: false
      misconception_id: mc.acc.o.rat_revenue_for_cos
  hints:
  - rung: 1
    name: orient
    text:
      en: Which figures are at cost, and which inventory figure does the pack's definition use?
  - rung: 2
    name: concept
    text:
      en: Turnover = cost of sales ÷ average inventory, where average = (opening + closing) ÷ 2.
  - rung: 3
    name: first_step
    text:
      en: Revenue is at selling price, so it does not match inventory at cost.
  - rung: 4
    name: worked_step
    text:
      en: Divide 112000 by (11900 + 7700) ÷ 2.
  - rung: 5
    name: full_step
    text:
      en: Inventory turnover = 11.43 times.
  misconception_ids:
  - mc.acc.o.rat_closing_inventory_used
  - mc.acc.o.rat_revenue_for_cos
  - mc.acc.o.rat_ratio_inverted
solution:
  steps:
  - n: 1
    latex: \text{Turnover} = \frac{\text{cost of sales}}{\text{average inventory}}
    reason: Average inventory
    check_id: chk_build_acc_ratios_0043_t
  - n: 2
    latex: \text{Average inventory} = 9800
    reason: Opening plus closing, halved
    check_id: chk_build_acc_ratios_0043_s2
  - n: 3
    latex: \frac{112000}{9800} = 11.43
    reason: Substitute
    check_id: chk_build_acc_ratios_0043_a
