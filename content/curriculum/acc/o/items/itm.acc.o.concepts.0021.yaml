stem: A trader keeps the firm's money apart from the owner's own money.
parts:
- id: a
  prompt: Select all the items that are drawings under the business entity principle.
  marks: 2
  answer:
    kind: multi_select
    options:
    - id: A
      text: Cash taken for school fees
      correct: true
    - id: B
      text: Goods taken for the family
      correct: true
    - id: C
      text: Business money used to pay the owner's home electricity
      correct: true
    - id: D
      text: Rent of the shop
      correct: false
    - id: E
      text: Wages of the shop assistant
      correct: false
    - id: F
      text: Electricity for the shop
      correct: false
    scoring: exact_set
  hints:
  - rung: 1
    name: orient
    text:
      en: 'What is the accountant deciding here: what to record, at what value, or when?'
  - rung: 2
    name: concept
    text:
      en: 'Entity: the business is separate from its owner. Money measurement: only items with a money value. Duality: every transaction has two sides. Historic cost: record at cost. Going concern: assume the business carries on. Accruals: match income and expenses to the period. Prudence: do not overstate profit or assets. Consistency: keep to the same methods. Realisation: revenue when goods pass to the customer. Materiality: small items need not follow strict treatment.'
  - rung: 3
    name: first_step
    text:
      en: Several principles may seem to fit; choose the one the situation is mainly about.
  - rung: 4
    name: worked_step
    text:
      en: Pick what was for the owner's private benefit.
  - rung: 5
    name: full_step
    text:
      en: School fees, goods for the family and home electricity.
  misconception_ids:
  - mc.acc.o.con_entity_ignored
