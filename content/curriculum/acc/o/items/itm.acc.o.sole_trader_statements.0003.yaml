id: itm.acc.o.sole_trader_statements.0003
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.cost_of_sales
stem: 'Amina runs a clothing shop. Figures for the year: opening inventory $3800; purchases $57200; purchases returns $1800; carriage inwards $800; closing inventory $8900.'
parts:
- id: a
  prompt: Calculate the cost of sales for the year.
  marks: 3
  answer:
    kind: numeric
    value: '51100.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0003_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Cost of sales is the cost of the goods actually sold this year. Which figures change it, and which belong with the expenses?
  - rung: 2
    name: concept
    text:
      en: Goods available = opening inventory + purchases − purchases returns + carriage inwards. Take away the closing inventory to get cost of sales. Carriage outwards is a selling expense.
  - rung: 3
    name: first_step
    text:
      en: Start with the opening inventory of $3800 and add the purchases of $57200.
  - rung: 4
    name: worked_step
    text:
      en: Cost of sales = (3800 + 57200 − 1800 + 800) − 8900.
  - rung: 5
    name: full_step
    text:
      en: Cost of sales = (3800 + 57200 − 1800 + 800) − 8900 = $51100.
  misconception_ids:
  - mc.acc.o.cos_closing_added
  - mc.acc.o.cos_carriage_outwards_included
solution:
  steps:
  - n: 1
    latex: \text{Cost of sales} = \text{opening inventory} + \text{net purchases} + \text{carriage inwards} - \text{closing inventory}
    reason: The goods available less the goods left
    check_id: chk_build_acc_sole_trader_statements_0003_t
  - n: 2
    latex: \text{Goods available} = 3800 + 57200 - 1800 + 800 = 60000
    reason: Opening inventory and net purchases
    check_id: chk_build_acc_sole_trader_statements_0003_s2
  - n: 3
    latex: \text{Cost of sales} = 60000 - 8900 = 51100
    reason: Take away the closing inventory
    check_id: chk_build_acc_sole_trader_statements_0003_a
difficulty:
