id: itm.acc.o.costing.0020
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.contribution
stem: Kojo makes and sells 2950 wooden chairs at $25 each. Variable cost is $17 each and fixed costs are $14800.
parts:
- id: a
  prompt: What is the total contribution?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $123900
      correct: false
      misconception_id: mc.acc.o.cost_vc_added
    - id: B
      text: $73750
      correct: false
      misconception_id: mc.acc.o.cost_fixed_in_contribution
    - id: C
      text: $23600
      correct: true
    - id: D
      text: $8800
      correct: false
      misconception_id: mc.acc.o.cost_contribution_as_profit
  hints:
  - rung: 1
    name: orient
    text:
      en: What does contribution leave out?
  - rung: 2
    name: concept
    text:
      en: Total contribution = units × (selling price − variable cost); fixed costs come off later.
  - rung: 3
    name: first_step
    text:
      en: Contribution minus fixed costs is profit, not contribution.
  - rung: 4
    name: worked_step
    text:
      en: Work out 2950 × (25 − 17).
  - rung: 5
    name: full_step
    text:
      en: Total contribution = $23600.
  misconception_ids:
  - mc.acc.o.cost_contribution_as_profit
  - mc.acc.o.cost_vc_added
  - mc.acc.o.cost_fixed_in_contribution
solution:
  steps:
  - n: 1
    latex: \text{Contribution} = \text{units} \times (\text{price} - \text{variable cost})
    reason: Before fixed costs
    check_id: chk_build_acc_costing_0020_t
  - n: 2
    latex: 2950 \times (25 - 17) = 23600
    reason: Substitute
    check_id: chk_build_acc_costing_0020_a
difficulty:
  prior: -0.2
  band: foundation
