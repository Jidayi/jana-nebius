stem: Tendai is drawing up the year's accounts.
parts:
- id: a
  prompt: Electricity is used in December, but the bill comes in January. How is it treated under the accruals principle?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It is an expense of December's year, shown as an accrual
      correct: true
    - id: B
      text: It is an expense of next year, when it is paid
      correct: false
      misconception_id: mc.acc.o.con_cash_basis_principle
    - id: C
      text: It is ignored because no bill has arrived
      correct: false
      misconception_id: mc.acc.o.con_prudence_realisation_confused
    - id: D
      text: It is treated as drawings
      correct: false
      misconception_id: mc.acc.o.con_entity_ignored
  hints:
  - rung: 1
    name: orient
    text:
      en: 'What is the accountant deciding here: what to record, at what value, or when?'
  - rung: 2
    name: concept
    text:
      en: 'Entity: the business is separate from its owner. Money measurement: only items with a money value. Duality: every transaction has two sides. Historic cost: record at cost. Going concern: assume the business carries on. Accruals: match income and expenses to the period. Prudence: do not overstate profit or assets. Consistency: keep to the same methods. Realisation: revenue when goods pass to the customer. Materiality: small items need not follow strict treatment.'
  - rung: 3
    name: first_step
    text:
      en: Several principles may seem to fit; choose the one the situation is mainly about.
  - rung: 4
    name: worked_step
    text:
      en: Apply the named principle.
  - rung: 5
    name: full_step
    text:
      en: It is an expense of December's year, shown as an accrual.
  misconception_ids:
  - mc.acc.o.con_cash_basis_principle
  - mc.acc.o.con_prudence_realisation_confused
  - mc.acc.o.con_entity_ignored
