id: itm.acc.o.costing.0021
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.contribution
stem: Sipho makes and sells 1650 solar lamps at $8 each. Variable cost is $5 each and fixed costs are $1950.
parts:
- id: a
  prompt: What is the total contribution?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $13200
      correct: false
      misconception_id: mc.acc.o.cost_fixed_in_contribution
    - id: B
      text: $3000
      correct: false
      misconception_id: mc.acc.o.cost_contribution_as_profit
    - id: C
      text: $4950
      correct: true
    - id: D
      text: $21450
      correct: false
      misconception_id: mc.acc.o.cost_vc_added
  hints:
  - rung: 1
    name: orient
    text:
      en: What does contribution leave out?
  - rung: 2
    name: concept
    text:
      en: Total contribution = units × (selling price − variable cost); fixed costs come off later.
  - rung: 3
    name: first_step
    text:
      en: Contribution minus fixed costs is profit, not contribution.
  - rung: 4
    name: worked_step
    text:
      en: Work out 1650 × (8 − 5).
  - rung: 5
    name: full_step
    text:
      en: Total contribution = $4950.
  misconception_ids:
  - mc.acc.o.cost_contribution_as_profit
  - mc.acc.o.cost_vc_added
  - mc.acc.o.cost_fixed_in_contribution
solution:
  steps:
  - n: 1
    latex: \text{Contribution} = \text{units} \times (\text{price} - \text{variable cost})
    reason: Before fixed costs
    check_id: chk_build_acc_costing_0021_t
  - n: 2
    latex: 1650 \times (8 - 5) = 4950
    reason: Substitute
    check_id: chk_build_acc_costing_0021_a
difficulty:
  prior: -0.2
  band: foundation
estimated_seconds: 45
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
context_tags:
- local_currency
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_costing_0021_a:
    args:
      dp: 2
      expression: 1650 * (8 - 5)
    tool: math_evaluate
  chk_build_acc_costing_0021_t:
    args:
      dp: 2
      fixed_costs: '1950'
      output_units: 1650
      selling_price: '8'
      variable_cost_per_unit: '5'
    tool: acc_break_even
