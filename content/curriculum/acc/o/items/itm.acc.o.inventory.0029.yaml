id: itm.acc.o.inventory.0029
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.inventory.lower_cost_nrv
stem: At the year end Halima holds 115 crates of soda that cost $69 each. They can be sold for $77 each, but each needs $3 spent on it before it can be sold.
parts:
- id: a
  prompt: Calculate the value of this inventory.
  marks: 3
  answer:
    kind: numeric
    value: '7935.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_inventory_0029_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Inventory is valued at the lower of two figures. Which two?
  - rung: 2
    name: concept
    text:
      en: Net realisable value = selling price − costs needed to sell. Use the lower of cost and NRV.
  - rung: 3
    name: first_step
    text:
      en: NRV per item = 77 − 3.
  - rung: 4
    name: worked_step
    text:
      en: Compare 69 with 77 − 3; multiply the lower by 115.
  - rung: 5
    name: full_step
    text:
      en: Each item is valued at $69, so the inventory is worth $7935.
  misconception_ids:
  - mc.acc.o.inv_selling_price_used
  - mc.acc.o.inv_nrv_ignored
solution:
  steps:
  - n: 1
    latex: \text{Value} = \text{quantity} \times \text{lower of cost and NRV}
    reason: Prudence
    check_id: chk_build_acc_inventory_0029_t
  - n: 2
    latex: \text{NRV} = 77 - 3 = 74
    reason: Selling price less costs to sell
    check_id: chk_build_acc_inventory_0029_s2
  - n: 3
    latex: \text{Value} = 115 \times 69 = 7935
    reason: The lower figure
    check_id: chk_build_acc_inventory_0029_a
difficulty:
  prior: 0.1
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
