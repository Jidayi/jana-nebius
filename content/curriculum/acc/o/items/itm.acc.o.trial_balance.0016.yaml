stem: 'Femi''s ledger balances at the year end: wages $11300; discount allowed $2250; discount received $2400; bank $1350; drawings $7550; purchases $32950; sales $50900; trade payables $5550; rent received $1750; rent $2450; sales returns $300; equipment $18500; capital $16050.'
parts:
- id: a
  prompt: Calculate the total of the debit column of the trial balance.
  marks: 3
  answer:
    kind: numeric
    value: '76650.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_trial_balance_0016_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Sort the balances into debits and credits before adding anything.
  - rung: 2
    name: concept
    text:
      en: Assets, expenses and drawings are debits; capital, liabilities and income are credits.
  - rung: 3
    name: first_step
    text:
      en: Bank in hand is an asset; drawings are a debit even though they relate to capital.
  - rung: 4
    name: worked_step
    text:
      en: Debit total = 300 + 11300 + 32950 + 18500 + 2250 + 2450 + 7550 + 1350.
  - rung: 5
    name: full_step
    text:
      en: Debit total = $76650, which equals the credit total.
  misconception_ids:
  - mc.acc.o.tb_drawings_credit
  - mc.acc.o.tb_returns_with_main
solution:
  steps:
  - n: 1
    latex: \text{Debit column} = \text{assets} + \text{expenses} + \text{drawings}
    reason: Each balance on its normal side
    check_id: chk_build_acc_trial_balance_0016_t
  - n: 2
    latex: \text{Debit column} = 300 + 11300 + 32950 + 18500 + 2250 + 2450 + 7550 + 1350 = 76650
    reason: Add the debit balances
    check_id: chk_build_acc_trial_balance_0016_a
