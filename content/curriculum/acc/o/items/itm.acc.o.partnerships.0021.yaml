kc_ids:
- kc.acc.o.partnerships.interest_and_salary
stem: 'Chipo and Kofi are partners. Their agreement gives interest on capital at 8% a year, a salary of $4000 a year to Chipo, interest on drawings at 2%, and shares the remaining profit Chipo 1 : Kofi 1. Capitals: Chipo $50000, Kofi $49000. Drawings for the year: Chipo $10400, Kofi $4300. Profit for the year: $47000.'
parts:
- id: a
  prompt: What is the net amount appropriated to Chipo before the share of the remaining profit?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $11712
      correct: false
      misconception_id: mc.acc.o.pa_rate_on_wrong_base
    - id: B
      text: $7792
      correct: true
    - id: C
      text: $8208
      correct: false
      misconception_id: mc.acc.o.pa_iod_added
    - id: D
      text: $3792
      correct: false
      misconception_id: mc.acc.o.pa_salary_omitted
  hints:
  - rung: 1
    name: orient
    text:
      en: List what the partner is given and what the partner is charged.
  - rung: 2
    name: concept
    text:
      en: 'Given: interest on their own capital and any salary. Charged: interest on their own drawings.'
  - rung: 3
    name: first_step
    text:
      en: Each partner's interest is worked out on that partner's own capital and drawings.
  - rung: 4
    name: worked_step
    text:
      en: Work out 8% of 50000 + 4000 − 2% of 10400.
  - rung: 5
    name: full_step
    text:
      en: Chipo's net appropriation is $7792.
  misconception_ids:
  - mc.acc.o.pa_iod_added
  - mc.acc.o.pa_salary_omitted
  - mc.acc.o.pa_rate_on_wrong_base
solution:
  steps:
  - n: 1
    latex: \text{Net} = \text{interest on capital} + \text{salary} - \text{interest on drawings}
    reason: Given less charged
    check_id: chk_build_acc_partnerships_0021_t
  - n: 2
    latex: 50000 \times 8\% + 4000 - 10400 \times 2\% = 7792
    reason: Substitute
    check_id: chk_build_acc_partnerships_0021_a
