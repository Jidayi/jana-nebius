id: itm.acc.o.double_entry.0003
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.double_entry.debit_credit_rules
stem: Kofi is learning where each change in an account is recorded.
parts:
- id: a
  prompt: Which of these is recorded on the credit side of the account that changes?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: An increase in an expense such as rent
      correct: false
      misconception_id: mc.acc.o.de_class_confused
    - id: B
      text: A decrease in a liability, such as part of a loan repaid
      correct: false
      misconception_id: mc.acc.o.de_decrease_same_side
    - id: C
      text: An increase in sales
      correct: true
    - id: D
      text: An increase in money in the bank
      correct: false
      misconception_id: mc.acc.o.de_bank_view
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Think about the class of the account: asset, expense, liability, capital or income.'
  - rung: 2
    name: concept
    text:
      en: Assets, expenses and drawings increase on the debit side. Liabilities, capital and income increase on the credit side. A decrease goes on the opposite side to an increase.
  - rung: 3
    name: first_step
    text:
      en: In your own books, money coming into the bank is a debit in the Bank account, even though the bank's statement shows it as a credit.
  - rung: 4
    name: worked_step
    text:
      en: Find the change that is an increase in a liability, capital or income, or a decrease in an asset or expense.
  - rung: 5
    name: full_step
    text:
      en: An increase in sales is a credit.
  misconception_ids:
  - mc.acc.o.de_bank_view
  - mc.acc.o.de_class_confused
  - mc.acc.o.de_decrease_same_side
solution:
  steps:
  - n: 1
    latex: '\text{Liabilities, capital, income: increase} \rightarrow \text{credit}'
    reason: The rule for each class
