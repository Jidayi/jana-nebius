id: itm.acc.o.accruals_prepayments.0006
version: 0.1.1
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.accruals_prepayments.accrued_expense
stem: Nomsa runs a tailoring business. During the year $5500 was paid for advertising. At the year end $800 for advertising was still owing; at the start of the year $750 had been owing, and was paid during the year.
parts:
- id: a
  prompt: Calculate the advertising expense for the year in the income statement.
  marks: 2
  answer:
    kind: numeric
    value: '5550.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_accruals_prepayments_0006_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The income statement shows the cost of what was used this year, whether paid or not.
  - rung: 2
    name: concept
    text:
      en: Expense for the year = amount paid + amount owing at the end − amount owing at the start.
  - rung: 3
    name: first_step
    text:
      en: An amount still owing at the end belongs to this year, so it is added.
  - rung: 4
    name: worked_step
    text:
      en: Expense = 5500 + 800 − 750.
  - rung: 5
    name: full_step
    text:
      en: The advertising expense is $5550.
  misconception_ids:
  - mc.acc.o.acc_accrual_subtracted
  - mc.acc.o.acc_cash_basis
solution:
  steps:
  - n: 1
    latex: \text{Expense} = \text{paid} + \text{closing accrual} - \text{opening accrual}
    reason: Match the cost to the year it was used
    check_id: chk_build_acc_accruals_prepayments_0006_t
  - n: 2
    latex: \text{Expense} = 5500 + 800 - 750 = 5550
    reason: Substitute
    check_id: chk_build_acc_accruals_prepayments_0006_a
