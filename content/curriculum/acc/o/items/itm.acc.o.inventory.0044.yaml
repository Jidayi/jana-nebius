id: itm.acc.o.inventory.0044
version: 0.1.0
type: multi_select
subject: acc
level: o
kc_ids:
- kc.acc.o.inventory.inventory_profit_effect
stem: Last year's closing inventory was understated and not corrected.
parts:
- id: a
  prompt: Select every true effect on this year's accounts.
  marks: 2
  answer:
    kind: multi_select
    options:
    - id: A
      text: Opening inventory is understated
      correct: true
    - id: B
      text: Cost of sales is understated
      correct: true
    - id: C
      text: Gross profit is overstated
      correct: true
    - id: D
      text: Gross profit is understated
      correct: false
    - id: E
      text: Closing inventory is understated
      correct: false
    - id: F
      text: Purchases are overstated
      correct: false
    scoring: exact_set
  hints:
  - rung: 1
    name: orient
    text:
      en: Closing inventory is subtracted in cost of sales; opening inventory is added.
  - rung: 2
    name: concept
    text:
      en: A higher closing inventory means a lower cost of sales and so a higher profit. A higher opening inventory means a higher cost of sales and a lower profit.
  - rung: 3
    name: first_step
    text:
      en: This year's closing inventory is next year's opening inventory, so an error carries into next year in the opposite direction.
  - rung: 4
    name: worked_step
    text:
      en: Pick the effects of a low opening inventory.
  - rung: 5
    name: full_step
    text:
      en: Low opening inventory and cost of sales; high gross profit.
  misconception_ids:
  - mc.acc.o.inv_opening_closing_confused
solution:
  steps:
  - n: 1
    latex: '\text{Low opening inventory: profit too high}'
    reason: The error carries forward
