kc_ids:
- kc.acc.o.source_documents.cash_discount
stem: Tariq sold goods to S. Achieng with a list price of $5900, less 25% trade discount. S. Achieng pays within the agreed time and takes a cash discount of 3%.
parts:
- id: a
  prompt: Calculate the amount paid by the customer.
  marks: 3
  answer:
    kind: numeric
    value: '4292.25'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_source_documents_0034_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which discount is taken first, and on what amount is the cash discount worked out?
  - rung: 2
    name: concept
    text:
      en: Cash discount is a percentage of the invoice amount, which is already after trade discount.
  - rung: 3
    name: first_step
    text:
      en: Amount paid = invoice amount − cash discount.
  - rung: 4
    name: worked_step
    text:
      en: Invoice = 5900 less 25%; then take 3% of it.
  - rung: 5
    name: full_step
    text:
      en: Invoice $4425; cash discount $132.75; amount paid $4292.25.
  misconception_ids:
  - mc.acc.o.sd_cash_discount_on_list_price
  - mc.acc.o.sd_discount_as_payment
solution:
  steps:
  - n: 1
    latex: \text{Cash discount} = \text{rate} \times \text{invoice after trade discount}
    reason: Discount allowed for prompt payment
    check_id: chk_build_acc_source_documents_0034_t
  - n: 2
    latex: \text{Invoice} = 4425
    reason: After trade discount
    check_id: chk_build_acc_source_documents_0034_s2
  - n: 3
    latex: \text{Discount} = 3\% \times 4425 = 132.75
    reason: Cash discount
    check_id: chk_build_acc_source_documents_0034_s3
  - n: 4
    latex: \text{Paid} = 4425 - 132.75 = 4292.25
    reason: What the customer pays
    check_id: chk_build_acc_source_documents_0034_s4
