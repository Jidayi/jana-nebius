id: itm.acc.o.sole_trader_statements.0009
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.cost_of_sales
stem: 'Bola''s figures for the year: opening inventory $4300; purchases $28000; purchases returns $1600; carriage inwards $250; carriage outwards $650; closing inventory $6200.'
parts:
- id: a
  prompt: What is the cost of sales?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $37150
      correct: false
      misconception_id: mc.acc.o.cos_closing_added
    - id: B
      text: $24750
      correct: true
    - id: C
      text: $25400
      correct: false
      misconception_id: mc.acc.o.cos_carriage_outwards_included
    - id: D
      text: $27950
      correct: false
      misconception_id: mc.acc.o.cos_returns_added
  hints:
  - rung: 1
    name: orient
    text:
      en: Which of these figures are part of the cost of the goods sold, and which are expenses of selling?
  - rung: 2
    name: concept
    text:
      en: Goods returned to suppliers reduce purchases. Goods still in stock at the end were not sold.
  - rung: 3
    name: first_step
    text:
      en: Carriage inwards is part of the cost of buying goods; carriage outwards is not.
  - rung: 4
    name: worked_step
    text:
      en: Work out (4300 + 28000 − 1600 + 250) − 6200.
  - rung: 5
    name: full_step
    text:
      en: Cost of sales = (4300 + 28000 − 1600 + 250) − 6200 = $24750.
  misconception_ids:
  - mc.acc.o.cos_closing_added
  - mc.acc.o.cos_returns_added
  - mc.acc.o.cos_carriage_outwards_included
solution:
  steps:
  - n: 1
    latex: \text{Cost of sales} = \text{opening inventory} + \text{purchases} - \text{returns} + \text{carriage inwards} - \text{closing inventory}
    reason: Carriage outwards is an expense
    check_id: chk_build_acc_sole_trader_statements_0009_t
  - n: 2
    latex: \text{Cost of sales} = 4300 + 28000 - 1600 + 250 - 6200 = 24750
    reason: Substitute
    check_id: chk_build_acc_sole_trader_statements_0009_a
