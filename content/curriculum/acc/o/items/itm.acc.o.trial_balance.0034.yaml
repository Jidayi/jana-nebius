id: itm.acc.o.trial_balance.0034
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.trial_balance.correcting_entries
stem: 'Kofi''s bookkeeper finds this error: A credit purchase invoice from Mensah Wholesalers for $3150 was entered in both accounts as $3000.'
parts:
- id: a
  prompt: Which journal entry corrects it?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Debit Purchases $150; credit Mensah Wholesalers $150
      correct: true
    - id: B
      text: Debit Purchases $150; credit Suspense $150
      correct: false
      misconception_id: mc.acc.o.corr_through_suspense
    - id: C
      text: Debit Mensah Wholesalers $150; credit Purchases $150
      correct: false
      misconception_id: mc.acc.o.corr_direction_reversed
    - id: D
      text: Debit Purchases $3150; credit Mensah Wholesalers $3150
      correct: false
      misconception_id: mc.acc.o.corr_full_amount
  hints:
  - rung: 1
    name: orient
    text:
      en: First write down the entry that was made and the entry that should have been made.
  - rung: 2
    name: concept
    text:
      en: The correction moves each account from what was recorded to what should have been recorded.
  - rung: 3
    name: first_step
    text:
      en: If the sides were swapped, the correction is twice the amount. If the amount was wrong, correct only the difference. Errors that do not upset the totals never use suspense.
  - rung: 4
    name: worked_step
    text:
      en: Which account is too low on its debit side, and which too low on its credit side?
  - rung: 5
    name: full_step
    text:
      en: Debit Purchases and credit Mensah Wholesalers, each $150.
  misconception_ids:
  - mc.acc.o.corr_direction_reversed
  - mc.acc.o.corr_full_amount
  - mc.acc.o.corr_through_suspense
solution:
  steps:
  - n: 1
    latex: \text{Correction} = \text{correct entry} - \text{recorded entry}
    reason: Undo what is wrong
    check_id: chk_build_acc_trial_balance_0034_t
  - n: 2
    latex: \text{Debit Purchases}\ 150;\ \text{credit Mensah Wholesalers}\ 150
    reason: The correcting journal entry
    check_id: chk_build_acc_trial_balance_0034_a
