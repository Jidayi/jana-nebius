stem: 'The Bank account started the month with a debit balance of $1350. Receipts: commission received $2050; sales $1700; rent received $2100. Payments: purchases $350; stationery $700.'
parts:
- id: a
  prompt: What balance is brought down at the start of next month?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $7200 on the debit side
      correct: false
      misconception_id: mc.acc.o.de_total_as_balance
    - id: B
      text: $6150 on the credit side
      correct: false
      misconception_id: mc.acc.o.de_balance_side_reversed
    - id: C
      text: $6150 on the debit side
      correct: true
    - id: D
      text: $4800 on the debit side
      correct: false
      misconception_id: mc.acc.o.de_opening_balance_omitted
  hints:
  - rung: 1
    name: orient
    text:
      en: Total each side of the account, including the opening balance.
  - rung: 2
    name: concept
    text:
      en: The balance carried down goes on the smaller side; it is brought down on the opposite side.
  - rung: 3
    name: first_step
    text:
      en: A bank or cash account with more received than paid has a debit balance.
  - rung: 4
    name: worked_step
    text:
      en: Work out (1350 + 2050 + 1700 + 2100) − (350 + 700).
  - rung: 5
    name: full_step
    text:
      en: $6150 is carried down on the credit side and brought down on the debit side.
  misconception_ids:
  - mc.acc.o.de_balance_side_reversed
  - mc.acc.o.de_opening_balance_omitted
  - mc.acc.o.de_total_as_balance
solution:
  steps:
  - n: 1
    latex: \text{Balance c/d} = \text{larger side} - \text{smaller side}
    reason: Balance off the account
    check_id: chk_build_acc_double_entry_0054_t
  - n: 2
    latex: \text{Balance} = (1350 + 2050 + 1700 + 2100) - (350 + 700) = 6150
    reason: Subtract
    check_id: chk_build_acc_double_entry_0054_a
