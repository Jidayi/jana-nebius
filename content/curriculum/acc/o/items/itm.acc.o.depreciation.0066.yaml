id: itm.acc.o.depreciation.0066
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.depreciation.disposal
stem: 'Nia''s business bought a grain mill for $21800 in 2022. It is depreciated by the straight-line method over 8 years with a residual value of $100: a full year''s charge in the year of purchase and none in the year of sale. The grain mill was sold in 2025 for $13250.'
parts:
- id: a
  prompt: What is the result of the disposal?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Loss of $3125
      correct: false
      misconception_id: mc.acc.o.disp_disposal_year_depreciated
    - id: B
      text: Loss of $8550
      correct: false
      misconception_id: mc.acc.o.disp_cost_not_nbv
    - id: C
      text: Profit of $412.50
      correct: false
      misconception_id: mc.acc.o.disp_sign_reversed
    - id: D
      text: Loss of $412.50
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: What was the asset worth in the books when it was sold?
  - rung: 2
    name: concept
    text:
      en: 'Result = proceeds − net book value: positive is a profit, negative a loss.'
  - rung: 3
    name: first_step
    text:
      en: No depreciation is charged in the year of sale under this policy.
  - rung: 4
    name: worked_step
    text:
      en: Find the net book value after 2025 − 2022 years of charges, then compare it with the proceeds.
  - rung: 5
    name: full_step
    text:
      en: 'Net book value $13662.50 against proceeds $13250: loss of $412.50.'
  misconception_ids:
  - mc.acc.o.disp_sign_reversed
  - mc.acc.o.disp_cost_not_nbv
  - mc.acc.o.disp_disposal_year_depreciated
solution:
  steps:
  - n: 1
    latex: \text{Profit or loss} = \text{proceeds} - \text{net book value}
    reason: Compare with what is left
    check_id: chk_build_acc_depreciation_0066_t
  - n: 2
    latex: \text{Years charged} = 2025 - 2022 = 3
    reason: None in the year of sale
    check_id: chk_build_acc_depreciation_0066_s2
  - n: 3
    latex: \text{Yearly charge} = \frac{21800 - 100}{8} = 2712.50
    reason: Straight line
    check_id: chk_build_acc_depreciation_0066_s3
  - n: 4
    latex: \text{Net book value} = 21800 - 2712.50 \times 3 = 13662.50
    reason: Years charged before the sale
    check_id: chk_build_acc_depreciation_0066_s4
  - n: 5
    latex: 13250 - 13662.50 \rightarrow 412.50
    reason: Proceeds less net book value
    check_id: chk_build_acc_depreciation_0066_s5
difficulty:
  prior: 0.5
  band: stretch
estimated_seconds: 45
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
context_tags:
- local_currency
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_depreciation_0066_s2:
    args:
      dp: 4
      expression: 2025 - 2022
    tool: math_evaluate
  chk_build_acc_depreciation_0066_s3:
    args:
      dp: 4
      expression: (21800 - 100) / 8
    tool: math_evaluate
  chk_build_acc_depreciation_0066_s4:
    args:
      dp: 4
      expression: 21800 - (21800 - 100) / 8 * (2025 - 2022)
    tool: math_evaluate
  chk_build_acc_depreciation_0066_s5:
    args:
      dp: 4
      expression: abs(13250 - (21800 - (21800 - 100) / 8 * (2025 - 2022)))
    tool: math_evaluate
  chk_build_acc_depreciation_0066_t:
    args:
      cost: '21800'
      disposal:
        proceeds: '13250'
        year: 4
      dp: 2
      life_years: 8
      method: straight_line
      part_year_policy: full_year
      residual: '100'
    tool: acc_depreciation
