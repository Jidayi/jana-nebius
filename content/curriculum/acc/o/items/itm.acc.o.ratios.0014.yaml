id: itm.acc.o.ratios.0014
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.ratios.mark_up
stem: 'Aisha runs a farm supplies shop. For the year: revenue $93100; cost of sales $64500.'
parts:
- id: a
  prompt: Calculate the mark-up as a percentage. Give your answer to 2 decimal places.
  marks: 2
  answer:
    kind: numeric
    value: '44.34'
    unit: '%'
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_ratios_0014_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Mark-up compares the profit on goods with what the goods cost.
  - rung: 2
    name: concept
    text:
      en: Mark-up = gross profit ÷ cost of sales, as a percentage.
  - rung: 3
    name: first_step
    text:
      en: Gross profit = revenue − cost of sales.
  - rung: 4
    name: worked_step
    text:
      en: Divide (93100 − 64500) by 64500 and write it as a percentage.
  - rung: 5
    name: full_step
    text:
      en: Mark-up = 44.34%.
  misconception_ids:
  - mc.acc.o.rat_margin_markup_confused
solution:
  steps:
  - n: 1
    latex: \text{Mark-up} = \frac{\text{gross profit}}{\text{cost of sales}}
    reason: Profit on cost
    check_id: chk_build_acc_ratios_0014_t
  - n: 2
    latex: \text{Gross profit} = 93100 - 64500 = 28600
    reason: Revenue less cost of sales
    check_id: chk_build_acc_ratios_0014_s2
  - n: 3
    latex: \frac{28600}{64500} \rightarrow 44.34\%
    reason: As a percentage
    check_id: chk_build_acc_ratios_0014_a
