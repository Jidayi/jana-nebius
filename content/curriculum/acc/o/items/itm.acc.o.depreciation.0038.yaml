id: itm.acc.o.depreciation.0038
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.depreciation.reducing_balance
stem: Aisha bought a delivery van for $7900. It is depreciated at 15% a year by the reducing-balance method.
parts:
- id: a
  prompt: Calculate the depreciation charge for the second year.
  marks: 3
  answer:
    kind: numeric
    value: '1007.25'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_depreciation_0038_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The reducing-balance method takes the same percentage each year, but of a smaller amount.
  - rung: 2
    name: concept
    text:
      en: Each year's charge = rate × net book value at the start of that year.
  - rung: 3
    name: first_step
    text:
      en: Year 1 charge = 15% of $7900. Take it off the cost to get the net book value for year 2.
  - rung: 4
    name: worked_step
    text:
      en: Keep going until you reach the start of the second year, then take 15% of that value.
  - rung: 5
    name: full_step
    text:
      en: The second year's charge is 15% of $6715 = $1007.25.
  misconception_ids:
  - mc.acc.o.rb_on_cost
  - mc.acc.o.rb_nbv_as_charge
solution:
  steps:
  - n: 1
    latex: \text{Charge} = \text{rate} \times \text{net book value at the start of the year}
    reason: The charge falls each year
    check_id: chk_build_acc_depreciation_0038_t
  - n: 2
    latex: \text{Net book value after year 1} = 6715
    reason: Cost less depreciation so far
    check_id: chk_build_acc_depreciation_0038_s2
  - n: 3
    latex: \text{This year's charge} = 15\% \times 6715 = 1007.25
    reason: Rate on the reduced balance
    check_id: chk_build_acc_depreciation_0038_a
