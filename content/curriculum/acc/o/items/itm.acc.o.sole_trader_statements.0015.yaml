stem: 'Lindiwe runs a clothing shop. Figures for the year: revenue $64500; sales returns $200; opening inventory $4200; purchases $40400; purchases returns $700; carriage inwards $550; closing inventory $2300.'
parts:
- id: a
  prompt: Calculate the gross profit for the year.
  marks: 3
  answer:
    kind: numeric
    value: '22150.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0015_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Gross profit compares what the goods sold for with what they cost. What two figures do you need?
  - rung: 2
    name: concept
    text:
      en: Gross profit = net revenue − cost of sales, where net revenue is revenue less sales returns.
  - rung: 3
    name: first_step
    text:
      en: 'Find the cost of sales first: opening inventory + net purchases + carriage inwards − closing inventory.'
  - rung: 4
    name: worked_step
    text:
      en: Gross profit = (64500 − 200) − (4200 + 40400 − 700 + 550 − 2300).
  - rung: 5
    name: full_step
    text:
      en: Net revenue $64300 less cost of sales $42150 gives $22150.
  misconception_ids:
  - mc.acc.o.gp_sales_returns_ignored
  - mc.acc.o.gp_purchases_for_cos
solution:
  steps:
  - n: 1
    latex: \text{Gross profit} = (\text{revenue} - \text{sales returns}) - \text{cost of sales}
    reason: Net revenue less the cost of the goods sold
    check_id: chk_build_acc_sole_trader_statements_0015_t
  - n: 2
    latex: \text{Cost of sales} = 4200 + 40400 - 700 + 550 - 2300 = 42150
    reason: Goods available less closing inventory
    check_id: chk_build_acc_sole_trader_statements_0015_s2
  - n: 3
    latex: \text{Net revenue} = 64500 - 200 = 64300
    reason: Sales returns reduce revenue
    check_id: chk_build_acc_sole_trader_statements_0015_s3
  - n: 4
    latex: \text{Gross profit} = 64300 - 42150 = 22150
    reason: Subtract
    check_id: chk_build_acc_sole_trader_statements_0015_a
