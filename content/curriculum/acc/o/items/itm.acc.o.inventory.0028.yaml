id: itm.acc.o.inventory.0028
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.inventory.lower_cost_nrv
stem: At the year end Yaw holds 145 packs of exercise books that cost $25 each. They can be sold for $27 each, but each needs $2 spent on it before it can be sold.
parts:
- id: a
  prompt: Calculate the value of this inventory.
  marks: 3
  answer:
    kind: numeric
    value: '3625.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_inventory_0028_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Inventory is valued at the lower of two figures. Which two?
  - rung: 2
    name: concept
    text:
      en: Net realisable value = selling price − costs needed to sell. Use the lower of cost and NRV.
  - rung: 3
    name: first_step
    text:
      en: NRV per item = 27 − 2.
  - rung: 4
    name: worked_step
    text:
      en: Compare 25 with 27 − 2; multiply the lower by 145.
  - rung: 5
    name: full_step
    text:
      en: Each item is valued at $25, so the inventory is worth $3625.
  misconception_ids:
  - mc.acc.o.inv_selling_price_used
  - mc.acc.o.inv_nrv_ignored
solution:
  steps:
  - n: 1
    latex: \text{Value} = \text{quantity} \times \text{lower of cost and NRV}
    reason: Prudence
    check_id: chk_build_acc_inventory_0028_t
  - n: 2
    latex: \text{NRV} = 27 - 2 = 25
    reason: Selling price less costs to sell
    check_id: chk_build_acc_inventory_0028_s2
  - n: 3
    latex: \text{Value} = 145 \times 25 = 3625
    reason: The lower figure
    check_id: chk_build_acc_inventory_0028_a
difficulty:
  prior: 0.1
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
