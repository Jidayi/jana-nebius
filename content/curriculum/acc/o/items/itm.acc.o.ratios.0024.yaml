id: itm.acc.o.ratios.0024
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.ratios.liquidity
stem: Kofi's business has inventory $6200, trade receivables $5500, a bank balance of $2700 and current liabilities of $14100.
parts:
- id: a
  prompt: Calculate the current ratio, as the first number of a ratio to 1. Give your answer to 2 decimal places.
  marks: 2
  answer:
    kind: numeric
    value: '1.02'
    unit: :1
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_ratios_0024_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The current ratio compares what will turn into cash within a year with what must be paid within a year.
  - rung: 2
    name: concept
    text:
      en: 'Current ratio = current assets : current liabilities.'
  - rung: 3
    name: first_step
    text:
      en: Current assets here are inventory, trade receivables and the bank balance.
  - rung: 4
    name: worked_step
    text:
      en: Divide (6200 + 5500 + 2700) by 14100.
  - rung: 5
    name: full_step
    text:
      en: 'Current ratio = 1.02 : 1.'
  misconception_ids:
  - mc.acc.o.rat_acid_includes_inventory
  - mc.acc.o.rat_ratio_inverted
solution:
  steps:
  - n: 1
    latex: \text{Current ratio} = \frac{\text{current assets}}{\text{current liabilities}}
    reason: Expressed as a ratio to 1
    check_id: chk_build_acc_ratios_0024_t
  - n: 2
    latex: \frac{6200 + 5500 + 2700}{14100} = 1.02
    reason: Substitute
    check_id: chk_build_acc_ratios_0024_a
