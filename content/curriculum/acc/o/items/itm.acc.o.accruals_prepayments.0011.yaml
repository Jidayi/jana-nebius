id: itm.acc.o.accruals_prepayments.0011
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.accruals_prepayments.accrued_expense
stem: Amina paid $3550 for advertising during the year. $650 was owing at the start of the year and $800 was owing at the end.
parts:
- id: a
  prompt: What is the advertising expense for the year?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $3550
      correct: false
      misconception_id: mc.acc.o.acc_cash_basis
    - id: B
      text: $2100
      correct: false
      misconception_id: mc.acc.o.acc_accrual_subtracted
    - id: C
      text: $3700
      correct: true
    - id: D
      text: $5000
      correct: false
      misconception_id: mc.acc.o.acc_opening_accrual_added
  hints:
  - rung: 1
    name: orient
    text:
      en: Which part of the payments was for last year, and what is still owed for this year?
  - rung: 2
    name: concept
    text:
      en: Expense = paid + owing at the end − owing at the start.
  - rung: 3
    name: first_step
    text:
      en: Part of this year's payments settled last year's bill, so that part is taken off.
  - rung: 4
    name: worked_step
    text:
      en: Work out 3550 + 800 − 650.
  - rung: 5
    name: full_step
    text:
      en: The expense is $3700.
  misconception_ids:
  - mc.acc.o.acc_accrual_subtracted
  - mc.acc.o.acc_opening_accrual_added
  - mc.acc.o.acc_cash_basis
solution:
  steps:
  - n: 1
    latex: \text{Expense} = \text{paid} + \text{closing accrual} - \text{opening accrual}
    reason: Matching
    check_id: chk_build_acc_accruals_prepayments_0011_t
  - n: 2
    latex: \text{Expense} = 3550 + 800 - 650 = 3700
    reason: Substitute
    check_id: chk_build_acc_accruals_prepayments_0011_a
