id: itm.acc.o.sole_trader_statements.0023
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.profit_for_year
stem: 'Halima runs a phone repair business. For the year: gross profit $22400; rent received $1000; commission received $1000; motor expenses $5850; wages $750; advertising $1550.'
parts:
- id: a
  prompt: Calculate the profit for the year.
  marks: 3
  answer:
    kind: numeric
    value: '16250.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0023_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Profit for the year starts from gross profit. What is added, and what is taken away?
  - rung: 2
    name: concept
    text:
      en: Add other income (such as rent or discount received) and subtract every running expense. Drawings are not an expense.
  - rung: 3
    name: first_step
    text:
      en: 'Add up the expenses: 5850 + 750 + 1550.'
  - rung: 4
    name: worked_step
    text:
      en: Profit for the year = 22400 + 1000 + 1000 − (5850 + 750 + 1550).
  - rung: 5
    name: full_step
    text:
      en: Profit for the year = $16250.
  misconception_ids:
  - mc.acc.o.pfy_drawings_deducted
  - mc.acc.o.pfy_other_income_omitted
solution:
  steps:
  - n: 1
    latex: \text{Profit for the year} = \text{gross profit} + \text{other income} - \text{expenses}
    reason: Drawings are taken from capital, not from profit
    check_id: chk_build_acc_sole_trader_statements_0023_t
  - n: 2
    latex: \text{Expenses} = 5850 + 750 + 1550 = 8150
    reason: Total the running expenses
    check_id: chk_build_acc_sole_trader_statements_0023_s2
  - n: 3
    latex: \text{Profit for the year} = 22400 + 1000 + 1000 - 8150 = 16250
    reason: Substitute
    check_id: chk_build_acc_sole_trader_statements_0023_a
difficulty:
  prior: 0.1
  band: core
estimated_seconds: 90
