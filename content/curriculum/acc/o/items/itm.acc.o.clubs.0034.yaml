id: itm.acc.o.clubs.0034
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.clubs.surplus_deficit
stem: 'A drama society''s figures for the year: subscriptions for the year $11500; competition fees $1600; rent $4750; groundsman''s wages $1900; electricity $900; new equipment bought $2300; depreciation of equipment $900.'
parts:
- id: a
  prompt: Calculate the surplus for the year (give a deficit as a negative number).
  marks: 3
  answer:
    kind: numeric
    value: '4650.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_clubs_0034_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A club's surplus is its income for the year less its expenditure for the year.
  - rung: 2
    name: concept
    text:
      en: Include this year's income and expenses, and depreciation; leave out capital spending.
  - rung: 3
    name: first_step
    text:
      en: The equipment bought is an asset; only its depreciation is expenditure.
  - rung: 4
    name: worked_step
    text:
      en: Work out 11500 + 1600 − (4750 + 1900 + 900 + 900).
  - rung: 5
    name: full_step
    text:
      en: The club has a surplus of $4650.
  misconception_ids:
  - mc.acc.o.club_capital_items_in_ie
  - mc.acc.o.club_depreciation_omitted
solution:
  steps:
  - n: 1
    latex: \text{Surplus} = \text{income} - \text{expenditure}
    reason: Matching, like profit
    check_id: chk_build_acc_clubs_0034_t
  - n: 2
    latex: \text{Income} = 11500 + 1600 = 13100
    reason: Earned this year
    check_id: chk_build_acc_clubs_0034_s2
  - n: 3
    latex: \text{Expenditure} = 4750 + 1900 + 900 + 900 = 8450
    reason: Including depreciation
    check_id: chk_build_acc_clubs_0034_s3
  - n: 4
    latex: 13100 - 8450 \rightarrow 4650\ \text{surplus}
    reason: Subtract
    check_id: chk_build_acc_clubs_0034_s4
