id: itm.acc.o.accounting_equation.0034
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.accounting_equation.effect_of_transactions
stem: Musa's business has total assets of $21100, liabilities of $1800 and capital of $19300. It then buys equipment for $3000, paying from the bank, and has $3000 taken out of the bank by the owner for personal use.
parts:
- id: a
  prompt: Calculate the owner's capital after both transactions.
  marks: 2
  answer:
    kind: numeric
    value: '16300.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_accounting_equation_0034_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Every transaction changes at least two things, and assets still equal capital plus liabilities afterwards.
  - rung: 2
    name: concept
    text:
      en: Buying on credit raises assets and liabilities; paying a debt lowers both; capital paid in raises assets and capital; drawings lower both; swapping one asset for another changes neither total.
  - rung: 3
    name: first_step
    text:
      en: Take each transaction in turn and note what it does to the figure asked for.
  - rung: 4
    name: worked_step
    text:
      en: Work out 19300 + 0 − 3000.
  - rung: 5
    name: full_step
    text:
      en: The answer is $16300.
  misconception_ids:
  - mc.acc.o.ae_credit_purchase_capital
  - mc.acc.o.ae_asset_swap_confused
solution:
  steps:
  - n: 1
    latex: \text{Assets} = \text{capital} + \text{liabilities after every transaction}
    reason: The equation always balances
    check_id: chk_build_acc_accounting_equation_0034_t
  - n: 2
    latex: 19300 + 0 - 3000 = 16300
    reason: Apply each change
    check_id: chk_build_acc_accounting_equation_0034_a
