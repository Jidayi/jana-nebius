stem: 'Bola and Nomsa are partners. Their agreement gives interest on capital at 6% a year, a salary of $4500 a year to Bola, interest on drawings at 2%, and shares the remaining profit Bola 3 : Nomsa 1. Capitals: Bola $59000, Nomsa $35000. Drawings for the year: Bola $11000, Nomsa $10600. Profit for the year: $64500.'
parts:
- id: a
  prompt: Calculate Nomsa's share of the remaining profit.
  marks: 4
  answer:
    kind: numeric
    value: '13698.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_partnerships_0023_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The profit-sharing ratio applies only to what is left after interest and salaries.
  - rung: 2
    name: concept
    text:
      en: Remaining profit = profit − interest on capital − salaries + interest on drawings. Then split it in the agreed ratio.
  - rung: 3
    name: first_step
    text:
      en: Interest on drawings is charged to the partners, so it adds to the profit to be shared.
  - rung: 4
    name: worked_step
    text:
      en: Remaining profit × 1 ÷ (3 + 1).
  - rung: 5
    name: full_step
    text:
      en: Remaining profit $54792; Nomsa's share = $13698.
  misconception_ids:
  - mc.acc.o.pa_share_before_appropriations
  - mc.acc.o.pa_iod_subtracted
solution:
  steps:
  - n: 1
    latex: \text{Remaining profit} = \text{profit} - \text{interest on capital} - \text{salaries} + \text{interest on drawings}
    reason: Appropriations come first
    check_id: chk_build_acc_partnerships_0023_t
  - n: 2
    latex: \text{Remaining profit} = 54792
    reason: After the agreed appropriations
    check_id: chk_build_acc_partnerships_0023_s2
  - n: 3
    latex: 'Nomsa: 54792 \times \frac{1}{3 + 1} = 13698'
    reason: The agreed ratio
    check_id: chk_build_acc_partnerships_0023_a
