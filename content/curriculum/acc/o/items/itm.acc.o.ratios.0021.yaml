stem: Chipo's revenue was $23000 and cost of sales $19500.
parts:
- id: a
  prompt: What is the mark-up?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 117.95%
      correct: false
      misconception_id: mc.acc.o.rat_revenue_for_profit
    - id: B
      text: 17.95%
      correct: true
    - id: C
