  hints:
  - rung: 1
    name: orient
    text:
      en: Mark-up and margin use the same profit but compare it with different figures.
  - rung: 2
    name: concept
    text:
      en: Mark-up = gross profit ÷ cost of sales, as a percentage.
  - rung: 3
    name: first_step
    text:
      en: Gross profit is revenue less cost of sales.
  - rung: 4
    name: worked_step
    text:
      en: Work out (23000 − 19500) ÷ 19500 as a percentage.
  - rung: 5
    name: full_step
    text:
      en: Mark-up = 17.95%.
  misconception_ids:
  - mc.acc.o.rat_margin_markup_confused
  - mc.acc.o.rat_ratio_inverted
  - mc.acc.o.rat_revenue_for_profit
solution:
  steps:
  - n: 1
    latex: \text{Mark-up} = \frac{\text{gross profit}}{\text{cost of sales}}
    reason: Profit on cost
    check_id: chk_build_acc_ratios_0021_t
  - n: 2
    latex: \frac{23000 - 19500}{19500} \rightarrow 17.95\%
    reason: Substitute
    check_id: chk_build_acc_ratios_0021_a
