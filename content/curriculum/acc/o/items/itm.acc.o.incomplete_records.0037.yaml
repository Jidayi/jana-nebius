id: itm.acc.o.incomplete_records.0037
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.incomplete_records.margin_markup_use
stem: Thabo runs a phone repair business. The gross margin is 37.50% of revenue, and revenue for the year was $21440.
parts:
- id: a
  prompt: Calculate the cost of sales.
  marks: 2
  answer:
    kind: numeric
    value: '13400.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_incomplete_records_0037_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A margin is a percentage of revenue.
  - rung: 2
    name: concept
    text:
      en: Cost of sales = revenue − margin × revenue.
  - rung: 3
    name: first_step
    text:
      en: Gross profit = 37.50% of $21440.
  - rung: 4
    name: worked_step
    text:
      en: Cost of sales = 21440 − 37.50% × 21440.
  - rung: 5
    name: full_step
    text:
      en: Cost of sales = $13400.
  misconception_ids:
  - mc.acc.o.rat_margin_markup_confused
  - mc.acc.o.ir_percent_of_wrong_base
solution:
  steps:
  - n: 1
    latex: \text{Cost of sales} = \text{revenue} \times (1 - \text{margin})
    reason: Margin on revenue
    check_id: chk_build_acc_incomplete_records_0037_t
  - n: 2
    latex: \text{Gross profit} = 37.50\% \times 21440 = 8040
    reason: Profit on revenue
    check_id: chk_build_acc_incomplete_records_0037_s2
  - n: 3
    latex: \text{Cost of sales} = 21440 - 8040 = 13400
    reason: Subtract
    check_id: chk_build_acc_incomplete_records_0037_a
difficulty:
  prior: 0.5
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 2
  calculator: true
context_tags:
- local_currency
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_incomplete_records_0037_a:
    args:
      dp: 2
      expression: 21440 * (1 - 37.50/100)
    tool: math_evaluate
  chk_build_acc_incomplete_records_0037_s2:
    args:
      dp: 4
      expression: 21440 * 37.50/100
    tool: math_evaluate
  chk_build_acc_incomplete_records_0037_t:
    args:
      cost_of_sales: '13400'
      dp: 2
      ratios:
      - mark_up
      - gross_margin
      revenue: '21440'
    tool: acc_ratios
