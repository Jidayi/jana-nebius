id: itm.acc.o.depreciation.0025
version: 0.1.1
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.depreciation.straight_line
stem: Kojo's business buys a motor car for $21100. It is expected to last 4 years and a residual value of $2000.
parts:
- id: a
  prompt: Calculate the yearly depreciation charge by the straight-line method.
  marks: 2
  answer:
    kind: numeric
    value: '4775.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_depreciation_0025_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The straight-line method charges the same amount every year. What is spread, and over how long?
  - rung: 2
    name: concept
    text:
      en: Yearly charge = (cost − residual value) ÷ useful life in years.
  - rung: 3
    name: first_step
    text:
      en: 'First take the residual value off the cost: that is the amount to be spread.'
  - rung: 4
    name: worked_step
    text:
      en: Yearly charge = (21100 − 2000) ÷ 4.
  - rung: 5
    name: full_step
    text:
      en: Yearly charge = $4775.
  misconception_ids:
  - mc.acc.o.sl_residual_ignored
  - mc.acc.o.sl_total_not_annual
solution:
  steps:
  - n: 1
    latex: \text{Yearly charge} = \frac{\text{cost} - \text{residual value}}{\text{useful life}}
    reason: The same charge every year
    check_id: chk_build_acc_depreciation_0025_t
  - n: 2
    latex: \text{Yearly charge} = \frac{21100 - 2000}{4} = 4775
    reason: Substitute
    check_id: chk_build_acc_depreciation_0025_a
