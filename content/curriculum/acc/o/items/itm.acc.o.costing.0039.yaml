id: itm.acc.o.costing.0039
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.margin_of_safety
stem: Musa makes solar lamps that sell for $12 each, with variable costs of $9 each and fixed costs of $300. Expected output is 350 units.
parts:
- id: a
  prompt: Calculate the profit at the expected output.
  marks: 3
  answer:
    kind: numeric
    value: '750.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_costing_0039_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Profit is what is left of total contribution after fixed costs.
  - rung: 2
    name: concept
    text:
      en: Profit = units × contribution per unit − fixed costs.
  - rung: 3
    name: first_step
    text:
      en: Only the units above break-even make profit.
  - rung: 4
    name: worked_step
    text:
      en: Work out 350 × (12 − 9) − 300.
  - rung: 5
    name: full_step
    text:
      en: Profit = $750.
  misconception_ids:
  - mc.acc.o.cost_contribution_as_profit
solution:
  steps:
  - n: 1
    latex: \text{Profit} = \text{total contribution} - \text{fixed costs}
    reason: After fixed costs
    check_id: chk_build_acc_costing_0039_t
  - n: 2
    latex: \text{Total contribution} = 350 \times (12 - 9) = 1050
    reason: Units times contribution
    check_id: chk_build_acc_costing_0039_s2
  - n: 3
    latex: 1050 - 300 = 750
    reason: Less fixed costs
    check_id: chk_build_acc_costing_0039_a
difficulty:
  prior: 0.3
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
