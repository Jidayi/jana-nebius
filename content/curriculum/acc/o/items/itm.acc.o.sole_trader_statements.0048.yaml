id: itm.acc.o.sole_trader_statements.0048
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.working_capital
stem: 'At the year end Tendai''s business has: inventory $3400; trade receivables $6100; prepaid expenses $850; bank balance $3600; cash in hand $600; trade payables $8500; accrued expenses $750; equipment $20000; loan repayable in six years $5400.'
parts:
- id: a
  prompt: Calculate the net current assets (working capital).
  marks: 3
  answer:
    kind: numeric
    value: '5300.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0048_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Working capital compares what the business will turn into cash within a year with what it must pay within a year.
  - rung: 2
    name: concept
    text:
      en: Net current assets = current assets − current liabilities. Leave out the equipment and the long-term loan.
  - rung: 3
    name: first_step
    text:
      en: 'Current assets: 3400 + 6100 + 850 + 3600 + 600. Current liabilities: 8500 + 750.'
  - rung: 4
    name: worked_step
    text:
      en: Net current assets = (3400 + 6100 + 850 + 3600 + 600) − (8500 + 750).
  - rung: 5
    name: full_step
    text:
      en: $14550 − $9250 = $5300.
  misconception_ids:
  - mc.acc.o.sofp_overdraft_as_asset
  - mc.acc.o.sofp_term_confused
solution:
  steps:
  - n: 1
    latex: \text{Net current assets} = \text{current assets} - \text{current liabilities}
    reason: Working capital
    check_id: chk_build_acc_sole_trader_statements_0048_t
  - n: 2
    latex: \text{Current assets} = 3400 + 6100 + 850 + 3600 + 600 = 14550
    reason: Owned, turned into cash within a year
    check_id: chk_build_acc_sole_trader_statements_0048_s2
  - n: 3
    latex: \text{Current liabilities} = 8500 + 750 = 9250
    reason: Owed within a year
    check_id: chk_build_acc_sole_trader_statements_0048_s3
  - n: 4
    latex: \text{Net current assets} = 14550 - 9250 = 5300
    reason: Subtract
    check_id: chk_build_acc_sole_trader_statements_0048_a
