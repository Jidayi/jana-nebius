id: itm.acc.o.costing.0031
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.break_even
stem: Kwame makes pairs of sandals that sell for $25 each. Variable cost is $19 each; fixed costs are $11700.
parts:
- id: a
  prompt: What is the break-even point in units?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 1950 units
      correct: true
    - id: B
      text: 48750 units
      correct: false
      misconception_id: mc.acc.o.cost_be_units_revenue_confused
    - id: C
      text: 468.00 units
      correct: false
      misconception_id: mc.acc.o.cost_be_divides_by_price
    - id: D
      text: 615.79 units
      correct: false
      misconception_id: mc.acc.o.cost_be_divides_by_vc
  hints:
  - rung: 1
    name: orient
    text:
      en: What must each unit's contribution cover?
  - rung: 2
    name: concept
    text:
      en: Break-even units = fixed costs ÷ (selling price − variable cost).
  - rung: 3
    name: first_step
    text:
      en: Dividing by the price or the variable cost alone ignores the other.
  - rung: 4
    name: worked_step
    text:
      en: Work out 11700 ÷ (25 − 19).
  - rung: 5
    name: full_step
    text:
      en: Break-even = 1950 units.
  misconception_ids:
  - mc.acc.o.cost_be_divides_by_price
  - mc.acc.o.cost_be_divides_by_vc
  - mc.acc.o.cost_be_units_revenue_confused
solution:
  steps:
  - n: 1
    latex: \text{Break-even} = \frac{\text{fixed costs}}{\text{price} - \text{variable cost}}
    reason: Contribution covers fixed costs
    check_id: chk_build_acc_costing_0031_t
  - n: 2
    latex: \frac{11700}{25 - 19} = 1950
    reason: Substitute
    check_id: chk_build_acc_costing_0031_a
