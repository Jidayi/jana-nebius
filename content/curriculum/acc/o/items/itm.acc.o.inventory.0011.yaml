id: itm.acc.o.inventory.0011
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.inventory.fifo
stem: 'Ama''s shop: opening inventory 30 tins of paint at $4 each; then bought 100 at $6 each; then sold 50; then bought 60 at $8 each; then sold 120.'
parts:
- id: a
  prompt: Using FIFO, what is the closing inventory?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $160
      correct: true
    - id: B
      text: $1040
      correct: false
      misconception_id: mc.acc.o.inv_cos_for_closing
    - id: C
      text: $131.87
      correct: false
      misconception_id: mc.acc.o.inv_avco_for_fifo
    - id: D
      text: $80
      correct: false
      misconception_id: mc.acc.o.inv_fifo_reversed
  hints:
  - rung: 1
    name: orient
    text:
      en: Which goods are sold first under FIFO?
  - rung: 2
    name: concept
    text:
      en: The oldest goods go first, so what is left is the newest.
  - rung: 3
    name: first_step
    text:
      en: Closing inventory is what remains, not what was sold.
  - rung: 4
    name: worked_step
    text:
      en: Count the units left and price them from the latest purchase backwards.
  - rung: 5
    name: full_step
    text:
      en: Closing inventory = $160.
  misconception_ids:
  - mc.acc.o.inv_fifo_reversed
  - mc.acc.o.inv_avco_for_fifo
  - mc.acc.o.inv_cos_for_closing
solution:
  steps:
  - n: 1
    latex: '\text{FIFO: the goods left are the latest bought}'
    reason: Oldest goods go first
    check_id: chk_build_acc_inventory_0011_t
  - n: 2
    latex: \text{Units left} = (30 + 100 + 60) - (50 + 120) = 20
    reason: In less out
    check_id: chk_build_acc_inventory_0011_s2
  - n: 3
    latex: \text{Closing} = 20 \times 8 = 160
    reason: Value the remaining layers
    check_id: chk_build_acc_inventory_0011_a
