id: itm.acc.o.sole_trader_statements.0010
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.cost_of_sales
stem: 'Aisha''s figures for the year: opening inventory $6600; purchases $23000; purchases returns $1100; carriage inwards $750; carriage outwards $850; closing inventory $8100.'
parts:
- id: a
  prompt: What is the cost of sales?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $22000
      correct: false
      misconception_id: mc.acc.o.cos_carriage_outwards_included
    - id: B
      text: $23350
      correct: false
      misconception_id: mc.acc.o.cos_returns_added
    - id: C
      text: $37350
      correct: false
      misconception_id: mc.acc.o.cos_closing_added
    - id: D
      text: $21150
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which of these figures are part of the cost of the goods sold, and which are expenses of selling?
  - rung: 2
    name: concept
    text:
      en: Goods returned to suppliers reduce purchases. Goods still in stock at the end were not sold.
  - rung: 3
    name: first_step
    text:
      en: Carriage inwards is part of the cost of buying goods; carriage outwards is not.
  - rung: 4
    name: worked_step
    text:
      en: Work out (6600 + 23000 − 1100 + 750) − 8100.
  - rung: 5
    name: full_step
    text:
      en: Cost of sales = (6600 + 23000 − 1100 + 750) − 8100 = $21150.
  misconception_ids:
  - mc.acc.o.cos_closing_added
  - mc.acc.o.cos_returns_added
  - mc.acc.o.cos_carriage_outwards_included
solution:
  steps:
  - n: 1
    latex: \text{Cost of sales} = \text{opening inventory} + \text{purchases} - \text{returns} + \text{carriage inwards} - \text{closing inventory}
    reason: Carriage outwards is an expense
    check_id: chk_build_acc_sole_trader_statements_0010_t
  - n: 2
    latex: \text{Cost of sales} = 6600 + 23000 - 1100 + 750 - 8100 = 21150
    reason: Substitute
    check_id: chk_build_acc_sole_trader_statements_0010_a
