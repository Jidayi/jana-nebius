id: itm.acc.o.bank_reconciliation.0018
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.bank_reconciliation.update_cash_book
stem: 'Wanjiru''s cash book shows a debit bank balance of $3060. The bank statement shows these items that are not in the cash book: loan interest charged by the bank $40; a direct debit for electricity $590; a dividend paid in directly $300. Also, cheque number 100966 $570 has not yet been presented.'
parts:
- id: a
  prompt: Calculate the updated cash book balance.
  marks: 3
  answer:
    kind: numeric
    value: '2730.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_bank_reconciliation_0018_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which items has the bank already dealt with that the cash book does not show yet?
  - rung: 2
    name: concept
    text:
      en: Money the bank received for you is added to the cash book balance; money it paid out is subtracted.
  - rung: 3
    name: first_step
    text:
      en: An unpresented cheque is already in the cash book; it belongs in the reconciliation statement, not here.
  - rung: 4
    name: worked_step
    text:
      en: Updated balance = 3060 − 40 − 590 + 300.
  - rung: 5
    name: full_step
    text:
      en: Updated cash book balance = $2730.
  misconception_ids:
  - mc.acc.o.br_update_signs_reversed
  - mc.acc.o.br_includes_timing
solution:
  steps:
  - n: 1
    latex: \text{Updated balance} = \text{balance} + \text{receipts} - \text{payments on the statement only}
    reason: Bring the cash book up to date
    check_id: chk_build_acc_bank_reconciliation_0018_t
  - n: 2
    latex: \text{Updated balance} = 3060 - 40 - 590 + 300 = 2730
    reason: Substitute
    check_id: chk_build_acc_bank_reconciliation_0018_a
difficulty:
  prior: 0.0
  band: core
