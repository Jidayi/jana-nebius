      bank_statement:
        balance: '2360'
        entries:
        - amount: '40'
          details: loan interest charged by the bank
          direction: out
        - amount: '590'
          details: a direct debit for electricity
          direction: out
        - amount: '300'
          details: a dividend paid in directly
          direction: in
        overdrawn: false
      cash_book:
        balance: '3060'
        entries:
        - amount: '570'
          details: cheque number 100966
          direction: out
          ref: t0
        - amount: '940'
          details: cash paid in on the last day of the month
          direction: in
          ref: t1
        overdrawn: false
      dp: 2
      start_from: bank_statement
      task: reconcile
    tool: acc_double_entry
