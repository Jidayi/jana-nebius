id: itm.acc.o.incomplete_records.0039
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.incomplete_records.margin_markup_use
stem: Bola runs a market stall and adds a mark-up of 25% to cost. Cost of sales for the year was $34300.
parts:
- id: a
  prompt: Calculate the revenue for the year.
  marks: 2
  answer:
    kind: numeric
    value: '42875.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_incomplete_records_0039_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A mark-up is a percentage of cost.
  - rung: 2
    name: concept
    text:
      en: Revenue = cost of sales + mark-up × cost of sales.
  - rung: 3
    name: first_step
    text:
      en: Gross profit = 25% of $34300.
  - rung: 4
    name: worked_step
    text:
      en: Revenue = 34300 + 25% × 34300.
  - rung: 5
    name: full_step
    text:
      en: Revenue = $42875.
  misconception_ids:
  - mc.acc.o.rat_margin_markup_confused
  - mc.acc.o.ir_percent_of_wrong_base
solution:
  steps:
  - n: 1
    latex: \text{Revenue} = \text{cost of sales} \times (1 + \text{mark-up})
    reason: Mark-up on cost
    check_id: chk_build_acc_incomplete_records_0039_t
  - n: 2
    latex: \text{Gross profit} = 25\% \times 34300 = 8575
    reason: Profit on cost
    check_id: chk_build_acc_incomplete_records_0039_s2
  - n: 3
    latex: \text{Revenue} = 34300 + 8575 = 42875
    reason: Add
    check_id: chk_build_acc_incomplete_records_0039_a
difficulty:
  prior: 0.4
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 2
  calculator: true
context_tags:
- local_currency
