    args:
      dp: 2
      expression: 34300 * (1 + 25/100)
    tool: math_evaluate
  chk_build_acc_incomplete_records_0039_s2:
    args:
      dp: 4
      expression: 34300 * 25/100
    tool: math_evaluate
  chk_build_acc_incomplete_records_0039_t:
    args:
      cost_of_sales: '34300'
      dp: 2
      ratios:
      - mark_up
      - gross_margin
      revenue: '42875'
