id: itm.acc.o.irrecoverable_debts.0039
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.irrecoverable_debts.net_receivables
stem: Chipo's trade receivables are $24400. The allowance for irrecoverable debts is 5% of trade receivables.
parts:
- id: a
  prompt: Calculate the net trade receivables shown in the statement of financial position.
  marks: 3
  answer:
    kind: numeric
    value: '23180.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_irrecoverable_debts_0039_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The statement of financial position shows what the business expects to collect.
  - rung: 2
    name: concept
    text:
      en: Net trade receivables = trade receivables − debts written off − allowance.
  - rung: 3
    name: first_step
    text:
      en: Work out the allowance on the receivables that remain after write-off.
  - rung: 4
    name: worked_step
    text:
      en: Net = 24400 − 5% of 24400.
  - rung: 5
    name: full_step
    text:
      en: Net trade receivables = $23180.
  misconception_ids:
  - mc.acc.o.id_allowance_not_deducted
  - mc.acc.o.id_writeoff_not_deducted
solution:
  steps:
  - n: 1
    latex: \text{Net receivables} = \text{receivables} - \text{written off} - \text{allowance}
    reason: What is expected to be collected
    check_id: chk_build_acc_irrecoverable_debts_0039_t
  - n: 2
    latex: \text{Allowance} = 5\% \times 24400 = 1220
    reason: On the remaining debts
    check_id: chk_build_acc_irrecoverable_debts_0039_s2
  - n: 3
    latex: \text{Net} = 24400 - 1220 = 23180
    reason: Subtract
    check_id: chk_build_acc_irrecoverable_debts_0039_a
difficulty:
  prior: 0.2
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
context_tags:
- local_currency
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
