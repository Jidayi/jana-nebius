  chk_build_acc_irrecoverable_debts_0039_a:
    args:
      dp: 2
      expression: 24400 - 24400 * 5/100
    tool: math_evaluate
  chk_build_acc_irrecoverable_debts_0039_s2:
    args:
      dp: 4
      expression: 24400 * 5/100
    tool: math_evaluate
  chk_build_acc_irrecoverable_debts_0039_t:
    args:
      adjustments:
      - amount: '1000'
        kind: closing_inventory
      - kind: allowance
        percent: '5'
      dp: 2
      layout: capital_and_liabilities
      trial_balance:
      - account: Sales
        credit: '80000'
        role: revenue
      - account: Purchases
        debit: '40000'
        role: purchases
