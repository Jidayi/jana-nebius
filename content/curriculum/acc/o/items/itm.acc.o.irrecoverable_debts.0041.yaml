id: itm.acc.o.irrecoverable_debts.0041
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.irrecoverable_debts.net_receivables
stem: Kofi's trade receivables are $24500 before writing off a debt of $1150. Last year's allowance was $1000; this year it is to be 10% of trade receivables.
parts:
- id: a
  prompt: What net trade receivables are shown in the statement of financial position?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $22165
      correct: false
      misconception_id: mc.acc.o.id_writeoff_not_deducted
    - id: B
      text: $22350
      correct: false
      misconception_id: mc.acc.o.id_old_allowance_used
    - id: C
      text: $21015
      correct: true
    - id: D
      text: $23350
      correct: false
      misconception_id: mc.acc.o.id_allowance_not_deducted
  hints:
  - rung: 1
    name: orient
    text:
      en: What does the business expect to collect?
  - rung: 2
    name: concept
    text:
      en: Net = receivables − debts written off − this year's allowance.
  - rung: 3
    name: first_step
    text:
      en: Use the new allowance, not last year's.
  - rung: 4
    name: worked_step
    text:
      en: Work out (24500 − 1150) less 10% of (24500 − 1150).
  - rung: 5
    name: full_step
    text:
      en: Net trade receivables = $21015.
  misconception_ids:
  - mc.acc.o.id_allowance_not_deducted
  - mc.acc.o.id_writeoff_not_deducted
  - mc.acc.o.id_old_allowance_used
solution:
  steps:
  - n: 1
    latex: \text{Net receivables} = \text{receivables} - \text{written off} - \text{allowance}
    reason: Expected to be collected
    check_id: chk_build_acc_irrecoverable_debts_0041_t
  - n: 2
    latex: \text{Allowance} = 10\% \times (24500 - 1150) = 2335
    reason: This year's
    check_id: chk_build_acc_irrecoverable_debts_0041_s2
  - n: 3
    latex: \text{Net} = (24500 - 1150) - 2335 = 21015
    reason: Subtract
    check_id: chk_build_acc_irrecoverable_debts_0041_a
