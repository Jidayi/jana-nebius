id: itm.acc.o.clubs.0043
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.clubs.surplus_deficit
stem: 'A football club''s figures for the year: subscriptions for the year $3000; competition fees $1450; rent $3100; groundsman''s wages $3250; electricity $950; new equipment bought $4200; depreciation of equipment $300.'
parts:
- id: a
  prompt: What is the result for the year?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Surplus of $3150
      correct: false
      misconception_id: mc.acc.o.club_surplus_deficit_reversed
    - id: B
      text: Deficit of $3150
      correct: true
    - id: C
      text: Deficit of $2850
      correct: false
      misconception_id: mc.acc.o.club_depreciation_omitted
    - id: D
      text: Deficit of $7350
      correct: false
      misconception_id: mc.acc.o.club_capital_items_in_ie
  hints:
  - rung: 1
    name: orient
    text:
      en: Which figures are income and expenditure of this year?
  - rung: 2
    name: concept
    text:
      en: Surplus = income − expenditure, where expenditure includes depreciation but not the cost of new equipment.
  - rung: 3
    name: first_step
    text:
      en: If expenditure is bigger than income, the result is a deficit.
  - rung: 4
    name: worked_step
    text:
      en: Add the income, add the expenditure, and compare.
  - rung: 5
    name: full_step
    text:
      en: Deficit of $3150.
  misconception_ids:
  - mc.acc.o.club_capital_items_in_ie
  - mc.acc.o.club_depreciation_omitted
  - mc.acc.o.club_surplus_deficit_reversed
solution:
  steps:
  - n: 1
    latex: \text{Surplus} = \text{income} - \text{expenditure}
    reason: Matching
    check_id: chk_build_acc_clubs_0043_t
  - n: 2
    latex: \text{Income} = 3000 + 1450 = 4450
    reason: Earned
    check_id: chk_build_acc_clubs_0043_s2
  - n: 3
    latex: \text{Expenditure} = 7600
    reason: Including depreciation
    check_id: chk_build_acc_clubs_0043_s3
  - n: 4
    latex: 4450 - 7600 \rightarrow 3150
    reason: Compare
    check_id: chk_build_acc_clubs_0043_s4
