stem: A club's treasurer lists items.
parts:
- id: a
  prompt: Select every item that appears in the income and expenditure account.
  marks: 2
  answer:
    kind: multi_select
    options:
    - id: A
      text: Depreciation of equipment
      correct: true
    - id: B
      text: Subscriptions for this year
      correct: true
    - id: C
      text: Rent for the year
      correct: true
    - id: D
      text: Cost of new equipment
      correct: false
    - id: E
      text: Opening bank balance
      correct: false
    - id: F
      text: Subscriptions for next year
      correct: false
    scoring: exact_set
  hints:
  - rung: 1
    name: orient
    text:
      en: Is the statement about cash moving, or about income earned and expenses used up?
  - rung: 2
    name: concept
    text:
      en: A receipts and payments account summarises cash and bank for the year, whatever it was for. An income and expenditure account matches the year's income with its expenses, like an income statement, and shows a surplus or a deficit.
  - rung: 3
    name: first_step
    text:
      en: Capital spending such as equipment is not expenditure of the year; only its depreciation is.
  - rung: 4
    name: worked_step
    text:
      en: Pick this year's income and expenses.
  - rung: 5
    name: full_step
    text:
      en: Depreciation, this year's subscriptions and rent.
