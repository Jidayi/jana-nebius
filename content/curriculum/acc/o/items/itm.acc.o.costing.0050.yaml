stem: Nia makes school bags that sell for $50 each. Variable cost is $5 each and fixed costs are $87750. Nia wants a profit of $22500.
parts:
- id: a
  prompt: Calculate the number of units that must be sold.
  marks: 2
  answer:
    kind: numeric
    value: '2450.00'
    unit: units
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_costing_0050_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Contribution must now cover the fixed costs and the profit wanted.
  - rung: 2
    name: concept
    text:
      en: Units = (fixed costs + target profit) ÷ contribution per unit.
  - rung: 3
    name: first_step
    text:
      en: Contribution per unit = selling price − variable cost.
  - rung: 4
    name: worked_step
    text:
      en: Work out (87750 + 22500) ÷ (50 − 5).
  - rung: 5
    name: full_step
    text:
      en: 2450.00 units must be sold.
  misconception_ids:
  - mc.acc.o.cost_target_fc_omitted
  - mc.acc.o.cost_target_subtracted
solution:
  steps:
  - n: 1
    latex: \text{Units} = \frac{\text{fixed costs} + \text{target profit}}{\text{contribution per unit}}
    reason: Cover costs and profit
    check_id: chk_build_acc_costing_0050_t
  - n: 2
    latex: \frac{87750 + 22500}{50 - 5} = 2450
    reason: Substitute
    check_id: chk_build_acc_costing_0050_a
