id: itm.acc.o.ratios.0039
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.ratios.inventory_turnover
stem: Obi runs a hardware shop. Inventory was $2300 at the start of the year and $10900 at the end. Revenue was $146000 and cost of sales $95500.
parts:
- id: a
  prompt: Calculate the rate of inventory turnover in days (average inventory, a 365-day year). Give your answer to 2 decimal places.
  marks: 3
  answer:
    kind: numeric
    value: '25.23'
    unit: days
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_ratios_0039_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: How quickly does the business sell its inventory?
  - rung: 2
    name: concept
    text:
      en: Use cost of sales, because inventory is valued at cost, and average inventory = (opening + closing) ÷ 2.
  - rung: 3
    name: first_step
    text:
      en: Average inventory = (2300 + 10900) ÷ 2.
  - rung: 4
    name: worked_step
    text:
      en: Divide the average inventory by 95500 and multiply by 365.
  - rung: 5
    name: full_step
    text:
      en: Inventory turnover = 25.23 days.
  misconception_ids:
  - mc.acc.o.rat_closing_inventory_used
  - mc.acc.o.rat_revenue_for_cos
solution:
  steps:
  - n: 1
    latex: \text{Turnover} = \frac{\text{cost of sales}}{\text{average inventory}}
    reason: 'The pack''s definition: average inventory'
    check_id: chk_build_acc_ratios_0039_t
  - n: 2
    latex: \text{Average inventory} = \frac{2300 + 10900}{2} = 6600
    reason: Opening plus closing, halved
    check_id: chk_build_acc_ratios_0039_s2
  - n: 3
    latex: \frac{6600}{95500} \times 365 = 25.23
    reason: Days in the year
    check_id: chk_build_acc_ratios_0039_a
difficulty:
  prior: 0.3
  band: core
estimated_seconds: 90
