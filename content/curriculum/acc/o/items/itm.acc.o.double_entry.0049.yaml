kc_ids:
- kc.acc.o.double_entry.balance_account
stem: 'The Cash account started the month with a debit balance of $800. Receipts: capital $1850; commission received $2550. Payments: wages $2050; electricity $400.'
parts:
- id: a
  prompt: Calculate the balance carried down on the Cash account at the end of the month.
  marks: 3
  answer:
    kind: numeric
    value: '2750.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_double_entry_0049_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Balancing an account means finding the difference between its two sides.
  - rung: 2
    name: concept
    text:
      en: Add each side. The balance carried down is the amount needed to make the smaller side equal the larger one.
  - rung: 3
    name: first_step
    text:
      en: 'Debit side: the opening balance and the receipts. Credit side: the payments.'
  - rung: 4
    name: worked_step
    text:
      en: Balance = (800 + 1850 + 2550) − (2050 + 400).
  - rung: 5
    name: full_step
    text:
      en: Balance carried down = $2750, brought down on the debit side.
  misconception_ids:
  - mc.acc.o.de_opening_balance_omitted
  - mc.acc.o.de_total_as_balance
solution:
  steps:
  - n: 1
    latex: \text{Balance c/d} = \text{larger side} - \text{smaller side}
    reason: Make the two sides equal
    check_id: chk_build_acc_double_entry_0049_t
  - n: 2
    latex: \text{Debit side} = 800 + 1850 + 2550 = 5200
    reason: Opening balance and receipts
    check_id: chk_build_acc_double_entry_0049_s2
  - n: 3
    latex: \text{Credit side} = 2050 + 400 = 2450
    reason: Payments
    check_id: chk_build_acc_double_entry_0049_s3
  - n: 4
    latex: \text{Balance c/d} = 5200 - 2450 = 2750
    reason: Subtract
    check_id: chk_build_acc_double_entry_0049_a
