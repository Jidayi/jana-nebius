id: itm.acc.o.depreciation.0057
version: 0.1.1
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.depreciation.disposal
stem: 'Bola''s business bought a set of shop shelves for $7600 in 2021. It is depreciated by the straight-line method over 4 years with a residual value of $400: a full year''s charge in the year of purchase and none in the year of sale. The set of shop shelves was sold in 2024 for $2900.'
parts:
- id: a
  prompt: Calculate the profit or loss on disposal. Give a loss as a negative number.
  marks: 4
  answer:
    kind: numeric
    value: '700.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_depreciation_0057_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Compare what the asset was sold for with its net book value on the day it was sold.
  - rung: 2
    name: concept
    text:
      en: Profit (or loss) on disposal = proceeds − net book value. Net book value = cost − accumulated depreciation.
  - rung: 3
    name: first_step
    text:
      en: 'Count the years charged: from 2021 up to, but not including, 2024.'
  - rung: 4
    name: worked_step
    text:
      en: Net book value = 7600 − yearly charge × (2024 − 2021); then subtract it from 2900.
  - rung: 5
    name: full_step
    text:
      en: Proceeds $2900 − net book value $2200 gives a profit of $700.
  misconception_ids:
  - mc.acc.o.disp_cost_not_nbv
  - mc.acc.o.disp_disposal_year_depreciated
solution:
  steps:
  - n: 1
    latex: \text{Profit or loss} = \text{proceeds} - \text{net book value}
    reason: Compare with what is left of the cost
    check_id: chk_build_acc_depreciation_0057_t
  - n: 2
    latex: \text{Years charged} = 2024 - 2021 = 3
    reason: None in the year of sale
    check_id: chk_build_acc_depreciation_0057_s2
  - n: 3
    latex: \text{Yearly charge} = \frac{7600 - 400}{4} = 1800
    reason: Straight line
    check_id: chk_build_acc_depreciation_0057_s3
  - n: 4
    latex: \text{Net book value} = 7600 - 1800 \times 3 = 2200
    reason: Cost less accumulated depreciation
    check_id: chk_build_acc_depreciation_0057_s4
  - n: 5
    latex: \text{Profit} = 2900 - 2200, \text{ that is } 700
    reason: Proceeds less net book value
    check_id: chk_build_acc_depreciation_0057_s5
