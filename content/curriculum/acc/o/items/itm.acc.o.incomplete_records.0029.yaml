stem: Trade receivables were $2600 at the start of the year and $8500 at the end. Customers paid $24100 and were allowed discounts of $400.
parts:
- id: a
  prompt: Calculate the credit sales for the year.
  marks: 3
  answer:
    kind: numeric
    value: '30400.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_incomplete_records_0029_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Rebuild the trade receivables account: what goes in, what comes out, and what is left?'
  - rung: 2
    name: concept
    text:
      en: Opening balance + credit sales = amounts paid + discounts + closing balance.
  - rung: 3
    name: first_step
    text:
      en: So credit sales = closing − opening + amounts paid + discounts.
  - rung: 4
    name: worked_step
    text:
      en: Work out 8500 − 2600 + 24100 + 400.
  - rung: 5
    name: full_step
    text:
      en: Credit sales = $30400.
  misconception_ids:
  - mc.acc.o.ir_opening_closing_swapped
  - mc.acc.o.ir_receipts_only
solution:
  steps:
  - n: 1
    latex: \text{Credit sales} = \text{closing} - \text{opening} + \text{paid} + \text{discounts}
    reason: The missing figure in the account
    check_id: chk_build_acc_incomplete_records_0029_t
  - n: 2
    latex: 8500 - 2600 + 24100 + 400 = 30400
    reason: Substitute
    check_id: chk_build_acc_incomplete_records_0029_a
