id: itm.acc.o.costing.0044
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.margin_of_safety
stem: Zanele expects to sell 1300 jars of honey at $8 each. Variable cost is $6 each and fixed costs are $400.
parts:
- id: a
  prompt: What is the margin of safety in units?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 1500 units
      correct: false
      misconception_id: mc.acc.o.cost_mos_added
    - id: B
      text: 1100 units
      correct: true
    - id: C
      text: 1300 units
      correct: false
      misconception_id: mc.acc.o.cost_mos_output_as_mos
    - id: D
      text: 200 units
      correct: false
      misconception_id: mc.acc.o.cost_mos_be_as_mos
  hints:
  - rung: 1
    name: orient
    text:
      en: How many units are sold above the break-even point?
  - rung: 2
    name: concept
    text:
      en: Margin of safety = expected output − break-even output.
  - rung: 3
    name: first_step
    text:
      en: 'Find break-even first: fixed costs ÷ contribution per unit.'
  - rung: 4
    name: worked_step
    text:
      en: Work out 1300 − 400 ÷ (8 − 6).
  - rung: 5
    name: full_step
    text:
      en: Margin of safety = 1100 units.
  misconception_ids:
  - mc.acc.o.cost_mos_be_as_mos
  - mc.acc.o.cost_mos_output_as_mos
  - mc.acc.o.cost_mos_added
solution:
  steps:
  - n: 1
    latex: \text{Margin of safety} = \text{output} - \text{break-even}
    reason: Room before a loss
    check_id: chk_build_acc_costing_0044_t
  - n: 2
    latex: \text{Break-even} = \frac{400}{8 - 6} = 200
    reason: Units
    check_id: chk_build_acc_costing_0044_s2
  - n: 3
    latex: 1300 - 200 = 1100
    reason: Subtract
    check_id: chk_build_acc_costing_0044_a
