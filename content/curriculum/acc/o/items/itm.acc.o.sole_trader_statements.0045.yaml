id: itm.acc.o.sole_trader_statements.0045
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.working_capital
stem: 'At the year end Kwame''s business has: inventory $8000; trade receivables $4200; prepaid expenses $750; bank balance $1500; cash in hand $500; trade payables $2500; accrued expenses $450; equipment $21400; loan repayable in six years $8800.'
parts:
- id: a
  prompt: Calculate the net current assets (working capital).
  marks: 3
  answer:
    kind: numeric
    value: '12000.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0045_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Working capital compares what the business will turn into cash within a year with what it must pay within a year.
  - rung: 2
    name: concept
    text:
      en: Net current assets = current assets − current liabilities. Leave out the equipment and the long-term loan.
  - rung: 3
    name: first_step
    text:
      en: 'Current assets: 8000 + 4200 + 750 + 1500 + 500. Current liabilities: 2500 + 450.'
  - rung: 4
    name: worked_step
    text:
      en: Net current assets = (8000 + 4200 + 750 + 1500 + 500) − (2500 + 450).
  - rung: 5
    name: full_step
    text:
      en: $14950 − $2950 = $12000.
  misconception_ids:
  - mc.acc.o.sofp_overdraft_as_asset
  - mc.acc.o.sofp_term_confused
solution:
  steps:
  - n: 1
    latex: \text{Net current assets} = \text{current assets} - \text{current liabilities}
    reason: Working capital
    check_id: chk_build_acc_sole_trader_statements_0045_t
  - n: 2
    latex: \text{Current assets} = 8000 + 4200 + 750 + 1500 + 500 = 14950
    reason: Owned, turned into cash within a year
    check_id: chk_build_acc_sole_trader_statements_0045_s2
  - n: 3
    latex: \text{Current liabilities} = 2500 + 450 = 2950
    reason: Owed within a year
    check_id: chk_build_acc_sole_trader_statements_0045_s3
  - n: 4
    latex: \text{Net current assets} = 14950 - 2950 = 12000
    reason: Subtract
    check_id: chk_build_acc_sole_trader_statements_0045_a
