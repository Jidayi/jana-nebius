subject: acc
level: o
kc_ids:
- kc.acc.o.depreciation.net_book_value
stem: Lindiwe's printing machine cost $33300 and is depreciated by the straight line over 8 years with a residual value of $2400.
parts:
- id: a
  prompt: What is its net book value at the end of 2 years?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $29437.50
      correct: false
      misconception_id: mc.acc.o.nbv_one_year_only
    - id: B
      text: $25575
      correct: true
    - id: C
      text: $21712.50
      correct: false
      misconception_id: mc.acc.o.nbv_extra_year
    - id: D
      text: $7725
      correct: false
      misconception_id: mc.acc.o.nbv_accumulated_as_nbv
  hints:
  - rung: 1
    name: orient
    text:
      en: How many years of depreciation have been charged?
  - rung: 2
    name: concept
    text:
      en: Net book value = cost − accumulated depreciation, which is every year's charge so far.
  - rung: 3
    name: first_step
    text:
      en: Each year's straight-line charge is the same; multiply by the 2 years.
  - rung: 4
    name: worked_step
    text:
      en: Work out 33300 − 2 × the yearly charge.
  - rung: 5
    name: full_step
    text:
      en: Net book value = $25575.
  misconception_ids:
  - mc.acc.o.nbv_one_year_only
  - mc.acc.o.nbv_accumulated_as_nbv
  - mc.acc.o.nbv_extra_year
solution:
  steps:
  - n: 1
    latex: \text{Net book value} = \text{cost} - \text{accumulated depreciation}
    reason: What is left
    check_id: chk_build_acc_depreciation_0054_t
  - n: 2
    latex: \text{Yearly charge} = 3862.50
    reason: 'Straight line: the same every year'
    check_id: chk_build_acc_depreciation_0054_s2
  - n: 3
    latex: \text{Accumulated depreciation} = 3862.50 \times 2 = 7725
    reason: Every year so far
    check_id: chk_build_acc_depreciation_0054_s3
  - n: 4
    latex: \text{Net book value} = 33300 - 7725 = 25575
    reason: Subtract
    check_id: chk_build_acc_depreciation_0054_a
