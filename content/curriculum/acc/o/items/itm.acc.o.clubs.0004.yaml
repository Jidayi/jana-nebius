stem: The treasurer of a debating society prepares the year's accounts.
parts:
- id: a
  prompt: Subscriptions for last year were received this year. Where is this income recorded?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: In this year's income and expenditure account
      correct: false
      misconception_id: mc.acc.o.club_rp_as_ie
    - id: B
      text: As a surplus in the receipts and payments account
      correct: false
      misconception_id: mc.acc.o.club_rp_shows_surplus
    - id: C
      text: Last year's income, so not in this year's income and expenditure account
      correct: true
    - id: D
      text: As capital in the accumulated fund
      correct: false
      misconception_id: mc.acc.o.club_fund_as_cash
  hints:
  - rung: 1
    name: orient
    text:
      en: Is the statement about cash moving, or about income earned and expenses used up?
  - rung: 2
    name: concept
    text:
      en: A receipts and payments account summarises cash and bank for the year, whatever it was for. An income and expenditure account matches the year's income with its expenses, like an income statement, and shows a surplus or a deficit.
  - rung: 3
    name: first_step
    text:
      en: Capital spending such as equipment is not expenditure of the year; only its depreciation is.
  - rung: 4
    name: worked_step
    text:
      en: Match the item to the statement.
  - rung: 5
    name: full_step
    text:
      en: Last year's income, so not in this year's income and expenditure account.
  misconception_ids:
  - mc.acc.o.club_rp_as_ie
  - mc.acc.o.club_rp_shows_surplus
  - mc.acc.o.club_fund_as_cash
solution:
  steps:
  - n: 1
    latex: '\text{Receipts and payments: cash. Income and expenditure: matching}'
    reason: Two statements
