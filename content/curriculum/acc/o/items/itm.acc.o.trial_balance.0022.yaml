stem: 'Zanele''s ledger balances at the year end: wages $5450; sales returns $2450; trade receivables $5600; discount received $600; discount allowed $1650; bank $2800; purchases $36850; purchases returns $2750; sales $67800; rent received $650; drawings $4150; equipment $16350; capital $3500.'
parts:
- id: a
  prompt: What is the total of the debit column of the trial balance?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $71150
      correct: false
      misconception_id: mc.acc.o.tb_drawings_credit
    - id: B
      text: $75300
      correct: true
    - id: C
      text: $74250
      correct: false
      misconception_id: mc.acc.o.tb_discount_confused
    - id: D
      text: $72850
      correct: false
      misconception_id: mc.acc.o.tb_returns_with_main
  hints:
  - rung: 1
    name: orient
    text:
      en: Which balances are debits? Sort them before adding.
  - rung: 2
    name: concept
    text:
      en: Assets, expenses, drawings and returns inwards are debits.
  - rung: 3
    name: first_step
    text:
      en: Discount allowed is an expense (debit); discount received is income (credit).
  - rung: 4
    name: worked_step
    text:
      en: Add 5450 + 2450 + 1650 + 16350 + 5600 + 36850 + 4150 + 2800.
  - rung: 5
    name: full_step
    text:
      en: The debit column totals $75300.
  misconception_ids:
  - mc.acc.o.tb_drawings_credit
  - mc.acc.o.tb_returns_with_main
  - mc.acc.o.tb_discount_confused
solution:
  steps:
  - n: 1
    latex: \text{Debit column} = \text{assets} + \text{expenses} + \text{drawings}
    reason: Each balance on its normal side
    check_id: chk_build_acc_trial_balance_0022_t
  - n: 2
    latex: \text{Debit column} = 5450 + 2450 + 1650 + 16350 + 5600 + 36850 + 4150 + 2800 = 75300
    reason: Add
    check_id: chk_build_acc_trial_balance_0022_a
