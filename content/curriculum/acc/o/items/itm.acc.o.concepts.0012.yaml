stem: Femi is preparing the year's accounts.
parts:
- id: a
  prompt: Following the business entity principle, how is cash the owner takes for a family holiday recorded?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: As drawings, reducing the owner's capital
      correct: true
    - id: B
      text: As a business expense
      correct: false
      misconception_id: mc.acc.o.con_entity_ignored
    - id: C
      text: As a loan to the owner, shown as an asset
      correct: false
      misconception_id: mc.acc.o.con_names_confused
    - id: D
      text: It is not recorded at all
      correct: false
      misconception_id: mc.acc.o.con_materiality_vs_entity
  hints:
  - rung: 1
    name: orient
    text:
      en: 'What is the accountant deciding here: what to record, at what value, or when?'
  - rung: 2
    name: concept
    text:
      en: 'Entity: the business is separate from its owner. Money measurement: only items with a money value. Duality: every transaction has two sides. Historic cost: record at cost. Going concern: assume the business carries on. Accruals: match income and expenses to the period. Prudence: do not overstate profit or assets. Consistency: keep to the same methods. Realisation: revenue when goods pass to the customer. Materiality: small items need not follow strict treatment.'
  - rung: 3
    name: first_step
    text:
      en: Several principles may seem to fit; choose the one the situation is mainly about.
  - rung: 4
    name: worked_step
    text:
      en: Apply the named principle.
  - rung: 5
    name: full_step
    text:
      en: As drawings, reducing the owner's capital.
  misconception_ids:
  - mc.acc.o.con_entity_ignored
  - mc.acc.o.con_materiality_vs_entity
  - mc.acc.o.con_names_confused
