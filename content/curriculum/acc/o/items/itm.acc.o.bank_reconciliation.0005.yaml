id: itm.acc.o.bank_reconciliation.0005
version: 0.1.1
type: mcq
subject: acc
level: o
kc_ids:
- kc.acc.o.bank_reconciliation.timing_differences
stem: When reconciling a bank account, one item is a cheque written by another business that the bank took from this account by mistake.
parts:
- id: a
  prompt: How is it treated?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: An unpresented cheque
      correct: false
    - id: B
      text: An error made by the bank
      correct: true
    - id: C
      text: An outstanding lodgement
      correct: false
    - id: D
      text: An item to enter in the cash book
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Did the business make this payment at all?
  - rung: 2
    name: concept
    text:
      en: The cash book is updated only for real items the business did not yet know about. A mistake by the bank is not entered in the cash book.
  - rung: 3
    name: first_step
    text:
      en: The bank must correct it, so it is shown in the reconciliation statement until it does.
  - rung: 4
    name: worked_step
    text:
      en: Decide whose mistake it is.
  - rung: 5
    name: full_step
    text:
      en: 'It is treated as: an error made by the bank.'
solution:
  steps:
  - n: 1
    latex: \text{Not the business's payment} \rightarrow \text{bank error}
    reason: Whose mistake it is
    check_id: chk_build_acc_bank_reconciliation_0005_t
