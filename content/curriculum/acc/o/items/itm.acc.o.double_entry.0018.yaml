stem: 'All of these transactions of Yaw''s business went through the business bank account: rent paid $1400; a loan received $4850; insurance paid $250; new equipment bought $2800.'
parts:
- id: a
  prompt: What is the total of the credit side of the Bank account for these transactions?
  marks: 2
  answer:
    kind: numeric
    value: '4450.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_double_entry_0018_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Each transaction either brings money into the bank or pays money out of it.
  - rung: 2
    name: concept
    text:
      en: In your own Bank account, money received is a debit and money paid out is a credit.
  - rung: 3
    name: first_step
    text:
      en: Pick out the transactions that are payments.
  - rung: 4
    name: worked_step
    text:
      en: Add 1400 + 250 + 2800.
  - rung: 5
    name: full_step
    text:
      en: The credit side totals $4450.
  misconception_ids:
  - mc.acc.o.de_bank_view
solution:
  steps:
  - n: 1
    latex: '\text{Bank: receipts on the debit side, payments on the credit side}'
    reason: The bank is an asset account
    check_id: chk_build_acc_double_entry_0018_t
  - n: 2
    latex: \text{Credit side} = 1400 + 250 + 2800 = 4450
    reason: Add the entries on that side
    check_id: chk_build_acc_double_entry_0018_a
