id: itm.acc.o.bank_reconciliation.0014
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.bank_reconciliation.update_cash_book
stem: 'Chipo''s cash book shows a debit bank balance of $3310. The bank statement shows these items that are not in the cash book: a standing order for insurance $600; a dividend paid in directly $340; a dishonoured cheque from a customer $20. Also, cheque number 100536 $1230 has not yet been presented.'
parts:
- id: a
  prompt: Calculate the updated cash book balance.
  marks: 3
  answer:
    kind: numeric
    value: '3030.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_bank_reconciliation_0014_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which items has the bank already dealt with that the cash book does not show yet?
  - rung: 2
    name: concept
    text:
      en: Money the bank received for you is added to the cash book balance; money it paid out is subtracted.
  - rung: 3
    name: first_step
    text:
      en: An unpresented cheque is already in the cash book; it belongs in the reconciliation statement, not here.
  - rung: 4
    name: worked_step
    text:
      en: Updated balance = 3310 − 600 + 340 − 20.
  - rung: 5
    name: full_step
    text:
      en: Updated cash book balance = $3030.
  misconception_ids:
  - mc.acc.o.br_update_signs_reversed
  - mc.acc.o.br_includes_timing
solution:
  steps:
  - n: 1
    latex: \text{Updated balance} = \text{balance} + \text{receipts} - \text{payments on the statement only}
    reason: Bring the cash book up to date
    check_id: chk_build_acc_bank_reconciliation_0014_t
  - n: 2
    latex: \text{Updated balance} = 3310 - 600 + 340 - 20 = 3030
    reason: Substitute
    check_id: chk_build_acc_bank_reconciliation_0014_a
difficulty:
  prior: 0.0
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
context_tags:
- local_names
