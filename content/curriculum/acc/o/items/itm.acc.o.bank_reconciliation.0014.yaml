  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_bank_reconciliation_0014_a:
    args:
      dp: 2
      expression: 3310 - 600 + 340 - 20
    tool: math_evaluate
  chk_build_acc_bank_reconciliation_0014_t:
    args:
      bank_statement:
        balance: '2790'
        entries:
        - amount: '600'
          details: a standing order for insurance
          direction: out
        - amount: '340'
          details: a dividend paid in directly
          direction: in
        - amount: '20'
          details: a dishonoured cheque from a customer
          direction: out
        overdrawn: false
      cash_book:
        balance: '3310'
        entries:
        - amount: '1230'
          details: cheque number 100536
          direction: out
          ref: t0
        - amount: '1470'
          details: cash paid in on the last day of the month
          direction: in
          ref: t1
        overdrawn: false
      dp: 2
      start_from: bank_statement
      task: reconcile
    tool: acc_double_entry
