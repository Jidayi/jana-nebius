    args:
      dp: 2
      expression: 2680 + 480 - 430 - 160 + 1350
    tool: math_evaluate
  chk_build_acc_bank_reconciliation_0033_s2:
    args:
      dp: 4
      expression: 2680 + 480 - 430
    tool: math_evaluate
  chk_build_acc_bank_reconciliation_0033_t:
    args:
      bank_statement:
        balance: '3920'
        entries:
        - amount: '480'
          details: a dividend paid in directly
          direction: in
        - amount: '430'
          details: bank charges
          direction: out
