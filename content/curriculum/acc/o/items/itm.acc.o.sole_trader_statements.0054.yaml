subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.working_capital
stem: 'At the year end Bola''s business has: inventory $5500; trade receivables $8900; prepaid expenses $350; bank overdraft $3600; cash in hand $550; trade payables $6800; accrued expenses $850; equipment $19800; loan repayable in six years $9200.'
parts:
- id: a
  prompt: What are the net current assets?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $11250
      correct: false
      misconception_id: mc.acc.o.sofp_overdraft_as_asset
    - id: B
      text: $-5150
      correct: false
      misconception_id: mc.acc.o.sofp_term_confused
    - id: C
      text: $23850
      correct: false
      misconception_id: mc.acc.o.wc_non_current_included
    - id: D
      text: $4050
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Net current assets uses only the items that are current. Which items are not?
  - rung: 2
    name: concept
    text:
      en: Net current assets = current assets − current liabilities. An overdraft is owed to the bank.
  - rung: 3
    name: first_step
    text:
      en: The equipment and the loan due in six years are non-current, so leave them out.
  - rung: 4
    name: worked_step
    text:
      en: Work out (5500 + 8900 + 350 + 550) − (6800 + 850 + 3600).
  - rung: 5
    name: full_step
    text:
      en: (5500 + 8900 + 350 + 550) − (6800 + 850 + 3600) = $4050.
  misconception_ids:
  - mc.acc.o.sofp_overdraft_as_asset
  - mc.acc.o.wc_non_current_included
  - mc.acc.o.sofp_term_confused
solution:
  steps:
  - n: 1
    latex: \text{Net current assets} = \text{current assets} - \text{current liabilities}
    reason: Non-current items are left out
    check_id: chk_build_acc_sole_trader_statements_0054_t
  - n: 2
    latex: \text{Net current assets} = (5500 + 8900 + 350 + 550) - (6800 + 850 + 3600) = 4050
    reason: Substitute
    check_id: chk_build_acc_sole_trader_statements_0054_a
