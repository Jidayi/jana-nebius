id: itm.acc.o.clubs.0042
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.clubs.surplus_deficit
stem: 'A football club''s figures for the year: subscriptions for the year $5350; competition fees $1950; rent $3350; groundsman''s wages $3850; electricity $250; new equipment bought $4700; depreciation of equipment $450.'
parts:
- id: a
  prompt: What is the result for the year?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Deficit of $600
      correct: true
    - id: B
      text: Surplus of $600
      correct: false
      misconception_id: mc.acc.o.club_surplus_deficit_reversed
    - id: C
      text: Deficit of $5300
      correct: false
      misconception_id: mc.acc.o.club_capital_items_in_ie
    - id: D
      text: Deficit of $150
      correct: false
      misconception_id: mc.acc.o.club_depreciation_omitted
  hints:
  - rung: 1
    name: orient
    text:
      en: Which figures are income and expenditure of this year?
  - rung: 2
    name: concept
    text:
      en: Surplus = income − expenditure, where expenditure includes depreciation but not the cost of new equipment.
  - rung: 3
    name: first_step
    text:
      en: If expenditure is bigger than income, the result is a deficit.
  - rung: 4
    name: worked_step
    text:
      en: Add the income, add the expenditure, and compare.
  - rung: 5
    name: full_step
    text:
      en: Deficit of $600.
  misconception_ids:
  - mc.acc.o.club_capital_items_in_ie
  - mc.acc.o.club_depreciation_omitted
  - mc.acc.o.club_surplus_deficit_reversed
solution:
  steps:
  - n: 1
    latex: \text{Surplus} = \text{income} - \text{expenditure}
    reason: Matching
    check_id: chk_build_acc_clubs_0042_t
  - n: 2
    latex: \text{Income} = 5350 + 1950 = 7300
    reason: Earned
    check_id: chk_build_acc_clubs_0042_s2
  - n: 3
    latex: \text{Expenditure} = 7900
    reason: Including depreciation
    check_id: chk_build_acc_clubs_0042_s3
  - n: 4
    latex: 7300 - 7900 \rightarrow 600
    reason: Compare
    check_id: chk_build_acc_clubs_0042_s4
