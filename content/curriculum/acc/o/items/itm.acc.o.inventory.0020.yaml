    args:
      dp: 2
      expression: (((((0 + 60 * 9) + 70 * 12) * (130 - 90) / 130) + 40 * 13) * (80 - 30) / 80)
    tool: math_evaluate
  chk_build_acc_inventory_0020_t:
    args:
      avco_basis: perpetual
      dp: 2
      method: avco
      movements:
      - kind: opening
        quantity: 60
        unit_cost: '9'
      - kind: receipt
        quantity: 70
        unit_cost: '12'
      - kind: issue
        quantity: 90
      - kind: receipt
