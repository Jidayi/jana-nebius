    text:
      en: Units = (fixed costs + target profit) ÷ contribution per unit.
  - rung: 3
    name: first_step
    text:
      en: The profit is added to the fixed costs, not taken away.
  - rung: 4
    name: worked_step
    text:
      en: Work out (18400 + 12800) ÷ (30 − 14).
  - rung: 5
    name: full_step
    text:
      en: 1950.00 units.
