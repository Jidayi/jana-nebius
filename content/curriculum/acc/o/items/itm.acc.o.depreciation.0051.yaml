id: itm.acc.o.depreciation.0051
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.depreciation.net_book_value
stem: Kwame's printing machine cost $29200 and is depreciated by the reducing balance at 10% a year.
parts:
- id: a
  prompt: Calculate the net book value at the end of 2 years.
  marks: 3
  answer:
    kind: numeric
    value: '23652.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_depreciation_0051_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Net book value is what is left of the cost after depreciation so far.
  - rung: 2
    name: concept
    text:
      en: Net book value = cost − accumulated depreciation.
  - rung: 3
    name: first_step
    text:
      en: Find the accumulated depreciation for all the years first.
  - rung: 4
    name: worked_step
    text:
      en: Net book value = 29200 − accumulated depreciation for 2 years.
  - rung: 5
    name: full_step
    text:
      en: Net book value = $29200 − $5548 = $23652.
  misconception_ids:
  - mc.acc.o.nbv_one_year_only
  - mc.acc.o.nbv_accumulated_as_nbv
solution:
  steps:
  - n: 1
    latex: \text{Net book value} = \text{cost} - \text{accumulated depreciation}
    reason: What is left
    check_id: chk_build_acc_depreciation_0051_t
  - n: 2
    latex: \text{Accumulated depreciation} = 5548
    reason: All the charges so far
    check_id: chk_build_acc_depreciation_0051_s2
  - n: 3
    latex: \text{Net book value} = 29200 - 5548 = 23652
    reason: Subtract
    check_id: chk_build_acc_depreciation_0051_a
difficulty:
  prior: 0.1
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
