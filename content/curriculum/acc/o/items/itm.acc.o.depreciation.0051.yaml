    args:
      dp: 2
      expression: 29200 - (29200 - 29200 * (1 - 10/100)^2)
    tool: math_evaluate
  chk_build_acc_depreciation_0051_s2:
    args:
      dp: 4
      expression: 29200 - 29200 * (1 - 10/100)^2
    tool: math_evaluate
  chk_build_acc_depreciation_0051_t:
    args:
      cost: '29200'
      dp: 2
      method: reducing_balance
      part_year_policy: full_year
      rate_percent: '10'
