stem: Nomsa is drawing up the year's accounts.
parts:
- id: a
  prompt: To follow consistency, what should a firm do about the way it values its inventory?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Use the same method each year and explain any change
      correct: true
    - id: B
      text: Change methods whenever prices change
      correct: false
      misconception_id: mc.acc.o.con_consistency_ignored
    - id: C
      text: Use the selling price of the goods
      correct: false
      misconception_id: mc.acc.o.con_cost_always
    - id: D
      text: Choose each year the method giving the highest profit
      correct: false
      misconception_id: mc.acc.o.con_consistency_ignored
  hints:
  - rung: 1
    name: orient
    text:
      en: 'What is the accountant deciding here: what to record, at what value, or when?'
  - rung: 2
    name: concept
    text:
      en: 'Entity: the business is separate from its owner. Money measurement: only items with a money value. Duality: every transaction has two sides. Historic cost: record at cost. Going concern: assume the business carries on. Accruals: match income and expenses to the period. Prudence: do not overstate profit or assets. Consistency: keep to the same methods. Realisation: revenue when goods pass to the customer. Materiality: small items need not follow strict treatment.'
  - rung: 3
    name: first_step
    text:
      en: Several principles may seem to fit; choose the one the situation is mainly about.
  - rung: 4
    name: worked_step
    text:
      en: Apply the named principle.
  - rung: 5
    name: full_step
    text:
      en: Use the same method each year and explain any change.
  misconception_ids:
  - mc.acc.o.con_consistency_ignored
  - mc.acc.o.con_cost_always
