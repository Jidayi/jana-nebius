id: itm.acc.o.sole_trader_statements.0052
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.working_capital
stem: 'At the year end Nia''s business has: inventory $8100; trade receivables $2400; prepaid expenses $850; bank overdraft $1800; cash in hand $500; trade payables $2000; accrued expenses $850; equipment $13600; loan repayable in six years $6400.'
parts:
- id: a
  prompt: What are the net current assets?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $10800
      correct: false
      misconception_id: mc.acc.o.sofp_overdraft_as_asset
    - id: B
      text: $20800
      correct: false
      misconception_id: mc.acc.o.wc_non_current_included
    - id: C
      text: $7200
      correct: true
    - id: D
      text: $800
      correct: false
      misconception_id: mc.acc.o.sofp_term_confused
  hints:
  - rung: 1
    name: orient
    text:
      en: Net current assets uses only the items that are current. Which items are not?
  - rung: 2
    name: concept
    text:
      en: Net current assets = current assets − current liabilities. An overdraft is owed to the bank.
  - rung: 3
    name: first_step
    text:
      en: The equipment and the loan due in six years are non-current, so leave them out.
  - rung: 4
    name: worked_step
    text:
      en: Work out (8100 + 2400 + 850 + 500) − (2000 + 850 + 1800).
  - rung: 5
    name: full_step
    text:
      en: (8100 + 2400 + 850 + 500) − (2000 + 850 + 1800) = $7200.
  misconception_ids:
  - mc.acc.o.sofp_overdraft_as_asset
  - mc.acc.o.wc_non_current_included
  - mc.acc.o.sofp_term_confused
solution:
  steps:
  - n: 1
    latex: \text{Net current assets} = \text{current assets} - \text{current liabilities}
    reason: Non-current items are left out
    check_id: chk_build_acc_sole_trader_statements_0052_t
  - n: 2
    latex: \text{Net current assets} = (8100 + 2400 + 850 + 500) - (2000 + 850 + 1800) = 7200
    reason: Substitute
    check_id: chk_build_acc_sole_trader_statements_0052_a
