id: itm.acc.o.ratios.0025
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.ratios.liquidity
stem: Yaw's business has inventory $8500, trade receivables $1600, a bank balance of $2300 and current liabilities of $11500.
parts:
- id: a
  prompt: Calculate the acid-test (quick) ratio, as the first number of a ratio to 1. Give your answer to 2 decimal places.
  marks: 2
  answer:
    kind: numeric
    value: '0.34'
    unit: :1
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_ratios_0025_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The acid-test ratio asks whether the business can pay its current liabilities without selling inventory.
  - rung: 2
    name: concept
    text:
      en: 'Acid-test ratio = (current assets − inventory) : current liabilities.'
  - rung: 3
    name: first_step
    text:
      en: Leave the inventory out of the assets.
  - rung: 4
    name: worked_step
    text:
      en: Divide (1600 + 2300) by 11500.
  - rung: 5
    name: full_step
    text:
      en: 'Acid-test ratio = 0.34 : 1.'
  misconception_ids:
  - mc.acc.o.rat_acid_includes_inventory
  - mc.acc.o.rat_ratio_inverted
solution:
  steps:
  - n: 1
    latex: \text{Acid-test (quick) ratio} = \frac{\text{current assets - inventory}}{\text{current liabilities}}
    reason: Expressed as a ratio to 1
    check_id: chk_build_acc_ratios_0025_t
  - n: 2
    latex: \frac{1600 + 2300}{11500} = 0.34
    reason: Substitute
    check_id: chk_build_acc_ratios_0025_a
