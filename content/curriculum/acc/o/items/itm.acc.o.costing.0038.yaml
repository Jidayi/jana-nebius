id: itm.acc.o.costing.0038
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.margin_of_safety
stem: Zanele makes loaves of bread that sell for $50 each, with variable costs of $26 each and fixed costs of $7200. Expected output is 1550 units.
parts:
- id: a
  prompt: Calculate the margin of safety in units.
  marks: 3
  answer:
    kind: numeric
    value: '1250.00'
    unit: units
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_costing_0038_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: How far can output fall before the business makes a loss?
  - rung: 2
    name: concept
    text:
      en: Margin of safety = expected output − break-even output.
  - rung: 3
    name: first_step
    text:
      en: Break-even = fixed costs ÷ contribution per unit.
  - rung: 4
    name: worked_step
    text:
      en: Work out 1550 − 7200 ÷ (50 − 26).
  - rung: 5
    name: full_step
    text:
      en: Margin of safety = 1250 units.
  misconception_ids:
  - mc.acc.o.cost_mos_be_as_mos
  - mc.acc.o.cost_mos_output_as_mos
solution:
  steps:
  - n: 1
    latex: \text{Margin of safety} = \text{output} - \text{break-even}
    reason: Room before a loss
    check_id: chk_build_acc_costing_0038_t
  - n: 2
    latex: \text{Break-even} = \frac{7200}{50 - 26} = 300
    reason: Units
    check_id: chk_build_acc_costing_0038_s2
  - n: 3
    latex: 1550 - 300 = 1250
    reason: Subtract
    check_id: chk_build_acc_costing_0038_a
