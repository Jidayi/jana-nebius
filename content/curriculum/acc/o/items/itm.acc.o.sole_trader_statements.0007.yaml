stem: 'Obi runs a phone repair business. Figures for the year: opening inventory $7400; purchases $39000; carriage inwards $750; carriage outwards $1350; closing inventory $3500.'
parts:
- id: a
  prompt: Calculate the cost of sales for the year.
  marks: 3
  answer:
    kind: numeric
    value: '43650.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0007_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Cost of sales is the cost of the goods actually sold this year. Which figures change it, and which belong with the expenses?
  - rung: 2
    name: concept
    text:
      en: Goods available = opening inventory + purchases − purchases returns + carriage inwards. Take away the closing inventory to get cost of sales. Carriage outwards is a selling expense.
  - rung: 3
    name: first_step
    text:
      en: Start with the opening inventory of $7400 and add the purchases of $39000.
  - rung: 4
    name: worked_step
    text:
      en: Cost of sales = (7400 + 39000 + 750) − 3500.
  - rung: 5
    name: full_step
    text:
      en: Cost of sales = (7400 + 39000 + 750) − 3500 = $43650.
  misconception_ids:
  - mc.acc.o.cos_closing_added
  - mc.acc.o.cos_carriage_outwards_included
solution:
  steps:
  - n: 1
    latex: \text{Cost of sales} = \text{opening inventory} + \text{net purchases} + \text{carriage inwards} - \text{closing inventory}
    reason: The goods available less the goods left
    check_id: chk_build_acc_sole_trader_statements_0007_t
  - n: 2
    latex: \text{Goods available} = 7400 + 39000 + 750 = 47150
    reason: Opening inventory and net purchases
    check_id: chk_build_acc_sole_trader_statements_0007_s2
  - n: 3
    latex: \text{Cost of sales} = 47150 - 3500 = 43650
    reason: Take away the closing inventory
    check_id: chk_build_acc_sole_trader_statements_0007_a
