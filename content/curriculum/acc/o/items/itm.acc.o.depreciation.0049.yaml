type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.depreciation.net_book_value
stem: Juma's delivery van cost $5900 and is depreciated by the reducing balance at 10% a year.
parts:
- id: a
  prompt: Calculate the net book value at the end of 3 years.
  marks: 3
  answer:
    kind: numeric
    value: '4301.10'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_depreciation_0049_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Net book value is what is left of the cost after depreciation so far.
  - rung: 2
    name: concept
    text:
      en: Net book value = cost − accumulated depreciation.
  - rung: 3
    name: first_step
    text:
      en: Find the accumulated depreciation for all the years first.
  - rung: 4
    name: worked_step
    text:
      en: Net book value = 5900 − accumulated depreciation for 3 years.
  - rung: 5
    name: full_step
    text:
      en: Net book value = $5900 − $1598.90 = $4301.10.
  misconception_ids:
  - mc.acc.o.nbv_one_year_only
  - mc.acc.o.nbv_accumulated_as_nbv
solution:
  steps:
  - n: 1
    latex: \text{Net book value} = \text{cost} - \text{accumulated depreciation}
    reason: What is left
    check_id: chk_build_acc_depreciation_0049_t
  - n: 2
    latex: \text{Accumulated depreciation} = 1598.90
    reason: All the charges so far
    check_id: chk_build_acc_depreciation_0049_s2
  - n: 3
    latex: \text{Net book value} = 5900 - 1598.90 = 4301.10
    reason: Subtract
    check_id: chk_build_acc_depreciation_0049_a
