stem: Kofi's business has inventory $2100, trade receivables $9500, bank $3000 and current liabilities $3500.
parts:
- id: a
  prompt: What is the acid-test ratio?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '3.57 : 1'
      correct: true
    - id: B
      text: '4.17 : 1'
      correct: false
      misconception_id: mc.acc.o.rat_acid_includes_inventory
    - id: C
      text: '2.71 : 1'
      correct: false
      misconception_id: mc.acc.o.rat_quick_assets_too_narrow
    - id: D
      text: '0.28 : 1'
      correct: false
      misconception_id: mc.acc.o.rat_ratio_inverted
  hints:
  - rung: 1
    name: orient
    text:
      en: Which current assets can be turned into cash quickly?
  - rung: 2
    name: concept
    text:
      en: 'Acid-test ratio = (current assets − inventory) : current liabilities.'
  - rung: 3
    name: first_step
    text:
      en: Receivables and money in the bank both count; inventory does not.
  - rung: 4
    name: worked_step
    text:
      en: Divide (9500 + 3000) by 3500.
  - rung: 5
    name: full_step
    text:
      en: 'The acid-test ratio is 3.57 : 1.'
  misconception_ids:
  - mc.acc.o.rat_acid_includes_inventory
  - mc.acc.o.rat_ratio_inverted
  - mc.acc.o.rat_quick_assets_too_narrow
solution:
  steps:
  - n: 1
    latex: \text{Acid test} = \frac{\text{current assets} - \text{inventory}}{\text{current liabilities}}
    reason: The pack's definition
    check_id: chk_build_acc_ratios_0032_t
  - n: 2
    latex: \frac{9500 + 3000}{3500} = 3.57
    reason: Substitute
    check_id: chk_build_acc_ratios_0032_a
