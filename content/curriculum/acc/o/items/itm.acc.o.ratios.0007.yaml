id: itm.acc.o.ratios.0007
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.ratios.margins
stem: 'Nia runs a hardware shop. For the year: revenue $70500; cost of sales $45500; expenses $14100.'
parts:
- id: a
  prompt: Calculate the gross margin as a percentage. Give your answer to 2 decimal places.
  marks: 2
  answer:
    kind: numeric
    value: '35.46'
    unit: '%'
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_ratios_0007_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A margin compares a profit with revenue. Which profit does the gross margin use?
  - rung: 2
    name: concept
    text:
      en: Gross margin = gross profit ÷ revenue, written as a percentage.
  - rung: 3
    name: first_step
    text:
      en: Find the gross profit first. Gross profit = revenue − cost of sales.
  - rung: 4
    name: worked_step
    text:
      en: Divide the gross profit by 70500 and write it as a percentage.
  - rung: 5
    name: full_step
    text:
      en: Gross margin = 35.46%.
  misconception_ids:
  - mc.acc.o.rat_margin_markup_confused
  - mc.acc.o.rat_gross_net_confused
solution:
  steps:
  - n: 1
    latex: \text{Gross margin} = \frac{\text{gross profit}}{\text{revenue}} \text{ as a percentage}
    reason: Profit for each dollar of revenue
    check_id: chk_build_acc_ratios_0007_t
  - n: 2
    latex: \text{Gross profit} = 25000
    reason: The profit used
    check_id: chk_build_acc_ratios_0007_s2
  - n: 3
    latex: \frac{25000}{70500} \rightarrow 35.46\%
    reason: As a percentage
    check_id: chk_build_acc_ratios_0007_a
difficulty:
  prior: -0.2
  band: core
