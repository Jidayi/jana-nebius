stem: Kofi's capital was $47000 at the start of the year and $54700 at the end. Gross profit was $37500 and profit for the year $20100. A long-term loan of $25000 is owed.
parts:
- id: a
  prompt: Using profit for the year ÷ (closing capital + non-current liabilities), what is the return on capital employed?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 25.22%
      correct: true
    - id: B
      text: 47.05%
      correct: false
      misconception_id: mc.acc.o.rat_gross_net_confused
    - id: C
      text: 27.92%
      correct: false
      misconception_id: mc.acc.o.rat_capital_basis_wrong
    - id: D
      text: 36.75%
      correct: false
      misconception_id: mc.acc.o.rat_capital_employed_wrong
  hints:
  - rung: 1
    name: orient
    text:
      en: Which profit, and which capital figure, does the stated definition use?
  - rung: 2
    name: concept
    text:
      en: ROCE = profit for the year ÷ (closing capital + non-current liabilities), as a percentage.
  - rung: 3
    name: first_step
    text:
      en: The loan is part of the capital employed in the business.
  - rung: 4
    name: worked_step
    text:
      en: Divide 20100 by (54700 + 25000).
  - rung: 5
    name: full_step
    text:
      en: ROCE = 25.22%.
  misconception_ids:
  - mc.acc.o.rat_capital_employed_wrong
  - mc.acc.o.rat_capital_basis_wrong
  - mc.acc.o.rat_gross_net_confused
solution:
  steps:
  - n: 1
    latex: \text{ROCE} = \frac{\text{profit for the year}}{\text{capital} + \text{non-current liabilities}}
    reason: The stated definition
    check_id: chk_build_acc_ratios_0066_t
  - n: 2
    latex: \frac{20100}{54700 + 25000} \rightarrow 25.22\%
    reason: Substitute
    check_id: chk_build_acc_ratios_0066_a
