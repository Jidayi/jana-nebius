stem: A shop's revenue rose by a fifth this year, but its gross margin fell.
parts:
- id: a
  prompt: Which is the most likely cause?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Its expenses such as rent rose
      correct: false
      misconception_id: mc.acc.o.rat_gross_net_confused
    - id: B
      text: It sold more goods, which always lowers the margin
      correct: false
      misconception_id: mc.acc.o.rat_interpret_volume_margin
    - id: C
      text: It cut its selling prices to sell more
      correct: true
    - id: D
      text: Its bank overdraft increased
      correct: false
      misconception_id: mc.acc.o.rat_interpret_liquidity_profit
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Which kind of ratio is this: profitability, liquidity or efficiency?'
  - rung: 2
    name: concept
    text:
      en: Profitability ratios respond to prices and costs; liquidity ratios to current assets and liabilities; efficiency ratios to how fast inventory, receivables and payables turn over.
  - rung: 3
    name: first_step
    text:
      en: A higher or lower figure is not good or bad on its own; ask what caused it.
  - rung: 4
    name: worked_step
    text:
      en: Link the change to the figures in that ratio.
  - rung: 5
    name: full_step
    text:
      en: It cut its selling prices to sell more.
  misconception_ids:
  - mc.acc.o.rat_interpret_volume_margin
  - mc.acc.o.rat_interpret_liquidity_profit
  - mc.acc.o.rat_gross_net_confused
