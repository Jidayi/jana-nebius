id: itm.acc.o.bank_reconciliation.0020
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.bank_reconciliation.update_cash_book
stem: 'Nomsa''s cash book shows a debit bank balance of $3610. The bank statement shows these items that are not in the cash book: bank charges $130; interest paid by the bank $340; a standing order for insurance $600. A cheque for $700 has not yet been presented.'
parts:
- id: a
  prompt: What is the updated cash book balance?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $3220
      correct: true
    - id: B
      text: $2880
      correct: false
      misconception_id: mc.acc.o.br_credit_transfer_omitted
    - id: C
      text: $2520
      correct: false
      misconception_id: mc.acc.o.br_includes_timing
    - id: D
      text: $4000
      correct: false
      misconception_id: mc.acc.o.br_update_signs_reversed
  hints:
  - rung: 1
    name: orient
    text:
      en: Only the items on the statement that are missing from the cash book change it.
  - rung: 2
    name: concept
    text:
      en: Add money the bank received for you; subtract money it paid out or took.
  - rung: 3
    name: first_step
    text:
      en: The unpresented cheque is already in the cash book, so it does not change it again.
  - rung: 4
    name: worked_step
    text:
      en: Start from the cash book balance and apply each statement-only item.
  - rung: 5
    name: full_step
    text:
      en: The updated balance is $3220.
  misconception_ids:
  - mc.acc.o.br_update_signs_reversed
  - mc.acc.o.br_includes_timing
  - mc.acc.o.br_credit_transfer_omitted
solution:
  steps:
  - n: 1
    latex: \text{Updated balance} = \text{balance} + \text{receipts} - \text{payments}
    reason: Statement-only items
    check_id: chk_build_acc_bank_reconciliation_0020_t
  - n: 2
    latex: '\text{Answer: \$3220}'
    reason: The key, checked
    check_id: chk_build_acc_bank_reconciliation_0020_a
difficulty:
  prior: 0.1
  band: core
estimated_seconds: 45
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
context_tags:
- local_names
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_bank_reconciliation_0020_a:
    args:
      dp: 2
      expression: 3610 - 130 + 340 - 600
    tool: math_evaluate
  chk_build_acc_bank_reconciliation_0020_t:
    args:
      bank_statement:
        balance: '2750'
        entries:
        - amount: '130'
          details: bank charges
          direction: out
        - amount: '340'
          details: interest paid by the bank
          direction: in
        - amount: '600'
          details: a standing order for insurance
          direction: out
        overdrawn: false
      cash_book:
        balance: '3610'
        entries:
        - amount: '700'
          details: cheque number 100678
          direction: out
          ref: t0
        - amount: '1170'
          details: cash paid in on the last day of the month
          direction: in
          ref: t1
        overdrawn: false
      dp: 2
      start_from: bank_statement
      task: reconcile
    tool: acc_double_entry
authoring:
  drafted_by: rev_author_agent
  history:
  - drafted
  - verified
  - in_eval_bank
  - published
