id: itm.acc.o.incomplete_records.0019
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.incomplete_records.profit_from_capital
stem: A trader's capital was $19800 at the start of the year and $33400 at the end. During the year the trader took drawings of $7400 and paid in extra capital of $3200.
parts:
- id: a
  prompt: What is the profit for the year?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $13600
      correct: false
      misconception_id: mc.acc.o.ir_change_only
    - id: B
      text: $17800
      correct: true
    - id: C
      text: $3000
      correct: false
      misconception_id: mc.acc.o.ir_drawings_subtracted
    - id: D
      text: $24200
      correct: false
      misconception_id: mc.acc.o.ir_capital_introduced_added
  hints:
  - rung: 1
    name: orient
    text:
      en: What explains the change in capital over the year?
  - rung: 2
    name: concept
    text:
      en: Profit = closing capital − opening capital + drawings − capital introduced.
  - rung: 3
    name: first_step
    text:
      en: Capital paid in is not profit, so take it out of the increase.
  - rung: 4
    name: worked_step
    text:
      en: Work out 33400 − 19800 + 7400 − 3200.
  - rung: 5
    name: full_step
    text:
      en: Profit = $17800.
  misconception_ids:
  - mc.acc.o.ir_drawings_subtracted
  - mc.acc.o.ir_capital_introduced_added
  - mc.acc.o.ir_change_only
solution:
  steps:
  - n: 1
    latex: \text{Profit} = \text{closing} - \text{opening} + \text{drawings} - \text{introduced}
    reason: Explain the change
    check_id: chk_build_acc_incomplete_records_0019_t
  - n: 2
    latex: 33400 - 19800 + 7400 - 3200 = 17800
    reason: Substitute
    check_id: chk_build_acc_incomplete_records_0019_a
