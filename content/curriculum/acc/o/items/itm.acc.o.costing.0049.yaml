  prompt: Calculate the number of units that must be sold.
  marks: 2
  answer:
    kind: numeric
    value: '2350.00'
    unit: units
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_costing_0049_a
  show_working: true
