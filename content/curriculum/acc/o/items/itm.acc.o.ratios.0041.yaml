subject: acc
level: o
kc_ids:
- kc.acc.o.ratios.inventory_turnover
stem: Juma's opening inventory was $3500 and closing inventory $8100. Revenue was $158000 and cost of sales $102000.
parts:
- id: a
  prompt: What is the rate of inventory turnover (times a year)?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 0.06 times
      correct: false
      misconception_id: mc.acc.o.rat_ratio_inverted
    - id: B
      text: 17.59 times
      correct: true
    - id: C
      text: 27.24 times
      correct: false
      misconception_id: mc.acc.o.rat_revenue_for_cos
    - id: D
      text: 12.59 times
      correct: false
      misconception_id: mc.acc.o.rat_closing_inventory_used
  hints:
  - rung: 1
    name: orient
    text:
      en: Which figures are at cost, and which inventory figure does the pack's definition use?
  - rung: 2
    name: concept
    text:
      en: Turnover = cost of sales ÷ average inventory, where average = (opening + closing) ÷ 2.
  - rung: 3
    name: first_step
    text:
      en: Revenue is at selling price, so it does not match inventory at cost.
  - rung: 4
    name: worked_step
    text:
      en: Divide 102000 by (3500 + 8100) ÷ 2.
  - rung: 5
    name: full_step
    text:
      en: Inventory turnover = 17.59 times.
  misconception_ids:
  - mc.acc.o.rat_closing_inventory_used
  - mc.acc.o.rat_revenue_for_cos
  - mc.acc.o.rat_ratio_inverted
solution:
  steps:
  - n: 1
    latex: \text{Turnover} = \frac{\text{cost of sales}}{\text{average inventory}}
    reason: Average inventory
    check_id: chk_build_acc_ratios_0041_t
  - n: 2
    latex: \text{Average inventory} = 5800
    reason: Opening plus closing, halved
    check_id: chk_build_acc_ratios_0041_s2
  - n: 3
    latex: \frac{102000}{5800} = 17.59
    reason: Substitute
    check_id: chk_build_acc_ratios_0041_a
