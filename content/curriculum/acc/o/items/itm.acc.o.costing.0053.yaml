    text:
      en: What must the total contribution pay for?
  - rung: 2
    name: concept
    text:
      en: Units = (fixed costs + target profit) ÷ contribution per unit.
  - rung: 3
    name: first_step
    text:
      en: The profit is added to the fixed costs, not taken away.
  - rung: 4
    name: worked_step
    text:
      en: Work out (6400 + 3000) ÷ (10 − 6).
  - rung: 5
    name: full_step
    text:
      en: 2350.00 units.
