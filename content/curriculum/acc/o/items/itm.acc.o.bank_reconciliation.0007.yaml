stem: When reconciling a bank account, one item is a standing order for rent shown on the statement only.
parts:
- id: a
  prompt: How is it treated?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: An item to enter in the cash book
      correct: true
    - id: B
      text: An outstanding lodgement
      correct: false
    - id: C
      text: An unpresented cheque
      correct: false
    - id: D
      text: An error made by the bank
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Is the item already in the cash book, or only on the statement?
  - rung: 2
    name: concept
    text:
      en: 'Only on the statement: update the cash book. Only in the cash book: a timing difference.'
  - rung: 3
    name: first_step
    text:
      en: 'Paid out and not yet cleared: unpresented. Paid in and not yet credited: outstanding lodgement.'
  - rung: 4
    name: worked_step
    text:
      en: Match the item to the rule.
  - rung: 5
    name: full_step
    text:
      en: 'It is treated as: an item to enter in the cash book.'
