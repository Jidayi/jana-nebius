type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.source_documents.post_day_book_totals
stem: Thabo's purchases journal for the month totals $16000. Each supplier's account has already been credited. The business keeps a trade payables control account.
parts:
- id: a
  prompt: Which entry posts the monthly total?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Debit Purchases $16000; credit Bank $16000
      correct: false
      misconception_id: mc.acc.o.de_credit_as_cash
    - id: B
      text: Debit Trade payables $16000; credit Purchases $16000
      correct: false
      misconception_id: mc.acc.o.de_debit_credit_swapped
    - id: C
      text: Debit Sales $16000; credit Trade payables $16000
      correct: false
      misconception_id: mc.acc.o.sd_wrong_journal_account
    - id: D
      text: Debit Purchases $16000; credit Trade payables $16000
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which ledger account collects all the credit purchases of the month?
  - rung: 2
    name: concept
    text:
      en: The purchases journal total is debited to purchases; the suppliers (in total) are credited.
  - rung: 3
    name: first_step
    text:
      en: No money has been paid yet.
  - rung: 4
    name: worked_step
    text:
      en: Debit purchases; credit payables.
  - rung: 5
    name: full_step
    text:
      en: Debit Purchases $16000; credit Trade payables $16000.
  misconception_ids:
  - mc.acc.o.de_debit_credit_swapped
  - mc.acc.o.de_credit_as_cash
  - mc.acc.o.sd_wrong_journal_account
solution:
  steps:
  - n: 1
    latex: \text{Debit the account that gains value; credit the account that gives it}
    reason: The dual aspect of every transaction
    check_id: chk_build_acc_source_documents_0045_t
  - n: 2
    latex: \text{Debit Purchases}\ 16000;\ \text{credit Trade payables}\ 16000
    reason: Purchases increase; the business owes more
