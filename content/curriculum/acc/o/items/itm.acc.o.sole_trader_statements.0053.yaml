id: itm.acc.o.sole_trader_statements.0053
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.working_capital
stem: 'At the year end Obi''s business has: inventory $6400; trade receivables $2000; prepaid expenses $150; bank overdraft $2600; cash in hand $300; trade payables $4100; accrued expenses $150; equipment $22200; loan repayable in six years $11600.'
parts:
- id: a
  prompt: What are the net current assets?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $24200
      correct: false
      misconception_id: mc.acc.o.wc_non_current_included
    - id: B
      text: $7200
      correct: false
      misconception_id: mc.acc.o.sofp_overdraft_as_asset
    - id: C
      text: $-9600
      correct: false
      misconception_id: mc.acc.o.sofp_term_confused
    - id: D
      text: $2000
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Net current assets uses only the items that are current. Which items are not?
  - rung: 2
    name: concept
    text:
      en: Net current assets = current assets − current liabilities. An overdraft is owed to the bank.
  - rung: 3
    name: first_step
    text:
      en: The equipment and the loan due in six years are non-current, so leave them out.
  - rung: 4
    name: worked_step
    text:
      en: Work out (6400 + 2000 + 150 + 300) − (4100 + 150 + 2600).
  - rung: 5
    name: full_step
    text:
      en: (6400 + 2000 + 150 + 300) − (4100 + 150 + 2600) = $2000.
  misconception_ids:
  - mc.acc.o.sofp_overdraft_as_asset
  - mc.acc.o.wc_non_current_included
  - mc.acc.o.sofp_term_confused
solution:
  steps:
  - n: 1
    latex: \text{Net current assets} = \text{current assets} - \text{current liabilities}
    reason: Non-current items are left out
    check_id: chk_build_acc_sole_trader_statements_0053_t
  - n: 2
    latex: \text{Net current assets} = (6400 + 2000 + 150 + 300) - (4100 + 150 + 2600) = 2000
    reason: Substitute
    check_id: chk_build_acc_sole_trader_statements_0053_a
