stem: A partnership keeps fixed capital accounts. One item is drawings of goods.
parts:
- id: a
  prompt: Which partner's account records it?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Current account
      correct: true
    - id: B
      text: Capital account
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Is this long-term capital or part of the year's dealings?
  - rung: 2
    name: concept
    text:
      en: Fixed capital accounts change only when long-term capital changes.
  - rung: 3
    name: first_step
    text:
      en: Profit shares, interest, salaries and drawings go to the current account.
  - rung: 4
    name: worked_step
    text:
      en: Decide long-term or this year.
  - rung: 5
    name: full_step
    text:
      en: The current account.
