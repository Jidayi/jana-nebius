stem: Thabo's revenue was $59000, cost of sales $43000 and expenses $11100.
parts:
- id: a
  prompt: What is the gross margin?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 368.75%
      correct: false
      misconception_id: mc.acc.o.rat_ratio_inverted
    - id: B
      text: 27.12%
      correct: true
    - id: C
      text: 8.31%
      correct: false
      misconception_id: mc.acc.o.rat_gross_net_confused
    - id: D
      text: 37.21%
      correct: false
      misconception_id: mc.acc.o.rat_margin_markup_confused
  hints:
  - rung: 1
    name: orient
    text:
      en: Which profit does the gross margin use, and what is it compared with?
  - rung: 2
    name: concept
    text:
      en: Gross margin = gross profit ÷ revenue, as a percentage.
  - rung: 3
    name: first_step
    text:
      en: Gross profit is before expenses; compare it with revenue, not with cost of sales.
  - rung: 4
    name: worked_step
    text:
      en: Work out (59000 − 43000) ÷ 59000 as a percentage.
  - rung: 5
    name: full_step
    text:
      en: Gross margin = 27.12%.
  misconception_ids:
  - mc.acc.o.rat_margin_markup_confused
  - mc.acc.o.rat_ratio_inverted
  - mc.acc.o.rat_gross_net_confused
solution:
  steps:
  - n: 1
    latex: \text{Gross margin} = \frac{\text{gross profit}}{\text{revenue}}
    reason: As a percentage
