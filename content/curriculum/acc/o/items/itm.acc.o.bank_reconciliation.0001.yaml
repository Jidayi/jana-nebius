id: itm.acc.o.bank_reconciliation.0001
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.bank_reconciliation.timing_differences
stem: Nia is reconciling the business bank account. One item is a cheque paid to a supplier on the last day of the month, entered in the cash book but not yet on the bank statement.
parts:
- id: a
  prompt: How is it treated?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: An error made by the bank
      correct: false
      misconception_id: mc.acc.o.br_bank_error_assumed
    - id: B
      text: An unpresented cheque
      correct: true
    - id: C
      text: An outstanding lodgement
      correct: false
      misconception_id: mc.acc.o.br_unpresented_vs_lodgement
    - id: D
      text: An item to enter in the cash book
      correct: false
      misconception_id: mc.acc.o.br_update_vs_timing
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Where does the item appear so far: only in the cash book, or only on the bank statement?'
  - rung: 2
    name: concept
    text:
      en: Items only on the statement are entered in the cash book. Items only in the cash book are timing differences that go in the reconciliation statement.
  - rung: 3
    name: first_step
    text:
      en: A cheque paid out but not yet cleared is unpresented; money paid in but not yet credited is an outstanding lodgement.
  - rung: 4
    name: worked_step
    text:
      en: Decide the direction (paid in or paid out) and where it is recorded.
  - rung: 5
    name: full_step
    text:
      en: 'It is treated as: an unpresented cheque.'
  misconception_ids:
  - mc.acc.o.br_unpresented_vs_lodgement
  - mc.acc.o.br_update_vs_timing
  - mc.acc.o.br_bank_error_assumed
solution:
  steps:
  - n: 1
    latex: \text{Only on the statement} \rightarrow \text{cash book; only in the cash book} \rightarrow \text{timing}
    reason: Sort by where the item is recorded
    check_id: chk_build_acc_bank_reconciliation_0001_t
difficulty:
  prior: -0.4
  band: foundation
estimated_seconds: 45
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
context_tags:
- local_names
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_bank_reconciliation_0001_t:
    args:
      bank_statement:
        balance: '5250'
        entries: []
        overdrawn: false
      cash_book:
        balance: '5000'
        entries:
        - amount: '250'
          direction: out
          ref: x1
        overdrawn: false
      dp: 2
      start_from: bank_statement
      task: reconcile
    tool: acc_double_entry
