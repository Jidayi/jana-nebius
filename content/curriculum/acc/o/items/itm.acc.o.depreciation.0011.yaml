stem: A business buys a printing machine for $15900. It pays $250 to have it delivered and $600 to have it installed, and spends $200 running it in the first month.
parts:
- id: a
  prompt: Calculate the cost of the printing machine to be shown as a non-current asset.
  marks: 2
  answer:
    kind: numeric
    value: '16750.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_depreciation_0011_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which payments got the asset ready for use, and which were for using it?
  - rung: 2
    name: concept
    text:
      en: 'The cost of a non-current asset includes its price and the costs of getting it ready: delivery and installation.'
  - rung: 3
    name: first_step
    text:
      en: Running costs after it is ready are revenue expenditure.
  - rung: 4
    name: worked_step
    text:
      en: Cost = 15900 + 250 + 600.
  - rung: 5
    name: full_step
    text:
      en: Cost = $16750.
  misconception_ids:
  - mc.acc.o.cre_installation_as_revenue
  - mc.acc.o.cre_running_costs_capital
solution:
  steps:
  - n: 1
    latex: \text{Cost} = \text{price} + \text{delivery} + \text{installation}
    reason: Costs of getting the asset ready
    check_id: chk_build_acc_depreciation_0011_t
  - n: 2
    latex: \text{Cost} = 15900 + 250 + 600 = 16750
    reason: Running costs are left out
    check_id: chk_build_acc_depreciation_0011_a
