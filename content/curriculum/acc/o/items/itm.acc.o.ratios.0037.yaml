id: itm.acc.o.ratios.0037
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.ratios.inventory_turnover
stem: Tariq runs a market stall. Inventory was $3100 at the start of the year and $6200 at the end. Revenue was $100500 and cost of sales $78500.
parts:
- id: a
  prompt: Calculate the rate of inventory turnover in days (average inventory, a 365-day year). Give your answer to 2 decimal places.
  marks: 3
  answer:
    kind: numeric
    value: '21.62'
    unit: days
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_ratios_0037_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: How quickly does the business sell its inventory?
  - rung: 2
    name: concept
    text:
      en: Use cost of sales, because inventory is valued at cost, and average inventory = (opening + closing) ÷ 2.
  - rung: 3
    name: first_step
    text:
      en: Average inventory = (3100 + 6200) ÷ 2.
  - rung: 4
    name: worked_step
    text:
      en: Divide the average inventory by 78500 and multiply by 365.
  - rung: 5
    name: full_step
    text:
      en: Inventory turnover = 21.62 days.
  misconception_ids:
  - mc.acc.o.rat_closing_inventory_used
  - mc.acc.o.rat_revenue_for_cos
solution:
  steps:
  - n: 1
    latex: \text{Turnover} = \frac{\text{cost of sales}}{\text{average inventory}}
    reason: 'The pack''s definition: average inventory'
    check_id: chk_build_acc_ratios_0037_t
  - n: 2
    latex: \text{Average inventory} = \frac{3100 + 6200}{2} = 4650
    reason: Opening plus closing, halved
    check_id: chk_build_acc_ratios_0037_s2
  - n: 3
    latex: \frac{4650}{78500} \times 365 = 21.62
    reason: Days in the year
    check_id: chk_build_acc_ratios_0037_a
