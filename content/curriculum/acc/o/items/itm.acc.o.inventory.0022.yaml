id: itm.acc.o.inventory.0022
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.inventory.avco
stem: 'Femi''s shop: opening inventory 20 tins of paint at $17 each; then bought 120 at $19 each; then sold 110; then bought 50 at $21 each; then sold 40.'
parts:
- id: a
  prompt: Using AVCO (a new average after each purchase), what is the closing inventory?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $760
      correct: false
      misconception_id: mc.acc.o.inv_simple_average
    - id: B
      text: $840
      correct: false
      misconception_id: mc.acc.o.inv_fifo_for_avco
    - id: C
      text: $805.71
      correct: true
    - id: D
      text: $2864.29
      correct: false
      misconception_id: mc.acc.o.inv_cos_for_closing
  hints:
  - rung: 1
    name: orient
    text:
      en: The average must be weighted by how many units were bought at each price.
  - rung: 2
    name: concept
    text:
      en: After each purchase, average = total value held ÷ units held.
  - rung: 3
    name: first_step
    text:
      en: Goods sold leave at the current average, so the average does not change on a sale.
  - rung: 4
    name: worked_step
    text:
      en: Work through the movements in order, keeping units and value.
  - rung: 5
    name: full_step
    text:
      en: Closing inventory = $805.71.
  misconception_ids:
  - mc.acc.o.inv_simple_average
  - mc.acc.o.inv_fifo_for_avco
  - mc.acc.o.inv_cos_for_closing
solution:
  steps:
  - n: 1
    latex: '\text{AVCO: unit cost} = \frac{\text{value held}}{\text{units held}}'
    reason: Weighted average
    check_id: chk_build_acc_inventory_0022_t
  - n: 2
    latex: '\text{Answer: \$805.71}'
    reason: The key, checked
    check_id: chk_build_acc_inventory_0022_a
difficulty:
  prior: 0.4
  band: stretch
estimated_seconds: 45
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
context_tags:
- local_currency
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_inventory_0022_a:
    args:
      dp: 2
      expression: (((((0 + 20 * 17) + 120 * 19) * (140 - 110) / 140) + 50 * 21) * (80 - 40) / 80)
    tool: math_evaluate
  chk_build_acc_inventory_0022_t:
    args:
      avco_basis: perpetual
      dp: 2
      method: avco
      movements:
      - kind: opening
        quantity: 20
        unit_cost: '17'
      - kind: receipt
        quantity: 120
        unit_cost: '19'
      - kind: issue
        quantity: 110
      - kind: receipt
        quantity: 50
        unit_cost: '21'
      - kind: issue
        quantity: 40
      round_unit_cost: false
    tool: acc_inventory
