id: itm.acc.o.clubs.0021
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.clubs.subscriptions
stem: 'A drama society: During the year the club received $11600 in subscriptions, including $90 owing from last year. At the start of the year members had already paid $300 for this year. At the end of the year $410 is owing for this year and $60 has been paid in advance for next year.'
parts:
- id: a
  prompt: What is the subscriptions income for the year?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $12160
      correct: true
    - id: B
      text: $11950
      correct: false
      misconception_id: mc.acc.o.club_opening_items_ignored
    - id: C
      text: $11460
      correct: false
      misconception_id: mc.acc.o.club_arrears_reversed
    - id: D
      text: $11600
      correct: false
      misconception_id: mc.acc.o.club_receipts_only
  hints:
  - rung: 1
    name: orient
    text:
      en: Some money received is not this year's, and some of this year's has not been received.
  - rung: 2
    name: concept
    text:
      en: Take out last year's arrears, add last year's advance, add this year's arrears and take out next year's advance.
  - rung: 3
    name: first_step
    text:
      en: The income statement of a club matches income to the year, like any business.
  - rung: 4
    name: worked_step
    text:
      en: Work out 11600 − 90 + 300 + 410 − 60.
  - rung: 5
    name: full_step
    text:
      en: Subscriptions income = $12160.
  misconception_ids:
  - mc.acc.o.club_receipts_only
  - mc.acc.o.club_arrears_reversed
  - mc.acc.o.club_opening_items_ignored
solution:
  steps:
  - n: 1
    latex: \text{Income} = \text{received} - \text{old arrears} + \text{old advance} + \text{new arrears} - \text{new advance}
    reason: Earned this year
    check_id: chk_build_acc_clubs_0021_t
  - n: 2
    latex: 11600 - 90 + 300 + 410 - 60 = 12160
    reason: Substitute
    check_id: chk_build_acc_clubs_0021_a
