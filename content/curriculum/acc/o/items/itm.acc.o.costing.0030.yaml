id: itm.acc.o.costing.0030
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.break_even
stem: Kojo makes printed T-shirts that sell for $10 each. Variable cost is $3 each; fixed costs are $13300.
parts:
- id: a
  prompt: What is the break-even point in units?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 19000 units
      correct: false
      misconception_id: mc.acc.o.cost_be_units_revenue_confused
    - id: B
      text: 1900 units
      correct: true
    - id: C
      text: 4433.33 units
      correct: false
      misconception_id: mc.acc.o.cost_be_divides_by_vc
    - id: D
      text: 1330.00 units
      correct: false
      misconception_id: mc.acc.o.cost_be_divides_by_price
  hints:
  - rung: 1
    name: orient
    text:
      en: What must each unit's contribution cover?
  - rung: 2
    name: concept
    text:
      en: Break-even units = fixed costs ÷ (selling price − variable cost).
  - rung: 3
    name: first_step
    text:
      en: Dividing by the price or the variable cost alone ignores the other.
  - rung: 4
    name: worked_step
    text:
      en: Work out 13300 ÷ (10 − 3).
  - rung: 5
    name: full_step
    text:
      en: Break-even = 1900 units.
  misconception_ids:
  - mc.acc.o.cost_be_divides_by_price
  - mc.acc.o.cost_be_divides_by_vc
  - mc.acc.o.cost_be_units_revenue_confused
solution:
  steps:
  - n: 1
    latex: \text{Break-even} = \frac{\text{fixed costs}}{\text{price} - \text{variable cost}}
    reason: Contribution covers fixed costs
    check_id: chk_build_acc_costing_0030_t
  - n: 2
    latex: \frac{13300}{10 - 3} = 1900
    reason: Substitute
    check_id: chk_build_acc_costing_0030_a
difficulty:
  prior: 0.1
  band: core
estimated_seconds: 45
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
