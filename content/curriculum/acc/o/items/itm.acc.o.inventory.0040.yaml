stem: Opening inventory is overstated.
parts:
- id: a
  prompt: What is the effect?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Gross profit is overstated
      correct: false
    - id: B
      text: Gross profit is understated
      correct: true
    - id: C
      text: Gross profit is unchanged
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Closing inventory is subtracted in cost of sales; opening inventory is added.
  - rung: 2
    name: concept
    text:
      en: A higher closing inventory means a lower cost of sales and so a higher profit. A higher opening inventory means a higher cost of sales and a lower profit.
  - rung: 3
    name: first_step
    text:
      en: This year's closing inventory is next year's opening inventory, so an error carries into next year in the opposite direction.
  - rung: 4
    name: worked_step
    text:
      en: Follow the error through cost of sales.
  - rung: 5
    name: full_step
    text:
      en: Gross profit is understated.
