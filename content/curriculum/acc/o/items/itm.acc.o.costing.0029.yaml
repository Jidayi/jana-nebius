id: itm.acc.o.costing.0029
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.break_even
stem: Bola makes wooden chairs that sell for $40 each. Variable cost is $15 each; fixed costs are $13750.
parts:
- id: a
  prompt: Calculate the break-even revenue.
  marks: 3
  answer:
    kind: numeric
    value: '22000.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_costing_0029_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the break-even point in units first.
  - rung: 2
    name: concept
    text:
      en: Break-even units = fixed costs ÷ contribution per unit; revenue = units × selling price.
  - rung: 3
    name: first_step
    text:
      en: Contribution per unit = selling price − variable cost.
  - rung: 4
    name: worked_step
    text:
      en: Work out 13750 ÷ (40 − 15), then multiply by 40.
  - rung: 5
    name: full_step
    text:
      en: Break-even revenue = $22000.
  misconception_ids:
  - mc.acc.o.cost_be_units_revenue_confused
  - mc.acc.o.cost_be_divides_by_price
solution:
  steps:
  - n: 1
    latex: \text{Break-even revenue} = \text{break-even units} \times \text{price}
    reason: Units first
    check_id: chk_build_acc_costing_0029_t
  - n: 2
    latex: \text{Break-even units} = \frac{13750}{40 - 15} = 550
    reason: Units
    check_id: chk_build_acc_costing_0029_s2
  - n: 3
    latex: 550 \times 40 = 22000
    reason: Revenue
    check_id: chk_build_acc_costing_0029_a
difficulty:
  prior: 0.2
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
context_tags:
- local_currency
