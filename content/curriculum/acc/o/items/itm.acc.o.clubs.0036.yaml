id: itm.acc.o.clubs.0036
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.clubs.surplus_deficit
stem: 'A youth choir''s figures for the year: subscriptions for the year $7400; competition fees $600; rent $3900; groundsman''s wages $800; electricity $1050; new equipment bought $3000; depreciation of equipment $200.'
parts:
- id: a
  prompt: Calculate the surplus for the year (give a deficit as a negative number).
  marks: 3
  answer:
    kind: numeric
    value: '2050.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_clubs_0036_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A club's surplus is its income for the year less its expenditure for the year.
  - rung: 2
    name: concept
    text:
      en: Include this year's income and expenses, and depreciation; leave out capital spending.
  - rung: 3
    name: first_step
    text:
      en: The equipment bought is an asset; only its depreciation is expenditure.
  - rung: 4
    name: worked_step
    text:
      en: Work out 7400 + 600 − (3900 + 800 + 1050 + 200).
  - rung: 5
    name: full_step
    text:
      en: The club has a surplus of $2050.
  misconception_ids:
  - mc.acc.o.club_capital_items_in_ie
  - mc.acc.o.club_depreciation_omitted
solution:
  steps:
  - n: 1
    latex: \text{Surplus} = \text{income} - \text{expenditure}
    reason: Matching, like profit
    check_id: chk_build_acc_clubs_0036_t
  - n: 2
    latex: \text{Income} = 7400 + 600 = 8000
    reason: Earned this year
    check_id: chk_build_acc_clubs_0036_s2
  - n: 3
    latex: \text{Expenditure} = 3900 + 800 + 1050 + 200 = 5950
    reason: Including depreciation
    check_id: chk_build_acc_clubs_0036_s3
  - n: 4
    latex: 8000 - 5950 \rightarrow 2050\ \text{surplus}
    reason: Subtract
    check_id: chk_build_acc_clubs_0036_s4
difficulty:
  prior: 0.3
  band: core
estimated_seconds: 90
