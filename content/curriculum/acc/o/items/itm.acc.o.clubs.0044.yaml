      expression: 10950 + 250
    tool: math_evaluate
  chk_build_acc_clubs_0044_s3:
    args:
      dp: 4
      expression: 1150 + 1550 + 1200 + 300
    tool: math_evaluate
  chk_build_acc_clubs_0044_s4:
    args:
      dp: 4
      expression: abs(10950 + 250 - (1150 + 1550 + 1200 + 300))
    tool: math_evaluate
