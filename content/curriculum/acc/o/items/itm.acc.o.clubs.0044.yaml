id: itm.acc.o.clubs.0044
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.clubs.surplus_deficit
stem: 'A cycling club''s figures for the year: subscriptions for the year $10950; competition fees $250; rent $1150; groundsman''s wages $1550; electricity $1200; new equipment bought $2700; depreciation of equipment $300.'
parts:
- id: a
  prompt: What is the result for the year?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Deficit of $7000
      correct: false
      misconception_id: mc.acc.o.club_surplus_deficit_reversed
    - id: B
      text: Surplus of $7300
      correct: false
      misconception_id: mc.acc.o.club_depreciation_omitted
    - id: C
      text: Surplus of $4300
      correct: false
      misconception_id: mc.acc.o.club_capital_items_in_ie
    - id: D
      text: Surplus of $7000
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which figures are income and expenditure of this year?
  - rung: 2
    name: concept
    text:
      en: Surplus = income − expenditure, where expenditure includes depreciation but not the cost of new equipment.
  - rung: 3
    name: first_step
    text:
      en: If expenditure is bigger than income, the result is a deficit.
  - rung: 4
    name: worked_step
    text:
      en: Add the income, add the expenditure, and compare.
  - rung: 5
    name: full_step
    text:
      en: Surplus of $7000.
  misconception_ids:
  - mc.acc.o.club_capital_items_in_ie
  - mc.acc.o.club_depreciation_omitted
  - mc.acc.o.club_surplus_deficit_reversed
solution:
  steps:
  - n: 1
    latex: \text{Surplus} = \text{income} - \text{expenditure}
    reason: Matching
    check_id: chk_build_acc_clubs_0044_t
  - n: 2
    latex: \text{Income} = 10950 + 250 = 11200
    reason: Earned
    check_id: chk_build_acc_clubs_0044_s2
  - n: 3
    latex: \text{Expenditure} = 4200
    reason: Including depreciation
    check_id: chk_build_acc_clubs_0044_s3
  - n: 4
    latex: 11200 - 4200 \rightarrow 7000
    reason: Compare
    check_id: chk_build_acc_clubs_0044_s4
