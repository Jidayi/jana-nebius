id: itm.acc.o.ratios.0003
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.ratios.margins
stem: 'Wanjiru runs a small grocery. For the year: revenue $84000; cost of sales $57500; expenses $15500.'
parts:
- id: a
  prompt: Calculate the profit margin as a percentage. Give your answer to 2 decimal places.
  marks: 2
  answer:
    kind: numeric
    value: '13.10'
    unit: '%'
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_ratios_0003_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A margin compares a profit with revenue. Which profit does the profit margin use?
  - rung: 2
    name: concept
    text:
      en: Profit margin = profit for the year ÷ revenue, written as a percentage.
  - rung: 3
    name: first_step
    text:
      en: Find the profit for the year first. Profit for the year = revenue − cost of sales − expenses.
  - rung: 4
    name: worked_step
    text:
      en: Divide the profit for the year by 84000 and write it as a percentage.
  - rung: 5
    name: full_step
    text:
      en: Profit margin = 13.10%.
  misconception_ids:
  - mc.acc.o.rat_margin_markup_confused
  - mc.acc.o.rat_gross_net_confused
solution:
  steps:
  - n: 1
    latex: \text{Profit margin} = \frac{\text{profit for the year}}{\text{revenue}} \text{ as a percentage}
    reason: Profit for each dollar of revenue
    check_id: chk_build_acc_ratios_0003_t
  - n: 2
    latex: \text{Profit for the year} = 11000
    reason: The profit used
    check_id: chk_build_acc_ratios_0003_s2
  - n: 3
    latex: \frac{11000}{84000} \rightarrow 13.10\%
    reason: As a percentage
    check_id: chk_build_acc_ratios_0003_a
difficulty:
  prior: -0.2
  band: core
estimated_seconds: 90
