id: itm.acc.o.inventory.0009
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.inventory.fifo
stem: 'Chipo''s shop: opening inventory 60 rolls of fabric at $4 each; then bought 110 at $6 each; then sold 110; then bought 40 at $7 each; then sold 50.'
parts:
- id: a
  prompt: Using FIFO, what is the closing inventory?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $298.82
      correct: false
      misconception_id: mc.acc.o.inv_avco_for_fifo
    - id: B
      text: $340
      correct: true
    - id: C
      text: $840
      correct: false
      misconception_id: mc.acc.o.inv_cos_for_closing
    - id: D
      text: $200
      correct: false
      misconception_id: mc.acc.o.inv_fifo_reversed
  hints:
  - rung: 1
    name: orient
    text:
      en: Which goods are sold first under FIFO?
  - rung: 2
    name: concept
    text:
      en: The oldest goods go first, so what is left is the newest.
  - rung: 3
    name: first_step
    text:
      en: Closing inventory is what remains, not what was sold.
  - rung: 4
    name: worked_step
    text:
      en: Count the units left and price them from the latest purchase backwards.
  - rung: 5
    name: full_step
    text:
      en: Closing inventory = $340.
  misconception_ids:
  - mc.acc.o.inv_fifo_reversed
  - mc.acc.o.inv_avco_for_fifo
  - mc.acc.o.inv_cos_for_closing
solution:
  steps:
  - n: 1
    latex: '\text{FIFO: the goods left are the latest bought}'
    reason: Oldest goods go first
    check_id: chk_build_acc_inventory_0009_t
  - n: 2
    latex: \text{Units left} = (60 + 110 + 40) - (110 + 50) = 50
    reason: In less out
    check_id: chk_build_acc_inventory_0009_s2
  - n: 3
    latex: \text{From the older batch} = 50 - (40) = 10
    reason: The rest come from the batch before
    check_id: chk_build_acc_inventory_0009_s3
  - n: 4
    latex: \text{Closing} = 10 \times 6 + 40 \times 7 = 340
    reason: Value the remaining layers
    check_id: chk_build_acc_inventory_0009_a
