id: itm.acc.o.sole_trader_statements.0059
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.closing_capital
stem: Nia runs a hardware shop. Capital at the start of the year was $56000. During the year the business made a profit of $10400 and Nia took drawings of $8100.
parts:
- id: a
  prompt: Calculate the capital at the end of the year.
  marks: 2
  answer:
    kind: numeric
    value: '58300.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0059_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Capital is the owner's stake. What made it grow and what made it shrink this year?
  - rung: 2
    name: concept
    text:
      en: Closing capital = opening capital + capital introduced + profit (or − loss) − drawings.
  - rung: 3
    name: first_step
    text:
      en: A profit belongs to the owner and adds to capital; drawings take it away.
  - rung: 4
    name: worked_step
    text:
      en: Closing capital = 56000 + 10400 − 8100.
  - rung: 5
    name: full_step
    text:
      en: Closing capital = $58300.
  misconception_ids:
  - mc.acc.o.cc_drawings_added
  - mc.acc.o.cc_capital_introduced_omitted
solution:
  steps:
  - n: 1
    latex: \text{Closing capital} = \text{opening capital} + \text{capital introduced} + \text{profit} - \text{drawings}
    reason: The owner's stake at the year end
    check_id: chk_build_acc_sole_trader_statements_0059_t
  - n: 2
    latex: \text{Closing capital} = 56000 + 10400 - 8100 = 58300
    reason: Substitute
    check_id: chk_build_acc_sole_trader_statements_0059_a
