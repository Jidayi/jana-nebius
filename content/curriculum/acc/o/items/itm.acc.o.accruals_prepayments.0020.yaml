id: itm.acc.o.accruals_prepayments.0020
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.accruals_prepayments.prepaid_expense
stem: Kojo paid $2650 for electricity during the year. At the start of the year $600 had been paid in advance, and at the end $550 had been paid in advance for next year.
parts:
- id: a
  prompt: What is the electricity expense for the year?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $2700
      correct: true
    - id: B
      text: $2100
      correct: false
      misconception_id: mc.acc.o.acc_opening_ignored
    - id: C
      text: $3800
      correct: false
      misconception_id: mc.acc.o.acc_prepayment_added
    - id: D
      text: $2650
      correct: false
      misconception_id: mc.acc.o.acc_cash_basis
  hints:
  - rung: 1
    name: orient
    text:
      en: Which payments were for this year's use?
  - rung: 2
    name: concept
    text:
      en: Expense = paid − paid in advance at the end + paid in advance at the start.
  - rung: 3
    name: first_step
    text:
      en: Last year's advance payment is used up this year, so it is part of this year's expense.
  - rung: 4
    name: worked_step
    text:
      en: Work out 2650 − 550 + 600.
  - rung: 5
    name: full_step
    text:
      en: The expense is $2700.
  misconception_ids:
  - mc.acc.o.acc_prepayment_added
  - mc.acc.o.acc_opening_ignored
  - mc.acc.o.acc_cash_basis
solution:
  steps:
  - n: 1
    latex: \text{Expense} = \text{paid} - \text{closing prepayment} + \text{opening prepayment}
    reason: Matching
    check_id: chk_build_acc_accruals_prepayments_0020_t
  - n: 2
    latex: \text{Expense} = 2650 - 550 + 600 = 2700
    reason: Substitute
    check_id: chk_build_acc_accruals_prepayments_0020_a
