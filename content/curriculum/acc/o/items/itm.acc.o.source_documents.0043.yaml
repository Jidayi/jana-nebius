stem: 'Aisha sold goods to F. Sesay: list price $5800, trade discount 25%, cash discount 4% for payment within a month. F. Sesay pays within the month.'
parts:
- id: a
  prompt: How much does the customer pay?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $174
      correct: false
      misconception_id: mc.acc.o.sd_discount_as_payment
    - id: B
      text: $4350
      correct: false
      misconception_id: mc.acc.o.sd_cash_discount_ignored
    - id: C
      text: $4118
      correct: false
      misconception_id: mc.acc.o.sd_cash_discount_on_list_price
    - id: D
      text: $4176
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Take the discounts one at a time, in order.
  - rung: 2
    name: concept
    text:
      en: Trade discount first gives the invoice amount; cash discount is a percentage of that amount.
  - rung: 3
    name: first_step
    text:
      en: Paying on time earns the cash discount, so it is taken off.
  - rung: 4
    name: worked_step
    text:
      en: Invoice = 5800 less 25%; then take 4% of the invoice off.
  - rung: 5
    name: full_step
    text:
      en: The customer pays $4176.
  misconception_ids:
  - mc.acc.o.sd_cash_discount_on_list_price
  - mc.acc.o.sd_discount_as_payment
  - mc.acc.o.sd_cash_discount_ignored
solution:
  steps:
  - n: 1
    latex: \text{Paid} = \text{invoice} - \text{cash discount}
    reason: Discounts in order
    check_id: chk_build_acc_source_documents_0043_t
  - n: 2
    latex: \text{Invoice} = 4350
    reason: After trade discount
    check_id: chk_build_acc_source_documents_0043_s2
  - n: 3
    latex: \text{Paid} = 4350 - 4\% \times 4350 = 4176
    reason: Less cash discount
    check_id: chk_build_acc_source_documents_0043_a
