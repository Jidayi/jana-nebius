id: itm.acc.o.costing.0018
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.contribution
stem: Adaeze makes printed T-shirts. Each sells for $50 and has variable costs of $16. Fixed costs are $5100 a year and 800 are made and sold.
parts:
- id: a
  prompt: Calculate the total contribution.
  marks: 2
  answer:
    kind: numeric
    value: '27200.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_costing_0018_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Contribution is what each sale adds towards fixed costs and then profit.
  - rung: 2
    name: concept
    text:
      en: Contribution per unit = selling price − variable cost per unit. Fixed costs are not deducted.
  - rung: 3
    name: first_step
    text:
      en: Total contribution = contribution per unit × units sold.
  - rung: 4
    name: worked_step
    text:
      en: Work out 800 × (50 − 16).
  - rung: 5
    name: full_step
    text:
      en: Total contribution = $27200.
  misconception_ids:
  - mc.acc.o.cost_fixed_in_contribution
  - mc.acc.o.cost_contribution_as_profit
solution:
  steps:
  - n: 1
    latex: \text{Contribution} = \text{selling price} - \text{variable cost}
    reason: Per unit
    check_id: chk_build_acc_costing_0018_t
  - n: 2
    latex: 800 \times (50 - 16) = 27200
    reason: Substitute
    check_id: chk_build_acc_costing_0018_a
difficulty:
  prior: -0.3
  band: foundation
