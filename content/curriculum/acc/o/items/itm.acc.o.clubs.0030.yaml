stem: 'At the start of the year a cycling club had: equipment $2820; bar inventory $8980; bank balance $1290; subscriptions owing from members $5970; subscriptions paid in advance $860; amounts owed to bar suppliers $690; rent owing $210.'
parts:
- id: a
  prompt: What is the accumulated fund?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $19020
      correct: false
      misconception_id: mc.acc.o.club_advance_as_asset
    - id: B
      text: $11330
      correct: false
      misconception_id: mc.acc.o.club_arrears_ignored
    - id: C
      text: $20820
      correct: false
      misconception_id: mc.acc.o.club_fund_signs
    - id: D
      text: $17300
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Sort the items into what the club owns or is owed, and what it owes.
  - rung: 2
    name: concept
    text:
      en: Accumulated fund = assets − liabilities.
  - rung: 3
    name: first_step
    text:
      en: Subscriptions in advance are owed to members as a service, so they are a liability.
  - rung: 4
    name: worked_step
    text:
      en: Work out (2820 + 8980 + 1290 + 5970) − (860 + 690 + 210).
  - rung: 5
    name: full_step
    text:
      en: Accumulated fund = $17300.
  misconception_ids:
  - mc.acc.o.club_advance_as_asset
  - mc.acc.o.club_arrears_ignored
  - mc.acc.o.club_fund_signs
solution:
  steps:
  - n: 1
    latex: \text{Accumulated fund} = \text{assets} - \text{liabilities}
    reason: A club's capital
    check_id: chk_build_acc_clubs_0030_t
  - n: 2
    latex: (2820 + 8980 + 1290 + 5970) - (860 + 690 + 210) = 17300
    reason: Substitute
    check_id: chk_build_acc_clubs_0030_a
