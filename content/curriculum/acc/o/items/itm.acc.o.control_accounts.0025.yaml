stem: 'Lindiwe''s figures for the year: opening balance $5500; credit sales $79000; cash sales $9100; receipts from customers $72200; sales returns $1020; discount allowed $460; irrecoverable debts written off $560; customers'' cheques dishonoured $790.'
parts:
- id: a
  prompt: Calculate the closing balance on the sales ledger control account.
  marks: 4
  answer:
    kind: numeric
    value: '11050.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_control_accounts_0025_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which figures change what credit customers owe? One figure here does not.
  - rung: 2
    name: concept
    text:
      en: 'Debit: opening balance, credit sales, dishonoured cheques. Credit: receipts, returns, discount allowed, irrecoverable debts.'
  - rung: 3
    name: first_step
    text:
      en: Cash sales never pass through customers' accounts.
  - rung: 4
    name: worked_step
    text:
      en: Closing = (5500 + 79000 + 790) − (72200 + 1020 + 460 + 560).
  - rung: 5
    name: full_step
    text:
      en: The closing debit balance is $11050.
  misconception_ids:
  - mc.acc.o.ca_cash_sales_included
  - mc.acc.o.ca_discount_side_reversed
solution:
  steps:
  - n: 1
    latex: \text{Closing} = \text{debits} - \text{credits}
    reason: Balance the control account
    check_id: chk_build_acc_control_accounts_0025_t
  - n: 2
    latex: \text{Debits} = 5500 + 79000 + 790 = 85290
    reason: Increase what customers owe
    check_id: chk_build_acc_control_accounts_0025_s2
  - n: 3
    latex: \text{Credits} = 72200 + 1020 + 460 + 560 = 74240
    reason: Reduce it
    check_id: chk_build_acc_control_accounts_0025_s3
  - n: 4
    latex: \text{Closing} = 85290 - 74240 = 11050
    reason: Subtract
    check_id: chk_build_acc_control_accounts_0025_a
