stem: Halima bought a computer system for $20300. It is depreciated at 25% a year by the reducing-balance method.
parts:
- id: a
  prompt: What is the depreciation charge for the second year?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $5075
      correct: false
      misconception_id: mc.acc.o.rb_on_cost
    - id: B
      text: $11418.75
      correct: false
      misconception_id: mc.acc.o.rb_nbv_as_charge
    - id: C
      text: $2854.69
      correct: false
      misconception_id: mc.acc.o.rb_wrong_year
    - id: D
      text: $3806.25
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: What is the percentage taken of each year?
  - rung: 2
    name: concept
    text:
      en: Each year's charge is the rate times the net book value at the start of that year, not the cost.
  - rung: 3
    name: first_step
    text:
      en: 'Count the years carefully: the charge for a year uses the value left after all earlier years.'
  - rung: 4
    name: worked_step
    text:
      en: Find the net book value at the start of the second year, then take 25% of it.
  - rung: 5
    name: full_step
    text:
      en: 25% of $15225 = $3806.25.
  misconception_ids:
  - mc.acc.o.rb_on_cost
  - mc.acc.o.rb_nbv_as_charge
  - mc.acc.o.rb_wrong_year
solution:
  steps:
  - n: 1
    latex: \text{Charge} = \text{rate} \times \text{opening net book value}
    reason: Reducing balance
    check_id: chk_build_acc_depreciation_0045_t
  - n: 2
    latex: \text{Opening net book value} = 15225
    reason: Cost less the earlier charges
    check_id: chk_build_acc_depreciation_0045_s2
  - n: 3
    latex: \text{Charge} = 25\% \times 15225 = 3806.25
    reason: Substitute
    check_id: chk_build_acc_depreciation_0045_a
