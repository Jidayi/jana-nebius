id: itm.acc.o.sole_trader_statements.0027
version: 0.1.1
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.profit_for_year
stem: 'Thabo runs a chemist''s shop. For the year: gross profit $16800; commission received $950; discount received $1950; advertising $4800; carriage outwards $5250; electricity $5000.'
parts:
- id: a
  prompt: Find the profit for the year.
  marks: 3
  answer:
    kind: numeric
    value: '4650.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0027_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Profit for the year starts from gross profit. What is added, and what is taken away?
  - rung: 2
    name: concept
    text:
      en: Add other income (such as rent or discount received) and subtract every running expense. Drawings are not an expense.
  - rung: 3
    name: first_step
    text:
      en: 'Add up the expenses: 4800 + 5250 + 5000.'
  - rung: 4
    name: worked_step
    text:
      en: Profit for the year = 16800 + 950 + 1950 − (4800 + 5250 + 5000).
  - rung: 5
    name: full_step
    text:
      en: Profit for the year = $4650.
  misconception_ids:
  - mc.acc.o.pfy_drawings_deducted
  - mc.acc.o.pfy_other_income_omitted
solution:
  steps:
  - n: 1
    latex: \text{Profit for the year} = \text{gross profit} + \text{other income} - \text{expenses}
    reason: Drawings are taken from capital, not from profit
    check_id: chk_build_acc_sole_trader_statements_0027_t
  - n: 2
    latex: \text{Expenses} = 4800 + 5250 + 5000 = 15050
    reason: Total the running expenses
    check_id: chk_build_acc_sole_trader_statements_0027_s2
  - n: 3
    latex: \text{Profit for the year} = 16800 + 950 + 1950 - 15050 = 4650
    reason: Substitute
    check_id: chk_build_acc_sole_trader_statements_0027_a
difficulty:
  prior: 0.1
  band: core
