id: itm.acc.o.trial_balance.0055
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.trial_balance.suspense_account
stem: 'Kofi''s trial balance did not agree. These errors were then found: (1) discount received of $850 was entered on the debit side of the discount received account; (2) wages of $2800 were entered in the bank account but not in the wages account. No other errors were made.'
parts:
- id: a
  prompt: What balance was opened in the suspense account?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $4500 debit
      correct: false
      misconception_id: mc.acc.o.susp_adds_all_errors
    - id: B
      text: $1100 debit
      correct: true
    - id: C
      text: $1300 debit
      correct: false
      misconception_id: mc.acc.o.susp_includes_balanced_error
    - id: D
      text: $1100 credit
      correct: false
      misconception_id: mc.acc.o.susp_side_reversed
  hints:
  - rung: 1
    name: orient
    text:
      en: Work out what each error did to the debit and credit totals.
  - rung: 2
    name: concept
    text:
      en: Suspense takes the difference on the side that was short, so the trial balance agrees.
  - rung: 3
    name: first_step
    text:
      en: Errors that leave the debits equal to the credits do not go through suspense.
  - rung: 4
    name: worked_step
    text:
      en: Net the two effects, keeping track of which side is larger.
  - rung: 5
    name: full_step
    text:
      en: Suspense opened with $1100 on the debit side.
  misconception_ids:
  - mc.acc.o.susp_side_reversed
  - mc.acc.o.susp_adds_all_errors
  - mc.acc.o.susp_includes_balanced_error
solution:
  steps:
  - n: 1
    latex: \text{Suspense} = \text{net difference the errors caused}
    reason: It balances the trial balance
    check_id: chk_build_acc_trial_balance_0055_t
  - n: 2
    latex: \text{Suspense} = |2 \times 850 -  2800| = 1100\ \text{debit}
    reason: On the side that was short
    check_id: chk_build_acc_trial_balance_0055_a
difficulty:
  prior: 0.7
  band: stretch
estimated_seconds: 45
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
