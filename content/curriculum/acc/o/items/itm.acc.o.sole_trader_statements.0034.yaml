  prompt: Where is it shown?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Non-current assets
      correct: false
      misconception_id: mc.acc.o.sofp_asset_liability_confused
    - id: B
      text: Current liabilities
      correct: false
      misconception_id: mc.acc.o.sofp_term_confused
    - id: C
      text: Non-current liabilities
      correct: true
    - id: D
      text: Capital
      correct: false
      misconception_id: mc.acc.o.sofp_loan_as_capital
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Ask two questions: is it something the business owns, owes, or the owner''s own stake? And when does it fall due or get used up?'
  - rung: 2
    name: concept
    text:
      en: Current means due or used within one year; non-current means longer. Anything owed to someone other than the owner is a liability.
  - rung: 3
    name: first_step
    text:
      en: Money the owner takes out reduces the owner's stake; it is not owed to anyone.
  - rung: 4
    name: worked_step
    text:
      en: Decide owns, owes or owner's stake first, then current or non-current.
  - rung: 5
    name: full_step
    text:
      en: 'It is shown under: non-current liabilities.'
  misconception_ids:
