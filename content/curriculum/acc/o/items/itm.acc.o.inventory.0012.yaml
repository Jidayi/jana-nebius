id: itm.acc.o.inventory.0012
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.inventory.avco
stem: 'Sipho''s shop: opening inventory 80 crates of soda at $15 each; then bought 120 at $16 each; then sold 150; then bought 70 at $18 each; then sold 10.'
parts:
- id: a
  prompt: Using AVCO (a new average after each purchase), calculate the value of the closing inventory. Give your answer to 2 decimal places.
  marks: 4
  answer:
    kind: numeric
    value: '1870.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_inventory_0012_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The weighted average cost changes each time new goods arrive at a different price.
  - rung: 2
    name: concept
    text:
      en: 'After each purchase: average unit cost = total value held ÷ units held. Goods sold are valued at that average.'
  - rung: 3
    name: first_step
    text:
      en: 'After the first purchase: (80 × 15 + 120 × 16) ÷ (80 + 120).'
  - rung: 4
    name: worked_step
    text:
      en: Take out the units sold at that average, add the next purchase, and find the new average.
  - rung: 5
    name: full_step
    text:
      en: Closing inventory = $1870.
  misconception_ids:
  - mc.acc.o.inv_simple_average
  - mc.acc.o.inv_fifo_for_avco
solution:
  steps:
  - n: 1
    latex: '\text{AVCO: unit cost} = \frac{\text{value held}}{\text{units held}}'
    reason: Recalculate after each purchase
    check_id: chk_build_acc_inventory_0012_t
  - n: 2
    latex: \text{First average} = \frac{80 \times 15 + 120 \times 16}{80 + 120} = 15.6
    reason: Weighted by quantity
    check_id: chk_build_acc_inventory_0012_s2
  - n: 3
    latex: \text{Closing inventory} = 1870.00
    reason: After all the movements
    check_id: chk_build_acc_inventory_0012_a
difficulty:
  prior: 0.4
  band: stretch
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 4
  calculator: true
context_tags:
- local_currency
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_inventory_0012_a:
    args:
      dp: 2
      expression: (((((0 + 80 * 15) + 120 * 16) * (200 - 150) / 200) + 70 * 18) * (120 - 10) / 120)
    tool: math_evaluate
  chk_build_acc_inventory_0012_s2:
    args:
      dp: 4
      expression: (80 * 15 + 120 * 16) / (80 + 120)
    tool: math_evaluate
  chk_build_acc_inventory_0012_t:
    args:
      avco_basis: perpetual
      dp: 2
      method: avco
      movements:
      - kind: opening
        quantity: 80
        unit_cost: '15'
      - kind: receipt
        quantity: 120
        unit_cost: '16'
      - kind: issue
        quantity: 150
      - kind: receipt
        quantity: 70
        unit_cost: '18'
      - kind: issue
        quantity: 10
      round_unit_cost: false
    tool: acc_inventory
authoring:
  drafted_by: rev_author_agent
  history:
  - drafted
  - verified
  - in_eval_bank
  - published
