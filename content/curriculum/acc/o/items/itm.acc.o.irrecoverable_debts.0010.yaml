stem: K. Owusu owed Aisha's business $4450. K. Owusu paid $2450 as a final settlement and the rest will never be received.
parts:
- id: a
  prompt: Calculate the amount written off as an irrecoverable debt.
  marks: 2
  answer:
    kind: numeric
    value: '2000.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_irrecoverable_debts_0010_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: How much did the customer owe, and how much was actually received?
  - rung: 2
    name: concept
    text:
      en: 'The part that will never be received is written off: debit irrecoverable debts, credit the customer.'
  - rung: 3
    name: first_step
    text:
      en: After the write-off the customer's account has no balance left.
  - rung: 4
    name: worked_step
    text:
      en: Amount written off = 4450 − 2450.
  - rung: 5
    name: full_step
    text:
      en: $2000 is written off.
  misconception_ids:
  - mc.acc.o.id_writeoff_to_allowance
solution:
  steps:
  - n: 1
    latex: \text{Written off} = \text{amount owed} - \text{amount received}
    reason: Clear the customer's account
    check_id: chk_build_acc_irrecoverable_debts_0010_t
  - n: 2
    latex: \text{Written off} = 4450 - 2450 = 2000
    reason: Substitute
    check_id: chk_build_acc_irrecoverable_debts_0010_a
