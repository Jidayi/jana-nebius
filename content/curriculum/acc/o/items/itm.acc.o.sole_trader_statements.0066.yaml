stem: Zanele's capital at the start of the year was $48300. Zanele paid in extra capital of $4800, the business made a profit of $10600 and drawings were $8800.
parts:
- id: a
  prompt: What is the capital at the end of the year?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $44300
      correct: false
      misconception_id: mc.acc.o.cc_profit_omitted
    - id: B
      text: $72500
      correct: false
      misconception_id: mc.acc.o.cc_drawings_added
    - id: C
      text: $54900
      correct: true
    - id: D
      text: $50100
      correct: false
      misconception_id: mc.acc.o.cc_capital_introduced_omitted
  hints:
  - rung: 1
    name: orient
    text:
      en: List what increased the owner's stake and what reduced it.
  - rung: 2
    name: concept
    text:
      en: Closing capital = opening capital + capital introduced + profit − drawings.
  - rung: 3
    name: first_step
    text:
      en: Drawings are taken out by the owner, so they are subtracted.
  - rung: 4
    name: worked_step
    text:
      en: Work out 48300 + 4800 + 10600 − 8800.
  - rung: 5
    name: full_step
    text:
      en: 48300 + 4800 + 10600 − 8800 = $54900.
  misconception_ids:
  - mc.acc.o.cc_drawings_added
  - mc.acc.o.cc_capital_introduced_omitted
  - mc.acc.o.cc_profit_omitted
