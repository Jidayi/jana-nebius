id: itm.acc.o.costing.0022
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.contribution
stem: Thabo makes and sells 2550 printed T-shirts at $40 each. Variable cost is $19 each and fixed costs are $44100.
parts:
- id: a
  prompt: What is the total contribution?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $9450
      correct: false
      misconception_id: mc.acc.o.cost_contribution_as_profit
    - id: B
      text: $102000
      correct: false
      misconception_id: mc.acc.o.cost_fixed_in_contribution
    - id: C
      text: $53550
      correct: true
    - id: D
      text: $150450
      correct: false
      misconception_id: mc.acc.o.cost_vc_added
  hints:
  - rung: 1
    name: orient
    text:
      en: What does contribution leave out?
  - rung: 2
    name: concept
    text:
      en: Total contribution = units × (selling price − variable cost); fixed costs come off later.
  - rung: 3
    name: first_step
    text:
      en: Contribution minus fixed costs is profit, not contribution.
  - rung: 4
    name: worked_step
    text:
      en: Work out 2550 × (40 − 19).
  - rung: 5
    name: full_step
    text:
      en: Total contribution = $53550.
  misconception_ids:
  - mc.acc.o.cost_contribution_as_profit
  - mc.acc.o.cost_vc_added
  - mc.acc.o.cost_fixed_in_contribution
solution:
  steps:
  - n: 1
    latex: \text{Contribution} = \text{units} \times (\text{price} - \text{variable cost})
    reason: Before fixed costs
    check_id: chk_build_acc_costing_0022_t
  - n: 2
    latex: 2550 \times (40 - 19) = 53550
    reason: Substitute
    check_id: chk_build_acc_costing_0022_a
difficulty:
  prior: -0.2
  band: foundation
estimated_seconds: 45
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
