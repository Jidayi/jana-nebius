id: itm.acc.o.depreciation.0052
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.depreciation.net_book_value
stem: Kwame's computer system cost $22000 and is depreciated by the straight line over 10 years with a residual value of $2800.
parts:
- id: a
  prompt: Calculate the net book value at the end of 2 years.
  marks: 3
  answer:
    kind: numeric
    value: '18160.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_depreciation_0052_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Net book value is what is left of the cost after depreciation so far.
  - rung: 2
    name: concept
    text:
      en: Net book value = cost − accumulated depreciation.
  - rung: 3
    name: first_step
    text:
      en: Find the accumulated depreciation for all the years first.
  - rung: 4
    name: worked_step
    text:
      en: Net book value = 22000 − accumulated depreciation for 2 years.
  - rung: 5
    name: full_step
    text:
      en: Net book value = $22000 − $3840 = $18160.
  misconception_ids:
  - mc.acc.o.nbv_one_year_only
  - mc.acc.o.nbv_accumulated_as_nbv
solution:
  steps:
  - n: 1
    latex: \text{Net book value} = \text{cost} - \text{accumulated depreciation}
    reason: What is left
    check_id: chk_build_acc_depreciation_0052_t
  - n: 2
    latex: \text{Accumulated depreciation} = 3840
    reason: All the charges so far
    check_id: chk_build_acc_depreciation_0052_s2
  - n: 3
    latex: \text{Net book value} = 22000 - 3840 = 18160
    reason: Subtract
    check_id: chk_build_acc_depreciation_0052_a
difficulty:
  prior: 0.1
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
context_tags:
- local_currency
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_depreciation_0052_a:
    args:
      dp: 2
      expression: 22000 - ((22000 - 2800) / 10 * 2)
    tool: math_evaluate
  chk_build_acc_depreciation_0052_s2:
    args:
      dp: 4
      expression: (22000 - 2800) / 10 * 2
    tool: math_evaluate
  chk_build_acc_depreciation_0052_t:
    args:
      cost: '22000'
      dp: 2
      life_years: 10
      method: straight_line
      part_year_policy: full_year
      residual: '2800'
      years: 2
    tool: acc_depreciation
