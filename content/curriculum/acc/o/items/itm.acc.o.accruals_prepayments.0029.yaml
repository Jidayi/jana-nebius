stem: Lindiwe's business received $3450 of rent received during the year; $850 was still owing to the business at the year end.
parts:
- id: a
  prompt: Calculate the rent received for the year in the income statement.
  marks: 2
  answer:
    kind: numeric
    value: '4300.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_accruals_prepayments_0029_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Income belongs to the year in which it was earned, not the year the money arrived.
  - rung: 2
    name: concept
    text:
      en: Income for the year = received + owing to the business at the end − received in advance for next year.
  - rung: 3
    name: first_step
    text:
      en: Income owing at the end was earned this year; income received in advance was not.
  - rung: 4
    name: worked_step
    text:
      en: Income = 3450 + 850.
  - rung: 5
    name: full_step
    text:
      en: The income for the year is $4300.
  misconception_ids:
  - mc.acc.o.acc_income_adjustment_reversed
solution:
  steps:
  - n: 1
    latex: \text{Income} = \text{received} + \text{owing at the end} - \text{received in advance}
    reason: Earned this year
    check_id: chk_build_acc_accruals_prepayments_0029_t
  - n: 2
    latex: \text{Income} = 3450 + 850 = 4300
    reason: Substitute
    check_id: chk_build_acc_accruals_prepayments_0029_a
