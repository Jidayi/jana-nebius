    args:
      dp: 2
      expression: 78200 / (50 - 4) * 50
    tool: math_evaluate
  chk_build_acc_costing_0025_s2:
    args:
      dp: 4
      expression: 78200 / (50 - 4)
    tool: math_evaluate
  chk_build_acc_costing_0025_t:
