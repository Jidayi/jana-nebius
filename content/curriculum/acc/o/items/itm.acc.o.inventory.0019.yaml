id: itm.acc.o.inventory.0019
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.inventory.avco
stem: 'Tariq''s shop: opening inventory 30 tins of paint at $12 each; then bought 110 at $14 each; then sold 80; then bought 90 at $16 each; then sold 50.'
parts:
- id: a
  prompt: Using AVCO (a new average after each purchase), what is the closing inventory?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $1502.86
      correct: true
    - id: B
      text: $1400
      correct: false
      misconception_id: mc.acc.o.inv_simple_average
    - id: C
      text: $1837.14
      correct: false
      misconception_id: mc.acc.o.inv_cos_for_closing
    - id: D
      text: $1580
      correct: false
      misconception_id: mc.acc.o.inv_fifo_for_avco
  hints:
  - rung: 1
    name: orient
    text:
      en: The average must be weighted by how many units were bought at each price.
  - rung: 2
    name: concept
    text:
      en: After each purchase, average = total value held ÷ units held.
  - rung: 3
    name: first_step
    text:
      en: Goods sold leave at the current average, so the average does not change on a sale.
  - rung: 4
    name: worked_step
    text:
      en: Work through the movements in order, keeping units and value.
  - rung: 5
    name: full_step
    text:
      en: Closing inventory = $1502.86.
  misconception_ids:
  - mc.acc.o.inv_simple_average
  - mc.acc.o.inv_fifo_for_avco
  - mc.acc.o.inv_cos_for_closing
solution:
  steps:
  - n: 1
    latex: '\text{AVCO: unit cost} = \frac{\text{value held}}{\text{units held}}'
    reason: Weighted average
    check_id: chk_build_acc_inventory_0019_t
  - n: 2
    latex: '\text{Answer: \$1502.86}'
    reason: The key, checked
    check_id: chk_build_acc_inventory_0019_a
