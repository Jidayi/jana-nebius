kc_ids:
- kc.acc.o.partnerships.current_accounts
stem: 'Femi and Sipho are partners. Their agreement gives interest on capital at 5% a year, no salaries, interest on drawings at 5%, and shares the remaining profit Femi 1 : Sipho 2. Capitals: Femi $13000, Sipho $58000. Drawings for the year: Femi $8000, Sipho $8300. Profit for the year: $60500. Femi''s current account had a credit balance of $2100 at the start of the year. Femi''s share of the remaining profit is $19255.'
parts:
- id: a
  prompt: Calculate the balance on Femi's current account at the end of the year.
  marks: 4
  answer:
    kind: numeric
    value: '13605.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_partnerships_0040_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The current account collects everything the partner earns from the business and everything taken out.
  - rung: 2
    name: concept
    text:
      en: 'Credit: interest on capital, salary, share of profit. Debit: drawings and interest on drawings.'
  - rung: 3
    name: first_step
    text:
      en: Start from the opening credit balance.
  - rung: 4
    name: worked_step
    text:
      en: Closing balance = opening + interest on capital + salary + profit share − drawings − interest on drawings.
  - rung: 5
    name: full_step
    text:
      en: Femi's closing current account balance is $13605 (credit).
  misconception_ids:
  - mc.acc.o.pa_drawings_added_current
  - mc.acc.o.pa_opening_side_reversed
solution:
  steps:
  - n: 1
    latex: \text{Closing} = \text{opening} + \text{appropriations} - \text{drawings} - \text{interest on drawings}
    reason: What the partner earned less what was taken
    check_id: chk_build_acc_partnerships_0040_t
  - n: 2
    latex: \text{Interest on capital} = 650
    reason: Rate times capital
    check_id: chk_build_acc_partnerships_0040_s2
  - n: 3
    latex: \text{Interest on drawings} = 400
    reason: Rate times drawings
    check_id: chk_build_acc_partnerships_0040_s3
  - n: 4
    latex: \text{Closing} = 13605\ \text{credit}
    reason: Substitute
    check_id: chk_build_acc_partnerships_0040_a
