id: itm.acc.o.costing.0028
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.break_even
stem: Obi makes loaves of bread that sell for $15 each. Variable cost is $5 each; fixed costs are $7500.
parts:
- id: a
  prompt: Calculate the break-even point in units.
  marks: 2
  answer:
    kind: numeric
    value: '750.00'
    unit: units
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_costing_0028_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: At break-even, total contribution exactly covers fixed costs.
  - rung: 2
    name: concept
    text:
      en: Break-even units = fixed costs ÷ contribution per unit.
  - rung: 3
    name: first_step
    text:
      en: Contribution per unit = selling price − variable cost.
  - rung: 4
    name: worked_step
    text:
      en: Work out 7500 ÷ (15 − 5).
  - rung: 5
    name: full_step
    text:
      en: Break-even = 750 units.
  misconception_ids:
  - mc.acc.o.cost_be_divides_by_price
  - mc.acc.o.cost_be_divides_by_vc
solution:
  steps:
  - n: 1
    latex: \text{Break-even} = \frac{\text{fixed costs}}{\text{contribution per unit}}
    reason: Contribution covers fixed costs
    check_id: chk_build_acc_costing_0028_t
  - n: 2
    latex: \text{Contribution} = 15 - 5 = 10
    reason: Per unit
    check_id: chk_build_acc_costing_0028_s2
  - n: 3
    latex: \frac{7500}{10} = 750
    reason: Units
    check_id: chk_build_acc_costing_0028_a
difficulty:
  prior: 0.0
  band: core
