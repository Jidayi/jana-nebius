      dp: 2
      expression: (29300 - 450) - (29300 - 450) * 4/100
    tool: math_evaluate
  chk_build_acc_irrecoverable_debts_0044_s2:
    args:
      dp: 4
      expression: (29300 - 450) * 4/100
    tool: math_evaluate
  chk_build_acc_irrecoverable_debts_0044_t:
