id: itm.acc.o.irrecoverable_debts.0044
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.irrecoverable_debts.net_receivables
stem: Juma's trade receivables are $29300 before writing off a debt of $450. Last year's allowance was $800; this year it is to be 4% of trade receivables.
parts:
- id: a
  prompt: What net trade receivables are shown in the statement of financial position?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $28050
      correct: false
      misconception_id: mc.acc.o.id_old_allowance_used
    - id: B
      text: $28850
      correct: false
      misconception_id: mc.acc.o.id_allowance_not_deducted
    - id: C
      text: $27696
      correct: true
    - id: D
      text: $28146
      correct: false
      misconception_id: mc.acc.o.id_writeoff_not_deducted
  hints:
  - rung: 1
    name: orient
    text:
      en: What does the business expect to collect?
  - rung: 2
    name: concept
    text:
      en: Net = receivables − debts written off − this year's allowance.
  - rung: 3
    name: first_step
    text:
      en: Use the new allowance, not last year's.
  - rung: 4
    name: worked_step
    text:
      en: Work out (29300 − 450) less 4% of (29300 − 450).
  - rung: 5
    name: full_step
    text:
      en: Net trade receivables = $27696.
  misconception_ids:
  - mc.acc.o.id_allowance_not_deducted
  - mc.acc.o.id_writeoff_not_deducted
  - mc.acc.o.id_old_allowance_used
solution:
  steps:
  - n: 1
    latex: \text{Net receivables} = \text{receivables} - \text{written off} - \text{allowance}
    reason: Expected to be collected
    check_id: chk_build_acc_irrecoverable_debts_0044_t
  - n: 2
    latex: \text{Allowance} = 4\% \times (29300 - 450) = 1154
    reason: This year's
    check_id: chk_build_acc_irrecoverable_debts_0044_s2
  - n: 3
    latex: \text{Net} = (29300 - 450) - 1154 = 27696
    reason: Subtract
    check_id: chk_build_acc_irrecoverable_debts_0044_a
difficulty:
  prior: 0.2
  band: core
