checks:
  chk_build_acc_bank_reconciliation_0030_a:
    args:
      dp: 2
      expression: 3010 - 570 + 410 - 480 + 260
    tool: math_evaluate
  chk_build_acc_bank_reconciliation_0030_s2:
    args:
      dp: 4
      expression: 3010 - 570 + 410
    tool: math_evaluate
  chk_build_acc_bank_reconciliation_0030_t:
    args:
      bank_statement:
        balance: '2630'
        entries:
        - amount: '570'
          details: a standing order for insurance
          direction: out
        - amount: '410'
          details: interest paid by the bank
          direction: in
        overdrawn: false
      cash_book:
        balance: '3010'
        entries:
        - amount: '260'
          details: cheque number 100212
          direction: out
          ref: t0
        - amount: '480'
          details: cash paid in on the last day of the month
          direction: in
          ref: t1
        overdrawn: false
      dp: 2
      start_from: bank_statement
      task: reconcile
    tool: acc_double_entry
