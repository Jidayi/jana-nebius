id: itm.acc.o.bank_reconciliation.0030
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.bank_reconciliation.reconciliation_statement
- kc.acc.o.bank_reconciliation.update_cash_book
stem: 'Sipho''s cash book showed a debit balance of $3010 before these statement-only items were entered: a standing order for insurance $570; interest paid by the bank $410. Unpresented cheques total $260 and outstanding lodgements total $480.'
parts:
- id: a
  prompt: What balance should the bank statement show?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $3590
      correct: false
      misconception_id: mc.acc.o.br_unpresented_vs_lodgement
    - id: B
      text: $2630
      correct: true
    - id: C
      text: $2790
      correct: false
      misconception_id: mc.acc.o.br_rec_uses_unadjusted_cb
    - id: D
      text: $3070
      correct: false
      misconception_id: mc.acc.o.br_rec_signs_reversed
  hints:
  - rung: 1
    name: orient
    text:
      en: First bring the cash book up to date, then explain the difference that is left.
  - rung: 2
    name: concept
    text:
      en: 'Updated cash book: add statement-only receipts and subtract statement-only payments.'
  - rung: 3
    name: first_step
    text:
      en: The statement is higher by the unpresented cheques and lower by the outstanding lodgements.
  - rung: 4
    name: worked_step
    text:
      en: Updated balance, minus lodgements, plus unpresented cheques.
  - rung: 5
    name: full_step
    text:
      en: The bank statement should show $2630.
  misconception_ids:
  - mc.acc.o.br_rec_signs_reversed
  - mc.acc.o.br_rec_uses_unadjusted_cb
  - mc.acc.o.br_unpresented_vs_lodgement
solution:
  steps:
  - n: 1
    latex: \text{Statement} = \text{updated cash book} - \text{lodgements} + \text{unpresented}
    reason: Reconcile after updating
    check_id: chk_build_acc_bank_reconciliation_0030_t
  - n: 2
    latex: \text{Updated cash book} = 2850
    reason: Statement-only items entered
    check_id: chk_build_acc_bank_reconciliation_0030_s2
  - n: 3
    latex: \text{Statement} = 2850 - 480 + 260 = 2630
    reason: Timing differences
    check_id: chk_build_acc_bank_reconciliation_0030_a
difficulty:
  prior: 0.5
  band: stretch
estimated_seconds: 45
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
