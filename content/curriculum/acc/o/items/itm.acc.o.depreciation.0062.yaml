id: itm.acc.o.depreciation.0062
version: 0.1.1
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.depreciation.disposal
stem: 'Juma''s business bought a computer system for $15100 in 2019. It is depreciated by the straight-line method over 5 years with a residual value of $1700: a full year''s charge in the year of purchase and none in the year of sale. The computer system was sold in 2022 for $7300.'
parts:
- id: a
  prompt: Calculate the profit or loss on disposal. Give a loss as a negative number.
  marks: 4
  answer:
    kind: numeric
    value: '240.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_depreciation_0062_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Compare what the asset was sold for with its net book value on the day it was sold.
  - rung: 2
    name: concept
    text:
      en: Profit (or loss) on disposal = proceeds − net book value. Net book value = cost − accumulated depreciation.
  - rung: 3
    name: first_step
    text:
      en: 'Count the years charged: from 2019 up to, but not including, 2022.'
  - rung: 4
    name: worked_step
    text:
      en: Net book value = 15100 − yearly charge × (2022 − 2019); then subtract it from 7300.
  - rung: 5
    name: full_step
    text:
      en: Proceeds $7300 − net book value $7060 gives a profit of $240.
  misconception_ids:
  - mc.acc.o.disp_cost_not_nbv
  - mc.acc.o.disp_disposal_year_depreciated
solution:
  steps:
  - n: 1
    latex: \text{Profit or loss} = \text{proceeds} - \text{net book value}
    reason: Compare with what is left of the cost
    check_id: chk_build_acc_depreciation_0062_t
  - n: 2
    latex: \text{Years charged} = 2022 - 2019 = 3
    reason: None in the year of sale
    check_id: chk_build_acc_depreciation_0062_s2
  - n: 3
    latex: \text{Yearly charge} = \frac{15100 - 1700}{5} = 2680
    reason: Straight line
    check_id: chk_build_acc_depreciation_0062_s3
  - n: 4
    latex: \text{Net book value} = 15100 - 2680 \times 3 = 7060
    reason: Cost less accumulated depreciation
    check_id: chk_build_acc_depreciation_0062_s4
  - n: 5
    latex: \text{Profit} = 7300 - 7060, \text{ that is } 240
    reason: Proceeds less net book value
    check_id: chk_build_acc_depreciation_0062_s5
