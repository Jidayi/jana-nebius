id: itm.acc.o.depreciation.0059
version: 0.1.1
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.depreciation.disposal
stem: 'Chipo''s business bought a photocopier for $27500 in 2022. It is depreciated by the straight-line method over 5 years with a residual value of $1300: a full year''s charge in the year of purchase and none in the year of sale. The photocopier was sold in 2025 for $11600.'
parts:
- id: a
  prompt: Calculate the profit or loss on disposal. Give a loss as a negative number.
  marks: 4
  answer:
    kind: numeric
    value: '-180.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_depreciation_0059_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Compare what the asset was sold for with its net book value on the day it was sold.
  - rung: 2
    name: concept
    text:
      en: Profit (or loss) on disposal = proceeds − net book value. Net book value = cost − accumulated depreciation.
  - rung: 3
    name: first_step
    text:
      en: 'Count the years charged: from 2022 up to, but not including, 2025.'
  - rung: 4
    name: worked_step
    text:
      en: Net book value = 27500 − yearly charge × (2025 − 2022); then subtract it from 11600.
  - rung: 5
    name: full_step
    text:
      en: Proceeds $11600 − net book value $11780 gives a loss of $180.
  misconception_ids:
  - mc.acc.o.disp_cost_not_nbv
  - mc.acc.o.disp_disposal_year_depreciated
solution:
  steps:
  - n: 1
    latex: \text{Profit or loss} = \text{proceeds} - \text{net book value}
    reason: Compare with what is left of the cost
    check_id: chk_build_acc_depreciation_0059_t
  - n: 2
    latex: \text{Years charged} = 2025 - 2022 = 3
    reason: None in the year of sale
    check_id: chk_build_acc_depreciation_0059_s2
  - n: 3
    latex: \text{Yearly charge} = \frac{27500 - 1300}{5} = 5240
    reason: Straight line
    check_id: chk_build_acc_depreciation_0059_s3
  - n: 4
    latex: \text{Net book value} = 27500 - 5240 \times 3 = 11780
    reason: Cost less accumulated depreciation
    check_id: chk_build_acc_depreciation_0059_s4
  - n: 5
    latex: \text{Loss} = 11600 - 11780, \text{ that is } 180
    reason: Proceeds less net book value
    check_id: chk_build_acc_depreciation_0059_s5
