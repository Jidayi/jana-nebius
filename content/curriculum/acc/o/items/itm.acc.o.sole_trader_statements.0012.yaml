stem: 'Nia runs a market stall. Figures for the year: revenue $70200; sales returns $400; opening inventory $3300; purchases $44300; purchases returns $1300; carriage inwards $900; closing inventory $3800.'
parts:
- id: a
  prompt: Calculate the gross profit for the year.
  marks: 3
  answer:
    kind: numeric
    value: '26400.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0012_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Gross profit compares what the goods sold for with what they cost. What two figures do you need?
  - rung: 2
    name: concept
    text:
      en: Gross profit = net revenue − cost of sales, where net revenue is revenue less sales returns.
  - rung: 3
    name: first_step
    text:
      en: 'Find the cost of sales first: opening inventory + net purchases + carriage inwards − closing inventory.'
  - rung: 4
    name: worked_step
    text:
      en: Gross profit = (70200 − 400) − (3300 + 44300 − 1300 + 900 − 3800).
  - rung: 5
    name: full_step
    text:
      en: Net revenue $69800 less cost of sales $43400 gives $26400.
  misconception_ids:
  - mc.acc.o.gp_sales_returns_ignored
  - mc.acc.o.gp_purchases_for_cos
solution:
  steps:
  - n: 1
    latex: \text{Gross profit} = (\text{revenue} - \text{sales returns}) - \text{cost of sales}
    reason: Net revenue less the cost of the goods sold
    check_id: chk_build_acc_sole_trader_statements_0012_t
  - n: 2
    latex: \text{Cost of sales} = 3300 + 44300 - 1300 + 900 - 3800 = 43400
    reason: Goods available less closing inventory
    check_id: chk_build_acc_sole_trader_statements_0012_s2
  - n: 3
    latex: \text{Net revenue} = 70200 - 400 = 69800
    reason: Sales returns reduce revenue
    check_id: chk_build_acc_sole_trader_statements_0012_s3
  - n: 4
    latex: \text{Gross profit} = 69800 - 43400 = 26400
    reason: Subtract
    check_id: chk_build_acc_sole_trader_statements_0012_a
