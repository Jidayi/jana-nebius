id: itm.acc.o.costing.0033
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.break_even
stem: Kwame makes solar lamps that sell for $12 each. Variable cost is $2 each; fixed costs are $8500.
parts:
- id: a
  prompt: What is the break-even point in units?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 708.33 units
      correct: false
      misconception_id: mc.acc.o.cost_be_divides_by_price
    - id: B
      text: 850 units
      correct: true
    - id: C
      text: 10200 units
      correct: false
      misconception_id: mc.acc.o.cost_be_units_revenue_confused
    - id: D
      text: 4250.00 units
      correct: false
      misconception_id: mc.acc.o.cost_be_divides_by_vc
  hints:
  - rung: 1
    name: orient
    text:
      en: What must each unit's contribution cover?
  - rung: 2
    name: concept
    text:
      en: Break-even units = fixed costs ÷ (selling price − variable cost).
  - rung: 3
    name: first_step
    text:
      en: Dividing by the price or the variable cost alone ignores the other.
  - rung: 4
    name: worked_step
    text:
      en: Work out 8500 ÷ (12 − 2).
  - rung: 5
    name: full_step
    text:
      en: Break-even = 850 units.
  misconception_ids:
  - mc.acc.o.cost_be_divides_by_price
  - mc.acc.o.cost_be_divides_by_vc
  - mc.acc.o.cost_be_units_revenue_confused
solution:
  steps:
  - n: 1
    latex: \text{Break-even} = \frac{\text{fixed costs}}{\text{price} - \text{variable cost}}
    reason: Contribution covers fixed costs
    check_id: chk_build_acc_costing_0033_t
  - n: 2
    latex: \frac{8500}{12 - 2} = 850
    reason: Substitute
    check_id: chk_build_acc_costing_0033_a
