id: itm.acc.o.incomplete_records.0035
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.incomplete_records.margin_markup_use
stem: Femi runs a stationery shop. The gross margin is 20% of revenue, and revenue for the year was $62500.
parts:
- id: a
  prompt: Calculate the cost of sales.
  marks: 2
  answer:
    kind: numeric
    value: '50000.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_incomplete_records_0035_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A margin is a percentage of revenue.
  - rung: 2
    name: concept
    text:
      en: Cost of sales = revenue − margin × revenue.
  - rung: 3
    name: first_step
    text:
      en: Gross profit = 20% of $62500.
  - rung: 4
    name: worked_step
    text:
      en: Cost of sales = 62500 − 20% × 62500.
  - rung: 5
    name: full_step
    text:
      en: Cost of sales = $50000.
  misconception_ids:
  - mc.acc.o.rat_margin_markup_confused
  - mc.acc.o.ir_percent_of_wrong_base
solution:
  steps:
  - n: 1
    latex: \text{Cost of sales} = \text{revenue} \times (1 - \text{margin})
    reason: Margin on revenue
    check_id: chk_build_acc_incomplete_records_0035_t
  - n: 2
    latex: \text{Gross profit} = 20\% \times 62500 = 12500
    reason: Profit on revenue
    check_id: chk_build_acc_incomplete_records_0035_s2
  - n: 3
    latex: \text{Cost of sales} = 62500 - 12500 = 50000
    reason: Subtract
    check_id: chk_build_acc_incomplete_records_0035_a
difficulty:
  prior: 0.5
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 2
  calculator: true
context_tags:
- local_currency
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_incomplete_records_0035_a:
    args:
      dp: 2
      expression: 62500 * (1 - 20/100)
    tool: math_evaluate
  chk_build_acc_incomplete_records_0035_s2:
    args:
      dp: 4
      expression: 62500 * 20/100
    tool: math_evaluate
  chk_build_acc_incomplete_records_0035_t:
    args:
      cost_of_sales: '50000'
      dp: 2
      ratios:
      - mark_up
      - gross_margin
      revenue: '62500'
    tool: acc_ratios
authoring:
  drafted_by: rev_author_agent
  history:
  - drafted
  - verified
  - in_eval_bank
  - published
