stem: Aisha makes printed T-shirts that sell for $10 each. Variable cost is $3 each and fixed costs are $5250. Aisha wants a profit of $700.
parts:
- id: a
  prompt: Calculate the number of units that must be sold.
  marks: 2
  answer:
    kind: numeric
    value: '850.00'
    unit: units
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_costing_0048_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Contribution must now cover the fixed costs and the profit wanted.
  - rung: 2
    name: concept
    text:
      en: Units = (fixed costs + target profit) ÷ contribution per unit.
  - rung: 3
    name: first_step
    text:
      en: Contribution per unit = selling price − variable cost.
  - rung: 4
    name: worked_step
    text:
      en: Work out (5250 + 700) ÷ (10 − 3).
  - rung: 5
    name: full_step
    text:
      en: 850.00 units must be sold.
  misconception_ids:
  - mc.acc.o.cost_target_fc_omitted
  - mc.acc.o.cost_target_subtracted
solution:
  steps:
  - n: 1
    latex: \text{Units} = \frac{\text{fixed costs} + \text{target profit}}{\text{contribution per unit}}
    reason: Cover costs and profit
    check_id: chk_build_acc_costing_0048_t
  - n: 2
    latex: \frac{5250 + 700}{10 - 3} = 850
    reason: Substitute
    check_id: chk_build_acc_costing_0048_a
