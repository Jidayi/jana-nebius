id: itm.acc.o.depreciation.0060
version: 0.1.1
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.depreciation.disposal
stem: 'Musa''s business bought a delivery van for $17700 in 2020. It is depreciated by the straight-line method over 5 years with a residual value of $1000: a full year''s charge in the year of purchase and none in the year of sale. The delivery van was sold in 2023 for $10700.'
parts:
- id: a
  prompt: Calculate the profit or loss on disposal. Give a loss as a negative number.
  marks: 4
  answer:
    kind: numeric
    value: '3020.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_depreciation_0060_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Compare what the asset was sold for with its net book value on the day it was sold.
  - rung: 2
    name: concept
    text:
      en: Profit (or loss) on disposal = proceeds − net book value. Net book value = cost − accumulated depreciation.
  - rung: 3
    name: first_step
    text:
      en: 'Count the years charged: from 2020 up to, but not including, 2023.'
  - rung: 4
    name: worked_step
    text:
      en: Net book value = 17700 − yearly charge × (2023 − 2020); then subtract it from 10700.
  - rung: 5
    name: full_step
    text:
      en: Proceeds $10700 − net book value $7680 gives a profit of $3020.
  misconception_ids:
  - mc.acc.o.disp_cost_not_nbv
  - mc.acc.o.disp_disposal_year_depreciated
solution:
  steps:
  - n: 1
    latex: \text{Profit or loss} = \text{proceeds} - \text{net book value}
    reason: Compare with what is left of the cost
    check_id: chk_build_acc_depreciation_0060_t
  - n: 2
    latex: \text{Years charged} = 2023 - 2020 = 3
    reason: None in the year of sale
    check_id: chk_build_acc_depreciation_0060_s2
  - n: 3
    latex: \text{Yearly charge} = \frac{17700 - 1000}{5} = 3340
    reason: Straight line
    check_id: chk_build_acc_depreciation_0060_s3
  - n: 4
    latex: \text{Net book value} = 17700 - 3340 \times 3 = 7680
    reason: Cost less accumulated depreciation
    check_id: chk_build_acc_depreciation_0060_s4
  - n: 5
    latex: \text{Profit} = 10700 - 7680, \text{ that is } 3020
    reason: Proceeds less net book value
    check_id: chk_build_acc_depreciation_0060_s5
