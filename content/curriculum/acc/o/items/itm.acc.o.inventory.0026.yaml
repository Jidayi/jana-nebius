id: itm.acc.o.inventory.0026
version: 0.1.1
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.inventory.lower_cost_nrv
stem: At the year end Aisha holds 140 packs of exercise books that cost $17 each. They can be sold for $15 each, but each needs $2 spent on it before it can be sold.
parts:
- id: a
  prompt: Calculate the value of this inventory.
  marks: 3
  answer:
    kind: numeric
    value: '1820.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_inventory_0026_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Inventory is valued at the lower of two figures. Which two?
  - rung: 2
    name: concept
    text:
      en: Net realisable value = selling price − costs needed to sell. Use the lower of cost and NRV.
  - rung: 3
    name: first_step
    text:
      en: NRV per item = 15 − 2.
  - rung: 4
    name: worked_step
    text:
      en: Compare 17 with 15 − 2; multiply the lower by 140.
  - rung: 5
    name: full_step
    text:
      en: Each item is valued at $13, so the inventory is worth $1820.
  misconception_ids:
  - mc.acc.o.inv_selling_price_used
  - mc.acc.o.inv_nrv_ignored
solution:
  steps:
  - n: 1
    latex: \text{Value} = \text{quantity} \times \text{lower of cost and NRV}
    reason: Prudence
    check_id: chk_build_acc_inventory_0026_t
  - n: 2
    latex: \text{NRV} = 15 - 2 = 13
    reason: Selling price less costs to sell
    check_id: chk_build_acc_inventory_0026_s2
  - n: 3
    latex: \text{Value} = 140 \times 13 = 1820
    reason: The lower figure
    check_id: chk_build_acc_inventory_0026_a
