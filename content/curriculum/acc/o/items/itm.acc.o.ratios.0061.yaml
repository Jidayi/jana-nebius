id: itm.acc.o.ratios.0061
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.ratios.roce
stem: Yaw's capital was $83000 at the start of the year and $90700 at the end. Profit for the year was $21200 and the business has a long-term loan of $24000.
parts:
- id: a
  prompt: Calculate the return on capital employed as a percentage, using the pack's definition (profit for the year ÷ closing capital plus non-current liabilities). Give your answer to 2 decimal places.
  marks: 3
  answer:
    kind: numeric
    value: '18.48'
    unit: '%'
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_ratios_0061_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Return on capital employed shows the profit made for each dollar invested in the business.
  - rung: 2
    name: concept
    text:
      en: ROCE = profit for the year ÷ capital employed, as a percentage. Capital employed = capital at the year end + non-current liabilities.
  - rung: 3
    name: first_step
    text:
      en: Use the closing capital, not the opening one.
  - rung: 4
    name: worked_step
    text:
      en: Divide 21200 by (90700 + 24000) and write it as a percentage.
  - rung: 5
    name: full_step
    text:
      en: ROCE = 18.48%.
  misconception_ids:
  - mc.acc.o.rat_capital_employed_wrong
  - mc.acc.o.rat_capital_basis_wrong
solution:
  steps:
  - n: 1
    latex: \text{ROCE} = \frac{\text{profit for the year}}{\text{capital} + \text{non-current liabilities}}
    reason: The pack's definition
    check_id: chk_build_acc_ratios_0061_t
  - n: 2
    latex: \text{Capital employed} = 90700 + 24000 = 114700
    reason: Closing capital and loans
    check_id: chk_build_acc_ratios_0061_s2
  - n: 3
    latex: \frac{21200}{114700} \rightarrow 18.48\%
    reason: As a percentage
    check_id: chk_build_acc_ratios_0061_a
