    name: concept
    text:
      en: Units = (fixed costs + target profit) ÷ contribution per unit.
  - rung: 3
    name: first_step
    text:
      en: The profit is added to the fixed costs, not taken away.
  - rung: 4
    name: worked_step
    text:
      en: Work out (39950 + 33150) ÷ (20 − 3).
  - rung: 5
    name: full_step
    text:
      en: 4300.00 units.
