stem: A trader's bookkeeper has made several kinds of error.
parts:
- id: a
  prompt: Select every type of error that leaves the trial balance totals in agreement.
  marks: 2
  answer:
    kind: multi_select
    options:
    - id: A
      text: Error of omission
      correct: true
    - id: B
      text: Error of principle
      correct: true
    - id: C
      text: Complete reversal of entries
      correct: true
    - id: D
      text: A debit entered with no matching credit
      correct: false
    - id: E
      text: Two different amounts posted for one entry
      correct: false
    - id: F
      text: A balance left out of the trial balance
      correct: false
    scoring: exact_set
  hints:
  - rung: 1
    name: orient
    text:
      en: The trial balance only tests that total debits equal total credits.
  - rung: 2
    name: concept
    text:
      en: An error that changes both sides equally, or neither side, cannot be seen.
  - rung: 3
    name: first_step
    text:
      en: One-sided entries and unequal amounts upset the totals.
  - rung: 4
    name: worked_step
    text:
      en: Pick the errors where the debit and credit still match.
  - rung: 5
    name: full_step
    text:
      en: Omission, principle and complete reversal leave the totals in agreement.
  misconception_ids:
