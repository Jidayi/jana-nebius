id: itm.acc.o.sole_trader_statements.0002
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.cost_of_sales
stem: 'Kojo runs a phone repair business. Figures for the year: opening inventory $2100; purchases $37000; purchases returns $1900; carriage inwards $1500; carriage outwards $1450; closing inventory $2000.'
parts:
- id: a
  prompt: Calculate the cost of sales for the year.
  marks: 3
  answer:
    kind: numeric
    value: '36700.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0002_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Cost of sales is the cost of the goods actually sold this year. Which figures change it, and which belong with the expenses?
  - rung: 2
    name: concept
    text:
      en: Goods available = opening inventory + purchases − purchases returns + carriage inwards. Take away the closing inventory to get cost of sales. Carriage outwards is a selling expense.
  - rung: 3
    name: first_step
    text:
      en: Start with the opening inventory of $2100 and add the purchases of $37000.
  - rung: 4
    name: worked_step
    text:
      en: Cost of sales = (2100 + 37000 − 1900 + 1500) − 2000.
  - rung: 5
    name: full_step
    text:
      en: Cost of sales = (2100 + 37000 − 1900 + 1500) − 2000 = $36700.
  misconception_ids:
  - mc.acc.o.cos_closing_added
  - mc.acc.o.cos_carriage_outwards_included
solution:
  steps:
  - n: 1
    latex: \text{Cost of sales} = \text{opening inventory} + \text{net purchases} + \text{carriage inwards} - \text{closing inventory}
    reason: The goods available less the goods left
    check_id: chk_build_acc_sole_trader_statements_0002_t
  - n: 2
    latex: \text{Goods available} = 2100 + 37000 - 1900 + 1500 = 38700
    reason: Opening inventory and net purchases
    check_id: chk_build_acc_sole_trader_statements_0002_s2
  - n: 3
    latex: \text{Cost of sales} = 38700 - 2000 = 36700
    reason: Take away the closing inventory
    check_id: chk_build_acc_sole_trader_statements_0002_a
difficulty:
  prior: -0.4
  band: foundation
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
