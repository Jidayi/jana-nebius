id: itm.acc.o.depreciation.0032
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.depreciation.straight_line
stem: Juma's business buys a set of shop shelves for $8100. It is expected to last 8 years and then be sold for $1200.
parts:
- id: a
  prompt: What is the yearly depreciation charge by the straight-line method?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $1012.50
      correct: false
      misconception_id: mc.acc.o.sl_residual_ignored
    - id: B
      text: $6900
      correct: false
      misconception_id: mc.acc.o.sl_total_not_annual
    - id: C
      text: $1162.50
      correct: false
      misconception_id: mc.acc.o.sl_residual_added
    - id: D
      text: $862.50
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: What amount is used up over the asset's life?
  - rung: 2
    name: concept
    text:
      en: Yearly charge = (cost − residual value) ÷ useful life.
  - rung: 3
    name: first_step
    text:
      en: The residual value is what the business expects to get back, so it is not used up.
  - rung: 4
    name: worked_step
    text:
      en: Work out (8100 − 1200) ÷ 8.
  - rung: 5
    name: full_step
    text:
      en: The yearly charge is $862.50.
  misconception_ids:
  - mc.acc.o.sl_residual_ignored
  - mc.acc.o.sl_residual_added
  - mc.acc.o.sl_total_not_annual
solution:
  steps:
  - n: 1
    latex: \text{Yearly charge} = \frac{\text{cost} - \text{residual value}}{\text{useful life}}
    reason: Spread what is used up
    check_id: chk_build_acc_depreciation_0032_t
  - n: 2
    latex: \text{Yearly charge} = \frac{8100 - 1200}{8} = 862.50
    reason: Substitute
    check_id: chk_build_acc_depreciation_0032_a
