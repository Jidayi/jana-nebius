    - id: C
      text: 4100 units
      correct: false
      misconception_id: mc.acc.o.cost_mos_output_as_mos
    - id: D
      text: 1450 units
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: How many units are sold above the break-even point?
  - rung: 2
    name: concept
    text:
      en: Margin of safety = expected output − break-even output.
  - rung: 3
    name: first_step
    text:
      en: 'Find break-even first: fixed costs ÷ contribution per unit.'
  - rung: 4
    name: worked_step
    text:
      en: Work out 4100 − 13250 ÷ (30 − 25).
  - rung: 5
    name: full_step
    text:
      en: Margin of safety = 1450 units.
