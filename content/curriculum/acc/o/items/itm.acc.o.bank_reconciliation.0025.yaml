id: itm.acc.o.bank_reconciliation.0025
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.bank_reconciliation.reconciliation_statement
stem: 'Juma''s bank statement shows a balance of $4730 in the business''s favour. Cheques not yet presented: $930. Lodgements not yet credited by the bank: $1480. The cash book is already up to date.'
parts:
- id: a
  prompt: Calculate the balance in the updated cash book.
  marks: 3
  answer:
    kind: numeric
    value: '5280.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_bank_reconciliation_0025_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Start from the bank statement balance. What has the bank not yet recorded?
  - rung: 2
    name: concept
    text:
      en: Add the outstanding lodgements and subtract the unpresented cheques.
  - rung: 3
    name: first_step
    text:
      en: Lodgements will increase the bank balance once credited; unpresented cheques will reduce it.
  - rung: 4
    name: worked_step
    text:
      en: Cash book balance = 4730 + 1480 − 930.
  - rung: 5
    name: full_step
    text:
      en: Cash book balance = $5280.
  misconception_ids:
  - mc.acc.o.br_rec_signs_reversed
  - mc.acc.o.br_unpresented_vs_lodgement
solution:
  steps:
  - n: 1
    latex: \text{Statement balance} + \text{lodgements} - \text{unpresented cheques} = \text{cash book balance}
    reason: The reconciliation
    check_id: chk_build_acc_bank_reconciliation_0025_t
  - n: 2
    latex: 4730 + 1480 - 930 = 5280
    reason: Substitute
    check_id: chk_build_acc_bank_reconciliation_0025_a
