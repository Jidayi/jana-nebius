id: itm.acc.o.depreciation.0061
version: 0.1.1
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.depreciation.disposal
stem: 'Tendai''s business bought a photocopier for $20800 in 2019. It is depreciated by the straight-line method over 10 years with a residual value of $1400: a full year''s charge in the year of purchase and none in the year of sale. The photocopier was sold in 2023 for $11550.'
parts:
- id: a
  prompt: Calculate the profit or loss on disposal. Give a loss as a negative number.
  marks: 4
  answer:
    kind: numeric
    value: '-1490.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_depreciation_0061_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Compare what the asset was sold for with its net book value on the day it was sold.
  - rung: 2
    name: concept
    text:
      en: Profit (or loss) on disposal = proceeds − net book value. Net book value = cost − accumulated depreciation.
  - rung: 3
    name: first_step
    text:
      en: 'Count the years charged: from 2019 up to, but not including, 2023.'
  - rung: 4
    name: worked_step
    text:
      en: Net book value = 20800 − yearly charge × (2023 − 2019); then subtract it from 11550.
  - rung: 5
    name: full_step
    text:
      en: Proceeds $11550 − net book value $13040 gives a loss of $1490.
  misconception_ids:
  - mc.acc.o.disp_cost_not_nbv
  - mc.acc.o.disp_disposal_year_depreciated
solution:
  steps:
  - n: 1
    latex: \text{Profit or loss} = \text{proceeds} - \text{net book value}
    reason: Compare with what is left of the cost
    check_id: chk_build_acc_depreciation_0061_t
  - n: 2
    latex: \text{Years charged} = 2023 - 2019 = 4
    reason: None in the year of sale
    check_id: chk_build_acc_depreciation_0061_s2
  - n: 3
    latex: \text{Yearly charge} = \frac{20800 - 1400}{10} = 1940
    reason: Straight line
    check_id: chk_build_acc_depreciation_0061_s3
  - n: 4
    latex: \text{Net book value} = 20800 - 1940 \times 4 = 13040
    reason: Cost less accumulated depreciation
    check_id: chk_build_acc_depreciation_0061_s4
  - n: 5
    latex: \text{Loss} = 11550 - 13040, \text{ that is } 1490
    reason: Proceeds less net book value
    check_id: chk_build_acc_depreciation_0061_s5
