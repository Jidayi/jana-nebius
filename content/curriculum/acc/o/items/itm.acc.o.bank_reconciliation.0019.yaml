id: itm.acc.o.bank_reconciliation.0019
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.bank_reconciliation.update_cash_book
stem: 'Musa''s cash book shows a debit bank balance of $5610. The bank statement shows these items that are not in the cash book: loan interest charged by the bank $370; a dividend paid in directly $570; a direct debit for electricity $210. A cheque for $350 has not yet been presented.'
parts:
- id: a
  prompt: What is the updated cash book balance?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $5620
      correct: false
      misconception_id: mc.acc.o.br_update_signs_reversed
    - id: B
      text: $5030
      correct: false
      misconception_id: mc.acc.o.br_credit_transfer_omitted
    - id: C
      text: $5250
      correct: false
      misconception_id: mc.acc.o.br_includes_timing
    - id: D
      text: $5600
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Only the items on the statement that are missing from the cash book change it.
  - rung: 2
    name: concept
    text:
      en: Add money the bank received for you; subtract money it paid out or took.
  - rung: 3
    name: first_step
    text:
      en: The unpresented cheque is already in the cash book, so it does not change it again.
  - rung: 4
    name: worked_step
    text:
      en: Start from the cash book balance and apply each statement-only item.
  - rung: 5
    name: full_step
    text:
      en: The updated balance is $5600.
  misconception_ids:
  - mc.acc.o.br_update_signs_reversed
  - mc.acc.o.br_includes_timing
  - mc.acc.o.br_credit_transfer_omitted
solution:
  steps:
  - n: 1
    latex: \text{Updated balance} = \text{balance} + \text{receipts} - \text{payments}
    reason: Statement-only items
    check_id: chk_build_acc_bank_reconciliation_0019_t
  - n: 2
    latex: '\text{Answer: \$5600}'
    reason: The key, checked
    check_id: chk_build_acc_bank_reconciliation_0019_a
difficulty:
  prior: 0.1
  band: core
estimated_seconds: 45
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
context_tags:
- local_names
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_bank_reconciliation_0019_a:
    args:
      dp: 2
      expression: 5610 - 370 + 570 - 210
    tool: math_evaluate
  chk_build_acc_bank_reconciliation_0019_t:
    args:
      bank_statement:
        balance: '5200'
        entries:
        - amount: '370'
          details: loan interest charged by the bank
          direction: out
        - amount: '570'
          details: a dividend paid in directly
          direction: in
        - amount: '210'
          details: a direct debit for electricity
          direction: out
        overdrawn: false
      cash_book:
        balance: '5610'
        entries:
        - amount: '350'
          details: cheque number 100738
          direction: out
          ref: t0
        - amount: '750'
          details: cash paid in on the last day of the month
          direction: in
          ref: t1
        overdrawn: false
      dp: 2
      start_from: bank_statement
      task: reconcile
    tool: acc_double_entry
