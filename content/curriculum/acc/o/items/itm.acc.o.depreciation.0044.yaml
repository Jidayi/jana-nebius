subject: acc
level: o
kc_ids:
- kc.acc.o.depreciation.reducing_balance
stem: Amina bought a motor car for $5500. It is depreciated at 10% a year by the reducing-balance method.
parts:
- id: a
  prompt: What is the depreciation charge for the third year?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $4009.50
      correct: false
      misconception_id: mc.acc.o.rb_nbv_as_charge
    - id: B
      text: $495
      correct: false
      misconception_id: mc.acc.o.rb_wrong_year
    - id: C
      text: $445.50
      correct: true
    - id: D
      text: $550
      correct: false
      misconception_id: mc.acc.o.rb_on_cost
  hints:
  - rung: 1
    name: orient
    text:
      en: What is the percentage taken of each year?
  - rung: 2
    name: concept
    text:
      en: Each year's charge is the rate times the net book value at the start of that year, not the cost.
  - rung: 3
    name: first_step
    text:
      en: 'Count the years carefully: the charge for a year uses the value left after all earlier years.'
  - rung: 4
    name: worked_step
    text:
      en: Find the net book value at the start of the third year, then take 10% of it.
  - rung: 5
    name: full_step
    text:
      en: 10% of $4455 = $445.50.
  misconception_ids:
  - mc.acc.o.rb_on_cost
  - mc.acc.o.rb_nbv_as_charge
  - mc.acc.o.rb_wrong_year
solution:
  steps:
  - n: 1
    latex: \text{Charge} = \text{rate} \times \text{opening net book value}
    reason: Reducing balance
    check_id: chk_build_acc_depreciation_0044_t
  - n: 2
    latex: \text{Opening net book value} = 4455
    reason: Cost less the earlier charges
    check_id: chk_build_acc_depreciation_0044_s2
  - n: 3
    latex: \text{Charge} = 10\% \times 4455 = 445.50
    reason: Substitute
    check_id: chk_build_acc_depreciation_0044_a
