stem: Ama's trade receivables are $21000 before writing off a debt of $400. The allowance for irrecoverable debts is 10% of trade receivables.
parts:
- id: a
  prompt: Calculate the net trade receivables shown in the statement of financial position.
  marks: 3
  answer:
    kind: numeric
    value: '18540.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_irrecoverable_debts_0034_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The statement of financial position shows what the business expects to collect.
  - rung: 2
    name: concept
    text:
      en: Net trade receivables = trade receivables − debts written off − allowance.
  - rung: 3
    name: first_step
    text:
      en: Work out the allowance on the receivables that remain after write-off.
  - rung: 4
    name: worked_step
    text:
      en: Net = (21000 − 400) − 10% of (21000 − 400).
  - rung: 5
    name: full_step
    text:
      en: Net trade receivables = $18540.
  misconception_ids:
  - mc.acc.o.id_allowance_not_deducted
  - mc.acc.o.id_writeoff_not_deducted
solution:
  steps:
  - n: 1
    latex: \text{Net receivables} = \text{receivables} - \text{written off} - \text{allowance}
    reason: What is expected to be collected
    check_id: chk_build_acc_irrecoverable_debts_0034_t
  - n: 2
    latex: \text{Allowance} = 10\% \times (21000 - 400) = 2060
    reason: On the remaining debts
    check_id: chk_build_acc_irrecoverable_debts_0034_s2
  - n: 3
    latex: \text{Net} = (21000 - 400) - 2060 = 18540
    reason: Subtract
    check_id: chk_build_acc_irrecoverable_debts_0034_a
