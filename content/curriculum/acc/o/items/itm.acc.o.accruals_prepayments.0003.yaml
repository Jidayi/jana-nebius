subject: acc
level: o
kc_ids:
- kc.acc.o.accruals_prepayments.accrued_expense
stem: Wanjiru runs a hardware shop. During the year $6950 was paid for telephone. At the year end $800 for telephone was still owing; at the start of the year $100 had been owing, and was paid during the year.
parts:
- id: a
  prompt: Calculate the telephone expense for the year in the income statement.
  marks: 2
  answer:
    kind: numeric
    value: '7650.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_accruals_prepayments_0003_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The income statement shows the cost of what was used this year, whether paid or not.
  - rung: 2
    name: concept
    text:
      en: Expense for the year = amount paid + amount owing at the end − amount owing at the start.
  - rung: 3
    name: first_step
    text:
      en: An amount still owing at the end belongs to this year, so it is added.
  - rung: 4
    name: worked_step
    text:
      en: Expense = 6950 + 800 − 100.
  - rung: 5
    name: full_step
    text:
      en: The telephone expense is $7650.
  misconception_ids:
  - mc.acc.o.acc_accrual_subtracted
  - mc.acc.o.acc_cash_basis
solution:
  steps:
  - n: 1
    latex: \text{Expense} = \text{paid} + \text{closing accrual} - \text{opening accrual}
    reason: Match the cost to the year it was used
    check_id: chk_build_acc_accruals_prepayments_0003_t
  - n: 2
    latex: \text{Expense} = 6950 + 800 - 100 = 7650
    reason: Substitute
    check_id: chk_build_acc_accruals_prepayments_0003_a
