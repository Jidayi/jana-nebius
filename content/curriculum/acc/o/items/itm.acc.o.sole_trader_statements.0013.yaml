stem: 'Kojo runs a tailoring business. Figures for the year: revenue $58800; sales returns $1400; opening inventory $5800; purchases $44400; purchases returns $1500; carriage inwards $650; closing inventory $8300.'
parts:
- id: a
  prompt: Calculate the gross profit for the year.
  marks: 3
  answer:
    kind: numeric
    value: '16350.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0013_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Gross profit compares what the goods sold for with what they cost. What two figures do you need?
  - rung: 2
    name: concept
    text:
      en: Gross profit = net revenue − cost of sales, where net revenue is revenue less sales returns.
  - rung: 3
    name: first_step
    text:
      en: 'Find the cost of sales first: opening inventory + net purchases + carriage inwards − closing inventory.'
  - rung: 4
    name: worked_step
    text:
      en: Gross profit = (58800 − 1400) − (5800 + 44400 − 1500 + 650 − 8300).
  - rung: 5
    name: full_step
    text:
      en: Net revenue $57400 less cost of sales $41050 gives $16350.
  misconception_ids:
  - mc.acc.o.gp_sales_returns_ignored
  - mc.acc.o.gp_purchases_for_cos
solution:
  steps:
  - n: 1
    latex: \text{Gross profit} = (\text{revenue} - \text{sales returns}) - \text{cost of sales}
    reason: Net revenue less the cost of the goods sold
    check_id: chk_build_acc_sole_trader_statements_0013_t
  - n: 2
    latex: \text{Cost of sales} = 5800 + 44400 - 1500 + 650 - 8300 = 41050
    reason: Goods available less closing inventory
    check_id: chk_build_acc_sole_trader_statements_0013_s2
  - n: 3
    latex: \text{Net revenue} = 58800 - 1400 = 57400
    reason: Sales returns reduce revenue
    check_id: chk_build_acc_sole_trader_statements_0013_s3
  - n: 4
    latex: \text{Gross profit} = 57400 - 41050 = 16350
    reason: Subtract
    check_id: chk_build_acc_sole_trader_statements_0013_a
