stem: Adaeze runs a stationery shop. Capital at the start of the year was $32000. During the year the business made a loss of $3900 and Adaeze took drawings of $4500.
parts:
- id: a
  prompt: Calculate the capital at the end of the year.
  marks: 2
  answer:
    kind: numeric
    value: '23600.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0057_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Capital is the owner's stake. What made it grow and what made it shrink this year?
  - rung: 2
    name: concept
    text:
      en: Closing capital = opening capital + capital introduced + profit (or − loss) − drawings.
  - rung: 3
    name: first_step
    text:
      en: A profit belongs to the owner and adds to capital; drawings take it away. A loss reduces capital.
  - rung: 4
    name: worked_step
    text:
      en: Closing capital = 32000 − 3900 − 4500.
  - rung: 5
    name: full_step
    text:
      en: Closing capital = $23600.
  misconception_ids:
  - mc.acc.o.cc_drawings_added
  - mc.acc.o.cc_loss_added
solution:
  steps:
  - n: 1
    latex: \text{Closing capital} = \text{opening capital} + \text{capital introduced} + \text{profit} - \text{drawings}
    reason: The owner's stake at the year end
    check_id: chk_build_acc_sole_trader_statements_0057_t
  - n: 2
    latex: \text{Closing capital} = 32000 - 3900 - 4500 = 23600
    reason: Substitute
    check_id: chk_build_acc_sole_trader_statements_0057_a
