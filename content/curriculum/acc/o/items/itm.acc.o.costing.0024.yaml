id: itm.acc.o.costing.0024
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.break_even
stem: Nomsa makes pairs of sandals that sell for $8 each. Variable cost is $4 each; fixed costs are $6600.
parts:
- id: a
  prompt: Calculate the break-even revenue.
  marks: 3
  answer:
    kind: numeric
    value: '13200.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_costing_0024_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the break-even point in units first.
  - rung: 2
    name: concept
    text:
      en: Break-even units = fixed costs ÷ contribution per unit; revenue = units × selling price.
  - rung: 3
    name: first_step
    text:
      en: Contribution per unit = selling price − variable cost.
  - rung: 4
    name: worked_step
    text:
      en: Work out 6600 ÷ (8 − 4), then multiply by 8.
  - rung: 5
    name: full_step
    text:
      en: Break-even revenue = $13200.
  misconception_ids:
  - mc.acc.o.cost_be_units_revenue_confused
  - mc.acc.o.cost_be_divides_by_price
solution:
  steps:
  - n: 1
    latex: \text{Break-even revenue} = \text{break-even units} \times \text{price}
    reason: Units first
    check_id: chk_build_acc_costing_0024_t
  - n: 2
    latex: \text{Break-even units} = \frac{6600}{8 - 4} = 1650
    reason: Units
    check_id: chk_build_acc_costing_0024_s2
  - n: 3
    latex: 1650 \times 8 = 13200
    reason: Revenue
    check_id: chk_build_acc_costing_0024_a
difficulty:
  prior: 0.2
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
