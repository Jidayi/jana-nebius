id: itm.acc.o.depreciation.0024
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.depreciation.straight_line
stem: Sipho's business buys a set of shop shelves for $18700. It is expected to last 10 years and no residual value.
parts:
- id: a
  prompt: Calculate the yearly depreciation charge by the straight-line method.
  marks: 2
  answer:
    kind: numeric
    value: '1870.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_depreciation_0024_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The straight-line method charges the same amount every year. What is spread, and over how long?
  - rung: 2
    name: concept
    text:
      en: Yearly charge = (cost − residual value) ÷ useful life in years.
  - rung: 3
    name: first_step
    text:
      en: With no residual value, the whole cost is spread.
  - rung: 4
    name: worked_step
    text:
      en: Yearly charge = 18700 ÷ 10.
  - rung: 5
    name: full_step
    text:
      en: Yearly charge = $1870.
  misconception_ids:
  - mc.acc.o.sl_residual_ignored
  - mc.acc.o.sl_total_not_annual
solution:
  steps:
  - n: 1
    latex: \text{Yearly charge} = \frac{\text{cost} - \text{residual value}}{\text{useful life}}
    reason: The same charge every year
    check_id: chk_build_acc_depreciation_0024_t
  - n: 2
    latex: \text{Yearly charge} = \frac{18700 - 0}{10} = 1870
    reason: Substitute
    check_id: chk_build_acc_depreciation_0024_a
difficulty:
  prior: -0.4
  band: foundation
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 2
  calculator: true
context_tags:
- local_currency
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_depreciation_0024_a:
    args:
      dp: 2
      expression: 18700 / 10
    tool: math_evaluate
  chk_build_acc_depreciation_0024_t:
    args:
      cost: '18700'
      dp: 2
      life_years: 10
      method: straight_line
      part_year_policy: full_year
      residual: '0'
      years: 1
    tool: acc_depreciation
authoring:
  drafted_by: rev_author_agent
  history:
