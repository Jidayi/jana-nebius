stem: Juma's year-end adjustments include commission received in advance for next year.
parts:
- id: a
  prompt: Where does it appear in the statement of financial position?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 'Nowhere: it only changes the income statement'
      correct: false
      misconception_id: mc.acc.o.acc_adjustment_in_is_only
    - id: B
      text: Non-current assets
      correct: false
      misconception_id: mc.acc.o.acc_prepayment_as_non_current
    - id: C
      text: Current assets
      correct: false
      misconception_id: mc.acc.o.acc_prepayment_as_liability
    - id: D
      text: Current liabilities
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: After the year-end adjustment, does the business owe something or is something owed to it?
  - rung: 2
    name: concept
    text:
      en: An amount the business owes is a liability; an amount owed to it, or paid for in advance, is an asset.
  - rung: 3
    name: first_step
    text:
      en: These amounts are settled within a year, so they are current.
  - rung: 4
    name: worked_step
    text:
      en: 'Every year-end adjustment has two sides: the income statement and the statement of financial position.'
  - rung: 5
    name: full_step
    text:
      en: It appears under current liabilities.
  misconception_ids:
  - mc.acc.o.acc_prepayment_as_liability
  - mc.acc.o.acc_adjustment_in_is_only
  - mc.acc.o.acc_prepayment_as_non_current
