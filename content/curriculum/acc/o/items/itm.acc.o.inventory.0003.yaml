id: itm.acc.o.inventory.0003
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.inventory.fifo
stem: 'Amina''s shop: opening inventory 40 bags of rice at $10 each; then bought 50 at $12 each; then sold 20; then bought 60 at $14 each; then sold 80.'
parts:
- id: a
  prompt: Using FIFO, calculate the value of the closing inventory.
  marks: 3
  answer:
    kind: numeric
    value: '700.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_inventory_0003_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'First in, first out: which goods leave first, and which are left at the end?'
  - rung: 2
    name: concept
    text:
      en: Under FIFO the oldest goods are sold first, so the goods left are the most recent purchases.
  - rung: 3
    name: first_step
    text:
      en: Units left = total in − total sold. Value them at the latest prices, working backwards.
  - rung: 4
    name: worked_step
    text:
      en: Take the remaining units from the last purchase first, then the one before.
  - rung: 5
    name: full_step
    text:
      en: Closing inventory = $700.
  misconception_ids:
  - mc.acc.o.inv_fifo_reversed
  - mc.acc.o.inv_cos_for_closing
solution:
  steps:
  - n: 1
    latex: '\text{FIFO: the goods left are the latest bought}'
    reason: Oldest goods go first
    check_id: chk_build_acc_inventory_0003_t
  - n: 2
    latex: \text{Units left} = (40 + 50 + 60) - (20 + 80) = 50
    reason: In less out
    check_id: chk_build_acc_inventory_0003_s2
  - n: 3
    latex: \text{Closing} = 50 \times 14 = 700
    reason: Value the remaining layers
    check_id: chk_build_acc_inventory_0003_a
difficulty:
  prior: 0.0
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
context_tags:
- local_currency
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_inventory_0003_a:
    args:
      dp: 2
      expression: 50 * 14
    tool: math_evaluate
  chk_build_acc_inventory_0003_s2:
    args:
      dp: 4
      expression: (40 + 50 + 60) - (20 + 80)
    tool: math_evaluate
  chk_build_acc_inventory_0003_t:
    args:
      dp: 2
      method: fifo
      movements:
      - kind: opening
        quantity: 40
        unit_cost: '10'
      - kind: receipt
        quantity: 50
        unit_cost: '12'
      - kind: issue
        quantity: 20
      - kind: receipt
        quantity: 60
        unit_cost: '14'
      - kind: issue
        quantity: 80
    tool: acc_inventory
authoring:
  drafted_by: rev_author_agent
  history:
  - drafted
  - verified
  - in_eval_bank
  - published
