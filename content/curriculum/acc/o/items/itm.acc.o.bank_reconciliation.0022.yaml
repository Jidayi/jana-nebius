id: itm.acc.o.bank_reconciliation.0022
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.bank_reconciliation.update_cash_book
stem: 'Thabo''s cash book shows a debit bank balance of $2140. The bank statement shows these items that are not in the cash book: loan interest charged by the bank $270; a dishonoured cheque from a customer $590; a credit transfer from a customer $650. A cheque for $1480 has not yet been presented.'
parts:
- id: a
  prompt: What is the updated cash book balance?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $2350
      correct: false
      misconception_id: mc.acc.o.br_update_signs_reversed
    - id: B
      text: $1930
      correct: true
    - id: C
      text: $450
      correct: false
      misconception_id: mc.acc.o.br_includes_timing
    - id: D
      text: $1280
      correct: false
      misconception_id: mc.acc.o.br_credit_transfer_omitted
  hints:
  - rung: 1
    name: orient
    text:
      en: Only the items on the statement that are missing from the cash book change it.
  - rung: 2
    name: concept
    text:
      en: Add money the bank received for you; subtract money it paid out or took.
  - rung: 3
    name: first_step
    text:
      en: The unpresented cheque is already in the cash book, so it does not change it again.
  - rung: 4
    name: worked_step
    text:
      en: Start from the cash book balance and apply each statement-only item.
  - rung: 5
    name: full_step
    text:
      en: The updated balance is $1930.
  misconception_ids:
  - mc.acc.o.br_update_signs_reversed
  - mc.acc.o.br_includes_timing
  - mc.acc.o.br_credit_transfer_omitted
solution:
  steps:
  - n: 1
    latex: \text{Updated balance} = \text{balance} + \text{receipts} - \text{payments}
    reason: Statement-only items
    check_id: chk_build_acc_bank_reconciliation_0022_t
  - n: 2
    latex: '\text{Answer: \$1930}'
    reason: The key, checked
    check_id: chk_build_acc_bank_reconciliation_0022_a
difficulty:
  prior: 0.1
  band: core
estimated_seconds: 45
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
context_tags:
- local_names
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_bank_reconciliation_0022_a:
    args:
      dp: 2
      expression: 2140 - 270 - 590 + 650
    tool: math_evaluate
  chk_build_acc_bank_reconciliation_0022_t:
    args:
      bank_statement:
        balance: '3190'
        entries:
        - amount: '270'
          details: loan interest charged by the bank
          direction: out
        - amount: '590'
          details: a dishonoured cheque from a customer
          direction: out
        - amount: '650'
          details: a credit transfer from a customer
          direction: in
        overdrawn: false
      cash_book:
        balance: '2140'
        entries:
        - amount: '1480'
          details: cheque number 100483
          direction: out
          ref: t0
        - amount: '220'
          details: cash paid in on the last day of the month
          direction: in
          ref: t1
        overdrawn: false
      dp: 2
      start_from: bank_statement
      task: reconcile
    tool: acc_double_entry
