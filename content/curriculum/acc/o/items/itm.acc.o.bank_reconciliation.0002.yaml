id: itm.acc.o.bank_reconciliation.0002
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.bank_reconciliation.timing_differences
stem: Femi is reconciling the business bank account. One item is cash takings paid into the bank on the last afternoon of the month, in the cash book but not yet on the statement.
parts:
- id: a
  prompt: How is it treated?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: An unpresented cheque
      correct: false
      misconception_id: mc.acc.o.br_unpresented_vs_lodgement
    - id: B
      text: An item to enter in the cash book
      correct: false
      misconception_id: mc.acc.o.br_update_vs_timing
    - id: C
      text: An error made by the bank
      correct: false
      misconception_id: mc.acc.o.br_bank_error_assumed
    - id: D
      text: An outstanding lodgement
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Where does the item appear so far: only in the cash book, or only on the bank statement?'
  - rung: 2
    name: concept
    text:
      en: Items only on the statement are entered in the cash book. Items only in the cash book are timing differences that go in the reconciliation statement.
  - rung: 3
    name: first_step
    text:
      en: A cheque paid out but not yet cleared is unpresented; money paid in but not yet credited is an outstanding lodgement.
  - rung: 4
    name: worked_step
    text:
      en: Decide the direction (paid in or paid out) and where it is recorded.
  - rung: 5
    name: full_step
    text:
      en: 'It is treated as: an outstanding lodgement.'
  misconception_ids:
  - mc.acc.o.br_unpresented_vs_lodgement
  - mc.acc.o.br_update_vs_timing
  - mc.acc.o.br_bank_error_assumed
solution:
  steps:
  - n: 1
    latex: \text{Only on the statement} \rightarrow \text{cash book; only in the cash book} \rightarrow \text{timing}
    reason: Sort by where the item is recorded
    check_id: chk_build_acc_bank_reconciliation_0002_t
difficulty:
