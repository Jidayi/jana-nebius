    args:
      dp: 2
      expression: (((((0 + 60 * 9) + 50 * 12) * (110 - 50) / 110) + 80 * 13) * (140 - 90) / 140)
    tool: math_evaluate
  chk_build_acc_inventory_0014_s2:
    args:
      dp: 4
      expression: (60 * 9 + 50 * 12) / (60 + 50)
    tool: math_evaluate
  chk_build_acc_inventory_0014_t:
