id: itm.acc.o.accruals_prepayments.0031
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.accruals_prepayments.income_adjustments
stem: Adaeze's business received $1250 of commission received during the year; $350 was still owing from the tenant at the year end.
parts:
- id: a
  prompt: What commission received is shown in the income statement for the year?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $1250
      correct: false
      misconception_id: mc.acc.o.acc_cash_basis
    - id: B
      text: $350
      correct: false
      misconception_id: mc.acc.o.acc_adjustment_as_total
    - id: C
      text: $1600
      correct: true
    - id: D
      text: $900
      correct: false
      misconception_id: mc.acc.o.acc_income_adjustment_reversed
  hints:
  - rung: 1
    name: orient
    text:
      en: Was all of the income earned this year, or is some of it earned but unpaid, or paid but unearned?
  - rung: 2
    name: concept
    text:
      en: Add income earned but not yet received; subtract income received for next year.
  - rung: 3
    name: first_step
    text:
      en: The income statement shows what was earned, not just what was received.
  - rung: 4
    name: worked_step
    text:
      en: Adjust the amount received by the amount owing or in advance.
  - rung: 5
    name: full_step
    text:
      en: The income for the year is $1600.
  misconception_ids:
  - mc.acc.o.acc_income_adjustment_reversed
  - mc.acc.o.acc_cash_basis
  - mc.acc.o.acc_adjustment_as_total
solution:
  steps:
  - n: 1
    latex: \text{Income} = \text{received} + \text{owing} - \text{in advance}
    reason: Earned this year
    check_id: chk_build_acc_accruals_prepayments_0031_t
  - n: 2
    latex: \text{Income} = 1250 + 350 = 1600
    reason: Substitute
    check_id: chk_build_acc_accruals_prepayments_0031_a
difficulty:
  prior: 0.3
  band: core
estimated_seconds: 45
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
