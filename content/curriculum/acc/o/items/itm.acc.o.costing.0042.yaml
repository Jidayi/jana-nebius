id: itm.acc.o.costing.0042
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.margin_of_safety
stem: Yaw expects to sell 3900 printed T-shirts at $8 each. Variable cost is $4 each and fixed costs are $8600.
parts:
- id: a
  prompt: What is the margin of safety in units?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 6050 units
      correct: false
      misconception_id: mc.acc.o.cost_mos_added
    - id: B
      text: 3900 units
      correct: false
      misconception_id: mc.acc.o.cost_mos_output_as_mos
    - id: C
      text: 1750 units
      correct: true
    - id: D
      text: 2150 units
      correct: false
      misconception_id: mc.acc.o.cost_mos_be_as_mos
  hints:
  - rung: 1
    name: orient
    text:
      en: How many units are sold above the break-even point?
  - rung: 2
    name: concept
    text:
      en: Margin of safety = expected output − break-even output.
  - rung: 3
    name: first_step
    text:
      en: 'Find break-even first: fixed costs ÷ contribution per unit.'
  - rung: 4
    name: worked_step
    text:
      en: Work out 3900 − 8600 ÷ (8 − 4).
  - rung: 5
    name: full_step
    text:
      en: Margin of safety = 1750 units.
  misconception_ids:
  - mc.acc.o.cost_mos_be_as_mos
  - mc.acc.o.cost_mos_output_as_mos
  - mc.acc.o.cost_mos_added
solution:
  steps:
  - n: 1
    latex: \text{Margin of safety} = \text{output} - \text{break-even}
    reason: Room before a loss
    check_id: chk_build_acc_costing_0042_t
  - n: 2
    latex: \text{Break-even} = \frac{8600}{8 - 4} = 2150
    reason: Units
    check_id: chk_build_acc_costing_0042_s2
  - n: 3
    latex: 3900 - 2150 = 1750
    reason: Subtract
    check_id: chk_build_acc_costing_0042_a
