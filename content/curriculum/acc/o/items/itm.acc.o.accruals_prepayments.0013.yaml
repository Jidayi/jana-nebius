id: itm.acc.o.accruals_prepayments.0013
version: 0.1.1
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.accruals_prepayments.prepaid_expense
stem: Juma runs a clothing shop. During the year $5450 was paid for rent, of which $250 was for the next year. At the start of the year $500 had already been paid in advance for this year.
parts:
- id: a
  prompt: Calculate the rent expense for the year in the income statement.
  marks: 2
  answer:
    kind: numeric
    value: '5700.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_accruals_prepayments_0013_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Only the cost that belongs to this year is an expense of this year.
  - rung: 2
    name: concept
    text:
      en: Expense = amount paid − amount paid in advance for next year + amount paid last year for this year.
  - rung: 3
    name: first_step
    text:
      en: 'A payment for next year is an asset now: a prepayment.'
  - rung: 4
    name: worked_step
    text:
      en: Expense = 5450 − 250 + 500.
  - rung: 5
    name: full_step
    text:
      en: The rent expense is $5700.
  misconception_ids:
  - mc.acc.o.acc_prepayment_added
  - mc.acc.o.acc_cash_basis
solution:
  steps:
  - n: 1
    latex: \text{Expense} = \text{paid} - \text{closing prepayment} + \text{opening prepayment}
    reason: Match the cost to the year it was used
    check_id: chk_build_acc_accruals_prepayments_0013_t
  - n: 2
    latex: \text{Expense} = 5450 - 250 + 500 = 5700
    reason: Substitute
    check_id: chk_build_acc_accruals_prepayments_0013_a
