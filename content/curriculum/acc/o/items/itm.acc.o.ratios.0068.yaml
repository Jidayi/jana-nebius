stem: 'A trader''s current ratio rose from 1.5 : 1 to 4.0 : 1 because inventory built up.'
parts:
- id: a
  prompt: What is the best comment?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: The business is now much better off, as a higher ratio is always better
      correct: false
      misconception_id: mc.acc.o.rat_interpret_higher_always_better
    - id: B
      text: The gross margin must have improved
      correct: false
      misconception_id: mc.acc.o.rat_interpret_volume_margin
    - id: C
      text: Profit must have risen
      correct: false
      misconception_id: mc.acc.o.rat_interpret_liquidity_profit
    - id: D
      text: Too much money may be tied up in unsold inventory
      correct: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Which kind of ratio is this: profitability, liquidity or efficiency?'
  - rung: 2
    name: concept
    text:
      en: Profitability ratios respond to prices and costs; liquidity ratios to current assets and liabilities; efficiency ratios to how fast inventory, receivables and payables turn over.
  - rung: 3
    name: first_step
    text:
      en: A higher or lower figure is not good or bad on its own; ask what caused it.
  - rung: 4
    name: worked_step
    text:
      en: Link the change to the figures in that ratio.
  - rung: 5
    name: full_step
    text:
      en: Too much money may be tied up in unsold inventory.
  misconception_ids:
