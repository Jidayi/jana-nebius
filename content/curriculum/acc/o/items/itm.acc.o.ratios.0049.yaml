id: itm.acc.o.ratios.0049
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.ratios.collection_periods
stem: Tariq runs a pharmacy. Credit sales $40000; cash sales $14000; trade receivables at the year end $13400.
parts:
- id: a
  prompt: Calculate the trade receivables collection period in days (365-day year). Give your answer to 2 decimal places.
  marks: 2
  answer:
    kind: numeric
    value: '122.28'
    unit: days
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_ratios_0049_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: How many days, on average, does it take to collect or pay a credit debt?
  - rung: 2
    name: concept
    text:
      en: Period = year-end balance ÷ credit sales (or credit purchases) × 365.
  - rung: 3
    name: first_step
    text:
      en: Only credit transactions create receivables or payables, so leave out the cash ones.
  - rung: 4
    name: worked_step
    text:
      en: Divide 13400 by 40000 and multiply by 365.
  - rung: 5
    name: full_step
    text:
      en: The period is 122.28 days.
  misconception_ids:
  - mc.acc.o.rat_total_sales_used
  - mc.acc.o.rat_ratio_inverted
solution:
  steps:
  - n: 1
    latex: \text{Period} = \frac{\text{balance}}{\text{credit transactions}} \times 365
    reason: 'The pack''s definition: credit figures, 365 days'
    check_id: chk_build_acc_ratios_0049_t
  - n: 2
    latex: \frac{13400}{40000} \times 365 = 122.28
    reason: Substitute
    check_id: chk_build_acc_ratios_0049_a
