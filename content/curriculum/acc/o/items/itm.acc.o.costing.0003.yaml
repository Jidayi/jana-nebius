id: itm.acc.o.costing.0003
version: 0.1.1
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.costing.cost_classification
stem: A small firm makes goods. It pays a salary to the manager of its factory.
parts:
- id: a
  prompt: How is this cost classed?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Not a cost of production
      correct: false
      misconception_id: mc.acc.o.cost_fixed_not_cost
    - id: B
      text: Variable cost
      correct: false
      misconception_id: mc.acc.o.cost_fixed_variable_by_size
    - id: C
      text: Indirect fixed cost
      correct: true
    - id: D
      text: Direct variable cost
      correct: false
      misconception_id: mc.acc.o.cost_direct_indirect_confused
  hints:
  - rung: 1
    name: orient
    text:
      en: Does the total cost change when output changes? Can it be traced to each item?
  - rung: 2
    name: concept
    text:
      en: Variable costs rise in total with output; fixed costs stay the same in total. Direct costs can be traced to each unit; indirect costs (overheads) cannot.
  - rung: 3
    name: first_step
    text:
      en: Fixed cost per unit falls as output rises, but the total stays the same.
  - rung: 4
    name: worked_step
    text:
      en: Ask both questions.
  - rung: 5
    name: full_step
    text:
      en: Indirect fixed cost.
  misconception_ids:
  - mc.acc.o.cost_direct_indirect_confused
  - mc.acc.o.cost_fixed_variable_by_size
  - mc.acc.o.cost_fixed_not_cost
solution:
  steps:
  - n: 1
    latex: \text{Indirect fixed cost}
    reason: Behaviour and traceability
