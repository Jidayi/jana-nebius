subject: acc
level: o
kc_ids:
- kc.acc.o.inventory.lower_cost_nrv
stem: At the year end Femi holds 130 tins of paint that cost $73 each. They can be sold for $70 each, but each needs $3 spent on it before it can be sold.
parts:
- id: a
  prompt: Calculate the value of this inventory.
  marks: 3
  answer:
    kind: numeric
    value: '8710.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_inventory_0025_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Inventory is valued at the lower of two figures. Which two?
  - rung: 2
    name: concept
    text:
      en: Net realisable value = selling price − costs needed to sell. Use the lower of cost and NRV.
  - rung: 3
    name: first_step
    text:
      en: NRV per item = 70 − 3.
  - rung: 4
    name: worked_step
    text:
      en: Compare 73 with 70 − 3; multiply the lower by 130.
  - rung: 5
    name: full_step
    text:
      en: Each item is valued at $67, so the inventory is worth $8710.
  misconception_ids:
  - mc.acc.o.inv_selling_price_used
  - mc.acc.o.inv_nrv_ignored
solution:
  steps:
  - n: 1
    latex: \text{Value} = \text{quantity} \times \text{lower of cost and NRV}
    reason: Prudence
    check_id: chk_build_acc_inventory_0025_t
  - n: 2
    latex: \text{NRV} = 70 - 3 = 67
    reason: Selling price less costs to sell
    check_id: chk_build_acc_inventory_0025_s2
  - n: 3
    latex: \text{Value} = 130 \times 67 = 8710
    reason: The lower figure
    check_id: chk_build_acc_inventory_0025_a
