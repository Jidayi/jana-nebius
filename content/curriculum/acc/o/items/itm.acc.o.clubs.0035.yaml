id: itm.acc.o.clubs.0035
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.clubs.surplus_deficit
stem: 'A cycling club''s figures for the year: subscriptions for the year $9100; competition fees $1750; rent $3550; groundsman''s wages $1350; electricity $300; new equipment bought $3400; depreciation of equipment $750.'
parts:
- id: a
  prompt: Calculate the surplus for the year (give a deficit as a negative number).
  marks: 3
  answer:
    kind: numeric
    value: '4900.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_clubs_0035_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A club's surplus is its income for the year less its expenditure for the year.
  - rung: 2
    name: concept
    text:
      en: Include this year's income and expenses, and depreciation; leave out capital spending.
  - rung: 3
    name: first_step
    text:
      en: The equipment bought is an asset; only its depreciation is expenditure.
  - rung: 4
    name: worked_step
    text:
      en: Work out 9100 + 1750 − (3550 + 1350 + 300 + 750).
  - rung: 5
    name: full_step
    text:
      en: The club has a surplus of $4900.
  misconception_ids:
  - mc.acc.o.club_capital_items_in_ie
  - mc.acc.o.club_depreciation_omitted
solution:
  steps:
  - n: 1
    latex: \text{Surplus} = \text{income} - \text{expenditure}
    reason: Matching, like profit
    check_id: chk_build_acc_clubs_0035_t
  - n: 2
    latex: \text{Income} = 9100 + 1750 = 10850
    reason: Earned this year
    check_id: chk_build_acc_clubs_0035_s2
  - n: 3
    latex: \text{Expenditure} = 3550 + 1350 + 300 + 750 = 5950
    reason: Including depreciation
    check_id: chk_build_acc_clubs_0035_s3
  - n: 4
    latex: 10850 - 5950 \rightarrow 4900\ \text{surplus}
    reason: Subtract
    check_id: chk_build_acc_clubs_0035_s4
