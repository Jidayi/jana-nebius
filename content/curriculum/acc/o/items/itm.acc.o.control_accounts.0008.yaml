stem: A business keeps control accounts.
parts:
- id: a
  prompt: Who is helped when control accounts show where an error lies?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Suppliers
      correct: false
    - id: B
      text: Whoever checks the ledgers, who can search a smaller part of the books
      correct: true
    - id: C
      text: Customers
      correct: false
  hints:
  - rung: 1
    name: orient
    text:
      en: What does a control account summarise, and what can it not tell you?
  - rung: 2
    name: concept
    text:
      en: A control account holds the totals of all the entries in a personal ledger, so its balance should equal the total of the personal balances.
  - rung: 3
    name: first_step
    text:
      en: Agreement checks the arithmetic of the ledger as a whole; an error within one account, such as posting to the wrong customer, can still be there.
  - rung: 4
    name: worked_step
    text:
      en: Recall what each control account summarises.
  - rung: 5
    name: full_step
    text:
      en: Whoever checks the ledgers, who can search a smaller part of the books.
solution:
  steps:
  - n: 1
    latex: \text{Control account} = \text{total of the personal ledger}
    reason: A summary check
    check_id: chk_build_acc_control_accounts_0008_t
