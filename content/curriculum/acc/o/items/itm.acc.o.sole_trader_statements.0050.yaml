id: itm.acc.o.sole_trader_statements.0050
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.working_capital
stem: 'At the year end Bola''s business has: inventory $5800; trade receivables $8900; prepaid expenses $900; bank overdraft $2300; cash in hand $150; trade payables $4600; accrued expenses $200; equipment $19600; loan repayable in six years $14800.'
parts:
- id: a
  prompt: Calculate the total current assets.
  marks: 2
  answer:
    kind: numeric
    value: '15750.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0050_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Current assets are owned now and turn into cash within a year. Which items qualify?
  - rung: 2
    name: concept
    text:
      en: Inventory, trade receivables, prepayments, a bank balance in credit and cash are current assets. Equipment is non-current and an overdraft is a liability.
  - rung: 3
    name: first_step
    text:
      en: Start with inventory $5800 and trade receivables $8900.
  - rung: 4
    name: worked_step
    text:
      en: Total current assets = 5800 + 8900 + 900 + 150.
  - rung: 5
    name: full_step
    text:
      en: Total current assets = $15750.
  misconception_ids:
  - mc.acc.o.sofp_overdraft_as_asset
  - mc.acc.o.wc_non_current_included
solution:
  steps:
  - n: 1
    latex: \text{Current assets} = \text{inventory} + \text{receivables} + \text{prepayments} + \text{bank} + \text{cash}
    reason: Only items turned into cash within a year
    check_id: chk_build_acc_sole_trader_statements_0050_t
  - n: 2
    latex: \text{Current assets} = 5800 + 8900 + 900 + 150 = 15750
    reason: Add
    check_id: chk_build_acc_sole_trader_statements_0050_a
