- kc.acc.o.sole_trader_statements.profit_for_year
stem: 'Adaeze''s figures for the year: gross profit $22700; commission received $750; motor expenses $4950; repairs $1900; rent $3850; drawings $2600; new equipment bought $4700.'
parts:
- id: a
  prompt: What is the profit for the year?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: $8050
      correct: false
      misconception_id: mc.acc.o.pfy_capital_spending_deducted
    - id: B
      text: $12750
      correct: true
    - id: C
      text: $12000
      correct: false
      misconception_id: mc.acc.o.pfy_other_income_omitted
    - id: D
      text: $10150
      correct: false
      misconception_id: mc.acc.o.pfy_drawings_deducted
  hints:
  - rung: 1
    name: orient
    text:
      en: Some of these figures are not income or expenses of the year. Which ones?
  - rung: 2
    name: concept
    text:
      en: Profit for the year = gross profit + other income − running expenses. Drawings reduce capital; equipment is a non-current asset.
  - rung: 3
    name: first_step
    text:
      en: 'Other income: commission received of $750.'
  - rung: 4
    name: worked_step
    text:
      en: Work out 22700 + 750 − (4950 + 1900 + 3850).
  - rung: 5
    name: full_step
    text:
      en: 22700 + 750 − (4950 + 1900 + 3850) = $12750.
  misconception_ids:
  - mc.acc.o.pfy_drawings_deducted
  - mc.acc.o.pfy_other_income_omitted
  - mc.acc.o.pfy_capital_spending_deducted
solution:
  steps:
  - n: 1
    latex: \text{Profit for the year} = \text{gross profit} + \text{other income} - \text{expenses}
    reason: Only income and expenses of the year
    check_id: chk_build_acc_sole_trader_statements_0033_t
  - n: 2
    latex: \text{Profit for the year} = 22700 + 750 - (4950 + 1900 + 3850) = 12750
    reason: Substitute
    check_id: chk_build_acc_sole_trader_statements_0033_a
