stem: A bakery lists its costs.
parts:
- id: a
  prompt: Select every variable cost.
  marks: 2
  answer:
    kind: multi_select
    options:
    - id: A
      text: Flour
      correct: true
    - id: B
      text: Packaging for each loaf
      correct: true
    - id: C
      text: Gas for the ovens per batch
      correct: true
    - id: D
      text: Rent of the bakery
      correct: false
    - id: E
      text: Insurance
      correct: false
    - id: F
      text: The manager's salary
      correct: false
    scoring: exact_set
  hints:
  - rung: 1
    name: orient
    text:
      en: Does the total cost change when output changes? Can it be traced to each item?
  - rung: 2
    name: concept
    text:
      en: Variable costs rise in total with output; fixed costs stay the same in total. Direct costs can be traced to each unit; indirect costs (overheads) cannot.
  - rung: 3
    name: first_step
    text:
      en: Fixed cost per unit falls as output rises, but the total stays the same.
  - rung: 4
    name: worked_step
    text:
      en: Pick the costs that rise with output.
  - rung: 5
    name: full_step
    text:
      en: Flour, packaging and gas per batch.
  misconception_ids:
