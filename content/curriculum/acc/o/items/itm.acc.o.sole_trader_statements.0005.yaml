id: itm.acc.o.sole_trader_statements.0005
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.sole_trader_statements.cost_of_sales
stem: 'Halima runs a small grocery. Figures for the year: opening inventory $4300; purchases $22900; closing inventory $5900.'
parts:
- id: a
  prompt: Calculate the cost of sales for the year.
  marks: 3
  answer:
    kind: numeric
    value: '21300.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_sole_trader_statements_0005_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Cost of sales is the cost of the goods actually sold this year. Which figures change it, and which belong with the expenses?
  - rung: 2
    name: concept
    text:
      en: Goods available = opening inventory + purchases − purchases returns + carriage inwards. Take away the closing inventory to get cost of sales. Carriage outwards is a selling expense.
  - rung: 3
    name: first_step
    text:
      en: Start with the opening inventory of $4300 and add the purchases of $22900.
  - rung: 4
    name: worked_step
    text:
      en: Cost of sales = (4300 + 22900) − 5900.
  - rung: 5
    name: full_step
    text:
      en: Cost of sales = (4300 + 22900) − 5900 = $21300.
  misconception_ids:
  - mc.acc.o.cos_closing_added
  - mc.acc.o.cos_carriage_outwards_included
solution:
  steps:
  - n: 1
    latex: \text{Cost of sales} = \text{opening inventory} + \text{net purchases} + \text{carriage inwards} - \text{closing inventory}
    reason: The goods available less the goods left
    check_id: chk_build_acc_sole_trader_statements_0005_t
  - n: 2
    latex: \text{Goods available} = 4300 + 22900 = 27200
    reason: Opening inventory and net purchases
    check_id: chk_build_acc_sole_trader_statements_0005_s2
  - n: 3
    latex: \text{Cost of sales} = 27200 - 5900 = 21300
    reason: Take away the closing inventory
    check_id: chk_build_acc_sole_trader_statements_0005_a
difficulty:
  prior: -0.4
  band: foundation
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
