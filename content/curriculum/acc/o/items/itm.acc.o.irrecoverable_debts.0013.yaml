id: itm.acc.o.irrecoverable_debts.0013
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.irrecoverable_debts.allowance_amount
stem: At the year end Obi's trade receivables are $4000, before writing off an irrecoverable debt of $950. The allowance for irrecoverable debts is to be 10% of trade receivables.
parts:
- id: a
  prompt: Calculate the allowance for irrecoverable debts at the year end.
  marks: 2
  answer:
    kind: numeric
    value: '305.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_irrecoverable_debts_0013_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which receivables might still be collected? Those are the ones the allowance covers.
  - rung: 2
    name: concept
    text:
      en: Allowance = percentage × trade receivables after known bad debts are written off.
  - rung: 3
    name: first_step
    text:
      en: First write off the $950 debt.
  - rung: 4
    name: worked_step
    text:
      en: Allowance = 10% × (4000 − 950).
  - rung: 5
    name: full_step
    text:
      en: Allowance = $305.
  misconception_ids:
  - mc.acc.o.id_allowance_before_writeoff
  - mc.acc.o.id_net_as_allowance
solution:
  steps:
  - n: 1
    latex: \text{Allowance} = \text{rate} \times (\text{receivables} - \text{debts written off})
    reason: Only debts that might still be paid
    check_id: chk_build_acc_irrecoverable_debts_0013_t
  - n: 2
    latex: \text{Allowance} = 10\% \times (4000 - 950) = 305
    reason: Substitute
    check_id: chk_build_acc_irrecoverable_debts_0013_a
difficulty:
  prior: 0.0
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 2
  calculator: true
context_tags:
- local_currency
provenance:
  origin: original
  licence: LicenseRef-Own
