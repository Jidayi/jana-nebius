id: itm.acc.o.bank_reconciliation.0017
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.bank_reconciliation.update_cash_book
stem: 'Nia''s cash book shows a debit bank balance of $2070. The bank statement shows these items that are not in the cash book: a direct debit for electricity $370; bank charges $440; a credit transfer from a customer $640. Also, cheque number 100910 $220 has not yet been presented.'
parts:
- id: a
  prompt: Calculate the updated cash book balance.
  marks: 3
  answer:
    kind: numeric
    value: '1900.00'
    unit: $
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_bank_reconciliation_0017_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which items has the bank already dealt with that the cash book does not show yet?
  - rung: 2
    name: concept
    text:
      en: Money the bank received for you is added to the cash book balance; money it paid out is subtracted.
  - rung: 3
    name: first_step
    text:
      en: An unpresented cheque is already in the cash book; it belongs in the reconciliation statement, not here.
  - rung: 4
    name: worked_step
    text:
      en: Updated balance = 2070 − 370 − 440 + 640.
  - rung: 5
    name: full_step
    text:
      en: Updated cash book balance = $1900.
  misconception_ids:
  - mc.acc.o.br_update_signs_reversed
  - mc.acc.o.br_includes_timing
solution:
  steps:
  - n: 1
    latex: \text{Updated balance} = \text{balance} + \text{receipts} - \text{payments on the statement only}
    reason: Bring the cash book up to date
    check_id: chk_build_acc_bank_reconciliation_0017_t
  - n: 2
    latex: \text{Updated balance} = 2070 - 370 - 440 + 640 = 1900
    reason: Substitute
    check_id: chk_build_acc_bank_reconciliation_0017_a
difficulty:
  prior: 0.0
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
context_tags:
- local_names
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_acc_bank_reconciliation_0017_a:
    args:
      dp: 2
      expression: 2070 - 370 - 440 + 640
    tool: math_evaluate
  chk_build_acc_bank_reconciliation_0017_t:
    args:
      bank_statement:
        balance: '1580'
        entries:
        - amount: '370'
          details: a direct debit for electricity
          direction: out
        - amount: '440'
          details: bank charges
          direction: out
        - amount: '640'
          details: a credit transfer from a customer
          direction: in
        overdrawn: false
      cash_book:
        balance: '2070'
        entries:
        - amount: '220'
          details: cheque number 100910
          direction: out
          ref: t0
        - amount: '540'
          details: cash paid in on the last day of the month
          direction: in
          ref: t1
        overdrawn: false
      dp: 2
      start_from: bank_statement
      task: reconcile
    tool: acc_double_entry
