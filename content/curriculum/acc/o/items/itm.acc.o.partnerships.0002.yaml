id: itm.acc.o.partnerships.0002
version: 0.1.0
type: mcq_diagnostic
subject: acc
level: o
kc_ids:
- kc.acc.o.partnerships.partnership_agreement
stem: Three partners have no written or spoken agreement about profits.
parts:
- id: a
  prompt: Which of these do they receive by default?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Interest on their capital
      correct: false
      misconception_id: mc.acc.o.pa_interest_default
    - id: B
      text: A salary for the work they do
      correct: false
      misconception_id: mc.acc.o.pa_salary_default
    - id: C
      text: An equal share of the profit
      correct: true
    - id: D
      text: A share in proportion to their capital
      correct: false
      misconception_id: mc.acc.o.pa_capital_ratio_default
  hints:
  - rung: 1
    name: orient
    text:
      en: Without an agreement, the partners fall back on the default rules.
  - rung: 2
    name: concept
    text:
      en: By default profits and losses are shared equally, with no interest on capital, no salaries and no interest on drawings.
  - rung: 3
    name: first_step
    text:
      en: Interest on capital, salaries and a capital-based ratio only apply when the partners agree them.
  - rung: 4
    name: worked_step
    text:
      en: Separate what partners usually agree from what applies when nothing is agreed.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: an equal share of the profit.'
  misconception_ids:
  - mc.acc.o.pa_interest_default
  - mc.acc.o.pa_capital_ratio_default
  - mc.acc.o.pa_salary_default
solution:
  steps:
  - n: 1
    latex: '\text{No agreement: equal shares, no interest, no salaries}'
    reason: The default rules
