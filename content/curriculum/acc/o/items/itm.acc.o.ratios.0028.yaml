id: itm.acc.o.ratios.0028
version: 0.1.0
type: numeric
subject: acc
level: o
kc_ids:
- kc.acc.o.ratios.liquidity
stem: Ama's business has inventory $10000, trade receivables $10200, a bank balance of $1800 and current liabilities of $11700.
parts:
- id: a
  prompt: Calculate the current ratio, as the first number of a ratio to 1. Give your answer to 2 decimal places.
  marks: 2
  answer:
    kind: numeric
    value: '1.88'
    unit: :1
    unit_policy: none
    tolerance:
      mode: absolute
      value: 0.005
    check_id: chk_build_acc_ratios_0028_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The current ratio compares what will turn into cash within a year with what must be paid within a year.
  - rung: 2
    name: concept
    text:
      en: 'Current ratio = current assets : current liabilities.'
  - rung: 3
    name: first_step
    text:
      en: Current assets here are inventory, trade receivables and the bank balance.
  - rung: 4
    name: worked_step
    text:
      en: Divide (10000 + 10200 + 1800) by 11700.
  - rung: 5
    name: full_step
    text:
      en: 'Current ratio = 1.88 : 1.'
  misconception_ids:
  - mc.acc.o.rat_acid_includes_inventory
  - mc.acc.o.rat_ratio_inverted
solution:
  steps:
  - n: 1
    latex: \text{Current ratio} = \frac{\text{current assets}}{\text{current liabilities}}
    reason: Expressed as a ratio to 1
    check_id: chk_build_acc_ratios_0028_t
  - n: 2
    latex: \frac{10000 + 10200 + 1800}{11700} = 1.88
    reason: Substitute
    check_id: chk_build_acc_ratios_0028_a
