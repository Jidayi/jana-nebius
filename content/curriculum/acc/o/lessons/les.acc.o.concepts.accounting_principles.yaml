title: The principles behind the accounts
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'Try this before any rules: the shop and its owner keep separate money.'
  item_id: itm.acc.o.concepts.0021
  action: try_first
  why:
    en: Anything the owner takes for family or home use is drawings. Rent, wages and electricity for the shop are business expenses.
  names:
    en: Treating the business as separate from its owner is the business entity principle. Accountants follow a set of such principles so accounts can be trusted.
- type: step
  text:
    en: Some principles stop the accounts looking better than they really are.
  item_id: itm.acc.o.concepts.0002
  action: choose
  why:
    en: Prudence means losses are recorded as soon as they are expected, so inventory is valued at the lower figure.
- type: step
  text:
    en: Some principles decide when an item is recorded, or at what value.
  item_id: itm.acc.o.concepts.0010
  action: choose
  why:
    en: Historic cost sets the value, while realisation and accruals set the timing. The others decide what is recorded at all.
- type: step
  text:
    en: 'Predict before you look at the choices: does the date of the payment decide which year a cost belongs to?'
  item_id: itm.acc.o.concepts.0015
  action: predict
  why:
    en: Under accruals, a cost belongs to the period when it is used, so the unpaid bill is an expense of this year and an accrual.
- type: step
  text:
    en: Prudence also applies to losses that have not happened yet.
  item_id: itm.acc.o.concepts.0013
  action: choose
  why:
    en: A likely loss is provided for now, so profit is not overstated. Waiting until it is paid would break prudence.
- type: check
  item_ids:
  - itm.acc.o.concepts.0003
  - itm.acc.o.concepts.0012
  - itm.acc.o.concepts.0014
