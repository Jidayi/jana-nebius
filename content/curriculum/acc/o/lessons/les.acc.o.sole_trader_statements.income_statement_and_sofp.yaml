title: Preparing a sole trader's financial statements
estimated_minutes: 14
blocks:
- type: step
  text:
    en: 'Try this before any rules: what did the goods Musa actually sold cost him this year?'
  item_id: itm.acc.o.sole_trader_statements.0001
  action: try_first
  why:
    en: Add the opening inventory, the purchases and the carriage inwards to get the goods available. Take away the goods still left at the end.
  names:
    en: This figure is the cost of sales. It is the cost of the goods sold, not of everything bought.
- type: step
  text:
    en: Some figures in the list belong in cost of sales and some do not. Watch which way each one moves the total.
  item_id: itm.acc.o.sole_trader_statements.0008
  action: choose
  why:
    en: Purchases returns and closing inventory are taken away; carriage inwards is added. Carriage outwards belongs with selling expenses, so leave it out.
- type: step
  text:
    en: Now go one line further down the income statement. Returns from customers reduce what was really sold.
  item_id: itm.acc.o.sole_trader_statements.0012
  action: calculate
  why:
    en: Net revenue is revenue less sales returns. Take away the cost of sales to get gross profit.
- type: step
  text:
    en: 'Predict before you look at the choices: which of these figures are not costs of running the business this year?'
  item_id: itm.acc.o.sole_trader_statements.0030
  action: predict
  why:
    en: Add the discount received to gross profit, then take away the running expenses. Drawings and new equipment are not expenses, so they stay out.
- type: step
  text:
    en: The statement of financial position sorts items by whether the business owns or owes them, and by when.
  item_id: itm.acc.o.sole_trader_statements.0034
  action: choose
  why:
    en: A loan is owed, so it is a liability. It is due after more than a year, so it is non-current.
- type: check
  item_ids:
