title: Accounts for a club or society
estimated_minutes: 12
blocks:
- type: step
  text:
    en: 'Try this before any rules: a club does not trade for profit, so its statements have their own names.'
  item_id: itm.acc.o.clubs.0001
  action: try_first
  why:
    en: The receipts and payments account lists the cash that came in and went out, so it is a summary of the cash book.
  names:
    en: The receipts and payments account summarises cash. The income and expenditure account matches the year's income and expenses and shows a surplus or a deficit.
- type: step
  text:
    en: Not every payment is an expense of the year.
  item_id: itm.acc.o.clubs.0003
  action: choose
  why:
    en: Equipment is an asset that lasts, so it is a cash payment but not expenditure. Only its depreciation goes in the income and expenditure account.
- type: step
  text:
    en: Subscriptions count as income of the year they cover, not the year the cash arrives.
  item_id: itm.acc.o.clubs.0012
  action: calculate
  why:
    en: Take off the amount that was for last year and the amount paid for next year, and add what members still owe for this year.
- type: step
  text:
    en: 'Predict before you look at the choices: is a subscription paid in advance something the club owns or owes?'
  item_id: itm.acc.o.clubs.0030
  action: predict
  why:
    en: The fund is what the club owns less what it owes. Money paid early is a debt to members, so it is taken off, not added.
- type: step
  text:
    en: Put it together to find the result for the year.
  item_id: itm.acc.o.clubs.0041
  action: choose
  why:
    en: Take the year's costs from its income, counting wear on the kit but not the price of new kit. Income is bigger here, so it is a surplus.
- type: check
