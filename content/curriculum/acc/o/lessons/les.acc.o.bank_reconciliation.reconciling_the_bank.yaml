title: Updating the cash book and reconciling it with the bank
estimated_minutes: 13
blocks:
- type: step
  text:
    en: 'Try this before any rules: the business has written the cheque, but the bank has not seen it yet.'
  item_id: itm.acc.o.bank_reconciliation.0001
  action: try_first
  why:
    en: The supplier has not yet paid the cheque in, so the bank has not taken it off. This is only a matter of timing.
  names:
    en: A cheque in the cash book that the bank has not yet paid is an unpresented cheque. It is a timing difference, not a mistake.
- type: step
  text:
    en: Some items the bank already knows about but the cash book does not.
  item_id: itm.acc.o.bank_reconciliation.0010
  action: choose
  why:
    en: Items found only on the bank statement are entered in the cash book. Unpresented cheques and outstanding lodgements wait for the reconciliation statement.
- type: step
  text:
    en: Bring the cash book up to date first.
  item_id: itm.acc.o.bank_reconciliation.0012
  action: calculate
  why:
    en: Money paid in directly is added and the direct debit is taken off. The unpresented cheque is left out, because it is only a timing difference.
- type: step
  text:
    en: Now explain the gap between the statement and the cash book.
  item_id: itm.acc.o.bank_reconciliation.0025
  action: calculate
  why:
    en: Start from the statement balance, add the lodgements the bank has not yet credited and take off the cheques not yet presented.
- type: step
  text:
    en: 'Predict before you look at the choices: what does a credit balance in your own cash book tell you?'
  item_id: itm.acc.o.bank_reconciliation.0034
  action: predict
  why:
    en: In the cash book, money in the bank is a debit balance. A credit balance means the business owes the bank, so it is overdrawn.
- type: check
