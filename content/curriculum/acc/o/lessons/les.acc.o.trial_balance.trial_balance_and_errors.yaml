title: The trial balance, its limits and correcting errors
estimated_minutes: 15
blocks:
- type: step
  text:
    en: 'Try this before any rules: think about which side of its ledger account each balance normally sits on.'
  item_id: itm.acc.o.trial_balance.0001
  action: try_first
  why:
    en: Capital is what the business owes the owner, so it is a credit balance. Drawings, discount allowed and sales returns are debits.
  names:
    en: A list of every ledger balance in a debit and a credit column is a trial balance. If double entry was done properly, the two totals agree.
- type: step
  text:
    en: When one balance is missing, the other balances tell you what it must be.
  item_id: itm.acc.o.trial_balance.0012
  action: calculate
  why:
    en: Add the debit balances and the other credit balances. Capital is the difference that makes the two columns equal.
- type: step
  text:
    en: Totals that agree do not prove the books are right. Some errors hide inside a balanced trial balance.
  item_id: itm.acc.o.trial_balance.0023
  action: choose
  why:
    en: The sale was left out of both accounts, so debits and credits still match. This is an error of omission.
- type: step
  text:
    en: 'Predict before you look at the choices: what must be true of an error for the totals still to agree?'
  item_id: itm.acc.o.trial_balance.0032
  action: predict
  why:
    en: Leaving out a deal, using the wrong kind of account, or swapping the sides all keep debits equal to credits. The other three errors make the totals differ.
- type: step
  text:
    en: A correcting entry moves the accounts from what was recorded to what should have been recorded.
  item_id: itm.acc.o.trial_balance.0034
  action: choose
  why:
    en: Both accounts are short by the same amount, so add the difference on the same sides as the original entry. No suspense is needed because the totals agreed.
- type: check
  item_ids:
  - itm.acc.o.trial_balance.0035
  - itm.acc.o.trial_balance.0045
  - itm.acc.o.trial_balance.0024
