title: Valuing the goods left at the year end
estimated_minutes: 13
blocks:
- type: step
  text:
    en: 'Try this before any rules: the shop bought the same goods at different prices. Assume the oldest goods are sold first.'
  item_id: itm.acc.o.inventory.0001
  action: try_first
  why:
    en: Sales use up the old goods first. So the cartons left are the last ones bought, at the last prices.
  names:
    en: Selling the oldest goods first is called FIFO, first in, first out. It leaves the newest goods in the closing inventory.
- type: step
  text:
    en: One of these answers values the goods left at the oldest prices. Watch out for it.
  item_id: itm.acc.o.inventory.0008
  action: choose
  why:
    en: Under FIFO the goods left are the latest bought, so value them at the newest price.
- type: step
  text:
    en: AVCO gives every unit held the same average cost. Work out a new average each time goods are bought.
  item_id: itm.acc.o.inventory.0012
  action: calculate
  why:
    en: Total value held divided by units held gives the average. Units sold take that average out, and the next purchase changes it again.
- type: step
  text:
    en: Some answers here use a short cut. Only one follows the AVCO rule step by step.
  item_id: itm.acc.o.inventory.0019
  action: choose
  why:
    en: The average must be weighted by how many units are held. A simple average of the prices ignores the quantities.
- type: step
  text:
    en: 'Predict before you look at the choices: what will these goods really bring in once they are fixed?'
  item_id: itm.acc.o.inventory.0030
  action: predict
  why:
    en: Take the repair cost away from the selling price to get net realisable value; here that comes out under cost. Use the lower figure, never the selling price.
- type: step
  text:
    en: Closing inventory is taken away in cost of sales. Follow an error through that sum.
  item_id: itm.acc.o.inventory.0034
  action: choose
  why:
    en: Too high a closing inventory makes cost of sales too low, so gross profit comes out too high by the same amount.
- type: check
  item_ids:
  - itm.acc.o.inventory.0002
  - itm.acc.o.inventory.0024
  - itm.acc.o.inventory.0035
