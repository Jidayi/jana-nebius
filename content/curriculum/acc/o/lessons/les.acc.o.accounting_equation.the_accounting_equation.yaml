title: Why accounts are kept and the accounting equation
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'Try this before any rules: how much of the business really belongs to Yaw?'
  item_id: itm.acc.o.accounting_equation.0028
  action: try_first
  why:
    en: Add up what the business owns, then take away what it owes. What is left belongs to the owner.
  names:
    en: What belongs to the owner is capital, so assets equal capital plus liabilities. This is the accounting equation.
- type: step
  text:
    en: Accounts are kept so that people can make decisions about the business.
  item_id: itm.acc.o.accounting_equation.0006
  action: choose
  why:
    en: A lender's money comes back only if the business can pay it, so a bank reads the accounts to judge that.
- type: step
  text:
    en: Every item in the equation belongs to a class.
  item_id: itm.acc.o.accounting_equation.0018
  action: choose
  why:
    en: 'The business must pay this money to its suppliers, so it is something the business owes: a liability.'
- type: step
  text:
    en: Turn the equation round to find a missing part.
  item_id: itm.acc.o.accounting_equation.0024
  action: calculate
  why:
    en: Liabilities are what is left of the assets once the owner's capital is taken away.
- type: step
  text:
    en: 'Predict before you look at the choices: does buying on credit change the owner''s capital?'
  item_id: itm.acc.o.accounting_equation.0041
  action: predict
  why:
    en: Inventory, an asset, goes up, and the amount owed to the supplier goes up by the same amount. The owner's capital does not change.
- type: check
  item_ids:
  - itm.acc.o.accounting_equation.0012
  - itm.acc.o.accounting_equation.0030
  - itm.acc.o.accounting_equation.0034
