title: Working out and explaining accounting ratios
estimated_minutes: 15
blocks:
- type: step
  text:
    en: 'Try this before any rules: out of every dollar Zanele takes in, how much is left after paying for the goods she sold?'
  item_id: itm.acc.o.ratios.0001
  action: try_first
  why:
    en: Gross profit is revenue less cost of sales. Divide it by revenue and write it as a percentage.
  names:
    en: Gross profit as a share of revenue is the gross margin. A margin always divides a profit by revenue.
- type: step
  text:
    en: Mark-up looks like margin, but it compares the profit with something else.
  item_id: itm.acc.o.ratios.0019
  action: choose
  why:
    en: Mark-up divides gross profit by cost of sales, not by revenue. Dividing by revenue gives the margin instead.
- type: step
  text:
    en: Some ratios ask whether the business can pay what it owes soon. The acid test counts only the assets that are close to cash.
  item_id: itm.acc.o.ratios.0023
  action: calculate
  why:
    en: Leave inventory out, add the receivables and the bank, then divide by current liabilities.
- type: step
  text:
    en: 'Predict before you look at the choices: which current asset does the acid test leave out?'
  item_id: itm.acc.o.ratios.0030
  action: predict
  why:
    en: Inventory is left out because it must be sold before it turns into cash. Only receivables and bank are divided by current liabilities.
- type: step
  text:
    en: A ratio changes only when the figures inside it change. Look for what moves revenue or cost of sales.
  item_id: itm.acc.o.ratios.0067
  action: choose
  why:
    en: Lower selling prices bring in more sales but less gross profit on each one, so the margin falls. Rent and overdrafts are not in the gross margin.
- type: check
  item_ids:
  - itm.acc.o.ratios.0034
  - itm.acc.o.ratios.0045
  - itm.acc.o.ratios.0056
