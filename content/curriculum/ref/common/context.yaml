# pack.ref local-context word lists (CUR-07, CUR-25, CUR-28, LOC-10): the names, places and currencies a word problem
# may use. Names are given names and family names of our choosing, used for fictional people only; places stay empty
# until the pilot-country overlay names its towns (D2, LOC-10). The automated QA flags an item tagged `local_names` or
# `local_places` that names anyone or anywhere not listed here, and any currency not listed.
