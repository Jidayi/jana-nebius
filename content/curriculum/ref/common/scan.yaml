# The content scan's word lists (PRV-17, CUR-25 sensitivity lint, CUR-27). Every text of every pack record is scanned
# before the pack builds; a hit in any category fails the build. Patterns are regular expressions matched as whole
# words, case-insensitively unless the category says `case: sensitive`. Problem reports after release add to these
# lists (PRV-17). `sensitive_topics` does not fail a build: it marks records the safety review must sample in full
# (CUR-27).
guard:
  # The input-guard categories of TABLE PRV-13a that content can fall into.
  distress:
    - 'suicid\w*'
    - 'self[- ]?harm\w*'
    - 'kill(s|ed|ing)? (him|her|them|my|your)sel(f|ves)'
    - 'want(s|ed)? to die'
    - '(child|sexual) abuse'
  harmful:
    - 'guns?'
    - 'rifles?'
    - 'pistols?'
    - 'revolvers?'
    - 'shotguns?'
    - 'firearms?'
    - 'bullets?'
    - 'ammunition'
    - 'cannons?'
    - 'cannonballs?'
    - 'grenades?'
    - 'bombs?'
    - 'missiles?'
    - 'swords?'
    - 'machetes?'
    - '(make|making|build|building) (an? )?(explosive|poison|weapon)s?'
    - 'cocaine'
    - 'heroin'
    - 'methamphetamine'
    - 'cannabis'
    - 'marijuana'
    - 'illegal drugs?'
  sexual_or_violent:
    - 'porn\w*'
    - 'nude'
    - 'naked'
    - 'rape\w*'
    - 'molest\w*'
    - 'murder\w*'
    - 'stab(s|bed|bing)?'
    - 'assault\w*'
    - 'tortur\w*'
    - 'kidnap\w*'
    - 'terroris\w*'
    - '(kill|kills|killed|killing|shoot|shoots|shot|beat|beats|beaten|hit|hits) (a |an |the |his |her |their )?(man|men|woman|women|person|people|child|children|boy|girl|baby|someone|him|her|classmate|teacher|neighbour)'
  personal_data:
    - '[\w.+-]+@[\w-]+\.[a-z]{2,}'
    - 'https?://\S+'
    - 'www\.\S+'
    - '\+\d{1,3}[ -]?\d{2,4}[ -]?\d{3,4}[ -]?\d{3,4}'
    - '0\d{2,3}[ -]\d{3}[ -]\d{4}'
    - '(lives|live|living) at \d+'
  injection:
    - 'ignore (all |any |the |your )?(previous |earlier |above )?(instructions|rules|prompts?)'
    - 'system prompt'
    - 'developer mode'
    - 'you are now (a|an|the)'
    - 'disregard (the |your )?(rules|instructions)'
sensitivity:
  # TABLE CUR-25a "Sensitivity lint" and CUR-27: stereotypes, violence, unsafe procedures, brands, political content
  # and real people in content for minors.
  stereotype:
    - '(girls|women|boys|men) (are|is) (naturally )?(bad|worse|better|good|weak|stronger) at'
    - '(girls|women|boys|men) (can.t|cannot|should not|shouldn.t) (do|study|learn|understand)'
    - '(women|girls|wives) (should|must) (cook|clean|stay at home)'
    - 'primitive (people|tribes?)'
    - 'tribal (people|men|women)'
  unsafe_procedure:
    - 'taste (the |a |each )?(chemical|solution|acid|alkali|substance|product|powder)s?'
    - 'drink (the |a |some )?(acid|alkali|solution|chemical)s?'
    - 'mix(ing)? (bleach|household cleaners?)'
    - 'heat(ing)? (a |the )?sealed (container|can|tube|bottle)'
    - 'without (eye protection|goggles|safety glasses)'
    - 'at home with (acid|concentrated)'
  brand:
    case: sensitive
    patterns:
      - 'Coca-Cola'
      - 'Pepsi'
      - 'Fanta'
      - 'Sprite'
      - 'Toyota'
      - 'Honda'
      - 'Samsung'
      - 'iPhone'
      - 'Nike'
      - 'Adidas'
      - 'MTN'
      - 'Safaricom'
      - 'Airtel'
      - 'Dangote'
      - 'Nestl[eé]'
      - 'Unilever'
      - 'Google'
      - 'Facebook'
      - 'WhatsApp'
      - 'TikTok'
      - 'Microsoft'
      - 'Indomie'
      - 'Guinness'
      - 'Heineken'
      - 'McDonald.s'
      - 'KFC'
  political:
    - 'elections?'
    - 'electoral'
    - 'political part(y|ies)'
    - 'vote for'
    - 'presidents?'
    - 'presidential'
    - 'prime minister'
    - 'senators?'
    - 'governors?'
    - 'coup'
    - 'rebels?'
    - 'militia'
  real_person:
    case: sensitive
    patterns:
      - 'Buhari'
      - 'Tinubu'
      - 'Obasanjo'
      - 'Mandela'
      - 'Ramaphosa'
      - 'Zuma'
      - 'Kenyatta'
      - 'Ruto'
      - 'Museveni'
      - 'Mugabe'
      - 'Mnangagwa'
      - 'Nkrumah'
      - 'Akufo-Addo'
      - 'Mahama'
      - 'Kagame'
      - 'Obama'
      - 'Trump'
      - 'Biden'
      - 'Messi'
      - 'Ronaldo'
      - 'Beyonc[eé]'
      - 'Davido'
      - 'Wizkid'
      - 'Burna Boy'
      - 'Rihanna'
      - 'Elon Musk'
# Records whose text touches these topics are always in the safety review sample (CUR-27); they do not fail a build.
sensitive_topics:
  - 'reproduct\w*'
  - 'pregnan\w*'
  - 'contracept\w*'
  - 'sexual\w*'
  - 'HIV'
  - 'sexually transmitted'
  - 'diseases?'
  - 'drugs?'
  - 'alcoholic drinks?'
  - 'beer'
  - 'wine'
  - 'drunk\w*'
  - 'smoking'
  - 'smokers?'
  - 'cigarettes?'
  - 'tobacco'
  - 'cancer'
  - 'death'
  - 'radiation dose'
# Exact phrases a pattern above would catch but that are content for minors (each with its reason).
allow: []
