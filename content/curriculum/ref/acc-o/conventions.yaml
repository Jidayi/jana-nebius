  - profit and loss account
- key: acc.term.revenue
  value: revenue
  scope:
    subject: acc
    level: o
  synonyms:
  - sales
  - turnover
- key: acc.term.inventory
  value: inventory
  scope:
    subject: acc
    level: o
  synonyms:
  - stock
- key: acc.term.trade_receivables
  value: trade receivables
