  synonyms:
  - accruals
  - accrued expenses
- key: acc.term.other_receivables
  value: other receivables
  scope:
    subject: acc
    level: o
  synonyms:
  - prepayments
  - prepaid expenses
- key: acc.term.cash_discount
  value: cash discount
  scope:
    subject: acc
    level: o
  synonyms:
  - settlement discount
- key: acc.term.sales_returns
  value: sales returns
  scope:
    subject: acc
    level: o
  synonyms:
  - returns inwards
- key: acc.term.purchases_returns
  value: purchases returns
  scope:
