- key: mth.default_sf
  value: '3'
  scope:
    subject: mth
    level: o
  note: Answers that are not exact are given to 3 significant figures unless the item says otherwise.
- key: mth.angle_dp
  value: '1'
  unit: degrees
  scope:
    subject: mth
    level: o
  note: Angles that are not exact are given to 1 decimal place.
- key: mth.money_dp
  value: '2'
  scope:
    subject: mth
    level: o
  note: Money is given to 2 decimal places (cents).
- key: mth.currency
  value: $
  scope:
    subject: mth
    level: o
  synonyms:
  - dollar
  - dollars
  note: The default currency symbol; the locale overlay supplies the ISO 4217 code.
- key: mth.angle_unit
  value: degrees
  scope:
    subject: mth
    level: o
  note: Angles are in degrees.
- key: mth.pi
  value: calculator value
  scope:
    subject: mth
    level: o
  note: Use the calculator value of π unless the item gives another value.
- key: mth.right_angle
  value: '90'
  unit: degrees
  scope:
    subject: mth
    level: o
- key: mth.straight_angle
  value: '180'
  unit: degrees
  scope:
    subject: mth
    level: o
  note: Angles on a straight line and in a triangle add up to 180 degrees.
- key: mth.full_turn
  value: '360'
  unit: degrees
  scope:
    subject: mth
    level: o
  note: Angles around a point and the exterior angles of a polygon add up to 360 degrees.
- key: mth.percent
  value: '100'
  scope:
    subject: mth
    level: o
  note: Per cent means out of 100.
- key: mth.minutes_per_hour
  value: '60'
  scope:
    subject: mth
    level: o
  synonyms:
  - seconds per minute
- key: mth.hours_per_day
  value: '24'
  scope:
    subject: mth
    level: o
- key: mth.metric_thousand
  value: '1000'
  scope:
    subject: mth
    level: o
  note: 1 km = 1000 m, 1 kg = 1000 g, 1 litre = 1000 cm^3 = 1000 ml.
- key: mth.metric_hundred
  value: '100'
  scope:
    subject: mth
    level: o
  note: 1 m = 100 cm.
- key: mth.metric_ten
  value: '10'
  scope:
    subject: mth
    level: o
  note: 1 cm = 10 mm.
- key: mth.sphere_volume
  value: V = (4/3)πr^3
  scope:
    subject: mth
    level: o
- key: mth.cone_volume
  value: V = (1/3)πr^2h
  scope:
    subject: mth
    level: o
- key: mth.quadratic_formula
  value: x = (-b ± √(b^2 - 4ac)) / (2a)
  scope:
    subject: mth
    level: o
