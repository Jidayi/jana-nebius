- key: phy.g
  value: '9.8'
  unit: m/s^2
  scope:
    subject: phy
    level: o
  synonyms:
  - acceleration of free fall
  - g
  note: Items may set g = 10 m/s^2 instead (VER-12).
- key: phy.kmh_per_ms
  value: '3.6'
  unit: (km/h)/(m/s)
  scope:
    subject: phy
    level: o
  note: 1 m/s is 3.6 km/h.
- key: phy.default_sf
  value: '3'
  scope:
    subject: phy
    level: o
  note: Answers that are not exact are given to 3 significant figures unless the item says otherwise.
- key: phy.units
  value: SI
  scope:
    subject: phy
    level: o
  note: Quantities are in SI units (m, kg, s, A, K) and units derived from them unless the item states another unit; a numeric answer may be given in any equivalent unit.
- key: phy.gravitational_field_strength_unit
  value: N/kg
  scope:
    subject: phy
    level: o
  note: g is a gravitational field strength in N/kg and an acceleration in m/s^2; the two are the same.
- key: phy.c
  value: 3.0e8
  unit: m/s
  scope:
    subject: phy
    level: o
  synonyms:
  - speed of light in a vacuum
  - speed of electromagnetic waves
  note: Every electromagnetic wave travels at this speed in a vacuum (and very nearly in air).
- key: phy.e
  value: '1.6e-19'
  unit: C
  scope:
    subject: phy
    level: o
  synonyms:
  - charge on an electron
  - elementary charge
  note: The size of the charge on one electron or one proton.
- key: phy.kelvin_offset
  value: '273'
  unit: K
  scope:
    subject: phy
    level: o
  synonyms:
  - absolute zero is -273 °C
  note: Temperature in kelvin = temperature in °C + 273.
- key: phy.kwh_in_joules
  value: '3600000'
  unit: J
  scope:
    subject: phy
    level: o
  synonyms:
  - 1 kWh = 3.6 MJ
  note: One kilowatt-hour is 1 kW for 1 hour.
- key: phy.optics_sign_convention
  value: real_is_positive
  scope:
    subject: phy
    level: o
  synonyms:
  - real is positive
  note: Lens distances are measured from the lens; real objects and images count as positive and virtual ones as negative (CUR-28, VER-16).
- key: phy.standard_form
  value: A × 10^n
  scope:
    subject: phy
    level: o
  note: Very large and very small values are written with A from 1 up to 10 and a whole-number power n.
- key: phy.angle_unit
  value: degrees
  scope:
    subject: phy
    level: o
  note: Angles of incidence, refraction and reflection are measured from the normal, in degrees.
