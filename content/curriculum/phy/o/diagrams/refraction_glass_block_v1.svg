<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320">
  <title>Refraction through a glass block</title>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--color-diagram-stroke)"/>
    </marker>
  </defs>
  <g data-part="glass_block">
    <rect x="160" y="110" width="160" height="110" fill="var(--color-panel)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="330" y="126" font-size="13" fill="var(--color-ink)" data-label-for="glass_block">glass block</text>
  </g>
  <g data-part="incident_ray">
    <line x1="120" y1="30" x2="210" y2="110" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="30" y="30" font-size="13" fill="var(--color-ink)" data-label-for="incident_ray">incident ray</text>
  </g>
  <g data-part="normal_entry">
    <line x1="210" y1="50" x2="210" y2="170" stroke="var(--color-muted)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="216" y="58" font-size="13" fill="var(--color-ink)" data-label-for="normal_entry">normal</text>
  </g>
  <g data-part="angle_i">
    <path d="M210,75 A35,35 0 0,0 183.84,86.75" fill="none" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="190" y="72" font-size="13" fill="var(--color-ink)" data-label-for="angle_i">i</text>
  </g>
  <g data-part="refracted_ray">
    <line x1="210" y1="110" x2="260" y2="220" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="270" y="178" font-size="13" fill="var(--color-ink)" data-label-for="refracted_ray">refracted ray</text>
  </g>
  <g data-part="angle_r">
    <path d="M210,145 A35,35 0 0,0 224.48,141.86" fill="none" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="214" y="162" font-size="13" fill="var(--color-ink)" data-label-for="angle_r">r</text>
  </g>
  <g data-part="normal_exit">
    <line x1="260" y1="170" x2="260" y2="290" stroke="var(--color-muted)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="266" y="290" font-size="13" fill="var(--color-ink)" data-label-for="normal_exit">normal</text>
  </g>
  <g data-part="emergent_ray">
    <line x1="260" y1="220" x2="350" y2="300" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="356" y="300" font-size="13" fill="var(--color-ink)" data-label-for="emergent_ray">emergent ray</text>
  </g>
  <g data-arrow="arrow_in">
    <line x1="150" y1="56.67" x2="168" y2="72.67" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
  <g data-arrow="arrow_through">
    <line x1="228" y1="149.6" x2="236" y2="167.2" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
  <g data-arrow="arrow_out">
    <line x1="295" y1="251.11" x2="313" y2="267.11" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
</svg>
