<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <title>Measuring resistance with an ammeter and a voltmeter</title>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--color-diagram-stroke)"/>
    </marker>
  </defs>
  <path data-part="connecting_wires" d="M80,110 L80,60 L230,60 M242,60 L400,60 L400,220 L330,220 M270,220 L164,220 M136,220 L80,220 L80,150 M250,220 L250,270 L286,270 M314,270 L350,270 L350,220" fill="none" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
  <g data-part="cell">
    <line x1="230" y1="45" x2="230" y2="75" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <line x1="242" y1="52" x2="242" y2="68" stroke="var(--color-diagram-stroke)" stroke-width="3"/>
    <text x="222" y="35" font-size="13" fill="var(--color-ink)" data-label-for="cell">cell</text>
  </g>
  <g data-part="switch">
    <circle cx="80" cy="110" r="3" fill="var(--color-paper)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <circle cx="80" cy="150" r="3" fill="var(--color-paper)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <line x1="80" y1="147" x2="100" y2="116" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="20" y="135" font-size="13" fill="var(--color-ink)" data-label-for="switch">switch</text>
  </g>
  <g data-part="ammeter">
    <circle cx="150" cy="220" r="14" fill="var(--color-paper)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="150" y="225" font-size="13" text-anchor="middle" fill="var(--color-ink)">A</text>
    <text x="122" y="255" font-size="13" fill="var(--color-ink)" data-label-for="ammeter">ammeter</text>
  </g>
  <g data-part="resistor">
    <rect x="270" y="212" width="60" height="16" fill="var(--color-paper)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="272" y="204" font-size="13" fill="var(--color-ink)" data-label-for="resistor">resistor</text>
  </g>
  <g data-part="voltmeter">
    <circle cx="300" cy="270" r="14" fill="var(--color-paper)" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="300" y="275" font-size="13" text-anchor="middle" fill="var(--color-ink)">V</text>
    <text x="322" y="296" font-size="13" fill="var(--color-ink)" data-label-for="voltmeter">voltmeter</text>
  </g>
  <g data-arrow="arrow_current">
    <line x1="300" y1="60" x2="330" y2="60" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
</svg>
