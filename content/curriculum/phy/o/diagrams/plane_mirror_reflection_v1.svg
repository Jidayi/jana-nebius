<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320">
  <title>Reflection at a plane mirror</title>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--color-diagram-stroke)"/>
    </marker>
  </defs>
  <g data-part="incident_ray">
    <line x1="90" y1="100" x2="240" y2="250" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="40" y="90" font-size="13" fill="var(--color-ink)" data-label-for="incident_ray">incident ray</text>
  </g>
  <g data-part="normal">
    <line x1="240" y1="250" x2="240" y2="60" stroke="var(--color-muted)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="248" y="72" font-size="13" fill="var(--color-ink)" data-label-for="normal">normal</text>
  </g>
  <g data-part="angle_i">
    <path d="M240,200 A50,50 0 0,0 204.64,214.64" fill="none" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="218" y="192" font-size="13" fill="var(--color-ink)" data-label-for="angle_i">i</text>
  </g>
  <g data-part="reflected_ray">
    <line x1="240" y1="250" x2="390" y2="100" stroke="var(--color-diagram-stroke)" stroke-width="1.5"/>
    <text x="340" y="90" font-size="13" fill="var(--color-ink)" data-label-for="reflected_ray">reflected ray</text>
  </g>
  <g data-part="angle_r">
    <path d="M240,200 A50,50 0 0,1 275.36,214.64" fill="none" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="256" y="192" font-size="13" fill="var(--color-ink)" data-label-for="angle_r">r</text>
  </g>
  <g data-part="mirror">
    <line x1="60" y1="250" x2="420" y2="250" stroke="var(--color-diagram-stroke)" stroke-width="3"/>
    <path d="M70,250 L60,262 M100,250 L90,262 M130,250 L120,262 M160,250 L150,262 M190,250 L180,262 M220,250 L210,262 M250,250 L240,262 M280,250 L270,262 M310,250 L300,262 M340,250 L330,262 M370,250 L360,262 M400,250 L390,262" stroke="var(--color-diagram-stroke)" stroke-width="1"/>
    <text x="60" y="290" font-size="13" fill="var(--color-ink)" data-label-for="mirror">mirror</text>
  </g>
  <g data-arrow="arrow_in">
    <line x1="150" y1="160" x2="170" y2="180" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
  <g data-arrow="arrow_out">
    <line x1="310" y1="180" x2="330" y2="160" stroke="var(--color-diagram-stroke)" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
</svg>
