subject: phy
level: o
kc_ids:
- kc.phy.o.em_spectrum.uses_and_hazards
stem: Doctors use a beam of radiation from outside the body to kill cancer cells deep inside it.
parts:
- id: a
  prompt: Which radiation is used?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Ultraviolet
      correct: false
      misconception_id: mc.phy.o.penetration_order_confused
      feedback: Your skin stops visible light and ultraviolet; that is why you cannot see your bones. Only X-rays and gamma rays pass through soft tissue.
    - id: B
      text: Gamma rays
      correct: true
    - id: C
      text: Microwaves
      correct: false
      misconception_id: mc.phy.o.nonionising_called_ionising
      feedback: Only the high-frequency regions (X-rays and gamma rays, and the most energetic ultraviolet) can ionise atoms. Microwaves and infrared harm by heating.
    - id: D
      text: Radio waves
      correct: false
      misconception_id: mc.phy.o.nonionising_called_ionising
      feedback: Only the high-frequency regions (X-rays and gamma rays, and the most energetic ultraviolet) can ionise atoms. Microwaves and infrared harm by heating.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what each region does when it meets matter.
  - rung: 2
    name: concept
    text:
      en: Long-wavelength regions mostly carry signals or heat things; short-wavelength regions pass through soft tissue or damage cells.
  - rung: 3
    name: first_step
    text:
      en: Only the highest-frequency regions are ionising, and danger rises with frequency.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that give a region a property it does not have.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Gamma rays.'
  misconception_ids:
  - mc.phy.o.nonionising_called_ionising
  - mc.phy.o.penetration_order_confused
solution:
  steps:
  - n: 1
    latex: \text{Gamma rays}
    reason: Match the region to what it does to matter
