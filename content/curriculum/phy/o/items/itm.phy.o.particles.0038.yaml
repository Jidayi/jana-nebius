- kc.phy.o.particles.gas_pressure_particles
stem: A sealed glass jar of air is carried up a high mountain, and its temperature does not change.
parts:
- id: a
  prompt: What happens to the pressure of the air inside the jar?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It falls, because the thin air outside slows the particles inside
      correct: false
      misconception_id: mc.phy.o.compression_speeds_particles
      feedback: At constant temperature the particles keep the same average speed. Squeezed into less space, they reach each wall sooner and hit it more often, so the pressure rises.
    - id: B
      text: It rises, because the air in the jar now weighs more than the air outside
      correct: false
      misconception_id: mc.phy.o.gas_pressure_from_weight
      feedback: A balloon is pushed out evenly on every side, not only at the bottom. Gas pressure comes from particles striking every wall in random directions.
    - id: C
      text: It stays the same, because the particles' speed and spacing are unchanged
      correct: true
    - id: D
      text: It falls, because the particles shrink at height
      correct: false
      misconception_id: mc.phy.o.particles_grow_when_heated
      feedback: A water particle is the same size in ice, in water and in steam. Heating makes particles move faster and spread further apart; it does not make them bigger.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Pressure is a force on each square metre of a surface. What exerts force on the walls of a container of gas?
  - rung: 2
    name: concept
    text:
      en: Pressure inside depends only on what the particles inside are doing.
  - rung: 3
    name: first_step
    text:
      en: Ask whether the change alters how fast the particles move, how often they hit the walls, or both.
  - rung: 4
    name: worked_step
    text:
      en: Rule out explanations that rely on the weight of the gas or on particles changing size.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It stays the same, because the particles'' speed and spacing are unchanged.'
  misconception_ids:
  - mc.phy.o.compression_speeds_particles
  - mc.phy.o.gas_pressure_from_weight
  - mc.phy.o.particles_grow_when_heated
solution:
  steps:
  - n: 1
    latex: \text{It stays the same, because the particles' speed and spacing are unchanged}
    reason: Explain the pressure by collisions with the walls
