stem: A signal generator makes a loudspeaker vibrate at 2.5 kHz.
parts:
- id: a
  prompt: Find the period of the sound wave in milliseconds.
  marks: 2
  answer:
    kind: numeric
    value: '0.4'
    unit: ms
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_wav_0010_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Put the frequency in hertz first.
  - rung: 2
    name: concept
    text:
      en: The period is 1 divided by the frequency.
  - rung: 3
    name: first_step
    text:
      en: 2.5 kHz is 2500 Hz.
  - rung: 4
    name: worked_step
    text:
      en: T = 1 ÷ 2500 = 0.0004 s; now change seconds into milliseconds.
  - rung: 5
    name: full_step
    text:
      en: T = 0.4 ms.
  misconception_ids:
  - mc.phy.o.wave_prefix_ignored
  - mc.phy.o.period_frequency_confused
solution:
  steps:
  - n: 1
    latex: f = 2.5\ \text{kHz} = 2500\ \text{Hz}
    reason: A kilohertz is a thousand hertz
    check_id: chk_build_phy_wav_0010_hz
  - n: 2
    latex: T = \frac{1}{2500} = 0.0004\ \text{s}
    reason: Period = 1 ÷ frequency
    check_id: chk_build_phy_wav_0010_ts
  - n: 3
    latex: 0.0004\ \text{s} = 0.4\ \text{ms}
    reason: A second is a thousand milliseconds
    check_id: chk_build_phy_wav_0010_ans
