id: itm.phy.o.light.0074
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.light.converging_lens
stem: An object is placed 24 cm from a converging lens of focal length 8 cm.
parts:
- id: a
  prompt: Which describes the image?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Real, inverted and magnified
      correct: false
      misconception_id: mc.phy.o.lens_size_rule_reversed
      feedback: 'A camera photographs a whole building on a small sensor: far objects give small images. A projector puts the slide just beyond F to make a big image.'
    - id: B
      text: Real, upright and diminished
      correct: false
      misconception_id: mc.phy.o.lens_orientation_rule_swapped
      feedback: Rays cross over on their way to a real image, so it is upside down. A magnifying glass shows an upright, virtual image because the rays never cross.
    - id: C
      text: Real, inverted and diminished
      correct: true
    - id: D
      text: Virtual, upright and diminished
      correct: false
      misconception_id: mc.phy.o.lens_virtual_real_swapped
      feedback: 'Beyond F the rays from the object meet after the lens: a real image. Inside F they spread out after the lens and only seem to meet behind it: a virtual image.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Compare the object distance with f and with 2f.
  - rung: 2
    name: concept
    text:
      en: Beyond F a converging lens gives a real, inverted image; inside F a virtual, upright one.
  - rung: 3
    name: first_step
    text:
      en: Beyond 2F the image is diminished; between F and 2F it is magnified; inside F it is magnified.
  - rung: 4
    name: worked_step
    text:
      en: The lens formula gives v = 12 cm; compare its size with the object distance.
  - rung: 5
    name: full_step
    text:
      en: The image is real, inverted and diminished, as in a camera.
  misconception_ids:
  - mc.phy.o.lens_orientation_rule_swapped
  - mc.phy.o.lens_size_rule_reversed
  - mc.phy.o.lens_virtual_real_swapped
solution:
  steps:
  - n: 1
    latex: \frac{1}{v} = \frac{1}{8} - \frac{1}{24} \Rightarrow v = 12\ \text{cm}
    reason: v is positive, so the image is real and inverted
    check_id: chk_build_phy_lgt_0074_v
  - n: 2
    latex: '|v| \text{ compared with } u = 24\ \text{cm}'
    reason: 'The image is nearer than the object: diminished'
  - n: 3
    latex: \text{Real, inverted and diminished}
    reason: The image checked with the optics tool
    check_id: chk_build_phy_lgt_0074_tool
difficulty:
  prior: 0.3
  band: core
estimated_seconds: 70
