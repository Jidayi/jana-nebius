    args:
      focal_length: 8
      object_distance: '24'
      optic: converging_lens
      sign_convention: real_is_positive
      sign_convention_source: pack
      task: image
    tool: phys_optics
  chk_build_phy_lgt_0074_v:
    args:
      expression: 24*8/(24 - 8)
    tool: math_evaluate
