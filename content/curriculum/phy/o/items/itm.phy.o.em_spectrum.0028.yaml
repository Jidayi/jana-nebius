id: itm.phy.o.em_spectrum.0028
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.em_spectrum.em_wave_calculations
stem: A laser gives light of frequency 7 × 10¹⁴ Hz.
parts:
- id: a
  prompt: Calculate the wavelength of the light in nanometres.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 429 nm
      correct: true
    - id: B
      text: 4.29 × 10^-7 nm
      correct: false
      misconception_id: mc.phy.o.wave_prefix_ignored
      feedback: Put every value into hertz, metres and seconds before using a formula, then change the answer into the unit the question asks for.
    - id: C
      text: 2.33 × 10^15 nm
      correct: false
      misconception_id: mc.phy.o.wave_equation_inverted
      feedback: 'From v = fλ: λ = v/f and f = v/λ. The speed always goes on top when you divide.'
    - id: D
      text: 0.000486 nm
      correct: false
      misconception_id: mc.phy.o.em_uses_sound_speed
      feedback: Electromagnetic waves travel at about a million times the speed of sound. Use c = 3.0 × 10⁸ m/s for every one of them.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Light is an electromagnetic wave.
  - rung: 2
    name: concept
    text:
      en: It travels at c = 3.0 × 10⁸ m/s, and c = f × λ, so λ = c ÷ f.
  - rung: 3
    name: first_step
    text:
      en: λ = 3.0 × 10⁸ ÷ (7 × 10¹⁴) gives the wavelength in metres.
  - rung: 4
    name: worked_step
    text:
      en: λ = 4.29 × 10⁻⁷ m; now change metres into nanometres.
  - rung: 5
    name: full_step
    text:
      en: λ = 429 nm.
  misconception_ids:
  - mc.phy.o.em_uses_sound_speed
  - mc.phy.o.wave_equation_inverted
  - mc.phy.o.wave_prefix_ignored
solution:
  steps:
  - n: 1
    latex: \lambda = \frac{c}{f} = \frac{3.0 \times 10^{8}}{7 \times 10^{14}} = 4.29 \times 10^{-7}\ \text{m}
    reason: Rearrange c = fλ
    check_id: chk_build_phy_ems_0028_lmm
  - n: 2
    latex: 4.29 \times 10^{-7}\ \text{m} = 429\ \text{nm}
    reason: A metre is 10⁹ nanometres
    check_id: chk_build_phy_ems_0028_ans
