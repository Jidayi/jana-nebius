kc_ids:
- kc.phy.o.motion.solve_with_equation
stem: A cart moving at 5 m/s accelerates uniformly at 2.5 m/s² for 30 m.
parts:
- id: a
  prompt: Use v² = u² + 2as to find its final speed.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 175 m/s
      correct: false
      misconception_id: mc.phy.o.square_not_rooted
      feedback: If your equation gives the square of the unknown, take the square root as the last step.
    - id: B
      text: 11.2 m/s
      correct: false
      misconception_id: mc.phy.o.rearrange_sign_error
      feedback: 'Undo each step in turn: what was added on one side is subtracted from both.'
    - id: C
      text: 155 m/s
      correct: false
      misconception_id: mc.phy.o.squares_dropped
      feedback: 'The equation links the squares of the velocities: square u, add 2as, then take the square root of the total.'
    - id: D
      text: 13.2 m/s
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'List the known quantities: u, a and s.'
  - rung: 2
    name: concept
    text:
      en: The equation gives v squared, not v.
  - rung: 3
    name: first_step
    text:
      en: Work out u² + 2as first.
  - rung: 4
    name: worked_step
    text:
      en: v² = 175.
  - rung: 5
    name: full_step
    text:
      en: v = √175 = 13.2 m/s.
  misconception_ids:
  - mc.phy.o.rearrange_sign_error
  - mc.phy.o.square_not_rooted
  - mc.phy.o.squares_dropped
solution:
  steps:
  - n: 1
    latex: v^2 = 5^2 + 2 \times 2.5 \times 30 = 175
    reason: Substitute
    check_id: chk_build_phy_mot_0335_sq
  - n: 2
    latex: v = \sqrt{175} = 13.2\ \text{m/s}
    reason: Square root
    check_id: chk_build_phy_mot_0335_ans
