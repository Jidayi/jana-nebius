stem: In June it is summer in Europe.
parts:
- id: a
  prompt: What season is it in South Africa in June?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Summer, because the whole Earth is nearest the Sun in June
      correct: false
      misconception_id: mc.phy.o.sun_distance_causes_seasons
      feedback: 'When it is summer in the north it is winter in the south, at the same distance from the Sun. Seasons come from the tilt: a higher Sun and longer days.'
    - id: B
      text: Summer, because seasons are the same all over the world
      correct: false
      misconception_id: mc.phy.o.seasons_same_both_hemispheres
      feedback: In June the north leans towards the Sun and has summer while the south leans away and has winter. The seasons in the two halves are always opposite.
    - id: C
      text: Spring, because the Earth has spun half way round
      correct: false
      misconception_id: mc.phy.o.earth_spin_orbit_confused
      feedback: 'Spin on the axis: one day, giving day and night. Trip round the Sun: one year. Picture a dancer turning while walking round a lamp.'
    - id: D
      text: Winter
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Separate the three motions: the Earth''s spin, the Earth''s orbit and the Moon''s orbit.'
  - rung: 2
    name: concept
    text:
      en: The spin takes a day, the Earth's orbit a year, and the Moon's orbit roughly a month.
  - rung: 3
    name: first_step
    text:
      en: Seasons come from the tilt of the Earth's axis; phases come from how much of the Moon's sunlit half we see.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these facts.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Winter.'
  misconception_ids:
  - mc.phy.o.earth_spin_orbit_confused
  - mc.phy.o.seasons_same_both_hemispheres
  - mc.phy.o.sun_distance_causes_seasons
