stem: A resistor of 2 kΩ is connected across a 1.5 V supply.
parts:
- id: a
  prompt: Calculate the current in the resistor, in mA.
  marks: 2
  answer:
    kind: numeric
    value: '0.75'
    unit: mA
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0047_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A bigger resistance lets less current through for the same p.d.
  - rung: 2
    name: concept
    text:
      en: I = V ÷ R, with R in ohms.
  - rung: 3
    name: first_step
    text:
      en: Change the resistance into ohms, then the current from amps into milliamps.
  - rung: 4
    name: worked_step
    text:
      en: Divide 1.5 V by 2000 Ω.
  - rung: 5
    name: full_step
    text:
      en: I = 0.000750 A = 0.75 mA.
  misconception_ids:
  - mc.phy.o.ohm_law_upside_down
  - mc.phy.o.ohm_law_multiplied
  - mc.phy.o.kilo_prefix_ignored
solution:
