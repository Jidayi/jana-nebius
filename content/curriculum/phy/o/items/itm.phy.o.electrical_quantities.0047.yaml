  - n: 1
    latex: R = 2\ \text{k}\Omega = 2000\ \Omega
    reason: A thousand ohms in 1 kΩ
    check_id: chk_build_phy_elq_0047_ro
  - n: 2
    latex: I = \frac{V}{R} = \frac{1.5}{2000} = 0.000750\ \text{A}
    reason: Current = p.d. ÷ resistance
    check_id: chk_build_phy_elq_0047_ia
  - n: 3
    latex: I = 0.75\ \text{mA}
    reason: A thousand mA in 1 A
    check_id: chk_build_phy_elq_0047_ans
