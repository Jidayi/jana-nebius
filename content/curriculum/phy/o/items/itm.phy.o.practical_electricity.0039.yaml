subject: phy
level: o
kc_ids:
- kc.phy.o.practical_electricity.fuses_and_safety
stem: A washing machine has a metal case connected to the earth wire.
parts:
- id: a
  prompt: What is the job of the earth wire?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: To carry the current back from the motor in normal use
      correct: false
      misconception_id: mc.phy.o.earth_wire_carries_working_current
      feedback: 'In normal use the earth wire carries no current: live and neutral carry it. The earth wire carries current only when a fault makes the case live.'
    - id: B
      text: 'Nothing useful: the fuse alone stops users getting a shock'
      correct: false
      misconception_id: mc.phy.o.fuse_protects_person_from_shock
      feedback: A fuse melts when the current is too large for the cable. A current big enough to kill is far smaller than most fuse ratings, so the earth wire and insulation protect people.
    - id: C
      text: To act as the neutral wire if the neutral breaks
      correct: false
      misconception_id: mc.phy.o.neutral_and_earth_same
      feedback: The neutral wire carries the working current back. The earth wire joins a metal case to the ground and carries current only in a fault.
    - id: D
      text: To carry current safely to the ground if the case becomes live
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what each wire or device is for.
  - rung: 2
    name: concept
    text:
      en: Live is at a high voltage, neutral stays near 0 V, and earth carries current only in a fault.
  - rung: 3
    name: first_step
    text:
      en: A fuse or switch must cut the appliance off from the high voltage when it opens.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that mix up the jobs of the different wires and devices.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: to carry current safely to the ground if the case becomes live.'
  misconception_ids:
  - mc.phy.o.earth_wire_carries_working_current
  - mc.phy.o.fuse_protects_person_from_shock
  - mc.phy.o.neutral_and_earth_same
