stem: Smoke in a lit glass cell is viewed under a microscope. Bright specks of smoke jiggle about at random.
parts:
- id: a
  prompt: What causes this movement?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The specks are the air molecules themselves, seen moving
      correct: false
      misconception_id: mc.phy.o.brownian_molecules_seen
      feedback: Air and water molecules are far too small to see, even with a microscope. The specks are much bigger smoke or pollen particles, jostled by the invisible molecules hitting them.
    - id: B
      text: Each speck pushes itself along as it burns
      correct: false
      misconception_id: mc.phy.o.brownian_not_from_collisions
      feedback: A draught would carry all the specks the same way. Each speck jerks about on its own path, which only random hits from many tiny molecules can explain.
    - id: C
      text: Gentle draughts of air carry the specks around
      correct: false
      misconception_id: mc.phy.o.brownian_not_from_collisions
      feedback: A draught would carry all the specks the same way. Each speck jerks about on its own path, which only random hits from many tiny molecules can explain.
    - id: D
      text: Air molecules, too small to see, strike the specks unevenly from all sides
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Picture the particles: how close together are they, and how do they move?'
  - rung: 2
    name: concept
    text:
      en: Each speck moves on its own zig-zag path, changing direction suddenly and at random.
  - rung: 3
    name: first_step
    text:
      en: 'Test each option against how the material behaves: does it keep its shape, flow, or spread out?'
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that give single particles the properties of the whole material.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Air molecules, too small to see, strike the specks unevenly from all sides.'
  misconception_ids:
  - mc.phy.o.brownian_molecules_seen
  - mc.phy.o.brownian_not_from_collisions
