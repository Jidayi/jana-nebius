stem: An experiment shows that the critical angle of a type of glass is 39°.
parts:
- id: a
  prompt: Calculate its refractive index.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '1.59'
      correct: true
    - id: B
      text: '0.629'
      correct: false
      misconception_id: mc.phy.o.critical_sine_not_inverted
      feedback: sin C = 1 ÷ n, so n = 1 ÷ sin C. A refractive index is more than one, while a sine is never more than one.
    - id: C
      text: '2.31'
      correct: false
      misconception_id: mc.phy.o.snell_angles_not_sines
      feedback: 'Angles do not scale in proportion here: doubling an angle does not double its sine. Take the sine of each angle first, then use the ratio.'
    - id: D
      text: '1.29'
      correct: false
      misconception_id: mc.phy.o.refraction_angles_from_surface
      feedback: Draw the normal at right angles to the surface where the ray crosses it. Every angle in the refraction formula is measured from that normal.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Link the critical angle to the refractive index.
  - rung: 2
    name: concept
    text:
      en: sin C = 1 ÷ n, so n = 1 ÷ sin C.
  - rung: 3
    name: first_step
    text:
      en: Find sin 39° first.
  - rung: 4
    name: worked_step
    text:
      en: sin C = 0.629; divide 1 by it.
  - rung: 5
    name: full_step
    text:
      en: The refractive index is 1.59.
  misconception_ids:
  - mc.phy.o.critical_sine_not_inverted
  - mc.phy.o.refraction_angles_from_surface
  - mc.phy.o.snell_angles_not_sines
solution:
  steps:
  - n: 1
    latex: \sin 39^\circ = 0.629
    reason: Sine of the critical angle
    check_id: chk_build_phy_lgt_0060_sc
  - n: 2
    latex: n = \frac{1}{\sin C} = \frac{1}{0.629} = 1.59
    reason: From sin C = 1 / n
    check_id: chk_build_phy_lgt_0060_ans
