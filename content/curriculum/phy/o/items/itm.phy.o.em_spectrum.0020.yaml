id: itm.phy.o.em_spectrum.0020
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.em_spectrum.em_wave_calculations
stem: A laser gives light of frequency 4.6 × 10¹⁴ Hz.
parts:
- id: a
  prompt: Calculate the wavelength of the light in nanometres.
  marks: 2
  answer:
    kind: numeric
    value: '652'
    unit: nm
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_ems_0020_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Light is an electromagnetic wave.
  - rung: 2
    name: concept
    text:
      en: It travels at c = 3.0 × 10⁸ m/s, and c = f × λ, so λ = c ÷ f.
  - rung: 3
    name: first_step
    text:
      en: λ = 3.0 × 10⁸ ÷ (4.6 × 10¹⁴) gives the wavelength in metres.
  - rung: 4
    name: worked_step
    text:
      en: λ = 6.52 × 10⁻⁷ m; now change metres into nanometres.
  - rung: 5
    name: full_step
    text:
      en: λ = 652 nm.
  misconception_ids:
  - mc.phy.o.wave_prefix_ignored
  - mc.phy.o.wave_equation_inverted
  - mc.phy.o.em_uses_sound_speed
solution:
  steps:
  - n: 1
    latex: \lambda = \frac{c}{f} = \frac{3.0 \times 10^{8}}{4.6 \times 10^{14}} = 6.52 \times 10^{-7}\ \text{m}
    reason: Rearrange c = fλ
    check_id: chk_build_phy_ems_0020_lmm
  - n: 2
    latex: 6.52 \times 10^{-7}\ \text{m} = 652\ \text{nm}
    reason: A metre is 10⁹ nanometres
    check_id: chk_build_phy_ems_0020_ans
difficulty:
  prior: 0.5
  band: core
estimated_seconds: 90
exam_style:
  paper_style: objective
  total_marks: 2
  calculator: true
