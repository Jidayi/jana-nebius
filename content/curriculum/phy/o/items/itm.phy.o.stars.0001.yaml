id: itm.phy.o.stars.0001
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.stars.light_years
stem: Light travels at 3.0 × 10⁸ m/s. Take one year as 365 days.
parts:
- id: a
  prompt: Calculate the length of one light-year in metres.
  marks: 2
  answer:
    kind: numeric
    value: 9.46e15
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_str_0001_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'A light-year is a distance: how far light goes in a year.'
  - rung: 2
    name: concept
    text:
      en: Distance = speed × time, with the time in seconds.
  - rung: 3
    name: first_step
    text:
      en: Change 365 days into seconds first.
  - rung: 4
    name: worked_step
    text:
      en: A year is 31536000 s; multiply by 3.0 × 10⁸ m/s.
  - rung: 5
    name: full_step
    text:
      en: One light-year is 9.46 × 10¹⁵ m.
  misconception_ids:
  - mc.phy.o.light_year_missing_seconds
  - mc.phy.o.year_seconds_factor_missed
  - mc.phy.o.light_year_is_time
solution:
  steps:
  - n: 1
    latex: 1\ \text{year} = 365\ \text{days} = 31536000\ \text{s}
    reason: A year in seconds
    check_id: chk_build_phy_str_0001_ts
  - n: 2
    latex: d = 3.0 \times 10^{8} \times 31536000 = 9.46 \times 10^{15}\ \text{m}
    reason: Distance = speed × time
    check_id: chk_build_phy_str_0001_ans_m
difficulty:
  prior: 0.1
  band: core
estimated_seconds: 80
exam_style:
  paper_style: objective
  total_marks: 2
  calculator: true
context_tags:
- none
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_phy_str_0001_ans:
    args:
      constants:
      - source: pack
        symbol: c
      expression: c*31536000
      sf: 3
    tool: math_evaluate
  chk_build_phy_str_0001_ans_m:
    args:
      constants:
      - source: pack
        symbol: c
      expression: (c*31536000)/10^(15)
      sf: 3
    tool: math_evaluate
  chk_build_phy_str_0001_ts:
    args:
      quantity: 365 day
      to: s
    tool: units_convert
