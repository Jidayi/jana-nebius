stem: Iron filings are sprinkled on card over a bar magnet and the card is tapped.
parts:
- id: a
  prompt: Where do most of the filings collect?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Along the middle of the magnet
      correct: false
      misconception_id: mc.phy.o.field_strongest_at_middle
      feedback: Iron filings pile up at the ends of a bar magnet and hardly at all at its middle. The field is strongest at the poles.
    - id: B
      text: Only on the lines drawn in the textbook diagram
      correct: false
      misconception_id: mc.phy.o.field_only_on_drawn_lines
      feedback: A compass placed between two drawn lines still turns. The lines show the field's direction and strength; the field is everywhere near the magnet.
    - id: C
      text: Round the two ends of the magnet
      correct: true
    - id: D
      text: Where the field lines are furthest apart
      correct: false
      misconception_id: mc.phy.o.field_lines_spacing_reversed
      feedback: Lines crowd together at the poles, where the field is strongest. The closer the lines, the stronger the field.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture a small plotting compass placed at that point near the magnet.
  - rung: 2
    name: concept
    text:
      en: Field lines run from north to south outside a magnet, never cross, and are closest where the field is strongest, at the poles.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: The filings gather where the field is strongest, at the poles.
  - rung: 5
    name: full_step
    text:
      en: Round the two ends of the magnet. The filings gather where the field is strongest, at the poles.
  misconception_ids:
  - mc.phy.o.field_lines_spacing_reversed
  - mc.phy.o.field_only_on_drawn_lines
  - mc.phy.o.field_strongest_at_middle
