id: itm.phy.o.thermal_properties.0052
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.changes_of_state
stem: Molten lead is left to cool and becomes solid.
parts:
- id: a
  prompt: What does the lead do while it is freezing?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It gives out energy while its temperature stays constant
      correct: true
    - id: B
      text: It takes in energy from the room while it freezes
      correct: false
      misconception_id: mc.phy.o.state_change_energy_direction_reversed
      feedback: Pulling particles apart (melting, boiling) needs energy. When they come back together (freezing, condensing) the same energy is given out, which is why steam scalds so badly.
    - id: C
      text: It keeps cooling steadily as it freezes
      correct: false
      misconception_id: mc.phy.o.temperature_rises_during_melting
      feedback: 'While a pure substance changes state its temperature stays constant: the energy goes into separating the particles, not into speeding them up.'
    - id: D
      text: It neither gains nor loses energy
      correct: false
      misconception_id: mc.phy.o.no_energy_when_temperature_constant
      feedback: The heater is still on during the flat part, so energy is still going in. It is used to pull particles apart instead of raising the temperature.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Think about what the energy does to the particles: speed them up, or separate them.'
  - rung: 2
    name: concept
    text:
      en: Freezing is the reverse of melting.
  - rung: 3
    name: first_step
    text:
      en: During a change of state of a pure substance, ask what happens to the temperature and to the energy.
  - rung: 4
    name: worked_step
    text:
      en: Remember that evaporation happens at the surface and that only some particles escape.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It gives out energy while its temperature stays constant.'
  misconception_ids:
  - mc.phy.o.no_energy_when_temperature_constant
  - mc.phy.o.state_change_energy_direction_reversed
  - mc.phy.o.temperature_rises_during_melting
