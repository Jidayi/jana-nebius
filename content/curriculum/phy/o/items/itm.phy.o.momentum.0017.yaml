id: itm.phy.o.momentum.0017
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.momentum.conservation_of_momentum
stem: A skater of mass 50 kg standing on ice throws a 5 kg bag forwards at 6 m/s. Everything starts at rest. Take the direction in which the bag moves as positive.
parts:
- id: a
  prompt: Find the velocity of the skater just afterwards.
  marks: 3
  answer:
    kind: numeric
    value: '-0.6'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mom_0017_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: What was the total momentum before?
  - rung: 2
    name: concept
    text:
      en: The total momentum before is zero, so afterwards the two momenta must cancel.
  - rung: 3
    name: first_step
    text:
      en: The momentum of the skater is equal in size and opposite in sign to the momentum of the bag.
  - rung: 4
    name: worked_step
    text:
      en: The bag has momentum 30 kg m/s, so the skater has the same size of momentum, negative.
  - rung: 5
    name: full_step
    text:
      en: 'V = −30 ÷ 50 = -0.6 m/s: the skater moves backwards.'
  misconception_ids:
  - mc.phy.o.recoil_sign_dropped
  - mc.phy.o.recoil_equal_speeds
  - mc.phy.o.conservation_masses_swapped
solution:
  steps:
  - n: 1
    latex: p_\text{before} = 0
    reason: Everything starts at rest
  - n: 2
    latex: 5 \times 6 = 30\ \text{kg m/s}
    reason: Momentum of the bag
    check_id: chk_build_phy_mom_0017_pf
  - n: 3
    latex: 0 = 30 + 50V \Rightarrow V = -0.6\ \text{m/s}
    reason: Total momentum stays zero
    check_id: chk_build_phy_mom_0017_ans
