stem: Ultrasound is used in medicine and industry.
parts:
- id: a
  prompt: Which statement about ultrasound is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It is a longitudinal wave that needs a medium
      correct: true
    - id: B
      text: It is an electromagnetic wave that can cross a vacuum
      correct: false
      misconception_id: mc.phy.o.ultrasound_is_em
      feedback: 'Ultrasound is sound: a longitudinal vibration of particles that needs a medium. Only its frequency is beyond our hearing.'
    - id: C
      text: It is a transverse wave
      correct: false
      misconception_id: mc.phy.o.sound_called_transverse
      feedback: 'Sound is longitudinal: the particles move back and forth along the direction the sound travels, making compressions and rarefactions.'
    - id: D
      text: It is an ionising radiation
      correct: false
      misconception_id: mc.phy.o.ultrasound_ionising
      feedback: Ultrasound is a sound wave, a vibration of particles. It does not ionise atoms, which is why it is used to scan unborn babies.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Ultrasound is sound with a frequency above the range of human hearing.
  - rung: 2
    name: concept
    text:
      en: It travels as compressions and rarefactions through a material, and reflects from boundaries between materials.
  - rung: 3
    name: first_step
    text:
      en: It does not ionise atoms, and a scanner builds its picture from the timing of echoes.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that treat ultrasound as something else.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It is a longitudinal wave that needs a medium.'
  misconception_ids:
