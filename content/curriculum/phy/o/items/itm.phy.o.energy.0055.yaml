id: itm.phy.o.energy.0055
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.energy_conversion
stem: A roller-coaster car starts from rest at a point 20 m above the ground and rolls down to a point 8 m above the ground. Ignore friction and take g = 10 N/kg.
parts:
- id: a
  prompt: Calculate its speed at the lower point.
  marks: 3
  answer:
    kind: numeric
    value: '15.5'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_nrg_0055_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The gravitational store empties as the kinetic store fills.
  - rung: 2
    name: concept
    text:
      en: Set mgΔh = ½mv²; the mass cancels, so v² = 2gΔh.
  - rung: 3
    name: first_step
    text:
      en: The drop in height is 12 m.
  - rung: 4
    name: worked_step
    text:
      en: v² = 2 × 10 × 12 = 240; take the square root.
  - rung: 5
    name: full_step
    text:
      en: The speed is 15.5 m/s.
  misconception_ids:
  - mc.phy.o.conversion_two_dropped
  - mc.phy.o.ke_speed_not_rooted
  - mc.phy.o.gpe_height_not_change
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: \Delta h = 20 - 8 = 12\ \text{m}
    reason: The drop in height
    check_id: chk_build_phy_nrg_0055_dh
  - n: 2
    latex: mg\Delta h = \frac{1}{2}mv^2 \Rightarrow v^2 = 2g\Delta h
    reason: Energy lost from the gravitational store = energy gained by the kinetic store; m cancels
  - n: 3
    latex: v^2 = 2 \times 10 \times 12 = 240
    reason: Substitute
    check_id: chk_build_phy_nrg_0055_vsq
  - n: 4
    latex: v = \sqrt{240} = 15.5\ \text{m/s}
    reason: Square root
    check_id: chk_build_phy_nrg_0055_ans
