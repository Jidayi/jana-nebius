stem: A coconut of mass 1.5 kg falls from rest through a height of 3.2 m. Ignore air resistance and take g = 10 N/kg.
parts:
- id: a
  prompt: Calculate its speed just before it lands.
  marks: 3
  answer:
    kind: numeric
    value: '8'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_nrg_0046_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The gravitational store empties as the kinetic store fills.
  - rung: 2
    name: concept
    text:
      en: Set mgΔh = ½mv²; the mass cancels, so v² = 2gΔh.
  - rung: 3
    name: first_step
    text:
      en: The drop in height is 3.2 m.
  - rung: 4
    name: worked_step
    text:
      en: v² = 2 × 10 × 3.2 = 64; take the square root.
  - rung: 5
    name: full_step
    text:
      en: The speed is 8 m/s.
  misconception_ids:
  - mc.phy.o.conversion_two_dropped
  - mc.phy.o.ke_speed_not_rooted
  - mc.phy.o.conversion_mass_not_cancelled
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: mg\Delta h = \frac{1}{2}mv^2 \Rightarrow v^2 = 2g\Delta h
    reason: Energy lost from the gravitational store = energy gained by the kinetic store; m cancels
  - n: 2
    latex: v^2 = 2 \times 10 \times 3.2 = 64
    reason: Substitute
    check_id: chk_build_phy_nrg_0046_vsq
  - n: 3
    latex: v = \sqrt{64} = 8\ \text{m/s}
    reason: Square root
    check_id: chk_build_phy_nrg_0046_ans
