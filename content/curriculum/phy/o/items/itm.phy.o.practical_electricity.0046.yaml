id: itm.phy.o.practical_electricity.0046
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.practical_electricity.fuses_and_safety
stem: A 1.2 kW toaster runs from the 240 V mains supply.
parts:
- id: a
  prompt: Calculate the normal working current, which the fuse in its plug must be able to carry.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 288000 A
      correct: false
      misconception_id: mc.phy.o.electric_power_current_multiplied
      feedback: P = IV, so I = P ÷ V. A 230 V kettle carries a few amps, not hundreds of thousands.
    - id: B
      text: 0.2 A
      correct: false
      misconception_id: mc.phy.o.electric_power_current_inverted
      feedback: 'A more powerful appliance on the same supply needs more current, so power goes on top: I = P ÷ V.'
    - id: C
      text: 5 A
      correct: true
    - id: D
      text: 0.005 A
      correct: false
      misconception_id: mc.phy.o.electric_power_kw_not_converted
      feedback: 1 kW is a thousand watts. Change kW into W before using P = IV or E = Pt in joules.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Power, current and p.d. are linked by P = IV.
  - rung: 2
    name: concept
    text:
      en: 'Rearrange it to find the current: I = P ÷ V.'
  - rung: 3
    name: first_step
    text:
      en: Change the power from kilowatts into watts first.
  - rung: 4
    name: worked_step
    text:
      en: The power is 1200 W; divide by 240 V.
  - rung: 5
    name: full_step
    text:
      en: The current is 5 A.
  misconception_ids:
  - mc.phy.o.electric_power_current_inverted
  - mc.phy.o.electric_power_current_multiplied
  - mc.phy.o.electric_power_kw_not_converted
solution:
  steps:
  - n: 1
    latex: P = 1.2\ \text{kW} = 1200\ \text{W}
    reason: Power in watts
    check_id: chk_build_phy_pel_0046_pw
  - n: 2
    latex: I = \frac{P}{V} = \frac{1200}{240} = 5\ \text{A}
    reason: Rearrange P = IV
    check_id: chk_build_phy_pel_0046_ans
