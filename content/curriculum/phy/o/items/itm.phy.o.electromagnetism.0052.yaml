stem: A transformer for a phone charger works from the 230 V mains. The secondary coil has 48 turns and the output is 24 V.
parts:
- id: a
  prompt: Calculate the number of turns on the primary coil.
  marks: 2
  answer:
    kind: numeric
    value: '460'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_emg_0052_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The voltages across the two coils are in the same ratio as their numbers of turns.
  - rung: 2
    name: concept
    text:
      en: Vs ÷ Vp = Ns ÷ Np.
  - rung: 3
    name: first_step
    text:
      en: Rearrange the equation to make Np the subject.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 48 turns by 230 and divide by 24.
  - rung: 5
    name: full_step
    text:
      en: The primary coil has 460 turns.
  misconception_ids:
  - mc.phy.o.turns_ratio_inverted
  - mc.phy.o.turns_ratio_not_divided
  - mc.phy.o.turns_ratio_given_as_answer
solution:
  steps:
  - n: 1
    latex: \frac{V_s}{V_p} = \frac{N_s}{N_p}
    reason: Voltages are in the ratio of the turns
  - n: 2
    latex: N_p = N_s \times \frac{V_p}{V_s} = 48 \times \frac{230}{24} = 460\ \text{turns}
    reason: Rearrange for N_p
    check_id: chk_build_phy_emg_0052_ans
