id: itm.phy.o.energy.0057
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.energy_conversion
stem: A bean bag is thrown straight up at 6 m/s. Ignore air resistance and take g = 9.8 N/kg.
parts:
- id: a
  prompt: Calculate the greatest height it rises above the point where it was thrown.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 3.67 m
      correct: false
      misconception_id: mc.phy.o.conversion_two_dropped
      feedback: 'From mgh = ½mv², multiply both sides by 2 and cancel m: v² = 2gh, and so h = v² ÷ 2g.'
    - id: B
      text: 1.84 m
      correct: true
    - id: C
      text: 0.306 m
      correct: false
      misconception_id: mc.phy.o.ke_speed_not_squared
      feedback: 'Try a speed of 2 m/s and then 4 m/s: the kinetic energy goes up four times, not twice. The speed is squared.'
    - id: D
      text: 18 m
      correct: false
      misconception_id: mc.phy.o.energy_mass_for_weight
      feedback: Lifting works against the weight, mg, in newtons. Multiply the mass by g before you multiply by the height.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: At the highest point the speed is zero, so all the kinetic energy has gone to the gravitational store.
  - rung: 2
    name: concept
    text:
      en: Set ½mv² = mgh; the mass cancels, so h = v² ÷ 2g.
  - rung: 3
    name: first_step
    text:
      en: v² = 6² = 36.
  - rung: 4
    name: worked_step
    text:
      en: Work out 36 ÷ (2 × 9.8).
  - rung: 5
    name: full_step
    text:
      en: The greatest height is 1.84 m.
  misconception_ids:
  - mc.phy.o.conversion_two_dropped
  - mc.phy.o.energy_mass_for_weight
  - mc.phy.o.ke_speed_not_squared
solution:
  steps:
  - n: 1
    latex: \frac{1}{2}mv^2 = mgh \Rightarrow h = \frac{v^2}{2g}
    reason: Kinetic energy becomes gravitational potential energy; m cancels
  - n: 2
    latex: v^2 = 6^2 = 36
    reason: The speed squared
    check_id: chk_build_phy_nrg_0057_vsq
  - n: 3
    latex: h = \frac{36}{2 \times 9.8} = 1.84\ \text{m}
    reason: Substitute
    check_id: chk_build_phy_nrg_0057_ans
