stem: Pairs of waves are listed.
parts:
- id: a
  prompt: Which pair are both longitudinal?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Sound and light
      correct: false
      misconception_id: mc.phy.o.light_called_longitudinal
      feedback: 'Every electromagnetic wave is transverse: its electric and magnetic fields vibrate at right angles to the direction it travels.'
    - id: B
      text: Ripples on water and sound
      correct: false
      misconception_id: mc.phy.o.ripples_called_longitudinal
      feedback: 'Watch a floating cork: it moves up and down while the ripples spread out across the water. That is a transverse wave.'
