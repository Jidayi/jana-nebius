id: itm.phy.o.light.0029
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.light.refraction
stem: A ray of light passes from air into a glass prism. The angle of incidence is 55° and the angle of refraction is 33°.
parts:
- id: a
  prompt: Calculate the refractive index of the material.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '0.665'
      correct: false
      misconception_id: mc.phy.o.snell_ratio_inverted
      feedback: 'Light bends towards the normal in glass, so the angle in air is the larger one: n = sin i ÷ sin r with i in air. A refractive index is always more than one.'
    - id: B
      text: '1.50'
      correct: true
    - id: C
      text: '1.67'
      correct: false
      misconception_id: mc.phy.o.snell_angles_not_sines
      feedback: 'Angles do not scale in proportion here: doubling an angle does not double its sine. Take the sine of each angle first, then use the ratio.'
    - id: D
      text: '0.684'
      correct: false
      misconception_id: mc.phy.o.refraction_angles_from_surface
      feedback: Draw the normal at right angles to the surface where the ray crosses it. Every angle in the refraction formula is measured from that normal.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Which angle is in air and which is in the material?
  - rung: 2
    name: concept
    text:
      en: Refractive index n = sin i ÷ sin r, with i in air and r in the material.
  - rung: 3
    name: first_step
    text:
      en: Find sin 55° and sin 33°.
  - rung: 4
    name: worked_step
    text:
      en: sin i = 0.819 and sin r = 0.545; divide the first by the second.
  - rung: 5
    name: full_step
    text:
      en: The refractive index is 1.50.
  misconception_ids:
  - mc.phy.o.refraction_angles_from_surface
  - mc.phy.o.snell_angles_not_sines
  - mc.phy.o.snell_ratio_inverted
solution:
  steps:
  - n: 1
    latex: \sin 55^\circ = 0.819
    reason: Sine of the angle in air
    check_id: chk_build_phy_lgt_0029_si
  - n: 2
    latex: \sin 33^\circ = 0.545
    reason: Sine of the angle in the material
    check_id: chk_build_phy_lgt_0029_sr
  - n: 3
    latex: n = \frac{\sin 55^\circ}{\sin 33^\circ} = 1.50
    reason: n = sin i / sin r
    check_id: chk_build_phy_lgt_0029_ans
