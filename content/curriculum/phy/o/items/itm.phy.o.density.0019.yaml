stem: A measuring cylinder holds water up to the 50 cm³ mark. When 5 identical pebbles are dropped in, the level rises to 57.5 cm³.
parts:
- id: a
  prompt: Find the volume of one of them.
  marks: 2
  answer:
    kind: numeric
    value: '1.5'
    unit: cm^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_den_0019_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The rise in the water level is the total volume of everything dropped in.
  - rung: 2
    name: concept
    text:
      en: Final reading − starting reading gives the volume of all of them together.
  - rung: 3
    name: first_step
    text:
      en: Then share that volume among the 5 of them.
  - rung: 4
    name: worked_step
    text:
      en: Together they have a volume of 7.5 cm³; divide by 5.
  - rung: 5
    name: full_step
    text:
      en: Each has a volume of 1.5 cm³.
  misconception_ids:
  - mc.phy.o.repeat_not_divided
  - mc.phy.o.displacement_final_reading_as_volume
  - mc.phy.o.repeat_multiplied
solution:
  steps:
  - n: 1
    latex: V = 57.5 - 50 = 7.5\ \text{cm}^3
    reason: The rise in level is their total volume
    check_id: chk_build_phy_den_0019_v
  - n: 2
    latex: \frac{7.5}{5} = 1.5\ \text{cm}^3
    reason: Share the total equally
    check_id: chk_build_phy_den_0019_ans
