id: itm.phy.o.light.0068
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.light.converging_lens
stem: A converging lens of focal length 10 cm is used as a magnifying glass. A stamp is 6 cm from the lens.
parts:
- id: a
  prompt: Calculate the magnification of the image.
  marks: 3
  answer:
    kind: numeric
    value: '2.5'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_lgt_0068_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The stamp is closer than the focal point, so the image is virtual and upright.
  - rung: 2
    name: concept
    text:
      en: Use 1/v = 1/f − 1/u; a negative v means a virtual image.
  - rung: 3
    name: first_step
    text:
      en: Work out 1/10 − 1/6, then take the reciprocal.
  - rung: 4
    name: worked_step
    text:
      en: The image is 15 cm from the lens; divide by 6.
  - rung: 5
    name: full_step
    text:
      en: The magnification is 2.5.
  misconception_ids:
  - mc.phy.o.lens_magnification_inverted
  - mc.phy.o.lens_reciprocals_added
  - mc.phy.o.lens_image_same_size
solution:
  steps:
  - n: 1
    latex: \frac{1}{v} = \frac{1}{10} - \frac{1}{6} = -0.0667
    reason: 1/u + 1/v = 1/f
    check_id: chk_build_phy_lgt_0068_inv
  - n: 2
    latex: '|v| = 15\ \text{cm}'
    reason: 'Negative v: a virtual image on the same side as the stamp'
    check_id: chk_build_phy_lgt_0068_v
  - n: 3
    latex: m = \frac{15}{6} = 2.5
    reason: Magnification = image distance / object distance
    check_id: chk_build_phy_lgt_0068_ans
difficulty:
  prior: 0.7
  band: stretch
estimated_seconds: 110
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
