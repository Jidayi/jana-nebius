    args:
      expression: 10/(10 - 6)
    tool: math_evaluate
  chk_build_phy_lgt_0068_inv:
    args:
      expression: 1/10 - 1/6
      sf: 3
    tool: math_evaluate
  chk_build_phy_lgt_0068_tool:
    args:
      focal_length: 10
      object_distance: 6
      optic: converging_lens
      sign_convention: real_is_positive
      sign_convention_source: pack
      task: image
    tool: phys_optics
  chk_build_phy_lgt_0068_v:
    args:
      expression: 6*10/(10 - 6)
    tool: math_evaluate
