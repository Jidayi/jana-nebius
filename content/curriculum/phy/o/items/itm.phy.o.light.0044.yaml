id: itm.phy.o.light.0044
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.light.speed_in_medium
stem: Water has a refractive index of 1.33 and diamond a refractive index of 2.42.
parts:
- id: a
  prompt: In which material is light slower?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Diamond, because it has the larger refractive index
      correct: true
    - id: B
      text: Water, because it has the smaller refractive index
      correct: false
      misconception_id: mc.phy.o.light_speed_times_index
      feedback: 'Nothing travels faster than light in a vacuum. A material slows light down, so divide c by the refractive index: the bigger n is, the slower the light.'
    - id: C
      text: 'Neither: light has the same speed in all materials'
      correct: false
      misconception_id: mc.phy.o.light_speed_same_in_material
      feedback: Light only travels at 3.0 × 10⁸ m/s in a vacuum (and almost that in air). Refraction happens because light is slower in glass or water.
    - id: D
      text: Water, because refractive index is speed in the material divided by c
      correct: false
      misconception_id: mc.phy.o.light_index_ratio_inverted
      feedback: Refractive index = speed in a vacuum ÷ speed in the material. Light is fastest in a vacuum, so the answer is always more than one.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Compare the speed of light in a vacuum with its speed in the material.
  - rung: 2
    name: concept
    text:
      en: Refractive index n = c ÷ v, so a bigger refractive index means slower light.
  - rung: 3
    name: first_step
    text:
      en: Light is never faster in a material than in a vacuum.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against n = c ÷ v.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Diamond, because it has the larger refractive index.'
  misconception_ids:
  - mc.phy.o.light_index_ratio_inverted
  - mc.phy.o.light_speed_same_in_material
  - mc.phy.o.light_speed_times_index
solution:
  steps:
  - n: 1
    latex: \text{Diamond, because it has the larger refractive index}
    reason: Use n = c / v
