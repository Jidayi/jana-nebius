stem: The air resistance on a cyclist and bicycle of total mass 75 kg is 60 N.
parts:
- id: a
  prompt: Find the driving force needed to give it an acceleration of 2 m/s².
  marks: 2
  answer:
    kind: numeric
    value: '210'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_frc_0023_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The resultant force is the driving force minus the resistive force.
  - rung: 2
    name: concept
    text:
      en: Find the resultant force needed with F = ma first.
  - rung: 3
    name: first_step
    text:
      en: The driving force must give that resultant and also balance the air resistance.
  - rung: 4
    name: worked_step
    text:
      en: The resultant force needed is 150 N.
  - rung: 5
    name: full_step
    text:
      en: Driving force = 150 + 60 = 210 N.
  misconception_ids:
