version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.sound.pitch_and_loudness
stem: A young person has healthy hearing.
parts:
- id: a
  prompt: Which range of frequencies can they usually hear?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: About 20 Hz to about 2000 Hz
      correct: false
      misconception_id: mc.phy.o.hearing_limit_wrong
      feedback: Young people hear from about 20 Hz to about 20 kHz (20 000 Hz). Above that is ultrasound; below it is infrasound.
    - id: B
      text: About 20 Hz to about 20 000 Hz
      correct: true
    - id: C
      text: About 20 000 Hz to about 200 000 Hz
      correct: false
      misconception_id: mc.phy.o.ultrasound_infrasound_swapped
      feedback: Ultrasound is above 20 kHz; sound below 20 Hz is called infrasound.
    - id: D
      text: Every frequency, as long as the sound is loud enough
      correct: false
      misconception_id: mc.phy.o.inaudible_means_too_quiet
      feedback: A dog whistle can be loud and still be silent to us. The ear cannot respond to frequencies outside about 20 Hz to 20 kHz.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Human hearing has a lower limit and an upper limit of frequency.
  - rung: 2
    name: concept
    text:
      en: The upper limit is a thousand times the lower limit.
  - rung: 3
    name: first_step
    text:
      en: Sounds above the upper limit are called ultrasound.
  - rung: 4
    name: worked_step
    text:
      en: Loudness does not change which frequencies the ear can detect.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: About 20 Hz to about 20 000 Hz.'
  misconception_ids:
  - mc.phy.o.hearing_limit_wrong
  - mc.phy.o.inaudible_means_too_quiet
  - mc.phy.o.ultrasound_infrasound_swapped
