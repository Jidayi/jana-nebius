stem: Some people receive more background radiation than others.
parts:
- id: a
  prompt: Which person is likely to receive more background radiation than average?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Someone living in a house built on granite rock
      correct: true
    - id: B
      text: Someone living next to a radio transmitter
      correct: false
      misconception_id: mc.phy.o.background_from_non_ionising
      feedback: 'Background radiation means ionising radiation: alpha, beta and gamma from radioactive substances, and cosmic rays. Radio and phone signals do not ionise and are not counted.'
    - id: C
      text: Someone who lives far from any source, who receives none
      correct: false
      misconception_id: mc.phy.o.background_zero_without_source
      feedback: Switch on a counter in an empty room and it still clicks now and then. Radiation from rocks, the air, food and space reaches us all the time.
    - id: D
      text: Someone using a microwave oven every day
      correct: false
      misconception_id: mc.phy.o.background_from_non_ionising
      feedback: 'Background radiation means ionising radiation: alpha, beta and gamma from radioactive substances, and cosmic rays. Radio and phone signals do not ionise and are not counted.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Background radiation is ionising radiation that is around us all the time.
  - rung: 2
    name: concept
    text:
      en: Most of it comes from natural sources in the ground, the air, space and our food.
  - rung: 3
    name: first_step
    text:
      en: Some rocks contain more radioactive substances than others.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that are not ionising radiation or that ignore natural sources.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Someone living in a house built on granite rock.'
  misconception_ids:
  - mc.phy.o.background_from_non_ionising
  - mc.phy.o.background_zero_without_source
