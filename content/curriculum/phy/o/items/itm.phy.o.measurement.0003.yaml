id: itm.phy.o.measurement.0003
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.measurement.si_prefixes
stem: A length is measured as 12 mm.
parts:
- id: a
  prompt: Write this length in m.
  marks: 1
  answer:
    kind: numeric
    value: '0.012'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mea_0003_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Which is the bigger unit: mm or m?'
  - rung: 2
    name: concept
    text:
      en: The prefix in mm means one thousandth of the base unit, m.
  - rung: 3
    name: first_step
    text:
      en: Changing to a bigger unit makes the number smaller.
  - rung: 4
    name: worked_step
    text:
      en: So divide by a thousand.
  - rung: 5
    name: full_step
    text:
      en: 12 mm = 0.012 m.
  misconception_ids:
  - mc.phy.o.prefix_multiply_divide_swapped
  - mc.phy.o.prefix_power_wrong
  - mc.phy.o.prefix_confused_with_neighbour
solution:
  steps:
  - n: 1
    latex: 1\ \text{mm} = 10^{-3}\ \text{m}
    reason: What the prefix means
  - n: 2
    latex: 12\ \text{mm} \rightarrow 0.012\ \text{m}
    reason: Divide when the unit gets bigger, multiply when it gets smaller
    check_id: chk_build_phy_mea_0003_calc
  - n: 3
    latex: 0.012\ \text{m}
    reason: Checked by converting the units
    check_id: chk_build_phy_mea_0003_ans
