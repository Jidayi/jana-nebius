id: itm.phy.o.energy.0072
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.work_done
stem: A waiter carries a tray at a steady height across a level room.
parts:
- id: a
  prompt: Does the upward force from his hand do work on the tray?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: No, because the tray moves at right angles to that force
      correct: true
    - id: B
      text: Yes, because the tray moves across the room
      correct: false
      misconception_id: mc.phy.o.work_distance_not_along_force
      feedback: Only movement along the line of the force counts. Lifting a bag works against its weight through the vertical height alone.
    - id: C
      text: Yes, because the force holds the tray up
      correct: false
      misconception_id: mc.phy.o.work_done_without_movement
      feedback: A table holds a book up all day but transfers no energy to it. With no movement along the force, the work done is zero, however tiring it feels.
    - id: D
      text: 'Yes: the force times the time he carries it'
      correct: false
      misconception_id: mc.phy.o.work_force_times_time
      feedback: 'Work done uses distance: W = F × d. Force × time is something different (the impulse), not the energy transferred.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Work is done when a force moves something.
  - rung: 2
    name: concept
    text:
      en: Compare the direction of the force with the direction the tray moves.
  - rung: 3
    name: first_step
    text:
      en: Check each option against W = F × d.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that ignore the distance moved along the force.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: No, because the tray moves at right angles to that force.'
  misconception_ids:
  - mc.phy.o.work_distance_not_along_force
  - mc.phy.o.work_done_without_movement
  - mc.phy.o.work_force_times_time
solution:
  steps:
  - n: 1
    latex: \text{No, because the tray moves at right angles to that force}
    reason: Work needs a distance moved along the force
