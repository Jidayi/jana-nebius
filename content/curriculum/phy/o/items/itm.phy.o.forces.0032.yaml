id: itm.phy.o.forces.0032
version: 0.1.2
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.friction_and_terminal_velocity
stem: A base jumper of mass 60 kg is falling. At one moment the air resistance on them is 200 N. Take g = 10 N/kg.
parts:
- id: a
  prompt: Find their acceleration at that moment.
  marks: 3
  answer:
    kind: numeric
    value: '6.67'
    unit: m/s^2
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_frc_0032_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Two forces act: the weight downwards and the air resistance upwards.'
  - rung: 2
    name: concept
    text:
      en: The resultant force is weight − air resistance; then use a = F ÷ m.
  - rung: 3
    name: first_step
    text:
      en: Find the weight from mass × g first.
  - rung: 4
    name: worked_step
    text:
      en: The weight is 600 N, so the resultant force is 400 N.
  - rung: 5
    name: full_step
    text:
      en: a = 400 ÷ 60 = 6.67 m/s², less than g because of the drag.
  misconception_ids:
  - mc.phy.o.falling_drag_ignored
  - mc.phy.o.opposite_vectors_added
  - mc.phy.o.drag_alone_as_resultant
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: W = mg = 60 \times 10 = 600\ \text{N}
    reason: Weight
    check_id: chk_build_phy_frc_0032_w
  - n: 2
    latex: F = 600 - 200 = 400\ \text{N}
    reason: 'Resultant force downwards: weight − drag'
    check_id: chk_build_phy_frc_0032_net
  - n: 3
    latex: a = \frac{400}{60} = 6.67\ \text{m/s}^2
    reason: a = F ÷ m
    check_id: chk_build_phy_frc_0032_ans
difficulty:
