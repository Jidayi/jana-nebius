id: itm.phy.o.particles.0044
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.particles.gas_pressure_particles
stem: A blown-up balloon is taken from a warm room into a cold freezer.
parts:
- id: a
  prompt: What happens to the balloon, and why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It shrinks, because slower particles hit the rubber less hard and less often
      correct: true
    - id: B
      text: It shrinks, because each particle shrinks in the cold
      correct: false
      misconception_id: mc.phy.o.particles_grow_when_heated
      feedback: A water particle is the same size in ice, in water and in steam. Heating makes particles move faster and spread further apart; it does not make them bigger.
    - id: C
      text: It stays the same size, because no air has left it
      correct: false
      misconception_id: mc.phy.o.gas_pressure_unchanged
      feedback: 'Push in a sealed syringe and you feel the push back grow: the same gas in a smaller space hits the walls more often. Pressure depends on volume and temperature, not only on the amount of gas.'
    - id: D
      text: It shrinks, because the cold air outside is heavier and presses down on it
      correct: false
      misconception_id: mc.phy.o.gas_pressure_from_weight
      feedback: A balloon is pushed out evenly on every side, not only at the bottom. Gas pressure comes from particles striking every wall in random directions.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Pressure is a force on each square metre of a surface. What exerts force on the walls of a container of gas?
  - rung: 2
    name: concept
    text:
      en: Cooling a gas lowers the average speed of its particles.
  - rung: 3
    name: first_step
    text:
      en: Ask whether the change alters how fast the particles move, how often they hit the walls, or both.
  - rung: 4
    name: worked_step
    text:
      en: Rule out explanations that rely on the weight of the gas or on particles changing size.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It shrinks, because slower particles hit the rubber less hard and less often.'
  misconception_ids:
  - mc.phy.o.gas_pressure_from_weight
  - mc.phy.o.gas_pressure_unchanged
  - mc.phy.o.particles_grow_when_heated
solution:
  steps:
  - n: 1
    latex: \text{It shrinks, because slower particles hit the rubber less hard and less often}
    reason: Explain the pressure by collisions with the walls
