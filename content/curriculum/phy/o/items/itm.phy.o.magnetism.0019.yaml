stem: On a field diagram, neighbouring field lines are 4 mm apart at point P near a pole and 8 mm apart at point Q further away.
parts:
- id: a
  prompt: How many times stronger is the field at P than at Q?
  marks: 1
  answer:
    kind: numeric
    value: '2'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mag_0019_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Where are the lines closer together, at P or at Q?
  - rung: 2
    name: concept
    text:
      en: 'The closer the lines, the stronger the field: a field with half the spacing is twice as strong.'
  - rung: 3
    name: first_step
    text:
      en: So divide the larger spacing by the smaller one.
  - rung: 4
    name: worked_step
    text:
      en: Work out 8 ÷ 4.
  - rung: 5
    name: full_step
    text:
      en: The field at P is 2 times as strong as at Q.
  misconception_ids:
  - mc.phy.o.field_lines_spacing_reversed
solution:
  steps:
  - n: 1
    latex: \text{strength} \propto \frac{1}{\text{spacing}}
    reason: Closer lines mean a stronger field
  - n: 2
    latex: \frac{8}{4} = 2
    reason: Wider spacing at Q, so divide Q's by P's
    check_id: chk_build_phy_mag_0019_ans
