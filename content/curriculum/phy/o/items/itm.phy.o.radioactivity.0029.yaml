subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.decay_equations
stem: A nucleus of caesium-137 (proton number 55) decays by emitting a beta particle.
parts:
- id: a
  prompt: What is the proton number of the new nucleus?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '54'
      correct: false
      misconception_id: mc.phy.o.beta_lowers_proton_number
      feedback: In beta decay a neutron becomes a proton and an electron. The proton stays, so the proton number goes up by one.
    - id: B
      text: '56'
      correct: true
    - id: C
      text: '55'
      correct: false
      misconception_id: mc.phy.o.beta_changes_nothing
      feedback: 'The mass barely changes, but the charge does: a neutron has become a proton, so the proton number rises by one and the element changes.'
    - id: D
      text: '53'
      correct: false
      misconception_id: mc.phy.o.beta_treated_as_alpha
      feedback: Alpha takes away 4 nucleons and 2 protons. Beta takes away no nucleons and raises the proton number by one.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what happens inside the nucleus in beta decay.
  - rung: 2
    name: concept
    text:
      en: A neutron turns into a proton and an electron; the electron is thrown out.
  - rung: 3
    name: first_step
    text:
      en: So the nucleus gains a proton and loses a neutron.
  - rung: 4
    name: worked_step
    text:
      en: Start from the proton number 55 and add the new proton.
  - rung: 5
    name: full_step
    text:
      en: 'The new proton number is 56: the nucleus is now barium.'
  misconception_ids:
  - mc.phy.o.beta_changes_nothing
  - mc.phy.o.beta_lowers_proton_number
  - mc.phy.o.beta_treated_as_alpha
solution:
  steps:
  - n: 1
    latex: '{}^{137}_{55}\text{Cs} \rightarrow {}^{137}_{56}\text{Ba} + {}^{0}_{-\,1}\text{e}'
    reason: A beta particle is an electron from the nucleus
  - n: 2
    latex: Z = 55 + 1 = 56
    reason: A neutron has become a proton
    check_id: chk_build_phy_rad_0029_ans
