  hints:
  - rung: 1
    name: orient
    text:
      en: An ideal transformer wastes no energy.
  - rung: 2
    name: concept
    text:
      en: 'So the power in equals the power out: Vp × Ip = Vs × Is.'
  - rung: 3
    name: first_step
    text:
      en: Find the power in first.
  - rung: 4
    name: worked_step
    text:
      en: The power in is 4.6 W; divide it by 8 V.
  - rung: 5
    name: full_step
    text:
      en: Is = 4.6 ÷ 8 = 0.575 A.
  misconception_ids:
