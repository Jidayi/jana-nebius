- kc.phy.o.em_spectrum.uses_and_hazards
stem: A worker is exposed to a strong beam of microwaves.
parts:
- id: a
  prompt: What is the main danger?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Ionising damage to DNA that leads to cancer
      correct: false
      misconception_id: mc.phy.o.nonionising_called_ionising
      feedback: Only the high-frequency regions (X-rays and gamma rays, and the most energetic ultraviolet) can ionise atoms. Microwaves and infrared harm by heating.
    - id: B
      text: Burns to the surface of the skin only, as from a heater
      correct: false
      misconception_id: mc.phy.o.long_wave_uses_mixed
      feedback: 'Radio: broadcasting. Microwaves: cooking by heating water, mobile phones and satellites. Infrared: remote controls, heaters and thermal cameras.'
    - id: C
      text: Heating of body tissue from the inside
      correct: true
    - id: D
      text: It is the most dangerous region because its waves are so long
      correct: false
      misconception_id: mc.phy.o.hazard_increases_with_wavelength
      feedback: Energy carried by the radiation grows with frequency, so the danger rises towards gamma rays, the shortest wavelength.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what each region does when it meets matter.
  - rung: 2
    name: concept
    text:
      en: Long-wavelength regions mostly carry signals or heat things; short-wavelength regions pass through soft tissue or damage cells.
  - rung: 3
    name: first_step
    text:
      en: Only the highest-frequency regions are ionising, and danger rises with frequency.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that give a region a property it does not have.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Heating of body tissue from the inside.'
  misconception_ids:
  - mc.phy.o.hazard_increases_with_wavelength
