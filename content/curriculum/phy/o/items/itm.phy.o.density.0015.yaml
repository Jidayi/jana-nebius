id: itm.phy.o.density.0015
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.density.density_calculation
stem: A brass weight has a mass of 170 g and a volume of 20 cm³.
parts:
- id: a
  prompt: Calculate its density in kg/m³.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 8.5 kg/m³
      correct: false
      misconception_id: mc.phy.o.density_units_not_converted
      feedback: Grams divided by cubic centimetres gives g/cm³. To give the density in kg/m³, multiply that number by a thousand.
    - id: B
      text: 0.0085 kg/m³
      correct: false
      misconception_id: mc.phy.o.density_conversion_direction_swapped
      feedback: Water has a density of 1 g/cm³, and a cubic metre of water has a mass of a tonne, a thousand kilograms. So the number in kg/m³ is always the bigger one.
    - id: C
      text: 118 kg/m³
      correct: false
      misconception_id: mc.phy.o.density_volume_over_mass
      feedback: 'Density says how much mass is packed into each unit of volume: mass ÷ volume. A small, heavy object must come out with a large density.'
    - id: D
      text: 8500 kg/m³
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Grams divided by cubic centimetres gives a density in g/cm³.
  - rung: 2
    name: concept
    text:
      en: Find the density in g/cm³ first, then change the unit.
  - rung: 3
    name: first_step
    text:
      en: Work out 170 ÷ 20.
  - rung: 4
    name: worked_step
    text:
      en: The density is 8.5 g/cm³; multiply by 1000 to get kg/m³.
  - rung: 5
    name: full_step
    text:
      en: The density is 8500 kg/m³.
  misconception_ids:
  - mc.phy.o.density_conversion_direction_swapped
  - mc.phy.o.density_units_not_converted
  - mc.phy.o.density_volume_over_mass
solution:
  steps:
  - n: 1
    latex: \rho = \frac{170}{20} = 8.5\ \text{g/cm}^3
    reason: Density = mass ÷ volume
    check_id: chk_build_phy_den_0015_gcc
  - n: 2
    latex: 1\ \text{g/cm}^3 = 1000\ \text{kg/m}^3
    reason: The unit change
    check_id: chk_build_phy_den_0015_k
  - n: 3
    latex: 8.5 \times 1000 = 8500\ \text{kg/m}^3
    reason: Change g/cm³ into kg/m³
    check_id: chk_build_phy_den_0015_ans
