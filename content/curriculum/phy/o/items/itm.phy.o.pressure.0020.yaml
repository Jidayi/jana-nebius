id: itm.phy.o.pressure.0020
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.liquid_pressure
stem: A pressure sensor on the bed of a freshwater lake reads 19.6 kPa more than at the surface. Water has a density of 1000 kg/m³. Take g = 9.8 N/kg.
parts:
- id: a
  prompt: How deep is the lake at that point?
  marks: 2
  answer:
    kind: numeric
    value: '2'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_prs_0020_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The extra pressure comes from the depth of water above the sensor.
  - rung: 2
    name: concept
    text:
      en: Δp = ρgh, so h = Δp ÷ (ρg).
  - rung: 3
    name: first_step
    text:
      en: Change 19.6 kPa into pascals first.
  - rung: 4
    name: worked_step
    text:
      en: Divide 19600 Pa by 1000 × 9.8.
  - rung: 5
    name: full_step
    text:
      en: The lake is 2 m deep there.
  misconception_ids:
  - mc.phy.o.pressure_kpa_not_converted
  - mc.phy.o.liquid_pressure_g_left_out
  - mc.phy.o.pressure_rearranged_wrongly
solution:
  steps:
  - n: 1
    latex: \Delta p = 19.6\ \text{kPa} = 19600\ \text{Pa}
    reason: Kilopascals into pascals
    check_id: chk_build_phy_prs_0020_pa
  - n: 2
    latex: h = \frac{\Delta p}{\rho g} = \frac{19600}{1000 \times 9.8} = 2\ \text{m}
    reason: Rearrange Δp = ρgh
    check_id: chk_build_phy_prs_0020_ans
