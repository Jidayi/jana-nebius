id: itm.phy.o.measurement.0017
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.measurement.scalars_and_vectors
stem: An astronaut takes a toolbox from the Earth to the Moon.
parts:
- id: a
  prompt: Which statement about the toolbox is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Its mass changes because mass points towards the ground
      correct: false
      misconception_id: mc.phy.o.mass_as_vector
      feedback: Weight is a force and pulls towards the planet, so it has a direction. Mass is the amount of matter and has no direction.
    - id: B
      text: Its weight changes but its mass does not
      correct: true
    - id: C
      text: Its mass and weight are both scalars, so neither changes
      correct: false
      misconception_id: mc.phy.o.vector_as_scalar
      feedback: 'Walking forward and then the same distance back leaves you where you started: the displacement is zero even though the distance is not. Vectors need a direction.'
    - id: D
      text: Its energy points in the direction it travels
      correct: false
      misconception_id: mc.phy.o.energy_as_vector
      feedback: 'Energy is a scalar: an amount with no direction. Being moved from one store to another does not give it a direction.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Ask whether the quantity needs a direction to describe it fully.
  - rung: 2
    name: concept
    text:
      en: A vector has a size and a direction; a scalar has a size only.
  - rung: 3
    name: first_step
    text:
      en: 'Test each option in turn: does it make sense to say which way it points?'
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that do not fit what the question asks for.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Its weight changes but its mass does not.'
  misconception_ids:
  - mc.phy.o.energy_as_vector
  - mc.phy.o.mass_as_vector
  - mc.phy.o.vector_as_scalar
