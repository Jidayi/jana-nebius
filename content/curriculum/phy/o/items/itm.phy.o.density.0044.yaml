id: itm.phy.o.density.0044
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.density.floating_and_sinking
stem: A brass coin sinks in water but floats on mercury, whose density is 13.6 g/cm³.
parts:
- id: a
  prompt: What can you say about the coin's density?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It is between the densities of water and mercury
      correct: true
    - id: B
      text: It is greater than the densities of both liquids
      correct: false
      misconception_id: mc.phy.o.density_float_rule_reversed
      feedback: A stone is denser than water and sinks; a cork is less dense and floats. An object floats when its density is less than the liquid's.
    - id: C
      text: 'Nothing: an object behaves the same in every liquid'
      correct: false
      misconception_id: mc.phy.o.floating_ignores_liquid
      feedback: 'An egg sinks in fresh water but floats in very salty water. Floating depends on two densities: the object''s and the liquid''s.'
    - id: D
      text: 'Nothing: the coin floats on mercury only because it is small'
      correct: false
      misconception_id: mc.phy.o.volume_decides_floating
      feedback: 'Cut a piece of wood in half and both halves still float. Size does not decide it: compare the densities.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Floating depends on densities, not on mass or size alone.
  - rung: 2
    name: concept
    text:
      en: Sinking in one liquid and floating in another sets a lower and an upper limit.
  - rung: 3
    name: first_step
    text:
      en: Compare the density of the object with the density of the liquid.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that look only at how heavy or how big something is.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It is between the densities of water and mercury.'
  misconception_ids:
  - mc.phy.o.density_float_rule_reversed
  - mc.phy.o.floating_ignores_liquid
  - mc.phy.o.volume_decides_floating
solution:
  steps:
  - n: 1
    latex: \text{It is between the densities of water and mercury}
    reason: Compare the object's density with the liquid's
