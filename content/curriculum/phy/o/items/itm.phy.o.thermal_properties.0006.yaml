id: itm.phy.o.thermal_properties.0006
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.thermal_expansion
stem: An unmarked liquid-in-glass thermometer has a thread 30 mm long in melting ice (0 °C) and 200 mm long in steam from boiling water (100 °C). In a beaker of warm water the thread is 163 mm long.
parts:
- id: a
  prompt: Find the temperature of the water, assuming the liquid expands evenly.
  marks: 3
  answer:
    kind: numeric
    value: '78.2'
    unit: °C
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_thp_0006_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The liquid expands by the same amount for each degree of temperature rise.
  - rung: 2
    name: concept
    text:
      en: Find how much the thread grows for each degree between the two fixed points.
  - rung: 3
    name: first_step
    text:
      en: Then find how far the thread is above its 0 °C length of 30 mm.
  - rung: 4
    name: worked_step
    text:
      en: Divide 133 mm by 1.7 mm per degree.
  - rung: 5
    name: full_step
    text:
      en: The water is at 78.2 °C.
solution:
  steps:
  - n: 1
    latex: \frac{200 - 30}{100} = 1.7\ \text{mm per}\ ^\circ\text{C}
    reason: Length per degree
    check_id: chk_build_phy_thp_0006_per
  - n: 2
    latex: 163 - 30 = 133\ \text{mm}
    reason: Length above the 0 °C mark
    check_id: chk_build_phy_thp_0006_d
  - n: 3
    latex: \theta = \frac{133}{1.7} = 78.2\ ^\circ\text{C}
    reason: Number of degrees above 0 °C
    check_id: chk_build_phy_thp_0006_ans
