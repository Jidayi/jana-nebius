  reviewers: []
checks:
  chk_build_phy_osc_0014_ans:
    args:
      expression: 1000/(2.5*0.5)
    tool: math_evaluate
  chk_build_phy_osc_0014_tm:
    args:
      expression: 2.5*0.5
    tool: math_evaluate
  chk_build_phy_osc_0014_ts:
    args:
      quantity: 1.25 ms
      to: s
    tool: units_convert
