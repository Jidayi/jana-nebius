stem: The dull black panel of a solar water heater has an area of 1.5 m². Sunlight delivers 700 W to each square metre, and the panel absorbs 95% of it.
parts:
- id: a
  prompt: Find the power absorbed by the panel.
  marks: 2
  answer:
    kind: numeric
    value: '997.5'
    unit: W
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_htr_0039_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A dull black surface absorbs most, but not all, of the radiation reaching it.
  - rung: 2
    name: concept
    text:
      en: First find the total power reaching the panel, then take the percentage absorbed.
  - rung: 3
    name: first_step
    text:
      en: Multiply 700 W/m² by 1.5 m².
  - rung: 4
    name: worked_step
    text:
      en: Take 95% of 1050 W.
  - rung: 5
    name: full_step
    text:
      en: The panel absorbs 997.5 W.
solution:
  steps:
  - n: 1
    latex: 700 \times 1.5 = 1050\ \text{W}
    reason: Power reaching the panel
    check_id: chk_build_phy_htr_0039_inc
  - n: 2
    latex: 1050 \times 95\% = 997.5\ \text{W}
    reason: The part that is absorbed
    check_id: chk_build_phy_htr_0039_ans
