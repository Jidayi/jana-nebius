id: itm.phy.o.light.0035
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.light.speed_in_medium
stem: A ray passes from air into a clear plastic block. The angle of incidence is 45° and the angle of refraction is 26°.
parts:
- id: a
  prompt: Calculate the speed of light in the plastic, in km/s.
  marks: 3
  answer:
    kind: numeric
    value: '186000'
    unit: km/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_lgt_0035_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Two steps: find the refractive index, then use it to find the speed.'
  - rung: 2
    name: concept
    text:
      en: n = sin i ÷ sin r, and then v = c ÷ n.
  - rung: 3
    name: first_step
    text:
      en: Work out sin 45° ÷ sin 26°.
  - rung: 4
    name: worked_step
    text:
      en: n = 1.61; divide the speed of light, 300000 km/s, by it.
  - rung: 5
    name: full_step
    text:
      en: The speed of light in the plastic is 186000 km/s.
  misconception_ids:
  - mc.phy.o.light_speed_times_index
  - mc.phy.o.light_speed_same_in_material
  - mc.phy.o.refraction_angles_from_surface
solution:
  steps:
  - n: 1
    latex: n = \frac{\sin 45^\circ}{\sin 26^\circ} = 1.61
    reason: Refractive index from the angles
    check_id: chk_build_phy_lgt_0035_n
  - n: 2
    latex: c = 3.0 \times 10^{8}\ \text{m/s} = 300000\ \text{km/s}
    reason: c in km/s
    check_id: chk_build_phy_lgt_0035_ckm
  - n: 3
    latex: v = \frac{c}{n} = \frac{300000}{1.61} = 186000\ \text{km/s}
    reason: Speed in the material
    check_id: chk_build_phy_lgt_0035_ans
