type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.density.floating_and_sinking
stem: A hollow metal sphere has a mass of 400 g and a volume of 500 cm³.
parts:
- id: a
  prompt: Will it float in water, whose density is 1.0 g/cm³?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: No, because metal is denser than water
      correct: false
      misconception_id: mc.phy.o.hollow_object_density_of_material
      feedback: 'Use the average density: the total mass divided by the total volume, air included. A steel ship floats because most of its volume is air.'
    - id: B
      text: No, because 400 g is too heavy to float
      correct: false
      misconception_id: mc.phy.o.mass_decides_floating
      feedback: A huge tree trunk floats while a small pebble sinks. What counts is the mass in each unit of volume, the density, compared with the liquid's density.
    - id: C
      text: Yes, because its average density is less than the water's
      correct: true
    - id: D
      text: Yes, because its density is greater than the water's
      correct: false
      misconception_id: mc.phy.o.density_float_rule_reversed
      feedback: A stone is denser than water and sinks; a cork is less dense and floats. An object floats when its density is less than the liquid's.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Floating depends on densities, not on mass or size alone.
  - rung: 2
    name: concept
    text:
      en: 'Work out the sphere''s average density: its mass divided by its whole volume.'
  - rung: 3
    name: first_step
    text:
      en: Compare the density of the object with the density of the liquid.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that look only at how heavy or how big something is.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Yes, because its average density is less than the water''s.'
  misconception_ids:
  - mc.phy.o.density_float_rule_reversed
  - mc.phy.o.hollow_object_density_of_material
  - mc.phy.o.mass_decides_floating
solution:
  steps:
  - n: 1
    latex: \text{Yes, because its average density is less than the water's}
    reason: Compare the object's density with the liquid's
