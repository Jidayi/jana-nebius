    text:
      en: Start from the long-wavelength end and work towards visible light.
  - rung: 2
    name: concept
    text:
      en: Microwaves come just after radio waves.
  - rung: 3
    name: first_step
    text:
      en: The region you want sits just beyond the red end of the visible spectrum.
  - rung: 4
    name: worked_step
    text:
      en: Its name means 'below red'.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Infrared.'
