stem: A uniform rod is pivoted at its centre. On the left hang 4 N at 0.2 m and 2.5 N at 0.4 m from the pivot.
parts:
- id: a
  prompt: Find the single weight that balances the rod when hung 0.35 m to the right of the pivot.
  marks: 3
  answer:
    kind: numeric
    value: '5.14'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_frc_0088_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Both weights on the left turn the rod the same way.
  - rung: 2
    name: concept
    text:
      en: Add their moments to get the total anticlockwise moment.
  - rung: 3
    name: first_step
    text:
      en: Then divide that total by the distance of the unknown weight.
  - rung: 4
    name: worked_step
    text:
      en: The total anticlockwise moment is 1.8 N m.
  - rung: 5
    name: full_step
    text:
      en: F = 1.8 ÷ 0.35 = 5.14 N.
  misconception_ids:
  - mc.phy.o.moment_one_force_left_out
  - mc.phy.o.balance_equal_forces
solution:
  steps:
  - n: 1
    latex: 4 \times 0.2 + 2.5 \times 0.4 = 1.8\ \text{N m}
    reason: Total anticlockwise moment
    check_id: chk_build_phy_frc_0088_m
  - n: 2
    latex: F = \frac{1.8}{0.35} = 5.14\ \text{N}
    reason: Clockwise moment must equal it
    check_id: chk_build_phy_frc_0088_ans
