stem: A star passes through several stages during its life.
parts:
- id: a
  prompt: In which stage does a star spend most of its life?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The red giant stage
      correct: false
      misconception_id: mc.phy.o.life_cycle_order_muddled
      feedback: Gas cloud, then protostar, then the long main-sequence stage, then the giant stage, then the end. The giant stage comes after the core's hydrogen runs out.
    - id: B
      text: The protostar stage, while fusion builds up
      correct: false
      misconception_id: mc.phy.o.protostar_already_fusing
      feedback: A protostar heats up because gravity pulls its gas inwards. Once its core is hot enough fusion starts and it becomes a main-sequence star.
    - id: C
      text: The supernova stage
      correct: false
      misconception_id: mc.phy.o.small_star_ends_violently
      feedback: Only stars of much more than the Sun's mass end in a supernova. The Sun will swell into a red giant, shed its outer layers and leave a white dwarf.
    - id: D
      text: The main sequence
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about how a star's mass decides its life story.
  - rung: 2
    name: concept
    text:
      en: Stars form from collapsing gas, shine for most of their lives by fusing hydrogen, and end when the fuel runs out.
  - rung: 3
    name: first_step
    text:
      en: A star like the Sun ends as a white dwarf; a much more massive star ends in a supernova.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these stages.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The main sequence.'
