id: itm.phy.o.thermal_properties.0056
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.changes_of_state
stem: A heating curve for a pure substance has a flat section where the temperature does not change, though the heater stays on.
parts:
- id: a
  prompt: What is the energy supplied doing during this section?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Separating the particles to change the state
      correct: true
    - id: B
      text: 'Nothing: it is all wasted while the temperature is constant'
      correct: false
      misconception_id: mc.phy.o.no_energy_when_temperature_constant
      feedback: The heater is still on during the flat part, so energy is still going in. It is used to pull particles apart instead of raising the temperature.
    - id: C
      text: Making the particles move faster
      correct: false
      misconception_id: mc.phy.o.temperature_rises_during_melting
      feedback: 'While a pure substance changes state its temperature stays constant: the energy goes into separating the particles, not into speeding them up.'
    - id: D
      text: Making the particles themselves melt
      correct: false
      misconception_id: mc.phy.o.particles_have_bulk_properties
      feedback: A single particle does not melt, feel hot or have a colour. Those are properties of huge numbers of particles together, set by how they are arranged and how fast they move.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Think about what the energy does to the particles: speed them up, or separate them.'
  - rung: 2
    name: concept
    text:
      en: The temperature tells you about the kinetic energy of the particles, and that is not changing.
  - rung: 3
    name: first_step
    text:
      en: During a change of state of a pure substance, ask what happens to the temperature and to the energy.
  - rung: 4
    name: worked_step
    text:
      en: Remember that evaporation happens at the surface and that only some particles escape.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Separating the particles to change the state.'
  misconception_ids:
  - mc.phy.o.no_energy_when_temperature_constant
  - mc.phy.o.particles_have_bulk_properties
  - mc.phy.o.temperature_rises_during_melting
solution:
  steps:
  - n: 1
    latex: \text{Separating the particles to change the state}
    reason: Use the particle model of changes of state
