id: itm.phy.o.pressure.0022
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.liquid_pressure
stem: The wall of a dam is much thicker at the bottom than at the top.
parts:
- id: a
  prompt: Why is it built like this?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The water pressure is the same at all depths
      correct: false
      misconception_id: mc.phy.o.liquid_pressure_same_at_all_depths
      feedback: Every metre further down has another metre of liquid pressing from above, so pressure grows with depth. That is why dams are thickest at the bottom.
    - id: B
      text: The lake behind it is wide, and wider water pushes harder
      correct: false
      misconception_id: mc.phy.o.liquid_pressure_depends_on_volume
      feedback: A narrow tube and a wide tank filled to the same depth with the same liquid have the same pressure at the bottom. Only the depth, the density and g count.
    - id: C
      text: The water pressure increases with depth
      correct: true
    - id: D
      text: Water presses only downwards, onto the base of the wall
      correct: false
      misconception_id: mc.phy.o.liquid_pressure_only_downwards
      feedback: Water squirts sideways out of a hole in the side of a bottle. At any point in a liquid the pressure acts equally in all directions.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Pressure in a liquid comes from the weight of the liquid above.
  - rung: 2
    name: concept
    text:
      en: Think about how much water lies above each part of the wall.
  - rung: 3
    name: first_step
    text:
      en: Only the depth, the liquid's density and g decide the pressure from a liquid.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that depend on the amount or the shape of the liquid.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The water pressure increases with depth.'
  misconception_ids:
  - mc.phy.o.liquid_pressure_depends_on_volume
  - mc.phy.o.liquid_pressure_only_downwards
  - mc.phy.o.liquid_pressure_same_at_all_depths
solution:
  steps:
  - n: 1
    latex: \text{The water pressure increases with depth}
    reason: Pressure in a liquid depends on depth and density
