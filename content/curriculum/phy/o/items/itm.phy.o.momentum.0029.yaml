id: itm.phy.o.momentum.0029
version: 0.1.1
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.momentum.conservation_of_momentum
stem: A railway truck of mass 8000 kg moving at 2 m/s hits a stationary truck of mass 6000 kg. They couple together and move off as one.
parts:
- id: a
  prompt: Find their velocity just after the collision.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 2.67 m/s
      correct: false
      misconception_id: mc.phy.o.stuck_mass_one_object
      feedback: 'After they stick together the two objects move as one: divide the momentum by the sum of their masses.'
    - id: B
      text: 1.14 m/s
      correct: true
    - id: C
      text: 1 m/s
      correct: false
      misconception_id: mc.phy.o.collision_velocities_averaged
      feedback: 'A lorry hitting a bicycle hardly slows down. The heavier object counts for more: use the momenta, not the plain velocities.'
    - id: D
      text: 3.5 m/s
      correct: false
      misconception_id: mc.phy.o.conservation_masses_swapped
      feedback: 'Check with sense: when a heavy launcher pushes out a light ball, the launcher moves off much more slowly than the ball.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Total momentum is conserved in the collision.
  - rung: 2
    name: concept
    text:
      en: 'Before: only the moving one has momentum. After: both move together with the same velocity.'
  - rung: 3
    name: first_step
    text:
      en: Set the momentum before equal to (total mass) × v.
  - rung: 4
    name: worked_step
    text:
      en: The momentum before is 16000 kg m/s and the total mass is 14000 kg.
  - rung: 5
    name: full_step
    text:
      en: v = 16000 ÷ 14000 = 1.14 m/s, in the original direction.
  misconception_ids:
  - mc.phy.o.collision_velocities_averaged
  - mc.phy.o.conservation_masses_swapped
  - mc.phy.o.stuck_mass_one_object
solution:
  steps:
  - n: 1
    latex: p_\text{before} = 8000 \times 2 + 0 = 16000\ \text{kg m/s}
    reason: The second one is at rest
    check_id: chk_build_phy_mom_0029_pb
  - n: 2
    latex: (8000 + 6000)v = 14000\,v = 16000
    reason: Momentum after = momentum before
    check_id: chk_build_phy_mom_0029_mt
  - n: 3
    latex: v = \frac{16000}{14000} = 1.14\ \text{m/s}
    reason: Solve for v
    check_id: chk_build_phy_mom_0029_ans
