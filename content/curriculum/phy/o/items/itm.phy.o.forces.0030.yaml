id: itm.phy.o.forces.0030
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.force_mass_acceleration
stem: The driving force on a loaded trolley of total mass 40 kg is 80 N. The friction on it is 15 N.
parts:
- id: a
  prompt: Find its acceleration.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 2 m/s²
      correct: false
      misconception_id: mc.phy.o.fma_applied_force_not_resultant
      feedback: The F in F = ma is the resultant force. Take the forces acting against the motion away from the driving force first.
    - id: B
      text: 2.375 m/s²
      correct: false
      misconception_id: mc.phy.o.opposite_vectors_added
      feedback: 'Two teams pulling a rope in opposite directions cancel each other out: subtract the smaller pull from the larger.'
    - id: C
      text: 1.63 m/s²
      correct: true
    - id: D
      text: 0.615 m/s²
      correct: false
      misconception_id: mc.phy.o.fma_ratio_inverted
      feedback: 'A bigger force gives a bigger acceleration, so force goes on top: a = F ÷ m. Check that your answer grows when the force grows.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Which force goes into F = ma?
  - rung: 2
    name: concept
    text:
      en: F in F = ma is the resultant force, not the driving force.
  - rung: 3
    name: first_step
    text:
      en: Take the friction from the driving force, then divide by the mass.
  - rung: 4
    name: worked_step
    text:
      en: The resultant force is 65 N.
  - rung: 5
    name: full_step
    text:
      en: a = 65 ÷ 40 = 1.63 m/s².
  misconception_ids:
  - mc.phy.o.fma_applied_force_not_resultant
  - mc.phy.o.fma_ratio_inverted
  - mc.phy.o.opposite_vectors_added
solution:
  steps:
  - n: 1
    latex: F = 80 - 15 = 65\ \text{N}
    reason: The resultant force
    check_id: chk_build_phy_frc_0030_net
  - n: 2
    latex: a = \frac{F}{m} = \frac{65}{40} = 1.63\ \text{m/s}^2
    reason: a = F ÷ m
    check_id: chk_build_phy_frc_0030_ans
