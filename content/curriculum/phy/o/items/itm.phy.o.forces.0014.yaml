id: itm.phy.o.forces.0014
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.resultant_force
stem: A puck slides across smooth ice, where friction and air resistance are small enough to ignore.
parts:
- id: a
  prompt: How does the puck move after it leaves the stick?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It slows down as the force from the stick is used up
      correct: false
      misconception_id: mc.phy.o.force_of_motion_used_up
      feedback: Once a ball leaves your hand nothing from your push travels with it. It slows down only if a force such as friction acts against it.
    - id: B
      text: It stops at once, because no force acts on it
      correct: false
      misconception_id: mc.phy.o.balanced_means_at_rest
      feedback: Balanced forces mean the velocity does not change. A parked car and a car cruising at a steady speed both have balanced forces.
    - id: C
      text: At a steady speed in a straight line
      correct: true
    - id: D
      text: It slows down, because a moving object needs a forward force
      correct: false
      misconception_id: mc.phy.o.moving_needs_resultant_force
      feedback: On smooth ice a sliding puck keeps going with nothing pushing it. A resultant force changes velocity; it is not needed to keep a velocity the same.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about whether the forces on the object are balanced or unbalanced.
  - rung: 2
    name: concept
    text:
      en: Balanced forces give a zero resultant, so the velocity stays the same; unbalanced forces change the speed or the direction.
  - rung: 3
    name: first_step
    text:
      en: Compare the forces acting in each direction with what the object is doing.
  - rung: 4
    name: worked_step
    text:
      en: Once the puck has left the stick, is any force acting along its direction of motion?
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: At a steady speed in a straight line. With no resultant force its velocity cannot change, so it keeps the same speed and direction.'
  misconception_ids:
  - mc.phy.o.balanced_means_at_rest
  - mc.phy.o.force_of_motion_used_up
  - mc.phy.o.moving_needs_resultant_force
solution:
  steps:
  - n: 1
    latex: \text{At a steady speed in a straight line}
    reason: Use the resultant force to decide how the motion changes
