stem: A transformer for a laptop adapter works from the 230 V mains. The primary coil has 2300 turns and the secondary coil 50 turns.
parts:
- id: a
  prompt: Calculate the output voltage.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 10580 V
      correct: false
      misconception_id: mc.phy.o.turns_ratio_inverted
      feedback: 'The voltages are in the same ratio as the turns: Vs/Vp = Ns/Np. The coil with more turns has the larger voltage.'
    - id: B
      text: 11500 V
      correct: false
      misconception_id: mc.phy.o.turns_ratio_not_divided
      feedback: 'Write Vs/Vp = Ns/Np and rearrange fully: Vs = Vp × Ns ÷ Np. Both numbers of turns are needed.'
    - id: C
      text: 5 V
      correct: true
    - id: D
      text: 0.0217 V
      correct: false
      misconception_id: mc.phy.o.turns_ratio_given_as_answer
      feedback: The ratio only tells you how many times bigger or smaller. Multiply it by the known value to get the answer.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The voltages across the two coils are in the same ratio as their numbers of turns.
  - rung: 2
    name: concept
    text:
      en: Vs ÷ Vp = Ns ÷ Np.
  - rung: 3
    name: first_step
    text:
      en: Rearrange the equation to make Vs the subject.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 230 V by 50 and divide by 2300.
  - rung: 5
    name: full_step
    text:
      en: The output voltage is 5 V.
  misconception_ids:
  - mc.phy.o.turns_ratio_given_as_answer
  - mc.phy.o.turns_ratio_inverted
  - mc.phy.o.turns_ratio_not_divided
solution:
  steps:
  - n: 1
    latex: \frac{V_s}{V_p} = \frac{N_s}{N_p}
    reason: Voltages are in the ratio of the turns
  - n: 2
    latex: V_s = V_p \times \frac{N_s}{N_p} = 230 \times \frac{50}{2300} = 5\ \text{V}
    reason: Rearrange for V_s
    check_id: chk_build_phy_emg_0058_ans
