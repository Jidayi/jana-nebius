id: itm.phy.o.heat_transfer.0027
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.heat_transfer.convection
stem: A hot-water tank is heated by an electric element near the bottom.
parts:
- id: a
  prompt: Why is the element at the bottom rather than the top?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Heated water sinks, so it would stay at the top otherwise
      correct: false
      misconception_id: mc.phy.o.heated_fluid_denser
      feedback: Heating makes a fluid expand, so the same mass takes up more space and its density falls. Warm air and water rise; cooled air and water sink.
    - id: B
      text: The energy rises through the metal walls by convection
      correct: false
      misconception_id: mc.phy.o.convection_in_solids
      feedback: Convection needs the material itself to move as a current. Particles in a solid stay in place, so solids pass energy on by conduction, not convection.
    - id: C
      text: Water has the same density whatever its temperature, so heat spreads evenly
      correct: false
      misconception_id: mc.phy.o.density_unchanged_on_heating
      feedback: Density is mass divided by volume. Heating keeps the mass the same but increases the volume, so the density falls; that is why warm fluids rise.
    - id: D
      text: Heated water rises, so convection carries warm water through the whole tank
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Convection is the movement of a warm fluid carrying energy with it.
  - rung: 2
    name: concept
    text:
      en: Think about where the warmed water goes after it leaves the element.
  - rung: 3
    name: first_step
    text:
      en: Ask what happens to the density of a fluid when it is heated or cooled.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options where heat moves by itself or a solid flows.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Heated water rises, so convection carries warm water through the whole tank.'
  misconception_ids:
  - mc.phy.o.convection_in_solids
  - mc.phy.o.density_unchanged_on_heating
  - mc.phy.o.heated_fluid_denser
