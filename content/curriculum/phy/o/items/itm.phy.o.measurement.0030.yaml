id: itm.phy.o.measurement.0030
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.measurement.scalars_and_vectors
stem: A car brakes and slows down while moving forwards.
parts:
- id: a
  prompt: Which way does its acceleration point?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Acceleration has no direction
      correct: false
      misconception_id: mc.phy.o.vector_as_scalar
      feedback: 'Walking forward and then the same distance back leaves you where you started: the displacement is zero even though the distance is not. Vectors need a direction.'
    - id: B
      text: Forwards, the way it moves
      correct: false
      misconception_id: mc.phy.o.speed_as_vector
      feedback: A car going round a bend at a steady speed has the same speed but a changing velocity. Speed is the size only; velocity adds the direction.
    - id: C
      text: Backwards, against the motion
      correct: true
    - id: D
      text: Downwards, the way its mass acts
      correct: false
      misconception_id: mc.phy.o.mass_as_vector
      feedback: Weight is a force and pulls towards the planet, so it has a direction. Mass is the amount of matter and has no direction.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Ask whether the quantity needs a direction to describe it fully.
  - rung: 2
    name: concept
    text:
      en: A vector has a size and a direction; a scalar has a size only.
  - rung: 3
    name: first_step
    text:
      en: 'Test each option in turn: does it make sense to say which way it points?'
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that do not fit what the question asks for.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Backwards, against the motion.'
  misconception_ids:
  - mc.phy.o.mass_as_vector
  - mc.phy.o.speed_as_vector
  - mc.phy.o.vector_as_scalar
solution:
  steps:
  - n: 1
    latex: \text{Backwards, against the motion}
    reason: Check whether each quantity needs a direction
