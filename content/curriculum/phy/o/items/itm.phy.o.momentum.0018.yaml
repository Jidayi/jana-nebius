id: itm.phy.o.momentum.0018
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.momentum.conservation_of_momentum
stem: Trolley A (1 kg) moves right at 5 m/s and trolley B (0.5 kg) moves left at 6 m/s. They collide and stick together. Take right as positive.
parts:
- id: a
  prompt: Find their velocity after the collision.
  marks: 3
  answer:
    kind: numeric
    value: '1.33'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_mom_0018_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Total momentum before the collision equals total momentum after.
  - rung: 2
    name: concept
    text:
      en: B moves left, so its velocity is negative.
  - rung: 3
    name: first_step
    text:
      en: Add the two momenta with their signs, then divide by the total mass.
  - rung: 4
    name: worked_step
    text:
      en: The momentum before is 2 kg m/s and the total mass is 1.5 kg.
  - rung: 5
    name: full_step
    text:
      en: v = 1.33 m/s, to the right.
  misconception_ids:
  - mc.phy.o.momentum_sign_ignored
  - mc.phy.o.collision_velocities_averaged
  - mc.phy.o.stuck_mass_one_object
solution:
  steps:
  - n: 1
    latex: p_\text{before} = 1 \times 5 + 0.5 \times (-\,6) = 2\ \text{kg m/s}
    reason: B moves left, so its momentum is negative
    check_id: chk_build_phy_mom_0018_pb
  - n: 2
    latex: (1 + 0.5)v = 1.5\,v = 2
    reason: Momentum is conserved
    check_id: chk_build_phy_mom_0018_mt
  - n: 3
    latex: v = \frac{2}{1.5} = 1.33\ \text{m/s}
    reason: Positive, so they move right
    check_id: chk_build_phy_mom_0018_ans
