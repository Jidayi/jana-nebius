id: itm.phy.o.electrical_quantities.0060
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.resistance
stem: A current of 80 mA flows through a resistor of 10 Ω.
parts:
- id: a
  prompt: Calculate the p.d. across the resistor.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 0.8 V
      correct: true
    - id: B
      text: 125 V
      correct: false
      misconception_id: mc.phy.o.ohm_law_upside_down
      feedback: 'Resistance is the p.d. needed for each amp: R = V/I, so I = V/R and V = IR. The p.d. is never underneath.'
    - id: C
      text: 0.008 V
      correct: false
      misconception_id: mc.phy.o.ohm_law_divided
      feedback: 'A larger resistance needs a larger p.d. for the same current, so V = I × R: the two multiply.'
    - id: D
      text: 800 V
      correct: false
      misconception_id: mc.phy.o.milliamps_used_as_amps
      feedback: A milliamp is a thousandth of an amp. Change milliamps to amps before using the formula.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Each amp through the resistor needs a certain number of volts.
  - rung: 2
    name: concept
    text:
      en: From R = V ÷ I, the p.d. is V = I × R.
  - rung: 3
    name: first_step
    text:
      en: Change the current into amps first.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 0.08 A by 10 Ω.
  - rung: 5
    name: full_step
    text:
      en: V = 0.08 × 10 = 0.8 V.
  misconception_ids:
  - mc.phy.o.milliamps_used_as_amps
  - mc.phy.o.ohm_law_divided
  - mc.phy.o.ohm_law_upside_down
solution:
  steps:
  - n: 1
    latex: I = 80\ \text{mA} = 0.08\ \text{A}
    reason: A thousand mA in 1 A
    check_id: chk_build_phy_elq_0060_ia
  - n: 2
    latex: V = I R = 0.08 \times 10 = 0.8\ \text{V}
    reason: Rearrange R = V/I
    check_id: chk_build_phy_elq_0060_ans
