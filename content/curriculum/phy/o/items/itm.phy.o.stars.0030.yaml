kc_ids:
- kc.phy.o.stars.life_cycle_of_stars
stem: Astronomers describe the life of a star with the same mass as the Sun.
parts:
- id: a
  prompt: Which sequence is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Nebula, protostar, main sequence, red supergiant, supernova, black hole
      correct: false
      misconception_id: mc.phy.o.small_star_ends_violently
      feedback: Only stars of much more than the Sun's mass end in a supernova. The Sun will swell into a red giant, shed its outer layers and leave a white dwarf.
    - id: B
      text: Protostar, nebula, red giant, main sequence, white dwarf
      correct: false
      misconception_id: mc.phy.o.life_cycle_order_muddled
      feedback: Gas cloud, then protostar, then the long main-sequence stage, then the giant stage, then the end. The giant stage comes after the core's hydrogen runs out.
    - id: C
      text: Nebula, protostar, main sequence, red giant, planetary nebula, white dwarf
      correct: true
    - id: D
      text: Nebula, protostar, main sequence, and it stays there for ever
      correct: false
      misconception_id: mc.phy.o.stars_never_change
      feedback: A star's fuel runs out in the end. Its life is so long, millions to billions of years, that we never see one star change much.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about how a star's mass decides its life story.
  - rung: 2
    name: concept
    text:
      en: Stars form from collapsing gas, shine for most of their lives by fusing hydrogen, and end when the fuel runs out.
  - rung: 3
    name: first_step
    text:
      en: A star like the Sun ends as a white dwarf; a much more massive star ends in a supernova.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these stages.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Nebula, protostar, main sequence, red giant, planetary nebula, white dwarf.'
  misconception_ids:
  - mc.phy.o.life_cycle_order_muddled
  - mc.phy.o.small_star_ends_violently
  - mc.phy.o.stars_never_change
