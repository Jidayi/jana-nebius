id: itm.phy.o.density.0026
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.density.measuring_density
stem: An empty beaker has a mass of 85 g. Then 80 cm³ of ethanol is poured in from a measuring cylinder, and the beaker and ethanol together have a mass of 148.2 g.
parts:
- id: a
  prompt: Calculate the density of the ethanol in g/cm³.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 1.85 g/cm³
      correct: false
      misconception_id: mc.phy.o.container_mass_not_subtracted
      feedback: The balance weighs the beaker as well. Subtract the mass of the empty beaker to get the mass of the liquid alone.
    - id: B
      text: 1.27 g/cm³
      correct: false
      misconception_id: mc.phy.o.density_volume_over_mass
      feedback: 'Density says how much mass is packed into each unit of volume: mass ÷ volume. A small, heavy object must come out with a large density.'
    - id: C
      text: 0.79 g/cm³
      correct: true
    - id: D
      text: 5056 g/cm³
      correct: false
      misconception_id: mc.phy.o.density_mass_times_volume
      feedback: Doubling the size of a lump of iron doubles its mass and its volume but leaves its density the same. That only works if density = mass ÷ volume.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The balance reading includes the beaker.
  - rung: 2
    name: concept
    text:
      en: Find the mass of the ethanol alone first.
  - rung: 3
    name: first_step
    text:
      en: Work out 148.2 − 85.
  - rung: 4
    name: worked_step
    text:
      en: The ethanol has a mass of 63.2 g; divide by its volume.
  - rung: 5
    name: full_step
    text:
      en: The density of the ethanol is 0.79 g/cm³.
  misconception_ids:
  - mc.phy.o.container_mass_not_subtracted
  - mc.phy.o.density_mass_times_volume
  - mc.phy.o.density_volume_over_mass
solution:
  steps:
  - n: 1
    latex: m = 148.2 - 85 = 63.2\ \text{g}
    reason: Take away the beaker's own mass
    check_id: chk_build_phy_den_0026_ml
  - n: 2
    latex: \rho = \frac{63.2}{80} = 0.79\ \text{g/cm}^3
    reason: Density = mass ÷ volume
    check_id: chk_build_phy_den_0026_ans
