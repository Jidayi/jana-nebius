id: itm.phy.o.em_spectrum.0023
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.em_spectrum.em_wave_calculations
stem: A microwave oven uses microwaves with a frequency of 2.45 GHz.
parts:
- id: a
  prompt: Calculate their wavelength in centimetres.
  marks: 2
  answer:
    kind: numeric
    value: '12.2'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_ems_0023_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which equation links the speed, frequency and wavelength of a wave?
  - rung: 2
    name: concept
    text:
      en: Every electromagnetic wave travels at c = 3.0 × 10⁸ m/s, and c = f × λ, so λ = c ÷ f.
  - rung: 3
    name: first_step
    text:
      en: 'Write the frequency in hertz: 2.45 GHz = 2.45 × 10⁹ Hz.'
  - rung: 4
    name: worked_step
    text:
      en: λ = 3.0 × 10⁸ ÷ (2.45 × 10⁹), then change metres into centimetres.
  - rung: 5
    name: full_step
    text:
      en: λ = 12.2 cm.
  misconception_ids:
  - mc.phy.o.wave_prefix_ignored
  - mc.phy.o.wave_equation_inverted
  - mc.phy.o.em_uses_sound_speed
  - mc.phy.o.prefix_confused_with_neighbour
solution:
  steps:
  - n: 1
    latex: f = 2.45\ \text{GHz} = 2.45 \times 10^{9}\ \text{Hz}
    reason: Write the prefix as a power of ten
  - n: 2
    latex: \lambda = \frac{c}{f} = \frac{3.0 \times 10^{8}}{2.45 \times 10^{9}} = 0.122\ \text{m}
    reason: Rearrange c = fλ
    check_id: chk_build_phy_ems_0023_lm
  - n: 3
    latex: 0.122\ \text{m} = 12.2\ \text{cm}
    reason: A metre is a hundred centimetres
    check_id: chk_build_phy_ems_0023_ans
difficulty:
  prior: 0.3
  band: core
