kc_ids:
- kc.phy.o.electrical_quantities.electric_charge
stem: A plastic ruler and a duster start uncharged. After rubbing, the plastic ruler has a charge of −3.2 nC.
parts:
- id: a
  prompt: What is the charge on the duster, in nC?
  marks: 1
  answer:
    kind: numeric
    value: '3.2'
    unit: nC
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0007_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Where did the electrons on the rubbed object come from?
  - rung: 2
    name: concept
    text:
      en: Rubbing makes no new charge; it moves electrons from one object to the other.
  - rung: 3
    name: first_step
    text:
      en: The duster has lost exactly the electrons the plastic ruler gained.
  - rung: 4
    name: worked_step
    text:
      en: So its charge has the same size and the opposite sign.
  - rung: 5
    name: full_step
    text:
      en: The duster has a charge of +3.2 nC.
  misconception_ids:
  - mc.phy.o.rubbed_pair_same_charge
  - mc.phy.o.charge_created_by_rubbing
solution:
  steps:
  - n: 1
    latex: \text{electrons gained by one} = \text{electrons lost by the other}
    reason: Charge is moved, not made
  - n: 2
    latex: Q = +3.2\ \text{nC}
    reason: Equal and opposite charges
    check_id: chk_build_phy_elq_0007_ans
