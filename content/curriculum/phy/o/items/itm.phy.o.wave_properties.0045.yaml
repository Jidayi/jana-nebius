id: itm.phy.o.wave_properties.0045
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.wave_properties.transverse_and_longitudinal
stem: A slinky spring is pushed and pulled so that a longitudinal wave travels along it.
parts:
- id: a
  prompt: How do the coils of the spring move?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Up and down at right angles to the direction of travel
      correct: false
      misconception_id: mc.phy.o.vibration_direction_swapped
      feedback: 'Shake a rope up and down: the vibration is across the direction of travel (transverse). Push a slinky back and forth: the vibration is along it (longitudinal).'
    - id: B
      text: Back and forth along the direction the wave travels
      correct: true
    - id: C
      text: Steadily forwards with the energy to the far end
      correct: false
      misconception_id: mc.phy.o.wave_carries_medium
      feedback: A floating leaf bobs up and down as ripples pass but stays in the same place. Waves carry energy, not the material they travel through.
    - id: D
      text: They stay still while the pulses pass between them
      correct: false
      misconception_id: mc.phy.o.medium_stays_still
      feedback: If the particles did not move they could not pass the energy on. Each one vibrates about a fixed position.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture how one particle of the material moves as the wave goes past.
  - rung: 2
    name: concept
    text:
      en: Compare the direction of that movement with the direction the energy travels.
  - rung: 3
    name: first_step
    text:
      en: Vibrating at right angles to the travel is one kind of wave; vibrating along the travel is the other.
  - rung: 4
    name: worked_step
    text:
      en: Rule out any option that does not fit what the particles actually do.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Back and forth along the direction the wave travels.'
  misconception_ids:
  - mc.phy.o.medium_stays_still
  - mc.phy.o.vibration_direction_swapped
  - mc.phy.o.wave_carries_medium
solution:
  steps:
  - n: 1
    latex: \text{Back and forth along the direction the wave travels}
    reason: Compare the direction of vibration with the direction of travel
