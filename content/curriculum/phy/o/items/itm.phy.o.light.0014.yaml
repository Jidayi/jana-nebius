id: itm.phy.o.light.0014
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.light.plane_mirrors
stem: A cat sits 2 m in front of a plane mirror on a wall.
parts:
- id: a
  prompt: Which statement about the cat's image is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It is real, upright and 2 m behind the mirror
      correct: false
      misconception_id: mc.phy.o.mirror_image_real
      feedback: No light goes behind a mirror. The reflected rays only seem to come from a point behind it, so the image is virtual and no screen can catch it.
    - id: B
      text: It is virtual, inverted and 2 m behind the mirror
      correct: false
      misconception_id: mc.phy.o.mirror_image_upside_down
      feedback: 'Look in a mirror: your head is still at the top. Only left and right swap over, which is why ambulance lettering is printed reversed.'
    - id: C
      text: It is virtual, upright and 2 m behind the mirror
      correct: true
    - id: D
      text: It is virtual, upright and on the mirror surface
      correct: false
      misconception_id: mc.phy.o.mirror_image_on_surface
      feedback: The image is as far behind the mirror as the object is in front of it. From the object to the image is the distance to the mirror and then the same distance again.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture yourself looking into a flat bathroom mirror.
  - rung: 2
    name: concept
    text:
      en: A plane mirror gives a virtual, upright image, the same size as the object.
  - rung: 3
    name: first_step
    text:
      en: The image is as far behind the mirror as the object is in front, and left and right are swapped.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these facts.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It is virtual, upright and 2 m behind the mirror.'
  misconception_ids:
  - mc.phy.o.mirror_image_on_surface
  - mc.phy.o.mirror_image_real
  - mc.phy.o.mirror_image_upside_down
solution:
  steps:
  - n: 1
    latex: \text{It is virtual, upright and 2 m behind the mirror}
    reason: Use the properties of a plane-mirror image
