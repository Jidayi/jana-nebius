id: itm.phy.o.thermal_properties.0057
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.changes_of_state
stem: Water in a pan is boiling at 100 °C. The cook turns the hob up higher.
parts:
- id: a
  prompt: What happens to the temperature of the boiling water?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It rises above 100 °C, because more energy is going in
      correct: false
      misconception_id: mc.phy.o.boiling_point_rises_with_heating
      feedback: At a given pressure water boils at one temperature. Turning the heat up makes it boil away faster, but the boiling water gets no hotter.
    - id: B
      text: It stays at 100 °C; the water just boils away faster
      correct: true
    - id: C
      text: It rises, because the particles keep getting faster while boiling
      correct: false
      misconception_id: mc.phy.o.temperature_rises_during_melting
      feedback: 'While a pure substance changes state its temperature stays constant: the energy goes into separating the particles, not into speeding them up.'
    - id: D
      text: It stays the same, because no more energy is taken in
      correct: false
      misconception_id: mc.phy.o.no_energy_when_temperature_constant
      feedback: The heater is still on during the flat part, so energy is still going in. It is used to pull particles apart instead of raising the temperature.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Think about what the energy does to the particles: speed them up, or separate them.'
  - rung: 2
    name: concept
    text:
      en: At a fixed pressure, a pure liquid boils at one temperature.
  - rung: 3
    name: first_step
    text:
      en: During a change of state of a pure substance, ask what happens to the temperature and to the energy.
  - rung: 4
    name: worked_step
    text:
      en: Remember that evaporation happens at the surface and that only some particles escape.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It stays at 100 °C; the water just boils away faster.'
  misconception_ids:
  - mc.phy.o.boiling_point_rises_with_heating
  - mc.phy.o.no_energy_when_temperature_constant
  - mc.phy.o.temperature_rises_during_melting
solution:
  steps:
  - n: 1
