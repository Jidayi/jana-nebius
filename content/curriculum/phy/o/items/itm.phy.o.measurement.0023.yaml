stem: 'A list of quantities is: distance, displacement, speed, velocity.'
parts:
- id: a
  prompt: Which pair are both scalars?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Displacement and velocity
      correct: false
      misconception_id: mc.phy.o.vector_as_scalar
      feedback: 'Walking forward and then the same distance back leaves you where you started: the displacement is zero even though the distance is not. Vectors need a direction.'
    - id: B
      text: Distance and velocity
      correct: false
      misconception_id: mc.phy.o.speed_as_vector
      feedback: A car going round a bend at a steady speed has the same speed but a changing velocity. Speed is the size only; velocity adds the direction.
    - id: C
      text: Speed and displacement
      correct: false
      misconception_id: mc.phy.o.speed_as_vector
      feedback: A car going round a bend at a steady speed has the same speed but a changing velocity. Speed is the size only; velocity adds the direction.
    - id: D
      text: Distance and speed
      correct: true
  show_working: false
