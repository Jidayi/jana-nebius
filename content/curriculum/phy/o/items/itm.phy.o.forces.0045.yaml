id: itm.phy.o.forces.0045
version: 0.1.1
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.friction_and_terminal_velocity
stem: A parachutist of mass 75 kg is falling. At one moment the air resistance on them is 150 N. Take g = 10 N/kg.
parts:
- id: a
  prompt: Find their acceleration at that moment.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 10 m/s²
      correct: false
      misconception_id: mc.phy.o.falling_drag_ignored
      feedback: 'An object falls at g only when its weight is the only force. With drag, use the resultant force: weight minus drag, then divide by the mass.'
    - id: B
      text: 8 m/s²
      correct: true
    - id: C
      text: 12 m/s²
      correct: false
      misconception_id: mc.phy.o.opposite_vectors_added
      feedback: 'Two teams pulling a rope in opposite directions cancel each other out: subtract the smaller pull from the larger.'
    - id: D
      text: 2 m/s²
      correct: false
      misconception_id: mc.phy.o.drag_alone_as_resultant
      feedback: 'Two forces act on the faller: its weight down and the drag up. The resultant is the difference between them.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Two forces act: the weight downwards and the air resistance upwards.'
  - rung: 2
    name: concept
    text:
      en: The resultant force is weight − air resistance; then use a = F ÷ m.
  - rung: 3
    name: first_step
    text:
      en: Find the weight from mass × g first.
  - rung: 4
    name: worked_step
    text:
      en: The weight is 750 N, so the resultant force is 600 N.
  - rung: 5
    name: full_step
    text:
      en: a = 600 ÷ 75 = 8 m/s², less than g because of the drag.
  misconception_ids:
  - mc.phy.o.drag_alone_as_resultant
  - mc.phy.o.falling_drag_ignored
  - mc.phy.o.opposite_vectors_added
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: W = mg = 75 \times 10 = 750\ \text{N}
    reason: Weight
    check_id: chk_build_phy_frc_0045_w
  - n: 2
    latex: F = 750 - 150 = 600\ \text{N}
    reason: 'Resultant force downwards: weight − drag'
    check_id: chk_build_phy_frc_0045_net
  - n: 3
    latex: a = \frac{600}{75} = 8\ \text{m/s}^2
    reason: a = F ÷ m
    check_id: chk_build_phy_frc_0045_ans
