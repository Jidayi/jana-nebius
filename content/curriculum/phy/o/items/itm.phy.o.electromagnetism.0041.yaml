stem: A stronger magnet is used in an induction experiment, moved at the same speed.
parts:
- id: a
  prompt: What happens to the induced e.m.f.?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It decreases
      correct: false
      misconception_id: mc.phy.o.induction_factor_reversed
      feedback: The faster the field changes, the bigger the e.m.f. Faster motion, a stronger magnet and more turns all increase it.
    - id: B
      text: It increases
      correct: true
    - id: C
      text: It stays the same, as only the speed matters
      correct: false
      misconception_id: mc.phy.o.induction_factor_reversed
      feedback: The faster the field changes, the bigger the e.m.f. Faster motion, a stronger magnet and more turns all increase it.
    - id: D
      text: It becomes zero unless the coil is connected to a cell
      correct: false
      misconception_id: mc.phy.o.emf_needs_closed_circuit
      feedback: A voltmeter across the ends of an open coil shows an e.m.f. when a magnet moves in it; only a current needs a complete circuit.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Ask what is changing in the magnetic field through the coil.
  - rung: 2
    name: concept
    text:
      en: An e.m.f. is induced while the field through a coil changes; faster change, a stronger magnet and more turns give a bigger e.m.f., and reversing the change reverses it.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: A stronger magnet means a bigger change in the field through the coil.
  - rung: 5
    name: full_step
    text:
      en: It increases. A stronger magnet means a bigger change in the field through the coil.
  misconception_ids:
  - mc.phy.o.emf_needs_closed_circuit
  - mc.phy.o.induction_factor_reversed
