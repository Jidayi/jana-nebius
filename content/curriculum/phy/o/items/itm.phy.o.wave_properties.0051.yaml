stem: Plane water waves reflect from a straight harbour wall.
parts:
- id: a
  prompt: How do the reflected waves compare with the incoming waves?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: They are slower, with a shorter wavelength
      correct: false
      misconception_id: mc.phy.o.reflection_changes_wavelength
      feedback: A reflected wave stays in the same material, so its speed, wavelength and frequency are unchanged; only its direction changes.
    - id: B
      text: They have a lower frequency because some energy is lost
      correct: false
      misconception_id: mc.phy.o.reflection_changes_wavelength
      feedback: A reflected wave stays in the same material, so its speed, wavelength and frequency are unchanged; only its direction changes.
    - id: C
      text: They spread out in a semicircle as if from a gap
      correct: false
      misconception_id: mc.phy.o.wave_effects_confused
      feedback: 'Reflection: bouncing back from a barrier. Refraction: changing direction because the speed changes. Diffraction: spreading out through a gap or round an edge.'
    - id: D
      text: Same speed, wavelength and frequency; only the direction changes
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Decide which effect is involved: bouncing back, bending at a change of depth, or spreading through a gap.'
  - rung: 2
    name: concept
    text:
      en: The source sets the frequency, and nothing at a boundary or a gap can change it.
  - rung: 3
    name: first_step
    text:
      en: Speed and wavelength change together only when the depth of the water changes.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these rules.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Same speed, wavelength and frequency; only the direction changes.'
  misconception_ids:
  - mc.phy.o.reflection_changes_wavelength
  - mc.phy.o.wave_effects_confused
solution:
  steps:
  - n: 1
    latex: \text{Same speed, wavelength and frequency; only the direction changes}
    reason: Match the effect to what changes and what stays the same
