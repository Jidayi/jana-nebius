stem: A solenoid carries a current.
parts:
- id: a
  prompt: Where is its magnetic field strongest?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Outside the coil, round its sides
      correct: false
      misconception_id: mc.phy.o.solenoid_field_weak_inside
      feedback: Inside a solenoid the field lines are close together and parallel; outside they spread out like a bar magnet's.
    - id: B
      text: Inside the coil
      correct: true
    - id: C
      text: Far from the coil, where the lines spread out
      correct: false
      misconception_id: mc.phy.o.field_lines_spacing_reversed
      feedback: Lines crowd together at the poles, where the field is strongest. The closer the lines, the stronger the field.
    - id: D
      text: 'Nowhere: a coil has no field, only a straight wire does'
      correct: false
      misconception_id: mc.phy.o.solenoid_has_no_poles
      feedback: 'Hang a coil carrying a current and it turns to point north-south like a compass: one end is a north pole.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture the field lines round the wire or coil.
  - rung: 2
    name: concept
    text:
      en: A wire's field lines are circles round it, set by the right-hand grip rule; a coil's field is like a bar magnet's, and grows with the current, the number of turns and an iron core.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Inside a solenoid the field lines are close together and parallel.
  - rung: 5
    name: full_step
    text:
      en: Inside the coil. Inside a solenoid the field lines are close together and parallel.
  misconception_ids:
  - mc.phy.o.field_lines_spacing_reversed
  - mc.phy.o.solenoid_field_weak_inside
  - mc.phy.o.solenoid_has_no_poles
