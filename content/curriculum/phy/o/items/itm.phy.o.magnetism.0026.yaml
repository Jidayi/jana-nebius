stem: A compass needle is itself a tiny magnet.
parts:
- id: a
  prompt: Why does its north end point along a field line?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: The field pulls its north pole towards the magnet's north pole
      correct: false
      misconception_id: mc.phy.o.compass_points_at_like_pole
      feedback: 'The compass needle is a small magnet: its north end is pushed away from a north pole and pulled towards a south pole.'
    - id: B
      text: The field pushes its north pole towards the magnet's north pole
      correct: false
      misconception_id: mc.phy.o.field_lines_s_to_n
      feedback: Outside a magnet the field points from the north pole round to the south pole, the way a small compass's north end points.
    - id: C
      text: The field pushes its north pole along the field direction
      correct: true
    - id: D
      text: Only a needle lying exactly on a drawn line feels the field
      correct: false
      misconception_id: mc.phy.o.field_only_on_drawn_lines
      feedback: A compass placed between two drawn lines still turns. The lines show the field's direction and strength; the field is everywhere near the magnet.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture a small plotting compass placed at that point near the magnet.
  - rung: 2
    name: concept
    text:
      en: Field lines run from north to south outside a magnet, never cross, and are closest where the field is strongest, at the poles.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: The field direction is defined as the way a north pole is pushed.
  - rung: 5
    name: full_step
    text:
      en: The field pushes its north pole along the field direction. The field direction is defined as the way a north pole is pushed.
  misconception_ids:
  - mc.phy.o.compass_points_at_like_pole
  - mc.phy.o.field_lines_s_to_n
  - mc.phy.o.field_only_on_drawn_lines
