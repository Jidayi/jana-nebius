id: itm.phy.o.pressure.0003
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.pressure_on_surfaces
stem: The heel of a shoe presses on the floor with a force of 300 N over an area of 4 cm².
parts:
- id: a
  prompt: Calculate the pressure in kilopascals.
  marks: 2
  answer:
    kind: numeric
    value: '750'
    unit: kPa
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_prs_0003_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A pascal is one newton on each square metre, so the area must be in m².
  - rung: 2
    name: concept
    text:
      en: 1 m² is 10000 cm², because the length factor of a hundred is squared.
  - rung: 3
    name: first_step
    text:
      en: Change 4 cm² into m² by dividing by 10000.
  - rung: 4
    name: worked_step
    text:
      en: The area is 0.0004 m²; divide 300 N by it and change pascals into kilopascals.
  - rung: 5
    name: full_step
    text:
      en: The pressure is 750 kPa.
  misconception_ids:
  - mc.phy.o.pressure_area_cm2_not_converted
  - mc.phy.o.pressure_area_factor_not_squared
  - mc.phy.o.pressure_force_times_area
solution:
  steps:
  - n: 1
    latex: 1\ \text{m}^2 = 10000\ \text{cm}^2
    reason: 100 cm by 100 cm
    check_id: chk_build_phy_prs_0003_k
  - n: 2
    latex: A = 4 \div 10000 = 0.0004\ \text{m}^2
    reason: Change cm² into m²
    check_id: chk_build_phy_prs_0003_am
  - n: 3
    latex: p = \frac{300}{0.0004} = 750000\ \text{Pa}
    reason: Pressure = force ÷ area
    check_id: chk_build_phy_prs_0003_pa
  - n: 4
    latex: 750000\ \text{Pa} = 750\ \text{kPa}
    reason: Pascals into kilopascals
    check_id: chk_build_phy_prs_0003_ans
