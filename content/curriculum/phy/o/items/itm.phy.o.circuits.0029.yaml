id: itm.phy.o.circuits.0029
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.parallel_circuits
stem: A 3 Ω resistor and a 6 Ω resistor are connected in parallel across a 24 V battery.
parts:
- id: a
  prompt: Calculate the current supplied by the battery.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 2.67 A
      correct: false
      misconception_id: mc.phy.o.parallel_resistances_added
      feedback: Side-by-side paths give the current more ways through, so the combined resistance is less than the smallest one. Use 1/R = 1/R1 + 1/R2.
    - id: B
      text: 12 A
      correct: true
    - id: C
      text: 8 A
      correct: false
      misconception_id: mc.phy.o.parallel_one_branch_only
      feedback: The supply feeds every branch at once. Find the current in each branch and add them.
    - id: D
      text: 5.33 A
      correct: false
      misconception_id: mc.phy.o.parallel_resistance_averaged
      feedback: Two equal 10 Ω resistors side by side give 5 Ω, not their average of 10 Ω. The combined resistance is less than either one.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Each resistor is connected straight across the battery.
  - rung: 2
    name: concept
    text:
      en: So each has the full 24 V across it, and the branch currents add up to the battery current.
  - rung: 3
    name: first_step
    text:
      en: Find the current in each branch with I = V/R, using 24 V each time.
  - rung: 4
    name: worked_step
    text:
      en: The branch currents are 8 A and 4 A; add them.
  - rung: 5
    name: full_step
    text:
      en: The battery supplies 12 A.
  misconception_ids:
  - mc.phy.o.parallel_one_branch_only
  - mc.phy.o.parallel_resistance_averaged
  - mc.phy.o.parallel_resistances_added
solution:
  steps:
  - n: 1
    latex: I_1 = \frac{24}{3} = 8\ \text{A}
    reason: Each branch has the full supply p.d.
    check_id: chk_build_phy_cir_0029_i1
  - n: 2
    latex: I_2 = \frac{24}{6} = 4\ \text{A}
    reason: The same for the other branch
    check_id: chk_build_phy_cir_0029_i2
  - n: 3
    latex: I = 8 + 4 = 12\ \text{A}
    reason: Branch currents add
    check_id: chk_build_phy_cir_0029_ans
