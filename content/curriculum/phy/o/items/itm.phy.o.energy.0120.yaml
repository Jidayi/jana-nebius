id: itm.phy.o.energy.0120
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.energy_resources
stem: A farmer grows sugar cane to make ethanol, a fuel for cars.
parts:
- id: a
  prompt: Why is ethanol called a renewable fuel?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: New crops can be grown to replace what is burned
      correct: true
    - id: B
      text: Burning it gives out no carbon dioxide
      correct: false
      misconception_id: mc.phy.o.renewable_means_clean
      feedback: A dam is renewable but floods valleys, and wind farms change the landscape. Renewable is about being replaced, not about having no effects.
    - id: C
      text: It is not renewable, because it is burned like petrol
      correct: false
      misconception_id: mc.phy.o.biofuel_seen_as_nonrenewable
      feedback: New trees and crops can be grown as fast as we burn them, so biofuels are renewable even though burning them releases carbon dioxide.
    - id: D
      text: The same ethanol can be collected and burned again
      correct: false
      misconception_id: mc.phy.o.renewable_means_reusable
      feedback: No fuel can be burned twice. Renewable means nature replaces the resource, like new crops or more wind.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Read each option and decide whether it is really true for this resource.
  - rung: 2
    name: concept
    text:
      en: Sugar cane grows back every season.
  - rung: 3
    name: first_step
    text:
      en: Renewable means replaced as fast as we use it; reliable means there when we need it. Neither tells you the cost or the effects on the environment.
  - rung: 4
    name: worked_step
    text:
      en: Rule out each option that mixes these ideas up or gets the original source of the energy wrong.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: New crops can be grown to replace what is burned.'
  misconception_ids:
  - mc.phy.o.biofuel_seen_as_nonrenewable
  - mc.phy.o.renewable_means_clean
  - mc.phy.o.renewable_means_reusable
solution:
  steps:
  - n: 1
    latex: \text{New crops can be grown to replace what is burned}
    reason: Compare renewability, reliability, cost and effects
