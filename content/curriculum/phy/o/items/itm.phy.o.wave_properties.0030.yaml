id: itm.phy.o.wave_properties.0030
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.wave_properties.wave_equation
stem: Ripples cross a ripple tank at 0.125 m/s. The dipper that makes them vibrates at 5 Hz.
parts:
- id: a
  prompt: Calculate the wavelength in centimetres.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 0.025 cm
      correct: false
      misconception_id: mc.phy.o.wave_prefix_ignored
      feedback: Put every value into hertz, metres and seconds before using a formula, then change the answer into the unit the question asks for.
    - id: B
      text: 4000 cm
      correct: false
      misconception_id: mc.phy.o.wave_equation_inverted
      feedback: 'From v = fλ: λ = v/f and f = v/λ. The speed always goes on top when you divide.'
    - id: C
      text: 2.5 cm
      correct: true
    - id: D
      text: 62.5 cm
      correct: false
      misconception_id: mc.phy.o.wave_equation_multiplied
      feedback: Multiplying a speed by a frequency gives a huge number that is not a length. If v is one of the values you know, divide it by the other one.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Start from v = f × λ.
  - rung: 2
    name: concept
    text:
      en: 'To find λ, divide the speed by the frequency: λ = v ÷ f.'
  - rung: 3
    name: first_step
    text:
      en: The values are already in SI units, so no conversion is needed.
  - rung: 4
    name: worked_step
    text:
      en: Divide 0.125 by the frequency in hertz, then change metres into centimetres.
  - rung: 5
    name: full_step
    text:
      en: λ = 2.5 cm.
  misconception_ids:
  - mc.phy.o.wave_equation_inverted
  - mc.phy.o.wave_equation_multiplied
  - mc.phy.o.wave_prefix_ignored
solution:
  steps:
  - n: 1
    latex: \lambda = \frac{v}{f} = \frac{0.125}{5} = 0.025\ \text{m}
    reason: Rearrange v = fλ
    check_id: chk_build_phy_wav_0030_lm
  - n: 2
    latex: 0.025\ \text{m} = 2.5\ \text{cm}
    reason: A metre is a hundred centimetres
    check_id: chk_build_phy_wav_0030_ans
