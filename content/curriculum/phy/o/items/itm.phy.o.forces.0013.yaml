id: itm.phy.o.forces.0013
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.resultant_force
stem: A speedboat has a thrust from the engine of 8000 N acting forwards. Against it act water resistance of 2400 N and air resistance of 400 N.
parts:
- id: a
  prompt: Find the size of the resultant force.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 10800 N
      correct: false
      misconception_id: mc.phy.o.opposite_vectors_added
      feedback: 'Two teams pulling a rope in opposite directions cancel each other out: subtract the smaller pull from the larger.'
    - id: B
      text: 5200 N
      correct: true
    - id: C
      text: 5600 N
      correct: false
      misconception_id: mc.phy.o.resultant_one_force_left_out
      feedback: List every force acting along the line before you combine them. Each one changes the resultant, so tick them off as you use them.
    - id: D
      text: 8000 N
      correct: false
      misconception_id: mc.phy.o.largest_vector_only
      feedback: A small current still slows a boat. Every vector acting changes the resultant, so combine them all.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Draw each force as an arrow along one line.
  - rung: 2
    name: concept
    text:
      en: Forces in the same direction add; forces in opposite directions subtract.
  - rung: 3
    name: first_step
    text:
      en: Add the two backward forces, then take the total from the forward force.
  - rung: 4
    name: worked_step
    text:
      en: The backward forces total 2800 N; work out 8000 − 2800.
  - rung: 5
    name: full_step
    text:
      en: The resultant force is 5200 N forwards, so the speed increases.
  misconception_ids:
  - mc.phy.o.largest_vector_only
  - mc.phy.o.opposite_vectors_added
  - mc.phy.o.resultant_one_force_left_out
solution:
  steps:
  - n: 1
    latex: 2400 + 400 = 2800\ \text{N}
    reason: Add the two backward forces
    check_id: chk_build_phy_frc_0013_back
  - n: 2
    latex: 8000 - 2800 = 5200\ \text{N}
    reason: Forward minus backward
    check_id: chk_build_phy_frc_0013_ans
