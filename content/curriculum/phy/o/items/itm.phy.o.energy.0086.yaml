stem: An electric motor lifts a load of weight 300 N through a height of 6 m in 5 s.
parts:
- id: a
  prompt: Calculate the useful power output of the motor.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 1800 W
      correct: false
      misconception_id: mc.phy.o.power_is_energy
      feedback: 'Two runners do the same work climbing the same stairs, but the faster one has more power. Power needs the time: divide the energy by it.'
    - id: B
      text: 9000 W
      correct: false
      misconception_id: mc.phy.o.power_energy_times_time
      feedback: 'Power is how fast energy is transferred: energy ÷ time. Doing the same job in less time means more power.'
    - id: C
      text: 360 W
      correct: true
    - id: D
      text: 0.00278 W
      correct: false
      misconception_id: mc.phy.o.energy_formula_inverted
      feedback: 'Power is energy per second, so energy goes on top. Check the units of the answer: J ÷ s is a watt, s ÷ J is not.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Power is the work done each second.
  - rung: 2
    name: concept
    text:
      en: Find the work done (weight × height), then divide by the time.
  - rung: 3
    name: first_step
    text:
      en: The work done is 300 × 6 = 1800 J.
  - rung: 4
    name: worked_step
    text:
      en: Work out 1800 ÷ 5.
  - rung: 5
    name: full_step
    text:
      en: The power is 360 W.
  misconception_ids:
  - mc.phy.o.energy_formula_inverted
  - mc.phy.o.power_energy_times_time
  - mc.phy.o.power_is_energy
solution:
  steps:
  - n: 1
    latex: W = Fd = 300 \times 6 = 1800\ \text{J}
    reason: Work done lifting the load
    check_id: chk_build_phy_nrg_0086_wd
  - n: 2
    latex: P = \frac{W}{t} = \frac{1800}{5} = 360\ \text{W}
    reason: Power = work ÷ time
    check_id: chk_build_phy_nrg_0086_ans
