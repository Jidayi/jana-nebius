id: itm.phy.o.radioactivity.0044
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.half_life
stem: The half-life of phosphorus-32 is 14 days.
parts:
- id: a
  prompt: What fraction of the phosphorus-32 nuclei in a sample are still undecayed after 42 days? Give the fraction as a decimal.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '0.125'
      correct: true
    - id: B
      text: '0.167'
      correct: false
      misconception_id: mc.phy.o.half_life_linear
      feedback: 'Each half-life halves what is left at its start: 80, then 40, then 20, then 10. After three half-lives that is an eighth, not a sixth.'
    - id: C
      text: '0.875'
      correct: false
      misconception_id: mc.phy.o.decayed_for_remaining
      feedback: 'Read the question again: the amount left is what halving gives; the amount decayed is the start minus that.'
    - id: D
      text: '0.0625'
      correct: false
      misconception_id: mc.phy.o.half_lives_counted_wrongly
      feedback: 'Count the halvings, not the values: going from 80 to 40 to 20 is two half-lives, even though three numbers are written.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: In each half-life, half of the undecayed nuclei decay.
  - rung: 2
    name: concept
    text:
      en: Find how many half-lives have passed.
  - rung: 3
    name: first_step
    text:
      en: Each half-life multiplies the fraction left by one half.
  - rung: 4
    name: worked_step
    text:
      en: There are 3 half-lives.
  - rung: 5
    name: full_step
    text:
      en: The fraction left is 0.125.
  misconception_ids:
  - mc.phy.o.decayed_for_remaining
  - mc.phy.o.half_life_linear
  - mc.phy.o.half_lives_counted_wrongly
solution:
  steps:
  - n: 1
    latex: \frac{42}{14} = 3\ \text{half-lives}
    reason: Time ÷ half-life
    check_id: chk_build_phy_rad_0044_n
  - n: 2
    latex: \frac{1}{2^{3}} = 0.125
    reason: Halve once per half-life
    check_id: chk_build_phy_rad_0044_ans
