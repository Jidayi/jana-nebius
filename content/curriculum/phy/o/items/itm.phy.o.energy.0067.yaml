id: itm.phy.o.energy.0067
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.work_done
stem: The joule is the unit of work done.
parts:
- id: a
  prompt: Which describes one joule of work?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: A force of one newton acting for one second
      correct: false
      misconception_id: mc.phy.o.work_force_times_time
      feedback: 'Work done uses distance: W = F × d. Force × time is something different (the impulse), not the energy transferred.'
    - id: B
      text: A force of one newton for each metre of distance
      correct: false
      misconception_id: mc.phy.o.work_force_over_distance
      feedback: Work done = force × distance moved along the force. A bigger push over a longer distance means more work.
    - id: C
      text: The force needed to hold up a small apple
      correct: false
      misconception_id: mc.phy.o.energy_force_confused
      feedback: A force is a push or a pull in newtons. Energy is measured in joules, and a force only transfers energy when it moves something along its direction.
    - id: D
      text: A force of one newton moving its point of action one metre along the force
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Work is done when a force moves something.
  - rung: 2
    name: concept
    text:
      en: Work done = force × distance moved along the force.
  - rung: 3
    name: first_step
    text:
      en: Check each option against W = F × d.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that ignore the distance moved along the force.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: A force of one newton moving its point of action one metre along the force.'
  misconception_ids:
  - mc.phy.o.energy_force_confused
  - mc.phy.o.work_force_over_distance
  - mc.phy.o.work_force_times_time
solution:
  steps:
  - n: 1
    latex: \text{A force of one newton moving its point of action one metre along the force}
    reason: Work needs a distance moved along the force
