subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.types_of_radiation
stem: The three radiations differ in how strongly they ionise the air they pass through.
parts:
- id: a
  prompt: Which statement is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Gamma ionises most strongly because it is the most penetrating
      correct: false
      misconception_id: mc.phy.o.ionising_follows_penetration
      feedback: It is the other way round. Alpha ionises so strongly that it uses up its energy within a few centimetres of air; gamma ionises weakly, so it travels much further.
    - id: B
      text: Alpha ionises most strongly, so it travels furthest in air
      correct: false
      misconception_id: mc.phy.o.penetration_order_wrong
      feedback: Paper stops alpha; a few millimetres of aluminium stop beta; gamma is only reduced by thick lead or concrete.
    - id: C
      text: Alpha ionises most strongly, so it travels only a few centimetres in air
      correct: true
    - id: D
      text: Gamma ionises most strongly because it is a heavy charged particle
      correct: false
      misconception_id: mc.phy.o.gamma_is_particle
      feedback: 'Gamma rays are electromagnetic waves, like X-rays: no mass and no charge.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Think about what each radiation is: its mass and its charge.'
  - rung: 2
    name: concept
    text:
      en: Alpha is heavy and doubly charged; beta is a light, charged electron; gamma is an uncharged wave.
  - rung: 3
    name: first_step
    text:
      en: A radiation that ionises a lot gives away its energy quickly.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that do not fit those properties.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Alpha ionises most strongly, so it travels only a few centimetres in air.'
  misconception_ids:
  - mc.phy.o.gamma_is_particle
  - mc.phy.o.ionising_follows_penetration
  - mc.phy.o.penetration_order_wrong
