id: itm.phy.o.circuits.0060
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.potential_dividers
stem: A potential divider is made from a 300 Ω resistor and a 3000 Ω resistor in series across a 9 V supply. The output is taken across the 3000 Ω resistor.
parts:
- id: a
  prompt: Calculate the output p.d. across the 3000 Ω resistor.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 8.18 V
      correct: true
    - id: B
      text: 0.818 V
      correct: false
      misconception_id: mc.phy.o.divider_wrong_resistor
      feedback: Vout = V × R(across the output) ÷ (R1 + R2). Put on top the resistor that the output is taken across.
    - id: C
      text: 90 V
      correct: false
      misconception_id: mc.phy.o.divider_ratio_of_resistors
      feedback: The output can never be more than the supply p.d. Divide by the total resistance, R1 + R2, not by the other resistor.
    - id: D
      text: 4.5 V
      correct: false
      misconception_id: mc.phy.o.series_pd_shared_equally
      feedback: 'The p.d. is shared in proportion to resistance: the resistor with twice the resistance has twice the p.d. Only equal resistors share equally.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The two parts of the divider share the supply p.d. in the ratio of their resistances.
  - rung: 2
    name: concept
    text:
      en: Vout = V × (resistance across the output) ÷ (total resistance).
  - rung: 3
    name: first_step
    text:
      en: The total resistance is 300 Ω + 3000 Ω.
  - rung: 4
    name: worked_step
    text:
      en: The total is 3300 Ω; find 3000/3300 of 9 V.
  - rung: 5
    name: full_step
    text:
      en: The output p.d. is 8.18 V.
  misconception_ids:
  - mc.phy.o.divider_ratio_of_resistors
  - mc.phy.o.divider_wrong_resistor
  - mc.phy.o.series_pd_shared_equally
solution:
  steps:
  - n: 1
    latex: R = 300 + 3000 = 3300\ \Omega
    reason: Total resistance of the divider
    check_id: chk_build_phy_cir_0060_rt
  - n: 2
    latex: V_{\text{out}} = 9 \times \frac{3000}{3300} = 8.18\ \text{V}
    reason: The output's share is its fraction of the total resistance
    check_id: chk_build_phy_cir_0060_ans
difficulty:
