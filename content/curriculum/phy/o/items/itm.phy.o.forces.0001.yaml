subject: phy
level: o
kc_ids:
- kc.phy.o.forces.resultant_force
stem: A lorry has a driving force of 6000 N acting forwards. Against it act friction of 1200 N and air resistance of 3200 N.
parts:
- id: a
  prompt: Find the size of the resultant force.
  marks: 1
  answer:
    kind: numeric
    value: '1600'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_frc_0001_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Draw each force as an arrow along one line.
  - rung: 2
    name: concept
    text:
      en: Forces in the same direction add; forces in opposite directions subtract.
  - rung: 3
    name: first_step
    text:
      en: Add the two backward forces, then take the total from the forward force.
  - rung: 4
    name: worked_step
    text:
      en: The backward forces total 4400 N; work out 6000 − 4400.
  - rung: 5
    name: full_step
    text:
      en: The resultant force is 1600 N forwards, so the speed increases.
  misconception_ids:
  - mc.phy.o.opposite_vectors_added
  - mc.phy.o.resultant_one_force_left_out
  - mc.phy.o.largest_vector_only
solution:
  steps:
  - n: 1
    latex: 1200 + 3200 = 4400\ \text{N}
    reason: Add the two backward forces
    check_id: chk_build_phy_frc_0001_back
  - n: 2
    latex: 6000 - 4400 = 1600\ \text{N}
    reason: Forward minus backward
    check_id: chk_build_phy_frc_0001_ans
