stem: Chlorine (proton number 17) has two common isotopes, chlorine-35 and chlorine-37.
parts:
- id: a
  prompt: Which statement about their nuclei is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Chlorine-37 has two more protons
      correct: false
      misconception_id: mc.phy.o.isotopes_differ_in_protons
      feedback: Change the number of protons and you change the element. Isotopes of one element all have the same proton number; only the neutrons differ.
    - id: B
      text: Both have the same nucleon number of 17
      correct: false
      misconception_id: mc.phy.o.same_nucleon_number_isotopes
      feedback: Carbon-14 and nitrogen-14 have the same nucleon number but different proton numbers, so they are different elements, not isotopes.
    - id: C
      text: Both have the same number of neutrons
      correct: false
      misconception_id: mc.phy.o.isotopes_same_neutrons
      feedback: Isotopes are the same element, so they share the proton number. Their neutron numbers are what differ.
    - id: D
      text: Both have 17 protons; chlorine-37 has two more neutrons
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide what makes two nuclides the same element.
  - rung: 2
    name: concept
    text:
      en: Isotopes have the same proton number but different nucleon numbers.
  - rung: 3
    name: first_step
    text:
      en: The names give the nucleon numbers; the element fixes the proton number.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against that definition.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Both have 17 protons; chlorine-37 has two more neutrons.'
  misconception_ids:
