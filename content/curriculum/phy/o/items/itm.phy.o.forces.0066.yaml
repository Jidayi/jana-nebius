id: itm.phy.o.forces.0066
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.circular_motion
stem: A car drives round a roundabout at a constant speed.
parts:
- id: a
  prompt: Which statement is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: There is no resultant force, because its speed is constant
      correct: false
      misconception_id: mc.phy.o.circular_no_force_needed
      feedback: Speed stays the same but the direction changes all the time, so the velocity changes. A changing velocity needs a resultant force.
    - id: B
      text: There is a resultant force outwards, away from the centre
      correct: false
      misconception_id: mc.phy.o.circular_force_outwards
      feedback: 'Draw the circle and the velocity along it at two moments: the change in velocity points into the circle. The resultant force points towards the centre.'
    - id: C
      text: There is a resultant force on the car towards the centre
      correct: true
    - id: D
      text: There is a resultant force forwards, along its motion
      correct: false
      misconception_id: mc.phy.o.resultant_along_motion
      feedback: The resultant force points the way the velocity is changing. A car that is slowing down has a resultant force pointing backwards.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about the velocity of the object, not just its speed.
  - rung: 2
    name: concept
    text:
      en: Going round a circle the direction of motion changes all the time, so the velocity changes.
  - rung: 3
    name: first_step
    text:
      en: A changing velocity needs a resultant force; think about which way the velocity is being turned.
  - rung: 4
    name: worked_step
    text:
      en: Its speed is constant, but is its direction?
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: There is a resultant force on the car towards the centre. The velocity keeps changing direction towards the centre, so the resultant force points to the centre.'
  misconception_ids:
  - mc.phy.o.circular_force_outwards
  - mc.phy.o.circular_no_force_needed
  - mc.phy.o.resultant_along_motion
solution:
  steps:
  - n: 1
    latex: \text{There is a resultant force on the car towards the centre}
    reason: Think about the change in velocity
