stem: A lander on Titan (a moon of Saturn) hangs a 5 kg test mass from a newton meter, which reads 7 N.
parts:
- id: a
  prompt: Calculate the gravitational field strength on Titan (a moon of Saturn).
  marks: 1
  answer:
    kind: numeric
    value: '1.4'
    unit: N/kg
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mwt_0005_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The gravitational field strength is the weight of each kilogram.
  - rung: 2
    name: concept
    text:
      en: Weight = mass × g, so g = weight ÷ mass.
  - rung: 3
    name: first_step
    text:
      en: Divide the newton meter reading by the mass.
  - rung: 4
    name: worked_step
    text:
      en: Work out 7 ÷ 5.
  - rung: 5
    name: full_step
    text:
      en: g = 1.4 N/kg.
  misconception_ids:
  - mc.phy.o.weight_mass_divided_by_g
solution:
  steps:
  - n: 1
    latex: g = \frac{W}{m} = \frac{7}{5} = 1.4\ \text{N/kg}
    reason: g is the weight of each kilogram
    check_id: chk_build_phy_mwt_0005_ans
