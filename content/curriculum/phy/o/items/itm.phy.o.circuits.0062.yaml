stem: A dimmer control for a lamp needs to let a person change the current by turning a knob.
parts:
- id: a
  prompt: Which component should be put in series with the lamp?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: A diode
      correct: false
      misconception_id: mc.phy.o.diode_as_resistor
      feedback: 'A diode is not a resistor: one way round it conducts easily, the other way round it lets almost no current through.'
    - id: B
      text: A thermistor
      correct: false
      misconception_id: mc.phy.o.variable_resistor_is_sensor
      feedback: A variable resistor is adjusted by a person, like a dimmer knob. Only sensors such as thermistors and LDRs change by themselves.
    - id: C
      text: A variable resistor
      correct: true
    - id: D
      text: A fuse
      correct: false
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The person must be able to set the current to any value they like.
  - rung: 2
    name: concept
    text:
      en: A component set by hand is needed, not one that reacts to its surroundings.
  - rung: 3
    name: first_step
    text:
      en: Changing the resistance in series with the lamp changes the current through it.
  - rung: 4
    name: worked_step
    text:
      en: Pick the resistor whose value is adjusted by turning or sliding.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: a variable resistor.'
  misconception_ids:
  - mc.phy.o.diode_as_resistor
  - mc.phy.o.variable_resistor_is_sensor
