stem: Yaw finds that a battery transfers 240 J of energy while it drives 80 C of charge round a circuit.
parts:
- id: a
  prompt: Calculate the e.m.f. of the battery.
  marks: 2
  answer:
    kind: numeric
    value: '3'
    unit: V
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0040_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: E.m.f. is the energy the source gives to each coulomb.
  - rung: 2
    name: concept
    text:
      en: V = W ÷ Q, with W in joules and Q in coulombs.
  - rung: 3
    name: first_step
    text:
      en: The energy is already in joules.
  - rung: 4
    name: worked_step
    text:
      en: Divide 240 J by 80 C.
  - rung: 5
    name: full_step
    text:
      en: V = 240 ÷ 80 = 3 V.
  misconception_ids:
  - mc.phy.o.w_qv_upside_down
  - mc.phy.o.w_qv_multiplied
solution:
  steps:
  - n: 1
    latex: V = \frac{W}{Q} = \frac{240}{80} = 3\ \text{V}
    reason: E.m.f. = energy per unit charge
    check_id: chk_build_phy_elq_0040_ans
