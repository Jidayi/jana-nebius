id: itm.phy.o.particles.0014
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.particles.states_of_matter
stem: Liquids are described as almost incompressible.
parts:
- id: a
  prompt: Why are liquids so hard to compress?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Their particles are far apart but held by strong forces
      correct: false
      misconception_id: mc.phy.o.liquid_particles_far_apart
      feedback: Liquids are hard to squash because their particles are nearly touching. A liquid differs from a solid in that its particles can move past one another, not in their spacing.
    - id: B
      text: Their particles are hard and cannot be squashed
      correct: false
      misconception_id: mc.phy.o.particles_have_bulk_properties
      feedback: A single particle does not melt, feel hot or have a colour. Those are properties of huge numbers of particles together, set by how they are arranged and how fast they move.
    - id: C
      text: Their particles are already touching or nearly touching
      correct: true
    - id: D
      text: Their particles do not move, so they cannot be pushed
      correct: false
      misconception_id: mc.phy.o.solid_particles_motionless
      feedback: Solid particles are held in place but never stop vibrating; the warmer the solid, the more strongly they vibrate.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Picture the particles: how close together are they, and how do they move?'
  - rung: 2
    name: concept
    text:
      en: To compress a material its particles must be pushed closer together.
  - rung: 3
    name: first_step
    text:
      en: 'Test each option against how the material behaves: does it keep its shape, flow, or spread out?'
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that give single particles the properties of the whole material.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Their particles are already touching or nearly touching.'
  misconception_ids:
  - mc.phy.o.liquid_particles_far_apart
  - mc.phy.o.particles_have_bulk_properties
  - mc.phy.o.solid_particles_motionless
solution:
  steps:
  - n: 1
    latex: \text{Their particles are already touching or nearly touching}
    reason: Match the description to the particle model
