id: itm.phy.o.wave_properties.0060
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.wave_properties.wave_behaviour
stem: Straight water waves cross into shallower water. They meet the boundary at an angle.
parts:
- id: a
  prompt: Which way do they change direction, and why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Towards the normal, because they slow down
      correct: true
    - id: B
      text: Away from the normal, because they slow down
      correct: false
      misconception_id: mc.phy.o.slower_bends_away_from_normal
      feedback: The end of a wavefront that reaches the shallow water first slows first, so the wave swings towards the normal. Waves that speed up bend away from it.
    - id: C
      text: Towards the normal, because they speed up
      correct: false
      misconception_id: mc.phy.o.depth_speed_reversed
      feedback: Water waves slow down as the water gets shallower; that is why their wavefronts crowd together near a beach.
    - id: D
      text: They do not change direction; only their speed changes
      correct: false
      misconception_id: mc.phy.o.refraction_no_direction_change
      feedback: At an angle, one end of each wavefront meets the new depth before the other end, so the wavefront turns.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Decide which effect is involved: bouncing back, bending at a change of depth, or spreading through a gap.'
  - rung: 2
    name: concept
    text:
      en: The source sets the frequency, and nothing at a boundary or a gap can change it.
  - rung: 3
    name: first_step
    text:
      en: Speed and wavelength change together only when the depth of the water changes.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these rules.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Towards the normal, because they slow down.'
  misconception_ids:
  - mc.phy.o.depth_speed_reversed
  - mc.phy.o.refraction_no_direction_change
  - mc.phy.o.slower_bends_away_from_normal
solution:
  steps:
  - n: 1
    latex: \text{Towards the normal, because they slow down}
    reason: Match the effect to what changes and what stays the same
