id: itm.phy.o.motion.0123
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.motion.solve_with_equation
stem: A sprinter starts from rest and covers 20 m in 4 s with a steady acceleration.
parts:
- id: a
  prompt: Find the acceleration.
  marks: 3
  answer:
    kind: numeric
    value: '2.50'
    unit: m/s^2
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0123_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which quantities do you know, and which one are you asked for?
  - rung: 2
    name: concept
    text:
      en: Pick the equation of uniform acceleration with those quantities, then make the unknown its subject.
  - rung: 3
    name: first_step
    text:
      en: Rearrange to a = 2s ÷ t^2.
  - rung: 4
    name: worked_step
    text:
      en: a = 2 × 20 ÷ 4^2.
  - rung: 5
    name: full_step
    text:
      en: a = 2 × 20 ÷ 4^2 = 2.50 m/s^2.
  misconception_ids:
  - mc.phy.o.rearrange_sign_error
  - mc.phy.o.square_not_rooted
solution:
  steps:
  - n: 1
    latex: s = ut + \tfrac{1}{2}at^2
    reason: The equation linking the known quantities
  - n: 2
    latex: a = \frac{2s}{t^2}
    reason: Make the unknown the subject
  - n: 3
    latex: a = \frac{2 \times 20}{4^2}
    reason: Substitute
  - n: 4
    latex: a = 2.50\ \text{m/s}^2
    reason: Evaluate
    check_id: chk_build_phy_k_0123_a
