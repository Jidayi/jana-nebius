stem: The scattering experiment changed our picture of the nucleus.
parts:
- id: a
  prompt: Which description of the nucleus did it support?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Very small, dense and positively charged
      correct: true
    - id: B
      text: Large, filling most of the atom
      correct: false
      misconception_id: mc.phy.o.nucleus_fills_atom
      feedback: If the nucleus were a pea in the centre of a football stadium, the atom would be the whole stadium. That is why almost every alpha particle missed it.
    - id: C
      text: Small and negatively charged
      correct: false
      misconception_id: mc.phy.o.nucleus_negative
      feedback: The alpha particles were pushed away and some were turned right back. Like charges repel, so the nucleus must be positive.
    - id: D
      text: Small and light, with the mass in the electrons
      correct: false
      misconception_id: mc.phy.o.mass_spread_through_atom
      feedback: Only a very massive object can turn back a fast alpha particle. Almost all of the atom's mass is in the tiny nucleus.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Recall the three things that happened to alpha particles fired at thin gold foil.
  - rung: 2
    name: concept
    text:
      en: Most went straight through, a few were deflected a little, and a very few were turned back.
  - rung: 3
    name: first_step
    text:
      en: 'Use all three observations: straight through, small deflections, rare rebounds.'
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that contradict what was seen.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Very small, dense and positively charged.'
  misconception_ids:
  - mc.phy.o.mass_spread_through_atom
  - mc.phy.o.nucleus_fills_atom
  - mc.phy.o.nucleus_negative
