id: itm.phy.o.light.0015
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.light.plane_mirrors
stem: A boy stands 1 m from a plane mirror and then backs away until he is 3 m from it.
parts:
- id: a
  prompt: What happens to the actual size of his image?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It becomes three times smaller
      correct: false
      misconception_id: mc.phy.o.mirror_image_shrinks_with_distance
      feedback: A plane-mirror image is always the same size as the object. It only looks smaller from far away, just as a real person does when they walk away from you.
    - id: B
      text: It turns upside down as he moves back
      correct: false
      misconception_id: mc.phy.o.mirror_image_upside_down
      feedback: 'Look in a mirror: your head is still at the top. Only left and right swap over, which is why ambulance lettering is printed reversed.'
    - id: C
      text: It stays on the mirror and does not change
      correct: false
      misconception_id: mc.phy.o.mirror_image_on_surface
      feedback: The image is as far behind the mirror as the object is in front of it. From the object to the image is the distance to the mirror and then the same distance again.
    - id: D
      text: It stays the same as his own size
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture yourself looking into a flat bathroom mirror.
  - rung: 2
    name: concept
    text:
      en: A plane mirror gives a virtual, upright image, the same size as the object.
  - rung: 3
    name: first_step
    text:
      en: The image is as far behind the mirror as the object is in front, and left and right are swapped.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these facts.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It stays the same as his own size.'
  misconception_ids:
  - mc.phy.o.mirror_image_on_surface
  - mc.phy.o.mirror_image_shrinks_with_distance
  - mc.phy.o.mirror_image_upside_down
