id: itm.phy.o.particles.0002
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.particles.states_of_matter
stem: Air in a sealed syringe can be pushed in a long way, but water in the same syringe hardly moves.
parts:
- id: a
  prompt: Why can the air be compressed so much more than the water?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Air particles are softer and can be squashed smaller
      correct: false
      misconception_id: mc.phy.o.particles_have_bulk_properties
      feedback: A single particle does not melt, feel hot or have a colour. Those are properties of huge numbers of particles together, set by how they are arranged and how fast they move.
    - id: B
      text: Water particles are far apart but held by strong forces
      correct: false
      misconception_id: mc.phy.o.liquid_particles_far_apart
      feedback: Liquids are hard to squash because their particles are nearly touching. A liquid differs from a solid in that its particles can move past one another, not in their spacing.
    - id: C
      text: The air particles are far apart, with empty space between them
      correct: true
    - id: D
      text: The spaces between the air particles are filled with a thinner air
      correct: false
      misconception_id: mc.phy.o.air_between_particles
      feedback: 'Air is itself made of particles. Between the particles of any gas there is nothing at all: empty space.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Picture the particles: how close together are they, and how do they move?'
  - rung: 2
    name: concept
    text:
      en: Compressing something means pushing its particles closer together.
  - rung: 3
    name: first_step
    text:
      en: 'Test each option against how the material behaves: does it keep its shape, flow, or spread out?'
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that give single particles the properties of the whole material.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The air particles are far apart, with empty space between them.'
  misconception_ids:
  - mc.phy.o.air_between_particles
  - mc.phy.o.liquid_particles_far_apart
  - mc.phy.o.particles_have_bulk_properties
solution:
  steps:
  - n: 1
    latex: \text{The air particles are far apart, with empty space between them}
    reason: Match the description to the particle model
