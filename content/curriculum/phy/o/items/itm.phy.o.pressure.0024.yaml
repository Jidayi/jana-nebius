stem: Obi dives from 8 m to 12 m below the surface of sea water (density 1030 kg/m³). Take g = 9.8 N/kg.
parts:
- id: a
  prompt: By how much does the pressure on the diver increase, in kPa?
  marks: 2
  answer:
    kind: numeric
    value: '40.4'
    unit: kPa
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_prs_0024_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The increase in pressure depends on how much deeper the diver goes.
  - rung: 2
    name: concept
    text:
      en: Change in pressure = density × g × change in depth.
  - rung: 3
    name: first_step
    text:
      en: The change in depth is 12 − 8.
  - rung: 4
    name: worked_step
    text:
      en: Δh = 4 m; multiply 1030 × 9.8 × 4 and give the result in kPa.
  - rung: 5
    name: full_step
    text:
      en: The pressure increases by 40.4 kPa.
  misconception_ids:
  - mc.phy.o.liquid_pressure_total_depth_used
  - mc.phy.o.liquid_pressure_g_left_out
  - mc.phy.o.liquid_depths_added
solution:
  steps:
  - n: 1
    latex: \Delta h = 12 - 8 = 4\ \text{m}
    reason: The change in depth
    check_id: chk_build_phy_prs_0024_dh
  - n: 2
    latex: \Delta p = \rho g \Delta h = 1030 \times 9.8 \times 4 = 40.4\ \text{kPa}
    reason: Δp = ρgΔh, then pascals into kilopascals
    check_id: chk_build_phy_prs_0024_ans
