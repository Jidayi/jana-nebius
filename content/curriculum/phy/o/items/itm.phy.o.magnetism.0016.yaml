stem: On a field diagram of a bar magnet, 10 field lines cross a 1 cm gap next to the north pole, and 2 lines cross a 1 cm gap beside the middle of the magnet.
parts:
- id: a
  prompt: How many times stronger is the field next to the pole than beside the middle?
  marks: 1
  answer:
    kind: numeric
    value: '5'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mag_0016_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: How does a field-line diagram show where the field is strong?
  - rung: 2
    name: concept
    text:
      en: The more lines that pass through a gap, the stronger the field there.
  - rung: 3
    name: first_step
    text:
      en: Compare the number of lines through the two equal gaps.
  - rung: 4
    name: worked_step
    text:
      en: Work out 10 ÷ 2.
  - rung: 5
    name: full_step
    text:
      en: The field next to the pole is 5 times as strong.
  misconception_ids:
  - mc.phy.o.field_lines_spacing_reversed
solution:
  steps:
  - n: 1
    latex: \text{strength} \propto \text{lines per cm}
    reason: Closer lines mean a stronger field
  - n: 2
    latex: \frac{10}{2} = 5
    reason: Compare the numbers of lines
    check_id: chk_build_phy_mag_0016_ans
