stem: A transformer for a garden lamp works from the 230 V mains. The primary coil has 2300 turns and the secondary coil 50 turns.
parts:
- id: a
  prompt: Calculate the output voltage.
  marks: 2
  answer:
    kind: numeric
    value: '5'
    unit: V
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_emg_0046_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The voltages across the two coils are in the same ratio as their numbers of turns.
  - rung: 2
    name: concept
    text:
      en: Vs ÷ Vp = Ns ÷ Np.
  - rung: 3
    name: first_step
    text:
      en: Rearrange the equation to make Vs the subject.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 230 V by 50 and divide by 2300.
  - rung: 5
    name: full_step
    text:
      en: The output voltage is 5 V.
  misconception_ids:
  - mc.phy.o.turns_ratio_inverted
  - mc.phy.o.turns_ratio_not_divided
  - mc.phy.o.turns_ratio_given_as_answer
solution:
  steps:
  - n: 1
    latex: \frac{V_s}{V_p} = \frac{N_s}{N_p}
    reason: Voltages are in the ratio of the turns
  - n: 2
    latex: V_s = V_p \times \frac{N_s}{N_p} = 230 \times \frac{50}{2300} = 5\ \text{V}
    reason: Rearrange for V_s
    check_id: chk_build_phy_emg_0046_ans
