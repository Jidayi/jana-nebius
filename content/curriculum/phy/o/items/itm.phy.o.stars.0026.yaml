id: itm.phy.o.stars.0026
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.stars.life_cycle_of_stars
stem: A star has a mass of 3.0 × 10³⁰ kg. The Sun's mass is 2.0 × 10³⁰ kg. Stars more than about 8 times as massive as the Sun end their lives in a supernova.
parts:
- id: a
  prompt: How will this star's life end?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It becomes a red supergiant, explodes as a supernova and leaves a neutron star or black hole
      correct: false
      misconception_id: mc.phy.o.small_star_ends_violently
      feedback: Only stars of much more than the Sun's mass end in a supernova. The Sun will swell into a red giant, shed its outer layers and leave a white dwarf.
    - id: B
      text: It stays on the main sequence for ever
      correct: false
      misconception_id: mc.phy.o.stars_never_change
      feedback: A star's fuel runs out in the end. Its life is so long, millions to billions of years, that we never see one star change much.
    - id: C
      text: It becomes a red giant and ends as a white dwarf
      correct: true
    - id: D
      text: It collapses straight into a black hole
      correct: false
      misconception_id: mc.phy.o.small_star_ends_violently
      feedback: Only stars of much more than the Sun's mass end in a supernova. The Sun will swell into a red giant, shed its outer layers and leave a white dwarf.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The way a star ends depends on its mass.
  - rung: 2
    name: concept
    text:
      en: Find how many times more massive than the Sun it is.
  - rung: 3
    name: first_step
    text:
      en: Divide 3.0 × 10³⁰ kg by 2.0 × 10³⁰ kg.
  - rung: 4
    name: worked_step
    text:
      en: The star has 1.5 times the Sun's mass; compare this with 8.
  - rung: 5
    name: full_step
    text:
      en: 'So: it becomes a red giant and ends as a white dwarf.'
  misconception_ids:
  - mc.phy.o.small_star_ends_violently
  - mc.phy.o.stars_never_change
solution:
  steps:
  - n: 1
    latex: \frac{3.0 \times 10^{30}}{2.0 \times 10^{30}} = 1.5
    reason: Mass compared with the Sun
    check_id: chk_build_phy_str_0026_ratio
  - n: 2
    latex: 1.5 < 8
    reason: Compare with the limit for a supernova
  - n: 3
    latex: \text{It becomes a red giant and ends as a white dwarf}
    reason: The end that goes with this mass
