subject: phy
level: o
kc_ids:
- kc.phy.o.heat_transfer.radiation
stem: A dull black surface and a shiny white surface are at the same temperature.
parts:
- id: a
  prompt: Which emits infrared at the greater rate?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: The shiny white surface emits more
      correct: false
      misconception_id: mc.phy.o.shiny_surfaces_better_radiators
      feedback: Dull black surfaces are the best absorbers and the best emitters of infrared. Shiny, light surfaces reflect most of it and emit little.
    - id: B
      text: Both equally, because colour has no effect on infrared
      correct: false
      misconception_id: mc.phy.o.colour_irrelevant_for_infrared
      feedback: In sunshine a black car bonnet gets much hotter than a white one. Surface colour and texture strongly change how much infrared is absorbed and emitted.
    - id: C
      text: Neither, because surfaces at room temperature give out no infrared
      correct: false
      misconception_id: mc.phy.o.cold_objects_do_not_radiate
      feedback: Every object emits infrared. Hotter objects emit more, but even ice does; thermal cameras see people and animals by the infrared they give out.
    - id: D
      text: The dull black surface emits more
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Infrared is an electromagnetic wave given out by every object; hotter objects give out more.
  - rung: 2
    name: concept
    text:
      en: Good absorbers of infrared are also good emitters.
  - rung: 3
    name: first_step
    text:
      en: 'Compare the surfaces: dull black is the best absorber and emitter, shiny silver or white the worst.'
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that need a material for radiation to travel through, or treat cold as something that flows.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The dull black surface emits more.'
  misconception_ids:
  - mc.phy.o.cold_objects_do_not_radiate
  - mc.phy.o.colour_irrelevant_for_infrared
  - mc.phy.o.shiny_surfaces_better_radiators
solution:
  steps:
  - n: 1
    latex: \text{The dull black surface emits more}
    reason: Apply what affects emission and absorption
