id: itm.phy.o.solar_system.0020
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.solar_system.orbital_speed
stem: The Moon orbits the Earth in a near-circular orbit of radius 384 000 km, taking 27.3 days for one orbit.
parts:
- id: a
  prompt: Calculate the average orbital speed of the Moon in km/s.
  marks: 3
  answer:
    kind: numeric
    value: '1.02'
    unit: km/s
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_sol_0020_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: In one orbit the body travels once round a circle.
  - rung: 2
    name: concept
    text:
      en: Orbital speed v = 2πr ÷ T.
  - rung: 3
    name: first_step
    text:
      en: For km/s, keep r in km and change the period into seconds.
  - rung: 4
    name: worked_step
    text:
      en: T = 2358720 s; the circumference is 2π × 384 000 km.
  - rung: 5
    name: full_step
    text:
      en: The orbital speed is 1.02 km/s.
  misconception_ids:
  - mc.phy.o.orbit_speed_no_two_pi
  - mc.phy.o.orbit_speed_pi_r_squared
  - mc.phy.o.orbit_period_not_in_seconds
solution:
  steps:
  - n: 1
    latex: T = 27.3\ \text{days} = 2358720\ \text{s}
    reason: Period in seconds
    check_id: chk_build_phy_sol_0020_ts
  - n: 2
    latex: 2\pi r = 2\pi \times 384\,000 = 2.41 \times 10^{6}\ \text{km}
    reason: Distance round one orbit
    check_id: chk_build_phy_sol_0020_circ_m
  - n: 3
    latex: v = \frac{2.41 \times 10^{6}}{2358720} = 1.02\ \text{km/s}
    reason: v = 2πr / T
    check_id: chk_build_phy_sol_0020_ans
difficulty:
  prior: 0.2
  band: core
estimated_seconds: 120
