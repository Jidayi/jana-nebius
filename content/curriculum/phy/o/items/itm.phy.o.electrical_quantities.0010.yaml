- kc.phy.o.electrical_quantities.electric_charge
stem: A plastic comb rubbed with a hair gains 4 × 10¹⁰ electrons. The charge on one electron is −1.6 × 10⁻¹⁹ C.
parts:
- id: a
  prompt: Find the charge on the plastic comb, in nC, with its sign.
  marks: 2
  answer:
    kind: numeric
    value: '-6.4'
    unit: nC
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0010_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Each electron gained adds the same small negative charge.
  - rung: 2
    name: concept
    text:
      en: Charge = number of electrons × the charge on one electron.
  - rung: 3
    name: first_step
    text:
      en: Gaining electrons makes the object negative.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 4 × 10¹⁰ by 1.6 × 10⁻¹⁹ C, then write the result in nanocoulombs.
  - rung: 5
    name: full_step
    text:
      en: The plastic comb has a charge of -6.4 nC.
  misconception_ids:
  - mc.phy.o.electron_gain_sign_reversed
  - mc.phy.o.electron_count_divided_by_e
  - mc.phy.o.prefix_multiply_divide_swapped
solution:
  steps:
  - n: 1
    latex: Q = n \times e = 4 \times 10^{10} \times (-\,1.6 \times 10^{-19})\ \text{C}
    reason: Charge = number of electrons × charge on one
  - n: 2
    latex: Q = -6.4\ \text{nC}
    reason: 1 nC is 10^{-9} C
    check_id: chk_build_phy_elq_0010_ans
