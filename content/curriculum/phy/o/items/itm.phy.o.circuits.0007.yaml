id: itm.phy.o.circuits.0007
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.series_circuits
stem: Thabo connects a 5 Ω resistor and a 24 Ω resistor in series with a 6 V battery.
parts:
- id: a
  prompt: Calculate the current in the circuit.
  marks: 2
  answer:
    kind: numeric
    value: '0.207'
    unit: A
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_cir_0007_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The same current flows through both resistors, pushed by the battery.
  - rung: 2
    name: concept
    text:
      en: Use the total resistance of the circuit in I = V/R.
  - rung: 3
    name: first_step
    text:
      en: The total resistance is 5 Ω + 24 Ω.
  - rung: 4
    name: worked_step
    text:
      en: The total is 29 Ω, so I = 6 ÷ 29.
  - rung: 5
    name: full_step
    text:
      en: The current is 0.207 A.
  misconception_ids:
  - mc.phy.o.series_current_from_one_resistor
  - mc.phy.o.series_treated_as_parallel
  - mc.phy.o.circuit_current_r_over_v
solution:
  steps:
  - n: 1
    latex: R = 5 + 24 = 29\ \Omega
    reason: Series resistances add
    check_id: chk_build_phy_cir_0007_rt
  - n: 2
    latex: I = \frac{V}{R} = \frac{6}{29} = 0.207\ \text{A}
    reason: Ohm's law
    check_id: chk_build_phy_cir_0007_ans
