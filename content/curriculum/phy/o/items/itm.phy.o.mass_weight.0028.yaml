id: itm.phy.o.mass_weight.0028
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.mass_weight.mass_or_weight
stem: A beam balance and a spring scale are each used to measure the same bag of sand, first on Earth and then on the Moon.
parts:
- id: a
  prompt: How do their readings on the Moon compare with those on Earth?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: The beam balance reading stays the same; the spring scale reading falls
      correct: true
    - id: B
      text: Both readings fall
      correct: false
      misconception_id: mc.phy.o.mass_changes_with_g
      feedback: Mass is the amount of matter in the object, and a trip to the Moon removes no matter. Only the weight, the pull of gravity on it, changes.
    - id: C
      text: Both readings stay the same
      correct: false
      misconception_id: mc.phy.o.weight_same_on_every_planet
      feedback: Weight is the pull of a planet on the object, weight = mass × g. A world with a smaller g pulls less on the same mass.
    - id: D
      text: The beam balance reading falls; the spring scale reading stays the same
      correct: false
      misconception_id: mc.phy.o.balance_types_confused
      feedback: 'A beam balance compares masses: on the Moon both pans are pulled less, so it still balances. A spring scale stretches under the weight, so its reading falls where g is smaller.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide whether each option is about mass, weight, or both.
  - rung: 2
    name: concept
    text:
      en: A beam balance compares the bag with standard masses; a spring scale stretches under the bag's weight.
  - rung: 3
    name: first_step
    text:
      en: Test each option against the difference between the amount of matter and the pull of gravity.
  - rung: 4
    name: worked_step
    text:
      en: Rule out every option that mixes up the two quantities.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The beam balance reading stays the same; the spring scale reading falls.'
  misconception_ids:
  - mc.phy.o.balance_types_confused
  - mc.phy.o.mass_changes_with_g
  - mc.phy.o.weight_same_on_every_planet
solution:
  steps:
  - n: 1
    latex: \text{The beam balance reading stays the same; the spring scale reading falls}
    reason: Mass stays the same; weight depends on g
