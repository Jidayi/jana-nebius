id: itm.phy.o.electrical_quantities.0086
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.current_voltage_graphs
stem: Point P lies on the curved current-voltage graph of a filament lamp.
parts:
- id: a
  prompt: How should the lamp's resistance at P be found?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Divide the current at P by the p.d. at P
      correct: false
      misconception_id: mc.phy.o.iv_gradient_is_resistance
      feedback: On a graph of current against p.d., the steeper the line the more current flows for each volt, so the smaller the resistance. Use R = V/I.
    - id: B
      text: Divide the change in p.d. by the change in current between P and another point
      correct: false
      misconception_id: mc.phy.o.resistance_from_chord_slope
      feedback: Resistance at a point is the p.d. there divided by the current there. Read both values off the graph at that one point.
    - id: C
      text: Divide the p.d. at P by the current at P
      correct: true
    - id: D
      text: Use the resistance at a low p.d., since it does not change
      correct: false
      misconception_id: mc.phy.o.lamp_resistance_constant
      feedback: 'A lamp''s I-V graph bends over: each extra volt gives less extra current, because the hotter filament has more resistance.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Look at how the current changes as the p.d. changes, and what that says about R = V/I.
  - rung: 2
    name: concept
    text:
      en: A fixed resistor gives a straight line through the origin; a line that bends shows a resistance that changes; some components conduct in one direction only.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Resistance at a point is R = V/I using the two readings at that point.
  - rung: 5
    name: full_step
    text:
      en: Divide the p.d. at P by the current at P. Resistance at a point is R = V/I using the two readings at that point.
  misconception_ids:
  - mc.phy.o.iv_gradient_is_resistance
  - mc.phy.o.lamp_resistance_constant
  - mc.phy.o.resistance_from_chord_slope
solution:
  steps:
  - n: 1
    latex: \text{Divide the p.d. at P by the current at P}
    reason: Read the shape of the graph as a resistance
