stem: A solid is heated and expands.
parts:
- id: a
  prompt: What happens to its particles?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Each particle becomes larger
      correct: false
      misconception_id: mc.phy.o.particles_grow_when_heated
      feedback: A water particle is the same size in ice, in water and in steam. Heating makes particles move faster and spread further apart; it does not make them bigger.
    - id: B
      text: They vibrate more and move slightly further apart
      correct: true
    - id: C
      text: More particles are made by the heating
      correct: false
      misconception_id: mc.phy.o.heating_creates_particles
      feedback: 'Weigh a sealed flask before and after heating: its mass does not change. No particles are made; the same particles move faster and, in most materials, spread further apart.'
    - id: D
      text: They move closer together but each one grows
      correct: false
      misconception_id: mc.phy.o.particles_grow_when_heated
      feedback: A water particle is the same size in ice, in water and in steam. Heating makes particles move faster and spread further apart; it does not make them bigger.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what heating does to the motion and spacing of particles.
  - rung: 2
    name: concept
    text:
      en: Heating gives the particles more kinetic energy.
  - rung: 3
    name: first_step
    text:
      en: For each option, ask whether the particles themselves change, or only how they move and how far apart they are.
  - rung: 4
    name: worked_step
    text:
      en: Remember that heating does not create particles and that gases expand most, solids least.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: They vibrate more and move slightly further apart.'
  misconception_ids:
  - mc.phy.o.heating_creates_particles
  - mc.phy.o.particles_grow_when_heated
