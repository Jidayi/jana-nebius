id: itm.phy.o.forces.0065
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.springs
stem: A load of 4 N stretches a spring by 0.05 m.
parts:
- id: a
  prompt: Which calculation gives its spring constant?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 0.05 ÷ 4
      correct: false
      misconception_id: mc.phy.o.spring_ratio_inverted
      feedback: 'The spring constant is the force needed for each metre of extension, so force goes on top: k = F ÷ x.'
    - id: B
      text: 4 ÷ 0.05
      correct: true
    - id: C
      text: 4 × 0.05
      correct: false
      misconception_id: mc.phy.o.fma_multiplied_not_divided
      feedback: 'Try easy numbers: 10 N on a 2 kg trolley gives 5 m/s², not 20. Only the product F = ma needs a multiplication; the other two unknowns need a division.'
    - id: D
      text: 4 ÷ 5
      correct: false
      misconception_id: mc.phy.o.spring_cm_not_converted
      feedback: A spring constant in N/m needs the extension in metres. Change centimetres into metres before you use F = kx.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Hooke's law links the force on a spring to its extension.
  - rung: 2
    name: concept
    text:
      en: Extension is the increase in length, and F = kx holds only while the load is not too big.
  - rung: 3
    name: first_step
    text:
      en: Check each option against the meaning of extension and of the limit.
  - rung: 4
    name: worked_step
    text:
      en: The spring constant is force per unit extension.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: 4 ÷ 0.05. k = F ÷ x.'
  misconception_ids:
  - mc.phy.o.fma_multiplied_not_divided
  - mc.phy.o.spring_cm_not_converted
  - mc.phy.o.spring_ratio_inverted
solution:
  steps:
  - n: 1
    latex: \text{4 ÷ 0.05}
    reason: Use the meaning of extension and of k
