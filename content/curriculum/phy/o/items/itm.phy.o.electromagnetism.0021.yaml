id: itm.phy.o.electromagnetism.0021
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.electromagnetism.motor_effect
stem: In a motor-effect experiment both the current and the magnetic field are reversed.
parts:
- id: a
  prompt: What happens to the force on the wire?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It reverses
      correct: false
      misconception_id: mc.phy.o.reversing_both_reverses_force
      feedback: Each reversal flips the force once. Two flips bring it back to where it started.
    - id: B
      text: It acts in the same direction as before
      correct: true
    - id: C
      text: It reverses and acts along the field
      correct: false
      misconception_id: mc.phy.o.force_along_field
      feedback: The force on the wire is at right angles to the field and to the current. Use the left hand to find which way.
    - id: D
      text: It reverses, because a right hand must now be used
      correct: false
      misconception_id: mc.phy.o.fleming_right_hand_used
      feedback: 'For motors use the left hand: first finger for the field, second finger for the current, thumb for the motion.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about how the current, the field and the force are arranged.
  - rung: 2
    name: concept
    text:
      en: The force is at right angles to both the field and the current, and it grows with the current, the field and the number of turns.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Reversing one of them flips the force; reversing the other flips it back.
  - rung: 5
    name: full_step
    text:
      en: It acts in the same direction as before. Reversing one of them flips the force; reversing the other flips it back.
  misconception_ids:
  - mc.phy.o.fleming_right_hand_used
  - mc.phy.o.force_along_field
  - mc.phy.o.reversing_both_reverses_force
solution:
  steps:
  - n: 1
    latex: \text{It acts in the same direction as before}
    reason: Apply the rules for the motor effect
