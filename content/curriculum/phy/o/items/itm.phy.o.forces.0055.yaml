  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_phy_frc_0055_ans:
    args:
      expression: 40*(12 - 10)/100
    tool: math_evaluate
  chk_build_phy_frc_0055_ext_m:
    args:
      expression: (12 - 10)/100
    tool: math_evaluate
