id: itm.phy.o.forces.0055
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.springs
stem: A spring with a spring constant of 40 N/m is 10 cm long. A force stretches it to 12 cm, within its limit of proportionality.
parts:
- id: a
  prompt: Find the force.
  marks: 2
  answer:
    kind: numeric
    value: '0.8'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_frc_0055_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Use F = kx, where x is the extension.
  - rung: 2
    name: concept
    text:
      en: The extension is how much longer the spring has become.
  - rung: 3
    name: first_step
    text:
      en: Find the extension and change it into metres before multiplying by k.
  - rung: 4
    name: worked_step
    text:
      en: The extension is 0.02 m.
  - rung: 5
    name: full_step
    text:
      en: F = 40 × 0.02 = 0.8 N.
  misconception_ids:
  - mc.phy.o.spring_cm_not_converted
  - mc.phy.o.spring_ratio_inverted
  - mc.phy.o.spring_length_for_extension
solution:
  steps:
  - n: 1
    latex: x = 12 - 10 = 2\ \text{cm} = 0.02\ \text{m}
    reason: Extension in metres
    check_id: chk_build_phy_frc_0055_ext_m
  - n: 2
    latex: F = kx = 40 \times 0.02 = 0.8\ \text{N}
    reason: Hooke's law
    check_id: chk_build_phy_frc_0055_ans
difficulty:
  prior: -0.1
  band: core
estimated_seconds: 70
exam_style:
  paper_style: objective
  total_marks: 2
  calculator: true
