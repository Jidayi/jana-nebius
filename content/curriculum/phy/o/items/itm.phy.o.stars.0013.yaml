stem: A distance to a star is given in metres.
parts:
- id: a
  prompt: How do you change it into light-years?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Multiply by the number of metres in one light-year
      correct: false
      misconception_id: mc.phy.o.light_year_conversion_inverted
      feedback: 'A light-year is a huge number of metres, so a distance in light-years is a much smaller number: divide by the metres in one light-year.'
    - id: B
      text: Divide by the number of metres in one light-year
      correct: true
    - id: C
      text: Divide by the speed of light
      correct: false
      misconception_id: mc.phy.o.light_year_missing_seconds
      feedback: 'The speed of light is in metres per second, so multiply it by a year in seconds: 365 days × 24 hours × 3600 seconds.'
    - id: D
      text: Divide by the number of seconds in a year
      correct: false
      misconception_id: mc.phy.o.light_year_is_time
      feedback: 'A light-year is a distance: how far light travels in one year, about 9.5 × 10¹⁵ m.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Remember what kind of quantity a light-year is.
  - rung: 2
    name: concept
    text:
      en: A light-year measures how far light goes in a year.
  - rung: 3
    name: first_step
    text:
      en: One light-year = speed of light × the number of seconds in a year.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against this.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Divide by the number of metres in one light-year.'
  misconception_ids:
  - mc.phy.o.light_year_conversion_inverted
  - mc.phy.o.light_year_is_time
  - mc.phy.o.light_year_missing_seconds
solution:
  steps:
  - n: 1
    latex: \text{Divide by the number of metres in one light-year}
    reason: A light-year is a distance
