id: itm.phy.o.circuits.0012
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.series_circuits
stem: Esi connects a 12 Ω resistor and a 30 Ω resistor in series with a 24 V battery.
parts:
- id: a
  prompt: Calculate the current in the circuit.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 0.571 A
      correct: true
    - id: B
      text: 2 A
      correct: false
      misconception_id: mc.phy.o.series_current_from_one_resistor
      feedback: 'The supply pushes the current through the whole circuit. Use the total resistance: I = V ÷ (R1 + R2 + ...).'
    - id: C
      text: 2.8 A
      correct: false
      misconception_id: mc.phy.o.series_treated_as_parallel
      feedback: In series there is only one path. The current is the same everywhere, the supply p.d. is shared between the resistors, and the total resistance is the sum.
    - id: D
      text: 1.75 A
      correct: false
      misconception_id: mc.phy.o.circuit_current_r_over_v
      feedback: 'A bigger p.d. pushes a bigger current, so p.d. goes on top: I = V ÷ R. Check with easy numbers: 6 V across 2 Ω gives 3 A.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The same current flows through both resistors, pushed by the battery.
  - rung: 2
    name: concept
    text:
      en: Use the total resistance of the circuit in I = V/R.
  - rung: 3
    name: first_step
    text:
      en: The total resistance is 12 Ω + 30 Ω.
  - rung: 4
    name: worked_step
    text:
      en: The total is 42 Ω, so I = 24 ÷ 42.
  - rung: 5
    name: full_step
    text:
      en: The current is 0.571 A.
  misconception_ids:
  - mc.phy.o.circuit_current_r_over_v
  - mc.phy.o.series_current_from_one_resistor
  - mc.phy.o.series_treated_as_parallel
solution:
  steps:
  - n: 1
    latex: R = 12 + 30 = 42\ \Omega
    reason: Series resistances add
    check_id: chk_build_phy_cir_0012_rt
  - n: 2
    latex: I = \frac{V}{R} = \frac{24}{42} = 0.571\ \text{A}
    reason: Ohm's law
    check_id: chk_build_phy_cir_0012_ans
