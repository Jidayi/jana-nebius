id: itm.phy.o.particles.0036
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.particles.gas_pressure_particles
stem: A sealed can of gas is heated, so its volume stays the same.
parts:
- id: a
  prompt: Why does the pressure of the gas rise?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The particles move faster, hitting the walls harder and more often
      correct: true
    - id: B
      text: The particles get bigger and press harder on the walls
      correct: false
      misconception_id: mc.phy.o.particles_grow_when_heated
      feedback: A water particle is the same size in ice, in water and in steam. Heating makes particles move faster and spread further apart; it does not make them bigger.
    - id: C
      text: The particles collide with each other more, pushing outwards
      correct: false
      misconception_id: mc.phy.o.pressure_from_interparticle_collisions
      feedback: Pressure is a force on a surface. Only collisions with the container's walls push on it; particles bumping into each other in the middle push on no wall.
    - id: D
      text: Heating adds more gas particles to the can
      correct: false
      misconception_id: mc.phy.o.heating_creates_particles
      feedback: 'Weigh a sealed flask before and after heating: its mass does not change. No particles are made; the same particles move faster and, in most materials, spread further apart.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Pressure is a force on each square metre of a surface. What exerts force on the walls of a container of gas?
  - rung: 2
    name: concept
    text:
      en: Heating a gas raises the average kinetic energy of its particles.
  - rung: 3
    name: first_step
    text:
      en: Ask whether the change alters how fast the particles move, how often they hit the walls, or both.
  - rung: 4
    name: worked_step
    text:
      en: Rule out explanations that rely on the weight of the gas or on particles changing size.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The particles move faster, hitting the walls harder and more often.'
  misconception_ids:
  - mc.phy.o.heating_creates_particles
  - mc.phy.o.particles_grow_when_heated
  - mc.phy.o.pressure_from_interparticle_collisions
solution:
  steps:
  - n: 1
    latex: \text{The particles move faster, hitting the walls harder and more often}
    reason: Explain the pressure by collisions with the walls
