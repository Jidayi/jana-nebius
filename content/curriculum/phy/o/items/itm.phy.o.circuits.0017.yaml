stem: A 40 Ω resistor and a 10 Ω resistor are connected in parallel across a 12 V battery.
parts:
- id: a
  prompt: Calculate the current supplied by the battery.
  marks: 2
  answer:
    kind: numeric
    value: '1.5'
    unit: A
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_cir_0017_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Each resistor is connected straight across the battery.
  - rung: 2
    name: concept
    text:
      en: So each has the full 12 V across it, and the branch currents add up to the battery current.
  - rung: 3
    name: first_step
    text:
      en: Find the current in each branch with I = V/R, using 12 V each time.
  - rung: 4
    name: worked_step
    text:
      en: The branch currents are 0.3 A and 1.2 A; add them.
  - rung: 5
    name: full_step
    text:
      en: The battery supplies 1.5 A.
  misconception_ids:
  - mc.phy.o.parallel_resistances_added
  - mc.phy.o.parallel_one_branch_only
  - mc.phy.o.parallel_resistance_averaged
solution:
  steps:
  - n: 1
    latex: I_1 = \frac{12}{40} = 0.3\ \text{A}
    reason: Each branch has the full supply p.d.
    check_id: chk_build_phy_cir_0017_i1
  - n: 2
    latex: I_2 = \frac{12}{10} = 1.2\ \text{A}
    reason: The same for the other branch
    check_id: chk_build_phy_cir_0017_i2
  - n: 3
    latex: I = 0.3 + 1.2 = 1.5\ \text{A}
    reason: Branch currents add
    check_id: chk_build_phy_cir_0017_ans
