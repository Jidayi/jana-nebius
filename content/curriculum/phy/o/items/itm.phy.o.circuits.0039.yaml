stem: Two lamps of resistance 8 Ω and 10 Ω are connected in series to make one branch. A 15 Ω resistor forms a second branch in parallel with them, and the two branches are connected across a 6 V battery.
parts:
- id: a
  prompt: Calculate the total resistance of the circuit.
  marks: 2
  answer:
    kind: numeric
    value: '8.18'
    unit: Ω
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_cir_0039_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Work out each branch on its own first.
  - rung: 2
    name: concept
    text:
      en: The two lamps in one branch are in series; that branch is then in parallel with the resistor.
  - rung: 3
    name: first_step
    text:
      en: The lamp branch has 8 Ω + 10 Ω = 18 Ω.
  - rung: 4
    name: worked_step
    text:
      en: 'Combine 18 Ω and 15 Ω in parallel: product over sum.'
  - rung: 5
    name: full_step
    text:
      en: The total resistance is 8.18 Ω.
  misconception_ids:
  - mc.phy.o.mixed_all_in_series
  - mc.phy.o.mixed_all_in_parallel
solution:
  steps:
  - n: 1
    latex: R_s = 8 + 10 = 18\ \Omega
    reason: The lamps in series in one branch
    check_id: chk_build_phy_cir_0039_rs
  - n: 2
    latex: R = \frac{18 \times 15}{18 + 15} = 8.18\ \Omega
    reason: The two branches in parallel
    check_id: chk_build_phy_cir_0039_ans
