id: itm.phy.o.sound.0028
version: 0.1.1
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.sound.speed_and_echoes
stem: At a sports ground, Ade stands 1000 m from a starter. Ade sees the starter bang two wooden blocks together and hears the bang 2.94 s later.
parts:
- id: a
  prompt: Calculate the speed of sound. The light arrives almost at once.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 340 m/s
      correct: true
    - id: B
      text: 680 m/s
      correct: false
      misconception_id: mc.phy.o.direct_sound_factor_two
      feedback: There is a factor of two only when the sound goes there and back. A bang heard directly travels the distance once.
    - id: C
      text: 0.00294 m/s
      correct: false
      misconception_id: mc.phy.o.time_over_distance
      feedback: Speed tells you how many metres you cover each second, so the metres go on top.
    - id: D
      text: 2940 m/s
      correct: false
      misconception_id: mc.phy.o.speed_as_distance_times_time
      feedback: 'Speed is the distance covered each second: divide the distance by the time.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The blocks are seen to meet almost at once, so the time is how long the sound takes.
  - rung: 2
    name: concept
    text:
      en: 'The bang travels straight from the blocks to the listener: there is no echo.'
  - rung: 3
    name: first_step
    text:
      en: Speed = distance ÷ time.
  - rung: 4
    name: worked_step
    text:
      en: Work out 1000 ÷ 2.94.
  - rung: 5
    name: full_step
    text:
      en: v = 340 m/s.
  misconception_ids:
  - mc.phy.o.direct_sound_factor_two
  - mc.phy.o.speed_as_distance_times_time
  - mc.phy.o.time_over_distance
solution:
  steps:
  - n: 1
    latex: v = \frac{d}{t} = \frac{1000}{2.94} = 340\ \text{m/s}
    reason: The sound travels the distance once
    check_id: chk_build_phy_snd_0028_ans
