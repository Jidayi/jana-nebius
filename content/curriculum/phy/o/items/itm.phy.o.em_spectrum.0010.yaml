stem: Electromagnetic waves carry energy from a source.
parts:
- id: a
  prompt: Which describes them?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Longitudinal waves that carry energy
      correct: false
      misconception_id: mc.phy.o.light_called_longitudinal
      feedback: 'Every electromagnetic wave is transverse: its electric and magnetic fields vibrate at right angles to the direction it travels.'
    - id: B
      text: Transverse waves that carry particles from the source
      correct: false
      misconception_id: mc.phy.o.wave_carries_medium
      feedback: A floating leaf bobs up and down as ripples pass but stays in the same place. Waves carry energy, not the material they travel through.
    - id: C
      text: Transverse waves that carry energy but not matter
      correct: true
    - id: D
      text: Waves that need air to carry their energy
      correct: false
      misconception_id: mc.phy.o.em_needs_medium
      feedback: Sunlight reaches the Earth across millions of kilometres of empty space. Electromagnetic waves travel through a vacuum.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Start from the region with the longest wavelength and work towards the shortest.
  - rung: 2
    name: concept
    text:
      en: Frequency rises as wavelength falls, because every region has the same speed in a vacuum.
  - rung: 3
    name: first_step
    text:
      en: Every region is a transverse wave and can cross empty space.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that break the order or these shared properties.
  - rung: 5
