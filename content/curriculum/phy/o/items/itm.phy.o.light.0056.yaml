id: itm.phy.o.light.0056
version: 0.1.1
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.light.total_internal_reflection
stem: A ray of light in air meets the flat surface of a glass block (refractive index 1.5) at an angle of incidence of 30°.
parts:
- id: a
  prompt: What happens to the ray at the surface?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It refracts into the glass, bending towards the normal
      correct: true
    - id: B
      text: It is totally internally reflected back into the air
      correct: false
      misconception_id: mc.phy.o.tir_from_air_into_glass
      feedback: Going into glass, light bends towards the normal, so there is always a refracted ray. Total internal reflection needs light inside the denser material, heading out.
    - id: C
      text: It refracts into the glass, bending away from the normal
      correct: false
      misconception_id: mc.phy.o.refraction_bends_wrong_way
      feedback: Light slows down in glass and swings towards the normal; it speeds up again in air and swings away. Picture a car whose first wheel hits sand and slows.
    - id: D
      text: It passes into the glass without changing direction
      correct: false
      misconception_id: mc.phy.o.refraction_no_bending_at_angle
      feedback: When a beam meets a boundary at an angle, one side of it changes speed before the other, so the beam swings round. Only a ray along the normal goes straight on.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Is the light going into a denser material or coming out of one?
  - rung: 2
    name: concept
    text:
      en: Total internal reflection only happens for light inside the denser material, heading out.
  - rung: 3
    name: first_step
    text:
      en: Find the angle of refraction from sin r = sin i ÷ n.
  - rung: 4
    name: worked_step
    text:
      en: sin r = sin 30° ÷ 1.5 = 0.333, so r = 19.5°. Is that bigger or smaller than 30°?
  - rung: 5
    name: full_step
    text:
      en: 'r = 19.5° is smaller than 30°, so the answer is: It refracts into the glass, bending towards the normal.'
  misconception_ids:
  - mc.phy.o.refraction_bends_wrong_way
  - mc.phy.o.refraction_no_bending_at_angle
  - mc.phy.o.tir_from_air_into_glass
solution:
  steps:
  - n: 1
    latex: \sin r = \frac{\sin 30^\circ}{1.5} = 0.333
    reason: sin r = sin i / n
    check_id: chk_build_phy_lgt_0056_sr
  - n: 2
    latex: r = 19.5^\circ
    reason: Inverse sine
    check_id: chk_build_phy_lgt_0056_r
  - n: 3
    latex: 19.5^\circ < 30^\circ
    reason: The ray in the glass is closer to the normal
  - n: 4
    latex: \text{It refracts into the glass, bending towards the normal}
    reason: Checked with the optics tool
    check_id: chk_build_phy_lgt_0056_tool
