id: itm.phy.o.measurement.0060
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.measurement.measuring_techniques
stem: With its jaws closed, a micrometer reads 0.02 mm below zero. A ball bearing then gives a reading of 2.94 mm.
parts:
- id: a
  prompt: Find the corrected diameter of the ball bearing.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 2.96 mm
      correct: true
    - id: B
      text: 2.92 mm
      correct: false
      misconception_id: mc.phy.o.zero_error_wrong_way
      feedback: 'If the instrument already reads a little above zero with nothing in it, every reading is too big by that much: take the zero error away.'
    - id: C
      text: 2.94 mm
      correct: false
      misconception_id: mc.phy.o.zero_error_ignored
      feedback: Check the reading with the jaws closed first; if it is not zero, correct every reading by that amount.
    - id: D
      text: 3.14 mm
      correct: false
      misconception_id: mc.phy.o.thimble_read_as_tenths
      feedback: One full turn of the thimble moves the spindle half a millimetre and the thimble has fifty divisions, so each division is a hundredth of a millimetre.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A zero error is the reading when the true value is zero.
  - rung: 2
    name: concept
    text:
      en: Every reading is wrong by the same zero error.
  - rung: 3
    name: first_step
    text:
      en: Corrected reading = reading − zero error, keeping the sign of the zero error.
  - rung: 4
    name: worked_step
    text:
      en: The zero error is −0.02 mm.
  - rung: 5
    name: full_step
    text:
      en: The corrected diameter is 2.96 mm.
  misconception_ids:
  - mc.phy.o.thimble_read_as_tenths
  - mc.phy.o.zero_error_ignored
  - mc.phy.o.zero_error_wrong_way
solution:
  steps:
  - n: 1
    latex: \text{zero error} = -\,0.02\ \text{mm}
    reason: The instrument reads below zero when closed
  - n: 2
    latex: d = 2.94 - (-\,0.02) = 2.96\ \text{mm}
    reason: Corrected reading = reading − zero error
    check_id: chk_build_phy_mea_0060_ans
