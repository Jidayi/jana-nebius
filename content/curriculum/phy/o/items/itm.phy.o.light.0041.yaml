id: itm.phy.o.light.0041
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.light.speed_in_medium
stem: Light passes from a vacuum into Perspex, which has a refractive index of 1.49.
parts:
- id: a
  prompt: Calculate the speed of light in Perspex, in km/s.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 447000 km/s
      correct: false
      misconception_id: mc.phy.o.light_speed_times_index
      feedback: 'Nothing travels faster than light in a vacuum. A material slows light down, so divide c by the refractive index: the bigger n is, the slower the light.'
    - id: B
      text: 201000 km/s
      correct: true
    - id: C
      text: 300000 km/s
      correct: false
      misconception_id: mc.phy.o.light_speed_same_in_material
      feedback: Light only travels at 3.0 × 10⁸ m/s in a vacuum (and almost that in air). Refraction happens because light is slower in glass or water.
    - id: D
      text: 201000000 km/s
      correct: false
      misconception_id: mc.phy.o.light_speed_units_mixed
      feedback: 'Put both speeds in the same unit before dividing: 3.0 × 10⁸ m/s is 300 000 km/s.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Does light speed up or slow down in a material?
  - rung: 2
    name: concept
    text:
      en: Refractive index n = c ÷ v, so v = c ÷ n.
  - rung: 3
    name: first_step
    text:
      en: 'Write c in km/s first: there are a thousand metres in a kilometre.'
  - rung: 4
    name: worked_step
    text:
      en: c = 300000 km/s; divide it by 1.49.
  - rung: 5
    name: full_step
    text:
      en: The speed of light in Perspex is 201000 km/s.
  misconception_ids:
  - mc.phy.o.light_speed_same_in_material
  - mc.phy.o.light_speed_times_index
  - mc.phy.o.light_speed_units_mixed
solution:
  steps:
  - n: 1
    latex: c = 3.0 \times 10^{8}\ \text{m/s} = 300000\ \text{km/s}
    reason: Divide by a thousand for km/s
    check_id: chk_build_phy_lgt_0041_ckm
  - n: 2
    latex: v = \frac{300000}{1.49} = 201000\ \text{km/s}
    reason: v = c / n
    check_id: chk_build_phy_lgt_0041_ans
