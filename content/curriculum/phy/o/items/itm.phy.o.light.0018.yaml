id: itm.phy.o.light.0018
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.light.refraction
stem: A ray of light enters Perspex (refractive index 1.49) from air. Inside the Perspex the angle of refraction is 25°.
parts:
- id: a
  prompt: Calculate the angle of incidence in air.
  marks: 2
  answer:
    kind: numeric
    value: '39.0'
    unit: null
    unit_policy: none
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_lgt_0018_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The angle in air is the bigger one, because light bends towards the normal in the material.
  - rung: 2
    name: concept
    text:
      en: n = sin i ÷ sin r, so sin i = n × sin r.
  - rung: 3
    name: first_step
    text:
      en: Work out 1.49 × sin 25°.
  - rung: 4
    name: worked_step
    text:
      en: sin i = 0.630; now take the inverse sine.
  - rung: 5
    name: full_step
    text:
      en: The angle of incidence is 39.0°.
  misconception_ids:
  - mc.phy.o.snell_angles_not_sines
  - mc.phy.o.snell_ratio_inverted
  - mc.phy.o.refraction_angles_from_surface
solution:
  steps:
  - n: 1
    latex: \sin i = 1.49 \times \sin 25^\circ = 0.630
    reason: Rearrange n = sin i / sin r
    check_id: chk_build_phy_lgt_0018_si
  - n: 2
    latex: i = \sin^{-1}(0.630) = 39.0^\circ
    reason: Inverse sine
    check_id: chk_build_phy_lgt_0018_ans
