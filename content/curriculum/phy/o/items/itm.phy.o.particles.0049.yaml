stem: A bubble of gas has a volume of 4 cm³ near the bottom of a lake, where the pressure is 180 kPa. It rises to the surface, where the pressure is 100 kPa. Its temperature does not change.
parts:
- id: a
  prompt: Find the volume of the bubble at the surface.
  marks: 2
  answer:
    kind: numeric
    value: '7.2'
    unit: cm^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_ptc_0049_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: As the bubble rises, the water pressing on it falls, so it can expand.
  - rung: 2
    name: concept
    text:
      en: 'The gas in the bubble keeps the same mass and temperature: p₁V₁ = p₂V₂.'
  - rung: 3
    name: first_step
    text:
      en: Work out 180 × 4 first.
  - rung: 4
    name: worked_step
    text:
      en: Divide 720 by the pressure at the surface, 100 kPa.
  - rung: 5
    name: full_step
    text:
      en: At the surface the bubble's volume is 7.2 cm³.
  misconception_ids:
