id: itm.phy.o.particles.0012
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.particles.states_of_matter
stem: Pollen grains floating on water are seen under a microscope to wander along short, random, zig-zag paths.
parts:
- id: a
  prompt: What does this show about the water molecules?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: They are moving rapidly and randomly
      correct: true
    - id: B
      text: They are large enough to be seen pushing the grains
      correct: false
      misconception_id: mc.phy.o.brownian_molecules_seen
      feedback: Air and water molecules are far too small to see, even with a microscope. The specks are much bigger smoke or pollen particles, jostled by the invisible molecules hitting them.
    - id: C
      text: They are still; the grains move on their own
      correct: false
      misconception_id: mc.phy.o.brownian_not_from_collisions
      feedback: A draught would carry all the specks the same way. Each speck jerks about on its own path, which only random hits from many tiny molecules can explain.
    - id: D
      text: They swell up as the water warms
      correct: false
      misconception_id: mc.phy.o.particles_grow_when_heated
      feedback: A water particle is the same size in ice, in water and in steam. Heating makes particles move faster and spread further apart; it does not make them bigger.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Picture the particles: how close together are they, and how do they move?'
  - rung: 2
    name: concept
    text:
      en: Something invisible must be knocking the grains in a different direction each moment.
  - rung: 3
    name: first_step
    text:
      en: 'Test each option against how the material behaves: does it keep its shape, flow, or spread out?'
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that give single particles the properties of the whole material.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: They are moving rapidly and randomly.'
  misconception_ids:
  - mc.phy.o.brownian_molecules_seen
  - mc.phy.o.brownian_not_from_collisions
  - mc.phy.o.particles_grow_when_heated
solution:
  steps:
  - n: 1
    latex: \text{They are moving rapidly and randomly}
    reason: Match the description to the particle model
