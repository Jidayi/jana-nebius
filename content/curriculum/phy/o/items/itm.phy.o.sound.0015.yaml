stem: A sound wave passes through the air in a room.
parts:
- id: a
  prompt: How do the air particles move?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: They vibrate up and down at right angles to the direction of travel
      correct: false
      misconception_id: mc.phy.o.sound_called_transverse
      feedback: 'Sound is longitudinal: the particles move back and forth along the direction the sound travels, making compressions and rarefactions.'
    - id: B
      text: They travel from the source all the way to the listener
      correct: false
      misconception_id: mc.phy.o.wave_carries_medium
      feedback: A floating leaf bobs up and down as ripples pass but stays in the same place. Waves carry energy, not the material they travel through.
    - id: C
      text: They stay still while the sound passes between them
      correct: false
      misconception_id: mc.phy.o.medium_stays_still
      feedback: If the particles did not move they could not pass the energy on. Each one vibrates about a fixed position.
    - id: D
      text: They vibrate back and forth along the direction the sound travels
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture what happens between a vibrating object and your ear.
  - rung: 2
    name: concept
    text:
      en: The particles of the material vibrate back and forth along the direction the sound travels, passing the energy on.
  - rung: 3
    name: first_step
    text:
      en: Squashed regions and stretched regions travel outwards; the particles themselves stay where they were on average.
  - rung: 4
    name: worked_step
    text:
      en: Sound needs particles to pass the vibrations along.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: They vibrate back and forth along the direction the sound travels.'
  misconception_ids:
  - mc.phy.o.medium_stays_still
  - mc.phy.o.sound_called_transverse
  - mc.phy.o.wave_carries_medium
solution:
  steps:
  - n: 1
    latex: \text{They vibrate back and forth along the direction the sound travels}
    reason: Sound is a longitudinal wave that needs a medium
