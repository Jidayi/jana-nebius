id: itm.phy.o.circuits.0033
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.mixed_circuits
stem: A 20 Ω resistor is connected in series with a parallel pair made of a 5 Ω resistor and a 20 Ω resistor. The circuit is connected to a 6 V battery.
parts:
- id: a
  prompt: Calculate the p.d. across the parallel pair.
  marks: 3
  answer:
    kind: numeric
    value: '1'
    unit: V
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_cir_0033_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The series resistor and the parallel pair share the battery p.d.
  - rung: 2
    name: concept
    text:
      en: Find the current from the battery, then use V = IR with the pair's combined resistance.
  - rung: 3
    name: first_step
    text:
      en: The pair's combined resistance is (5 × 20) ÷ (5 + 20) = 4 Ω.
  - rung: 4
    name: worked_step
    text:
      en: The total is 24 Ω, so the current is 0.25 A; multiply it by 4 Ω.
  - rung: 5
    name: full_step
    text:
      en: The p.d. across the parallel pair is 1 V.
  misconception_ids:
  - mc.phy.o.mixed_branch_gets_full_supply
  - mc.phy.o.series_pd_shared_equally
  - mc.phy.o.series_pd_inverse_to_resistance
solution:
  steps:
  - n: 1
    latex: R_p = \frac{5 \times 20}{5 + 20} = 4\ \Omega
    reason: Combine the parallel pair
    check_id: chk_build_phy_cir_0033_rp
  - n: 2
    latex: R = 20 + 4 = 24\ \Omega
    reason: Add the series resistor
    check_id: chk_build_phy_cir_0033_rt
  - n: 3
    latex: I = \frac{6}{24} = 0.25\ \text{A}
    reason: Current from the battery
    check_id: chk_build_phy_cir_0033_i
  - n: 4
    latex: V_p = I R_p = 0.25 \times 4 = 1\ \text{V}
    reason: V = IR for the pair
    check_id: chk_build_phy_cir_0033_ans
