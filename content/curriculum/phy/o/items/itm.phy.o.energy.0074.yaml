id: itm.phy.o.energy.0074
version: 0.1.1
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.work_done
stem: A builder uses a rope and pulley to raise a bag of cement of mass 40 kg at a steady speed through 5 m. Take g = 10 N/kg.
parts:
- id: a
  prompt: Calculate the work done on the load.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 200 J
      correct: false
      misconception_id: mc.phy.o.energy_mass_for_weight
      feedback: Lifting works against the weight, mg, in newtons. Multiply the mass by g before you multiply by the height.
    - id: B
      text: 80 J
      correct: false
      misconception_id: mc.phy.o.work_force_over_distance
      feedback: Work done = force × distance moved along the force. A bigger push over a longer distance means more work.
    - id: C
      text: 2000 J
      correct: true
    - id: D
      text: 400 J
      correct: false
      misconception_id: mc.phy.o.energy_force_confused
      feedback: A force is a push or a pull in newtons. Energy is measured in joules, and a force only transfers energy when it moves something along its direction.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: At a steady speed the pull equals the weight of the load.
  - rung: 2
    name: concept
    text:
      en: Find the weight with W = mg, then use work = force × distance.
  - rung: 3
    name: first_step
    text:
      en: The weight is 40 × 10 = 400 N.
  - rung: 4
    name: worked_step
    text:
      en: Work out 400 × 5.
  - rung: 5
    name: full_step
    text:
      en: The work done is 2000 J.
  misconception_ids:
  - mc.phy.o.energy_force_confused
  - mc.phy.o.energy_mass_for_weight
  - mc.phy.o.work_force_over_distance
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: F = mg = 40 \times 10 = 400\ \text{N}
    reason: The force equals the weight
    check_id: chk_build_phy_nrg_0074_wt
  - n: 2
    latex: W = F \times d = 400 \times 5 = 2000\ \text{J}
    reason: Work = force × distance
    check_id: chk_build_phy_nrg_0074_ans
