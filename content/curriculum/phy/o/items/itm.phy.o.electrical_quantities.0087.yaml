id: itm.phy.o.electrical_quantities.0087
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.current_voltage_graphs
stem: A diode's current-voltage graph shows a current of 5 mA at 0.65 V and 40 mA at 0.8 V in its forward direction.
parts:
- id: a
  prompt: Find the resistance of the diode at 0.8 V.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 0.02 Ω
      correct: false
      misconception_id: mc.phy.o.milliamps_used_as_amps
      feedback: A milliamp is a thousandth of an amp. Change milliamps to amps before using the formula.
    - id: B
      text: 0.05 Ω
      correct: false
      misconception_id: mc.phy.o.iv_gradient_is_resistance
      feedback: On a graph of current against p.d., the steeper the line the more current flows for each volt, so the smaller the resistance. Use R = V/I.
    - id: C
      text: 4.29 Ω
      correct: false
      misconception_id: mc.phy.o.resistance_from_chord_slope
      feedback: Resistance at a point is the p.d. there divided by the current there. Read both values off the graph at that one point.
    - id: D
      text: 20 Ω
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Use only the readings at the p.d. asked about.
  - rung: 2
    name: concept
    text:
      en: Resistance at a point is R = V ÷ I, with I in amps.
  - rung: 3
    name: first_step
    text:
      en: Change the current into amps first.
  - rung: 4
    name: worked_step
    text:
      en: Divide 0.8 V by 0.04 A.
  - rung: 5
    name: full_step
    text:
      en: R = 0.8 ÷ 0.04 = 20 Ω.
  misconception_ids:
  - mc.phy.o.iv_gradient_is_resistance
  - mc.phy.o.milliamps_used_as_amps
  - mc.phy.o.resistance_from_chord_slope
solution:
  steps:
  - n: 1
    latex: I = 40\ \text{mA} = 0.04\ \text{A}
    reason: A thousand mA in 1 A
    check_id: chk_build_phy_elq_0087_ia
  - n: 2
    latex: R = \frac{V}{I} = \frac{0.8}{0.04} = 20\ \Omega
    reason: Use the readings at that point
    check_id: chk_build_phy_elq_0087_ans
