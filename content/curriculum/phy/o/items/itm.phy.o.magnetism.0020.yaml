stem: A plotting compass is placed beside the south pole of a bar magnet.
parts:
- id: a
  prompt: Which way does the north end of the needle point?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Towards the magnet's south pole
      correct: true
    - id: B
      text: Away from the south pole
      correct: false
      misconception_id: mc.phy.o.compass_points_at_like_pole
      feedback: 'The compass needle is a small magnet: its north end is pushed away from a north pole and pulled towards a south pole.'
    - id: C
      text: Away from the magnet, because field lines leave a south pole
      correct: false
      misconception_id: mc.phy.o.field_lines_s_to_n
      feedback: Outside a magnet the field points from the north pole round to the south pole, the way a small compass's north end points.
    - id: D
      text: Towards the middle of the magnet
      correct: false
      misconception_id: mc.phy.o.field_strongest_at_middle
      feedback: Iron filings pile up at the ends of a bar magnet and hardly at all at its middle. The field is strongest at the poles.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture a small plotting compass placed at that point near the magnet.
  - rung: 2
    name: concept
    text:
      en: Field lines run from north to south outside a magnet, never cross, and are closest where the field is strongest, at the poles.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Unlike poles attract, so the needle's north end is pulled towards a south pole.
  - rung: 5
    name: full_step
    text:
      en: Towards the magnet's south pole. Unlike poles attract, so the needle's north end is pulled towards a south pole.
  misconception_ids:
  - mc.phy.o.compass_points_at_like_pole
  - mc.phy.o.field_lines_s_to_n
  - mc.phy.o.field_strongest_at_middle
