stem: The two ends of a coil are not connected to anything. A magnet is moved in and out of it.
parts:
- id: a
  prompt: Which statement is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: No e.m.f. is induced, because the circuit is not complete
      correct: false
      misconception_id: mc.phy.o.emf_needs_closed_circuit
      feedback: A voltmeter across the ends of an open coil shows an e.m.f. when a magnet moves in it; only a current needs a complete circuit.
    - id: B
      text: No e.m.f. is induced, because there is no cell
      correct: false
      misconception_id: mc.phy.o.emf_needs_closed_circuit
      feedback: A voltmeter across the ends of an open coil shows an e.m.f. when a magnet moves in it; only a current needs a complete circuit.
    - id: C
      text: An e.m.f. is induced, but no current flows
      correct: true
    - id: D
      text: An e.m.f. is induced only when the magnet stops inside the coil
      correct: false
      misconception_id: mc.phy.o.stationary_magnet_induces
      feedback: Leave a magnet still inside a coil and the meter reads zero. Only movement, or a changing field, induces an e.m.f.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Ask what is changing in the magnetic field through the coil.
  - rung: 2
    name: concept
    text:
      en: An e.m.f. is induced while the field through a coil changes; faster change, a stronger magnet and more turns give a bigger e.m.f., and reversing the change reverses it.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: A changing field induces an e.m.f. anyway; a current also needs a complete circuit.
  - rung: 5
    name: full_step
    text:
      en: An e.m.f. is induced, but no current flows. A changing field induces an e.m.f. anyway; a current also needs a complete circuit.
  misconception_ids:
  - mc.phy.o.emf_needs_closed_circuit
  - mc.phy.o.stationary_magnet_induces
