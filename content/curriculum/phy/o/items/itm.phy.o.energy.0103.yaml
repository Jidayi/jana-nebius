id: itm.phy.o.energy.0103
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.efficiency
stem: An LED lamp has an efficiency of 45%. It is supplied with 800 J of electrical energy.
parts:
- id: a
  prompt: Calculate the energy it wastes.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 360 J
      correct: false
      misconception_id: mc.phy.o.useful_wasted_swapped
      feedback: 'Sort the outputs first: what was the device for? That output is useful; everything else is wasted.'
    - id: B
      text: 44000 J
      correct: false
      misconception_id: mc.phy.o.efficiency_percent_not_converted
      feedback: 'Change a percentage to a fraction before using it: 75% is 75 ÷ 100 = 0.75.'
    - id: C
      text: 1450 J
      correct: false
      misconception_id: mc.phy.o.energy_formula_operation_swapped
      feedback: 'Write the formula, then undo each step: what is multiplied moves across as a division, and what is divided moves across as a multiplication.'
    - id: D
      text: 440 J
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The energy wasted is the part of the input that is not useful.
  - rung: 2
    name: concept
    text:
      en: Find the useful output first (efficiency × input), then subtract it from the input.
  - rung: 3
    name: first_step
    text:
      en: 45% as a fraction is 0.45, so the useful output is 0.45 × 800 = 360 J.
  - rung: 4
    name: worked_step
    text:
      en: Work out 800 − 360.
  - rung: 5
    name: full_step
    text:
      en: It wastes 440 J.
  misconception_ids:
  - mc.phy.o.efficiency_percent_not_converted
  - mc.phy.o.energy_formula_operation_swapped
  - mc.phy.o.useful_wasted_swapped
solution:
  steps:
  - n: 1
    latex: 45\% = 0.45
    reason: Efficiency as a fraction
    check_id: chk_build_phy_nrg_0103_e
  - n: 2
    latex: \text{useful} = 0.45 \times 800 = 360\ \text{J}
    reason: Useful = efficiency × input
    check_id: chk_build_phy_nrg_0103_use
  - n: 3
    latex: \text{wasted} = 800 - 360 = 440\ \text{J}
    reason: Wasted = input − useful
    check_id: chk_build_phy_nrg_0103_ans
