id: itm.phy.o.electrical_quantities.0069
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.resistance_of_wires
stem: A constantan wire 1 m long with a cross-sectional area of 0.5 mm² has a resistance of 3 Ω. A second constantan wire is 4 m long with a cross-sectional area of 1 mm².
parts:
- id: a
  prompt: Find the resistance of the second wire.
  marks: 2
  answer:
    kind: numeric
    value: '6'
    unit: Ω
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0069_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Two things change: the length and the cross-sectional area.'
  - rung: 2
    name: concept
    text:
      en: Resistance is proportional to length and inversely proportional to area.
  - rung: 3
    name: first_step
    text:
      en: Multiply by the length ratio (new over old) and by the area ratio (old over new).
  - rung: 4
    name: worked_step
    text:
      en: The length ratio is 4 and the area ratio is 0.5.
  - rung: 5
    name: full_step
    text:
      en: R = 3 × 4 × 0.5 = 6 Ω.
  misconception_ids:
  - mc.phy.o.thicker_wire_more_resistance
  - mc.phy.o.longer_wire_less_resistance
  - mc.phy.o.resistance_set_by_material_only
solution:
  steps:
  - n: 1
    latex: \frac{4}{1} = 4
    reason: R is proportional to length
    check_id: chk_build_phy_elq_0069_lr
  - n: 2
    latex: \frac{0.5}{1} = 0.5
    reason: R is inversely proportional to area
    check_id: chk_build_phy_elq_0069_ar
  - n: 3
    latex: R = 3 \times 4 \times 0.5 = 6\ \Omega
    reason: Apply both changes
    check_id: chk_build_phy_elq_0069_ans
