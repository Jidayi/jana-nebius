stem: A lorry has a driving force of 6000 N acting forwards. Against it act friction of 1200 N and air resistance of 2500 N.
parts:
- id: a
  prompt: Find the size of the resultant force.
  marks: 1
  answer:
    kind: numeric
    value: '2300'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_frc_0006_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Draw each force as an arrow along one line.
  - rung: 2
    name: concept
    text:
      en: Forces in the same direction add; forces in opposite directions subtract.
  - rung: 3
    name: first_step
    text:
      en: Add the two backward forces, then take the total from the forward force.
  - rung: 4
    name: worked_step
    text:
      en: The backward forces total 3700 N; work out 6000 − 3700.
  - rung: 5
    name: full_step
    text:
      en: The resultant force is 2300 N forwards, so the speed increases.
  misconception_ids:
