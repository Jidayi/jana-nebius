subject: phy
level: o
kc_ids:
- kc.phy.o.motion.solve_with_equation
stem: A bus speeds up from 5 m/s to 14 m/s with a steady acceleration of 1.5 m/s^2.
parts:
- id: a
  prompt: How long does it take?
  marks: 3
  answer:
    kind: numeric
    value: '6.00'
    unit: s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0122_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which quantities do you know, and which one are you asked for?
  - rung: 2
    name: concept
    text:
      en: Pick the equation of uniform acceleration with those quantities, then make the unknown its subject.
  - rung: 3
    name: first_step
    text:
      en: Rearrange to t = (v − u) ÷ a.
  - rung: 4
    name: worked_step
    text:
      en: t = (14 − 5) ÷ 1.5.
  - rung: 5
    name: full_step
    text:
      en: t = (14 − 5) ÷ 1.5 = 6.00 s.
  misconception_ids:
  - mc.phy.o.rearrange_sign_error
  - mc.phy.o.square_not_rooted
solution:
  steps:
  - n: 1
    latex: v = u + at
    reason: The equation linking the known quantities
  - n: 2
    latex: t = \frac{v - u}{a}
    reason: Make the unknown the subject
  - n: 3
    latex: t = \frac{14 - 5}{1.5}
    reason: Substitute
  - n: 4
    latex: t = 6.00\ \text{s}
    reason: Evaluate
    check_id: chk_build_phy_k_0122_a
