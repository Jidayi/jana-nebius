stem: Neema pushes and pulls one end of a stretched slinky spring. A photo shows 5 compressions in a row, and the distance from the centre of the first to the centre of the last is 120 cm.
parts:
- id: a
  prompt: Find the wavelength of the wave.
  marks: 2
  answer:
    kind: numeric
    value: '30'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_wav_0037_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: One wavelength is the distance from one compression to the next.
  - rung: 2
    name: concept
    text:
      en: Between 5 compressions in a row there are fewer gaps than compressions.
  - rung: 3
    name: first_step
    text:
      en: There are 4 gaps in the 120 cm.
  - rung: 4
    name: worked_step
    text:
      en: Divide 120 cm by 4.
  - rung: 5
    name: full_step
    text:
      en: λ = 30 cm.
  misconception_ids:
  - mc.phy.o.compressions_counted_not_gaps
  - mc.phy.o.wavelength_whole_diagram
  - mc.phy.o.compression_rarefaction_as_wavelength
solution:
  steps:
  - n: 1
    latex: 5 - 1 = 4
    reason: The number of gaps between the compressions
    check_id: chk_build_phy_wav_0037_gaps
  - n: 2
    latex: \lambda = \frac{120}{4} = 30\ \text{cm}
    reason: One wavelength per gap
    check_id: chk_build_phy_wav_0037_ans
