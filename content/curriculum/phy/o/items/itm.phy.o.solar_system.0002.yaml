stem: The Moon is often bright in the night sky.
parts:
- id: a
  prompt: Why can we see the Moon?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It gives out its own light, like a star
      correct: false
      misconception_id: mc.phy.o.moon_makes_own_light
      feedback: The Moon is a cold, rocky body. We see it only because it reflects light from the Sun, which is why the unlit part looks dark.
    - id: B
      text: It glows only when it is full
      correct: false
      misconception_id: mc.phy.o.moon_makes_own_light
      feedback: The Moon is a cold, rocky body. We see it only because it reflects light from the Sun, which is why the unlit part looks dark.
    - id: C
      text: It reflects light from the Sun
      correct: true
    - id: D
      text: The Earth's shadow lights it up
      correct: false
      misconception_id: mc.phy.o.moon_phases_earth_shadow
      feedback: Half the Moon is always lit by the Sun. As it orbits we see different amounts of that lit half. The Earth's shadow only reaches the Moon in an eclipse.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Separate the three motions: the Earth''s spin, the Earth''s orbit and the Moon''s orbit.'
  - rung: 2
    name: concept
    text:
      en: The spin takes a day, the Earth's orbit a year, and the Moon's orbit roughly a month.
  - rung: 3
    name: first_step
    text:
      en: Seasons come from the tilt of the Earth's axis; phases come from how much of the Moon's sunlit half we see.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these facts.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It reflects light from the Sun.'
  misconception_ids:
  - mc.phy.o.moon_makes_own_light
  - mc.phy.o.moon_phases_earth_shadow
