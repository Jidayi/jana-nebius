stem: A thermistor is placed in a beaker of water, which is then slowly heated.
parts:
- id: a
  prompt: How does the thermistor's resistance change?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It decreases as the water gets hotter
      correct: true
    - id: B
      text: It increases, as a metal wire's does
      correct: false
      misconception_id: mc.phy.o.thermistor_resistance_rises_with_heat
      feedback: 'The thermistors used at this level have a resistance that falls as they get warmer: hot means low resistance.'
    - id: C
      text: It stays the same, like any other resistor
      correct: false
      misconception_id: mc.phy.o.sensor_resistance_constant
      feedback: 'A sensor is useful because its resistance changes: with temperature for a thermistor, with light for an LDR.'
    - id: D
      text: It changes only if the light on it changes
      correct: false
      misconception_id: mc.phy.o.thermistor_ldr_confused
      feedback: 'Thermistor: temperature (think thermometer). LDR: light-dependent resistor, its symbol has arrows of light pointing in.'
