id: itm.phy.o.motion.0330
version: 0.1.1
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.motion.free_fall
stem: A pebble falls from rest from a high branch. Take g = 10 m/s² and ignore air resistance.
parts:
- id: a
  prompt: How fast is it moving after 4 s?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 80 m/s
      correct: false
      misconception_id: mc.phy.o.fall_formulas_mixed
      feedback: 'Velocity grows in step with time: v = gt. Distance grows with time squared: s = ½gt². Check which the question asks for.'
    - id: B
      text: 20 m/s
      correct: false
      misconception_id: mc.phy.o.half_used_for_velocity
      feedback: The half belongs to the distance equation. Velocity after t seconds from rest is simply g times t.
    - id: C
      text: 40 m/s
      correct: true
    - id: D
      text: 2.5 m/s
      correct: false
      misconception_id: mc.phy.o.g_divided_by_time
      feedback: 'The longer something falls, the faster it goes, so the answer must grow with time: multiply g by t.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A falling object gains the same amount of velocity every second.
  - rung: 2
    name: concept
    text:
      en: Starting from rest, v = gt.
  - rung: 3
    name: first_step
    text:
      en: The half belongs to the distance equation, not the velocity one.
  - rung: 4
    name: worked_step
    text:
      en: Work out 10 × 4.
  - rung: 5
    name: full_step
    text:
      en: It is moving at 40 m/s.
  misconception_ids:
  - mc.phy.o.fall_formulas_mixed
  - mc.phy.o.g_divided_by_time
  - mc.phy.o.half_used_for_velocity
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: v = gt = 10 \times 4 = 40\ \text{m/s}
    reason: From v = u + at with u = 0 and a = g
    check_id: chk_build_phy_mot_0330_ans
