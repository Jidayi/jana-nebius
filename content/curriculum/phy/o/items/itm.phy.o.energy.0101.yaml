id: itm.phy.o.energy.0101
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.efficiency
stem: A car engine is supplied with 200 J of energy from its fuel. It transfers 40 J to the kinetic store of the car.
parts:
- id: a
  prompt: Calculate its efficiency as a percentage.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 500%
      correct: false
      misconception_id: mc.phy.o.efficiency_inverted
      feedback: No device gives out more useful energy than it takes in, so an efficiency must be less than 100%. Put the useful output on top.
    - id: B
      text: 20%
      correct: true
    - id: C
      text: 80%
      correct: false
      misconception_id: mc.phy.o.useful_wasted_swapped
      feedback: 'Sort the outputs first: what was the device for? That output is useful; everything else is wasted.'
    - id: D
      text: 0.2%
      correct: false
      misconception_id: mc.phy.o.efficiency_fraction_percent_mixed
      feedback: 'Useful ÷ input gives a fraction such as 0.8. To write it as a percentage, multiply by a hundred: 80%.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Efficiency compares the useful output with the total input.
  - rung: 2
    name: concept
    text:
      en: Efficiency = useful energy out ÷ total energy in, then multiply by a hundred for a percentage.
  - rung: 3
    name: first_step
    text:
      en: The fraction is 40 ÷ 200 = 0.2.
  - rung: 4
    name: worked_step
    text:
      en: Write 0.2 as a percentage.
  - rung: 5
    name: full_step
    text:
      en: The efficiency is 20%.
  misconception_ids:
  - mc.phy.o.efficiency_fraction_percent_mixed
  - mc.phy.o.efficiency_inverted
  - mc.phy.o.useful_wasted_swapped
solution:
  steps:
  - n: 1
    latex: \frac{\text{useful}}{\text{total in}} = \frac{40}{200} = 0.2
    reason: Efficiency as a fraction
    check_id: chk_build_phy_nrg_0101_frac
  - n: 2
    latex: 0.2 = 20\%
    reason: As a percentage
    check_id: chk_build_phy_nrg_0101_ans
