stem: A team pushes a broken-down car along a road. The force does 3.6 kJ of work while moving it 8 m in the direction of the force.
parts:
- id: a
  prompt: Calculate the size of the force, in newtons.
  marks: 2
  answer:
    kind: numeric
    value: '450'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_nrg_0065_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You know the work and the distance; the force is the unknown.
  - rung: 2
    name: concept
    text:
      en: Rearrange W = F × d to get F = W ÷ d, with W in joules.
  - rung: 3
    name: first_step
    text:
      en: 3.6 kJ = 3600 J.
  - rung: 4
    name: worked_step
    text:
      en: Work out 3600 ÷ 8.
  - rung: 5
    name: full_step
    text:
      en: The force is 450 N.
  misconception_ids:
  - mc.phy.o.energy_kilo_prefix_ignored
  - mc.phy.o.energy_formula_operation_swapped
  - mc.phy.o.energy_formula_inverted
solution:
  steps:
  - n: 1
    latex: W = 3.6\ \text{kJ} = 3600\ \text{J}
    reason: Work in joules
    check_id: chk_build_phy_nrg_0065_wj
  - n: 2
    latex: F = \frac{W}{d} = \frac{3600}{8} = 450\ \text{N}
    reason: Rearrange W = Fd
    check_id: chk_build_phy_nrg_0065_ans
