stem: Three main-sequence stars have masses of 0.5, 1 and 10 times the Sun's mass.
parts:
- id: a
  prompt: Which star will spend the shortest time on the main sequence?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The star of 10 times the Sun's mass
      correct: true
    - id: B
      text: The star of 0.5 times the Sun's mass
      correct: false
      misconception_id: mc.phy.o.massive_stars_live_longer
      feedback: A massive star has more fuel but uses it far faster, because its core is hotter. The biggest stars last only a few million years; the Sun lasts about ten billion.
    - id: C
      text: All three will last the same time
      correct: false
      misconception_id: mc.phy.o.stars_never_change
      feedback: A star's fuel runs out in the end. Its life is so long, millions to billions of years, that we never see one star change much.
    - id: D
      text: The one that burns the most oxygen
      correct: false
      misconception_id: mc.phy.o.stars_shine_by_burning
      feedback: There is no oxygen fire in a star. In its core hydrogen nuclei fuse into helium, releasing far more energy than any chemical burning could.
  show_working: false
  hints:
