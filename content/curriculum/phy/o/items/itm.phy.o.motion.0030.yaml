id: itm.phy.o.motion.0030
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.motion.average_speed
stem: A walker goes 1200 m in 100 s, then straight on for a further 500 m in 60 s along the same path.
parts:
- id: a
  prompt: Calculate the average speed for the whole walk.
  marks: 3
  answer:
    kind: numeric
    value: '11'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0030_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: There are two parts to the walk. What do you need for the whole journey?
  - rung: 2
    name: concept
    text:
      en: Average speed for the whole journey is total distance divided by total time, not the average of the two speeds.
  - rung: 3
    name: first_step
    text:
      en: Find the total distance and the total time first.
  - rung: 4
    name: worked_step
    text:
      en: Total distance = 1200 + 500; total time = 100 + 60. Now divide.
  - rung: 5
    name: full_step
    text:
      en: (1200 + 500) ÷ (100 + 60) = 11 m/s.
  misconception_ids:
  - mc.phy.o.average_of_speeds
solution:
  steps:
  - n: 1
    latex: v = \frac{d_1 + d_2}{t_1 + t_2}
    reason: Average speed uses totals
  - n: 2
    latex: d_1 + d_2 = 1700\ \text{m}
    reason: Total distance
    check_id: chk_build_phy_k_0030_s2
  - n: 3
    latex: t_1 + t_2 = 160\ \text{s}
    reason: Total time
    check_id: chk_build_phy_k_0030_s3
  - n: 4
    latex: v = 11\ \text{m/s}
    reason: Divide
    check_id: chk_build_phy_k_0030_a
