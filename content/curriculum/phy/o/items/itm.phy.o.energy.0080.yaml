stem: An electric motor lifts a load of weight 200 N through a height of 3 m in 6 s.
parts:
- id: a
  prompt: Calculate the useful power output of the motor.
  marks: 2
  answer:
    kind: numeric
    value: '100'
    unit: W
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_nrg_0080_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Power is the work done each second.
  - rung: 2
    name: concept
    text:
      en: Find the work done (weight × height), then divide by the time.
  - rung: 3
    name: first_step
    text:
      en: The work done is 200 × 3 = 600 J.
  - rung: 4
    name: worked_step
    text:
      en: Work out 600 ÷ 6.
  - rung: 5
    name: full_step
    text:
      en: The power is 100 W.
  misconception_ids:
  - mc.phy.o.power_is_energy
  - mc.phy.o.power_energy_times_time
  - mc.phy.o.energy_formula_inverted
solution:
  steps:
  - n: 1
    latex: W = Fd = 200 \times 3 = 600\ \text{J}
    reason: Work done lifting the load
    check_id: chk_build_phy_nrg_0080_wd
  - n: 2
    latex: P = \frac{W}{t} = \frac{600}{6} = 100\ \text{W}
    reason: Power = work ÷ time
    check_id: chk_build_phy_nrg_0080_ans
