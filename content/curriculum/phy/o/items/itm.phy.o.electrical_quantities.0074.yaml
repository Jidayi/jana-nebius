id: itm.phy.o.electrical_quantities.0074
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.resistance_of_wires
stem: A constantan wire of diameter 0.4 mm has a resistance of 8 Ω.
parts:
- id: a
  prompt: Find the resistance of a wire of the same metal and length but with a diameter of 1.2 mm.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 2.67 Ω
      correct: false
      misconception_id: mc.phy.o.diameter_used_as_area
      feedback: Doubling the diameter makes the cross-section four times the area, so the resistance falls to a quarter, not a half.
    - id: B
      text: 72 Ω
      correct: false
      misconception_id: mc.phy.o.thicker_wire_more_resistance
      feedback: Two equal wires side by side carry twice the current for the same p.d., so doubling the area halves the resistance.
    - id: C
      text: 0.889 Ω
      correct: true
    - id: D
      text: 8 Ω
      correct: false
      misconception_id: mc.phy.o.resistance_set_by_material_only
      feedback: A longer piece of the same wire has more resistance and a thicker piece less. The material is only one of the factors.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A thicker wire gives the current more room, so less resistance.
  - rung: 2
    name: concept
    text:
      en: Resistance is inversely proportional to cross-sectional area, and area goes with diameter squared.
  - rung: 3
    name: first_step
    text:
      en: Square the ratio of the diameters, old over new.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 8 Ω by (0.4 ÷ 1.2)².
  - rung: 5
    name: full_step
    text:
      en: R = 8 × 0.111 = 0.889 Ω.
  misconception_ids:
  - mc.phy.o.diameter_used_as_area
  - mc.phy.o.resistance_set_by_material_only
  - mc.phy.o.thicker_wire_more_resistance
solution:
  steps:
  - n: 1
    latex: A \propto d^2
    reason: The cross-sectional area goes with the diameter squared
  - n: 2
    latex: \left(\frac{0.4}{1.2}\right)^2 = 0.111
    reason: Resistance is inversely proportional to area
    check_id: chk_build_phy_elq_0074_ratio
  - n: 3
    latex: R = 8 \times 0.111 = 0.889\ \Omega
    reason: Scale the resistance
    check_id: chk_build_phy_elq_0074_ans
