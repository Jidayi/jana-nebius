  - rung: 3
    name: first_step
    text:
      en: Square each vector, add the squares, then take the square root.
  - rung: 4
    name: worked_step
    text:
      en: 20² + 21² = 841.
  - rung: 5
    name: full_step
    text:
      en: The resultant is √841 = 29 N.
