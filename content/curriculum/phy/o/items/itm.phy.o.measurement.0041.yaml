stem: 'Two forces act on a point at right angles: 20 N east and 21 N north.'
parts:
- id: a
  prompt: Calculate the size of the resultant force.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 41 N
      correct: false
      misconception_id: mc.phy.o.resultant_adds_sizes
      feedback: Walk three steps east and four steps north and you are five steps from the start, not seven. Use Pythagoras when the vectors are at right angles.
    - id: B
      text: 29 N
      correct: true
    - id: C
      text: 6.40 N
      correct: false
      misconception_id: mc.phy.o.pythagoras_subtracted
      feedback: 'The resultant is the hypotenuse, the longest side: add the squares of the two vectors and take the square root.'
    - id: D
      text: 1 N
      correct: false
      misconception_id: mc.phy.o.perpendicular_subtracted
      feedback: 'Vectors at right angles do not cancel at all: neither has any part pointing against the other. Use Pythagoras.'
