id: itm.phy.o.pressure.0039
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.gas_and_atmospheric_pressure
stem: A mercury manometer is joined to a gas supply. On its scale, the mercury level is at 270 mm in the open arm and at 220 mm in the arm joined to the gas. Atmospheric pressure is 102 kPa and mercury has a density of 13600 kg/m³. Take g = 9.8 N/kg.
parts:
- id: a
  prompt: Calculate the pressure of the gas, in kPa.
  marks: 3
  answer:
    kind: numeric
    value: '109'
    unit: kPa
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_prs_0039_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The side that pushes harder pushes its mercury level down.
  - rung: 2
    name: concept
    text:
      en: The mercury stands higher in the open arm, so the gas pressure is above atmospheric pressure.
  - rung: 3
    name: first_step
    text:
      en: Find the difference between the levels in metres and work out ρgΔh.
  - rung: 4
    name: worked_step
    text:
      en: ρgΔh = 6.66 kPa; add it to 102 kPa.
  - rung: 5
    name: full_step
    text:
      en: The gas pressure is 109 kPa.
  misconception_ids:
  - mc.phy.o.manometer_excess_as_gas_pressure
  - mc.phy.o.manometer_difference_sign_wrong
  - mc.phy.o.manometer_one_level_used
solution:
  steps:
  - n: 1
    latex: \Delta h = 270 - 220 = 50\ \text{mm}
    reason: The difference between the levels
    check_id: chk_build_phy_prs_0039_dh
  - n: 2
    latex: 50\ \text{mm} = 0.05\ \text{m}
    reason: Millimetres into metres
    check_id: chk_build_phy_prs_0039_dhm
  - n: 3
    latex: \rho g \Delta h = 13600 \times 9.8 \times 0.05 = 6.66\ \text{kPa}
    reason: The pressure of the height difference, in kPa
    check_id: chk_build_phy_prs_0039_dp
  - n: 4
    latex: p = 102 + 6.66 = 109\ \text{kPa}
    reason: The gas pushes harder
    check_id: chk_build_phy_prs_0039_ans
