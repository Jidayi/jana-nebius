id: itm.phy.o.particles.0003
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.particles.states_of_matter
stem: A smoke cell like the one used to show Brownian motion is gently warmed.
parts:
- id: a
  prompt: What happens to the jiggling of the smoke specks?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It stops, because the specks melt
      correct: false
      misconception_id: mc.phy.o.particles_have_bulk_properties
      feedback: A single particle does not melt, feel hot or have a colour. Those are properties of huge numbers of particles together, set by how they are arranged and how fast they move.
    - id: B
      text: It slows down, because the specks swell up and become heavier
      correct: false
      misconception_id: mc.phy.o.particles_grow_when_heated
      feedback: A water particle is the same size in ice, in water and in steam. Heating makes particles move faster and spread further apart; it does not make them bigger.
    - id: C
      text: It speeds up, because warm draughts push the specks
      correct: false
      misconception_id: mc.phy.o.brownian_not_from_collisions
      feedback: A draught would carry all the specks the same way. Each speck jerks about on its own path, which only random hits from many tiny molecules can explain.
    - id: D
      text: It becomes more vigorous, because the air molecules move faster
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Picture the particles: how close together are they, and how do they move?'
  - rung: 2
    name: concept
    text:
      en: Temperature is linked to how fast the particles of the air are moving.
  - rung: 3
    name: first_step
    text:
      en: 'Test each option against how the material behaves: does it keep its shape, flow, or spread out?'
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that give single particles the properties of the whole material.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It becomes more vigorous, because the air molecules move faster.'
  misconception_ids:
  - mc.phy.o.brownian_not_from_collisions
  - mc.phy.o.particles_grow_when_heated
  - mc.phy.o.particles_have_bulk_properties
