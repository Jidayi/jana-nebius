id: itm.phy.o.magnetism.0014
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.magnetism.magnets_and_materials
stem: The north pole of a magnet is held under a thin wooden table top, with a steel paper clip on top.
parts:
- id: a
  prompt: What happens to the paper clip?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Nothing, because the wood blocks the force
      correct: false
      misconception_id: mc.phy.o.nonmagnetic_blocks_magnetism
      feedback: A fridge magnet still holds a sheet of paper against the door, and a magnet pulls a paper clip through a thin table top.
    - id: B
      text: Nothing, because the magnet is not touching it
      correct: false
      misconception_id: mc.phy.o.magnetic_force_needs_contact
      feedback: A compass needle swings when a magnet is still a hand's width away. Magnetic forces act at a distance.
    - id: C
      text: It is attracted through the wood
      correct: true
    - id: D
      text: It is pushed away, because its lower end becomes a north pole
      correct: false
      misconception_id: mc.phy.o.induced_pole_same_as_inducing
      feedback: A north pole induces a south pole in the near end of the iron. Unlike poles attract, which is why iron is always pulled towards a magnet.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Recall the two rules: how poles act on each other, and which materials are magnetic.'
  - rung: 2
    name: concept
    text:
      en: Like poles repel and unlike poles attract. Only a few metals are magnetic, and magnetic materials differ in how easily they gain and lose their magnetism.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Wood is not magnetic, so the force passes through it; the clip's lower end becomes a south pole.
  - rung: 5
    name: full_step
    text:
      en: It is attracted through the wood. Wood is not magnetic, so the force passes through it; the clip's lower end becomes a south pole.
  misconception_ids:
  - mc.phy.o.induced_pole_same_as_inducing
  - mc.phy.o.magnetic_force_needs_contact
  - mc.phy.o.nonmagnetic_blocks_magnetism
solution:
  steps:
  - n: 1
    latex: \text{It is attracted through the wood}
    reason: Apply the rules for poles and magnetic materials
