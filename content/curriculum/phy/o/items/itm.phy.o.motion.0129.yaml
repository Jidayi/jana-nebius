stem: A motorbike starts from rest and accelerates steadily at 4.0 m/s^2 until it reaches 10 m/s.
parts:
- id: a
  prompt: How far does it travel while speeding up?
  marks: 3
  answer:
    kind: numeric
    value: '12.5'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0129_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which quantities do you know, and which one are you asked for?
  - rung: 2
    name: concept
    text:
      en: Pick the equation of uniform acceleration with those quantities, then make the unknown its subject.
  - rung: 3
    name: first_step
    text:
      en: Rearrange to s = v^2 ÷ 2a.
  - rung: 4
    name: worked_step
    text:
      en: s = 10^2 ÷ (2 × 4.0).
  - rung: 5
    name: full_step
    text:
      en: s = 10^2 ÷ (2 × 4.0) = 12.5 m.
  misconception_ids:
  - mc.phy.o.rearrange_sign_error
  - mc.phy.o.square_not_rooted
solution:
  steps:
  - n: 1
    latex: v^2 = u^2 + 2as
    reason: The equation linking the known quantities
  - n: 2
    latex: s = \frac{v^2}{2a}
    reason: Make the unknown the subject
  - n: 3
    latex: s = \frac{10^2}{2 \times 4.0}
    reason: Substitute
  - n: 4
    latex: s = 12.5\ \text{m}
    reason: Evaluate
    check_id: chk_build_phy_k_0129_a
