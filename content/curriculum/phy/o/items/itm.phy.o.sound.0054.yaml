stem: Pregnant women are given ultrasound scans rather than X-rays.
parts:
- id: a
  prompt: Why is ultrasound used?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Ultrasound is a gentler kind of X-ray
      correct: false
      misconception_id: mc.phy.o.ultrasound_is_em
      feedback: 'Ultrasound is sound: a longitudinal vibration of particles that needs a medium. Only its frequency is beyond our hearing.'
    - id: B
      text: Ultrasound is ionising, but only weakly
      correct: false
      misconception_id: mc.phy.o.ultrasound_ionising
      feedback: Ultrasound is a sound wave, a vibration of particles. It does not ionise atoms, which is why it is used to scan unborn babies.
    - id: C
      text: Ultrasound is not ionising, so it does not damage the baby's cells
      correct: true
    - id: D
      text: Ultrasound is too quiet to do any harm
      correct: false
      misconception_id: mc.phy.o.inaudible_means_too_quiet
      feedback: A dog whistle can be loud and still be silent to us. The ear cannot respond to frequencies outside about 20 Hz to 20 kHz.
