id: itm.phy.o.motion.0306
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.motion.average_speed
stem: Yaw jogs 1500 m in 250 s, rests for 100 s, then walks 1200 m in 240 s.
parts:
- id: a
  prompt: Find the average speed for the whole journey.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 5.5 m/s
      correct: false
      misconception_id: mc.phy.o.average_of_speeds
      feedback: If you spend longer at the slow speed, the slow speed counts for more. Divide the total distance by the total time.
    - id: B
      text: 0.219 m/s
      correct: false
      misconception_id: mc.phy.o.time_over_distance
      feedback: Speed tells you how many metres you cover each second, so the metres go on top.
    - id: C
      text: 4.58 m/s
      correct: true
    - id: D
      text: 5.51 m/s
      correct: false
      misconception_id: mc.phy.o.rest_time_left_out
      feedback: Average speed for a whole journey uses the whole time, from the start to the end, stops included.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Average speed is about the whole journey from start to finish.
  - rung: 2
    name: concept
    text:
      en: Average speed = total distance ÷ total time.
  - rung: 3
    name: first_step
    text:
      en: The time spent resting is part of the total time.
  - rung: 4
    name: worked_step
    text:
      en: The total distance is 2700 m and the total time is 590 s.
  - rung: 5
    name: full_step
    text:
      en: The average speed is 4.58 m/s.
  misconception_ids:
  - mc.phy.o.average_of_speeds
  - mc.phy.o.rest_time_left_out
  - mc.phy.o.time_over_distance
solution:
  steps:
  - n: 1
    latex: d = 1500 + 1200 = 2700\ \text{m}
    reason: Total distance
    check_id: chk_build_phy_mot_0306_d
  - n: 2
    latex: t = 250 + 100 + 240 = 590\ \text{s}
    reason: Total time, including the rest
    check_id: chk_build_phy_mot_0306_t
  - n: 3
    latex: v = \frac{2700}{590} = 4.58\ \text{m/s}
    reason: Average speed = total distance ÷ total time
    check_id: chk_build_phy_mot_0306_ans
