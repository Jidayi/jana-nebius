stem: The rate of energy loss through a layer of insulation is inversely proportional to its thickness. With 8 cm of loft insulation, a roof loses energy at 400 W.
parts:
- id: a
  prompt: What would the rate of loss be with 15 cm of the same insulation, if nothing else changes?
  marks: 2
  answer:
    kind: numeric
    value: '213'
    unit: W
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_htr_0006_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Insulation is a poor conductor; the more of it energy must pass through, the slower it goes.
  - rung: 2
    name: concept
    text:
      en: 'Inversely proportional: making the layer thicker makes the rate smaller in the same ratio.'
  - rung: 3
    name: first_step
    text:
      en: Multiply 400 W by the old thickness over the new thickness.
  - rung: 4
    name: worked_step
    text:
      en: Work out 400 × 8 ÷ 15.
  - rung: 5
    name: full_step
    text:
      en: The new rate of loss is 213 W.
solution:
  steps:
  - n: 1
    latex: \frac{8}{15} = 0.533
    reason: Thicker layer, smaller rate
    check_id: chk_build_phy_htr_0006_ratio
  - n: 2
    latex: P = 400 \times 0.533 = 213\ \text{W}
    reason: Scale the old rate
    check_id: chk_build_phy_htr_0006_ans
