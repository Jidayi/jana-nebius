id: itm.phy.o.radioactivity.0030
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.decay_equations
stem: A nucleus of uranium-235 (proton number 92) decays by emitting an alpha particle.
parts:
- id: a
  prompt: How many neutrons are in the new nucleus?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '139'
      correct: false
      misconception_id: mc.phy.o.alpha_removes_four_neutrons
      feedback: An alpha particle is two protons and two neutrons, so the nucleus loses two neutrons, not four.
    - id: B
      text: '231'
      correct: false
      misconception_id: mc.phy.o.neutrons_equal_nucleon_number
      feedback: 'The nucleon number counts every particle in the nucleus: protons and neutrons together. Take away the proton number to leave the neutrons.'
    - id: C
      text: '141'
      correct: true
    - id: D
      text: '90'
      correct: false
      misconception_id: mc.phy.o.protons_neutrons_assumed_equal
      feedback: Only some light nuclei have equal numbers. Uranium-238 has 92 protons but 146 neutrons. Work the neutrons out from the nucleon number.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: First find the new nucleon number and proton number.
  - rung: 2
    name: concept
    text:
      en: Alpha decay lowers the nucleon number by 4 and the proton number by 2.
  - rung: 3
    name: first_step
    text:
      en: Then neutrons = nucleon number − proton number.
  - rung: 4
    name: worked_step
    text:
      en: The new nucleus has nucleon number 231 and proton number 90.
  - rung: 5
    name: full_step
    text:
      en: The new nucleus (thorium-231) has 141 neutrons.
  misconception_ids:
  - mc.phy.o.alpha_removes_four_neutrons
  - mc.phy.o.neutrons_equal_nucleon_number
  - mc.phy.o.protons_neutrons_assumed_equal
solution:
  steps:
  - n: 1
    latex: '\text{alpha particle: } 2\ \text{protons} + 2\ \text{neutrons} = 4\ \text{nucleons}'
    reason: An alpha particle is a helium nucleus
    check_id: chk_build_phy_rad_0030_alpha_a
  - n: 2
    latex: A = 235 - 4 = 231
    reason: The alpha particle takes 4 nucleons
    check_id: chk_build_phy_rad_0030_a2
  - n: 3
    latex: Z = 92 - 2 = 90
    reason: and 2 protons
    check_id: chk_build_phy_rad_0030_z2
  - n: 4
    latex: '{}^{235}_{92}\text{U} \rightarrow {}^{231}_{90}\text{Th} + {}^{4}_{2}\text{He}'
    reason: Both numbers balance on the two sides of the equation
  - n: 5
    latex: N = 231 - 90 = 141
    reason: Neutrons = nucleon number − proton number
    check_id: chk_build_phy_rad_0030_ans
difficulty:
  prior: 0.4
  band: core
estimated_seconds: 60
