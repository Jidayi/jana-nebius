id: itm.phy.o.oscilloscope.0007
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.oscilloscope.time_base
stem: An oscilloscope's time-base is set to 1 ms/div. On the trace, the distance from a crest to the next trough is 1 division.
parts:
- id: a
  prompt: Find the period of the signal in milliseconds.
  marks: 2
  answer:
    kind: numeric
    value: '2'
    unit: ms
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_osc_0007_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The period is the time for one complete wave, from a crest to the next crest.
  - rung: 2
    name: concept
    text:
      en: The time-base gives the time for each horizontal division.
  - rung: 3
    name: first_step
    text:
      en: Find how many divisions one complete wave takes.
  - rung: 4
    name: worked_step
    text:
      en: Multiply that number of divisions by 1 ms.
  - rung: 5
    name: full_step
    text:
      en: The period is 2 ms.
  misconception_ids:
  - mc.phy.o.osc_half_wave_as_period
  - mc.phy.o.osc_timebase_divided
  - mc.phy.o.osc_divisions_as_time
  - mc.phy.o.osc_frequency_period_confused
solution:
  steps:
  - n: 1
    latex: T = 2 \times 1 \times 1 = 2\ \text{ms}
    reason: Crest to trough is half a wave, so double it
    check_id: chk_build_phy_osc_0007_ans
