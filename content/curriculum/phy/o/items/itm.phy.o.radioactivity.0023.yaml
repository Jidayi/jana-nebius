subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.decay_equations
stem: A nucleus of plutonium-239 (proton number 94) decays to uranium-235 (proton number 92).
parts:
- id: a
  prompt: What did the nucleus emit?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: A beta particle
      correct: false
      misconception_id: mc.phy.o.beta_treated_as_alpha
      feedback: Alpha takes away 4 nucleons and 2 protons. Beta takes away no nucleons and raises the proton number by one.
    - id: B
      text: Gamma radiation
      correct: false
      misconception_id: mc.phy.o.gamma_changes_numbers
      feedback: Gamma rays carry energy away but no particles, so the proton and nucleon numbers stay the same.
    - id: C
      text: Two separate protons
      correct: false
    - id: D
      text: An alpha particle
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Compare the nucleon numbers and the proton numbers before and after.
  - rung: 2
    name: concept
    text:
      en: 'Alpha: nucleon number −4, proton number −2. Beta: nucleon number the same, proton number +1. Gamma: no change.'
  - rung: 3
    name: first_step
    text:
      en: 'Both numbers have fallen: the nucleon number by 4 and the proton number by 2.'
  - rung: 4
    name: worked_step
    text:
      en: Which emission makes exactly that change?
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: An alpha particle.'
  misconception_ids:
  - mc.phy.o.beta_treated_as_alpha
  - mc.phy.o.gamma_changes_numbers
solution:
  steps:
  - n: 1
    latex: '\text{alpha particle: } 2\ \text{protons} + 2\ \text{neutrons} = 4\ \text{nucleons}'
    reason: An alpha particle is a helium nucleus
    check_id: chk_build_phy_rad_0023_alpha_a
  - n: 2
    latex: '{}^{239}_{94}\text{Pu} \rightarrow {}^{235}_{92}\text{U} + \ ?'
    reason: Compare the numbers
