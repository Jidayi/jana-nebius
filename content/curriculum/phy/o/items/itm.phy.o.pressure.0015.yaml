id: itm.phy.o.pressure.0015
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.pressure_on_surfaces
stem: A girl standing on both feet lifts one foot off the ground.
parts:
- id: a
  prompt: What happens to the pressure on the ground under her?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It halves
      correct: false
      misconception_id: mc.phy.o.larger_area_larger_pressure
      feedback: Snowshoes stop you sinking because they spread your weight over a big area. For the same force, the bigger the area the smaller the pressure.
    - id: B
      text: It stays the same, as her weight has not changed
      correct: false
      misconception_id: mc.phy.o.pressure_depends_on_force_only
      feedback: 'Push a drawing pin into a board: the force on the point and on the head is the same, yet the point goes into the wood and the head does not hurt your thumb. Different areas give different pressures.'
    - id: C
      text: It stays the same, because the force on the ground halves when the area halves
      correct: false
      misconception_id: mc.phy.o.pressure_area_changes_force
      feedback: Lifting a foot does not change her weight, so the force on the ground stays the same. Only the area changes, and a smaller area means a larger pressure.
    - id: D
      text: It doubles
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Pressure depends on the force and on the area it is spread over.
  - rung: 2
    name: concept
    text:
      en: Her weight is now carried by half the area.
  - rung: 3
    name: first_step
    text:
      en: For the same force, a smaller area gives a greater pressure.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that change the force when only the area changes.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It doubles.'
  misconception_ids:
  - mc.phy.o.larger_area_larger_pressure
  - mc.phy.o.pressure_area_changes_force
  - mc.phy.o.pressure_depends_on_force_only
solution:
  steps:
  - n: 1
    latex: \text{It doubles}
    reason: Same force, smaller area, greater pressure
