stem: The coil of an a.c. generator is made to turn faster.
parts:
- id: a
  prompt: What happens to its output?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: The peak e.m.f. falls and the frequency rises
      correct: false
      misconception_id: mc.phy.o.induction_factor_reversed
      feedback: The faster the field changes, the bigger the e.m.f. Faster motion, a stronger magnet and more turns all increase it.
    - id: B
      text: Both the peak e.m.f. and the frequency increase
      correct: true
    - id: C
      text: The peak e.m.f. rises but the frequency stays the same
      correct: false
      misconception_id: mc.phy.o.generator_frequency_fixed
      feedback: One turn gives one cycle, so turning twice as fast gives twice as many cycles each second.
    - id: D
      text: The peak e.m.f. stays the same and the frequency rises
      correct: false
      misconception_id: mc.phy.o.induction_factor_reversed
      feedback: The faster the field changes, the bigger the e.m.f. Faster motion, a stronger magnet and more turns all increase it.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Ask what is changing in the magnetic field through the coil.
  - rung: 2
    name: concept
    text:
      en: An e.m.f. is induced while the field through a coil changes; faster change, a stronger magnet and more turns give a bigger e.m.f., and reversing the change reverses it.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Faster turning changes the field faster and completes more cycles each second.
  - rung: 5
    name: full_step
    text:
      en: Both the peak e.m.f. and the frequency increase. Faster turning changes the field faster and completes more cycles each second.
  misconception_ids:
