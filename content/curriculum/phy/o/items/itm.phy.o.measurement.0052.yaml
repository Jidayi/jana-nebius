stem: With its jaws closed, a micrometer reads 0.05 mm above zero. A ball bearing then gives a reading of 3.46 mm.
parts:
- id: a
  prompt: Find the corrected diameter of the ball bearing.
  marks: 2
  answer:
    kind: numeric
    value: '3.41'
    unit: mm
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mea_0052_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A zero error is the reading when the true value is zero.
  - rung: 2
    name: concept
    text:
      en: Every reading is wrong by the same zero error.
  - rung: 3
    name: first_step
    text:
      en: Corrected reading = reading − zero error, keeping the sign of the zero error.
  - rung: 4
    name: worked_step
    text:
      en: The zero error is +0.05 mm.
  - rung: 5
    name: full_step
    text:
      en: The corrected diameter is 3.41 mm.
  misconception_ids:
  - mc.phy.o.zero_error_wrong_way
  - mc.phy.o.zero_error_ignored
  - mc.phy.o.thimble_read_as_tenths
solution:
  steps:
  - n: 1
    latex: \text{zero error} = +0.05\ \text{mm}
    reason: The instrument reads above zero when closed
  - n: 2
    latex: d = 3.46 - (0.05) = 3.41\ \text{mm}
    reason: Corrected reading = reading − zero error
    check_id: chk_build_phy_mea_0052_ans
