id: itm.phy.o.energy.0105
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.efficiency
stem: A filament lamp takes in 40 W and gives out 4.8 W as light.
parts:
- id: a
  prompt: Calculate its efficiency as a percentage.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 833%
      correct: false
      misconception_id: mc.phy.o.efficiency_inverted
      feedback: No device gives out more useful energy than it takes in, so an efficiency must be less than 100%. Put the useful output on top.
    - id: B
      text: 12%
      correct: true
    - id: C
      text: 88%
      correct: false
      misconception_id: mc.phy.o.useful_wasted_swapped
      feedback: 'Sort the outputs first: what was the device for? That output is useful; everything else is wasted.'
    - id: D
      text: 13.6%
      correct: false
      misconception_id: mc.phy.o.efficiency_useful_over_wasted
      feedback: 'Efficiency compares the useful output with everything that went in: useful ÷ (useful + wasted).'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Efficiency can be worked out from powers as well as energies.
  - rung: 2
    name: concept
    text:
      en: Efficiency = useful power out ÷ total power in.
  - rung: 3
    name: first_step
    text:
      en: Work out 4.8 ÷ 40.
  - rung: 4
    name: worked_step
    text:
      en: The fraction is 0.12; write it as a percentage.
  - rung: 5
    name: full_step
    text:
      en: The efficiency is 12%.
  misconception_ids:
  - mc.phy.o.efficiency_inverted
  - mc.phy.o.efficiency_useful_over_wasted
  - mc.phy.o.useful_wasted_swapped
solution:
  steps:
  - n: 1
    latex: \frac{4.8}{40} = 0.12
    reason: Useful power out ÷ total power in
    check_id: chk_build_phy_nrg_0105_frac
  - n: 2
    latex: 0.12 = 12\%
    reason: As a percentage
    check_id: chk_build_phy_nrg_0105_ans
