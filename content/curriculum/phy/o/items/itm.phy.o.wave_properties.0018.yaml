stem: Waves travel along a rope at 6 m/s. The end of the rope is shaken at 2.5 Hz.
parts:
- id: a
  prompt: Calculate the wavelength in metres.
  marks: 2
  answer:
    kind: numeric
    value: '2.4'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_wav_0018_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Start from v = f × λ.
  - rung: 2
    name: concept
    text:
      en: 'To find λ, divide the speed by the frequency: λ = v ÷ f.'
  - rung: 3
    name: first_step
    text:
      en: The values are already in SI units, so no conversion is needed.
  - rung: 4
    name: worked_step
    text:
      en: Divide 6 by the frequency in hertz.
  - rung: 5
    name: full_step
    text:
      en: λ = 2.4 m.
  misconception_ids:
  - mc.phy.o.wave_equation_inverted
  - mc.phy.o.wave_equation_multiplied
solution:
  steps:
  - n: 1
    latex: \lambda = \frac{v}{f} = \frac{6}{2.5} = 2.4\ \text{m}
    reason: Rearrange v = fλ
    check_id: chk_build_phy_wav_0018_ans
