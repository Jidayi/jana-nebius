id: itm.phy.o.heat_transfer.0015
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.heat_transfer.conduction
stem: One end of a copper rod is held in a flame, and soon the other end gets hot.
parts:
- id: a
  prompt: What carries most of the energy along the copper?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Vibrating atoms passing on vibrations, with nothing else involved
      correct: false
      misconception_id: mc.phy.o.metal_conduction_vibration_only
      feedback: All solids pass energy on by vibrations, but this is slow. Metals also have free electrons that move quickly through the metal and carry energy fast.
    - id: B
      text: Hot copper atoms travelling from one end to the other
      correct: false
      misconception_id: mc.phy.o.conduction_particles_travel
      feedback: In a solid the atoms stay in place and pass vibrations to their neighbours; in a metal, free electrons also carry energy. The material itself does not flow along.
    - id: C
      text: Cold passing from the far end towards the flame
      correct: false
      misconception_id: mc.phy.o.cold_transferred_as_substance
      feedback: Only energy moves, always from hotter to colder. An ice pack does not send cold into you; energy flows out of you into the ice.
    - id: D
      text: Free electrons moving through the metal, helped by vibrating atoms
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Conduction passes energy through a material without the material itself moving.
  - rung: 2
    name: concept
    text:
      en: Metals contain electrons that are not tied to any one atom.
  - rung: 3
    name: first_step
    text:
      en: Remember that energy always flows from hotter to colder, and that nothing called 'cold' flows.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options where an insulator makes heat or where particles travel through a solid.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Free electrons moving through the metal, helped by vibrating atoms.'
  misconception_ids:
  - mc.phy.o.cold_transferred_as_substance
  - mc.phy.o.conduction_particles_travel
  - mc.phy.o.metal_conduction_vibration_only
