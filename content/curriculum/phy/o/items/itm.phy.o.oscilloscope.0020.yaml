id: itm.phy.o.oscilloscope.0020
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.oscilloscope.y_gain
stem: An oscilloscope's Y-gain is 2 V/div. The crests of a trace are 3 divisions above the centre line and the troughs the same distance below.
parts:
- id: a
  prompt: Find the peak-to-peak voltage of the signal.
  marks: 1
  answer:
    kind: numeric
    value: '12'
    unit: V
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_osc_0020_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Peak-to-peak is measured from the top of a crest to the bottom of a trough.
  - rung: 2
    name: concept
    text:
      en: That height is twice the height of a crest above the centre line.
  - rung: 3
    name: first_step
    text:
      en: Multiply the crest-to-trough height in divisions by the Y-gain.
  - rung: 4
    name: worked_step
    text:
      en: Crest to trough is 2 × 3 divisions; multiply by 2 V/div.
  - rung: 5
    name: full_step
    text:
      en: The peak-to-peak voltage is 12 V.
  misconception_ids:
  - mc.phy.o.osc_peak_and_peak_to_peak_confused
  - mc.phy.o.osc_ygain_divided
  - mc.phy.o.osc_divisions_as_volts
solution:
  steps:
  - n: 1
    latex: V_{pp} = 2 \times 3 \times 2 = 12\ \text{V}
    reason: Crest to trough
    check_id: chk_build_phy_osc_0020_ans
