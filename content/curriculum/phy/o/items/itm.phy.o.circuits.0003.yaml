id: itm.phy.o.circuits.0003
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.series_circuits
stem: A 12 Ω resistor and a buzzer of resistance 20 Ω are connected in series to a 9 V supply.
parts:
- id: a
  prompt: Calculate the p.d. across the 20 Ω component.
  marks: 2
  answer:
    kind: numeric
    value: '5.625'
    unit: V
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_cir_0003_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: In series the supply p.d. is shared between the two components.
  - rung: 2
    name: concept
    text:
      en: The bigger resistance takes the bigger share; the shares add up to the supply p.d.
  - rung: 3
    name: first_step
    text:
      en: Find the current from the total resistance, then use V = IR for the one component.
  - rung: 4
    name: worked_step
    text:
      en: The total resistance is 32 Ω, so its share is 20/32 of 9 V.
  - rung: 5
    name: full_step
    text:
      en: The p.d. across the 20 Ω component is 5.625 V.
  misconception_ids:
  - mc.phy.o.series_treated_as_parallel
  - mc.phy.o.series_pd_shared_equally
  - mc.phy.o.series_pd_inverse_to_resistance
solution:
  steps:
  - n: 1
    latex: R = 12 + 20 = 32\ \Omega
    reason: Series resistances add
    check_id: chk_build_phy_cir_0003_rt
  - n: 2
    latex: I = \frac{9}{32} = 0.281\ \text{A}
    reason: The current is the same in both
    check_id: chk_build_phy_cir_0003_i
  - n: 3
    latex: V = IR = \frac{9 \times 20}{32} = 5.625\ \text{V}
    reason: V = IR for one part
    check_id: chk_build_phy_cir_0003_ans
