stem: 'Two points are read from the current-voltage graph of a filament lamp: a current of 0.5 A at 4 V, and 0.8 A at 12 V.'
parts:
- id: a
  prompt: Find the resistance of the lamp when the p.d. across it is 12 V.
  marks: 2
  answer:
    kind: numeric
    value: '15'
    unit: Ω
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0081_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A lamp's resistance changes as it heats up, so use the readings at the p.d. asked about.
  - rung: 2
    name: concept
    text:
      en: Resistance at a point on the graph is R = V ÷ I.
  - rung: 3
    name: first_step
    text:
      en: Use the point at 12 V only.
  - rung: 4
    name: worked_step
    text:
      en: Divide 12 V by 0.8 A.
  - rung: 5
    name: full_step
    text:
      en: R = 12 ÷ 0.8 = 15 Ω.
  misconception_ids:
  - mc.phy.o.iv_gradient_is_resistance
  - mc.phy.o.resistance_from_chord_slope
  - mc.phy.o.lamp_resistance_constant
solution:
  steps:
  - n: 1
    latex: R = \frac{V}{I} = \frac{12}{0.8} = 15\ \Omega
    reason: Use the readings at that point
    check_id: chk_build_phy_elq_0081_ans
