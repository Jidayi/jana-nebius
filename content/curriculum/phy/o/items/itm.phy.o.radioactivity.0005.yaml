id: itm.phy.o.radioactivity.0005
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.types_of_radiation
stem: A thick block of lead is placed between a gamma source and a counter.
parts:
- id: a
  prompt: What happens to the count rate from the source?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It falls to zero, because lead stops all gamma radiation
      correct: false
      misconception_id: mc.phy.o.gamma_stopped_completely
      feedback: Gamma rays pass through paper and aluminium almost unchanged. Thick lead or concrete reduces them a great deal but never to exactly zero.
    - id: B
      text: It falls a lot, but some gamma radiation still gets through
      correct: true
    - id: C
      text: It falls to zero, because gamma is the least penetrating radiation
      correct: false
      misconception_id: mc.phy.o.penetration_order_wrong
      feedback: Paper stops alpha; a few millimetres of aluminium stop beta; gamma is only reduced by thick lead or concrete.
    - id: D
      text: It does not change, because gamma rays are charged and bend around the lead
      correct: false
      misconception_id: mc.phy.o.gamma_deflected
      feedback: Only charged things are pushed sideways by electric and magnetic fields. Gamma rays carry no charge, so they go straight on.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Think about what each radiation is: its mass and its charge.'
  - rung: 2
    name: concept
    text:
      en: Alpha is heavy and doubly charged; beta is a light, charged electron; gamma is an uncharged wave.
  - rung: 3
    name: first_step
    text:
      en: Thick lead absorbs most gamma, but absorption of gamma is never complete.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that do not fit those properties.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It falls a lot, but some gamma radiation still gets through.'
  misconception_ids:
  - mc.phy.o.gamma_deflected
  - mc.phy.o.gamma_stopped_completely
  - mc.phy.o.penetration_order_wrong
solution:
  steps:
  - n: 1
    latex: \text{It falls a lot, but some gamma radiation still gets through}
    reason: Use the nature, charge and mass of each radiation
