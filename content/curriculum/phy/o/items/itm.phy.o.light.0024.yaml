stem: Red light passes from air into water.
parts:
- id: a
  prompt: Which property of the light stays the same?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Its frequency
      correct: true
    - id: B
      text: Its speed
      correct: false
      misconception_id: mc.phy.o.light_speed_times_index
      feedback: 'Nothing travels faster than light in a vacuum. A material slows light down, so divide c by the refractive index: the bigger n is, the slower the light.'
    - id: C
      text: Its wavelength
      correct: false
      misconception_id: mc.phy.o.light_colour_changes_in_glass
      feedback: Red light is still red inside a glass block. The source sets the frequency; at the boundary only the speed and the wavelength change.
    - id: D
      text: Its direction, whatever the angle of incidence
      correct: false
      misconception_id: mc.phy.o.refraction_along_normal_bends
      feedback: A ray along the normal slows down but both sides of the beam reach the glass together, so it carries straight on without bending.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what happens to the speed of light at the boundary.
  - rung: 2
    name: concept
    text:
      en: Light slows down entering a denser material and bends towards the normal; it speeds up leaving and bends away.
  - rung: 3
    name: first_step
    text:
      en: A ray along the normal goes straight on; a ray at an angle bends because one side slows before the other.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these rules.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Its frequency.'
  misconception_ids:
