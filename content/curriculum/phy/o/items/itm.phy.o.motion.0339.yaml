stem: A bus travels at 36 km/h.
parts:
- id: a
  prompt: What is this speed in metres per second?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 129.6 m/s
      correct: false
      misconception_id: mc.phy.o.kmh_conversion_inverted
      feedback: A speed in m/s is a smaller number than the same speed in km/h. Going from km/h to m/s, divide by 3.6.
    - id: B
      text: 1 m/s
      correct: false
      misconception_id: mc.phy.o.kmh_divide_by_36
      feedback: 'Check with 36 km/h: that is 36 000 m in 3600 s, which is 10 m/s, so the factor is 3.6.'
    - id: C
      text: 600 m/s
      correct: false
      misconception_id: mc.phy.o.kmh_minutes_for_hours
      feedback: An hour has sixty minutes and each minute sixty seconds, so an hour is 3600 seconds. That is why the factor is 3.6.
    - id: D
      text: 10 m/s
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Is a metre per second a bigger or a smaller speed than a kilometre per hour?
  - rung: 2
    name: concept
    text:
      en: A kilometre is a thousand metres and an hour is sixty times sixty seconds.
  - rung: 3
    name: first_step
    text:
      en: So 1 m/s is 3.6 km/h, and a speed in m/s is a smaller number than the same speed in km/h.
  - rung: 4
    name: worked_step
    text:
      en: Work out 36 ÷ 3.6.
  - rung: 5
    name: full_step
    text:
      en: 36 km/h = 10 m/s.
  misconception_ids:
  - mc.phy.o.kmh_conversion_inverted
  - mc.phy.o.kmh_divide_by_36
  - mc.phy.o.kmh_minutes_for_hours
solution:
  steps:
  - n: 1
