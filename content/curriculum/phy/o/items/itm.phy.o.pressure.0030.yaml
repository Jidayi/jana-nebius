id: itm.phy.o.pressure.0030
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.liquid_pressure
stem: At a depth of 40 cm in a tank of glycerine, the pressure due to the liquid is 4939.2 Pa. Take g = 9.8 N/kg.
parts:
- id: a
  prompt: Calculate the density of the glycerine.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 12300 kg/m³
      correct: false
      misconception_id: mc.phy.o.liquid_pressure_g_left_out
      feedback: 'The pressure comes from the weight of the liquid above, so g is needed: pressure = ρ × g × h. Without g the answer is not in pascals.'
    - id: B
      text: 12.6 kg/m³
      correct: false
      misconception_id: mc.phy.o.liquid_depth_cm_not_converted
      feedback: 'With the density in kg/m³ and g in N/kg, the depth must be in metres: divide centimetres by a hundred and millimetres by a thousand first.'
    - id: C
      text: 1260 kg/m³
      correct: true
    - id: D
      text: 19400 kg/m³
      correct: false
      misconception_id: mc.phy.o.pressure_rearranged_wrongly
      feedback: 'Force = pressure × area and area = force ÷ pressure; depth = pressure ÷ (ρg). Check with the units: Pa × m² gives N.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Pressure due to a liquid = density × g × depth.
  - rung: 2
    name: concept
    text:
      en: So density = pressure ÷ (g × depth).
  - rung: 3
    name: first_step
    text:
      en: Change 40 cm into metres first.
  - rung: 4
    name: worked_step
    text:
      en: Divide 4939.2 by 9.8 × 0.4.
  - rung: 5
    name: full_step
    text:
      en: The density of the glycerine is 1260 kg/m³.
  misconception_ids:
  - mc.phy.o.liquid_depth_cm_not_converted
  - mc.phy.o.liquid_pressure_g_left_out
  - mc.phy.o.pressure_rearranged_wrongly
solution:
  steps:
  - n: 1
    latex: h = 40\ \text{cm} = 0.4\ \text{m}
    reason: Depth in metres
    check_id: chk_build_phy_prs_0030_hm
  - n: 2
    latex: \rho = \frac{p}{gh} = \frac{4939.2}{9.8 \times 0.4} = 1260\ \text{kg/m}^3
    reason: Rearrange p = ρgh
    check_id: chk_build_phy_prs_0030_ans
