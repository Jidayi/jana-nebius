id: itm.phy.o.forces.0021
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.force_mass_acceleration
stem: The driving force on a car of total mass 1000 kg is 2500 N. The total resistive force on it is 500 N.
parts:
- id: a
  prompt: Find its acceleration.
  marks: 2
  answer:
    kind: numeric
    value: '2'
    unit: m/s^2
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_frc_0021_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which force goes into F = ma?
  - rung: 2
    name: concept
    text:
      en: F in F = ma is the resultant force, not the driving force.
  - rung: 3
    name: first_step
    text:
      en: Take the total resistive force from the driving force, then divide by the mass.
  - rung: 4
    name: worked_step
    text:
      en: The resultant force is 2000 N.
  - rung: 5
    name: full_step
    text:
      en: a = 2000 ÷ 1000 = 2 m/s².
  misconception_ids:
  - mc.phy.o.fma_applied_force_not_resultant
  - mc.phy.o.opposite_vectors_added
  - mc.phy.o.fma_ratio_inverted
solution:
  steps:
  - n: 1
    latex: F = 2500 - 500 = 2000\ \text{N}
    reason: The resultant force
    check_id: chk_build_phy_frc_0021_net
  - n: 2
    latex: a = \frac{F}{m} = \frac{2000}{1000} = 2\ \text{m/s}^2
    reason: a = F ÷ m
    check_id: chk_build_phy_frc_0021_ans
