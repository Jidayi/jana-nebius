kc_ids:
- kc.phy.o.electrical_quantities.resistance
stem: The p.d. across a motor coil is 24 V and the current through it is 200 mA.
parts:
- id: a
  prompt: Calculate its resistance.
  marks: 2
  answer:
    kind: numeric
    value: '120'
    unit: Ω
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0049_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Resistance tells you how many volts are needed for each amp.
  - rung: 2
    name: concept
    text:
      en: R = V ÷ I, with V in volts and I in amps.
  - rung: 3
    name: first_step
    text:
      en: Change the current into amps first.
  - rung: 4
    name: worked_step
    text:
      en: Divide 24 V by 0.2 A.
  - rung: 5
    name: full_step
    text:
      en: R = 24 ÷ 0.2 = 120 Ω.
  misconception_ids:
  - mc.phy.o.ohm_law_upside_down
  - mc.phy.o.ohm_law_multiplied
  - mc.phy.o.milliamps_used_as_amps
solution:
  steps:
  - n: 1
    latex: I = 200\ \text{mA} = 0.2\ \text{A}
    reason: A thousand mA in 1 A
    check_id: chk_build_phy_elq_0049_ia
  - n: 2
    latex: R = \frac{V}{I} = \frac{24}{0.2} = 120\ \Omega
    reason: Resistance = p.d. ÷ current
    check_id: chk_build_phy_elq_0049_ans
