id: itm.phy.o.light.0047
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.light.total_internal_reflection
stem: A ray of light inside flint glass (refractive index 1.62) meets the boundary with air at an angle of incidence of 30°.
parts:
- id: a
  prompt: What happens to the ray at the boundary?
  marks: 2
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It is totally internally reflected back into the material
      correct: false
      misconception_id: mc.phy.o.tir_angle_below_critical
      feedback: As the angle inside the glass grows, the ray in air bends closer to the surface. At the critical angle it runs along the surface; any bigger and no light gets out.
    - id: B
      text: It refracts out into the air, bending towards the normal
      correct: false
      misconception_id: mc.phy.o.refraction_bends_wrong_way
      feedback: Light slows down in glass and swings towards the normal; it speeds up again in air and swings away. Picture a car whose first wheel hits sand and slows.
    - id: C
      text: It passes out into the air without changing direction
      correct: false
      misconception_id: mc.phy.o.refraction_no_bending_at_angle
      feedback: When a beam meets a boundary at an angle, one side of it changes speed before the other, so the beam swings round. Only a ray along the normal goes straight on.
    - id: D
      text: It refracts out into the air, bending away from the normal
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Light is going from a denser material into air, so total internal reflection is possible.
  - rung: 2
    name: concept
    text:
      en: Find the critical angle from sin C = 1 ÷ n and compare the angle of incidence with it.
  - rung: 3
    name: first_step
    text:
      en: sin C = 1 ÷ 1.62 = 0.617.
  - rung: 4
    name: worked_step
    text:
      en: The critical angle is 38.1°; is 30° bigger or smaller?
  - rung: 5
    name: full_step
    text:
      en: '30° is smaller than 38.1°, so the answer is: It refracts out into the air, bending away from the normal.'
  misconception_ids:
  - mc.phy.o.refraction_bends_wrong_way
  - mc.phy.o.refraction_no_bending_at_angle
  - mc.phy.o.tir_angle_below_critical
solution:
  steps:
  - n: 1
    latex: \sin C = \frac{1}{1.62} = 0.617
    reason: sin C = 1 / n
    check_id: chk_build_phy_lgt_0047_sc
  - n: 2
    latex: C = 38.1^\circ
    reason: Inverse sine
    check_id: chk_build_phy_lgt_0047_cang
  - n: 3
    latex: 30^\circ < 38.1^\circ
    reason: Compare the angle of incidence with C
  - n: 4
    latex: \text{It refracts out into the air, bending away from the normal}
    reason: The critical angle checked with the optics tool
    check_id: chk_build_phy_lgt_0047_tool
