id: itm.phy.o.heat_transfer.0012
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.heat_transfer.conduction
stem: One end of a glass rod is heated, and energy is slowly conducted along it.
parts:
- id: a
  prompt: How is the energy passed along the glass?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Hotter particles vibrate more and pass vibrations to their neighbours
      correct: true
    - id: B
      text: Hot particles move along the glass to the cold end
      correct: false
      misconception_id: mc.phy.o.conduction_particles_travel
      feedback: In a solid the atoms stay in place and pass vibrations to their neighbours; in a metal, free electrons also carry energy. The material itself does not flow along.
    - id: C
      text: The particles grow larger and push on their neighbours
      correct: false
      misconception_id: mc.phy.o.particles_grow_when_heated
      feedback: A water particle is the same size in ice, in water and in steam. Heating makes particles move faster and spread further apart; it does not make them bigger.
    - id: D
      text: Cold particles move towards the heat
      correct: false
      misconception_id: mc.phy.o.cold_transferred_as_substance
      feedback: Only energy moves, always from hotter to colder. An ice pack does not send cold into you; energy flows out of you into the ice.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Conduction passes energy through a material without the material itself moving.
  - rung: 2
    name: concept
    text:
      en: In a solid, each particle stays near its own fixed position.
  - rung: 3
    name: first_step
    text:
      en: Remember that energy always flows from hotter to colder, and that nothing called 'cold' flows.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options where an insulator makes heat or where particles travel through a solid.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Hotter particles vibrate more and pass vibrations to their neighbours.'
  misconception_ids:
  - mc.phy.o.cold_transferred_as_substance
  - mc.phy.o.conduction_particles_travel
  - mc.phy.o.particles_grow_when_heated
solution:
  steps:
  - n: 1
    latex: \text{Hotter particles vibrate more and pass vibrations to their neighbours}
    reason: Apply the model of conduction
