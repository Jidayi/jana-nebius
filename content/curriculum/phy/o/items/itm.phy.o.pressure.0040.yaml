stem: Atmospheric pressure is 765 mm Hg. A mercury manometer joined to a gas cylinder has its mercury level at 185 mm in the open arm and at 150 mm in the arm joined to the cylinder.
parts:
- id: a
  prompt: Find the pressure of the gas, in mm Hg.
  marks: 2
  answer:
    kind: numeric
    value: '800'
    unit: mmHg
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_prs_0040_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: In mm Hg, a pressure is the height of mercury it can hold up.
  - rung: 2
    name: concept
    text:
      en: The side that pushes harder pushes its mercury level down.
  - rung: 3
    name: first_step
    text:
      en: The mercury is higher in the open arm, so the gas pressure is above atmospheric pressure.
  - rung: 4
    name: worked_step
    text:
      en: The levels differ by 35 mm; add this to 765.
  - rung: 5
    name: full_step
    text:
      en: The gas pressure is 800 mm Hg.
  misconception_ids:
  - mc.phy.o.manometer_excess_as_gas_pressure
  - mc.phy.o.manometer_difference_sign_wrong
  - mc.phy.o.manometer_one_level_used
solution:
  steps:
  - n: 1
    latex: \Delta h = 185 - 150 = 35\ \text{mm}
    reason: The difference in levels
    check_id: chk_build_phy_prs_0040_dh
  - n: 2
    latex: p = 765 + 35 = 800\ \text{mm Hg}
    reason: The gas pushes harder
    check_id: chk_build_phy_prs_0040_ans
