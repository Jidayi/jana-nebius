stem: The core of an electromagnet must lose its magnetism as soon as the current is switched off.
parts:
- id: a
  prompt: Which material should the core be made of?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Steel
      correct: false
      misconception_id: mc.phy.o.soft_iron_steel_swapped
      feedback: Soft iron is magnetised easily and loses it as easily, which suits an electromagnet's core. Steel is harder to magnetise but keeps it, which suits a permanent magnet.
    - id: B
      text: Soft iron
      correct: true
    - id: C
      text: Copper
      correct: false
      misconception_id: mc.phy.o.nonmagnetic_materials_attracted
      feedback: 'Hold a magnet near an aluminium can or a copper coin: nothing happens. Only iron, steel, nickel and cobalt are attracted.'
    - id: D
      text: Brass
      correct: false
      misconception_id: mc.phy.o.nonmagnetic_materials_attracted
      feedback: 'Hold a magnet near an aluminium can or a copper coin: nothing happens. Only iron, steel, nickel and cobalt are attracted.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Recall the two rules: how poles act on each other, and which materials are magnetic.'
  - rung: 2
    name: concept
    text:
      en: Like poles repel and unlike poles attract. Only a few metals are magnetic, and magnetic materials differ in how easily they gain and lose their magnetism.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: A temporary magnet needs a soft magnetic material, one that loses its magnetism easily.
  - rung: 5
    name: full_step
    text:
      en: Soft iron. A temporary magnet needs a soft magnetic material, one that loses its magnetism easily.
  misconception_ids:
