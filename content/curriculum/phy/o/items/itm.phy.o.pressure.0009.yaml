subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.pressure_on_surfaces
stem: The oil in a hydraulic jack is at a pressure of 1200 kPa, acting on an area of 0.005 m².
parts:
- id: a
  prompt: Calculate the force on that area, in newtons.
  marks: 2
  answer:
    kind: numeric
    value: '6000'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_prs_0009_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Pressure = force ÷ area, so force = pressure × area.
  - rung: 2
    name: concept
    text:
      en: Pascals times square metres gives newtons, so the pressure must be in pascals.
  - rung: 3
    name: first_step
    text:
      en: Change 1200 kPa into pascals first.
  - rung: 4
    name: worked_step
    text:
      en: The pressure is 1200000 Pa; multiply it by 0.005 m².
  - rung: 5
    name: full_step
    text:
      en: The force is 6000 N.
  misconception_ids:
  - mc.phy.o.pressure_kpa_not_converted
  - mc.phy.o.pressure_rearranged_wrongly
solution:
  steps:
  - n: 1
    latex: p = 1200\ \text{kPa} = 1200000\ \text{Pa}
    reason: Kilopascals into pascals
    check_id: chk_build_phy_prs_0009_pa
  - n: 2
    latex: F = pA = 1200000 \times 0.005 = 6000\ \text{N}
    reason: Force = pressure × area
    check_id: chk_build_phy_prs_0009_ans
