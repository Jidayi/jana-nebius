id: itm.phy.o.momentum.0019
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.momentum.conservation_of_momentum
stem: A 2 kg ball moving at 6 m/s hits a stationary 4 kg ball head-on. The first ball carries on in the same direction at 1 m/s.
parts:
- id: a
  prompt: Find the velocity of the second ball just after the collision.
  marks: 3
  answer:
    kind: numeric
    value: '2.5'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mom_0019_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Momentum before = momentum after.
  - rung: 2
    name: concept
    text:
      en: After the collision both balls may have momentum.
  - rung: 3
    name: first_step
    text:
      en: Take the first ball's momentum after from the total, then divide by the second ball's mass.
  - rung: 4
    name: worked_step
    text:
      en: 'Before: 12 kg m/s. The first ball keeps 2 kg m/s.'
  - rung: 5
    name: full_step
    text:
      en: v = 2.5 m/s in the original direction.
  misconception_ids:
  - mc.phy.o.equation_missing_known
solution:
  steps:
  - n: 1
    latex: p_\text{before} = 2 \times 6 = 12\ \text{kg m/s}
    reason: Only the first ball moves
    check_id: chk_build_phy_mom_0019_pb
  - n: 2
    latex: 12 = 2 \times 1 + 4v = 2 + 4v
    reason: Momentum is conserved
    check_id: chk_build_phy_mom_0019_pa
  - n: 3
    latex: v = \frac{12 - 2}{4} = 2.5\ \text{m/s}
    reason: Solve for v
    check_id: chk_build_phy_mom_0019_ans
