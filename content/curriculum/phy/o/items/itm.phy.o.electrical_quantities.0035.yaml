id: itm.phy.o.electrical_quantities.0035
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.potential_difference
stem: A lamp with a p.d. of 1.5 V across it carries a current of 0.2 A for 3 minutes.
parts:
- id: a
  prompt: Calculate the energy transferred to the lamp.
  marks: 3
  answer:
    kind: numeric
    value: '54'
    unit: J
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0035_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The p.d. is the energy transferred to each coulomb that passes.
  - rung: 2
    name: concept
    text:
      en: So find the charge first (Q = I t), then use W = Q V.
  - rung: 3
    name: first_step
    text:
      en: Change the time into seconds before you find the charge.
  - rung: 4
    name: worked_step
    text:
      en: The charge is 36 C; multiply it by 1.5 V.
  - rung: 5
    name: full_step
    text:
      en: W = 36 × 1.5 = 54 J.
  misconception_ids:
  - mc.phy.o.energy_time_left_out
  - mc.phy.o.minutes_used_as_seconds
  - mc.phy.o.w_qv_divided
solution:
  steps:
  - n: 1
    latex: t = 3\ \text{min} = 180\ \text{s}
    reason: Sixty seconds in each minute
    check_id: chk_build_phy_elq_0035_ts
  - n: 2
    latex: Q = I t = 0.2 \times 180 = 36\ \text{C}
    reason: The charge that flows
    check_id: chk_build_phy_elq_0035_q
  - n: 3
    latex: W = Q V = 36 \times 1.5 = 54\ \text{J}
    reason: Energy = charge × p.d.
    check_id: chk_build_phy_elq_0035_ans
