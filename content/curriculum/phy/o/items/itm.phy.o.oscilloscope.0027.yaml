id: itm.phy.o.oscilloscope.0027
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.oscilloscope.y_gain
stem: The Y-gain of an oscilloscope is set to 10 V/div. The trace measures 8 divisions from the top of a crest to the bottom of a trough.
parts:
- id: a
  prompt: Find the peak voltage of the signal.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 80 V
      correct: false
      misconception_id: mc.phy.o.osc_peak_and_peak_to_peak_confused
      feedback: The peak voltage is measured from the centre line to a crest; peak-to-peak is crest to trough, twice as big.
    - id: B
      text: 0.4 V
      correct: false
      misconception_id: mc.phy.o.osc_ygain_divided
      feedback: The Y-gain says how many volts each division stands for, so voltage = divisions × volts per division.
    - id: C
      text: 4 V
      correct: false
      misconception_id: mc.phy.o.osc_divisions_as_volts
      feedback: Each division stands for the Y-gain voltage. Multiply the number of divisions by the volts per division.
    - id: D
      text: 40 V
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Crest to trough is twice the height of a crest above the centre line.
  - rung: 2
    name: concept
    text:
      en: The Y-gain gives the voltage for each vertical division.
  - rung: 3
    name: first_step
    text:
      en: Multiply 8 divisions by 10 V/div to get the peak-to-peak voltage.
  - rung: 4
    name: worked_step
    text:
      en: The peak-to-peak voltage is 80 V; the peak voltage is half of it.
  - rung: 5
    name: full_step
    text:
      en: The peak voltage is 40 V.
  misconception_ids:
  - mc.phy.o.osc_divisions_as_volts
  - mc.phy.o.osc_peak_and_peak_to_peak_confused
  - mc.phy.o.osc_ygain_divided
solution:
  steps:
  - n: 1
    latex: V_{pp} = 8 \times 10 = 80\ \text{V}
    reason: Crest to trough is peak-to-peak
    check_id: chk_build_phy_osc_0027_pp
  - n: 2
    latex: V_0 = \frac{80}{2} = 40\ \text{V}
    reason: The peak is half the peak-to-peak
    check_id: chk_build_phy_osc_0027_ans
