stem: Yaw winds a coil on an iron nail and counts the paper clips it lifts, keeping the current the same. With 10 turns it lifts 6 clips, and with 30 turns it lifts 18 clips.
parts:
- id: a
  prompt: Assuming the number of clips is proportional to the number of turns, predict the number lifted with 45 turns.
  marks: 2
  answer:
    kind: numeric
    value: '27'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_emg_0001_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: More turns make a stronger electromagnet.
  - rung: 2
    name: concept
    text:
      en: 'The data show the clips going up in step with the turns: twice the turns, twice the clips.'
  - rung: 3
    name: first_step
    text:
      en: Find the number of clips for each turn.
  - rung: 4
    name: worked_step
    text:
      en: Work out 6 ÷ 10, then multiply by 45.
  - rung: 5
    name: full_step
    text:
      en: 0.6 clips per turn × 45 turns = 27 clips.
solution:
  steps:
  - n: 1
    latex: \frac{6}{10} = 0.6\ \text{clips per turn}
    reason: Clips for each turn
    check_id: chk_build_phy_emg_0001_per
  - n: 2
    latex: 0.6 \times 45 = 27\ \text{clips}
