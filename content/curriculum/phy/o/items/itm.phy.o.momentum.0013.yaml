id: itm.phy.o.momentum.0013
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.momentum.momentum_calculation
stem: A footballer of mass 75 kg runs west at 4 m/s. Take east as the positive direction.
parts:
- id: a
  prompt: Find the momentum, giving its sign.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 300 kg m/s
      correct: false
      misconception_id: mc.phy.o.momentum_sign_ignored
      feedback: Momentum is a vector. Choose a positive direction; anything moving the other way has a negative velocity, so its momentum is negative too.
    - id: B
      text: -300 kg m/s
      correct: true
    - id: C
      text: 600 kg m/s
      correct: false
      misconception_id: mc.phy.o.momentum_as_kinetic_energy
      feedback: 'Momentum is mass × velocity, in kg m/s. Half m v squared is kinetic energy, in joules: a different quantity.'
    - id: D
      text: -18.75 kg m/s
      correct: false
      misconception_id: mc.phy.o.momentum_ratio_inverted
      feedback: A 2 kg ball at 3 m/s has momentum 6 kg m/s. Momentum grows with both mass and velocity, so multiply them; to find a velocity, divide the momentum by the mass.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Momentum is a vector, so its sign shows its direction.
  - rung: 2
    name: concept
    text:
      en: Momentum = mass × velocity.
  - rung: 3
    name: first_step
    text:
      en: The object moves opposite to east, so its velocity is negative.
  - rung: 4
    name: worked_step
    text:
      en: Work out 75 × (−4).
  - rung: 5
    name: full_step
    text:
      en: p = -300 kg m/s; the minus sign shows it is against the positive direction.
  misconception_ids:
  - mc.phy.o.momentum_as_kinetic_energy
  - mc.phy.o.momentum_ratio_inverted
  - mc.phy.o.momentum_sign_ignored
solution:
  steps:
  - n: 1
    latex: v = -\,4\ \text{m/s}
    reason: Moving against the positive (east) direction
  - n: 2
    latex: p = mv = 75 \times (-\,4) = -300\ \text{kg m/s}
    reason: Momentum = mass × velocity
    check_id: chk_build_phy_mom_0013_ans
