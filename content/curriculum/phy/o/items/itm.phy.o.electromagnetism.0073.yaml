id: itm.phy.o.electromagnetism.0073
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.electromagnetism.power_transmission
stem: The ideal transformer in a laptop adapter takes a current of 0.6 A from the 230 V mains and gives an output of 20 V.
parts:
- id: a
  prompt: Calculate the current in the secondary coil.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 0.0522 A
      correct: false
      misconception_id: mc.phy.o.secondary_current_rises_with_voltage
      feedback: Power is p.d. × current and an ideal transformer keeps the power the same. Double the voltage and the current halves.
    - id: B
      text: 6.9 A
      correct: true
    - id: C
      text: 0.6 A
      correct: false
      misconception_id: mc.phy.o.transformer_current_unchanged
      feedback: For an ideal transformer Vp × Ip = Vs × Is. If the voltage changes, the current must change the other way.
    - id: D
      text: 0.145 A
      correct: false
      misconception_id: mc.phy.o.transmission_current_upside_down
      feedback: Power = p.d. × current, so current = power ÷ p.d.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: An ideal transformer wastes no energy.
  - rung: 2
    name: concept
    text:
      en: 'So the power in equals the power out: Vp × Ip = Vs × Is.'
  - rung: 3
    name: first_step
    text:
      en: Find the power in first.
  - rung: 4
    name: worked_step
    text:
      en: The power in is 138 W; divide it by 20 V.
  - rung: 5
    name: full_step
    text:
      en: Is = 138 ÷ 20 = 6.9 A.
  misconception_ids:
  - mc.phy.o.secondary_current_rises_with_voltage
  - mc.phy.o.transformer_current_unchanged
  - mc.phy.o.transmission_current_upside_down
solution:
  steps:
  - n: 1
    latex: V_p I_p = 230 \times 0.6 = 138\ \text{W}
    reason: The power in
    check_id: chk_build_phy_emg_0073_p
  - n: 2
    latex: I_s = \frac{138}{20} = 6.9\ \text{A}
    reason: Power out = power in
    check_id: chk_build_phy_emg_0073_ans
