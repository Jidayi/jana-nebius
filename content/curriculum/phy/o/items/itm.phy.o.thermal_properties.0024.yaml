id: itm.phy.o.thermal_properties.0024
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.specific_heat_capacity
stem: 2 kg of cooking oil at 18 °C takes in 25 kJ of energy. The specific heat capacity of cooking oil is 2000 J/(kg °C).
parts:
- id: a
  prompt: Find its final temperature.
  marks: 3
  answer:
    kind: numeric
    value: '24.25'
    unit: °C
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_thp_0024_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: E = mcΔθ gives the temperature rise, not the final temperature.
  - rung: 2
    name: concept
    text:
      en: Rearrange to Δθ = E ÷ (mc), with E in joules.
  - rung: 3
    name: first_step
    text:
      en: Change 25 kJ to joules first.
  - rung: 4
    name: worked_step
    text:
      en: The rise is 6.25 °C; add it to the starting 18 °C.
  - rung: 5
    name: full_step
    text:
      en: The final temperature is 24.25 °C.
  misconception_ids:
  - mc.phy.o.shc_rise_given_as_final
solution:
  steps:
  - n: 1
    latex: E = 25\ \text{kJ} = 25000\ \text{J}
    reason: Joules, to match c
    check_id: chk_build_phy_thp_0024_ej
  - n: 2
    latex: \Delta\theta = \frac{E}{mc} = \frac{25000}{2 \times 2000} = 6.25\ ^\circ\text{C}
    reason: Rearrange E = mcΔθ
    check_id: chk_build_phy_thp_0024_rise
  - n: 3
    latex: \theta = 18 + 6.25 = 24.25\ ^\circ\text{C}
    reason: Add the rise to the start
    check_id: chk_build_phy_thp_0024_ans
