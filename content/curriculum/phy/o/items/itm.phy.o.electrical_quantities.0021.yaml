stem: A car's starter motor takes a current of 120 A.
parts:
- id: a
  prompt: How long does it take for 240 C of charge to flow through it, in seconds?
  marks: 2
  answer:
    kind: numeric
    value: '2'
    unit: s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0021_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Each second, the current carries a fixed amount of charge.
  - rung: 2
    name: concept
    text:
      en: From Q = I t, the time is t = Q ÷ I.
  - rung: 3
    name: first_step
    text:
      en: The current is already in amps.
  - rung: 4
    name: worked_step
    text:
      en: Divide 240 C by 120 A.
  - rung: 5
    name: full_step
    text:
      en: t = 240 ÷ 120 = 2 s.
  misconception_ids:
  - mc.phy.o.q_it_multiplied
  - mc.phy.o.q_it_upside_down
solution:
  steps:
  - n: 1
    latex: t = \frac{Q}{I} = \frac{240}{120} = 2\ \text{s}
    reason: Rearrange Q = It
    check_id: chk_build_phy_elq_0021_ans
