id: itm.phy.o.atom.0013
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.atom.atomic_structure
stem: A nucleus has nucleon number 127 and contains 74 neutrons.
parts:
- id: a
  prompt: How many protons does this nucleus contain?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '127'
      correct: false
      misconception_id: mc.phy.o.nucleon_proton_numbers_swapped
      feedback: The top number is the nucleon number (protons plus neutrons) and is always the bigger one; the bottom number is the proton number.
    - id: B
      text: '53'
      correct: true
    - id: C
      text: '74'
      correct: false
      misconception_id: mc.phy.o.protons_neutrons_assumed_equal
      feedback: Only some light nuclei have equal numbers. Uranium-238 has 92 protons but 146 neutrons. Work the neutrons out from the nucleon number.
    - id: D
      text: '201'
      correct: false
      misconception_id: mc.phy.o.nuclide_numbers_added
      feedback: The nucleon number already includes the protons. To find the part that is neutrons (or protons), subtract.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The nucleon number counts every particle in the nucleus.
  - rung: 2
    name: concept
    text:
      en: Those particles are protons and neutrons.
  - rung: 3
    name: first_step
    text:
      en: Take the neutrons away from the nucleon number to leave the protons.
  - rung: 4
    name: worked_step
    text:
      en: Work out 127 − 74.
  - rung: 5
    name: full_step
    text:
      en: The proton number is 53, so the nucleus is iodine.
  misconception_ids:
  - mc.phy.o.nucleon_proton_numbers_swapped
  - mc.phy.o.nuclide_numbers_added
  - mc.phy.o.protons_neutrons_assumed_equal
