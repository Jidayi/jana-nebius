stem: Two identical cans start with hot water at 90 °C, one painted dull black and one shiny silver. After 10 minutes the black can is at 70 °C and the shiny can at 80 °C.
parts:
- id: a
  prompt: Find the average rate of cooling of the black can, in °C per minute.
  marks: 2
  answer:
    kind: numeric
    value: '2'
    unit: °C/min
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_htr_0031_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The black can is the better emitter of infrared, so it cools faster.
  - rung: 2
    name: concept
    text:
      en: Average rate of cooling = fall in temperature ÷ time taken.
  - rung: 3
    name: first_step
    text:
      en: Find the fall from 90 °C to 70 °C.
  - rung: 4
    name: worked_step
    text:
      en: Divide 20 °C by 10 minutes.
  - rung: 5
    name: full_step
    text:
      en: The black can cools at 2 °C per minute.
solution:
  steps:
  - n: 1
    latex: 90 - 70 = 20\ ^\circ\text{C}
    reason: Fall in temperature
    check_id: chk_build_phy_htr_0031_drop
  - n: 2
    latex: \frac{20}{10} = 2\ ^\circ\text{C/min}
    reason: Fall ÷ time
    check_id: chk_build_phy_htr_0031_ans
