stem: A loudspeaker cone moves quickly forwards into the air in front of it.
parts:
- id: a
  prompt: What does this make in the air just in front of the cone?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: A rarefaction
      correct: false
      misconception_id: mc.phy.o.compression_rarefaction_swapped
      feedback: 'Compressed means squeezed: particles closer together than normal. A rarefaction is the thinned-out region where they are further apart.'
    - id: B
      text: A crest
      correct: false
      misconception_id: mc.phy.o.sound_called_transverse
      feedback: 'Sound is longitudinal: the particles move back and forth along the direction the sound travels, making compressions and rarefactions.'
    - id: C
      text: A small region of vacuum
      correct: false
      misconception_id: mc.phy.o.rarefaction_is_empty
      feedback: A rarefaction still has air in it; the particles are just a little further apart than normal.
    - id: D
      text: A compression
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture the cone pushing on the air next to it.
  - rung: 2
    name: concept
    text:
      en: The air particles in front of the cone are pushed closer together.
  - rung: 3
    name: first_step
    text:
      en: Crests and troughs belong to transverse waves.
  - rung: 4
    name: worked_step
    text:
      en: Pick the name for a squeezed region.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: A compression.'
  misconception_ids:
