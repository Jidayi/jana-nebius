stem: In the electromagnetic spectrum, one region sits next to radio waves.
parts:
- id: a
  prompt: Which region is it?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Microwaves
      correct: true
    - id: B
      text: Gamma rays
      correct: false
      misconception_id: mc.phy.o.em_order_reversed
      feedback: Radio waves have the longest wavelength and the lowest frequency; gamma rays have the shortest wavelength and the highest frequency.
    - id: C
      text: Infrared
      correct: false
      misconception_id: mc.phy.o.em_end_regions_mixed
      feedback: 'Learn the full order from longest wavelength: radio, microwaves, infrared, visible, ultraviolet, X-rays, gamma rays.'
    - id: D
      text: Ultraviolet
      correct: false
      misconception_id: mc.phy.o.infrared_ultraviolet_swapped
      feedback: 'Infra means below: infrared is beyond red, with longer waves that heat things. Ultra means beyond: ultraviolet is beyond violet, with shorter waves that damage skin.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Radio waves are at one end of the spectrum.
  - rung: 2
    name: concept
    text:
      en: Work inwards from the long-wavelength end.
  - rung: 3
    name: first_step
    text:
      en: The region you want is used in ovens and mobile phones.
  - rung: 4
    name: worked_step
    text:
      en: Pick the region with the next-longest wavelength.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Microwaves.'
  misconception_ids:
