id: itm.phy.o.forces.0048
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.friction_and_terminal_velocity
stem: A skydiver falling at terminal velocity opens her parachute.
parts:
- id: a
  prompt: What happens straight after it opens?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: She slows down, still moving downwards
      correct: true
    - id: B
      text: She moves upwards for a moment
      correct: false
      misconception_id: mc.phy.o.parachute_sends_upwards
      feedback: A resultant force upwards on a falling skydiver slows the fall; it does not reverse it. The skydiver keeps falling, more slowly, until the forces balance again.
    - id: C
      text: She carries on at the same speed, because terminal velocity cannot change
      correct: false
      misconception_id: mc.phy.o.terminal_velocity_fixed
      feedback: Terminal velocity is the speed at which drag balances weight. Change the drag, by opening a parachute or changing shape, and the balance happens at a different speed.
    - id: D
      text: She falls faster, because the resultant force points the way she moves
      correct: false
      misconception_id: mc.phy.o.resultant_along_motion
      feedback: The resultant force points the way the velocity is changing. A car that is slowing down has a resultant force pointing backwards.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about which forces act and how big each one is at this moment.
  - rung: 2
    name: concept
    text:
      en: Friction and air resistance act against the motion, and air resistance grows as the speed grows.
  - rung: 3
    name: first_step
    text:
      en: Work out whether the forces are balanced and what that does to the speed.
  - rung: 4
    name: worked_step
    text:
      en: The open parachute greatly increases the air resistance.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: She slows down, still moving downwards. The drag is now bigger than her weight, so the resultant force is upwards and she decelerates, but she keeps falling.'
  misconception_ids:
  - mc.phy.o.parachute_sends_upwards
  - mc.phy.o.resultant_along_motion
  - mc.phy.o.terminal_velocity_fixed
solution:
  steps:
  - n: 1
    latex: \text{She slows down, still moving downwards}
    reason: Compare the forces and how they change
