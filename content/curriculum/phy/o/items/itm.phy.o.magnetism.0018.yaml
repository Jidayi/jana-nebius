id: itm.phy.o.magnetism.0018
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.magnetism.magnetic_fields
stem: A compass is placed above the middle of a bar magnet, well clear of both poles.
parts:
- id: a
  prompt: Which way does its needle's north end point?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Parallel to the magnet, towards the north pole
      correct: false
      misconception_id: mc.phy.o.compass_points_at_like_pole
      feedback: 'The compass needle is a small magnet: its north end is pushed away from a north pole and pulled towards a south pole.'
    - id: B
      text: Straight down at the middle, where the field is strongest
      correct: false
      misconception_id: mc.phy.o.field_strongest_at_middle
      feedback: Iron filings pile up at the ends of a bar magnet and hardly at all at its middle. The field is strongest at the poles.
    - id: C
      text: Parallel to the magnet, towards the south pole
      correct: true
    - id: D
      text: Anywhere, as no field line is drawn through that point
      correct: false
      misconception_id: mc.phy.o.field_only_on_drawn_lines
      feedback: A compass placed between two drawn lines still turns. The lines show the field's direction and strength; the field is everywhere near the magnet.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture a small plotting compass placed at that point near the magnet.
  - rung: 2
    name: concept
    text:
      en: Field lines run from north to south outside a magnet, never cross, and are closest where the field is strongest, at the poles.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Beside the middle, the field runs parallel to the magnet from the north end towards the south end.
  - rung: 5
    name: full_step
    text:
      en: Parallel to the magnet, towards the south pole. Beside the middle, the field runs parallel to the magnet from the north end towards the south end.
  misconception_ids:
  - mc.phy.o.compass_points_at_like_pole
  - mc.phy.o.field_only_on_drawn_lines
  - mc.phy.o.field_strongest_at_middle
