stem: Liquid ethanol has a density of 740 kg/m³, and ethanol vapour at 78 °C has a density of 1.6 kg/m³.
parts:
- id: a
  prompt: For the same mass, how many times larger is the volume of the gas than the volume of the liquid?
  marks: 2
  answer:
    kind: numeric
    value: '462.5'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_ptc_0001_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The same particles are present in both states; only their spacing changes.
  - rung: 2
    name: concept
    text:
      en: Volume = mass ÷ density, so for the same mass the less dense state takes up more room.
  - rung: 3
    name: first_step
    text:
      en: The volume ratio is the density of the liquid divided by the density of the gas.
  - rung: 4
    name: worked_step
    text:
      en: Work out 740 ÷ 1.6.
  - rung: 5
    name: full_step
    text:
      en: The gas takes up 462.5 times the volume of the liquid.
solution:
  steps:
  - n: 1
    latex: \frac{V_{gas}}{V_{liquid}} = \frac{\rho_{liquid}}{\rho_{gas}} = \frac{740}{1.6} = 462.5
    reason: For a fixed mass, volume is inversely proportional to density
    check_id: chk_build_phy_ptc_0001_ans
