id: itm.phy.o.electrical_quantities.0027
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.current_and_charge
stem: A charge of 900 C flows through a phone charger in 30 minutes.
parts:
- id: a
  prompt: Calculate the current, in amps.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 1620000 A
      correct: false
      misconception_id: mc.phy.o.q_it_multiplied
      feedback: If 10 C flow in 5 s, each second carries 2 C, not 50 C. Divide the charge by the time to get the current.
    - id: B
      text: 2 A
      correct: false
      misconception_id: mc.phy.o.q_it_upside_down
      feedback: From Q = It, divide both sides by t to get I = Q/t, or by I to get t = Q/I. The charge stays on top.
    - id: C
      text: 30 A
      correct: false
      misconception_id: mc.phy.o.minutes_used_as_seconds
      feedback: 'An amp is a coulomb per second, so the time must be in seconds: multiply minutes by sixty first.'
    - id: D
      text: 0.5 A
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Current is the rate at which charge flows.
  - rung: 2
    name: concept
    text:
      en: From Q = I t, the current is I = Q ÷ t.
  - rung: 3
    name: first_step
    text:
      en: First change the time into seconds.
  - rung: 4
    name: worked_step
    text:
      en: Divide 900 C by 1800 s.
  - rung: 5
    name: full_step
    text:
      en: I = 900 ÷ 1800 = 0.5 A.
  misconception_ids:
  - mc.phy.o.minutes_used_as_seconds
  - mc.phy.o.q_it_multiplied
  - mc.phy.o.q_it_upside_down
solution:
  steps:
  - n: 1
    latex: t = 30\ \text{min} = 1800\ \text{s}
    reason: Sixty seconds in each minute
    check_id: chk_build_phy_elq_0027_ts
  - n: 2
    latex: I = \frac{Q}{t} = \frac{900}{1800} = 0.5\ \text{A}
    reason: Rearrange Q = It
    check_id: chk_build_phy_elq_0027_ans
