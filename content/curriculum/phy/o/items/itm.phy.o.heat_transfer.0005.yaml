id: itm.phy.o.heat_transfer.0005
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.heat_transfer.conduction
stem: A metal spoon and a wooden spoon are left standing in a pot of hot soup.
parts:
- id: a
  prompt: Why does the metal spoon's handle get hot first?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Hot soup particles climb up the metal spoon
      correct: false
      misconception_id: mc.phy.o.conduction_particles_travel
      feedback: In a solid the atoms stay in place and pass vibrations to their neighbours; in a metal, free electrons also carry energy. The material itself does not flow along.
    - id: B
      text: Metal is a much better thermal conductor than wood
      correct: true
    - id: C
      text: The metal spoon was warmer to begin with
      correct: false
      misconception_id: mc.phy.o.metal_feels_colder_because_colder
      feedback: Objects left in the same room reach the same temperature. Metal feels colder because it conducts energy away from your hand much faster.
    - id: D
      text: The wooden spoon gives out cold that keeps it cool
      correct: false
      misconception_id: mc.phy.o.cold_transferred_as_substance
      feedback: Only energy moves, always from hotter to colder. An ice pack does not send cold into you; energy flows out of you into the ice.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Conduction passes energy through a material without the material itself moving.
  - rung: 2
    name: concept
    text:
      en: Both spoons are heated at the bottom by the same soup.
  - rung: 3
    name: first_step
    text:
      en: Remember that energy always flows from hotter to colder, and that nothing called 'cold' flows.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options where an insulator makes heat or where particles travel through a solid.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Metal is a much better thermal conductor than wood.'
  misconception_ids:
  - mc.phy.o.cold_transferred_as_substance
  - mc.phy.o.conduction_particles_travel
  - mc.phy.o.metal_feels_colder_because_colder
