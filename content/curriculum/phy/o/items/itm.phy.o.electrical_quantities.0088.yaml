stem: A diode is connected the wrong way round in series with a lamp and a cell.
parts:
- id: a
  prompt: What happens to the lamp?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It stays off, because almost no current flows
      correct: true
    - id: B
      text: It lights normally, because a diode conducts either way
      correct: false
      misconception_id: mc.phy.o.diode_conducts_both_ways
      feedback: 'A diode''s I-V graph is flat along the p.d. axis for reverse p.d.: almost no current flows the wrong way.'
    - id: C
      text: It lights a little more dimly than usual
      correct: false
      misconception_id: mc.phy.o.diode_conducts_both_ways
      feedback: 'A diode''s I-V graph is flat along the p.d. axis for reverse p.d.: almost no current flows the wrong way.'
    - id: D
      text: It lights normally, and the diode's resistance falls as it warms up
      correct: false
      misconception_id: mc.phy.o.lamp_resistance_falls_when_hot
      feedback: A hot metal's ions vibrate more and get in the electrons' way, so a filament's resistance rises as it heats up.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Look at how the current changes as the p.d. changes, and what that says about R = V/I.
  - rung: 2
    name: concept
    text:
      en: A fixed resistor gives a straight line through the origin; a line that bends shows a resistance that changes; some components conduct in one direction only.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Reversed, the diode's resistance is very high, so it blocks the current.
  - rung: 5
    name: full_step
    text:
      en: It stays off, because almost no current flows. Reversed, the diode's resistance is very high, so it blocks the current.
  misconception_ids:
  - mc.phy.o.diode_conducts_both_ways
  - mc.phy.o.lamp_resistance_falls_when_hot
