stem: A nucleus emits gamma radiation.
parts:
- id: a
  prompt: What is gamma radiation?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: A small particle with a negative charge
      correct: false
      misconception_id: mc.phy.o.gamma_is_particle
      feedback: 'Gamma rays are electromagnetic waves, like X-rays: no mass and no charge.'
    - id: B
      text: A stream of particles that magnets bend strongly
      correct: false
      misconception_id: mc.phy.o.gamma_deflected
      feedback: Only charged things are pushed sideways by electric and magnetic fields. Gamma rays carry no charge, so they go straight on.
    - id: C
      text: Two protons and two neutrons
      correct: false
      misconception_id: mc.phy.o.radiation_natures_swapped
      feedback: 'Alpha: two protons and two neutrons. Beta: a fast electron from the nucleus. Gamma: an electromagnetic wave.'
    - id: D
      text: An electromagnetic wave given out by a nucleus
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Think about what each radiation is: its mass and its charge.'
  - rung: 2
    name: concept
    text:
      en: Alpha is heavy and doubly charged; beta is a light, charged electron; gamma is an uncharged wave.
  - rung: 3
    name: first_step
    text:
      en: Gamma rays belong to the same family as X-rays and light.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that do not fit those properties.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: An electromagnetic wave given out by a nucleus.'
  misconception_ids:
  - mc.phy.o.gamma_deflected
  - mc.phy.o.gamma_is_particle
  - mc.phy.o.radiation_natures_swapped
