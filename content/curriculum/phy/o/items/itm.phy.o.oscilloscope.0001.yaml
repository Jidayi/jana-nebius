stem: An oscilloscope's time-base is set to 0.2 ms/div. On the trace, the distance from one crest to the next is 4 divisions.
parts:
- id: a
  prompt: Find the period of the signal in milliseconds.
  marks: 2
  answer:
    kind: numeric
    value: '0.8'
    unit: ms
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_osc_0001_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The period is the time for one complete wave, from a crest to the next crest.
  - rung: 2
    name: concept
    text:
      en: The time-base gives the time for each horizontal division.
  - rung: 3
    name: first_step
    text:
      en: Find how many divisions one complete wave takes.
  - rung: 4
    name: worked_step
    text:
      en: Multiply that number of divisions by 0.2 ms.
  - rung: 5
    name: full_step
    text:
      en: The period is 0.8 ms.
  misconception_ids:
  - mc.phy.o.osc_timebase_divided
  - mc.phy.o.osc_divisions_as_time
  - mc.phy.o.osc_frequency_period_confused
solution:
  steps:
  - n: 1
    latex: T = 4 \times 0.2 = 0.8\ \text{ms}
    reason: Divisions for one wave times the time-base
    check_id: chk_build_phy_osc_0001_ans
