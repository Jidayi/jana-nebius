stem: 'A nucleus is written ⁴¹₁₉K: the top number is 41 and the bottom number is 19.'
parts:
- id: a
  prompt: How many neutrons are in the nucleus?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: '22'
      correct: true
    - id: B
      text: '41'
      correct: false
      misconception_id: mc.phy.o.neutrons_equal_nucleon_number
      feedback: 'The nucleon number counts every particle in the nucleus: protons and neutrons together. Take away the proton number to leave the neutrons.'
    - id: C
      text: '19'
      correct: false
      misconception_id: mc.phy.o.protons_neutrons_assumed_equal
      feedback: Only some light nuclei have equal numbers. Uranium-238 has 92 protons but 146 neutrons. Work the neutrons out from the nucleon number.
    - id: D
      text: '60'
      correct: false
      misconception_id: mc.phy.o.nuclide_numbers_added
      feedback: The nucleon number already includes the protons. To find the part that is neutrons (or protons), subtract.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The nucleus is made of protons and neutrons; together they are called nucleons.
  - rung: 2
    name: concept
    text:
      en: The top number is the nucleon number; the bottom number is the proton number.
  - rung: 3
    name: first_step
    text:
      en: The nucleon number counts protons and neutrons together, so neutrons = nucleon number − proton number.
  - rung: 4
    name: worked_step
    text:
      en: Work out 41 − 19.
  - rung: 5
    name: full_step
    text:
      en: 'Number of neutrons in the nucleus: 22.'
  misconception_ids:
  - mc.phy.o.neutrons_equal_nucleon_number
  - mc.phy.o.nuclide_numbers_added
  - mc.phy.o.protons_neutrons_assumed_equal
solution:
  steps:
  - n: 1
    latex: '{}^{41}_{19}\text{K}:\ A = 41,\ Z = 19'
    reason: Nucleon number on top, proton number below
  - n: 2
    latex: N = A - Z = 41 - 19 = 22
    reason: The nucleons that are not protons are neutrons
    check_id: chk_build_phy_atm_0012_ans
