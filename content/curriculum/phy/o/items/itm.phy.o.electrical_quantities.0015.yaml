id: itm.phy.o.electrical_quantities.0015
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.electric_charge
stem: A polythene rod rubbed with a woollen cloth gains 2.5 × 10¹⁰ electrons. The charge on one electron is −1.6 × 10⁻¹⁹ C.
parts:
- id: a
  prompt: Find the charge on the polythene rod, in nC, with its sign.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 4 nC
      correct: false
      misconception_id: mc.phy.o.electron_gain_sign_reversed
      feedback: Electrons are negative. Gaining them makes an object negative; losing them leaves it positive.
    - id: B
      text: -1.56 × 10^38 nC
      correct: false
      misconception_id: mc.phy.o.electron_count_divided_by_e
      feedback: Each electron carries a tiny charge; ten electrons carry ten times as much. Charge = number of electrons × the charge on one.
    - id: C
      text: -4.00 × 10^-18 nC
      correct: false
      misconception_id: mc.phy.o.prefix_multiply_divide_swapped
      feedback: A milliamp is much smaller than an amp, so a current in milliamps becomes a smaller number of amps. Ask whether the new unit is bigger or smaller before you multiply or divide.
    - id: D
      text: -4 nC
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Each electron gained adds the same small negative charge.
  - rung: 2
    name: concept
    text:
      en: Charge = number of electrons × the charge on one electron.
  - rung: 3
    name: first_step
    text:
      en: Gaining electrons makes the object negative.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 2.5 × 10¹⁰ by 1.6 × 10⁻¹⁹ C, then write the result in nanocoulombs.
  - rung: 5
    name: full_step
    text:
      en: The polythene rod has a charge of -4 nC.
  misconception_ids:
  - mc.phy.o.electron_count_divided_by_e
  - mc.phy.o.electron_gain_sign_reversed
  - mc.phy.o.prefix_multiply_divide_swapped
solution:
  steps:
  - n: 1
    latex: Q = n \times e = 2.5 \times 10^{10} \times (-\,1.6 \times 10^{-19})\ \text{C}
    reason: Charge = number of electrons × charge on one
  - n: 2
    latex: Q = -4\ \text{nC}
    reason: 1 nC is 10^{-9} C
    check_id: chk_build_phy_elq_0015_ans
