  - mc.phy.o.wave_equation_inverted
solution:
  steps:
  - n: 1
    latex: v = f\lambda = 680 \times 0.5 = 340\ \text{m/s}
    reason: Wave equation
    check_id: chk_build_phy_wav_0025_ans
