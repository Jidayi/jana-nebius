    value: '340'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_wav_0025_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which equation links wave speed, frequency and wavelength?
  - rung: 2
    name: concept
    text:
      en: v = f × λ, with f in hertz and λ in metres.
  - rung: 3
    name: first_step
    text:
      en: The values are already in SI units, so no conversion is needed.
  - rung: 4
    name: worked_step
    text:
      en: Multiply the frequency by the wavelength.
  - rung: 5
    name: full_step
    text:
      en: v = 340 m/s.
  misconception_ids:
