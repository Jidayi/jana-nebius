stem: A golf ball of mass 46 g moves at 25 m/s.
parts:
- id: a
  prompt: Find the size of its momentum.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 1150 kg m/s
      correct: false
      misconception_id: mc.phy.o.momentum_grams_not_converted
      feedback: Momentum in kg m/s needs the mass in kilograms. Change grams into kilograms first.
    - id: B
      text: 0.00184 kg m/s
      correct: false
      misconception_id: mc.phy.o.momentum_ratio_inverted
      feedback: A 2 kg ball at 3 m/s has momentum 6 kg m/s. Momentum grows with both mass and velocity, so multiply them; to find a velocity, divide the momentum by the mass.
    - id: C
      text: 1.15 kg m/s
      correct: true
    - id: D
      text: 14.375 kg m/s
      correct: false
      misconception_id: mc.phy.o.momentum_as_kinetic_energy
      feedback: 'Momentum is mass × velocity, in kg m/s. Half m v squared is kinetic energy, in joules: a different quantity.'
