id: itm.phy.o.thermal_properties.0039
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.latent_heat
stem: To measure the specific latent heat of fusion of ice, a 40 W heater in a funnel of crushed ice at 0 °C is switched on for 600 s, and 80 g of water drips out. An identical funnel with no heater, used as a control, gives 8 g of water in the same time.
parts:
- id: a
  prompt: Find the specific latent heat of fusion of ice, in kJ/kg.
  marks: 3
  answer:
    kind: numeric
    value: '333'
    unit: kJ/kg
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_thp_0039_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The control funnel shows how much ice the warm room melts on its own.
  - rung: 2
    name: concept
    text:
      en: Only the extra ice was melted by the heater.
  - rung: 3
    name: first_step
    text:
      en: The heater's energy is E = Pt; the mass it melted is the difference between the two funnels.
  - rung: 4
    name: worked_step
    text:
      en: Divide 24000 J by 0.072 kg, then change to kJ/kg.
  - rung: 5
    name: full_step
    text:
      en: L = 333 kJ/kg.
solution:
  steps:
  - n: 1
    latex: E = Pt = 40 \times 600 = 24000\ \text{J}
    reason: Energy from the heater
    check_id: chk_build_phy_thp_0039_e
  - n: 2
    latex: m = 80 - 8 = 72\ \text{g}
    reason: Ice melted by the heater alone
    check_id: chk_build_phy_thp_0039_dm
  - n: 3
    latex: m = 0.072\ \text{kg}
    reason: Kilograms, since L is per kilogram
    check_id: chk_build_phy_thp_0039_dmkg
  - n: 4
    latex: L = \frac{E}{m} = \frac{24000}{0.072} = 333000\ \text{J/kg}
    reason: Rearrange E = mL
    check_id: chk_build_phy_thp_0039_lj
  - n: 5
    latex: L = 333\ \text{kJ/kg}
    reason: There are a thousand joules in a kilojoule
    check_id: chk_build_phy_thp_0039_ans
