stem: A beta particle and an alpha particle are compared.
parts:
- id: a
  prompt: Which statement is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The beta particle is lighter and penetrates further
      correct: true
    - id: B
      text: The beta particle is a whole atom, while the alpha particle is a nucleus
      correct: false
      misconception_id: mc.phy.o.radiation_natures_swapped
      feedback: 'Alpha: two protons and two neutrons. Beta: a fast electron from the nucleus. Gamma: an electromagnetic wave.'
    - id: C
      text: The alpha particle penetrates further because it is bigger
      correct: false
      misconception_id: mc.phy.o.penetration_order_wrong
      feedback: Paper stops alpha; a few millimetres of aluminium stop beta; gamma is only reduced by thick lead or concrete.
    - id: D
      text: The beta particle came from the atom's electron shells
      correct: false
      misconception_id: mc.phy.o.beta_from_electron_shell
      feedback: In beta decay a neutron in the nucleus turns into a proton and a fast electron, and that electron is shot out. It never orbited the atom.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Think about what each radiation is: its mass and its charge.'
  - rung: 2
    name: concept
    text:
      en: Alpha is heavy and doubly charged; beta is a light, charged electron; gamma is an uncharged wave.
  - rung: 3
    name: first_step
    text:
      en: Compare their masses, then their penetrating power.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that do not fit those properties.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The beta particle is lighter and penetrates further.'
  misconception_ids:
  - mc.phy.o.beta_from_electron_shell
  - mc.phy.o.penetration_order_wrong
  - mc.phy.o.radiation_natures_swapped
