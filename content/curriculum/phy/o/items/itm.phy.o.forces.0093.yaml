id: itm.phy.o.forces.0093
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.moments
stem: A mechanic cannot loosen a tight nut with a short spanner.
parts:
- id: a
  prompt: What should she do?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Push nearer the nut, where the force acts more directly
      correct: false
      misconception_id: mc.phy.o.moment_force_over_distance
      feedback: 'A longer spanner makes a nut easier to turn, so the turning effect grows with the distance: multiply.'
    - id: B
      text: Use a longer spanner and push at the end of it
      correct: true
    - id: C
      text: Use a shorter spanner so the force is concentrated
      correct: false
      misconception_id: mc.phy.o.moment_force_over_distance
      feedback: 'A longer spanner makes a nut easier to turn, so the turning effect grows with the distance: multiply.'
    - id: D
      text: 'Push with the same force anywhere: only the force matters'
      correct: false
      misconception_id: mc.phy.o.balance_equal_forces
      feedback: A small force far from the pivot can balance a large force close to it. Compare moments, force × distance, not forces.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A moment is the turning effect of a force about a pivot.
  - rung: 2
    name: concept
    text:
      en: Moment = force × perpendicular distance from the pivot; in balance the clockwise and anticlockwise moments are equal.
  - rung: 3
    name: first_step
    text:
      en: Ask how the distance from the pivot changes the turning effect in each option.
  - rung: 4
    name: worked_step
    text:
      en: The turning effect depends on the force and on the distance from the pivot.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Use a longer spanner and push at the end of it. A larger distance from the nut gives a larger moment for the same force.'
  misconception_ids:
  - mc.phy.o.balance_equal_forces
  - mc.phy.o.moment_force_over_distance
solution:
  steps:
  - n: 1
    latex: \text{Use a longer spanner and push at the end of it}
    reason: Compare the moments
