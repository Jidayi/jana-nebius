stem: One result of the scattering experiment shows that the nucleus is positively charged.
parts:
- id: a
  prompt: Which result?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Most alpha particles went straight through
      correct: false
      misconception_id: mc.phy.o.observation_conclusion_mismatched
      feedback: 'Straight through: the atom is mostly empty space. Small deflections: there is concentrated positive charge. Rare rebounds: the nucleus is tiny but holds most of the mass.'
    - id: B
      text: Positive alpha particles passing close to nuclei were pushed away
      correct: true
    - id: C
      text: Alpha particles were drawn in towards the nuclei
      correct: false
      misconception_id: mc.phy.o.nucleus_negative
      feedback: The alpha particles were pushed away and some were turned right back. Like charges repel, so the nucleus must be positive.
    - id: D
      text: Alpha particles bounced off the electrons
      correct: false
      misconception_id: mc.phy.o.deflection_by_electrons
      feedback: 'An electron has less than a seven-thousandth of an alpha particle''s mass: like a table-tennis ball in the path of a bowling ball. Only something massive and highly charged could turn an alpha particle back.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Recall the three things that happened to alpha particles fired at thin gold foil.
  - rung: 2
    name: concept
    text:
      en: Most went straight through, a few were deflected a little, and a very few were turned back.
  - rung: 3
    name: first_step
    text:
      en: Charge is shown by a push or a pull.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that contradict what was seen.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Positive alpha particles passing close to nuclei were pushed away.'
  misconception_ids:
  - mc.phy.o.deflection_by_electrons
  - mc.phy.o.nucleus_negative
  - mc.phy.o.observation_conclusion_mismatched
