id: itm.phy.o.electromagnetism.0007
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.electromagnetism.fields_of_currents
stem: Looking at one end of a solenoid, the current flows anticlockwise.
parts:
- id: a
  prompt: Which pole is at that end?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: A south pole
      correct: false
      misconception_id: mc.phy.o.grip_rule_reversed
      feedback: 'Grip the wire with your right hand, thumb along the current: your fingers curl the way the field goes. For a coil, curl the fingers with the current and the thumb points to the north pole.'
    - id: B
      text: 'Neither: a coil does not have poles like a bar magnet'
      correct: false
      misconception_id: mc.phy.o.solenoid_has_no_poles
      feedback: 'Hang a coil carrying a current and it turns to point north-south like a compass: one end is a north pole.'
    - id: C
      text: It depends on the size of the current, not its direction
      correct: false
      misconception_id: mc.phy.o.reversing_current_same_field
      feedback: Reverse the current in a wire and a compass beside it swings round to point the other way.
    - id: D
      text: A north pole
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture the field lines round the wire or coil.
  - rung: 2
    name: concept
    text:
      en: A wire's field lines are circles round it, set by the right-hand grip rule; a coil's field is like a bar magnet's, and grows with the current, the number of turns and an iron core.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Curl the right-hand fingers with the current; the thumb points out of that end, towards you.
  - rung: 5
    name: full_step
    text:
      en: A north pole. Curl the right-hand fingers with the current; the thumb points out of that end, towards you.
  misconception_ids:
  - mc.phy.o.grip_rule_reversed
  - mc.phy.o.reversing_current_same_field
  - mc.phy.o.solenoid_has_no_poles
solution:
  steps:
  - n: 1
    latex: \text{A north pole}
    reason: Use the shape and direction of the field
