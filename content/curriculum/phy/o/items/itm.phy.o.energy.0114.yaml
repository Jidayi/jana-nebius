stem: A wind turbine has a maximum power output of 1.5 MW. Because the wind varies, its average output over a year is only 25% of its maximum.
parts:
- id: a
  prompt: Calculate its average power output in MW.
  marks: 1
  answer:
    kind: numeric
    value: '0.375'
    unit: MW
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_nrg_0114_ans
  show_working: false
  hints:
