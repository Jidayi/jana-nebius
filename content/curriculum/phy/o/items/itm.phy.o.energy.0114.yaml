    name: orient
    text:
      en: Wind is renewable but not reliable, so the average output is less than the maximum.
  - rung: 2
    name: concept
    text:
      en: Find the stated percentage of the maximum output.
  - rung: 3
    name: first_step
    text:
      en: 25% as a fraction is 0.25.
  - rung: 4
    name: worked_step
    text:
      en: Work out 1.5 × 0.25.
  - rung: 5
    name: full_step
    text:
      en: The average output is 0.375 MW.
solution:
