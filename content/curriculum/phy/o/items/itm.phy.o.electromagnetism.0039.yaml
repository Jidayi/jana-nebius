stem: Sipho drops a magnet through a coil of 400 turns and records a peak e.m.f. of 0.6 V. She repeats it from the same height with a coil of 1000 turns.
parts:
- id: a
  prompt: Assuming the peak e.m.f. is proportional to the number of turns, predict the new peak e.m.f.
  marks: 2
  answer:
    kind: numeric
    value: '1.5'
    unit: V
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_emg_0039_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Each turn of the coil has an e.m.f. induced in it, and they add up.
  - rung: 2
    name: concept
    text:
      en: More turns give a proportionally bigger e.m.f.
  - rung: 3
    name: first_step
    text:
      en: Find how many times as many turns the new coil has.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 0.6 V by 2.5.
  - rung: 5
    name: full_step
    text:
      en: E = 0.6 × 2.5 = 1.5 V.
  misconception_ids:
  - mc.phy.o.induction_factor_reversed
solution:
  steps:
  - n: 1
    latex: \frac{1000}{400} = 2.5
    reason: How many times as many turns
    check_id: chk_build_phy_emg_0039_ratio
  - n: 2
    latex: E = 0.6 \times 2.5 = 1.5\ \text{V}
    reason: The e.m.f. grows in the same ratio
    check_id: chk_build_phy_emg_0039_ans
