- kc.phy.o.wave_properties.wave_behaviour
stem: Ripples in a ripple tank travel at 30 cm/s in deep water, where their wavelength is 2.5 cm. They then pass into shallow water, where their speed is 15 cm/s.
parts:
- id: a
  prompt: Find their wavelength in the shallow water.
  marks: 3
  answer:
    kind: numeric
    value: '1.25'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_wav_0054_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which quantity stays the same when water waves change depth?
  - rung: 2
    name: concept
    text:
      en: The frequency is set by the source, so it is the same in both depths.
  - rung: 3
    name: first_step
    text:
      en: 'Find the frequency from the deep water: f = 30 ÷ 2.5 = 12 Hz.'
  - rung: 4
    name: worked_step
    text:
      en: 'Then use the new speed: λ = v ÷ f.'
  - rung: 5
    name: full_step
    text:
      en: λ = 1.25 cm.
  misconception_ids:
  - mc.phy.o.wavelength_unchanged_on_refraction
  - mc.phy.o.wavelength_inverse_to_speed
  - mc.phy.o.wave_equation_multiplied
solution:
  steps:
  - n: 1
    latex: f = \frac{v}{\lambda} = \frac{30}{2.5} = 12\ \text{Hz}
    reason: Frequency in deep water
    check_id: chk_build_phy_wav_0054_f
  - n: 2
    latex: f \text{ is unchanged by the change of depth}
    reason: The source sets the frequency
  - n: 3
    latex: \lambda = \frac{15}{12} = 1.25\ \text{cm}
    reason: λ = v ÷ f in the shallow water
    check_id: chk_build_phy_wav_0054_ans
