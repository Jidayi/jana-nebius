id: itm.phy.o.forces.0002
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.resultant_force
stem: A book rests on a table.
parts:
- id: a
  prompt: Which statement about the forces on the book is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: No forces act on it, because it is not moving
      correct: false
      misconception_id: mc.phy.o.steady_speed_no_forces
      feedback: A car cruising at a steady speed still has friction and air resistance on it; the engine's force just matches them. Steady velocity means the forces balance, not that there are none.
    - id: B
      text: Its weight is bigger than the table's push, so it stays down
      correct: false
      misconception_id: mc.phy.o.largest_vector_only
      feedback: A small current still slows a boat. Every vector acting changes the resultant, so combine them all.
    - id: C
      text: Its weight is balanced by the push of the table
      correct: true
    - id: D
      text: Only its weight acts, which holds it in place
      correct: false
      misconception_id: mc.phy.o.resultant_one_force_left_out
      feedback: List every force acting along the line before you combine them. Each one changes the resultant, so tick them off as you use them.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about whether the forces on the object are balanced or unbalanced.
  - rung: 2
    name: concept
    text:
      en: Balanced forces give a zero resultant, so the velocity stays the same; unbalanced forces change the speed or the direction.
  - rung: 3
    name: first_step
    text:
      en: Compare the forces acting in each direction with what the object is doing.
  - rung: 4
    name: worked_step
    text:
      en: The book is not accelerating, so what must be true of the resultant force?
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Its weight is balanced by the push of the table. The book stays at rest, so the resultant force is zero: the table pushes up as hard as gravity pulls down.'
  misconception_ids:
  - mc.phy.o.largest_vector_only
  - mc.phy.o.resultant_one_force_left_out
  - mc.phy.o.steady_speed_no_forces
solution:
  steps:
  - n: 1
    latex: \text{Its weight is balanced by the push of the table}
    reason: Use the resultant force to decide how the motion changes
