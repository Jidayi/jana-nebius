stem: A drilling machine has a mass of 95 kg. It is taken to Titan (the largest moon of Saturn), where g = 1.4 N/kg.
parts:
- id: a
  prompt: Calculate its weight on Titan (the largest moon of Saturn).
  marks: 1
  answer:
    kind: numeric
    value: '133'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mwt_0007_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Weight depends on where the object is; mass does not.
  - rung: 2
    name: concept
    text:
      en: On Titan (the largest moon of Saturn) each kilogram has a weight of 1.4 N.
  - rung: 3
    name: first_step
    text:
      en: Weight = mass × g, using the g for that place.
  - rung: 4
    name: worked_step
    text:
      en: Work out 95 × 1.4.
  - rung: 5
    name: full_step
    text:
      en: The weight on Titan (the largest moon of Saturn) is 133 N.
  misconception_ids:
