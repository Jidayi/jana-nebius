id: itm.phy.o.electrical_quantities.0066
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.resistance_of_wires
stem: A copper wire 1 m long with a cross-sectional area of 0.4 mm² has a resistance of 4.8 Ω. A second copper wire is 4 m long with a cross-sectional area of 0.2 mm².
parts:
- id: a
  prompt: Find the resistance of the second wire.
  marks: 2
  answer:
    kind: numeric
    value: '38.4'
    unit: Ω
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0066_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Two things change: the length and the cross-sectional area.'
  - rung: 2
    name: concept
    text:
      en: Resistance is proportional to length and inversely proportional to area.
  - rung: 3
    name: first_step
    text:
      en: Multiply by the length ratio (new over old) and by the area ratio (old over new).
  - rung: 4
    name: worked_step
    text:
      en: The length ratio is 4 and the area ratio is 2.
  - rung: 5
    name: full_step
    text:
      en: R = 4.8 × 4 × 2 = 38.4 Ω.
  misconception_ids:
  - mc.phy.o.thicker_wire_more_resistance
  - mc.phy.o.longer_wire_less_resistance
  - mc.phy.o.resistance_set_by_material_only
solution:
  steps:
  - n: 1
    latex: \frac{4}{1} = 4
    reason: R is proportional to length
    check_id: chk_build_phy_elq_0066_lr
  - n: 2
    latex: \frac{0.4}{0.2} = 2
    reason: R is inversely proportional to area
    check_id: chk_build_phy_elq_0066_ar
  - n: 3
    latex: R = 4.8 \times 4 \times 2 = 38.4\ \Omega
    reason: Apply both changes
    check_id: chk_build_phy_elq_0066_ans
