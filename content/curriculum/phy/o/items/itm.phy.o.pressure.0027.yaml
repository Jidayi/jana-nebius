id: itm.phy.o.pressure.0027
version: 0.1.1
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.liquid_pressure
stem: A tall jar holds ethanol (density 790 kg/m³) to a depth of 15 cm. Take g = 10 N/kg.
parts:
- id: a
  prompt: Calculate the pressure due to the ethanol at the bottom of the jar, in pascals.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 118500 Pa
      correct: false
      misconception_id: mc.phy.o.liquid_depth_cm_not_converted
      feedback: 'With the density in kg/m³ and g in N/kg, the depth must be in metres: divide centimetres by a hundred and millimetres by a thousand first.'
    - id: B
      text: 118.5 Pa
      correct: false
      misconception_id: mc.phy.o.liquid_pressure_g_left_out
      feedback: 'The pressure comes from the weight of the liquid above, so g is needed: pressure = ρ × g × h. Without g the answer is not in pascals.'
    - id: C
      text: 1500 Pa
      correct: false
      misconception_id: mc.phy.o.liquid_density_ignored
      feedback: 'At the same depth a denser liquid has more mass above each square metre, so it presses harder: Δp = ρgΔh. Mercury is far denser than water, so a far shorter column of it balances the air.'
    - id: D
      text: 1185 Pa
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: With the density in kg/m³, the depth must be in metres.
  - rung: 2
    name: concept
    text:
      en: Pressure due to a liquid = density × g × depth.
  - rung: 3
    name: first_step
    text:
      en: Change 15 cm into metres first.
  - rung: 4
    name: worked_step
    text:
      en: The depth is 0.15 m; multiply 790 × 10 × 0.15.
  - rung: 5
    name: full_step
    text:
      en: The pressure is 1185 Pa.
  misconception_ids:
  - mc.phy.o.liquid_density_ignored
  - mc.phy.o.liquid_depth_cm_not_converted
  - mc.phy.o.liquid_pressure_g_left_out
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: h = 15\ \text{cm} = 0.15\ \text{m}
    reason: Depth in metres
    check_id: chk_build_phy_prs_0027_hm
  - n: 2
    latex: p = \rho g h = 790 \times 10 \times 0.15 = 1185\ \text{Pa}
    reason: Pressure = ρgh
    check_id: chk_build_phy_prs_0027_ans
