id: itm.phy.o.thermal_properties.0038
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.latent_heat
stem: A 1.8 kW kettle is left boiling for 3 minutes after the water reaches 100 °C. The specific latent heat of vaporisation of water is 2260 kJ/kg.
parts:
- id: a
  prompt: What mass of water boils away? Assume all the energy goes into the water.
  marks: 3
  answer:
    kind: numeric
    value: '0.143'
    unit: kg
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_thp_0038_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: While the water boils its temperature stays at 100 °C, so the energy only turns water into steam.
  - rung: 2
    name: concept
    text:
      en: Find the energy supplied with E = Pt, using the time in seconds.
  - rung: 3
    name: first_step
    text:
      en: Then rearrange E = mL to m = E ÷ L.
  - rung: 4
    name: worked_step
    text:
      en: Divide 324 kJ by 2260 kJ/kg.
  - rung: 5
    name: full_step
    text:
      en: 0.143 kg of water boils away.
  misconception_ids:
  - mc.phy.o.heater_minutes_not_seconds
solution:
  steps:
  - n: 1
    latex: t = 3\ \text{min} = 180\ \text{s}
    reason: Seconds, to match the power
    check_id: chk_build_phy_thp_0038_ts
  - n: 2
    latex: E = Pt = 1.8 \times 180 = 324\ \text{kJ}
    reason: kW × s gives kJ
    check_id: chk_build_phy_thp_0038_e
  - n: 3
    latex: m = \frac{E}{L} = \frac{324}{2260} = 0.143\ \text{kg}
    reason: Rearrange E = mL
    check_id: chk_build_phy_thp_0038_ans
