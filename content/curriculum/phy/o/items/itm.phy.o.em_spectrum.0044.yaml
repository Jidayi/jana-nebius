stem: An oven heats food quickly by making the water molecules inside it vibrate.
parts:
- id: a
  prompt: Which radiation does the oven use?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Microwaves
      correct: true
    - id: B
      text: Radio waves
      correct: false
      misconception_id: mc.phy.o.long_wave_uses_mixed
      feedback: 'Radio: broadcasting. Microwaves: cooking by heating water, mobile phones and satellites. Infrared: remote controls, heaters and thermal cameras.'
    - id: C
      text: Infrared
      correct: false
      misconception_id: mc.phy.o.long_wave_uses_mixed
      feedback: 'Radio: broadcasting. Microwaves: cooking by heating water, mobile phones and satellites. Infrared: remote controls, heaters and thermal cameras.'
    - id: D
      text: Ultraviolet
      correct: false
      misconception_id: mc.phy.o.infrared_ultraviolet_swapped
      feedback: 'Infra means below: infrared is beyond red, with longer waves that heat things. Ultra means beyond: ultraviolet is beyond violet, with shorter waves that damage skin.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what each region does when it meets matter.
  - rung: 2
    name: concept
    text:
      en: Long-wavelength regions mostly carry signals or heat things; short-wavelength regions pass through soft tissue or damage cells.
  - rung: 3
    name: first_step
    text:
      en: Only the highest-frequency regions are ionising, and danger rises with frequency.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that give a region a property it does not have.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Microwaves.'
  misconception_ids:
  - mc.phy.o.infrared_ultraviolet_swapped
  - mc.phy.o.long_wave_uses_mixed
