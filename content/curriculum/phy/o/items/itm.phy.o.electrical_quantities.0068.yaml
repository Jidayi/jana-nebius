subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.resistance_of_wires
stem: A copper wire of diameter 0.8 mm has a resistance of 6 Ω.
parts:
- id: a
  prompt: Find the resistance of a wire of the same metal and length but with a diameter of 0.4 mm.
  marks: 2
  answer:
    kind: numeric
    value: '24'
    unit: Ω
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0068_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A thicker wire gives the current more room, so less resistance.
  - rung: 2
    name: concept
    text:
      en: Resistance is inversely proportional to cross-sectional area, and area goes with diameter squared.
  - rung: 3
    name: first_step
    text:
      en: Square the ratio of the diameters, old over new.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 6 Ω by (0.8 ÷ 0.4)².
  - rung: 5
    name: full_step
    text:
      en: R = 6 × 4 = 24 Ω.
  misconception_ids:
  - mc.phy.o.diameter_used_as_area
  - mc.phy.o.thicker_wire_more_resistance
  - mc.phy.o.resistance_set_by_material_only
solution:
  steps:
  - n: 1
    latex: A \propto d^2
    reason: The cross-sectional area goes with the diameter squared
  - n: 2
    latex: \left(\frac{0.8}{0.4}\right)^2 = 4
    reason: Resistance is inversely proportional to area
    check_id: chk_build_phy_elq_0068_ratio
  - n: 3
    latex: R = 6 \times 4 = 24\ \Omega
    reason: Scale the resistance
    check_id: chk_build_phy_elq_0068_ans
