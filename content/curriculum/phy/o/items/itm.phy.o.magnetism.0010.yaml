stem: Nia puts a soft-iron rod and then a steel rod of the same size inside a coil carrying a current. With the current on, the iron rod holds 36 paper clips and the steel rod holds 26. With the current switched off, the iron rod holds 1 and the steel rod holds 24.
parts:
- id: a
  prompt: The rod that keeps its magnetism would make a permanent magnet. What percentage of its paper clips does it still hold after the current is switched off?
  marks: 2
  answer:
    kind: numeric
    value: '92.3'
    unit: '%'
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_mag_0010_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which material keeps its magnetism once the current stops?
  - rung: 2
    name: concept
    text:
      en: 'Steel is a hard magnetic material: it keeps most of its magnetism.'
  - rung: 3
    name: first_step
    text:
      en: Compare the clips the steel rod holds after with the clips it held before.
  - rung: 4
    name: worked_step
    text:
      en: Divide 24 by 26 and multiply by a hundred.
  - rung: 5
    name: full_step
    text:
      en: 24 ÷ 26 = 0.923, which is 92.3%.
  misconception_ids:
  - mc.phy.o.soft_iron_steel_swapped
