id: itm.phy.o.mass_weight.0018
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.mass_weight.mass_or_weight
stem: An astronaut finds it much easier to lift a heavy box of rocks on the Moon than on Earth.
parts:
- id: a
  prompt: Why is it easier?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The box's mass is smaller on the Moon
      correct: false
      misconception_id: mc.phy.o.mass_changes_with_g
      feedback: Mass is the amount of matter in the object, and a trip to the Moon removes no matter. Only the weight, the pull of gravity on it, changes.
    - id: B
      text: The box has no weight at all on the Moon
      correct: false
      misconception_id: mc.phy.o.no_mass_in_space
      feedback: An astronaut floating in a spacecraft is still hard to push and to stop, because all her mass is still there. Gravity gets weaker far from planets, but mass never disappears.
    - id: C
      text: The box's weight is smaller, though its mass is the same
      correct: true
    - id: D
      text: The astronaut's mass is bigger on the Moon
      correct: false
      misconception_id: mc.phy.o.mass_weight_roles_swapped
      feedback: Weight is a force caused by gravity, so it changes from world to world. Mass is the amount of matter, so it stays the same.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide whether each option is about mass, weight, or both.
  - rung: 2
    name: concept
    text:
      en: Lifting works against the pull of gravity on the box.
  - rung: 3
    name: first_step
    text:
      en: Test each option against the difference between the amount of matter and the pull of gravity.
  - rung: 4
    name: worked_step
    text:
      en: Rule out every option that mixes up the two quantities.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The box''s weight is smaller, though its mass is the same.'
  misconception_ids:
  - mc.phy.o.mass_changes_with_g
  - mc.phy.o.mass_weight_roles_swapped
  - mc.phy.o.no_mass_in_space
