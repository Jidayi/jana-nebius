id: itm.phy.o.electromagnetism.0064
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.electromagnetism.power_transmission
stem: A power company raises its transmission voltage while sending the same power.
parts:
- id: a
  prompt: What happens to the energy wasted in the cables?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It decreases
      correct: true
    - id: B
      text: It increases, as a higher voltage pushes harder
      correct: false
      misconception_id: mc.phy.o.higher_voltage_more_loss
      feedback: Power stations step the voltage up precisely because it cuts the current, and so cuts the heating in the cables.
    - id: C
      text: It does not change, as the cables are the same
      correct: false
      misconception_id: mc.phy.o.transmission_loss_unchanged
      feedback: The power wasted is current² × resistance, so it depends on the current as well as on the cable.
    - id: D
      text: It decreases, because the higher voltage lowers the cables' resistance
      correct: false
      misconception_id: mc.phy.o.high_voltage_lowers_resistance
      feedback: A cable's resistance depends on its material, length and thickness, not on the voltage. A high voltage reduces the current instead.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what happens to the current, since the cables heat up because of it.
  - rung: 2
    name: concept
    text:
      en: An ideal transformer keeps Vp × Ip = Vs × Is, and the power wasted in a cable is I² × R.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: A higher voltage means a smaller current for the same power, and less heating.
  - rung: 5
    name: full_step
    text:
      en: It decreases. A higher voltage means a smaller current for the same power, and less heating.
  misconception_ids:
  - mc.phy.o.high_voltage_lowers_resistance
  - mc.phy.o.higher_voltage_more_loss
  - mc.phy.o.transmission_loss_unchanged
solution:
  steps:
  - n: 1
    latex: \text{It decreases}
    reason: Power is kept; heating goes with current squared
