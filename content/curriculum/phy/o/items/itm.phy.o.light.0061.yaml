id: itm.phy.o.light.0061
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.light.converging_lens
stem: An object stands 28 cm from a thin converging lens of focal length 20 cm.
parts:
- id: a
  prompt: How far from the lens is the image formed?
  marks: 2
  answer:
    kind: numeric
    value: '70'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_lgt_0061_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Use the lens formula with real distances positive.
  - rung: 2
    name: concept
    text:
      en: 1/u + 1/v = 1/f, so 1/v = 1/f − 1/u.
  - rung: 3
    name: first_step
    text:
      en: Work out 1/20 − 1/28.
  - rung: 4
    name: worked_step
    text:
      en: 1/v = 0.0143; now find one divided by this.
  - rung: 5
    name: full_step
    text:
      en: The image is 70 cm from the lens.
  misconception_ids:
  - mc.phy.o.lens_reciprocals_added
  - mc.phy.o.lens_reciprocal_not_inverted
  - mc.phy.o.lens_distances_subtracted
solution:
  steps:
  - n: 1
    latex: \frac{1}{v} = \frac{1}{20} - \frac{1}{28} = 0.0143
    reason: 1/u + 1/v = 1/f
    check_id: chk_build_phy_lgt_0061_inv
  - n: 2
    latex: v = 70\ \text{cm}
    reason: Take the reciprocal
    check_id: chk_build_phy_lgt_0061_ans
