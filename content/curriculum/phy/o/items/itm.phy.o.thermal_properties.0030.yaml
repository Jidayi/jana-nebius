    args:
      expression: 200/1000*900*(70 - 22)/1000
    tool: math_evaluate
  chk_build_phy_thp_0030_dt:
    args:
      expression: 70 - 22
    tool: math_evaluate
  chk_build_phy_thp_0030_e:
    args:
      expression: 200/1000*900*(70 - 22)
    tool: math_evaluate
  chk_build_phy_thp_0030_m:
    args:
      expression: 200/1000
    tool: math_evaluate
