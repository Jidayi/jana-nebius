id: itm.phy.o.thermal_properties.0030
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.specific_heat_capacity
stem: A 200 g block of aluminium is heated from 22 °C to 70 °C. The specific heat capacity of aluminium is 900 J/(kg °C).
parts:
- id: a
  prompt: How much energy is needed? Give your answer in kJ.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 12.6 kJ
      correct: false
      misconception_id: mc.phy.o.shc_final_temperature_used
      feedback: 'Δθ means the change in temperature: final minus starting. Water warming from 20 °C to 30 °C rises by 10 °C, not 30 °C.'
    - id: B
      text: 57.78 kJ
      correct: false
      misconception_id: mc.phy.o.kelvin_change_offset_added
      feedback: 'Warming from 20 °C to 30 °C is warming from 293 K to 303 K: a change of 10 on both scales. Only readings need 273 added, never changes.'
    - id: C
      text: 8.64 kJ
      correct: true
    - id: D
      text: 8640 kJ
      correct: false
      misconception_id: mc.phy.o.thermal_grams_as_kg
      feedback: 'Specific heat capacity and specific latent heat are per kilogram. Change grams to kilograms first: 250 g is 0.25 kg.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Use E = mcΔθ, with the mass in kilograms and Δθ the temperature rise.
  - rung: 2
    name: concept
    text:
      en: Specific heat capacity is the energy needed to warm 1 kg by 1 °C.
  - rung: 3
    name: first_step
    text:
      en: Change 200 g to kilograms and find the temperature rise from 22 °C to 70 °C.
  - rung: 4
    name: worked_step
    text:
      en: Work out 0.2 × 900 × 48 to get joules, then change to kilojoules.
  - rung: 5
    name: full_step
    text:
      en: E = 8.64 kJ.
  misconception_ids:
  - mc.phy.o.kelvin_change_offset_added
  - mc.phy.o.shc_final_temperature_used
  - mc.phy.o.thermal_grams_as_kg
solution:
  steps:
  - n: 1
    latex: m = 200\ \text{g} = 0.2\ \text{kg}
    reason: Specific heat capacity is per kilogram
    check_id: chk_build_phy_thp_0030_m
  - n: 2
    latex: \Delta\theta = 70 - 22 = 48\ ^\circ\text{C}
    reason: The temperature rise
    check_id: chk_build_phy_thp_0030_dt
  - n: 3
    latex: E = mc\Delta\theta = 0.2 \times 900 \times 48 = 8640\ \text{J}
    reason: Energy needed
    check_id: chk_build_phy_thp_0030_e
  - n: 4
    latex: E = 8.64\ \text{kJ}
    reason: There are a thousand joules in a kilojoule
    check_id: chk_build_phy_thp_0030_ans
difficulty:
  prior: 0.0
  band: core
