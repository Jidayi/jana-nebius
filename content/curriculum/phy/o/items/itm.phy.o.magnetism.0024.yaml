id: itm.phy.o.magnetism.0024
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.magnetism.magnetic_fields
stem: The north poles of two bar magnets face each other a short distance apart.
parts:
- id: a
  prompt: Which describes the field lines between the two poles?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: They bend away from each other and do not cross
      correct: true
    - id: B
      text: They cross in the gap between the poles
      correct: false
      misconception_id: mc.phy.o.field_lines_can_cross
      feedback: A compass at a point can only point one way. If two lines crossed, it would have to point two ways at once.
    - id: C
      text: They run from one north pole into the other, joining them
      correct: false
      misconception_id: mc.phy.o.like_poles_attract
      feedback: 'Like poles repel and unlike poles attract: two north poles push apart, a north and a south pull together.'
    - id: D
      text: They run into both north poles from the gap
      correct: false
      misconception_id: mc.phy.o.field_lines_s_to_n
      feedback: Outside a magnet the field points from the north pole round to the south pole, the way a small compass's north end points.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture a small plotting compass placed at that point near the magnet.
  - rung: 2
    name: concept
    text:
      en: Field lines run from north to south outside a magnet, never cross, and are closest where the field is strongest, at the poles.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Both poles send lines outwards, and lines never cross, so they turn aside.
  - rung: 5
    name: full_step
    text:
      en: They bend away from each other and do not cross. Both poles send lines outwards, and lines never cross, so they turn aside.
  misconception_ids:
  - mc.phy.o.field_lines_can_cross
  - mc.phy.o.field_lines_s_to_n
  - mc.phy.o.like_poles_attract
solution:
  steps:
  - n: 1
    latex: \text{They bend away from each other and do not cross}
    reason: Use the rules for magnetic field lines
