id: itm.phy.o.electrical_quantities.0011
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.electric_charge
stem: Two balloons are both rubbed on the same jumper and both become negatively charged.
parts:
- id: a
  prompt: What happens when they are hung side by side?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: They attract each other
      correct: false
      misconception_id: mc.phy.o.like_charges_attract
      feedback: Like charges repel and unlike charges attract, just as with magnetic poles.
    - id: B
      text: They attract, because one is now positive
      correct: false
      misconception_id: mc.phy.o.rubbed_pair_same_charge
      feedback: 'If the rod gains some electrons, the cloth has lost exactly those electrons: the rod is negative and the cloth is positive by the same amount.'
    - id: C
      text: Nothing, as rubbing makes charges that cancel out on each balloon
      correct: false
      misconception_id: mc.phy.o.charge_created_by_rubbing
      feedback: Rubbing makes no new charge. Electrons move from one object to the other, so one becomes negative and the other positive.
    - id: D
      text: They repel each other
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about which particles can move and what charge they carry.
  - rung: 2
    name: concept
    text:
      en: Rubbing moves tiny negative particles from one object to the other. Like charges repel and unlike charges attract.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Both balloons carry the same sign of charge, and like charges repel.
  - rung: 5
    name: full_step
    text:
      en: They repel each other. Both balloons carry the same sign of charge, and like charges repel.
  misconception_ids:
  - mc.phy.o.charge_created_by_rubbing
  - mc.phy.o.like_charges_attract
  - mc.phy.o.rubbed_pair_same_charge
solution:
  steps:
  - n: 1
    latex: \text{They repel each other}
    reason: Electrons move; like charges repel
