id: itm.phy.o.circuits.0037
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.mixed_circuits
stem: A 6 Ω resistor is connected in series with a parallel pair made of a 5 Ω resistor and a 20 Ω resistor. The circuit is connected to a 6 V battery.
parts:
- id: a
  prompt: Calculate the current from the battery.
  marks: 3
  answer:
    kind: numeric
    value: '0.6'
    unit: A
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_cir_0037_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The battery current depends on the total resistance of the whole circuit.
  - rung: 2
    name: concept
    text:
      en: Combine the parallel pair first, then add the series resistor, then use I = V/R.
  - rung: 3
    name: first_step
    text:
      en: For the pair, use (5 × 20) ÷ (5 + 20).
  - rung: 4
    name: worked_step
    text:
      en: The pair is 4 Ω and the total is 10 Ω; divide 6 V by the total.
  - rung: 5
    name: full_step
    text:
      en: The current from the battery is 0.6 A.
  misconception_ids:
  - mc.phy.o.mixed_all_in_series
  - mc.phy.o.mixed_series_resistor_left_out
  - mc.phy.o.series_current_from_one_resistor
solution:
  steps:
  - n: 1
    latex: R_p = \frac{5 \times 20}{5 + 20} = 4\ \Omega
    reason: Combine the parallel pair
    check_id: chk_build_phy_cir_0037_rp
  - n: 2
    latex: R = 6 + 4 = 10\ \Omega
    reason: Add the series resistor
    check_id: chk_build_phy_cir_0037_rt
  - n: 3
    latex: I = \frac{6}{10} = 0.6\ \text{A}
    reason: Ohm's law for the circuit
    check_id: chk_build_phy_cir_0037_ans
difficulty:
  prior: 0.7
  band: core
