    name: orient
    text:
      en: Think about what the coils are doing in those places.
  - rung: 2
    name: concept
    text:
      en: The coils there are squeezed closer together than normal.
  - rung: 3
    name: first_step
    text:
      en: Crests and troughs belong to waves that vibrate at right angles to their travel.
  - rung: 4
    name: worked_step
    text:
      en: Choose the name that means 'squeezed together'.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Compressions.'
