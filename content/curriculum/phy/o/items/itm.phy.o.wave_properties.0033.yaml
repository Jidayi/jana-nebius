stem: A slinky spring is pushed and pulled along its length. In some places the coils bunch up close together.
parts:
- id: a
  prompt: What are these places called?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Rarefactions
      correct: false
      misconception_id: mc.phy.o.compression_rarefaction_swapped
      feedback: 'Compressed means squeezed: particles closer together than normal. A rarefaction is the thinned-out region where they are further apart.'
    - id: B
      text: Compressions
      correct: true
    - id: C
      text: Crests
      correct: false
      misconception_id: mc.phy.o.vibration_direction_swapped
      feedback: 'Shake a rope up and down: the vibration is across the direction of travel (transverse). Push a slinky back and forth: the vibration is along it (longitudinal).'
    - id: D
      text: Troughs
      correct: false
      misconception_id: mc.phy.o.vibration_direction_swapped
      feedback: 'Shake a rope up and down: the vibration is across the direction of travel (transverse). Push a slinky back and forth: the vibration is along it (longitudinal).'
  show_working: false
  hints:
