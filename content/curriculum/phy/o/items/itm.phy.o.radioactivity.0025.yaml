id: itm.phy.o.radioactivity.0025
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.decay_equations
stem: A nucleus of radon-222 (proton number 86) decays by emitting an alpha particle.
parts:
- id: a
  prompt: What is the nucleon number of the new nucleus?
  marks: 2
  answer:
    kind: numeric
    value: '218'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_rad_0025_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Write down what an alpha particle contains.
  - rung: 2
    name: concept
    text:
      en: 'An alpha particle is two protons and two neutrons: nucleon number 4, proton number 2.'
  - rung: 3
    name: first_step
    text:
      en: The nucleon numbers on the two sides of the decay equation must balance.
  - rung: 4
    name: worked_step
    text:
      en: Take 4 from the nucleon number 222.
  - rung: 5
    name: full_step
    text:
      en: 'The new nucleon number is 218: the nucleus is polonium-218.'
  misconception_ids:
  - mc.phy.o.alpha_numbers_swapped
  - mc.phy.o.decay_numbers_added
  - mc.phy.o.decay_changes_one_number_only
solution:
  steps:
  - n: 1
    latex: '\text{alpha particle: } 2\ \text{protons} + 2\ \text{neutrons} = 4\ \text{nucleons}'
    reason: An alpha particle is a helium nucleus
    check_id: chk_build_phy_rad_0025_alpha_a
  - n: 2
    latex: A = 222 - 4 = 218
    reason: Four nucleons leave in the alpha particle
    check_id: chk_build_phy_rad_0025_ans
  - n: 3
    latex: Z = 86 - 2 = 84
    reason: and two protons
    check_id: chk_build_phy_rad_0025_z2
  - n: 4
    latex: '{}^{222}_{86}\text{Rn} \rightarrow {}^{218}_{84}\text{Po} + {}^{4}_{2}\text{He}'
    reason: Both numbers balance on the two sides of the equation
difficulty:
  prior: 0.0
