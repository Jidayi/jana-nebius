id: itm.phy.o.mass_weight.0013
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.mass_weight.weight_from_mass
stem: On Saturn, where g = 10.4 N/kg, a newton meter shows that a space probe has a weight of 4992 N.
parts:
- id: a
  prompt: Calculate the mass of the space probe.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 51900 kg
      correct: false
      misconception_id: mc.phy.o.weight_mass_divided_by_g
      feedback: 'Weight = mass × g: each kilogram has a weight of g newtons. So mass = weight ÷ g. Where g is bigger than 1 N/kg the weight in newtons is a bigger number than the mass in kilograms.'
    - id: B
      text: 480 kg
      correct: true
    - id: C
      text: 4992 kg
      correct: false
      misconception_id: mc.phy.o.weight_given_as_mass_number
      feedback: 'A bag of sugar pulls on your hand much less on the Moon than on Earth, yet it holds the same sugar. Weight is a force: multiply the mass by g to get it, and divide a weight by g to get the mass.'
    - id: D
      text: 509 kg
      correct: false
      misconception_id: mc.phy.o.planet_g_mismatched
      feedback: 'g depends on where the object is: about 9.8 N/kg on Earth but 1.6 N/kg on the Moon. Use the g of the place where the weight acts or was measured.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A newton meter measures weight, which is a force.
  - rung: 2
    name: concept
    text:
      en: Weight = mass × g, so mass = weight ÷ g.
  - rung: 3
    name: first_step
    text:
      en: Use the g for Saturn, where the weight was measured.
  - rung: 4
    name: worked_step
    text:
      en: Work out 4992 ÷ 10.4.
  - rung: 5
    name: full_step
    text:
      en: The mass is 480 kg.
  misconception_ids:
  - mc.phy.o.planet_g_mismatched
  - mc.phy.o.weight_given_as_mass_number
  - mc.phy.o.weight_mass_divided_by_g
solution:
  steps:
  - n: 1
    latex: m = \frac{W}{g} = \frac{4992}{10.4} = 480\ \text{kg}
    reason: Rearrange weight = mass × g
    check_id: chk_build_phy_mwt_0013_ans
