stem: A kettle transfers 480 kJ of energy in 4 minutes.
parts:
- id: a
  prompt: Calculate its power in watts.
  marks: 2
  answer:
    kind: numeric
    value: '2000'
    unit: W
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_nrg_0077_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A watt is one joule per second.
  - rung: 2
    name: concept
    text:
      en: Change the energy to joules and the time to seconds, then use P = E ÷ t.
  - rung: 3
    name: first_step
    text:
      en: 480 kJ = 480000 J and 4 minutes = 240 s.
  - rung: 4
    name: worked_step
    text:
      en: Work out 480000 ÷ 240.
  - rung: 5
    name: full_step
    text:
      en: The power is 2000 W.
  misconception_ids:
  - mc.phy.o.power_minutes_not_converted
  - mc.phy.o.energy_kilo_prefix_ignored
  - mc.phy.o.power_energy_times_time
solution:
  steps:
  - n: 1
    latex: E = 480\ \text{kJ} = 480000\ \text{J}
    reason: Energy in joules
    check_id: chk_build_phy_nrg_0077_ej
  - n: 2
    latex: t = 4\ \text{min} = 240\ \text{s}
    reason: Time in seconds
    check_id: chk_build_phy_nrg_0077_ts
  - n: 3
    latex: P = \frac{E}{t} = \frac{480000}{240} = 2000\ \text{W}
    reason: Power = energy ÷ time
    check_id: chk_build_phy_nrg_0077_ans
