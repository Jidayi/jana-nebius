id: itm.phy.o.oscilloscope.0026
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.oscilloscope.y_gain
stem: The Y-gain of an oscilloscope is set to 0.5 V/div. A crest of the trace is 4 divisions above the centre line.
parts:
- id: a
  prompt: Find the peak voltage of the signal.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 8 V
      correct: false
      misconception_id: mc.phy.o.osc_ygain_divided
      feedback: The Y-gain says how many volts each division stands for, so voltage = divisions × volts per division.
    - id: B
      text: 4 V
      correct: false
      misconception_id: mc.phy.o.osc_peak_and_peak_to_peak_confused
      feedback: The peak voltage is measured from the centre line to a crest; peak-to-peak is crest to trough, twice as big.
    - id: C
      text: 2 V
      correct: true
    - id: D
      text: 1 V
      correct: false
      misconception_id: mc.phy.o.osc_peak_height_halved
      feedback: Check where the height is measured from. From the centre line it is already the peak; only crest-to-trough needs halving.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The peak voltage is the height of a crest above the centre line.
  - rung: 2
    name: concept
    text:
      en: The Y-gain gives the voltage for each vertical division.
  - rung: 3
    name: first_step
    text:
      en: The height is already measured from the centre line.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 4 divisions by 0.5 V/div.
  - rung: 5
    name: full_step
    text:
      en: The peak voltage is 2 V.
  misconception_ids:
  - mc.phy.o.osc_peak_and_peak_to_peak_confused
  - mc.phy.o.osc_peak_height_halved
  - mc.phy.o.osc_ygain_divided
solution:
  steps:
  - n: 1
    latex: V_0 = 4 \times 0.5 = 2\ \text{V}
    reason: Divisions times volts per division
    check_id: chk_build_phy_osc_0026_ans
