  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The half-life is the time for the activity to halve.
  - rung: 2
    name: concept
    text:
      en: Count how many times 320 halves to reach 40.
  - rung: 3
    name: first_step
    text:
      en: Those halvings share the time equally.
  - rung: 4
    name: worked_step
    text:
      en: There are 3 half-lives in 210 s.
  - rung: 5
    name: full_step
    text:
      en: The half-life is 70 s.
