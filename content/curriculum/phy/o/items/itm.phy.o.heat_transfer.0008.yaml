id: itm.phy.o.heat_transfer.0008
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.heat_transfer.conduction
stem: A double-glazed window has a layer of air sealed between two sheets of glass.
parts:
- id: a
  prompt: Why does it cut energy loss by conduction?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Air is a much poorer conductor than glass
      correct: true
    - id: B
      text: The air layer is cold and blocks the heat
      correct: false
      misconception_id: mc.phy.o.cold_transferred_as_substance
      feedback: Only energy moves, always from hotter to colder. An ice pack does not send cold into you; energy flows out of you into the ice.
    - id: C
      text: The air layer warms itself and the room
      correct: false
      misconception_id: mc.phy.o.insulator_produces_heat
      feedback: Wrap a blanket round a block of ice and the ice stays frozen longer. Insulators produce no energy; they only slow down how fast energy moves through them.
    - id: D
      text: Particles from the room travel through the glass more slowly
      correct: false
      misconception_id: mc.phy.o.conduction_particles_travel
      feedback: In a solid the atoms stay in place and pass vibrations to their neighbours; in a metal, free electrons also carry energy. The material itself does not flow along.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Conduction passes energy through a material without the material itself moving.
  - rung: 2
    name: concept
    text:
      en: Energy has to pass through the glass, the air and the glass again.
  - rung: 3
    name: first_step
    text:
      en: Remember that energy always flows from hotter to colder, and that nothing called 'cold' flows.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options where an insulator makes heat or where particles travel through a solid.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Air is a much poorer conductor than glass.'
  misconception_ids:
  - mc.phy.o.cold_transferred_as_substance
  - mc.phy.o.conduction_particles_travel
  - mc.phy.o.insulator_produces_heat
solution:
  steps:
  - n: 1
    latex: \text{Air is a much poorer conductor than glass}
    reason: Apply the model of conduction
