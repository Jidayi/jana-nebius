subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.parallel_circuits
stem: Lerato has some 12 Ω resistors, all the same. She joins them up in five different ways.
parts:
- id: a
  prompt: Put the five ways in order of total resistance, smallest first.
  marks: 2
  answer:
    kind: ordering
    scoring: exact
    elements:
    - id: e3
      text: One resistor on its own
    - id: e4
      text: One resistor in series with a parallel pair
    - id: e5
      text: Two resistors in series
    - id: e1
      text: Three resistors in parallel
    - id: e2
      text: Two resistors in parallel
    correct_order:
    - e1
    - e2
    - e3
    - e4
    - e5
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Adding a resistor in series makes the total bigger; adding one in parallel makes it smaller.
  - rung: 2
    name: concept
    text:
      en: 'Equal resistors in parallel: divide one resistance by how many there are.'
  - rung: 3
    name: first_step
    text:
      en: Three in parallel give 4 Ω and two in parallel give 6 Ω.
  - rung: 4
    name: worked_step
    text:
      en: One in series with a parallel pair is 12 Ω + 6 Ω = 18 Ω; two in series are 24 Ω.
  - rung: 5
    name: full_step
    text:
      en: 'In order: 4 Ω, 6 Ω, 12 Ω, 18 Ω, 24 Ω.'
solution:
  steps:
  - n: 1
    latex: \frac{12}{3} = 4,\ \frac{12}{2} = 6,\ 12,\ 18,\ 24\ \Omega
    reason: Parallel lowers the resistance; series raises it
    check_id: chk_build_phy_cir_0021_t
