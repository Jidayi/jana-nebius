id: itm.phy.o.wave_properties.0058
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.wave_properties.wave_behaviour
stem: A harbour entrance is made much wider.
parts:
- id: a
  prompt: What happens to the waves that come through it?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: They spread out more
      correct: false
      misconception_id: mc.phy.o.diffraction_wider_gap_more
      feedback: Spreading is greatest when the gap is about one wavelength wide. A gap many wavelengths wide lets the waves through almost straight.
    - id: B
      text: They spread out by the same amount as before
      correct: false
      misconception_id: mc.phy.o.diffraction_independent_of_gap
      feedback: 'Compare the gap with the wavelength: about the same size gives a lot of spreading; much wider gives very little.'
    - id: C
      text: They spread out less
      correct: true
    - id: D
      text: Their wavelength gets longer
      correct: false
      misconception_id: mc.phy.o.diffraction_changes_wavelength
      feedback: Diffraction changes only the direction and shape of the wavefronts. The water depth is the same, so the speed, wavelength and frequency are too.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Spreading through a gap depends on the gap compared with the wavelength.
  - rung: 2
    name: concept
    text:
      en: The most spreading happens when the gap is about one wavelength wide.
  - rung: 3
    name: first_step
    text:
      en: A gap many wavelengths wide lets the waves through almost straight.
  - rung: 4
    name: worked_step
    text:
      en: Decide which way the change in width pushes the spreading.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: They spread out less.'
  misconception_ids:
  - mc.phy.o.diffraction_changes_wavelength
  - mc.phy.o.diffraction_independent_of_gap
  - mc.phy.o.diffraction_wider_gap_more
solution:
  steps:
  - n: 1
    latex: \text{They spread out less}
    reason: Match the effect to what changes and what stays the same
