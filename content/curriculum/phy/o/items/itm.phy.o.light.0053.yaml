stem: Diamond has a refractive index of 2.42 and ordinary glass about 1.5.
parts:
- id: a
  prompt: How does the critical angle of diamond compare with that of glass?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It is the same, because every material has the same critical angle
      correct: false
      misconception_id: mc.phy.o.critical_angle_same_for_all
      feedback: sin C = 1 ÷ n, so a material with a bigger refractive index has a smaller critical angle. Diamond's is about 24°, water's about 49°.
    - id: B
      text: It is smaller, so light is trapped inside diamond more easily
      correct: true
    - id: C
      text: It is larger, because n = sin C
      correct: false
      misconception_id: mc.phy.o.critical_sine_not_inverted
      feedback: sin C = 1 ÷ n, so n = 1 ÷ sin C. A refractive index is more than one, while a sine is never more than one.
    - id: D
      text: It is larger, because light can be trapped only when it enters the diamond from air
      correct: false
      misconception_id: mc.phy.o.tir_from_air_into_glass
      feedback: Going into glass, light bends towards the normal, so there is always a refracted ray. Total internal reflection needs light inside the denser material, heading out.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Total internal reflection needs two conditions.
  - rung: 2
    name: concept
    text:
      en: The light must be inside the denser material heading out, and its angle of incidence must be bigger than the critical angle.
  - rung: 3
    name: first_step
    text:
      en: sin C = 1 ÷ n, so a bigger refractive index gives a smaller critical angle.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against both conditions.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It is smaller, so light is trapped inside diamond more easily.'
  misconception_ids:
  - mc.phy.o.critical_angle_same_for_all
  - mc.phy.o.critical_sine_not_inverted
  - mc.phy.o.tir_from_air_into_glass
