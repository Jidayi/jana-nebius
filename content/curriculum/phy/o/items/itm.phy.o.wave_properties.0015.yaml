id: itm.phy.o.wave_properties.0015
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.wave_properties.describing_waves
stem: A labelled drawing of a wave on a rope shows 4 complete waves along a length of 60 cm. The vertical distance from the top of a crest to the bottom of a trough is 5 cm.
parts:
- id: a
  prompt: Find the wavelength of the wave.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 60 cm
      correct: false
      misconception_id: mc.phy.o.wavelength_whole_diagram
      feedback: Count how many complete waves fit in the length shown, then share the length equally among them.
    - id: B
      text: 7.5 cm
      correct: false
      misconception_id: mc.phy.o.wavelength_crest_to_trough
      feedback: 'One wavelength is one whole wave: from a crest to the next crest, or a trough to the next trough. A crest to the next trough is only half of it.'
    - id: C
      text: 2.5 cm
      correct: false
      misconception_id: mc.phy.o.amplitude_wavelength_swapped
      feedback: Amplitude is a height, measured up from the rest line. Wavelength is a length, measured along the direction the wave travels.
    - id: D
      text: 15 cm
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A wavelength is the length of one complete wave.
  - rung: 2
    name: concept
    text:
      en: Measure it along the wave, from one crest to the next crest.
  - rung: 3
    name: first_step
    text:
      en: The 60 cm holds 4 waves.
  - rung: 4
    name: worked_step
    text:
      en: Divide 60 by 4.
  - rung: 5
    name: full_step
    text:
      en: λ = 15 cm.
  misconception_ids:
  - mc.phy.o.amplitude_wavelength_swapped
  - mc.phy.o.wavelength_crest_to_trough
  - mc.phy.o.wavelength_whole_diagram
solution:
  steps:
  - n: 1
    latex: \lambda = \frac{60}{4} = 15\ \text{cm}
    reason: Share the length equally among the waves
    check_id: chk_build_phy_wav_0015_ans
