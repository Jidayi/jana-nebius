id: itm.phy.o.stars.0043
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.stars.expanding_universe
stem: Galaxy A is twice as far from us as galaxy B.
parts:
- id: a
  prompt: How do their redshifts compare?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: B has the greater redshift
      correct: false
      misconception_id: mc.phy.o.nearer_galaxies_recede_faster
      feedback: 'Recession speed is proportional to distance: a galaxy twice as far away recedes twice as fast and has twice the redshift.'
    - id: B
      text: Their redshifts are the same
      correct: false
      misconception_id: mc.phy.o.galaxies_recede_at_same_speed
      feedback: Redshift grows with distance. In an expanding Universe the space between us and a far galaxy stretches more, so it recedes faster.
    - id: C
      text: A looks redder in colour, but its spectrum is not shifted
      correct: false
      misconception_id: mc.phy.o.redshift_means_galaxy_red
      feedback: Redshift is a shift of the whole spectrum, including the dark lines, towards longer wavelengths. A blue star in a receding galaxy is still redshifted.
    - id: D
      text: A has the greater redshift
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what redshift tells us about how galaxies move.
  - rung: 2
    name: concept
    text:
      en: Redshift is a stretch of light to longer wavelengths, caused by a galaxy moving away from us.
  - rung: 3
    name: first_step
    text:
      en: 'More distant galaxies show more redshift, so they recede faster: the Universe is expanding from a hot, dense start.'
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these ideas.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: A has the greater redshift.'
  misconception_ids:
  - mc.phy.o.galaxies_recede_at_same_speed
  - mc.phy.o.nearer_galaxies_recede_faster
  - mc.phy.o.redshift_means_galaxy_red
solution:
