id: itm.phy.o.radioactivity.0074
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.uses_and_safety
stem: A medical tracer must have a suitable half-life.
parts:
- id: a
  prompt: Which is the best description?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: As short as possible, even a few seconds, to be safe
      correct: false
      misconception_id: mc.phy.o.shortest_half_life_best
      feedback: A tracer with a half-life of a few seconds would have almost gone before the scan began. The half-life must be long enough for the job.
    - id: B
      text: As long as possible, so the tracer lasts
      correct: false
      misconception_id: mc.phy.o.tracer_long_half_life
      feedback: A tracer is needed only for hours. A long half-life would leave the patient or the ground radioactive for years.
    - id: C
      text: Long enough to finish the scan, short enough to fade soon after
      correct: true
    - id: D
      text: It does not matter, as cooling the patient slows the decay
      correct: false
      misconception_id: mc.phy.o.decay_rate_changed_by_conditions
      feedback: Radioactive decay happens inside the nucleus and is not changed by temperature, pressure or chemical reactions.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Two things decide the choice: the kind of radiation and the half-life.'
  - rung: 2
    name: concept
    text:
      en: The radiation must reach where it is needed and be partly absorbed if a change is to be measured; the half-life must suit how long the job lasts.
  - rung: 3
    name: first_step
    text:
      en: Think about what happens if the tracer fades too fast, and if it lasts too long.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that fail on either point, or that would put people at risk.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Long enough to finish the scan, short enough to fade soon after.'
  misconception_ids:
  - mc.phy.o.decay_rate_changed_by_conditions
  - mc.phy.o.shortest_half_life_best
  - mc.phy.o.tracer_long_half_life
solution:
  steps:
  - n: 1
    latex: \text{Long enough to finish the scan, short enough to fade soon after}
    reason: Match the radiation and half-life to the job
