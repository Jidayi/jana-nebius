id: itm.phy.o.momentum.0026
version: 0.1.1
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.momentum.conservation_of_momentum
stem: A boy jumps forwards from a rowing boat that is at rest on still water.
parts:
- id: a
  prompt: Why does the boat move backwards?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: The boat gets momentum in the same direction as the boy
      correct: false
      misconception_id: mc.phy.o.recoil_sign_dropped
      feedback: 'The total momentum before the jump is zero, so afterwards the two momenta must cancel: one of the velocities is negative.'
    - id: B
      text: The jump creates extra momentum that pushes the boat
      correct: false
      misconception_id: mc.phy.o.explosion_creates_momentum
      feedback: The push between the boy and the boat is a pair of equal and opposite internal forces, so they give equal and opposite momenta. The total stays what it was before.
    - id: C
      text: The boy and boat get equal and opposite momenta, keeping the total zero
      correct: true
    - id: D
      text: The boat moves back as fast as the boy moves forwards
      correct: false
      misconception_id: mc.phy.o.recoil_equal_speeds
      feedback: The boat moves back as fast as the boy only if their masses are equal. Equal and opposite momenta mean the heavier part moves more slowly.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about the total momentum of everything involved, before and after.
  - rung: 2
    name: concept
    text:
      en: In a collision or explosion with no outside forces, total momentum is conserved; momentum has a sign.
  - rung: 3
    name: first_step
    text:
      en: Compare the total momentum before with the total momentum after.
  - rung: 4
    name: worked_step
    text:
      en: The total momentum before the jump was zero.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The boy and boat get equal and opposite momenta, keeping the total zero. The forward momentum of the boy is balanced by an equal backward momentum of the boat.'
  misconception_ids:
  - mc.phy.o.explosion_creates_momentum
  - mc.phy.o.recoil_equal_speeds
  - mc.phy.o.recoil_sign_dropped
solution:
  steps:
  - n: 1
    latex: \text{The boy and boat get equal and opposite momenta, keeping the total zero}
    reason: Apply conservation of momentum
