id: itm.phy.o.light.0045
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.light.speed_in_medium
stem: A ray passes from air into a clear plastic block. The angle of incidence is 50° and the angle of refraction is 28°.
parts:
- id: a
  prompt: Calculate the speed of light in the plastic, in km/s.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 490000 km/s
      correct: false
      misconception_id: mc.phy.o.light_speed_times_index
      feedback: 'Nothing travels faster than light in a vacuum. A material slows light down, so divide c by the refractive index: the bigger n is, the slower the light.'
    - id: B
      text: 184000 km/s
      correct: true
    - id: C
      text: 300000 km/s
      correct: false
      misconception_id: mc.phy.o.light_speed_same_in_material
      feedback: Light only travels at 3.0 × 10⁸ m/s in a vacuum (and almost that in air). Refraction happens because light is slower in glass or water.
    - id: D
      text: 412000 km/s
      correct: false
      misconception_id: mc.phy.o.refraction_angles_from_surface
      feedback: Draw the normal at right angles to the surface where the ray crosses it. Every angle in the refraction formula is measured from that normal.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Two steps: find the refractive index, then use it to find the speed.'
  - rung: 2
    name: concept
    text:
      en: n = sin i ÷ sin r, and then v = c ÷ n.
  - rung: 3
    name: first_step
    text:
      en: Work out sin 50° ÷ sin 28°.
  - rung: 4
    name: worked_step
    text:
      en: n = 1.63; divide the speed of light, 300000 km/s, by it.
  - rung: 5
    name: full_step
    text:
      en: The speed of light in the plastic is 184000 km/s.
  misconception_ids:
  - mc.phy.o.light_speed_same_in_material
  - mc.phy.o.light_speed_times_index
  - mc.phy.o.refraction_angles_from_surface
solution:
  steps:
  - n: 1
    latex: n = \frac{\sin 50^\circ}{\sin 28^\circ} = 1.63
    reason: Refractive index from the angles
    check_id: chk_build_phy_lgt_0045_n
  - n: 2
    latex: c = 3.0 \times 10^{8}\ \text{m/s} = 300000\ \text{km/s}
    reason: c in km/s
    check_id: chk_build_phy_lgt_0045_ckm
  - n: 3
    latex: v = \frac{c}{n} = \frac{300000}{1.63} = 184000\ \text{km/s}
    reason: Speed in the material
    check_id: chk_build_phy_lgt_0045_ans
