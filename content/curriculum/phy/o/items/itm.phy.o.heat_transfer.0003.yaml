id: itm.phy.o.heat_transfer.0003
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.heat_transfer.conduction
stem: Equal rods of copper and glass each have a wax bead stuck to one end, and their other ends are heated equally.
parts:
- id: a
  prompt: Which bead falls off first, and why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The bead on the glass, because glass is colder
      correct: false
      misconception_id: mc.phy.o.metal_feels_colder_because_colder
      feedback: Objects left in the same room reach the same temperature. Metal feels colder because it conducts energy away from your hand much faster.
    - id: B
      text: Both together, because both conduct only by vibrations
      correct: false
      misconception_id: mc.phy.o.metal_conduction_vibration_only
      feedback: All solids pass energy on by vibrations, but this is slow. Metals also have free electrons that move quickly through the metal and carry energy fast.
    - id: C
      text: The bead on the copper, because copper atoms flow along to the bead
      correct: false
      misconception_id: mc.phy.o.conduction_particles_travel
      feedback: In a solid the atoms stay in place and pass vibrations to their neighbours; in a metal, free electrons also carry energy. The material itself does not flow along.
    - id: D
      text: The bead on the copper, because copper conducts much better
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Conduction passes energy through a material without the material itself moving.
  - rung: 2
    name: concept
    text:
      en: The wax melts when enough energy reaches the cool end of the rod.
  - rung: 3
    name: first_step
    text:
      en: Remember that energy always flows from hotter to colder, and that nothing called 'cold' flows.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options where an insulator makes heat or where particles travel through a solid.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The bead on the copper, because copper conducts much better.'
  misconception_ids:
  - mc.phy.o.conduction_particles_travel
  - mc.phy.o.metal_conduction_vibration_only
  - mc.phy.o.metal_feels_colder_because_colder
solution:
  steps:
  - n: 1
    latex: \text{The bead on the copper, because copper conducts much better}
    reason: Apply the model of conduction
