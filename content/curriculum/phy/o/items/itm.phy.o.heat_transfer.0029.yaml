id: itm.phy.o.heat_transfer.0029
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.heat_transfer.convection
stem: Smoke from a fire rises up a chimney.
parts:
- id: a
  prompt: What makes the hot gases rise?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Each hot gas particle becomes lighter
      correct: false
      misconception_id: mc.phy.o.particles_have_bulk_properties
      feedback: A single particle does not melt, feel hot or have a colour. Those are properties of huge numbers of particles together, set by how they are arranged and how fast they move.
    - id: B
      text: They are less dense than the cooler air around them
      correct: true
    - id: C
      text: Heat rises and drags the smoke along
      correct: false
      misconception_id: mc.phy.o.heat_itself_rises
      feedback: 'Energy has no up or down. In convection the fluid moves: warmer, less dense fluid is pushed upwards by cooler, denser fluid sinking beneath it.'
    - id: D
      text: The chimney bricks pass the gases upwards by convection
      correct: false
      misconception_id: mc.phy.o.convection_in_solids
      feedback: Convection needs the material itself to move as a current. Particles in a solid stay in place, so solids pass energy on by conduction, not convection.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Convection is the movement of a warm fluid carrying energy with it.
  - rung: 2
    name: concept
    text:
      en: Compare the hot gases with the air around them.
  - rung: 3
    name: first_step
    text:
      en: Ask what happens to the density of a fluid when it is heated or cooled.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options where heat moves by itself or a solid flows.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: They are less dense than the cooler air around them.'
  misconception_ids:
  - mc.phy.o.convection_in_solids
  - mc.phy.o.heat_itself_rises
  - mc.phy.o.particles_have_bulk_properties
solution:
  steps:
  - n: 1
    latex: \text{They are less dense than the cooler air around them}
    reason: Explain the current by changes in density
