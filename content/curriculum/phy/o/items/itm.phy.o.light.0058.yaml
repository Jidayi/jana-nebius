stem: The refractive index of crown glass is 1.52.
parts:
- id: a
  prompt: Calculate the critical angle for light inside crown glass meeting a boundary with air.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 48.9°
      correct: false
      misconception_id: mc.phy.o.refraction_angles_from_surface
      feedback: Draw the normal at right angles to the surface where the ray crosses it. Every angle in the refraction formula is measured from that normal.
    - id: B
      text: 59.2°
      correct: false
      misconception_id: mc.phy.o.snell_angles_not_sines
      feedback: 'Angles do not scale in proportion here: doubling an angle does not double its sine. Take the sine of each angle first, then use the ratio.'
    - id: C
      text: 41.1°
      correct: true
    - id: D
      text: 0.658°
      correct: false
      misconception_id: mc.phy.o.snell_inverse_sine_missed
      feedback: A sine is a ratio between 0 and 1, not an angle. Once you have sin r, press the inverse sine to turn it into an angle in degrees.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The critical angle is the angle of incidence inside the material that sends the refracted ray along the surface.
  - rung: 2
    name: concept
    text:
      en: sin C = 1 ÷ n.
  - rung: 3
    name: first_step
    text:
      en: Work out 1 ÷ 1.52.
  - rung: 4
    name: worked_step
    text:
      en: sin C = 0.658; now take the inverse sine.
  - rung: 5
    name: full_step
    text:
      en: The critical angle is 41.1°.
  misconception_ids:
  - mc.phy.o.refraction_angles_from_surface
  - mc.phy.o.snell_angles_not_sines
  - mc.phy.o.snell_inverse_sine_missed
solution:
  steps:
  - n: 1
    latex: \sin C = \frac{1}{1.52} = 0.658
    reason: sin C = 1 / n
    check_id: chk_build_phy_lgt_0058_sc
  - n: 2
    latex: C = \sin^{-1}(0.658) = 41.1^\circ
    reason: Inverse sine
    check_id: chk_build_phy_lgt_0058_ans
