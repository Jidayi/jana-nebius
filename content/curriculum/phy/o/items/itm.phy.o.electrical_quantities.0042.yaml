id: itm.phy.o.electrical_quantities.0042
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.potential_difference
stem: The p.d. across a heater is 230 V.
parts:
- id: a
  prompt: What does this tell you?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 230 V of voltage flows through the heater each second
      correct: false
      misconception_id: mc.phy.o.pd_flows_through_component
      feedback: Current flows through a lamp; p.d. is across it. That is why a voltmeter is connected across, in parallel.
    - id: B
      text: Each charge is pushed through by a force of 230 N
      correct: false
      misconception_id: mc.phy.o.emf_is_a_force
      feedback: Despite its name, e.m.f. is not a force. It is the energy the cell transfers to each coulomb, so its unit is the volt (a joule per coulomb).
    - id: C
      text: Each coulomb passing through transfers 230 J to the heater
      correct: true
    - id: D
      text: 230 C of charge are used up in the heater each second
      correct: false
      misconception_id: mc.phy.o.charge_used_up_in_lamp
      feedback: Ammeters before and after a lamp read the same. The charges keep flowing; what they lose in the lamp is energy.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what a volt measures.
  - rung: 2
    name: concept
    text:
      en: P.d. and e.m.f. both measure the energy transferred per unit charge, and charge is never used up.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: A volt is a joule per coulomb.
  - rung: 5
    name: full_step
    text:
      en: Each coulomb passing through transfers 230 J to the heater. A volt is a joule per coulomb.
  misconception_ids:
  - mc.phy.o.charge_used_up_in_lamp
  - mc.phy.o.emf_is_a_force
  - mc.phy.o.pd_flows_through_component
