  prompt: How does the Sun release its energy?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Burning hydrogen gas in oxygen, like a flame
      correct: false
      misconception_id: mc.phy.o.stars_shine_by_burning
      feedback: There is no oxygen fire in a star. In its core hydrogen nuclei fuse into helium, releasing far more energy than any chemical burning could.
    - id: B
      text: Nuclear fission of uranium, as in a power station
      correct: false
      misconception_id: mc.phy.o.star_energy_from_fission
      feedback: Power stations split heavy nuclei (fission). Stars join light nuclei such as hydrogen into heavier ones (fusion).
    - id: C
      text: Burning coal-like solid fuel in its core
      correct: false
      misconception_id: mc.phy.o.stars_shine_by_burning
      feedback: There is no oxygen fire in a star. In its core hydrogen nuclei fuse into helium, releasing far more energy than any chemical burning could.
