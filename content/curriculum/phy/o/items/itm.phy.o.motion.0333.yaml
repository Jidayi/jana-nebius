- kc.phy.o.motion.solve_with_equation
stem: A boat moving at 6 m/s accelerates uniformly at 1.5 m/s² for 6 s.
parts:
- id: a
  prompt: Use s = ut + ½at² to find how far it travels in this time.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 90 m
      correct: false
      misconception_id: mc.phy.o.half_left_out
      feedback: The acceleration term is half of a times t squared. Under a velocity-time graph it is a triangle, and a triangle's area has a half in it.
    - id: B
      text: 63 m
      correct: true
    - id: C
      text: 9 m
      correct: false
      misconception_id: mc.phy.o.rearrange_sign_error
      feedback: 'Undo each step in turn: what was added on one side is subtracted from both.'
    - id: D
      text: 27 m
      correct: false
      misconception_id: mc.phy.o.initial_velocity_term_dropped
      feedback: s = ½at² is only for an object starting from rest. With a starting velocity u, the object also covers ut.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'List the known quantities: u, a and t.'
  - rung: 2
    name: concept
    text:
      en: The boat did not start from rest, so both terms matter.
  - rung: 3
    name: first_step
    text:
      en: Work out ut and ½at² separately.
  - rung: 4
    name: worked_step
    text:
      en: ut = 36 m and ½at² = 27 m.
  - rung: 5
    name: full_step
    text:
      en: s = 63 m.
  misconception_ids:
  - mc.phy.o.half_left_out
  - mc.phy.o.initial_velocity_term_dropped
  - mc.phy.o.rearrange_sign_error
solution:
  steps:
  - n: 1
    latex: ut = 6 \times 6 = 36
    reason: Distance from the starting velocity
    check_id: chk_build_phy_mot_0333_ut
  - n: 2
    latex: \tfrac{1}{2}at^2 = \tfrac{1}{2} \times 1.5 \times 6^2 = 27
    reason: Extra distance from the acceleration
    check_id: chk_build_phy_mot_0333_at
  - n: 3
    latex: s = 36 + 27 = 63\ \text{m}
    reason: Add
    check_id: chk_build_phy_mot_0333_ans
