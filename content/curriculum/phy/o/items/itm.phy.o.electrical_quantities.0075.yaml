id: itm.phy.o.electrical_quantities.0075
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.resistance_of_wires
stem: A manganin wire 0.5 m long with a cross-sectional area of 0.4 mm² has a resistance of 3.6 Ω. A second manganin wire is 1.5 m long with a cross-sectional area of 0.2 mm².
parts:
- id: a
  prompt: Find the resistance of the second wire.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 5.4 Ω
      correct: false
      misconception_id: mc.phy.o.thicker_wire_more_resistance
      feedback: Two equal wires side by side carry twice the current for the same p.d., so doubling the area halves the resistance.
    - id: B
      text: 2.4 Ω
      correct: false
      misconception_id: mc.phy.o.longer_wire_less_resistance
      feedback: Two equal wires end to end are two resistors in series, so twice the length gives twice the resistance.
    - id: C
      text: 3.6 Ω
      correct: false
      misconception_id: mc.phy.o.resistance_set_by_material_only
      feedback: A longer piece of the same wire has more resistance and a thicker piece less. The material is only one of the factors.
    - id: D
      text: 21.6 Ω
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Two things change: the length and the cross-sectional area.'
  - rung: 2
    name: concept
    text:
      en: Resistance is proportional to length and inversely proportional to area.
  - rung: 3
    name: first_step
    text:
      en: Multiply by the length ratio (new over old) and by the area ratio (old over new).
  - rung: 4
    name: worked_step
    text:
      en: The length ratio is 3 and the area ratio is 2.
  - rung: 5
    name: full_step
    text:
      en: R = 3.6 × 3 × 2 = 21.6 Ω.
  misconception_ids:
  - mc.phy.o.longer_wire_less_resistance
  - mc.phy.o.resistance_set_by_material_only
  - mc.phy.o.thicker_wire_more_resistance
solution:
  steps:
  - n: 1
    latex: \frac{1.5}{0.5} = 3
    reason: R is proportional to length
    check_id: chk_build_phy_elq_0075_lr
  - n: 2
    latex: \frac{0.4}{0.2} = 2
    reason: R is inversely proportional to area
    check_id: chk_build_phy_elq_0075_ar
  - n: 3
    latex: R = 3.6 \times 3 \times 2 = 21.6\ \Omega
    reason: Apply both changes
    check_id: chk_build_phy_elq_0075_ans
