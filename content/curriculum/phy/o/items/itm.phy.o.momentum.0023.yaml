checks:
  chk_build_phy_mom_0023_ans:
    args:
      expression: (3*2 - 2*2)/(3 + 2)
    tool: math_evaluate
  chk_build_phy_mom_0023_mt:
    args:
      expression: 3 + 2
    tool: math_evaluate
  chk_build_phy_mom_0023_pb:
