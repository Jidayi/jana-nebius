    text:
      en: For each echo the sound goes there and back, so halve speed × time.
  - rung: 3
    name: first_step
    text:
      en: 'Nearer cliff: 204 m; further cliff: 425 m.'
  - rung: 4
    name: worked_step
    text:
      en: Obi is between the cliffs, so the two distances add.
  - rung: 5
    name: full_step
    text:
