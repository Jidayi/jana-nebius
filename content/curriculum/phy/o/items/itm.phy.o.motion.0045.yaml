  - mc.phy.o.kmh_conversion_inverted
solution:
  steps:
  - n: 1
    latex: v = \frac{v_{km/h}}{3.6}
    reason: 1 m/s is 3.6 km/h
  - n: 2
    latex: v = \frac{108}{3.6}
    reason: Substitute
  - n: 3
    latex: v = 30.0\ \text{m/s}
