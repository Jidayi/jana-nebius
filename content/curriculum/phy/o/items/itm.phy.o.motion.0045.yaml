stem: The speed of a cheetah is 108 km/h.
parts:
- id: a
  prompt: Convert this speed to metres per second.
  marks: 1
  answer:
    kind: numeric
    value: '30.0'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0045_a
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'You need the same speed in different units: metres per second instead of kilometres per hour.'
  - rung: 2
    name: concept
    text:
      en: 1 m/s is the same speed as 3.6 km/h, so a speed in m/s is the smaller number.
  - rung: 3
    name: first_step
    text:
      en: To go from km/h to m/s, divide by 3.6.
  - rung: 4
    name: worked_step
    text:
      en: Work out 108 ÷ 3.6.
  - rung: 5
    name: full_step
    text:
      en: 108 ÷ 3.6 = 30.0 m/s.
  misconception_ids:
