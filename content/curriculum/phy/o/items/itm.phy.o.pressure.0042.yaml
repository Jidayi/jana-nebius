id: itm.phy.o.pressure.0042
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.gas_and_atmospheric_pressure
stem: A mercury barometer has a column 756 mm high. Mercury has a density of 13600 kg/m³. Take g = 9.8 N/kg.
parts:
- id: a
  prompt: Calculate the atmospheric pressure, in kPa.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 101000 kPa
      correct: false
      misconception_id: mc.phy.o.barometer_mm_not_converted
      feedback: A column of 760 mm is 0.76 m. With the density in kg/m³ and g in N/kg, the height must be in metres.
    - id: B
      text: 7.41 kPa
      correct: false
      misconception_id: mc.phy.o.barometer_liquid_density_swapped
      feedback: 'Use the density of the liquid that is actually in the column: about 13 600 kg/m³ for mercury and 1000 kg/m³ for water.'
    - id: C
      text: 101 kPa
      correct: true
    - id: D
      text: 10.3 kPa
      correct: false
      misconception_id: mc.phy.o.liquid_pressure_g_left_out
      feedback: 'The pressure comes from the weight of the liquid above, so g is needed: pressure = ρ × g × h. Without g the answer is not in pascals.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The air pressure holds up the mercury column, so it equals the column's pressure.
  - rung: 2
    name: concept
    text:
      en: Pressure of the column = ρgh, with h in metres.
  - rung: 3
    name: first_step
    text:
      en: Change 756 mm into metres first.
  - rung: 4
    name: worked_step
    text:
      en: Work out 13600 × 9.8 × 0.756 in pascals, then change to kPa.
  - rung: 5
    name: full_step
    text:
      en: The atmospheric pressure is 101 kPa.
  misconception_ids:
  - mc.phy.o.barometer_liquid_density_swapped
  - mc.phy.o.barometer_mm_not_converted
  - mc.phy.o.liquid_pressure_g_left_out
solution:
  steps:
  - n: 1
    latex: h = 756\ \text{mm} = 0.756\ \text{m}
    reason: Height in metres
    check_id: chk_build_phy_prs_0042_hm
  - n: 2
    latex: p = \rho g h = 13600 \times 9.8 \times 0.756 = 101000\ \text{Pa}
    reason: Pressure = ρgh
    check_id: chk_build_phy_prs_0042_pa
  - n: 3
    latex: 101000\ \text{Pa} = 101\ \text{kPa}
    reason: Pascals into kilopascals
    check_id: chk_build_phy_prs_0042_ans
