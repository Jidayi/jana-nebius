subject: phy
level: o
kc_ids:
- kc.phy.o.motion.free_fall
stem: A coin is thrown straight up at 12 m/s. Take g = 9.8 m/s^2 and ignore air resistance.
parts:
- id: a
  prompt: How long does it take to reach the top?
  marks: 3
  answer:
    kind: numeric
    value: '1.2'
    unit: s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0143_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which way is the object moving, what is its speed at the start, and what is its acceleration?
  - rung: 2
    name: concept
    text:
      en: In free fall the acceleration is g downwards; take care with the sign if you call upwards positive.
  - rung: 3
    name: first_step
    text:
      en: At the top the speed is zero, so 0 = u − gt.
  - rung: 4
    name: worked_step
    text:
      en: t = 12 ÷ 9.8.
  - rung: 5
    name: full_step
    text:
      en: t = 12 ÷ 9.8 = 1.2 s.
  misconception_ids:
  - mc.phy.o.gravity_sign_flipped
  - mc.phy.o.top_speed_not_zero
solution:
  steps:
  - n: 1
    latex: 0 = u - gt
    reason: Uniform acceleration g with the right starting speed
  - n: 2
    latex: t = \frac{12}{9.8}
    reason: Substitute
  - n: 3
    latex: t = 1.2\ \text{s}
    reason: Evaluate
    check_id: chk_build_phy_k_0143_a
