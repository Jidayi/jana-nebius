id: itm.phy.o.pressure.0029
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.liquid_pressure
stem: A diver is 10 m below the surface of the sea. Another diver is 10 m below the surface of a freshwater lake.
parts:
- id: a
  prompt: Which statement about the pressure from the water is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It is the same, because only the depth matters
      correct: false
      misconception_id: mc.phy.o.liquid_density_ignored
      feedback: 'At the same depth a denser liquid has more mass above each square metre, so it presses harder: Δp = ρgΔh. Mercury is far denser than water, so a far shorter column of it balances the air.'
    - id: B
      text: It is greater in the sea, because sea water is denser
      correct: true
    - id: C
      text: It is greater in whichever holds more water
      correct: false
      misconception_id: mc.phy.o.liquid_pressure_depends_on_volume
      feedback: A narrow tube and a wide tank filled to the same depth with the same liquid have the same pressure at the bottom. Only the depth, the density and g count.
    - id: D
      text: It is zero for both, as it is the same at every depth
      correct: false
      misconception_id: mc.phy.o.liquid_pressure_same_at_all_depths
      feedback: Every metre further down has another metre of liquid pressing from above, so pressure grows with depth. That is why dams are thickest at the bottom.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Pressure in a liquid comes from the weight of the liquid above.
  - rung: 2
    name: concept
    text:
      en: Δp = ρgΔh has three factors; check which one differs.
  - rung: 3
    name: first_step
    text:
      en: Only the depth, the liquid's density and g decide the pressure from a liquid.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that depend on the amount or the shape of the liquid.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It is greater in the sea, because sea water is denser.'
  misconception_ids:
  - mc.phy.o.liquid_density_ignored
  - mc.phy.o.liquid_pressure_depends_on_volume
  - mc.phy.o.liquid_pressure_same_at_all_depths
solution:
  steps:
  - n: 1
    latex: \text{It is greater in the sea, because sea water is denser}
    reason: Pressure in a liquid depends on depth and density
