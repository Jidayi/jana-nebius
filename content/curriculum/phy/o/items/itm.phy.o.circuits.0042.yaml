id: itm.phy.o.circuits.0042
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.mixed_circuits
stem: An 8 Ω resistor is connected in series with a parallel pair made of a 24 Ω resistor and an 8 Ω resistor. The circuit is connected to a 9 V battery.
parts:
- id: a
  prompt: Calculate the total resistance of the circuit.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 40 Ω
      correct: false
      misconception_id: mc.phy.o.mixed_all_in_series
      feedback: Redraw the circuit and mark the junctions. Combine each parallel group first with 1/R = 1/R1 + 1/R2, then add the series parts.
    - id: B
      text: 6 Ω
      correct: false
      misconception_id: mc.phy.o.mixed_series_resistor_left_out
      feedback: All the current from the supply also passes through the series resistor, so its resistance adds to that of the parallel group.
    - id: C
      text: 14 Ω
      correct: true
    - id: D
      text: 3.43 Ω
      correct: false
      misconception_id: mc.phy.o.mixed_all_in_parallel
      feedback: Only resistors joined at both ends to the same two junctions are in parallel. Combine those first, then add any resistor in series.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the part of the circuit that is in parallel and deal with it first.
  - rung: 2
    name: concept
    text:
      en: Replace the parallel pair by its combined resistance, then add the series resistor.
  - rung: 3
    name: first_step
    text:
      en: For the pair, use (24 × 8) ÷ (24 + 8).
  - rung: 4
    name: worked_step
    text:
      en: The pair is 6 Ω; now add 8 Ω.
  - rung: 5
    name: full_step
    text:
      en: The total resistance is 14 Ω.
  misconception_ids:
  - mc.phy.o.mixed_all_in_parallel
  - mc.phy.o.mixed_all_in_series
  - mc.phy.o.mixed_series_resistor_left_out
solution:
  steps:
  - n: 1
    latex: R_p = \frac{24 \times 8}{24 + 8} = 6\ \Omega
    reason: Combine the parallel pair
    check_id: chk_build_phy_cir_0042_rp
  - n: 2
    latex: R = 8 + 6 = 14\ \Omega
    reason: Add the series resistor
    check_id: chk_build_phy_cir_0042_ans
