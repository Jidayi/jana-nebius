id: itm.phy.o.measurement.0044
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.measurement.resultant_vectors
stem: A plane flies north at 240 m/s while a wind blows it east at 70 m/s.
parts:
- id: a
  prompt: Find the angle between the plane's resultant velocity and due north.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 16.3°
      correct: true
    - id: B
      text: 73.7°
      correct: false
      misconception_id: mc.phy.o.resultant_angle_inverted
      feedback: Decide which vector the angle is measured from. The tangent of the angle is the side opposite the angle divided by the side next to it.
    - id: C
      text: 17.0°
      correct: false
      misconception_id: mc.phy.o.angle_uses_wrong_ratio
      feedback: 'Neither vector is the hypotenuse; the resultant is. With the two vectors, use tangent: opposite over adjacent.'
    - id: D
      text: 20.3°
      correct: false
      misconception_id: mc.phy.o.angle_shared_in_proportion
      feedback: Angles in a triangle do not grow in step with the sides. Use the tangent of the angle and then its inverse.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Draw the north vector, then the east vector from its tip; the resultant joins start to finish.
  - rung: 2
    name: concept
    text:
      en: The angle at the start is between north and the resultant.
  - rung: 3
    name: first_step
    text:
      en: The east vector is opposite this angle and the north vector is next to it.
  - rung: 4
    name: worked_step
    text:
      en: tan θ = 70 ÷ 240.
  - rung: 5
    name: full_step
    text:
      en: θ = 16.3°.
  misconception_ids:
  - mc.phy.o.angle_shared_in_proportion
  - mc.phy.o.angle_uses_wrong_ratio
  - mc.phy.o.resultant_angle_inverted
solution:
  steps:
  - n: 1
    latex: \tan\theta = \frac{70}{240} = 0.292
    reason: Opposite over adjacent, from north
    check_id: chk_build_phy_mea_0044_ratio
  - n: 2
    latex: \theta = 16.3^\circ
    reason: Inverse tangent
    check_id: chk_build_phy_mea_0044_ans
