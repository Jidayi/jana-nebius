stem: A transformer for a laptop adapter works from the 230 V mains. The primary coil has 920 turns and the output is 5 V.
parts:
- id: a
  prompt: Calculate the number of turns on the secondary coil.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 42320 turns
      correct: false
      misconception_id: mc.phy.o.turns_ratio_inverted
      feedback: 'The voltages are in the same ratio as the turns: Vs/Vp = Ns/Np. The coil with more turns has the larger voltage.'
    - id: B
      text: 4600 turns
      correct: false
      misconception_id: mc.phy.o.turns_ratio_not_divided
      feedback: 'Write Vs/Vp = Ns/Np and rearrange fully: Vs = Vp × Ns ÷ Np. Both numbers of turns are needed.'
    - id: C
      text: 0.0217 turns
      correct: false
      misconception_id: mc.phy.o.turns_ratio_given_as_answer
      feedback: The ratio only tells you how many times bigger or smaller. Multiply it by the known value to get the answer.
    - id: D
      text: 20 turns
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The voltages across the two coils are in the same ratio as their numbers of turns.
  - rung: 2
    name: concept
    text:
      en: Vs ÷ Vp = Ns ÷ Np.
  - rung: 3
    name: first_step
    text:
      en: Rearrange the equation to make Ns the subject.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 920 turns by 5 and divide by 230.
  - rung: 5
    name: full_step
    text:
      en: The secondary coil has 20 turns.
  misconception_ids:
  - mc.phy.o.turns_ratio_given_as_answer
  - mc.phy.o.turns_ratio_inverted
  - mc.phy.o.turns_ratio_not_divided
solution:
  steps:
  - n: 1
    latex: \frac{V_s}{V_p} = \frac{N_s}{N_p}
    reason: Voltages are in the ratio of the turns
  - n: 2
    latex: N_s = N_p \times \frac{V_s}{V_p} = 920 \times \frac{5}{230} = 20\ \text{turns}
    reason: Rearrange for N_s
    check_id: chk_build_phy_emg_0059_ans
