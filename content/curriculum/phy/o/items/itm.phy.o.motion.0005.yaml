  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Displacement is about where you end up compared with where you started, not how far you went.
  - rung: 2
    name: concept
    text:
      en: 'Add the parts of the journey with their directions: one way is positive, the other negative.'
  - rung: 3
    name: first_step
    text:
      en: Write the displacement as the first part minus the part that comes back.
  - rung: 4
    name: worked_step
    text:
      en: Work out 560 − 160.
  - rung: 5
    name: full_step
    text:
      en: Displacement = 560 − 160 = 400 m east.
  misconception_ids:
