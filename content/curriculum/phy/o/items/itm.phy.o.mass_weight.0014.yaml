stem: Sipho has a weight of 686 N on Earth. Take g = 9.8 N/kg.
parts:
- id: a
  prompt: Find Sipho's weight on Venus, where g = 8.9 N/kg.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 686 N
      correct: false
      misconception_id: mc.phy.o.weight_same_on_every_planet
      feedback: Weight is the pull of a planet on the object, weight = mass × g. A world with a smaller g pulls less on the same mass.
    - id: B
      text: 70 N
      correct: false
      misconception_id: mc.phy.o.weight_given_as_mass_number
      feedback: 'A bag of sugar pulls on your hand much less on the Moon than on Earth, yet it holds the same sugar. Weight is a force: multiply the mass by g to get it, and divide a weight by g to get the mass.'
    - id: C
      text: 623 N
      correct: true
    - id: D
      text: 755 N
      correct: false
      misconception_id: mc.phy.o.planet_g_ratio_inverted
      feedback: Weight is proportional to g. Moving to a place with a weaker field must give a smaller weight, so check that your answer moves the right way.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The mass is the same everywhere; the weight is not.
  - rung: 2
    name: concept
    text:
      en: Find the mass from the Earth weight, then use the g for the new place.
  - rung: 3
    name: first_step
    text:
      en: Mass = 686 ÷ 9.8.
  - rung: 4
    name: worked_step
    text:
      en: The mass is 70 kg; multiply it by 8.9.
  - rung: 5
    name: full_step
    text:
      en: Sipho's weight on Venus is 623 N.
  misconception_ids:
  - mc.phy.o.planet_g_ratio_inverted
  - mc.phy.o.weight_given_as_mass_number
  - mc.phy.o.weight_same_on_every_planet
solution:
  steps:
  - n: 1
    latex: m = \frac{686}{9.8} = 70\ \text{kg}
    reason: Find the mass from the Earth weight
