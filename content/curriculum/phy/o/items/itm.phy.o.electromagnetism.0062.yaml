id: itm.phy.o.electromagnetism.0062
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.electromagnetism.power_transmission
stem: A transformer takes 0.5 A from a 240 V supply. Its secondary coil gives 4.8 A at 24 V.
parts:
- id: a
  prompt: Calculate the efficiency of the transformer.
  marks: 3
  answer:
    kind: numeric
    value: '96'
    unit: '%'
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_emg_0062_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Efficiency compares the useful power out with the power in.
  - rung: 2
    name: concept
    text:
      en: Each power is p.d. × current.
  - rung: 3
    name: first_step
    text:
      en: Find the power in and the power out, then divide output by input.
  - rung: 4
    name: worked_step
    text:
      en: The power in is 120 W and the power out is 115.2 W.
  - rung: 5
    name: full_step
    text:
      en: Efficiency = 115.2 ÷ 120 = 0.96, which is 96%.
  misconception_ids:
  - mc.phy.o.efficiency_upside_down
  - mc.phy.o.efficiency_from_voltages
  - mc.phy.o.efficiency_left_as_fraction
solution:
  steps:
  - n: 1
    latex: P_{in} = 240 \times 0.5 = 120\ \text{W}
    reason: Power in = p.d. × current
    check_id: chk_build_phy_emg_0062_pin
  - n: 2
    latex: P_{out} = 24 \times 4.8 = 115.2\ \text{W}
    reason: Power out = p.d. × current
    check_id: chk_build_phy_emg_0062_pout
  - n: 3
    latex: \frac{115.2}{120} = 0.96
    reason: Output power over input power
    check_id: chk_build_phy_emg_0062_frac
  - n: 4
    latex: 0.96 \rightarrow 96\%
    reason: Multiply by a hundred for a percentage
    check_id: chk_build_phy_emg_0062_ans
