id: itm.phy.o.sound.0056
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.sound.ultrasound
stem: During a scan, an ultrasound pulse reflects from the boundary of an organ. The echo returns 100 µs after the pulse was sent. Ultrasound travels at 1540 m/s in soft tissue.
parts:
- id: a
  prompt: How deep is the boundary below the probe, in centimetres?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 7.7 cm
      correct: true
    - id: B
      text: 15.4 cm
      correct: false
      misconception_id: mc.phy.o.echo_not_halved
      feedback: 'Draw the path: the sound goes to the reflector and comes back. The echo time covers twice the distance to the reflector.'
    - id: C
      text: 30.8 cm
      correct: false
      misconception_id: mc.phy.o.echo_halving_misapplied
      feedback: The sound covers twice the distance to the reflector, so the distance to it is half of speed × time.
    - id: D
      text: 7700000 cm
      correct: false
      misconception_id: mc.phy.o.wave_prefix_ignored
      feedback: Put every value into hertz, metres and seconds before using a formula, then change the answer into the unit the question asks for.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Put the time in seconds before using the speed.
  - rung: 2
    name: concept
    text:
      en: The pulse goes to the boundary and back, so the boundary is half the distance travelled.
  - rung: 3
    name: first_step
    text:
      en: 100 µs = 0.0001 s.
  - rung: 4
    name: worked_step
    text:
      en: d = 1540 × 0.0001 ÷ 2 in metres; then change to centimetres.
  - rung: 5
    name: full_step
    text:
      en: The boundary is 7.7 cm deep.
  misconception_ids:
  - mc.phy.o.echo_halving_misapplied
  - mc.phy.o.echo_not_halved
  - mc.phy.o.wave_prefix_ignored
solution:
  steps:
  - n: 1
    latex: t = 100\ \mu\text{s} = 0.0001\ \text{s}
    reason: A microsecond is a millionth of a second
    check_id: chk_build_phy_snd_0056_ts
  - n: 2
    latex: d = \frac{1540 \times 0.0001}{2} = 0.077\ \text{m}
    reason: Half the there-and-back distance
    check_id: chk_build_phy_snd_0056_dm
  - n: 3
    latex: 0.077\ \text{m} = 7.7\ \text{cm}
    reason: A metre is a hundred centimetres
    check_id: chk_build_phy_snd_0056_ans
difficulty:
  prior: 0.5
  band: core
