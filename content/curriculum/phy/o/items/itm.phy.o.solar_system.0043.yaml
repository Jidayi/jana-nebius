stem: An astronaut in a spacesuit has a mass of 120 kg. The gravitational field strength on Venus is 8.9 N/kg.
parts:
- id: a
  prompt: Calculate the weight of the astronaut on Venus.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 1176 N
      correct: false
      misconception_id: mc.phy.o.planet_weight_uses_earth_g
      feedback: Weight = mass × the field strength where the object is. On Mars use Mars's g, not the Earth's.
    - id: B
      text: 13.5 N
      correct: false
      misconception_id: mc.phy.o.planet_weight_mass_over_g
      feedback: 'g is the force on each kilogram, so the weight is that force times the number of kilograms: W = mg.'
    - id: C
      text: 120 N
      correct: false
      misconception_id: mc.phy.o.planet_weight_given_as_mass
      feedback: Mass in kilograms and weight in newtons are different quantities. Multiply the mass by g to get the weight.
    - id: D
      text: 1068 N
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Weight is the pull of gravity on the mass.
  - rung: 2
    name: concept
    text:
      en: Weight = mass × gravitational field strength, W = mg.
  - rung: 3
    name: first_step
    text:
      en: Use the field strength on Venus, not the Earth's.
  - rung: 4
    name: worked_step
    text:
      en: Work out 120 × 8.9.
  - rung: 5
    name: full_step
    text:
      en: The weight on Venus is 1068 N.
  misconception_ids:
