id: itm.phy.o.sound.0048
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.sound.ultrasound
stem: A doctor spreads gel on a patient's skin before placing an ultrasound probe on it.
parts:
- id: a
  prompt: What is the gel for?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: To stop a layer of air reflecting the ultrasound before it enters the body
      correct: true
    - id: B
      text: To cool the skin, which the ultrasound heats like microwaves
      correct: false
      misconception_id: mc.phy.o.ultrasound_is_em
      feedback: 'Ultrasound is sound: a longitudinal vibration of particles that needs a medium. Only its frequency is beyond our hearing.'
    - id: C
      text: To absorb the ionising part of the radiation
      correct: false
      misconception_id: mc.phy.o.ultrasound_ionising
      feedback: Ultrasound is a sound wave, a vibration of particles. It does not ionise atoms, which is why it is used to scan unborn babies.
    - id: D
      text: To make the ultrasound loud enough to hear
      correct: false
      misconception_id: mc.phy.o.ultrasound_means_loud
      feedback: 'Ultra means beyond: ultrasound is beyond the top of our hearing range, above 20 kHz. It can be loud or quiet.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Ultrasound is sound with a frequency above the range of human hearing.
  - rung: 2
    name: concept
    text:
      en: It travels as compressions and rarefactions through a material, and reflects from boundaries between materials.
  - rung: 3
    name: first_step
    text:
      en: It does not ionise atoms, and a scanner builds its picture from the timing of echoes.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that treat ultrasound as something else.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: To stop a layer of air reflecting the ultrasound before it enters the body.'
  misconception_ids:
  - mc.phy.o.ultrasound_ionising
  - mc.phy.o.ultrasound_is_em
  - mc.phy.o.ultrasound_means_loud
