id: itm.phy.o.particles.0046
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.particles.pressure_and_volume
stem: Gas in a cylinder with a piston has a volume of 120 cm³ at a pressure of 160 kPa. It is slowly compressed to 75 cm³, at constant temperature.
parts:
- id: a
  prompt: Find the new pressure of the gas.
  marks: 2
  answer:
    kind: numeric
    value: '256'
    unit: kPa
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_ptc_0046_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The mass and temperature of the gas stay the same, so pressure × volume stays constant.
  - rung: 2
    name: concept
    text:
      en: Use p₁V₁ = p₂V₂, where p₂ and V₂ are the values after the change.
  - rung: 3
    name: first_step
    text:
      en: Work out p₁V₁ = 160 × 120 first.
  - rung: 4
    name: worked_step
    text:
      en: Divide 19200 by the new volume.
  - rung: 5
    name: full_step
    text:
      en: The new pressure is 256 kPa.
  misconception_ids:
  - mc.phy.o.boyle_direct_proportion
  - mc.phy.o.gas_pressure_unchanged
  - mc.phy.o.boyle_ratio_only
solution:
  steps:
  - n: 1
    latex: p_1V_1 = p_2V_2
    reason: 'Boyle''s law: fixed mass at constant temperature'
  - n: 2
    latex: p_1V_1 = 160 \times 120 = 19200
    reason: pV before the change
    check_id: chk_build_phy_ptc_0046_k
  - n: 3
    latex: p_2 = \frac{19200}{75} = 256\ \text{kPa}
    reason: Divide by the new volume
    check_id: chk_build_phy_ptc_0046_ans
