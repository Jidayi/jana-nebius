id: itm.phy.o.em_spectrum.0002
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.em_spectrum.order_and_properties
stem: All electromagnetic waves have some properties in common.
parts:
- id: a
  prompt: Which property do they all share?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: They have the same frequency
      correct: false
      misconception_id: mc.phy.o.em_same_wavelength
      feedback: 'They share the speed, so a higher frequency must go with a shorter wavelength: c = fλ stays the same.'
    - id: B
      text: They need a medium to travel through
      correct: false
      misconception_id: mc.phy.o.em_needs_medium
      feedback: Sunlight reaches the Earth across millions of kilometres of empty space. Electromagnetic waves travel through a vacuum.
    - id: C
      text: They travel at the same speed in a vacuum
      correct: true
    - id: D
      text: They are longitudinal waves
      correct: false
      misconception_id: mc.phy.o.light_called_longitudinal
      feedback: 'Every electromagnetic wave is transverse: its electric and magnetic fields vibrate at right angles to the direction it travels.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Start from the region with the longest wavelength and work towards the shortest.
  - rung: 2
    name: concept
    text:
      en: Frequency rises as wavelength falls, because every region has the same speed in a vacuum.
  - rung: 3
    name: first_step
    text:
      en: Every region is a transverse wave and can cross empty space.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that break the order or these shared properties.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: They travel at the same speed in a vacuum.'
  misconception_ids:
  - mc.phy.o.em_needs_medium
  - mc.phy.o.em_same_wavelength
  - mc.phy.o.light_called_longitudinal
solution:
  steps:
  - n: 1
    latex: \text{They travel at the same speed in a vacuum}
    reason: Recall the order and the shared properties of the spectrum
