id: itm.phy.o.forces.0097
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.centre_of_gravity
stem: A display cabinet is 140 cm tall with a base 36 cm wide. Its centre of gravity is 70 cm above the floor, above the middle of the base. It is tilted slowly about one bottom edge.
parts:
- id: a
  prompt: Find the angle from the vertical at which it just starts to topple.
  marks: 3
  answer:
    kind: numeric
    value: '14.4'
    unit: null
    unit_policy: none
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_frc_0097_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: It starts to topple when its centre of gravity is directly above the edge it tilts on.
  - rung: 2
    name: concept
    text:
      en: At that point the angle from the vertical has the half-width opposite it and the height of the centre of gravity next to it.
  - rung: 3
    name: first_step
    text:
      en: Use tan θ = half the base width ÷ height of the centre of gravity.
  - rung: 4
    name: worked_step
    text:
      en: tan θ = 18 ÷ 70 = 0.257.
  - rung: 5
    name: full_step
    text:
      en: θ = 14.4°; any further and its weight acts outside the base.
  misconception_ids:
  - mc.phy.o.tipping_full_base_width
  - mc.phy.o.tipping_ratio_inverted
  - mc.phy.o.tipping_object_height_used
solution:
  steps:
  - n: 1
    latex: \frac{36}{2} = 18\ \text{cm}
    reason: Horizontal distance from the centre of gravity to the edge
    check_id: chk_build_phy_frc_0097_half
  - n: 2
    latex: \tan\theta = \frac{18}{70} = 0.257
    reason: Topples when the centre of gravity is above the edge
    check_id: chk_build_phy_frc_0097_ratio
  - n: 3
    latex: \theta = 14.4^\circ
    reason: Inverse tangent
    check_id: chk_build_phy_frc_0097_ans
