stem: 'A student loads a spring 1 N at a time and records the extension: 0 N: 0 cm, 1 N: 1.5 cm, 2 N: 3 cm, 3 N: 4.5 cm, 4 N: 6.9 cm, 5 N: 10.2 cm.'
parts:
- id: a
  prompt: Up to which load does the extension stay proportional to the load?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: 5 N
      correct: false
      misconception_id: mc.phy.o.spring_proportional_beyond_limit
      feedback: Hang too much on a spring and it stretches far more than expected and may not spring back. Hooke's law only holds up to the limit of proportionality.
    - id: B
      text: 3 N
      correct: true
    - id: C
      text: 4 N
      correct: false
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Proportional means each extra newton adds the same extension.
  - rung: 2
    name: concept
    text:
      en: Work out how much the extension grows for each extra newton.
  - rung: 3
    name: first_step
    text:
      en: Find the first load where that step gets bigger.
  - rung: 4
    name: worked_step
    text:
      en: While the spring obeys Hooke's law each newton adds 1.5 cm.
  - rung: 5
    name: full_step
    text:
      en: The steps stay at 1.5 cm up to 3 N; after that they grow, so the limit is at 3 N.
  misconception_ids:
  - mc.phy.o.spring_proportional_beyond_limit
solution:
  steps:
  - n: 1
    latex: \text{equal steps in extension stop after the limit of proportionality}
    reason: Look for where the pattern changes
