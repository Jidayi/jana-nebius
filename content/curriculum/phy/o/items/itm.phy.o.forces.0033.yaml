id: itm.phy.o.forces.0033
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.friction_and_terminal_velocity
stem: A parachutist lands safely after falling at a low terminal velocity.
parts:
- id: a
  prompt: Why is her terminal velocity with the parachute open lower than without it?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The parachute lifts her, cancelling her weight
      correct: false
      misconception_id: mc.phy.o.parachute_sends_upwards
      feedback: A resultant force upwards on a falling skydiver slows the fall; it does not reverse it. The skydiver keeps falling, more slowly, until the forces balance again.
    - id: B
      text: The large canopy gives much more drag at each speed
      correct: true
    - id: C
      text: The parachute makes gravity weaker
      correct: false
    - id: D
      text: Drag does not depend on speed, so she slows by a fixed amount
      correct: false
      misconception_id: mc.phy.o.drag_independent_of_speed
      feedback: 'Put your hand out of a car window: the push of the air grows as the car goes faster. Drag rises with speed.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about which forces act and how big each one is at this moment.
  - rung: 2
    name: concept
    text:
      en: Friction and air resistance act against the motion, and air resistance grows as the speed grows.
  - rung: 3
    name: first_step
    text:
      en: Work out whether the forces are balanced and what that does to the speed.
  - rung: 4
    name: worked_step
    text:
      en: Terminal velocity is reached when drag equals weight.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The large canopy gives much more drag at each speed. With the canopy open, the drag balances her weight at a much lower speed.'
  misconception_ids:
  - mc.phy.o.drag_independent_of_speed
  - mc.phy.o.parachute_sends_upwards
solution:
  steps:
  - n: 1
    latex: \text{The large canopy gives much more drag at each speed}
    reason: Compare the forces and how they change
