id: itm.phy.o.density.0035
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.density.floating_and_sinking
stem: A steel ship floats, although steel has a density of about 7.9 g/cm³.
parts:
- id: a
  prompt: Which explains why it floats?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It should sink, as steel is denser than water; it floats only while moving
      correct: false
      misconception_id: mc.phy.o.hollow_object_density_of_material
      feedback: 'Use the average density: the total mass divided by the total volume, air included. A steel ship floats because most of its volume is air.'
    - id: B
      text: Large objects float, whatever they are made of
      correct: false
      misconception_id: mc.phy.o.volume_decides_floating
      feedback: 'Cut a piece of wood in half and both halves still float. Size does not decide it: compare the densities.'
    - id: C
      text: It is so heavy that the water pushes it up harder
      correct: false
      misconception_id: mc.phy.o.mass_decides_floating
      feedback: A huge tree trunk floats while a small pebble sinks. What counts is the mass in each unit of volume, the density, compared with the liquid's density.
    - id: D
      text: Its average density, counting the air inside the hull, is less than the water's
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Floating depends on densities, not on mass or size alone.
  - rung: 2
    name: concept
    text:
      en: Think about the whole ship, including all the space inside it.
  - rung: 3
    name: first_step
    text:
      en: Compare the density of the object with the density of the liquid.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that look only at how heavy or how big something is.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Its average density, counting the air inside the hull, is less than the water''s.'
  misconception_ids:
  - mc.phy.o.hollow_object_density_of_material
  - mc.phy.o.mass_decides_floating
  - mc.phy.o.volume_decides_floating
solution:
  steps:
  - n: 1
    latex: \text{Its average density, counting the air inside the hull, is less than the water's}
    reason: Compare the object's density with the liquid's
