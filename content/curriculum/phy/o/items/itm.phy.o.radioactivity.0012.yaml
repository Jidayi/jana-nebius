stem: Alpha and beta particles enter the same magnetic field.
parts:
- id: a
  prompt: Which is deflected more, and why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Beta, because its mass is far smaller
      correct: true
    - id: B
      text: Alpha, because its charge is bigger
      correct: false
      misconception_id: mc.phy.o.alpha_deflected_more
      feedback: An alpha particle has twice the charge but over seven thousand times the mass of a beta particle, so it is far harder to turn. Beta bends much more.
    - id: C
      text: Neither; only gamma is deflected
      correct: false
      misconception_id: mc.phy.o.gamma_deflected
      feedback: Only charged things are pushed sideways by electric and magnetic fields. Gamma rays carry no charge, so they go straight on.
    - id: D
      text: Beta, because it is positively charged
      correct: false
      misconception_id: mc.phy.o.beta_positive
      feedback: A beta particle is an electron, so it is negative. In a field it bends the opposite way to the positive alpha particles.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Think about what each radiation is: its mass and its charge.'
  - rung: 2
    name: concept
    text:
      en: Alpha is heavy and doubly charged; beta is a light, charged electron; gamma is an uncharged wave.
  - rung: 3
    name: first_step
    text:
      en: A small push turns a light object more easily than a heavy one.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that do not fit those properties.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Beta, because its mass is far smaller.'
  misconception_ids:
  - mc.phy.o.alpha_deflected_more
  - mc.phy.o.beta_positive
  - mc.phy.o.gamma_deflected
solution:
