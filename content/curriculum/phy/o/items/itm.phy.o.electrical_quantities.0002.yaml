stem: A cloth rubs a rod. Before rubbing, both are uncharged.
parts:
- id: a
  prompt: What is the total charge of the rod and the cloth together after rubbing?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Twice the charge on the rod
      correct: false
      misconception_id: mc.phy.o.rubbed_pair_same_charge
      feedback: 'If the rod gains some electrons, the cloth has lost exactly those electrons: the rod is negative and the cloth is positive by the same amount.'
    - id: B
      text: The charge on the rod, since rubbing created it
      correct: false
      misconception_id: mc.phy.o.charge_created_by_rubbing
      feedback: Rubbing makes no new charge. Electrons move from one object to the other, so one becomes negative and the other positive.
    - id: C
      text: Zero
      correct: true
    - id: D
      text: The charge on the rod, since protons were added to it
      correct: false
      misconception_id: mc.phy.o.protons_move_in_charging
      feedback: 'Protons are held in the nuclei of atoms and cannot move. Rubbing moves electrons: losing them leaves an object positive.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about which particles can move and what charge they carry.
  - rung: 2
    name: concept
    text:
      en: Rubbing moves tiny negative particles from one object to the other. Like charges repel and unlike charges attract.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Charge is only moved from one object to the other, so the total does not change.
  - rung: 5
    name: full_step
    text:
      en: Zero. Charge is only moved from one object to the other, so the total does not change.
  misconception_ids:
  - mc.phy.o.charge_created_by_rubbing
  - mc.phy.o.protons_move_in_charging
  - mc.phy.o.rubbed_pair_same_charge
