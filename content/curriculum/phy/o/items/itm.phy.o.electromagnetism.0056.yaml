stem: A transformer for a garden lamp works from the 230 V mains. The secondary coil has 36 turns and the output is 9 V.
parts:
- id: a
  prompt: Calculate the number of turns on the primary coil.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 920 turns
      correct: true
    - id: B
      text: 1.41 turns
      correct: false
      misconception_id: mc.phy.o.turns_ratio_inverted
      feedback: 'The voltages are in the same ratio as the turns: Vs/Vp = Ns/Np. The coil with more turns has the larger voltage.'
    - id: C
      text: 8280 turns
      correct: false
      misconception_id: mc.phy.o.turns_ratio_not_divided
      feedback: 'Write Vs/Vp = Ns/Np and rearrange fully: Vs = Vp × Ns ÷ Np. Both numbers of turns are needed.'
    - id: D
      text: 25.6 turns
      correct: false
      misconception_id: mc.phy.o.turns_ratio_given_as_answer
      feedback: The ratio only tells you how many times bigger or smaller. Multiply it by the known value to get the answer.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The voltages across the two coils are in the same ratio as their numbers of turns.
  - rung: 2
    name: concept
    text:
      en: Vs ÷ Vp = Ns ÷ Np.
  - rung: 3
    name: first_step
    text:
      en: Rearrange the equation to make Np the subject.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 36 turns by 230 and divide by 9.
  - rung: 5
    name: full_step
    text:
      en: The primary coil has 920 turns.
  misconception_ids:
  - mc.phy.o.turns_ratio_given_as_answer
  - mc.phy.o.turns_ratio_inverted
  - mc.phy.o.turns_ratio_not_divided
solution:
  steps:
  - n: 1
    latex: \frac{V_s}{V_p} = \frac{N_s}{N_p}
    reason: Voltages are in the ratio of the turns
  - n: 2
    latex: N_p = N_s \times \frac{V_p}{V_s} = 36 \times \frac{230}{9} = 920\ \text{turns}
    reason: Rearrange for N_p
    check_id: chk_build_phy_emg_0056_ans
