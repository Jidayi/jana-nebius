id: itm.phy.o.energy.0117
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.energy_resources
stem: A company builds a wind farm on a hillside.
parts:
- id: a
  prompt: Which statement about the wind farm is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It gives a steady output whatever the weather
      correct: false
      misconception_id: mc.phy.o.renewables_always_available
      feedback: Solar panels give nothing at night and wind turbines stop in calm weather. Many renewables are not reliable on their own.
    - id: B
      text: Its output changes with the weather
      correct: true
    - id: C
      text: It has no effect on the landscape or on birds
      correct: false
      misconception_id: mc.phy.o.renewable_means_clean
      feedback: A dam is renewable but floods valleys, and wind farms change the landscape. Renewable is about being replaced, not about having no effects.
    - id: D
      text: It is cheap to build because the wind is free
      correct: false
      misconception_id: mc.phy.o.renewable_cheap_to_build
      feedback: Wind, sunlight and water cost nothing, but turbines, panels and dams cost a lot to build. Their running costs are low, not their building costs.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Read each option and decide whether it is really true for this resource.
  - rung: 2
    name: concept
    text:
      en: Wind speed changes from day to day.
  - rung: 3
    name: first_step
    text:
      en: Renewable means replaced as fast as we use it; reliable means there when we need it. Neither tells you the cost or the effects on the environment.
  - rung: 4
    name: worked_step
    text:
      en: Rule out each option that mixes these ideas up or gets the original source of the energy wrong.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Its output changes with the weather.'
  misconception_ids:
  - mc.phy.o.renewable_cheap_to_build
  - mc.phy.o.renewable_means_clean
  - mc.phy.o.renewables_always_available
solution:
  steps:
  - n: 1
    latex: \text{Its output changes with the weather}
    reason: Compare renewability, reliability, cost and effects
