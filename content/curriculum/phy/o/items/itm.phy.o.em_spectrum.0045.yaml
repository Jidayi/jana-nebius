id: itm.phy.o.em_spectrum.0045
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.em_spectrum.uses_and_hazards
stem: Electromagnetic radiations are ranked by how much harm a strong dose can do to living cells.
parts:
- id: a
  prompt: Which is the most harmful?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Radio waves
      correct: false
      misconception_id: mc.phy.o.hazard_increases_with_wavelength
      feedback: Energy carried by the radiation grows with frequency, so the danger rises towards gamma rays, the shortest wavelength.
    - id: B
      text: Gamma rays
      correct: true
    - id: C
      text: Microwaves
      correct: false
      misconception_id: mc.phy.o.nonionising_called_ionising
      feedback: Only the high-frequency regions (X-rays and gamma rays, and the most energetic ultraviolet) can ionise atoms. Microwaves and infrared harm by heating.
    - id: D
      text: Infrared
      correct: false
      misconception_id: mc.phy.o.infrared_ultraviolet_swapped
      feedback: 'Infra means below: infrared is beyond red, with longer waves that heat things. Ultra means beyond: ultraviolet is beyond violet, with shorter waves that damage skin.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what each region does when it meets matter.
  - rung: 2
    name: concept
    text:
      en: Long-wavelength regions mostly carry signals or heat things; short-wavelength regions pass through soft tissue or damage cells.
  - rung: 3
    name: first_step
    text:
      en: Only the highest-frequency regions are ionising, and danger rises with frequency.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that give a region a property it does not have.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Gamma rays.'
  misconception_ids:
  - mc.phy.o.hazard_increases_with_wavelength
  - mc.phy.o.infrared_ultraviolet_swapped
  - mc.phy.o.nonionising_called_ionising
solution:
  steps:
  - n: 1
    latex: \text{Gamma rays}
    reason: Match the region to what it does to matter
