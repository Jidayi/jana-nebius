id: itm.phy.o.em_spectrum.0027
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.em_spectrum.em_wave_calculations
stem: A satellite dish receives TV signals with a frequency of 12 GHz.
parts:
- id: a
  prompt: Calculate their wavelength in centimetres.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 2500000000 cm
      correct: false
      misconception_id: mc.phy.o.wave_prefix_ignored
      feedback: Put every value into hertz, metres and seconds before using a formula, then change the answer into the unit the question asks for.
    - id: B
      text: 4000 cm
      correct: false
      misconception_id: mc.phy.o.wave_equation_inverted
      feedback: 'From v = fλ: λ = v/f and f = v/λ. The speed always goes on top when you divide.'
    - id: C
      text: 2.83 × 10^-6 cm
      correct: false
      misconception_id: mc.phy.o.em_uses_sound_speed
      feedback: Electromagnetic waves travel at about a million times the speed of sound. Use c = 3.0 × 10⁸ m/s for every one of them.
    - id: D
      text: 2.5 cm
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Which equation links the speed, frequency and wavelength of a wave?
  - rung: 2
    name: concept
    text:
      en: Every electromagnetic wave travels at c = 3.0 × 10⁸ m/s, and c = f × λ, so λ = c ÷ f.
  - rung: 3
    name: first_step
    text:
      en: 'Write the frequency in hertz: 12 GHz = 12 × 10⁹ Hz.'
  - rung: 4
    name: worked_step
    text:
      en: λ = 3.0 × 10⁸ ÷ (12 × 10⁹), then change metres into centimetres.
  - rung: 5
    name: full_step
    text:
      en: λ = 2.5 cm.
  misconception_ids:
  - mc.phy.o.em_uses_sound_speed
  - mc.phy.o.wave_equation_inverted
  - mc.phy.o.wave_prefix_ignored
solution:
  steps:
  - n: 1
    latex: f = 12\ \text{GHz} = 12 \times 10^{9}\ \text{Hz}
    reason: Write the prefix as a power of ten
  - n: 2
    latex: \lambda = \frac{c}{f} = \frac{3.0 \times 10^{8}}{12 \times 10^{9}} = 0.025\ \text{m}
    reason: Rearrange c = fλ
    check_id: chk_build_phy_ems_0027_lm
  - n: 3
    latex: 0.025\ \text{m} = 2.5\ \text{cm}
    reason: A metre is a hundred centimetres
    check_id: chk_build_phy_ems_0027_ans
