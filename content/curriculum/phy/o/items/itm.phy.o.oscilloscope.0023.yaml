subject: phy
level: o
kc_ids:
- kc.phy.o.oscilloscope.y_gain
stem: The Y-gain of an oscilloscope is set to 5 V/div. The trace measures 7 divisions from the top of a crest to the bottom of a trough.
parts:
- id: a
  prompt: Find the peak voltage of the signal.
  marks: 2
  answer:
    kind: numeric
    value: '17.5'
    unit: V
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_osc_0023_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Crest to trough is twice the height of a crest above the centre line.
  - rung: 2
    name: concept
    text:
      en: The Y-gain gives the voltage for each vertical division.
  - rung: 3
    name: first_step
    text:
      en: Multiply 7 divisions by 5 V/div to get the peak-to-peak voltage.
  - rung: 4
    name: worked_step
    text:
      en: The peak-to-peak voltage is 35 V; the peak voltage is half of it.
  - rung: 5
    name: full_step
    text:
      en: The peak voltage is 17.5 V.
  misconception_ids:
  - mc.phy.o.osc_peak_and_peak_to_peak_confused
  - mc.phy.o.osc_ygain_divided
  - mc.phy.o.osc_divisions_as_volts
solution:
  steps:
  - n: 1
    latex: V_{pp} = 7 \times 5 = 35\ \text{V}
    reason: Crest to trough is peak-to-peak
    check_id: chk_build_phy_osc_0023_pp
  - n: 2
    latex: V_0 = \frac{35}{2} = 17.5\ \text{V}
    reason: The peak is half the peak-to-peak
    check_id: chk_build_phy_osc_0023_ans
