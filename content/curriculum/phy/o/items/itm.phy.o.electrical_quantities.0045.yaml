id: itm.phy.o.electrical_quantities.0045
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.potential_difference
stem: A lamp with a p.d. of 9 V across it carries a current of 0.4 A for 2 minutes.
parts:
- id: a
  prompt: Calculate the energy transferred to the lamp.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 3.6 J
      correct: false
      misconception_id: mc.phy.o.energy_time_left_out
      feedback: The charge that flows is current × time, so the energy is p.d. × current × time. Without the time you have the energy per second.
    - id: B
      text: 432 J
      correct: true
    - id: C
      text: 7.2 J
      correct: false
      misconception_id: mc.phy.o.minutes_used_as_seconds
      feedback: 'An amp is a coulomb per second, so the time must be in seconds: multiply minutes by sixty first.'
    - id: D
      text: 0.1875 J
      correct: false
      misconception_id: mc.phy.o.w_qv_divided
      feedback: 'A p.d. of 1 V gives 1 J to every coulomb, so 6 V gives 6 J to each coulomb: energy = charge × p.d.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The p.d. is the energy transferred to each coulomb that passes.
  - rung: 2
    name: concept
    text:
      en: So find the charge first (Q = I t), then use W = Q V.
  - rung: 3
    name: first_step
    text:
      en: Change the time into seconds before you find the charge.
  - rung: 4
    name: worked_step
    text:
      en: The charge is 48 C; multiply it by 9 V.
  - rung: 5
    name: full_step
    text:
      en: W = 48 × 9 = 432 J.
  misconception_ids:
  - mc.phy.o.energy_time_left_out
  - mc.phy.o.minutes_used_as_seconds
  - mc.phy.o.w_qv_divided
solution:
  steps:
  - n: 1
    latex: t = 2\ \text{min} = 120\ \text{s}
    reason: Sixty seconds in each minute
    check_id: chk_build_phy_elq_0045_ts
  - n: 2
    latex: Q = I t = 0.4 \times 120 = 48\ \text{C}
    reason: The charge that flows
    check_id: chk_build_phy_elq_0045_q
  - n: 3
    latex: W = Q V = 48 \times 9 = 432\ \text{J}
    reason: Energy = charge × p.d.
    check_id: chk_build_phy_elq_0045_ans
