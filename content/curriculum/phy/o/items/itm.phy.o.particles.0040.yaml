stem: A sealed, rigid container of gas is at 150 kPa and 17 °C. It is heated to 77 °C. At constant volume, the pressure of a fixed mass of gas is proportional to its temperature in kelvin.
parts:
- id: a
  prompt: Find the new pressure of the gas.
  marks: 3
  answer:
    kind: numeric
    value: '181'
    unit: kPa
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_ptc_0040_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Hotter particles move faster: they strike the walls more often and with more force.'
  - rung: 2
    name: concept
    text:
      en: The pressure is proportional to the temperature in kelvin, not in °C.
  - rung: 3
    name: first_step
    text:
      en: Convert both temperatures to kelvin by adding 273.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 150 kPa by 350 ÷ 290.
  - rung: 5
    name: full_step
    text:
      en: The new pressure is 181 kPa.
  misconception_ids:
  - mc.phy.o.celsius_used_for_ratio
solution:
  steps:
  - n: 1
    latex: T_1 = 17 + 273 = 290\ \text{K}
    reason: Convert to kelvin
    check_id: chk_build_phy_ptc_0040_k1
  - n: 2
    latex: T_2 = 77 + 273 = 350\ \text{K}
    reason: Convert to kelvin
    check_id: chk_build_phy_ptc_0040_k2
  - n: 3
    latex: p_2 = 150 \times \frac{350}{290} = 181\ \text{kPa}
    reason: Pressure is proportional to the kelvin temperature
    check_id: chk_build_phy_ptc_0040_ans
