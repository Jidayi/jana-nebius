id: itm.phy.o.mass_weight.0011
version: 0.1.1
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.mass_weight.weight_from_mass
stem: A textbook has a mass of 950 g. Take g = 10 N/kg.
parts:
- id: a
  prompt: Calculate its weight.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 9500 N
      correct: false
      misconception_id: mc.phy.o.weight_grams_not_converted
      feedback: An apple cannot weigh as much as a grown person. Change grams into kilograms (divide by a thousand) before you use weight = mass × g.
    - id: B
      text: 0.95 N
      correct: false
      misconception_id: mc.phy.o.weight_given_as_mass_number
      feedback: 'A bag of sugar pulls on your hand much less on the Moon than on Earth, yet it holds the same sugar. Weight is a force: multiply the mass by g to get it, and divide a weight by g to get the mass.'
    - id: C
      text: 0.095 N
      correct: false
      misconception_id: mc.phy.o.weight_mass_divided_by_g
      feedback: 'Weight = mass × g: each kilogram has a weight of g newtons. So mass = weight ÷ g. Where g is bigger than 1 N/kg the weight in newtons is a bigger number than the mass in kilograms.'
    - id: D
      text: 9.5 N
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Weight is a force, so it is measured in newtons.
  - rung: 2
    name: concept
    text:
      en: Weight = mass × gravitational field strength, with the mass in kilograms.
  - rung: 3
    name: first_step
    text:
      en: Change 950 g into kilograms first.
  - rung: 4
    name: worked_step
    text:
      en: Work out 0.95 kg × 10 N/kg.
  - rung: 5
    name: full_step
    text:
      en: The weight is 9.5 N.
  misconception_ids:
  - mc.phy.o.weight_given_as_mass_number
  - mc.phy.o.weight_grams_not_converted
  - mc.phy.o.weight_mass_divided_by_g
conventions_override:
