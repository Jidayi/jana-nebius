id: itm.phy.o.energy.0013
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.stores_and_transfers
stem: A boy climbs a steep hill.
parts:
- id: a
  prompt: Which energy store increases?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: The chemical store of his muscles
      correct: false
      misconception_id: mc.phy.o.stores_before_after_swapped
      feedback: Ask where the energy is before and after. Climbing fills the gravitational store and empties the chemical store of the muscles.
    - id: B
      text: His gravitational potential store
      correct: true
    - id: C
      text: His force store
      correct: false
      misconception_id: mc.phy.o.energy_force_confused
      feedback: A force is a push or a pull in newtons. Energy is measured in joules, and a force only transfers energy when it moves something along its direction.
    - id: D
      text: 'None: the energy is used up as he climbs'
      correct: false
      misconception_id: mc.phy.o.energy_used_up
      feedback: 'When a car brakes, its kinetic energy does not vanish: the brakes and the air get warmer. Energy only moves between stores; the total stays the same.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide where the energy is at the start and where it ends up.
  - rung: 2
    name: concept
    text:
      en: He ends up higher than he started.
  - rung: 3
    name: first_step
    text:
      en: Energy is never made or destroyed; it only moves from store to store.
  - rung: 4
    name: worked_step
    text:
      en: Rule out each option that breaks one of these ideas.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: His gravitational potential store.'
  misconception_ids:
  - mc.phy.o.energy_force_confused
  - mc.phy.o.energy_used_up
  - mc.phy.o.stores_before_after_swapped
solution:
  steps:
  - n: 1
    latex: \text{His gravitational potential store}
    reason: Follow the energy from store to store
