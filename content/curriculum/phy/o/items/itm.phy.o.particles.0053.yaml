id: itm.phy.o.particles.0053
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.particles.pressure_and_volume
stem: Air in a sealed syringe has a volume of 80 cm³ at a pressure of 100 kPa. It is slowly allowed to expand by 40 cm³, at constant temperature.
parts:
- id: a
  prompt: Find the new pressure of the gas.
  marks: 2
  answer:
    kind: numeric
    value: '66.7'
    unit: kPa
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_ptc_0053_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The mass and temperature of the gas stay the same, so pressure × volume stays constant.
  - rung: 2
    name: concept
    text:
      en: Use p₁V₁ = p₂V₂, where p₂ and V₂ are the values after the change.
  - rung: 3
    name: first_step
    text:
      en: 'First find the new volume: 80 cm³ plus 40 cm³.'
  - rung: 4
    name: worked_step
    text:
      en: Divide 8000 by the new volume.
  - rung: 5
    name: full_step
    text:
      en: The new pressure is 66.7 kPa.
  misconception_ids:
  - mc.phy.o.boyle_direct_proportion
  - mc.phy.o.gas_pressure_unchanged
  - mc.phy.o.boyle_change_used_as_volume
solution:
  steps:
  - n: 1
    latex: V_2 = 80 + 40 = 120\ \text{cm}^3
    reason: The new volume
    check_id: chk_build_phy_ptc_0053_nv
  - n: 2
    latex: p_1V_1 = p_2V_2
    reason: 'Boyle''s law: fixed mass at constant temperature'
  - n: 3
    latex: p_1V_1 = 100 \times 80 = 8000
    reason: pV before the change
    check_id: chk_build_phy_ptc_0053_k
  - n: 4
    latex: p_2 = \frac{8000}{120} = 66.7\ \text{kPa}
    reason: Divide by the new volume
    check_id: chk_build_phy_ptc_0053_ans
