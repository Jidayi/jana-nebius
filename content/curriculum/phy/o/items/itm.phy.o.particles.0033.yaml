id: itm.phy.o.particles.0033
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.particles.gas_pressure_particles
stem: A gas in a sealed container is cooled.
parts:
- id: a
  prompt: What happens to its pressure?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It stays the same, because the amount of gas has not changed
      correct: false
      misconception_id: mc.phy.o.gas_pressure_unchanged
      feedback: 'Push in a sealed syringe and you feel the push back grow: the same gas in a smaller space hits the walls more often. Pressure depends on volume and temperature, not only on the amount of gas.'
    - id: B
      text: It falls, because the particles slow down and hit the walls less often and less hard
      correct: true
    - id: C
      text: It rises, because the particles crowd together and collide with each other more
      correct: false
      misconception_id: mc.phy.o.pressure_from_interparticle_collisions
      feedback: Pressure is a force on a surface. Only collisions with the container's walls push on it; particles bumping into each other in the middle push on no wall.
    - id: D
      text: It falls, because the particles shrink
      correct: false
      misconception_id: mc.phy.o.particles_grow_when_heated
      feedback: A water particle is the same size in ice, in water and in steam. Heating makes particles move faster and spread further apart; it does not make them bigger.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Pressure is a force on each square metre of a surface. What exerts force on the walls of a container of gas?
  - rung: 2
    name: concept
    text:
      en: The container is sealed and rigid, so only the particles' speed can change.
  - rung: 3
    name: first_step
    text:
      en: Ask whether the change alters how fast the particles move, how often they hit the walls, or both.
  - rung: 4
    name: worked_step
    text:
      en: Rule out explanations that rely on the weight of the gas or on particles changing size.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It falls, because the particles slow down and hit the walls less often and less hard.'
  misconception_ids:
  - mc.phy.o.gas_pressure_unchanged
  - mc.phy.o.particles_grow_when_heated
  - mc.phy.o.pressure_from_interparticle_collisions
solution:
  steps:
  - n: 1
    latex: \text{It falls, because the particles slow down and hit the walls less often and less hard}
    reason: Explain the pressure by collisions with the walls
