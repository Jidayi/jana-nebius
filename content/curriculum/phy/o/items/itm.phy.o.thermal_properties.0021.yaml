id: itm.phy.o.thermal_properties.0021
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.specific_heat_capacity
stem: A solar water heater supplies 84 kJ of energy to some water, warming it from 20 °C to 35 °C. The specific heat capacity of water is 4200 J/(kg °C).
parts:
- id: a
  prompt: Find the mass of the water.
  marks: 2
  answer:
    kind: numeric
    value: '1.33'
    unit: kg
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_thp_0021_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Use E = mcΔθ, with the mass in kilograms and Δθ the temperature rise.
  - rung: 2
    name: concept
    text:
      en: 'Rearrange E = mcΔθ to make m the subject: m = E ÷ (cΔθ).'
  - rung: 3
    name: first_step
    text:
      en: Change 84 kJ to joules and find the rise from 20 °C to 35 °C.
  - rung: 4
    name: worked_step
    text:
      en: Divide 84000 J by 4200 × 15.
  - rung: 5
    name: full_step
    text:
      en: The mass of the water is 1.33 kg.
solution:
  steps:
  - n: 1
    latex: E = 84\ \text{kJ} = 84000\ \text{J}
    reason: Joules, to match c
    check_id: chk_build_phy_thp_0021_ej
  - n: 2
    latex: \Delta\theta = 35 - 20 = 15\ ^\circ\text{C}
    reason: The temperature rise
    check_id: chk_build_phy_thp_0021_dt
  - n: 3
    latex: m = \frac{E}{c\Delta\theta} = \frac{84000}{4200 \times 15} = 1.33\ \text{kg}
    reason: Rearrange E = mcΔθ
    check_id: chk_build_phy_thp_0021_ans
