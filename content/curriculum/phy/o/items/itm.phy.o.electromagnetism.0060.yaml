kc_ids:
- kc.phy.o.electromagnetism.transformers
stem: A transformer is used in a model railway. The primary coil has 460 turns, the secondary 12 turns and the output is 6 V.
parts:
- id: a
  prompt: Calculate the input voltage.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 230 V
      correct: true
    - id: B
      text: 0.157 V
      correct: false
      misconception_id: mc.phy.o.turns_ratio_inverted
      feedback: 'The voltages are in the same ratio as the turns: Vs/Vp = Ns/Np. The coil with more turns has the larger voltage.'
    - id: C
      text: 2760 V
      correct: false
      misconception_id: mc.phy.o.turns_ratio_not_divided
      feedback: 'Write Vs/Vp = Ns/Np and rearrange fully: Vs = Vp × Ns ÷ Np. Both numbers of turns are needed.'
    - id: D
      text: 38.3 V
      correct: false
      misconception_id: mc.phy.o.turns_ratio_given_as_answer
      feedback: The ratio only tells you how many times bigger or smaller. Multiply it by the known value to get the answer.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The voltages across the two coils are in the same ratio as their numbers of turns.
  - rung: 2
    name: concept
    text:
      en: Vs ÷ Vp = Ns ÷ Np.
  - rung: 3
    name: first_step
    text:
      en: Rearrange the equation to make Vp the subject.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 6 V by 460 and divide by 12.
  - rung: 5
    name: full_step
    text:
      en: The input voltage is 230 V.
  misconception_ids:
  - mc.phy.o.turns_ratio_given_as_answer
  - mc.phy.o.turns_ratio_inverted
  - mc.phy.o.turns_ratio_not_divided
solution:
  steps:
  - n: 1
    latex: \frac{V_s}{V_p} = \frac{N_s}{N_p}
    reason: Voltages are in the ratio of the turns
  - n: 2
    latex: V_p = V_s \times \frac{N_p}{N_s} = 6 \times \frac{460}{12} = 230\ \text{V}
    reason: Rearrange for V_p
    check_id: chk_build_phy_emg_0060_ans
