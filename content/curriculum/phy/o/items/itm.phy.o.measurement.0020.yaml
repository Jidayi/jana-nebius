id: itm.phy.o.measurement.0020
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.measurement.scalars_and_vectors
stem: Physical quantities are either scalars or vectors.
parts:
- id: a
  prompt: Which of these quantities is a vector?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Acceleration
      correct: true
    - id: B
      text: Speed
      correct: false
      misconception_id: mc.phy.o.speed_as_vector
      feedback: A car going round a bend at a steady speed has the same speed but a changing velocity. Speed is the size only; velocity adds the direction.
    - id: C
      text: Kinetic energy
      correct: false
      misconception_id: mc.phy.o.energy_as_vector
      feedback: 'Energy is a scalar: an amount with no direction. Being moved from one store to another does not give it a direction.'
    - id: D
      text: Mass
      correct: false
      misconception_id: mc.phy.o.mass_as_vector
      feedback: Weight is a force and pulls towards the planet, so it has a direction. Mass is the amount of matter and has no direction.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Ask whether the quantity needs a direction to describe it fully.
  - rung: 2
    name: concept
    text:
      en: A vector has a size and a direction; a scalar has a size only.
  - rung: 3
    name: first_step
    text:
      en: 'Test each option in turn: does it make sense to say which way it points?'
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that do not fit what the question asks for.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Acceleration.'
  misconception_ids:
  - mc.phy.o.energy_as_vector
  - mc.phy.o.mass_as_vector
  - mc.phy.o.speed_as_vector
