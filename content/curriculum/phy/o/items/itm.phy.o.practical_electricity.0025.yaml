stem: The motor of a 150 W fridge runs for 30 minutes.
parts:
- id: a
  prompt: Calculate the energy used, in kilowatt-hours.
  marks: 2
  answer:
    kind: numeric
    value: '0.075'
    unit: kWh
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_pel_0025_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A kilowatt-hour is the energy used by a 1 kW appliance in 1 hour.
  - rung: 2
    name: concept
    text:
      en: E in kWh = power in kW × time in hours.
  - rung: 3
    name: first_step
    text:
      en: Change the power into kilowatts and the time into hours.
  - rung: 4
    name: worked_step
    text:
      en: The power is 0.15 kW and the time is 0.5 h; multiply them.
  - rung: 5
    name: full_step
    text:
      en: The energy used is 0.075 kWh.
  misconception_ids:
