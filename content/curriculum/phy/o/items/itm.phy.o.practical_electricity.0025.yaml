  - n: 1
    latex: P = 150\ \text{W} = 0.15\ \text{kW}
    reason: Power in kilowatts
    check_id: chk_build_phy_pel_0025_pk
  - n: 2
    latex: t = 30\ \text{min} = 0.5\ \text{h}
    reason: Time in hours
    check_id: chk_build_phy_pel_0025_th
  - n: 3
    latex: E = Pt = 0.15 \times 0.5 = 0.075\ \text{kWh}
    reason: Kilowatts times hours
    check_id: chk_build_phy_pel_0025_ans
