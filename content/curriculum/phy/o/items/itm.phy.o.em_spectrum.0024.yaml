id: itm.phy.o.em_spectrum.0024
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.em_spectrum.em_wave_calculations
stem: Blue light from an LED has a wavelength of 450 nm in air.
parts:
- id: a
  prompt: Calculate its frequency.
  marks: 2
  answer:
    kind: numeric
    value: 6.67e14
    unit: Hz
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_ems_0024_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which equation links the speed, frequency and wavelength of a wave?
  - rung: 2
    name: concept
    text:
      en: Every electromagnetic wave travels at c = 3.0 × 10⁸ m/s, and c = f × λ, so f = c ÷ λ.
  - rung: 3
    name: first_step
    text:
      en: 'Write the wavelength in metres: 450 nm = 450 × 10⁻⁹ m.'
  - rung: 4
    name: worked_step
    text:
      en: f = 3.0 × 10⁸ ÷ (450 × 10⁻⁹).
  - rung: 5
    name: full_step
    text:
      en: f = 6.67 × 10¹⁴ Hz.
  misconception_ids:
  - mc.phy.o.wave_prefix_ignored
  - mc.phy.o.wave_equation_inverted
  - mc.phy.o.em_uses_sound_speed
  - mc.phy.o.prefix_confused_with_neighbour
solution:
  steps:
  - n: 1
    latex: \lambda = 450\ \text{nm} = 450 \times 10^{-9}\ \text{m}
    reason: Nano means a thousand-millionth
  - n: 2
    latex: f = \frac{c}{\lambda} = \frac{3.0 \times 10^{8}}{450 \times 10^{-9}} = 6.67 \times 10^{14}\ \text{Hz}
    reason: Rearrange c = fλ
    check_id: chk_build_phy_ems_0024_fm
