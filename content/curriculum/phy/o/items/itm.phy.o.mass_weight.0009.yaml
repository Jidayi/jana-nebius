stem: Esi has a weight of 588 N on Earth. Take g = 9.8 N/kg.
parts:
- id: a
  prompt: Find Esi's weight on Saturn, where g = 10.4 N/kg.
  marks: 2
  answer:
    kind: numeric
    value: '624'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
