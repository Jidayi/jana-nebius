    text:
      en: The mass is the same everywhere; the weight is not.
  - rung: 2
    name: concept
    text:
      en: Find the mass from the Earth weight, then use the g for the new place.
  - rung: 3
    name: first_step
    text:
      en: Mass = 588 ÷ 9.8.
  - rung: 4
    name: worked_step
    text:
      en: The mass is 60 kg; multiply it by 10.4.
  - rung: 5
    name: full_step
    text:
      en: Esi's weight on Saturn is 624 N.
  misconception_ids:
