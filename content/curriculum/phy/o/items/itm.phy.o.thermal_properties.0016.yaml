id: itm.phy.o.thermal_properties.0016
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.specific_heat_capacity
stem: 2.5 kg of cooking oil at 20 °C takes in 42 kJ of energy. The specific heat capacity of cooking oil is 2000 J/(kg °C).
parts:
- id: a
  prompt: Find its final temperature.
  marks: 3
  answer:
    kind: numeric
    value: '28.4'
    unit: °C
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_thp_0016_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: E = mcΔθ gives the temperature rise, not the final temperature.
  - rung: 2
    name: concept
    text:
      en: Rearrange to Δθ = E ÷ (mc), with E in joules.
  - rung: 3
    name: first_step
    text:
      en: Change 42 kJ to joules first.
  - rung: 4
    name: worked_step
    text:
      en: The rise is 8.4 °C; add it to the starting 20 °C.
  - rung: 5
    name: full_step
    text:
      en: The final temperature is 28.4 °C.
  misconception_ids:
  - mc.phy.o.shc_rise_given_as_final
solution:
  steps:
  - n: 1
    latex: E = 42\ \text{kJ} = 42000\ \text{J}
    reason: Joules, to match c
    check_id: chk_build_phy_thp_0016_ej
  - n: 2
    latex: \Delta\theta = \frac{E}{mc} = \frac{42000}{2.5 \times 2000} = 8.4\ ^\circ\text{C}
    reason: Rearrange E = mcΔθ
    check_id: chk_build_phy_thp_0016_rise
  - n: 3
    latex: \theta = 20 + 8.4 = 28.4\ ^\circ\text{C}
    reason: Add the rise to the start
    check_id: chk_build_phy_thp_0016_ans
