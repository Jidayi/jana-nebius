id: itm.phy.o.thermal_properties.0003
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.thermal_expansion
stem: A thermostat uses a bimetallic strip with copper on top and invar, which hardly expands, underneath.
parts:
- id: a
  prompt: Which way does the strip bend when it gets hot?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Upwards, with the copper on the inside of the curve
      correct: false
      misconception_id: mc.phy.o.bimetal_bends_towards_greater_expansion
      feedback: The metal that expands more becomes the longer strip, and the longer strip must go round the outside of the curve, like the outside lane of a running track.
    - id: B
      text: It stays straight, because solids barely change size
      correct: false
      misconception_id: mc.phy.o.expansion_order_reversed
      feedback: For the same temperature rise, gases expand most, then liquids, then solids. Solids expand only a little, but enough to buckle rails and crack glass.
    - id: C
      text: Upwards, because the copper gains particles
      correct: false
      misconception_id: mc.phy.o.heating_creates_particles
      feedback: 'Weigh a sealed flask before and after heating: its mass does not change. No particles are made; the same particles move faster and, in most materials, spread further apart.'
    - id: D
      text: Downwards, with the copper on the outside of the curve
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what heating does to the motion and spacing of particles.
  - rung: 2
    name: concept
    text:
      en: The copper becomes longer than the invar it is fixed to.
  - rung: 3
    name: first_step
    text:
      en: For each option, ask whether the particles themselves change, or only how they move and how far apart they are.
  - rung: 4
    name: worked_step
    text:
      en: Remember that heating does not create particles and that gases expand most, solids least.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Downwards, with the copper on the outside of the curve.'
  misconception_ids:
  - mc.phy.o.bimetal_bends_towards_greater_expansion
  - mc.phy.o.expansion_order_reversed
  - mc.phy.o.heating_creates_particles
solution:
  steps:
  - n: 1
