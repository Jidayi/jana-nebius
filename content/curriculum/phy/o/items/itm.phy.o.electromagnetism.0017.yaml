id: itm.phy.o.electromagnetism.0017
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.electromagnetism.motor_effect
stem: A magnetic north pole is at the right of the page and a south pole at the left. A wire between the poles carries a current out of the page.
parts:
- id: a
  prompt: Which way is the force on the wire?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Up the page
      correct: false
      misconception_id: mc.phy.o.fleming_right_hand_used
      feedback: 'For motors use the left hand: first finger for the field, second finger for the current, thumb for the motion.'
    - id: B
      text: Down the page
      correct: true
    - id: C
      text: To the left, along the field
      correct: false
      misconception_id: mc.phy.o.force_along_field
      feedback: The force on the wire is at right angles to the field and to the current. Use the left hand to find which way.
    - id: D
      text: Out of the page, along the current
      correct: false
      misconception_id: mc.phy.o.force_along_current
      feedback: The wire is pushed sideways, at right angles to itself and to the field, never along its own length.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The force on the wire is at right angles to both the field and the current.
  - rung: 2
    name: concept
    text:
      en: 'Use Fleming''s left-hand rule: first finger for the field, second finger for the current, thumb for the force.'
  - rung: 3
    name: first_step
    text:
      en: The field goes from the north pole towards the south pole.
  - rung: 4
    name: worked_step
    text:
      en: Point your first finger to the left and your second finger out of the page; your thumb gives the force.
  - rung: 5
    name: full_step
    text:
      en: Down the page, by Fleming's left-hand rule.
  misconception_ids:
  - mc.phy.o.fleming_right_hand_used
  - mc.phy.o.force_along_current
  - mc.phy.o.force_along_field
solution:
  steps:
  - n: 1
    latex: \text{field to the left, current out of the page}
    reason: The two directions given
  - n: 2
    latex: \text{force down the page}
    reason: Fleming's left-hand rule
