id: itm.phy.o.practical_electricity.0030
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.practical_electricity.energy_cost
stem: A 60 W lamp is used for 4 hours every day for 28 days. Electricity costs 8 cents per kilowatt-hour.
parts:
- id: a
  prompt: Calculate the cost of the electricity used, in cents.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 1.92 cents
      correct: false
      misconception_id: mc.phy.o.energy_cost_days_left_out
      feedback: 'Read the question again: total time = time each day × number of days. Multiply before finding the cost.'
    - id: B
      text: 53760 cents
      correct: false
      misconception_id: mc.phy.o.kwh_power_left_in_watts
      feedback: 'Kilowatt-hours need the power in kilowatts: divide the watts by a thousand first.'
    - id: C
      text: 53.76 cents
      correct: true
    - id: D
      text: 0.84 cents
      correct: false
      misconception_id: mc.phy.o.elec_energy_power_over_time
      feedback: 'Leaving a heater on for longer uses more energy, not less, so the energy grows with time: E = P × t.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Electricity is paid for by the kilowatt-hour (one unit).
  - rung: 2
    name: concept
    text:
      en: Find the number of kWh used in all, then multiply by the price of one kWh.
  - rung: 3
    name: first_step
    text:
      en: 'Change the power into kilowatts and find the total time in hours: 4 hours a day for 28 days.'
  - rung: 4
    name: worked_step
    text:
      en: The total time is 112 h, so the energy is 6.72 kWh; multiply by 8 cents.
  - rung: 5
    name: full_step
    text:
      en: The cost is 53.76 cents.
  misconception_ids:
  - mc.phy.o.elec_energy_power_over_time
  - mc.phy.o.energy_cost_days_left_out
  - mc.phy.o.kwh_power_left_in_watts
solution:
  steps:
  - n: 1
    latex: P = 60\ \text{W} = 0.06\ \text{kW}
    reason: Power in kilowatts
    check_id: chk_build_phy_pel_0030_pk
  - n: 2
    latex: t = 4 \times 28 = 112\ \text{h}
    reason: Total time in hours
    check_id: chk_build_phy_pel_0030_th
  - n: 3
    latex: E = 0.06 \times 112 = 6.72\ \text{kWh}
    reason: Energy in kWh
    check_id: chk_build_phy_pel_0030_kwh
  - n: 4
    latex: \text{cost} = 6.72 \times 8 = 53.76\ \text{cents}
    reason: Units used times price
    check_id: chk_build_phy_pel_0030_ans
