id: itm.phy.o.radioactivity.0052
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.background_radiation
stem: A student measures the count rate from a weak source.
parts:
- id: a
  prompt: Why must the background count rate be measured too?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: So it can be subtracted from every reading
      correct: true
    - id: B
      text: So it can be added to every reading
      correct: false
      misconception_id: mc.phy.o.background_added
      feedback: The measured reading already contains the background. Taking it away leaves the source's own count rate.
    - id: C
      text: It need not be; background is too small to matter
      correct: false
      misconception_id: mc.phy.o.background_ignored
      feedback: Every reading includes background radiation from the surroundings. Subtract it to find what the source alone gives.
    - id: D
      text: So the counter can be set to show zero with no source
      correct: false
      misconception_id: mc.phy.o.background_zero_without_source
      feedback: Switch on a counter in an empty room and it still clicks now and then. Radiation from rocks, the air, food and space reaches us all the time.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Background radiation is ionising radiation that is around us all the time.
  - rung: 2
    name: concept
    text:
      en: Most of it comes from natural sources in the ground, the air, space and our food.
  - rung: 3
    name: first_step
    text:
      en: Every reading includes counts that did not come from the source.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that are not ionising radiation or that ignore natural sources.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: So it can be subtracted from every reading.'
  misconception_ids:
  - mc.phy.o.background_added
  - mc.phy.o.background_ignored
  - mc.phy.o.background_zero_without_source
solution:
  steps:
  - n: 1
    latex: \text{So it can be subtracted from every reading}
    reason: Background is natural ionising radiation
