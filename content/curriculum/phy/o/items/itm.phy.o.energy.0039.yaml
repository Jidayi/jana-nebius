stem: A crate of weight 120 N is raised 2 m by a builder.
parts:
- id: a
  prompt: Calculate the increase in its gravitational potential energy.
  marks: 1
  answer:
    kind: numeric
    value: '240'
    unit: J
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_nrg_0039_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The weight is given, not the mass.
  - rung: 2
    name: concept
    text:
      en: Weight is already mg, so ΔEp = weight × change in height.
  - rung: 3
    name: first_step
    text:
      en: Do not multiply by g again.
  - rung: 4
    name: worked_step
    text:
      en: Work out 120 × 2.
  - rung: 5
    name: full_step
    text:
      en: The increase is 240 J.
  misconception_ids:
  - mc.phy.o.gpe_weight_times_g
  - mc.phy.o.energy_mass_for_weight
  - mc.phy.o.gpe_half_from_ke
solution:
  steps:
  - n: 1
    latex: \Delta E_p = W \Delta h = 120 \times 2 = 240\ \text{J}
    reason: Weight = mg, so mgΔh = WΔh
    check_id: chk_build_phy_nrg_0039_ans
