id: itm.phy.o.wave_properties.0028
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.wave_properties.wave_equation
stem: Sound travels through air at 340 m/s. A whistle gives a note of frequency 6.8 kHz.
parts:
- id: a
  prompt: Calculate the wavelength in centimetres.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 5 cm
      correct: true
    - id: B
      text: 5000 cm
      correct: false
      misconception_id: mc.phy.o.wave_prefix_ignored
      feedback: Put every value into hertz, metres and seconds before using a formula, then change the answer into the unit the question asks for.
    - id: C
      text: 2000 cm
      correct: false
      misconception_id: mc.phy.o.wave_equation_inverted
      feedback: 'From v = fλ: λ = v/f and f = v/λ. The speed always goes on top when you divide.'
    - id: D
      text: 231000000 cm
      correct: false
      misconception_id: mc.phy.o.wave_equation_multiplied
      feedback: Multiplying a speed by a frequency gives a huge number that is not a length. If v is one of the values you know, divide it by the other one.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Start from v = f × λ.
  - rung: 2
    name: concept
    text:
      en: 'To find λ, divide the speed by the frequency: λ = v ÷ f.'
  - rung: 3
    name: first_step
    text:
      en: 'First put the values in hertz and metres: 6.8 kHz = 6800 Hz.'
  - rung: 4
    name: worked_step
    text:
      en: Divide 340 by the frequency in hertz, then change metres into centimetres.
  - rung: 5
    name: full_step
    text:
      en: λ = 5 cm.
  misconception_ids:
  - mc.phy.o.wave_equation_inverted
  - mc.phy.o.wave_equation_multiplied
  - mc.phy.o.wave_prefix_ignored
solution:
  steps:
  - n: 1
    latex: f = 6.8\ \text{kHz} = 6800\ \text{Hz}
    reason: Put the frequency in hertz
    check_id: chk_build_phy_wav_0028_fsi
  - n: 2
    latex: \lambda = \frac{v}{f} = \frac{340}{6800} = 0.05\ \text{m}
    reason: Rearrange v = fλ
    check_id: chk_build_phy_wav_0028_lm
  - n: 3
    latex: 0.05\ \text{m} = 5\ \text{cm}
    reason: A metre is a hundred centimetres
    check_id: chk_build_phy_wav_0028_ans
