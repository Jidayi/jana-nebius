id: itm.phy.o.energy.0040
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.potential_energy
stem: A 1000 kg lift car moves down from 18 m to 3 m above the ground. Take g = 10 N/kg.
parts:
- id: a
  prompt: Calculate the decrease in its gravitational potential energy, in kJ.
  marks: 2
  answer:
    kind: numeric
    value: '150'
    unit: kJ
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_nrg_0040_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Moving down empties the gravitational store by mgΔh.
  - rung: 2
    name: concept
    text:
      en: Find the change in height first; heights above the ground are not changes.
  - rung: 3
    name: first_step
    text:
      en: Δh = 18 − 3 = 15 m.
  - rung: 4
    name: worked_step
    text:
      en: Work out 1000 × 10 × 15 and change the joules to kilojoules.
  - rung: 5
    name: full_step
    text:
      en: The decrease is 150 kJ.
  misconception_ids:
  - mc.phy.o.gpe_height_not_change
  - mc.phy.o.gpe_heights_added
  - mc.phy.o.energy_mass_for_weight
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: \Delta h = 18 - 3 = 15\ \text{m}
    reason: The change in height
    check_id: chk_build_phy_nrg_0040_dh
  - n: 2
    latex: \Delta E_p = 1000 \times 10 \times 15 = 150000\ \text{J}
    reason: ΔEp = mgΔh
    check_id: chk_build_phy_nrg_0040_ej
  - n: 3
    latex: 150000\ \text{J} = 150\ \text{kJ}
    reason: A kilojoule is a thousand joules
    check_id: chk_build_phy_nrg_0040_ans
difficulty:
  prior: 0.0
