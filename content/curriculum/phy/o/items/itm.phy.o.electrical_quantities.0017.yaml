stem: A charge of 2160 C flows through a phone charger in 45 minutes.
parts:
- id: a
  prompt: Calculate the current, in amps.
  marks: 2
  answer:
    kind: numeric
    value: '0.8'
    unit: A
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0017_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Current is the rate at which charge flows.
  - rung: 2
    name: concept
    text:
      en: From Q = I t, the current is I = Q ÷ t.
  - rung: 3
    name: first_step
    text:
      en: First change the time into seconds.
  - rung: 4
    name: worked_step
    text:
      en: Divide 2160 C by 2700 s.
  - rung: 5
    name: full_step
    text:
      en: I = 2160 ÷ 2700 = 0.8 A.
  misconception_ids:
  - mc.phy.o.q_it_multiplied
  - mc.phy.o.q_it_upside_down
  - mc.phy.o.minutes_used_as_seconds
solution:
  steps:
  - n: 1
    latex: t = 45\ \text{min} = 2700\ \text{s}
    reason: Sixty seconds in each minute
    check_id: chk_build_phy_elq_0017_ts
  - n: 2
    latex: I = \frac{Q}{t} = \frac{2160}{2700} = 0.8\ \text{A}
    reason: Rearrange Q = It
    check_id: chk_build_phy_elq_0017_ans
