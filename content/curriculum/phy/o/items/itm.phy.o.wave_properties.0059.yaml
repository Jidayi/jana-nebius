stem: Waves spread out after passing through a gap or round the edge of a barrier.
parts:
- id: a
  prompt: What is this effect called?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Refraction
      correct: false
      misconception_id: mc.phy.o.wave_effects_confused
      feedback: 'Reflection: bouncing back from a barrier. Refraction: changing direction because the speed changes. Diffraction: spreading out through a gap or round an edge.'
    - id: B
      text: Reflection
      correct: false
      misconception_id: mc.phy.o.wave_effects_confused
      feedback: 'Reflection: bouncing back from a barrier. Refraction: changing direction because the speed changes. Diffraction: spreading out through a gap or round an edge.'
    - id: C
      text: A change of wavelength
      correct: false
      misconception_id: mc.phy.o.diffraction_changes_wavelength
      feedback: Diffraction changes only the direction and shape of the wavefronts. The water depth is the same, so the speed, wavelength and frequency are too.
    - id: D
      text: Diffraction
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'There are three wave effects: bouncing back, bending at a change of speed, and spreading.'
  - rung: 2
    name: concept
    text:
      en: Here nothing about the water changes, and no barrier sends the waves back.
  - rung: 3
    name: first_step
    text:
      en: Match the description to the effect that means spreading.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the effects that need a change of speed or a barrier facing the waves.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Diffraction.'
  misconception_ids:
  - mc.phy.o.diffraction_changes_wavelength
  - mc.phy.o.wave_effects_confused
solution:
  steps:
  - n: 1
    latex: \text{Diffraction}
    reason: Match the effect to what changes and what stays the same
