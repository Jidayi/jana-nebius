stem: Two mercury barometers stand side by side. One tube is twice as wide as the other.
parts:
- id: a
  prompt: How do the heights of their mercury columns compare?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: The wider tube's column is shorter, as it holds more mercury
      correct: false
      misconception_id: mc.phy.o.barometer_tube_shape_matters
      feedback: The air pressure balances the pressure of the column, which depends only on its vertical height. Tilt or widen the tube and the mercury surface stays at the same height above the dish.
    - id: B
      text: They are the same
      correct: true
    - id: C
      text: The wider tube's column is taller
      correct: false
      misconception_id: mc.phy.o.barometer_tube_shape_matters
      feedback: The air pressure balances the pressure of the column, which depends only on its vertical height. Tilt or widen the tube and the mercury surface stays at the same height above the dish.
    - id: D
      text: They differ, because more air is trapped above the narrow column
      correct: false
      misconception_id: mc.phy.o.barometer_space_holds_air
      feedback: The tube was filled with mercury and turned upside down, so no air could get in at the top. The space left is almost empty, which is why the air outside can hold the column up.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A barometer and a manometer both balance a pressure against a column of liquid.
  - rung: 2
    name: concept
    text:
      en: The pressure of a column depends on ρgh, not on its width.
  - rung: 3
    name: first_step
    text:
      en: Only the vertical height of a column and the liquid's density matter.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that change the wrong quantity.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: They are the same.'
  misconception_ids:
  - mc.phy.o.barometer_space_holds_air
  - mc.phy.o.barometer_tube_shape_matters
