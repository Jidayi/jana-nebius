id: itm.phy.o.solar_system.0028
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.solar_system.orbital_speed
stem: A navigation satellite orbits 20 200 km above the Earth's surface and goes round once every 12 hours. The Earth's radius is 6400 km.
parts:
- id: a
  prompt: Calculate its orbital speed in km/s.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 3.87 km/s
      correct: true
    - id: B
      text: 2.94 km/s
      correct: false
      misconception_id: mc.phy.o.orbit_radius_altitude_only
      feedback: A satellite circles the centre of the Earth, not its surface. Its orbit radius is the Earth's radius plus its height.
    - id: C
      text: 0.616 km/s
      correct: false
      misconception_id: mc.phy.o.orbit_speed_no_two_pi
      feedback: In one orbit the body travels once round a circle, a distance of 2πr, not r. Speed = 2πr ÷ T.
    - id: D
      text: 13900 km/s
      correct: false
      misconception_id: mc.phy.o.orbit_period_not_in_seconds
      feedback: For a speed in km/s the time must be in seconds, so change the period into seconds before you divide. A time found in seconds must be changed before it is given in hours.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The satellite circles the centre of the Earth, not its surface.
  - rung: 2
    name: concept
    text:
      en: Orbit radius = Earth's radius + height; then v = 2πr ÷ T.
  - rung: 3
    name: first_step
    text:
      en: Put the period in seconds so the speed comes out in km/s.
  - rung: 4
    name: worked_step
    text:
      en: r = 26600 km and T = 43200 s.
  - rung: 5
    name: full_step
    text:
      en: The orbital speed is 3.87 km/s.
  misconception_ids:
  - mc.phy.o.orbit_period_not_in_seconds
  - mc.phy.o.orbit_radius_altitude_only
  - mc.phy.o.orbit_speed_no_two_pi
solution:
  steps:
  - n: 1
    latex: r = 6400 + 20\,200 = 26600\ \text{km}
    reason: Measured from the Earth's centre
    check_id: chk_build_phy_sol_0028_rad
  - n: 2
    latex: T = 12\ \text{hours} = 43200\ \text{s}
    reason: Period in seconds
    check_id: chk_build_phy_sol_0028_ts
  - n: 3
    latex: v = \frac{2\pi \times 26600}{43200} = 3.87\ \text{km/s}
    reason: v = 2πr / T
    check_id: chk_build_phy_sol_0028_ans
difficulty:
  prior: 0.4
  band: core
estimated_seconds: 120
