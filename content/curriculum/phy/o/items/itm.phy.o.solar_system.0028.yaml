    args:
      expression: 2*pi*(6400 + 20200)/(12*3600)
      sf: 3
    tool: math_evaluate
  chk_build_phy_sol_0028_rad:
    args:
      expression: 6400 + 20200
    tool: math_evaluate
  chk_build_phy_sol_0028_ts:
