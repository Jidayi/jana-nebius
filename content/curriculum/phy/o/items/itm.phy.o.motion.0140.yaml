stem: A pebble is dropped from rest and falls for 2.0 s. Take g = 9.8 m/s^2 and ignore air resistance.
parts:
- id: a
  prompt: How far does it fall?
  marks: 3
  answer:
    kind: numeric
    value: '20'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0140_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which way is the object moving, what is its speed at the start, and what is its acceleration?
  - rung: 2
    name: concept
    text:
      en: In free fall the acceleration is g downwards; take care with the sign if you call upwards positive.
  - rung: 3
    name: first_step
    text:
      en: Dropped from rest means u = 0, so s = ½gt^2.
  - rung: 4
    name: worked_step
    text:
      en: s = ½ × 9.8 × 2.0^2.
  - rung: 5
    name: full_step
    text:
      en: s = ½ × 9.8 × 2.0^2 = 20 m.
  misconception_ids:
  - mc.phy.o.gravity_sign_flipped
solution:
  steps:
  - n: 1
    latex: s = \tfrac{1}{2}gt^2
    reason: Uniform acceleration g with the right starting speed
  - n: 2
    latex: s = \tfrac{1}{2} \times 9.8 \times 2.0^2
    reason: Substitute
  - n: 3
    latex: s = 20\ \text{m}
    reason: Evaluate
    check_id: chk_build_phy_k_0140_a
