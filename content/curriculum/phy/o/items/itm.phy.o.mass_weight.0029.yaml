id: itm.phy.o.mass_weight.0029
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.mass_weight.mass_or_weight
stem: A 3 kg rock is taken from the Earth to Jupiter, where g is about 25 N/kg.
parts:
- id: a
  prompt: What happens to the rock's mass and weight?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Its mass and its weight both increase
      correct: false
      misconception_id: mc.phy.o.mass_changes_with_g
      feedback: Mass is the amount of matter in the object, and a trip to the Moon removes no matter. Only the weight, the pull of gravity on it, changes.
    - id: B
      text: Its mass stays 3 kg and its weight increases
      correct: true
    - id: C
      text: Its mass stays 3 kg and its weight stays the same
      correct: false
      misconception_id: mc.phy.o.weight_same_on_every_planet
      feedback: Weight is the pull of a planet on the object, weight = mass × g. A world with a smaller g pulls less on the same mass.
    - id: D
      text: Its mass increases and its weight stays the same
      correct: false
      misconception_id: mc.phy.o.mass_weight_roles_swapped
      feedback: Weight is a force caused by gravity, so it changes from world to world. Mass is the amount of matter, so it stays the same.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide whether each option is about mass, weight, or both.
  - rung: 2
    name: concept
    text:
      en: Jupiter's field is stronger than the Earth's, so its pull on each kilogram is greater.
  - rung: 3
    name: first_step
    text:
      en: Test each option against the difference between the amount of matter and the pull of gravity.
  - rung: 4
    name: worked_step
    text:
      en: Rule out every option that mixes up the two quantities.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Its mass stays 3 kg and its weight increases.'
  misconception_ids:
  - mc.phy.o.mass_changes_with_g
  - mc.phy.o.mass_weight_roles_swapped
  - mc.phy.o.weight_same_on_every_planet
solution:
  steps:
  - n: 1
    latex: \text{Its mass stays 3 kg and its weight increases}
    reason: Mass stays the same; weight depends on g
