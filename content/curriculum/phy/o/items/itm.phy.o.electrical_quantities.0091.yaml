stem: A p.d. is applied to a diode first one way round and then the other.
parts:
- id: a
  prompt: What happens to the current?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: The same current flows both ways
      correct: false
      misconception_id: mc.phy.o.diode_conducts_both_ways
      feedback: 'A diode''s I-V graph is flat along the p.d. axis for reverse p.d.: almost no current flows the wrong way.'
    - id: B
      text: A larger current flows the second way, as the diode warms up
      correct: false
      misconception_id: mc.phy.o.lamp_resistance_falls_when_hot
      feedback: A hot metal's ions vibrate more and get in the electrons' way, so a filament's resistance rises as it heats up.
    - id: C
      text: The current is proportional to the p.d. both ways
      correct: false
      misconception_id: mc.phy.o.diode_conducts_both_ways
      feedback: 'A diode''s I-V graph is flat along the p.d. axis for reverse p.d.: almost no current flows the wrong way.'
    - id: D
      text: A current flows one way, but almost none flows the other way
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Look at how the current changes as the p.d. changes, and what that says about R = V/I.
  - rung: 2
    name: concept
    text:
      en: A fixed resistor gives a straight line through the origin; a line that bends shows a resistance that changes; some components conduct in one direction only.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: A diode has a low resistance in its forward direction and a very high one in reverse.
  - rung: 5
    name: full_step
    text:
      en: A current flows one way, but almost none flows the other way. A diode has a low resistance in its forward direction and a very high one in reverse.
  misconception_ids:
  - mc.phy.o.diode_conducts_both_ways
  - mc.phy.o.lamp_resistance_falls_when_hot
