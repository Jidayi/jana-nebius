stem: A sodium atom, ²³₁₁Na, loses one electron to become a sodium ion.
parts:
- id: a
  prompt: Is the ion an isotope of the sodium atom?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: 'Yes: losing an electron makes a new isotope'
      correct: false
      misconception_id: mc.phy.o.ion_as_isotope
      feedback: Isotopes differ in the nucleus (neutrons). Ions differ outside it (electrons). An ion has the same nucleus as its atom.
    - id: B
      text: 'No: its nucleus is unchanged, so it is an ion of the same nuclide'
      correct: true
    - id: C
      text: 'Yes: it has a different number of electrons, like all isotopes'
      correct: false
      misconception_id: mc.phy.o.isotopes_differ_in_electrons
      feedback: A neutral atom has one electron for each proton. Isotopes share the proton number, so their neutral atoms have the same electrons.
    - id: D
      text: 'No: it is now a different element'
      correct: false
      misconception_id: mc.phy.o.heavier_isotope_different_element
      feedback: 'Carbon-12 and carbon-14 are both carbon: both have six protons. The proton number alone decides the element.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide what makes two nuclides the same element.
  - rung: 2
    name: concept
    text:
      en: Isotopes have the same proton number but different nucleon numbers.
  - rung: 3
    name: first_step
    text:
      en: 'Ask where the change happened: inside the nucleus or outside it.'
  - rung: 4
    name: worked_step
    text:
      en: Test each option against that definition.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: No: its nucleus is unchanged, so it is an ion of the same nuclide.'
  misconception_ids:
  - mc.phy.o.heavier_isotope_different_element
  - mc.phy.o.ion_as_isotope
  - mc.phy.o.isotopes_differ_in_electrons
