stem: A school bag of mass 4 kg is lifted through a height of 40 cm. Take g = 10 N/kg.
parts:
- id: a
  prompt: Calculate the gain in its gravitational potential energy.
  marks: 2
  answer:
    kind: numeric
    value: '16'
    unit: J
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_nrg_0038_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Check the units of the height first.
  - rung: 2
    name: concept
    text:
      en: Use ΔEp = mgΔh with the height in metres.
  - rung: 3
    name: first_step
    text:
      en: 40 cm = 0.4 m.
  - rung: 4
    name: worked_step
    text:
      en: Work out 4 × 10 × 0.4.
  - rung: 5
    name: full_step
    text:
      en: The gain is 16 J.
  misconception_ids:
