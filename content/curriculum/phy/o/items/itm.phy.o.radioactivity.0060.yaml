stem: A list of possible sources of radiation is being checked.
parts:
- id: a
  prompt: Which list contains only sources of background radiation?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Cosmic rays, rocks and buildings, food and drink
      correct: true
    - id: B
      text: Cosmic rays, radio waves and microwaves
      correct: false
      misconception_id: mc.phy.o.background_from_non_ionising
      feedback: 'Background radiation means ionising radiation: alpha, beta and gamma from radioactive substances, and cosmic rays. Radio and phone signals do not ionise and are not counted.'
    - id: C
      text: Nuclear power stations and weapons tests only
      correct: false
      misconception_id: mc.phy.o.background_mostly_artificial
      feedback: 'Most background is natural: radon gas from the ground, rocks and buildings, cosmic rays, and our food. Nuclear power adds only a tiny share.'
    - id: D
      text: Radio broadcasts, rocks and food
      correct: false
      misconception_id: mc.phy.o.background_from_non_ionising
      feedback: 'Background radiation means ionising radiation: alpha, beta and gamma from radioactive substances, and cosmic rays. Radio and phone signals do not ionise and are not counted.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Background radiation is ionising radiation that is around us all the time.
  - rung: 2
    name: concept
    text:
      en: Most of it comes from natural sources in the ground, the air, space and our food.
  - rung: 3
    name: first_step
    text:
      en: 'Background radiation is ionising radiation: from radioactive substances or from space.'
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that are not ionising radiation or that ignore natural sources.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Cosmic rays, rocks and buildings, food and drink.'
  misconception_ids:
  - mc.phy.o.background_from_non_ionising
  - mc.phy.o.background_mostly_artificial
solution:
