id: itm.phy.o.forces.0105
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.centre_of_gravity
stem: A boat builder fixes heavy ballast low down in the hull of a sailing boat.
parts:
- id: a
  prompt: Why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Extra weight anywhere makes a boat more stable
      correct: false
      misconception_id: mc.phy.o.stability_from_weight_only
      feedback: A load on the roof rack makes a car easier to tip over. Weight added high up raises the centre of gravity and makes an object less stable.
    - id: B
      text: It lowers the centre of gravity, so the boat is harder to tip over
      correct: true
    - id: C
      text: It keeps the centre of gravity at the middle of the boat's height
      correct: false
      misconception_id: mc.phy.o.cog_always_at_middle
      feedback: A hammer balances near its heavy head, not halfway along the handle. The centre of gravity moves towards where more of the mass is.
    - id: D
      text: It stops the boat from tilting at all, since any tilt would capsize it
      correct: false
      misconception_id: mc.phy.o.topples_whenever_tilted
      feedback: 'Tilt a box slightly and let go: it falls back. Its weight still acts inside the base and turns it back. It topples only once the weight acts outside the base.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about where the weight of the object acts and where its base is.
  - rung: 2
    name: concept
    text:
      en: An object topples when the vertical line through its centre of gravity falls outside its base.
  - rung: 3
    name: first_step
    text:
      en: Ask how far the object could tilt before the line of its weight passes outside the base.
  - rung: 4
    name: worked_step
    text:
      en: Where in the boat does the ballast put extra mass?
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It lowers the centre of gravity, so the boat is harder to tip over. Mass low down lowers the centre of gravity, so the boat must lean further before it capsizes.'
  misconception_ids:
  - mc.phy.o.cog_always_at_middle
  - mc.phy.o.stability_from_weight_only
  - mc.phy.o.topples_whenever_tilted
solution:
  steps:
  - n: 1
