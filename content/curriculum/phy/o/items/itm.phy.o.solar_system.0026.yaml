id: itm.phy.o.solar_system.0026
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.solar_system.orbital_speed
stem: A satellite moves at 3.87 km/s in a circular orbit of radius 26 600 km about the centre of the Earth.
parts:
- id: a
  prompt: How long does one orbit take, in hours?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 180 h
      correct: false
      misconception_id: mc.phy.o.orbit_rearranged_wrongly
      feedback: 'From v = 2πr ÷ T: T = 2πr ÷ v and r = vT ÷ 2π. Check the answer has sensible units.'
    - id: B
      text: 1.91 h
      correct: false
      misconception_id: mc.phy.o.orbit_speed_no_two_pi
      feedback: In one orbit the body travels once round a circle, a distance of 2πr, not r. Speed = 2πr ÷ T.
    - id: C
      text: 12.0 h
      correct: true
    - id: D
      text: 43200 h
      correct: false
      misconception_id: mc.phy.o.orbit_period_not_in_seconds
      feedback: For a speed in km/s the time must be in seconds, so change the period into seconds before you divide. A time found in seconds must be changed before it is given in hours.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The orbit is a circle of circumference 2πr.
  - rung: 2
    name: concept
    text:
      en: From v = 2πr ÷ T, the period T = 2πr ÷ v.
  - rung: 3
    name: first_step
    text:
      en: Work out 2π × 26 600 ÷ 3.87; with r in km and v in km/s this gives seconds.
  - rung: 4
    name: worked_step
    text:
      en: T = 43200 s; change it into hours.
  - rung: 5
    name: full_step
    text:
      en: One orbit takes 12.0 hours.
  misconception_ids:
  - mc.phy.o.orbit_period_not_in_seconds
  - mc.phy.o.orbit_rearranged_wrongly
  - mc.phy.o.orbit_speed_no_two_pi
solution:
  steps:
  - n: 1
    latex: T = \frac{2\pi r}{v} = \frac{2\pi \times 26\,600}{3.87} = 43200\ \text{s}
    reason: Rearrange v = 2πr / T
    check_id: chk_build_phy_sol_0026_ts
  - n: 2
    latex: 43200\ \text{s} = 12.0\ \text{h}
    reason: Seconds to hours
    check_id: chk_build_phy_sol_0026_ans
