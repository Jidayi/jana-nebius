id: itm.phy.o.em_spectrum.0030
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.em_spectrum.em_wave_calculations
stem: Yellow light has a wavelength of 580 nm in air.
parts:
- id: a
  prompt: Calculate its frequency.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 517000 Hz
      correct: false
      misconception_id: mc.phy.o.wave_prefix_ignored
      feedback: Put every value into hertz, metres and seconds before using a formula, then change the answer into the unit the question asks for.
    - id: B
      text: 1.93 × 10^-15 Hz
      correct: false
      misconception_id: mc.phy.o.wave_equation_inverted
      feedback: 'From v = fλ: λ = v/f and f = v/λ. The speed always goes on top when you divide.'
    - id: C
      text: 5.17 × 10^14 Hz
      correct: true
    - id: D
      text: 586000000 Hz
      correct: false
      misconception_id: mc.phy.o.em_uses_sound_speed
      feedback: Electromagnetic waves travel at about a million times the speed of sound. Use c = 3.0 × 10⁸ m/s for every one of them.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Which equation links the speed, frequency and wavelength of a wave?
  - rung: 2
    name: concept
    text:
      en: Every electromagnetic wave travels at c = 3.0 × 10⁸ m/s, and c = f × λ, so f = c ÷ λ.
  - rung: 3
    name: first_step
    text:
      en: 'Write the wavelength in metres: 580 nm = 580 × 10⁻⁹ m.'
  - rung: 4
    name: worked_step
    text:
      en: f = 3.0 × 10⁸ ÷ (580 × 10⁻⁹).
  - rung: 5
    name: full_step
    text:
      en: f = 5.17 × 10¹⁴ Hz.
  misconception_ids:
  - mc.phy.o.em_uses_sound_speed
  - mc.phy.o.wave_equation_inverted
  - mc.phy.o.wave_prefix_ignored
solution:
  steps:
  - n: 1
    latex: \lambda = 580\ \text{nm} = 580 \times 10^{-9}\ \text{m}
    reason: Nano means a thousand-millionth
  - n: 2
    latex: f = \frac{c}{\lambda} = \frac{3.0 \times 10^{8}}{580 \times 10^{-9}} = 5.17 \times 10^{14}\ \text{Hz}
    reason: Rearrange c = fλ
    check_id: chk_build_phy_ems_0030_fm
