stem: Light from the Sun crosses about 150 million kilometres of empty space to reach the Earth.
parts:
- id: a
  prompt: What does this show about electromagnetic waves?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: They can travel through a vacuum
      correct: true
    - id: B
      text: Space must be filled with air that carries them
      correct: false
      misconception_id: mc.phy.o.em_needs_medium
      feedback: Sunlight reaches the Earth across millions of kilometres of empty space. Electromagnetic waves travel through a vacuum.
    - id: C
      text: They are longitudinal waves
      correct: false
      misconception_id: mc.phy.o.light_called_longitudinal
      feedback: 'Every electromagnetic wave is transverse: its electric and magnetic fields vibrate at right angles to the direction it travels.'
    - id: D
      text: Light travels faster than other electromagnetic waves
      correct: false
      misconception_id: mc.phy.o.em_speed_differs
      feedback: Every electromagnetic wave travels at the same speed in a vacuum, 3.0 × 10⁸ m/s. They differ in frequency and wavelength, not speed.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Start from the region with the longest wavelength and work towards the shortest.
  - rung: 2
    name: concept
    text:
      en: Frequency rises as wavelength falls, because every region has the same speed in a vacuum.
  - rung: 3
    name: first_step
    text:
      en: Every region is a transverse wave and can cross empty space.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that break the order or these shared properties.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: They can travel through a vacuum.'
  misconception_ids:
  - mc.phy.o.em_needs_medium
  - mc.phy.o.em_speed_differs
  - mc.phy.o.light_called_longitudinal
solution:
