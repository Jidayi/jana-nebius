stem: Galaxy P is 100 million light-years away and moves away from us at 2100 km/s. Galaxy Q is 500 million light-years away.
parts:
- id: a
  prompt: Use Hubble's law to estimate how fast galaxy Q is moving away.
  marks: 2
  answer:
    kind: numeric
    value: '10500'
    unit: km/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_str_0038_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Hubble''s law: recession speed is proportional to distance.'
  - rung: 2
    name: concept
    text:
      en: If one galaxy is n times as far away, it moves away n times as fast.
  - rung: 3
    name: first_step
    text:
      en: Find how many times further away galaxy Q is.
  - rung: 4
    name: worked_step
    text:
      en: Q is 5 times as far away as P.
  - rung: 5
    name: full_step
    text:
      en: Galaxy Q moves away at about 10500 km/s.
  misconception_ids:
  - mc.phy.o.nearer_galaxies_recede_faster
  - mc.phy.o.galaxies_recede_at_same_speed
solution:
  steps:
  - n: 1
    latex: \frac{500}{100} = 5
    reason: Q is this many times further away
    check_id: chk_build_phy_str_0038_ratio
  - n: 2
    latex: v_Q = 5 \times 2100 = 10500\ \text{km/s}
    reason: Speed is proportional to distance
    check_id: chk_build_phy_str_0038_ans
