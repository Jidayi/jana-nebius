    args:
      expression: 2*pi*1.52*1.5e8/(1.88*365*86400)
      sf: 3
    tool: math_evaluate
  chk_build_phy_sol_0018_rk_m:
    args:
      expression: (1.52*1.5e8)/10^(8)
      sf: 3
    tool: math_evaluate
  chk_build_phy_sol_0018_tdays:
