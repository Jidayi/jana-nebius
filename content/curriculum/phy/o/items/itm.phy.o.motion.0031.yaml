id: itm.phy.o.motion.0031
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.motion.average_speed
stem: A walker goes 1200 m in 150 s, then straight on for a further 800 m in 120 s along the same path.
parts:
- id: a
  prompt: Calculate the average speed for the whole walk.
  marks: 3
  answer:
    kind: numeric
    value: '7.4'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0031_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: There are two parts to the walk. What do you need for the whole journey?
  - rung: 2
    name: concept
    text:
      en: Average speed for the whole journey is total distance divided by total time, not the average of the two speeds.
  - rung: 3
    name: first_step
    text:
      en: Find the total distance and the total time first.
  - rung: 4
    name: worked_step
    text:
      en: Total distance = 1200 + 800; total time = 150 + 120. Now divide.
  - rung: 5
    name: full_step
    text:
      en: (1200 + 800) ÷ (150 + 120) = 7.4 m/s.
  misconception_ids:
  - mc.phy.o.average_of_speeds
solution:
  steps:
  - n: 1
    latex: v = \frac{d_1 + d_2}{t_1 + t_2}
    reason: Average speed uses totals
  - n: 2
    latex: d_1 + d_2 = 2000\ \text{m}
    reason: Total distance
    check_id: chk_build_phy_k_0031_s2
  - n: 3
    latex: t_1 + t_2 = 270\ \text{s}
    reason: Total time
    check_id: chk_build_phy_k_0031_s3
  - n: 4
    latex: v = 7.4\ \text{m/s}
    reason: Divide
    check_id: chk_build_phy_k_0031_a
