stem: A classroom measuring 12 m × 8 m × 3 m is completely filled with air. The density of air is 1.2 kg/m³.
parts:
- id: a
  prompt: Calculate the mass of the air.
  marks: 2
  answer:
    kind: numeric
    value: '345.6'
    unit: kg
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_den_0003_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Density is the mass packed into one cubic metre of the material.
  - rung: 2
    name: concept
    text:
      en: Mass = density × volume.
  - rung: 3
    name: first_step
    text:
      en: 'Find the volume first: multiply the three measurements.'
  - rung: 4
    name: worked_step
    text:
      en: The volume is 288 m³; multiply it by 1.2.
  - rung: 5
    name: full_step
    text:
      en: The mass is 345.6 kg.
  misconception_ids:
  - mc.phy.o.density_rearranged_wrongly
  - mc.phy.o.density_volume_over_mass
  - mc.phy.o.block_volume_two_sides
solution:
  steps:
  - n: 1
    latex: V = 12 \times 8 \times 3 = 288\ \text{m}^3
    reason: Volume of a box shape
    check_id: chk_build_phy_den_0003_v
  - n: 2
    latex: m = \rho V = 1.2 \times 288 = 345.6\ \text{kg}
    reason: Mass = density × volume
    check_id: chk_build_phy_den_0003_ans
