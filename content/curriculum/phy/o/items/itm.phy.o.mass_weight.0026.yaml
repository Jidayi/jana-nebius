id: itm.phy.o.mass_weight.0026
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.mass_weight.mass_or_weight
stem: A 500 kg load of supplies is sent from the Earth to Mars, where g is smaller.
parts:
- id: a
  prompt: Which statement is correct after it lands on Mars?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It weighs 500 kg on Mars
      correct: false
      misconception_id: mc.phy.o.mass_weight_units_swapped
      feedback: Mass is measured in kilograms. Weight is a force, so it is measured in newtons. A label saying '2 kg' gives a mass.
    - id: B
      text: Its mass is now less than 500 kg
      correct: false
      misconception_id: mc.phy.o.mass_changes_with_g
      feedback: Mass is the amount of matter in the object, and a trip to the Moon removes no matter. Only the weight, the pull of gravity on it, changes.
    - id: C
      text: Its mass is still 500 kg, but it weighs less
      correct: true
    - id: D
      text: It weighs the same as it did on Earth
      correct: false
      misconception_id: mc.phy.o.weight_same_on_every_planet
      feedback: Weight is the pull of a planet on the object, weight = mass × g. A world with a smaller g pulls less on the same mass.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide whether each option is about mass, weight, or both.
  - rung: 2
    name: concept
    text:
      en: A smaller g means a smaller pull on each kilogram.
  - rung: 3
    name: first_step
    text:
      en: Test each option against the difference between the amount of matter and the pull of gravity.
  - rung: 4
    name: worked_step
    text:
      en: Rule out every option that mixes up the two quantities.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Its mass is still 500 kg, but it weighs less.'
  misconception_ids:
  - mc.phy.o.mass_changes_with_g
  - mc.phy.o.mass_weight_units_swapped
  - mc.phy.o.weight_same_on_every_planet
solution:
  steps:
  - n: 1
    latex: \text{Its mass is still 500 kg, but it weighs less}
    reason: Mass stays the same; weight depends on g
