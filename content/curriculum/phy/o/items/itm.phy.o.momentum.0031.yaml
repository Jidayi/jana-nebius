id: itm.phy.o.momentum.0031
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.momentum.impulse
stem: A cricket ball of mass 0.16 kg moving at 30 m/s is caught and stopped in 100 ms.
parts:
- id: a
  prompt: Find the average force on it.
  marks: 3
  answer:
    kind: numeric
    value: '48'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mom_0031_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Impulse = force × time = change in momentum.
  - rung: 2
    name: concept
    text:
      en: Find the change in momentum, then divide by the time in seconds.
  - rung: 3
    name: first_step
    text:
      en: It ends at rest, so the change in momentum is m × u.
  - rung: 4
    name: worked_step
    text:
      en: Δp = 4.8 kg m/s and t = 0.1 s.
  - rung: 5
    name: full_step
    text:
      en: F = 4.8 ÷ 0.1 = 48 N.
  misconception_ids:
  - mc.phy.o.impulse_ms_not_converted
  - mc.phy.o.impulse_time_multiplied
  - mc.phy.o.impulse_change_as_force
solution:
  steps:
  - n: 1
    latex: \Delta p = 0.16 \times 30 - 0 = 4.8\ \text{kg m/s}
    reason: Change in momentum
    check_id: chk_build_phy_mom_0031_dp
  - n: 2
    latex: t = 100\ \text{ms} = 0.1\ \text{s}
    reason: Time in seconds
    check_id: chk_build_phy_mom_0031_ts
  - n: 3
    latex: F = \frac{\Delta p}{t} = \frac{4.8}{0.1} = 48\ \text{N}
    reason: 'Impulse: Ft = Δp'
    check_id: chk_build_phy_mom_0031_ans
