id: itm.phy.o.radioactivity.0058
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.background_radiation
stem: A radiation counter is switched on in a room with no radioactive source in it.
parts:
- id: a
  prompt: What does it record?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Zero, because there is no source
      correct: false
      misconception_id: mc.phy.o.background_zero_without_source
      feedback: Switch on a counter in an empty room and it still clicks now and then. Radiation from rocks, the air, food and space reaches us all the time.
    - id: B
      text: Exactly the same number of counts every minute
      correct: false
      misconception_id: mc.phy.o.decay_not_random
      feedback: No one can say when a particular nucleus will decay. Counts over equal times vary a little, so repeat them and take a mean.
    - id: C
      text: A small count rate that varies a little from minute to minute
      correct: true
    - id: D
      text: Counts from the radio and phone signals in the room
      correct: false
      misconception_id: mc.phy.o.background_from_non_ionising
      feedback: 'Background radiation means ionising radiation: alpha, beta and gamma from radioactive substances, and cosmic rays. Radio and phone signals do not ionise and are not counted.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Background radiation is ionising radiation that is around us all the time.
  - rung: 2
    name: concept
    text:
      en: Most of it comes from natural sources in the ground, the air, space and our food.
  - rung: 3
    name: first_step
    text:
      en: Radiation reaches the counter from the surroundings, and decay is random.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that are not ionising radiation or that ignore natural sources.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: A small count rate that varies a little from minute to minute.'
  misconception_ids:
  - mc.phy.o.background_from_non_ionising
  - mc.phy.o.background_zero_without_source
  - mc.phy.o.decay_not_random
solution:
  steps:
  - n: 1
    latex: \text{A small count rate that varies a little from minute to minute}
    reason: Background is natural ionising radiation
