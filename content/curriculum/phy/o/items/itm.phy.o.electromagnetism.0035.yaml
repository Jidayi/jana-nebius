stem: Pushing a magnet into a coil at 1 m/s gives a peak e.m.f. of 24 mV.
parts:
- id: a
  prompt: Assuming the e.m.f. is proportional to the speed, predict the peak e.m.f. at 2.5 m/s, in mV.
  marks: 2
  answer:
    kind: numeric
    value: '60'
    unit: mV
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_emg_0035_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Moving the magnet faster changes the field through the coil faster.
  - rung: 2
    name: concept
    text:
      en: A faster change induces a proportionally bigger e.m.f.
  - rung: 3
    name: first_step
    text:
      en: Find how many times faster the magnet moves.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 24 mV by 2.5.
  - rung: 5
    name: full_step
    text:
      en: E = 24 × 2.5 = 60 mV.
  misconception_ids:
  - mc.phy.o.induction_factor_reversed
solution:
  steps:
  - n: 1
    latex: \frac{2.5}{1} = 2.5
    reason: How many times faster
    check_id: chk_build_phy_emg_0035_ratio
  - n: 2
    latex: E = 24 \times 2.5 = 60\ \text{mV}
    reason: The e.m.f. grows in the same ratio
    check_id: chk_build_phy_emg_0035_ans
