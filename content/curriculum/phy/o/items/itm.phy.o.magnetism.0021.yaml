id: itm.phy.o.magnetism.0021
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.magnetism.magnetic_fields
stem: A field diagram shows lines far apart at the side of a magnet and close together at its ends.
parts:
- id: a
  prompt: What do the widely spaced lines at the side show?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The field there is stronger
      correct: false
      misconception_id: mc.phy.o.field_lines_spacing_reversed
      feedback: Lines crowd together at the poles, where the field is strongest. The closer the lines, the stronger the field.
    - id: B
      text: The field there is weaker
      correct: true
    - id: C
      text: The field there is strongest, because it is the middle
      correct: false
      misconception_id: mc.phy.o.field_strongest_at_middle
      feedback: Iron filings pile up at the ends of a bar magnet and hardly at all at its middle. The field is strongest at the poles.
    - id: D
      text: There is no field between those lines
      correct: false
      misconception_id: mc.phy.o.field_only_on_drawn_lines
      feedback: A compass placed between two drawn lines still turns. The lines show the field's direction and strength; the field is everywhere near the magnet.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture a small plotting compass placed at that point near the magnet.
  - rung: 2
    name: concept
    text:
      en: Field lines run from north to south outside a magnet, never cross, and are closest where the field is strongest, at the poles.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: 'The spacing of the lines shows the strength: wide spacing means a weak field.'
  - rung: 5
    name: full_step
    text:
      en: 'The field there is weaker. The spacing of the lines shows the strength: wide spacing means a weak field.'
  misconception_ids:
  - mc.phy.o.field_lines_spacing_reversed
  - mc.phy.o.field_only_on_drawn_lines
  - mc.phy.o.field_strongest_at_middle
solution:
  steps:
  - n: 1
    latex: \text{The field there is weaker}
    reason: Use the rules for magnetic field lines
