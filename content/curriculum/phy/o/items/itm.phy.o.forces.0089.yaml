id: itm.phy.o.forces.0089
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.moments
stem: A lamp of mass 4 kg hangs from the end of a bracket, 30 cm out from the wall. Take g = 10 N/kg.
parts:
- id: a
  prompt: Find the moment of its weight about the point where the bracket is fixed to the wall, in N m.
  marks: 2
  answer:
    kind: numeric
    value: '12'
    unit: N m
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_frc_0089_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A moment is force × perpendicular distance from the pivot.
  - rung: 2
    name: concept
    text:
      en: The force here is the weight of the object, not its mass.
  - rung: 3
    name: first_step
    text:
      en: Find the weight, change the distance into metres, then multiply.
  - rung: 4
    name: worked_step
    text:
      en: The weight is 40 N and the distance is 0.3 m.
  - rung: 5
    name: full_step
    text:
      en: Moment = 40 × 0.3 = 12 N m.
  misconception_ids:
  - mc.phy.o.mass_in_kg_used_as_force
  - mc.phy.o.moment_cm_not_converted
  - mc.phy.o.moment_force_over_distance
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: W = 4 \times 10 = 40\ \text{N}
    reason: The force is the weight
    check_id: chk_build_phy_frc_0089_w
  - n: 2
    latex: d = 30\ \text{cm} = 0.3\ \text{m}
    reason: Distance in metres
    check_id: chk_build_phy_frc_0089_d
  - n: 3
    latex: M = Fd = 40 \times 0.3 = 12\ \text{N m}
    reason: Moment = force × perpendicular distance
    check_id: chk_build_phy_frc_0089_ans
