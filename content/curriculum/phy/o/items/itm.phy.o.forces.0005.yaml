id: itm.phy.o.forces.0005
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.resultant_force
stem: A shopping trolley is pushed with a steady force that is bigger than the friction on it.
parts:
- id: a
  prompt: Which describes the trolley's motion while the push continues?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It reaches a steady speed straight away and keeps it
      correct: false
      misconception_id: mc.phy.o.resultant_gives_steady_speed
      feedback: An unbalanced force makes the speed keep changing for as long as it acts. A bigger resultant force gives a bigger acceleration, not a bigger steady speed.
    - id: B
      text: Its speed keeps increasing
      correct: true
    - id: C
      text: It moves at a steady speed, since the push only keeps it going
      correct: false
      misconception_id: mc.phy.o.moving_needs_resultant_force
      feedback: On smooth ice a sliding puck keeps going with nothing pushing it. A resultant force changes velocity; it is not needed to keep a velocity the same.
    - id: D
      text: It stays still until the push is bigger than its weight
      correct: false
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about whether the forces on the object are balanced or unbalanced.
  - rung: 2
    name: concept
    text:
      en: Balanced forces give a zero resultant, so the velocity stays the same; unbalanced forces change the speed or the direction.
  - rung: 3
    name: first_step
    text:
      en: Compare the forces acting in each direction with what the object is doing.
  - rung: 4
    name: worked_step
    text:
      en: Work out whether the forward and backward forces balance.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Its speed keeps increasing. The forces are unbalanced, so there is a resultant force forwards and the trolley accelerates.'
  misconception_ids:
  - mc.phy.o.moving_needs_resultant_force
  - mc.phy.o.resultant_gives_steady_speed
solution:
  steps:
  - n: 1
    latex: \text{Its speed keeps increasing}
    reason: Use the resultant force to decide how the motion changes
