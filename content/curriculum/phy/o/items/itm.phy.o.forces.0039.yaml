id: itm.phy.o.forces.0039
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.friction_and_terminal_velocity
stem: A car's tyres grip the road as it drives along.
parts:
- id: a
  prompt: Which statement about friction is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Friction only wastes energy, so a car would work better without any
      correct: false
      misconception_id: mc.phy.o.friction_always_unwanted
      feedback: 'Try walking on very smooth ice: without friction between your shoes and the ground you cannot push off. Tyres, brakes and shoes all need friction.'
    - id: B
      text: Friction is needed only to slow the car down
      correct: false
      misconception_id: mc.phy.o.friction_always_unwanted
      feedback: 'Try walking on very smooth ice: without friction between your shoes and the ground you cannot push off. Tyres, brakes and shoes all need friction.'
    - id: C
      text: Friction is needed to keep the car moving at a steady speed
      correct: false
      misconception_id: mc.phy.o.moving_needs_resultant_force
      feedback: On smooth ice a sliding puck keeps going with nothing pushing it. A resultant force changes velocity; it is not needed to keep a velocity the same.
    - id: D
      text: The car needs friction between its tyres and the road to speed up, slow down and turn
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about which forces act and how big each one is at this moment.
  - rung: 2
    name: concept
    text:
      en: Friction and air resistance act against the motion, and air resistance grows as the speed grows.
  - rung: 3
    name: first_step
    text:
      en: Work out whether the forces are balanced and what that does to the speed.
  - rung: 4
    name: worked_step
    text:
      en: Think about what happens to a car on a very icy road.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The car needs friction between its tyres and the road to speed up, slow down and turn. The tyres push back on the road and friction pushes the car forward; without grip the wheels just spin.'
  misconception_ids:
  - mc.phy.o.friction_always_unwanted
  - mc.phy.o.moving_needs_resultant_force
solution:
  steps:
  - n: 1
    latex: \text{The car needs friction between its tyres and the road to speed up, slow down and turn}
    reason: Compare the forces and how they change
