stem: Oxygen has proton number 8. Its isotopes are oxygen-16, oxygen-17 and oxygen-18.
parts:
- id: a
  prompt: How many electrons does a neutral atom of oxygen-18 have?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: 18, one for each nucleon
      correct: false
      misconception_id: mc.phy.o.isotopes_differ_in_electrons
      feedback: A neutral atom has one electron for each proton. Isotopes share the proton number, so their neutral atoms have the same electrons.
    - id: B
      text: 10, one for each neutron
      correct: false
      misconception_id: mc.phy.o.electrons_equal_neutrons
      feedback: A neutral atom has no overall charge, so its negative electrons must balance its positive protons. Neutrons carry no charge.
    - id: C
      text: It depends on how radioactive the isotope is
      correct: false
      misconception_id: mc.phy.o.isotope_means_radioactive
      feedback: Carbon-12 is a stable isotope of carbon and carbon-14 a radioactive one. Being an isotope is about protons and neutrons, not about decay.
    - id: D
      text: 8, the same as the other isotopes
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide what makes two nuclides the same element.
  - rung: 2
    name: concept
    text:
      en: Isotopes have the same proton number but different nucleon numbers.
  - rung: 3
    name: first_step
    text:
      en: Electrons balance the charge of the nucleus.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against that definition.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: 8, the same as the other isotopes.'
  misconception_ids:
