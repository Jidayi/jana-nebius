- kc.phy.o.electrical_quantities.current_and_charge
stem: A small electric motor takes a current of 200 mA.
parts:
- id: a
  prompt: How long does it take for 16 C of charge to flow through it, in seconds?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 3.2 s
      correct: false
      misconception_id: mc.phy.o.q_it_multiplied
      feedback: If 10 C flow in 5 s, each second carries 2 C, not 50 C. Divide the charge by the time to get the current.
    - id: B
      text: 0.0125 s
      correct: false
      misconception_id: mc.phy.o.q_it_upside_down
      feedback: From Q = It, divide both sides by t to get I = Q/t, or by I to get t = Q/I. The charge stays on top.
    - id: C
      text: 80 s
      correct: true
    - id: D
      text: 0.08 s
      correct: false
      misconception_id: mc.phy.o.milliamps_used_as_amps
      feedback: A milliamp is a thousandth of an amp. Change milliamps to amps before using the formula.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Each second, the current carries a fixed amount of charge.
  - rung: 2
    name: concept
    text:
      en: From Q = I t, the time is t = Q ÷ I.
  - rung: 3
    name: first_step
    text:
      en: First change the current into amps.
  - rung: 4
    name: worked_step
    text:
      en: Divide 16 C by 0.2 A.
  - rung: 5
    name: full_step
    text:
      en: t = 16 ÷ 0.2 = 80 s.
  misconception_ids:
  - mc.phy.o.milliamps_used_as_amps
  - mc.phy.o.q_it_multiplied
  - mc.phy.o.q_it_upside_down
solution:
  steps:
  - n: 1
    latex: I = 200\ \text{mA} = 0.2\ \text{A}
    reason: A thousand mA in 1 A
    check_id: chk_build_phy_elq_0026_ia
  - n: 2
    latex: t = \frac{Q}{I} = \frac{16}{0.2} = 80\ \text{s}
    reason: Rearrange Q = It
    check_id: chk_build_phy_elq_0026_ans
