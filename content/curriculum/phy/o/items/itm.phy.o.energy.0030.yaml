id: itm.phy.o.energy.0030
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.kinetic_energy
stem: A football moving at 25 m/s has 125 J of kinetic energy.
parts:
- id: a
  prompt: Calculate the mass.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 0.2 kg
      correct: false
      misconception_id: mc.phy.o.ke_half_omitted
      feedback: Kinetic energy is ½mv². Write the whole formula down before you put in any numbers.
    - id: B
      text: 10 kg
      correct: false
      misconception_id: mc.phy.o.ke_speed_not_squared
      feedback: 'Try a speed of 2 m/s and then 4 m/s: the kinetic energy goes up four times, not twice. The speed is squared.'
    - id: C
      text: 0.4 kg
      correct: true
    - id: D
      text: 0.1 kg
      correct: false
      misconception_id: mc.phy.o.ke_rearrange_half_wrong
      feedback: 'To undo a half, multiply by 2: v² = 2Ek ÷ m and m = 2Ek ÷ v².'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: You know the kinetic energy and the speed; the mass is the unknown.
  - rung: 2
    name: concept
    text:
      en: Rearrange Ek = ½mv² to get m = 2Ek ÷ v².
  - rung: 3
    name: first_step
    text:
      en: 'Square the speed: 25² = 625.'
  - rung: 4
    name: worked_step
    text:
      en: Work out 2 × 125 ÷ 625.
  - rung: 5
    name: full_step
    text:
      en: The mass is 0.4 kg.
  misconception_ids:
  - mc.phy.o.ke_half_omitted
  - mc.phy.o.ke_rearrange_half_wrong
  - mc.phy.o.ke_speed_not_squared
solution:
  steps:
  - n: 1
    latex: v^2 = 25^2 = 625
    reason: Square the speed
    check_id: chk_build_phy_nrg_0030_sq
  - n: 2
    latex: m = \frac{2E_k}{v^2} = \frac{2 \times 125}{625} = 0.4\ \text{kg}
    reason: Rearrange E_k = ½mv²
    check_id: chk_build_phy_nrg_0030_ans
