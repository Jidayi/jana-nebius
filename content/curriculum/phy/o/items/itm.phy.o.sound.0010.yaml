stem: Astronauts on a spacewalk cannot hear each other shout, even when they are close together.
parts:
- id: a
  prompt: Why not?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Sound can cross space but becomes too faint
      correct: false
      misconception_id: mc.phy.o.sound_travels_in_vacuum
      feedback: As air is pumped out of a jar round a ringing bell, the sound fades away although the bell still moves. Sound needs particles.
    - id: B
      text: Sound waves are transverse and space blocks them
      correct: false
      misconception_id: mc.phy.o.sound_called_transverse
      feedback: 'Sound is longitudinal: the particles move back and forth along the direction the sound travels, making compressions and rarefactions.'
    - id: C
      text: There are no particles in space to pass on the vibrations
      correct: true
    - id: D
      text: Their voices stop vibrating in a vacuum
      correct: false
      misconception_id: mc.phy.o.vacuum_stops_source
      feedback: You can still see the hammer hitting the bell. The source keeps vibrating; without air there is nothing to carry the sound away.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture what happens between a vibrating object and your ear.
  - rung: 2
    name: concept
    text:
      en: The particles of the material vibrate back and forth along the direction the sound travels, passing the energy on.
  - rung: 3
    name: first_step
    text:
      en: Squashed regions and stretched regions travel outwards; the particles themselves stay where they were on average.
  - rung: 4
    name: worked_step
    text:
      en: Sound needs particles to pass the vibrations along.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: There are no particles in space to pass on the vibrations.'
  misconception_ids:
  - mc.phy.o.sound_called_transverse
  - mc.phy.o.sound_travels_in_vacuum
  - mc.phy.o.vacuum_stops_source
solution:
  steps:
  - n: 1
    latex: \text{There are no particles in space to pass on the vibrations}
    reason: Sound is a longitudinal wave that needs a medium
