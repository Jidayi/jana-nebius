stem: Neema tests an electromagnet with the same coil and core. With a current of 0.4 A it lifts 4 paper clips, and with 0.8 A it lifts 8.
parts:
- id: a
  prompt: Assuming the number of clips is proportional to the current, predict the number lifted at 1.4 A.
  marks: 2
  answer:
    kind: numeric
    value: '14'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_emg_0003_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A bigger current makes a stronger electromagnet.
  - rung: 2
    name: concept
    text:
      en: The data show the clips going up in step with the current.
  - rung: 3
    name: first_step
    text:
      en: Find the number of clips for each amp.
  - rung: 4
    name: worked_step
    text:
      en: Work out 4 ÷ 0.4, then multiply by 1.4.
  - rung: 5
    name: full_step
    text:
      en: 10 clips per amp × 1.4 A = 14 clips.
solution:
  steps:
  - n: 1
    latex: \frac{4}{0.4} = 10\ \text{clips per amp}
    reason: Clips for each amp
    check_id: chk_build_phy_emg_0003_per
  - n: 2
    latex: 10 \times 1.4 = 14\ \text{clips}
    reason: Scale up to the new current
    check_id: chk_build_phy_emg_0003_ans
