stem: Atmospheric pressure at the surface of the sea is 101 kPa. Sea water has a density of 1030 kg/m³. Take g = 9.8 N/kg.
parts:
- id: a
  prompt: Calculate the total pressure on a diver 25 m below the surface, in kPa.
  marks: 3
  answer:
    kind: numeric
    value: '353'
    unit: kPa
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_prs_0025_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Two things press on the diver: the water above and the air above the water.'
  - rung: 2
    name: concept
    text:
      en: Total pressure = atmospheric pressure + ρgh.
  - rung: 3
    name: first_step
    text:
      en: Find ρgh in pascals, change it to kPa, then add the atmospheric pressure.
  - rung: 4
    name: worked_step
    text:
      en: The water adds 252 kPa.
  - rung: 5
    name: full_step
    text:
      en: The total pressure is 353 kPa.
  misconception_ids:
  - mc.phy.o.liquid_pressure_atmosphere_left_out
  - mc.phy.o.liquid_pressure_g_left_out
  - mc.phy.o.liquid_density_ignored
solution:
  steps:
  - n: 1
    latex: \rho g h = 1030 \times 9.8 \times 25 = 252\ \text{kPa}
    reason: The pressure due to the water, in kPa
    check_id: chk_build_phy_prs_0025_dp
  - n: 2
    latex: p = 101 + 252 = 353\ \text{kPa}
    reason: Add the air pressure on the surface
    check_id: chk_build_phy_prs_0025_ans
