stem: During hard exercise in hot weather, a runner loses 0.4 kg of sweat each hour by evaporation. Evaporating sweat at skin temperature takes about 2400 kJ/kg.
parts:
- id: a
  prompt: Find the average rate at which evaporation removes energy from the runner, in watts.
  marks: 3
  answer:
    kind: numeric
    value: '267'
    unit: W
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_thp_0053_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Evaporating sweat takes energy from the skin, which cools the body.
  - rung: 2
    name: concept
    text:
      en: Find the energy taken in one hour with E = mL, then divide by the time in seconds.
  - rung: 3
    name: first_step
    text:
      en: Multiply 0.4 kg by 2400 kJ/kg and change to joules.
  - rung: 4
    name: worked_step
    text:
      en: Divide 960000 J by 3600 s.
  - rung: 5
    name: full_step
    text:
      en: Evaporation removes energy at about 267 W.
solution:
  steps:
  - n: 1
    latex: E = mL = 0.4 \times 2400 = 960\ \text{kJ}
    reason: Energy taken by the sweat
    check_id: chk_build_phy_thp_0053_e
  - n: 2
    latex: E = 960000\ \text{J}
    reason: Joules, to give watts
    check_id: chk_build_phy_thp_0053_ej
  - n: 3
    latex: t = 1\ \text{h} = 3600\ \text{s}
    reason: One hour in seconds
    check_id: chk_build_phy_thp_0053_ts
  - n: 4
    latex: P = \frac{E}{t} = \frac{960000}{3600} = 267\ \text{W}
    reason: Power = energy ÷ time
    check_id: chk_build_phy_thp_0053_ans
