stem: A sound wave travels through air.
parts:
- id: a
  prompt: What is a rarefaction?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: A region where the air particles are closer together than normal
      correct: false
      misconception_id: mc.phy.o.compression_rarefaction_swapped
      feedback: 'Compressed means squeezed: particles closer together than normal. A rarefaction is the thinned-out region where they are further apart.'
    - id: B
      text: A region with no air particles at all
      correct: false
      misconception_id: mc.phy.o.rarefaction_is_empty
      feedback: A rarefaction still has air in it; the particles are just a little further apart than normal.
    - id: C
      text: The bottom of a trough of the sound wave
      correct: false
      misconception_id: mc.phy.o.sound_called_transverse
      feedback: 'Sound is longitudinal: the particles move back and forth along the direction the sound travels, making compressions and rarefactions.'
    - id: D
      text: A region where the air particles are further apart than normal
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture what happens between a vibrating object and your ear.
  - rung: 2
    name: concept
    text:
      en: The particles of the material vibrate back and forth along the direction the sound travels, passing the energy on.
  - rung: 3
    name: first_step
    text:
      en: Squashed regions and stretched regions travel outwards; the particles themselves stay where they were on average.
  - rung: 4
    name: worked_step
    text:
      en: Sound needs particles to pass the vibrations along.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: A region where the air particles are further apart than normal.'
  misconception_ids:
