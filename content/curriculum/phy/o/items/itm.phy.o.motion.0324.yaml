id: itm.phy.o.motion.0324
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.motion.distance_time_gradient
stem: A straight distance-time graph for a car passes through (10 s, 30 m) and (12 s, 120 m).
parts:
- id: a
  prompt: What speed does the gradient of the line give?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 45 m/s
      correct: true
    - id: B
      text: 0.0222 m/s
      correct: false
      misconception_id: mc.phy.o.gradient_axes_swapped
      feedback: The gradient is the change up the graph (distance) divided by the change along it (time).
    - id: C
      text: 10 m/s
      correct: false
      misconception_id: mc.phy.o.gradient_from_one_point
      feedback: A line that does not start at the origin gives the wrong value from one point. Use the change between two points.
    - id: D
      text: 90 m/s
      correct: false
      misconception_id: mc.phy.o.distance_change_without_time
      feedback: 'Speed is distance per unit time: the rise of the line divided by its run.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: On a distance-time graph the gradient is the speed.
  - rung: 2
    name: concept
    text:
      en: Gradient = change in distance ÷ change in time, between two points on the line.
  - rung: 3
    name: first_step
    text:
      en: Subtract the distances and subtract the times, in the same order.
  - rung: 4
    name: worked_step
    text:
      en: The changes are 90 m and 2 s.
  - rung: 5
    name: full_step
    text:
      en: The speed is 45 m/s.
  misconception_ids:
  - mc.phy.o.distance_change_without_time
  - mc.phy.o.gradient_axes_swapped
  - mc.phy.o.gradient_from_one_point
solution:
  steps:
  - n: 1
    latex: \Delta d = 120 - 30 = 90\ \text{m},\ \Delta t = 12 - 10 = 2\ \text{s}
    reason: Changes between the two points
    check_id: chk_build_phy_mot_0324_dd
  - n: 2
    latex: v = \frac{90}{2} = 45\ \text{m/s}
    reason: Gradient = change in distance ÷ change in time
    check_id: chk_build_phy_mot_0324_ans
