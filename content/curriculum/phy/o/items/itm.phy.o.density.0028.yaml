id: itm.phy.o.density.0028
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.density.measuring_density
stem: A measuring cylinder holds water up to the 30 cm³ mark. A glass stopper of mass 20 g is lowered in on a thread until it is fully under water, and the level rises to 38 cm³.
parts:
- id: a
  prompt: Calculate the density of the glass stopper in g/cm³.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 2.5 g/cm³
      correct: true
    - id: B
      text: 0.526 g/cm³
      correct: false
      misconception_id: mc.phy.o.displacement_final_reading_as_volume
      feedback: The cylinder already held water before the object went in. Only the rise in level, the final reading minus the starting reading, is the object's volume.
    - id: C
      text: 0.294 g/cm³
      correct: false
      misconception_id: mc.phy.o.displacement_readings_added
      feedback: 'If nothing at all were put in, the two readings would be equal, and adding them would still give a volume. The object''s volume is the difference: final reading minus starting reading.'
    - id: D
      text: 0.4 g/cm³
      correct: false
      misconception_id: mc.phy.o.density_volume_over_mass
      feedback: 'Density says how much mass is packed into each unit of volume: mass ÷ volume. A small, heavy object must come out with a large density.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The object's volume is the volume of water it pushes aside.
  - rung: 2
    name: concept
    text:
      en: 'The rise in the water level gives the volume: final reading − starting reading.'
  - rung: 3
    name: first_step
    text:
      en: Work out 38 − 30, then divide the mass by it.
  - rung: 4
    name: worked_step
    text:
      en: The volume is 8 cm³.
  - rung: 5
    name: full_step
    text:
      en: The density of the glass stopper is 2.5 g/cm³.
  misconception_ids:
  - mc.phy.o.density_volume_over_mass
  - mc.phy.o.displacement_final_reading_as_volume
  - mc.phy.o.displacement_readings_added
solution:
  steps:
  - n: 1
    latex: V = 38 - 30 = 8\ \text{cm}^3
    reason: The rise in level is the object's volume
    check_id: chk_build_phy_den_0028_v
  - n: 2
    latex: \rho = \frac{20}{8} = 2.5\ \text{g/cm}^3
    reason: Density = mass ÷ volume
    check_id: chk_build_phy_den_0028_ans
