stem: A counter near a sample of radon-222 reads 344 counts/min. After 11.4 days it reads 64 counts/min. The background count rate is 24 counts/min.
parts:
- id: a
  prompt: Find the half-life of the isotope.
  marks: 3
  answer:
    kind: numeric
    value: '3.8'
    unit: days
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_rad_0036_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Only the count rate from the source halves; the background stays the same.
  - rung: 2
    name: concept
    text:
      en: Subtract the background from both readings first.
  - rung: 3
    name: first_step
    text:
      en: Then count how many times the corrected count rate halves, and share the time between the halvings.
  - rung: 4
    name: worked_step
    text:
      en: The corrected count rates are 320 and 40 counts/min.
  - rung: 5
    name: full_step
    text:
      en: The half-life is 3.8 days.
  misconception_ids:
  - mc.phy.o.half_lives_equal_ratio
  - mc.phy.o.half_life_half_of_time
  - mc.phy.o.half_lives_counted_wrongly
solution:
  steps:
  - n: 1
    latex: 344 - 24 = 320
    reason: Correct the first reading for background
    check_id: chk_build_phy_rad_0036_c0
  - n: 2
    latex: 64 - 24 = 40
    reason: and the second
    check_id: chk_build_phy_rad_0036_c1
  - n: 3
    latex: \frac{320}{2^{n}} = 40 \Rightarrow n = 3
    reason: Count the halvings
    check_id: chk_build_phy_rad_0036_n
  - n: 4
    latex: T = \frac{11.4}{3} = 3.8\ \text{days}
    reason: Time ÷ number of half-lives
    check_id: chk_build_phy_rad_0036_ans
