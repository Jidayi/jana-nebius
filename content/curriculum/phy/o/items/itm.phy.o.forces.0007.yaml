id: itm.phy.o.forces.0007
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.resultant_force
stem: A parachutist falls at a steady speed. Her weight is 700 N.
parts:
- id: a
  prompt: What is the size of the air resistance on her?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Less than 700 N, because she is still moving down
      correct: false
      misconception_id: mc.phy.o.moving_needs_resultant_force
      feedback: On smooth ice a sliding puck keeps going with nothing pushing it. A resultant force changes velocity; it is not needed to keep a velocity the same.
    - id: B
      text: 0 N, because her speed is not changing
      correct: false
      misconception_id: mc.phy.o.steady_speed_no_forces
      feedback: A car cruising at a steady speed still has friction and air resistance on it; the engine's force just matches them. Steady velocity means the forces balance, not that there are none.
    - id: C
      text: More than 700 N, because the resultant must point the way she moves
      correct: false
      misconception_id: mc.phy.o.resultant_along_motion
      feedback: The resultant force points the way the velocity is changing. A car that is slowing down has a resultant force pointing backwards.
    - id: D
      text: 700 N
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about whether the forces on the object are balanced or unbalanced.
  - rung: 2
    name: concept
    text:
      en: Balanced forces give a zero resultant, so the velocity stays the same; unbalanced forces change the speed or the direction.
  - rung: 3
    name: first_step
    text:
      en: Compare the forces acting in each direction with what the object is doing.
  - rung: 4
    name: worked_step
    text:
      en: A steady speed means no acceleration, so the forces must balance.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: 700 N. Her velocity is constant, so the upward air resistance must equal her weight.'
  misconception_ids:
  - mc.phy.o.moving_needs_resultant_force
  - mc.phy.o.resultant_along_motion
  - mc.phy.o.steady_speed_no_forces
solution:
  steps:
  - n: 1
    latex: \text{700 N}
    reason: Use the resultant force to decide how the motion changes
