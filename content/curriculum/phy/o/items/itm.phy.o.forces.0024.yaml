stem: A car of mass 1500 kg brakes. The total braking force on it is 6000 N and the other horizontal forces are small enough to ignore.
parts:
- id: a
  prompt: Find the size of its deceleration.
  marks: 1
  answer:
    kind: numeric
    value: '4'
    unit: m/s^2
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_frc_0024_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The braking force is the resultant force here.
  - rung: 2
    name: concept
    text:
      en: Use F = ma with a as the subject.
  - rung: 3
    name: first_step
    text:
      en: Divide the braking force by the mass.
  - rung: 4
    name: worked_step
    text:
      en: Work out 6000 ÷ 1500.
  - rung: 5
    name: full_step
    text:
      en: The deceleration is 4 m/s².
  misconception_ids:
  - mc.phy.o.fma_ratio_inverted
  - mc.phy.o.fma_multiplied_not_divided
solution:
  steps:
  - n: 1
    latex: a = \frac{6000}{1500} = 4\ \text{m/s}^2
    reason: a = F ÷ m
    check_id: chk_build_phy_frc_0024_ans
