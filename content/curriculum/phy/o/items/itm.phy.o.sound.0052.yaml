id: itm.phy.o.sound.0052
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.sound.ultrasound
stem: An engineer tests a steel block for cracks. An ultrasound pulse sent into the block gives an echo from a crack 10 µs later. Sound travels at 340 m/s in air and 6000 m/s in steel.
parts:
- id: a
  prompt: How far below the surface is the crack, in millimetres?
  marks: 3
  answer:
    kind: numeric
    value: '30'
    unit: mm
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_snd_0052_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The pulse travels through steel, so use the speed in steel.
  - rung: 2
    name: concept
    text:
      en: It goes to the crack and back, so halve the distance travelled.
  - rung: 3
    name: first_step
    text:
      en: 10 µs = 0.00001 s.
  - rung: 4
    name: worked_step
    text:
      en: d = 6000 × 0.00001 ÷ 2 in metres; then change to millimetres.
  - rung: 5
    name: full_step
    text:
      en: The crack is 30 mm below the surface.
  misconception_ids:
  - mc.phy.o.echo_not_halved
  - mc.phy.o.echo_halving_misapplied
  - mc.phy.o.ultrasound_air_speed_used
solution:
  steps:
  - n: 1
    latex: t = 10\ \mu\text{s} = 0.00001\ \text{s}
    reason: A microsecond is a millionth of a second
    check_id: chk_build_phy_snd_0052_ts
  - n: 2
    latex: d = \frac{6000 \times 0.00001}{2} = 0.03\ \text{m}
    reason: Half the there-and-back distance
    check_id: chk_build_phy_snd_0052_dm
  - n: 3
    latex: 0.03\ \text{m} = 30\ \text{mm}
    reason: A metre is a thousand millimetres
    check_id: chk_build_phy_snd_0052_ans
difficulty:
  prior: 0.5
  band: core
estimated_seconds: 100
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
context_tags:
- none
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_phy_snd_0052_ans:
    args:
      expression: 6000*10*10^(-3)/2
    tool: math_evaluate
  chk_build_phy_snd_0052_dm:
    args:
      expression: 6000*10*10^(-6)/2
    tool: math_evaluate
  chk_build_phy_snd_0052_ts:
    args:
      quantity: 10 µs
      to: s
    tool: units_convert
