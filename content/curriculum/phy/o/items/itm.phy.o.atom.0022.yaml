    text:
      en: Isotopes of one element have the same number of protons.
  - rung: 2
    name: concept
    text:
      en: So the difference in nucleon number must all be neutrons.
  - rung: 3
    name: first_step
    text:
      en: Find the neutrons in each nucleus (nucleon number − proton number), then compare.
  - rung: 4
    name: worked_step
    text:
      en: Potassium-39 has 20 neutrons and potassium-40 has 21.
  - rung: 5
    name: full_step
    text:
      en: Potassium-40 has 1 more neutron.
solution:
