stem: Nia plots a field line from the north pole round to the south pole of a magnet with a plotting compass 10 mm long. Each time, she moves the compass so its tail is where its north end was. The finished line is 12 cm long.
parts:
- id: a
  prompt: How many times did she move the compass along the line?
  marks: 1
  answer:
    kind: numeric
    value: '12'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mag_0022_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Each move takes the compass one compass length further along the line.
  - rung: 2
    name: concept
    text:
      en: The line is made of equal steps, each as long as the compass.
  - rung: 3
    name: first_step
    text:
      en: Put the line's length and the compass's length in the same unit.
  - rung: 4
    name: worked_step
    text:
      en: The line is 120 mm long; divide by 10 mm.
  - rung: 5
    name: full_step
    text:
      en: 120 ÷ 10 = 12 moves.
solution:
  steps:
  - n: 1
    latex: 12\ \text{cm} = 120\ \text{mm}
    reason: Work in millimetres
    check_id: chk_build_phy_mag_0022_mm
  - n: 2
    latex: \frac{120}{10} = 12
    reason: Each move covers one compass length
