id: itm.phy.o.energy.0042
version: 0.1.1
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.potential_energy
stem: Chipo, of mass 55 kg, climbs a steep track and rises 200 m. Take g = 10 N/kg.
parts:
- id: a
  prompt: Calculate the gain in Chipo's gravitational potential energy in kJ.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 11 kJ
      correct: false
      misconception_id: mc.phy.o.energy_mass_for_weight
      feedback: Lifting works against the weight, mg, in newtons. Multiply the mass by g before you multiply by the height.
    - id: B
      text: 110000 kJ
      correct: false
      misconception_id: mc.phy.o.energy_kilo_prefix_ignored
      feedback: Kilo means a thousand. Change every kilo value to the base unit first, then change the answer to the unit the question asks for.
    - id: C
      text: 110 kJ
      correct: true
    - id: D
      text: 55 kJ
      correct: false
      misconception_id: mc.phy.o.gpe_half_from_ke
      feedback: The half belongs to kinetic energy only. The change in gravitational potential energy is simply mgh.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Climbing fills the gravitational potential store.
  - rung: 2
    name: concept
    text:
      en: Use ΔEp = mgΔh, then change joules to kilojoules.
  - rung: 3
    name: first_step
    text:
      en: Work out 55 × 10 × 200 in joules.
  - rung: 4
    name: worked_step
    text:
      en: That is 110000 J; now divide by a thousand.
  - rung: 5
    name: full_step
    text:
      en: The gain is 110 kJ.
  misconception_ids:
  - mc.phy.o.energy_kilo_prefix_ignored
  - mc.phy.o.energy_mass_for_weight
  - mc.phy.o.gpe_half_from_ke
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: \Delta E_p = 55 \times 10 \times 200 = 110000\ \text{J}
    reason: ΔEp = mgΔh
    check_id: chk_build_phy_nrg_0042_ej
  - n: 2
    latex: 110000\ \text{J} = 110\ \text{kJ}
    reason: A kilojoule is a thousand joules
    check_id: chk_build_phy_nrg_0042_ans
