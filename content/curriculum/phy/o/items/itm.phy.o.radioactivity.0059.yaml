subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.background_radiation
stem: A source near a counter gives 960 counts in 10 minutes. The background count rate is 19 counts/min.
parts:
- id: a
  prompt: Find the corrected count rate from the source.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 96 counts/min
      correct: false
      misconception_id: mc.phy.o.background_ignored
      feedback: Every reading includes background radiation from the surroundings. Subtract it to find what the source alone gives.
    - id: B
      text: 94.1 counts/min
      correct: false
      misconception_id: mc.phy.o.background_rate_from_count
      feedback: 'Put both into the same form first: turn the total count into counts per minute, then subtract the background per minute.'
    - id: C
      text: 115 counts/min
      correct: false
      misconception_id: mc.phy.o.background_added
      feedback: The measured reading already contains the background. Taking it away leaves the source's own count rate.
    - id: D
      text: 77 counts/min
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A corrected count rate is the count rate from the source alone.
  - rung: 2
    name: concept
    text:
      en: The background is given per minute, so first turn the count into a count per minute.
  - rung: 3
    name: first_step
    text:
      en: Then subtract the background count rate.
  - rung: 4
    name: worked_step
    text:
      en: The measured count rate is 96 counts/min.
  - rung: 5
    name: full_step
    text:
      en: The corrected count rate is 77 counts/min.
  misconception_ids:
  - mc.phy.o.background_added
  - mc.phy.o.background_ignored
  - mc.phy.o.background_rate_from_count
solution:
  steps:
  - n: 1
    latex: \frac{960}{10} = 96\ \text{counts/min}
    reason: Measured count rate
    check_id: chk_build_phy_rad_0059_c
  - n: 2
    latex: 96 - 19 = 77\ \text{counts/min}
    reason: Subtract the background count rate
    check_id: chk_build_phy_rad_0059_ans
