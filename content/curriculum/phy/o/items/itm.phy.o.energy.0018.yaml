id: itm.phy.o.energy.0018
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.kinetic_energy
stem: A runner moving at 6 m/s has 1260 J of kinetic energy.
parts:
- id: a
  prompt: Calculate the mass.
  marks: 2
  answer:
    kind: numeric
    value: '70'
    unit: kg
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_nrg_0018_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You know the kinetic energy and the speed; the mass is the unknown.
  - rung: 2
    name: concept
    text:
      en: Rearrange Ek = ½mv² to get m = 2Ek ÷ v².
  - rung: 3
    name: first_step
    text:
      en: 'Square the speed: 6² = 36.'
  - rung: 4
    name: worked_step
    text:
      en: Work out 2 × 1260 ÷ 36.
  - rung: 5
    name: full_step
    text:
      en: The mass is 70 kg.
  misconception_ids:
  - mc.phy.o.ke_half_omitted
  - mc.phy.o.ke_speed_not_squared
  - mc.phy.o.ke_rearrange_half_wrong
solution:
  steps:
  - n: 1
    latex: v^2 = 6^2 = 36
    reason: Square the speed
    check_id: chk_build_phy_nrg_0018_sq
  - n: 2
    latex: m = \frac{2E_k}{v^2} = \frac{2 \times 1260}{36} = 70\ \text{kg}
    reason: Rearrange E_k = ½mv²
    check_id: chk_build_phy_nrg_0018_ans
