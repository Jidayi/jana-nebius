id: itm.phy.o.electromagnetism.0032
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.electromagnetism.electromagnetic_induction
stem: A coil connected to a meter is moved quickly past a magnet that is held still.
parts:
- id: a
  prompt: What does the meter show?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: A reading, just as if the magnet had moved
      correct: true
    - id: B
      text: Zero, because the magnet must be the thing that moves
      correct: false
      misconception_id: mc.phy.o.magnet_must_move
      feedback: Move the coil over a still magnet and the meter moves just as when the magnet moves. Only the relative motion matters.
    - id: C
      text: Zero, unless the coil touches the magnet
      correct: false
      misconception_id: mc.phy.o.magnetic_force_needs_contact
      feedback: A compass needle swings when a magnet is still a hand's width away. Magnetic forces act at a distance.
    - id: D
      text: A reading only if the coil moves slowly
      correct: false
      misconception_id: mc.phy.o.induction_factor_reversed
      feedback: The faster the field changes, the bigger the e.m.f. Faster motion, a stronger magnet and more turns all increase it.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Ask what is changing in the magnetic field through the coil.
  - rung: 2
    name: concept
    text:
      en: An e.m.f. is induced while the field through a coil changes; faster change, a stronger magnet and more turns give a bigger e.m.f., and reversing the change reverses it.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Only the relative motion of the coil and the magnet matters.
  - rung: 5
    name: full_step
    text:
      en: A reading, just as if the magnet had moved. Only the relative motion of the coil and the magnet matters.
  misconception_ids:
  - mc.phy.o.induction_factor_reversed
  - mc.phy.o.magnet_must_move
  - mc.phy.o.magnetic_force_needs_contact
solution:
  steps:
  - n: 1
    latex: \text{A reading, just as if the magnet had moved}
    reason: A changing field induces an e.m.f.
