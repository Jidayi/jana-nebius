id: itm.phy.o.wave_properties.0056
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.wave_properties.wave_behaviour
stem: Straight water waves move head on into shallower water, along the normal to the boundary.
parts:
- id: a
  prompt: What happens to them?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: They slow down and keep going straight
      correct: true
    - id: B
      text: They slow down and bend towards the normal
      correct: false
      misconception_id: mc.phy.o.bends_at_normal_incidence
      feedback: Head on, the whole wavefront slows at the same moment, so it changes speed and wavelength but keeps going straight.
    - id: C
      text: They speed up and keep going straight
      correct: false
      misconception_id: mc.phy.o.depth_speed_reversed
      feedback: Water waves slow down as the water gets shallower; that is why their wavefronts crowd together near a beach.
    - id: D
      text: They keep the same speed and wavelength
      correct: false
      misconception_id: mc.phy.o.refraction_speed_unchanged
      feedback: Refraction happens because the speed changes. A change of depth always changes the speed of water waves.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Decide which effect is involved: bouncing back, bending at a change of depth, or spreading through a gap.'
  - rung: 2
    name: concept
    text:
      en: The source sets the frequency, and nothing at a boundary or a gap can change it.
  - rung: 3
    name: first_step
    text:
      en: Speed and wavelength change together only when the depth of the water changes.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these rules.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: They slow down and keep going straight.'
  misconception_ids:
  - mc.phy.o.bends_at_normal_incidence
  - mc.phy.o.depth_speed_reversed
  - mc.phy.o.refraction_speed_unchanged
solution:
  steps:
  - n: 1
    latex: \text{They slow down and keep going straight}
    reason: Match the effect to what changes and what stays the same
