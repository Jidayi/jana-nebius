type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.efficiency
stem: An electric motor has an efficiency of 90%. It transfers 900 J to the kinetic store of its load.
parts:
- id: a
  prompt: Calculate the electrical energy supplied to it.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 1000 J
      correct: true
    - id: B
      text: 810 J
      correct: false
      misconception_id: mc.phy.o.energy_formula_operation_swapped
      feedback: 'Write the formula, then undo each step: what is multiplied moves across as a division, and what is divided moves across as a multiplication.'
    - id: C
      text: 10 J
      correct: false
      misconception_id: mc.phy.o.efficiency_percent_not_converted
      feedback: 'Change a percentage to a fraction before using it: 75% is 75 ÷ 100 = 0.75.'
    - id: D
      text: 9000 J
      correct: false
      misconception_id: mc.phy.o.useful_wasted_swapped
      feedback: 'Sort the outputs first: what was the device for? That output is useful; everything else is wasted.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The input must be bigger than the useful output.
  - rung: 2
    name: concept
    text:
      en: Rearrange efficiency = useful ÷ input to get input = useful ÷ efficiency.
  - rung: 3
    name: first_step
    text:
      en: As a fraction, 90% is 0.9.
  - rung: 4
    name: worked_step
    text:
      en: Work out 900 ÷ 0.9.
  - rung: 5
    name: full_step
    text:
      en: The input is 1000 J.
  misconception_ids:
  - mc.phy.o.efficiency_percent_not_converted
  - mc.phy.o.energy_formula_operation_swapped
  - mc.phy.o.useful_wasted_swapped
solution:
  steps:
  - n: 1
    latex: 90\% = 0.9
    reason: Efficiency as a fraction
    check_id: chk_build_phy_nrg_0104_e
  - n: 2
    latex: \text{input} = \frac{\text{useful}}{\text{efficiency}} = \frac{900}{0.9} = 1000\ \text{J}
    reason: Rearrange efficiency = useful ÷ input
    check_id: chk_build_phy_nrg_0104_ans
