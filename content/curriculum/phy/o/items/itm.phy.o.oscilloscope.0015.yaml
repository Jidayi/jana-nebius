id: itm.phy.o.oscilloscope.0015
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.oscilloscope.time_base
stem: An oscilloscope's time-base is set to 0.2 ms/div. On the trace, the distance from a crest to the next trough is 2 divisions.
parts:
- id: a
  prompt: Calculate the frequency of the signal.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 1.25 Hz
      correct: false
      misconception_id: mc.phy.o.osc_ms_read_as_s
      feedback: f = 1/T gives hertz only when T is in seconds. Change milliseconds into seconds first.
    - id: B
      text: 2500 Hz
      correct: false
      misconception_id: mc.phy.o.osc_half_wave_as_period
      feedback: One complete wave runs from a crest to the next crest. Crest to trough is only half a wave.
    - id: C
      text: 0.8 Hz
      correct: false
      misconception_id: mc.phy.o.osc_frequency_period_confused
      feedback: 'The period is the time for one wave, in seconds. The frequency is how many waves pass each second: f = 1/T.'
    - id: D
      text: 1250 Hz
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'First find the period: the time for one complete wave.'
  - rung: 2
    name: concept
    text:
      en: Period = divisions for one wave × time-base; then f = 1/T with T in seconds.
  - rung: 3
    name: first_step
    text:
      en: Find how many divisions one complete wave takes and multiply by 0.2 ms.
  - rung: 4
    name: worked_step
    text:
      en: The period is 0.8 ms, which is 0.0008 s; now work out 1 ÷ T.
  - rung: 5
    name: full_step
    text:
      en: The frequency is 1250 Hz.
  misconception_ids:
  - mc.phy.o.osc_frequency_period_confused
  - mc.phy.o.osc_half_wave_as_period
  - mc.phy.o.osc_ms_read_as_s
solution:
  steps:
  - n: 1
    latex: T = 2 \times 2 \times 0.2 = 0.8\ \text{ms}
    reason: Crest to trough is half a wave, so double it
    check_id: chk_build_phy_osc_0015_tm
  - n: 2
    latex: T = 0.8\ \text{ms} = 0.0008\ \text{s}
    reason: Period in seconds
    check_id: chk_build_phy_osc_0015_ts
  - n: 3
    latex: f = \frac{1}{T} = \frac{1}{0.0008} = 1250\ \text{Hz}
    reason: Frequency is one over the period
    check_id: chk_build_phy_osc_0015_ans
difficulty:
  prior: 0.4
  band: core
estimated_seconds: 90
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
context_tags:
- none
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_phy_osc_0015_ans:
    args:
      expression: 1000/(2*2*0.2)
    tool: math_evaluate
  chk_build_phy_osc_0015_tm:
    args:
      expression: 2*2*0.2
    tool: math_evaluate
  chk_build_phy_osc_0015_ts:
    args:
      quantity: 0.8 ms
      to: s
    tool: units_convert
