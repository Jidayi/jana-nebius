stem: The frequency of a note from a signal generator is doubled, with the amplitude kept the same.
parts:
- id: a
  prompt: What does a listener notice?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The pitch rises and the loudness stays the same
      correct: true
    - id: B
      text: The sound gets louder and the pitch stays the same
      correct: false
      misconception_id: mc.phy.o.loudness_from_frequency
      feedback: A quiet whistle can be high and a loud drum low. Loudness depends on the amplitude; frequency sets the pitch.
    - id: C
      text: The pitch rises and the sound gets louder
      correct: false
      misconception_id: mc.phy.o.loudness_from_frequency
      feedback: A quiet whistle can be high and a loud drum low. Loudness depends on the amplitude; frequency sets the pitch.
    - id: D
      text: The sound reaches the listener sooner
      correct: false
      misconception_id: mc.phy.o.higher_pitch_travels_faster
      feedback: At a concert the high and low notes reach you together. In one material all sounds travel at the same speed; higher frequency means shorter wavelength.
  show_working: false
  hints:
