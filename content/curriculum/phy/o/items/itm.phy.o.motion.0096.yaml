subject: phy
level: o
kc_ids:
- kc.phy.o.motion.velocity_time_area
stem: The velocity-time graph for a minibus is a straight line from (0 s, 0 m/s) to (6 s, 12 m/s).
parts:
- id: a
  prompt: Find the distance travelled in this time.
  marks: 2
  answer:
    kind: numeric
    value: '36.0'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0096_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The area under a velocity-time graph gives the distance travelled. What shape is the area here?
  - rung: 2
    name: concept
    text:
      en: 'A line from the origin makes a triangle: area = ½ × base × height.'
  - rung: 3
    name: first_step
    text:
      en: The base is the time and the height is the final velocity.
  - rung: 4
    name: worked_step
    text:
      en: Distance = ½ × 6 × 12.
  - rung: 5
    name: full_step
    text:
      en: Distance = ½ × 6 × 12 = 36.0 m.
  misconception_ids:
  - mc.phy.o.triangle_area_without_half
solution:
  steps:
  - n: 1
    latex: d = \tfrac{1}{2} v t
    reason: The area under the line is a triangle
  - n: 2
    latex: d = \tfrac{1}{2} \times 12 \times 6
    reason: Substitute
  - n: 3
    latex: d = 36.0\ \text{m}
    reason: Multiply
    check_id: chk_build_phy_k_0096_a
