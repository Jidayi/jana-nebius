id: itm.phy.o.wave_properties.0022
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.wave_properties.wave_equation
stem: A whistle gives a note of frequency 4 kHz. Its wavelength in air is 8.5 cm.
parts:
- id: a
  prompt: Calculate the speed of the waves.
  marks: 2
  answer:
    kind: numeric
    value: '340'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_wav_0022_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which equation links wave speed, frequency and wavelength?
  - rung: 2
    name: concept
    text:
      en: v = f × λ, with f in hertz and λ in metres.
  - rung: 3
    name: first_step
    text:
      en: 'First put the values in hertz and metres: 4 kHz = 4000 Hz; 8.5 cm = 0.085 m.'
  - rung: 4
    name: worked_step
    text:
      en: Multiply the frequency by the wavelength.
  - rung: 5
    name: full_step
    text:
      en: v = 340 m/s.
  misconception_ids:
  - mc.phy.o.wave_speed_divided
  - mc.phy.o.wave_prefix_ignored
  - mc.phy.o.wave_equation_inverted
solution:
  steps:
  - n: 1
    latex: f = 4\ \text{kHz} = 4000\ \text{Hz}
    reason: Put the frequency in hertz
    check_id: chk_build_phy_wav_0022_fsi
  - n: 2
    latex: \lambda = 8.5\ \text{cm} = 0.085\ \text{m}
    reason: Put the wavelength in metres
    check_id: chk_build_phy_wav_0022_lsi
  - n: 3
    latex: v = f\lambda = 4000 \times 0.085 = 340\ \text{m/s}
    reason: Wave equation
    check_id: chk_build_phy_wav_0022_ans
difficulty:
  prior: 0.3
  band: core
