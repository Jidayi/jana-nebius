stem: A lamp has a p.d. of 9 V across it, and 3600 J of energy is transferred to it.
parts:
- id: a
  prompt: Calculate the charge that has passed through it.
  marks: 2
  answer:
    kind: numeric
    value: '400'
    unit: C
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0033_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Each coulomb that passes transfers the same energy.
  - rung: 2
    name: concept
    text:
      en: From W = Q V, the charge is Q = W ÷ V.
  - rung: 3
    name: first_step
    text:
      en: The energy is already in joules.
  - rung: 4
    name: worked_step
    text:
      en: Divide 3600 J by 9 V.
  - rung: 5
    name: full_step
    text:
      en: Q = 3600 ÷ 9 = 400 C.
  misconception_ids:
  - mc.phy.o.w_qv_upside_down
  - mc.phy.o.w_qv_multiplied
solution:
  steps:
  - n: 1
    latex: Q = \frac{W}{V} = \frac{3600}{9} = 400\ \text{C}
    reason: Rearrange W = QV
    check_id: chk_build_phy_elq_0033_ans
