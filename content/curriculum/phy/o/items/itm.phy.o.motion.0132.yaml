stem: A trolley starts from rest and accelerates steadily at 4.0 m/s^2 along a track 36 m long.
parts:
- id: a
  prompt: How long does it take to reach the end?
  marks: 3
  answer:
    kind: numeric
    value: '4.24'
    unit: s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0132_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which quantities do you know, and which one are you asked for?
  - rung: 2
    name: concept
    text:
      en: Pick the equation of uniform acceleration with those quantities, then make the unknown its subject.
  - rung: 3
    name: first_step
    text:
      en: Rearrange to t = √(2s ÷ a).
  - rung: 4
    name: worked_step
    text:
      en: t = √(2 × 36 ÷ 4.0).
  - rung: 5
    name: full_step
    text:
      en: t = √(2 × 36 ÷ 4.0) = 4.24 s.
  misconception_ids:
  - mc.phy.o.rearrange_sign_error
  - mc.phy.o.square_not_rooted
solution:
  steps:
  - n: 1
    latex: s = \tfrac{1}{2}at^2
    reason: The equation linking the known quantities
  - n: 2
    latex: t = \sqrt{\frac{2s}{a}}
    reason: Make the unknown the subject
  - n: 3
    latex: t = \sqrt{\frac{2 \times 36}{4.0}}
    reason: Substitute
  - n: 4
    latex: t = 4.24\ \text{s}
    reason: Evaluate
    check_id: chk_build_phy_k_0132_a
