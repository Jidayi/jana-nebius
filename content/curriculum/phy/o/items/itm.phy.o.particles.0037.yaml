stem: The gas inside a cylinder is at a pressure of 120 kPa. Its particles strike the end of its piston, which has an area of 0.004 m².
parts:
- id: a
  prompt: Find the total force the particles exert on this surface.
  marks: 2
  answer:
    kind: numeric
    value: '480'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_ptc_0037_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The pressure is the total force of the particle collisions on each square metre.
  - rung: 2
    name: concept
    text:
      en: So the force on a surface is pressure × area.
  - rung: 3
    name: first_step
    text:
      en: Change 120 kPa to pascals first.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 120000 Pa by 0.004 m².
  - rung: 5
    name: full_step
    text:
      en: The force is 480 N.
solution:
  steps:
  - n: 1
    latex: p = 120\ \text{kPa} = 120000\ \text{Pa}
    reason: 1 Pa is 1 N on each square metre
    check_id: chk_build_phy_ptc_0037_pa
  - n: 2
    latex: F = pA = 120000 \times 0.004 = 480\ \text{N}
    reason: Force = pressure × area
    check_id: chk_build_phy_ptc_0037_ans
