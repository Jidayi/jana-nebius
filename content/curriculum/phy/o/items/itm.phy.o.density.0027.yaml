stem: The water in a measuring cylinder has a curved surface called a meniscus.
parts:
- id: a
  prompt: How should the reading be taken?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: At the top edge, where the water climbs up the glass
      correct: false
      misconception_id: mc.phy.o.cylinder_read_wrongly
      feedback: Stand the cylinder on a flat bench, bring your eye level with the water and read the bottom of the curved surface.
    - id: B
      text: Looking down on the surface from above
      correct: false
      misconception_id: mc.phy.o.cylinder_read_wrongly
      feedback: Stand the cylinder on a flat bench, bring your eye level with the water and read the bottom of the curved surface.
    - id: C
      text: Anywhere on the curve, as the difference never matters
      correct: false
      misconception_id: mc.phy.o.cylinder_read_wrongly
      feedback: Stand the cylinder on a flat bench, bring your eye level with the water and read the bottom of the curved surface.
    - id: D
      text: At the bottom of the meniscus, with the eye level with it
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what each reading on the measuring cylinder actually measures.
  - rung: 2
    name: concept
    text:
      en: Viewed at an angle, the surface lines up with the wrong mark on the scale.
  - rung: 3
    name: first_step
    text:
      en: Rule out the options that would give a volume that is too big or too small.
  - rung: 4
    name: worked_step
    text:
      en: Test each option on a stone of known volume.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: At the bottom of the meniscus, with the eye level with it.'
  misconception_ids:
  - mc.phy.o.cylinder_read_wrongly
solution:
  steps:
  - n: 1
    latex: \text{At the bottom of the meniscus, with the eye level with it}
    reason: The object's volume is the water it pushes aside
