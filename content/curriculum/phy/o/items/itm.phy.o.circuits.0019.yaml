id: itm.phy.o.circuits.0019
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.parallel_circuits
stem: A current of 1.8 A enters a junction and divides between a 5 Ω resistor and a 20 Ω resistor connected in parallel.
parts:
- id: a
  prompt: Calculate the current through the 5 Ω resistor.
  marks: 3
  answer:
    kind: numeric
    value: '1.44'
    unit: A
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_cir_0019_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Both resistors have the same p.d. across them.
  - rung: 2
    name: concept
    text:
      en: Find that p.d. from the total current and the combined resistance, then use I = V/R for one branch.
  - rung: 3
    name: first_step
    text:
      en: The combined resistance is (5 × 20) ÷ (5 + 20).
  - rung: 4
    name: worked_step
    text:
      en: The p.d. across the pair is 7.2 V; divide it by 5 Ω.
  - rung: 5
    name: full_step
    text:
      en: The current through the 5 Ω resistor is 1.44 A.
  misconception_ids:
  - mc.phy.o.parallel_more_current_higher_resistance
  - mc.phy.o.parallel_current_split_equally
  - mc.phy.o.parallel_current_same_each_branch
solution:
  steps:
  - n: 1
    latex: R = \frac{5 \times 20}{5 + 20} = 4\ \Omega
    reason: Combined resistance
    check_id: chk_build_phy_cir_0019_rp
  - n: 2
    latex: V = IR = 1.8 \times 4 = 7.2\ \text{V}
    reason: The p.d. across both branches
    check_id: chk_build_phy_cir_0019_v
  - n: 3
    latex: I_1 = \frac{7.2}{5} = 1.44\ \text{A}
    reason: Ohm's law for one branch
    check_id: chk_build_phy_cir_0019_ans
