type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.atom.isotopes
stem: A student says hydrogen-2 (deuterium) is not the same element as hydrogen-1, since it is heavier.
parts:
- id: a
  prompt: What should the student be told about hydrogen-2?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Nothing; a heavier atom always belongs to a different element
      correct: false
      misconception_id: mc.phy.o.heavier_isotope_different_element
      feedback: 'Carbon-12 and carbon-14 are both carbon: both have six protons. The proton number alone decides the element.'
    - id: B
      text: Hydrogen-2 has two protons, so it is really helium
      correct: false
      misconception_id: mc.phy.o.isotopes_differ_in_protons
      feedback: Change the number of protons and you change the element. Isotopes of one element all have the same proton number; only the neutrons differ.
    - id: C
      text: Both nuclei contain one proton, so both are hydrogen
      correct: true
    - id: D
      text: Hydrogen-2 has two electrons, so it is a different element
      correct: false
      misconception_id: mc.phy.o.isotopes_differ_in_electrons
      feedback: A neutral atom has one electron for each proton. Isotopes share the proton number, so their neutral atoms have the same electrons.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide what makes two nuclides the same element.
  - rung: 2
    name: concept
    text:
      en: Isotopes have the same proton number but different nucleon numbers.
  - rung: 3
    name: first_step
    text:
      en: The extra nucleon in hydrogen-2 has no charge.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against that definition.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Both nuclei contain one proton, so both are hydrogen.'
  misconception_ids:
  - mc.phy.o.heavier_isotope_different_element
  - mc.phy.o.isotopes_differ_in_electrons
  - mc.phy.o.isotopes_differ_in_protons
