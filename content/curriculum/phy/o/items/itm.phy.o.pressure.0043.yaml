id: itm.phy.o.pressure.0043
version: 0.1.1
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.gas_and_atmospheric_pressure
stem: On a day when atmospheric pressure is 102 kPa, a student imagines a barometer filled with water (density 1000 kg/m³) instead of mercury. Take g = 10 N/kg.
parts:
- id: a
  prompt: How tall would the water column be?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 0.0102 m
      correct: false
      misconception_id: mc.phy.o.pressure_kpa_not_converted
      feedback: One kilopascal is a thousand pascals. Change kPa into Pa before you combine a pressure with newtons, metres or kg/m³.
    - id: B
      text: 102 m
      correct: false
      misconception_id: mc.phy.o.liquid_pressure_g_left_out
      feedback: 'The pressure comes from the weight of the liquid above, so g is needed: pressure = ρ × g × h. Without g the answer is not in pascals.'
    - id: C
      text: 0.75 m
      correct: false
      misconception_id: mc.phy.o.barometer_liquid_density_swapped
      feedback: 'Use the density of the liquid that is actually in the column: about 13 600 kg/m³ for mercury and 1000 kg/m³ for water.'
    - id: D
      text: 10.2 m
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The water column would be tall enough for its pressure to equal the air pressure.
  - rung: 2
    name: concept
    text:
      en: p = ρgh, so h = p ÷ (ρg).
  - rung: 3
    name: first_step
    text:
      en: Change 102 kPa into pascals first.
  - rung: 4
    name: worked_step
    text:
      en: Divide 102000 Pa by 1000 × 10.
  - rung: 5
    name: full_step
    text:
      en: The water column would be 10.2 m tall.
  misconception_ids:
  - mc.phy.o.barometer_liquid_density_swapped
  - mc.phy.o.liquid_pressure_g_left_out
  - mc.phy.o.pressure_kpa_not_converted
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: p = 102\ \text{kPa} = 102000\ \text{Pa}
    reason: Kilopascals into pascals
    check_id: chk_build_phy_prs_0043_pa
  - n: 2
    latex: h = \frac{p}{\rho g} = \frac{102000}{1000 \times 10} = 10.2\ \text{m}
    reason: Rearrange p = ρgh
    check_id: chk_build_phy_prs_0043_ans
