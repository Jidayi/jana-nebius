type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.measurement.resultant_vectors
stem: A swimmer crosses a river at 80 m/s straight across, while the river carries her downstream at 150 m/s.
parts:
- id: a
  prompt: Calculate the size of the resultant velocity.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 230 m/s
      correct: false
      misconception_id: mc.phy.o.resultant_adds_sizes
      feedback: Walk three steps east and four steps north and you are five steps from the start, not seven. Use Pythagoras when the vectors are at right angles.
    - id: B
      text: 127 m/s
      correct: false
      misconception_id: mc.phy.o.pythagoras_subtracted
      feedback: 'The resultant is the hypotenuse, the longest side: add the squares of the two vectors and take the square root.'
    - id: C
      text: 70 m/s
      correct: false
      misconception_id: mc.phy.o.perpendicular_subtracted
      feedback: 'Vectors at right angles do not cancel at all: neither has any part pointing against the other. Use Pythagoras.'
    - id: D
      text: 170 m/s
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Sketch the two vectors nose to tail: they make two sides of a right-angled triangle.'
  - rung: 2
    name: concept
    text:
      en: The resultant is the hypotenuse.
  - rung: 3
    name: first_step
    text:
      en: Square each vector, add the squares, then take the square root.
  - rung: 4
    name: worked_step
    text:
      en: 80² + 150² = 28900.
  - rung: 5
    name: full_step
    text:
      en: The resultant is √28900 = 170 m/s.
  misconception_ids:
  - mc.phy.o.perpendicular_subtracted
  - mc.phy.o.pythagoras_subtracted
  - mc.phy.o.resultant_adds_sizes
