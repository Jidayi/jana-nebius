stem: Energy resources can be renewable or non-renewable.
parts:
- id: a
  prompt: Which of these resources is non-renewable?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Oil
      correct: true
    - id: B
      text: Wood from a managed forest
      correct: false
      misconception_id: mc.phy.o.biofuel_seen_as_nonrenewable
      feedback: New trees and crops can be grown as fast as we burn them, so biofuels are renewable even though burning them releases carbon dioxide.
    - id: C
      text: Biogas from animal waste
      correct: false
      misconception_id: mc.phy.o.biofuel_seen_as_nonrenewable
      feedback: New trees and crops can be grown as fast as we burn them, so biofuels are renewable even though burning them releases carbon dioxide.
    - id: D
      text: Hydroelectric power, because dams harm rivers
      correct: false
      misconception_id: mc.phy.o.renewable_means_clean
      feedback: A dam is renewable but floods valleys, and wind farms change the landscape. Renewable is about being replaced, not about having no effects.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Read each option and decide whether it is really true for this resource.
  - rung: 2
    name: concept
    text:
      en: Which one took millions of years to form?
  - rung: 3
    name: first_step
    text:
      en: Renewable means replaced as fast as we use it; reliable means there when we need it. Neither tells you the cost or the effects on the environment.
  - rung: 4
    name: worked_step
    text:
      en: Rule out each option that mixes these ideas up or gets the original source of the energy wrong.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Oil.'
  misconception_ids:
  - mc.phy.o.biofuel_seen_as_nonrenewable
  - mc.phy.o.renewable_means_clean
