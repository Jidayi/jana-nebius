id: itm.phy.o.electrical_quantities.0085
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.current_voltage_graphs
stem: A filament lamp is switched on. At first its filament is cold.
parts:
- id: a
  prompt: When is the current through the lamp largest?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Once the filament is hot, as hot metal conducts better
      correct: false
      misconception_id: mc.phy.o.lamp_resistance_falls_when_hot
      feedback: A hot metal's ions vibrate more and get in the electrons' way, so a filament's resistance rises as it heats up.
    - id: B
      text: Just as it is switched on, while the filament is cold
      correct: true
    - id: C
      text: It is the same all the time, as the lamp's resistance is fixed
      correct: false
      misconception_id: mc.phy.o.lamp_resistance_constant
      feedback: 'A lamp''s I-V graph bends over: each extra volt gives less extra current, because the hotter filament has more resistance.'
    - id: D
      text: Once hot, since a hot lamp gives a steeper I-V graph and so more resistance
      correct: false
      misconception_id: mc.phy.o.iv_gradient_is_resistance
      feedback: On a graph of current against p.d., the steeper the line the more current flows for each volt, so the smaller the resistance. Use R = V/I.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Look at how the current changes as the p.d. changes, and what that says about R = V/I.
  - rung: 2
    name: concept
    text:
      en: A fixed resistor gives a straight line through the origin; a line that bends shows a resistance that changes; some components conduct in one direction only.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: A cold filament has a lower resistance, so the current is largest at the moment of switching on.
  - rung: 5
    name: full_step
    text:
      en: Just as it is switched on, while the filament is cold. A cold filament has a lower resistance, so the current is largest at the moment of switching on.
  misconception_ids:
  - mc.phy.o.iv_gradient_is_resistance
  - mc.phy.o.lamp_resistance_constant
  - mc.phy.o.lamp_resistance_falls_when_hot
solution:
  steps:
  - n: 1
    latex: \text{Just as it is switched on, while the filament is cold}
    reason: Read the shape of the graph as a resistance
