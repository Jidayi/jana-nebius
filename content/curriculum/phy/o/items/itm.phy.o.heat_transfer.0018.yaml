id: itm.phy.o.heat_transfer.0018
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.heat_transfer.convection
stem: A fixed mass of air is heated from 20 °C to 60 °C and expands.
parts:
- id: a
  prompt: What happens to its density?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It stays the same, because the mass does not change
      correct: false
      misconception_id: mc.phy.o.density_unchanged_on_heating
      feedback: Density is mass divided by volume. Heating keeps the mass the same but increases the volume, so the density falls; that is why warm fluids rise.
    - id: B
      text: It increases, because hot air is heavier
      correct: false
      misconception_id: mc.phy.o.heated_fluid_denser
      feedback: Heating makes a fluid expand, so the same mass takes up more space and its density falls. Warm air and water rise; cooled air and water sink.
    - id: C
      text: Its density decreases
      correct: true
    - id: D
      text: It increases, because heating makes more air particles
      correct: false
      misconception_id: mc.phy.o.heating_creates_particles
      feedback: 'Weigh a sealed flask before and after heating: its mass does not change. No particles are made; the same particles move faster and, in most materials, spread further apart.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Convection is the movement of a warm fluid carrying energy with it.
  - rung: 2
    name: concept
    text:
      en: Density is mass divided by volume.
  - rung: 3
    name: first_step
    text:
      en: Ask what happens to the density of a fluid when it is heated or cooled.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options where heat moves by itself or a solid flows.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Its density decreases.'
  misconception_ids:
  - mc.phy.o.density_unchanged_on_heating
  - mc.phy.o.heated_fluid_denser
  - mc.phy.o.heating_creates_particles
solution:
  steps:
  - n: 1
    latex: \text{Its density decreases}
    reason: Explain the current by changes in density
