type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.atom.nuclear_model_evidence
stem: Before the scattering experiment, many scientists pictured the atom as positive charge spread evenly, with electrons dotted through it.
parts:
- id: a
  prompt: Why did the results not fit that picture?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: That picture already predicted that some particles would bounce back
      correct: false
      misconception_id: mc.phy.o.plum_pudding_fits_results
      feedback: Charge spread thinly through the atom pushes only weakly on an alpha particle, so it could not turn one back. The rebounds needed the charge packed into a tiny centre.
    - id: B
      text: That picture predicted that most particles would bounce back
      correct: false
      misconception_id: mc.phy.o.scattering_most_bounced_back
      feedback: Nearly all the alpha particles went straight through. Only about one in several thousand came back, which is why the result was so surprising.
    - id: C
      text: In that picture the electrons would have turned the particles back
      correct: false
      misconception_id: mc.phy.o.deflection_by_electrons
      feedback: 'An electron has less than a seven-thousandth of an alpha particle''s mass: like a table-tennis ball in the path of a bowling ball. Only something massive and highly charged could turn an alpha particle back.'
    - id: D
      text: Spread-out charge could not push hard enough to turn an alpha particle back
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Recall the three things that happened to alpha particles fired at thin gold foil.
  - rung: 2
    name: concept
    text:
      en: Most went straight through, a few were deflected a little, and a very few were turned back.
  - rung: 3
    name: first_step
    text:
      en: Think about how strongly thinly spread charge can push on a fast particle.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that contradict what was seen.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Spread-out charge could not push hard enough to turn an alpha particle back.'
  misconception_ids:
  - mc.phy.o.deflection_by_electrons
  - mc.phy.o.plum_pudding_fits_results
  - mc.phy.o.scattering_most_bounced_back
