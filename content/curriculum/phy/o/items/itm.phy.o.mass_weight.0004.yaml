    text:
      en: The mass is the same everywhere; the weight is not.
  - rung: 2
    name: concept
    text:
      en: Find the mass from the Earth weight, then use the g for the new place.
  - rung: 3
    name: first_step
    text:
      en: Mass = 735 ÷ 9.8.
  - rung: 4
    name: worked_step
    text:
      en: The mass is 75 kg; multiply it by 1.6.
  - rung: 5
    name: full_step
    text:
      en: Zainab's weight on the Moon is 120 N.
  misconception_ids:
