stem: Neema measures the force on a wire at right angles to a magnetic field. With a current of 2.5 A the force is 0.04 N.
parts:
- id: a
  prompt: The force is proportional to the current. Find the force when the current is 4 A.
  marks: 2
  answer:
    kind: numeric
    value: '0.064'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_emg_0022_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A bigger current in the field gives a bigger force on the wire.
  - rung: 2
    name: concept
    text:
      en: The force is proportional to the current.
  - rung: 3
    name: first_step
    text:
      en: Find how many times bigger the new current is.
  - rung: 4
    name: worked_step
    text:
      en: The current is 1.6 times as big; multiply 0.04 N by that.
  - rung: 5
    name: full_step
    text:
      en: F = 0.04 × 1.6 = 0.064 N.
solution:
  steps:
  - n: 1
    latex: \frac{4}{2.5} = 1.6
    reason: How many times bigger the current is
    check_id: chk_build_phy_emg_0022_ratio
  - n: 2
    latex: F = 0.04 \times 1.6 = 0.064\ \text{N}
    reason: The force grows in the same ratio
    check_id: chk_build_phy_emg_0022_ans
