id: itm.phy.o.practical_electricity.0018
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.practical_electricity.energy_cost
stem: A 1200 W hairdryer is used for 15 minutes every day for 14 days. Electricity costs 10 cents per kilowatt-hour.
parts:
- id: a
  prompt: Calculate the cost of the electricity used, in cents.
  marks: 3
  answer:
    kind: numeric
    value: '42'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_pel_0018_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Electricity is paid for by the kilowatt-hour (one unit).
  - rung: 2
    name: concept
    text:
      en: Find the number of kWh used in all, then multiply by the price of one kWh.
  - rung: 3
    name: first_step
    text:
      en: 'Change the power into kilowatts and find the total time in hours: 15 minutes a day for 14 days.'
  - rung: 4
    name: worked_step
    text:
      en: The total time is 3.5 h, so the energy is 4.2 kWh; multiply by 10 cents.
  - rung: 5
    name: full_step
    text:
      en: The cost is 42 cents.
  misconception_ids:
  - mc.phy.o.energy_cost_days_left_out
  - mc.phy.o.kwh_power_left_in_watts
  - mc.phy.o.kwh_time_left_in_minutes
  - mc.phy.o.elec_energy_power_over_time
solution:
  steps:
  - n: 1
    latex: P = 1200\ \text{W} = 1.2\ \text{kW}
    reason: Power in kilowatts
    check_id: chk_build_phy_pel_0018_pk
  - n: 2
    latex: t = 15\ \text{min} \times 14 = 3.5\ \text{h}
    reason: Total time in hours
    check_id: chk_build_phy_pel_0018_th
  - n: 3
    latex: E = 1.2 \times 3.5 = 4.2\ \text{kWh}
    reason: Energy in kWh
    check_id: chk_build_phy_pel_0018_kwh
  - n: 4
    latex: \text{cost} = 4.2 \times 10 = 42\ \text{cents}
    reason: Units used times price
    check_id: chk_build_phy_pel_0018_ans
