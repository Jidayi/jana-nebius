stem: A nucleus of thorium-232 (proton number 90) decays in several steps, giving out 6 alpha particles and 4 beta particles in all, to become lead-208.
parts:
- id: a
  prompt: What is the proton number of lead-208?
  marks: 2
  answer:
    kind: numeric
    value: '82'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_rad_0022_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Treat each kind of decay separately and add up the changes.
  - rung: 2
    name: concept
    text:
      en: 'Alpha: nucleon number −4, proton number −2. Beta: nucleon number unchanged, proton number +1.'
  - rung: 3
    name: first_step
    text:
      en: Each alpha lowers the proton number by 2; each beta raises it by 1.
  - rung: 4
    name: worked_step
    text:
      en: Work out 90 − 2 × 6 + 4.
  - rung: 5
    name: full_step
    text:
      en: The proton number of lead-208 is 82.
  misconception_ids:
  - mc.phy.o.beta_lowers_proton_number
  - mc.phy.o.alpha_numbers_swapped
  - mc.phy.o.beta_changes_nothing
solution:
  steps:
  - n: 1
    latex: '\text{alpha particle: } 2\ \text{protons} + 2\ \text{neutrons} = 4\ \text{nucleons}'
    reason: An alpha particle is a helium nucleus
    check_id: chk_build_phy_rad_0022_alpha_a
  - n: 2
    latex: 6 \times 2 = 12\ \text{protons lost}
    reason: Each alpha takes 2 protons
    check_id: chk_build_phy_rad_0022_pz
  - n: 3
    latex: 90 - 12 + 4 = 82
    reason: Each beta adds 1 proton
    check_id: chk_build_phy_rad_0022_ans
