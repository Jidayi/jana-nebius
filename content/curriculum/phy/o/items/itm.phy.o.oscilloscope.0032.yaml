id: itm.phy.o.oscilloscope.0032
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.oscilloscope.y_gain
stem: An oscilloscope's Y-gain is 10 V/div. The crests of a trace are 3.5 divisions above the centre line and the troughs the same distance below.
parts:
- id: a
  prompt: Find the peak-to-peak voltage of the signal.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 70 V
      correct: true
    - id: B
      text: 35 V
      correct: false
      misconception_id: mc.phy.o.osc_peak_and_peak_to_peak_confused
      feedback: The peak voltage is measured from the centre line to a crest; peak-to-peak is crest to trough, twice as big.
    - id: C
      text: 0.7 V
      correct: false
      misconception_id: mc.phy.o.osc_ygain_divided
      feedback: The Y-gain says how many volts each division stands for, so voltage = divisions × volts per division.
    - id: D
      text: 7 V
      correct: false
      misconception_id: mc.phy.o.osc_divisions_as_volts
      feedback: Each division stands for the Y-gain voltage. Multiply the number of divisions by the volts per division.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Peak-to-peak is measured from the top of a crest to the bottom of a trough.
  - rung: 2
    name: concept
    text:
      en: That height is twice the height of a crest above the centre line.
  - rung: 3
    name: first_step
    text:
      en: Multiply the crest-to-trough height in divisions by the Y-gain.
  - rung: 4
    name: worked_step
    text:
      en: Crest to trough is 2 × 3.5 divisions; multiply by 10 V/div.
  - rung: 5
    name: full_step
    text:
      en: The peak-to-peak voltage is 70 V.
  misconception_ids:
  - mc.phy.o.osc_divisions_as_volts
  - mc.phy.o.osc_peak_and_peak_to_peak_confused
  - mc.phy.o.osc_ygain_divided
solution:
  steps:
  - n: 1
    latex: V_{pp} = 2 \times 3.5 \times 10 = 70\ \text{V}
    reason: Crest to trough
    check_id: chk_build_phy_osc_0032_ans
