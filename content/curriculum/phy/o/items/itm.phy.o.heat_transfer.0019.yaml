stem: Convection is one way that energy moves through materials.
parts:
- id: a
  prompt: In which materials can convection take place?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: In solids, liquids and gases
      correct: false
      misconception_id: mc.phy.o.convection_in_solids
      feedback: Convection needs the material itself to move as a current. Particles in a solid stay in place, so solids pass energy on by conduction, not convection.
    - id: B
      text: In solids only, because their particles are linked
      correct: false
      misconception_id: mc.phy.o.convection_in_solids
      feedback: Convection needs the material itself to move as a current. Particles in a solid stay in place, so solids pass energy on by conduction, not convection.
    - id: C
      text: In gases only, because liquids do not expand when heated
      correct: false
      misconception_id: mc.phy.o.expansion_order_reversed
      feedback: For the same temperature rise, gases expand most, then liquids, then solids. Solids expand only a little, but enough to buckle rails and crack glass.
    - id: D
      text: In liquids and gases only
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Convection is the movement of a warm fluid carrying energy with it.
  - rung: 2
    name: concept
    text:
      en: For convection the material itself has to flow.
  - rung: 3
    name: first_step
    text:
      en: Ask what happens to the density of a fluid when it is heated or cooled.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options where heat moves by itself or a solid flows.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: In liquids and gases only.'
  misconception_ids:
  - mc.phy.o.convection_in_solids
  - mc.phy.o.expansion_order_reversed
