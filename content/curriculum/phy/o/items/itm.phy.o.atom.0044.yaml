stem: A gold atom is about ten thousand times wider than its nucleus.
parts:
- id: a
  prompt: Which statement follows from this?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Almost all of the atom's volume is empty space
      correct: true
    - id: B
      text: The nucleus fills about half of the atom
      correct: false
      misconception_id: mc.phy.o.nucleus_fills_atom
      feedback: If the nucleus were a pea in the centre of a football stadium, the atom would be the whole stadium. That is why almost every alpha particle missed it.
    - id: C
      text: Most of the atom's mass is in the space around the nucleus
      correct: false
      misconception_id: mc.phy.o.mass_spread_through_atom
      feedback: Only a very massive object can turn back a fast alpha particle. Almost all of the atom's mass is in the tiny nucleus.
    - id: D
      text: The atom is a solid ball of positive charge
      correct: false
      misconception_id: mc.phy.o.plum_pudding_fits_results
      feedback: Charge spread thinly through the atom pushes only weakly on an alpha particle, so it could not turn one back. The rebounds needed the charge packed into a tiny centre.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Recall the three things that happened to alpha particles fired at thin gold foil.
  - rung: 2
    name: concept
    text:
      en: Most went straight through, a few were deflected a little, and a very few were turned back.
  - rung: 3
    name: first_step
    text:
      en: Imagine a marble in the middle of a football pitch.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that contradict what was seen.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Almost all of the atom''s volume is empty space.'
  misconception_ids:
  - mc.phy.o.mass_spread_through_atom
