    args:
      expression: 2*pi*1.5e8/(365*86400)
      sf: 3
    tool: math_evaluate
  chk_build_phy_sol_0030_circ_m:
    args:
      expression: (2*pi*1.5e8)/10^(8)
      sf: 3
    tool: math_evaluate
  chk_build_phy_sol_0030_ts:
