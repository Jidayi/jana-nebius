id: itm.phy.o.solar_system.0030
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.solar_system.orbital_speed
stem: The Earth orbits the Sun in a near-circular orbit of radius 1.5 × 10⁸ km, taking 365 days for one orbit.
parts:
- id: a
  prompt: Calculate the average orbital speed of the Earth in km/s.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 4.76 km/s
      correct: false
      misconception_id: mc.phy.o.orbit_speed_no_two_pi
      feedback: In one orbit the body travels once round a circle, a distance of 2πr, not r. Speed = 2πr ÷ T.
    - id: B
      text: 2240000000 km/s
      correct: false
      misconception_id: mc.phy.o.orbit_speed_pi_r_squared
      feedback: Distance round a circle is its circumference, 2πr. The area πr² is the space inside the circle and is not a distance at all.
    - id: C
      text: 29.9 km/s
      correct: true
    - id: D
      text: 2580000 km/s
      correct: false
      misconception_id: mc.phy.o.orbit_period_not_in_seconds
      feedback: For a speed in km/s the time must be in seconds, so change the period into seconds before you divide. A time found in seconds must be changed before it is given in hours.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: In one orbit the body travels once round a circle.
  - rung: 2
    name: concept
    text:
      en: Orbital speed v = 2πr ÷ T.
  - rung: 3
    name: first_step
    text:
      en: For km/s, keep r in km and change the period into seconds.
  - rung: 4
    name: worked_step
    text:
      en: T = 31536000 s; the circumference is 2π × 1.5 × 10⁸ km.
  - rung: 5
    name: full_step
    text:
      en: The orbital speed is 29.9 km/s.
  misconception_ids:
  - mc.phy.o.orbit_period_not_in_seconds
  - mc.phy.o.orbit_speed_no_two_pi
  - mc.phy.o.orbit_speed_pi_r_squared
solution:
  steps:
  - n: 1
    latex: T = 365\ \text{days} = 31536000\ \text{s}
    reason: Period in seconds
    check_id: chk_build_phy_sol_0030_ts
  - n: 2
    latex: 2\pi r = 2\pi \times 1.5 \times 10^{8} = 9.42 \times 10^{8}\ \text{km}
    reason: Distance round one orbit
    check_id: chk_build_phy_sol_0030_circ_m
  - n: 3
    latex: v = \frac{9.42 \times 10^{8}}{31536000} = 29.9\ \text{km/s}
    reason: v = 2πr / T
    check_id: chk_build_phy_sol_0030_ans
difficulty:
  prior: 0.2
  band: core
estimated_seconds: 120
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
