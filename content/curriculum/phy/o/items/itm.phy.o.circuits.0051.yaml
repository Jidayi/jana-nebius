id: itm.phy.o.circuits.0051
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.potential_dividers
stem: A light-dependent resistor (LDR) and a fixed resistor are connected in series across a steady supply as a potential divider. The output p.d. is taken across the fixed resistor. Then it gets darker.
parts:
- id: a
  prompt: What happens to the output p.d.?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: 'It rises: the LDR''s resistance falls in the dark, so the fixed resistor takes a bigger share'
      correct: false
      misconception_id: mc.phy.o.ldr_resistance_rises_with_light
      feedback: Light frees charges in an LDR, so more light means lower resistance. In the dark its resistance is very high.
    - id: B
      text: 'It rises: the LDR''s resistance rises, and a smaller resistance takes a bigger share'
      correct: false
      misconception_id: mc.phy.o.series_pd_inverse_to_resistance
      feedback: The same current flows through both, so V = IR is bigger where R is bigger. The larger resistance always takes the larger share of the p.d.
    - id: C
      text: 'It stays the same: the supply p.d. has not changed'
      correct: false
      misconception_id: mc.phy.o.divider_output_fixed_by_supply
      feedback: The supply p.d. is fixed, but the share each part takes depends on the ratio of their resistances. Change one resistance and the shares change.
    - id: D
      text: 'It falls: the LDR''s resistance rises, so the fixed resistor takes a smaller share of the p.d.'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: First decide how the sensor's resistance changes.
  - rung: 2
    name: concept
    text:
      en: A thermistor's resistance falls as it warms up; an LDR's falls as the light gets brighter.
  - rung: 3
    name: first_step
    text:
      en: In series, the larger resistance always takes the larger share of the supply p.d.
  - rung: 4
    name: worked_step
    text:
      en: Ask whether the component the output is taken across now has a larger or smaller share.
  - rung: 5
    name: full_step
    text:
      en: 'It falls: the LDR''s resistance rises, so the fixed resistor takes a smaller share of the p.d.'
  misconception_ids:
  - mc.phy.o.divider_output_fixed_by_supply
  - mc.phy.o.ldr_resistance_rises_with_light
  - mc.phy.o.series_pd_inverse_to_resistance
solution:
  steps:
  - n: 1
    latex: '\text{It falls: the LDR''s resistance rises, so the fixed resistor takes a smaller share of the p.d.}'
    reason: Find how the sensor's resistance changes, then its share of the p.d.
