stem: A see-saw is a uniform plank 3 m long, pivoted at its middle. Lerato, weight 450 N, sits 0.5 m from one end.
parts:
- id: a
  prompt: How far from the pivot must Yaw, weight 540 N, sit on the other side for the see-saw to balance?
  marks: 3
  answer:
    kind: numeric
    value: '0.833'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_frc_0087_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: For balance, the moments on the two sides of the pivot must be equal.
  - rung: 2
    name: concept
    text:
      en: Measure Lerato's distance from the pivot, not from the end of the plank.
  - rung: 3
    name: first_step
    text:
      en: The pivot is at the middle, so take 0.5 m from half the length.
  - rung: 4
    name: worked_step
    text:
      en: Lerato is 1 m from the pivot, giving a moment of 450 N m.
  - rung: 5
    name: full_step
    text:
      en: Yaw's distance = 450 ÷ 540 = 0.833 m from the pivot.
  misconception_ids:
  - mc.phy.o.moment_distance_from_end
  - mc.phy.o.moment_ratio_inverted
  - mc.phy.o.balance_equal_distances
solution:
  steps:
  - n: 1
    latex: d_1 = \frac{3}{2} - 0.5 = 1\ \text{m}
    reason: Distance from the pivot
    check_id: chk_build_phy_frc_0087_d1
  - n: 2
    latex: 450 \times 1 = 450\ \text{N m}
    reason: Lerato's moment
    check_id: chk_build_phy_frc_0087_m1
  - n: 3
    latex: d_2 = \frac{450}{540} = 0.833\ \text{m}
    reason: Anticlockwise moment = clockwise moment
    check_id: chk_build_phy_frc_0087_ans
