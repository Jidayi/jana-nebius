stem: The Big Bang theory says the Universe began in a hot, dense state.
parts:
- id: a
  prompt: Where did the Big Bang happen?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: At a single point, which is now the centre of the Universe
      correct: false
      misconception_id: mc.phy.o.big_bang_centre_in_space
      feedback: Space itself is expanding everywhere, like dots on a balloon being blown up. Every galaxy sees the others moving away; there is no centre.
    - id: B
      text: Near our own galaxy, which is why everything moves away from us
      correct: false
      misconception_id: mc.phy.o.big_bang_centre_in_space
      feedback: Space itself is expanding everywhere, like dots on a balloon being blown up. Every galaxy sees the others moving away; there is no centre.
    - id: C
      text: 'Nowhere: the Universe has always been as it is now'
      correct: false
      misconception_id: mc.phy.o.universe_unchanging
      feedback: 'Distant galaxies all show redshift that grows with distance: the Universe is expanding, so it was once much smaller and hotter.'
    - id: D
      text: 'Everywhere: all of space was once squeezed together'
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what redshift tells us about how galaxies move.
  - rung: 2
    name: concept
    text:
      en: Redshift is a stretch of light to longer wavelengths, caused by a galaxy moving away from us.
  - rung: 3
    name: first_step
    text:
      en: 'More distant galaxies show more redshift, so they recede faster: the Universe is expanding from a hot, dense start.'
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these ideas.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Everywhere: all of space was once squeezed together.'
  misconception_ids:
