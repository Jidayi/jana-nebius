stem: In a dry room a girl's jumper gains electrons from her shirt as she pulls it off.
parts:
- id: a
  prompt: What are the charges on the jumper and the shirt?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Jumper negative, shirt positive
      correct: true
    - id: B
      text: Jumper positive, shirt negative
      correct: false
      misconception_id: mc.phy.o.electron_gain_sign_reversed
      feedback: Electrons are negative. Gaining them makes an object negative; losing them leaves it positive.
    - id: C
      text: Both negative
      correct: false
      misconception_id: mc.phy.o.rubbed_pair_same_charge
      feedback: 'If the rod gains some electrons, the cloth has lost exactly those electrons: the rod is negative and the cloth is positive by the same amount.'
    - id: D
      text: Jumper negative, shirt uncharged
      correct: false
      misconception_id: mc.phy.o.charge_created_by_rubbing
      feedback: Rubbing makes no new charge. Electrons move from one object to the other, so one becomes negative and the other positive.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about which particles can move and what charge they carry.
  - rung: 2
    name: concept
    text:
      en: Rubbing moves tiny negative particles from one object to the other. Like charges repel and unlike charges attract.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: The jumper gains negative electrons; the shirt loses the same number.
  - rung: 5
    name: full_step
    text:
      en: Jumper negative, shirt positive. The jumper gains negative electrons; the shirt loses the same number.
  misconception_ids:
  - mc.phy.o.charge_created_by_rubbing
  - mc.phy.o.electron_gain_sign_reversed
  - mc.phy.o.rubbed_pair_same_charge
