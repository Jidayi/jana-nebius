id: itm.phy.o.forces.0064
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.springs
stem: A spring is 12 cm long. When a force of 1.5 N is hung from it, it stretches to 15 cm. It stays within its limit of proportionality.
parts:
- id: a
  prompt: Find the spring constant in N/m.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 50 N/m
      correct: true
    - id: B
      text: 10 N/m
      correct: false
      misconception_id: mc.phy.o.spring_length_for_extension
      feedback: 'Extension means how much longer the spring has become: stretched length minus original length.'
    - id: C
      text: 0.5 N/m
      correct: false
      misconception_id: mc.phy.o.spring_cm_not_converted
      feedback: A spring constant in N/m needs the extension in metres. Change centimetres into metres before you use F = kx.
    - id: D
      text: 0.02 N/m
      correct: false
      misconception_id: mc.phy.o.spring_ratio_inverted
      feedback: 'The spring constant is the force needed for each metre of extension, so force goes on top: k = F ÷ x.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The spring constant is the force per metre of extension.
  - rung: 2
    name: concept
    text:
      en: The extension is the stretched length minus the original length.
  - rung: 3
    name: first_step
    text:
      en: Change the extension into metres, then use k = F ÷ x.
  - rung: 4
    name: worked_step
    text:
      en: The extension is 0.03 m.
  - rung: 5
    name: full_step
    text:
      en: k = 1.5 ÷ 0.03 = 50 N/m.
  misconception_ids:
  - mc.phy.o.spring_cm_not_converted
  - mc.phy.o.spring_length_for_extension
  - mc.phy.o.spring_ratio_inverted
solution:
  steps:
  - n: 1
    latex: x = 15 - 12 = 3\ \text{cm} = 0.03\ \text{m}
    reason: Extension in metres
    check_id: chk_build_phy_frc_0064_ext_m
  - n: 2
    latex: k = \frac{F}{x} = \frac{1.5}{0.03} = 50\ \text{N/m}
    reason: From F = kx
    check_id: chk_build_phy_frc_0064_ans
difficulty:
  prior: 0.0
  band: core
estimated_seconds: 80
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
