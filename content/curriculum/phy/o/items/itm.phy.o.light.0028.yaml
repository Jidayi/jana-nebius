id: itm.phy.o.light.0028
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.light.refraction
stem: A ray of light travelling inside diamond (refractive index 2.42) reaches the surface at an angle of 15° to the normal and passes out into air.
parts:
- id: a
  prompt: Calculate the angle between the ray in air and the normal.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 38.8°
      correct: true
    - id: B
      text: 6.14°
      correct: false
      misconception_id: mc.phy.o.refraction_bends_wrong_way
      feedback: Light slows down in glass and swings towards the normal; it speeds up again in air and swings away. Picture a car whose first wheel hits sand and slows.
    - id: C
      text: 36.3°
      correct: false
      misconception_id: mc.phy.o.snell_angles_not_sines
      feedback: 'Angles do not scale in proportion here: doubling an angle does not double its sine. Take the sine of each angle first, then use the ratio.'
    - id: D
      text: 51.2°
      correct: false
      misconception_id: mc.phy.o.refraction_angles_from_surface
      feedback: Draw the normal at right angles to the surface where the ray crosses it. Every angle in the refraction formula is measured from that normal.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Light speeds up as it leaves the material, so it bends away from the normal.
  - rung: 2
    name: concept
    text:
      en: n = sin(angle in air) ÷ sin(angle in the material), whichever way the light goes.
  - rung: 3
    name: first_step
    text:
      en: So sin(angle in air) = 2.42 × sin 15°.
  - rung: 4
    name: worked_step
    text:
      en: sin(angle in air) = 0.626; take the inverse sine.
  - rung: 5
    name: full_step
    text:
      en: The ray leaves at 38.8° to the normal.
  misconception_ids:
  - mc.phy.o.refraction_angles_from_surface
  - mc.phy.o.refraction_bends_wrong_way
  - mc.phy.o.snell_angles_not_sines
solution:
  steps:
  - n: 1
    latex: \sin \theta = 2.42 \times \sin 15^\circ = 0.626
    reason: The angle in air goes with sin i
    check_id: chk_build_phy_lgt_0028_se
  - n: 2
    latex: \theta = \sin^{-1}(0.626) = 38.8^\circ
    reason: Inverse sine
    check_id: chk_build_phy_lgt_0028_ans
