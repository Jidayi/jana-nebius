id: itm.phy.o.sound.0055
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.sound.ultrasound
stem: During a scan, an ultrasound pulse reflects from the boundary of an organ. The echo returns 40 µs after the pulse was sent. Ultrasound travels at 1540 m/s in soft tissue.
parts:
- id: a
  prompt: How deep is the boundary below the probe, in centimetres?
  marks: 3
  answer:
    kind: numeric
    value: '3.08'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_snd_0055_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Put the time in seconds before using the speed.
  - rung: 2
    name: concept
    text:
      en: The pulse goes to the boundary and back, so the boundary is half the distance travelled.
  - rung: 3
    name: first_step
    text:
      en: 40 µs = 0.00004 s.
  - rung: 4
    name: worked_step
    text:
      en: d = 1540 × 0.00004 ÷ 2 in metres; then change to centimetres.
  - rung: 5
    name: full_step
    text:
      en: The boundary is 3.08 cm deep.
  misconception_ids:
  - mc.phy.o.echo_not_halved
  - mc.phy.o.echo_halving_misapplied
  - mc.phy.o.wave_prefix_ignored
solution:
  steps:
  - n: 1
    latex: t = 40\ \mu\text{s} = 0.00004\ \text{s}
    reason: A microsecond is a millionth of a second
    check_id: chk_build_phy_snd_0055_ts
  - n: 2
    latex: d = \frac{1540 \times 0.00004}{2} = 0.0308\ \text{m}
    reason: Half the there-and-back distance
    check_id: chk_build_phy_snd_0055_dm
  - n: 3
    latex: 0.0308\ \text{m} = 3.08\ \text{cm}
    reason: A metre is a hundred centimetres
    check_id: chk_build_phy_snd_0055_ans
difficulty:
  prior: 0.5
  band: core
estimated_seconds: 100
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
context_tags:
- none
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_phy_snd_0055_ans:
    args:
      expression: 1540*40*10^(-4)/2
    tool: math_evaluate
  chk_build_phy_snd_0055_dm:
    args:
      expression: 1540*40*10^(-6)/2
    tool: math_evaluate
  chk_build_phy_snd_0055_ts:
    args:
      quantity: 40 µs
      to: s
    tool: units_convert
