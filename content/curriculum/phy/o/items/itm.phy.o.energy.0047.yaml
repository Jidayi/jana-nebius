subject: phy
level: o
kc_ids:
- kc.phy.o.energy.energy_conversion
stem: A ball is thrown straight up at 10 m/s. Ignore air resistance and take g = 9.8 N/kg.
parts:
- id: a
  prompt: Calculate the greatest height it rises above the point where it was thrown.
  marks: 3
  answer:
    kind: numeric
    value: '5.10'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_nrg_0047_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: At the highest point the speed is zero, so all the kinetic energy has gone to the gravitational store.
  - rung: 2
    name: concept
    text:
      en: Set ½mv² = mgh; the mass cancels, so h = v² ÷ 2g.
  - rung: 3
    name: first_step
    text:
      en: v² = 10² = 100.
  - rung: 4
    name: worked_step
    text:
      en: Work out 100 ÷ (2 × 9.8).
  - rung: 5
    name: full_step
    text:
      en: The greatest height is 5.10 m.
  misconception_ids:
  - mc.phy.o.conversion_two_dropped
  - mc.phy.o.ke_speed_not_squared
  - mc.phy.o.energy_mass_for_weight
solution:
  steps:
  - n: 1
    latex: \frac{1}{2}mv^2 = mgh \Rightarrow h = \frac{v^2}{2g}
    reason: Kinetic energy becomes gravitational potential energy; m cancels
  - n: 2
    latex: v^2 = 10^2 = 100
    reason: The speed squared
    check_id: chk_build_phy_nrg_0047_vsq
  - n: 3
    latex: h = \frac{100}{2 \times 9.8} = 5.10\ \text{m}
    reason: Substitute
    check_id: chk_build_phy_nrg_0047_ans
