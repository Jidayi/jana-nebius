    text:
      en: The kinetic energy gained equals the gravitational energy lost.
  - rung: 3
    name: first_step
    text:
      en: Find the gravitational energy lost, mgh.
  - rung: 4
    name: worked_step
    text:
      en: Work out 1.2 × 10 × 1.5.
  - rung: 5
