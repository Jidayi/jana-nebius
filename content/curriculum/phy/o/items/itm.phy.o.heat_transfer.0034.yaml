stem: A cup of hot tea and a block of ice are both in a room.
parts:
- id: a
  prompt: Which of them gives out infrared radiation?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Only the tea, because cold objects do not radiate
      correct: false
      misconception_id: mc.phy.o.cold_objects_do_not_radiate
      feedback: Every object emits infrared. Hotter objects emit more, but even ice does; thermal cameras see people and animals by the infrared they give out.
    - id: B
      text: Only the ice, because it gives out cold
      correct: false
      misconception_id: mc.phy.o.cold_transferred_as_substance
      feedback: Only energy moves, always from hotter to colder. An ice pack does not send cold into you; energy flows out of you into the ice.
    - id: C
      text: Both do, because every object emits infrared
      correct: true
    - id: D
      text: Neither, because radiation needs a flame or the Sun
      correct: false
      misconception_id: mc.phy.o.cold_objects_do_not_radiate
      feedback: Every object emits infrared. Hotter objects emit more, but even ice does; thermal cameras see people and animals by the infrared they give out.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Infrared is an electromagnetic wave given out by every object; hotter objects give out more.
  - rung: 2
    name: concept
    text:
      en: Hotter objects emit more infrared than cooler ones, but cooler ones still emit some.
  - rung: 3
    name: first_step
    text:
      en: 'Compare the surfaces: dull black is the best absorber and emitter, shiny silver or white the worst.'
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that need a material for radiation to travel through, or treat cold as something that flows.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Both do, because every object emits infrared.'
  misconception_ids:
  - mc.phy.o.cold_objects_do_not_radiate
  - mc.phy.o.cold_transferred_as_substance
