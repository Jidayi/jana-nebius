stem: A charged polythene rod attracts a charged acetate strip.
parts:
- id: a
  prompt: The polythene rod is negative. What is the charge on the acetate strip?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Negative
      correct: false
      misconception_id: mc.phy.o.like_charges_attract
      feedback: Like charges repel and unlike charges attract, just as with magnetic poles.
    - id: B
      text: Positive
      correct: true
    - id: C
      text: Neutral, since a charge can only be made by rubbing it on the rod
      correct: false
      misconception_id: mc.phy.o.charge_created_by_rubbing
      feedback: Rubbing makes no new charge. Electrons move from one object to the other, so one becomes negative and the other positive.
    - id: D
      text: Negative, because it gained protons
      correct: false
      misconception_id: mc.phy.o.protons_move_in_charging
      feedback: 'Protons are held in the nuclei of atoms and cannot move. Rubbing moves electrons: losing them leaves an object positive.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about which particles can move and what charge they carry.
  - rung: 2
    name: concept
    text:
      en: Rubbing moves tiny negative particles from one object to the other. Like charges repel and unlike charges attract.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Attraction between two charged objects means opposite charges.
  - rung: 5
    name: full_step
    text:
      en: Positive. Attraction between two charged objects means opposite charges.
  misconception_ids:
  - mc.phy.o.charge_created_by_rubbing
  - mc.phy.o.like_charges_attract
  - mc.phy.o.protons_move_in_charging
