id: itm.phy.o.light.0025
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.light.refraction
stem: A ray of light passes from air into a plastic block. The angle of incidence is 55° and the angle of refraction is 33°.
parts:
- id: a
  prompt: Calculate the refractive index of the material.
  marks: 2
  answer:
    kind: numeric
    value: '1.50'
    unit: null
    unit_policy: none
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_lgt_0025_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which angle is in air and which is in the material?
  - rung: 2
    name: concept
    text:
      en: Refractive index n = sin i ÷ sin r, with i in air and r in the material.
  - rung: 3
    name: first_step
    text:
      en: Find sin 55° and sin 33°.
  - rung: 4
    name: worked_step
    text:
      en: sin i = 0.819 and sin r = 0.545; divide the first by the second.
  - rung: 5
    name: full_step
    text:
      en: The refractive index is 1.50.
  misconception_ids:
  - mc.phy.o.snell_ratio_inverted
  - mc.phy.o.snell_angles_not_sines
  - mc.phy.o.refraction_angles_from_surface
solution:
  steps:
  - n: 1
    latex: \sin 55^\circ = 0.819
    reason: Sine of the angle in air
    check_id: chk_build_phy_lgt_0025_si
  - n: 2
    latex: \sin 33^\circ = 0.545
    reason: Sine of the angle in the material
    check_id: chk_build_phy_lgt_0025_sr
  - n: 3
    latex: n = \frac{\sin 55^\circ}{\sin 33^\circ} = 1.50
    reason: n = sin i / sin r
    check_id: chk_build_phy_lgt_0025_ans
