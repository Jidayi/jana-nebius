id: itm.phy.o.circuits.0043
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.mixed_circuits
stem: A 10 Ω resistor is connected in series with a parallel pair made of a 10 Ω resistor and a 15 Ω resistor. The circuit is connected to a 12 V battery.
parts:
- id: a
  prompt: Calculate the current from the battery.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 0.343 A
      correct: false
      misconception_id: mc.phy.o.mixed_all_in_series
      feedback: Redraw the circuit and mark the junctions. Combine each parallel group first with 1/R = 1/R1 + 1/R2, then add the series parts.
    - id: B
      text: 2 A
      correct: false
      misconception_id: mc.phy.o.mixed_series_resistor_left_out
      feedback: All the current from the supply also passes through the series resistor, so its resistance adds to that of the parallel group.
    - id: C
      text: 1.2 A
      correct: false
      misconception_id: mc.phy.o.series_current_from_one_resistor
      feedback: 'The supply pushes the current through the whole circuit. Use the total resistance: I = V ÷ (R1 + R2 + ...).'
    - id: D
      text: 0.75 A
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The battery current depends on the total resistance of the whole circuit.
  - rung: 2
    name: concept
    text:
      en: Combine the parallel pair first, then add the series resistor, then use I = V/R.
  - rung: 3
    name: first_step
    text:
      en: For the pair, use (10 × 15) ÷ (10 + 15).
  - rung: 4
    name: worked_step
    text:
      en: The pair is 6 Ω and the total is 16 Ω; divide 12 V by the total.
  - rung: 5
    name: full_step
    text:
      en: The current from the battery is 0.75 A.
  misconception_ids:
  - mc.phy.o.mixed_all_in_series
  - mc.phy.o.mixed_series_resistor_left_out
  - mc.phy.o.series_current_from_one_resistor
solution:
  steps:
  - n: 1
    latex: R_p = \frac{10 \times 15}{10 + 15} = 6\ \Omega
    reason: Combine the parallel pair
    check_id: chk_build_phy_cir_0043_rp
  - n: 2
    latex: R = 10 + 6 = 16\ \Omega
    reason: Add the series resistor
    check_id: chk_build_phy_cir_0043_rt
  - n: 3
    latex: I = \frac{12}{16} = 0.75\ \text{A}
    reason: Ohm's law for the circuit
    check_id: chk_build_phy_cir_0043_ans
