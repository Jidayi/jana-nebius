id: itm.phy.o.forces.0076
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.circular_motion
stem: A stone is whirled round in a horizontal circle on a string. The string snaps.
parts:
- id: a
  prompt: Which way does the stone move just after the string snaps?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Along the tangent, the way it was moving at that moment
      correct: true
    - id: B
      text: Straight outwards, away from the centre
      correct: false
      misconception_id: mc.phy.o.released_flies_outwards
      feedback: 'When the string breaks the inward force stops, so the object carries on in the direction it was moving at that moment: along the tangent to the circle.'
    - id: C
      text: It keeps going round the circle
      correct: false
      misconception_id: mc.phy.o.circular_no_force_needed
      feedback: Speed stays the same but the direction changes all the time, so the velocity changes. A changing velocity needs a resultant force.
    - id: D
      text: Straight in towards the centre, the way the string pulled
      correct: false
      misconception_id: mc.phy.o.resultant_along_motion
      feedback: The resultant force points the way the velocity is changing. A car that is slowing down has a resultant force pointing backwards.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about the velocity of the object, not just its speed.
  - rung: 2
    name: concept
    text:
      en: Going round a circle the direction of motion changes all the time, so the velocity changes.
  - rung: 3
    name: first_step
    text:
      en: A changing velocity needs a resultant force; think about which way the velocity is being turned.
  - rung: 4
    name: worked_step
    text:
      en: Once the string snaps, no force acts on the stone in the horizontal plane.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Along the tangent, the way it was moving at that moment. With no inward force its velocity stops changing, so it carries on in the direction it had.'
  misconception_ids:
  - mc.phy.o.circular_no_force_needed
  - mc.phy.o.released_flies_outwards
  - mc.phy.o.resultant_along_motion
solution:
  steps:
  - n: 1
    latex: \text{Along the tangent, the way it was moving at that moment}
    reason: Think about the change in velocity
