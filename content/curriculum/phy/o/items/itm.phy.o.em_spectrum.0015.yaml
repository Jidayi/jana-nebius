stem: 'Moving through the spectrum from radio waves towards gamma rays:'
parts:
- id: a
  prompt: What happens to the frequency and the wavelength?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Frequency decreases and wavelength increases
      correct: false
      misconception_id: mc.phy.o.em_order_reversed
      feedback: Radio waves have the longest wavelength and the lowest frequency; gamma rays have the shortest wavelength and the highest frequency.
    - id: B
      text: Both increase
      correct: false
      misconception_id: mc.phy.o.frequency_wavelength_rise_together
      feedback: 'At a fixed speed, v = fλ: double the frequency and the wavelength halves.'
    - id: C
      text: Frequency increases and wavelength stays the same
      correct: false
      misconception_id: mc.phy.o.em_same_wavelength
      feedback: 'They share the speed, so a higher frequency must go with a shorter wavelength: c = fλ stays the same.'
    - id: D
      text: Frequency increases and wavelength decreases
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Start from the region with the longest wavelength and work towards the shortest.
  - rung: 2
    name: concept
    text:
      en: Frequency rises as wavelength falls, because every region has the same speed in a vacuum.
  - rung: 3
    name: first_step
    text:
      en: Every region is a transverse wave and can cross empty space.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that break the order or these shared properties.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Frequency increases and wavelength decreases.'
  misconception_ids:
  - mc.phy.o.em_order_reversed
  - mc.phy.o.em_same_wavelength
  - mc.phy.o.frequency_wavelength_rise_together
solution:
  steps:
  - n: 1
    latex: \text{Frequency increases and wavelength decreases}
    reason: Recall the order and the shared properties of the spectrum
