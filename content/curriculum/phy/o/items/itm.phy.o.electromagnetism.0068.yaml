id: itm.phy.o.electromagnetism.0068
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.electromagnetism.power_transmission
stem: The current in a transmission cable is halved while its resistance stays the same.
parts:
- id: a
  prompt: What happens to the power wasted in the cable?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It falls to a quarter
      correct: true
    - id: B
      text: It halves
      correct: false
      misconception_id: mc.phy.o.power_loss_not_squared
      feedback: Current × resistance is the p.d. along the cable. The power wasted is current² × resistance.
    - id: C
      text: It stays the same, as it depends only on the cable
      correct: false
      misconception_id: mc.phy.o.transmission_loss_unchanged
      feedback: The power wasted is current² × resistance, so it depends on the current as well as on the cable.
    - id: D
      text: It doubles
      correct: false
      misconception_id: mc.phy.o.higher_voltage_more_loss
      feedback: Power stations step the voltage up precisely because it cuts the current, and so cuts the heating in the cables.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what happens to the current, since the cables heat up because of it.
  - rung: 2
    name: concept
    text:
      en: An ideal transformer keeps Vp × Ip = Vs × Is, and the power wasted in a cable is I² × R.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: The power wasted is current² × resistance.
  - rung: 5
    name: full_step
    text:
      en: It falls to a quarter. The power wasted is current² × resistance.
  misconception_ids:
  - mc.phy.o.higher_voltage_more_loss
  - mc.phy.o.power_loss_not_squared
  - mc.phy.o.transmission_loss_unchanged
solution:
  steps:
  - n: 1
    latex: \text{It falls to a quarter}
    reason: Power is kept; heating goes with current squared
