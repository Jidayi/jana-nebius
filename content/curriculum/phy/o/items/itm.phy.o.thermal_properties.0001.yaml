subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.thermal_expansion
stem: Each metre of steel gets 0.012 mm longer for every 1 °C rise in temperature. A steel bridge deck is 120 m long at −10 °C.
parts:
- id: a
  prompt: By how much does it lengthen when it warms to 30 °C?
  marks: 2
  answer:
    kind: numeric
    value: '57.6'
    unit: mm
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_thp_0001_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Heating makes the particles vibrate more and move a little further apart, so the length grows.
  - rung: 2
    name: concept
    text:
      en: The expansion is proportional to both the length and the temperature rise.
  - rung: 3
    name: first_step
    text:
      en: Find the temperature rise from −10 °C to 30 °C, then the expansion of one metre.
  - rung: 4
    name: worked_step
    text:
      en: One metre lengthens by 0.48 mm; the whole length is 120 m.
  - rung: 5
    name: full_step
    text:
      en: It lengthens by 57.6 mm.
solution:
  steps:
  - n: 1
    latex: \Delta\theta = 30 - (-\,10) = 40\ ^\circ\text{C}
    reason: The temperature rise
    check_id: chk_build_phy_thp_0001_dt
  - n: 2
    latex: 0.012 \times 40 = 0.48\ \text{mm}
    reason: Expansion of each metre
    check_id: chk_build_phy_thp_0001_per
  - n: 3
    latex: 0.48 \times 120 = 57.6\ \text{mm}
    reason: Every metre expands by the same amount
    check_id: chk_build_phy_thp_0001_ans
