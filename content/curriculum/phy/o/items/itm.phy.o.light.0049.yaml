id: itm.phy.o.light.0049
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.light.total_internal_reflection
stem: Light carries telephone and internet signals along optical fibres made of very pure glass.
parts:
- id: a
  prompt: Why does the light stay inside the fibre as it goes round gentle bends?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It meets the sides at less than the critical angle and is totally internally reflected
      correct: false
      misconception_id: mc.phy.o.tir_angle_below_critical
      feedback: As the angle inside the glass grows, the ray in air bends closer to the surface. At the critical angle it runs along the surface; any bigger and no light gets out.
    - id: B
      text: It meets the sides at more than the critical angle and is totally internally reflected
      correct: true
    - id: C
      text: It is mostly reflected, and the light that escapes is too little to matter
      correct: false
      misconception_id: mc.phy.o.tir_some_light_escapes
      feedback: 'Below the critical angle light partly reflects and partly refracts. Above it there is no refracted ray at all: every bit of the light reflects, which is why it is called total.'
    - id: D
      text: It bends towards the normal each time it reaches the side of the fibre
      correct: false
      misconception_id: mc.phy.o.refraction_bends_wrong_way
      feedback: Light slows down in glass and swings towards the normal; it speeds up again in air and swings away. Picture a car whose first wheel hits sand and slows.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Total internal reflection needs two conditions.
  - rung: 2
    name: concept
    text:
      en: The light must be inside the denser material heading out, and its angle of incidence must be bigger than the critical angle.
  - rung: 3
    name: first_step
    text:
      en: sin C = 1 ÷ n, so a bigger refractive index gives a smaller critical angle.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against both conditions.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It meets the sides at more than the critical angle and is totally internally reflected.'
  misconception_ids:
  - mc.phy.o.refraction_bends_wrong_way
  - mc.phy.o.tir_angle_below_critical
  - mc.phy.o.tir_some_light_escapes
