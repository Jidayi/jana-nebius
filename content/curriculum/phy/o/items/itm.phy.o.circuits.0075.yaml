stem: A light-dependent resistor is moved from a sunny windowsill into a dark cupboard.
parts:
- id: a
  prompt: How does its resistance change?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It becomes much lower, because less light reaches it
      correct: false
      misconception_id: mc.phy.o.ldr_resistance_rises_with_light
      feedback: Light frees charges in an LDR, so more light means lower resistance. In the dark its resistance is very high.
    - id: B
      text: It does not change, because it is a resistor
      correct: false
      misconception_id: mc.phy.o.sensor_resistance_constant
      feedback: 'A sensor is useful because its resistance changes: with temperature for a thermistor, with light for an LDR.'
    - id: C
      text: It changes only if the cupboard is colder
      correct: false
      misconception_id: mc.phy.o.thermistor_ldr_confused
      feedback: 'Thermistor: temperature (think thermometer). LDR: light-dependent resistor, its symbol has arrows of light pointing in.'
    - id: D
      text: It becomes much higher
      correct: true
  show_working: false
  hints:
