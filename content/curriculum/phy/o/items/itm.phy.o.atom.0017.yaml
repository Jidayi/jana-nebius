stem: Uranium-235 and uranium-238 are found together in uranium ore.
parts:
- id: a
  prompt: Why can they not be separated by a chemical reaction?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: 'They can: uranium-238 is heavier, so it reacts differently'
      correct: false
      misconception_id: mc.phy.o.isotopes_differ_chemically
      feedback: Chemical reactions depend on the electrons. Isotopes have the same electrons, so they react in the same way.
    - id: B
      text: They have the same electrons, so they react in the same way
      correct: true
    - id: C
      text: Uranium-238 has three more protons, which stops it reacting
      correct: false
      misconception_id: mc.phy.o.isotopes_differ_in_protons
      feedback: Change the number of protons and you change the element. Isotopes of one element all have the same proton number; only the neutrons differ.
    - id: D
      text: Only uranium-235 counts as an isotope, as it is the one used in reactors
      correct: false
      misconception_id: mc.phy.o.isotope_means_radioactive
      feedback: Carbon-12 is a stable isotope of carbon and carbon-14 a radioactive one. Being an isotope is about protons and neutrons, not about decay.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide what makes two nuclides the same element.
  - rung: 2
    name: concept
    text:
      en: Isotopes have the same proton number but different nucleon numbers.
  - rung: 3
    name: first_step
    text:
      en: What decides how an atom behaves in a chemical reaction?
  - rung: 4
    name: worked_step
    text:
      en: Test each option against that definition.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: They have the same electrons, so they react in the same way.'
  misconception_ids:
  - mc.phy.o.isotope_means_radioactive
  - mc.phy.o.isotopes_differ_chemically
  - mc.phy.o.isotopes_differ_in_protons
