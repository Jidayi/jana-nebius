id: itm.phy.o.heat_transfer.0020
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.heat_transfer.convection
stem: A hot-air balloon's envelope holds 3000 m³ of hot air of density 1 kg/m³. The cooler air outside has a density of 1.18 kg/m³. The upward push of the outside air equals the weight of the outside air the envelope displaces. Take g = 10 N/kg.
parts:
- id: a
  prompt: Find the resultant upward force on the hot air, ignoring the balloon's own weight.
  marks: 3
  answer:
    kind: numeric
    value: '5400'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_htr_0020_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Hot air rises because it is less dense than the air around it.
  - rung: 2
    name: concept
    text:
      en: The upward push is the weight of outside air of the same volume; the hot air's own weight pulls down.
  - rung: 3
    name: first_step
    text:
      en: Find the mass of each volume of air with mass = density × volume.
  - rung: 4
    name: worked_step
    text:
      en: The difference in mass is 540 kg; multiply by g.
  - rung: 5
    name: full_step
    text:
      en: The resultant upward force is 5400 N.
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: m_{out} = 1.18 \times 3000 = 3540\ \text{kg}
    reason: Mass of the displaced air
    check_id: chk_build_phy_htr_0020_mo
  - n: 2
    latex: m_{in} = 1 \times 3000 = 3000\ \text{kg}
    reason: Mass of the hot air
    check_id: chk_build_phy_htr_0020_mi
  - n: 3
    latex: 3540 - 3000 = 540\ \text{kg}
    reason: The difference in mass
    check_id: chk_build_phy_htr_0020_dm
  - n: 4
    latex: F = 540 \times 10 = 5400\ \text{N}
    reason: Upward push − weight of the hot air
    check_id: chk_build_phy_htr_0020_ans
