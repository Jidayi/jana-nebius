id: itm.phy.o.circuits.0026
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.parallel_circuits
stem: Zainab connects two different lamps in parallel across a 12 V battery. The current from the battery is 2 A and the current through the first lamp is 1.2 A.
parts:
- id: a
  prompt: Find the current through the second lamp.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 2 A
      correct: false
      misconception_id: mc.phy.o.parallel_current_same_each_branch
      feedback: 'At a junction the current splits: the branch currents add up to the current from the supply.'
    - id: B
      text: 1 A
      correct: false
      misconception_id: mc.phy.o.parallel_current_split_equally
      feedback: Each branch has the same p.d., so a branch with less resistance takes more current (I = V/R). Only equal branches share equally.
    - id: C
      text: 0.8 A
      correct: true
    - id: D
      text: 3.2 A
      correct: false
      misconception_id: mc.phy.o.parallel_branch_current_added
      feedback: The branch currents together make up the supply current, so the other branch carries the supply current minus the known branch.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: At the junction the current from the battery splits between the two lamps.
  - rung: 2
    name: concept
    text:
      en: The branch currents add up to the current from the battery.
  - rung: 3
    name: first_step
    text:
      en: The second lamp carries whatever the first lamp does not.
  - rung: 4
    name: worked_step
    text:
      en: Take 1.2 A away from 2 A.
  - rung: 5
    name: full_step
    text:
      en: The second lamp carries 0.8 A.
  misconception_ids:
  - mc.phy.o.parallel_branch_current_added
  - mc.phy.o.parallel_current_same_each_branch
  - mc.phy.o.parallel_current_split_equally
solution:
  steps:
  - n: 1
    latex: I_2 = 2 - 1.2 = 0.8\ \text{A}
    reason: Branch currents add up to the total
    check_id: chk_build_phy_cir_0026_ans
