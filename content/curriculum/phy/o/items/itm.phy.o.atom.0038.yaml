version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.atom.nuclear_model_evidence
stem: Each gold atom contains many electrons, yet they hardly affect the path of an alpha particle.
parts:
- id: a
  prompt: Why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The electrons turn alpha particles back
      correct: false
      misconception_id: mc.phy.o.deflection_by_electrons
      feedback: 'An electron has less than a seven-thousandth of an alpha particle''s mass: like a table-tennis ball in the path of a bowling ball. Only something massive and highly charged could turn an alpha particle back.'
    - id: B
      text: The electrons hold most of the atom's mass
      correct: false
      misconception_id: mc.phy.o.mass_spread_through_atom
      feedback: Only a very massive object can turn back a fast alpha particle. Almost all of the atom's mass is in the tiny nucleus.
    - id: C
      text: An electron's mass is tiny compared with an alpha particle's
      correct: true
    - id: D
      text: The electrons are inside the nucleus, out of the way
      correct: false
      misconception_id: mc.phy.o.nucleus_fills_atom
      feedback: If the nucleus were a pea in the centre of a football stadium, the atom would be the whole stadium. That is why almost every alpha particle missed it.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Recall the three things that happened to alpha particles fired at thin gold foil.
  - rung: 2
    name: concept
    text:
      en: Most went straight through, a few were deflected a little, and a very few were turned back.
  - rung: 3
    name: first_step
    text:
      en: Picture a bowling ball rolling through a cloud of table-tennis balls.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that contradict what was seen.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: An electron''s mass is tiny compared with an alpha particle''s.'
  misconception_ids:
  - mc.phy.o.deflection_by_electrons
  - mc.phy.o.mass_spread_through_atom
  - mc.phy.o.nucleus_fills_atom
