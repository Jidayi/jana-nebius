type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.magnetism.magnets_and_materials
stem: A bar magnet hangs from a thread. The north pole of a second magnet is brought near its north-seeking end.
parts:
- id: a
  prompt: How does the hanging magnet move?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: That end swings towards the second magnet
      correct: false
      misconception_id: mc.phy.o.like_poles_attract
      feedback: 'Like poles repel and unlike poles attract: two north poles push apart, a north and a south pull together.'
    - id: B
      text: That end swings away
      correct: true
    - id: C
      text: It does not move unless the magnets touch
      correct: false
      misconception_id: mc.phy.o.magnetic_force_needs_contact
      feedback: A compass needle swings when a magnet is still a hand's width away. Magnetic forces act at a distance.
    - id: D
      text: It does not move, because the thread shields it
      correct: false
      misconception_id: mc.phy.o.nonmagnetic_blocks_magnetism
      feedback: A fridge magnet still holds a sheet of paper against the door, and a magnet pulls a paper clip through a thin table top.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Recall the two rules: how poles act on each other, and which materials are magnetic.'
  - rung: 2
    name: concept
    text:
      en: Like poles repel and unlike poles attract. Only a few metals are magnetic, and magnetic materials differ in how easily they gain and lose their magnetism.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: The north-seeking end is a north pole, and like poles repel.
  - rung: 5
    name: full_step
    text:
      en: That end swings away. The north-seeking end is a north pole, and like poles repel.
  misconception_ids:
  - mc.phy.o.like_poles_attract
  - mc.phy.o.magnetic_force_needs_contact
  - mc.phy.o.nonmagnetic_blocks_magnetism
