stem: A road sign gives a speed limit of 54 km/h.
parts:
- id: a
  prompt: Write this speed in metres per second.
  marks: 1
  answer:
    kind: numeric
    value: '15'
    unit: m/s
    unit_policy: exact
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0003_a
  hints:
  - rung: 1
    name: orient
    text:
      en: Kilometres per hour and metres per second measure the same thing. Which is the bigger unit?
  - rung: 2
    name: concept
    text:
      en: 1 m/s is the same speed as 3.6 km/h.
  - rung: 3
    name: first_step
    text:
      en: To go from km/h to m/s, divide by 3.6.
  - rung: 4
    name: worked_step
    text:
      en: Work out 54 ÷ 3.6.
  - rung: 5
    name: full_step
    text:
      en: 54 ÷ 3.6 = 15, so the limit is 15 m/s.
  misconception_ids:
  - mc.phy.o.kmh_divide_by_36
solution:
  steps:
  - n: 1
    latex: 54\ \text{km/h} = \frac{54}{3.6}\ \text{m/s}
    reason: 1 m/s is 3.6 km/h
  - n: 2
    latex: = 15\ \text{m/s}
    reason: Divide
    check_id: chk_build_phy_k_0003_a
