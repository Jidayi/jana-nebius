id: itm.phy.o.energy.0116
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.energy_resources
stem: A gas-fired power station and a solar farm are compared.
parts:
- id: a
  prompt: Which is an advantage of the gas-fired power station?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It can produce electricity at any time
      correct: true
    - id: B
      text: It is renewable because more gas is still forming
      correct: false
      misconception_id: mc.phy.o.plentiful_seen_as_renewable
      feedback: Coal takes millions of years to form, so once burned it is gone for any useful time. A renewable resource is replaced as fast as we use it.
    - id: C
      text: Solar farms are non-renewable because they only work in daylight
      correct: false
      misconception_id: mc.phy.o.renewability_confused_with_reliability
      feedback: Renewable asks whether the resource is replaced; reliable asks whether it is there when we need it. Wind is renewable but not reliable.
    - id: D
      text: Its fuel can be burned again after use
      correct: false
      misconception_id: mc.phy.o.renewable_means_reusable
      feedback: No fuel can be burned twice. Renewable means nature replaces the resource, like new crops or more wind.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Read each option and decide whether it is really true for this resource.
  - rung: 2
    name: concept
    text:
      en: Think about what happens at night.
  - rung: 3
    name: first_step
    text:
      en: Renewable means replaced as fast as we use it; reliable means there when we need it. Neither tells you the cost or the effects on the environment.
  - rung: 4
    name: worked_step
    text:
      en: Rule out each option that mixes these ideas up or gets the original source of the energy wrong.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It can produce electricity at any time.'
  misconception_ids:
  - mc.phy.o.plentiful_seen_as_renewable
  - mc.phy.o.renewability_confused_with_reliability
  - mc.phy.o.renewable_means_reusable
solution:
  steps:
  - n: 1
    latex: \text{It can produce electricity at any time}
    reason: Compare renewability, reliability, cost and effects
