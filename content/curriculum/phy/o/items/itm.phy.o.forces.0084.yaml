stem: A uniform rod is pivoted at its centre. On the left hang 2 N at 0.1 m and 2 N at 0.3 m from the pivot.
parts:
- id: a
  prompt: Find the single weight that balances the rod when hung 0.45 m to the right of the pivot.
  marks: 3
  answer:
    kind: numeric
    value: '1.78'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_frc_0084_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Both weights on the left turn the rod the same way.
  - rung: 2
    name: concept
    text:
      en: Add their moments to get the total anticlockwise moment.
  - rung: 3
    name: first_step
    text:
      en: Then divide that total by the distance of the unknown weight.
  - rung: 4
    name: worked_step
    text:
      en: The total anticlockwise moment is 0.8 N m.
  - rung: 5
    name: full_step
    text:
      en: F = 0.8 ÷ 0.45 = 1.78 N.
  misconception_ids:
  - mc.phy.o.moment_one_force_left_out
  - mc.phy.o.balance_equal_forces
solution:
  steps:
  - n: 1
    latex: 2 \times 0.1 + 2 \times 0.3 = 0.8\ \text{N m}
    reason: Total anticlockwise moment
    check_id: chk_build_phy_frc_0084_m
  - n: 2
    latex: F = \frac{0.8}{0.45} = 1.78\ \text{N}
    reason: Clockwise moment must equal it
    check_id: chk_build_phy_frc_0084_ans
