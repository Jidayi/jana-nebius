subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.parallel_circuits
stem: In a circuit, two resistors of resistance 6 Ω and 12 Ω are connected in parallel with each other.
parts:
- id: a
  prompt: Calculate their combined resistance.
  marks: 2
  answer:
    kind: numeric
    value: '4'
    unit: Ω
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_cir_0016_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Side-by-side paths make it easier for current to flow, so expect less than the smaller resistance.
  - rung: 2
    name: concept
    text:
      en: For resistors in parallel, 1/R = 1/R1 + 1/R2.
  - rung: 3
    name: first_step
    text:
      en: Work out 1/6 + 1/12, then take the reciprocal of the sum.
  - rung: 4
    name: worked_step
    text:
      en: For two resistors this is the same as (6 × 12) ÷ (6 + 12).
  - rung: 5
    name: full_step
    text:
      en: The combined resistance is 4 Ω.
  misconception_ids:
  - mc.phy.o.parallel_resistances_added
  - mc.phy.o.parallel_reciprocal_not_inverted
  - mc.phy.o.parallel_resistance_averaged
solution:
  steps:
  - n: 1
    latex: \frac{1}{R} = \frac{1}{6} + \frac{1}{12} = 0.25
    reason: Add the reciprocals
    check_id: chk_build_phy_cir_0016_inv
  - n: 2
    latex: R = \frac{6 \times 12}{6 + 12} = 4\ \Omega
    reason: Product over sum for two
    check_id: chk_build_phy_cir_0016_ans
