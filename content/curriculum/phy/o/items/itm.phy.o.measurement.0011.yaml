id: itm.phy.o.measurement.0011
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.measurement.si_prefixes
stem: A current is measured as 0.066 A.
parts:
- id: a
  prompt: Write this current in mA.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 0.000066 mA
      correct: false
      misconception_id: mc.phy.o.prefix_multiply_divide_swapped
      feedback: A milliamp is much smaller than an amp, so a current in milliamps becomes a smaller number of amps. Ask whether the new unit is bigger or smaller before you multiply or divide.
    - id: B
      text: 6.6 mA
      correct: false
      misconception_id: mc.phy.o.prefix_power_wrong
      feedback: 'Learn the prefixes as powers of ten: kilo is a thousand, mega a million, milli a thousandth, micro a millionth and nano a thousand-millionth.'
    - id: C
      text: 66000 mA
      correct: false
      misconception_id: mc.phy.o.prefix_confused_with_neighbour
      feedback: Milli and micro differ by a factor of a thousand, and so do kilo and mega. Write the prefix as a power of ten before you convert.
    - id: D
      text: 66 mA
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Which is the bigger unit: A or mA?'
  - rung: 2
    name: concept
    text:
      en: The prefix in mA means one thousandth of the base unit, A.
  - rung: 3
    name: first_step
    text:
      en: Changing to a smaller unit makes the number bigger.
  - rung: 4
    name: worked_step
    text:
      en: So multiply by a thousand.
  - rung: 5
    name: full_step
    text:
      en: 0.066 A = 66 mA.
  misconception_ids:
  - mc.phy.o.prefix_confused_with_neighbour
  - mc.phy.o.prefix_multiply_divide_swapped
  - mc.phy.o.prefix_power_wrong
solution:
  steps:
  - n: 1
    latex: 1\ \text{mA} = 10^{-3}\ \text{A}
    reason: What the prefix means
  - n: 2
    latex: 0.066\ \text{A} \rightarrow 66\ \text{mA}
    reason: Divide when the unit gets bigger, multiply when it gets smaller
    check_id: chk_build_phy_mea_0011_calc
  - n: 3
    latex: 66\ \text{mA}
    reason: Checked by converting the units
    check_id: chk_build_phy_mea_0011_ans
