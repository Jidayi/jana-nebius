id: itm.phy.o.momentum.0001
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.momentum.momentum_calculation
stem: A trolley of mass 1.5 kg moves to the left at 0.6 m/s. Take right as the positive direction.
parts:
- id: a
  prompt: Find the momentum, giving its sign.
  marks: 1
  answer:
    kind: numeric
    value: '-0.9'
    unit: kg m/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mom_0001_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Momentum is a vector, so its sign shows its direction.
  - rung: 2
    name: concept
    text:
      en: Momentum = mass × velocity.
  - rung: 3
    name: first_step
    text:
      en: The object moves opposite to right, so its velocity is negative.
  - rung: 4
    name: worked_step
    text:
      en: Work out 1.5 × (−0.6).
  - rung: 5
    name: full_step
    text:
      en: p = -0.9 kg m/s; the minus sign shows it is against the positive direction.
  misconception_ids:
  - mc.phy.o.momentum_sign_ignored
  - mc.phy.o.momentum_as_kinetic_energy
  - mc.phy.o.momentum_ratio_inverted
solution:
  steps:
  - n: 1
    latex: v = -\,0.6\ \text{m/s}
    reason: Moving against the positive (right) direction
  - n: 2
    latex: p = mv = 1.5 \times (-\,0.6) = -0.9\ \text{kg m/s}
    reason: Momentum = mass × velocity
    check_id: chk_build_phy_mom_0001_ans
