kc_ids:
- kc.phy.o.radioactivity.half_life
stem: A sample of iodine-131 has a half-life of 8 days. At the start the activity is 120 kBq.
parts:
- id: a
  prompt: Find the activity after 16 days.
  marks: 2
  answer:
    kind: numeric
    value: '30'
    unit: kBq
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_rad_0037_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Half-life is the time for the amount of a radioactive isotope to halve.
  - rung: 2
    name: concept
    text:
      en: First find how many half-lives fit into the time.
  - rung: 3
    name: first_step
    text:
      en: Then halve the starting value once for each half-life.
  - rung: 4
    name: worked_step
    text:
      en: There are 2 half-lives, so halve 120 once for each of them.
  - rung: 5
    name: full_step
    text:
      en: The activity is 30 kBq.
  misconception_ids:
  - mc.phy.o.half_life_linear
  - mc.phy.o.half_life_halved_once
  - mc.phy.o.decayed_for_remaining
  - mc.phy.o.half_lives_counted_wrongly
solution:
  steps:
  - n: 1
    latex: \frac{16}{8} = 2\ \text{half-lives}
    reason: Time ÷ half-life
    check_id: chk_build_phy_rad_0037_n
  - n: 2
    latex: \frac{120}{2^{2}} = 30\ \text{kBq}
    reason: Halve once per half-life
    check_id: chk_build_phy_rad_0037_ans
