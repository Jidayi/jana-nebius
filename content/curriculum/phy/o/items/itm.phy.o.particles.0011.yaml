id: itm.phy.o.particles.0011
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.particles.states_of_matter
stem: A gas spreads out to fill any container it is put in.
parts:
- id: a
  prompt: Which describes the particles in a gas?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Far apart, with air filling the spaces between them
      correct: false
      misconception_id: mc.phy.o.air_between_particles
      feedback: 'Air is itself made of particles. Between the particles of any gas there is nothing at all: empty space.'
    - id: B
      text: Close together, sliding past each other
      correct: false
      misconception_id: mc.phy.o.state_pictures_swapped
      feedback: 'Solid: close, regular, vibrating in place. Liquid: close, irregular, sliding past each other. Gas: far apart, fast and random. Match the picture to how the material behaves.'
    - id: C
      text: Each particle has swollen to a larger size
      correct: false
      misconception_id: mc.phy.o.particles_grow_when_heated
      feedback: A water particle is the same size in ice, in water and in steam. Heating makes particles move faster and spread further apart; it does not make them bigger.
    - id: D
      text: Far apart, moving quickly and randomly in all directions
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Picture the particles: how close together are they, and how do they move?'
  - rung: 2
    name: concept
    text:
      en: A gas can be compressed easily, so most of its volume is empty space.
  - rung: 3
    name: first_step
    text:
      en: 'Test each option against how the material behaves: does it keep its shape, flow, or spread out?'
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that give single particles the properties of the whole material.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Far apart, moving quickly and randomly in all directions.'
  misconception_ids:
  - mc.phy.o.air_between_particles
  - mc.phy.o.particles_grow_when_heated
  - mc.phy.o.state_pictures_swapped
solution:
  steps:
  - n: 1
    latex: \text{Far apart, moving quickly and randomly in all directions}
    reason: Match the description to the particle model
