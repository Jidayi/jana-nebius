id: itm.phy.o.sound.0059
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.sound.ultrasound
stem: A fishing boat's sonar sends an ultrasound pulse down to the sea bed, 60 m below. Sound travels at 340 m/s in air and 1500 m/s in sea water.
parts:
- id: a
  prompt: How long after the pulse is sent does the echo return?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 0.04 s
      correct: false
      misconception_id: mc.phy.o.echo_not_halved
      feedback: 'Draw the path: the sound goes to the reflector and comes back. The echo time covers twice the distance to the reflector.'
    - id: B
      text: 0.02 s
      correct: false
      misconception_id: mc.phy.o.echo_halving_misapplied
      feedback: The sound covers twice the distance to the reflector, so the distance to it is half of speed × time.
    - id: C
      text: 0.353 s
      correct: false
      misconception_id: mc.phy.o.ultrasound_air_speed_used
      feedback: Sound travels about four times faster in water than in air. Use the speed for the material the pulse actually crosses.
    - id: D
      text: 0.08 s
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The pulse travels through sea water, so use the speed in water.
  - rung: 2
    name: concept
    text:
      en: It must go down to the sea bed and come back up.
  - rung: 3
    name: first_step
    text:
      en: Total distance = 2 × 60 = 120 m.
  - rung: 4
    name: worked_step
    text:
      en: Divide by the speed in water.
  - rung: 5
    name: full_step
    text:
      en: t = 0.08 s.
  misconception_ids:
  - mc.phy.o.echo_halving_misapplied
  - mc.phy.o.echo_not_halved
  - mc.phy.o.ultrasound_air_speed_used
solution:
  steps:
  - n: 1
    latex: 2 \times 60 = 120\ \text{m}
    reason: Down to the sea bed and back
    check_id: chk_build_phy_snd_0059_tot
  - n: 2
    latex: t = \frac{120}{1500} = 0.08\ \text{s}
    reason: Time = distance ÷ speed in water
    check_id: chk_build_phy_snd_0059_ans
