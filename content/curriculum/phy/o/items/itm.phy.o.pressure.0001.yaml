    text:
      en: Pressure is the force acting on each square metre.
  - rung: 2
    name: concept
    text:
      en: Pressure = force ÷ area.
  - rung: 3
    name: first_step
    text:
      en: The force is the weight, and the area is already in m².
  - rung: 4
    name: worked_step
    text:
      en: Work out 2700 ÷ 0.02.
  - rung: 5
    name: full_step
    text:
      en: The pressure is 135000 Pa.
