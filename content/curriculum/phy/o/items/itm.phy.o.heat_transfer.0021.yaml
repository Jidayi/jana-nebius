id: itm.phy.o.heat_transfer.0021
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.heat_transfer.convection
stem: An electric heater stands near the floor of a room.
parts:
- id: a
  prompt: Why does it warm the whole room?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Warm air sinks and spreads out across the floor
      correct: false
      misconception_id: mc.phy.o.heated_fluid_denser
      feedback: Heating makes a fluid expand, so the same mass takes up more space and its density falls. Warm air and water rise; cooled air and water sink.
    - id: B
      text: Warm air above it rises and cooler air sinks to take its place, setting up a current
      correct: true
    - id: C
      text: Heat rises by itself while the air stays still
      correct: false
      misconception_id: mc.phy.o.heat_itself_rises
      feedback: 'Energy has no up or down. In convection the fluid moves: warmer, less dense fluid is pushed upwards by cooler, denser fluid sinking beneath it.'
    - id: D
      text: Hot and cold air have the same density, so the heat just spreads
      correct: false
      misconception_id: mc.phy.o.density_unchanged_on_heating
      feedback: Density is mass divided by volume. Heating keeps the mass the same but increases the volume, so the density falls; that is why warm fluids rise.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Convection is the movement of a warm fluid carrying energy with it.
  - rung: 2
    name: concept
    text:
      en: Think about what the air near the heater does once it has been warmed.
  - rung: 3
    name: first_step
    text:
      en: Ask what happens to the density of a fluid when it is heated or cooled.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options where heat moves by itself or a solid flows.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Warm air above it rises and cooler air sinks to take its place, setting up a current.'
  misconception_ids:
  - mc.phy.o.density_unchanged_on_heating
  - mc.phy.o.heat_itself_rises
  - mc.phy.o.heated_fluid_denser
solution:
  steps:
  - n: 1
    latex: \text{Warm air above it rises and cooler air sinks to take its place, setting up a current}
    reason: Explain the current by changes in density
