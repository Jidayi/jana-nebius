stem: A source near a counter gives 480 counts in 5 minutes. The background count rate is 25 counts/min.
parts:
- id: a
  prompt: Find the corrected count rate from the source.
  marks: 2
  answer:
    kind: numeric
    value: '71'
    unit: counts/min
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_rad_0049_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A corrected count rate is the count rate from the source alone.
  - rung: 2
    name: concept
    text:
      en: The background is given per minute, so first turn the count into a count per minute.
  - rung: 3
    name: first_step
    text:
      en: Then subtract the background count rate.
  - rung: 4
    name: worked_step
    text:
      en: The measured count rate is 96 counts/min.
  - rung: 5
    name: full_step
    text:
      en: The corrected count rate is 71 counts/min.
  misconception_ids:
  - mc.phy.o.background_ignored
  - mc.phy.o.background_rate_from_count
  - mc.phy.o.background_added
solution:
