    latex: \frac{480}{5} = 96\ \text{counts/min}
    reason: Measured count rate
    check_id: chk_build_phy_rad_0049_c
  - n: 2
    latex: 96 - 25 = 71\ \text{counts/min}
    reason: Subtract the background count rate
    check_id: chk_build_phy_rad_0049_ans
