id: itm.phy.o.motion.0071
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.motion.distance_time_gradient
stem: The distance-time graph for a jogger is a straight line from the point (10 s, 40 m) to the point (50 s, 200 m).
parts:
- id: a
  prompt: Use the gradient to find the speed.
  marks: 2
  answer:
    kind: numeric
    value: '4.0'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0071_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A straight distance-time line means a steady speed. Where on the graph is the speed?
  - rung: 2
    name: concept
    text:
      en: 'The speed is the gradient of the distance-time graph: change in distance divided by change in time.'
  - rung: 3
    name: first_step
    text:
      en: Read the change in distance and the change in time between the two points.
  - rung: 4
    name: worked_step
    text:
      en: Gradient = (200 − 40) ÷ (50 − 10).
  - rung: 5
    name: full_step
    text:
      en: Gradient = (200 − 40) ÷ (50 − 10) = 4.0 m/s.
  misconception_ids:
  - mc.phy.o.gradient_axes_swapped
  - mc.phy.o.gradient_from_one_point
solution:
  steps:
  - n: 1
    latex: v = \frac{\Delta d}{\Delta t}
    reason: Speed is the gradient of a distance-time graph
  - n: 2
    latex: \Delta d = 160\ \text{m}
    reason: Change in distance
    check_id: chk_build_phy_k_0071_s2
  - n: 3
    latex: \Delta t = 40\ \text{s}
    reason: Change in time
    check_id: chk_build_phy_k_0071_s3
  - n: 4
    latex: v = 4.0\ \text{m/s}
    reason: Divide
    check_id: chk_build_phy_k_0071_a
