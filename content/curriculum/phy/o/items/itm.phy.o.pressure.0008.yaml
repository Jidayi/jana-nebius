id: itm.phy.o.pressure.0008
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.pressure_on_surfaces
stem: A box presses on a shelf with a force of 40 N over an area of 400 cm².
parts:
- id: a
  prompt: Calculate the pressure in pascals.
  marks: 2
  answer:
    kind: numeric
    value: '1000'
    unit: Pa
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_prs_0008_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A pascal is one newton on each square metre, so the area must be in m².
  - rung: 2
    name: concept
    text:
      en: 1 m² is 10000 cm², because the length factor of a hundred is squared.
  - rung: 3
    name: first_step
    text:
      en: Change 400 cm² into m² by dividing by 10000.
  - rung: 4
    name: worked_step
    text:
      en: The area is 0.04 m²; divide 40 N by it.
  - rung: 5
    name: full_step
    text:
      en: The pressure is 1000 Pa.
  misconception_ids:
  - mc.phy.o.pressure_area_cm2_not_converted
  - mc.phy.o.pressure_area_factor_not_squared
  - mc.phy.o.pressure_force_times_area
solution:
  steps:
  - n: 1
    latex: 1\ \text{m}^2 = 10000\ \text{cm}^2
    reason: 100 cm by 100 cm
    check_id: chk_build_phy_prs_0008_k
  - n: 2
    latex: A = 400 \div 10000 = 0.04\ \text{m}^2
    reason: Change cm² into m²
    check_id: chk_build_phy_prs_0008_am
  - n: 3
    latex: p = \frac{40}{0.04} = 1000\ \text{Pa}
    reason: Pressure = force ÷ area
    check_id: chk_build_phy_prs_0008_ans
difficulty:
  prior: 0.1
  band: core
estimated_seconds: 80
exam_style:
  paper_style: objective
  total_marks: 2
  calculator: true
context_tags:
- none
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-opus-5-5
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_phy_prs_0008_am:
    args:
      expression: 400/10000
    tool: math_evaluate
  chk_build_phy_prs_0008_ans:
    args:
      expression: 40/(400/10000)
    tool: math_evaluate
  chk_build_phy_prs_0008_k:
    args:
      expression: 100^2
    tool: math_evaluate
  chk_build_phy_prs_0008_tool:
    args:
      quantity: 0.1 N/cm^2
      to: Pa
    tool: units_convert
authoring:
