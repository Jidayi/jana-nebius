stem: A student times 20 complete oscillations of a pendulum and records 22.4 s.
parts:
- id: a
  prompt: Find the period of the pendulum.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 22.4 s
      correct: false
      misconception_id: mc.phy.o.repeat_not_divided
      feedback: 'Timing many swings makes the measurement more accurate, but the answer asked for is one swing: divide the total by the number of swings.'
    - id: B
      text: 2.24 s
      correct: false
      misconception_id: mc.phy.o.oscillation_counted_wrongly
      feedback: One oscillation is a swing out and all the way back to where it started. Count from the same point, moving the same way, each time.
