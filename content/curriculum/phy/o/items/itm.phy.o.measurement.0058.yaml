  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Timing many oscillations reduces the effect of reaction time.
  - rung: 2
    name: concept
    text:
      en: The period is the time for one complete oscillation.
  - rung: 3
    name: first_step
    text:
      en: Share the total time equally among the 20 oscillations.
  - rung: 4
    name: worked_step
    text:
      en: Work out 22.4 ÷ 20.
  - rung: 5
    name: full_step
    text:
      en: The period is 1.12 s.
