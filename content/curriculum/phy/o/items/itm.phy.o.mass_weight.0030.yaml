id: itm.phy.o.mass_weight.0030
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.mass_weight.mass_or_weight
stem: Esi stands on bathroom scales marked in newtons, first on Earth and then on Mars.
parts:
- id: a
  prompt: What happens to the reading on Mars?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It is the same, because her mass has not changed
      correct: false
      misconception_id: mc.phy.o.weight_same_on_every_planet
      feedback: Weight is the pull of a planet on the object, weight = mass × g. A world with a smaller g pulls less on the same mass.
    - id: B
      text: It is smaller, because her mass is smaller
      correct: false
      misconception_id: mc.phy.o.mass_changes_with_g
      feedback: Mass is the amount of matter in the object, and a trip to the Moon removes no matter. Only the weight, the pull of gravity on it, changes.
    - id: C
      text: It is smaller, because the gravitational field is weaker
      correct: true
    - id: D
      text: It is zero, because there is no gravity away from the Earth
      correct: false
      misconception_id: mc.phy.o.no_mass_in_space
      feedback: An astronaut floating in a spacecraft is still hard to push and to stop, because all her mass is still there. Gravity gets weaker far from planets, but mass never disappears.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide whether each option is about mass, weight, or both.
  - rung: 2
    name: concept
    text:
      en: Scales marked in newtons measure how hard gravity pulls her down.
  - rung: 3
    name: first_step
    text:
      en: Test each option against the difference between the amount of matter and the pull of gravity.
  - rung: 4
    name: worked_step
    text:
      en: Rule out every option that mixes up the two quantities.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It is smaller, because the gravitational field is weaker.'
  misconception_ids:
  - mc.phy.o.mass_changes_with_g
  - mc.phy.o.no_mass_in_space
  - mc.phy.o.weight_same_on_every_planet
solution:
  steps:
  - n: 1
    latex: \text{It is smaller, because the gravitational field is weaker}
    reason: Mass stays the same; weight depends on g
