    text:
      en: The total input is not given directly.
  - rung: 2
    name: concept
    text:
      en: Energy in = useful out + wasted, and efficiency = useful ÷ total in.
  - rung: 3
    name: first_step
    text:
      en: The total input each second is 170 + 30 = 200 J.
  - rung: 4
    name: worked_step
    text:
      en: Work out 170 ÷ 200 and write it as a percentage.
  - rung: 5
    name: full_step
    text:
      en: The efficiency is 85%.
