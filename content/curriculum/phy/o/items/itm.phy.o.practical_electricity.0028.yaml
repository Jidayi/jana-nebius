id: itm.phy.o.practical_electricity.0028
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.practical_electricity.energy_cost
stem: A 100 W television is switched on for 45 minutes.
parts:
- id: a
  prompt: Calculate the electrical energy it transfers, in joules.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 270000 J
      correct: true
    - id: B
      text: 4500 J
      correct: false
      misconception_id: mc.phy.o.elec_energy_time_not_in_seconds
      feedback: A joule is one watt for one second. Change the time into seconds before working out E = Pt in joules.
    - id: C
      text: 0.0370 J
      correct: false
      misconception_id: mc.phy.o.elec_energy_power_over_time
      feedback: 'Leaving a heater on for longer uses more energy, not less, so the energy grows with time: E = P × t.'
    - id: D
      text: 75 J
      correct: false
      misconception_id: mc.phy.o.elec_energy_minutes_divided_by_60
      feedback: 'There are more seconds than minutes in any time: 2 minutes is 120 seconds, so multiply by 60.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Power is the energy transferred each second.
  - rung: 2
    name: concept
    text:
      en: E = Pt gives joules when P is in watts and t is in seconds.
  - rung: 3
    name: first_step
    text:
      en: Change the time from minutes into seconds.
  - rung: 4
    name: worked_step
    text:
      en: The time is 2700 s; multiply by 100 W.
  - rung: 5
    name: full_step
    text:
      en: The energy transferred is 270000 J.
  misconception_ids:
  - mc.phy.o.elec_energy_minutes_divided_by_60
  - mc.phy.o.elec_energy_power_over_time
  - mc.phy.o.elec_energy_time_not_in_seconds
solution:
  steps:
  - n: 1
    latex: t = 45\ \text{min} = 2700\ \text{s}
    reason: Time in seconds
    check_id: chk_build_phy_pel_0028_ts
  - n: 2
    latex: E = Pt = 100 \times 2700 = 270000\ \text{J}
    reason: Energy is power times time
    check_id: chk_build_phy_pel_0028_ans
