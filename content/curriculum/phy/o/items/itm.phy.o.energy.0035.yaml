stem: A rock of mass 2 kg gains 147 J of gravitational potential energy when it is lifted. Take g = 9.8 N/kg.
parts:
- id: a
  prompt: Calculate the height it is lifted through.
  marks: 2
  answer:
    kind: numeric
    value: '7.5'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_nrg_0035_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You know the energy and the mass; the height is the unknown.
  - rung: 2
    name: concept
    text:
      en: Rearrange ΔEp = mgΔh to get Δh = ΔEp ÷ mg.
  - rung: 3
    name: first_step
    text:
      en: The weight mg is 2 × 9.8 = 19.6 N.
  - rung: 4
    name: worked_step
    text:
      en: Work out 147 ÷ 19.6.
  - rung: 5
    name: full_step
    text:
      en: It is lifted 7.5 m.
  misconception_ids:
  - mc.phy.o.energy_mass_for_weight
  - mc.phy.o.energy_formula_inverted
  - mc.phy.o.gpe_half_from_ke
solution:
  steps:
  - n: 1
    latex: mg = 2 \times 9.8 = 19.6\ \text{N}
    reason: The weight
    check_id: chk_build_phy_nrg_0035_wt
  - n: 2
    latex: \Delta h = \frac{\Delta E_p}{mg} = \frac{147}{19.6} = 7.5\ \text{m}
    reason: Rearrange ΔEp = mgΔh
    check_id: chk_build_phy_nrg_0035_ans
