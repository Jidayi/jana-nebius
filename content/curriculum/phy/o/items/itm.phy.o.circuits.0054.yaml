id: itm.phy.o.circuits.0054
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.potential_dividers
stem: A potential divider is made from a 1500 Ω resistor and a 1000 Ω resistor in series across a 5 V supply. The output is taken across the 1000 Ω resistor.
parts:
- id: a
  prompt: Calculate the output p.d. across the 1000 Ω resistor.
  marks: 2
  answer:
    kind: numeric
    value: '2'
    unit: V
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_cir_0054_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The two parts of the divider share the supply p.d. in the ratio of their resistances.
  - rung: 2
    name: concept
    text:
      en: Vout = V × (resistance across the output) ÷ (total resistance).
  - rung: 3
    name: first_step
    text:
      en: The total resistance is 1500 Ω + 1000 Ω.
  - rung: 4
    name: worked_step
    text:
      en: The total is 2500 Ω; find 1000/2500 of 5 V.
  - rung: 5
    name: full_step
    text:
      en: The output p.d. is 2 V.
  misconception_ids:
  - mc.phy.o.divider_wrong_resistor
  - mc.phy.o.divider_ratio_of_resistors
  - mc.phy.o.series_pd_shared_equally
solution:
  steps:
  - n: 1
    latex: R = 1500 + 1000 = 2500\ \Omega
    reason: Total resistance of the divider
    check_id: chk_build_phy_cir_0054_rt
  - n: 2
    latex: V_{\text{out}} = 5 \times \frac{1000}{2500} = 2\ \text{V}
    reason: The output's share is its fraction of the total resistance
    check_id: chk_build_phy_cir_0054_ans
