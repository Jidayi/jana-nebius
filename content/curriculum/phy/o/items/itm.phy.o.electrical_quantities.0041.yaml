stem: A lamp has a p.d. of 230 V across it, and 13.8 kJ of energy is transferred to it.
parts:
- id: a
  prompt: Calculate the charge that has passed through it.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 0.0167 C
      correct: false
      misconception_id: mc.phy.o.w_qv_upside_down
      feedback: 'The p.d. is the energy per coulomb, so V = W/Q: energy on top, charge underneath.'
    - id: B
      text: 60 C
      correct: true
    - id: C
      text: 3174000 C
      correct: false
      misconception_id: mc.phy.o.w_qv_multiplied
      feedback: 'If 12 J are shared among 4 C, each coulomb gets 3 J: divide the energy by the charge for the p.d.'
    - id: D
      text: 0.06 C
      correct: false
      misconception_id: mc.phy.o.kilo_prefix_ignored
      feedback: Kilo means a thousand. Change kJ, kΩ or kV into J, Ω or V before you use the formula.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Each coulomb that passes transfers the same energy.
  - rung: 2
    name: concept
    text:
      en: From W = Q V, the charge is Q = W ÷ V.
  - rung: 3
    name: first_step
    text:
      en: Change the energy into joules first.
  - rung: 4
    name: worked_step
    text:
      en: Divide 13800 J by 230 V.
  - rung: 5
    name: full_step
    text:
      en: Q = 13800 ÷ 230 = 60 C.
  misconception_ids:
