- kc.phy.o.measurement.measuring_techniques
stem: A micrometer screw gauge shows 12.5 mm on the main scale, and the thimble line is at division 18. Each thimble division is 0.01 mm and there is no zero error.
parts:
- id: a
  prompt: Find the diameter of the wire, in millimetres.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 14.3 mm
      correct: false
      misconception_id: mc.phy.o.thimble_read_as_tenths
      feedback: One full turn of the thimble moves the spindle half a millimetre and the thimble has fifty divisions, so each division is a hundredth of a millimetre.
    - id: B
      text: 12.5 mm
      correct: false
      misconception_id: mc.phy.o.main_scale_only
      feedback: The main scale gives the whole and half millimetres; the thimble adds the hundredths. Add both.
    - id: C
      text: 12.86 mm
      correct: false
      misconception_id: mc.phy.o.thimble_read_as_fiftieths
      feedback: Fifty divisions make one turn, but one turn moves the spindle only half a millimetre, so each division is a hundredth of a millimetre.
    - id: D
      text: 12.68 mm
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'A micrometer reading has two parts: the main scale and the thimble.'
  - rung: 2
    name: concept
    text:
      en: Each thimble division is a hundredth of a millimetre.
  - rung: 3
    name: first_step
    text:
      en: Turn 18 divisions into millimetres.
  - rung: 4
    name: worked_step
    text:
      en: 18 divisions are 0.18 mm; add this to the main scale.
  - rung: 5
    name: full_step
    text:
      en: The diameter is 12.68 mm.
  misconception_ids:
  - mc.phy.o.main_scale_only
  - mc.phy.o.thimble_read_as_fiftieths
  - mc.phy.o.thimble_read_as_tenths
solution:
  steps:
  - n: 1
    latex: 18 \times 0.01 = 0.18\ \text{mm}
    reason: Thimble divisions are hundredths
    check_id: chk_build_phy_mea_0059_t
  - n: 2
    latex: 12.5 + 0.18 = 12.68\ \text{mm}
    reason: Add the two scales
    check_id: chk_build_phy_mea_0059_ans
