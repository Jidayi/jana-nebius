stem: Houses in hot countries are often painted white.
parts:
- id: a
  prompt: Why does a white wall keep a house cooler?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: White surfaces absorb more radiation and store it
      correct: false
      misconception_id: mc.phy.o.shiny_surfaces_better_radiators
      feedback: Dull black surfaces are the best absorbers and the best emitters of infrared. Shiny, light surfaces reflect most of it and emit little.
    - id: B
      text: White surfaces give out cold radiation
      correct: false
      misconception_id: mc.phy.o.cold_transferred_as_substance
      feedback: Only energy moves, always from hotter to colder. An ice pack does not send cold into you; energy flows out of you into the ice.
    - id: C
      text: White surfaces reflect most of the radiation and absorb less
      correct: true
    - id: D
      text: White paint stops the air from carrying radiation to the walls
      correct: false
      misconception_id: mc.phy.o.radiation_needs_medium
      feedback: Energy from the Sun crosses millions of kilometres of empty space. Infrared is an electromagnetic wave and needs no material to travel through.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Infrared is an electromagnetic wave given out by every object; hotter objects give out more.
  - rung: 2
    name: concept
    text:
      en: The less radiation a wall absorbs, the less it warms up.
  - rung: 3
    name: first_step
    text:
      en: 'Compare the surfaces: dull black is the best absorber and emitter, shiny silver or white the worst.'
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that need a material for radiation to travel through, or treat cold as something that flows.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: White surfaces reflect most of the radiation and absorb less.'
  misconception_ids:
  - mc.phy.o.cold_transferred_as_substance
  - mc.phy.o.radiation_needs_medium
  - mc.phy.o.shiny_surfaces_better_radiators
solution:
