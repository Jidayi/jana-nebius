type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.circular_motion
stem: Two cars go round different roundabouts at the same speed. One roundabout is much smaller.
parts:
- id: a
  prompt: On which car is the force towards the centre bigger?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: The car on the larger roundabout
      correct: false
      misconception_id: mc.phy.o.centripetal_trend_reversed
      feedback: Take a tight bend fast on a bicycle and you need a lot of grip. Turning sharply or quickly needs a bigger inward force, and so does a bigger mass.
    - id: B
      text: Neither, because no force is needed at a steady speed
      correct: false
      misconception_id: mc.phy.o.circular_no_force_needed
      feedback: Speed stays the same but the direction changes all the time, so the velocity changes. A changing velocity needs a resultant force.
    - id: C
      text: Both feel an outward force of the same size
      correct: false
      misconception_id: mc.phy.o.circular_force_outwards
      feedback: 'Draw the circle and the velocity along it at two moments: the change in velocity points into the circle. The resultant force points towards the centre.'
    - id: D
      text: The car on the smaller roundabout
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about the velocity of the object, not just its speed.
  - rung: 2
    name: concept
    text:
      en: Going round a circle the direction of motion changes all the time, so the velocity changes.
  - rung: 3
    name: first_step
    text:
      en: A changing velocity needs a resultant force; think about which way the velocity is being turned.
  - rung: 4
    name: worked_step
    text:
      en: A tighter circle turns the direction of motion more sharply.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The car on the smaller roundabout. A smaller radius at the same speed needs a bigger force towards the centre.'
  misconception_ids:
  - mc.phy.o.centripetal_trend_reversed
  - mc.phy.o.circular_force_outwards
  - mc.phy.o.circular_no_force_needed
solution:
  steps:
  - n: 1
    latex: \text{The car on the smaller roundabout}
    reason: Think about the change in velocity
