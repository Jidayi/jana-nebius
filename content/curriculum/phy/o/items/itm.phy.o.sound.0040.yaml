id: itm.phy.o.sound.0040
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.sound.pitch_and_loudness
stem: Sound travels through air at 340 m/s.
parts:
- id: a
  prompt: Find the wavelength in centimetres of the highest-pitched sound that a young person with healthy hearing can hear.
  marks: 2
  answer:
    kind: numeric
    value: '1.7'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_snd_0040_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Recall the upper limit of human hearing.
  - rung: 2
    name: concept
    text:
      en: The upper limit is about 20000 Hz.
  - rung: 3
    name: first_step
    text:
      en: Use v = f × λ, so λ = v ÷ f.
  - rung: 4
    name: worked_step
    text:
      en: λ = 340 ÷ 20000 in metres; then change it into centimetres.
  - rung: 5
    name: full_step
    text:
      en: λ = 1.7 cm.
  misconception_ids:
  - mc.phy.o.hearing_limit_wrong
  - mc.phy.o.wave_equation_inverted
  - mc.phy.o.wave_equation_multiplied
solution:
  steps:
  - n: 1
    latex: f = 20000\ \text{Hz}
    reason: The upper limit of human hearing
    check_id: chk_build_phy_snd_0040_lim
  - n: 2
    latex: \lambda = \frac{v}{f} = \frac{340}{20000}\ \text{m} = 1.7\ \text{cm}
    reason: Rearrange v = fλ, then a metre is a hundred centimetres
    check_id: chk_build_phy_snd_0040_ans
