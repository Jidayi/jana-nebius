type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.light.refraction
stem: A beam of light hits a flat glass window at 50° to the normal.
parts:
- id: a
  prompt: Which statement about the beam inside the glass is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It slows down but keeps going in the same direction
      correct: false
      misconception_id: mc.phy.o.refraction_no_bending_at_angle
      feedback: When a beam meets a boundary at an angle, one side of it changes speed before the other, so the beam swings round. Only a ray along the normal goes straight on.
    - id: B
      text: It bends away from the normal and travels more slowly
      correct: false
      misconception_id: mc.phy.o.refraction_bends_wrong_way
      feedback: Light slows down in glass and swings towards the normal; it speeds up again in air and swings away. Picture a car whose first wheel hits sand and slows.
    - id: C
      text: It bends towards the normal and travels faster
      correct: false
      misconception_id: mc.phy.o.light_speed_times_index
      feedback: 'Nothing travels faster than light in a vacuum. A material slows light down, so divide c by the refractive index: the bigger n is, the slower the light.'
    - id: D
      text: It bends towards the normal and travels more slowly
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what happens to the speed of light at the boundary.
  - rung: 2
    name: concept
    text:
      en: Light slows down entering a denser material and bends towards the normal; it speeds up leaving and bends away.
  - rung: 3
    name: first_step
    text:
      en: A ray along the normal goes straight on; a ray at an angle bends because one side slows before the other.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these rules.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It bends towards the normal and travels more slowly.'
  misconception_ids:
  - mc.phy.o.light_speed_times_index
  - mc.phy.o.refraction_bends_wrong_way
  - mc.phy.o.refraction_no_bending_at_angle
