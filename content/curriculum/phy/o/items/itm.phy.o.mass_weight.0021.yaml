id: itm.phy.o.mass_weight.0021
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.mass_weight.mass_or_weight
stem: Nia floats inside a spacecraft in deep space, far from any planet or star.
parts:
- id: a
  prompt: Which statement about Nia is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: She has no mass, because nothing pulls on her
      correct: false
      misconception_id: mc.phy.o.no_mass_in_space
      feedback: An astronaut floating in a spacecraft is still hard to push and to stop, because all her mass is still there. Gravity gets weaker far from planets, but mass never disappears.
    - id: B
      text: She has the same mass as she had on Earth
      correct: true
    - id: C
      text: Her weight is the same as it was on Earth
      correct: false
      misconception_id: mc.phy.o.weight_same_on_every_planet
      feedback: Weight is the pull of a planet on the object, weight = mass × g. A world with a smaller g pulls less on the same mass.
    - id: D
      text: Her mass there is measured in newtons
      correct: false
      misconception_id: mc.phy.o.mass_weight_units_swapped
      feedback: Mass is measured in kilograms. Weight is a force, so it is measured in newtons. A label saying '2 kg' gives a mass.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide whether each option is about mass, weight, or both.
  - rung: 2
    name: concept
    text:
      en: Mass is the amount of matter in her body; nothing has been removed.
  - rung: 3
    name: first_step
    text:
      en: Test each option against the difference between the amount of matter and the pull of gravity.
  - rung: 4
    name: worked_step
    text:
      en: Rule out every option that mixes up the two quantities.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: She has the same mass as she had on Earth.'
  misconception_ids:
  - mc.phy.o.mass_weight_units_swapped
  - mc.phy.o.no_mass_in_space
  - mc.phy.o.weight_same_on_every_planet
solution:
  steps:
  - n: 1
    latex: \text{She has the same mass as she had on Earth}
    reason: Mass stays the same; weight depends on g
