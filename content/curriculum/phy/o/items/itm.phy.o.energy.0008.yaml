id: itm.phy.o.energy.0008
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.stores_and_transfers
stem: A book rests on a high shelf.
parts:
- id: a
  prompt: Which statement about the book is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It has energy in its gravitational potential store
      correct: true
    - id: B
      text: It has no energy because it is not moving
      correct: false
      misconception_id: mc.phy.o.stationary_has_no_energy
      feedback: A book on a high shelf is still, but if it falls it speeds up. The energy was already there, in its gravitational store.
    - id: C
      text: Its energy is in a kinetic store, waiting to be used
      correct: false
      misconception_id: mc.phy.o.stores_before_after_swapped
      feedback: Ask where the energy is before and after. Climbing fills the gravitational store and empties the chemical store of the muscles.
    - id: D
      text: It holds energy as a force pressing on the shelf
      correct: false
      misconception_id: mc.phy.o.energy_force_confused
      feedback: A force is a push or a pull in newtons. Energy is measured in joules, and a force only transfers energy when it moves something along its direction.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide where the energy is at the start and where it ends up.
  - rung: 2
    name: concept
    text:
      en: If the book fell, it would speed up. Where would that energy come from?
  - rung: 3
    name: first_step
    text:
      en: Energy is never made or destroyed; it only moves from store to store.
  - rung: 4
    name: worked_step
    text:
      en: Rule out each option that breaks one of these ideas.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It has energy in its gravitational potential store.'
  misconception_ids:
  - mc.phy.o.energy_force_confused
  - mc.phy.o.stationary_has_no_energy
  - mc.phy.o.stores_before_after_swapped
solution:
  steps:
  - n: 1
    latex: \text{It has energy in its gravitational potential store}
    reason: Follow the energy from store to store
