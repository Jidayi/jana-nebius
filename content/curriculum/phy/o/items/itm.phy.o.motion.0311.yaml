id: itm.phy.o.motion.0311
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.motion.choose_equation
stem: A car starting at 5 m/s accelerates at 2.5 m/s² for 5 s.
parts:
- id: a
  prompt: Which equation should be used to find the final velocity?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: s = ut + ½at²
      correct: false
      misconception_id: mc.phy.o.equation_without_the_unknown
      feedback: List s, u, v, a and t, tick the three you know and circle the one you want. The right equation has all four and leaves out the fifth.
    - id: B
      text: v² = u² + 2as
      correct: false
      misconception_id: mc.phy.o.equation_missing_known
      feedback: Check that every quantity in your equation is either given or the one you want.
    - id: C
      text: s = ½(u + v)t
      correct: false
      misconception_id: mc.phy.o.equation_with_unknown_time
      feedback: Cross out the quantity you do not know and do not need, then pick the equation without it.
    - id: D
      text: v = u + at
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Write down s, u, v, a and t.
  - rung: 2
    name: concept
    text:
      en: Tick the three quantities the question gives and circle the one it asks for.
  - rung: 3
    name: first_step
    text:
      en: One of the five quantities, the distance, is neither given nor asked for.
  - rung: 4
    name: worked_step
    text:
      en: Choose the equation that does not contain the distance.
  - rung: 5
    name: full_step
    text:
      en: The equation is v = u + at.
  misconception_ids:
  - mc.phy.o.equation_missing_known
  - mc.phy.o.equation_with_unknown_time
  - mc.phy.o.equation_without_the_unknown
solution:
  steps:
  - n: 1
    latex: '\text{known: a, t, u; wanted: v; not needed: s}'
    reason: List what is given and what is asked for
