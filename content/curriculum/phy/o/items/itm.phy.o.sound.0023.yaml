- kc.phy.o.sound.speed_and_echoes
stem: At a sports ground, Esi stands 600 m from a starter. Esi sees the starter bang two wooden blocks together and hears the bang 1.82 s later.
parts:
- id: a
  prompt: Calculate the speed of sound. The light arrives almost at once.
  marks: 1
  answer:
    kind: numeric
    value: '330'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_snd_0023_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The blocks are seen to meet almost at once, so the time is how long the sound takes.
  - rung: 2
    name: concept
    text:
      en: 'The bang travels straight from the blocks to the listener: there is no echo.'
  - rung: 3
    name: first_step
    text:
      en: Speed = distance ÷ time.
  - rung: 4
    name: worked_step
    text:
      en: Work out 600 ÷ 1.82.
  - rung: 5
    name: full_step
    text:
      en: v = 330 m/s.
  misconception_ids:
  - mc.phy.o.direct_sound_factor_two
  - mc.phy.o.time_over_distance
  - mc.phy.o.speed_as_distance_times_time
solution:
  steps:
  - n: 1
    latex: v = \frac{d}{t} = \frac{600}{1.82} = 330\ \text{m/s}
    reason: The sound travels the distance once
    check_id: chk_build_phy_snd_0023_ans
