stem: Tunde connects three identical lamps in series with a battery. All of them light.
parts:
- id: a
  prompt: How does the brightness of the lamp nearest the battery's positive terminal compare with the others?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It is the brightest, because it gets the current first
      correct: false
      misconception_id: mc.phy.o.series_current_used_up
      feedback: 'Charge is not used up: the same charge flows all the way round. In a series circuit the current is the same at every point; it is energy that the components transfer.'
    - id: B
      text: All the lamps are equally bright
      correct: true
    - id: C
      text: It is the dimmest, because the electrons reach it last, after the other lamps have used some
