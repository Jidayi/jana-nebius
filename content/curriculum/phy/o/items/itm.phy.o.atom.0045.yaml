stem: Alpha particles were fired at a very thin sheet of gold foil in a vacuum.
parts:
- id: a
  prompt: What happened to most of the alpha particles?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: They bounced back towards the source
      correct: false
      misconception_id: mc.phy.o.scattering_most_bounced_back
      feedback: Nearly all the alpha particles went straight through. Only about one in several thousand came back, which is why the result was so surprising.
    - id: B
      text: They passed straight through with little or no deflection
      correct: true
    - id: C
      text: They were stopped by the electrons in the gold atoms
      correct: false
      misconception_id: mc.phy.o.deflection_by_electrons
      feedback: 'An electron has less than a seven-thousandth of an alpha particle''s mass: like a table-tennis ball in the path of a bowling ball. Only something massive and highly charged could turn an alpha particle back.'
    - id: D
      text: They were pulled in towards the gold nuclei and stuck
      correct: false
      misconception_id: mc.phy.o.nucleus_negative
      feedback: The alpha particles were pushed away and some were turned right back. Like charges repel, so the nucleus must be positive.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Recall the three things that happened to alpha particles fired at thin gold foil.
  - rung: 2
    name: concept
    text:
      en: Most went straight through, a few were deflected a little, and a very few were turned back.
  - rung: 3
    name: first_step
    text:
      en: The surprise was how rarely anything happened to them.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that contradict what was seen.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: They passed straight through with little or no deflection.'
  misconception_ids:
  - mc.phy.o.deflection_by_electrons
  - mc.phy.o.nucleus_negative
  - mc.phy.o.scattering_most_bounced_back
