stem: Airport security scans the inside of suitcases without opening them.
parts:
- id: a
  prompt: Which radiation is used?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Gamma rays
      correct: false
      misconception_id: mc.phy.o.xray_gamma_uses_swapped
      feedback: X-rays make shadow pictures of bones and luggage. Gamma rays kill cancer cells and sterilise equipment.
    - id: B
      text: Ultraviolet
      correct: false
      misconception_id: mc.phy.o.penetration_order_confused
      feedback: Your skin stops visible light and ultraviolet; that is why you cannot see your bones. Only X-rays and gamma rays pass through soft tissue.
    - id: C
      text: X-rays
      correct: true
    - id: D
      text: Infrared
      correct: false
      misconception_id: mc.phy.o.penetration_order_confused
      feedback: Your skin stops visible light and ultraviolet; that is why you cannot see your bones. Only X-rays and gamma rays pass through soft tissue.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what each region does when it meets matter.
  - rung: 2
    name: concept
    text:
      en: Long-wavelength regions mostly carry signals or heat things; short-wavelength regions pass through soft tissue or damage cells.
  - rung: 3
    name: first_step
    text:
      en: Only the highest-frequency regions are ionising, and danger rises with frequency.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that give a region a property it does not have.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: X-rays.'
  misconception_ids:
  - mc.phy.o.penetration_order_confused
  - mc.phy.o.xray_gamma_uses_swapped
solution:
  steps:
