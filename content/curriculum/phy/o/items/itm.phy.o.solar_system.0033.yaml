    check_id: chk_build_phy_sol_0033_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Light crosses the Solar System at a fixed speed.
  - rung: 2
    name: concept
    text:
      en: Time = distance ÷ speed, with the distance in metres.
  - rung: 3
    name: first_step
    text:
      en: Change 2.28 × 10⁸ km into metres first.
  - rung: 4
    name: worked_step
    text:
      en: The light takes 760 s; change this into minutes.
  - rung: 5
    name: full_step
    text:
      en: Sunlight takes 12.7 minutes to reach Mars.
  misconception_ids:
