solution:
  steps:
  - n: 1
    latex: d = 2.28 \times 10^{11}\ \text{m}
    reason: Kilometres to metres
  - n: 2
    latex: t = \frac{2.28 \times 10^{11}}{3.0 \times 10^{8}} = 760\ \text{s}
    reason: Time = distance / speed
    check_id: chk_build_phy_sol_0033_ts
  - n: 3
    latex: t = 760\ \text{s} = 12.7\ \text{min}
    reason: Seconds to minutes
    check_id: chk_build_phy_sol_0033_ans
