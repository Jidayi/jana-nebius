stem: Mars is 2.28 × 10⁸ km from the Sun. Light travels at 3.0 × 10⁸ m/s.
parts:
- id: a
  prompt: How long does light from the Sun take to reach Mars, in minutes?
  marks: 2
  answer:
    kind: numeric
    value: '12.7'
    unit: min
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
