id: itm.phy.o.oscilloscope.0011
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.oscilloscope.time_base
stem: An oscilloscope's time-base is set to 0.5 ms/div. On the trace, 3 complete waves fill 6 divisions.
parts:
- id: a
  prompt: Calculate the frequency of the signal.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 1 Hz
      correct: false
      misconception_id: mc.phy.o.osc_ms_read_as_s
      feedback: f = 1/T gives hertz only when T is in seconds. Change milliseconds into seconds first.
    - id: B
      text: 333 Hz
      correct: false
      misconception_id: mc.phy.o.osc_waves_not_divided
      feedback: The period is the time for one complete wave. If three waves take the time measured, divide it by three.
    - id: C
      text: 250 Hz
      correct: false
      misconception_id: mc.phy.o.osc_timebase_divided
      feedback: The time-base says how much time each division stands for, so time = divisions × time per division.
    - id: D
      text: 1000 Hz
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'First find the period: the time for one complete wave.'
  - rung: 2
    name: concept
    text:
      en: Period = divisions for one wave × time-base; then f = 1/T with T in seconds.
  - rung: 3
    name: first_step
    text:
      en: Find how many divisions one complete wave takes and multiply by 0.5 ms.
  - rung: 4
    name: worked_step
    text:
      en: The period is 1 ms, which is 0.001 s; now work out 1 ÷ T.
  - rung: 5
    name: full_step
    text:
      en: The frequency is 1000 Hz.
  misconception_ids:
  - mc.phy.o.osc_ms_read_as_s
  - mc.phy.o.osc_timebase_divided
  - mc.phy.o.osc_waves_not_divided
solution:
  steps:
  - n: 1
    latex: T = \frac{6 \times 0.5}{3} = 1\ \text{ms}
    reason: The time for all the waves shared between them
    check_id: chk_build_phy_osc_0011_tm
  - n: 2
    latex: T = 1\ \text{ms} = 0.001\ \text{s}
    reason: Period in seconds
    check_id: chk_build_phy_osc_0011_ts
  - n: 3
    latex: f = \frac{1}{T} = \frac{1}{0.001} = 1000\ \text{Hz}
    reason: Frequency is one over the period
    check_id: chk_build_phy_osc_0011_ans
difficulty:
  prior: 0.4
  band: core
estimated_seconds: 90
exam_style:
  paper_style: objective
  total_marks: 1
  calculator: true
