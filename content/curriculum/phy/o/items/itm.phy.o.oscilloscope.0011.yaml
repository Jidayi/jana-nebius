    args:
      expression: 1000/(6*0.5/3)
    tool: math_evaluate
  chk_build_phy_osc_0011_tm:
    args:
      expression: 6*0.5/3
    tool: math_evaluate
  chk_build_phy_osc_0011_ts:
    args:
      quantity: 1 ms
      to: s
    tool: units_convert
