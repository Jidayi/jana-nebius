stem: A cyclist with her bicycle, of total mass 85 kg, speeds up from 7 m/s to 9 m/s.
parts:
- id: a
  prompt: Calculate the increase in kinetic energy.
  marks: 3
  answer:
    kind: numeric
    value: '1360'
    unit: J
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_nrg_0020_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the kinetic energy at each speed.
  - rung: 2
    name: concept
    text:
      en: Use Ek = ½mv² twice, then subtract.
  - rung: 3
    name: first_step
    text:
      en: At 7 m/s, Ek = 2082.5 J.
  - rung: 4
    name: worked_step
    text:
      en: At 9 m/s, Ek = 3442.5 J; now subtract.
  - rung: 5
    name: full_step
    text:
      en: The increase is 1360 J.
  misconception_ids:
  - mc.phy.o.ke_change_from_speed_difference
  - mc.phy.o.ke_half_omitted
  - mc.phy.o.ke_final_not_change
solution:
  steps:
  - n: 1
    latex: E_1 = \frac{1}{2} \times 85 \times 7^2 = 2082.5\ \text{J}
    reason: Kinetic energy before
    check_id: chk_build_phy_nrg_0020_e1
  - n: 2
    latex: E_2 = \frac{1}{2} \times 85 \times 9^2 = 3442.5\ \text{J}
    reason: Kinetic energy after
    check_id: chk_build_phy_nrg_0020_e2
  - n: 3
    latex: E_2 - E_1 = 3442.5 - 2082.5 = 1360\ \text{J}
    reason: Increase = after − before
    check_id: chk_build_phy_nrg_0020_ans
