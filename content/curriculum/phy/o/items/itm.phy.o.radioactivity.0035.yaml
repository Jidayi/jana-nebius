id: itm.phy.o.radioactivity.0035
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.half_life
stem: A counter near a sample of strontium-90 (half-life 29 years) reads 510 counts/min. The background count rate is 30 counts/min.
parts:
- id: a
  prompt: What will the counter read 87 years later?
  marks: 3
  answer:
    kind: numeric
    value: '90'
    unit: counts/min
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_rad_0035_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The background does not come from the sample, so it does not halve.
  - rung: 2
    name: concept
    text:
      en: Take the background off first, then use the half-life.
  - rung: 3
    name: first_step
    text:
      en: Halve the corrected count rate once for each half-life, then add the background back.
  - rung: 4
    name: worked_step
    text:
      en: The source alone gives 480 counts/min now, and 3 half-lives pass.
  - rung: 5
    name: full_step
    text:
      en: The counter will read 90 counts/min.
  misconception_ids:
  - mc.phy.o.background_halved_too
  - mc.phy.o.background_not_added_back
  - mc.phy.o.half_life_halved_once
solution:
  steps:
  - n: 1
    latex: 510 - 30 = 480
    reason: Count rate from the source alone
    check_id: chk_build_phy_rad_0035_c
  - n: 2
    latex: \frac{87}{29} = 3\ \text{half-lives}
    reason: Time ÷ half-life
    check_id: chk_build_phy_rad_0035_n
  - n: 3
    latex: \frac{480}{2^{3}} = 60
    reason: Only the source's count rate halves
    check_id: chk_build_phy_rad_0035_c1
  - n: 4
    latex: 60 + 30 = 90\ \text{counts/min}
    reason: The counter still picks up background
    check_id: chk_build_phy_rad_0035_ans
difficulty:
  prior: 0.6
  band: stretch
estimated_seconds: 100
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
