stem: A drummer hits the same drum much harder than before.
parts:
- id: a
  prompt: What happens to the sound?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It is higher, because the drum skin vibrates with a larger amplitude
      correct: false
      misconception_id: mc.phy.o.pitch_from_amplitude
      feedback: Strike a drum harder and it sounds louder but the note does not rise. Pitch depends only on frequency.
    - id: B
      text: It is louder, because the drum skin vibrates at a higher frequency
      correct: false
      misconception_id: mc.phy.o.loudness_from_frequency
      feedback: A quiet whistle can be high and a loud drum low. Loudness depends on the amplitude; frequency sets the pitch.
    - id: C
      text: It is higher and louder, because the skin vibrates more times each second
      correct: false
      misconception_id: mc.phy.o.loudness_from_frequency
      feedback: A quiet whistle can be high and a loud drum low. Loudness depends on the amplitude; frequency sets the pitch.
    - id: D
      text: It is louder, because the drum skin vibrates with a larger amplitude
      correct: true
  show_working: false
  hints:
