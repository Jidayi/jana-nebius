id: itm.phy.o.pressure.0021
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.liquid_pressure
stem: At a depth of 50 cm in a tank of glycerine, the pressure due to the liquid is 6300 Pa. Take g = 10 N/kg.
parts:
- id: a
  prompt: Calculate the density of the glycerine.
  marks: 2
  answer:
    kind: numeric
    value: '1260'
    unit: kg/m^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_prs_0021_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Pressure due to a liquid = density × g × depth.
  - rung: 2
    name: concept
    text:
      en: So density = pressure ÷ (g × depth).
  - rung: 3
    name: first_step
    text:
      en: Change 50 cm into metres first.
  - rung: 4
    name: worked_step
    text:
      en: Divide 6300 by 10 × 0.5.
  - rung: 5
    name: full_step
    text:
      en: The density of the glycerine is 1260 kg/m³.
  misconception_ids:
  - mc.phy.o.liquid_pressure_g_left_out
  - mc.phy.o.liquid_depth_cm_not_converted
  - mc.phy.o.pressure_rearranged_wrongly
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: h = 50\ \text{cm} = 0.5\ \text{m}
    reason: Depth in metres
    check_id: chk_build_phy_prs_0021_hm
  - n: 2
    latex: \rho = \frac{p}{gh} = \frac{6300}{10 \times 0.5} = 1260\ \text{kg/m}^3
    reason: Rearrange p = ρgh
    check_id: chk_build_phy_prs_0021_ans
