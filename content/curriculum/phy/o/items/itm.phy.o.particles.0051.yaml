id: itm.phy.o.particles.0051
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.particles.pressure_and_volume
stem: 'A student traps air in a syringe and records: 240 kPa with a volume of 20 cm³, and then 150 kPa at the same temperature.'
parts:
- id: a
  prompt: What volume should the student record at 150 kPa?
  marks: 2
  answer:
    kind: numeric
    value: '32'
    unit: cm^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_ptc_0051_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The mass and temperature of the gas stay the same, so pressure × volume stays constant.
  - rung: 2
    name: concept
    text:
      en: Use p₁V₁ = p₂V₂ and rearrange for V₂.
  - rung: 3
    name: first_step
    text:
      en: Work out p₁V₁ = 240 × 20 first.
  - rung: 4
    name: worked_step
    text:
      en: Divide 4800 by 150.
  - rung: 5
    name: full_step
    text:
      en: The new volume is 32 cm³.
  misconception_ids:
  - mc.phy.o.boyle_direct_proportion
  - mc.phy.o.gas_pressure_unchanged
  - mc.phy.o.boyle_ratio_only
solution:
  steps:
  - n: 1
    latex: p_1V_1 = p_2V_2
    reason: 'Boyle''s law: fixed mass at constant temperature'
  - n: 2
    latex: p_1V_1 = 240 \times 20 = 4800
    reason: pV before the change
    check_id: chk_build_phy_ptc_0051_k
  - n: 3
    latex: V_2 = \frac{4800}{150} = 32\ \text{cm}^3
    reason: Divide by the new pressure
    check_id: chk_build_phy_ptc_0051_ans
