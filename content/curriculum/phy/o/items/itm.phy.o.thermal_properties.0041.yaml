stem: The specific latent heat of fusion of ice is 334 kJ/kg, and the specific latent heat of vaporisation of water is 2260 kJ/kg.
parts:
- id: a
  prompt: How much energy is needed to boil away 40 g of water already at 100 °C? Give your answer in kJ.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 13.36 kJ
      correct: false
      misconception_id: mc.phy.o.latent_wrong_kind
      feedback: Fusion is for melting or freezing; vaporisation is for boiling or condensing. Check which change of state the question describes.
    - id: B
      text: 90.4 kJ
      correct: true
    - id: C
      text: 90400 kJ
      correct: false
      misconception_id: mc.phy.o.thermal_grams_as_kg
      feedback: 'Specific heat capacity and specific latent heat are per kilogram. Change grams to kilograms first: 250 g is 0.25 kg.'
    - id: D
      text: 56500 kJ
      correct: false
      misconception_id: mc.phy.o.latent_divided_by_mass
      feedback: 'More ice needs more energy to melt, so the energy must grow with the mass: E = mL. Dividing would make a bigger block need less energy.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The temperature does not change, so all the energy goes into changing the state.
  - rung: 2
    name: concept
    text:
      en: Boiling uses the specific latent heat of vaporisation.
  - rung: 3
    name: first_step
    text:
      en: 'Use E = mL with the mass in kilograms: change 40 g to kg.'
  - rung: 4
    name: worked_step
    text:
      en: Multiply 0.04 kg by 2260 kJ/kg.
  - rung: 5
    name: full_step
    text:
      en: E = 90.4 kJ.
  misconception_ids:
  - mc.phy.o.latent_divided_by_mass
  - mc.phy.o.latent_wrong_kind
  - mc.phy.o.thermal_grams_as_kg
solution:
