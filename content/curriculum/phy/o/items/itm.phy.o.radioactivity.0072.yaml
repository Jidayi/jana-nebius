id: itm.phy.o.radioactivity.0072
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.uses_and_safety
stem: An alpha source is dangerous if it is swallowed or breathed in.
parts:
- id: a
  prompt: Why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: All its radiation is absorbed in nearby cells, which it ionises strongly
      correct: true
    - id: B
      text: It is not dangerous, because alpha is stopped by paper
      correct: false
      misconception_id: mc.phy.o.alpha_always_harmless
      feedback: Outside the body alpha is stopped by dead skin. Inside the body it deposits all its energy in living cells, making it the most harmful radiation.
    - id: C
      text: It makes the whole body radioactive
      correct: false
      misconception_id: mc.phy.o.irradiated_becomes_radioactive
      feedback: Standing in sunlight does not make you glow. Being exposed to gamma rays does not add any radioactive material, so the object does not become a source.
    - id: D
      text: Its radiation passes right through the body
      correct: false
      misconception_id: mc.phy.o.penetration_order_wrong
      feedback: Paper stops alpha; a few millimetres of aluminium stop beta; gamma is only reduced by thick lead or concrete.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about how radiation can harm people and how the dose can be kept low.
  - rung: 2
    name: concept
    text:
      en: A source keeps decaying whatever we do; distance, short times and thick shielding cut the dose, and being exposed to radiation does not make anything radioactive.
  - rung: 3
    name: first_step
    text:
      en: Alpha gives up all its energy within a very short distance.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that would leave people exposed or that rest on a false idea about radiation.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: All its radiation is absorbed in nearby cells, which it ionises strongly.'
  misconception_ids:
  - mc.phy.o.alpha_always_harmless
  - mc.phy.o.irradiated_becomes_radioactive
  - mc.phy.o.penetration_order_wrong
