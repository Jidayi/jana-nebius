stem: The velocity-time graph for a bus is a straight line from (0 s, 6 m/s) to (4 s, 18 m/s).
parts:
- id: a
  prompt: Find the distance travelled in this time.
  marks: 2
  answer:
    kind: numeric
    value: '48.0'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0106_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The area under a velocity-time graph gives the distance travelled. What shape is the area here?
  - rung: 2
    name: concept
    text:
      en: 'The area is a trapezium: area = ½ × (sum of the parallel sides) × width.'
  - rung: 3
    name: first_step
    text:
      en: The parallel sides are the two velocities; the width is the time.
  - rung: 4
    name: worked_step
    text:
      en: Distance = ½ × (6 + 18) × 4.
  - rung: 5
    name: full_step
    text:
      en: Distance = ½ × (6 + 18) × 4 = 48.0 m.
  misconception_ids:
  - mc.phy.o.triangle_area_without_half
solution:
  steps:
  - n: 1
    latex: d = \tfrac{1}{2}(u + v) t
    reason: The area under the line is a trapezium
  - n: 2
    latex: d = \tfrac{1}{2}(6 + 18) \times 4
    reason: Substitute
  - n: 3
    latex: d = 48.0\ \text{m}
    reason: Evaluate
    check_id: chk_build_phy_k_0106_a
