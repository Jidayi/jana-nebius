id: itm.phy.o.momentum.0035
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.momentum.impulse
stem: A football of mass 0.45 kg hits a wall at 15 m/s and bounces straight back at 4 m/s. It is in contact with the wall for 0.02 s.
parts:
- id: a
  prompt: Find the average force of the wall on the ball.
  marks: 3
  answer:
    kind: numeric
    value: '428'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_mom_0035_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Force × time = change in momentum.
  - rung: 2
    name: concept
    text:
      en: The ball's direction reverses, so take one direction as positive and give each velocity a sign.
  - rung: 3
    name: first_step
    text:
      en: The velocity changes from −15 m/s to +4 m/s, so the change is the two speeds added.
  - rung: 4
    name: worked_step
    text:
      en: The change in momentum is 8.55 kg m/s.
  - rung: 5
    name: full_step
    text:
      en: F = 8.55 ÷ 0.02 = 428 N.
  misconception_ids:
  - mc.phy.o.rebound_change_subtracted
  - mc.phy.o.impulse_initial_momentum_only
  - mc.phy.o.impulse_time_multiplied
solution:
  steps:
  - n: 1
    latex: \Delta p = 0.45 \times (4 - (-\,15)) = 8.55\ \text{kg m/s}
    reason: 'Away from the wall positive: the velocity reverses'
    check_id: chk_build_phy_mom_0035_dp
  - n: 2
    latex: F = \frac{8.55}{0.02} = 428\ \text{N}
    reason: Force = change in momentum ÷ time
    check_id: chk_build_phy_mom_0035_ans
