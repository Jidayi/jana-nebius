id: itm.phy.o.pressure.0011
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.pressure_on_surfaces
stem: A camel walks easily on soft sand, where a horse of the same weight sinks in.
parts:
- id: a
  prompt: What helps the camel?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Its wide feet make it lighter
      correct: false
      misconception_id: mc.phy.o.pressure_area_changes_force
      feedback: Turning a brick onto its end does not change how much it weighs. The force stays the same; only the area, and so the pressure, changes.
    - id: B
      text: Its wide feet give a larger pressure, which packs the sand down
      correct: false
      misconception_id: mc.phy.o.larger_area_larger_pressure
      feedback: Snowshoes stop you sinking because they spread your weight over a big area. For the same force, the bigger the area the smaller the pressure.
    - id: C
      text: 'Nothing to do with its feet: animals of equal weight press equally'
      correct: false
      misconception_id: mc.phy.o.pressure_depends_on_force_only
      feedback: 'Push a drawing pin into a board: the force on the point and on the head is the same, yet the point goes into the wood and the head does not hurt your thumb. Different areas give different pressures.'
    - id: D
      text: Its wide feet give a larger area, so the pressure on the sand is smaller
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Pressure depends on the force and on the area it is spread over.
  - rung: 2
    name: concept
    text:
      en: Both animals push down with the same weight.
  - rung: 3
    name: first_step
    text:
      en: For the same force, a smaller area gives a greater pressure.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that change the force when only the area changes.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Its wide feet give a larger area, so the pressure on the sand is smaller.'
  misconception_ids:
  - mc.phy.o.larger_area_larger_pressure
  - mc.phy.o.pressure_area_changes_force
  - mc.phy.o.pressure_depends_on_force_only
solution:
  steps:
  - n: 1
    latex: \text{Its wide feet give a larger area, so the pressure on the sand is smaller}
    reason: Same force, smaller area, greater pressure
