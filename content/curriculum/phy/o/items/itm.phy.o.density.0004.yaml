stem: A gold ring has a mass of 9.65 g. The density of the material is 19.3 g/cm³.
parts:
- id: a
  prompt: Calculate its volume.
  marks: 1
  answer:
    kind: numeric
    value: '0.5'
    unit: cm^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_den_0004_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Each cubic centimetre of the material has the same mass.
  - rung: 2
    name: concept
    text:
      en: Rearrange density = mass ÷ volume to make volume the subject.
  - rung: 3
    name: first_step
    text:
      en: Volume = mass ÷ density.
  - rung: 4
    name: worked_step
    text:
      en: Work out 9.65 ÷ 19.3.
  - rung: 5
    name: full_step
    text:
      en: The volume is 0.5 cm³.
  misconception_ids:
  - mc.phy.o.density_volume_over_mass
  - mc.phy.o.density_rearranged_wrongly
solution:
  steps:
  - n: 1
    latex: V = \frac{m}{\rho} = \frac{9.65}{19.3} = 0.5\ \text{cm}^3
    reason: Volume = mass ÷ density
    check_id: chk_build_phy_den_0004_ans
