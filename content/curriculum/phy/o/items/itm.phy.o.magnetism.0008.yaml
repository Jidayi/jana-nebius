stem: The north pole of one magnet is held near the south pole of another.
parts:
- id: a
  prompt: What do the two magnets do?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: They pull towards each other
      correct: true
    - id: B
      text: They push each other apart
      correct: false
      misconception_id: mc.phy.o.like_poles_attract
      feedback: 'Like poles repel and unlike poles attract: two north poles push apart, a north and a south pull together.'
    - id: C
      text: Nothing, unless the poles are touching
      correct: false
      misconception_id: mc.phy.o.magnetic_force_needs_contact
      feedback: A compass needle swings when a magnet is still a hand's width away. Magnetic forces act at a distance.
    - id: D
      text: Nothing, because only a magnet and a piece of iron can attract
      correct: false
      misconception_id: mc.phy.o.unmagnetised_iron_unaffected
      feedback: A magnet picks up ordinary steel paper clips. It first induces magnetism in them, and then attracts them.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Recall the two rules: how poles act on each other, and which materials are magnetic.'
  - rung: 2
    name: concept
    text:
      en: Like poles repel and unlike poles attract. Only a few metals are magnetic, and magnetic materials differ in how easily they gain and lose their magnetism.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Unlike poles attract each other.
  - rung: 5
    name: full_step
    text:
      en: They pull towards each other. Unlike poles attract each other.
  misconception_ids:
  - mc.phy.o.like_poles_attract
  - mc.phy.o.magnetic_force_needs_contact
  - mc.phy.o.unmagnetised_iron_unaffected
solution:
  steps:
  - n: 1
    latex: \text{They pull towards each other}
    reason: Apply the rules for poles and magnetic materials
