id: itm.phy.o.energy.0119
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.energy_resources
stem: Energy resources can be renewable or non-renewable.
parts:
- id: a
  prompt: What makes an energy resource renewable?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It gives out no pollution
      correct: false
      misconception_id: mc.phy.o.renewable_means_clean
      feedback: A dam is renewable but floods valleys, and wind farms change the landscape. Renewable is about being replaced, not about having no effects.
    - id: B
      text: Its fuel can be collected and burned again
      correct: false
      misconception_id: mc.phy.o.renewable_means_reusable
      feedback: No fuel can be burned twice. Renewable means nature replaces the resource, like new crops or more wind.
    - id: C
      text: There is a very large amount of it left
      correct: false
      misconception_id: mc.phy.o.plentiful_seen_as_renewable
      feedback: Coal takes millions of years to form, so once burned it is gone for any useful time. A renewable resource is replaced as fast as we use it.
    - id: D
      text: It is replaced naturally as fast as we use it
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Read each option and decide whether it is really true for this resource.
  - rung: 2
    name: concept
    text:
      en: Think about what happens to the supply over a human lifetime.
  - rung: 3
    name: first_step
    text:
      en: Renewable means replaced as fast as we use it; reliable means there when we need it. Neither tells you the cost or the effects on the environment.
  - rung: 4
    name: worked_step
    text:
      en: Rule out each option that mixes these ideas up or gets the original source of the energy wrong.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It is replaced naturally as fast as we use it.'
  misconception_ids:
  - mc.phy.o.plentiful_seen_as_renewable
  - mc.phy.o.renewable_means_clean
  - mc.phy.o.renewable_means_reusable
solution:
  steps:
  - n: 1
    latex: \text{It is replaced naturally as fast as we use it}
    reason: Compare renewability, reliability, cost and effects
