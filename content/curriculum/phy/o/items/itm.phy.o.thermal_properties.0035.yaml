id: itm.phy.o.thermal_properties.0035
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.latent_heat
stem: A 1.5 kW kettle contains water already boiling at 100 °C. The specific latent heat of vaporisation of water is 2260 kJ/kg.
parts:
- id: a
  prompt: How long does it take to boil away 0.3 kg of the water? Assume all the energy goes into the water.
  marks: 2
  answer:
    kind: numeric
    value: '452'
    unit: s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_thp_0035_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The water is already at 100 °C, so the energy only changes its state.
  - rung: 2
    name: concept
    text:
      en: Find the energy with E = mL, then the time with t = E ÷ P.
  - rung: 3
    name: first_step
    text:
      en: Multiply 0.3 kg by 2260 kJ/kg.
  - rung: 4
    name: worked_step
    text:
      en: Divide 678 kJ by 1.5 kW.
  - rung: 5
    name: full_step
    text:
      en: It takes 452 s.
solution:
  steps:
  - n: 1
    latex: E = mL = 0.3 \times 2260 = 678\ \text{kJ}
    reason: Energy to boil the water away
    check_id: chk_build_phy_thp_0035_e
  - n: 2
    latex: t = \frac{E}{P} = \frac{678}{1.5} = 452\ \text{s}
    reason: kJ ÷ kW gives seconds
    check_id: chk_build_phy_thp_0035_ans
