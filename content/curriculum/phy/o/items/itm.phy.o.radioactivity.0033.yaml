id: itm.phy.o.radioactivity.0033
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.half_life
stem: The half-life of iodine-131 is 8 days. A sample has an activity of 240 MBq.
parts:
- id: a
  prompt: How long will it take for the activity to fall to 60 MBq?
  marks: 2
  answer:
    kind: numeric
    value: '16'
    unit: days
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_rad_0033_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Each half-life halves the activity.
  - rung: 2
    name: concept
    text:
      en: Count how many times you must halve 240 to reach 60.
  - rung: 3
    name: first_step
    text:
      en: The activity must fall to 1/4 of its start; count the halvings, not the ratio.
  - rung: 4
    name: worked_step
    text:
      en: That takes 2 half-lives of 8 days each.
  - rung: 5
    name: full_step
    text:
      en: It takes 16 days.
  misconception_ids:
  - mc.phy.o.half_lives_equal_ratio
  - mc.phy.o.half_lives_counted_wrongly
  - mc.phy.o.decay_treated_as_linear
solution:
  steps:
  - n: 1
    latex: \frac{240}{60} = 4
    reason: How many times smaller
    check_id: chk_build_phy_rad_0033_ratio
  - n: 2
    latex: \frac{240}{2^{n}} = 60 \Rightarrow n = 2
    reason: Count the halvings
    check_id: chk_build_phy_rad_0033_n
  - n: 3
    latex: t = 2 \times 8 = 16\ \text{days}
    reason: Half-lives × half-life
    check_id: chk_build_phy_rad_0033_ans
difficulty:
  prior: 0.3
  band: core
