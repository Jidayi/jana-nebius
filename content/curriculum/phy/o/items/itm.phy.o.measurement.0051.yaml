stem: A micrometer screw gauge shows 6.5 mm on the main scale, and the thimble line is at division 18. Each thimble division is 0.01 mm and there is no zero error.
parts:
- id: a
  prompt: Find the diameter of the wire, in millimetres.
  marks: 2
  answer:
    kind: numeric
    value: '6.68'
    unit: mm
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mea_0051_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'A micrometer reading has two parts: the main scale and the thimble.'
  - rung: 2
    name: concept
    text:
      en: Each thimble division is a hundredth of a millimetre.
  - rung: 3
    name: first_step
    text:
      en: Turn 18 divisions into millimetres.
  - rung: 4
    name: worked_step
    text:
      en: 18 divisions are 0.18 mm; add this to the main scale.
  - rung: 5
    name: full_step
    text:
      en: The diameter is 6.68 mm.
  misconception_ids:
  - mc.phy.o.thimble_read_as_tenths
  - mc.phy.o.main_scale_only
  - mc.phy.o.thimble_read_as_fiftieths
solution:
  steps:
  - n: 1
    latex: 18 \times 0.01 = 0.18\ \text{mm}
    reason: Thimble divisions are hundredths
    check_id: chk_build_phy_mea_0051_t
  - n: 2
    latex: 6.5 + 0.18 = 6.68\ \text{mm}
    reason: Add the two scales
    check_id: chk_build_phy_mea_0051_ans
