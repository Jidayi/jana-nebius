id: itm.phy.o.energy.0056
version: 0.1.1
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.energy_conversion
stem: A stone of mass 0.2 kg falls from rest through a height of 12 m. Ignore air resistance and take g = 10 N/kg.
parts:
- id: a
  prompt: Calculate its speed just before it lands.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 15.5 m/s
      correct: true
    - id: B
      text: 11.0 m/s
      correct: false
      misconception_id: mc.phy.o.conversion_two_dropped
      feedback: 'From mgh = ½mv², multiply both sides by 2 and cancel m: v² = 2gh, and so h = v² ÷ 2g.'
    - id: C
      text: 240 m/s
      correct: false
      misconception_id: mc.phy.o.ke_speed_not_rooted
      feedback: Rearranging ½mv² gives v², not v. Take the square root as the last step, then check the speed is sensible.
    - id: D
      text: 6.93 m/s
      correct: false
      misconception_id: mc.phy.o.conversion_mass_not_cancelled
      feedback: The mass is on both sides of mgh = ½mv², so it cancels. Ignoring air resistance, a heavy and a light object dropped together land at the same speed.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The gravitational store empties as the kinetic store fills.
  - rung: 2
    name: concept
    text:
      en: Set mgΔh = ½mv²; the mass cancels, so v² = 2gΔh.
  - rung: 3
    name: first_step
    text:
      en: The drop in height is 12 m.
  - rung: 4
    name: worked_step
    text:
      en: v² = 2 × 10 × 12 = 240; take the square root.
  - rung: 5
    name: full_step
    text:
      en: The speed is 15.5 m/s.
  misconception_ids:
  - mc.phy.o.conversion_mass_not_cancelled
  - mc.phy.o.conversion_two_dropped
  - mc.phy.o.ke_speed_not_rooted
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: mg\Delta h = \frac{1}{2}mv^2 \Rightarrow v^2 = 2g\Delta h
    reason: Energy lost from the gravitational store = energy gained by the kinetic store; m cancels
  - n: 2
    latex: v^2 = 2 \times 10 \times 12 = 240
    reason: Substitute
    check_id: chk_build_phy_nrg_0056_vsq
  - n: 3
    latex: v = \sqrt{240} = 15.5\ \text{m/s}
    reason: Square root
    check_id: chk_build_phy_nrg_0056_ans
