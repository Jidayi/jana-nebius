id: itm.phy.o.em_spectrum.0011
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.em_spectrum.order_and_properties
stem: Four regions of the electromagnetic spectrum are to be listed in order.
parts:
- id: a
  prompt: Which list is in order of increasing wavelength?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Visible light, ultraviolet, X-rays, gamma rays
      correct: false
      misconception_id: mc.phy.o.em_order_reversed
      feedback: Radio waves have the longest wavelength and the lowest frequency; gamma rays have the shortest wavelength and the highest frequency.
    - id: B
      text: X-rays, gamma rays, ultraviolet, visible light
      correct: false
      misconception_id: mc.phy.o.em_end_regions_mixed
      feedback: 'Learn the full order from longest wavelength: radio, microwaves, infrared, visible, ultraviolet, X-rays, gamma rays.'
    - id: C
      text: Gamma rays, X-rays, infrared, visible light
      correct: false
      misconception_id: mc.phy.o.infrared_ultraviolet_swapped
      feedback: 'Infra means below: infrared is beyond red, with longer waves that heat things. Ultra means beyond: ultraviolet is beyond violet, with shorter waves that damage skin.'
    - id: D
      text: Gamma rays, X-rays, ultraviolet, visible light
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Start from the region with the longest wavelength and work towards the shortest.
  - rung: 2
    name: concept
    text:
      en: Frequency rises as wavelength falls, because every region has the same speed in a vacuum.
  - rung: 3
    name: first_step
    text:
      en: Every region is a transverse wave and can cross empty space.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that break the order or these shared properties.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Gamma rays, X-rays, ultraviolet, visible light.'
  misconception_ids:
  - mc.phy.o.em_end_regions_mixed
  - mc.phy.o.em_order_reversed
  - mc.phy.o.infrared_ultraviolet_swapped
solution:
  steps:
  - n: 1
    latex: \text{Gamma rays, X-rays, ultraviolet, visible light}
    reason: Recall the order and the shared properties of the spectrum
