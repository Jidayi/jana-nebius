id: itm.phy.o.thermal_properties.0046
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.changes_of_state
stem: A 75 W heater warms some solid lauric acid steadily. The graph of its temperature against time is flat at 44 °C from 4 min to 11 min.
parts:
- id: a
  prompt: How much energy does the heater supply while the substance melts? Assume no energy is lost; give your answer in kJ.
  marks: 2
  answer:
    kind: numeric
    value: '31.5'
    unit: kJ
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_thp_0046_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The flat section shows the substance melting at a constant temperature.
  - rung: 2
    name: concept
    text:
      en: The heater is still supplying energy throughout the flat section.
  - rung: 3
    name: first_step
    text:
      en: Find how long the flat section lasts, in seconds.
  - rung: 4
    name: worked_step
    text:
      en: Melting lasts 420 s; multiply by 75 W.
  - rung: 5
    name: full_step
    text:
      en: The heater supplies 31.5 kJ while the substance melts.
  misconception_ids:
  - mc.phy.o.heater_minutes_not_seconds
solution:
  steps:
  - n: 1
    latex: t = 11 - 4 = 7\ \text{min}
    reason: Length of the flat section
    check_id: chk_build_phy_thp_0046_dm
  - n: 2
    latex: t = 420\ \text{s}
    reason: Seconds, since a watt is a joule per second
    check_id: chk_build_phy_thp_0046_ds
  - n: 3
    latex: E = Pt = 75 \times 420 = 31500\ \text{J}
    reason: Energy from the heater
    check_id: chk_build_phy_thp_0046_e
  - n: 4
    latex: E = 31.5\ \text{kJ}
    reason: There are a thousand joules in a kilojoule
    check_id: chk_build_phy_thp_0046_ans
