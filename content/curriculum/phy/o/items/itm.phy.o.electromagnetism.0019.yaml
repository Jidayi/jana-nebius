stem: A wire carries a steady current across the field between two magnets. When 2 cm of the wire is in the field the force is 0.025 N.
parts:
- id: a
  prompt: The force is proportional to the length of wire in the field. Find the force when 6 cm is in the field.
  marks: 2
  answer:
    kind: numeric
    value: '0.075'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_emg_0019_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Every centimetre of wire in the field carries the current across the field.
  - rung: 2
    name: concept
    text:
      en: The force is proportional to the length of wire in the field.
  - rung: 3
    name: first_step
    text:
      en: Find how many times longer the new length is.
  - rung: 4
    name: worked_step
    text:
      en: The length is 3 times as long; multiply 0.025 N by that.
  - rung: 5
    name: full_step
    text:
      en: F = 0.025 × 3 = 0.075 N.
solution:
