stem: A 2500 W electric cooker ring is used for 1.5 hours every day for 31 days. Electricity costs 10 cents per kilowatt-hour.
parts:
- id: a
  prompt: Calculate the cost of the electricity used, in cents.
  marks: 3
  answer:
    kind: numeric
    value: '1162.5'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_pel_0022_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Electricity is paid for by the kilowatt-hour (one unit).
  - rung: 2
    name: concept
    text:
      en: Find the number of kWh used in all, then multiply by the price of one kWh.
  - rung: 3
    name: first_step
    text:
      en: 'Change the power into kilowatts and find the total time in hours: 1.5 hours a day for 31 days.'
  - rung: 4
    name: worked_step
    text:
      en: The total time is 46.5 h, so the energy is 116.25 kWh; multiply by 10 cents.
  - rung: 5
    name: full_step
    text:
      en: The cost is 1162.5 cents.
  misconception_ids:
  - mc.phy.o.energy_cost_days_left_out
  - mc.phy.o.kwh_power_left_in_watts
  - mc.phy.o.elec_energy_power_over_time
solution:
  steps:
  - n: 1
    latex: P = 2500\ \text{W} = 2.5\ \text{kW}
    reason: Power in kilowatts
    check_id: chk_build_phy_pel_0022_pk
  - n: 2
    latex: t = 1.5 \times 31 = 46.5\ \text{h}
    reason: Total time in hours
    check_id: chk_build_phy_pel_0022_th
  - n: 3
    latex: E = 2.5 \times 46.5 = 116.25\ \text{kWh}
    reason: Energy in kWh
    check_id: chk_build_phy_pel_0022_kwh
  - n: 4
    latex: \text{cost} = 116.25 \times 10 = 1162.5\ \text{cents}
    reason: Units used times price
    check_id: chk_build_phy_pel_0022_ans
