stem: An LED and a resistor are connected in series with a battery, and the LED lights. The battery is then turned round.
parts:
- id: a
  prompt: What happens to the LED?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It stays lit just as brightly
      correct: false
      misconception_id: mc.phy.o.diode_passes_reverse_current
      feedback: 'A diode is a one-way valve for current: it conducts when the triangle points along the conventional current and blocks it the other way.'
    - id: B
      text: It stays lit but more dimly, as a resistor would
      correct: false
      misconception_id: mc.phy.o.diode_as_resistor
      feedback: 'A diode is not a resistor: one way round it conducts easily, the other way round it lets almost no current through.'
    - id: C
      text: It starts to sense light instead of giving it out
      correct: false
      misconception_id: mc.phy.o.led_ldr_arrows_confused
      feedback: 'Arrows pointing out: the component gives out light (LED). Arrows pointing in: light falls on it (LDR).'
    - id: D
      text: It goes out, because it conducts in one direction only
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture the component and what it is used for.
  - rung: 2
    name: concept
    text:
      en: Thermistors respond to temperature, LDRs to light, and diodes let current through one way only.
  - rung: 3
    name: first_step
    text:
      en: Test each option against what the component really does.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that describe a different component.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: it goes out, because it conducts in one direction only.'
  misconception_ids:
  - mc.phy.o.diode_as_resistor
