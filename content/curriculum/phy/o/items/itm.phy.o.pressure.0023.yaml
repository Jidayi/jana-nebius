id: itm.phy.o.pressure.0023
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.liquid_pressure
stem: A tall jar holds glycerine (density 1260 kg/m³) to a depth of 15 cm. Take g = 9.8 N/kg.
parts:
- id: a
  prompt: Calculate the pressure due to the glycerine at the bottom of the jar, in pascals.
  marks: 2
  answer:
    kind: numeric
    value: '1850'
    unit: Pa
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_prs_0023_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: With the density in kg/m³, the depth must be in metres.
  - rung: 2
    name: concept
    text:
      en: Pressure due to a liquid = density × g × depth.
  - rung: 3
    name: first_step
    text:
      en: Change 15 cm into metres first.
  - rung: 4
    name: worked_step
    text:
      en: The depth is 0.15 m; multiply 1260 × 9.8 × 0.15.
  - rung: 5
    name: full_step
    text:
      en: The pressure is 1850 Pa.
  misconception_ids:
  - mc.phy.o.liquid_depth_cm_not_converted
  - mc.phy.o.liquid_pressure_g_left_out
  - mc.phy.o.liquid_density_ignored
solution:
  steps:
  - n: 1
    latex: h = 15\ \text{cm} = 0.15\ \text{m}
    reason: Depth in metres
    check_id: chk_build_phy_prs_0023_hm
  - n: 2
    latex: p = \rho g h = 1260 \times 9.8 \times 0.15 = 1850\ \text{Pa}
    reason: Pressure = ρgh
    check_id: chk_build_phy_prs_0023_ans
