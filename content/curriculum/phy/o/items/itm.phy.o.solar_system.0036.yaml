id: itm.phy.o.solar_system.0036
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.solar_system.planets_and_gravity
stem: Astronauts float around inside the International Space Station.
parts:
- id: a
  prompt: Why do they float?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: They and the station are falling round the Earth together
      correct: true
    - id: B
      text: There is no gravity at that height
      correct: false
      misconception_id: mc.phy.o.no_gravity_in_space
      feedback: The Moon is held in orbit by the Earth's gravity, far beyond the air. Astronauts float because they and their craft are falling round the Earth together.
    - id: C
      text: Their mass becomes zero in orbit
      correct: false
      misconception_id: mc.phy.o.mass_changes_on_other_planet
      feedback: Mass is the amount of matter, so it is the same everywhere. Weight = mg changes, because g is different on each planet.
    - id: D
      text: An outward force on them balances their weight
      correct: false
      misconception_id: mc.phy.o.orbit_needs_outward_force
      feedback: If the forces were balanced the planet would move in a straight line. The one unbalanced pull towards the Sun is what keeps turning it.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what the Sun's gravity does to each planet.
  - rung: 2
    name: concept
    text:
      en: Gravity pulls towards the Sun and bends each planet's path into an orbit; nothing pushes it along or outwards.
  - rung: 3
    name: first_step
    text:
      en: Further from the Sun the pull is weaker, the orbit longer and the planet slower; g depends on the planet.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these ideas.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: They and the station are falling round the Earth together.'
  misconception_ids:
  - mc.phy.o.mass_changes_on_other_planet
  - mc.phy.o.no_gravity_in_space
  - mc.phy.o.orbit_needs_outward_force
solution:
