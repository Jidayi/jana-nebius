id: itm.phy.o.sound.0031
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.sound.pitch_and_loudness
stem: An oscilloscope shows that a sound wave has a period of 2.5 ms.
parts:
- id: a
  prompt: Find the frequency of the sound.
  marks: 2
  answer:
    kind: numeric
    value: '400'
    unit: Hz
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_snd_0031_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Frequency and period are linked: f = 1 ÷ T.'
  - rung: 2
    name: concept
    text:
      en: The period must be in seconds to give the frequency in hertz.
  - rung: 3
    name: first_step
    text:
      en: 2.5 ms = 0.0025 s.
  - rung: 4
    name: worked_step
    text:
      en: f = 1 ÷ 0.0025.
  - rung: 5
    name: full_step
    text:
      en: 'f = 400 Hz: this is inside the range of human hearing, so it can be heard.'
  misconception_ids:
  - mc.phy.o.period_frequency_confused
  - mc.phy.o.wave_prefix_ignored
solution:
  steps:
  - n: 1
    latex: T = 2.5\ \text{ms} = 0.0025\ \text{s}
    reason: A millisecond is a thousandth of a second
    check_id: chk_build_phy_snd_0031_ts
  - n: 2
    latex: f = \frac{1}{T} = \frac{1}{0.0025} = 400\ \text{Hz}
    reason: Frequency = 1 ÷ period
    check_id: chk_build_phy_snd_0031_ans
  - n: 3
    latex: \text{inside the range of human hearing}
    reason: Compare with the range of human hearing (about twenty hertz to twenty kilohertz)
