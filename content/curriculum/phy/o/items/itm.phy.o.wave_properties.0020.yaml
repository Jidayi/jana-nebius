stem: Sound travels through air at 340 m/s. A high note from a whistle has a wavelength of 17 cm.
parts:
- id: a
  prompt: Calculate the frequency of the waves.
  marks: 2
  answer:
    kind: numeric
    value: '2000'
    unit: Hz
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_wav_0020_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Start from v = f × λ.
  - rung: 2
    name: concept
    text:
      en: 'To find f, divide the speed by the wavelength: f = v ÷ λ.'
  - rung: 3
    name: first_step
    text:
      en: 'First put the values in hertz and metres: 17 cm = 0.17 m.'
  - rung: 4
    name: worked_step
    text:
      en: Divide 340 by the wavelength in metres.
  - rung: 5
    name: full_step
    text:
      en: f = 2000 Hz.
  misconception_ids:
  - mc.phy.o.wave_prefix_ignored
  - mc.phy.o.wave_equation_inverted
  - mc.phy.o.wave_equation_multiplied
solution:
  steps:
  - n: 1
    latex: \lambda = 17\ \text{cm} = 0.17\ \text{m}
    reason: Put the wavelength in metres
    check_id: chk_build_phy_wav_0020_lsi
  - n: 2
    latex: f = \frac{v}{\lambda} = \frac{340}{0.17} = 2000\ \text{Hz}
    reason: Rearrange v = fλ
    check_id: chk_build_phy_wav_0020_ans
