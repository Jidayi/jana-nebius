id: itm.phy.o.stars.0045
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.stars.expanding_universe
stem: One galaxy's light has a larger redshift than another's.
parts:
- id: a
  prompt: What can you conclude about the first galaxy?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It is nearer to us
      correct: false
      misconception_id: mc.phy.o.nearer_galaxies_recede_faster
      feedback: 'Recession speed is proportional to distance: a galaxy twice as far away recedes twice as fast and has twice the redshift.'
    - id: B
      text: It is moving away faster and is further away
      correct: true
    - id: C
      text: It is moving towards us faster
      correct: false
      misconception_id: mc.phy.o.redshift_to_shorter_wavelength
      feedback: 'Red light has the longest visible wavelength. A galaxy moving away stretches its light towards longer wavelengths: towards the red.'
    - id: D
      text: Its stars are cooler and redder
      correct: false
      misconception_id: mc.phy.o.redshift_means_galaxy_red
      feedback: Redshift is a shift of the whole spectrum, including the dark lines, towards longer wavelengths. A blue star in a receding galaxy is still redshifted.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what redshift tells us about how galaxies move.
  - rung: 2
    name: concept
    text:
      en: Redshift is a stretch of light to longer wavelengths, caused by a galaxy moving away from us.
  - rung: 3
    name: first_step
    text:
      en: 'More distant galaxies show more redshift, so they recede faster: the Universe is expanding from a hot, dense start.'
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these ideas.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It is moving away faster and is further away.'
  misconception_ids:
  - mc.phy.o.nearer_galaxies_recede_faster
  - mc.phy.o.redshift_means_galaxy_red
  - mc.phy.o.redshift_to_shorter_wavelength
solution:
  steps:
  - n: 1
    latex: \text{It is moving away faster and is further away}
    reason: Use what redshift tells us about receding galaxies
