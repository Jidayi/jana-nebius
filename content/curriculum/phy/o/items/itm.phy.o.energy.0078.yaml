  - n: 1
    latex: t = 4\ \text{min} = 240\ \text{s}
    reason: Time in seconds
    check_id: chk_build_phy_nrg_0078_ts
  - n: 2
    latex: E = Pt = 3\ \text{kW} \times 240\ \text{s} = 720\ \text{kJ}
    reason: kW × s gives kJ
    check_id: chk_build_phy_nrg_0078_ans
