stem: A kettle with a power of 3 kW is switched on for 4 minutes.
parts:
- id: a
  prompt: Calculate the energy it transfers, in kJ.
  marks: 2
  answer:
    kind: numeric
    value: '720'
    unit: kJ
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_nrg_0078_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Power is energy per second, so energy = power × time.
  - rung: 2
    name: concept
    text:
      en: Use E = P × t with the time in seconds; kW × s gives kJ.
  - rung: 3
    name: first_step
    text:
      en: 4 minutes = 240 s.
  - rung: 4
    name: worked_step
    text:
      en: Work out 3 × 240.
  - rung: 5
    name: full_step
    text:
      en: The energy transferred is 720 kJ.
  misconception_ids:
  - mc.phy.o.power_minutes_not_converted
  - mc.phy.o.energy_formula_operation_swapped
  - mc.phy.o.energy_kilo_prefix_ignored
solution:
