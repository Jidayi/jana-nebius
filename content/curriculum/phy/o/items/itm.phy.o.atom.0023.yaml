stem: Carbon-14 is radioactive, while carbon-12 is stable.
parts:
- id: a
  prompt: Which statement is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Carbon-12 is not an isotope because it is not radioactive
      correct: false
      misconception_id: mc.phy.o.isotope_means_radioactive
      feedback: Carbon-12 is a stable isotope of carbon and carbon-14 a radioactive one. Being an isotope is about protons and neutrons, not about decay.
    - id: B
      text: They are different elements because one of them decays
      correct: false
      misconception_id: mc.phy.o.heavier_isotope_different_element
      feedback: 'Carbon-12 and carbon-14 are both carbon: both have six protons. The proton number alone decides the element.'
    - id: C
      text: Carbon-14 has two more protons, which makes it unstable
      correct: false
      misconception_id: mc.phy.o.isotopes_differ_in_protons
      feedback: Change the number of protons and you change the element. Isotopes of one element all have the same proton number; only the neutrons differ.
    - id: D
      text: They are isotopes even though only one of them decays
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide what makes two nuclides the same element.
  - rung: 2
    name: concept
    text:
      en: Isotopes have the same proton number but different nucleon numbers.
  - rung: 3
    name: first_step
    text:
      en: Being an isotope is about the particles in the nucleus, not about whether it decays.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against that definition.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: They are isotopes even though only one of them decays.'
  misconception_ids:
