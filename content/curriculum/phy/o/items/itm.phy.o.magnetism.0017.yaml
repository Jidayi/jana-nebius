id: itm.phy.o.magnetism.0017
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.magnetism.magnetic_fields
stem: A compass is placed halfway between two field lines drawn round a magnet.
parts:
- id: a
  prompt: What does the compass needle do?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It does not turn, because there is no field between the lines
      correct: false
      misconception_id: mc.phy.o.field_only_on_drawn_lines
      feedback: A compass placed between two drawn lines still turns. The lines show the field's direction and strength; the field is everywhere near the magnet.
    - id: B
      text: It lines up with the field, in the same direction as the nearby lines
      correct: true
    - id: C
      text: It points from the magnet's south pole towards its north pole
      correct: false
      misconception_id: mc.phy.o.field_lines_s_to_n
      feedback: Outside a magnet the field points from the north pole round to the south pole, the way a small compass's north end points.
    - id: D
      text: It points at the magnet's north pole
      correct: false
      misconception_id: mc.phy.o.compass_points_at_like_pole
      feedback: 'The compass needle is a small magnet: its north end is pushed away from a north pole and pulled towards a south pole.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture a small plotting compass placed at that point near the magnet.
  - rung: 2
    name: concept
    text:
      en: Field lines run from north to south outside a magnet, never cross, and are closest where the field is strongest, at the poles.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: The field fills all the space round the magnet; the lines are only a picture of it.
  - rung: 5
    name: full_step
    text:
      en: It lines up with the field, in the same direction as the nearby lines. The field fills all the space round the magnet; the lines are only a picture of it.
  misconception_ids:
  - mc.phy.o.compass_points_at_like_pole
  - mc.phy.o.field_lines_s_to_n
  - mc.phy.o.field_only_on_drawn_lines
solution:
