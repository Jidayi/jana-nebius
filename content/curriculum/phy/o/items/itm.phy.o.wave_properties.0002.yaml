    text:
      en: A wavelength is the length of one complete wave.
  - rung: 2
    name: concept
    text:
      en: Measure it along the wave, from one crest to the next crest.
  - rung: 3
    name: first_step
    text:
      en: The 150 cm holds 4 waves.
  - rung: 4
    name: worked_step
    text:
      en: Divide 150 by 4.
  - rung: 5
    name: full_step
    text:
      en: λ = 37.5 cm.
