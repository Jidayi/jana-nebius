stem: A labelled drawing of a wave on a stretched spring shows 4 complete waves along a length of 150 cm. The vertical distance from the top of a crest to the bottom of a trough is 10 cm.
parts:
- id: a
  prompt: Find the wavelength of the wave.
  marks: 1
  answer:
    kind: numeric
    value: '37.5'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_wav_0002_ans
  show_working: false
  hints:
