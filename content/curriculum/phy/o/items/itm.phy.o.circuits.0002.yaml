id: itm.phy.o.circuits.0002
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.series_circuits
stem: Ade connects a 2 Ω resistor and a 10 Ω resistor in series with a 4.5 V battery.
parts:
- id: a
  prompt: Calculate the current in the circuit.
  marks: 2
  answer:
    kind: numeric
    value: '0.375'
    unit: A
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_cir_0002_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The same current flows through both resistors, pushed by the battery.
  - rung: 2
    name: concept
    text:
      en: Use the total resistance of the circuit in I = V/R.
  - rung: 3
    name: first_step
    text:
      en: The total resistance is 2 Ω + 10 Ω.
  - rung: 4
    name: worked_step
    text:
      en: The total is 12 Ω, so I = 4.5 ÷ 12.
  - rung: 5
    name: full_step
    text:
      en: The current is 0.375 A.
  misconception_ids:
  - mc.phy.o.series_current_from_one_resistor
  - mc.phy.o.series_treated_as_parallel
  - mc.phy.o.circuit_current_r_over_v
solution:
  steps:
  - n: 1
    latex: R = 2 + 10 = 12\ \Omega
    reason: Series resistances add
    check_id: chk_build_phy_cir_0002_rt
  - n: 2
    latex: I = \frac{V}{R} = \frac{4.5}{12} = 0.375\ \text{A}
    reason: Ohm's law
    check_id: chk_build_phy_cir_0002_ans
