id: itm.phy.o.circuits.0031
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.mixed_circuits
stem: A 6 Ω resistor is connected in series with a parallel pair made of a 6 Ω resistor and a 3 Ω resistor. The circuit is connected to a 24 V battery.
parts:
- id: a
  prompt: Calculate the total resistance of the circuit.
  marks: 2
  answer:
    kind: numeric
    value: '8'
    unit: Ω
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_cir_0031_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Find the part of the circuit that is in parallel and deal with it first.
  - rung: 2
    name: concept
    text:
      en: Replace the parallel pair by its combined resistance, then add the series resistor.
  - rung: 3
    name: first_step
    text:
      en: For the pair, use (6 × 3) ÷ (6 + 3).
  - rung: 4
    name: worked_step
    text:
      en: The pair is 2 Ω; now add 6 Ω.
  - rung: 5
    name: full_step
    text:
      en: The total resistance is 8 Ω.
  misconception_ids:
  - mc.phy.o.mixed_all_in_series
  - mc.phy.o.mixed_series_resistor_left_out
  - mc.phy.o.mixed_all_in_parallel
solution:
  steps:
  - n: 1
    latex: R_p = \frac{6 \times 3}{6 + 3} = 2\ \Omega
    reason: Combine the parallel pair
    check_id: chk_build_phy_cir_0031_rp
  - n: 2
    latex: R = 6 + 2 = 8\ \Omega
    reason: Add the series resistor
    check_id: chk_build_phy_cir_0031_ans
