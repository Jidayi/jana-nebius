stem: In a small hydroelectric power station, 500 kg of water falls through a height of 20 m every second. Take g = 9.8 N/kg.
parts:
- id: a
  prompt: Calculate the power supplied by the falling water, in kW.
  marks: 2
  answer:
    kind: numeric
    value: '98'
    unit: kW
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_nrg_0106_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Each second, the water's gravitational store loses mgh.
  - rung: 2
    name: concept
    text:
      en: 'Energy per second is power: 1 J/s is 1 W, and a thousand watts is a kilowatt.'
  - rung: 3
    name: first_step
    text:
      en: Work out 500 × 9.8 × 20.
  - rung: 4
    name: worked_step
    text:
      en: That is 98000 J each second; change it to kW.
  - rung: 5
    name: full_step
    text:
      en: The power is 98 kW.
  misconception_ids:
  - mc.phy.o.energy_mass_for_weight
  - mc.phy.o.gpe_half_from_ke
solution:
  steps:
  - n: 1
    latex: \Delta E_p = 500 \times 9.8 \times 20 = 98000\ \text{J}
    reason: Energy lost each second
    check_id: chk_build_phy_nrg_0106_ep
  - n: 2
    latex: 98000\ \text{J/s} = 98\ \text{kW}
    reason: Joules per second are watts
    check_id: chk_build_phy_nrg_0106_ans
