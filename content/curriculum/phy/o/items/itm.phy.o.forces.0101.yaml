stem: A designer wants a new baby high chair to be hard to tip over.
parts:
- id: a
  prompt: Which changes make it more stable? Choose all that apply.
  marks: 2
  answer:
    kind: multi_select
    options:
    - id: A
      text: Putting heavy weights in the feet
      correct: true
    - id: B
      text: Making the seat higher off the floor
      correct: false
    - id: C
      text: Adding a heavy tray at the top
      correct: false
    - id: D
      text: Making the legs splay out wider at the bottom
      correct: true
    scoring: exact_set
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Stability depends on two things.
  - rung: 2
    name: concept
    text:
      en: Think about the height of the centre of gravity and the width of the base.
  - rung: 3
    name: first_step
    text:
      en: Weight added high up makes things worse, not better.
  - rung: 4
    name: worked_step
    text:
      en: Look for the changes that widen the base or move mass lower down.
  - rung: 5
    name: full_step
    text:
      en: Wider-splayed legs and a heavy base both make the chair more stable.
solution:
  steps:
  - n: 1
    latex: \text{lower centre of gravity, wider base}
    reason: The two features of a stable object
