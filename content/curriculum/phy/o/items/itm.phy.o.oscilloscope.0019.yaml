stem: The Y-gain of an oscilloscope is set to 0.5 V/div. A crest of the trace is 3.5 divisions above the centre line.
parts:
- id: a
  prompt: Find the peak voltage of the signal.
  marks: 1
  answer:
    kind: numeric
    value: '1.75'
    unit: V
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_osc_0019_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The peak voltage is the height of a crest above the centre line.
  - rung: 2
    name: concept
    text:
      en: The Y-gain gives the voltage for each vertical division.
  - rung: 3
    name: first_step
    text:
      en: The height is already measured from the centre line.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 3.5 divisions by 0.5 V/div.
  - rung: 5
    name: full_step
    text:
      en: The peak voltage is 1.75 V.
  misconception_ids:
  - mc.phy.o.osc_ygain_divided
