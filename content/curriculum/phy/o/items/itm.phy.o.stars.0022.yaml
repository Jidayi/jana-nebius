  prompt: How will this star's life end?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: As a red giant that leaves a white dwarf, like the Sun
      correct: false
      misconception_id: mc.phy.o.every_star_ends_white_dwarf
      feedback: A very massive star becomes a red supergiant and explodes as a supernova, leaving a neutron star or a black hole.
    - id: B
      text: It will never end; it will shine unchanged for ever
      correct: false
      misconception_id: mc.phy.o.stars_never_change
      feedback: A star's fuel runs out in the end. Its life is so long, millions to billions of years, that we never see one star change much.
