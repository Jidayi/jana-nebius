  - n: 1
    latex: d = 7.8 \times 10^{7}\ \text{km} = 7.8 \times 10^{10}\ \text{m}
    reason: A kilometre is a thousand metres
  - n: 2
    latex: t = \frac{d}{c} = \frac{7.8 \times 10^{10}}{3.0 \times 10^{8}} = 260\ \text{s}
    reason: Time = distance ÷ speed, at the speed of light
    check_id: chk_build_phy_ems_0003_ans
