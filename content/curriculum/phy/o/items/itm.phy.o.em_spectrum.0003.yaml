  prompt: How long does the journey take?
  marks: 2
  answer:
    kind: numeric
    value: '260'
    unit: s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_ems_0003_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Radio waves and light are both electromagnetic waves.
  - rung: 2
    name: concept
    text:
      en: They travel at c = 3.0 × 10⁸ m/s.
  - rung: 3
    name: first_step
    text:
      en: 'Put the distance in metres: 7.8 × 10¹⁰ m.'
  - rung: 4
    name: worked_step
    text:
      en: Time = distance ÷ speed.
  - rung: 5
    name: full_step
    text:
      en: t = 260 s.
  misconception_ids:
