id: itm.phy.o.thermal_properties.0040
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.latent_heat
stem: 1.5 kg of water at 15 °C is heated to its boiling point, 100 °C, and then until it has all boiled away. The specific heat capacity of water is 4.2 kJ/(kg °C) and its specific latent heat of vaporisation is 2260 kJ/kg.
parts:
- id: a
  prompt: Find the total energy needed, in kJ.
  marks: 3
  answer:
    kind: numeric
    value: '3925.5'
    unit: kJ
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_thp_0040_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'There are two stages: warming the water to 100 °C, then boiling it at 100 °C.'
  - rung: 2
    name: concept
    text:
      en: The warming uses E = mcΔθ; the boiling uses E = mL.
  - rung: 3
    name: first_step
    text:
      en: The temperature rise is from 15 °C to 100 °C.
  - rung: 4
    name: worked_step
    text:
      en: Warming needs 535.5 kJ and boiling needs 3390 kJ.
  - rung: 5
    name: full_step
    text:
      en: The total is 3925.5 kJ.
  misconception_ids:
  - mc.phy.o.latent_stage_omitted
solution:
  steps:
  - n: 1
    latex: \Delta\theta = 100 - 15 = 85\ ^\circ\text{C}
    reason: Warm the water to boiling point
    check_id: chk_build_phy_thp_0040_dt
  - n: 2
    latex: E_1 = mc\Delta\theta = 1.5 \times 4.2 \times 85 = 535.5\ \text{kJ}
    reason: Energy to reach 100 °C
    check_id: chk_build_phy_thp_0040_e1
  - n: 3
    latex: E_2 = mL = 1.5 \times 2260 = 3390\ \text{kJ}
    reason: Energy to boil it away
    check_id: chk_build_phy_thp_0040_e2
  - n: 4
    latex: E = 535.5 + 3390 = 3925.5\ \text{kJ}
    reason: Add the two stages
    check_id: chk_build_phy_thp_0040_ans
