id: itm.phy.o.pressure.0028
version: 0.1.1
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.liquid_pressure
stem: Yaw dives from 8 m to 15 m below the surface of sea water (density 1030 kg/m³). Take g = 10 N/kg.
parts:
- id: a
  prompt: By how much does the pressure on the diver increase, in kPa?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 72.1 kPa
      correct: true
    - id: B
      text: 154.5 kPa
      correct: false
      misconception_id: mc.phy.o.liquid_pressure_total_depth_used
      feedback: 'The change in pressure depends on the change in depth: Δp = ρgΔh, with Δh the deeper depth minus the shallower one.'
    - id: C
      text: 7.21 kPa
      correct: false
      misconception_id: mc.phy.o.liquid_pressure_g_left_out
      feedback: 'The pressure comes from the weight of the liquid above, so g is needed: pressure = ρ × g × h. Without g the answer is not in pascals.'
    - id: D
      text: 236.9 kPa
      correct: false
      misconception_id: mc.phy.o.liquid_depths_added
      feedback: If both points were at the same depth there would be no change in pressure at all, but adding the depths would still give one. Subtract them.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The increase in pressure depends on how much deeper the diver goes.
  - rung: 2
    name: concept
    text:
      en: Change in pressure = density × g × change in depth.
  - rung: 3
    name: first_step
    text:
      en: The change in depth is 15 − 8.
  - rung: 4
    name: worked_step
    text:
      en: Δh = 7 m; multiply 1030 × 10 × 7 and give the result in kPa.
  - rung: 5
    name: full_step
    text:
      en: The pressure increases by 72.1 kPa.
  misconception_ids:
  - mc.phy.o.liquid_depths_added
  - mc.phy.o.liquid_pressure_g_left_out
  - mc.phy.o.liquid_pressure_total_depth_used
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: \Delta h = 15 - 8 = 7\ \text{m}
    reason: The change in depth
    check_id: chk_build_phy_prs_0028_dh
  - n: 2
    latex: \Delta p = \rho g \Delta h = 1030 \times 10 \times 7 = 72.1\ \text{kPa}
    reason: Δp = ρgΔh, then pascals into kilopascals
    check_id: chk_build_phy_prs_0028_ans
