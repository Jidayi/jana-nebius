stem: A stone is dropped from rest at the top of a well and falls for 2.0 s before it hits the water. Take g = 9.8 m/s^2 and ignore air resistance.
parts:
- id: a
  prompt: Calculate how far the stone falls.
  marks: 3
  answer:
    kind: numeric
    value: '19.6'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0004_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'List what you know: the starting speed, the time and the acceleration.'
  - rung: 2
    name: concept
    text:
      en: Dropped from rest means the initial velocity u is 0, and the acceleration is g.
  - rung: 3
    name: first_step
    text:
      en: Use s = ut + ½at², which links distance, time and acceleration.
  - rung: 4
    name: worked_step
    text:
      en: 'With u = 0 the first term drops out: s = ½ × 9.8 × 2.0².'
  - rung: 5
    name: full_step
    text:
      en: s = ½ × 9.8 × 2.0² = 19.6 m.
  misconception_ids:
  - mc.phy.o.gravity_sign_flipped
solution:
  steps:
  - n: 1
    latex: s = ut + \tfrac{1}{2}at^2
    reason: Links distance, time and acceleration
  - n: 2
    latex: s = 0 + \tfrac{1}{2}(9.8)(2.0)^2
    reason: Dropped from rest so u = 0
  - n: 3
    latex: s = 19.6\ \text{m}
    reason: Evaluate
    check_id: chk_build_phy_k_0004_a
