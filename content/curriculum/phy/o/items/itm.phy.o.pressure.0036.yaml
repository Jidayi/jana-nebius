stem: A mercury barometer reads 758 mm at the foot of a hill and 743 mm at the top. Mercury has a density of 13600 kg/m³; take the density of the air to be 1.2 kg/m³ all the way up.
parts:
- id: a
  prompt: Estimate the height of the hill.
  marks: 3
  answer:
    kind: numeric
    value: '170'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_prs_0036_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The barometer falls because the air between the foot and the top no longer presses on it.
  - rung: 2
    name: concept
    text:
      en: 'That layer of air has the same pressure as the fall in the mercury column: ρ(Hg)gΔh = ρ(air)gH.'
  - rung: 3
    name: first_step
    text:
      en: g is on both sides, so H = ρ(Hg) × Δh ÷ ρ(air), with Δh in metres.
  - rung: 4
    name: worked_step
    text:
      en: The mercury falls by 0.015 m; multiply by 13600 and divide by 1.2.
  - rung: 5
    name: full_step
    text:
      en: The hill is about 170 m high.
  misconception_ids:
  - mc.phy.o.barometer_mm_not_converted
  - mc.phy.o.barometer_liquid_density_swapped
  - mc.phy.o.manometer_one_level_used
solution:
  steps:
  - n: 1
    latex: \Delta h_{\text{Hg}} = 758 - 743 = 15\ \text{mm}
    reason: The fall in the mercury column
    check_id: chk_build_phy_prs_0036_dh
  - n: 2
    latex: 15\ \text{mm} = 0.015\ \text{m}
    reason: Millimetres into metres
    check_id: chk_build_phy_prs_0036_dhm
  - n: 3
    latex: \rho_{\text{Hg}} g \Delta h_{\text{Hg}} = \rho_{\text{air}} g H
    reason: The layer of air climbed through matches the fall
  - n: 4
    latex: H = \frac{13600 \times 0.015}{1.2} = 170\ \text{m}
    reason: g cancels
    check_id: chk_build_phy_prs_0036_ans
