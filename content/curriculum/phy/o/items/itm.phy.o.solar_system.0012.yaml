id: itm.phy.o.solar_system.0012
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.solar_system.earth_and_moon
stem: At new moon we cannot see the Moon at all.
parts:
- id: a
  prompt: Where is the Moon at new moon?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Between the Earth and the Sun
      correct: true
    - id: B
      text: On the far side of the Earth from the Sun, in the Earth's shadow
      correct: false
      misconception_id: mc.phy.o.moon_phases_earth_shadow
      feedback: Half the Moon is always lit by the Sun. As it orbits we see different amounts of that lit half. The Earth's shadow only reaches the Moon in an eclipse.
    - id: C
      text: 'Anywhere: it has simply stopped giving out light'
      correct: false
      misconception_id: mc.phy.o.moon_makes_own_light
      feedback: The Moon is a cold, rocky body. We see it only because it reflects light from the Sun, which is why the unlit part looks dark.
    - id: D
      text: 'Anywhere: its phase comes from its daily trip round the Earth'
      correct: false
      misconception_id: mc.phy.o.moon_orbits_earth_daily
      feedback: The Moon rises and sets daily because the Earth spins. Its own orbit takes about a month, which is why its phase changes slowly from night to night.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Separate the three motions: the Earth''s spin, the Earth''s orbit and the Moon''s orbit.'
  - rung: 2
    name: concept
    text:
      en: The spin takes a day, the Earth's orbit a year, and the Moon's orbit roughly a month.
  - rung: 3
    name: first_step
    text:
      en: Seasons come from the tilt of the Earth's axis; phases come from how much of the Moon's sunlit half we see.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these facts.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Between the Earth and the Sun.'
  misconception_ids:
  - mc.phy.o.moon_makes_own_light
  - mc.phy.o.moon_orbits_earth_daily
  - mc.phy.o.moon_phases_earth_shadow
