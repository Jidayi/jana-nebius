stem: Technetium-99m, half-life 6 hours, is used for a hospital scan. A dose has an activity of 48 MBq when it is prepared.
parts:
- id: a
  prompt: What is its activity 18 hours later?
  marks: 2
  answer:
    kind: numeric
    value: '6'
    unit: MBq
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_rad_0061_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A short half-life means the activity falls quickly once the job is done.
  - rung: 2
    name: concept
    text:
      en: Find how many half-lives pass in the time.
  - rung: 3
    name: first_step
    text:
      en: Halve the activity once for each half-life.
  - rung: 4
    name: worked_step
    text:
      en: '3 half-lives pass: halve 48 that many times.'
  - rung: 5
    name: full_step
    text:
      en: The activity has fallen to 6 MBq, which is why a short half-life is chosen.
  misconception_ids:
  - mc.phy.o.half_life_linear
  - mc.phy.o.half_life_halved_once
  - mc.phy.o.half_lives_counted_wrongly
solution:
  steps:
  - n: 1
    latex: \frac{18}{6} = 3\ \text{half-lives}
    reason: Time ÷ half-life
    check_id: chk_build_phy_rad_0061_n
  - n: 2
    latex: \frac{48}{2^{3}} = 6\ \text{MBq}
    reason: Halve once per half-life
    check_id: chk_build_phy_rad_0061_ans
