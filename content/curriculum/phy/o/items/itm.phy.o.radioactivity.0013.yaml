id: itm.phy.o.radioactivity.0013
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.types_of_radiation
stem: A counter near a source reads 1002 counts/min with nothing in between, 452 counts/min with a sheet of paper in between, and 122 counts/min with 5 mm of aluminium in between. The background count rate is 22 counts/min.
parts:
- id: a
  prompt: Find the count rate due to beta radiation alone.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 550 counts/min
      correct: false
      misconception_id: mc.phy.o.beta_stopped_by_paper
      feedback: Beta particles pass through paper. It takes a few millimetres of aluminium to stop them.
    - id: B
      text: 330 counts/min
      correct: true
    - id: C
      text: 430 counts/min
      correct: false
      misconception_id: mc.phy.o.gamma_stopped_completely
      feedback: Gamma rays pass through paper and aluminium almost unchanged. Thick lead or concrete reduces them a great deal but never to exactly zero.
    - id: D
      text: 880 counts/min
      correct: false
      misconception_id: mc.phy.o.penetration_order_wrong
      feedback: Paper stops alpha; a few millimetres of aluminium stop beta; gamma is only reduced by thick lead or concrete.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Each absorber removes the radiation it can stop; the background is in every reading.
  - rung: 2
    name: concept
    text:
      en: Paper stops alpha; a few millimetres of aluminium stop beta; gamma passes through both.
  - rung: 3
    name: first_step
    text:
      en: So the count rate lost when the paper is swapped for aluminium is the beta.
  - rung: 4
    name: worked_step
    text:
      en: Work out 452 − 122.
  - rung: 5
    name: full_step
    text:
      en: The beta radiation gives 330 counts/min.
  misconception_ids:
  - mc.phy.o.beta_stopped_by_paper
  - mc.phy.o.gamma_stopped_completely
  - mc.phy.o.penetration_order_wrong
solution:
  steps:
  - n: 1
    latex: 452\ \text{(beta + gamma + background)}
    reason: Paper has stopped the alpha
  - n: 2
    latex: 122\ \text{(gamma + background)}
    reason: Aluminium has stopped the beta
  - n: 3
    latex: 452 - 122 = 330\ \text{counts/min}
    reason: The difference is the beta
    check_id: chk_build_phy_rad_0013_ans
