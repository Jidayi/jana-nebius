id: itm.phy.o.forces.0096
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.centre_of_gravity
stem: Racing cars are built low and wide.
parts:
- id: a
  prompt: Why does this design make them stable?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: A low centre of gravity and a wide base mean they must tilt a long way before toppling
      correct: true
    - id: B
      text: It makes them heavier, and heavier things never tip
      correct: false
      misconception_id: mc.phy.o.stability_from_weight_only
      feedback: A load on the roof rack makes a car easier to tip over. Weight added high up raises the centre of gravity and makes an object less stable.
    - id: C
      text: Only the height matters; the width is for space
      correct: false
      misconception_id: mc.phy.o.base_width_irrelevant
      feedback: Stand with your feet together and someone can push you over easily; stand with them apart and it is much harder. A wider base means a bigger tilt before toppling.
    - id: D
      text: It keeps the centre of gravity exactly in the middle of the car body
      correct: false
      misconception_id: mc.phy.o.cog_always_at_middle
      feedback: A hammer balances near its heavy head, not halfway along the handle. The centre of gravity moves towards where more of the mass is.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about where the weight of the object acts and where its base is.
  - rung: 2
    name: concept
    text:
      en: An object topples when the vertical line through its centre of gravity falls outside its base.
  - rung: 3
    name: first_step
    text:
      en: Ask how far the object could tilt before the line of its weight passes outside the base.
  - rung: 4
    name: worked_step
    text:
      en: 'Picture the car tilting on two wheels: where does its weight act?'
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: A low centre of gravity and a wide base mean they must tilt a long way before toppling. The weight keeps acting inside the base for a large tilt, so it pulls the car back down.'
  misconception_ids:
  - mc.phy.o.base_width_irrelevant
  - mc.phy.o.cog_always_at_middle
  - mc.phy.o.stability_from_weight_only
solution:
  steps:
  - n: 1
    latex: \text{A low centre of gravity and a wide base mean they must tilt a long way before toppling}
    reason: Find where the weight acts relative to the base
