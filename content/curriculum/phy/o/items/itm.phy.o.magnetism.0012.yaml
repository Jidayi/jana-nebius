stem: A thin aluminium sheet is put between a magnet and a steel paper clip.
parts:
- id: a
  prompt: Does the clip still feel a magnetic force?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Yes, because aluminium does not block the force
      correct: true
    - id: B
      text: No, because a metal sheet blocks the force
      correct: false
      misconception_id: mc.phy.o.nonmagnetic_blocks_magnetism
      feedback: A fridge magnet still holds a sheet of paper against the door, and a magnet pulls a paper clip through a thin table top.
    - id: C
      text: No, because the aluminium is attracted instead
      correct: false
      misconception_id: mc.phy.o.nonmagnetic_materials_attracted
      feedback: 'Hold a magnet near an aluminium can or a copper coin: nothing happens. Only iron, steel, nickel and cobalt are attracted.'
    - id: D
      text: Only if the clip touches the sheet
      correct: false
      misconception_id: mc.phy.o.magnetic_force_needs_contact
      feedback: A compass needle swings when a magnet is still a hand's width away. Magnetic forces act at a distance.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Recall the two rules: how poles act on each other, and which materials are magnetic.'
  - rung: 2
    name: concept
    text:
      en: Like poles repel and unlike poles attract. Only a few metals are magnetic, and magnetic materials differ in how easily they gain and lose their magnetism.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Aluminium is not a magnetic material, so the magnet's field passes through it.
  - rung: 5
    name: full_step
    text:
      en: Yes, because aluminium does not block the force. Aluminium is not a magnetic material, so the magnet's field passes through it.
  misconception_ids:
  - mc.phy.o.magnetic_force_needs_contact
  - mc.phy.o.nonmagnetic_blocks_magnetism
  - mc.phy.o.nonmagnetic_materials_attracted
