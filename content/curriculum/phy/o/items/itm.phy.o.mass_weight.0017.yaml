id: itm.phy.o.mass_weight.0017
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.mass_weight.mass_or_weight
stem: The gravitational field strength on Mars is about 3.7 N/kg.
parts:
- id: a
  prompt: What does this value mean?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Each newton of weight on Mars comes from 3.7 kg of mass
      correct: false
      misconception_id: mc.phy.o.weight_mass_divided_by_g
      feedback: 'Weight = mass × g: each kilogram has a weight of g newtons. So mass = weight ÷ g. Where g is bigger than 1 N/kg the weight in newtons is a bigger number than the mass in kilograms.'
    - id: B
      text: Each kilogram on Mars has a weight of 3.7 N
      correct: true
    - id: C
      text: Objects on Mars have 3.7 times less mass than on Earth
      correct: false
      misconception_id: mc.phy.o.mass_changes_with_g
      feedback: Mass is the amount of matter in the object, and a trip to the Moon removes no matter. Only the weight, the pull of gravity on it, changes.
    - id: D
      text: Each kilogram on Mars has a mass of 3.7 N
      correct: false
      misconception_id: mc.phy.o.mass_weight_units_swapped
      feedback: Mass is measured in kilograms. Weight is a force, so it is measured in newtons. A label saying '2 kg' gives a mass.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide whether each option is about mass, weight, or both.
  - rung: 2
    name: concept
    text:
      en: The unit N/kg reads 'newtons for every kilogram'.
  - rung: 3
    name: first_step
    text:
      en: Test each option against the difference between the amount of matter and the pull of gravity.
  - rung: 4
    name: worked_step
    text:
      en: Rule out every option that mixes up the two quantities.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Each kilogram on Mars has a weight of 3.7 N.'
  misconception_ids:
  - mc.phy.o.mass_changes_with_g
  - mc.phy.o.mass_weight_units_swapped
  - mc.phy.o.weight_mass_divided_by_g
solution:
  steps:
  - n: 1
    latex: \text{Each kilogram on Mars has a weight of 3.7 N}
    reason: Mass stays the same; weight depends on g
