id: itm.phy.o.energy.0118
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.energy_resources
stem: A country compares a gas-fired power station with a wind farm of the same maximum output.
parts:
- id: a
  prompt: Which statement is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: The wind farm costs less to build because wind is free
      correct: false
      misconception_id: mc.phy.o.renewable_cheap_to_build
      feedback: Wind, sunlight and water cost nothing, but turbines, panels and dams cost a lot to build. Their running costs are low, not their building costs.
    - id: B
      text: The wind farm gives a steadier output
      correct: false
      misconception_id: mc.phy.o.renewables_always_available
      feedback: Solar panels give nothing at night and wind turbines stop in calm weather. Many renewables are not reliable on their own.
    - id: C
      text: The wind farm costs more to build but needs no fuel
      correct: true
    - id: D
      text: The gas station is renewable because new gas is forming
      correct: false
      misconception_id: mc.phy.o.plentiful_seen_as_renewable
      feedback: Coal takes millions of years to form, so once burned it is gone for any useful time. A renewable resource is replaced as fast as we use it.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Read each option and decide whether it is really true for this resource.
  - rung: 2
    name: concept
    text:
      en: Building costs and running costs are different things.
  - rung: 3
    name: first_step
    text:
      en: Renewable means replaced as fast as we use it; reliable means there when we need it. Neither tells you the cost or the effects on the environment.
  - rung: 4
    name: worked_step
    text:
      en: Rule out each option that mixes these ideas up or gets the original source of the energy wrong.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The wind farm costs more to build but needs no fuel.'
  misconception_ids:
  - mc.phy.o.plentiful_seen_as_renewable
  - mc.phy.o.renewable_cheap_to_build
  - mc.phy.o.renewables_always_available
solution:
  steps:
  - n: 1
    latex: \text{The wind farm costs more to build but needs no fuel}
    reason: Compare renewability, reliability, cost and effects
