stem: The current in a small electric motor is 0.75 A for 10 minutes.
parts:
- id: a
  prompt: Calculate the charge that flows.
  marks: 2
  answer:
    kind: numeric
    value: '450'
    unit: C
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0019_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A current is the charge that flows each second.
  - rung: 2
    name: concept
    text:
      en: Q = I × t, with I in amps and t in seconds.
  - rung: 3
    name: first_step
    text:
      en: First change the time into seconds.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 0.75 A by 600 s.
  - rung: 5
    name: full_step
    text:
      en: Q = 0.75 × 600 = 450 C.
  misconception_ids:
  - mc.phy.o.minutes_used_as_seconds
  - mc.phy.o.charge_current_divided_by_time
solution:
  steps:
  - n: 1
    latex: t = 10\ \text{min} = 600\ \text{s}
    reason: Sixty seconds in each minute
    check_id: chk_build_phy_elq_0019_ts
  - n: 2
    latex: Q = I t = 0.75 \times 600 = 450\ \text{C}
    reason: Charge = current × time
    check_id: chk_build_phy_elq_0019_ans
