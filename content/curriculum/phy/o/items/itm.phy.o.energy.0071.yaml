stem: A team pushes a broken-down car along a road. The force does 7.5 kJ of work while moving it 5 m in the direction of the force.
parts:
- id: a
  prompt: Calculate the size of the force, in newtons.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 1.5 N
      correct: false
      misconception_id: mc.phy.o.energy_kilo_prefix_ignored
      feedback: Kilo means a thousand. Change every kilo value to the base unit first, then change the answer to the unit the question asks for.
    - id: B
      text: 37500 N
      correct: false
      misconception_id: mc.phy.o.energy_formula_operation_swapped
      feedback: 'Write the formula, then undo each step: what is multiplied moves across as a division, and what is divided moves across as a multiplication.'
    - id: C
      text: 0.000667 N
      correct: false
      misconception_id: mc.phy.o.energy_formula_inverted
      feedback: 'Power is energy per second, so energy goes on top. Check the units of the answer: J ÷ s is a watt, s ÷ J is not.'
    - id: D
      text: 1500 N
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: You know the work and the distance; the force is the unknown.
  - rung: 2
    name: concept
    text:
      en: Rearrange W = F × d to get F = W ÷ d, with W in joules.
  - rung: 3
    name: first_step
    text:
      en: 7.5 kJ = 7500 J.
  - rung: 4
    name: worked_step
    text:
      en: Work out 7500 ÷ 5.
  - rung: 5
    name: full_step
    text:
      en: The force is 1500 N.
  misconception_ids:
  - mc.phy.o.energy_formula_inverted
  - mc.phy.o.energy_formula_operation_swapped
  - mc.phy.o.energy_kilo_prefix_ignored
solution:
  steps:
  - n: 1
    latex: W = 7.5\ \text{kJ} = 7500\ \text{J}
    reason: Work in joules
    check_id: chk_build_phy_nrg_0071_wj
  - n: 2
    latex: F = \frac{W}{d} = \frac{7500}{5} = 1500\ \text{N}
    reason: Rearrange W = Fd
    check_id: chk_build_phy_nrg_0071_ans
