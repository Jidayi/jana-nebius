id: itm.phy.o.electrical_quantities.0009
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.electric_charge
stem: A plastic comb is pulled through dry hair and the comb becomes negative.
parts:
- id: a
  prompt: What is the charge on the hair?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Negative, the same as the comb
      correct: false
      misconception_id: mc.phy.o.rubbed_pair_same_charge
      feedback: 'If the rod gains some electrons, the cloth has lost exactly those electrons: the rod is negative and the cloth is positive by the same amount.'
    - id: B
      text: Positive, equal in size to the comb's charge
      correct: true
    - id: C
      text: Zero, as all the charge was made on the comb
      correct: false
      misconception_id: mc.phy.o.charge_created_by_rubbing
      feedback: Rubbing makes no new charge. Electrons move from one object to the other, so one becomes negative and the other positive.
    - id: D
      text: Positive, because protons moved from the comb to the hair
      correct: false
      misconception_id: mc.phy.o.protons_move_in_charging
      feedback: 'Protons are held in the nuclei of atoms and cannot move. Rubbing moves electrons: losing them leaves an object positive.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about which particles can move and what charge they carry.
  - rung: 2
    name: concept
    text:
      en: Rubbing moves tiny negative particles from one object to the other. Like charges repel and unlike charges attract.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: The electrons the comb gained came from the hair, which is left short of exactly that many electrons.
  - rung: 5
    name: full_step
    text:
      en: Positive, equal in size to the comb's charge. The electrons the comb gained came from the hair, which is left short of exactly that many electrons.
  misconception_ids:
  - mc.phy.o.charge_created_by_rubbing
  - mc.phy.o.protons_move_in_charging
  - mc.phy.o.rubbed_pair_same_charge
solution:
  steps:
  - n: 1
    latex: \text{Positive, equal in size to the comb's charge}
    reason: Electrons move; like charges repel
