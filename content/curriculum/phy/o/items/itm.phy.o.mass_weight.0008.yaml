id: itm.phy.o.mass_weight.0008
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.mass_weight.weight_from_mass
stem: On the Moon, where g = 1.6 N/kg, a newton meter shows that a crate of supplies has a weight of 128 N.
parts:
- id: a
  prompt: Calculate the mass of the crate of supplies.
  marks: 2
  answer:
    kind: numeric
    value: '80'
    unit: kg
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mwt_0008_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A newton meter measures weight, which is a force.
  - rung: 2
    name: concept
    text:
      en: Weight = mass × g, so mass = weight ÷ g.
  - rung: 3
    name: first_step
    text:
      en: Use the g for the Moon, where the weight was measured.
  - rung: 4
    name: worked_step
    text:
      en: Work out 128 ÷ 1.6.
  - rung: 5
    name: full_step
    text:
      en: The mass is 80 kg.
  misconception_ids:
  - mc.phy.o.weight_mass_divided_by_g
  - mc.phy.o.weight_given_as_mass_number
  - mc.phy.o.planet_g_mismatched
solution:
  steps:
  - n: 1
    latex: m = \frac{W}{g} = \frac{128}{1.6} = 80\ \text{kg}
    reason: Rearrange weight = mass × g
    check_id: chk_build_phy_mwt_0008_ans
