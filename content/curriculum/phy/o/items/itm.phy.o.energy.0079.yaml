stem: A heater has a power of 750 W.
parts:
- id: a
  prompt: How long does it take to transfer 15 kJ of energy?
  marks: 2
  answer:
    kind: numeric
    value: '20'
    unit: s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_nrg_0079_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You know the power and the energy; the time is the unknown.
  - rung: 2
    name: concept
    text:
      en: Rearrange P = E ÷ t to get t = E ÷ P, with E in joules.
  - rung: 3
    name: first_step
    text:
      en: 15 kJ = 15000 J.
  - rung: 4
    name: worked_step
    text:
      en: Work out 15000 ÷ 750.
  - rung: 5
    name: full_step
    text:
      en: It takes 20 s.
  misconception_ids:
  - mc.phy.o.energy_formula_operation_swapped
  - mc.phy.o.energy_formula_inverted
  - mc.phy.o.energy_kilo_prefix_ignored
solution:
  steps:
  - n: 1
    latex: E = 15\ \text{kJ} = 15000\ \text{J}
    reason: Energy in joules
    check_id: chk_build_phy_nrg_0079_ej
  - n: 2
    latex: t = \frac{E}{P} = \frac{15000}{750} = 20\ \text{s}
    reason: Rearrange P = E/t
    check_id: chk_build_phy_nrg_0079_ans
