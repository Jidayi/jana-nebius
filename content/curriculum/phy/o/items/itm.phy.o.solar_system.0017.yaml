id: itm.phy.o.solar_system.0017
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.solar_system.orbital_speed
stem: A weather satellite in a polar orbit orbits 850 km above the Earth's surface and goes round once every 102 minutes. The Earth's radius is 6400 km.
parts:
- id: a
  prompt: Calculate its orbital speed in km/s.
  marks: 3
  answer:
    kind: numeric
    value: '7.44'
    unit: km/s
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_sol_0017_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The satellite circles the centre of the Earth, not its surface.
  - rung: 2
    name: concept
    text:
      en: Orbit radius = Earth's radius + height; then v = 2πr ÷ T.
  - rung: 3
    name: first_step
    text:
      en: Put the period in seconds so the speed comes out in km/s.
  - rung: 4
    name: worked_step
    text:
      en: r = 7250 km and T = 6120 s.
  - rung: 5
    name: full_step
    text:
      en: The orbital speed is 7.44 km/s.
  misconception_ids:
  - mc.phy.o.orbit_radius_altitude_only
  - mc.phy.o.orbit_speed_no_two_pi
  - mc.phy.o.orbit_period_not_in_seconds
solution:
  steps:
  - n: 1
    latex: r = 6400 + 850 = 7250\ \text{km}
    reason: Measured from the Earth's centre
    check_id: chk_build_phy_sol_0017_rad
  - n: 2
    latex: T = 102\ \text{minutes} = 6120\ \text{s}
    reason: Period in seconds
    check_id: chk_build_phy_sol_0017_ts
  - n: 3
    latex: v = \frac{2\pi \times 7250}{6120} = 7.44\ \text{km/s}
    reason: v = 2πr / T
    check_id: chk_build_phy_sol_0017_ans
difficulty:
  prior: 0.4
  band: core
estimated_seconds: 120
