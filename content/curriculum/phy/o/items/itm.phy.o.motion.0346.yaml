id: itm.phy.o.motion.0346
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.motion.velocity_time_gradient
stem: A straight velocity-time graph for a scooter passes through (4 s, 6 m/s) and (10 s, 20 m/s).
parts:
- id: a
  prompt: Find the scooter's acceleration.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 2 m/s²
      correct: false
      misconception_id: mc.phy.o.vt_gradient_from_one_point
      feedback: Use the change in velocity over the change in time between two points.
    - id: B
      text: 20 m/s²
      correct: false
      misconception_id: mc.phy.o.vt_gradient_read_as_velocity
      feedback: On a velocity-time graph the height is the velocity; the slope is the acceleration.
    - id: C
      text: 2.33 m/s²
      correct: true
    - id: D
      text: 0.429 m/s²
      correct: false
      misconception_id: mc.phy.o.gradient_axes_swapped
      feedback: The gradient is the change up the graph (distance) divided by the change along it (time).
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: On a velocity-time graph the gradient is the acceleration.
  - rung: 2
    name: concept
    text:
      en: Gradient = change in velocity ÷ change in time.
  - rung: 3
    name: first_step
    text:
      en: Use two points on the line, not one.
  - rung: 4
    name: worked_step
    text:
      en: The velocity changes by 14 m/s in 6 s.
  - rung: 5
    name: full_step
    text:
      en: The acceleration is 2.33 m/s².
  misconception_ids:
  - mc.phy.o.gradient_axes_swapped
  - mc.phy.o.vt_gradient_from_one_point
  - mc.phy.o.vt_gradient_read_as_velocity
solution:
  steps:
  - n: 1
    latex: \Delta v = 20 - 6 = 14,\ \Delta t = 10 - 4 = 6
    reason: Changes between two points
    check_id: chk_build_phy_mot_0346_dv
  - n: 2
    latex: a = \frac{14}{6} = 2.33\ \text{m/s}^2
    reason: Gradient of a velocity-time graph
    check_id: chk_build_phy_mot_0346_ans
