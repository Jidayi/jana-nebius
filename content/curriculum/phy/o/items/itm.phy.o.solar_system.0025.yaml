id: itm.phy.o.solar_system.0025
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.solar_system.orbital_speed
stem: Uranus orbits the Sun at 19.2 AU and takes 84 years to go round once. Take 1 AU = 1.5 × 10⁸ km and 1 year = 365 days.
parts:
- id: a
  prompt: Calculate the average orbital speed of Uranus in km/s.
  marks: 3
  answer:
    kind: numeric
    value: '6.83'
    unit: km/s
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_sol_0025_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Change the radius into kilometres and the period into seconds first.
  - rung: 2
    name: concept
    text:
      en: Orbital speed v = 2πr ÷ T.
  - rung: 3
    name: first_step
    text:
      en: r = 19.2 × 1.5 × 10⁸ km, and T is 84 × 365 days.
  - rung: 4
    name: worked_step
    text:
      en: r = 2.88 × 10⁹ km and T = 2649024000 s.
  - rung: 5
    name: full_step
    text:
      en: The orbital speed is 6.83 km/s.
  misconception_ids:
  - mc.phy.o.orbit_speed_no_two_pi
  - mc.phy.o.orbit_speed_pi_r_squared
  - mc.phy.o.orbit_period_not_in_seconds
solution:
  steps:
  - n: 1
    latex: r = 19.2 \times 1.5 \times 10^{8} = 2.88 \times 10^{9}\ \text{km}
    reason: AU to km
    check_id: chk_build_phy_sol_0025_rk_m
  - n: 2
    latex: T = 84 \times 365 = 30660\ \text{days}
    reason: Years to days
    check_id: chk_build_phy_sol_0025_tdays
  - n: 3
    latex: T = 30660\ \text{days} = 2649024000\ \text{s}
    reason: Days to seconds
    check_id: chk_build_phy_sol_0025_ts
  - n: 4
    latex: v = \frac{2\pi \times 2.88 \times 10^{9}}{2649024000} = 6.83\ \text{km/s}
    reason: v = 2πr / T
    check_id: chk_build_phy_sol_0025_ans
