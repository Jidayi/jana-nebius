id: itm.phy.o.electromagnetism.0013
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.electromagnetism.fields_of_currents
stem: An electromagnet must let go of a load of scrap steel when its current is switched off.
parts:
- id: a
  prompt: Which core should it have?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Steel
      correct: false
      misconception_id: mc.phy.o.soft_iron_steel_swapped
      feedback: Soft iron is magnetised easily and loses it as easily, which suits an electromagnet's core. Steel is harder to magnetise but keeps it, which suits a permanent magnet.
    - id: B
      text: Soft iron
      correct: true
    - id: C
      text: Copper
      correct: false
      misconception_id: mc.phy.o.nonmagnetic_materials_attracted
      feedback: 'Hold a magnet near an aluminium can or a copper coin: nothing happens. Only iron, steel, nickel and cobalt are attracted.'
    - id: D
      text: 'No core: the core makes no difference to the strength'
      correct: false
      misconception_id: mc.phy.o.electromagnet_factor_ignored
      feedback: 'Each turn adds its own field, and a bigger current makes each turn''s field stronger: more turns or more current lift more paper clips.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture the field lines round the wire or coil.
  - rung: 2
    name: concept
    text:
      en: A wire's field lines are circles round it, set by the right-hand grip rule; a coil's field is like a bar magnet's, and grows with the current, the number of turns and an iron core.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: The core must magnetise strongly while the current flows and lose its magnetism when it stops.
  - rung: 5
    name: full_step
    text:
      en: Soft iron. The core must magnetise strongly while the current flows and lose its magnetism when it stops.
  misconception_ids:
  - mc.phy.o.electromagnet_factor_ignored
  - mc.phy.o.nonmagnetic_materials_attracted
  - mc.phy.o.soft_iron_steel_swapped
solution:
  steps:
  - n: 1
    latex: \text{Soft iron}
    reason: Use the shape and direction of the field
