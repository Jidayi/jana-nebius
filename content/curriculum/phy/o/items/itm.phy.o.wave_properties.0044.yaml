id: itm.phy.o.wave_properties.0044
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.wave_properties.transverse_and_longitudinal
stem: Transverse and longitudinal waves are compared.
parts:
- id: a
  prompt: Which features belong to a longitudinal wave but not to a transverse wave?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Compressions and rarefactions
      correct: true
    - id: B
      text: Crests and troughs
      correct: false
      misconception_id: mc.phy.o.vibration_direction_swapped
      feedback: 'Shake a rope up and down: the vibration is across the direction of travel (transverse). Push a slinky back and forth: the vibration is along it (longitudinal).'
    - id: C
      text: A wavelength and a frequency
      correct: false
      misconception_id: mc.phy.o.only_transverse_has_wavelength
      feedback: 'A longitudinal wave also repeats: its wavelength is from one compression to the next, and it has a frequency and an amplitude too.'
    - id: D
      text: A long wavelength and a long range
      correct: false
      misconception_id: mc.phy.o.longitudinal_means_long
      feedback: 'The name describes the direction of the vibration: along the line the wave travels, not how far it goes.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture how one particle of the material moves as the wave goes past.
  - rung: 2
    name: concept
    text:
      en: Compare the direction of that movement with the direction the energy travels.
  - rung: 3
    name: first_step
    text:
      en: Vibrating at right angles to the travel is one kind of wave; vibrating along the travel is the other.
  - rung: 4
    name: worked_step
    text:
      en: Rule out any option that does not fit what the particles actually do.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Compressions and rarefactions.'
  misconception_ids:
  - mc.phy.o.longitudinal_means_long
  - mc.phy.o.only_transverse_has_wavelength
  - mc.phy.o.vibration_direction_swapped
solution:
  steps:
  - n: 1
    latex: \text{Compressions and rarefactions}
    reason: Compare the direction of vibration with the direction of travel
