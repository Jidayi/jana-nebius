id: itm.phy.o.thermal_properties.0027
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.specific_heat_capacity
stem: A 0.5 kg block of aluminium is heated by a 50 W heater for 5 minutes. Its temperature rises from 20 °C to 53.5 °C. Assume no energy is lost to the surroundings.
parts:
- id: a
  prompt: Find the specific heat capacity of the metal.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 561 J/(kg °C)
      correct: false
      misconception_id: mc.phy.o.shc_final_temperature_used
      feedback: 'Δθ means the change in temperature: final minus starting. Water warming from 20 °C to 30 °C rises by 10 °C, not 30 °C.'
    - id: B
      text: 14.9 J/(kg °C)
      correct: false
      misconception_id: mc.phy.o.heater_minutes_not_seconds
      feedback: A watt is a joule per second, so the time must be in seconds. Multiply minutes by 60 before using E = Pt.
    - id: C
      text: 1005000 J/(kg °C)
      correct: false
      misconception_id: mc.phy.o.shc_rearranged_wrongly
      feedback: 'To find c, divide the energy by both the mass and the temperature change: c = E ÷ (m × Δθ). Put brackets round m × Δθ on a calculator.'
    - id: D
      text: 896 J/(kg °C)
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: All the energy from the heater goes into warming the block.
  - rung: 2
    name: concept
    text:
      en: Find the energy with E = Pt, using the time in seconds.
  - rung: 3
    name: first_step
    text:
      en: Then rearrange E = mcΔθ to c = E ÷ (mΔθ).
  - rung: 4
    name: worked_step
    text:
      en: Divide 15000 J by the mass times the temperature rise of 33.5 °C.
  - rung: 5
    name: full_step
    text:
      en: c = 896 J/(kg °C).
  misconception_ids:
  - mc.phy.o.heater_minutes_not_seconds
  - mc.phy.o.shc_final_temperature_used
  - mc.phy.o.shc_rearranged_wrongly
solution:
  steps:
  - n: 1
    latex: t = 5\ \text{min} = 300\ \text{s}
    reason: A watt is a joule per second
    check_id: chk_build_phy_thp_0027_ts
  - n: 2
    latex: E = Pt = 50 \times 300 = 15000\ \text{J}
    reason: Energy from the heater
    check_id: chk_build_phy_thp_0027_e
  - n: 3
    latex: \Delta\theta = 53.5 - 20 = 33.5\ ^\circ\text{C}
    reason: The temperature rise
    check_id: chk_build_phy_thp_0027_dt
  - n: 4
    latex: c = \frac{E}{m\Delta\theta} = \frac{15000}{0.5 \times 33.5} = 896\ \text{J/(kg °C)}
    reason: Rearrange E = mcΔθ
    check_id: chk_build_phy_thp_0027_ans
