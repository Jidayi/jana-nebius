id: itm.phy.o.circuits.0061
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.circuit_components
stem: A thermistor is connected in series with a 500 Ω resistor and a 9 V battery. The thermistor's resistance is 250 Ω at one of two temperatures, 10 °C and 70 °C, and 4000 Ω at the other.
parts:
- id: a
  prompt: Calculate the current in the circuit at 70 °C.
  marks: 2
  answer:
    kind: numeric
    value: '0.012'
    unit: A
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_cir_0061_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: First decide which resistance goes with that temperature.
  - rung: 2
    name: concept
    text:
      en: A thermistor's resistance falls as its temperature rises.
  - rung: 3
    name: first_step
    text:
      en: So the sensor's resistance is 250 Ω; add the 500 Ω resistor in series.
  - rung: 4
    name: worked_step
    text:
      en: The total is 750 Ω; divide 9 V by it.
  - rung: 5
    name: full_step
    text:
      en: The current is 0.012 A.
  misconception_ids:
  - mc.phy.o.thermistor_resistance_rises_with_heat
  - mc.phy.o.circuit_current_r_over_v
solution:
  steps:
  - n: 1
    latex: R_{\text{sensor}} = 250\ \Omega
    reason: Warmer means lower resistance
  - n: 2
    latex: R = 250 + 500 = 750\ \Omega
    reason: Series resistances add
    check_id: chk_build_phy_cir_0061_rt
  - n: 3
    latex: I = \frac{9}{750} = 0.012\ \text{A}
    reason: Ohm's law
    check_id: chk_build_phy_cir_0061_ans
