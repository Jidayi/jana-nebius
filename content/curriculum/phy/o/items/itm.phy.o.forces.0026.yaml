id: itm.phy.o.forces.0026
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.force_mass_acceleration
stem: The water resistance on a boat of total mass 600 kg is 300 N.
parts:
- id: a
  prompt: Find the driving force needed to give it an acceleration of 1.2 m/s².
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 720 N
      correct: false
      misconception_id: mc.phy.o.fma_applied_force_not_resultant
      feedback: The F in F = ma is the resultant force. Take the forces acting against the motion away from the driving force first.
    - id: B
      text: 420 N
      correct: false
      misconception_id: mc.phy.o.rearrange_sign_error
      feedback: 'Undo each step in turn: what was added on one side is subtracted from both.'
    - id: C
      text: 1020 N
      correct: true
    - id: D
      text: 7356 N
      correct: false
      misconception_id: mc.phy.o.fma_mixed_with_weight
      feedback: g belongs in weight = mg, the pull of gravity. When a horizontal push accelerates a trolley, use F = ma with the trolley's acceleration and leave g out.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The resultant force is the driving force minus the resistive force.
  - rung: 2
    name: concept
    text:
      en: Find the resultant force needed with F = ma first.
  - rung: 3
    name: first_step
    text:
      en: The driving force must give that resultant and also balance the water resistance.
  - rung: 4
    name: worked_step
    text:
      en: The resultant force needed is 720 N.
  - rung: 5
    name: full_step
    text:
      en: Driving force = 720 + 300 = 1020 N.
  misconception_ids:
  - mc.phy.o.fma_applied_force_not_resultant
  - mc.phy.o.fma_mixed_with_weight
  - mc.phy.o.rearrange_sign_error
solution:
  steps:
  - n: 1
    latex: F = ma = 600 \times 1.2 = 720\ \text{N}
    reason: The resultant force needed
    check_id: chk_build_phy_frc_0026_ma
  - n: 2
    latex: \text{driving force} = 720 + 300 = 1020\ \text{N}
    reason: It must also overcome the water resistance
    check_id: chk_build_phy_frc_0026_ans
