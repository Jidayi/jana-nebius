id: itm.phy.o.pressure.0014
version: 0.1.1
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.pressure_on_surfaces
stem: A student standing on both feet has a mass of 45 kg. The total area in contact with the ground is 0.05 m². Take g = 10 N/kg.
parts:
- id: a
  prompt: Calculate the pressure on the ground, in Pa.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 900 Pa
      correct: false
      misconception_id: mc.phy.o.pressure_mass_used_as_force
      feedback: 'The force pressing on the ground is the weight, in newtons: weight = mass × g. Work out the weight before dividing by the area.'
    - id: B
      text: 22.5 Pa
      correct: false
      misconception_id: mc.phy.o.pressure_force_times_area
      feedback: 'Pressure is the force on each square metre: force ÷ area. Spreading a force over a bigger area must give a smaller pressure, which multiplying by the area cannot do.'
    - id: C
      text: 9000 Pa
      correct: true
    - id: D
      text: 0.000111 Pa
      correct: false
      misconception_id: mc.phy.o.pressure_area_over_force
      feedback: 'Pressure is measured in newtons per square metre, so the force goes on top: pressure = force ÷ area.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The force pressing on the ground is a weight, measured in newtons.
  - rung: 2
    name: concept
    text:
      en: Find the weight first (mass × g), then divide it by the area.
  - rung: 3
    name: first_step
    text:
      en: The weight is 45 × 10 N.
  - rung: 4
    name: worked_step
    text:
      en: The weight is 450 N; divide it by 0.05 m².
  - rung: 5
    name: full_step
    text:
      en: The pressure is 9000 Pa.
  misconception_ids:
  - mc.phy.o.pressure_area_over_force
  - mc.phy.o.pressure_force_times_area
  - mc.phy.o.pressure_mass_used_as_force
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: F = mg = 45 \times 10 = 450\ \text{N}
    reason: The force is the weight
    check_id: chk_build_phy_prs_0014_f
  - n: 2
    latex: p = \frac{450}{0.05} = 9000\ \text{Pa}
    reason: Pressure = force ÷ area
    check_id: chk_build_phy_prs_0014_ans
