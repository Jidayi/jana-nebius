id: itm.phy.o.momentum.0022
version: 0.1.2
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.momentum.conservation_of_momentum
stem: A spring launcher of mass 3 kg sits on a smooth track. It pushes out a ball of mass 0.2 kg at 30 m/s. Everything starts at rest. Take the direction in which the ball moves as positive.
parts:
- id: a
  prompt: Find the velocity of the launcher just afterwards.
  marks: 3
  answer:
    kind: numeric
    value: '-2'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mom_0022_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: What was the total momentum before?
  - rung: 2
    name: concept
    text:
      en: The total momentum before is zero, so afterwards the two momenta must cancel.
  - rung: 3
    name: first_step
    text:
      en: The momentum of the launcher is equal in size and opposite in sign to the momentum of the ball.
  - rung: 4
    name: worked_step
    text:
      en: The ball has momentum 6 kg m/s, so the launcher has the same size of momentum, negative.
  - rung: 5
    name: full_step
    text:
      en: 'V = −6 ÷ 3 = -2 m/s: the launcher moves backwards.'
  misconception_ids:
  - mc.phy.o.recoil_sign_dropped
  - mc.phy.o.recoil_equal_speeds
  - mc.phy.o.conservation_masses_swapped
solution:
  steps:
  - n: 1
    latex: p_\text{before} = 0
    reason: Everything starts at rest
  - n: 2
    latex: 0.2 \times 30 = 6\ \text{kg m/s}
    reason: Momentum of the ball
    check_id: chk_build_phy_mom_0022_pf
  - n: 3
    latex: 0 = 6 + 3V \Rightarrow V = -2\ \text{m/s}
    reason: Total momentum stays zero
    check_id: chk_build_phy_mom_0022_ans
