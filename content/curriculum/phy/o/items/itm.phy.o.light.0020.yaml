stem: A ray of light passes from air into a plastic block. The angle of incidence is 55° and the angle of refraction is 34°.
parts:
- id: a
  prompt: Calculate the refractive index of the material.
  marks: 2
  answer:
    kind: numeric
    value: '1.46'
    unit: null
    unit_policy: none
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_lgt_0020_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which angle is in air and which is in the material?
  - rung: 2
    name: concept
    text:
      en: Refractive index n = sin i ÷ sin r, with i in air and r in the material.
  - rung: 3
    name: first_step
    text:
      en: Find sin 55° and sin 34°.
  - rung: 4
    name: worked_step
    text:
      en: sin i = 0.819 and sin r = 0.559; divide the first by the second.
  - rung: 5
    name: full_step
    text:
      en: The refractive index is 1.46.
  misconception_ids:
