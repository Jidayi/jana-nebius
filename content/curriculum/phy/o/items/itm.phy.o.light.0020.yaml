solution:
  steps:
  - n: 1
    latex: \sin 55^\circ = 0.819
    reason: Sine of the angle in air
    check_id: chk_build_phy_lgt_0020_si
  - n: 2
    latex: \sin 34^\circ = 0.559
    reason: Sine of the angle in the material
    check_id: chk_build_phy_lgt_0020_sr
  - n: 3
    latex: n = \frac{\sin 55^\circ}{\sin 34^\circ} = 1.46
    reason: n = sin i / sin r
    check_id: chk_build_phy_lgt_0020_ans
