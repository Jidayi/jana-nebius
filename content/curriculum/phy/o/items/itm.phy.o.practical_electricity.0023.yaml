stem: A plug-in energy meter shows that a ceiling fan transferred 10.8 MJ (10800000 J) of energy in a week.
parts:
- id: a
  prompt: Write this energy in kilowatt-hours.
  marks: 1
  answer:
    kind: numeric
    value: '3'
    unit: kWh
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_pel_0023_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A kilowatt-hour is a much bigger unit than a joule.
  - rung: 2
    name: concept
    text:
      en: 1 kWh is the energy of 1 kW for one hour, which is 3600000 J.
  - rung: 3
    name: first_step
    text:
      en: To change joules into kWh, divide by the number of joules in one kWh.
  - rung: 4
    name: worked_step
    text:
      en: Work out 10800000 ÷ 3600000.
  - rung: 5
    name: full_step
    text:
      en: The energy is 3 kWh.
  misconception_ids:
  - mc.phy.o.kwh_joules_divided_by_1000
  - mc.phy.o.kwh_divided_by_3600_only
  - mc.phy.o.kwh_conversion_multiplied
solution:
  steps:
  - n: 1
    latex: 1\ \text{kWh} = 3600000\ \text{J}
    reason: 1 kW for 1 hour
  - n: 2
    latex: E = \frac{10800000}{3600000} = 3\ \text{kWh}
    reason: Divide by joules per kWh
    check_id: chk_build_phy_pel_0023_ans
