stem: A dusting cloth rubs a plastic tray, and dust is then attracted to the tray.
parts:
- id: a
  prompt: The tray is now positive. What did the rubbing do?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It moved electrons from the cloth to the tray
      correct: false
      misconception_id: mc.phy.o.electron_gain_sign_reversed
      feedback: Electrons are negative. Gaining them makes an object negative; losing them leaves it positive.
    - id: B
      text: It moved protons from the cloth to the tray
      correct: false
      misconception_id: mc.phy.o.protons_move_in_charging
      feedback: 'Protons are held in the nuclei of atoms and cannot move. Rubbing moves electrons: losing them leaves an object positive.'
    - id: C
      text: It made positive charge appear on the tray
      correct: false
      misconception_id: mc.phy.o.charge_created_by_rubbing
      feedback: Rubbing makes no new charge. Electrons move from one object to the other, so one becomes negative and the other positive.
    - id: D
      text: It moved electrons from the tray to the cloth
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about which particles can move and what charge they carry.
  - rung: 2
    name: concept
    text:
      en: Rubbing moves tiny negative particles from one object to the other. Like charges repel and unlike charges attract.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: A positive object has lost electrons.
  - rung: 5
    name: full_step
    text:
      en: It moved electrons from the tray to the cloth. A positive object has lost electrons.
  misconception_ids:
  - mc.phy.o.charge_created_by_rubbing
  - mc.phy.o.electron_gain_sign_reversed
  - mc.phy.o.protons_move_in_charging
