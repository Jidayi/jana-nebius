    latex: \Delta E_p = 70 \times 10 \times 90 = 63000\ \text{J}
    reason: ΔEp = mgΔh
    check_id: chk_build_phy_nrg_0036_ej
  - n: 2
    latex: 63000\ \text{J} = 63\ \text{kJ}
    reason: A kilojoule is a thousand joules
