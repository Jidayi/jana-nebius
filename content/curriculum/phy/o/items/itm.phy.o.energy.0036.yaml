stem: Yaw, of mass 70 kg, climbs the stairs of a tall tower and rises 90 m. Take g = 10 N/kg.
parts:
- id: a
  prompt: Calculate the gain in Yaw's gravitational potential energy in kJ.
  marks: 2
  answer:
    kind: numeric
    value: '63'
    unit: kJ
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_nrg_0036_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Climbing fills the gravitational potential store.
  - rung: 2
    name: concept
    text:
      en: Use ΔEp = mgΔh, then change joules to kilojoules.
  - rung: 3
    name: first_step
    text:
      en: Work out 70 × 10 × 90 in joules.
  - rung: 4
    name: worked_step
    text:
      en: That is 63000 J; now divide by a thousand.
  - rung: 5
    name: full_step
    text:
      en: The gain is 63 kJ.
  misconception_ids:
