id: itm.phy.o.thermal_properties.0026
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.specific_heat_capacity
stem: 400 g of sea water is heated from 18 °C to 50 °C. The specific heat capacity of sea water is 3900 J/(kg °C).
parts:
- id: a
  prompt: How much energy is needed? Give your answer in kJ.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 78 kJ
      correct: false
      misconception_id: mc.phy.o.shc_final_temperature_used
      feedback: 'Δθ means the change in temperature: final minus starting. Water warming from 20 °C to 30 °C rises by 10 °C, not 30 °C.'
    - id: B
      text: 475.8 kJ
      correct: false
      misconception_id: mc.phy.o.kelvin_change_offset_added
      feedback: 'Warming from 20 °C to 30 °C is warming from 293 K to 303 K: a change of 10 on both scales. Only readings need 273 added, never changes.'
    - id: C
      text: 49.92 kJ
      correct: true
    - id: D
      text: 49920 kJ
      correct: false
      misconception_id: mc.phy.o.thermal_grams_as_kg
      feedback: 'Specific heat capacity and specific latent heat are per kilogram. Change grams to kilograms first: 250 g is 0.25 kg.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Use E = mcΔθ, with the mass in kilograms and Δθ the temperature rise.
  - rung: 2
    name: concept
    text:
      en: Specific heat capacity is the energy needed to warm 1 kg by 1 °C.
  - rung: 3
    name: first_step
    text:
      en: Change 400 g to kilograms and find the temperature rise from 18 °C to 50 °C.
  - rung: 4
    name: worked_step
    text:
      en: Work out 0.4 × 3900 × 32 to get joules, then change to kilojoules.
  - rung: 5
    name: full_step
    text:
      en: E = 49.92 kJ.
  misconception_ids:
  - mc.phy.o.kelvin_change_offset_added
  - mc.phy.o.shc_final_temperature_used
  - mc.phy.o.thermal_grams_as_kg
solution:
  steps:
  - n: 1
    latex: m = 400\ \text{g} = 0.4\ \text{kg}
    reason: Specific heat capacity is per kilogram
    check_id: chk_build_phy_thp_0026_m
  - n: 2
    latex: \Delta\theta = 50 - 18 = 32\ ^\circ\text{C}
    reason: The temperature rise
    check_id: chk_build_phy_thp_0026_dt
  - n: 3
    latex: E = mc\Delta\theta = 0.4 \times 3900 \times 32 = 49920\ \text{J}
    reason: Energy needed
    check_id: chk_build_phy_thp_0026_e
  - n: 4
    latex: E = 49.92\ \text{kJ}
    reason: There are a thousand joules in a kilojoule
    check_id: chk_build_phy_thp_0026_ans
