stem: The coil of an a.c. generator turns 600 times every minute.
parts:
- id: a
  prompt: Find the frequency of the alternating e.m.f. it produces.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 600 Hz
      correct: false
      misconception_id: mc.phy.o.ac_frequency_is_rpm
      feedback: Hertz means cycles per second. A coil turning 3000 times a minute turns 50 times a second.
    - id: B
      text: 20 Hz
      correct: false
      misconception_id: mc.phy.o.ac_two_cycles_per_turn
      feedback: 'In one turn the e.m.f. rises to a peak, falls, reaches a peak the other way and returns: that is one cycle.'
    - id: C
      text: 10 Hz
      correct: true
    - id: D
      text: 36000 Hz
      correct: false
      misconception_id: mc.phy.o.rpm_times_sixty
      feedback: Sixty turns a minute is one turn a second, so divide a rate per minute by sixty to get the rate per second.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Frequency is the number of cycles each second.
  - rung: 2
    name: concept
    text:
      en: Each turn of the coil gives one complete cycle of e.m.f.
  - rung: 3
    name: first_step
    text:
      en: Change turns per minute into turns per second.
  - rung: 4
    name: worked_step
    text:
      en: Divide 600 by the number of seconds in a minute.
  - rung: 5
    name: full_step
    text:
      en: 600 turns a minute is 10 turns a second, so f = 10 Hz.
  misconception_ids:
  - mc.phy.o.ac_frequency_is_rpm
  - mc.phy.o.ac_two_cycles_per_turn
  - mc.phy.o.rpm_times_sixty
solution:
  steps:
  - n: 1
    latex: \text{one turn} = \text{one cycle}
    reason: Each turn gives one full cycle
  - n: 2
    latex: f = 10\ \text{Hz}
    reason: Turns per minute ÷ sixty = cycles per second
    check_id: chk_build_phy_emg_0042_ans
