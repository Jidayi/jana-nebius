    text:
      en: The sound travels along the rail once, from one end to the other.
  - rung: 2
    name: concept
    text:
      en: Speed = distance ÷ time.
  - rung: 3
    name: first_step
    text:
      en: The distance is 750 m and the time is 0.15 s.
  - rung: 4
    name: worked_step
    text:
      en: Work out 750 ÷ 0.15.
  - rung: 5
    name: full_step
    text:
      en: v = 5000 m/s, much faster than in air.
  misconception_ids:
