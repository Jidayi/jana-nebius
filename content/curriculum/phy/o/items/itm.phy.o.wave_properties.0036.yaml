id: itm.phy.o.wave_properties.0036
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.wave_properties.transverse_and_longitudinal
stem: Sound is called a longitudinal wave.
parts:
- id: a
  prompt: What does 'longitudinal' tell you about it?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The particles vibrate along the direction the wave travels
      correct: true
    - id: B
      text: The wave can travel a very long distance
      correct: false
      misconception_id: mc.phy.o.longitudinal_means_long
      feedback: 'The name describes the direction of the vibration: along the line the wave travels, not how far it goes.'
    - id: C
      text: The particles vibrate at right angles to the direction of travel
      correct: false
      misconception_id: mc.phy.o.vibration_direction_swapped
      feedback: 'Shake a rope up and down: the vibration is across the direction of travel (transverse). Push a slinky back and forth: the vibration is along it (longitudinal).'
    - id: D
      text: The particles travel with the wave from source to listener
      correct: false
      misconception_id: mc.phy.o.wave_carries_medium
      feedback: A floating leaf bobs up and down as ripples pass but stays in the same place. Waves carry energy, not the material they travel through.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture how one particle of the material moves as the wave goes past.
  - rung: 2
    name: concept
    text:
      en: Compare the direction of that movement with the direction the energy travels.
  - rung: 3
    name: first_step
    text:
      en: Vibrating at right angles to the travel is one kind of wave; vibrating along the travel is the other.
  - rung: 4
    name: worked_step
    text:
      en: Rule out any option that does not fit what the particles actually do.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The particles vibrate along the direction the wave travels.'
  misconception_ids:
  - mc.phy.o.longitudinal_means_long
  - mc.phy.o.vibration_direction_swapped
  - mc.phy.o.wave_carries_medium
solution:
  steps:
  - n: 1
    latex: \text{The particles vibrate along the direction the wave travels}
    reason: Compare the direction of vibration with the direction of travel
