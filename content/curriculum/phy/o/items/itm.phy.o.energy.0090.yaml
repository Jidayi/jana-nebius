id: itm.phy.o.energy.0090
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.power
stem: A motor with a power of 1.5 kW is switched on for 10 minutes.
parts:
- id: a
  prompt: Calculate the energy it transfers, in kJ.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 15 kJ
      correct: false
      misconception_id: mc.phy.o.power_minutes_not_converted
      feedback: A watt is a joule per second. Change minutes to seconds (sixty seconds in each minute) before you divide or multiply.
    - id: B
      text: 0.0025 kJ
      correct: false
      misconception_id: mc.phy.o.energy_formula_operation_swapped
      feedback: 'Write the formula, then undo each step: what is multiplied moves across as a division, and what is divided moves across as a multiplication.'
    - id: C
      text: 900 kJ
      correct: true
    - id: D
      text: 900000 kJ
      correct: false
      misconception_id: mc.phy.o.energy_kilo_prefix_ignored
      feedback: Kilo means a thousand. Change every kilo value to the base unit first, then change the answer to the unit the question asks for.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Power is energy per second, so energy = power × time.
  - rung: 2
    name: concept
    text:
      en: Use E = P × t with the time in seconds; kW × s gives kJ.
  - rung: 3
    name: first_step
    text:
      en: 10 minutes = 600 s.
  - rung: 4
    name: worked_step
    text:
      en: Work out 1.5 × 600.
  - rung: 5
    name: full_step
    text:
      en: The energy transferred is 900 kJ.
  misconception_ids:
  - mc.phy.o.energy_formula_operation_swapped
  - mc.phy.o.energy_kilo_prefix_ignored
  - mc.phy.o.power_minutes_not_converted
solution:
  steps:
  - n: 1
    latex: t = 10\ \text{min} = 600\ \text{s}
    reason: Time in seconds
    check_id: chk_build_phy_nrg_0090_ts
  - n: 2
    latex: E = Pt = 1.5\ \text{kW} \times 600\ \text{s} = 900\ \text{kJ}
    reason: kW × s gives kJ
    check_id: chk_build_phy_nrg_0090_ans
