id: itm.phy.o.em_spectrum.0021
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.em_spectrum.em_wave_calculations
stem: An FM radio station broadcasts on a frequency of 102.5 MHz.
parts:
- id: a
  prompt: Calculate the wavelength of its radio waves.
  marks: 2
  answer:
    kind: numeric
    value: '2.93'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_ems_0021_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Which equation links the speed, frequency and wavelength of a wave?
  - rung: 2
    name: concept
    text:
      en: Every electromagnetic wave travels at c = 3.0 × 10⁸ m/s, and c = f × λ, so λ = c ÷ f.
  - rung: 3
    name: first_step
    text:
      en: 'Write the frequency in hertz: 102.5 MHz = 102.5 × 10⁶ Hz.'
  - rung: 4
    name: worked_step
    text:
      en: λ = 3.0 × 10⁸ ÷ (102.5 × 10⁶).
  - rung: 5
    name: full_step
    text:
      en: λ = 2.93 m.
  misconception_ids:
  - mc.phy.o.wave_prefix_ignored
  - mc.phy.o.wave_equation_inverted
  - mc.phy.o.em_uses_sound_speed
  - mc.phy.o.prefix_confused_with_neighbour
solution:
  steps:
  - n: 1
    latex: f = 102.5\ \text{MHz} = 102.5 \times 10^{6}\ \text{Hz}
    reason: Write the prefix as a power of ten
  - n: 2
    latex: \lambda = \frac{c}{f} = \frac{3.0 \times 10^{8}}{102.5 \times 10^{6}} = 2.93\ \text{m}
    reason: Rearrange c = fλ
    check_id: chk_build_phy_ems_0021_ans
