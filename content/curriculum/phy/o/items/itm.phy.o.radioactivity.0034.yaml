id: itm.phy.o.radioactivity.0034
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.half_life
stem: The activity of a sample of strontium-90 falls from 240 Bq to 60 Bq in 58 years.
parts:
- id: a
  prompt: Find the half-life of the isotope.
  marks: 2
  answer:
    kind: numeric
    value: '29'
    unit: years
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_rad_0034_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The half-life is the time for the activity to halve.
  - rung: 2
    name: concept
    text:
      en: Count how many times 240 halves to reach 60.
  - rung: 3
    name: first_step
    text:
      en: Those halvings share the time equally.
  - rung: 4
    name: worked_step
    text:
      en: There are 2 half-lives in 58 years.
  - rung: 5
    name: full_step
    text:
      en: The half-life is 29 years.
  misconception_ids:
  - mc.phy.o.half_lives_equal_ratio
  - mc.phy.o.half_life_half_of_time
  - mc.phy.o.half_lives_counted_wrongly
solution:
  steps:
  - n: 1
    latex: \frac{240}{2^{n}} = 60 \Rightarrow n = 2
    reason: Count the halvings
    check_id: chk_build_phy_rad_0034_n
  - n: 2
    latex: T = \frac{58}{2} = 29\ \text{years}
    reason: Time ÷ number of half-lives
    check_id: chk_build_phy_rad_0034_ans
