stem: A runner of mass 55 kg is moving at 6 m/s.
parts:
- id: a
  prompt: Calculate the kinetic energy in J.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 1980 J
      correct: false
      misconception_id: mc.phy.o.ke_half_omitted
      feedback: Kinetic energy is ½mv². Write the whole formula down before you put in any numbers.
    - id: B
      text: 165 J
      correct: false
      misconception_id: mc.phy.o.ke_speed_not_squared
      feedback: 'Try a speed of 2 m/s and then 4 m/s: the kinetic energy goes up four times, not twice. The speed is squared.'
    - id: C
      text: 990 J
      correct: true
    - id: D
      text: 330 J
      correct: false
      misconception_id: mc.phy.o.square_taken_as_double
      feedback: 'Squaring means multiplying a number by itself: 5² is 5 × 5 = 25, not 5 × 2 = 10.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Kinetic energy depends on the mass and the speed.
  - rung: 2
    name: concept
    text:
      en: Use Ek = ½mv², with the mass in kg and the speed in m/s.
  - rung: 3
    name: first_step
    text:
      en: 'Square the speed first: 6² = 36.'
  - rung: 4
    name: worked_step
    text:
      en: Then work out ½ × 55 × 36.
  - rung: 5
    name: full_step
    text:
      en: The kinetic energy is 990 J.
  misconception_ids:
  - mc.phy.o.ke_half_omitted
  - mc.phy.o.ke_speed_not_squared
  - mc.phy.o.square_taken_as_double
solution:
  steps:
  - n: 1
    latex: v^2 = 6^2 = 36
    reason: Square the speed first
    check_id: chk_build_phy_nrg_0026_sq
  - n: 2
    latex: E_k = \frac{1}{2} \times 55 \times 36 = 990\ \text{J}
    reason: E_k = ½mv²
    check_id: chk_build_phy_nrg_0026_ej
