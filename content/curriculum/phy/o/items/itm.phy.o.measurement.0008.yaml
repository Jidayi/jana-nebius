stem: A frequency is measured as 15 kHz.
parts:
- id: a
  prompt: Write this frequency in Hz.
  marks: 1
  answer:
    kind: numeric
    value: '15000'
    unit: Hz
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mea_0008_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Which is the bigger unit: kHz or Hz?'
  - rung: 2
    name: concept
    text:
      en: The prefix in kHz means a thousand times the base unit, Hz.
  - rung: 3
    name: first_step
    text:
      en: Changing to a smaller unit makes the number bigger.
  - rung: 4
    name: worked_step
    text:
      en: So multiply by a thousand.
  - rung: 5
    name: full_step
    text:
      en: 15 kHz = 15000 Hz.
  misconception_ids:
  - mc.phy.o.prefix_multiply_divide_swapped
  - mc.phy.o.prefix_power_wrong
  - mc.phy.o.prefix_confused_with_neighbour
solution:
  steps:
  - n: 1
    latex: 1\ \text{kHz} = 10^{3}\ \text{Hz}
    reason: What the prefix means
  - n: 2
    latex: 15\ \text{kHz} \rightarrow 15000\ \text{Hz}
    reason: Divide when the unit gets bigger, multiply when it gets smaller
    check_id: chk_build_phy_mea_0008_calc
  - n: 3
    latex: 15000\ \text{Hz}
    reason: Checked by converting the units
