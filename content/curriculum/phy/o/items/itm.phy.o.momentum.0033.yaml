id: itm.phy.o.momentum.0033
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.momentum.impulse
stem: A gymnast lands on a thick soft mat instead of a hard floor.
parts:
- id: a
  prompt: Why does the mat reduce the force on her legs?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It reduces her change in momentum
      correct: false
      misconception_id: mc.phy.o.cushioning_reduces_momentum_change
      feedback: The car still goes from moving to stopped, so the change in momentum is the same. Spreading it over a longer time makes the force smaller.
    - id: B
      text: It increases the time her momentum takes to fall to zero
      correct: true
    - id: C
      text: It makes her stop faster
      correct: false
      misconception_id: mc.phy.o.impulse_time_multiplied
      feedback: Impulse is force × time, so force = change in momentum ÷ time. A shorter impact time gives a bigger force.
    - id: D
      text: It removes her momentum without any force
      correct: false
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Impulse = force × time, and it equals the change in momentum.
  - rung: 2
    name: concept
    text:
      en: For a given change in momentum, a longer stopping time means a smaller force.
  - rung: 3
    name: first_step
    text:
      en: Decide whether each option changes the momentum change or the time it takes.
  - rung: 4
    name: worked_step
    text:
      en: Compare her momentum before and after landing on each surface.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It increases the time her momentum takes to fall to zero. Her change in momentum is the same; spreading it over a longer time reduces the force.'
  misconception_ids:
  - mc.phy.o.cushioning_reduces_momentum_change
  - mc.phy.o.impulse_time_multiplied
solution:
  steps:
  - n: 1
    latex: \text{It increases the time her momentum takes to fall to zero}
    reason: Use impulse = FΔt = Δp
