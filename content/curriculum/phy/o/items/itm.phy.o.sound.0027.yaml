kc_ids:
- kc.phy.o.sound.speed_and_echoes
stem: Wanjiru stands 136 m from a tall wall and claps once. The echo is heard 0.82 s after the clap.
parts:
- id: a
  prompt: Calculate the speed of sound in air.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 166 m/s
      correct: false
      misconception_id: mc.phy.o.echo_not_halved
      feedback: 'Draw the path: the sound goes to the reflector and comes back. The echo time covers twice the distance to the reflector.'
    - id: B
      text: 82.9 m/s
      correct: false
      misconception_id: mc.phy.o.echo_halving_misapplied
      feedback: The sound covers twice the distance to the reflector, so the distance to it is half of speed × time.
    - id: C
      text: 0.00301 m/s
      correct: false
      misconception_id: mc.phy.o.time_over_distance
      feedback: Speed tells you how many metres you cover each second, so the metres go on top.
    - id: D
      text: 332 m/s
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: In the echo time, how far does the sound travel?
  - rung: 2
    name: concept
    text:
      en: 'It goes to the wall and comes back: twice the distance to the wall.'
  - rung: 3
    name: first_step
    text:
      en: Total distance = 2 × 136 = 272 m.
  - rung: 4
    name: worked_step
    text:
      en: Divide 272 m by 0.82 s.
  - rung: 5
    name: full_step
    text:
      en: v = 332 m/s.
  misconception_ids:
  - mc.phy.o.echo_halving_misapplied
  - mc.phy.o.echo_not_halved
  - mc.phy.o.time_over_distance
solution:
  steps:
  - n: 1
    latex: 2 \times 136 = 272\ \text{m}
    reason: The sound goes to the wall and back
    check_id: chk_build_phy_snd_0027_tot
  - n: 2
    latex: v = \frac{272}{0.82} = 332\ \text{m/s}
    reason: Speed = distance ÷ time
    check_id: chk_build_phy_snd_0027_ans
