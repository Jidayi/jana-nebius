stem: A loaded lorry and an empty one take the same bend at the same speed.
parts:
- id: a
  prompt: Which needs the larger force towards the centre?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The loaded lorry
      correct: true
    - id: B
      text: The empty lorry
      correct: false
      misconception_id: mc.phy.o.centripetal_trend_reversed
      feedback: Take a tight bend fast on a bicycle and you need a lot of grip. Turning sharply or quickly needs a bigger inward force, and so does a bigger mass.
    - id: C
      text: 'Neither: no force is needed at a steady speed'
      correct: false
      misconception_id: mc.phy.o.circular_no_force_needed
      feedback: Speed stays the same but the direction changes all the time, so the velocity changes. A changing velocity needs a resultant force.
    - id: D
      text: Both need the same force, because the bend and speed match
      correct: false
      misconception_id: mc.phy.o.centripetal_trend_reversed
      feedback: Take a tight bend fast on a bicycle and you need a lot of grip. Turning sharply or quickly needs a bigger inward force, and so does a bigger mass.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about the velocity of the object, not just its speed.
  - rung: 2
    name: concept
    text:
      en: Going round a circle the direction of motion changes all the time, so the velocity changes.
  - rung: 3
    name: first_step
    text:
      en: A changing velocity needs a resultant force; think about which way the velocity is being turned.
  - rung: 4
    name: worked_step
    text:
      en: Think about how mass affects the force needed to change a velocity.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The loaded lorry. A greater mass needs a greater resultant force for the same change of velocity.'
  misconception_ids:
