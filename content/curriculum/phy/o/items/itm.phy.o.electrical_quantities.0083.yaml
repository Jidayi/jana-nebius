stem: A diode's current-voltage graph shows a current of 3 mA at 0.62 V and 14 mA at 0.7 V in its forward direction.
parts:
- id: a
  prompt: Find the resistance of the diode at 0.7 V.
  marks: 2
  answer:
    kind: numeric
    value: '50'
    unit: Ω
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0083_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Use only the readings at the p.d. asked about.
  - rung: 2
    name: concept
    text:
      en: Resistance at a point is R = V ÷ I, with I in amps.
  - rung: 3
    name: first_step
    text:
      en: Change the current into amps first.
  - rung: 4
    name: worked_step
    text:
      en: Divide 0.7 V by 0.014 A.
  - rung: 5
    name: full_step
    text:
      en: R = 0.7 ÷ 0.014 = 50 Ω.
  misconception_ids:
  - mc.phy.o.milliamps_used_as_amps
  - mc.phy.o.iv_gradient_is_resistance
  - mc.phy.o.resistance_from_chord_slope
solution:
  steps:
  - n: 1
    latex: I = 14\ \text{mA} = 0.014\ \text{A}
    reason: A thousand mA in 1 A
    check_id: chk_build_phy_elq_0083_ia
  - n: 2
    latex: R = \frac{V}{I} = \frac{0.7}{0.014} = 50\ \Omega
    reason: Use the readings at that point
    check_id: chk_build_phy_elq_0083_ans
