id: itm.phy.o.forces.0062
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.springs
stem: A spring with a spring constant of 75 N/m is 5 cm long. A force stretches it to 8 cm, within its limit of proportionality.
parts:
- id: a
  prompt: Find the force.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 225 N
      correct: false
      misconception_id: mc.phy.o.spring_cm_not_converted
      feedback: A spring constant in N/m needs the extension in metres. Change centimetres into metres before you use F = kx.
    - id: B
      text: 2500 N
      correct: false
      misconception_id: mc.phy.o.spring_ratio_inverted
      feedback: 'The spring constant is the force needed for each metre of extension, so force goes on top: k = F ÷ x.'
    - id: C
      text: 2.25 N
      correct: true
    - id: D
      text: 6 N
      correct: false
      misconception_id: mc.phy.o.spring_length_for_extension
      feedback: 'Extension means how much longer the spring has become: stretched length minus original length.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Use F = kx, where x is the extension.
  - rung: 2
    name: concept
    text:
      en: The extension is how much longer the spring has become.
  - rung: 3
    name: first_step
    text:
      en: Find the extension and change it into metres before multiplying by k.
  - rung: 4
    name: worked_step
    text:
      en: The extension is 0.03 m.
  - rung: 5
    name: full_step
    text:
      en: F = 75 × 0.03 = 2.25 N.
  misconception_ids:
  - mc.phy.o.spring_cm_not_converted
  - mc.phy.o.spring_length_for_extension
  - mc.phy.o.spring_ratio_inverted
solution:
  steps:
  - n: 1
    latex: x = 8 - 5 = 3\ \text{cm} = 0.03\ \text{m}
    reason: Extension in metres
    check_id: chk_build_phy_frc_0062_ext_m
  - n: 2
    latex: F = kx = 75 \times 0.03 = 2.25\ \text{N}
    reason: Hooke's law
    check_id: chk_build_phy_frc_0062_ans
difficulty:
  prior: -0.1
  band: core
