subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.pressure_on_surfaces
stem: A student standing on both feet has a mass of 60 kg. The total area in contact with the ground is 0.03 m². Take g = 10 N/kg.
parts:
- id: a
  prompt: Calculate the pressure on the ground, in Pa.
  marks: 2
  answer:
    kind: numeric
    value: '20000'
    unit: Pa
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_prs_0007_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The force pressing on the ground is a weight, measured in newtons.
  - rung: 2
    name: concept
    text:
      en: Find the weight first (mass × g), then divide it by the area.
  - rung: 3
    name: first_step
    text:
      en: The weight is 60 × 10 N.
  - rung: 4
    name: worked_step
    text:
      en: The weight is 600 N; divide it by 0.03 m².
  - rung: 5
    name: full_step
    text:
      en: The pressure is 20000 Pa.
  misconception_ids:
  - mc.phy.o.pressure_mass_used_as_force
  - mc.phy.o.pressure_force_times_area
  - mc.phy.o.pressure_area_over_force
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: F = mg = 60 \times 10 = 600\ \text{N}
    reason: The force is the weight
    check_id: chk_build_phy_prs_0007_f
  - n: 2
    latex: p = \frac{600}{0.03} = 20000\ \text{Pa}
    reason: Pressure = force ÷ area
    check_id: chk_build_phy_prs_0007_ans
