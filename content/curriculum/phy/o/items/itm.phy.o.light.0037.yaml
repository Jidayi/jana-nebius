  hints:
  - rung: 1
    name: orient
    text:
      en: Light is slower in a material than in a vacuum.
  - rung: 2
    name: concept
    text:
      en: n = c ÷ v, so v = c ÷ n.
  - rung: 3
    name: first_step
    text:
      en: The speed of light in a vacuum is 3.0 × 10⁸ m/s.
  - rung: 4
    name: worked_step
    text:
      en: Divide 3.0 × 10⁸ by 2.42.
  - rung: 5
    name: full_step
    text:
      en: The speed of light in diamond is 1.24 × 10⁸ m/s.
  misconception_ids:
