solution:
  steps:
  - n: 1
    latex: v = \frac{c}{n}
    reason: Refractive index = speed in a vacuum ÷ speed in the material
  - n: 2
    latex: v = \frac{3.0 \times 10^{8}}{2.42} = 1.24 \times 10^{8}\ \text{m/s}
    reason: Divide c by n
    check_id: chk_build_phy_lgt_0037_ans_m
