type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.energy_resources
stem: A nuclear power station uses uranium as its fuel.
parts:
- id: a
  prompt: Which statement is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Its fuel is renewable because a little gives out so much energy
      correct: false
      misconception_id: mc.phy.o.nuclear_is_renewable
      feedback: Uranium is mined and is not replaced. Low carbon emissions do not make a resource renewable; being replaced naturally as fast as we use it does.
    - id: B
      text: It gives out almost no carbon dioxide, but its fuel is non-renewable
      correct: true
    - id: C
      text: It is harmless because it gives out no carbon dioxide
      correct: false
      misconception_id: mc.phy.o.renewable_means_clean
      feedback: A dam is renewable but floods valleys, and wind farms change the landscape. Renewable is about being replaced, not about having no effects.
    - id: D
      text: Its fuel is renewable because there is plenty of uranium left
      correct: false
      misconception_id: mc.phy.o.plentiful_seen_as_renewable
      feedback: Coal takes millions of years to form, so once burned it is gone for any useful time. A renewable resource is replaced as fast as we use it.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Read each option and decide whether it is really true for this resource.
  - rung: 2
    name: concept
    text:
      en: Uranium is mined from rocks and is not replaced.
  - rung: 3
    name: first_step
    text:
      en: Renewable means replaced as fast as we use it; reliable means there when we need it. Neither tells you the cost or the effects on the environment.
  - rung: 4
    name: worked_step
    text:
      en: Rule out each option that mixes these ideas up or gets the original source of the energy wrong.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It gives out almost no carbon dioxide, but its fuel is non-renewable.'
  misconception_ids:
  - mc.phy.o.nuclear_is_renewable
  - mc.phy.o.plentiful_seen_as_renewable
  - mc.phy.o.renewable_means_clean
