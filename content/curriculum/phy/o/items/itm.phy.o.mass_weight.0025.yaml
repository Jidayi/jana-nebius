id: itm.phy.o.mass_weight.0025
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.mass_weight.mass_or_weight
stem: On Mars, where g = 3.7 N/kg, a spring scale reads 11.1 N when a toolkit hangs from it. The toolkit is brought back to Earth. Take g = 9.8 N/kg.
parts:
- id: a
  prompt: What does the spring scale read on Earth?
  marks: 2
  answer:
    kind: numeric
    value: '29.4'
    unit: N
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mwt_0025_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A spring scale measures weight, which depends on g; the mass travels unchanged.
  - rung: 2
    name: concept
    text:
      en: Find the mass first, using the g for Mars.
  - rung: 3
    name: first_step
    text:
      en: Mass = 11.1 ÷ 3.7.
  - rung: 4
    name: worked_step
    text:
      en: The mass is 3 kg; multiply it by the Earth's g, 9.8 N/kg.
  - rung: 5
    name: full_step
    text:
      en: The spring scale reads 29.4 N on Earth.
  misconception_ids:
  - mc.phy.o.weight_same_on_every_planet
  - mc.phy.o.weight_given_as_mass_number
  - mc.phy.o.planet_g_ratio_inverted
solution:
  steps:
  - n: 1
    latex: m = \frac{11.1}{3.7} = 3\ \text{kg}
    reason: The mass, found where the weight was measured
    check_id: chk_build_phy_mwt_0025_m
  - n: 2
    latex: W = 3 \times 9.8 = 29.4\ \text{N}
    reason: The same mass in the Earth's field
    check_id: chk_build_phy_mwt_0025_ans
