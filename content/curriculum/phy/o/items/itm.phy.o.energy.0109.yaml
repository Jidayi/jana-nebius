stem: A tidal barrage is built across a river estuary.
parts:
- id: a
  prompt: Which statement about tidal power is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Tidal energy comes from the Sun heating the sea
      correct: false
      misconception_id: mc.phy.o.energy_source_traced_wrongly
      feedback: The Sun drives the weather and plant growth, so wind, rain and fuels come from it. Tides come from the Moon; geothermal and nuclear energy come from inside atoms and the Earth.
    - id: B
      text: Tides are predictable, so its output can be planned
      correct: true
    - id: C
      text: A barrage has no effect on the estuary's wildlife
      correct: false
      misconception_id: mc.phy.o.renewable_means_clean
      feedback: A dam is renewable but floods valleys, and wind farms change the landscape. Renewable is about being replaced, not about having no effects.
    - id: D
      text: It gives the same output at every moment of the day
      correct: false
      misconception_id: mc.phy.o.renewables_always_available
      feedback: Solar panels give nothing at night and wind turbines stop in calm weather. Many renewables are not reliable on their own.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Read each option and decide whether it is really true for this resource.
  - rung: 2
    name: concept
    text:
      en: High and low tides come at times we can work out in advance.
  - rung: 3
    name: first_step
    text:
      en: Renewable means replaced as fast as we use it; reliable means there when we need it. Neither tells you the cost or the effects on the environment.
  - rung: 4
    name: worked_step
    text:
      en: Rule out each option that mixes these ideas up or gets the original source of the energy wrong.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Tides are predictable, so its output can be planned.'
  misconception_ids:
  - mc.phy.o.energy_source_traced_wrongly
  - mc.phy.o.renewable_means_clean
  - mc.phy.o.renewables_always_available
