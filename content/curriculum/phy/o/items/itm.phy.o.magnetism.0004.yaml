    name: orient
    text:
      en: An electromagnet must stop being a magnet when its current stops.
  - rung: 2
    name: concept
    text:
      en: Soft iron loses its magnetism easily; steel keeps it.
  - rung: 3
    name: first_step
    text:
      en: So use the soft-iron rod's numbers.
  - rung: 4
    name: worked_step
    text:
      en: Work out 24 − 2.
  - rung: 5
    name: full_step
    text:
      en: The soft-iron rod drops 24 − 2 = 22 paper clips.
  misconception_ids:
