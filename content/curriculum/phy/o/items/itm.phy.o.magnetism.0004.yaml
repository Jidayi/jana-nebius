stem: Obi puts a soft-iron rod and then a steel rod of the same size inside a coil carrying a current. With the current on, the iron rod holds 24 paper clips and the steel rod holds 18. With the current switched off, the iron rod holds 2 and the steel rod holds 15.
parts:
- id: a
  prompt: How many paper clips does the rod that would make the better electromagnet core drop when the current is switched off?
  marks: 1
  answer:
    kind: numeric
    value: '22'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mag_0004_ans
  show_working: false
  hints:
