id: itm.phy.o.oscilloscope.0004
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.oscilloscope.time_base
stem: An oscilloscope's time-base is set to 0.2 ms/div. On the trace, the distance from one crest to the next is 6 divisions.
parts:
- id: a
  prompt: Calculate the frequency of the signal.
  marks: 3
  answer:
    kind: numeric
    value: '833'
    unit: Hz
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_osc_0004_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'First find the period: the time for one complete wave.'
  - rung: 2
    name: concept
    text:
      en: Period = divisions for one wave × time-base; then f = 1/T with T in seconds.
  - rung: 3
    name: first_step
    text:
      en: Find how many divisions one complete wave takes and multiply by 0.2 ms.
  - rung: 4
    name: worked_step
    text:
      en: The period is 1.2 ms, which is 0.0012 s; now work out 1 ÷ T.
  - rung: 5
    name: full_step
    text:
      en: The frequency is 833 Hz.
  misconception_ids:
  - mc.phy.o.osc_ms_read_as_s
  - mc.phy.o.osc_frequency_period_confused
  - mc.phy.o.osc_timebase_divided
solution:
  steps:
  - n: 1
    latex: T = 6 \times 0.2 = 1.2\ \text{ms}
    reason: Divisions for one wave times the time-base
    check_id: chk_build_phy_osc_0004_tm
  - n: 2
    latex: T = 1.2\ \text{ms} = 0.0012\ \text{s}
    reason: Period in seconds
    check_id: chk_build_phy_osc_0004_ts
  - n: 3
    latex: f = \frac{1}{T} = \frac{1}{0.0012} = 833\ \text{Hz}
    reason: Frequency is one over the period
    check_id: chk_build_phy_osc_0004_ans
difficulty:
  prior: 0.4
  band: core
estimated_seconds: 90
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
context_tags:
- none
provenance:
