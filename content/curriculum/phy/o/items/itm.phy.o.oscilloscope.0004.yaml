  chk_build_phy_osc_0004_ans:
    args:
      expression: 1000/(6*0.2)
      sf: 3
    tool: math_evaluate
  chk_build_phy_osc_0004_tm:
    args:
      expression: 6*0.2
    tool: math_evaluate
  chk_build_phy_osc_0004_ts:
    args:
      quantity: 1.2 ms
      to: s
    tool: units_convert
