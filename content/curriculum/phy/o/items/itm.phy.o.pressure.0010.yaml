id: itm.phy.o.pressure.0010
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.pressure_on_surfaces
stem: A block measuring 0.25 m × 0.12 m × 0.06 m has a weight of 24 N. It can rest on any of its faces.
parts:
- id: a
  prompt: Calculate the least pressure it can exert on the ground.
  marks: 2
  answer:
    kind: numeric
    value: '800'
    unit: Pa
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_prs_0010_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The weight is the same whichever face the block rests on.
  - rung: 2
    name: concept
    text:
      en: For the same force, a smaller area gives a greater pressure.
  - rung: 3
    name: first_step
    text:
      en: Choose the largest face and multiply its two sides.
  - rung: 4
    name: worked_step
    text:
      en: That face has an area of 0.03 m²; divide 24 N by it.
  - rung: 5
    name: full_step
    text:
      en: The least pressure is 800 Pa.
  misconception_ids:
  - mc.phy.o.larger_area_larger_pressure
  - mc.phy.o.pressure_force_times_area
  - mc.phy.o.pressure_area_sides_added
solution:
  steps:
  - n: 1
    latex: A = 0.25 \times 0.12 = 0.03\ \text{m}^2
    reason: The largest face gives the least pressure
    check_id: chk_build_phy_prs_0010_area
  - n: 2
    latex: p = \frac{24}{0.03} = 800\ \text{Pa}
    reason: Pressure = force ÷ area
    check_id: chk_build_phy_prs_0010_ans
