id: itm.phy.o.motion.0302
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.motion.acceleration_from_change
stem: A train speeds up steadily from 6 m/s to 24 m/s in 4 s.
parts:
- id: a
  prompt: Find its acceleration, taking the direction of motion as positive.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 6 m/s²
      correct: false
      misconception_id: mc.phy.o.final_velocity_over_time
      feedback: Compare two cars that both end at 20 m/s after 4 s, one starting at rest and one starting at 16 m/s. Only the first gains 20 m/s of velocity.
    - id: B
      text: 7.5 m/s²
      correct: false
      misconception_id: mc.phy.o.velocities_added_for_change
      feedback: 'If the velocity does not change at all, the acceleration must be zero, but adding the velocities would not give zero. Subtract: final minus starting velocity.'
    - id: C
      text: 4.5 m/s²
      correct: true
    - id: D
      text: 72 m/s²
      correct: false
      misconception_id: mc.phy.o.change_multiplied_by_time
      feedback: 'Acceleration is the change in velocity each second, so share the change out over the seconds: divide.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Acceleration measures how quickly the velocity changes.
  - rung: 2
    name: concept
    text:
      en: a = (final velocity − starting velocity) ÷ time taken.
  - rung: 3
    name: first_step
    text:
      en: Work out the change in velocity first, keeping its sign.
  - rung: 4
    name: worked_step
    text:
      en: The change in velocity is 18 m/s.
  - rung: 5
    name: full_step
    text:
      en: The acceleration is 4.5 m/s².
  misconception_ids:
  - mc.phy.o.change_multiplied_by_time
  - mc.phy.o.final_velocity_over_time
  - mc.phy.o.velocities_added_for_change
solution:
  steps:
  - n: 1
    latex: \Delta v = 24 - 6 = 18\ \text{m/s}
    reason: Change in velocity = final − starting
    check_id: chk_build_phy_mot_0302_ch
  - n: 2
    latex: a = \frac{18}{4} = 4.5\ \text{m/s}^2
    reason: Acceleration = change in velocity ÷ time
    check_id: chk_build_phy_mot_0302_ans
