stem: A fridge must switch its cooling on when the inside gets too warm.
parts:
- id: a
  prompt: Which component should sense the change?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: A light-dependent resistor
      correct: false
      misconception_id: mc.phy.o.thermistor_ldr_confused
      feedback: 'Thermistor: temperature (think thermometer). LDR: light-dependent resistor, its symbol has arrows of light pointing in.'
    - id: B
      text: A variable resistor
      correct: false
      misconception_id: mc.phy.o.variable_resistor_is_sensor
      feedback: A variable resistor is adjusted by a person, like a dimmer knob. Only sensors such as thermistors and LDRs change by themselves.
    - id: C
      text: A diode
      correct: false
    - id: D
      text: A thermistor
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Ask what physical change the circuit has to detect.
  - rung: 2
    name: concept
    text:
      en: The cooling must react to the temperature inside the fridge, which is dark when closed.
  - rung: 3
    name: first_step
    text:
      en: A component set by hand cannot react on its own.
  - rung: 4
    name: worked_step
    text:
      en: Pick the component whose resistance depends on temperature.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: a thermistor.'
  misconception_ids:
  - mc.phy.o.thermistor_ldr_confused
  - mc.phy.o.variable_resistor_is_sensor
