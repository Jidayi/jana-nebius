id: itm.phy.o.circuits.0066
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.circuit_components
stem: 'An LDR is connected in series with a 1000 Ω resistor and a 12 V battery. The LDR''s resistance is 100 Ω in one lighting condition and 5000 Ω in the other: bright light and darkness.'
parts:
- id: a
  prompt: Calculate the current in the circuit in bright light.
  marks: 2
  answer:
    kind: numeric
    value: '0.0109'
    unit: A
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_cir_0066_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: First decide which resistance goes with that lighting.
  - rung: 2
    name: concept
    text:
      en: An LDR's resistance falls as the light gets brighter.
  - rung: 3
    name: first_step
    text:
      en: So the sensor's resistance is 100 Ω; add the 1000 Ω resistor in series.
  - rung: 4
    name: worked_step
    text:
      en: The total is 1100 Ω; divide 12 V by it.
  - rung: 5
    name: full_step
    text:
      en: The current is 0.0109 A.
  misconception_ids:
  - mc.phy.o.ldr_resistance_rises_with_light
  - mc.phy.o.circuit_current_r_over_v
solution:
  steps:
  - n: 1
    latex: R_{\text{sensor}} = 100\ \Omega
    reason: More light means lower resistance
  - n: 2
    latex: R = 100 + 1000 = 1100\ \Omega
    reason: Series resistances add
    check_id: chk_build_phy_cir_0066_rt
  - n: 3
    latex: I = \frac{12}{1100} = 0.0109\ \text{A}
    reason: Ohm's law
    check_id: chk_build_phy_cir_0066_ans
difficulty:
  prior: 0.2
  band: core
estimated_seconds: 80
