id: itm.phy.o.heat_transfer.0009
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.heat_transfer.conduction
stem: A hot-water tank loses energy through its walls at 120 W. After a thick foam jacket is fitted, which is a poor conductor, it loses energy at only 50 W.
parts:
- id: a
  prompt: How much energy does the jacket save in 12 hours? Give your answer in MJ.
  marks: 3
  answer:
    kind: numeric
    value: '3.024'
    unit: MJ
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_htr_0009_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The jacket slows conduction, so the tank loses energy at a lower rate.
  - rung: 2
    name: concept
    text:
      en: The saving each second is the difference between the two rates.
  - rung: 3
    name: first_step
    text:
      en: Change 12 hours to seconds, then use energy = power × time.
  - rung: 4
    name: worked_step
    text:
      en: Multiply 70 W by 43200 s, then change joules to megajoules.
  - rung: 5
    name: full_step
    text:
      en: The jacket saves 3.024 MJ.
solution:
  steps:
  - n: 1
    latex: 120 - 50 = 70\ \text{W}
    reason: Energy saved each second
    check_id: chk_build_phy_htr_0009_dp
  - n: 2
    latex: t = 12\ \text{h} = 43200\ \text{s}
    reason: Seconds, since a watt is a joule per second
    check_id: chk_build_phy_htr_0009_ts
  - n: 3
    latex: E = 70 \times 43200 = 3024000\ \text{J}
    reason: Energy = power × time
    check_id: chk_build_phy_htr_0009_e
  - n: 4
    latex: E = 3.024\ \text{MJ}
    reason: A megajoule is a million joules
    check_id: chk_build_phy_htr_0009_ans
