version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.circular_motion
stem: A child sits 3 m from the centre of a roundabout that turns once every 6 s.
parts:
- id: a
  prompt: Find the speed of the child.
  marks: 2
  answer:
    kind: numeric
    value: '3.14'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_frc_0075_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Speed is distance ÷ time.
  - rung: 2
    name: concept
    text:
      en: 'In one turn the object goes once round the circle: a distance of 2πr.'
  - rung: 3
    name: first_step
    text:
      en: Work out the circumference, then divide by the time for one turn.
  - rung: 4
    name: worked_step
    text:
      en: The circumference is 18.8 m.
  - rung: 5
    name: full_step
    text:
      en: v = 18.8 ÷ 6 = 3.14 m/s.
  misconception_ids:
  - mc.phy.o.orbit_radius_not_circumference
  - mc.phy.o.time_over_distance
solution:
  steps:
  - n: 1
    latex: 2\pi r = 2\pi \times 3 = 18.8\ \text{m}
    reason: 'Distance round once: the circumference'
    check_id: chk_build_phy_frc_0075_c
  - n: 2
    latex: v = \frac{2\pi r}{T} = \frac{18.8}{6} = 3.14\ \text{m/s}
    reason: Speed = distance ÷ time
    check_id: chk_build_phy_frc_0075_ans
