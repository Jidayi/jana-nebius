id: itm.phy.o.sound.0058
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.sound.ultrasound
stem: An engineer tests a steel block for cracks. An ultrasound pulse sent into the block gives an echo from a crack 8 µs later. Sound travels at 340 m/s in air and 6000 m/s in steel.
parts:
- id: a
  prompt: How far below the surface is the crack, in millimetres?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 48 mm
      correct: false
      misconception_id: mc.phy.o.echo_not_halved
      feedback: 'Draw the path: the sound goes to the reflector and comes back. The echo time covers twice the distance to the reflector.'
    - id: B
      text: 96 mm
      correct: false
      misconception_id: mc.phy.o.echo_halving_misapplied
      feedback: The sound covers twice the distance to the reflector, so the distance to it is half of speed × time.
    - id: C
      text: 24 mm
      correct: true
    - id: D
      text: 1.36 mm
      correct: false
      misconception_id: mc.phy.o.ultrasound_air_speed_used
      feedback: Sound travels about four times faster in water than in air. Use the speed for the material the pulse actually crosses.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The pulse travels through steel, so use the speed in steel.
  - rung: 2
    name: concept
    text:
      en: It goes to the crack and back, so halve the distance travelled.
  - rung: 3
    name: first_step
    text:
      en: 8 µs = 0.000008 s.
  - rung: 4
    name: worked_step
    text:
      en: d = 6000 × 0.000008 ÷ 2 in metres; then change to millimetres.
  - rung: 5
    name: full_step
    text:
      en: The crack is 24 mm below the surface.
  misconception_ids:
  - mc.phy.o.echo_halving_misapplied
  - mc.phy.o.echo_not_halved
  - mc.phy.o.ultrasound_air_speed_used
solution:
  steps:
  - n: 1
    latex: t = 8\ \mu\text{s} = 0.000008\ \text{s}
    reason: A microsecond is a millionth of a second
    check_id: chk_build_phy_snd_0058_ts
  - n: 2
    latex: d = \frac{6000 \times 0.000008}{2} = 0.024\ \text{m}
    reason: Half the there-and-back distance
    check_id: chk_build_phy_snd_0058_dm
  - n: 3
    latex: 0.024\ \text{m} = 24\ \text{mm}
    reason: A metre is a thousand millimetres
    check_id: chk_build_phy_snd_0058_ans
difficulty:
