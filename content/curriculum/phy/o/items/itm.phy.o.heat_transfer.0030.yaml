id: itm.phy.o.heat_transfer.0030
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.heat_transfer.convection
stem: A hot-air balloon rises when its burner heats the air inside the envelope.
parts:
- id: a
  prompt: Why does the balloon rise?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Heat rises and lifts the balloon with it
      correct: false
      misconception_id: mc.phy.o.heat_itself_rises
      feedback: 'Energy has no up or down. In convection the fluid moves: warmer, less dense fluid is pushed upwards by cooler, denser fluid sinking beneath it.'
    - id: B
      text: Heating makes more air particles, so they push up harder
      correct: false
      misconception_id: mc.phy.o.heating_creates_particles
      feedback: 'Weigh a sealed flask before and after heating: its mass does not change. No particles are made; the same particles move faster and, in most materials, spread further apart.'
    - id: C
      text: The hot air inside is less dense than the cooler air outside
      correct: true
    - id: D
      text: The hot air keeps the same density, but its particles grow
      correct: false
      misconception_id: mc.phy.o.particles_grow_when_heated
      feedback: A water particle is the same size in ice, in water and in steam. Heating makes particles move faster and spread further apart; it does not make them bigger.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Convection is the movement of a warm fluid carrying energy with it.
  - rung: 2
    name: concept
    text:
      en: Some of the heated air spills out of the opening as it expands.
  - rung: 3
    name: first_step
    text:
      en: Ask what happens to the density of a fluid when it is heated or cooled.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options where heat moves by itself or a solid flows.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The hot air inside is less dense than the cooler air outside.'
  misconception_ids:
  - mc.phy.o.heat_itself_rises
  - mc.phy.o.heating_creates_particles
  - mc.phy.o.particles_grow_when_heated
solution:
  steps:
  - n: 1
    latex: \text{The hot air inside is less dense than the cooler air outside}
    reason: Explain the current by changes in density
