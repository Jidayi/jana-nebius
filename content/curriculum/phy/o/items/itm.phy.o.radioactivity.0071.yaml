id: itm.phy.o.radioactivity.0071
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.uses_and_safety
stem: A steelworks checks the thickness of steel plates several centimetres thick.
parts:
- id: a
  prompt: Which source should it use?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: A beta emitter with a long half-life
      correct: false
      misconception_id: mc.phy.o.radiation_fully_absorbed_choice
      feedback: If none of the radiation gets through, the reading cannot change with thickness and nothing behind the material is reached. Match the radiation to the material.
    - id: B
      text: A gamma emitter with a half-life of a few hours
      correct: false
      misconception_id: mc.phy.o.short_half_life_for_long_use
      feedback: 'A device that runs for years needs a source whose activity hardly changes over that time: a long half-life.'
    - id: C
      text: An alpha emitter with a long half-life
      correct: false
      misconception_id: mc.phy.o.radiation_fully_absorbed_choice
      feedback: If none of the radiation gets through, the reading cannot change with thickness and nothing behind the material is reached. Match the radiation to the material.
    - id: D
      text: A gamma emitter with a long half-life
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Two things decide the choice: the kind of radiation and the half-life.'
  - rung: 2
    name: concept
    text:
      en: The radiation must reach where it is needed and be partly absorbed if a change is to be measured; the half-life must suit how long the job lasts.
  - rung: 3
    name: first_step
    text:
      en: Only one radiation gets through centimetres of steel at all.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that fail on either point, or that would put people at risk.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: A gamma emitter with a long half-life.'
  misconception_ids:
  - mc.phy.o.radiation_fully_absorbed_choice
  - mc.phy.o.short_half_life_for_long_use
solution:
  steps:
  - n: 1
    latex: \text{A gamma emitter with a long half-life}
    reason: Match the radiation and half-life to the job
