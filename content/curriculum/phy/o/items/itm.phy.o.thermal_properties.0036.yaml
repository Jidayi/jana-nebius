    text:
      en: The temperature does not change, so all the energy goes into changing the state.
  - rung: 2
    name: concept
    text:
      en: Melting uses the specific latent heat of fusion.
  - rung: 3
    name: first_step
    text:
      en: 'Use E = mL with the mass in kilograms: change 500 g to kg.'
  - rung: 4
    name: worked_step
    text:
      en: Multiply 0.5 kg by 334 kJ/kg.
  - rung: 5
    name: full_step
    text:
      en: E = 167 kJ.
