id: itm.phy.o.electromagnetism.0072
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.electromagnetism.power_transmission
stem: Thick aluminium cables are used for overhead power lines.
parts:
- id: a
  prompt: How else is the energy wasted in the cables kept small?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: By stepping the voltage up so the current is small
      correct: true
    - id: B
      text: By stepping the voltage up, which lowers the cables' resistance
      correct: false
      misconception_id: mc.phy.o.high_voltage_lowers_resistance
      feedback: A cable's resistance depends on its material, length and thickness, not on the voltage. A high voltage reduces the current instead.
    - id: C
      text: By stepping the voltage down, which reduces the energy pushed along
      correct: false
      misconception_id: mc.phy.o.higher_voltage_more_loss
      feedback: Power stations step the voltage up precisely because it cuts the current, and so cuts the heating in the cables.
    - id: D
      text: By stepping the voltage up so the current is larger
      correct: false
      misconception_id: mc.phy.o.secondary_current_rises_with_voltage
      feedback: Power is p.d. × current and an ideal transformer keeps the power the same. Double the voltage and the current halves.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what happens to the current, since the cables heat up because of it.
  - rung: 2
    name: concept
    text:
      en: An ideal transformer keeps Vp × Ip = Vs × Is, and the power wasted in a cable is I² × R.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: The heating depends on the current, so the aim is a small current.
  - rung: 5
    name: full_step
    text:
      en: By stepping the voltage up so the current is small. The heating depends on the current, so the aim is a small current.
  misconception_ids:
  - mc.phy.o.high_voltage_lowers_resistance
  - mc.phy.o.higher_voltage_more_loss
  - mc.phy.o.secondary_current_rises_with_voltage
solution:
  steps:
  - n: 1
    latex: \text{By stepping the voltage up so the current is small}
    reason: Power is kept; heating goes with current squared
