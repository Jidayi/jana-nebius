id: itm.phy.o.particles.0005
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.particles.states_of_matter
stem: 1 g of water becomes about 1700 cm³ of steam at 100 °C and normal air pressure.
parts:
- id: a
  prompt: Why is the volume of the steam so much larger?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Each molecule swells to about 1700 times its size
      correct: false
      misconception_id: mc.phy.o.particles_grow_when_heated
      feedback: A water particle is the same size in ice, in water and in steam. Heating makes particles move faster and spread further apart; it does not make them bigger.
    - id: B
      text: The molecules are much further apart in the steam
      correct: true
    - id: C
      text: Air gets into the spaces between the steam molecules
      correct: false
      misconception_id: mc.phy.o.air_between_particles
      feedback: 'Air is itself made of particles. Between the particles of any gas there is nothing at all: empty space.'
    - id: D
      text: The molecules break into smaller, hotter particles
      correct: false
      misconception_id: mc.phy.o.particles_have_bulk_properties
      feedback: A single particle does not melt, feel hot or have a colour. Those are properties of huge numbers of particles together, set by how they are arranged and how fast they move.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Picture the particles: how close together are they, and how do they move?'
  - rung: 2
    name: concept
    text:
      en: The number of molecules is the same before and after boiling.
  - rung: 3
    name: first_step
    text:
      en: 'Test each option against how the material behaves: does it keep its shape, flow, or spread out?'
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that give single particles the properties of the whole material.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The molecules are much further apart in the steam.'
  misconception_ids:
  - mc.phy.o.air_between_particles
  - mc.phy.o.particles_grow_when_heated
  - mc.phy.o.particles_have_bulk_properties
solution:
  steps:
  - n: 1
    latex: \text{The molecules are much further apart in the steam}
    reason: Match the description to the particle model
