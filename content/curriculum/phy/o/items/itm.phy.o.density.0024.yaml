stem: A measuring cylinder holds water up to the 60 cm³ mark. A zinc fitting of mass 35.5 g is lowered in on a thread until it is fully under water, and the level rises to 65 cm³.
parts:
- id: a
  prompt: Calculate the density of the zinc fitting in g/cm³.
  marks: 2
  answer:
    kind: numeric
    value: '7.1'
    unit: g/cm^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_den_0024_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The object's volume is the volume of water it pushes aside.
  - rung: 2
    name: concept
    text:
      en: 'The rise in the water level gives the volume: final reading − starting reading.'
  - rung: 3
    name: first_step
    text:
      en: Work out 65 − 60, then divide the mass by it.
  - rung: 4
    name: worked_step
    text:
      en: The volume is 5 cm³.
  - rung: 5
    name: full_step
    text:
      en: The density of the zinc fitting is 7.1 g/cm³.
  misconception_ids:
  - mc.phy.o.displacement_final_reading_as_volume
  - mc.phy.o.displacement_readings_added
  - mc.phy.o.density_volume_over_mass
solution:
  steps:
  - n: 1
    latex: V = 65 - 60 = 5\ \text{cm}^3
    reason: The rise in level is the object's volume
    check_id: chk_build_phy_den_0024_v
  - n: 2
    latex: \rho = \frac{35.5}{5} = 7.1\ \text{g/cm}^3
    reason: Density = mass ÷ volume
    check_id: chk_build_phy_den_0024_ans
