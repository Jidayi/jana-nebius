id: itm.phy.o.circuits.0011
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.series_circuits
stem: A lamp and a resistor are connected in series to a 9 V battery. A voltmeter across the lamp reads 3.5 V.
parts:
- id: a
  prompt: What does a voltmeter across the resistor read?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 3.5 V
      correct: false
      misconception_id: mc.phy.o.series_pd_same_everywhere
      feedback: Current is the same at every point in series, but the p.d.s across the components add up to the supply p.d.
    - id: B
      text: 12.5 V
      correct: false
      misconception_id: mc.phy.o.series_pd_added_to_supply
      feedback: The p.d.s across the components add up to the supply p.d., so the remaining p.d. is the supply minus the part already used.
    - id: C
      text: 4.5 V
      correct: false
      misconception_id: mc.phy.o.series_pd_shared_equally
      feedback: 'The p.d. is shared in proportion to resistance: the resistor with twice the resistance has twice the p.d. Only equal resistors share equally.'
    - id: D
      text: 5.5 V
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Both components share the energy each coulomb gets from the battery.
  - rung: 2
    name: concept
    text:
      en: In series the p.d.s across the components add up to the supply p.d.
  - rung: 3
    name: first_step
    text:
      en: The resistor has whatever is left after the lamp's share.
  - rung: 4
    name: worked_step
    text:
      en: Take 3.5 V away from 9 V.
  - rung: 5
    name: full_step
    text:
      en: The voltmeter across the resistor reads 5.5 V.
  misconception_ids:
  - mc.phy.o.series_pd_added_to_supply
  - mc.phy.o.series_pd_same_everywhere
  - mc.phy.o.series_pd_shared_equally
solution:
  steps:
  - n: 1
    latex: V_R = 9 - 3.5 = 5.5\ \text{V}
    reason: The p.d.s in series add up to the supply
    check_id: chk_build_phy_cir_0011_ans
