id: itm.phy.o.atom.0024
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.atom.isotopes
stem: 'Three nuclides are described: X has 6 protons and 8 neutrons and is radioactive; Y has 6 protons and 6 neutrons and is stable; Z has 7 protons and 7 neutrons and is stable.'
parts:
- id: a
  prompt: Which statement is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: X and Y are isotopes of the same element
      correct: true
    - id: B
      text: X and Z are isotopes, as both have a nucleon number of 14
      correct: false
      misconception_id: mc.phy.o.same_nucleon_number_isotopes
      feedback: Carbon-14 and nitrogen-14 have the same nucleon number but different proton numbers, so they are different elements, not isotopes.
    - id: C
      text: Only X is an isotope, as it is the only radioactive one
      correct: false
      misconception_id: mc.phy.o.isotope_means_radioactive
      feedback: Carbon-12 is a stable isotope of carbon and carbon-14 a radioactive one. Being an isotope is about protons and neutrons, not about decay.
    - id: D
      text: X and Y are different elements, as their nucleon numbers differ
      correct: false
      misconception_id: mc.phy.o.heavier_isotope_different_element
      feedback: 'Carbon-12 and carbon-14 are both carbon: both have six protons. The proton number alone decides the element.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide what makes two nuclides the same element.
  - rung: 2
    name: concept
    text:
      en: Isotopes have the same proton number but different nucleon numbers.
  - rung: 3
    name: first_step
    text:
      en: Find the two that share a proton number.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against that definition.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: X and Y are isotopes of the same element.'
  misconception_ids:
  - mc.phy.o.heavier_isotope_different_element
  - mc.phy.o.isotope_means_radioactive
  - mc.phy.o.same_nucleon_number_isotopes
solution:
  steps:
  - n: 1
    latex: \text{X and Y are isotopes of the same element}
    reason: Compare the proton numbers, then the nucleon numbers
