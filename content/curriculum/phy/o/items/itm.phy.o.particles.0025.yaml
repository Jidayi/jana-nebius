stem: The average kinetic energy of the particles of a gas is proportional to its temperature in kelvin. A gas is heated from 7 °C to 147 °C.
parts:
- id: a
  prompt: By what factor does the average kinetic energy of its particles increase?
  marks: 2
  answer:
    kind: numeric
    value: '1.5'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_ptc_0025_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Kelvin temperature starts from absolute zero, where particles have the least possible energy.
  - rung: 2
    name: concept
    text:
      en: Only kelvin temperatures can be used in a proportion like this.
  - rung: 3
    name: first_step
    text:
      en: Convert both temperatures to kelvin by adding 273.
  - rung: 4
    name: worked_step
    text:
      en: Divide the new kelvin temperature, 420 K, by the old one, 280 K.
  - rung: 5
    name: full_step
    text:
      en: The average kinetic energy increases by a factor of 1.5.
  misconception_ids:
  - mc.phy.o.celsius_used_for_ratio
solution:
  steps:
  - n: 1
    latex: T_1 = 7 + 273 = 280\ \text{K}
    reason: Convert to kelvin
    check_id: chk_build_phy_ptc_0025_k1
  - n: 2
    latex: T_2 = 147 + 273 = 420\ \text{K}
    reason: Convert to kelvin
    check_id: chk_build_phy_ptc_0025_k2
  - n: 3
    latex: \frac{T_2}{T_1} = \frac{420}{280} = 1.5
    reason: Kinetic energy is proportional to T in kelvin
    check_id: chk_build_phy_ptc_0025_ans
