stem: The Sun is about halfway through its time on the main sequence.
parts:
- id: a
  prompt: Will the Sun end its life in a supernova?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: 'Yes: every star ends in a supernova'
      correct: false
      misconception_id: mc.phy.o.small_star_ends_violently
      feedback: Only stars of much more than the Sun's mass end in a supernova. The Sun will swell into a red giant, shed its outer layers and leave a white dwarf.
    - id: B
      text: 'No: it does not have enough mass'
      correct: true
    - id: C
      text: 'No: its fuel will never run out'
      correct: false
      misconception_id: mc.phy.o.stars_never_change
      feedback: A star's fuel runs out in the end. Its life is so long, millions to billions of years, that we never see one star change much.
    - id: D
      text: 'No: it has too little oxygen to burn fast enough'
      correct: false
      misconception_id: mc.phy.o.stars_shine_by_burning
      feedback: There is no oxygen fire in a star. In its core hydrogen nuclei fuse into helium, releasing far more energy than any chemical burning could.
  show_working: false
  hints:
