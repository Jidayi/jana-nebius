      value: 0.005
    check_id: chk_build_phy_cir_0008_tool
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Both components share the energy each coulomb gets from the battery.
  - rung: 2
    name: concept
    text:
      en: In series the p.d.s across the components add up to the supply p.d.
  - rung: 3
    name: first_step
    text:
      en: The resistor has whatever is left after the lamp's share.
  - rung: 4
    name: worked_step
    text:
      en: Take 10 V away from 12 V.
  - rung: 5
    name: full_step
    text:
      en: The voltmeter across the resistor reads 2 V.
  misconception_ids:
