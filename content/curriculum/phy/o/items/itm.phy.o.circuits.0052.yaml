stem: A thermistor and a 3300 Ω fixed resistor are connected in series across a 9 V supply. At 10 °C the thermistor's resistance is 5000 Ω. The output p.d. is taken across the thermistor.
parts:
- id: a
  prompt: Calculate the output p.d. across the thermistor.
  marks: 2
  answer:
    kind: numeric
    value: '5.42'
    unit: V
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_cir_0052_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The two parts of the divider share the supply p.d. in the ratio of their resistances.
  - rung: 2
    name: concept
    text:
      en: Vout = V × (resistance across the output) ÷ (total resistance).
  - rung: 3
    name: first_step
    text:
      en: The total resistance is 3300 Ω + 5000 Ω.
  - rung: 4
    name: worked_step
    text:
      en: The total is 8300 Ω; find 5000/8300 of 9 V.
  - rung: 5
    name: full_step
    text:
      en: The output p.d. is 5.42 V.
  misconception_ids:
  - mc.phy.o.divider_wrong_resistor
  - mc.phy.o.divider_ratio_of_resistors
  - mc.phy.o.series_pd_shared_equally
solution:
  steps:
  - n: 1
    latex: R = 3300 + 5000 = 8300\ \Omega
    reason: Total resistance of the divider
    check_id: chk_build_phy_cir_0052_rt
  - n: 2
    latex: V_{\text{out}} = 9 \times \frac{5000}{8300} = 5.42\ \text{V}
    reason: The output's share is its fraction of the total resistance
    check_id: chk_build_phy_cir_0052_ans
