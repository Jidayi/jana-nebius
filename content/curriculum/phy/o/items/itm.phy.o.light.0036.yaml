id: itm.phy.o.light.0036
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.light.speed_in_medium
stem: Light travels from air into glass of refractive index 1.5.
parts:
- id: a
  prompt: What happens to the speed of the light?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It falls to two-thirds of its speed in air
      correct: true
    - id: B
      text: It rises to one and a half times its speed in air
      correct: false
      misconception_id: mc.phy.o.light_speed_times_index
      feedback: 'Nothing travels faster than light in a vacuum. A material slows light down, so divide c by the refractive index: the bigger n is, the slower the light.'
    - id: C
      text: It stays the same, because light always travels at the same speed
      correct: false
      misconception_id: mc.phy.o.light_speed_same_in_material
      feedback: Light only travels at 3.0 × 10⁸ m/s in a vacuum (and almost that in air). Refraction happens because light is slower in glass or water.
    - id: D
      text: It stays the same, but the colour of the light changes
      correct: false
      misconception_id: mc.phy.o.light_colour_changes_in_glass
      feedback: Red light is still red inside a glass block. The source sets the frequency; at the boundary only the speed and the wavelength change.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Compare the speed of light in a vacuum with its speed in the material.
  - rung: 2
    name: concept
    text:
      en: Refractive index n = c ÷ v, so a bigger refractive index means slower light.
  - rung: 3
    name: first_step
    text:
      en: Light is never faster in a material than in a vacuum.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against n = c ÷ v.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It falls to two-thirds of its speed in air.'
  misconception_ids:
  - mc.phy.o.light_colour_changes_in_glass
  - mc.phy.o.light_speed_same_in_material
  - mc.phy.o.light_speed_times_index
solution:
  steps:
  - n: 1
    latex: \text{It falls to two-thirds of its speed in air}
    reason: Use n = c / v
