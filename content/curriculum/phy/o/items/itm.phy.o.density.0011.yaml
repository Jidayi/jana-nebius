id: itm.phy.o.density.0011
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.density.density_calculation
stem: A material has a density of 240 kg/m³.
parts:
- id: a
  prompt: Write this density in g/cm³.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 240000 g/cm³
      correct: false
      misconception_id: mc.phy.o.density_conversion_direction_swapped
      feedback: Water has a density of 1 g/cm³, and a cubic metre of water has a mass of a tonne, a thousand kilograms. So the number in kg/m³ is always the bigger one.
    - id: B
      text: 0.00024 g/cm³
      correct: false
      misconception_id: mc.phy.o.density_conversion_volume_only
      feedback: 'Convert both parts of the unit: grams to kilograms divides by a thousand, and per cm³ to per m³ multiplies by a million. Together, g/cm³ to kg/m³ is a single multiplication by a thousand.'
    - id: C
      text: 2400 g/cm³
      correct: false
      misconception_id: mc.phy.o.area_volume_factor_not_raised
      feedback: A cube one metre on each side holds a hundred times a hundred times a hundred cubic centimetres. Raise the length factor to the power of the unit.
    - id: D
      text: 0.24 g/cm³
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Think of water: a tonne for every cubic metre is 1 g/cm³.'
  - rung: 2
    name: concept
    text:
      en: 1 g/cm³ is the same as 1000 kg/m³.
  - rung: 3
    name: first_step
    text:
      en: So divide the number in kg/m³ by 1000.
  - rung: 4
    name: worked_step
    text:
      en: Work out 240 ÷ 1000.
  - rung: 5
    name: full_step
    text:
      en: 240 kg/m³ = 0.24 g/cm³.
  misconception_ids:
  - mc.phy.o.area_volume_factor_not_raised
  - mc.phy.o.density_conversion_direction_swapped
  - mc.phy.o.density_conversion_volume_only
solution:
  steps:
  - n: 1
    latex: 1\ \text{g/cm}^3 = 1000\ \text{kg/m}^3
    reason: Grams to kilograms and per cm³ to per m³
    check_id: chk_build_phy_den_0011_k
  - n: 2
    latex: 240 \div 1000 = 0.24\ \text{g/cm}^3
    reason: 'Divide: the g/cm³ number is smaller'
    check_id: chk_build_phy_den_0011_ans
