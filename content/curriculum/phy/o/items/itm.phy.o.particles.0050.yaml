stem: Air in a bicycle pump starts at 100 kPa. With the outlet blocked, the handle is pushed in until the air has a volume of 40 cm³ and a pressure of 200 kPa. Its temperature stays the same.
parts:
- id: a
  prompt: What was the volume of the air at the start?
  marks: 2
  answer:
    kind: numeric
    value: '80'
    unit: cm^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_ptc_0050_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The mass and temperature of the gas stay the same, so pressure × volume stays constant.
  - rung: 2
    name: concept
    text:
      en: p₁V₁ = p₂V₂, and here V₁ is the unknown.
  - rung: 3
    name: first_step
    text:
      en: Work out p₂V₂ = 200 × 40 first.
  - rung: 4
    name: worked_step
    text:
      en: Divide 8000 by the starting pressure, 100 kPa.
  - rung: 5
    name: full_step
    text:
      en: The air started with a volume of 80 cm³.
  misconception_ids:
  - mc.phy.o.boyle_direct_proportion
solution:
  steps:
  - n: 1
    latex: p_2V_2 = 200 \times 40 = 8000
    reason: pV after the change
    check_id: chk_build_phy_ptc_0050_k
  - n: 2
    latex: V_1 = \frac{8000}{100} = 80\ \text{cm}^3
    reason: Divide by the starting pressure
    check_id: chk_build_phy_ptc_0050_ans
