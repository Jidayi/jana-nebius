stem: Only about one alpha particle in several thousand was turned through a large angle.
parts:
- id: a
  prompt: What does the rarity of large deflections tell us?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The nucleus fills most of the atom
      correct: false
      misconception_id: mc.phy.o.nucleus_fills_atom
      feedback: If the nucleus were a pea in the centre of a football stadium, the atom would be the whole stadium. That is why almost every alpha particle missed it.
    - id: B
      text: Most alpha particles bounced back
      correct: false
      misconception_id: mc.phy.o.scattering_most_bounced_back
      feedback: Nearly all the alpha particles went straight through. Only about one in several thousand came back, which is why the result was so surprising.
    - id: C
      text: The nucleus attracts only a few alpha particles
      correct: false
      misconception_id: mc.phy.o.nucleus_negative
      feedback: The alpha particles were pushed away and some were turned right back. Like charges repel, so the nucleus must be positive.
    - id: D
      text: The nucleus is tiny compared with the whole atom
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Recall the three things that happened to alpha particles fired at thin gold foil.
  - rung: 2
    name: concept
    text:
      en: Most went straight through, a few were deflected a little, and a very few were turned back.
  - rung: 3
    name: first_step
    text:
      en: A target that is hard to hit must be small.
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that contradict what was seen.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The nucleus is tiny compared with the whole atom.'
