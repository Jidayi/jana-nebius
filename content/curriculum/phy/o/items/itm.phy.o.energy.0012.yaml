id: itm.phy.o.energy.0012
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.stores_and_transfers
stem: A wind-up toy car runs across the floor and comes to a stop.
parts:
- id: a
  prompt: Where has the energy from its spring ended up?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Mostly in the thermal store of the surroundings
      correct: true
    - id: B
      text: 'Nowhere: it was used up'
      correct: false
      misconception_id: mc.phy.o.energy_used_up
      feedback: 'When a car brakes, its kinetic energy does not vanish: the brakes and the air get warmer. Energy only moves between stores; the total stays the same.'
    - id: C
      text: In the force of friction
      correct: false
      misconception_id: mc.phy.o.energy_force_confused
      feedback: A force is a push or a pull in newtons. Energy is measured in joules, and a force only transfers energy when it moves something along its direction.
    - id: D
      text: In the sound store of the room
      correct: false
      misconception_id: mc.phy.o.transfer_named_as_store
      feedback: 'A store is where energy sits (kinetic, gravitational, elastic, chemical, thermal, nuclear). A transfer is how it moves: by a force, electrically, by heating or by radiation such as light and sound.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide where the energy is at the start and where it ends up.
  - rung: 2
    name: concept
    text:
      en: Friction and air resistance warm things up a little.
  - rung: 3
    name: first_step
    text:
      en: Energy is never made or destroyed; it only moves from store to store.
  - rung: 4
    name: worked_step
    text:
      en: Rule out each option that breaks one of these ideas.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Mostly in the thermal store of the surroundings.'
  misconception_ids:
  - mc.phy.o.energy_force_confused
  - mc.phy.o.energy_used_up
  - mc.phy.o.transfer_named_as_store
solution:
  steps:
  - n: 1
    latex: \text{Mostly in the thermal store of the surroundings}
    reason: Follow the energy from store to store
