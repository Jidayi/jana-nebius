id: itm.phy.o.radioactivity.0007
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.types_of_radiation
stem: A counter near a source reads 678 counts/min with nothing in between, 318 counts/min with a sheet of paper in between, and 168 counts/min with 5 mm of aluminium in between. The background count rate is 28 counts/min.
parts:
- id: a
  prompt: Find the count rate due to beta radiation alone.
  marks: 2
  answer:
    kind: numeric
    value: '150'
    unit: counts/min
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_rad_0007_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Each absorber removes the radiation it can stop; the background is in every reading.
  - rung: 2
    name: concept
    text:
      en: Paper stops alpha; a few millimetres of aluminium stop beta; gamma passes through both.
  - rung: 3
    name: first_step
    text:
      en: So the count rate lost when the paper is swapped for aluminium is the beta.
  - rung: 4
    name: worked_step
    text:
      en: Work out 318 − 168.
  - rung: 5
    name: full_step
    text:
      en: The beta radiation gives 150 counts/min.
  misconception_ids:
  - mc.phy.o.beta_stopped_by_paper
  - mc.phy.o.gamma_stopped_completely
  - mc.phy.o.penetration_order_wrong
solution:
  steps:
  - n: 1
    latex: 318\ \text{(beta + gamma + background)}
    reason: Paper has stopped the alpha
  - n: 2
    latex: 168\ \text{(gamma + background)}
    reason: Aluminium has stopped the beta
  - n: 3
    latex: 318 - 168 = 150\ \text{counts/min}
    reason: The difference is the beta
    check_id: chk_build_phy_rad_0007_ans
