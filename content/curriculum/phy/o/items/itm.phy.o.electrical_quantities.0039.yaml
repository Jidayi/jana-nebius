- kc.phy.o.electrical_quantities.potential_difference
stem: A heater with a p.d. of 230 V across it carries a current of 4 A for 5 minutes.
parts:
- id: a
  prompt: Calculate the energy transferred to the heater.
  marks: 3
  answer:
    kind: numeric
    value: '276000'
    unit: J
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0039_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The p.d. is the energy transferred to each coulomb that passes.
  - rung: 2
    name: concept
    text:
      en: So find the charge first (Q = I t), then use W = Q V.
  - rung: 3
    name: first_step
    text:
      en: Change the time into seconds before you find the charge.
  - rung: 4
    name: worked_step
    text:
      en: The charge is 1200 C; multiply it by 230 V.
  - rung: 5
    name: full_step
    text:
      en: W = 1200 × 230 = 276000 J.
  misconception_ids:
  - mc.phy.o.energy_time_left_out
  - mc.phy.o.minutes_used_as_seconds
  - mc.phy.o.w_qv_divided
solution:
  steps:
  - n: 1
    latex: t = 5\ \text{min} = 300\ \text{s}
    reason: Sixty seconds in each minute
    check_id: chk_build_phy_elq_0039_ts
  - n: 2
    latex: Q = I t = 4 \times 300 = 1200\ \text{C}
    reason: The charge that flows
    check_id: chk_build_phy_elq_0039_q
  - n: 3
    latex: W = Q V = 1200 \times 230 = 276000\ \text{J}
    reason: Energy = charge × p.d.
    check_id: chk_build_phy_elq_0039_ans
