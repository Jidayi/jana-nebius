stem: A pressure is measured as 12000 Pa.
parts:
- id: a
  prompt: Write this pressure in kPa.
  marks: 1
  answer:
    kind: numeric
    value: '12'
    unit: kPa
    unit_policy: equivalent
    tolerance:
      mode: relative
