  hints:
  - rung: 1
    name: orient
    text:
      en: 'Which is the bigger unit: Pa or kPa?'
  - rung: 2
    name: concept
    text:
      en: The prefix in kPa means a thousand times the base unit, Pa.
  - rung: 3
    name: first_step
    text:
      en: Changing to a bigger unit makes the number smaller.
  - rung: 4
    name: worked_step
    text:
      en: So divide by a thousand.
  - rung: 5
    name: full_step
    text:
      en: 12000 Pa = 12 kPa.
  misconception_ids:
  - mc.phy.o.prefix_multiply_divide_swapped
