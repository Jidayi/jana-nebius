id: itm.phy.o.electrical_quantities.0050
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.resistance
stem: A lamp has a resistance of 8 Ω and is connected to a 9 V supply.
parts:
- id: a
  prompt: Calculate the current through it.
  marks: 2
  answer:
    kind: numeric
    value: '1.125'
    unit: A
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_elq_0050_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: For a given p.d., a bigger resistance means a smaller current.
  - rung: 2
    name: concept
    text:
      en: From R = V ÷ I, the current is I = V ÷ R.
  - rung: 3
    name: first_step
    text:
      en: Put the p.d. on top and the resistance underneath.
  - rung: 4
    name: worked_step
    text:
      en: Divide 9 V by 8 Ω.
  - rung: 5
    name: full_step
    text:
      en: I = 9 ÷ 8 = 1.125 A.
  misconception_ids:
  - mc.phy.o.ohm_law_upside_down
  - mc.phy.o.ohm_law_multiplied
solution:
  steps:
  - n: 1
    latex: I = \frac{V}{R} = \frac{9}{8} = 1.125\ \text{A}
    reason: Rearrange R = V/I
    check_id: chk_build_phy_elq_0050_ans
