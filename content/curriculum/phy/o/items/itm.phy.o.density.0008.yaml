stem: A liquid in a drum has a volume of 0.05 m³ and a mass of 46 kg.
parts:
- id: a
  prompt: Calculate the density in kg/m³.
  marks: 1
  answer:
    kind: numeric
    value: '920'
    unit: kg/m^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_den_0008_ans
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Density is the mass of each cubic metre.
  - rung: 2
    name: concept
    text:
      en: Density = mass ÷ volume.
  - rung: 3
    name: first_step
    text:
      en: Both quantities are already in kilograms and cubic metres.
  - rung: 4
    name: worked_step
    text:
      en: Work out 46 ÷ 0.05.
  - rung: 5
    name: full_step
    text:
      en: The density is 920 kg/m³.
  misconception_ids:
