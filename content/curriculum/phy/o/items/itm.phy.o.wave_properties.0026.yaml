id: itm.phy.o.wave_properties.0026
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.wave_properties.wave_equation
stem: Sound travels through air at 340 m/s. A high note from a whistle has a wavelength of 4 cm.
parts:
- id: a
  prompt: Calculate the frequency of the waves.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 85 Hz
      correct: false
      misconception_id: mc.phy.o.wave_prefix_ignored
      feedback: Put every value into hertz, metres and seconds before using a formula, then change the answer into the unit the question asks for.
    - id: B
      text: 0.000118 Hz
      correct: false
      misconception_id: mc.phy.o.wave_equation_inverted
      feedback: 'From v = fλ: λ = v/f and f = v/λ. The speed always goes on top when you divide.'
    - id: C
      text: 8500 Hz
      correct: true
    - id: D
      text: 13.6 Hz
      correct: false
      misconception_id: mc.phy.o.wave_equation_multiplied
      feedback: Multiplying a speed by a frequency gives a huge number that is not a length. If v is one of the values you know, divide it by the other one.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Start from v = f × λ.
  - rung: 2
    name: concept
    text:
      en: 'To find f, divide the speed by the wavelength: f = v ÷ λ.'
  - rung: 3
    name: first_step
    text:
      en: 'First put the values in hertz and metres: 4 cm = 0.04 m.'
  - rung: 4
    name: worked_step
    text:
      en: Divide 340 by the wavelength in metres.
  - rung: 5
    name: full_step
    text:
      en: f = 8500 Hz.
  misconception_ids:
  - mc.phy.o.wave_equation_inverted
  - mc.phy.o.wave_equation_multiplied
  - mc.phy.o.wave_prefix_ignored
solution:
  steps:
  - n: 1
    latex: \lambda = 4\ \text{cm} = 0.04\ \text{m}
    reason: Put the wavelength in metres
    check_id: chk_build_phy_wav_0026_lsi
  - n: 2
    latex: f = \frac{v}{\lambda} = \frac{340}{0.04} = 8500\ \text{Hz}
    reason: Rearrange v = fλ
    check_id: chk_build_phy_wav_0026_ans
