id: itm.phy.o.circuits.0034
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.mixed_circuits
stem: A 4 Ω resistor is connected in series with a parallel pair made of a 10 Ω resistor and a 15 Ω resistor. The circuit is connected to a 24 V battery.
parts:
- id: a
  prompt: Calculate the current through the 10 Ω resistor.
  marks: 4
  answer:
    kind: numeric
    value: '1.44'
    unit: A
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_cir_0034_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The 10 Ω resistor is one branch of the parallel pair.
  - rung: 2
    name: concept
    text:
      en: Find the p.d. across the pair first; the series resistor takes part of the battery p.d.
  - rung: 3
    name: first_step
    text:
      en: Combine the pair, add the series resistor, and find the pair's share of the battery p.d.
  - rung: 4
    name: worked_step
    text:
      en: The pair has 14.4 V across it; divide by 10 Ω.
  - rung: 5
    name: full_step
    text:
      en: The current through the 10 Ω resistor is 1.44 A.
  misconception_ids:
  - mc.phy.o.mixed_branch_gets_full_supply
  - mc.phy.o.parallel_current_same_each_branch
  - mc.phy.o.parallel_current_split_equally
solution:
  steps:
  - n: 1
    latex: R_p = \frac{10 \times 15}{10 + 15} = 6\ \Omega
    reason: Combine the parallel pair
    check_id: chk_build_phy_cir_0034_rp
  - n: 2
    latex: R = 4 + 6 = 10\ \Omega
    reason: Add the series resistor
    check_id: chk_build_phy_cir_0034_rt
  - n: 3
    latex: V_p = \frac{24 \times 6}{10} = 14.4\ \text{V}
    reason: The pair's share of the p.d.
    check_id: chk_build_phy_cir_0034_vp
  - n: 4
    latex: I_2 = \frac{14.4}{10} = 1.44\ \text{A}
    reason: Ohm's law for one branch
    check_id: chk_build_phy_cir_0034_ans
