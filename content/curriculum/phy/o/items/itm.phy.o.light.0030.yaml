id: itm.phy.o.light.0030
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.light.refraction
stem: Light in air strikes the surface of crown glass at an angle of incidence of 40°. The refractive index of crown glass is 1.52.
parts:
- id: a
  prompt: Calculate the angle of refraction.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 26.3°
      correct: false
      misconception_id: mc.phy.o.snell_angles_not_sines
      feedback: 'Angles do not scale in proportion here: doubling an angle does not double its sine. Take the sine of each angle first, then use the ratio.'
    - id: B
      text: 65.0°
      correct: false
      misconception_id: mc.phy.o.refraction_angles_from_surface
      feedback: Draw the normal at right angles to the surface where the ray crosses it. Every angle in the refraction formula is measured from that normal.
    - id: C
      text: 25.0°
      correct: true
    - id: D
      text: 0.423°
      correct: false
      misconception_id: mc.phy.o.snell_inverse_sine_missed
      feedback: A sine is a ratio between 0 and 1, not an angle. Once you have sin r, press the inverse sine to turn it into an angle in degrees.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'The light slows down in the material, so it bends towards the normal: r will be less than i.'
  - rung: 2
    name: concept
    text:
      en: n = sin i ÷ sin r, so sin r = sin i ÷ n.
  - rung: 3
    name: first_step
    text:
      en: Work out sin 40° ÷ 1.52.
  - rung: 4
    name: worked_step
    text:
      en: sin r = 0.423; now take the inverse sine.
  - rung: 5
    name: full_step
    text:
      en: The angle of refraction is 25.0°.
  misconception_ids:
  - mc.phy.o.refraction_angles_from_surface
  - mc.phy.o.snell_angles_not_sines
  - mc.phy.o.snell_inverse_sine_missed
solution:
  steps:
  - n: 1
    latex: \sin r = \frac{\sin 40^\circ}{1.52} = 0.423
    reason: Rearrange n = sin i / sin r
    check_id: chk_build_phy_lgt_0030_sr
  - n: 2
    latex: r = \sin^{-1}(0.423) = 25.0^\circ
    reason: Inverse sine
    check_id: chk_build_phy_lgt_0030_ans
