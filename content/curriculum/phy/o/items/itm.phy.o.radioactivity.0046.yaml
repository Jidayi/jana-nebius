  - rung: 3
    name: first_step
    text:
      en: Then subtract the background count rate from the reading.
  - rung: 4
    name: worked_step
    text:
      en: The background count rate is 25 counts/min.
  - rung: 5
    name: full_step
    text:
      en: The source alone gives 120 counts/min.
