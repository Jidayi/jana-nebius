id: itm.phy.o.motion.0075
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.motion.distance_time_gradient
stem: The distance-time graph for a bus is a straight line from the point (0 s, 0 m) to the point (25 s, 350 m).
parts:
- id: a
  prompt: Use the gradient to find the speed.
  marks: 2
  answer:
    kind: numeric
    value: '14'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0075_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A straight distance-time line means a steady speed. Where on the graph is the speed?
  - rung: 2
    name: concept
    text:
      en: 'The speed is the gradient of the distance-time graph: change in distance divided by change in time.'
  - rung: 3
    name: first_step
    text:
      en: Read the change in distance and the change in time between the two points.
  - rung: 4
    name: worked_step
    text:
      en: Gradient = (350 − 0) ÷ (25 − 0).
  - rung: 5
    name: full_step
    text:
      en: Gradient = (350 − 0) ÷ (25 − 0) = 14 m/s.
  misconception_ids:
  - mc.phy.o.gradient_axes_swapped
  - mc.phy.o.gradient_from_one_point
solution:
  steps:
  - n: 1
    latex: v = \frac{\Delta d}{\Delta t}
    reason: Speed is the gradient of a distance-time graph
  - n: 2
    latex: \Delta d = 350\ \text{m}
    reason: Change in distance
    check_id: chk_build_phy_k_0075_s2
  - n: 3
    latex: \Delta t = 25\ \text{s}
    reason: Change in time
    check_id: chk_build_phy_k_0075_s3
  - n: 4
    latex: v = 14\ \text{m/s}
    reason: Divide
    check_id: chk_build_phy_k_0075_a
