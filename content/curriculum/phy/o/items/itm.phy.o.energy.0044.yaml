id: itm.phy.o.energy.0044
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.potential_energy
stem: A bucket of water of mass 12 kg is lifted through a height of 75 cm. Take g = 9.8 N/kg.
parts:
- id: a
  prompt: Calculate the gain in its gravitational potential energy.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 88.2 J
      correct: true
    - id: B
      text: 8820 J
      correct: false
      misconception_id: mc.phy.o.gpe_height_in_cm
      feedback: With g in N/kg, the height must be in metres. Divide centimetres by a hundred first.
    - id: C
      text: 9 J
      correct: false
      misconception_id: mc.phy.o.energy_mass_for_weight
      feedback: Lifting works against the weight, mg, in newtons. Multiply the mass by g before you multiply by the height.
    - id: D
      text: 44.1 J
      correct: false
      misconception_id: mc.phy.o.gpe_half_from_ke
      feedback: The half belongs to kinetic energy only. The change in gravitational potential energy is simply mgh.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Check the units of the height first.
  - rung: 2
    name: concept
    text:
      en: Use ΔEp = mgΔh with the height in metres.
  - rung: 3
    name: first_step
    text:
      en: 75 cm = 0.75 m.
  - rung: 4
    name: worked_step
    text:
      en: Work out 12 × 9.8 × 0.75.
  - rung: 5
    name: full_step
    text:
      en: The gain is 88.2 J.
  misconception_ids:
  - mc.phy.o.energy_mass_for_weight
  - mc.phy.o.gpe_half_from_ke
  - mc.phy.o.gpe_height_in_cm
solution:
  steps:
  - n: 1
    latex: h = 75\ \text{cm} = 0.75\ \text{m}
    reason: Height in metres
    check_id: chk_build_phy_nrg_0044_h
  - n: 2
    latex: \Delta E_p = 12 \times 9.8 \times 0.75 = 88.2\ \text{J}
    reason: ΔEp = mgΔh
    check_id: chk_build_phy_nrg_0044_ans
