id: itm.phy.o.heat_transfer.0025
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.heat_transfer.convection
stem: Water is heated in a pan on a hob.
parts:
- id: a
  prompt: Which describes the convection current?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Water sinks above the hot base and rises at the cooler sides
      correct: false
      misconception_id: mc.phy.o.heated_fluid_denser
      feedback: Heating makes a fluid expand, so the same mass takes up more space and its density falls. Warm air and water rise; cooled air and water sink.
    - id: B
      text: Water rises above the hot base, spreads out, cools and sinks at the sides
      correct: true
    - id: C
      text: The water stays still; only the heat moves up
      correct: false
      misconception_id: mc.phy.o.heat_itself_rises
      feedback: 'Energy has no up or down. In convection the fluid moves: warmer, less dense fluid is pushed upwards by cooler, denser fluid sinking beneath it.'
    - id: D
      text: The pan's metal flows round with the water
      correct: false
      misconception_id: mc.phy.o.convection_in_solids
      feedback: Convection needs the material itself to move as a current. Particles in a solid stay in place, so solids pass energy on by conduction, not convection.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Convection is the movement of a warm fluid carrying energy with it.
  - rung: 2
    name: concept
    text:
      en: The hottest water is right above the base.
  - rung: 3
    name: first_step
    text:
      en: Ask what happens to the density of a fluid when it is heated or cooled.
  - rung: 4
    name: worked_step
    text:
      en: Rule out options where heat moves by itself or a solid flows.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Water rises above the hot base, spreads out, cools and sinks at the sides.'
  misconception_ids:
  - mc.phy.o.convection_in_solids
  - mc.phy.o.heat_itself_rises
  - mc.phy.o.heated_fluid_denser
solution:
  steps:
  - n: 1
    latex: \text{Water rises above the hot base, spreads out, cools and sinks at the sides}
    reason: Explain the current by changes in density
