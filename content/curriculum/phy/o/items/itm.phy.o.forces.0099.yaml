id: itm.phy.o.forces.0099
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.centre_of_gravity
stem: A tall box is tilted slightly on one edge and then let go.
parts:
- id: a
  prompt: What happens?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It topples over, because it is no longer upright
      correct: false
      misconception_id: mc.phy.o.topples_whenever_tilted
      feedback: 'Tilt a box slightly and let go: it falls back. Its weight still acts inside the base and turns it back. It topples only once the weight acts outside the base.'
    - id: B
      text: It topples, because a tall box is unstable whatever the width of its base
      correct: false
      misconception_id: mc.phy.o.base_width_irrelevant
      feedback: Stand with your feet together and someone can push you over easily; stand with them apart and it is much harder. A wider base means a bigger tilt before toppling.
    - id: C
      text: It falls back only if it is heavy; a light box topples
      correct: false
      misconception_id: mc.phy.o.stability_from_weight_only
      feedback: A load on the roof rack makes a car easier to tip over. Weight added high up raises the centre of gravity and makes an object less stable.
    - id: D
      text: It falls back onto its base
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about where the weight of the object acts and where its base is.
  - rung: 2
    name: concept
    text:
      en: An object topples when the vertical line through its centre of gravity falls outside its base.
  - rung: 3
    name: first_step
    text:
      en: Ask how far the object could tilt before the line of its weight passes outside the base.
  - rung: 4
    name: worked_step
    text:
      en: For a small tilt, is the line of its weight still inside the base?
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It falls back onto its base. Its weight still acts inside the base, so it has a moment that turns the box back.'
  misconception_ids:
  - mc.phy.o.base_width_irrelevant
  - mc.phy.o.stability_from_weight_only
  - mc.phy.o.topples_whenever_tilted
solution:
  steps:
  - n: 1
    latex: \text{It falls back onto its base}
    reason: Find where the weight acts relative to the base
