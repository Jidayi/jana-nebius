stem: A model aeroplane on a control line flies in a circle of radius 12 m. It makes 10 complete revolutions in 30 s at a steady speed.
parts:
- id: a
  prompt: Find its speed.
  marks: 2
  answer:
    kind: numeric
    value: '25.1'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_frc_0073_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: First find the time for one revolution.
  - rung: 2
    name: concept
    text:
      en: Speed round a circle is v = 2πr ÷ T, where T is the period.
  - rung: 3
    name: first_step
    text:
      en: Divide the total time by 10 to get the period.
  - rung: 4
    name: worked_step
    text:
      en: The period is 3 s.
  - rung: 5
    name: full_step
    text:
      en: v = 2π × 12 ÷ 3 = 25.1 m/s.
  misconception_ids:
  - mc.phy.o.orbit_radius_not_circumference
  - mc.phy.o.orbit_total_time_as_period
  - mc.phy.o.time_over_distance
solution:
  steps:
  - n: 1
    latex: T = \frac{30}{10} = 3\ \text{s}
    reason: Time for one revolution
    check_id: chk_build_phy_frc_0073_per
  - n: 2
    latex: v = \frac{2\pi \times 12}{3} = 25.1\ \text{m/s}
    reason: v = 2πr ÷ T
    check_id: chk_build_phy_frc_0073_ans
