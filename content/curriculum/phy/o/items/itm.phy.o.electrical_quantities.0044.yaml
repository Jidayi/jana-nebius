id: itm.phy.o.electrical_quantities.0044
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.electrical_quantities.potential_difference
stem: A cell is labelled 1.5 V.
parts:
- id: a
  prompt: What does its e.m.f. of 1.5 V mean?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It gives 1.5 J of energy to each coulomb of charge it drives round
      correct: true
    - id: B
      text: It pushes each charge with a force of 1.5 N
      correct: false
      misconception_id: mc.phy.o.emf_is_a_force
      feedback: Despite its name, e.m.f. is not a force. It is the energy the cell transfers to each coulomb, so its unit is the volt (a joule per coulomb).
    - id: C
      text: It stores 1.5 C of charge, which the circuit uses up
      correct: false
      misconception_id: mc.phy.o.charge_used_up_in_lamp
      feedback: Ammeters before and after a lamp read the same. The charges keep flowing; what they lose in the lamp is energy.
    - id: D
      text: A current of 1.5 V flows through each lamp
      correct: false
      misconception_id: mc.phy.o.pd_flows_through_component
      feedback: Current flows through a lamp; p.d. is across it. That is why a voltmeter is connected across, in parallel.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what a volt measures.
  - rung: 2
    name: concept
    text:
      en: P.d. and e.m.f. both measure the energy transferred per unit charge, and charge is never used up.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: E.m.f. is the energy a source transfers to each unit of charge.
  - rung: 5
    name: full_step
    text:
      en: It gives 1.5 J of energy to each coulomb of charge it drives round. E.m.f. is the energy a source transfers to each unit of charge.
  misconception_ids:
  - mc.phy.o.charge_used_up_in_lamp
  - mc.phy.o.emf_is_a_force
  - mc.phy.o.pd_flows_through_component
