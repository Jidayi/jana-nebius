stem: A black car and a white car are parked in strong sunshine.
parts:
- id: a
  prompt: Which car's metal gets hotter, and why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: The white car, because white surfaces absorb more
      correct: false
      misconception_id: mc.phy.o.shiny_surfaces_better_radiators
      feedback: Dull black surfaces are the best absorbers and the best emitters of infrared. Shiny, light surfaces reflect most of it and emit little.
    - id: B
      text: The black car, because black surfaces absorb more infrared
      correct: true
    - id: C
      text: Both equally, because colour does not affect infrared
      correct: false
      misconception_id: mc.phy.o.colour_irrelevant_for_infrared
      feedback: In sunshine a black car bonnet gets much hotter than a white one. Surface colour and texture strongly change how much infrared is absorbed and emitted.
    - id: D
      text: The white car, because black is a good emitter and so cannot be a good absorber
      correct: false
      misconception_id: mc.phy.o.good_absorber_poor_emitter
      feedback: A good absorber is also a good emitter. A dull black kettle warms quickly in sunshine and also cools quickly in the shade.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Infrared is an electromagnetic wave given out by every object; hotter objects give out more.
  - rung: 2
    name: concept
    text:
      en: Both cars receive the same sunshine.
  - rung: 3
    name: first_step
    text:
      en: 'Compare the surfaces: dull black is the best absorber and emitter, shiny silver or white the worst.'
  - rung: 4
    name: worked_step
    text:
      en: Rule out options that need a material for radiation to travel through, or treat cold as something that flows.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The black car, because black surfaces absorb more infrared.'
  misconception_ids:
  - mc.phy.o.colour_irrelevant_for_infrared
  - mc.phy.o.good_absorber_poor_emitter
  - mc.phy.o.shiny_surfaces_better_radiators
solution:
  steps:
  - n: 1
    latex: \text{The black car, because black surfaces absorb more infrared}
    reason: Apply what affects emission and absorption
