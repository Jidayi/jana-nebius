id: itm.phy.o.magnetism.0011
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.magnetism.magnets_and_materials
stem: The north pole of a magnet is held near one end of an iron rod.
parts:
- id: a
  prompt: Which pole is induced at the end of the rod nearest the magnet?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: A north pole
      correct: false
      misconception_id: mc.phy.o.induced_pole_same_as_inducing
      feedback: A north pole induces a south pole in the near end of the iron. Unlike poles attract, which is why iron is always pulled towards a magnet.
    - id: B
      text: No pole, because the rod is not a magnet to begin with
      correct: false
      misconception_id: mc.phy.o.unmagnetised_iron_unaffected
      feedback: A magnet picks up ordinary steel paper clips. It first induces magnetism in them, and then attracts them.
    - id: C
      text: No pole until the rod touches the magnet
      correct: false
      misconception_id: mc.phy.o.magnetic_force_needs_contact
      feedback: A compass needle swings when a magnet is still a hand's width away. Magnetic forces act at a distance.
    - id: D
      text: A south pole
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Recall the two rules: how poles act on each other, and which materials are magnetic.'
  - rung: 2
    name: concept
    text:
      en: Like poles repel and unlike poles attract. Only a few metals are magnetic, and magnetic materials differ in how easily they gain and lose their magnetism.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Induced magnetism puts the opposite pole nearest the magnet, so the rod is attracted.
  - rung: 5
    name: full_step
    text:
      en: A south pole. Induced magnetism puts the opposite pole nearest the magnet, so the rod is attracted.
  misconception_ids:
  - mc.phy.o.induced_pole_same_as_inducing
  - mc.phy.o.magnetic_force_needs_contact
  - mc.phy.o.unmagnetised_iron_unaffected
solution:
  steps:
  - n: 1
    latex: \text{A south pole}
    reason: Apply the rules for poles and magnetic materials
