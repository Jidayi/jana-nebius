id: itm.phy.o.forces.0094
version: 0.1.1
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.forces.moments
stem: A hanging basket of mass 4 kg hangs from the end of a bracket, 40 cm out from the wall. Take g = 10 N/kg.
parts:
- id: a
  prompt: Find the moment of its weight about the point where the bracket is fixed to the wall, in N m.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 1.6 N m
      correct: false
      misconception_id: mc.phy.o.mass_in_kg_used_as_force
      feedback: Mass is measured in kilograms; forces are in newtons. Turn a mass into its weight with weight = mass × g before you use it as a force.
    - id: B
      text: 1600 N m
      correct: false
      misconception_id: mc.phy.o.moment_cm_not_converted
      feedback: A moment in N m needs the distance in metres. Change centimetres into metres before you multiply.
    - id: C
      text: 16 N m
      correct: true
    - id: D
      text: 100 N m
      correct: false
      misconception_id: mc.phy.o.moment_force_over_distance
      feedback: 'A longer spanner makes a nut easier to turn, so the turning effect grows with the distance: multiply.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: A moment is force × perpendicular distance from the pivot.
  - rung: 2
    name: concept
    text:
      en: The force here is the weight of the object, not its mass.
  - rung: 3
    name: first_step
    text:
      en: Find the weight, change the distance into metres, then multiply.
  - rung: 4
    name: worked_step
    text:
      en: The weight is 40 N and the distance is 0.4 m.
  - rung: 5
    name: full_step
    text:
      en: Moment = 40 × 0.4 = 16 N m.
  misconception_ids:
  - mc.phy.o.mass_in_kg_used_as_force
  - mc.phy.o.moment_cm_not_converted
  - mc.phy.o.moment_force_over_distance
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: W = 4 \times 10 = 40\ \text{N}
    reason: The force is the weight
    check_id: chk_build_phy_frc_0094_w
  - n: 2
    latex: d = 40\ \text{cm} = 0.4\ \text{m}
    reason: Distance in metres
    check_id: chk_build_phy_frc_0094_d
  - n: 3
    latex: M = Fd = 40 \times 0.4 = 16\ \text{N m}
    reason: Moment = force × perpendicular distance
    check_id: chk_build_phy_frc_0094_ans
