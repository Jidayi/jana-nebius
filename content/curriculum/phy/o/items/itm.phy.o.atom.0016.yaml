stem: An element has two isotopes, with nucleon numbers 63 and 65.
parts:
- id: a
  prompt: Which of these is different for the two isotopes?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The number of neutrons in the nucleus
      correct: true
    - id: B
      text: The number of protons in the nucleus
      correct: false
      misconception_id: mc.phy.o.isotopes_differ_in_protons
      feedback: Change the number of protons and you change the element. Isotopes of one element all have the same proton number; only the neutrons differ.
    - id: C
      text: The number of electrons in a neutral atom
      correct: false
      misconception_id: mc.phy.o.isotopes_differ_in_electrons
      feedback: A neutral atom has one electron for each proton. Isotopes share the proton number, so their neutral atoms have the same electrons.
    - id: D
      text: The way the atoms react with acids
      correct: false
      misconception_id: mc.phy.o.isotopes_differ_chemically
      feedback: Chemical reactions depend on the electrons. Isotopes have the same electrons, so they react in the same way.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide what makes two nuclides the same element.
  - rung: 2
    name: concept
    text:
      en: Isotopes have the same proton number but different nucleon numbers.
  - rung: 3
    name: first_step
    text:
      en: The element is the same, so the proton number is the same.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against that definition.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The number of neutrons in the nucleus.'
