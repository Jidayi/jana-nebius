id: itm.phy.o.motion.0101
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.motion.velocity_time_area
stem: The velocity-time graph for a car is a horizontal line at 15 m/s from 0 s to 12 s.
parts:
- id: a
  prompt: Find the distance travelled in this time.
  marks: 2
  answer:
    kind: numeric
    value: '180'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0101_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The area under a velocity-time graph gives the distance travelled. What shape is the area here?
  - rung: 2
    name: concept
    text:
      en: 'A horizontal line makes a rectangle: area = height × width.'
  - rung: 3
    name: first_step
    text:
      en: The height is the velocity and the width is the time.
  - rung: 4
    name: worked_step
    text:
      en: Distance = 15 × 12.
  - rung: 5
    name: full_step
    text:
      en: Distance = 15 × 12 = 180 m.
  misconception_ids:
  - mc.phy.o.vt_area_divided
solution:
  steps:
  - n: 1
    latex: d = v t
    reason: The area under the line is a rectangle
  - n: 2
    latex: d = 15 \times 12
    reason: Substitute
  - n: 3
    latex: d = 180\ \text{m}
    reason: Multiply
    check_id: chk_build_phy_k_0101_a
