id: itm.phy.o.particles.0057
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.particles.pressure_and_volume
stem: Gas in a cylinder with a piston has a volume of 40 cm³ at a pressure of 250 kPa. It is slowly compressed by 10 cm³, at constant temperature.
parts:
- id: a
  prompt: Find the new pressure of the gas.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 187.5 kPa
      correct: false
      misconception_id: mc.phy.o.boyle_direct_proportion
      feedback: Squash a gas into half the space and its pressure doubles, it does not halve. For a fixed mass at constant temperature pV stays the same, so as one goes up the other goes down.
    - id: B
      text: 333 kPa
      correct: true
    - id: C
      text: 250 kPa
      correct: false
      misconception_id: mc.phy.o.gas_pressure_unchanged
      feedback: 'Push in a sealed syringe and you feel the push back grow: the same gas in a smaller space hits the walls more often. Pressure depends on volume and temperature, not only on the amount of gas.'
    - id: D
      text: 1000 kPa
      correct: false
      misconception_id: mc.phy.o.boyle_change_used_as_volume
      feedback: p₂ and V₂ are the values after the change. If the volume falls by 20 cm³ from 60 cm³, the new volume is 40 cm³, not 20 cm³.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The mass and temperature of the gas stay the same, so pressure × volume stays constant.
  - rung: 2
    name: concept
    text:
      en: Use p₁V₁ = p₂V₂, where p₂ and V₂ are the values after the change.
  - rung: 3
    name: first_step
    text:
      en: 'First find the new volume: 40 cm³ minus 10 cm³.'
  - rung: 4
    name: worked_step
    text:
      en: Divide 10000 by the new volume.
  - rung: 5
    name: full_step
    text:
      en: The new pressure is 333 kPa.
  misconception_ids:
  - mc.phy.o.boyle_change_used_as_volume
  - mc.phy.o.boyle_direct_proportion
  - mc.phy.o.gas_pressure_unchanged
solution:
  steps:
  - n: 1
    latex: V_2 = 40 - 10 = 30\ \text{cm}^3
    reason: The new volume
    check_id: chk_build_phy_ptc_0057_nv
  - n: 2
    latex: p_1V_1 = p_2V_2
    reason: 'Boyle''s law: fixed mass at constant temperature'
  - n: 3
    latex: p_1V_1 = 250 \times 40 = 10000
    reason: pV before the change
    check_id: chk_build_phy_ptc_0057_k
  - n: 4
    latex: p_2 = \frac{10000}{30} = 333\ \text{kPa}
    reason: Divide by the new volume
    check_id: chk_build_phy_ptc_0057_ans
