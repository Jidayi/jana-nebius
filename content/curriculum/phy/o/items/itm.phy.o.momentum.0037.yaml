id: itm.phy.o.momentum.0037
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.momentum.impulse
stem: 'A ball hits a wall at the same speed twice: once it sticks, once it bounces straight back.'
parts:
- id: a
  prompt: In which case is the change in momentum larger?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: When it sticks, because it ends up stopped
      correct: false
      misconception_id: mc.phy.o.rebound_change_subtracted
      feedback: 'Take towards the wall as positive: the velocity goes from +u to −v, a change of u + v. A bounce changes the momentum more than a stop does.'
    - id: B
      text: When it bounces back
      correct: true
    - id: C
      text: They are the same, because the speed before is the same
      correct: false
      misconception_id: mc.phy.o.impulse_initial_momentum_only
      feedback: The change in momentum is final momentum minus initial momentum. After a bounce the final momentum is not zero.
    - id: D
      text: When it sticks, because sticking takes more force
      correct: false
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Impulse = force × time, and it equals the change in momentum.
  - rung: 2
    name: concept
    text:
      en: For a given change in momentum, a longer stopping time means a smaller force.
  - rung: 3
    name: first_step
    text:
      en: Decide whether each option changes the momentum change or the time it takes.
  - rung: 4
    name: worked_step
    text:
      en: 'Give the velocity a sign: after a bounce it points the other way.'
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: When it bounces back. A bounce reverses the velocity, so the change is bigger than just stopping.'
  misconception_ids:
  - mc.phy.o.impulse_initial_momentum_only
  - mc.phy.o.rebound_change_subtracted
solution:
  steps:
  - n: 1
    latex: \text{When it bounces back}
    reason: Use impulse = FΔt = Δp
