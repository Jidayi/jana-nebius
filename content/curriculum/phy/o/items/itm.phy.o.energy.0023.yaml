id: itm.phy.o.energy.0023
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.energy.kinetic_energy
stem: A lorry of mass 8000 kg has 900 kJ of kinetic energy.
parts:
- id: a
  prompt: Calculate the speed.
  marks: 3
  answer:
    kind: numeric
    value: '15'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_nrg_0023_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You know the kinetic energy and the mass; the speed is the unknown.
  - rung: 2
    name: concept
    text:
      en: Rearrange Ek = ½mv² to get v² = 2Ek ÷ m, with Ek in joules.
  - rung: 3
    name: first_step
    text:
      en: Work out 2 × 900000 ÷ 8000 to find v².
  - rung: 4
    name: worked_step
    text:
      en: v² = 225; now take the square root.
  - rung: 5
    name: full_step
    text:
      en: The speed is 15 m/s.
  misconception_ids:
  - mc.phy.o.ke_speed_not_rooted
  - mc.phy.o.ke_half_omitted
  - mc.phy.o.ke_rearrange_half_wrong
solution:
  steps:
  - n: 1
    latex: E_k = 900\ \text{kJ} = 900000\ \text{J}
    reason: Change kJ to J
    check_id: chk_build_phy_nrg_0023_e
  - n: 2
    latex: v^2 = \frac{2E_k}{m} = \frac{2 \times 900000}{8000} = 225
    reason: Rearrange E_k = ½mv²
    check_id: chk_build_phy_nrg_0023_vsq
  - n: 3
    latex: v = \sqrt{225} = 15\ \text{m/s}
    reason: Take the square root
    check_id: chk_build_phy_nrg_0023_ans
difficulty:
  prior: 0.3
  band: core
