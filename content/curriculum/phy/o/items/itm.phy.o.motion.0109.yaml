stem: A trolley starts at 0 m/s and accelerates at 1.5 m/s^2 for 6 s.
parts:
- id: a
  prompt: Find how far it travels.
  marks: 3
  answer:
    kind: numeric
    value: '27.0'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0109_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'List u, v, a, s and t: which do you know, which is asked for, and which is not involved?'
  - rung: 2
    name: concept
    text:
      en: Choose the equation of uniform acceleration that has the quantities you know and the one you want, and leaves out the one that is not involved.
  - rung: 3
    name: first_step
    text:
      en: Use s = ut + ½at^2.
  - rung: 4
    name: worked_step
    text:
      en: s = 0 × 6 + ½ × 1.5 × 6^2.
  - rung: 5
    name: full_step
    text:
      en: s = 0 × 6 + ½ × 1.5 × 6^2 gives 27.0 m.
  misconception_ids:
  - mc.phy.o.equation_with_unknown_time
solution:
  steps:
  - n: 1
    latex: s = ut + \tfrac{1}{2}at^2
    reason: The equation with the known and wanted quantities only
  - n: 2
    latex: s = 0 \times 6 + \tfrac{1}{2} \times 1.5 \times 6^2
    reason: Substitute
    check_id: chk_build_phy_k_0109_a
  - n: 3
    latex: s = 27.0\ \text{m}
    reason: Evaluate
    check_id: chk_build_phy_k_0109_a
