id: itm.phy.o.stars.0041
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.stars.expanding_universe
stem: The cosmic microwave background is very nearly the same in every direction.
parts:
- id: a
  prompt: Why does this support the Big Bang theory?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It shows the Big Bang happened at one point that we can see
      correct: false
      misconception_id: mc.phy.o.big_bang_centre_in_space
      feedback: Space itself is expanding everywhere, like dots on a balloon being blown up. Every galaxy sees the others moving away; there is no centre.
    - id: B
      text: The whole early Universe was hot, so its leftover radiation fills all of space
      correct: true
    - id: C
      text: It shows stars have always given out microwaves
      correct: false
      misconception_id: mc.phy.o.cmb_is_starlight
      feedback: The microwave background is radiation left from the hot early Universe, stretched to microwave wavelengths by the expansion. It comes evenly from every direction.
    - id: D
      text: It shows the Universe has never changed
      correct: false
      misconception_id: mc.phy.o.universe_unchanging
      feedback: 'Distant galaxies all show redshift that grows with distance: the Universe is expanding, so it was once much smaller and hotter.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what redshift tells us about how galaxies move.
  - rung: 2
    name: concept
    text:
      en: Redshift is a stretch of light to longer wavelengths, caused by a galaxy moving away from us.
  - rung: 3
    name: first_step
    text:
      en: 'More distant galaxies show more redshift, so they recede faster: the Universe is expanding from a hot, dense start.'
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these ideas.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The whole early Universe was hot, so its leftover radiation fills all of space.'
  misconception_ids:
  - mc.phy.o.big_bang_centre_in_space
  - mc.phy.o.cmb_is_starlight
  - mc.phy.o.universe_unchanging
