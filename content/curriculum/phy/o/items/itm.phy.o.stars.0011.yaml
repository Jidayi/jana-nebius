stem: The star nearest to the Sun, Proxima Centauri, is 4.2 light-years away.
parts:
- id: a
  prompt: Which statement about this star is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: It is 4.2 years old
      correct: false
      misconception_id: mc.phy.o.light_year_is_time
      feedback: 'A light-year is a distance: how far light travels in one year, about 9.5 × 10¹⁵ m.'
    - id: B
      text: We see it exactly as it is today
      correct: false
      misconception_id: mc.phy.o.distant_light_seen_now
      feedback: Light takes time to travel. Light from a star 100 light-years away left it 100 years ago, so we see the star as it was then.
    - id: C
      text: It moves away from us at 4.2 light-years
      correct: false
      misconception_id: mc.phy.o.light_year_is_speed
      feedback: Speed × time = distance. The speed of light multiplied by one year gives a distance, the light-year.
    - id: D
      text: Its light takes 4.2 years to reach us
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Remember what kind of quantity a light-year is.
  - rung: 2
    name: concept
    text:
      en: A light-year measures how far light goes in a year.
  - rung: 3
    name: first_step
    text:
      en: One light-year = speed of light × the number of seconds in a year.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against this.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Its light takes 4.2 years to reach us.'
  misconception_ids:
  - mc.phy.o.distant_light_seen_now
  - mc.phy.o.light_year_is_speed
  - mc.phy.o.light_year_is_time
