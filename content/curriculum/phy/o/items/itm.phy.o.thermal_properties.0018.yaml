id: itm.phy.o.thermal_properties.0018
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.specific_heat_capacity
stem: A 1.5 kW kettle heats 1.5 kg of water from 18 °C to 100 °C. The specific heat capacity of water is 4200 J/(kg °C). Assume all the energy goes into the water.
parts:
- id: a
  prompt: How long does this take, in seconds?
  marks: 3
  answer:
    kind: numeric
    value: '344.4'
    unit: s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_thp_0018_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: First find the energy the water needs, then how long the kettle takes to supply it.
  - rung: 2
    name: concept
    text:
      en: E = mcΔθ for the energy; t = E ÷ P for the time.
  - rung: 3
    name: first_step
    text:
      en: The temperature rise is from 18 °C to 100 °C.
  - rung: 4
    name: worked_step
    text:
      en: The water needs 516600 J; the kettle supplies 1500 J each second.
  - rung: 5
    name: full_step
    text:
      en: It takes 344.4 s.
solution:
  steps:
  - n: 1
    latex: \Delta\theta = 100 - 18 = 82\ ^\circ\text{C}
    reason: The temperature rise
    check_id: chk_build_phy_thp_0018_dt
  - n: 2
    latex: E = mc\Delta\theta = 1.5 \times 4200 \times 82 = 516600\ \text{J}
    reason: Energy needed
    check_id: chk_build_phy_thp_0018_e
  - n: 3
    latex: P = 1.5\ \text{kW} = 1500\ \text{W}
    reason: Watts are joules per second
    check_id: chk_build_phy_thp_0018_pw
  - n: 4
    latex: t = \frac{E}{P} = \frac{516600}{1500} = 344.4\ \text{s}
    reason: Time = energy ÷ power
    check_id: chk_build_phy_thp_0018_ans
