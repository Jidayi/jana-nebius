    text:
      en: What does the period of a wave measure?
  - rung: 2
    name: concept
    text:
      en: The period is the time for one complete wave; the frequency is the number of waves each second.
  - rung: 3
    name: first_step
    text:
      en: So the period is 1 divided by the frequency.
  - rung: 4
    name: worked_step
    text:
      en: Work out 1 ÷ 40.
  - rung: 5
    name: full_step
    text:
      en: T = 0.025 s.
