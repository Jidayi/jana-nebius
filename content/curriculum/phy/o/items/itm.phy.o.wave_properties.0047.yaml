stem: Water waves pass through a narrow gap and spread out on the other side.
parts:
- id: a
  prompt: What happens to their wavelength?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: It gets longer as the waves spread out
      correct: false
      misconception_id: mc.phy.o.diffraction_changes_wavelength
      feedback: Diffraction changes only the direction and shape of the wavefronts. The water depth is the same, so the speed, wavelength and frequency are too.
    - id: B
      text: It gets shorter because the gap squeezes the waves
      correct: false
      misconception_id: mc.phy.o.diffraction_changes_wavelength
      feedback: Diffraction changes only the direction and shape of the wavefronts. The water depth is the same, so the speed, wavelength and frequency are too.
    - id: C
      text: It changes because the waves have been refracted by the gap
      correct: false
      misconception_id: mc.phy.o.wave_effects_confused
      feedback: 'Reflection: bouncing back from a barrier. Refraction: changing direction because the speed changes. Diffraction: spreading out through a gap or round an edge.'
    - id: D
      text: It stays the same
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Decide which effect is involved here.
  - rung: 2
    name: concept
    text:
      en: Spreading through a gap does not change the depth of the water.
  - rung: 3
    name: first_step
    text:
      en: Speed and wavelength change only when the depth of the water changes.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against this.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: It stays the same.'
  misconception_ids:
