stem: Nuclide P has 8 protons and 8 neutrons. Nuclide Q has 8 protons and 10 neutrons.
parts:
- id: a
  prompt: Which describes P and Q?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Two different elements, because their nucleon numbers differ
      correct: false
      misconception_id: mc.phy.o.heavier_isotope_different_element
      feedback: 'Carbon-12 and carbon-14 are both carbon: both have six protons. The proton number alone decides the element.'
    - id: B
      text: Isotopes of one element, with Q the heavier
      correct: true
    - id: C
      text: Not isotopes, because their neutron numbers differ
      correct: false
      misconception_id: mc.phy.o.isotopes_same_neutrons
      feedback: Isotopes are the same element, so they share the proton number. Their neutron numbers are what differ.
    - id: D
      text: Isotopes, so Q has 10 electrons in a neutral atom
      correct: false
      misconception_id: mc.phy.o.isotopes_differ_in_electrons
      feedback: A neutral atom has one electron for each proton. Isotopes share the proton number, so their neutral atoms have the same electrons.
  show_working: false
