id: itm.phy.o.electromagnetism.0043
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.electromagnetism.electromagnetic_induction
stem: A bicycle dynamo has a magnet that spins inside a fixed coil.
parts:
- id: a
  prompt: Why is an e.m.f. induced in the coil?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: The magnet is close to the coil, even when still
      correct: false
      misconception_id: mc.phy.o.stationary_magnet_induces
      feedback: Leave a magnet still inside a coil and the meter reads zero. Only movement, or a changing field, induces an e.m.f.
    - id: B
      text: The coil is part of a complete circuit with a lamp
      correct: false
      misconception_id: mc.phy.o.emf_needs_closed_circuit
      feedback: A voltmeter across the ends of an open coil shows an e.m.f. when a magnet moves in it; only a current needs a complete circuit.
    - id: C
      text: The magnet spins slowly, and slow changes give the biggest e.m.f.
      correct: false
      misconception_id: mc.phy.o.induction_factor_reversed
      feedback: The faster the field changes, the bigger the e.m.f. Faster motion, a stronger magnet and more turns all increase it.
    - id: D
      text: The magnetic field through the coil keeps changing
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Ask what is changing in the magnetic field through the coil.
  - rung: 2
    name: concept
    text:
      en: An e.m.f. is induced while the field through a coil changes; faster change, a stronger magnet and more turns give a bigger e.m.f., and reversing the change reverses it.
  - rung: 3
    name: first_step
    text:
      en: Test each option against that idea.
  - rung: 4
    name: worked_step
    text:
      en: Induction needs a changing field through the coil, here from the spinning magnet.
  - rung: 5
    name: full_step
    text:
      en: The magnetic field through the coil keeps changing. Induction needs a changing field through the coil, here from the spinning magnet.
  misconception_ids:
  - mc.phy.o.emf_needs_closed_circuit
  - mc.phy.o.induction_factor_reversed
  - mc.phy.o.stationary_magnet_induces
solution:
  steps:
  - n: 1
    latex: \text{The magnetic field through the coil keeps changing}
    reason: A changing field induces an e.m.f.
