id: itm.phy.o.particles.0032
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.particles.gas_pressure_particles
stem: The outlet of a bicycle pump is blocked with a finger, and the handle is pushed in halfway. The temperature of the air stays the same.
parts:
- id: a
  prompt: Which statement about the air particles is correct?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: They move at the same average speed but hit the walls more often
      correct: true
    - id: B
      text: They move faster, and that is why the pressure rises
      correct: false
      misconception_id: mc.phy.o.compression_speeds_particles
      feedback: At constant temperature the particles keep the same average speed. Squeezed into less space, they reach each wall sooner and hit it more often, so the pressure rises.
    - id: C
      text: They hit each other more often, and that is what the finger feels
      correct: false
      misconception_id: mc.phy.o.pressure_from_interparticle_collisions
      feedback: Pressure is a force on a surface. Only collisions with the container's walls push on it; particles bumping into each other in the middle push on no wall.
    - id: D
      text: They hit the walls as often as before, so the pressure is unchanged
      correct: false
      misconception_id: mc.phy.o.gas_pressure_unchanged
      feedback: 'Push in a sealed syringe and you feel the push back grow: the same gas in a smaller space hits the walls more often. Pressure depends on volume and temperature, not only on the amount of gas.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Pressure is a force on each square metre of a surface. What exerts force on the walls of a container of gas?
  - rung: 2
    name: concept
    text:
      en: The same number of particles now has less room to move about in.
  - rung: 3
    name: first_step
    text:
      en: Ask whether the change alters how fast the particles move, how often they hit the walls, or both.
  - rung: 4
    name: worked_step
    text:
      en: Rule out explanations that rely on the weight of the gas or on particles changing size.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: They move at the same average speed but hit the walls more often.'
  misconception_ids:
  - mc.phy.o.compression_speeds_particles
  - mc.phy.o.gas_pressure_unchanged
  - mc.phy.o.pressure_from_interparticle_collisions
solution:
  steps:
  - n: 1
    latex: \text{They move at the same average speed but hit the walls more often}
    reason: Explain the pressure by collisions with the walls
