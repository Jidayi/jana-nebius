id: itm.phy.o.light.0062
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.light.converging_lens
stem: A candle stands 25 cm from a thin converging lens of focal length 20 cm.
parts:
- id: a
  prompt: Calculate the magnification of the image.
  marks: 3
  answer:
    kind: numeric
    value: '4'
    unit: null
    unit_policy: none
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_lgt_0062_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You need the image distance before the magnification.
  - rung: 2
    name: concept
    text:
      en: 1/v = 1/f − 1/u, and then magnification = v ÷ u.
  - rung: 3
    name: first_step
    text:
      en: Find v from 1/20 − 1/25.
  - rung: 4
    name: worked_step
    text:
      en: v = 100 cm; divide it by 25.
  - rung: 5
    name: full_step
    text:
      en: The magnification is 4.
  misconception_ids:
  - mc.phy.o.lens_magnification_inverted
  - mc.phy.o.lens_reciprocals_added
  - mc.phy.o.lens_image_same_size
solution:
  steps:
  - n: 1
    latex: \frac{1}{v} = \frac{1}{20} - \frac{1}{25} \Rightarrow v = 100\ \text{cm}
    reason: Lens formula
    check_id: chk_build_phy_lgt_0062_v
  - n: 2
    latex: m = \frac{v}{u} = \frac{100}{25} = 4
    reason: Magnification = v / u
    check_id: chk_build_phy_lgt_0062_ans
