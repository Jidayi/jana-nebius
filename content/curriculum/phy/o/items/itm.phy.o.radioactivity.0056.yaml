id: itm.phy.o.radioactivity.0056
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.background_radiation
stem: 'A background count is repeated for one minute at a time: the readings are not all the same.'
parts:
- id: a
  prompt: Why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Radioactive decay is random, so counts vary from minute to minute
      correct: true
    - id: B
      text: The counter must be faulty, because decay is perfectly regular
      correct: false
      misconception_id: mc.phy.o.decay_not_random
      feedback: No one can say when a particular nucleus will decay. Counts over equal times vary a little, so repeat them and take a mean.
    - id: C
      text: Radio signals in the room change from minute to minute
      correct: false
      misconception_id: mc.phy.o.background_from_non_ionising
      feedback: 'Background radiation means ionising radiation: alpha, beta and gamma from radioactive substances, and cosmic rays. Radio and phone signals do not ionise and are not counted.'
    - id: D
      text: A nearby nuclear power station switches on and off
      correct: false
      misconception_id: mc.phy.o.background_mostly_artificial
      feedback: 'Most background is natural: radon gas from the ground, rocks and buildings, cosmic rays, and our food. Nuclear power adds only a tiny share.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Background radiation is ionising radiation that is around us all the time.
  - rung: 2
    name: concept
    text:
      en: Most of it comes from natural sources in the ground, the air, space and our food.
  - rung: 3
    name: first_step
    text:
      en: Can you predict exactly when a particular nucleus will decay?
  - rung: 4
    name: worked_step
    text:
      en: Rule out the options that are not ionising radiation or that ignore natural sources.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Radioactive decay is random, so counts vary from minute to minute.'
  misconception_ids:
  - mc.phy.o.background_from_non_ionising
  - mc.phy.o.background_mostly_artificial
  - mc.phy.o.decay_not_random
solution:
  steps:
  - n: 1
    latex: \text{Radioactive decay is random, so counts vary from minute to minute}
    reason: Background is natural ionising radiation
