subject: phy
level: o
kc_ids:
- kc.phy.o.measurement.resultant_vectors
stem: A drone flies 2.5 km east and then 6 km north.
parts:
- id: a
  prompt: Calculate the size of the resultant displacement.
  marks: 2
  answer:
    kind: numeric
    value: '6.5'
    unit: km
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mea_0032_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Sketch the two vectors nose to tail: they make two sides of a right-angled triangle.'
  - rung: 2
    name: concept
    text:
      en: The resultant is the hypotenuse.
  - rung: 3
    name: first_step
    text:
      en: Square each vector, add the squares, then take the square root.
  - rung: 4
    name: worked_step
    text:
      en: 2.5² + 6² = 42.25.
  - rung: 5
    name: full_step
    text:
      en: The resultant is √42.25 = 6.5 km.
  misconception_ids:
  - mc.phy.o.resultant_adds_sizes
  - mc.phy.o.pythagoras_subtracted
  - mc.phy.o.perpendicular_subtracted
solution:
  steps:
  - n: 1
    latex: R^2 = 2.5^2 + 6^2 = 42.25
    reason: 'At right angles: Pythagoras'
    check_id: chk_build_phy_mea_0032_sq
  - n: 2
    latex: R = \sqrt{42.25} = 6.5\ \text{km}
    reason: Square root
    check_id: chk_build_phy_mea_0032_ans
