id: itm.phy.o.motion.0121
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.motion.choose_equation
stem: A train speeds up steadily from 4 m/s to 14 m/s while it travels 250 m.
parts:
- id: a
  prompt: Find its acceleration.
  marks: 3
  answer:
    kind: numeric
    value: '0.360'
    unit: m/s^2
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0121_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: 'List u, v, a, s and t: which do you know, which is asked for, and which is not involved?'
  - rung: 2
    name: concept
    text:
      en: Choose the equation of uniform acceleration that has the quantities you know and the one you want, and leaves out the one that is not involved.
  - rung: 3
    name: first_step
    text:
      en: Use v^2 = u^2 + 2as.
  - rung: 4
    name: worked_step
    text:
      en: 14^2 = 4^2 + 2 × a × 250; rearrange for a.
  - rung: 5
    name: full_step
    text:
      en: 14^2 = 4^2 + 2 × a × 250 gives 0.360 m/s^2.
  misconception_ids:
  - mc.phy.o.equation_with_unknown_time
solution:
  steps:
  - n: 1
    latex: v^2 = u^2 + 2as
    reason: The equation with the known and wanted quantities only
  - n: 2
    latex: 14^2 = 4^2 + 2a \times 250
    reason: Substitute
  - n: 3
    latex: a = 0.360\ \text{m/s}^2
    reason: Evaluate
    check_id: chk_build_phy_k_0121_a
