id: itm.phy.o.momentum.0036
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.momentum.impulse
stem: A trolley of mass 8 kg is moving at 2 m/s. A resultant force of 6 N pushes it forwards for 4 s.
parts:
- id: a
  prompt: Find its speed at the end of the push.
  marks: 2
  answer:
    kind: numeric
    value: '5'
    unit: m/s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_mom_0036_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The impulse of the force equals the trolley's change in momentum.
  - rung: 2
    name: concept
    text:
      en: Impulse = force × time; change in momentum = mass × change in velocity.
  - rung: 3
    name: first_step
    text:
      en: Find the impulse, divide by the mass to get the change in velocity, then add it to the starting speed.
  - rung: 4
    name: worked_step
    text:
      en: The impulse is 24 N s, so the speed changes by 3 m/s.
  - rung: 5
    name: full_step
    text:
      en: v = 5 m/s.
  misconception_ids:
  - mc.phy.o.impulse_change_as_force
  - mc.phy.o.impulse_time_multiplied
solution:
  steps:
  - n: 1
    latex: Ft = 6 \times 4 = 24\ \text{N s}
    reason: Impulse
    check_id: chk_build_phy_mom_0036_j
  - n: 2
    latex: \Delta v = \frac{24}{8} = 3\ \text{m/s}
    reason: Impulse = mΔv
    check_id: chk_build_phy_mom_0036_dv
  - n: 3
    latex: v = 2 + 3 = 5\ \text{m/s}
    reason: Add the change to the starting speed
    check_id: chk_build_phy_mom_0036_ans
