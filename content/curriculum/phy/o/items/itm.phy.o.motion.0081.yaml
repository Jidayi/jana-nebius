stem: The velocity-time graph for a tram is a straight line from (0 s, 16.0 m/s) to (20 s, 46.0 m/s).
parts:
- id: a
  prompt: Find the acceleration from the gradient.
  marks: 2
  answer:
    kind: numeric
    value: '1.5'
    unit: m/s^2
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0081_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: A straight velocity-time line means a steady acceleration. What does its slope tell you?
  - rung: 2
    name: concept
    text:
      en: 'The acceleration is the gradient: change in velocity divided by change in time.'
  - rung: 3
    name: first_step
    text:
      en: Find the change in velocity and the change in time between the two points.
  - rung: 4
    name: worked_step
    text:
      en: Gradient = (46.0 − 16.0) ÷ (20 − 0).
  - rung: 5
    name: full_step
    text:
      en: Gradient = (46.0 − 16.0) ÷ (20 − 0) = 1.5 m/s^2.
  misconception_ids:
  - mc.phy.o.vt_gradient_read_as_velocity
solution:
  steps:
  - n: 1
    latex: a = \frac{\Delta v}{\Delta t}
    reason: Acceleration is the gradient of a velocity-time graph
  - n: 2
    latex: \Delta v = 30.0\ \text{m/s}
    reason: Change in velocity
    check_id: chk_build_phy_k_0081_s2
  - n: 3
    latex: \Delta t = 20\ \text{s}
    reason: Change in time
    check_id: chk_build_phy_k_0081_s3
  - n: 4
    latex: a = 1.5\ \text{m/s}^2
    reason: Divide
    check_id: chk_build_phy_k_0081_a
