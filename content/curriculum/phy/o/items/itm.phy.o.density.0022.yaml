stem: An empty beaker has a mass of 104.6 g. Then 40 cm³ of glycerine is poured in from a measuring cylinder, and the beaker and glycerine together have a mass of 155 g.
parts:
- id: a
  prompt: Calculate the density of the glycerine in g/cm³.
  marks: 2
  answer:
    kind: numeric
    value: '1.26'
    unit: g/cm^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_den_0022_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The balance reading includes the beaker.
  - rung: 2
    name: concept
    text:
      en: Find the mass of the glycerine alone first.
  - rung: 3
    name: first_step
    text:
      en: Work out 155 − 104.6.
  - rung: 4
    name: worked_step
    text:
      en: The glycerine has a mass of 50.4 g; divide by its volume.
  - rung: 5
    name: full_step
    text:
      en: The density of the glycerine is 1.26 g/cm³.
  misconception_ids:
  - mc.phy.o.container_mass_not_subtracted
  - mc.phy.o.density_volume_over_mass
  - mc.phy.o.density_mass_times_volume
solution:
  steps:
  - n: 1
    latex: m = 155 - 104.6 = 50.4\ \text{g}
    reason: Take away the beaker's own mass
    check_id: chk_build_phy_den_0022_ml
  - n: 2
    latex: \rho = \frac{50.4}{40} = 1.26\ \text{g/cm}^3
    reason: Density = mass ÷ volume
    check_id: chk_build_phy_den_0022_ans
