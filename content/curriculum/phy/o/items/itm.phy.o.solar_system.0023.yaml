subject: phy
level: o
kc_ids:
- kc.phy.o.solar_system.orbital_speed
stem: The Moon moves at 1.02 km/s in a circular orbit of radius 384 000 km about the centre of the Earth.
parts:
- id: a
  prompt: How long does one orbit take, in hours?
  marks: 3
  answer:
    kind: numeric
    value: '657'
    unit: h
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_sol_0023_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The orbit is a circle of circumference 2πr.
  - rung: 2
    name: concept
    text:
      en: From v = 2πr ÷ T, the period T = 2πr ÷ v.
  - rung: 3
    name: first_step
    text:
      en: Work out 2π × 384 000 ÷ 1.02; with r in km and v in km/s this gives seconds.
  - rung: 4
    name: worked_step
    text:
      en: T = 2370000 s; change it into hours.
  - rung: 5
    name: full_step
    text:
      en: One orbit takes 657 hours.
  misconception_ids:
  - mc.phy.o.orbit_rearranged_wrongly
  - mc.phy.o.orbit_speed_no_two_pi
  - mc.phy.o.orbit_period_not_in_seconds
solution:
  steps:
  - n: 1
    latex: T = \frac{2\pi r}{v} = \frac{2\pi \times 384\,000}{1.02} = 2370000\ \text{s}
    reason: Rearrange v = 2πr / T
    check_id: chk_build_phy_sol_0023_ts
  - n: 2
    latex: 2370000\ \text{s} = 657\ \text{h}
    reason: Seconds to hours
    check_id: chk_build_phy_sol_0023_ans
