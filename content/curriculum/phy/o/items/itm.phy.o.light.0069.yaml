id: itm.phy.o.light.0069
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.light.converging_lens
stem: An object is 4 cm from a thin converging lens of focal length 6 cm.
parts:
- id: a
  prompt: Using the real-is-positive sign convention, find the image distance v.
  marks: 2
  answer:
    kind: numeric
    value: '-12'
    unit: cm
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_lgt_0069_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The object is inside the focal length, so the image will be virtual.
  - rung: 2
    name: concept
    text:
      en: 1/v = 1/f − 1/u; in this convention a virtual image has a negative v.
  - rung: 3
    name: first_step
    text:
      en: Work out 1/6 − 1/4; it comes out negative.
  - rung: 4
    name: worked_step
    text:
      en: 1/v = -0.0833; take the reciprocal and keep the sign.
  - rung: 5
    name: full_step
    text:
      en: 'v = -12 cm: a virtual image on the same side of the lens as the object.'
solution:
  steps:
  - n: 1
    latex: \frac{1}{v} = \frac{1}{6} - \frac{1}{4} = -0.0833
    reason: 1/u + 1/v = 1/f
    check_id: chk_build_phy_lgt_0069_inv
  - n: 2
    latex: v = -12\ \text{cm}
    reason: 'Negative: a virtual image on the same side as the object'
    check_id: chk_build_phy_lgt_0069_ans
