stem: Sounds are sorted by frequency.
parts:
- id: a
  prompt: What is ultrasound?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Sound that is too loud to listen to safely
      correct: false
      misconception_id: mc.phy.o.ultrasound_means_loud
      feedback: 'Ultra means beyond: ultrasound is beyond the top of our hearing range, above 20 kHz. It can be loud or quiet.'
    - id: B
      text: Sound with a frequency too high for people to hear
      correct: true
    - id: C
      text: Sound with a frequency too low for people to hear
      correct: false
      misconception_id: mc.phy.o.ultrasound_infrasound_swapped
      feedback: Ultrasound is above 20 kHz; sound below 20 Hz is called infrasound.
    - id: D
      text: Sound that is too quiet for people to hear
      correct: false
      misconception_id: mc.phy.o.inaudible_means_too_quiet
      feedback: A dog whistle can be loud and still be silent to us. The ear cannot respond to frequencies outside about 20 Hz to 20 kHz.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Separate the two features of a sound: how high it sounds and how loud it is.'
  - rung: 2
    name: concept
    text:
      en: Pitch depends on the frequency; loudness depends on the amplitude.
  - rung: 3
    name: first_step
    text:
      en: A healthy young ear hears from about twenty hertz up to about twenty thousand hertz.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these rules.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Sound with a frequency too high for people to hear.'
  misconception_ids:
  - mc.phy.o.inaudible_means_too_quiet
  - mc.phy.o.ultrasound_infrasound_swapped
  - mc.phy.o.ultrasound_means_loud
