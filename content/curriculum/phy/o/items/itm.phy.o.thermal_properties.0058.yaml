id: itm.phy.o.thermal_properties.0058
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.changes_of_state
stem: In a refrigerator a liquid evaporates inside pipes in the cabinet.
parts:
- id: a
  prompt: How does this cool the food?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: Evaporation needs no energy, so the pipes simply stay cold
      correct: false
      misconception_id: mc.phy.o.no_energy_when_temperature_constant
      feedback: The heater is still on during the flat part, so energy is still going in. It is used to pull particles apart instead of raising the temperature.
    - id: B
      text: The slowest particles leave the liquid, making it colder
      correct: false
      misconception_id: mc.phy.o.evaporation_removes_slow_particles
      feedback: Only the fastest particles have enough energy to break free from the surface. They take their energy with them, so the particles left have less on average and the liquid cools.
    - id: C
      text: The evaporating liquid takes in energy from the cabinet and its contents
      correct: true
    - id: D
      text: Evaporation sends cold out into the cabinet
      correct: false
      misconception_id: mc.phy.o.cold_transferred_as_substance
      feedback: Only energy moves, always from hotter to colder. An ice pack does not send cold into you; energy flows out of you into the ice.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Think about what the energy does to the particles: speed them up, or separate them.'
  - rung: 2
    name: concept
    text:
      en: Particles need energy to escape from a liquid.
  - rung: 3
    name: first_step
    text:
      en: During a change of state of a pure substance, ask what happens to the temperature and to the energy.
  - rung: 4
    name: worked_step
    text:
      en: Remember that evaporation happens at the surface and that only some particles escape.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The evaporating liquid takes in energy from the cabinet and its contents.'
  misconception_ids:
  - mc.phy.o.cold_transferred_as_substance
  - mc.phy.o.evaporation_removes_slow_particles
  - mc.phy.o.no_energy_when_temperature_constant
solution:
  steps:
  - n: 1
    latex: \text{The evaporating liquid takes in energy from the cabinet and its contents}
    reason: Use the particle model of changes of state
