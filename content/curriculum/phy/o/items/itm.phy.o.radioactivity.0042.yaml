id: itm.phy.o.radioactivity.0042
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.radioactivity.half_life
stem: A counter near a sample of sodium-24 reads 980 counts/min. After 60 hours it reads 80 counts/min. The background count rate is 20 counts/min.
parts:
- id: a
  prompt: Find the half-life of the isotope.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 3.75 hours
      correct: false
      misconception_id: mc.phy.o.half_lives_equal_ratio
      feedback: 'Falling to an eighth takes three halvings: a half, a quarter, an eighth. Count how many times you halve.'
    - id: B
      text: 30 hours
      correct: false
      misconception_id: mc.phy.o.half_life_half_of_time
      feedback: Half-life is the time for the activity to halve, not half of the time taken. Find when the activity has fallen to half its starting value.
    - id: C
      text: 15 hours
      correct: true
    - id: D
      text: 12 hours
      correct: false
      misconception_id: mc.phy.o.half_lives_counted_wrongly
      feedback: 'Count the halvings, not the values: going from 80 to 40 to 20 is two half-lives, even though three numbers are written.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Only the count rate from the source halves; the background stays the same.
  - rung: 2
    name: concept
    text:
      en: Subtract the background from both readings first.
  - rung: 3
    name: first_step
    text:
      en: Then count how many times the corrected count rate halves, and share the time between the halvings.
  - rung: 4
    name: worked_step
    text:
      en: The corrected count rates are 960 and 60 counts/min.
  - rung: 5
    name: full_step
    text:
      en: The half-life is 15 hours.
  misconception_ids:
  - mc.phy.o.half_life_half_of_time
  - mc.phy.o.half_lives_counted_wrongly
  - mc.phy.o.half_lives_equal_ratio
solution:
  steps:
  - n: 1
    latex: 980 - 20 = 960
    reason: Correct the first reading for background
    check_id: chk_build_phy_rad_0042_c0
  - n: 2
    latex: 80 - 20 = 60
    reason: and the second
    check_id: chk_build_phy_rad_0042_c1
  - n: 3
    latex: \frac{960}{2^{n}} = 60 \Rightarrow n = 4
    reason: Count the halvings
    check_id: chk_build_phy_rad_0042_n
  - n: 4
    latex: T = \frac{60}{4} = 15\ \text{hours}
    reason: Time ÷ number of half-lives
    check_id: chk_build_phy_rad_0042_ans
