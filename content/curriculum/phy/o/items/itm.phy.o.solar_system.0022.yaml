id: itm.phy.o.solar_system.0022
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.solar_system.orbital_speed
stem: Venus orbits the Sun at 0.72 AU and takes 0.62 years to go round once. Take 1 AU = 1.5 × 10⁸ km and 1 year = 365 days.
parts:
- id: a
  prompt: Calculate the average orbital speed of Venus in km/s.
  marks: 3
  answer:
    kind: numeric
    value: '34.7'
    unit: km/s
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_sol_0022_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Change the radius into kilometres and the period into seconds first.
  - rung: 2
    name: concept
    text:
      en: Orbital speed v = 2πr ÷ T.
  - rung: 3
    name: first_step
    text:
      en: r = 0.72 × 1.5 × 10⁸ km, and T is 0.62 × 365 days.
  - rung: 4
    name: worked_step
    text:
      en: r = 1.08 × 10⁸ km and T = 19552320 s.
  - rung: 5
    name: full_step
    text:
      en: The orbital speed is 34.7 km/s.
  misconception_ids:
  - mc.phy.o.orbit_speed_no_two_pi
  - mc.phy.o.orbit_speed_pi_r_squared
  - mc.phy.o.orbit_period_not_in_seconds
solution:
  steps:
  - n: 1
    latex: r = 0.72 \times 1.5 \times 10^{8} = 1.08 \times 10^{8}\ \text{km}
    reason: AU to km
    check_id: chk_build_phy_sol_0022_rk_m
  - n: 2
    latex: T = 0.62 \times 365 = 226.3\ \text{days}
    reason: Years to days
    check_id: chk_build_phy_sol_0022_tdays
  - n: 3
    latex: T = 226.3\ \text{days} = 19552320\ \text{s}
    reason: Days to seconds
    check_id: chk_build_phy_sol_0022_ts
  - n: 4
    latex: v = \frac{2\pi \times 1.08 \times 10^{8}}{19552320} = 34.7\ \text{km/s}
    reason: v = 2πr / T
    check_id: chk_build_phy_sol_0022_ans
difficulty:
  prior: 0.5
  band: stretch
estimated_seconds: 150
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
context_tags:
- none
provenance:
