  reviewers: []
checks:
  chk_build_phy_sol_0022_ans:
    args:
      expression: 2*pi*0.72*1.5e8/(0.62*365*86400)
      sf: 3
    tool: math_evaluate
  chk_build_phy_sol_0022_rk_m:
    args:
      expression: (0.72*1.5e8)/10^(8)
      sf: 3
    tool: math_evaluate
  chk_build_phy_sol_0022_tdays:
    args:
      expression: 0.62*365
    tool: math_evaluate
  chk_build_phy_sol_0022_ts:
    args:
      quantity: 226.3 day
      to: s
    tool: units_convert
