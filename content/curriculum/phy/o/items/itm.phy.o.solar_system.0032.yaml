stem: The planets travel round the Sun at different speeds.
parts:
- id: a
  prompt: Which planet has the fastest orbital speed?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: Mercury
      correct: true
    - id: B
      text: Neptune
      correct: false
      misconception_id: mc.phy.o.outer_planets_orbit_faster
      feedback: 'Further out the Sun''s pull is weaker and the path is longer: Mercury takes 88 days, Neptune about 165 years.'
    - id: C
      text: Jupiter, because it has the most mass
      correct: false
      misconception_id: mc.phy.o.planet_period_depends_on_mass
      feedback: 'Jupiter has far more mass than Mars but it is the distance from the Sun that sets the period: the further out, the longer the year.'
    - id: D
      text: They all move at the same speed
      correct: false
      misconception_id: mc.phy.o.field_strength_same_everywhere
      feedback: Field strength depends on the planet's mass and size (1.6 N/kg on the Moon, about 25 N/kg on Jupiter) and gets weaker further from the planet.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what the Sun's gravity does to each planet.
  - rung: 2
    name: concept
    text:
      en: Gravity pulls towards the Sun and bends each planet's path into an orbit; nothing pushes it along or outwards.
  - rung: 3
    name: first_step
    text:
      en: Further from the Sun the pull is weaker, the orbit longer and the planet slower; g depends on the planet.
  - rung: 4
    name: worked_step
    text:
      en: Test each option against these ideas.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: Mercury.'
  misconception_ids:
  - mc.phy.o.field_strength_same_everywhere
  - mc.phy.o.outer_planets_orbit_faster
  - mc.phy.o.planet_period_depends_on_mass
