id: itm.phy.o.stars.0029
version: 0.1.1
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.stars.life_cycle_of_stars
stem: A star has a mass of 1.8 × 10³⁰ kg. The Sun's mass is 2.0 × 10³⁰ kg. Stars more than about 8 times as massive as the Sun end their lives in a supernova.
parts:
- id: a
  prompt: What does this star become when it leaves the main sequence?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: A red supergiant
      correct: false
      misconception_id: mc.phy.o.small_star_ends_violently
      feedback: Only stars of much more than the Sun's mass end in a supernova. The Sun will swell into a red giant, shed its outer layers and leave a white dwarf.
    - id: B
      text: A red giant
      correct: true
    - id: C
      text: 'Nothing: it stays on the main sequence for ever'
      correct: false
      misconception_id: mc.phy.o.stars_never_change
      feedback: A star's fuel runs out in the end. Its life is so long, millions to billions of years, that we never see one star change much.
    - id: D
      text: A white dwarf, straight away
      correct: false
      misconception_id: mc.phy.o.life_cycle_order_muddled
      feedback: A star like the Sun swells into a red giant first. The white dwarf is what is left at the very end.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The way a star develops depends on its mass.
  - rung: 2
    name: concept
    text:
      en: Find how many times more massive than the Sun it is.
  - rung: 3
    name: first_step
    text:
      en: Divide 1.8 × 10³⁰ kg by 2.0 × 10³⁰ kg.
  - rung: 4
    name: worked_step
    text:
      en: The star has 0.9 times the Sun's mass, far below 8, so it develops like the Sun.
  - rung: 5
    name: full_step
    text:
      en: It becomes a red giant.
  misconception_ids:
  - mc.phy.o.life_cycle_order_muddled
  - mc.phy.o.small_star_ends_violently
  - mc.phy.o.stars_never_change
solution:
  steps:
  - n: 1
    latex: \frac{1.8 \times 10^{30}}{2.0 \times 10^{30}} = 0.9
    reason: Mass compared with the Sun
    check_id: chk_build_phy_str_0029_ratio
  - n: 2
    latex: 0.9 < 8
    reason: Compare with the limit for a supernova
  - n: 3
    latex: \text{It becomes a red giant}
    reason: The next stage for a star of this mass
