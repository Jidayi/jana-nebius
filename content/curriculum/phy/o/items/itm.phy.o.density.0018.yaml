stem: An empty beaker has a mass of 98.2 g. Then 60 cm³ of ethanol is poured in from a measuring cylinder, and the beaker and ethanol together have a mass of 145.6 g.
parts:
- id: a
  prompt: Calculate the density of the ethanol in g/cm³.
  marks: 2
  answer:
    kind: numeric
    value: '0.79'
    unit: g/cm^3
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_den_0018_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The balance reading includes the beaker.
  - rung: 2
    name: concept
    text:
      en: Find the mass of the ethanol alone first.
  - rung: 3
    name: first_step
    text:
      en: Work out 145.6 − 98.2.
  - rung: 4
    name: worked_step
    text:
      en: The ethanol has a mass of 47.4 g; divide by its volume.
  - rung: 5
    name: full_step
    text:
      en: The density of the ethanol is 0.79 g/cm³.
  misconception_ids:
  - mc.phy.o.container_mass_not_subtracted
