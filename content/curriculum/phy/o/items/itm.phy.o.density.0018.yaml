  - mc.phy.o.density_mass_times_volume
solution:
  steps:
  - n: 1
    latex: m = 145.6 - 98.2 = 47.4\ \text{g}
    reason: Take away the beaker's own mass
    check_id: chk_build_phy_den_0018_ml
  - n: 2
    latex: \rho = \frac{47.4}{60} = 0.79\ \text{g/cm}^3
    reason: Density = mass ÷ volume
    check_id: chk_build_phy_den_0018_ans
