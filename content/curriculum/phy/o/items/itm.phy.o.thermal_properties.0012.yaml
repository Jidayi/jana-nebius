id: itm.phy.o.thermal_properties.0012
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.thermal_properties.thermal_expansion
stem: A metal lid is stuck tightly on a glass jar.
parts:
- id: a
  prompt: Why does running hot water over the lid help to open it?
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: The metal lid expands more than the glass, loosening it
      correct: true
    - id: B
      text: The hot water makes the lid's particles larger, so the lid swells
      correct: false
      misconception_id: mc.phy.o.particles_grow_when_heated
      feedback: A water particle is the same size in ice, in water and in steam. Heating makes particles move faster and spread further apart; it does not make them bigger.
    - id: C
      text: The glass expands more than the metal and pushes the lid off
      correct: false
      misconception_id: mc.phy.o.expansion_order_reversed
      feedback: For the same temperature rise, gases expand most, then liquids, then solids. Solids expand only a little, but enough to buckle rails and crack glass.
    - id: D
      text: The heat adds particles to the lid, making it bigger
      correct: false
      misconception_id: mc.phy.o.heating_creates_particles
      feedback: 'Weigh a sealed flask before and after heating: its mass does not change. No particles are made; the same particles move faster and, in most materials, spread further apart.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Think about what heating does to the motion and spacing of particles.
  - rung: 2
    name: concept
    text:
      en: Different solids expand by different amounts for the same temperature rise.
  - rung: 3
    name: first_step
    text:
      en: For each option, ask whether the particles themselves change, or only how they move and how far apart they are.
  - rung: 4
    name: worked_step
    text:
      en: Remember that heating does not create particles and that gases expand most, solids least.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The metal lid expands more than the glass, loosening it.'
  misconception_ids:
  - mc.phy.o.expansion_order_reversed
  - mc.phy.o.heating_creates_particles
  - mc.phy.o.particles_grow_when_heated
solution:
  steps:
  - n: 1
    latex: \text{The metal lid expands more than the glass, loosening it}
    reason: Apply the particle model of expansion
