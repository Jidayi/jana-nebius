stem: A 60 W lamp is switched on for 90 minutes.
parts:
- id: a
  prompt: Calculate the electrical energy it transfers, in joules.
  marks: 2
  answer:
    kind: numeric
    value: '324000'
    unit: J
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_pel_0020_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Power is the energy transferred each second.
  - rung: 2
    name: concept
    text:
      en: E = Pt gives joules when P is in watts and t is in seconds.
  - rung: 3
    name: first_step
    text:
      en: Change the time from minutes into seconds.
  - rung: 4
    name: worked_step
    text:
      en: The time is 5400 s; multiply by 60 W.
  - rung: 5
    name: full_step
    text:
      en: The energy transferred is 324000 J.
  misconception_ids:
  - mc.phy.o.elec_energy_time_not_in_seconds
