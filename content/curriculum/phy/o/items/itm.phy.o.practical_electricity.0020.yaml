  - n: 1
    latex: t = 90\ \text{min} = 5400\ \text{s}
    reason: Time in seconds
    check_id: chk_build_phy_pel_0020_ts
  - n: 2
    latex: E = Pt = 60 \times 5400 = 324000\ \text{J}
    reason: Energy is power times time
    check_id: chk_build_phy_pel_0020_ans
