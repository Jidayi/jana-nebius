id: itm.phy.o.pressure.0044
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.pressure.gas_and_atmospheric_pressure
stem: A mercury manometer is joined to a gas supply. On its scale, the mercury level is at 275 mm in the open arm and at 200 mm in the arm joined to the gas. Atmospheric pressure is 101 kPa and mercury has a density of 13600 kg/m³. Take g = 9.8 N/kg.
parts:
- id: a
  prompt: Calculate the pressure of the gas, in kPa.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 111 kPa
      correct: true
    - id: B
      text: 9.996 kPa
      correct: false
      misconception_id: mc.phy.o.manometer_excess_as_gas_pressure
      feedback: A manometer compares the gas with the air pushing on the open arm. Gas pressure = atmospheric pressure ± the pressure of the height difference.
    - id: C
      text: 91.0 kPa
      correct: false
      misconception_id: mc.phy.o.manometer_difference_sign_wrong
      feedback: The side that pushes harder pushes its liquid level down. If the liquid stands higher in the open arm, the gas pressure is above atmospheric; if it stands higher on the gas side, it is below.
    - id: D
      text: 138 kPa
      correct: false
      misconception_id: mc.phy.o.manometer_one_level_used
      feedback: Only the difference in height between the two liquid surfaces shows the difference in pressure. Subtract one scale reading from the other.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The side that pushes harder pushes its mercury level down.
  - rung: 2
    name: concept
    text:
      en: The mercury stands higher in the open arm, so the gas pressure is above atmospheric pressure.
  - rung: 3
    name: first_step
    text:
      en: Find the difference between the levels in metres and work out ρgΔh.
  - rung: 4
    name: worked_step
    text:
      en: ρgΔh = 9.996 kPa; add it to 101 kPa.
  - rung: 5
    name: full_step
    text:
      en: The gas pressure is 111 kPa.
  misconception_ids:
  - mc.phy.o.manometer_difference_sign_wrong
  - mc.phy.o.manometer_excess_as_gas_pressure
  - mc.phy.o.manometer_one_level_used
solution:
  steps:
  - n: 1
    latex: \Delta h = 275 - 200 = 75\ \text{mm}
    reason: The difference between the levels
    check_id: chk_build_phy_prs_0044_dh
  - n: 2
    latex: 75\ \text{mm} = 0.075\ \text{m}
    reason: Millimetres into metres
    check_id: chk_build_phy_prs_0044_dhm
  - n: 3
    latex: \rho g \Delta h = 13600 \times 9.8 \times 0.075 = 9.996\ \text{kPa}
    reason: The pressure of the height difference, in kPa
    check_id: chk_build_phy_prs_0044_dp
  - n: 4
    latex: p = 101 + 9.996 = 111\ \text{kPa}
    reason: The gas pushes harder
    check_id: chk_build_phy_prs_0044_ans
