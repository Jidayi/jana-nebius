    latex: v = \frac{108}{3.6} = 30\ \text{m/s}
    reason: Speed in m/s
    check_id: chk_build_phy_nrg_0019_v
  - n: 2
    latex: E_k = \frac{1}{2} \times 1200 \times 30^2 = 540\ \text{kJ}
    reason: E_k = ½mv², in kJ
    check_id: chk_build_phy_nrg_0019_ans
