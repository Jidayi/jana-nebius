stem: Sound is described as a longitudinal wave.
parts:
- id: a
  prompt: Why?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The particles vibrate parallel to the direction the wave travels
      correct: true
    - id: B
      text: The particles vibrate at right angles to the direction of travel
      correct: false
      misconception_id: mc.phy.o.sound_called_transverse
      feedback: 'Sound is longitudinal: the particles move back and forth along the direction the sound travels, making compressions and rarefactions.'
    - id: C
      text: The particles move along with the wave from the source to the listener
      correct: false
      misconception_id: mc.phy.o.wave_carries_medium
      feedback: A floating leaf bobs up and down as ripples pass but stays in the same place. Waves carry energy, not the material they travel through.
    - id: D
      text: It can travel a long distance
      correct: false
      misconception_id: mc.phy.o.longitudinal_means_long
      feedback: 'The name describes the direction of the vibration: along the line the wave travels, not how far it goes.'
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: Picture what happens between a vibrating object and your ear.
  - rung: 2
    name: concept
    text:
      en: The particles of the material vibrate back and forth along the direction the sound travels, passing the energy on.
  - rung: 3
    name: first_step
    text:
      en: Squashed regions and stretched regions travel outwards; the particles themselves stay where they were on average.
  - rung: 4
    name: worked_step
    text:
      en: Sound needs particles to pass the vibrations along.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: The particles vibrate parallel to the direction the wave travels.'
  misconception_ids:
  - mc.phy.o.longitudinal_means_long
  - mc.phy.o.sound_called_transverse
  - mc.phy.o.wave_carries_medium
solution:
  steps:
  - n: 1
    latex: \text{The particles vibrate parallel to the direction the wave travels}
    reason: Sound is a longitudinal wave that needs a medium
