id: itm.phy.o.circuits.0035
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.circuits.mixed_circuits
stem: Two lamps of resistance 20 Ω and 6 Ω are connected in series to make one branch. A 12 Ω resistor forms a second branch in parallel with them, and the two branches are connected across a 6 V battery.
parts:
- id: a
  prompt: Calculate the total resistance of the circuit.
  marks: 2
  answer:
    kind: numeric
    value: '8.21'
    unit: Ω
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_cir_0035_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Work out each branch on its own first.
  - rung: 2
    name: concept
    text:
      en: The two lamps in one branch are in series; that branch is then in parallel with the resistor.
  - rung: 3
    name: first_step
    text:
      en: The lamp branch has 20 Ω + 6 Ω = 26 Ω.
  - rung: 4
    name: worked_step
    text:
      en: 'Combine 26 Ω and 12 Ω in parallel: product over sum.'
  - rung: 5
    name: full_step
    text:
      en: The total resistance is 8.21 Ω.
  misconception_ids:
  - mc.phy.o.mixed_all_in_series
  - mc.phy.o.mixed_all_in_parallel
solution:
  steps:
  - n: 1
    latex: R_s = 20 + 6 = 26\ \Omega
    reason: The lamps in series in one branch
    check_id: chk_build_phy_cir_0035_rs
  - n: 2
    latex: R = \frac{26 \times 12}{26 + 12} = 8.21\ \Omega
    reason: The two branches in parallel
    check_id: chk_build_phy_cir_0035_ans
