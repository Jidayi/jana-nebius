id: itm.phy.o.practical_electricity.0003
version: 0.1.1
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.practical_electricity.electrical_power
stem: An 18 Ω resistor is connected across a 3 V battery.
parts:
- id: a
  prompt: Calculate the power transferred in the resistor.
  marks: 2
  answer:
    kind: numeric
    value: '0.5'
    unit: W
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_pel_0003_tool
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You know the p.d. and the resistance.
  - rung: 2
    name: concept
    text:
      en: Since I = V/R and P = IV, the power is P = V²/R.
  - rung: 3
    name: first_step
    text:
      en: 'Square the p.d.: 3 × 3.'
  - rung: 4
    name: worked_step
    text:
      en: The square is 9; divide by 18 Ω.
  - rung: 5
    name: full_step
    text:
      en: The power is 0.5 W.
  misconception_ids:
  - mc.phy.o.electric_power_voltage_not_squared
  - mc.phy.o.electric_power_square_as_double
  - mc.phy.o.electric_power_r_multiplied
solution:
  steps:
  - n: 1
    latex: V^2 = 3^2 = 9
    reason: Square the p.d.
    check_id: chk_build_phy_pel_0003_sq
  - n: 2
    latex: P = \frac{V^2}{R} = \frac{9}{18} = 0.5\ \text{W}
    reason: Power from V and R
    check_id: chk_build_phy_pel_0003_ans
difficulty:
  prior: 0.2
