id: itm.phy.o.stars.0037
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.stars.expanding_universe
stem: A galaxy is moving away from us at 6600 km/s. Take the Hubble constant H0 as 2.2 × 10⁻¹⁸ per second.
parts:
- id: a
  prompt: Estimate the distance to the galaxy in metres.
  marks: 2
  answer:
    kind: numeric
    value: 3.00e24
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: sig_figs
      value: 3
    check_id: chk_build_phy_str_0037_ans
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: Use v = H0 × d, rearranged for the distance.
  - rung: 2
    name: concept
    text:
      en: d = v ÷ H0, with v in m/s.
  - rung: 3
    name: first_step
    text:
      en: Change 6600 km/s into m/s first.
  - rung: 4
    name: worked_step
    text:
      en: v = 6600000 m/s; divide by 2.2 × 10⁻¹⁸.
  - rung: 5
    name: full_step
    text:
      en: The galaxy is about 3.00 × 10²⁴ m away.
solution:
  steps:
  - n: 1
    latex: v = 6600\ \text{km/s} = 6600000\ \text{m/s}
    reason: Speed in m/s to match H0
    check_id: chk_build_phy_str_0037_vms
  - n: 2
    latex: d = \frac{v}{H_0} = \frac{6600000}{2.2 \times 10^{-18}} = 3.00 \times 10^{24}\ \text{m}
    reason: Rearrange v = H0 d
    check_id: chk_build_phy_str_0037_ans_m
