stem: A car speeds up steadily from 0.0 m/s to 15.0 m/s in 5.0 s.
parts:
- id: a
  prompt: Calculate the acceleration.
  marks: 3
  answer:
    kind: numeric
    value: '3.0'
    unit: m/s^2
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_k_0048_a
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: You know the speed at the start, the speed at the end and the time. What are you asked for?
  - rung: 2
    name: concept
    text:
      en: Acceleration is the change in velocity divided by the time taken.
  - rung: 3
    name: first_step
    text:
      en: Change in velocity = final velocity − initial velocity. Then divide by the time.
  - rung: 4
    name: worked_step
    text:
      en: a = (15.0 − 0.0) ÷ 5.0
  - rung: 5
    name: full_step
    text:
      en: a = (15.0 − 0.0) ÷ 5.0 = 3.0 m/s^2.
  misconception_ids:
  - mc.phy.o.final_velocity_over_time
solution:
  steps:
  - n: 1
    latex: a = \frac{v - u}{t}
    reason: Acceleration is the change in velocity over the time
  - n: 2
    latex: v - u = 15.0\ \text{m/s}
    reason: Change in velocity
    check_id: chk_build_phy_k_0048_s2
  - n: 3
    latex: a = 3.0\ \text{m/s}^2
    reason: Divide by the time
    check_id: chk_build_phy_k_0048_a
