id: itm.phy.o.momentum.0015
version: 0.1.0
type: mcq_diagnostic
subject: phy
level: o
kc_ids:
- kc.phy.o.momentum.momentum_calculation
stem: Trolley P (1.5 kg) moves right at 5 m/s. Trolley Q (2 kg) moves left at 1.5 m/s, towards P. Take right as positive.
parts:
- id: a
  prompt: Find the total momentum of the two trolleys.
  marks: 1
  answer:
    kind: mcq
    diagnostic: true
    shuffle: false
    options:
    - id: A
      text: 10.5 kg m/s
      correct: false
      misconception_id: mc.phy.o.momentum_sign_ignored
      feedback: Momentum is a vector. Choose a positive direction; anything moving the other way has a negative velocity, so its momentum is negative too.
    - id: B
      text: 12.25 kg m/s
      correct: false
      misconception_id: mc.phy.o.momentum_totals_multiplied
      feedback: Find the momentum of each object on its own, with its sign, and then add the momenta.
    - id: C
      text: 7.5 kg m/s
      correct: false
      misconception_id: mc.phy.o.largest_vector_only
      feedback: A small current still slows a boat. Every vector acting changes the resultant, so combine them all.
    - id: D
      text: 4.5 kg m/s
      correct: true
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: 'Momentum has a direction: give each trolley''s momentum a sign.'
  - rung: 2
    name: concept
    text:
      en: Find each momentum as mass × velocity, then add them with their signs.
  - rung: 3
    name: first_step
    text:
      en: Q moves left, so its velocity and momentum are negative.
  - rung: 4
    name: worked_step
    text:
      en: The momenta are 7.5 kg m/s and -3 kg m/s.
  - rung: 5
    name: full_step
    text:
      en: Total momentum = 4.5 kg m/s.
  misconception_ids:
  - mc.phy.o.largest_vector_only
  - mc.phy.o.momentum_sign_ignored
  - mc.phy.o.momentum_totals_multiplied
solution:
  steps:
  - n: 1
    latex: p_P = 1.5 \times 5 = 7.5\ \text{kg m/s}
    reason: 'P moves right: positive'
    check_id: chk_build_phy_mom_0015_p1
  - n: 2
    latex: p_Q = 2 \times (-\,1.5) = -3\ \text{kg m/s}
    reason: 'Q moves left: negative'
    check_id: chk_build_phy_mom_0015_p2
  - n: 3
    latex: p = 7.5 + (-3) = 4.5\ \text{kg m/s}
    reason: Add the momenta with their signs
    check_id: chk_build_phy_mom_0015_ans
