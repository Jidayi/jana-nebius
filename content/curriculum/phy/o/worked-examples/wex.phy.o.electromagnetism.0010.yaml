problem: A transformer takes 1.2 A from a 230 V supply. Its secondary coil gives 10.3 A at 24 V. Calculate the efficiency of the transformer.
steps:
- n: 1
  latex: P_{in} = 230 \times 1.2 = 276\ \text{W}
  reason: Power in = p.d. × current
  check_id: chk_build_phy_emg_w0010_pin
- n: 2
  latex: P_{out} = 24 \times 10.3 = 247.2\ \text{W}
  reason: Power out = p.d. × current
  check_id: chk_build_phy_emg_w0010_pout
- n: 3
  latex: \frac{247.2}{276} = 0.896
  reason: Output power over input power
  check_id: chk_build_phy_emg_w0010_frac
- n: 4
  latex: 0.896 \rightarrow 89.6\%
  reason: Multiply by a hundred for a percentage
  check_id: chk_build_phy_emg_w0010_ans
final_answer:
