problem: Some solid paraffin wax is heated by a steady heater. It warms from 28 °C to its melting point, 58 °C, in 5 minutes, and then takes 6 minutes to melt completely. How many times more energy does melting take than warming the solid to its melting point?
steps:
- n: 1
  latex: E = Pt, \text{ with the same } P
  reason: A steady heater supplies energy in proportion to time
- n: 2
  latex: \frac{E_{melt}}{E_{warm}} = \frac{6}{5} = 1.2
  reason: Ratio of the times
  check_id: chk_build_phy_thp_w0008_ans
final_answer:
  latex: '1.2'
  check_id: chk_build_phy_thp_w0008_ans
