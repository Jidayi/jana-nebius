problem: A star has a mass of 3.0 × 10³¹ kg. The Sun's mass is 2.0 × 10³⁰ kg. Stars more than about 8 times as massive as the Sun end their lives in a supernova. How many times the Sun's mass is the star, and how will its life end?
steps:
- n: 1
  latex: \frac{3.0 \times 10^{31}}{2.0 \times 10^{30}} = 15 > 8
  reason: Mass compared with the Sun, and with the supernova limit
  check_id: chk_build_phy_str_w0004_ratio
- n: 2
  latex: \text{It becomes a red supergiant, explodes as a supernova and leaves a neutron star or black hole}
  reason: The end that goes with this mass
final_answer:
  latex: \frac{M}{M_{\text{Sun}}} = 15
  check_id: chk_build_phy_str_w0004_ratio
