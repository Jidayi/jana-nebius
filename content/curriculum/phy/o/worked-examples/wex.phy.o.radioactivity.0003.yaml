problem: A nucleus of uranium-238 (proton number 92) decays in several steps, giving out 8 alpha particles and 6 beta particles in all, to become lead-206. What is the proton number of lead-206?
steps:
- n: 1
  latex: '\text{alpha particle: } 2\ \text{protons} + 2\ \text{neutrons} = 4\ \text{nucleons}'
  reason: An alpha particle is a helium nucleus
  check_id: chk_build_phy_rad_w0003_alpha_a
- n: 2
  latex: 8 \times 2 = 16\ \text{protons lost}
  reason: Each alpha takes 2 protons
  check_id: chk_build_phy_rad_w0003_pz
- n: 3
  latex: 92 - 16 + 6 = 82
  reason: Each beta adds 1 proton
  check_id: chk_build_phy_rad_w0003_ans
final_answer:
  latex: '82'
  check_id: chk_build_phy_rad_w0003_ans
