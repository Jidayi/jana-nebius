problem: On Mars, where g = 3.7 N/kg, a spring scale reads 22.2 N when a toolkit hangs from it. The toolkit is brought back to Earth. Take g = 9.8 N/kg. What does the spring scale read on Earth?
steps:
- n: 1
  latex: m = \frac{22.2}{3.7} = 6\ \text{kg}
  reason: The mass, found where the weight was measured
  check_id: chk_build_phy_mwt_w0003_m
- n: 2
  latex: W = 6 \times 9.8 = 58.8\ \text{N}
  reason: The same mass in the Earth's field
  check_id: chk_build_phy_mwt_w0003_ans
final_answer:
  latex: 58.8\ \text{N}
  check_id: chk_build_phy_mwt_w0003_ans
