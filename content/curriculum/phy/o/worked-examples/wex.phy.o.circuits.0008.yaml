problem: An LDR is connected in series with a 4000 Ω resistor across a 6 V supply. In the dark the LDR's resistance is 50000 Ω. The output p.d. is taken across the LDR. Calculate the output p.d. across the LDR.
steps:
- n: 1
  latex: R = 4000 + 50000 = 54000\ \Omega
  reason: Total resistance of the divider
  check_id: chk_build_phy_cir_w0008_rt
- n: 2
  latex: V_{\text{out}} = 6 \times \frac{50000}{54000} = 5.56\ \text{V}
  reason: The output's share is its fraction of the total resistance
  check_id: chk_build_phy_cir_w0008_ans
final_answer:
  latex: 5.56\ \text{V}
  check_id: chk_build_phy_cir_w0008_ans
