problem: A flask holds 4000 cm³ of argon gas at 20 °C, which has a density of 1.66 kg/m³. All of it condenses into liquid argon, of density 1400 kg/m³. Find the volume of the liquid formed.
steps:
- n: 1
  latex: V_{liquid} = V_{gas} \times \frac{\rho_{gas}}{\rho_{liquid}} = 4000 \times \frac{1.66}{1400} = 4.74\ \text{cm}^3
  reason: The mass is the same; the particles are just much closer together
  check_id: chk_build_phy_ptc_w0001_ans
final_answer:
  latex: 4.74\ \text{cm}^3
  check_id: chk_build_phy_ptc_w0001_ans
