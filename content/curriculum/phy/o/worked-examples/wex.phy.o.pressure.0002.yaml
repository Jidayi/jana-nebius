problem: A block measuring 0.3 m × 0.15 m × 0.1 m has a weight of 30 N. It can rest on any of its faces. Calculate the least pressure it can exert on the ground.
steps:
- n: 1
  latex: A = 0.3 \times 0.15 = 0.045\ \text{m}^2
  reason: The largest face gives the least pressure
  check_id: chk_build_phy_prs_w0002_area
- n: 2
  latex: p = \frac{30}{0.045} = 667\ \text{Pa}
  reason: Pressure = force ÷ area
  check_id: chk_build_phy_prs_w0002_ans
