problem: Yaw dives from 2 m to 14 m below the surface of fresh water (density 1000 kg/m³). Take g = 10 N/kg. By how much does the pressure on the diver increase, in kPa?
steps:
- n: 1
  latex: \Delta h = 14 - 2 = 12\ \text{m}
  reason: The change in depth
  check_id: chk_build_phy_prs_w0004_dh
- n: 2
  latex: \Delta p = \rho g \Delta h = 1000 \times 10 \times 12 = 120\ \text{kPa}
  reason: Δp = ρgΔh, then pascals into kilopascals
  check_id: chk_build_phy_prs_w0004_ans
final_answer:
  latex: 120\ \text{kPa}
  check_id: chk_build_phy_prs_w0004_ans
