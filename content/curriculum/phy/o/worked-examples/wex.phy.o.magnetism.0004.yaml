problem: On a field diagram, neighbouring field lines are 2.5 mm apart at point P near a pole and 12.5 mm apart at point Q further away. How many times stronger is the field at P than at Q?
steps:
- n: 1
  latex: \text{lines closer at P} \Rightarrow \text{field stronger at P}
  reason: The field strength is inversely proportional to the spacing of the lines
- n: 2
  latex: \frac{12.5}{2.5} = 5
  reason: Wider spacing at Q, so divide Q's by P's
  check_id: chk_build_phy_mag_w0004_ans
final_answer:
  latex: '5'
  check_id: chk_build_phy_mag_w0004_ans
