problem: A spring of length 18 cm has a spring constant of 40 N/m. A mass of 0.2 kg is hung from it, within the limit of proportionality. Take g = 10 N/kg. Find the new length of the spring in centimetres.
steps:
- n: 1
  latex: F = mg = 0.2 \times 10 = 2\ \text{N}
  reason: The load is the weight
  check_id: chk_build_phy_frc_w0008_w
- n: 2
  latex: x = \frac{F}{k} = \frac{2}{40} = 0.05\ \text{m}
  reason: From F = kx
  check_id: chk_build_phy_frc_w0008_x
- n: 3
  latex: x = 5\ \text{cm}
  reason: Extension in centimetres
  check_id: chk_build_phy_frc_w0008_xcm
- n: 4
  latex: L = 18 + 5 = 23\ \text{cm}
  reason: Original length + extension
  check_id: chk_build_phy_frc_w0008_ans
final_answer:
  latex: 23\ \text{cm}
  check_id: chk_build_phy_frc_w0008_ans
