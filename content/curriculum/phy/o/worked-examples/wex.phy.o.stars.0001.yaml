problem: A star is 2.4 × 10¹⁷ m from the Earth. Light travels at 3.0 × 10⁸ m/s; take a year as 365 days. How far away is the star in light-years?
steps:
- n: 1
  latex: 1\ \text{year} = 365\ \text{days} = 31536000\ \text{s}
  reason: A year in seconds
  check_id: chk_build_phy_str_w0001_ts
- n: 2
  latex: 1\ \text{ly} = 3.0 \times 10^{8} \times 31536000 = 9.46 \times 10^{15}\ \text{m}
  reason: Distance light travels in a year
  check_id: chk_build_phy_str_w0001_ly_m
- n: 3
  latex: \frac{2.4 \times 10^{17}}{9.46 \times 10^{15}} = 25.4\ \text{ly}
  reason: Divide by the metres in one light-year
  check_id: chk_build_phy_str_w0001_ans
final_answer:
  latex: 25.4\ \text{light-years}
  check_id: chk_build_phy_str_w0001_ans
fading_order:
- 3
- 2
- 1
