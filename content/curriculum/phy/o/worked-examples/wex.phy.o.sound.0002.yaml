problem: A loudspeaker sends a sound of frequency 500 Hz through the air. The distance from the centre of a compression to the centre of the next rarefaction is 34 cm. Calculate the speed of the sound.
steps:
- n: 1
  latex: \lambda = 2 \times 34 = 68\ \text{cm}
  reason: Compression to rarefaction is half a wave
  check_id: chk_build_phy_snd_w0002_lam
- n: 2
  latex: \lambda = 68\ \text{cm} = 0.68\ \text{m}
  reason: Put the wavelength in metres
  check_id: chk_build_phy_snd_w0002_lm
- n: 3
  latex: v = f\lambda = 500 \times 0.68 = 340\ \text{m/s}
  reason: Wave equation
  check_id: chk_build_phy_snd_w0002_ans
final_answer:
  latex: 340\ \text{m/s}
  check_id: chk_build_phy_snd_w0002_ans
