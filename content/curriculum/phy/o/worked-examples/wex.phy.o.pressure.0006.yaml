problem: A mercury barometer reads 762 mm at the foot of a hill and 753 mm at the top. Mercury has a density of 13600 kg/m³; take the density of the air to be 1.2 kg/m³ all the way up. Estimate the height of the hill.
steps:
- n: 1
  latex: \Delta h_{\text{Hg}} = 762 - 753 = 9\ \text{mm}
  reason: The fall in the mercury column
  check_id: chk_build_phy_prs_w0006_dh
- n: 2
  latex: 9\ \text{mm} = 0.009\ \text{m}
  reason: Millimetres into metres
  check_id: chk_build_phy_prs_w0006_dhm
- n: 3
  latex: \rho_{\text{Hg}} g \Delta h_{\text{Hg}} = \rho_{\text{air}} g H
  reason: The layer of air climbed through matches the fall
- n: 4
  latex: H = \frac{13600 \times 0.009}{1.2} = 102\ \text{m}
  reason: g cancels
  check_id: chk_build_phy_prs_w0006_ans
final_answer:
  latex: 102\ \text{m}
  check_id: chk_build_phy_prs_w0006_ans
