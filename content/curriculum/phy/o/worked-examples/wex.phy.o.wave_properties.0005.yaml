problem: Neema pushes and pulls one end of a stretched slinky spring. A photo shows 4 compressions in a row, and the distance from the centre of the first to the centre of the last is 75 cm. Neema makes 5 pushes every second. Find the speed of the wave along the spring.
steps:
- n: 1
  latex: 4 - 1 = 3
  reason: The number of gaps between the compressions
  check_id: chk_build_phy_wav_w0005_gaps
- n: 2
  latex: \lambda = \frac{75}{3} = 25\ \text{cm}
  reason: One wavelength per gap
  check_id: chk_build_phy_wav_w0005_lam
- n: 3
  latex: \lambda = 25\ \text{cm} = 0.25\ \text{m}
  reason: Put the wavelength in metres
  check_id: chk_build_phy_wav_w0005_lm
- n: 4
  latex: v = f\lambda = 5 \times 0.25 = 1.25\ \text{m/s}
  reason: Wave equation
  check_id: chk_build_phy_wav_w0005_ans
final_answer:
  latex: 1.25\ \text{m/s}
  check_id: chk_build_phy_wav_w0005_ans
fading_order:
- 4
- 3
- 2
- 1
