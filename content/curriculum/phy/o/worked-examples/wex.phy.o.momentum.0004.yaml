problem: A space probe of mass 1000 kg is at rest. A spring pushes a capsule of mass 40 kg away from it at 8 m/s. Take the direction in which the capsule moves as positive. Find the velocity of the probe just afterwards.
steps:
- n: 1
  latex: p_\text{before} = 1000 \times 0 + 40 \times 0 = 0
  reason: The probe and the capsule start at rest
  check_id: chk_build_phy_mom_w0004_p0
- n: 2
  latex: 40 \times 8 = 320\ \text{kg m/s}
  reason: Momentum of the capsule
  check_id: chk_build_phy_mom_w0004_pf
- n: 3
  latex: 0 = 320 + 1000V \Rightarrow V = -0.32\ \text{m/s}
  reason: Total momentum stays zero
  check_id: chk_build_phy_mom_w0004_ans
final_answer:
  latex: -0.32\ \text{m/s}
  check_id: chk_build_phy_mom_w0004_ans
