  reason: Horizontal distance from the centre of gravity to the edge
  check_id: chk_build_phy_frc_w0013_half
- n: 2
  latex: \tan\theta = \frac{20}{50} = 0.4
  reason: Topples when the centre of gravity is above the edge
  check_id: chk_build_phy_frc_w0013_ratio
- n: 3
  latex: \theta = 21.8^\circ
  reason: Inverse tangent
  check_id: chk_build_phy_frc_w0013_ans
final_answer:
