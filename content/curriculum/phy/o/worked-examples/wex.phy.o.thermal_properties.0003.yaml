problem: A 1.5 kg block of aluminium is heated by a 24 W heater for 4 minutes. Its temperature rises from 18 °C to 22.5 °C. Assume no energy is lost to the surroundings. Find the specific heat capacity of the metal.
steps:
- n: 1
  latex: t = 4\ \text{min} = 240\ \text{s}
  reason: A watt is a joule per second
  check_id: chk_build_phy_thp_w0003_ts
- n: 2
  latex: E = Pt = 24 \times 240 = 5760\ \text{J}
  reason: Energy from the heater
  check_id: chk_build_phy_thp_w0003_e
- n: 3
  latex: \Delta\theta = 22.5 - 18 = 4.5\ ^\circ\text{C}
  reason: The temperature rise
  check_id: chk_build_phy_thp_w0003_dt
- n: 4
  latex: c = \frac{E}{m\Delta\theta} = \frac{5760}{1.5 \times 4.5} = 853\ \text{J/(kg °C)}
  reason: Rearrange E = mcΔθ
  check_id: chk_build_phy_thp_w0003_ans
final_answer:
  latex: 853\ \text{J/(kg °C)}
  check_id: chk_build_phy_thp_w0003_ans
