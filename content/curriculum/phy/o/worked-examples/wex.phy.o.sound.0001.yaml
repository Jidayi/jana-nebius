problem: A loudspeaker sends a sound of frequency 425 Hz through the air. The distance from the centre of a compression to the centre of the next rarefaction is 40 cm. Calculate the speed of the sound.
steps:
- n: 1
  latex: \lambda = 2 \times 40 = 80\ \text{cm}
  reason: Compression to rarefaction is half a wave
  check_id: chk_build_phy_snd_w0001_lam
- n: 2
  latex: \lambda = 80\ \text{cm} = 0.8\ \text{m}
  reason: Put the wavelength in metres
  check_id: chk_build_phy_snd_w0001_lm
- n: 3
  latex: v = f\lambda = 425 \times 0.8 = 340\ \text{m/s}
  reason: Wave equation
  check_id: chk_build_phy_snd_w0001_ans
final_answer:
  latex: 340\ \text{m/s}
  check_id: chk_build_phy_snd_w0001_ans
