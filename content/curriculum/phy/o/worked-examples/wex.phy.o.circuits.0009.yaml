problem: 'An LDR is connected in series with a 1000 Ω resistor and a 6 V battery. The LDR''s resistance is 400 Ω in one lighting condition and 20000 Ω in the other: bright light and darkness. Calculate the p.d. across the 1000 Ω resistor in the dark.'
steps:
- n: 1
  latex: \text{dark} \Rightarrow R_{\text{sensor}} = \text{the larger value}
  reason: Darkness means higher resistance
- n: 2
  latex: R = 20000 + 1000 = 21000\ \Omega
  reason: Series resistances add
  check_id: chk_build_phy_cir_w0009_rt
- n: 3
  latex: V = 6 \times \frac{1000}{21000} = 0.286\ \text{V}
  reason: The resistor's share of the battery p.d.
  check_id: chk_build_phy_cir_w0009_ans
final_answer:
  latex: 0.286\ \text{V}
  check_id: chk_build_phy_cir_w0009_ans
fading_order:
- 3
- 2
- 1
