problem: A signal is sent as light along an optical fibre 6 km long. The glass of the fibre has a refractive index of 1.5. Calculate the time the light takes to travel the length of the fibre, in microseconds.
steps:
- n: 1
  latex: 6\ \text{km} = 6000\ \text{m}
  reason: Length in metres
  check_id: chk_build_phy_lgt_w0005_lm
- n: 2
  latex: v = \frac{3.0 \times 10^{8}}{1.5} = 2.00 \times 10^{8}\ \text{m/s}
  reason: v = c / n
  check_id: chk_build_phy_lgt_w0005_v_m
- n: 3
  latex: t = \frac{6000}{2.00 \times 10^{8}}\ \text{s} = 30.0\ \mu\text{s}
  reason: Time = distance ÷ speed; one microsecond is a millionth of a second
  check_id: chk_build_phy_lgt_w0005_ans
final_answer:
  latex: 30.0\ \text{µs}
  check_id: chk_build_phy_lgt_w0005_ans
