problem: Lerato drops a magnet through a coil of 250 turns and records a peak e.m.f. of 0.2 V. She repeats it from the same height with a coil of 1000 turns. Assuming the peak e.m.f. is proportional to the number of turns, predict the new peak e.m.f.
steps:
- n: 1
  latex: \frac{1000}{250} = 4
  reason: How many times as many turns
  check_id: chk_build_phy_emg_w0006_ratio
- n: 2
  latex: E = 0.2 \times 4 = 0.8\ \text{V}
  reason: The e.m.f. grows in the same ratio
  check_id: chk_build_phy_emg_w0006_ans
final_answer:
  latex: 0.8\ \text{V}
  check_id: chk_build_phy_emg_w0006_ans
