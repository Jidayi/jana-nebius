problem: A 2 Ω resistor and a lamp of resistance 5 Ω are connected in series to a 6 V supply. Calculate the p.d. across the 5 Ω component.
steps:
- n: 1
  latex: R = 2 + 5 = 7\ \Omega
  reason: Series resistances add
  check_id: chk_build_phy_cir_w0001_rt
- n: 2
  latex: I = \frac{6}{7} = 0.857\ \text{A}
  reason: The current is the same in both
  check_id: chk_build_phy_cir_w0001_i
- n: 3
  latex: V = IR = \frac{6 \times 5}{7} = 4.29\ \text{V}
  reason: V = IR for one part
  check_id: chk_build_phy_cir_w0001_ans
final_answer:
  latex: 4.29\ \text{V}
