- n: 2
  latex: t = \frac{d}{c} = \frac{2.02 \times 10^{7}}{3.0 \times 10^{8}} = 0.0673\ \text{s}
  reason: Time = distance ÷ speed, at the speed of light
  check_id: chk_build_phy_ems_w0001_ans
