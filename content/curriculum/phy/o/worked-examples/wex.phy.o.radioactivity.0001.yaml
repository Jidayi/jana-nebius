problem: A counter near a source reads 590 counts/min with nothing in between, 410 counts/min with a sheet of paper in between, and 80 counts/min with 5 mm of aluminium in between. The background count rate is 25 counts/min. Find the count rate due to gamma radiation alone.
steps:
- n: 1
  latex: C_{\text{aluminium}} = C_{\gamma} + C_{\text{background}}
  reason: Only gamma gets through 5 mm of aluminium
- n: 2
  latex: 80 - 25 = 55\ \text{counts/min}
  reason: Take off the background
  check_id: chk_build_phy_rad_w0001_ans
final_answer:
  latex: 55\ \text{counts/min}
  check_id: chk_build_phy_rad_w0001_ans
