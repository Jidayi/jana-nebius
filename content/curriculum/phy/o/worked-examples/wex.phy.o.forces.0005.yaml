problem: A parachutist of mass 70 kg is falling. At one moment the air resistance on them is 240 N. Take g = 10 N/kg. Find their acceleration at that moment.
steps:
- n: 1
  latex: W = mg = 70 \times 10 = 700\ \text{N}
  reason: Weight
  check_id: chk_build_phy_frc_w0005_w
- n: 2
  latex: F = 700 - 240 = 460\ \text{N}
  reason: 'Resultant force downwards: weight − drag'
  check_id: chk_build_phy_frc_w0005_net
- n: 3
  latex: a = \frac{460}{70} = 6.57\ \text{m/s}^2
  reason: a = F ÷ m
  check_id: chk_build_phy_frc_w0005_ans
final_answer:
  latex: 6.57\ \text{m/s}^2
  check_id: chk_build_phy_frc_w0005_ans
