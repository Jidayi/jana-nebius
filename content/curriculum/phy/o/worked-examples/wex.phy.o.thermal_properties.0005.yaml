id: wex.phy.o.thermal_properties.0005
kc_ids:
- kc.phy.o.thermal_properties.latent_heat
problem: To measure the specific latent heat of fusion of ice, a 50 W heater in a funnel of crushed ice at 0 °C is switched on for 400 s, and 68 g of water drips out. An identical funnel with no heater, used as a control, gives 8 g of water in the same time. Find the specific latent heat of fusion of ice, in kJ/kg.
steps:
- n: 1
  latex: E = Pt = 50 \times 400 = 20000\ \text{J}
  reason: Energy from the heater
  check_id: chk_build_phy_thp_w0005_e
- n: 2
  latex: m = 68 - 8 = 60\ \text{g}
  reason: Ice melted by the heater alone
  check_id: chk_build_phy_thp_w0005_dm
- n: 3
  latex: m = 0.06\ \text{kg}
  reason: Kilograms, since L is per kilogram
  check_id: chk_build_phy_thp_w0005_dmkg
- n: 4
  latex: L = \frac{E}{m} = \frac{20000}{0.06} = 333000\ \text{J/kg}
  reason: Rearrange E = mL
  check_id: chk_build_phy_thp_w0005_lj
- n: 5
  latex: L = 333\ \text{kJ/kg}
  reason: There are a thousand joules in a kilojoule
  check_id: chk_build_phy_thp_w0005_ans
final_answer:
  latex: 333\ \text{kJ/kg}
  check_id: chk_build_phy_thp_w0005_ans
