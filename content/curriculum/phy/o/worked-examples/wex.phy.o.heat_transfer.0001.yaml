problem: Wax beads are stuck to the ends of equal rods of copper and iron, and the other ends are heated equally. The bead falls off the copper rod after 55 s and off the iron rod after 300 s. Taking the rate of conduction as inversely proportional to the time taken, how many times greater is the rate of conduction along the copper than along the iron?
steps:
- n: 1
  latex: t_{\text{copper}} < t_{\text{iron}} \Rightarrow \text{copper conducts faster}
  reason: 'The rate is inversely proportional to the time: the sooner the wax melts, the faster the rate'
- n: 2
  latex: \frac{\text{rate}_{copper}}{\text{rate}_{iron}} = \frac{300}{55} = 5.45
  reason: Invert the ratio of the times
  check_id: chk_build_phy_htr_w0001_ans
final_answer:
  latex: '5.45'
  check_id: chk_build_phy_htr_w0001_ans
