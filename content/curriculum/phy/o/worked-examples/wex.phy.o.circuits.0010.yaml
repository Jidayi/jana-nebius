problem: A thermistor is connected in series with a 400 Ω resistor and a 3 V battery. The thermistor's resistance is 150 Ω at one of two temperatures, 20 °C and 80 °C, and 1200 Ω at the other. Calculate the p.d. across the 400 Ω resistor at 80 °C.
steps:
- n: 1
  latex: \text{warmer} \Rightarrow R_{\text{sensor}} = \text{the smaller value}
  reason: Warmer means lower resistance
- n: 2
  latex: R = 150 + 400 = 550\ \Omega
  reason: Series resistances add
  check_id: chk_build_phy_cir_w0010_rt
- n: 3
  latex: V = 3 \times \frac{400}{550} = 2.18\ \text{V}
  reason: The resistor's share of the battery p.d.
  check_id: chk_build_phy_cir_w0010_ans
final_answer:
  latex: 2.18\ \text{V}
  check_id: chk_build_phy_cir_w0010_ans
