problem: A dodgem car of mass 280 kg moving at 1.5 m/s hits a stationary dodgem of mass 180 kg. They couple together and move off as one. Find their velocity just after the collision.
steps:
- n: 1
  latex: p_\text{before} = 280 \times 1.5 + 0 = 420\ \text{kg m/s}
  reason: The second one is at rest
  check_id: chk_build_phy_mom_w0003_pb
- n: 2
  latex: (280 + 180)v = 460\,v = 420
  reason: Momentum after = momentum before
  check_id: chk_build_phy_mom_w0003_mt
- n: 3
  latex: v = \frac{420}{460} = 0.913\ \text{m/s}
  reason: Solve for v
  check_id: chk_build_phy_mom_w0003_ans
final_answer:
  latex: 0.913\ \text{m/s}
  check_id: chk_build_phy_mom_w0003_ans
