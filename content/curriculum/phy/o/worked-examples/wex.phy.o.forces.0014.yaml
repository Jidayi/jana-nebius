problem: A fridge is 162 cm tall with a base 36 cm wide. Its centre of gravity is 90 cm above the floor, above the middle of the base. It is tilted slowly about one bottom edge. Find the angle from the vertical at which it just starts to topple.
steps:
- n: 1
  latex: \frac{36}{2} = 18\ \text{cm}
  reason: Horizontal distance from the centre of gravity to the edge
  check_id: chk_build_phy_frc_w0014_half
- n: 2
  latex: \tan\theta = \frac{18}{90} = 0.2
  reason: Topples when the centre of gravity is above the edge
  check_id: chk_build_phy_frc_w0014_ratio
- n: 3
  latex: \theta = 11.3^\circ
  reason: Inverse tangent
  check_id: chk_build_phy_frc_w0014_ans
final_answer:
  latex: 11.3^\circ
  check_id: chk_build_phy_frc_w0014_ans
