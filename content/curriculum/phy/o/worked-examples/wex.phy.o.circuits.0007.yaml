problem: A thermistor and a 1500 Ω fixed resistor are connected in series across a 5 V supply. At 80 °C the thermistor's resistance is 400 Ω. The output p.d. is taken across the thermistor. Calculate the output p.d. across the thermistor.
steps:
- n: 1
  latex: R = 1500 + 400 = 1900\ \Omega
  reason: Total resistance of the divider
  check_id: chk_build_phy_cir_w0007_rt
- n: 2
  latex: V_{\text{out}} = 5 \times \frac{400}{1900} = 1.05\ \text{V}
  reason: The output's share is its fraction of the total resistance
  check_id: chk_build_phy_cir_w0007_ans
final_answer:
  latex: 1.05\ \text{V}
  check_id: chk_build_phy_cir_w0007_ans
