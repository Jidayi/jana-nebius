problem: An Earth-observation satellite orbits 700 km above the Earth's surface and goes round once every 99 minutes. The Earth's radius is 6400 km. Calculate its orbital speed in km/s.
steps:
- n: 1
  latex: r = 6400 + 700 = 7100\ \text{km}
  reason: Measured from the Earth's centre
  check_id: chk_build_phy_sol_w0003_rad
- n: 2
  latex: T = 99\ \text{minutes} = 5940\ \text{s}
  reason: Period in seconds
  check_id: chk_build_phy_sol_w0003_ts
- n: 3
  latex: v = \frac{2\pi \times 7100}{5940} = 7.51\ \text{km/s}
  reason: v = 2πr / T
  check_id: chk_build_phy_sol_w0003_ans
final_answer:
  latex: 7.51\ \text{km/s}
  check_id: chk_build_phy_sol_w0003_ans
