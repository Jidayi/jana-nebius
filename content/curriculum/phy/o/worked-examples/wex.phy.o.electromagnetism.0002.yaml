problem: Halima winds a coil on an iron nail and counts the paper clips it lifts, keeping the current the same. With 10 turns it lifts 8 clips, and with 20 turns it lifts 16 clips. Assuming the number of clips is proportional to the number of turns, predict the number lifted with 25 turns.
