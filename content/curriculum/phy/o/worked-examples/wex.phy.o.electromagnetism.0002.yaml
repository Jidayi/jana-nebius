  latex: \frac{8}{10} = 0.8\ \text{clips per turn}
  reason: Clips for each turn
  check_id: chk_build_phy_emg_w0002_per
- n: 2
  latex: 0.8 \times 25 = 20\ \text{clips}
  reason: Scale up to the new number of turns
  check_id: chk_build_phy_emg_w0002_ans
final_answer:
