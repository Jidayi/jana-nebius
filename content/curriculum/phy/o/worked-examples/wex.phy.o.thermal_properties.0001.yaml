problem: An unmarked liquid-in-glass thermometer has a thread 30 mm long in melting ice (0 °C) and 180 mm long in steam from boiling water (100 °C). In a beaker of warm water the thread is 86 mm long. Find the temperature of the water, assuming the liquid expands evenly.
