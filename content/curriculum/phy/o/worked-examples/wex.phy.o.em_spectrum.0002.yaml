problem: Light from a flash on the Moon travels to a telescope on the Earth, a distance of 3.84 × 10⁵ km. All electromagnetic waves travel at the same speed in a vacuum. How long does the journey take?
steps:
- n: 1
  latex: d = 3.84 \times 10^{5}\ \text{km} = 3.84 \times 10^{8}\ \text{m}
  reason: A kilometre is a thousand metres
  check_id: chk_build_phy_ems_w0002_conv
- n: 2
  latex: t = \frac{d}{c} = \frac{3.84 \times 10^{8}}{3.0 \times 10^{8}} = 1.28\ \text{s}
  reason: Time = distance ÷ speed, at the speed of light
  check_id: chk_build_phy_ems_w0002_ans
final_answer:
  latex: 1.28\ \text{s}
  check_id: chk_build_phy_ems_w0002_ans
