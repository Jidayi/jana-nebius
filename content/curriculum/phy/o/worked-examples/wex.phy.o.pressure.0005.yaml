problem: A water manometer is joined to a gas tap. On its scale, the water level is at 24 cm in the open arm and at 12 cm in the arm joined to the tap. Water has a density of 1000 kg/m³. Take g = 10 N/kg. By how many pascals is the gas pressure above atmospheric pressure?
steps:
- n: 1
  latex: \Delta h = 24 - 12 = 12\ \text{cm}
  reason: The difference in levels
  check_id: chk_build_phy_prs_w0005_dh
- n: 2
  latex: 12\ \text{cm} = 0.12\ \text{m}
  reason: Centimetres into metres
  check_id: chk_build_phy_prs_w0005_dhm
- n: 3
  latex: \Delta p = \rho g \Delta h = 1000 \times 10 \times 0.12 = 1200\ \text{Pa}
  reason: Δp = ρgΔh
  check_id: chk_build_phy_prs_w0005_ans
final_answer:
  latex: 1200\ \text{Pa}
  check_id: chk_build_phy_prs_w0005_ans
