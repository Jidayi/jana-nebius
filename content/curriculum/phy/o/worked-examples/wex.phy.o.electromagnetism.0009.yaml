problem: A power line wastes 800 kW in its cables when it transmits power at 50 kV. The same power is then sent at 200 kV through the same cables. Find the power now wasted in the cables, in kW.
steps:
- n: 1
  latex: \frac{200}{50} = 4
  reason: The voltage rises by this factor, so the current falls by it
  check_id: chk_build_phy_emg_w0009_k
- n: 2
  latex: 4^2 = 16
  reason: The loss goes with current squared
  check_id: chk_build_phy_emg_w0009_k2
- n: 3
  latex: P_{loss} = \frac{800}{16} = 50\ \text{kW}
  reason: Divide by the square
  check_id: chk_build_phy_emg_w0009_ans
final_answer:
  latex: 50\ \text{kW}
  check_id: chk_build_phy_emg_w0009_ans
