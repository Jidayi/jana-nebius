problem: An engineer tests a steel block for cracks. An ultrasound pulse sent into the block gives an echo from a crack 6 µs later. Sound travels at 340 m/s in air and 6000 m/s in steel. How far below the surface is the crack, in millimetres?
steps:
- n: 1
  latex: t = 6\ \mu\text{s} = 0.000006\ \text{s}
  reason: A microsecond is a millionth of a second
  check_id: chk_build_phy_snd_w0008_ts
- n: 2
  latex: d = \frac{6000 \times 0.000006}{2} = 0.018\ \text{m}
  reason: Half the there-and-back distance
  check_id: chk_build_phy_snd_w0008_dm
- n: 3
  latex: 0.018\ \text{m} = 18\ \text{mm}
  reason: A metre is a thousand millimetres
  check_id: chk_build_phy_snd_w0008_ans
final_answer:
  latex: 18\ \text{mm}
  check_id: chk_build_phy_snd_w0008_ans
