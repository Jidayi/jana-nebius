problem: A hot-air balloon's envelope holds 2000 m³ of hot air of density 0.98 kg/m³. The cooler air outside has a density of 1.18 kg/m³. The upward push of the outside air equals the weight of the outside air the envelope displaces. Take g = 10 N/kg. Find the resultant upward force on the hot air, ignoring the balloon's own weight.
steps:
- n: 1
  latex: m_{out} = 1.18 \times 2000 = 2360\ \text{kg}
  reason: Mass of the displaced air
  check_id: chk_build_phy_htr_w0003_mo
- n: 2
  latex: m_{in} = 0.98 \times 2000 = 1960\ \text{kg}
  reason: Mass of the hot air
  check_id: chk_build_phy_htr_w0003_mi
- n: 3
  latex: 2360 - 1960 = 400\ \text{kg}
  reason: The difference in mass
  check_id: chk_build_phy_htr_w0003_dm
- n: 4
  latex: F = 400 \times 10 = 4000\ \text{N}
  reason: Upward push − weight of the hot air
  check_id: chk_build_phy_htr_w0003_ans
final_answer:
  latex: 4000\ \text{N}
  check_id: chk_build_phy_htr_w0003_ans
