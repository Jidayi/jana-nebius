  reason: Convert to kelvin
  check_id: chk_build_phy_ptc_w0005_k2
- n: 3
  latex: p_2 = 200 \times \frac{360}{300} = 240\ \text{kPa}
  reason: Pressure is proportional to the kelvin temperature
  check_id: chk_build_phy_ptc_w0005_ans
final_answer:
  latex: 240\ \text{kPa}
  check_id: chk_build_phy_ptc_w0005_ans
