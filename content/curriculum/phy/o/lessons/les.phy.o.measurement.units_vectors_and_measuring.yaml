title: Measuring, units and vectors
estimated_minutes: 11
blocks:
- type: step
  text:
    en: A single card is too thin for a ruler to measure accurately. Try this before any rule.
  item_id: itm.phy.o.measurement.0054
  action: try_first
  why:
    en: The whole pile is 10 mm thick and there are 100 cards in it. Share the thickness between them to get 0.1 mm each.
  names:
    en: That is called measuring many and dividing. It makes a tiny length or a short time much easier to measure.
- type: step
  text:
    en: Timing many swings works the same way. Time them all, then share the time between the swings.
  item_id: itm.phy.o.measurement.0058
  action: choose
  why:
    en: Divide the total time by the number of whole swings, not by any other count. That gives 1.12 s for one swing.
- type: step
  text:
    en: Kilo means a thousand. A kilogram is a thousand grams, so the number of kilograms is smaller than the number of grams.
  item_id: itm.phy.o.measurement.0014
  action: choose
  why:
    en: Going to a bigger unit makes the number smaller, so divide by a thousand. That turns 470 g into 0.47 kg.
- type: step
  text:
    en: Some quantities only have a size. Others also have a direction, like a push or a pull.
  item_id: itm.phy.o.measurement.0027
  action: choose
  why:
    en: Weight is a force that always acts downwards, so it has a direction. Mass, power and temperature only have a size.
  names:
    en: A quantity with a direction is a vector. A quantity with only a size is a scalar.
- type: step
  text:
    en: 'Two forces at right angles do not simply add up. Predict: is the resultant more or less than the two sizes added together?'
  item_id: itm.phy.o.measurement.0041
  action: predict
  why:
    en: The forces pull partly in different directions, so the resultant is less than 41 N. Square each force, add the squares, then take the square root to get 29 N.
  names:
    en: The single force with the same effect as both is the resultant.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.phy.o.measurement.0035
  action: calculate
  why:
    en: Square each force, add, then take the square root.
- type: check
  item_ids:
  - itm.phy.o.measurement.0057
  - itm.phy.o.measurement.0012
  - itm.phy.o.measurement.0039
