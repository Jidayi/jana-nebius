- type: idea
  text:
    en: 'When several forces act on an object, what matters is their resultant: add the forces that point one way and subtract those that point the other way. If the resultant is zero the forces are balanced, and the object keeps doing what it was doing, staying still or moving at a steady velocity. If there is a resultant force, the object accelerates in the direction of that force. The acceleration is the resultant force divided by the mass, so a bigger force or a smaller mass gives a bigger acceleration.'
