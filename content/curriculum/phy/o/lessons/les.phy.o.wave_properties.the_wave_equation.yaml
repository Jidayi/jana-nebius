- type: idea
  text:
    en: A wave carries energy from place to place without carrying matter with it. Its amplitude is the largest displacement from the rest position. Its wavelength is the distance from one crest to the next. The frequency is how many waves pass a point each second, measured in hertz. The period is the time for one wave. It is one divided by the frequency. In one period the wave moves forward one wavelength. So the wave speed is the frequency times the wavelength.
