  - itm.phy.o.circuits.0011
  - itm.phy.o.circuits.0026
- type: common_mistakes
  text:
    en: Do not share the supply voltage between parallel branches, and do not add parallel resistances as if they were in series.
  misconception_ids:
  - mc.phy.o.circuit_current_r_over_v
  - mc.phy.o.parallel_adding_branch_raises_resistance
