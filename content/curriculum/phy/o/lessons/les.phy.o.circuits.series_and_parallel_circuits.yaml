title: Series and parallel circuits
estimated_minutes: 12
blocks:
- type: prior_knowledge
  item_ids:
  - itm.phy.o.electrical_quantities.0046
- type: idea
  text:
    en: In a series circuit there is only one path. The same current passes through every component. The potential differences across the components add up to the supply, and so do the resistances. In a parallel circuit, each branch has the full supply potential difference across it. The branch currents add up to the current from the supply. The combined resistance is less than the smallest branch resistance, because each new branch gives the charge another way through.
- type: worked_example
  worked_example_id: wex.phy.o.circuits.0001
- type: guided_step
  item_id: itm.phy.o.circuits.0001
- type: quick_check
