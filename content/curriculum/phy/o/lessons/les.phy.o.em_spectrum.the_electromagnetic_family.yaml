title: The electromagnetic spectrum
estimated_minutes: 11
blocks:
- type: step
  text:
    en: 'Sunlight reaches us after crossing empty space, with no air at all on the way. Try this before any rule: what does that tell you about light?'
  item_id: itm.phy.o.em_spectrum.0012
  action: try_first
  why:
    en: Light got here through a vacuum, so it needs no material to carry it. In a vacuum it travels at the speed of light.
  names:
    en: Light belongs to a family called the electromagnetic spectrum. All of them are transverse waves that cross a vacuum at the same speed.
- type: step
  text:
    en: The family runs from radio waves through microwaves, infrared, light, ultraviolet and X-rays to gamma rays. They all share one speed, so frequency and wavelength cannot both go up together.
  item_id: itm.phy.o.em_spectrum.0015
  action: choose
  why:
    en: Speed equals frequency times wavelength, and the speed is fixed. So as the frequency rises towards gamma rays, the wavelength must get shorter.
- type: step
  text:
    en: Each region has its own jobs. Think about which rays pass through flesh but are stopped by bone.
  item_id: itm.phy.o.em_spectrum.0041
  action: choose
  why:
    en: X-rays pass through soft tissue but are absorbed by bone, so the bone shows up on the picture. Gamma rays are used to kill cells, not to take these pictures.
- type: step
  text:
    en: 'Not every hazard is damage to DNA. Predict: what would a strong beam of microwaves do to your body?'
  item_id: itm.phy.o.em_spectrum.0042
  action: predict
  why:
    en: Microwaves are not ionising, so they do not break up DNA the way gamma rays can. They make the water in your tissue vibrate and heat up from the inside.
  names:
    en: Long waves harm mainly by heating. The ionising, most dangerous radiation is at the short-wavelength, gamma-ray end.
- type: step
  text:
    en: Now use the wave equation with the speed of light. Change the frequency into hertz first.
  item_id: itm.phy.o.em_spectrum.0016
  action: calculate
  why:
    en: Mega means a million, so the frequency is 96 million hertz. The wavelength is the speed of light divided by the frequency.
- type: step
  text:
    en: 'Now one on your own: this time the wavelength is given.'
  item_id: itm.phy.o.em_spectrum.0019
  action: calculate
  why:
    en: Change nanometres into metres first. Then divide the speed of light by the wavelength.
- type: check
