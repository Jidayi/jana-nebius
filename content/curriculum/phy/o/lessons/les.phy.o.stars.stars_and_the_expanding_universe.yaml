title: Stars and the expanding Universe
estimated_minutes: 11
blocks:
- type: step
  text:
    en: 'Light is very fast, but it still takes time to cross space. Try this before any rule: when would we first see an explosion on a far-off star?'
  item_id: itm.phy.o.stars.0009
  action: try_first
  why:
    en: The star is so far away that its light takes 500 years to reach us. So we see the explosion about 500 years after it happens.
  names:
    en: A light-year is the distance light travels in one year. It measures distance, not time.
- type: step
  text:
    en: To turn light-years into metres, use the number of metres light travels in one year.
  item_id: itm.phy.o.stars.0010
  action: calculate
  why:
    en: Each light-year is a fixed number of metres. Multiply the number of light-years by it.
- type: step
  text:
    en: Stars are born in clouds of gas and dust and change as they age. How a star ends depends on its mass.
  item_id: itm.phy.o.stars.0028
  action: choose
  why:
    en: Every star starts as a nebula, then a protostar, and spends most of its life on the main sequence. A very massive star swells to a red supergiant, explodes as a supernova and can leave a black hole.
  names:
    en: This is called the life cycle of a star.
- type: step
  text:
    en: 'Work out how many times heavier than the Sun this star is. Predict: will it end in a supernova?'
  item_id: itm.phy.o.stars.0026
  action: predict
  why:
    en: It is only one and a half times the mass of the Sun, far below the supernova limit. So, like the Sun, it swells to a red giant and ends as a white dwarf.
- type: step
  text:
    en: Light from distant galaxies arrives stretched to longer wavelengths. This redshift shows the galaxy is moving away from us.
  item_id: itm.phy.o.stars.0043
  action: choose
  why:
    en: Galaxies further away are moving away faster, so the one twice as far has the bigger redshift. Recession speed is proportional to distance.
  names:
    en: This pattern is Hubble's law, and it shows the Universe is expanding.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.phy.o.stars.0034
  action: calculate
  why:
    en: Galaxy Q is twice as far away as P. By Hubble's law it moves away twice as fast.
- type: check
