title: How sound travels
estimated_minutes: 12
blocks:
- type: step
  text:
    en: 'A loudspeaker cone shoves forward into the air in front of it. Try this before any rule: what does that shove do to the air particles there?'
  item_id: itm.phy.o.sound.0003
  action: try_first
  why:
    en: The cone pushes the air particles closer together, making a squashed region. When it moves back, it leaves a region where they are spread out.
  names:
    en: 'The squashed region is a compression and the spread-out one is a rarefaction. Sound is a longitudinal wave: the particles vibrate along the direction it travels.'
- type: step
  text:
    en: Sound travels as each particle knocks into the next one. Think about what happens when the particles are taken away.
  item_id: itm.phy.o.sound.0014
  action: choose
  why:
    en: The bell keeps vibrating, but with no air there is nothing to pass the vibrations on, so the sound fades. Sound cannot cross a vacuum.
  names:
    en: The material that carries a sound is called its medium.
- type: step
  text:
    en: 'Hitting a drum harder makes its skin swing further each time. Predict: will the sound be higher, louder, or both?'
  item_id: itm.phy.o.sound.0043
  action: predict
  why:
    en: A bigger swing of the skin is a bigger amplitude, which we hear as a louder sound. Pitch depends on frequency, and that stays the same for the same drum.
  names:
    en: Loudness goes with amplitude, and pitch goes with frequency.
- type: step
  text:
    en: An echo is sound that bounces back off a surface. Remember the sound goes to the cliff and then comes back.
  item_id: itm.phy.o.sound.0016
  action: calculate
  why:
    en: In the time given, the sound travels to the cliff and back again. Work out that whole distance, then halve it.
- type: step
  text:
    en: Ultrasound is sound pitched too high for people to hear. Doctors use its echoes to see inside the body.
  item_id: itm.phy.o.sound.0057
  action: choose
  why:
    en: Some ultrasound reflects at each boundary between tissues. The scanner times these echoes to find how deep each boundary is; it does not make a shadow.
- type: step
  text:
    en: Now one on your own. Use the speed in sea water, not in air.
  item_id: itm.phy.o.sound.0050
  action: calculate
  why:
    en: Speed times time gives the distance down to the sea bed and back up. Halve it to get the depth.
- type: check
  item_ids:
