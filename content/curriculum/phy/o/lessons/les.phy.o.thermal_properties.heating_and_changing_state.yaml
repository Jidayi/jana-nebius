- type: idea
  text:
    en: 'Heating a substance can do two things. It can raise the temperature: the energy needed is the mass times the specific heat capacity times the temperature rise, so water, with its large specific heat capacity, warms slowly. Or it can change the state at a steady temperature: while ice melts or water boils, the energy breaks the bonds between particles instead of speeding them up, and the energy needed is the mass times the specific latent heat.'
