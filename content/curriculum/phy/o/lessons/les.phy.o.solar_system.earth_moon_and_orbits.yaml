blocks:
- type: prior_knowledge
  item_ids:
  - itm.phy.o.motion.0001
- type: idea
  text:
    en: The Earth spins on its axis once a day. This gives day and night. It orbits the Sun once a year. Its axis is tilted, so for part of the year each half of the Earth leans towards the Sun and has summer. The Moon orbits the Earth about once a month. As it goes round, we see different amounts of its sunlit half. These are its phases. A body in a circular orbit goes once round the circle in one orbital period. So its average speed is the circumference divided by the period.
