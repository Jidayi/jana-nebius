- type: idea
  text:
    en: 'Speed tells you how far something goes each second: divide the total distance by the total time. Acceleration tells you how quickly the velocity changes: divide the change in velocity by the time the change takes. A car that goes from slow to fast in a short time has a large acceleration. Something slowing down has a negative acceleration when its motion is in the positive direction.'
