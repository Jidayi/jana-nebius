title: Conduction, convection and radiation
estimated_minutes: 11
blocks:
- type: step
  text:
    en: Try this before any rule. Both benches have been in the same night air for hours.
  item_id: itm.phy.o.heat_transfer.0013
  action: try_first
  why:
    en: Both benches are at the same temperature. Metal carries energy away from your warm body much faster than wood, so it feels colder.
  names:
    en: Energy passing through a material from particle to particle is called conduction. Metals are good conductors and wood is a poor one.
- type: step
  text:
    en: In every solid, hotter particles vibrate more and pass this on to their neighbours. Metals have something extra.
  item_id: itm.phy.o.heat_transfer.0015
  action: choose
  why:
    en: Metals have free electrons that move quickly through the metal and carry energy with them. The atoms themselves stay in place.
- type: step
  text:
    en: 'Liquids and gases can flow. Predict: when the water at the bottom warms up, does it rise or sink, and why?'
  item_id: itm.phy.o.heat_transfer.0028
  action: predict
  why:
    en: Warm water expands, which makes it lighter for its size than the cooler water nearby. The denser water sinks and pushes the warm water up.
  names:
    en: This flow, with warm fluid rising and cool fluid sinking, is a convection current.
- type: step
  text:
    en: Same idea, less help this time. Now the air is being cooled, not heated.
  item_id: itm.phy.o.heat_transfer.0026
  action: choose
  why:
    en: Air cooled at the top contracts and becomes denser, so it sinks. Warmer air rises to take its place, and a current flows round the cabinet.
- type: step
  text:
    en: Every object gives out infrared, and the surface makes a difference to how fast.
  item_id: itm.phy.o.heat_transfer.0044
  action: choose
  why:
    en: Dull black surfaces are good emitters of infrared, so the black can loses energy faster.
  names:
    en: Energy carried by infrared waves is thermal radiation. It needs no material, so it can even cross a vacuum.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.phy.o.heat_transfer.0031
  action: calculate
  why:
    en: Find how far the black can's temperature fell, then divide by the number of minutes.
- type: check
