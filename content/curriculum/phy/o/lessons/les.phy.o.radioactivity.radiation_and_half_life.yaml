title: Nuclear radiation and half-life
estimated_minutes: 12
blocks:
- type: prior_knowledge
  item_ids:
  - itm.phy.o.atom.0001
- type: idea
  text:
    en: 'An unstable nucleus can give out alpha particles, beta particles or gamma rays. Alpha particles are helium nuclei: they ionise strongly but are stopped by paper. Beta particles are fast electrons, stopped by a few millimetres of aluminium. Gamma rays are electromagnetic waves that need thick lead or concrete to reduce them. Decay is random, but a large sample has a half-life, the time for its activity, or the number of undecayed nuclei, to fall to half.'
- type: worked_example
  worked_example_id: wex.phy.o.radioactivity.0001
- type: guided_step
  item_id: itm.phy.o.radioactivity.0001
- type: quick_check
  item_ids:
  - itm.phy.o.radioactivity.0011
  - itm.phy.o.radioactivity.0041
- type: common_mistakes
  text:
    en: Halve the activity once for every half-life that passes; do not subtract a half each time.
  misconception_ids:
  - mc.phy.o.alpha_deflected_more
  - mc.phy.o.background_halved_too
  - mc.phy.o.background_not_added_back
  - mc.phy.o.beta_from_electron_shell
- type: exit_check
  item_ids:
