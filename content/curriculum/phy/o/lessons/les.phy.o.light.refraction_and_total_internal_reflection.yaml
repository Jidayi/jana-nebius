- type: idea
  text:
    en: 'Light changes speed when it passes from one material into another, and unless it meets the boundary along the normal it changes direction too. Going into a denser material such as glass it slows down and bends towards the normal. The refractive index is the sine of the angle of incidence divided by the sine of the angle of refraction, with both angles measured from the normal. Going from glass into air the light bends away from the normal, and beyond the critical angle none escapes: it is totally internally reflected.'
