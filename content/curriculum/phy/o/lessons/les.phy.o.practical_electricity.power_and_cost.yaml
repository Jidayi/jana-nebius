- type: idea
  text:
    en: 'The power of an appliance is the rate at which it transfers energy: the current times the potential difference across it. The energy transferred is the power times the time it is on. Electricity companies measure energy in kilowatt-hours, the energy a one-kilowatt appliance uses in one hour, so to find the cost, change the power to kilowatts and the time to hours, multiply, and then multiply by the price of one kilowatt-hour.'
