title: Inside the atom
estimated_minutes: 11
blocks:
- type: step
  text:
    en: A nucleus is written with two numbers. The top one counts every particle in the nucleus and the bottom one counts only the protons. Try this before any rule.
  item_id: itm.phy.o.atom.0010
  action: try_first
  why:
    en: Every particle in the nucleus is either a proton or a neutron. Take the protons away from the total and the neutrons are left.
  names:
    en: The top number is the nucleon number and the bottom one is the proton number. Neutrons equal the nucleon number minus the proton number.
- type: step
  text:
    en: This time you know the protons and the neutrons.
  item_id: itm.phy.o.atom.0011
  action: choose
  why:
    en: The nucleon number counts protons and neutrons together, so add them. It does not count electrons, which are outside the nucleus.
- type: step
  text:
    en: 'Atoms of one element can have different numbers of neutrons. Predict: is a heavier atom always a different element?'
  item_id: itm.phy.o.atom.0029
  action: predict
  why:
    en: The number of protons decides the element, and P and Q have the same number. Q just has more neutrons, so it is heavier.
  names:
    en: Atoms with the same proton number but different nucleon numbers are called isotopes.
- type: step
  text:
    en: Scientists once fired alpha particles at very thin gold foil to see inside atoms. Think about what would happen if atoms were mostly empty.
  item_id: itm.phy.o.atom.0045
  action: choose
  why:
    en: Nearly all the alpha particles went straight through, so most of an atom is empty space. Only a very few were turned back.
  names:
    en: 'This led to the nuclear model: a tiny, dense, positive nucleus with the electrons far outside it.'
- type: step
  text:
    en: Same idea, less help this time.
  item_id: itm.phy.o.atom.0041
  action: choose
  why:
    en: Alpha particles are positive, and like charges repel. The ones passing close to a nucleus were pushed away, so the nucleus must be positive.
- type: step
  text:
    en: Now one on your own.
  item_id: itm.phy.o.atom.0040
  action: calculate
  why:
    en: Take away the particles that were deflected or turned back, then find what fraction of the total is left. Turn that fraction into a percentage.
- type: check
  item_ids:
  - itm.phy.o.atom.0004
  - itm.phy.o.atom.0030
  - itm.phy.o.atom.0043
