title: Magnets and magnetic fields
estimated_minutes: 10
blocks:
- type: step
  text:
    en: 'A magnet hanging from a thread is free to swing. Try this before any rule: what happens when two north poles come close?'
  item_id: itm.phy.o.magnetism.0005
  action: try_first
  why:
    en: 'Two north poles push each other away, so that end swings away. They do not need to touch: magnetic forces act across a gap.'
  names:
    en: 'That is the law of poles: like poles repel and unlike poles attract.'
- type: step
  text:
    en: A magnet can turn a nearby piece of iron into a magnet for a while. Ask which pole would make the iron be pulled in.
  item_id: itm.phy.o.magnetism.0011
  action: choose
  why:
    en: Iron is always attracted to a magnet, so the near end must become the opposite pole. A north pole makes a south pole appear next to it.
  names:
    en: This is called induced magnetism.
- type: step
  text:
    en: 'Some materials lose their magnetism easily and some keep it. Predict: which one suits a core that must stop being a magnet at once?'
  item_id: itm.phy.o.magnetism.0013
  action: predict
  why:
    en: Soft iron is easy to magnetise and loses it easily, so the electromagnet lets go when the current stops. Steel would stay magnetised.
  names:
    en: Soft iron is a soft magnetic material. Steel is a hard magnetic material, used for permanent magnets.
- type: step
  text:
    en: The space where a magnet pushes or pulls is its magnetic field. We draw it as lines whose arrows show which way a north pole would be pushed.
  item_id: itm.phy.o.magnetism.0029
  action: choose
  why:
    en: A north pole is pushed away from the magnet's north pole and pulled towards its south pole. So outside the magnet the lines run from north round to south.
  names:
    en: These are called magnetic field lines.
- type: step
  text:
    en: Same idea, less help this time.
  item_id: itm.phy.o.magnetism.0027
  action: choose
  why:
    en: At any point a compass can only point one way, so the field has just one direction there. If two lines crossed, it would have two.
- type: step
  text:
    en: Now one on your own. The closer together the lines, the stronger the field.
  item_id: itm.phy.o.magnetism.0019
  action: calculate
  why:
    en: The lines at P are half as far apart as at Q, so they are twice as crowded. The field at P is twice as strong.
- type: check
  item_ids:
  - itm.phy.o.magnetism.0010
  - itm.phy.o.magnetism.0026
  - itm.phy.o.magnetism.0030
