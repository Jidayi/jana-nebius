  - itm.phy.o.motion.0001
- type: idea
  text:
    en: 'A moving object has energy in its kinetic store, which depends on its mass and on the square of its speed: doubling the speed gives four times the kinetic energy. Lifting an object increases the energy in its gravitational potential store by its weight times the height it is raised. Energy is never made or destroyed, only transferred between stores, so as a ball falls its potential energy goes into kinetic energy, and if no energy is lost the two changes are equal.'
