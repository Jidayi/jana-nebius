title: Pressure in solids, liquids and air
estimated_minutes: 12
blocks:
- type: step
  text:
    en: The piano's weight is spread over the small area of its feet. Try this before any rule. How many newtons press on each square metre?
  item_id: itm.phy.o.pressure.0001
  action: try_first
  why:
    en: Share the 2700 N over 0.02 m² by dividing. That gives 135000 newtons on each square metre.
  names:
    en: 'That is pressure: force divided by area, p = F/A, measured in pascals.'
- type: step
  text:
    en: Pressure depends on the force and on the area it acts on. Think about what is different about narrow heels.
  item_id: itm.phy.o.pressure.0013
  action: choose
  why:
    en: Her weight is pushed onto the tiny area of her heels. A smaller area makes the pressure much bigger, even though her weight is less.
- type: step
  text:
    en: This time you are given a mass. Turn it into a weight in newtons first.
  item_id: itm.phy.o.pressure.0014
  action: choose
  why:
    en: The weight is 45 × 10 = 450 N. Then 450 ÷ 0.05 gives 9000 Pa.
- type: step
  text:
    en: 'In a liquid, the pressure comes from the liquid above you. Predict: does the width of the container matter?'
  item_id: itm.phy.o.pressure.0026
  action: predict
  why:
    en: Pressure in a liquid depends only on the depth and the density of the liquid. The amount of water and the shape make no difference.
  names:
    en: 'Pressure under a liquid is p = ρgh: density times g times depth.'
- type: step
  text:
    en: Same idea, less help this time.
  item_id: itm.phy.o.pressure.0016
  action: calculate
  why:
    en: Multiply density, g and depth, then change pascals to kilopascals.
- type: step
  text:
    en: Now one on your own. In a barometer, the air pressing on the open mercury holds the column up.
  item_id: itm.phy.o.pressure.0045
  action: choose
  why:
    en: The column's pressure depends only on its height, just as in any liquid. So the width of the tube does not change the height.
  names:
    en: A mercury barometer measures atmospheric pressure from the height of its column.
- type: check
  item_ids:
  - itm.phy.o.pressure.0012
  - itm.phy.o.pressure.0028
  - itm.phy.o.pressure.0041
