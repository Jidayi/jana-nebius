student_name: Adding when the gas pressure is lower
description: Adds the manometer difference to atmospheric pressure when the levels show the gas pressure is lower (or subtracts it when the gas pressure is higher), misreading which side pushes harder.
signatures:
- kind: step_error
  error_category: sign
fix:
  strategy: diagram
  text:
    en: The side that pushes harder pushes its liquid level down. If the liquid stands higher in the open arm, the gas pressure is above atmospheric; if it stands higher on the gas side, it is below.
