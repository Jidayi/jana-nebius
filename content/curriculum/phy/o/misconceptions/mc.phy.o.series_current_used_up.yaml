id: mc.phy.o.series_current_used_up
kc_ids:
- kc.phy.o.circuits.series_circuits
student_name: Current gets used up along a series circuit
description: Thinks each lamp or resistor in a series circuit uses up some of the current, so an ammeter after it reads less than one before it.
signatures:
- kind: answer_transform
  expression: I_after < I_before
fix:
  strategy: rule_restatement
  text:
    en: 'Charge is not used up: the same charge flows all the way round. In a series circuit the current is the same at every point; it is energy that the components transfer.'
