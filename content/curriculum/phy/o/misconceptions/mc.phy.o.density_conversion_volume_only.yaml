student_name: Converting only the volume unit
description: Changes the volume unit between cm³ and m³ when converting a density but forgets to change the mass between grams and kilograms, so the answer is a thousand times too big or too small.
signatures:
- kind: answer_transform
  expression: x*1000000
fix:
  strategy: rule_restatement
  text:
    en: 'Convert both parts of the unit: grams to kilograms divides by a thousand, and per cm³ to per m³ multiplies by a million. Together, g/cm³ to kg/m³ is a single multiplication by a thousand.'
