student_name: Current over p.d. is resistance
description: Divides the current by the p.d. from an I-V graph (its gradient) and calls it the resistance; resistance is V/I, so a steeper I-V line means less resistance.
signatures:
- kind: structural
  rule: ratio_inverted
fix:
