student_name: Milliseconds used as seconds
description: Uses a period in milliseconds as if it were in seconds when working out f = 1/T, so the frequency is a thousand times too small.
signatures:
- kind: step_error
  error_category: units
fix:
  strategy: rule_restatement
  text:
    en: f = 1/T gives hertz only when T is in seconds. Change milliseconds into seconds first.
