student_name: Terminal velocity cannot change
description: Thinks an object's terminal velocity is a fixed top speed that stays the same whatever happens to the drag on it, for example when a parachute opens.
signatures:
- kind: answer_transform
  expression: v_t fixed
fix:
  strategy: rule_restatement
  text:
    en: Terminal velocity is the speed at which drag balances weight. Change the drag, by opening a parachute or changing shape, and the balance happens at a different speed.
