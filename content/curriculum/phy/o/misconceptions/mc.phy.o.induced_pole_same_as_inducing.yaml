student_name: The induced pole matches the magnet's pole
description: Thinks a magnet induces the same pole in the near end of a piece of iron, so expects the iron to be pushed away; the near end becomes the opposite pole and is attracted.
signatures:
- kind: step_error
  error_category: sign
fix:
  strategy: diagram
  text:
    en: A north pole induces a south pole in the near end of the iron. Unlike poles attract, which is why iron is always pulled towards a magnet.
