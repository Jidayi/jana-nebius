student_name: Rearranging v = 2πr/T the wrong way
description: Multiplies when the rearranged formula needs a division (for example T = 2πr × v), when finding the period or the radius from the orbital speed.
signatures:
- kind: step_error
  error_category: illegal_operation
fix:
  strategy: rule_restatement
  text:
    en: 'From v = 2πr ÷ T: T = 2πr ÷ v and r = vT ÷ 2π. Check the answer has sensible units.'
