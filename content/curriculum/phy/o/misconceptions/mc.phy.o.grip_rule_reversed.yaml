student_name: Getting the grip rule backwards
description: Uses the right-hand grip rule the wrong way, giving the opposite direction for the field round a wire or the wrong pole at the end of a coil.
signatures:
- kind: step_error
  error_category: sign
fix:
  strategy: rule_restatement
  text:
    en: 'Grip the wire with your right hand, thumb along the current: your fingers curl the way the field goes. For a coil, curl the fingers with the current and the thumb points to the north pole.'
