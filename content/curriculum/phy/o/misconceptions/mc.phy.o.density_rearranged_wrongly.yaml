student_name: Rearranging density = mass ÷ volume wrongly
description: Divides where they should multiply, or divides the wrong way round, when finding a mass or a volume from density = mass ÷ volume.
signatures:
- kind: step_error
  error_category: illegal_operation
fix:
  strategy: rule_restatement
  text:
    en: 'Mass = density × volume, and volume = mass ÷ density. Check with the units: kg/m³ × m³ leaves kg.'
