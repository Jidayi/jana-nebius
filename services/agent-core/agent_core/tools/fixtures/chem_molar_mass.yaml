# Tool fixtures (TOL-05): synthetic, hand-written.
tool: chem_molar_mass
version: 1
valid_args:
- formula: CuSO4·5H2O
- formula: Ca(OH)2
  constants:
  - symbol: Ar(Ca)
    value: '40'
    source: pack
  - symbol: Ar(O)
    value: '16'
    source: pack
  - symbol: Ar(H)
    value: '1'
    source: pack
invalid_args:
- {}
- formula: ''
- formula: NaCl
  constants:
  - symbol: Ar(Na)
    value: '23'
description_lint:
  sections:
  - what
  - use_when
  - parameters
  - returns
  - limits
  - recovery
  max_chars_full: 600
repairs:
- mistake: arguments sent as a JSON string
  input: '{"text": "x+1"}'
  repaired:
    note: same pattern on this tool's arguments
- mistake: argument names in camelCase
  input:
    Text: x+1
  repaired:
    note: same pattern on this tool's arguments
envelopes:
  unknown_tool:
    first_clause: No action was taken.
    retryable: false
  unavailable:
    first_clause: No action was taken.
    retryable: false
  invalid_args:
    first_clause: No action was taken.
    retryable: true
  truncated_args:
    first_clause: No action was taken.
    retryable: true
  policy_denied:
