# Tool fixtures (TOL-05): synthetic, hand-written.
tool: acc_ratios
version: 1
valid_args:
- revenue: 50000
  cost_of_sales: 30000
  profit_for_the_year: 8000
- current_assets: 12000
  current_liabilities: 6000
  closing_inventory: 4000
  ratios:
  - current_ratio
  - acid_test
  definitions:
    quick_assets: less_inventory
invalid_args:
- revenue: 1.5
- revenue: 100
  ratios:
  - price_earnings
- revenue: 100
  definitions:
    year_days: 364
description_lint:
  sections:
  - what
  - use_when
  - parameters
  - returns
  - limits
  - recovery
  max_chars_full: 600
repairs:
- mistake: arguments sent as a JSON string
  input: '{"text": "x+1"}'
  repaired:
    note: same pattern on this tool's arguments
- mistake: argument names in camelCase
  input:
    Text: x+1
  repaired:
    note: same pattern on this tool's arguments
envelopes:
  unknown_tool:
    first_clause: No action was taken.
    retryable: false
  unavailable:
    first_clause: No action was taken.
    retryable: false
  invalid_args:
