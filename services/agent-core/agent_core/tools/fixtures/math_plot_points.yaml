# Tool fixtures (TOL-05): synthetic, hand-written.
tool: math_plot_points
version: 1
valid_args:
- curves:
  - id: f
    expr: 1/(x-2)
  x_range:
  - -5
  - 5
- curves:
  - id: f
    expr: x^2
  - id: g
    expr: x+2
  x_range:
  - -3
  - 3
  marks:
  - intersections
invalid_args:
- curves: []
  x_range:
  - 0
  - 1
- curves:
  - id: F
    expr: x
  x_range:
  - 0
  - 1
description_lint:
  sections:
  - what
  - use_when
  - parameters
  - returns
  - limits
  - recovery
  max_chars_full: 600
repairs:
- mistake: arguments sent as a JSON string
  input: '{"text": "x+1"}'
  repaired:
    note: same pattern on this tool's arguments
- mistake: argument names in camelCase
  input:
    Text: x+1
  repaired:
    note: same pattern on this tool's arguments
envelopes:
  unknown_tool:
    first_clause: No action was taken.
    retryable: false
  unavailable:
    first_clause: No action was taken.
    retryable: false
  invalid_args:
    first_clause: No action was taken.
    retryable: true
  truncated_args:
    first_clause: No action was taken.
    retryable: true
  policy_denied:
    first_clause: No action was taken.
    retryable: false
  student_declined:
    first_clause: The action completed, but
    retryable: false
  timeout:
    first_clause: No action was taken.
    retryable: true
  cancelled:
    first_clause: No action was taken.
    retryable: false
  worker_crashed:
    first_clause: No action was taken.
    retryable: true
  worker_unavailable:
    first_clause: No action was taken.
    retryable: false
  limit_exceeded:
    first_clause: No action was taken.
    retryable: false
  domain_error:
    first_clause: No action was taken.
    retryable: false
  execution_error:
    first_clause: No action was taken.
    retryable: false
  result_too_large:
    first_clause: The action completed, but
    retryable: false
  repeated_failure_blocked:
    first_clause: No action was taken.
    retryable: false
golden: services/tool-worker/tool_worker/golden/math_plot_points.yaml
