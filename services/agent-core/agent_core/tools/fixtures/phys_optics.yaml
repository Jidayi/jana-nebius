# Tool fixtures (TOL-05): synthetic, hand-written.
tool: phys_optics
version: 1
valid_args:
- optic: converging_lens
  focal_length: 10
  object_distance: 20
  object_height: 4
  sign_convention: real_is_positive
  sign_convention_source: pack
- task: refraction
  n1: 1
  angle1: 30
  n2: '1.5'
- task: critical_angle
  n1: '1.5'
invalid_args:
- optic: prism
- task: image
  sign_convention: new_cartesian
- n1: one
description_lint:
  sections:
  - what
  - use_when
  - parameters
  - returns
  - limits
  - recovery
  max_chars_full: 600
repairs:
- mistake: arguments sent as a JSON string
  input: '{"text": "x+1"}'
  repaired:
    note: same pattern on this tool's arguments
- mistake: argument names in camelCase
  input:
    Text: x+1
  repaired:
    note: same pattern on this tool's arguments
envelopes:
  unknown_tool:
    first_clause: No action was taken.
    retryable: false
  unavailable:
    first_clause: No action was taken.
    retryable: false
  invalid_args:
    first_clause: No action was taken.
    retryable: true
  truncated_args:
    first_clause: No action was taken.
    retryable: true
  policy_denied:
    first_clause: No action was taken.
    retryable: false
  student_declined:
    first_clause: The action completed, but
    retryable: false
  timeout:
    first_clause: No action was taken.
    retryable: true
  cancelled:
    first_clause: No action was taken.
    retryable: false
  worker_crashed:
    first_clause: No action was taken.
    retryable: true
  worker_unavailable:
    first_clause: No action was taken.
    retryable: false
  limit_exceeded:
    first_clause: No action was taken.
    retryable: false
  domain_error:
    first_clause: No action was taken.
    retryable: false
  execution_error:
    first_clause: No action was taken.
    retryable: false
  result_too_large:
    first_clause: The action completed, but
    retryable: false
  repeated_failure_blocked:
    first_clause: No action was taken.
    retryable: false
golden: services/tool-worker/tool_worker/golden/phys_optics.yaml
