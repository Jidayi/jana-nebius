# Tool fixtures (TOL-05): synthetic, hand-written.
tool: acc_depreciation
version: 1
valid_args:
- method: straight_line
  cost: 12000
  residual: 2000
  life_years: 5
- method: reducing_balance
  cost: 10,000
  rate_percent: 20%
  years: 3
  disposal:
    year: 3
    proceeds: 5000
invalid_args:
- method: sum_of_digits
  cost: 100
- method: straight_line
- method: straight_line
  cost: 100
  life_years: 0
description_lint:
  sections:
  - what
  - use_when
  - parameters
  - returns
  - limits
  - recovery
  max_chars_full: 600
repairs:
- mistake: arguments sent as a JSON string
  input: '{"text": "x+1"}'
  repaired:
    note: same pattern on this tool's arguments
- mistake: argument names in camelCase
  input:
    Text: x+1
  repaired:
    note: same pattern on this tool's arguments
envelopes:
