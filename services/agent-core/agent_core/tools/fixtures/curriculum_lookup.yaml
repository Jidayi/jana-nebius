# Tool fixtures (TOL-05): synthetic, hand-written.
tool: curriculum_lookup
version: 1
valid_args:
- kc_id: kc.phy.o.motion.average_speed
- node_id: cur.phy.o.motion_forces_and_energy
  include: prerequisites
- query: velocity-time graph
  subject: physics
  level: O
invalid_args:
- kc_id: KC.PHY.speed
- node_id: cur.xyz.o.motion
- query: speed
  include: everything
- query: speed
  level: B
description_lint:
  sections:
  - what
  - use_when
  - parameters
  - returns
  - limits
  - recovery
  max_chars_full: 600
repairs:
- mistake: arguments sent as a JSON string
  input: '{"text": "x+1"}'
  repaired:
    note: same pattern on this tool's arguments
- mistake: argument names in camelCase
  input:
    Text: x+1
  repaired:
    note: same pattern on this tool's arguments
