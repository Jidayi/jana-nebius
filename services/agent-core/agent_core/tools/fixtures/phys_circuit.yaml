# Tool fixtures (TOL-05): synthetic, hand-written.
tool: phys_circuit
version: 1
valid_args:
- components:
  - {id: B, kind: cell, emf: 12}
  - {id: R1, kind: resistor, resistance: 6}
  - {id: R2, kind: resistor, resistance: 3}
  - {id: R3, kind: resistor, resistance: 4}
  network:
    series: [B, {parallel: [R1, R2]}, R3]
- components:
  - {id: B, kind: cell, emf: '1.5', internal_resistance: '0.5'}
  - {id: L, kind: lamp, resistance: 1}
  connections:
  - {from: B.pos, to: L.a}
  - {from: L.b, to: B.neg}
invalid_args:
- components: []
- components:
  - {id: B, kind: capacitor}
- components:
  - {id: R1, kind: resistor, resistance: 6}
  network:
    loop: [R1]
description_lint:
  sections:
  - what
  - use_when
  - parameters
  - returns
  - limits
  - recovery
  max_chars_full: 600
repairs:
- mistake: arguments sent as a JSON string
  input: '{"text": "x+1"}'
  repaired:
    note: same pattern on this tool's arguments
- mistake: argument names in camelCase
  input:
    Text: x+1
  repaired:
    note: same pattern on this tool's arguments
envelopes:
  unknown_tool:
    first_clause: No action was taken.
    retryable: false
  unavailable:
    first_clause: No action was taken.
    retryable: false
  invalid_args:
    first_clause: No action was taken.
    retryable: true
  truncated_args:
    first_clause: No action was taken.
    retryable: true
  policy_denied:
    first_clause: No action was taken.
    retryable: false
  student_declined:
    first_clause: The action completed, but
    retryable: false
  timeout:
    first_clause: No action was taken.
    retryable: true
  cancelled:
    first_clause: No action was taken.
    retryable: false
  worker_crashed:
    first_clause: No action was taken.
    retryable: true
  worker_unavailable:
    first_clause: No action was taken.
    retryable: false
  limit_exceeded:
    first_clause: No action was taken.
    retryable: false
  domain_error:
    first_clause: No action was taken.
    retryable: false
  execution_error:
    first_clause: No action was taken.
    retryable: false
  result_too_large:
    first_clause: The action completed, but
    retryable: false
  repeated_failure_blocked:
    first_clause: No action was taken.
    retryable: false
golden: services/tool-worker/tool_worker/golden/phys_circuit.yaml
