# Tool fixtures (TOL-05): synthetic, hand-written.
tool: acc_inventory
version: 1
valid_args:
- method: fifo
  movements:
  - kind: opening
    quantity: 100
    unit_cost: 10
  - kind: issue
    quantity: 40
- method: avco
  avco_basis: periodic
  nrv:
    total: 500
  movements:
  - kind: receipt
    quantity: 10
    unit_cost: '2.50'
invalid_args:
- method: lifo
  movements:
  - kind: receipt
    quantity: 1
    unit_cost: 1
- method: fifo
  movements: []
- method: fifo
  movements:
  - kind: receipt
    quantity: 0
    unit_cost: 1
description_lint:
  sections:
  - what
  - use_when
  - parameters
  - returns
  - limits
  - recovery
  max_chars_full: 600
repairs:
- mistake: arguments sent as a JSON string
  input: '{"text": "x+1"}'
  repaired:
    note: same pattern on this tool's arguments
- mistake: argument names in camelCase
  input:
    Text: x+1
  repaired:
    note: same pattern on this tool's arguments
envelopes:
  unknown_tool:
    first_clause: No action was taken.
    retryable: false
  unavailable:
    first_clause: No action was taken.
    retryable: false
  invalid_args:
    first_clause: No action was taken.
    retryable: true
  truncated_args:
    first_clause: No action was taken.
    retryable: true
  policy_denied:
    first_clause: No action was taken.
    retryable: false
  student_declined:
    first_clause: The action completed, but
    retryable: false
  timeout:
    first_clause: No action was taken.
    retryable: true
  cancelled:
    first_clause: No action was taken.
    retryable: false
  worker_crashed:
    first_clause: No action was taken.
    retryable: true
  worker_unavailable:
    first_clause: No action was taken.
    retryable: false
  limit_exceeded:
    first_clause: No action was taken.
    retryable: false
  domain_error:
    first_clause: No action was taken.
    retryable: false
  execution_error:
    first_clause: No action was taken.
    retryable: false
  result_too_large:
    first_clause: The action completed, but
    retryable: false
  repeated_failure_blocked:
    first_clause: No action was taken.
    retryable: false
golden: services/tool-worker/tool_worker/golden/acc_inventory.yaml
