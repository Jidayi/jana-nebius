# Tool fixtures (TOL-05): synthetic, hand-written.
tool: stats_compute
version: 1
valid_args:
- data:
  - 3
  - 7
  - 8
  - 5
  quartile_method: exclusive
- grouped:
  - lower: 0
    upper: 10
    frequency: 5
  - lower: 10
    upper: 20
    frequency: 8
- events:
    p_a: 1/2
    p_b: 1/3
    relation: independent
invalid_args:
- data: []
- quartile_method: median_of_medians
description_lint:
  sections:
  - what
  - use_when
  - parameters
  - returns
  - limits
  - recovery
  max_chars_full: 600
repairs:
- mistake: arguments sent as a JSON string
  input: '{"text": "x+1"}'
  repaired:
    note: same pattern on this tool's arguments
- mistake: argument names in camelCase
  input:
    Text: x+1
  repaired:
    note: same pattern on this tool's arguments
envelopes:
  unknown_tool:
    first_clause: No action was taken.
    retryable: false
  unavailable:
    first_clause: No action was taken.
    retryable: false
  invalid_args:
    first_clause: No action was taken.
    retryable: true
  truncated_args:
    first_clause: No action was taken.
    retryable: true
  policy_denied:
    first_clause: No action was taken.
    retryable: false
  student_declined:
