# Tool fixtures (TOL-05): synthetic, hand-written.
tool: chem_acid_base
version: 1
valid_args:
- acid: HCl
  acid_concentration: 0.1 mol/dm^3
- task: titration_curve
  acid: HCl
  acid_concentration: 0.100 M
  acid_volume: 25.0 cm^3
  base: NaOH
  base_concentration: 0.100 M
  at_volumes:
  - 25.0 cm^3
invalid_args:
- task: boil
- acid: H2SO4
  basicity: 5
- points: 1000
description_lint:
  sections:
  - what
  - use_when
  - parameters
  - returns
  - limits
  - recovery
  max_chars_full: 600
repairs:
- mistake: arguments sent as a JSON string
  input: '{"text": "x+1"}'
  repaired:
    note: same pattern on this tool's arguments
- mistake: argument names in camelCase
  input:
    Text: x+1
  repaired:
    note: same pattern on this tool's arguments
envelopes:
  unknown_tool:
    first_clause: No action was taken.
    retryable: false
  unavailable:
    first_clause: No action was taken.
    retryable: false
  invalid_args:
