# Tool fixtures (TOL-05): synthetic, hand-written.
tool: math_check_equivalence
version: 1
valid_args:
- a: (x+1)^2
  b: x^2+2x+1
invalid_args:
- a: x
description_lint:
  sections:
  - what
  - use_when
  - parameters
  - returns
  - limits
  - recovery
  max_chars_full: 600
repairs:
- mistake: arguments sent as a JSON string
  input: '{"text": "x+1"}'
  repaired:
    note: same pattern on this tool's arguments
- mistake: argument names in camelCase
  input:
    Text: x+1
  repaired:
    note: same pattern on this tool's arguments
