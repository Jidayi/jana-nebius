# Benign learning notes that must pass the do-not-capture filter (MEM-10): a control set separate from the 300
# candidates, written to sit near the filter's edges. Science, maths and accounting words that look like listed ones
# (cold, temperature, pressure, charge, cell, current, reaction, family of curves, parent function, net, gross, strain,
# relative, trial, electron, selection, possible, faster) and the shapes the filter folds (hyphens, curly apostrophes,
# Greek symbols). Every note is synthetic test data.
physics:
  - Confuses heat and temperature when explaining cold objects
  - Mixes up pressure and force when the area changes
  - Gives the charge on an electron with the wrong sign
  - Treats the current in a series circuit as different in each resistor
  - Adds the internal resistance of the cell to the external resistance correctly
  - Writes the net force as the sum of the magnitudes instead of the vectors
  - Explains why a faster object has more kinetic energy
  - Uses the relative velocity of two cars moving in the same direction
  - Repeats each trial three times and averages the readings
  - Calculates stress and strain from a force-extension graph
  - Reads λ from the wave diagram as the full wavelength
  - Writes Δv/Δt for acceleration but forgets the units
  - Converts 20 °C to kelvin by adding 273
  - Uses ρ = m/V for density with consistent units
  - Draws the parent and daughter nuclei in a decay equation correctly
  - Finds the half-life from a decay curve by reading two points
  - Confuses the electromotive force with the terminal potential difference
  - Sketches the field lines around a bar magnet from north to south
  - Applies Snell’s law but swaps the angles of incidence and refraction
  - Uses Newton’s second law for objects in free fall
  - States the principle of moments before taking moments about the pivot
  - Mixes up the wavelength and the amplitude on a displacement-time graph
  - Gives the frequency in hertz and the period in seconds
  - Explains the cooling of a cup of tea in terms of convection and radiation
  - Uses the specific heat capacity to find the energy needed to warm water
  - Treats latent heat as if the temperature changed during melting
  - Labels the electrons, protons and neutrons in an atom diagram
  - Resolves the weight on a slope into parallel and perpendicular parts
  - Uses the work done equals force times distance moved in the direction of the force
  - Confuses power and energy when comparing two motors
  - Puts the ammeter in parallel instead of in series
  - Finds the total resistance of two resistors in parallel by adding reciprocals
  - Reads the meniscus correctly when measuring the volume of a stone
  - Uses the area under a velocity-time graph for the distance travelled
  - Explains why a ball thrown upward has zero velocity at its highest point
  - Calculates the momentum before and after a collision to check conservation
  - Identifies the selection of the range on a multimeter as a source of error
  - Draws ray diagrams for a converging lens with the image beyond 2F
  - Gives the efficiency as a percentage greater than 100
  - Explains the pressure in a liquid increasing with depth
