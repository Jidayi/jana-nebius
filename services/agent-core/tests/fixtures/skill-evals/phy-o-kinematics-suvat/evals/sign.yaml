# Colocated eval for the contract's suvat example skill (SKL-21 acceptance): the sign misconception, run on the
# local fast tier by skl21_example_eval_passes, on a pack item; the student's line is synthetic.
suite: skill.phy-o-kinematics-suvat
version: 2026-10-13.1
description: A student who takes the acceleration as positive while the key moves upwards gets a negative height;
  the answer is marked incorrect by code and the tutor points at the sign without giving the height.
scenarios:
- id: suvat_sign_up_positive
  title: Gravity taken as positive on the way up
  split: development
  critical: true
  stage: S2
  requirements: [SKL-21, EVL-07]
  tags: [skill_eval, sign, misconception]
  synthetic: true
  setup:
    profile: {level: O, subjects: [physics], age_band: '13_15', misconceptions: [mc.phy.o.accel_sign_up_positive]}
    mode: guided
    question:
      item_ref: phy.o:itm.phy.o.motion.0138
    model: {hardware_class: mid, network: disabled}
    seed: 7
    repeats: 1
  turns:
  - student: -1.8 m
    note: with the acceleration given the same sign as the upward velocity the height comes out negative
    expect:
    - board_step: {owner: student, status: incorrect}
    - no_answer_leak: true
    - turn_status: complete
    - reply: {max_words: 60}
