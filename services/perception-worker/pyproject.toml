[project]
name = "jana-perception-worker"
version = "0.0.0"
license = "Apache-2.0"
license-files = ["licences/*"]
description = "Sandboxed photo cleanup, privacy screening and printed OCR (M21)."
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.5,<3",
    "opencv-python-headless==4.14.0.94",
    "pillow>=12.3,<13",
    "tesserocr>=2.10,<3",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "perception_worker"
module-root = ""

[tool.jana]
layer = "capabilities"
