provenance: Synthetic items and responses written for the marking suite (CUR-14, CUR-15); expected verdicts follow
  the marking rules, not the marker. Not real student work.
items:
  furniture:
    id: itm.acc.o.double_entry.9601
    type: journal_entry
    kc_ids: [kc.acc.o.double_entry.credit_purchases]
    parts:
    - id: a
      prompt: A trader buys office furniture for 3000, paying 1000 from the bank and owing the rest to the supplier.
        Write the journal entry.
      marks: 3
      answer:
        kind: journal_entry
        chart_of_accounts: coa.acc.o.golden_marking.v1
        currency: USD
        lines:
        - {account_id: furniture, account_name: Furniture, accepted_names: [Furniture, Office furniture,
           Furniture and fittings], debit: '3000', credit: '0'}
        - {account_id: bank, account_name: Bank, accepted_names: [Bank, Cash at bank], debit: '0', credit: '1000'}
        - {account_id: trade_payables, account_name: Trade payables, accepted_names: [Trade payables, Creditors,
           Payables], debit: '0', credit: '2000'}
        check_id: chk_build_golden_furniture
      hints: []
  trial_balance:
    id: itm.acc.o.trial_balance.9602
    type: accounting_table
    kc_ids: [kc.acc.o.trial_balance.extraction]
    parts:
    - id: a
      prompt: Prepare the trial balance from the balances given.
      marks: 4
      answer:
        kind: accounting_table
        table_kind: trial_balance
        chart_of_accounts: coa.acc.o.golden_marking.v1
        currency: USD
        rows:
        - {label: Furniture, account_id: furniture, amount: '4000', side: debit}
        - {label: Bank, account_id: bank, amount: '1500', side: debit}
        - {label: Capital, account_id: capital, amount: '5500', side: credit}
        - {label: Totals, amount: '5500', side: total}
        check_id: chk_build_golden_trial_balance
      hints: []
