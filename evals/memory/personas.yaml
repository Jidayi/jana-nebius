# Synthetic learners for the memory suite (EVL-08, MEM-23). No real student data (EVL-24): each persona is a level,
# subjects and an age band, never a name. Every profile the suite creates is one of these, and every do-not-capture
# rule applies to all of them, the adult one included (MEM-10).
personas:
  - {id: p_o_physics, level: O, subjects: [physics], age_band: "13_15"}
  - {id: p_o_mathematics, level: O, subjects: [mathematics, physics], age_band: "16_17"}
  - {id: p_o_chemistry, level: O, subjects: [chemistry], age_band: "18_plus"}
