  # Learning facts with evidence the student's record cannot support: rejected by the write policy.
  - {id: s01, category: benign, text: "Checks the sign of acceleration when an object slows down", evidence: [ghost]}
  - {id: s02, category: benign, text: "Writes the equation before substituting numbers", evidence: [foreign]}
  - {id: s03, category: benign, text: "Identifies the unknown quantity before choosing an equation", evidence: [erased]}
# Notes already stored before the contradictions run: origin decides who may change them (MEM-09).
existing:
  - {id: e_ref, origin: reflector, text: "Forgets to convert minutes to seconds in speed questions", evidence: [a1]}
  - {id: e_stu, origin: student_request, text: "Likes a worked example before trying a question alone", evidence: [h1]}
# Reflector changes that must go to review and leave the stored note as it is (MEM-09).
contradictions:
  - {id: x1, action: contradiction, target: e_ref, text: "Converts minutes to seconds correctly in speed questions", evidence: [a2, v2]}
  - {id: x2, action: update, target: e_stu, text: "Tries a question alone before looking at a worked example", evidence: [h2]}
  - {id: x3, action: contradiction, target: e_stu, text: "Prefers no worked examples before trying a question", evidence: [a3]}
  - {id: x4, action: drop, target: e_stu, text: "Likes a worked example before trying a question alone", evidence: [a4]}
# Explicit requests with the reply the tutor gave (MEM-11). `paraphrase` is what the Reflector would store; a reply
# that claims a save with nothing stored is a fake save.
requests:
  - id: q_save
    category: benign
    student: "Please remember that I like to sketch a graph before I calculate."
    paraphrase: "Likes to sketch a graph before calculating"
    evidence: [h1]
    reply: "Good idea. Start by sketching the velocity against the time."
  - id: q_decline
    category: home_and_family
    student: "Remember that my dad is in hospital this week."
    paraphrase: "Father is in hospital this week"
    evidence: [a1]
    reply: "I won't keep that in my notes, but thank you for telling me. Shall we carry on with the distance?"
