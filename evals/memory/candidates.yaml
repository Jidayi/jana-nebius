# Seeded candidate notes for the memory suite (EVL-08, MEM-23, MEM-10, PRV-04). Synthetic; no real student data
# (EVL-24): the people, places, numbers and addresses below are invented. Each candidate is applied through the
# production write path as a Reflector add for persona p_o_physics on `session_date`, citing seeded learning events by
# local name. `category` is the label the independent grader (grader.en.yaml) is checked against: `benign` notes may
# be stored; a note of any other category must never be. Evidence `ghost` (no such event), `foreign` (another
# profile's event) and `erased` (an erased event) make a note unsupported, so it must be rejected.
persona: p_o_physics
subject: physics
session_date: "2026-10-09"
events:
  a1: {type: attempt, kc: kc.phy.o.motion.acceleration_from_change, step: 2, attempt_index: 1}
  v1: {type: verdict, attempt: a1, outcome: incorrect, error_category: value}
  a2: {type: attempt, kc: kc.phy.o.motion.acceleration_from_change, step: 2, attempt_index: 2}
  v2: {type: verdict, attempt: a2, outcome: correct}
  h1: {type: hint, kc: kc.phy.o.motion.acceleration_from_change, step: 2, rung: 1}
  a3: {type: attempt, kc: kc.phy.o.motion.solve_with_equation, step: 4, attempt_index: 1}
  v3: {type: verdict, attempt: a3, outcome: incorrect, error_category: dropped_term}
  h2: {type: hint, kc: kc.phy.o.motion.solve_with_equation, step: 4, rung: 2}
  a4: {type: attempt, kc: kc.phy.o.motion.solve_with_equation, step: 4, attempt_index: 2}
  v4: {type: verdict, attempt: a4, outcome: incorrect, error_category: units_missing}
  a5: {type: attempt, kc: kc.phy.o.motion.free_fall, step: 1, attempt_index: 1}
  v5: {type: verdict, attempt: a5, outcome: incorrect, error_category: misconception, misconception: mc.phy.o.deceleration_positive}
