# PRV-03 data inventory: every column of the storage contract (agent_core.store.generated.schema), with
# its purpose, its retention row of TABLE DAT-08a and the TABLE DAT-18a data classes it may leave the device
# as ("none": it never leaves). Rows are named by their first cell without backticks or asides.
# Checked both ways by `python -m jana_tools data-inventory` (test: prv03_inventory_covers_schema).
# Owner: Privacy lead. A new column needs an entry here in the same change.

[learner.meta]
singleton = { purpose = "Fixed key that keeps this table to a single row", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
profile_id = { purpose = "Which profile this database file belongs to", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
schema_version = { purpose = "Storage schema version, so migrations know where to start", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
created_at = { purpose = "When this profile database was created", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
created_app_ver = { purpose = "App version that created the database, for migration support", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
last_opened_at = { purpose = "When the database was last opened, for durability checks", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
last_app_ver = { purpose = "App version that last opened the database, to refuse a downgrade", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }

[learner.profile]
profile_id = { purpose = "Random identifier of the student profile", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
display_name = { purpose = "Nickname of up to 40 characters shown on the profile card; no legal name is asked for", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
avatar = { purpose = "Chosen picture token for the profile card", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
age_band = { purpose = "Age band (not a birth date) that selects age-appropriate rules and consent routes", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
level = { purpose = "Exam level (O or A) that selects the syllabus", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Model prompts and replies"] }
subjects = { purpose = "Subjects studied, each with its level and exam month, to pick content", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Model prompts and replies"] }
exam_date = { purpose = "Earliest exam month or day, used to pace the study plan", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
reading_level = { purpose = "Reading support level the tutor writes for", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
locale = { purpose = "Interface and tutoring language code", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
support_level = { purpose = "Whether the student asked for extra learning support", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
goals = { purpose = "Learning goals the student set for themselves", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
student_settings = { purpose = "Cached copy of the student's own preferences for the learner-model snapshot", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
created_at = { purpose = "When the profile was created", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
updated_at = { purpose = "When the profile was last changed", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }

[learner.settings]
key = { purpose = "Name of a preference or of the adult answer policy", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
value = { purpose = "Effective value of that setting", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
source = { purpose = "Who set the value (default, student, adult or an adult student), for precedence", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
set_by_event_id = { purpose = "Event that recorded the winning change", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
hlc = { purpose = "Logical clock stamp of the winning write, to resolve conflicts between devices", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
updated_at = { purpose = "When the effective value last changed", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }

[learner.consents]
paused_at = { purpose = "When a consent was paused; null while enabled", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
consent_id = { purpose = "Identifier of one consent grant", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
scope = { purpose = "Which feature or use the consent covers", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
granted_by_role = { purpose = "Whether a guardian or the adult student granted it", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
granted_by_label = { purpose = "Short relationship label of the grantor (for example 'Mother'), never a school", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
basis_ref = { purpose = "Reference to the adult PIN attestation or account check behind the grant", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
notice_version = { purpose = "Privacy notice version shown when consent was given", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
dpia_ref = { purpose = "Impact assessment that covers this scope", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
method = { purpose = "How the grantor was verified", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
granted_at = { purpose = "When consent was given", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
expires_at = { purpose = "When the consent lapses, if it does", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
withdrawn_at = { purpose = "When consent was withdrawn, so processing stops", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }
withdrawn_by_role = { purpose = "Who withdrew the consent", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file"] }

[learner.events]
seq = { purpose = "Local position of the event in this file's log", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments"] }
event_id = { purpose = "Unique id of the learning event, to de-duplicate on merge", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments"] }
profile_id = { purpose = "Profile that the event belongs to", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments"] }
device_id = { purpose = "Random installation id of the device that recorded the event, for merge order", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments"] }
origin_seq = { purpose = "Position of the event on the device that recorded it", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments"] }
hlc = { purpose = "Logical clock stamp that orders events across the student's devices", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments"] }
type = { purpose = "Kind of learning event (attempt, hint, setting change and so on)", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments", "De-identified research data"] }
schema_version = { purpose = "Version of the event's payload shape", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments", "De-identified research data"] }
source = { purpose = "Which component recorded the event", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments", "De-identified research data"] }
sync_class = { purpose = "Whether the event may be shared with the student's other devices or stays local", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments"] }
occurred_at = { purpose = "When the event happened on the device clock", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments", "De-identified research data"] }
recorded_at = { purpose = "When the event was written", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments"] }
session_id = { purpose = "Tutoring session the event belongs to, if any", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments"] }
turn_id = { purpose = "Conversation turn the event belongs to, if any", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments"] }
kc_ids = { purpose = "Knowledge components the event is evidence about", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments", "De-identified research data"] }
payload = { purpose = "Structured details of the event; no free text", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments", "De-identified research data"] }
erased_at = { purpose = "When the payload was erased on request", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot", "Profile archive and support file", "Event-log segments"] }

[learner.projection_state]
name = { purpose = "Which derived table this bookkeeping row describes", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot"] }
code_version = { purpose = "Version of the code that builds the derived table", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot"] }
params_hash = { purpose = "Hash of the signed mastery parameters used, to detect a needed rebuild", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot"] }
last_seq = { purpose = "Last event folded into the derived table", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot"] }
last_hlc = { purpose = "Clock stamp of the last event folded in", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot"] }
last_device_id = { purpose = "Recording device of the last event folded in", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot"] }
last_origin_seq = { purpose = "Origin position of the last event folded in", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot"] }
rebuilt_at = { purpose = "When the derived table was last rebuilt", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot"] }
checksum = { purpose = "Hash over the derived rows, to prove a rebuild gives the same result", retention = "events, projections, consents, meta, profile, settings, projection_state, sessions", egress = ["Whole-profile snapshot"] }

[learner.assessment_runs]
assessment_id = { purpose = "Identifier of a diagnostic or mastery check run", retention = "assessment_runs", egress = ["Whole-profile snapshot"] }
kind = { purpose = "Whether the run is a diagnostic or a mastery check", retention = "assessment_runs", egress = ["Whole-profile snapshot"] }
state = { purpose = "Where the run is in its lifecycle, so it can resume", retention = "assessment_runs", egress = ["Whole-profile snapshot"] }
body = { purpose = "Run state: questions chosen and references to answers", retention = "assessment_runs", egress = ["Whole-profile snapshot"] }
updated_at = { purpose = "Last activity, used for expiry", retention = "assessment_runs", egress = ["Whole-profile snapshot"] }

