# Colocated skill evals (SKL-21). Synthetic questions and student lines written for this repository.
suite: skill.agent-plan-solution
version: 2026-10-13.1
description: 'Colocated evals for agent-plan-solution (SKL-21, EVL-07): on five short questions the Solver computes
  every value with a tool before the plan is taught; the student is never shown the plan''s values. Tool calls are
  checked across the session.'
scenarios:
- id: plan_acceleration
  title: the Solver computes every value with a tool before the plan is taught (acceleration)
  split: development
  critical: true
  stage: S2
  requirements:
  - SKL-21
  - EVL-07
  tags:
  - skill_eval
  - session_tools
  synthetic: true
  setup:
    profile:
      level: O
      subjects:
      - physics
      age_band: '13_15'
    mode: guided
    question:
      text: A car speeds up steadily from 4 m/s to 22 m/s in 6 s. Find its acceleration.
    model:
      hardware_class: mid
      network: disabled
    seed: 21
    repeats: 1
  turns:
  - student: I'm not sure where to start.
    expect:
    - tool_call:
        name: math_solve
        role: solver
    - no_answer_leak: true
    - turn_status: complete
