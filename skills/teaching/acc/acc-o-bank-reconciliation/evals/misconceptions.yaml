      level: O
      subjects:
      - accounting
      age_band: '13_15'
      misconceptions:
      - mc.acc.o.br_bank_error_assumed
    mode: guided
    question:
      item_ref: acc.o:itm.acc.o.bank_reconciliation.0001
    model:
      hardware_class: mid
      network: disabled
    seed: 1
    repeats: 1
  turns:
  - student: A
    note: the option this wrong idea leads to
    expect:
    - board_step:
        owner: student
        status: incorrect
    - learner:
        kc_id: kc.acc.o.bank_reconciliation.timing_differences
        misconception: mc.acc.o.br_bank_error_assumed
