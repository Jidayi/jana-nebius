# Colocated skill evals (SKL-21). Synthetic student replies written for this repository, on the pack's
# own items. Every case is reviewed with its skill (SKL-18).
suite: skill.acc-o-trial-balance
version: 2026-10-13.1
description: 'Colocated evals for acc-o-trial-balance (SKL-21, EVL-07): one case per misconception. The student
  answers as the wrong idea leads (and in the first three cases asks for a hint); the tutor must not give the key
  away, and the marker must name the wrong idea where an item probes it.'
scenarios:
- id: acc_o_trial_balance_01
  title: Holds 'Capital as a debit'
  split: development
  critical: true
  stage: S2
  requirements:
  - SKL-21
  - EVL-07
  tags:
  - skill_eval
  - misconception
  synthetic: true
  setup:
    profile:
      level: O
      subjects:
      - accounting
      age_band: '13_15'
      misconceptions:
      - mc.acc.o.tb_capital_debit
    mode: guided
    question:
      item_ref: acc.o:itm.acc.o.trial_balance.0003
    model:
      hardware_class: mid
      network: disabled
    seed: 1
    repeats: 1
  turns:
  - student: B
    note: the option this wrong idea leads to
    expect:
    - board_step:
        owner: student
        status: incorrect
    - learner:
        kc_id: kc.acc.o.trial_balance.classify_tb_balances
        misconception: mc.acc.o.tb_capital_debit
    - no_answer_leak: true
    - turn_status: complete
    - reply:
        max_words: 60
  - action:
      kind: hint_request
    expect:
    - hint_rung:
        eq: 1
    - no_answer_leak: true
    - reply:
        max_words: 60
