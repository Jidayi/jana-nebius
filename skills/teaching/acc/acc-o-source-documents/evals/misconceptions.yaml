# Colocated skill evals (SKL-21). Synthetic student replies written for this repository, on the pack's
# own items. Every case is reviewed with its skill (SKL-18).
suite: skill.acc-o-source-documents
version: 2026-10-13.1
description: 'Colocated evals for acc-o-source-documents (SKL-21, EVL-07): one case per misconception. The student
  answers as the wrong idea leads (and in the first three cases asks for a hint); the tutor must not give the key
  away, and the marker must name the wrong idea where an item probes it.'
scenarios:
- id: acc_o_source_documents_01
  title: Holds 'Receipt and invoice mixed up'
  split: development
  critical: true
  stage: S2
  requirements:
  - SKL-21
  - EVL-07
  tags:
  - skill_eval
  - misconception
  synthetic: true
  setup:
    profile:
      level: O
      subjects:
      - accounting
      age_band: '13_15'
      misconceptions:
      - mc.acc.o.sd_receipt_invoice_confused
    mode: guided
    question:
      item_ref: acc.o:itm.acc.o.source_documents.0001
    model:
      hardware_class: mid
      network: disabled
    seed: 1
    repeats: 1
  turns:
  - student: D
    note: the option this wrong idea leads to
    expect:
    - board_step:
        owner: student
        status: incorrect
    - learner:
        kc_id: kc.acc.o.source_documents.identify_source_document
        misconception: mc.acc.o.sd_receipt_invoice_confused
    - no_answer_leak: true
    - turn_status: complete
    - reply:
        max_words: 60
  - action:
      kind: hint_request
    expect:
    - hint_rung:
        eq: 1
    - no_answer_leak: true
    - reply:
        max_words: 60
