# Colocated skill evals (SKL-21). Synthetic student replies written for this repository, on the pack's
# own items. Every case is reviewed with its skill (SKL-18).
suite: skill.chm-o-acids
version: 2026-10-13.1
description: 'Colocated evals for chm-o-acids (SKL-21, EVL-07): one case per misconception. The student answers
  as the wrong idea leads (and in the first three cases asks for a hint); the tutor must not give the key away,
  and the marker must name the wrong idea where an item probes it.'
scenarios:
- id: chm_o_acids_01
  title: Holds 'Metals and acids make water'
  split: development
  critical: true
  stage: S2
  requirements:
  - SKL-21
  - EVL-07
  tags:
  - skill_eval
  - misconception
  synthetic: true
  setup:
    profile:
      level: O
      subjects:
      - chemistry
      age_band: '13_15'
      misconceptions:
      - mc.chm.o.acids_metal_gives_water
    mode: guided
    question:
      item_ref: chm.o:itm.chm.o.acids.0001
    model:
      hardware_class: mid
      network: disabled
    seed: 1
    repeats: 1
  turns:
  - student: B
    note: the option this wrong idea leads to
    expect:
    - board_step:
        owner: student
        status: incorrect
    - learner:
        kc_id: kc.chm.o.acids.reactions_of_acids
        misconception: mc.chm.o.acids_metal_gives_water
    - no_answer_leak: true
    - turn_status: complete
    - reply:
        max_words: 60
  - action:
      kind: hint_request
    expect:
    - hint_rung:
        eq: 1
    - no_answer_leak: true
    - reply:
        max_words: 60
