# Colocated skill evals (SKL-21). Synthetic student replies written for this repository, on the pack's
# own items. Every case is reviewed with its skill (SKL-18).
suite: skill.mth-o-calculus
version: 2026-10-13.1
description: 'Colocated evals for mth-o-calculus (SKL-21, EVL-07): one case per misconception. The student answers
  as the wrong idea leads (and in the first three cases asks for a hint); the tutor must not give the key away,
  and the marker must name the wrong idea where an item probes it.'
scenarios:
- id: mth_o_calculus_01
  title: Holds 'Reducing the power without multiplying'
  split: development
  critical: true
  stage: S2
  requirements:
  - SKL-21
  - EVL-07
  tags:
  - skill_eval
  - misconception
  synthetic: true
  setup:
    profile:
      level: O
      subjects:
      - mathematics
      age_band: '13_15'
      misconceptions:
      - mc.mth.o.derivative_power_not_brought_down
    mode: guided
    question:
      item_ref: mth.o:itm.mth.o.calculus.0011
    model:
      hardware_class: mid
      network: disabled
    seed: 1
    repeats: 1
  turns:
  - student: A
    note: the option this wrong idea leads to
    expect:
    - board_step:
        owner: student
        status: incorrect
    - learner:
        kc_id: kc.mth.o.calculus.differentiate_powers
        misconception: mc.mth.o.derivative_power_not_brought_down
    - no_answer_leak: true
    - turn_status: complete
    - reply:
        max_words: 60
  - action:
      kind: hint_request
    expect:
    - hint_rung:
        eq: 1
    - no_answer_leak: true
    - reply:
        max_words: 60
