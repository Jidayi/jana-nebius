      level: O
      subjects:
      - mathematics
      age_band: '13_15'
      misconceptions:
      - mc.mth.o.pythag_add_for_leg
    mode: guided
    question:
      item_ref: mth.o:itm.mth.o.trigonometry.0012
    model:
      hardware_class: mid
      network: disabled
    seed: 1
    repeats: 1
  turns:
  - student: B
    note: the option this wrong idea leads to
    expect:
    - board_step:
        owner: student
        status: incorrect
    - learner:
        kc_id: kc.mth.o.trigonometry.pythagoras
        misconception: mc.mth.o.pythag_add_for_leg
