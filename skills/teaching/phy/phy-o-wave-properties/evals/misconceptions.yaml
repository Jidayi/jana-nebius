      level: O
      subjects:
      - physics
      age_band: '13_15'
      misconceptions:
      - mc.phy.o.amplitude_peak_to_trough
    mode: guided
    question:
      item_ref: phy.o:itm.phy.o.wave_properties.0004
    model:
      hardware_class: mid
      network: disabled
    seed: 1
    repeats: 1
  turns:
  - student: 25 cm
    note: a wrong value; no item tags a distractor with this wrong idea yet
    expect:
    - board_step:
        owner: student
        status: incorrect
    - no_answer_leak: true
    - turn_status: complete
    - reply:
        max_words: 60
  - action:
      kind: hint_request
    expect:
    - hint_rung:
        eq: 1
    - no_answer_leak: true
    - reply:
        max_words: 60
