      level: O
      subjects:
      - physics
      age_band: '13_15'
      misconceptions:
      - mc.phy.o.weight_given_as_mass_number
    mode: guided
    question:
      item_ref: phy.o:itm.phy.o.mass_weight.0011
    model:
      hardware_class: mid
      network: disabled
    seed: 1
    repeats: 1
  turns:
  - student: B
    note: the option this wrong idea leads to
    expect:
    - board_step:
        owner: student
        status: incorrect
    - learner:
        kc_id: kc.phy.o.mass_weight.weight_from_mass
        misconception: mc.phy.o.weight_given_as_mass_number
