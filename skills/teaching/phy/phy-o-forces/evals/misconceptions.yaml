      level: O
      subjects:
      - physics
      age_band: '13_15'
      misconceptions:
      - mc.phy.o.balanced_means_at_rest
    mode: guided
    question:
      item_ref: phy.o:itm.phy.o.forces.0009
    model:
      hardware_class: mid
      network: disabled
    seed: 1
    repeats: 1
  turns:
  - student: D
    note: the option this wrong idea leads to
    expect:
    - board_step:
        owner: student
        status: incorrect
    - learner:
        kc_id: kc.phy.o.forces.resultant_force
        misconception: mc.phy.o.balanced_means_at_rest
