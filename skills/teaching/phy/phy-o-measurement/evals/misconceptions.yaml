# Colocated skill evals (SKL-21). Synthetic student replies written for this repository, on the pack's
# own items. Every case is reviewed with its skill (SKL-18).
suite: skill.phy-o-measurement
version: 2026-10-13.1
description: 'Colocated evals for phy-o-measurement (SKL-21, EVL-07): one case per misconception. The student answers
  as the wrong idea leads (and in the first three cases asks for a hint); the tutor must not give the key away,
  and the marker must name the wrong idea where an item probes it.'
scenarios:
- id: phy_o_measurement_01
  title: Holds 'Multiplying when the number should get smaller'
  split: development
  critical: true
  stage: S2
  requirements:
  - SKL-21
  - EVL-07
  tags:
  - skill_eval
  - misconception
  synthetic: true
  setup:
    profile:
      level: O
      subjects:
      - physics
      age_band: '13_15'
      misconceptions:
      - mc.phy.o.prefix_multiply_divide_swapped
    mode: guided
    question:
      item_ref: phy.o:itm.phy.o.measurement.0011
    model:
      hardware_class: mid
      network: disabled
    seed: 1
    repeats: 1
  turns:
  - student: A
    note: the option this wrong idea leads to
    expect:
    - board_step:
        owner: student
        status: incorrect
    - learner:
        kc_id: kc.phy.o.measurement.si_prefixes
        misconception: mc.phy.o.prefix_multiply_divide_swapped
    - no_answer_leak: true
    - turn_status: complete
    - reply:
        max_words: 60
  - action:
      kind: hint_request
    expect:
    - hint_rung:
        eq: 1
    - no_answer_leak: true
    - reply:
        max_words: 60
