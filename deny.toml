# cargo-deny policy (SEC-22, SEC-23) for the Rust workspace.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [] # exceptions need a dated entry in scripts/governance/vulnerability-exceptions.toml

[licenses]
version = 2
allow = [
  "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause", "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
# Our own unpublished crates (publish = false): Apache-2.0 (decision D22).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
